<!doctype html>
<!-- @trace order:1861-nmpp, order:2108-dptd — GrapesJS core editor, served from the vendored copy; no CDN. -->
<html>
<head>
<meta charset="utf-8">
<title>Web studio</title>
<link rel="stylesheet" href="/vendor/dist/css/grapes.min.css">
<link rel="stylesheet" href="/vendor/font-awesome/css/font-awesome.min.css">
<style>
html, body { margin: 0; height: 100%; } #gjs { height: 100vh; }
#studio-banner { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; padding: 6px 10px;
  font: 13px system-ui, sans-serif; background: #7a2e00; color: #fff; }
</style>
<script src="/vendor/dist/grapes.min.js"></script>
<script src="/studio-page.js"></script>
</head>
<body>
<div id="gjs"></div>
<script>
(async () => {
  const loaded = await (await fetch("/load")).json();
  const banner = (text) => {
    const el = document.createElement("div");
    el.id = "studio-banner";
    el.textContent = text;
    document.body.appendChild(el);
  };
  // 2108-dptd: no page at the resolved root means nothing to edit; saving
  // would invent one, so the studio stays read-only.
  const readOnly = !loaded.exists;
  // 2108-dptd: render the page as it looks, through GrapesJS's own canvas
  // options (its <head> is a component that re-renders, so anything injected
  // into it is wiped): the head's inline <style> as canvasCss and its local
  // stylesheets as canvas.styles. The server serves the document root at "/"
  // too (read-only), so relative and root-absolute asset URLs resolve. None of
  // this enters the editor's components or CSS, so none of it is saved.
  const look = StudioPage.canvasLook(loaded.doc, "/");
  const editor = grapesjs.init({
    container: "#gjs",
    fromElement: false,
    // The vendored icon font, never cdnjs (the enclave cannot reach it).
    cssIcons: "/vendor/font-awesome/css/font-awesome.min.css",
    protectedCss: "",
    canvasCss: look.styles.join("\n"),
    canvas: { styles: look.links },
    components: loaded.html || "",
    storageManager: { type: "studio", autoload: false, autosave: false },
    plugins: [
      (ed) =>
        ed.Storage.add("studio", {
          async load() {
            return {};
          },
          // Every write goes through the studio front, one path per POST; the
          // front guards each path and commits it (1860-auhm), never on the
          // project's default branch (2108-dptd).
          async store() {
            if (readOnly) return;
            const css = ed.getCss();
            const cssChanged = css !== cssAtLoad;
            const files = [[loaded.page, StudioPage.rebuild(loaded.doc, ed.getHtml(), cssChanged ? cssHref : null)]];
            if (cssChanged) files.push([cssPath, css.endsWith("\n") ? css : css + "\n"]);
            for (const [path, content] of files) {
              const res = await fetch("/__studio/save", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ path, content }),
              });
              if (!res.ok) throw new Error("save " + path + " failed: " + res.status);
            }
          },
        }),
    ],
  });
  window.studioEditor = editor;
  const cssPath = (loaded.root === "." ? "" : loaded.root + "/") + "studio.css";
  const cssHref = "studio.css";
  let cssAtLoad = "";
  editor.onReady(() => { cssAtLoad = editor.getCss(); });
  // 2108-dptd: the <body> tag's classes and attributes on the canvas body,
  // display only (idempotent; the wrapper may re-render, so re-applied on
  // every body load). The saved page keeps its own <body> tag.
  const dressBody = (frameDoc) => {
    if (!frameDoc || !frameDoc.body) return;
    for (const [k, v] of Object.entries(look.attrs)) {
      if (k === "class") v.split(/s+/).filter(Boolean).forEach((c) => frameDoc.body.classList.add(c));
      else if (!/^(on|id$)/i.test(k)) frameDoc.body.setAttribute(k, v);
    }
  };
  editor.on("canvas:frame:load:body", ({ window: w }) => dressBody(w && w.document));
  editor.onReady(() => dressBody(editor.Canvas.getDocument()));
  if (readOnly) {
    banner("Read-only: no page at " + (loaded.page || "index.html") + " (document root from " + loaded.root_from + "). Nothing you do here is saved.");
  }
  // Save on every change (debounced) through the editor's own storage. The
  // built-in autosave counts changes it tracked itself, and with autoload off
  // a change can go uncounted (measured: dirty count 0 after an edit).
  let pending;
  editor.on("update component:add component:remove component:update component:styleUpdate", () => {
    if (readOnly) return;
    document.documentElement.setAttribute("data-studio-save", "scheduled");
    clearTimeout(pending);
    pending = setTimeout(() => editor.store(), 300);
  });
  // Fixture hook (scripts/lua/test-studio-grapesjs.lua): one real edit, saved
  // by the editor's own autosave, proves the browser path end to end.
  if (location.hash === "#selftest") {
    const mark = (k, v) => document.documentElement.setAttribute("data-selftest-" + k, String(v));
    editor.on("storage:start:store", () => mark("store", "started"));
    editor.on("storage:end:store", () => mark("store", "done"));
    editor.on("storage:error", (e) => mark("error", e && e.message ? e.message : e));
    editor.onReady(() => {
      editor.addComponents("<p>studio-selftest</p>");
      mark("dirty", editor.getDirtyCount());
    });
  }
})();
</script>
</body>
</html>
