# tillandsias-builder nix configuration (873-b1nx prototype).
# The enclave cache is the FIRST substituter; upstream stays available so a
# cold pin family degrades to slow, never to broken (degrade-to-cold rule).
# ssl-cert-file is a SETTING on purpose: Fedora's nix ignores the env vars
# (measured 2026-08-25); the CA bundle is mounted read-only at runtime.
experimental-features = nix-command flakes
substituters = https://nix-cache:5000 https://cache.nixos.org
trusted-public-keys = tillandsias-nix-cache-1:tMu1zOSg0L2lYoPFCuSCQXypSg4s6Zl69c8IUDe0WV8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
ssl-cert-file = /run/tillandsias/ca-bundle.crt
build-users-group =
