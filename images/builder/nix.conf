# tillandsias-builder nix configuration (873-b1nx, re-cut for the per-host
# cache 2026-08-28).
# The per-host cache endpoint and its public key are INJECTED AT RUNTIME by
# scripts/with-nix-builder.sh from nix-cache-service.sh substituter-args —
# never baked here: a baked key/endpoint is host-specific state in a shared
# image (the pre-reconciliation file shipped one host's key to every host).
# Upstream stays available so a cold cache degrades to slow, never to broken.
# ssl-cert-file is a SETTING on purpose: Fedora's nix ignores the env vars
# (measured 2026-08-25); with-nix-builder.sh mounts a CA bundle read-only at
# this exact path on every run (cache bundle when the cache answers, host
# system bundle otherwise).
experimental-features = nix-command flakes
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
ssl-cert-file = /run/tillandsias/ca-bundle.crt
build-users-group =
