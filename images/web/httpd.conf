# @trace order:2007-hear
# busybox httpd extra MIME types. Its built-in table has no audio types, so a
# candidate .flac was served with a generic type and a browser's <audio>
# element could refuse it. One `.ext:type` per line.
.flac:audio/flac
.mp3:audio/mpeg
.opus:audio/ogg
.ogg:audio/ogg
.oga:audio/ogg
.wav:audio/wav
.m4a:audio/mp4
.webm:video/webm
.json:application/json
