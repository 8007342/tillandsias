methodology:
  version: v0.6
  authority:
    source_of_truth: methodology.yaml
    rule: >
      This file is the authoritative methodology entry point. If another project
      instruction conflicts with it, follow this file and report methodology drift.
    non_authoritative_files:
      CLAUDE.md: "May summarize local tool notes; must not redefine methodology."

  bootstrap:
    command: "/skills bootstrap"
    first_step: "Read plan.yaml, plan/index.yaml (or via project-plan / forge-plan MCP server), and methodology/bootstrap/router.yaml."
    expert_mcp_servers: "project-plan (forge-plan) and project-info MCP servers provide sub-100ms structured, cited answers for plan packets, methodology rules, and repo files."
    active_release: "Declared in plan/loop_status.md under '## ACTIVE RELEASE'."
    selection_rule: "Choose exactly one intent from bootstrap_router.intent_options. The intent defines your required reading set."
    receipt_required_before_source_edits: true
    autonomous_loop: "After bootstrap, iterate via methodology/bootstrap/router.yaml and methodology/convergence.yaml until the selected residual obligation stops decreasing or the spec itself needs refinement."

  entrypoints:
    task_router: methodology/bootstrap/router.yaml
    component_catalog: methodology/catalog.yaml
    agent_observability: methodology/agent-observability.yaml
    forge_diagnostics: methodology/forge-diagnostics.yaml
    multi_host_development: methodology/multi-host-development.yaml
    distributed_work: methodology/distributed-work.yaml
    versioning: methodology/versioning.yaml
    release_runbook: docs/RELEASING.md
    markdown_distillation: methodology/markdown-distillation.yaml
    plan_root: plan.yaml
    plan_index: plan/index.yaml
    plan_step_notes: plan/steps/README.md
    plan_issues_root: plan/issues
    unknown_event_register: methodology/event/index.yaml
    shared_skills_root: skills/

  shared_skills:
    # Top-level ./skills/ is the canonical, agent-agnostic source of truth.
    # Each per-runtime `.<agent>/skills/<name>` is a symlink to the canonical
    # so there is exactly one file to read + edit. Orchestrators can edit
    # the canonical between iterations to steer remote agent work; every
    # subsequent invocation reads the latest committed version.
    canonical_root: skills/
    symlinked_into:
      - .claude/skills/
      - .opencode/skills/
      - .codex/skills/
      - .gemini/skills/
      - .github/skills/
    registered:
      advance-work-from-plan:
        path: skills/advance-work-from-plan/SKILL.md
        tier: worker   # see methodology/distributed-work.yaml agent_execution_roles
        complement_of: skills/meta-orchestration
        authoritative_spec: methodology/distributed-work.yaml worker_agent_protocol
        purpose: >
          Discover, claim, implement, checkpoint, and complete units of
          work from the shared plan ledger based on host capabilities and
          lease rules. The Worker tier of the two-tier execution model
          documented in methodology/distributed-work.yaml — sustains
          development velocity and enforces finite-time convergence by
          letting any agent on any host autonomously cycle one shaped
          packet from plan/ to completion or yield. Replaces the per-cycle
          long-form work prompt.
        cadence: "~30 min in active sessions; on-demand otherwise"
        host_awareness: detects linux/macOS/Windows → active branch + write scope
        steerable: true   # orchestrator may edit between iterations
      meta-orchestration:
        path: skills/meta-orchestration/SKILL.md
        tier: orchestrator
        purpose: >
          Host-aware recurring loop for `./repeat --prompt "Use the
          /meta-orchestration skill"`: sync remote state, drain
          /advance-work-from-plan, run eligible local-build and curl-install
          e2e gates, coordinate integrations on mutable Linux, release when
          warranted, and push every durable result before exit.
        cadence: "45m repeat loop or on-demand"
        host_awareness: detects immutable Linux, mutable Linux, macOS, and Windows
        steerable: true
      coordinate-multihost-work:
        path: skills/coordinate-multihost-work/SKILL.md
        tier: orchestrator
        purpose: >
          Canonical mutable-Linux multi-host coordination pass. The
          multihost-orchestration skill name is a compatibility alias.
        steerable: true
      multihost-orchestration:
        alias_of: coordinate-multihost-work
      merge-to-main-and-release:
        path: skills/merge-to-main-and-release/SKILL.md
        tier: orchestrator
        authoritative_spec:
          - docs/RELEASING.md
          - methodology/versioning.yaml
        purpose: >
          Open or update the linux-next-to-main PR, bump VERSION on main only,
          tag the release, and dispatch the workflow_dispatch release.
        steerable: true
      forge-continuous-enhancement:
        path: skills/forge-continuous-enhancement/SKILL.md
        tier: worker
        purpose: >
          Iteratively improve the forge itself from within the tillandsias codebase,
          capitalizing on the safe YOLO-mode environment to run diagnostics,
          commit improvements, and push changes autonomously.
        steerable: true
      forge-quick-intro:
        path: skills/forge-quick-intro/SKILL.md
        tier: worker
        purpose: >
          Instantly bootstrap an agent's context to the forge's capabilities (compilers,
          browsers, tools) using minimal tokens, preventing them from manually exploring
          the filesystem to find pre-installed binaries.
        steerable: true
      smoke-curl-install-and-test-e2e:
        path: skills/smoke-curl-install-and-test-e2e/SKILL.md
        tier: worker
        purpose: >
          Host-aware clean-room acceptance gate for a PUBLISHED release:
          curl-install the latest release artifact, destroy the host runtime
          substrate, re-provision from pristine state, and file every issue
          observed as plan/issues work packets for /advance-work-from-plan pickup.
        destructive: true
        destructive_reset_policy: >
          Podman reset is an expected precondition on Tillandsias smoke hosts.
          Do not stop for confirmation when TILLANDSIAS_DESTRUCTIVE_RESET_OK is
          unset or 1; only skip/block if it is explicitly 0.
        steerable: true
      build-install-and-smoke-test-e2e:
        path: skills/build-install-and-smoke-test-e2e/SKILL.md
        tier: worker
        purpose: >
          Host-aware local-build acceptance gate for mutable Linux, macOS, and
          Windows: build and install the current checkout, destroy the native
          substrate, re-provision from pristine state, and file failures as
          ready plan/issues packets. Immutable Linux uses the curl-install e2e
          skill instead.
        destructive: true
        destructive_reset_policy: >
          Explicit invocation authorizes the Podman/VM/WSL reset. Podman reset
          is an expected precondition on Tillandsias smoke hosts; do not
          reconfirm unless TILLANDSIAS_DESTRUCTIVE_RESET_OK=0.
        steerable: true

  invariant_summary:
    - specs_define_intent
    - ux_changes_require_explicit_tlatoani_approval_and_are_curated_for_end_users_only
    - cheatsheets_compress_provenance_backed_knowledge
    - cheatsheets_are_ground_truth_and_enforced_by_local_experts
    - code_cites_specs_and_relevant_cheatsheets
    - plan_is_queried_via_mcp_server_avoiding_heuristic_parsing
    - traces_and_litmus_tests_provide_falsifiable_evidence
    - evidence_bundles_bound_convergence_claims
    - unknown_events_capture_surprises_before_distillation
    - centicolons_report_residual_obligations_not_proof
    - releases_require_validated_centicolon_projection_artifacts
    - methodology_refinements_do_not_push_directly_to_main
    - plan_updates_are_idempotent_and_cold_start_friendly
    - agents_assume_next_step_may_be_claimed_by_a_different_agent
    - remote_checkpoints_are_durable_and_local_state_is_ephemeral
    - platform_branches_pull_and_merge_from_durable_remote_before_checkpoints
    - forge_improvements_preserve_privacy_and_isolation_boundaries
    - ad_hoc_markdown_is_intake_not_authority
    - monotonic_reduction_of_uncertainty_through_verifiable_constraints
    - forge_is_safe_environment_with_permissive_yolo_mode_by_default
    - forge_continuous_enhancement_via_self_hosting_agents
    - forge_discoverability_via_baked_in_tellme_and_launch_trained_local_inference

  runtime_language_policy:
    tlatoani_hard_no_python:
      rule: >
        Python is not allowed for Tillandsias runtime, harness, or repository
        scripts. One-off interactive use is still discouraged and must not be
        copied into committed scripts, skills, litmus tests, or runbooks.
      approved_default_languages:
        - Rust
        - POSIX shell only when it dispatches existing binaries or Rust tools
        - PowerShell only for Windows host integration
      exception_process: >
        Anything else requires explicit approval from The Tlatoani before it is
        committed or used by recurring automation.
      checker: scripts/check-no-python-scripts.sh

    base64_script_injection_ban:
      severity: CRITICAL_VIOLATION
      rule: >
        Embedding scripts of ANY language (Python, Perl, Ruby, Lua, …) inside
        base64-encoded string literals — whether in Rust source, YAML, shell, or
        any other file — is unconditionally forbidden. This technique was used in
        2026-07-01 to smuggle Python past the tlatoani_hard_no_python policy and
        is treated as a deliberate act of circumvention, not a workaround.
      corollary: >
        Base64 is a data-encoding format. Its presence in source code as a
        mechanism to generate and execute a script at runtime is indistinguishable
        in effect from committing that script directly — and worse in intent, because
        the encoding makes the content non-obvious to reviewers on other hosts.
      correct_response_when_blocked: >
        If a required fix cannot be implemented in an approved language without
        breaking a policy, the agent MUST surface the constraint explicitly, file a
        coordination issue, and leave the code in the broken-but-honest state.
        A broken flow that fails loudly is always preferable to a working flow that
        hides a policy violation.
      incident_reference: plan/issues/violation-python-base64-injection-2026-07-01.md
      checker: scripts/check-no-base64-script-injection.sh
      reintroduction_note: >
        Reintroduced on windows-next (0c4a6aa3, a bash podman shim in
        pty/mod.rs) and removed again 2026-07-02 during the windows->linux
        integration; the shim was also redundant since Phase 3d
        (vault_bootstrap::ensure_vault_selinux_module loads vault_container.cil).
        The checker above now fails loud on the decode-to-executable idiom.

  semantic_distillation:
    rule: >
      Root files stay terse. Detailed rationale belongs in the owning component
      listed in methodology/catalog.yaml. Ad hoc Markdown intake is inventoried
      and archived through methodology/markdown-distillation.yaml.

  cooperative_work_discipline:
    rule: >
      Instead of using heavy tools like JIRA, we treat project management as code.
      Issues, tasks, and specifications are managed via Git history, Markdown (.md), and YAML (.yaml) files in the ./plan directory.
      Agents must self-improve by logging inefficiencies (e.g., repeated steps, invalidated caches due to uncoordinated build scripts) directly into plan/issues/ as actionable items.
    issue_filing_mandate:
      authority: "operator directive, 2026-07-18"
      rule: >
        EVERY issue, bug, gap, regression, flaky/failing test, false signal, or
        broken invariant an agent OBSERVES during ANY task MUST be filed as a
        plan/issues/<slug>-<ISO-date>.md packet before that task is reported
        complete — regardless of whether it lies inside the current task's
        scope, whose code it is, or who introduced it. "Not mine", "out of
        scope", "pre-existing", "another agent's work", or "unrelated" are NOT
        acceptable reasons to leave an observed problem unfiled. Noticing is the
        trigger; filing is the obligation. If you can describe it well enough to
        dismiss it, you can describe it well enough to file it.
      minimum_packet_contents:
        - "what was observed (symptom) with a concrete repro or evidence pointer"
        - "root cause if known, or the leading hypothesis and how to confirm it"
        - "why it matters (blast radius / which invariant or guarantee it breaks)"
        - "smallest correct fix as exit_criteria a picker can verify"
        - "order: <next free>, status: ready — so /advance-work-from-plan can claim it"
      scope_boundary: >
        Filing is mandatory; FIXING out-of-scope issues inline is not. Prefer to
        file the packet and keep your commit focused, especially when the defect
        lives in another agent's recently-landed work or a shared ledger — let a
        coordinator or the owning lane pick it up. Fix inline only when it is
        cheap, obviously correct, and in your own change's blast radius.
      exit_contract_binding: >
        This mandate is part of the Non-Negotiable Exit Contract: a cycle that
        observed a problem and ended without a corresponding plan/issues packet
        (or a pointer to a pre-existing open one) has NOT satisfied its exit
        contract. Reviewers and coordinators treat an unfiled known issue as a
        defect in the cycle itself.

  clean_workspace_discipline:
    rule: >
      Every iteration of work MUST start and end with a completely clean work state (only committed code).
      Once work is reported as completed, all temporary local artifacts are disposable and must be discarded.
      Agents encountering a dirty space have a one-off chance to clean up or commit work; otherwise, they must discard uncommitted artifacts.
      Rely heavily on .gitignore for generated artifacts and dashboards to keep the tree clean.
      Any running `tillandsias` background binaries or test processes MUST be explicitly terminated after tests complete.
      Local builds MUST use an autoincremental build number so agents can quickly detect and discard stale binaries.
      Shared local resources (like e2e test execution) MUST use a `.lock` file system to prevent concurrent execution collisions between agents.


  component_freshness:
    authority: "The Tlatoāni, 2026-07-15 (operator directive)"
    rule: >
      Our own components age — code, scripts, litmus tests, cheatsheets,
      methodology docs, images, artifacts. Every auditable component carries a
      FRESHNESS record answering: when was this last PROPERLY looked at and
      confirmed still meaningful, useful, efficient, sound, and complete?
      CI/CD flags components whose freshness age exceeds threshold for
      RE-FRESH; a flagged component dispatches an agent audit that ends in
      exactly one of: refreshed (re-validated, stamp updated), updated
      (fixed/tuned, stamp updated), or obsoleted (deleted/tombstoned, with
      same-commit removal of dependents). This is a standing, never-ending
      loop woven into the recurring skills, not a one-shot audit.
    discard_over_repair: >
      Agents MUST be able to recognize an obsolete component and DISCARD it
      rather than reuse or repair it when a fresh implementation would be
      better. Repair is not the default disposition. Removed components get a
      tombstone naming what replaced them and why repair was declined (the
      2026-07-15 execute_test_command tombstone in scripts/run-litmus-test.sh
      is the exemplar: dead code that LOOKED live misled a hardening pass and
      cost a full CI cycle).
    freshness_record_grammar: >
      A machine-greppable `freshness:` block (or `# freshness:` comment
      header for scripts): auditor agent id, ISO date, verdict
      (refreshed|updated|obsoleted), one-line scope note. Detailed schema and
      rollout ladder: plan/issues/component-freshness-lifecycle-2026-07-15.md
      (flag -> soak -> default, per migration_discipline).
    canonical_threshold:
      authority: "order 606-vaua (2026-08-11); threshold ownership lives HERE, not in any script"
      age_days: 30
      clock_semantics: >
        Age is computed in UTC, date-only: age_days = (today_utc -
        stamp_date_utc) in whole days, ignoring time-of-day and host
        timezone. A stamp is STALE iff age_days > age_days threshold
        (strictly greater: a stamp exactly at the threshold is still
        fresh). A stamp dated in the FUTURE (host clock skew or a typo)
        clamps to age 0 — fresh — but MUST be surfaced on its own
        `freshness-clock-skew:` line so the anomaly is visible rather than
        silently absorbed. A stamp whose date field does not parse as
        ISO-8601 date MUST be surfaced on a `freshness-malformed:` line
        and counts as stamped-but-unassessable (never silently fresh,
        never silently stale). Tools MUST read the threshold from this key
        (env override FRESHNESS_THRESHOLD_DAYS permitted for tests) so a
        future retuning happens in one place.
    coverage_target:
      authority: "The Tlatoāni, 2026-08-12 (order 640-iujb ruling)"
      scope: defined-subset
      rule: >
        Coverage is NOT measured against every file. Only components that
        ENCODE DESIGN INTENT are in scope — executable/source code, scripts,
        litmus tests, specs (openspec/specs), and methodology docs — because
        only those can go stale in the sense the audit asks about ("is this
        still meaningful, sound, complete?"). EXCLUDED from the denominator:
        generated files (regenerated from source), vendored/third-party trees,
        and append-only event logs / ledgers / loop-status history. The
        freshness advisory MUST report coverage against THIS subset, not an
        implicit 100% of all files — an implicit-100% target was divergent
        (~1013 files, +52 in nine days) and mostly meaningless.
      rationale: >
        A defined subset makes coverage both CONVERGENT and HONEST. Auditing a
        generated or vendored or log file for "still meaningful?" is busywork
        that inflates the denominator and never retires. bar_raise_governance
        routed this scope choice to the operator; the loop's job was to make
        the queue reachable and report the rate honestly (both done, 640-iujb).
    audit_rate:
      authority: "The Tlatoāni, 2026-08-12 (order 640-iujb ruling)"
      rule: >
        A cycle MAY BATCH the re-stamp of an UNCHANGED component — one whose
        current content-hash matches the hash recorded at its last audit needs
        no re-review, only a stamp refresh. "Unchanged since last stamp" is
        script-checkable (compare content-hash), so what counts as a trivial
        batchable audit is defined, not a judgment call. Components that
        CHANGED since their last stamp, or were NEVER audited, still get the
        careful ONE-per-cycle review that ends in refreshed | updated |
        obsoleted. This retires the unchanged bulk cheaply while keeping real
        review where content actually moved.
      future_work: >
        A richer design is filed for later (freshness-buckets, see the ledger):
        criticality BUCKETS — a frequent, close-eye audit for critical-path
        components and a batched "quick look" for the globally-unimportant
        bulk — plus telemetry that flags UNTRACKED components as freshness
        candidates and size/kind heuristics for batchability. This key records
        the operator's near-term ruling; the bucketed model supersedes the
        flat rate when that work lands.

# ── On-Demand-Subject-Experts (2026-08-12, operator rulings) ──────────────────
# Order 707-t3mz. When a project depends on a technology or best-practice domain,
# the forge stands up a small RAG expert giving CITED, QUOTABLE answers to the
# official docs — the "hard quote to a real span" that IS a verifiable litmus.
on_demand_experts:
  authority: "The Tlatoāni, 2026-08-12 (order 707-t3mz rulings)"
  doc_lifecycle:
    rule: >
      External docs are PULL-ON-DEMAND, NEVER BUNDLED into images, NEVER
      committed to the project. This dissolves all license/attribution
      complexity by honoring ephemerality + idempotency: nothing is
      redistributed; an ephemeral forge that loses the pulled docs simply
      re-pulls them next launch, by design. No license-allowlist / bundle tier
      is needed because nothing is baked or shipped.
    three_zones_in_forge: >
      All Tillandsias-owned state lives INSIDE /home (never /var, /etc, /opt —
      it must be easy for an entry-level Linux user to find) and OUTSIDE the
      project checkout at /home/<user>/src/<project>. Three zones with distinct
      lifecycles: (1) HARD FORGE — the Linux/image components (dnf-installed,
      rarely change); (2) EPHEMERAL FORGE — cached-but-not-committed state under
      ~/.cache/tillandsias/ (build artifacts, warm nix cache, cheatsheets,
      PULLED EXPERT DOCS); dies with the container, re-materialized on launch;
      (3) PROJECT — the GitHub-backed checkout at ~/src/<project>, the only zone
      that is version-controlled. Pulled docs and expert corpora live in zone 2,
      never zone 3.
    development_machine: >
      On a bare-metal DEVELOPMENT host the same pull lands OUTSIDE the repo
      (~/.cache/tillandsias/) and is additionally .gitignore-guarded against any
      repo-relative pull, so on-demand docs never pollute the committed project.
      Dev-machine and in-forge share the pull mechanism but differ in lifecycle:
      the forge's cache dies with the container; the dev host's persists until
      cleared.
    cache_buckets: >
      Some doc sets are hundreds of MB. They ride the cache-overlay volatility
      buckets (order 687 + the 691-raj8 slow layer): LARGE, SLOW, STABLE
      (rarely-changing, cache-friendly heavy corpora) and ON-DEMAND (pulled per
      launch because their license forbids baking). Never the per-cycle VOLATILE
      layer for the heavy ones — they would re-download every rebuild.
  authority_labeling:
    rule: >
      Every expert corpus and every cited answer carries an authority label:
      AUTHORITATIVE (the tech provider or a standards body — e.g. the A+ Promises
      spec, ECMAScript, Reactive Streams) or COMMUNITY (widely-used patterns
      whose source is essays/books/consensus — e.g. Fowler-style IoC/Factories/
      DI). COMMUNITY patterns are NOT first-class but MUST be included: they are
      often about to converge into authoritative ones (everything is a CRDT; we
      love convergence). They may CONTRADICT each other, so the label lets an
      in-forge agent decide when the AUTHORITATIVE approach suffices and when a
      COMMUNITY approach has acceptable tradeoffs for a specific case. If an
      authoritative source later supersedes a community pattern, the record
      notes the supersession (CRDT convergence, not deletion).
  technique:
    rule: >
      ALWAYS full chunk+embed RAG — one path for every corpus, small or large.
      No summarize/Modelfile-stuffing branch: a single simple path is the most
      trustworthy and consistent, and query latency is already near-instant. Do
      NOT add a low-compute mode — the fleet is efficient enough to be GREEDY
      with compute. On fatter hardware, INCREASE the synthesis model size where
      it helps (measured per corpus) rather than shrinking the technique.
  detection_and_pull_granularity:
    authority: "The Tlatoāni, 2026-08-12 (order 707-t3mz Q5 ruling)"
    rule: >
      Pulls are DEMAND-DRIVEN, not manifest-bulk. Do NOT parse a manifest and
      pull docs for every declared dependency. On a forge for a Rust project the
      launcher seeds the PRIMARY tech (Rust + its basic related stuff) up front;
      thereafter the AGENT pulls each additional topic on demand AS IT WORKS
      (needs tokio -> pull tokio; needs something else -> pull that). Most doc
      sets are a few pages (cheap); only a handful (Flutter, Java, ...) run to
      hundreds of MB. Pull-on-demand for whatever is relevant to the current,
      highly-targeted work — quick, idempotent, ephemeral. NO threshold or
      eviction policy yet: adding "only N topics at a time" / eviction is a
      LATER optimization to make only if this becomes unruly (do not
      pre-optimize). This resolves the 707-t3mz P4 auto-detect open question:
      P4 seeds the primary tech + enables agent-driven incremental pulls, it
      does NOT bulk-pull the dependency graph.

  build_cache_hygiene:
    authority: "The Tlatoāni, 2026-08-12"
    rule: >
      LONG-DURABLE hosts (bare-metal dev machines / out-of-forge coordinators —
      NOT ephemeral forges, which discard their whole substrate on teardown)
      accumulate a large disposable build cache (target/ measured at 63G on the
      linux dev host 2026-08-12). At the END of a meta-orchestration cycle a
      durable host SHOULD reclaim it when it is genuinely bloated OR stale, and
      NOT on every cycle (a full `cargo clean` forces a full rebuild next cycle,
      so it must be rare). Trigger (whichever first): target/ exceeds 40 GiB, OR
      a `.last-build-cache-sweep` marker under the cache dir is older than 14
      days. Action: `cargo clean` (+ `scripts/nix-toolbox.sh gc` when nix is
      present — NOT a bare `nix store gc`, see nix_store_policy), then stamp
      the marker. END of
      cycle, not beginning, so the reclaim happens after the cycle's work and
      the cost (a fuller next-build) is paid during the idle gap. Ephemeral
      forges are EXEMPT — their target/ dies with the container.
      Implemented by scripts/check-build-cache-sweep.sh (verdict grammar
      ok:build-cache-sweep-not-due / due:build-cache-sweep / skip:forge-exempt,
      exit 0 when NOT due) and pinned by litmus:build-cache-sweep-trigger.
      CORRECTED 2026-08-25 (order 709-in2f): this rule previously ended
      "Implemented + litmus-pinned by the ledger packet
      build-cache-sweep-on-durable-hosts" while that packet sat `ready` — no
      script, no marker and no litmus existed. A policy that names its own
      implementation reads as settled, so the false claim is plausibly WHY
      nobody wrote one; same shape as an unbound litmus (660-ryhn) or the
      daily-maintenance marker that lived only as prose (801-qasc).
    nix_store_policy:
      authority: "The Tlatoāni, 2026-08-17 (operator question) — implemented by order 795-h8er"
      rule: >
        The persistent nix store (`scripts/nix-toolbox.sh store-path`, by
        default ~/.local/share/tillandsias/nix-store) is a CACHE, and the two
        halves of that word pull in opposite directions: it must survive
        toolbox and worktree recreation, and it must not grow without bound.
        The policy is PIN WHAT IS CURRENT, COLLECT THE REST, ONLY ABOVE A
        CEILING. Run `scripts/nix-toolbox.sh gc` from the daily lane; it pins
        first and collects second, and never touches the host's own /nix.
      why_bare_nix_gc_is_forbidden: >
        Do NOT run a bare `nix store gc` or `nix-collect-garbage` against this
        store. Measured on macuahuitl 2026-08-17: the store held 5.8 GiB over
        4,478 paths and every one of them was GARBAGE by nix's reckoning,
        because its only four GC roots were `auto` indirect roots pointing into
        a fork worktree that had already been deleted. A bare collection would
        have deleted the entire cache the lane was meant to be pruning — the
        failure would have looked like nothing at all, just builds quietly
        getting slow again. `nix-toolbox.sh gc` exists so the lane cannot make
        that mistake: it establishes roots BEFORE it collects, and refuses to
        collect at all when flake evaluation could not tell it what to protect.
      what_is_pinned: >
        The crane deps closures for the four musl flake outputs, and only
        those. They are the expensive artifact and they are content-stable
        under source-only change (order 765-8hc3, guarded by
        scripts/check-nix-deps-stability.sh), so a small fixed set of roots
        buys most of the hit rate. Top-level outputs are deliberately NOT
        pinned: they move on every commit, so rooting them would accumulate one
        dead closure per commit — the very growth this policy bounds. Roots
        live at <store>/nix/var/nix/gcroots/tillandsias/, INSIDE the store,
        never inside a worktree.
      ceiling: >
        20 GiB by default, override with TILLANDSIAS_NIX_STORE_CEILING_GIB.
        Under the ceiling, `gc` is a no-op and reports `under-ceiling` — the
        cache is allowed to be large, it is only not allowed to be unbounded.
        Above it, the excess is freed with `nix store gc --max`, which cannot
        touch the pinned deps closures. Sized against the 40 GiB target/
        trigger above: one generation of deps closures across the four outputs
        is a few GiB, so 20 holds the current set plus a couple of in-flight
        generations.
      what_actually_drives_growth: >
        Not source churn — lock churn. The deps closure moves whenever
        Cargo.lock or flake.lock moves (three times in the two days before this
        was written), and each move orphans the previous multi-GiB closure
        forever. Measured at the same moment: five stale deps closures
        resident, zero current ones. Pinning the current set is what makes the
        stale ones collectable rather than indistinguishable.
      deletion_is_safe: >
        `rm -rf` on the whole store is a supported recovery: the next
        `nix-toolbox.sh ensure` recreates it and the next build repopulates it,
        slowly. Pinned by scripts/test-nix-toolbox.sh (delete-and-rebuild), as
        is the root mechanism itself (pinned-survives-gc) — so a nix upgrade
        that stopped honouring roots in that location fails loud here instead
        of silently evaporating the cache.
      concurrency: >
        Safe. Measured 2026-08-17 against one chroot store: eight concurrent
        builders of the same derivation all exited 0 and produced one output
        path; eight concurrent writers racing a simultaneous `nix store gc`
        produced zero failures and `nix store verify --all` exited 0. Four
        agents building at once on one host is the normal case here, not the
        edge. Note the one real hazard this does NOT remove: a collection
        running concurrently with a build can evict a freshly written path that
        nothing has rooted yet, which is another reason `gc` pins first.

  development_environment_lifecycle:
    authority: "The Tlatoāni, 2026-08-13 (fleet-restart directive)"
    primary_methodology: >
      Our PRIMARY development methodology is Fedora Silverblue (immutable OS) with
      toolbox/distrobox containers for the mutable dev toolchain. This host is
      linux-MUTABLE (a variant), but scripts and tooling MUST favor the
      Silverblue+toolbox path: idempotent scripts, ephemeral toolboxes, nothing
      that assumes a mutable base OS. build.sh already re-execs into the
      tillandsias-builder toolbox on Silverblue; keep that discipline.
    two_lifetimes: >
      Distinguish the LONG-LIVED bare-metal DEVELOPMENT ENVIRONMENT (a durable
      checkout on a dev machine / coordinator) from the EPHEMERAL in-forge
      container (discarded whole on teardown). The forge needs no GC — it dies.
      The DEVELOPMENT ENVIRONMENT accumulates cruft and MUST run its own periodic
      garbage collection and maintenance. See on_demand_experts doc_lifecycle for
      the three zones (HARD FORGE / EPHEMERAL FORGE / PROJECT).
    start_of_day_maintenance:
      when: >
        Run once per local day (and on the first cycle after a restart), gated by
        a `.last-daily-maintenance` marker under the cache dir so it is idempotent
        and not repeated every cycle. Bare-metal durable hosts only; forges exempt.
      steps:
        - "Build-cache GC per build_cache_hygiene (cargo clean + scripts/nix-toolbox.sh gc when bloated/stale)."
        - "scripts/nix-toolbox.sh gc on Silverblue+toolbox hosts (pins the current deps closures, then collects above the ceiling; a bare nix store gc would delete the whole cache — see build_cache_hygiene.nix_store_policy); podman image prune of superseded versioned images."
        - "Nix-lane guards, on hosts with nix: scripts/test-nix-toolbox.sh (store contract) and scripts/check-nix-deps-stability.sh (the content-stability property the cache's hit rate depends on). Daily rather than per-commit deliberately — each is a flake evaluation, and putting them in ./build.sh --check would tax every edit to protect a property that only moves when a lock file does."
        - "Enclave nix binary cache (order 801-kqme), on Linux hosts with nix and a running enclave: scripts/nix-cache-service.sh ensure, then scripts/test-nix-cache-service.sh. The fixture asserts BOTH trust mechanisms — the stack-CA leaf for transport and the ed25519 trusted-public-keys signature for content — because they are different properties and a cache that keeps only one is not safe to share. It skips cleanly when the service is absent, but a service that is RUNNING and untrusted is a violation, never a skip."
        - "Reap defunct delegate/opencode handles; delegate-outcome.sh sweep any stale registered delegate."
        - "Verify the dev-environment expert containers are up + fresh (see dev_environment_experts)."
    post_restart_verification: >
      After a fleet restart (system upgrades + stack restart + MCP rebuild), a
      resuming host MUST run the durable checklist BEFORE trusting its tools or
      launching a forge: plan/issues/fleet-restart-post-restart-checklist-2026-08-13.md
      (order 718-nuvm). Highest-signal: (1) MCP experts serve source_commit==HEAD
      (stale-expert trap); (2) clock/NTP synced (a skewed clock breaks SSH-CA 30m
      cert TTLs + freshness stamps); (3) forge images rebuilt at the installed
      VERSION (avoid the ~2s version-skew DOA); (4) per-checkout git hooks
      reinstalled; (5) router sidecar staged as a build artifact (710-w9kc).
      Because every host restarts with the prompt "Use the ./skills/meta-orchestration
      skill", the skill's Start-Of-Day / Post-Restart gate runs this — the
      checklist must stay discoverable from there.
    dev_environment_experts:
      authority: "The Tlatoāni, 2026-08-13"
      rule: >
        Bare-metal DEVELOPMENT ENVIRONMENTS must run the SAME idempotent,
        ephemeral expert systems the forge runs — RAG+semantic experts in
        containers (never on the sacred host base) — WITH the same checkout hooks
        that RETRAIN the RAG on commits hitting the relevant bits (the forge's
        unconditional order-396 post-commit hook; on dev hosts the env-gated v4
        hook, TILLANDSIAS_HOST_EXPERTS=1, order 685-yidq). This mirrors in-forge
        discipline: commits are the Lamport clock for the RAG cache
        (philosophy.yaml convergence_via_velocity). The expert containers are
        ephemeral (rebuildable from the checkout) and idempotent to start.

  expert_first_work:
    authority: "The Tlatoāni, 2026-08-13 (fleet-restart directive)"
    rule: >
      FAVOR THE EXPERT SYSTEM when pulling work, triaging, debugging, and
      researching — ask the experts first (extends bootstrap.mcp_first_read_path
      from reads to the whole work loop). Each expert answer is cited + quotable
      (a verifiable litmus), which is exactly the small fast RAG iteration
      convergence_via_velocity wants.
    warned_fallback_ratchet: >
      Where the expert system has a GAP, fall back to whatever the loop does today
      (grep, direct file reads, ad-hoc analysis) BUT emit a WARNING naming the gap
      and, where cheap, file/annotate the packet that would close it. As the
      expert systems improve and a gap closes, REMOVE its fallback — first
      degrading the fallback to a loud warning, then deleting it. The direction is
      one-way: fallbacks are temporary scaffolding retired with warnings as the
      experts mature, never a permanent parallel path.
