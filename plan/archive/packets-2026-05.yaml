      context: |
        Found live 2026-08-11 when every push began hanging silently: the pre-push local gate runs gate-stamp.sh verify, whose compute() spawned sha256sum (plus a $() subshell) once PER worktree file. The "~60ms over 4000 files" costing in the header is a Linux fork number; on this Windows/MSYS host a spawn measures ~150ms (Defender + MSYS fork emulation), so verify took ~20 MINUTES at near-zero CPU — the exact "multi-minute hook gets --no-verify'd" failure mode the stamp design exists to avoid, presenting as a hang with no output. Diagnosed by bisecting hook -> local-gate -> gate-stamp -> compute, then timing 20 bare sha256sum spawns (3.1s).
      exit_criteria:
        - |
            compute() classification uses bash builtins, regular files are batch-hashed via xargs -0 sha256sum, only symlinks pay per-entry spawns, and a digest-count mismatch fails loud rather than stamping an unmeasured tree.

        - |
            The emitted frames are byte-identical to the per-file implementation so existing stamps stay valid — VERIFIED: old implementation (run in the WSL builder) and new implementation (run on the host) both produce 155fce42c48bfc26 for the same tree.

        - |
            Host-measured compute time is seconds, not minutes — MEASURED: 5.0s wall on the ~4000-file tree that previously took ~20 min.

      events:
