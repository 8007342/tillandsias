      context: |
        `local-ci` failed the `tray-contract` check on two consecutive runs (local-ci-20260810T054348Z, local-ci-20260810T074307Z), both on `resource_lock::tests::is_held_reflects_lock_lifecycle` at the final assertion — a guard that had just been dropped still probed as HELD.
        `try_lock` classified every non-EWOULDBLOCK `flock(2)` return as `Err`, and `is_held` maps `Err(_)` to `true` on purpose (a wrong "held" leaks a container; a wrong "free" tears the stack out from under a live forge). But flock(2) is interruptible: a signal delivered mid-call returns EINTR, which is not a statement about the lock at all. Under a parallel test binary spawning child processes, one stray SIGCHLD is enough — and the same path runs in the order-443 launch-in-flight teardown probe, where the consequence is a leaked container rather than a red test.
