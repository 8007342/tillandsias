      THE PATTERN WORTH GENERALISING — this is the SECOND bash-3.2/BSD
      portability defect this host hit in ONE cycle, after 803-bqte (GNU-only
      `\b` in three observability readers). Both share a shape:

        * the code is correct on the authoring platform (Linux, bash 5.x);
        * the failure mode on the floor platform is SILENT or INVERTED rather
          than loud — 803-bqte's readers returned "absent" and this one aborted
          only when healthy;
        * `./build.sh --check` is green on both platforms, because neither the
          fixture nor the hook lane is exercised there.

      `./build.sh --check` DOES carry a `bash-dialect-clean` gate, and it passed
      on this tree both before and after the fix — so whatever it checks, it
      does not check either of these. Worth knowing before anyone assumes that
      gate covers the floor.

      PROPOSED CONSTRAINT, filed rather than implemented because the rule set
      needs review before it can block a push: a dialect check for the two
      concrete shapes now measured — bare `"${arr[@]}"` under `set -u` without a
      length guard, and GNU-only sed/grep atoms (`\b`, `\u`, `\U`, `\L`, `\+`,
      `\?`) — plus running the existing `fixture` modes on the macOS host in its
      own cycle rather than trusting Linux CI to speak for the floor.
