      host: macos
      summary: >
        FOUND BY BEING BLOCKED BY IT. Pushing this cycle's attestation-ledger
        record failed with
        `scripts/hooks/pre-push-local-gate.sh: line 130: LANE_NOTES[@]: unbound
        variable`, after the lane had already printed
        `plan-only lane: validated plan/mo-full-attestations.d/...` — i.e. it
        died AFTER succeeding. bash 3.2 (the project's declared floor, and the
        macOS system bash — 3.2.57 here) treats "${arr[@]}" on an EMPTY array as
        an unbound variable under `set -u`; bash 4.4 fixed it. Reproduced
        minimally: `bash -c 'set -u; arr=(); echo ${#arr[@]}; for x in
        "${arr[@]}"; do :; done'` prints 0 then `arr[@]: unbound variable`.
        THE FAILURE IS INVERTED, which is why it is worth a packet rather than a
        one-line fix: LANE_NOTES is appended to ONLY when a checker was ABSENT
        and got skipped (:277, :391, :394, :410, :440), so it is EMPTY exactly
        when every check ran. The fast lane therefore aborted on the healthy
        path and worked on the degraded one, and it took the push with it — on a
        host with no checkers missing, plan-only pushes were simply impossible.
        SCOPE CHECKED, NOT ASSUMED: the three sibling array expansions in the
        same file are all correctly guarded — paths[@] (:516) by the
        `${#paths[@]} -eq 0 && return 0` above it, diff_classes[@] (:525) by its
        own zero-check refusal, missing[@] (:542) by `${#missing[@]} -gt 0`.
        LANE_NOTES was the lone unguarded one, and it is the only one whose
        EMPTY state is the success state — which is precisely why it is the one
        that broke. FIX: guard the loop on `${#LANE_NOTES[@]}`, which is
        well-defined for an empty array on every bash. Verified by re-running
        the real push: `plan-only lane clean (1 fragment file(s) validated)`,
        exit 0.
      evidence_refs:
        - "scripts/hooks/pre-push-local-gate.sh:449-456 — length guard around the notes loop"
        - "repro: bash 3.2.57 `set -u; arr=(); for x in \"${arr[@]}\"` -> unbound variable"
        - "before: push exit 1 after printing the lane's own success line"
        - "after: 'plan-only lane clean (1 fragment file(s) validated)', push exit 0"
        - "siblings :516 / :525 / :542 confirmed already guarded"

