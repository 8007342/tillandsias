# Shaping fragment: 722-ecne (slice c of 606-bvnp) split into implementable rungs.
#
# WHY SPLIT RATHER THAN IMPLEMENT. 722-ecne is p0 and has been offered by
# select-work-batch.sh as `urgent=` on four consecutive cycles (2026-08-14/15,
# seeds host-20260814 and host-20260815) without being claimed by any host. Its
# body is design rungs T3-T13 of plan/issues/ssh-ca-forge-mirror-push-design-2026-07-31.md
# — eleven rungs spanning the git image, host certificates, sshd_config, a
# receive wrapper, repository hardening, a per-lane agent sidecar, a Vault audit
# volume, forge wiring, staged migration and spec amendments — against an
# estimate of 3 hours. A packet no one claims four times running is not waiting
# for effort; it does not fit a cycle, and the selector cannot say so.
#
# The design itself argues for the first cut: T3 is "the highest-risk step — see
# R1 in §5. Verify it inside the container before building anything on it."
# Everything downstream assumes sshd runs at all under `--read-only` and
# `--cap-drop=ALL` as uid 1000 on port 2222. That belongs on its own rung.
#
# Each child carries a closure the DESIGN already names, not one invented here.
# T13 (fail-loud litmus) is deliberately NOT a child: it belongs with slice d,
# 722-uern (mirror-identity-negative-matrix-litmus), which owns the §4a matrix.
packets:
  - packet_id: mirror-identity-sshd-in-the-image
    order: 749-wv4d
    status: ready
    desired_release: v0.5
    priority: p0
    release_target: forge-local-experts-milestone
    kind: security+implementation
    title: "T3 — openssh-server in the mirror image, proven to run under --read-only and --cap-drop=ALL as uid 1000 on port 2222"
    deliverable: "sshd present and demonstrably running under the real security posture"
    pickup_role: linux
    depends_on: []
    capability_tags: [security, ssh, git-mirror, image]
    estimated_hours: 2
    context: |
      Design T3. `images/git/Containerfile` carries `openssh-client` only (V11).
      Add `openssh-server` while keeping the `--read-only` rootfs and
      `--cap-drop=ALL`, which forces sshd to run as uid 1000 `git` on a high port
      (2222) with all writable state on the existing `/tmp` tmpfs or the
      `/srv/git` volume.

      The design flags this as the HIGHEST-RISK rung (R1, §5) and says to verify
      it inside the container before building anything on it. Every later rung
      assumes sshd runs at all under that posture; if it cannot, the whole slice
      changes shape rather than losing a step.
    exit_criteria:
      - "sshd starts in the real images/git container under --read-only and --cap-drop=ALL as uid 1000 on port 2222, and accepts a TCP connection — demonstrated in the container, not argued from the Containerfile."
      - "Every writable path sshd needs is on the /tmp tmpfs or the /srv/git volume; the rootfs stays read-only (no relaxation of the security flags to make it start)."
      - "NEGATIVE CONTROL: removing the tmpfs/volume writable paths makes it fail with a named cause, so the fixture is proving the posture rather than passing vacuously."
    notes: |
      If sshd cannot run under the stated posture, STOP and report — do not
      relax --read-only or --cap-drop to make the rung pass. That posture is the
      reason the mirror is safe to expose, and trading it for ssh is a different
      decision that belongs to the operator.

  - packet_id: mirror-identity-host-cert-and-sshd-config
    order: 749-54pv
    status: ready
    desired_release: v0.5
    priority: p0
    release_target: forge-local-experts-milestone
    kind: security+implementation
    title: "T4+T5 — host certificate at mirror start and the sshd_config that trusts only the CA"
    deliverable: "a mirror that presents a single-principal host cert and accepts only CA-signed users"
    pickup_role: linux
    depends_on: [mirror-identity-sshd-in-the-image]
    capability_tags: [security, ssh, git-mirror, vault]
    estimated_hours: 3
    context: |
      Design T4 and T5. The mirror requests a host cert from
      `ssh-host-signer/sign/host-<mirror-id>` with its existing Vault Agent
      token, for exactly the principal `git-<mirror-id>` (D9), writes it beside
      the host key and re-requests every 8h. sshd_config sets
      `AuthorizedKeysFile none`, `TrustedUserCAKeys`, a per-project
      `AuthorizedPrincipalsFile` containing exactly `til:forge-push:<mirror-id>`
      (one opaque line, D3), `ForceCommand /usr/local/bin/tillandsias-receive`,
      `ExposeAuthInfo yes`, `AllowTcpForwarding no`, `AllowAgentForwarding no`,
      `PermitTTY no`, `RevokedKeys`, `LogLevel VERBOSE`.
    exit_criteria:
      - "The design's own T4 closure: a fixture asserts the presented host key is a CERTIFICATE for exactly the one principal git-<mirror-id>, and that a client carrying only the @cert-authority line connects with StrictHostKeyChecking=yes."
      - "AuthorizedPrincipalsFile contains exactly one opaque line and no key material is authorised outside the CA (AuthorizedKeysFile none is effective, not merely written)."
      - "NEGATIVE CONTROL: a host cert for a second principal, or an extra principals line, is refused — the single-principal claim is falsifiable."
      - "The 8h re-request path is exercised, not just the first issuance."

  - packet_id: mirror-identity-receive-wrapper-and-repo-hardening
    order: 749-2fqj
    status: ready
    desired_release: v0.5
    priority: p0
    release_target: forge-local-experts-milestone
    kind: security+implementation
    title: "T6+T7 — receive wrapper pinned to the fixed repo path, and hardening that reaches EXISTING volumes"
    deliverable: "a push that cannot be redirected, on a repo that refuses force-push and rejects bad objects"
    pickup_role: linux
    depends_on: [mirror-identity-host-cert-and-sshd-config]
    capability_tags: [security, ssh, git-mirror]
    estimated_hours: 3
    context: |
      Design T6 and T7. The wrapper parses `$SSH_USER_AUTH`, exports the four
      `TILLANDSIAS_PUSH_*` variables and execs `git-receive-pack` on the FIXED
      project path, ignoring `SSH_ORIGINAL_COMMAND`'s target. Hardening moves
      `receive.denyNonFastforwards` / `receive.denyDeletes` out of the
      `if [ ! -d … ]` block at `images/git/entrypoint.sh:131-139`, flips both to
      true and adds `receive.fsckObjects=true`.

      The init-only placement is exactly why T7 needs an UPGRADE fixture rather
      than a fresh-volume one — this is the same shape as packet 579
      (mirror-repo-config-hardening-never-reaches-existing-volumes); check
      whether that packet subsumes or duplicates this rung before implementing.
    exit_criteria:
      - "§4a row M5: a cert whose SSH_ORIGINAL_COMMAND names project B's repo path still lands in A's fixed repository."
      - "The design's own T7 closure: a fixture that UPGRADES AN EXISTING mirror volume and proves a force push is refused — a fresh-volume fixture does not close this."
      - "receive.fsckObjects=true is effective on an upgraded volume (a malformed object is rejected), not merely present in config."
      - "The four TILLANDSIAS_PUSH_* variables are exported with the values the audit rung consumes."

  - packet_id: mirror-identity-agent-sidecar-and-forge-wiring
    order: 749-6uby
    status: ready
    desired_release: v0.5
    priority: p0
    release_target: forge-local-experts-milestone
    kind: security+implementation
    title: "T8+T10 — per-lane ssh-agent sidecar and forge wiring, with D5 (no key material in the forge) surviving"
    deliverable: "a forge that pushes with a certificate it can use and cannot read"
    pickup_role: linux
    depends_on: [mirror-identity-receive-wrapper-and-repo-hardening]
    capability_tags: [security, ssh, git-mirror, forge, vault]
    estimated_hours: 4
    context: |
      Design T8 and T10. Sidecar: a new entrypoint in the existing `images/git`
      image (ssh-agent, ssh-keygen and vault are already present — no new
      image), Vault Agent auto-auth reusing `vault-agent.hcl` /
      `vault-agent-bootstrap.sh`, keygen on tmpfs, signing via the exact
      `ssh-client-signer/sign/<mirror-id>` path its minted policy names (D12 — a
      403 from any other path is CORRECT, §4a M2), `ssh-add`, a renewal loop and
      a socket on a named volume. Launcher wiring in `tillandsias-headless`
      creates the volume, mints the AppRole, starts the sidecar before the forge,
      records fingerprint and mirror-id in the attribution ledger, and tears both
      down together.

      Forge wiring changes the `insteadOf` target in `write_forge_gitconfig`
      (`main.rs:7802-7804`) to `ssh://git@git-<mirror-id>:2222/srv/git/<project>`
      FOR PUSH ONLY — the anonymous protocol stays the fetch path (Q4).
      `known_hosts` with the `@cert-authority` line must arrive through the
      read-only global config because `~/.ssh` is an empty tmpfs (D9).

      Also reckon with `export_ssh_env()` in `images/default/lib-common.sh`,
      which every forge entrypoint calls and which probes `~/.ssh` for identity
      files — dead today against the tmpfs, and a LIVE HAZARD once ssh is in the
      push path.
    exit_criteria:
      - "§4a row M0 (positive control): two REAL simultaneous projects each clone, fetch and push their own mirror with their own certificate, concurrently."
      - "D5 re-verified after wiring: the forge contains no private key, no Vault token, no SecretID and no upstream credential — only an agent socket and public CA trust."
      - "The AppRole ssh-lane-signer-<mirror-id> is minted per lane, and signing via any path other than the one its policy names returns 403 (§4a M2)."
      - "Sidecar and forge are torn down together; a leaked sidecar after forge exit is a failure."
      - "export_ssh_env() is proven harmless with ssh in the push path (or fixed) — it is named here so it cannot be discovered later as a surprise."

  - packet_id: mirror-identity-persist-vault-audit-device
    order: 749-8iw4
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: forge-local-experts-milestone
    kind: fix
    title: "T9 — persist the Vault audit device so attribution survives container recreation (unblocks §4a M6)"
    deliverable: "an audit channel that outlives the container that wrote it"
    pickup_role: linux
    depends_on: []
    capability_tags: [security, vault, audit, git-mirror]
    estimated_hours: 2
    context: |
      Design T9. `/vault/audit` is a container-layer directory today (V12) and
      dies on recreate, so D11's third attribution channel does not exist. Mount
      a volume at `/vault/audit`, or repoint the device at the already-mounted
      `/vault/logs`.

      SPLIT OUT DELIBERATELY AND WITH NO DEPENDS_ON: 722-ecne's own notes say row
      M6 is BLOCKED on this and warn "do not report M6 green without it". It
      needs none of the sshd rungs, so leaving it inside the parent made an
      independent, small, blocking fix wait behind eleven rungs of ssh work.
      Any host can take this one now.
    exit_criteria:
      - "Vault audit records survive recreation of the Vault container — demonstrated by recreating it and reading back records written before."
      - "§4a row M6 becomes passable: the audit records carry project, lane, principal, fingerprint, serial and refs AND survive a mirror/Vault container recreation."
      - "NEGATIVE CONTROL: with the volume removed, the fixture fails — proving it tests persistence rather than the presence of a path."

  - packet_id: mirror-identity-staged-migration-and-spec-amendments
    order: 749-y8xx
    status: ready
    desired_release: v0.5
    priority: p2
    release_target: forge-local-experts-milestone
    kind: implementation
    title: "T11+T12 — flip one lane behind a flag once the §4a matrix is green, and amend the specs that the socket would otherwise violate"
    deliverable: "a default flip that is gated on evidence, and specs that permit the signing oracle"
    pickup_role: linux
    depends_on: [mirror-identity-agent-sidecar-and-forge-wiring]
    capability_tags: [security, migration, spec, git-mirror]
    estimated_hours: 3
    context: |
      Design T11 and T12. One lane behind a flag with a fetch/push parity
      fixture, then soak. THE FULL §4a NEGATIVE TWO-PROJECT MATRIX GREEN IS THE
      GATE for flipping the default — no lane flips while any row is red or
      unbuilt. Then remove `--enable=receive-pack` from
      `images/git/entrypoint.sh:345-352` and rewrite
      `openspec/litmus-tests/litmus-git-mirror-no-anonymous-daemon-write.yaml`,
      whose current text explicitly defends the daemon receive-pack as the
      interim path and must be retired with it.

      T12: `forge-offline` and `git-mirror-service` must state that a signing
      oracle which cannot disclose key material is permitted while key material
      is not (§2.2), or the new socket reads as a spec violation.
    exit_criteria:
      - "Every §4a row is green before the default flips — the gate is the matrix, not a soak period."
      - "--enable=receive-pack is gone and litmus-git-mirror-no-anonymous-daemon-write.yaml asserts the write path is AUTHENTICATED (its interim-defence text retired, not left contradicting the new posture)."
      - "forge-offline and git-mirror-service state the signing-oracle permission explicitly."
      - "A fetch/push parity fixture passes on the flagged lane before any default changes."
    notes: |
      T13 (fail-loud: removing the agent socket must fail the push with a named
      cause and NOT fall back to git://) is intentionally not a child here — it
      belongs with slice d, 722-uern, which owns the §4a matrix.
