# Found while checking whether an amended skill would actually reach a forge
# agent — the answer is yes, but not by the route the image builds for.
packets:
  - packet_id: forge-image-bakes-a-skills-copy-nothing-reads
    order: 819-s92y
    status: ready
    desired_release: v0.5
    priority: p3
    kind: chore
    title: "the forge image COPYs skills/ into /opt/skills, which nothing in the tree references and the forge's own briefing points away from — a dead layer that has already failed one release smoke"
    deliverable: "either /opt/skills is wired to something and documented, or the COPY is removed; and the answer to 'where does a forge agent read skills from' is written down once"
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags: [forge-image, docs]
    estimated_hours: 1
    context: |
      OBSERVED 2026-08-18. Before spending an 18-minute e2e run testing whether
      an amended skills/meta-orchestration/SKILL.md (818-cgpn) would reach a
      forge agent, I checked how the forge obtains skills. Two mechanisms
      exist and only one is live:

        images/default/Containerfile:197-198
          RUN mkdir -p /opt/skills
          COPY skills/ /opt/skills/

        images/default/lib-common.sh:4024 (the agent's own briefing)
          "Available skills are under `.claude/skills/` (Claude Code) or
           `.opencode/skills/` (OpenCode)."

      Those are in-checkout paths, reached through the seed-branch clone, so an
      amended skill on linux-next DOES reach the agent. `/opt/skills` is
      referenced nowhere else: not in images/default/opencode.json (which says
      nothing about skills at all), not in any script, image file, or crate.

      IT HAS ALREADY COST SOMETHING. plan/archive/linux-next-work-queue-2026-05-25.md:97,
      release v0.3.260613.2: a fresh init "failed at final forge
      `COPY skills/ /opt/skills/` because the published runtime bundle omitted
      the directory". A build step that can fail a release smoke, for a
      directory nothing reads.

      IT IS ALSO A TRAP. Someone debugging skill behaviour inside a forge will
      find /opt/skills, edit or inspect it, and draw conclusions from a copy
      that has no effect — and it is STALE relative to the checkout by
      construction, since it is frozen at image build time while the clone is
      current.

      NOT PROVEN, and it is why this is `ready` rather than a patch: whether
      the opencode binary has an undocumented built-in that scans /opt/skills.
      I can state that nothing in THIS repository references the path and that
      the forge briefs the agent elsewhere; I cannot state from here that the
      tool ignores it. Whoever takes this should check that before deleting the
      COPY — removing a layer on an unverified absence is the mistake this
      packet is complaining about, in the other direction.
