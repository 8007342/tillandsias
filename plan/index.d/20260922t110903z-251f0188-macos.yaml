    value: "THE OUTPUT: for every fixture that prints a self-reported total, either the\ntotal is DERIVED from what actually ran, or the file is recorded as\nexamined-and-correct with the reason. A reader can tell which without\nre-deriving it.\n\nTHE CONTROL, and it is the same one the family always needs: for at least\none fixture changed, show that REMOVING an arm moves the printed total.\nA derived count nobody has seen move is a literal that has not been caught\nyet.\n\nDO NOT close this by editing fifteen files. The unscoreable is the point:\nthe finding is per-file and some files are fine.\n\n\n[2026-09-22T11:09:03Z macos] \nREAD THIS FIRST — WHY THE ROW EXISTS, AND WHAT WOULD CLOSE IT BADLY.\n\nTHE PIN THAT EXISTS TO CATCH THIS CANNOT FIRE AGAINST IT, and that is the\nstrongest thing here. openspec/litmus-tests/litmus-script-exec-bit-shape.yaml\npins `ok:script-exec-bits-fixture:14` DELIBERATELY, with a comment saying the\ncount is pinned to catch a wholesale fixture rewrite that drops coverage —\n\"which already happened once under 758-jw6v\". The fixture printed 14 whatever it\nran, so the pin could never fire. The guard and the guarded were agreeing on a\nCONSTANT, and both looked green.\n\nWhoever built that pin anticipated the REWRITE and not the LITERAL. That is the\ndifference between a defended PROPERTY and a defended NUMBER: a number can be\nsatisfied by a string, a property cannot.\n\nTHE FIFTEEN FILES ARE A CANDIDATE SET, NOT A FINDING, and this belongs in the\nclosure rather than only in the unscoreable because it is the thing a taker will\nget wrong under time pressure:\n  * THREE are the three already fixed (test-script-exec-bits.sh,\n    test-skills-single-source.sh, test-litmus-bindings.sh). Three for three is\n    why this row exists AND SAYS NOTHING ABOUT THE OTHER TWELVE.\n  * TWELVE ARE UNEXAMINED. Not twelve defects. A literal total is wrong only\n    where the count can DRIFT from what ran; a fixture with a fixed arm count\n    pinned elsewhere may be perfectly honest.\n  * A FILE THAT ANSWERS THE QUESTION WELL IS LEFT ALONE AND RECORDED AS\n    EXAMINED, with the reason. This is a closure requirement, not a courtesy.\n\nTWELVE MECHANICAL EDITS WOULD CLOSE THIS BADLY IN TWO WAYS: it would convert a\nsurvey into churn, and it would DESTROY THE EVIDENCE OF WHICH FILES WERE FINE ON\nPURPOSE — so the next person re-derives the same twelve, which is the cost this\nrow is trying to stop paying.\n\nTHE ONE QUESTION, in its fixture form: ask what a fixture prints when an arm\nSILENTLY STOPS RUNNING. If the answer is the same number, the total is a claim\nrather than a measurement."
