        MEASURED IMMEDIATELY AFTER:
            host free              2.77 GB of 15.16 GB   (18.3%)
            vmmemWSL working set   4.08 GB
            guest MemAvailable     4038440 kB of 5033620 kB   -- the guest reads HEALTHY

        THAT IS THE BALLOON SHAPE, and the third number is the reason it keeps
        surprising people: nothing measured INSIDE the distro reports a problem, so a
        check that asks the guest how it is doing gets a clean answer while Windows is
        at 18% free and the reaper takes the host-side job. A verdict from inside the
        guest cannot see this, which is why the evidence has to be the host's own free
        memory beside the guest's.

        CONSEQUENCE, stated rather than worked around: a new work/ ref demands a local
        full gate, this host cannot reliably produce one, so Windows slices go out on
        salvage refs and are gated by the relay. That is not a workaround for a red
        gate -- the gate here is not red, it is unfinishable -- and it is the documented
        lane for exactly this (872-c9nd).

        NOT RETRIED. A second reaped gate measures the same thing twice and teaches
        nothing, and the harness's own note says memory may still be short.

        NOT FIXED FROM HERE EITHER. The plausible remedy is this workstation's
        .wslconfig: `memory=5GB` with NO `processors=` line, so the guest takes all 16
        logical CPUs inside 4.8 GB, against esmeraldinha's 8GB/4 which does not see
        this. That is a change to the operator's machine and needs `wsl --shutdown`, so
        it is being proposed to them on their own channel rather than made here or
        asked for by a peer.
