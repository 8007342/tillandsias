    title: |
      macOS: (a) the guest fetch oneshot becomes a path unit that atomically installs a newly staged binary into the RUNNING guest and re-execs under KillMode=process, with the releases/latest fallback pinned to the host version; (b) RESEARCH whether VZVirtualMachine can be hosted out-of-process so a HOST tray upgrade keeps the VM, with a decision memo; until then a host handoff reports deferred:vm-in-process
    context: |
      GUEST: stage_guest_binary (crates/tillandsias-macos-tray/src/guest_binary.rs:232)
      places the binary in a virtio-fs share; tillandsias-headless-fetch.service
      (unit written at crates/tillandsias-vm-layer/src/vz.rs:1203, [Service]
      :1210) installs it ONLY at boot and falls back to releases/latest
      (vz.rs:1122) — an unpinned moving target that
      openspec/specs/vm-provisioning-lifecycle/spec.md:37 says must be the
      host's version. The headless unit ([Service] vz.rs:1240) has no
      KillMode=. HOST: the VM is created in-process
      (VZVirtualMachine::initWithConfiguration, vz.rs:2884-2885);
      quit_with_drain (crates/tillandsias-macos-tray/src/action_host.rs:1211)
      sends VmShutdownRequest (vz.rs:722; the headless stops every container)
      then stops the VM. openspec/specs/vm-provisioning-lifecycle/spec.md:168
      says there SHALL be no opt-out in v1 — the delta in
      openspec/changes/hot-upgrade-live-stack adds exactly one (the handoff,
      an argument of a relaunch, not a setting) and requires the in-process
      case to say so loudly. Design D5 and the open question in design.md.
