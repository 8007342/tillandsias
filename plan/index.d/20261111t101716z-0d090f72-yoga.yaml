      [2026-11-10T22:41:18Z yoga] 2026-11-10T22:41:18Z yoga BLOCKS LICENCE RECORDS. The operator approved the Demucs weights licence on 2026-11-10 (non-commercial, gated per project; relayed by macuahuitl-fedora). The signed acknowledgement can't be produced, because no Linux host can enrol an approval key. Trunk @957d75fd4 checked: licence_consent::Verifier::for_host reads <state dir>/approvals/allowed_signers, and nothing on Linux writes it; there is no tillandsias approval or enrol subcommand. tasks.md sections 1 and 2 are all unchecked. This row and its dependency 1879-5jkt block 2068-cqis (the real-weights Demucs arms) and the 4 CorridorKey seed acknowledgements. Possible interim path, the operator's call and not taken: the macOS tray already has --approval-enrol <slug> and --approval-sign <slug> <statement> (1886-hf9j, landed 10183b92b). Adding that Mac's allowed-signers line on the verifying host would let accept-licence step 3 use Touch ID. 1886-hf9j's row still reads ready / "Nothing is done" although its code landed.

      [2026-11-11T10:17:16Z yoga] 2026-11-11T10:17:15Z yoga OPERATOR RULING 2026-11-11 (relayed by macuahuitl-fedora): option (a). Linux approval keys are FIDO2 only (ssh-keygen -t ed25519-sk -O verify-required), with NO software fallback: no polkit action, no Vault-sealed software key, no software-password strength on Linux. Until the operator has a security key, Linux approvals are signed on the Mac with Touch ID (1886-hf9j --approval-sign); that key's allowed_signers line is already on macuahuitl. With no authenticator present, enrolment and request refuse with a named message pointing at Mac signing. The polkit arms of this row's exit criterion ("software-password", "polkit stubbed to allow/deny") are retired by this ruling. Why: polkit reads actions only from /usr/share/polkit-1/actions, read-only on Silverblue, so org.tillandsias.approve can't be installed without layering. Being built on yoga as work/1880-9wpd, stacked on #1085 (1879-5jkt), which removes the broker's polkit path in the same change.
