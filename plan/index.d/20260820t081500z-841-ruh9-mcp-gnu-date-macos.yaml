        back to `down:project-info` (exit 1). Restored -> ok:experts-healthy.
        So the helper is load-bearing, and the probe genuinely discriminates.

        PROCESS NOTE WORTH KEEPING. My first attempt to rewrite the four call
        sites used `perl -0pi -e` with `$(mcp_now_ms)` in the replacement.
        Perl expanded `$(` as its GID variable and wrote
        `_mcp_t0=20 20 12 61 79 ...` into the file, producing a syntax error at
        a DIFFERENT line than the bug I was fixing. Caught immediately because
        the next verification run failed for the wrong reason; both files were
        restored from HEAD (cycle-owned edits, tree verified clean at cycle
        start) and redone with exact-match edits. A rewrite tool whose
        replacement syntax collides with the target language's syntax is a
        hazard on its own.
