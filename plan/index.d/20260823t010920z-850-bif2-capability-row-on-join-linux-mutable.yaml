      summary: >
        THIS FRAGMENT WAS FIRST WRITTEN THROUGH AN UNQUOTED HEREDOC AND THE
        SHELL EXECUTED ITS BACKTICKS. Two spans became "command not found" and
        a third ran lspci -mm, dumping this machine's entire PCI bus — 30-odd
        lines of Thunderbolt, SATA and ISA bridge inventory — into the middle
        of a packet about capability rows. Caught before push only because
        ./build.sh --check refused the tree.

        Recording it because the failure mode generalises past my typo: a
        ledger fragment is APPEND-ONLY and IMMUTABLE once written, and writing
        one with an unquoted heredoc makes arbitrary command output land in a
        record nothing is supposed to rewrite. Every fragment written by a
        shell heredoc should use a QUOTED delimiter and substitute timestamps
        afterwards, never interpolate the document.
