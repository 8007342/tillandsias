    title: |
      The smoke runbook's ledger-row awk (§0.2 and §0.2b) is dead in two regimes measured the same night: the skill runtime substitutes its `$0`, and gawk 5.4.0 collapses its escapes into an unbalanced paren.
    context: |
      TWO HOSTS, ONE NIGHT, ONE BLOCK. The ledger-row awk in
      skills/smoke-curl-install-and-test-e2e/SKILL.md (§0.2 and §0.2b, awk at
      lines 79, 86, 106, 113) never found a row on either host that ran the
      v56.9.2.1 smoke on 2026-09-04, and it failed for a DIFFERENT reason on
      each.

      (1) pirria-cachyos — THE SKILL RUNTIME EATS `$0`. The runtime substitutes
      `$0` with the skill's first argument whenever the skill is invoked with
      one, which is exactly how a smoke is invoked (the tag). So awk's `$0`
      arrived as the literal `v56.9.2.1 ~ "^\| " tag`: the ledger-row match at
      line 79/106 and the DISTILLED arm's `split($0, ...)` / `row = $0` at
      lines 86/113 were no-ops. Confirmed on disk by the coordinator.

      (2) esme-windows — GNU Awk 5.4.0 (Git Bash, and most Linux) COLLAPSES THE
      ESCAPES BEFORE THE REGEX EXISTS. gawk strips `\|` and `\(` at
      string-parse time (with a warning) before the dynamic regex is built, so
      the intended `^\| v56.9.2.1( |\()` degrades to `^| v56.9.2.1( |()` — an
      unbalanced paren, which is fatal, not a warning:
        awk: cmd. line:2: warning: escape sequence '\|' treated as plain '|'
        awk: cmd. line:2: fatal: invalid regexp: unbalanced (: /^| v56.9.2.1( |()/

      WHY THIS MATTERS MORE THAN A BROKEN ONE-LINER. §0.2b is the step order
      380 added so a run is AIMED at what the release CLAIMS to have fixed;
      as written it kills the runbook on the way in on every host — silently
      (regime 1) or fatally (regime 2). Both hosts worked around it by hand
      with `grep -nE "^\| v56\.9\.2\.1( |\()" README.md` and found the real
      per-release row (README.md:114 on esme). A step that only works when
      the agent ignores it is documentation, not a runbook.

      THE FIX IS SMALL AND HAS THREE PARTS. (a) No `$<digit>` in any skill
      body the runtime substitutes: awk uses a form the substitution cannot
      see, or the block is replaced by the grep form both hosts already used.
      (b) The regex is built without shell/awk double-escaping: pass the tag
      with `-v` and match with index/substr, or use the grep form. (c) A
      check refuses a skill body containing `$<digit>`, so the shape cannot
      return. Note for whoever takes it: the same grep finds `$1` in
      skills/advance-work-from-plan/SKILL.md:398-402 (a yamlcheck helper) and
      `$0` in skills/merge-to-main-and-release/SKILL.md:506 (prose), so the
      check's scope — and whether those are substituted — has to be decided,
      not assumed.

      Provenance: measured by pirria-cachyos (regime 1) and esme-windows
      (regime 2), relayed by and filed by the coordinator (macuahuitl).
    next_action: |
      Reproduce both regimes before touching the file: run the §0.2 block under
      gawk with SMOKE_TAG=v56.9.2.1 (expect the fatal), then invoke the skill
      with a tag argument and inspect what awk actually received (expect the
      literal substitution). Then replace the block, add the `$<digit>` check,
      and prove the row is found on one Linux host and one Git Bash host.
    exit_criteria:
      - no `$<digit>` remains in any skill body that the runtime substitutes; awk uses a form the substitution cannot see, or the block is the grep form
      - the ledger-row regex is built without shell/awk double-escaping (tag passed with -v plus index/substr, or the grep form); no gawk warning or fatal under GNU Awk 5.4.0
      - a check refuses a skill body containing `$<digit>`, and its scope decision for advance-work-from-plan:398-402 and merge-to-main-and-release:506 is recorded
      - the §0.2/§0.2b block, invoked through the skill with tag v56.9.2.1, prints the real per-release README row on a Linux host and a Git Bash host, and the DISTILLED arm still fires for a compressed tag
    unscoreable: >
      No litmus executes skill bodies with an argument today, so nothing existing
      can observe either regime — the runtime substitution is invisible to a
      static read and the gawk fatal only appears at run time under gawk. Naming
      a litmus that does not exist is the dead-reference failure this fleet
