    order: 834-7ut9
    status: ready
    desired_release: v0.5
    priority: p3
    kind: bug
    title: "48 @trace annotations across 22 files cite 'spec:windows-wsl-runtime', which has no spec; the spec that exists is 'wsl-runtime' and is cited 6 times — the broken name outnumbers the real one 8:1"
    deliverable: "every trace resolves to a real spec, or the intended spec exists under the cited name; the checker's advisory status is decided deliberately either way"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [openspec, ci-gates, fail-loud]
    estimated_hours: 2
    context: |
      SURFACED 2026-08-19 by the commit hook while committing unrelated work in
      crates/tillandsias-podman. It printed four ✗ lines:

        ✗ OpenSpec: ghost trace 'spec:windows-wsl-runtime' in
          crates/tillandsias-podman/src/lib.rs:{1,27,46,57} — no spec exists

      followed by "OpenSpec: 10 notice(s) — not blocking commit".

      MEASURED across the tree:

        grep -rho 'spec:windows-wsl-runtime' -> 48 occurrences in 22 files
        grep -rho 'spec:wsl-runtime'         ->  6 occurrences
        openspec/specs/wsl-runtime/spec.md   ->  EXISTS
        openspec/specs/windows-wsl-runtime/  ->  does not exist

      So the name that resolves to nothing is EIGHT TIMES more common than the
      name that resolves. The 22 files are not a corner of the tree either —
      they include crates/tillandsias-podman/src/{lib,client}.rs,
      images/default/lib-common.sh, six forge/terminal entrypoints, and
      images/git/post-receive-hook.sh.

      TWO READINGS, and the packet should establish which before editing
      anything. Either the annotations are a stale name for openspec/specs/
      wsl-runtime and should be rewritten to match, or `windows-wsl-runtime`
      was a real spec that was renamed or dropped and the 6 `wsl-runtime`
      citations are the anomaly. `git log` on the spec directory decides it;
      do not guess from the majority, since the majority is the broken form.

      WHY THIS SURVIVED, which is the more interesting half and the reason it
      is filed rather than quietly fixed: the checker WORKS. It names the
      ghost, the file and the line, and it has presumably been doing so on
      every commit that touches one of those 22 files. It just does not block,
      so the signal is printed into a scroll-back nobody diffs. That is the
      "advisory-only guard" case the meta-orchestration Reduction Engine names
      explicitly — a guard only an attentive agent honors is a suggestion, not
      a constraint.

      Note the asymmetry with local-ci: `spec-code-drift` is a TRACKED,
      failing check there (log_fail_tracked, scripts/local-ci.sh:906), so the
      same defect class is a gate in one lane and a notice in another. Whether
      that is intentional staging or drift is part of this packet. If the
      commit-hook notice is meant to stay advisory, say so where it prints;
      48 accumulated instances is what "advisory" actually costs, and that
      number is the argument either way.

      SCOPE NOTE: the fix is a rename across 22 files, which is mechanical but
      touches shell entrypoints and a git hook — worth its own commit with the
      drift check run before and after, not a drive-by inside another change.
