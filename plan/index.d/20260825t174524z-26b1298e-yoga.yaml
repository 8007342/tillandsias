      summary: >
        ONE OF THE THREE EXIT OPTIONS IS ALREADY REFUTED, MEASURED IN THE SAME CYCLE THE PACKET WAS FILED. Recording it immediately so nobody spends a cycle building it.  "Honour owner_host in the selector" does not work. Measured distribution across the ledger: 45 carriers out of 596 packets (7.5% coverage) — 21 linux, 18 any, 6 windows, and ZERO macos.  Three independent reasons that kills the option:   1. NONE of the four packets in the measured batch carries owner_host at all, so honouring it would not have prevented a single one of the five cycles this packet is about.   2. There is no macos value anywhere in the field, and macOS is precisely the lane the stuck remainders belong to. A routing field that cannot express the answer cannot be the answer.   3. Honouring a field written while nothing read it is actively unsafe. Those 6 windows values were recorded by hosts who had no feedback about their effect, and switching them on would immediately hide work from other lanes on the strength of metadata nobody has ever validated. That is how a routing change starves a pool.  So the live options narrow to two. DECAY pickup_role as slices land — a real behaviour change, because whoever lands a slice must then narrow the field, and the narrowing is a claim about the world so it needs an event. Or the operator decides lane-steering stays manual, in which case owner_host should be DELETED or explicitly documented as advisory rather than left sitting there. An inert field that looks like routing metadata is a trap, and 45 packets worth of writes went into it believing it steered something.  NOT DECIDING THIS UNILATERALLY, and that is deliberate. Narrowing pickup_role changes what every host in the fleet is offered. I have five cycles of evidence about ONE host's experience of it, which is enough to establish the defect and not enough to choose the fleet-wide remedy. The exit criteria already require the choice to be recorded; this note removes the option measurement refutes and leaves the two that survive.
