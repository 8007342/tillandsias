packets:
  - packet_id: guest-command-carries-the-hosts-home
    order: 1002-9xmb
    status: completed
    desired_release: v0.5
    priority: p1
    kind: bug
    title: the macOS tray expanded ${HOME} on the HOST and sent the result to the GUEST to create — and the wrong path succeeds, so nothing ever reported it
    deliverable: a distinct accessor for the unexpanded template, the tray preamble using it, and a test that reads the emitted string for the host's own HOME
    depends_on: []
    pickup_role: macos
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - macos
      - rust
      - ca
      - fail-loud
    estimated_hours: 2
    context: |
      FOUND while re-running the guest CA check 998-3z6g asked macbook-macos
      for. The carry task was five minutes of confirmation; it turned up a
      defect in the change it was confirming.

      998-3z6g made images/default/ca-path.txt a TEMPLATE,
      `${HOME}/.local/state/tillandsias/ca`, with each reader expanding it.
      tillandsias_core::ca_path::ca_dir() expands from `std::env::var("HOME")`
      — the CALLING PROCESS's home.

      crates/tillandsias-macos-tray/src/diagnose.rs proxy_exec_preamble() calls
      it. That function composes a shell string ON THE MAC and hands it to the
      LINUX GUEST to execute, and the string's own first statement is
      `export HOME=/root`. So the expansion happened in the wrong filesystem:

        HOST HOME                    = /Users/tlatoani
        ca_dir() as the tray computes it
                                     = /Users/tlatoani/.local/state/tillandsias/ca
        emitted to the guest, which then sets HOME=/root and creates THAT.

      AND THE WRONG PATH SUCCEEDS. Measured in a live guest 2026-09-04 via
      --exec-guest, running both candidates through the preamble's actual CA
      block:

        ca_dir=/root/.local/state/tillandsias/ca
          rc=0 key=present crt=present perms=600 owner=root
        ca_dir=/Users/tlatoani/.local/state/tillandsias/ca
          rc=0 key=present crt=present perms=600 owner=root

      Identical. The guest runs as root, so mkdir -p happily creates a
      /Users/tlatoani tree inside the guest, openssl writes the key into it,
      and the permissions are correct. There is no failure for a probe, a gate,
      an operator, or a log line to notice — the CA simply lives at a
      per-developer path that varies by whose Mac built the command. THAT is
      why this is filed rather than fixed silently: the class is a silent
      success, which is the exact shape the fail-loud milestone exists to
      remove, and it survived a change whose entire subject was this path.

      WHY THE EXISTING TESTS WERE BLIND. crates/tillandsias-macos-tray asserts
      the preamble contains `chmod 600 {ca_dir()}/intermediate.key`. Both sides
      of that comparison call the same function in the same process, so it
      agrees with itself no matter which filesystem the string is destined for.
      A test can only catch this by looking for the HOST's home in a string
      meant for the guest, which is what the new one does.

      NOT A DEFECT IN 998-3z6g's DECISION. A HOME-relative path is still the
      only candidate measured to serve both a rootless Linux host and the
      guest. The defect is that one caller emits across a filesystem boundary
      and needed a different accessor, which the single-expander contract did
      not anticipate.

      SECOND, INDEPENDENT DEFECT FOUND IN THE SAME FILE, fixed here because it
      makes the first one's tests trustworthy: ca_path's three tests each called
      `unsafe { std::env::set_var("HOME", ...) }`. HOME is process-global and
      cargo runs tests concurrently in one process, so they raced.
      `rust_and_shell_expand_to_the_same_path` FAILED on every full-suite run at
      osx-next 724691251 — before any change of mine — reading `/home/probe`,
      the other test's value, against its own `/home/agreement-probe`. Verified
      by stashing: 3/3 full-suite runs failed at HEAD, 3/3 pass after.
      `./build.sh --check` is green on that tree, so the gate does not run
      `cargo test -p tillandsias-core` — a broken test sat on the trunk
      invisible to the gate, which is worth someone's attention beyond this
      packet.
    unscoreable: |
      The pin exists and is mechanical — it is just not a shape this gate reads.
      `the_preamble_never_bakes_in_the_hosts_home` (crates/tillandsias-macos-tray/
      src/diagnose.rs) asserts the emitted preamble carries no host HOME and that
      the HOME export precedes the first use, and it was mutation-controlled:
      reverting ca_dir_template() -> ca_dir() turns it and the sibling preamble
      test red. It cannot be a litmus, because the string only exists inside a
      cfg(target_os="macos") Rust function — a shell litmus off Darwin would read
      a stub. Recording this rather than inventing a script wrapper whose only
      purpose is to satisfy the grammar; the accepted forms are litmus: and
      scripts/*.sh, and 'a cargo test with a mutation control' is a fourth kind
      of real pin that 977-448j may want to admit.
    verifiable_closure: 'proxy_exec_preamble emits the unexpanded ${HOME} template with the export preceding it, no string destined for the guest contains the host HOME, and reverting the accessor turns the guard red (mutation control run)'
    evidence:
      - 'live guest 2026-09-04: both /root/... and /Users/tlatoani/... give rc=0 key=present perms=600 owner=root — the wrong path is indistinguishable from the right one'
      - 'ca_dir() on this host = /Users/tlatoani/.local/state/tillandsias/ca; with HOME unset = /.local/state/tillandsias/ca'
      - 'mutation control: reverting ca_dir_template() -> ca_dir() fails both preamble tests'
      - 'tillandsias-core 201 passed x3 runs (was 200 passed / 1 failed x3 at HEAD before the change)'
      - 'tillandsias-macos-tray 116 passed, 2 ignored'
    events:
      - type: completed
        ts: "2026-09-04T07:00:00Z"
        agent_id: "macos-tlatoanis-macbook-air-claude-20260904t063447z"
        host: macos
        summary: |
          Filed and fixed in one cycle because the finding and the fix are the
          same two lines, and leaving a silently-wrong CA path on the trunk to
          be claimed later is worse than the coordination cost of touching
          tillandsias-core.

          THE FIX: ca_path::ca_dir_template() — a distinct public accessor for
          the UNEXPANDED template, documented as the one to use when composing
          a command for another filesystem. proxy_exec_preamble uses it, so the
          guest shell expands ${HOME} itself, standing in the filesystem the
          path actually names. The preamble already exports HOME=/root as its
          first statement, so the expander is in place before the first use —
          asserted, because an empty HOME there would yield /.local/state/...
          at the filesystem root, which being root would ALSO succeed.

          NOTE FOR yoga (998-qrwu/998-3z6g author) — this widens your contract
          rather than contradicting it. "One declaration, expanded by each
          reader" still holds; what is added is that a reader emitting a command
          for a different filesystem is not the expander, and the manifest's own
          header should probably say so.
