      summary: >
        TWO FOLLOW-UPS FROM THE SAME AUDIT, one a fix and one a CORRECTION TO THE AUDIT ITSELF.  1. FIXED — litmus-mount-cleanup's rollback destroyed the forge build cache. Its `on_failure` command ran `podman system prune --volumes -f`, which prunes every volume with no running container attached. That includes tillandsias-forge-cache-tillandsias, the forge's persistent CARGO_TARGET_DIR (lib-common.sh:1520), which is unattached BY DESIGN because the forge container is --rm and the cache is the thing meant to outlive it. So a rollback whose stated job is unmounting stale mounts would silently delete the entire forge build cache — on the failure path, where someone is already debugging something else. Now scoped to removing containers by this suite's own label; volumes untouched, because this test creates none. A rollback must not be able to destroy more than the test created.  2. CORRECTION — THE AUDIT OVERSTATED THIS ONE AND I AM RECORDING THAT RATHER THAN INHERITING IT. The finding claimed methodology.yaml:540 "prescribes prune in the daily lane", implying the DAILY MAINTENANCE path destroys the forge cache. Verified: line 540 prescribes `podman image prune of superseded versioned images`. Image prune does not touch volumes. There is no `--volumes` prescription anywhere in methodology.yaml — grep for 'prune' returns exactly that one line.  So the hazard was real but confined to ONE litmus test's rollback, not to prescribed daily maintenance. The audit conflated `podman image prune` with `podman system prune --volumes`, which are different commands with different blast radii.  That is the finding my own skeptic pass was supposed to kill and did not — an adversarial stage is not a guarantee, and a finding that survives it is still an inference until someone reads the cited line. I am noting it here because the audit's other findings are being acted on, and a reader should know the batch contained at least one overstatement.  3. VALIDATION, unrelated to the above but measured this cycle. Audit finding #5 said the cross-target gate is skipped on the integration/release host because x86_64-w64-mingw32-gcc is absent. That is now FIXED as a side effect of the capability-gate change (ee371c921):      host:    x86_64-w64-mingw32-gcc ABSENT   -> skip:cross-target:no-c-toolchain     toolbox: x86_64-w64-mingw32-gcc present  -> ok:cross-target:x86_64-pc-windows-gnu  Since ./build.sh now re-execs into the tillandsias-builder toolbox on this host, --check runs the gate for real instead of skipping it. The release coordinator had been skipping the gate written to catch cfg-gated breaks invisible to the introducing host.
