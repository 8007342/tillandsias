      a refusing gate-steps.d step is recorded and the scheduler (serial, pool, lanes) carries on; an inline
      section's nonzero exit in the gate's own process is recorded against the current _step and execution
      continues; prerequisite phases (Building ..., Running clippy, the debug-binary build) stay fatal and are named;
      at the end red-steps:<n> plus one red-step:<name>:rc=<n> line each, exit 1, no stamp. LIMIT: under set -e a bare
