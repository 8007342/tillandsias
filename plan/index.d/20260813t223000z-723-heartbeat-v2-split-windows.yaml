packets:
  - packet_id: pty-blocked-on-input-probe
    order: 723-54zj
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    kind: feat
    title: "A guest-side probe that answers whether a PTY session's foreground process is blocked reading the terminal"
    deliverable: "a probe fn in tillandsias-headless with tests against real blocked/running/exited processes"
    pickup_role: any
    capability_tags: [control-wire, pty, guest, linux, fail-loud]
    estimated_hours: 3
    context: |
      Rung 1 of 3 splitting item (b) of 689-y2my, which two consecutive cycles
      recorded as "does not fit one recurring-loop cycle" and neither split. A
      packet that is deferred twice for size is asking to be reduced, not
      attempted a third time.

      WHY ITEM (b) IS THE VALUABLE HALF, restated from 689-y2my so this rung
      stands alone. The macOS scope correction refuted the original progress
      deadline: a deadlock and a slow-but-healthy command are indistinguishable
      BY TIMING ALONE — a first-run --github-login legitimately sits silent for
      ~1290s loading a 580MB image — so no timing rule can separate them. Item
      (a) shipped a 4h wall-clock ceiling, which buys termination and nothing
      else. Item (b) removes the ambiguity instead of bounding it: a guest that
      is blocked on INPUT can say so, and "working" becomes exactly
      distinguishable from "waiting for me" rather than guessed from elapsed
      time.

      THIS RUNG IS THE MEASUREMENT ONLY. No wire change, no host change, no
      capability negotiation — those are rungs 2 and 3. It is separable because
      the hard part is local and empirical: deciding what "blocked on input"
      means on a Linux guest and proving the answer is right.

      There is precedent to build on rather than invent:
      crates/tillandsias-headless/src/main.rs:176 `terminal_foreground_pgrp()`
      already uses `tcgetpgrp` to ask a terminal for its foreground process
      group. The session's PTY master fd is the natural handle, and
      /proc/<pid>/stat + /proc/<pid>/wchan carry the state the answer needs.

      KNOWN TRAP, name it before implementing: wchan is not universally
      readable — some kernels return an empty string or refuse it — so the probe
      must have a third answer. "I cannot tell" is a legitimate verdict and must
      be distinguishable from "not blocked", because rung 3 will treat the two
      differently: unknown means fall back to today's behaviour, not-blocked
      means the guest is working.
    outcome: |
      The guest can answer, for one PTY session, whether its foreground process
      is blocked reading the terminal — or say it cannot tell — with the answer
      proven against real processes rather than asserted.
    exit_criteria:
      - "A probe takes a session's PTY handle and returns a three-valued verdict: blocked-on-input, not-blocked, or unknown. The third value is required, not an error case."
      - "Tests drive REAL processes on a Linux host: one blocked reading stdin (blocked), one busy or sleeping without reading (not-blocked), one exited (not-blocked or unknown, never blocked). Assert the verdict, not the mechanism."
      - "NEGATIVE CONTROL: a process that is merely SLOW and produces no output for longer than the heartbeat interval must NOT report blocked — that is precisely the legitimate case order 332 protects, and a probe that calls it blocked would resurrect the refuted progress deadline by another route."
      - "Non-Linux builds compile: the probe returns unknown rather than failing to build, since the crate is built on every host."

  - packet_id: pty-heartbeat-v2-carries-blocked-state
    order: 723-2yb3
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    depends_on: [pty-blocked-on-input-probe]
    kind: feat
    title: "CAP_PTY_HEARTBEAT_V2: the heartbeat carries the probe's verdict, and a version-skewed guest keeps working"
    deliverable: "control-wire capability + envelope shape + negotiation on both ends"
    pickup_role: any
    capability_tags: [control-wire, protocol, versioning, compatibility]
    estimated_hours: 3
    context: |
      Rung 2 of 3. The wire change, isolated from both the measurement (rung 1)
      and the behaviour that consumes it (rung 3).

      Today the heartbeat is an EMPTY PtyData{ToHost} frame
      (pty_handler.rs:638) sent every 30s on the session id. It carries no
      information by construction — which is what made the 70-minute wedge
      unreadable — and it is indistinguishable from ordinary output at the host,
      because it lands in the same PtyData arm.

      COMPATIBILITY IS THE PACKET, not an afterthought. Four combinations have
      to keep working, and the two mixed ones are the reason this is its own
      rung: v1 host + v1 guest (unchanged), v2 + v2 (the new signal), v2 host +
      v1 guest (empty heartbeats, degrade to today's behaviour), v1 host + v2
      guest (a v2 frame must not confuse a host that never asked for it). The
      existing negotiation at vsock_server.rs:45 and vsock_exec.rs already has
      the shape to copy — CAP_PTY_HEARTBEAT_V1 is advertised and checked — so
      this extends a working pattern rather than inventing one.
    exit_criteria:
      - "CAP_PTY_HEARTBEAT_V2 is advertised and negotiated; a guest only emits v2 heartbeats when the host asked for them."
      - "The v2 heartbeat carries the three-valued verdict from rung 1 and remains distinguishable from real guest output at the host."
      - "All four version combinations are tested, including BOTH mixed ones. A version-skewed pair must degrade to v1 behaviour, never wedge and never error."
      - "The two order-332 pins still pass untouched: streaming_exec_heartbeats_survive_total_silence_beyond_idle_deadline and streaming_exec_times_out_when_slow_guest_sends_no_frames."

  - packet_id: exec-client-distinguishes-waiting-from-working
    order: 723-g4bk
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    depends_on: [pty-heartbeat-v2-carries-blocked-state]
    kind: feat
    title: "The host says 'the guest is waiting for input I am not sending' instead of leaving the operator to guess"
    deliverable: "vsock_exec client behaviour + the operator-visible message"
    pickup_role: any
    capability_tags: [control-wire, exec, fail-loud, operator-experience]
    estimated_hours: 3
    context: |
      Rung 3 of 3 — the payoff, and the rung that must be careful not to
      reintroduce what 689-y2my's criterion 1 got refuted for.

      The wedge that started this was a host waiting for a prompt the guest
      would never print, for 70 minutes, while every layer looked healthy: the
      wire alive, the guest kernel answering ping, the vCPUs idle. Item (a)
      bounded it at 4h. This rung makes it CORRECT: a guest blocked on input
      with a host that has nothing pending to send is a deadlock the moment it
      is observed, and can be reported as one immediately rather than waited out.

      THE LINE NOT TO CROSS: blocked-on-input is the ONLY new failure signal.
      Not-blocked and unknown must both keep today's behaviour exactly — a slow
      guest loading a 580MB image is working, and the moment this rung starts
      treating quiet as suspicious it has resurrected the refuted progress
      deadline wearing a new name.
    exit_criteria:
      - "With a v2 guest reporting blocked-on-input and no pending host input, the exec fails fast and names the pending expect label, the bytes seen, and that the guest is waiting for input — distinguishable in the message from both a stale wire and a ceiling breach."
      - "NEGATIVE CONTROL: a guest reporting not-blocked, and a guest reporting unknown, are both treated exactly as today — a slow-but-progressing guest is never killed. This is the order-332 invariant and the refuted criterion 1; assert it explicitly."
      - "A regression test drives a fake guest through the wedge that filed 689-y2my — heartbeating forever, blocked on a prompt the host will not answer — and asserts it is reported within the heartbeat interval rather than at the 4h ceiling."
