      - 'NEGATIVE CONTROL: a real wrapper that genuinely forgot to assert still gets no-host-side-assertion / caller-contract — the new cause must not become a bucket that swallows wiring bugs, which is the collapse 1140-i6ct exists to prevent'
      - 'NEGATIVE CONTROL: build.sh must NOT begin asserting --host-side on a no-dispatch host. A fixture pins that no vacuous clean verdict is produced there, because 1141-vf9w''s promotion criterion would consume it'
