packets:
  - packet_id: dialect-gate-reports-clean-when-it-scanned-nothing
    order: 813-9n54
    status: completed
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "check-bash-dialect.sh printed ok:bash-dialect-clean when TILLANDSIAS_DIALECT_SCAN_DIR named a FILE or a path that does not exist — zero files judged, read as zero problems"
    deliverable: "a scan that considered nothing is refused, and a single file is a legitimate scan target"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [fail-loud, ci-gates, portability]
    estimated_hours: 1
    context: |
      OBSERVED 2026-08-18 while giving litmus:enclave-service-health-shape a
      dialect step scoped to the one script it pins. The natural spelling —
      `TILLANDSIAS_DIALECT_SCAN_DIR=scripts/check-enclave-service-health.sh` —
      returned `ok:bash-dialect-clean`, rc=0.

      It was not judging the file. Enumeration is
      `for _c in "$SCAN_DIR"/*.sh "$SCAN_DIR"/*/*.sh`, so a FILE makes both
      globs match nothing, SCAN_FILES stays empty, the judging loop never
      iterates, and the script falls through to its success line.

      MEASURED, because "it probably scanned nothing" is a guess and this
      project does not accept guesses as evidence: a copy of the same script
      with `${v^^}` and `declare -A m` appended — two constructs bash 3.2
      cannot parse, exactly what the gate exists to refuse — also returned
      `ok:bash-dialect-clean`, rc=0.

      THE WIDER FAULT IS THE TYPO, not the file form. Any SCAN_DIR that does
      not resolve produces the same confident green: a renamed directory, a
      caller relocated one level down, `images/prxy`. The gate is wired into
      `./build.sh --check`, so this is a green in the release path.

      Same family as everything else in this milestone, and the same shape as
      797-8dzt (an assertion that could not fail) and 812-d45t (a fold that
      dropped work in silence): the answer was not missing, it was wrong, and
      wrong in the direction that reads as success.

      NOT A DRIVE-BY GENERALISATION. The sibling callers were checked: the two
      supervision litmus tests pass DIRECTORIES (`images/proxy`,
      `images/default`) and were never affected. The bug reached exactly one
      spelling nobody had used yet — which is why it survived.
