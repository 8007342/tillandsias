      host: linux_mutable
      summary: |
        THE CORPSE THAT MOTIVATED THIS PACKET IS NOT A SERVICE, and finding
        that out changed the design.

        `tillandsias-nix`, Exited(143) since 2026-08-14, is a hand-made
        `registry.fedoraproject.org/fedora-toolbox:44` container from an
        operator nix experiment. Nothing in the tree references it by name. The
        correct action is removal, not restart — and I did not remove it,
        because it is operator property and this cycle did not ask.

        That nearly became a filter. Product-built containers carry
        `io.tillandsias.image.name=<role>`; keying the SET on that label would
        have dropped the toolbox and made the report tidy. It would also have
        dropped `tillandsias-nix-cache` — running, real, part of last night's
        nix-cache work, and unlabelled because it is built outside the product
        image path. A reporter that hides a live service from the one place
        that lists live services is worse than one that lists a leftover, so
        `origin=product-<role>|unlabelled` is an ANNOTATION beside every entry
        and the set stays the inclusive name prefix. Pinned by scenario 3b,
        which requires BOTH to be reported.

        A SECOND THING FELL OUT OF THAT MEASUREMENT, recorded here rather than
        acted on: `tillandsias-nix-cache` carries no `io.tillandsias.*` label
        at all, so nothing downstream can tell it apart from a hand-made
        container. Whoever finishes the nix-cache work should label it.

        WHAT THE FIXTURE COST, twice, both self-inflicted and both caught by a
        control failing when it had to pass:

        1. The no-podman scenario ran with PATH=/usr/bin:/bin, found the REAL
           podman, and reported the live host — a scenario "passing" against
           production state. Fixed with a tools-only PATH; then it returned
           empty output, because with PATH stripped to that dir `bash` itself
           is unresolvable and the run silently produced nothing. Absolute
           interpreter. This is the same trap that cost a sibling a fixture on
           798-c4mq the same night: the harness, not the code.

        2. The mutation control asserted the ABSENCE of "health=stale-healthy"
           from the mutant's output. The mutant still prints it — inside the
           guard's own explanatory NOTE, which the deleted line does not gate.
           Third instance this cycle of a checker whose subject includes the
           checker (797-8dzt's split bound, the litmus pin slice, now this).
           Rewritten to assert the POSITIVE fact: the mutant emits
           `:health=healthy`, podman's word passed through unlabelled.
