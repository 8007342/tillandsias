    title: |
      the zero-dependency promise (QEMU removed in cadbd0e57) has no guard: a new Command::new("qemu-img") or a bare-name non-stock binary on the macOS install/provision path would ship silently, masked on developer Macs that have Homebrew
    verifiable_closure: |
      a litmus lint over scripts/install-macos.sh and the macOS tray/vm-layer provisioning code refuses any external command that is not an absolute stock-macOS path (allowlist: /usr/bin, /bin, /usr/sbin, /sbin, /System); bare hdiutil becomes /usr/bin/hdiutil; mutation (adding Command::new("qemu-img")) turns it red; pre-fix result: FAILS (bare hdiutil).
    context: |
      Research 2026-09-27 verified no QEMU/non-stock dependency on trunk or stable v56.9.25.2 (by reading code and tag
      ancestry, not by a clean-machine run). A developer Mac has /opt/homebrew on PATH, so a regression cannot be seen
      there; the tray's GUI PATH is /usr/bin:/bin:/usr/sbin:/sbin. Only bare-name call found: hdiutil (vz.rs:772).
    exit_criteria:
      - 'lint red on an added non-stock command; hdiutil absolute; pre-fix result: FAILS'
