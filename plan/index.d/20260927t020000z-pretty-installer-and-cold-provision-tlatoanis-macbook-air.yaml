packets:
  - packet_id: macos-provisioning-failure-is-one-opaque-red-chip-with-no-persisted-log-so-a-user-in-the-wild-cannot-say-which-stage-failed
    order: 1420-inak
    status: ready
    kind: defect
    priority: p1
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    pickup_role: macos
    capability_tags: [macos, provisioning, diagnostics, fail-loud]
    estimated_hours: 4
    observed_by: tlatoanis-macbook-air
    unscoreable: |
      unpinnable-until-measured: the deliverable is a persisted log plus stage-named chip; the fault-injection fixture lands with it.
    title: |
      a clean-Mac first provision that fails shows only "Provisioning error" / "failed to provision" — every run_start error (download/SHA, qcow2 expand or disk full, hdiutil, VZ start/entitlement, guest cloud-init via provision.state) feeds one chip, and nothing is written where a user can find it
    verifiable_closure: |
      each injected fault (download SHA mismatch, expand ENOSPC, hdiutil failure, VZ start error, guest provision.state phase failed) produces a DISTINCT chip text naming its stage, and the full error (for the guest: the provision.state line, rc and cmd) is persisted to a log file whose path the chip tooltip / "Open log" names; pre-fix result: FAILS (all five read the same chip text; no persisted log).
    context: |
      OPERATOR REPORT 2026-09-27: the curl installer on a user's clean MacBook installed the previous stable, the tray
      launched, downloaded the ~600 MB Fedora image, then went red "failed to provision"; a retry did not help; NO LOGS
      were obtainable. Research (read-only, origin/linux-next) ruled out the suspected QEMU dependency: qcow2->raw is
      pure Rust since cadbd0e57 (2026-09-03), which is an ancestor of stable v56.9.25.2, v56.9.23.1 and v56.9.19.1, and
      every host binary on the install/provision path is stock macOS. Ranked likely causes (inferred): guest cloud-init
      failure after boot (Fedora mirror / dnf / GitHub releases fetch — first-boot only, so a retry cannot help), disk
      space during the 250 GiB sparse expand, VZ/arch/OS incompatibility, truncated download. Without a stage-named
      error and a persisted log the next field failure will be just as undiagnosable. Error sources: action_host.rs
      ~1568-1595, ~2031, menu_state.rs:514, vz.rs provision.state phase failed (~868).
    exit_criteria:
      - 'five injected faults give five distinct stage-named chip texts; pre-fix result: FAILS'
      - 'the full error is persisted to a user-findable log file named from the tray; pre-fix result: FAILS'
