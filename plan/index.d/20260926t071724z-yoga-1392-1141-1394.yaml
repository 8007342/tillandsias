packets:
  - packet_id: on-windows-a-child-spawned-by-the-plan-binary-inherits-the-cli-stdout-handle-so-a-leaked-grandchild-holds-the-caller-pipe-open
    order: 1394-mdqj
    status: ready
    kind: defect
    priority: p2
    desired_release: v0.5
    pickup_role: windows
    capability_tags: [windows, process-control, plan-binary, lua]
    estimated_hours: 3
    owned_files: [crates/tillandsias-exec]
    observed_by: yolanda
    unscoreable: |
      windows-only-reproduction: the defect is Windows handle inheritance; its pre-fix FAIL can
      only be recorded on a Windows host, and the closure names that host run.
    title: |
      on Windows a child spawned by the plan binary (sh.run / proc.run) inherits the CLI's own inheritable stdout handle, so a leaked grandchild holds the CALLER's pipe open and every  waits for the grandchild, even after the runtime-drop fix
    verifiable_closure: |
      On native Windows, 
      returns within 1 s of after_ms, as the file-redirected form already does (1392-bcby).
      Pre-fix result: FAILS: measured by yolanda 2026-09-26 through a pipe, about 30.4 s on BOTH
      the pre- and post-1392-bcby trees (post run1 30558, run2 30421), while file redirection
      read 745/723 ms post-fix.
    context: |
      Found by yolanda while measuring 1392-bcby. Candidate fixes she named: restrict handle
      inheritance to the child's three stdio handles (PROC_THREAD_ATTRIBUTE_HANDLE_LIST), or run
      the child in a job object so the deadline reaps the grandchild. Linux is unaffected in the
      measured cases (yoga: grouped and setsid-escaped both return at the deadline).
    events:
      - type: filed
        ts: "2026-09-26T07:17:23Z"
        host: yoga
        summary: Filed by yoga from yolanda's 1392-bcby measurement (her words and numbers).
