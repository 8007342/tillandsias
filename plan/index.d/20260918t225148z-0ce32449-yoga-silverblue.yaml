        INDEPENDENTLY VERIFIED ON BOTH HOSTS rather than asserted from one:
          yoga:      all four groundtruth/query-vectors/*.json are 768-dimensional
          lenovinha: their serving index vectors.jsonl is 768-dimensional
        768 is nomic-embed-text. lenovinha checked their own index rather than accept
        "the only valid record on the row" on yoga's say-so, which is the right reflex for
        a claim that elevates one host's record above another's.

        AND THE CONSTRAINT IS TIGHTER THAN "SAME DIMENSION", which matters because the
        obvious fix would not close it. The committed vectors are a BARE LIST of 768
        floats — no model id, no declared dimension, no provenance. 768 is the standard
        BERT-base hidden size, shared by bge-base, gte-base, e5-base and mpnet among
        others. An index built with any OTHER 768-dim model would therefore pass a
        dimension check and still be semantically incommensurable, because the committed
        queries live in nomic's embedding space and nothing records that. That variant is
        HARDER to detect than the one that was caught: it produces plausible, varied
        retrieval instead of the identical-chunk-list signature. So the true constraint is
        not "768 dimensions" but "the model that produced these vectors", and today that
        fact is written down nowhere.

        WHAT WOULD MAKE THE CRITERION REACHABLE — not decided here, since this row's
        holder owns it:
          (a) regenerate the committed query vectors PER MODEL and grade each host
              against vectors produced by its own model, filed as its own row; or
          (b) hold the embed model fixed fleet-wide and vary something the harness can
              actually measure, in which case criterion 6 should be reworded to say so
              rather than left as an unreachable target.
        Option (a) carries a cost worth stating in advance, raised by lenovinha: the
        vectors are COMMITTED artifacts, so per-model vectors means the corpus grows a
        dimension and something must keep each set in sync with the model that produced
        it — the same provenance problem as 1257-jxu9, one layer up.

