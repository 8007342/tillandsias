      summary: |
        WHY THIS TOOK FOUR AND A HALF HOURS, recorded because the delay was the
        useful part and a future coordinator should not read it as dithering.

        The request arrived at 07:10Z and the operator had already authorized
        releases without approval. The gate was red, and the honest position at
        every point was that I could not tell whether the redness was the
        product or the gate. Three root causes were reached and discarded —
        concurrent image builds racing a rename, machine load widening a
        parallel-test race, podman storage contention — and each was plausible
        enough to have acted on. One of them was actively endorsed by the
        runner's own ENV-FAIL line asserting "environmental, not a code
        regression" while podman answered in 0.07s throughout.

        Cutting on "the remaining failures are probably environmental" would
        have been the fourth guess. It would also have been unfalsifiable
        afterwards: releases here are fixed-forward, so a wrong call cannot be
        repaired in place, only superseded.

        The fourth answer was real and small (797-r6tc), and the gate went
        green without a single check being weakened, ignored or downgraded —
        305 executed, 0 failed, and the bare run and the gate now agree on the
        executed set, which they did not before. That agreement is the actual
        deliverable: before this, the gate and every other caller were testing
        different podman substrates and nobody knew.
