    title: |
      Observatorium cannot be launched at all once PR #636 lands: `--observatorium <path>` refuses (positional retirement) and cloud-mode Observatorium already refused (1119-w2rj); make `tillandsias --cloud <owner/repo> --observatorium` work by populating /var/www/source from the project's git mirror (or its ephemeral clone) instead of a host bind mount
    context: |
      PR #636 (776-jcf3, "retire positional launches; cloud is the only
      launch") states in its Removed list: "`--observatorium <path>` refuses,
      so nothing is mounted read-only at /var/www/source. Cloud-mode
      observatorium already refused (1119-w2rj), so Observatorium has no
      working launch now." This packet restores the one remaining form.
      Source of truth for the tree: the per-project git mirror the cloud
      launch already seeds (776-jcf3 2026-10-18 event: "mirror seeded"), or
      the ephemeral clone `--cloud` resolves ("host disk untouched"). No host
      path may be read or mounted — the 2026-08-16 directive and #636's
      refusal stay intact. A read-only checkout (git worktree/clone of the
      mirror's default branch into a volume or tmpfs mounted at
      /var/www/source) is the expected shape; the implementer picks the
      smallest one that keeps Observatorium's container read-only.
      Overlap: 1118-zzs4 migrates the observatorium launch to
      ContainerSpec::build_run_argv(); build the new mount through that
      builder if 1118 has landed, or keep the change local and note it there.
