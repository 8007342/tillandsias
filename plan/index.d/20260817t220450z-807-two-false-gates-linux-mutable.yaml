# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by linux_mutable (macuahuitl), 2026-08-17T22:04:50Z.
#
# Both found by running the destructive e2e's Step 1 (./build.sh --ci-full
# --install) for the first time in days. Both are the same defect class and it
# is the night's recurring one: a checker that measures a DIFFERENT POPULATION
# than the thing it is judging, and reports the difference as a regression.
# Neither was a real product fault; both blocked the gate.
packets:
  - packet_id: guard-activation-audit-cannot-see-through-the-skill-symlinks
    order: 807-d7qw
    status: completed
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "the guard-activation audit used `grep -r` over .claude/skills, which is a symlink farm — so every guard invoked ONLY from a skill was reported 'shipped but never invoked' and failed the gate"
    deliverable: "the audit follows the skill symlinks, and a genuinely uninvoked guard is still caught by name"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [guards, fail-loud, skills, ci]
    estimated_hours: 1
    context: |
      OBSERVED, macuahuitl 2026-08-17, as a --ci-full failure:
        ✗ Orphaned guard(s) found — shipped but never invoked
        guard-activation: total=50 active=49 orphan=1 verdict=orphans-found
        orphans: check-daily-maintenance.sh

      check-daily-maintenance.sh (order 801-qasc, authored on the windows host)
      is referenced TWICE in skills/meta-orchestration/SKILL.md — it is the
      guard that makes that skill's Start-Of-Day gate falsifiable, wired
      exactly where it belongs. The accusation was false.

      MECHANISM: scripts/audit-guard-activation.sh:44 used
      `grep -rl -- "$name" "$s"`, and `.claude/skills` is a directory of
      SYMLINKS by construction — there is one canonical skills/<name>/ and each
      runtime (.claude, .opencode, .codex, .gemini, .github) reaches it through
      a link, which is how the repo keeps one source of truth. `grep -r` does
      not follow symlinks encountered during traversal; `grep -R` does. Proven
      directly:
        grep -rl "check-daily-maintenance.sh" .claude/skills  -> (nothing)
        grep -Rl "check-daily-maintenance.sh" .claude/skills  -> .claude/skills/meta-orchestration/SKILL.md

      So the surface list named `.claude/skills` as an activation surface and
      then read it as empty, forever. Any guard whose only invoker is a skill
      was permanently an orphan.

      WHY IT IS WORSE THAN A MISSING CHECK: a false accusation that BLOCKS a
      gate demands a fix that cannot be made — the remedy it implies is
      "wire this guard", and the guard is already wired. The next person either
      re-wires it somewhere redundant or adds an exception. Both make the tree
      worse to satisfy a checker that was wrong.
  - packet_id: batch-triage-litmus-counted-a-parked-p0-the-selector-refuses
    order: 807-kdg7
    status: completed
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "litmus:cycle-batch-triage-shape compared the batch against a ledger query that ignores dependencies, so a BLOCKED p0 made the selector look like it was hiding urgent work"
    deliverable: "the ledger side of the urgency comparison subtracts parked packets, so the two sides describe the same population"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [litmus, triage, selector, fail-loud]
    estimated_hours: 1
    context: |
      OBSERVED, macuahuitl 2026-08-17, the only litmus FAIL in a 306/307 run:
        [STEP 18/22] URGENCY OVERRIDE: the batch's best priority matches the
        ledger's best ... [FAIL]
        output=FAIL: batch best is p1 while the ledger offers p0

      The step compared `scripts/select-work-batch.sh linux` against
      `query --status ready --claimable-by linux --release v0.5`. The query
      filters by role and release but does NOT evaluate dependencies.

      MEASURED: exactly one p0 satisfied that query — 722-uern
      (mirror-identity-negative-matrix-litmus). Its depends_on is
      [mirror-identity-vault-roles-exact, mirror-identity-per-project-dns,
      mirror-identity-lane-sidecar-and-sshd], and `parked-blocks` reports the
      last of those as status BLOCKED. So the packet cannot be worked, the
      selector correctly omitted it, and the gate called that omission a
      regression.

      This is the failure mode where the CHECK is wrong and the SUBJECT is
      right — the most expensive kind, because the instinct is to "fix" the
      selector, which would mean teaching it to offer work nobody can start.

      FIX: subtract `parked-blocks` from the ledger side before taking the
      minimum, so both sides describe eligible work.

