# Ledger fragment — append-only, IMMUTABLE once written.
# Written by: macos-tlatoanis-macbook-air-fable5-20260812t033314z
#
# CORRECTION TO THE RECORD, for whoever reads 697-sy8w's obsoletion note: it
# credits 698-7n6q to "windows". 698-7n6q was filed and implemented on MACOS
# (commits 02a080d7, d907066c). The same note says the malformed macOS fragment
# "remains inherited debt for removal" — it was already `git rm`'d in 02a080d7,
# before that note was written; the coordinator had simply not merged osx-next
# yet. Neither correction changes any decision; both are recorded so the
# provenance trail is accurate.
packets:

  - packet_id: append-event-cannot-reach-fragment-only-packets
    order: 699-usxc
    status: ready
    desired_release: v0.5
    priority: p2
    title: "append-event refuses any packet that exists only in an uncompacted fragment, so a just-filed packet cannot receive progress until someone compacts"
    kind: bug
    deliverable: append-event resolves against the folded ledger, like status and set-field already do
    depends_on: []
    pickup_role: any
    capability_tags: [plan-tooling, ledger, fold, consistency]
    estimated_hours: 2
    context: >
      Found on macOS 2026-08-12 while trying to record a cross-host
      reconciliation note.
      The fold is supposed to be transparent — "reads fold them transparently,
      the packet is queryable immediately" is the stated contract for filing
      into `plan/index.d/`. It holds for some surfaces and not others:
      `tillandsias-plan status 698-7n6q` resolves the packet correctly, and
      `set-field` writes to it correctly, but
      `tillandsias-plan append-event 698-7n6q ...` fails with
      "error: packet_id 'malformed-fragment-passes-every-gate' not found".
      Reproduced against two different fragment-only packets in the same
      session, one of them not obsoleted, so this is not a status filter.
      CONSEQUENCE. Every newly filed packet is unreachable by append-event until
      a compaction folds it into the base — which happens on no fixed schedule
      and only when `fragments` reports eligible. So the natural workflow "file
      a packet, then record progress on it" silently fails for exactly the
      packets most likely to need it: the ones filed this cycle. The workaround
      is to route through `set-field --reason`, which is a different verb with
      different semantics, or to hand-author another fragment.
      NOTE the asymmetry is the diagnosis: `status` folds, `set-field` folds,
      `append-event` does not. Whatever resolution helper the first two share is
      the one append-event is missing.
    outcome: >
      Every read-write verb resolves a packet the same way, so the fold contract
      holds uniformly instead of per-verb.
    exit_criteria:
      - "append-event resolves a packet declared only in an uncompacted plan/index.d fragment and appends to it"
      - "a test files a packet into a fragment and appends an event to it WITHOUT an intervening compaction"
      - "a NEGATIVE CONTROL asserts append-event still errors on a genuinely unknown packet_id, so the fix cannot degrade into accepting anything"
    events:
      - type: filed
        ts: "2026-08-12T03:33:14Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260812t033314z
        host: macos
        summary: >
          Filed after append-event refused two fragment-only packets that
          status and set-field both resolved fine in the same session.

  - packet_id: landed-malformed-fragment-should-fail-loud-fleet-wide
    order: 699-dycj
    status: ready
    desired_release: v0.5
    priority: p2
    title: "An ALREADY-LANDED malformed fragment is still only a warning — the residual live intent of obsoleted 697-sy8w"
    kind: enhancement
    deliverable: a loud fleet-wide signal for a malformed fragment that is already in the tree, without letting one host's typo red-gate every other host
    depends_on: [malformed-fragment-passes-every-gate]
    pickup_role: any
    capability_tags: [plan-tooling, ledger, fail-loud, fleet]
    estimated_hours: 3
    context: >
      RESCUING A LIVE INTENT FROM AN OBSOLETED PACKET (methodology
      obsolete_mechanism_live_intent).
      697-sy8w was obsoleted 2026-08-12T02:59Z as "SUPERSEDED by 698-7n6q, which
      implemented the identical fix". The fix is not identical, and the
      difference is precisely what the obsoletion drops. 697-sy8w's criterion 1
      was "tillandsias-plan check exits non-zero and names the file when ANY
      fragment does not parse" — fleet-wide. What 698-7n6q shipped is
      DIFF-SCOPED: it refuses only fragments the current change adds.
      That scoping was deliberate, and I still think it is right for the
      author-side gate: failing on any malformed fragment anywhere lets one
      host's typo turn every other host's gate red until someone else fixes it,
      converting a local error into a fleet outage — the same reasoning
      634-39ik used to scope its enforcement the same day.
      But the two are COMPLEMENTARY, not alternatives, and only one shipped.
      Diff-scoped stops the AUTHOR before the push. Nothing yet makes an
      ALREADY-LANDED malformed fragment loud — and once it has landed, the data
      genuinely IS invisible fleet-wide, which is exactly when everyone should
      know. That residual is this packet.
      DESIGN CONSTRAINT for the claimant: do not simply make `check` exit
      non-zero and call it done — re-read why 698 scoped itself first. A
      plausible shape is a distinct, loud, non-gating report (a named line the
      cycle handoff must surface, or a burndown entry) so the signal is
      unmissable without arming every host's push gate against work it did not
      author.
    outcome: >
      A malformed fragment already in the tree is impossible to miss, and no
      host is blocked by another host's mistake.
    exit_criteria:
      - "an already-landed malformed fragment produces a loud, named signal every host sees in its cycle"
      - "that signal does NOT block the push of a host that did not author the fragment, and a test proves an inherited malformed fragment still lets an unrelated change through"
      - "the rationale for choosing report-vs-gate is recorded where the next reader will find it, not just in a commit message"
    events:
      - type: filed
        ts: "2026-08-12T03:33:14Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260812t033314z
        host: macos
        summary: >
          Filed to keep 697-sy8w's broader criterion alive after that packet was
          obsoleted as superseded. The shipped fix covers the author side only;
          the fleet-wide half was never implemented and would otherwise have
          been lost with the packet.
