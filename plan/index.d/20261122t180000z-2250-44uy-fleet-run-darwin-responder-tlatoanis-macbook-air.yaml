  title: 'fleet-run.lua: given a gate step NUMBER and a REF (never a command), run that one step of that tree on this host and answer regime:<platform>:step=<n>:rc=<rc>:sha=<tree>:verdict=<line>'
  context: >-
    Second-regime records have needed the coordinator to relay every ask. Design agreed by macuahuitl-fedora with yolanda (msys): no worktree (operator ruling 2026-10-11).
    `git archive <ref>` goes into target/work/fleet-run/<commit>/, which gets its own git init plus one commit (add -A -f), and that tree must equal <ref>^{tree}.
    The extracted tree is the --gate-steps root, with every other step file removed after the assertion; step paths resolve against the root, so a separate scratch root cannot find the fixture.
    The plan binary is this checkout's release build when crates/, Cargo.toml and Cargo.lock match. Otherwise it is built from the extracted tree into target/work/fleet-run/cargo-target.
    The verdict is the step's last verdict-shaped line between its STEP_DESC line and the door's next [build] line, so housekeeping lines (prune-darwin-stale-objects) never stand in for it.
    MEASURED on darwin: `-- 660 work/2245-pf7x` answers regime:darwin:step=660:rc=0:sha=b65cb2b5c:verdict=ok:rank-refusal-hits:6 arms in 1m49s, including a plan rebuild.
    The script runner's policy denies /bin/sh, so the step lookup is a git pathspec.
