        ONLINE-SEARCH LEG DONE (coordinator, 2026-09-04T15:2xZ) and it settles the mechanism class, not the instance. GitHub's own documentation ("Authorizing OAuth apps", docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps, read 2026-09-04): "There is a limit of ten tokens that are issued per user/application/scope combination", "if an application creates more than ten tokens for the same user and the same scopes, the oldest tokens with the same user/application/scope combination are revoked", and "GitHub Apps don't have the per-user token limit". cli/cli issue #9233: `gh auth login` by an already-logged-in user generates a NEW OAuth token and replaces the local one WITHOUT revoking the old one server-side, so each login adds one to the count; cli/cli #11420: all CLI OAuth logins for an account share one authorization and cannot be revoked per device. So H1 is the documented behaviour: every `gh auth login` on any host, WSL distro, VM guest or forge for account 8007342 with the CLI app's default scopes (gist, read:org, repo, workflow) mints token N+1, and past ten the OLDEST live token dies, on whichever host holds it. MEASURED on macuahuitl: the coordinator's token is ALSO a gho_ token with exactly those scopes, so its immunity is not token type; under H1 it means this host's token is simply never the oldest, which the operator's login history here would explain. Still needed to close criterion 1 (an instance, not a class): the fingerprint test across two hosts, or the security log (oauth_authorization / oauth_access.destroy) which only the operator can read. FIX SHAPE (criterion 3): fine-grained PATs, one per host (independent tokens, no cap, scoped to the repo), or a GitHub App installation token for the fleet; interim, cheapest: stop re-logging in where a token already works, because each login evicts someone. The enclave's Vault-fanned token is a COPY of one bare-metal token and dies with it (affected, not a source). Sources: the GitHub doc above; https://github.com/cli/cli/issues/9233; https://github.com/cli/cli/issues/11420; https://github.com/orgs/community/discussions/24584.
