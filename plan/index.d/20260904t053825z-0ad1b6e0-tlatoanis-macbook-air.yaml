      summary: |
        GUARD LANDED, WIRED INTO THE PRE-PUSH CHAIN AND THE GATE, 6/6 — and the measurement CORRECTS THE PACKET'S THREAT MODEL in a way that makes the risk narrower but nastier.

        I wrote the fixture first, as the packet asked. It builds a real bare remote, a real installed hook, one innocent commit on an old base, and a trunk advanced beneath it. Every arm drives a real git push; none assert on a hand-made ref list.

        THE CORRECTION. The packet says "the OBVIOUS NAIVE VERSION - sleep; git push with no rebase - WOULD HAVE SILENTLY REVERTED A HUNDRED-PLUS FILES the moment the credential recovered". MEASURED: it would not. A plain non-fast-forward push is rejected by GIT ITSELF, and the pre-push hook receives an EMPTY ref list — there is nothing for any hook to judge, because the push never gets that far. My first fixture used a plain push and the guard reported ok:0 refs checked while git did the refusing.

        SO THE DANGEROUS LOOP IS THE FORCED ONE, and this is the part worth carrying: --force-with-lease AFTER A FRESH FETCH SUCCEEDS AND REVERTS THE TRUNK. Measured directly. The lease proves only that the remote has not moved since YOUR FETCH — not that your base is current — so a loop that fetches each iteration REFRESHES the lease and it passes every time. The more careful the loop looks, the more reliably it reverts. A bare --force is equally lethal and at least looks it; --force-with-lease is the trap, because it is precisely the flag one reaches for to avoid clobbering concurrent work.

        That does not weaken the packet, it sharpens it: the guard is the only thing standing in front of a forced push, since git's own protection is exactly what a force flag turns off.

        WHAT THE GUARD DOES. For each ref: touched = paths the OUTGOING COMMITS themselves changed (git log --name-only over remote..local); deleted = paths the PUSH'S DIFF removes; violation = deleted MINUS touched. A deletion a commit actually made appears in both and passes. A deletion that exists only because the base is stale appears in deleted and never in touched, because no outgoing commit ever mentioned that file. The guard never needs to know what "stale" means.

        EXIT CRITERIA, against the tree:
        1. REFUSED regardless of invocation — verified for --force and --force-with-lease. For a plain push the refusal comes from git, earlier, which I state rather than claim as the guard's doing.
        2. NAMES THE FILES — the refusal lists them (first 20, then a count), verified by the fixture grepping for the specific trunk files rather than for a number.
        3. VERIFIED BY CONSTRUCTION, not reasoning — real remote, real hook, real push; and the SAME COMMIT REBASED IS ACCEPTED, which is the arm that stops a guard that refuses everything from passing.
        4. --no-verify CONSIDERED EXPLICITLY: it bypasses this, and that is stated in the refusal text itself. Git offers no unskippable hook, so claiming otherwise would be false comfort. What --no-verify cannot do is make the revert SILENT — the refusal names the files first, so an override is a choice to revert work that was listed, not an absence of warning. That matters because every attempt in esme's observed case used --no-verify legitimately.
        5. THE RETRY LOOP is deferred to the gate DELIBERATELY, which is esme's own judgement and I agree with it: advice only protects whoever remembers it, and a blocked host writing a retry loop at 4am is precisely who will not.

        TWO ARMS THAT ARE NOT ABOUT THE HAPPY PATH: a deliberate deletion the commit itself made is ACCEPTED (or the guard blocks ordinary work), and a BRAND-NEW REMOTE REF IS NEVER BLOCKED — that is the salvage path (872-c9nd), which exists to rescue work from exactly the wedged host this guard is about, and blocking it would be the worst possible failure.

        ONE THING MY OWN CHANGE BROKE AND THE FLEET'S FIXTURE CAUGHT: adding a fifth required hook made install-hooks.sh hard-fail in test-forge-project-guard-hooks.sh, whose synthetic repo stages an explicit list of hook scripts. That is the fixture doing its job — I added a hard dependency without updating the enumeration. Staged it; 11/11 green.
