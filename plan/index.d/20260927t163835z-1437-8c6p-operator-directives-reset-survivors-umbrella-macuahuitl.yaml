    title: |
      UMBRELLA — operator directives 2026-09-27: every forge harness launches with its permission bypass pre-accepted (never prompting); the Vault store, its unseal material and the download cache survive every destructive reset on every platform; only a manual `tillandsias --uninstall` removes them, driven by a download manifest; Tillandsias owns its podman and WSL configs and uses them over system defaults
    context: |
      Specs written under this order: openspec/specs/host-state-lifecycle/spec.md (new — owns
      reset vs uninstall, the survivor set, TILLANDSIAS_DESTRUCTIVE_RESET_OK, the download
      manifest, --uninstall), plus amendments to tillandsias-vault (store is a host directory,
      survives reset, every harness credential has a Vault home), default-image (bypass
      pre-accepted at launch), environment-runtime (--wipe is the default), cache-recovery-
      mechanism (reset never removes the cache root), podman-idiomatic-patterns and
      podman-registries-config (owned podman configs), wsl-runtime (owned .wslconfig block),
      inference-container (models survive reset everywhere).

      Reconciliation with "reset is the baseline" (900-z3kv, 2026-09-13): derived state
      (containers, images, volumes, secrets, networks, guest rootfs, WSL distro, provision
      markers) is destroyed and rebuilt by every reset, unconditionally; operator data (Vault
      store, unseal material, download cache, models, owned configs) is outside the reset and
      removed only by uninstall. The 2026-09-27 directive supersedes 900-z3kv option (a) for the
      credential subject only.

      Root cause of the operator's 2026-09-27 observation (manual Claude and GitHub sign-in
      after a forge launch although both were in Vault): scripts/install.sh runs --reset-state
      on every install (1286-4437) and run_reset_state calls clear_host_vault_credentials
      (900-z3kv), so every install since 2026-09-20 discarded every sign-in.

      Audit and open operator questions:
      plan/issues/operator-directives-reset-survivors-and-harness-bypass-2026-09-27.md.
