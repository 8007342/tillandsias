  title: 'Lua kit rule: a fixture that strips TILLANDSIAS_* and runs build.sh must carry the toolbox and shared-target inheritance variables (fixture.gate_inherit)'
  context: >-
    #1578 (2375-psb9) was evicted twice on Linux only, on the same arm. Land run 79: the nested build.sh lost
    TOOLBOX_PATH, container and TILLANDSIAS_SKIP_TOOLBOX and re-exec'd into a fresh toolbox ("TOOLBOX_PATH not set").
    Land run 82: it lost TILLANDSIAS_SHARED_TARGET_HELD and waited on its own parent's shared-target flock until its
    300 s timeout (diagnosed by a status line naming status=timed_out). The fix landed in run 83. macOS has neither the
    toolbox nor flock, so no darwin run can show either. The rule now lives in lib/lua/common/fixture.lua as
    M.GATE_INHERIT plus M.gate_inherit(env). A caller must declare all six names in -- @env, and an undeclared
    one is an error naming it, never a silent skip. test-script-run-verb.lua is its first user.
  exit_criteria:
  - 'fixture.gate_inherit carries every set GATE_INHERIT name into a child env, and errors naming any undeclared one.'
  - 'test-script-run-verb.lua uses it, and stays green bare and with the variables set.'
  verifiable_closure: 'tillandsias-plan script run scripts/lua/test-script-run-verb.lua'
  unscoreable: 'the Linux-only failure it prevents needs the real gate; darwin shows only the carried values (probed in this session: container=oci held=c|r|9)'
  next_action: 'Implemented. Port authors: grep a .sh for build.sh children before porting and call fixture.gate_inherit.'
