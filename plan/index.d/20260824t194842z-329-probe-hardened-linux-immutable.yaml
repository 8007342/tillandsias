      summary: >
        THE PROBE SHIPPED WITH A DEFAULT THAT WOULD HAVE FAKED THE ANSWER, and
        the gate plus a re-run caught it before it landed. Recording because the
        failure is the one this packet is most exposed to.

        (1) ./build.sh --check refused the first commit:
        `UNEXEMPTED GNU-date-ism` — the probe timed with `date +%s%N`, and BSD
        date accepts %N while emitting a literal N, so on macOS it would have
        produced garbage timings that no exit code reveals. That matters
        specifically here: THIS PACKET'S CRITERION 3 IS A macOS COMPARISON, so
        a GNU-only timer could never have served it. Rewritten with a probed
        clock — GNU %N when digit-validated, otherwise a repeat-loop amortised
        at 1 s resolution — because a naive fallback lies: at 1 s resolution an
        80 ms operation reads as 0.

        (2) THE WORSE ONE, found only by re-running rather than trusting the
        rewrite. The new default disk path was ${TMPDIR:-/tmp} — AND ON FEDORA
        SILVERBLUE /tmp IS TMPFS. The verification run duly reported
        disk 173 ms vs tmpfs 174 ms: a confident "no difference" produced by
        comparing tmpfs against itself, which is indistinguishable from the
        real finding this row exists to report. Against a genuine NVMe path the
        same run is 456/440/444 vs 169/171/167.

        Fixed twice over: the default is now ${HOME}/.cache (btrfs on NVMe
        here), AND the script REFUSES when both arms resolve to the same device
          refused:placement:same-filesystem — '/tmp/a' and '/dev/shm/b' are both on tmpfs
        rather than emitting a number. Verified in both directions: the refusal
        fires for a tmpfs/tmpfs pair, and the default run reproduces
        456/440/444 vs 169/171/167, agreeing with the row already filed.

        WHY THIS BELONGS ON THE PACKET rather than in a commit message: the
        closure says dispositions without measurements are invalid. A probe
        whose default silently compares a store to itself produces
        measurements that are worse than none — they look like data and argue
        for keep-as-is on evidence that does not exist. Anyone adding a row
        should run the probe against an explicitly disk-backed path and check
        the `# disk arm: ... tmpfs arm: ...` header line it now prints.
