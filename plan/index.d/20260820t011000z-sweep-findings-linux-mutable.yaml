packets:
  - order: 833-ecdg
    packet_id: no-python-gate-cannot-see-a-mid-line-invocation
    desired_release: v0.5
    title: "The no-python gate matches only line-START invocations, so a heredoc `if ! python3 -` is invisible to it"
    status: ready
    kind: fix
    pickup_role: linux
    priority: p3
    capability_tags: [gate, policy, rust, robustness, hard-constraint]
    deliverable: scripts/test-gate-podman-mode-configuration.sh
    depends_on: []
    context: >
      tlatoani_hard_no_python is a hard project constraint, and the gate that
      enforces it (crates/tillandsias-policy/src/main.rs
      has_python_runtime_reference, :868-892) decides with a pattern list that
      requires LINE START for the bare and dash forms — `lower.starts_with
      ("python3 ")`, `starts_with("python3 -")`. It does cover `$(python3 `,
      backticks and `python3 -c`, so the hole is narrower than it first looks,
      but it is real: any invocation preceded by anything on the line is
      invisible.

      LIVE VIOLATION, measured 2026-08-19:
      scripts/test-gate-podman-mode-configuration.sh:54 is
      `if ! python3 - "$SANDBOX/run/podman/podman.sock" <<'PY'` — a python
      heredoc that has been in the tree while `bash scripts/check-no-python-
      scripts.sh` exits 0. Its own failure message at :63 says "python3
      required".

      This is the class the 831-ezea sweep kept hitting: A CHECK THAT VERIFIES
      A WEAKER PROPERTY THAN THE RULE IT CLAIMS TO ENFORCE, whose green is then
      quoted as compliance. Same family as the archiver's --check proving
      idempotency instead of ready-set preservation, and the freshness audit
      that inherited that wrong verdict by re-reading it.

      Found by the slice-2 triage agent while verifying order 545 (which closed
      as ALREADY DONE in the same sweep — the two named sites were genuinely
      rewritten). This residual could not ride on 545 precisely because 545 is
      now terminal.
    exit_criteria:
      - "has_python_runtime_reference matches an invocation anywhere on the line, not only at line start, without flagging the many prose comments that name python3 to explain the ban (there are several in scripts/ and they must stay green)."
      - "scripts/test-gate-podman-mode-configuration.sh:54 no longer uses python3 — the AF_UNIX fixture socket is created by a sanctioned tool."
      - "A negative control proves the gate is non-vacuous: reintroducing a mid-line `python3` invocation turns check-no-python-scripts.sh red, and removing it turns it green again."

