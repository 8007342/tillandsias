      summary: |
        SIZING THE SWEEP FROM THE FIRST REAL RUN, so the cadence rests on a
        measurement rather than on my estimate.

        Retraction yield: 51 of 410 (12.4%), one time. I had modelled ~50%.
        A recurring sweep will yield far less than this first one, because this
        pass drained the accumulated stock — the steady-state rate is the rate
        at which filed work goes stale, not the stock of stale work.

        THIS SHOULD LOWER THE KILL-RULE'S TRIGGER-HAPPINESS. The design retires
        the reconciler on `red:two-sweeps-zero-confirmed`. At a steady-state
        yield plausibly near zero for a >= 200-order window, two consecutive
        empty sweeps is a NORMAL outcome for a healthy queue, not evidence the
        reconciler is broken. Recommend the kill rule count only sweeps that
        examined new rows, and that "zero retractions" alone never retire it —
        a sweep that confirms the queue is clean has done its job.

        The event-counted trigger itself (>= 200 orders, floor 48h, no calendar
        ceiling) stands unchanged.
