      summary: |
        THE 410-ROW TRIAGE, AND ITS RESULT REFUTES MY OWN DRAIN MODEL.

        Five independent read-only agents triaged every ready row against the
        code, each verdict requiring a citation. 51 of 410 came back
        retractable — 12.4%.

        I HAD ARGUED FOR ROUGHLY HALF. The 2026-08-19 convergence note reasoned
        that since 257 of 367 ready rows had never been worked and 166 were
        untouched beyond seven days, "retracting most of it is not aggressive,
        it is accurate", and sized the drain at ~182 retractions/week. That is
        wrong, and the error is a proxy failure I had already flagged as
        uncertain: NEVER-WORKED MEASURES CAPACITY, NOT WORTH. Row after row
        came back "unimplemented, premise intact", "grep returns nothing, i.e.
        unimplemented not obsolete", "five rows depend on it".

        So RETRACTION IS NOT THE DRAIN. At 12.4% one-time it yields 51 rows
        against +26/day arrival: two days of runway, once, ever. The ready
        queue is not a junk drawer that GC empties — it is a real backlog that
        outruns service, which makes the operator's two levers (b < 1, and
        raising mu by cutting overhead) not merely better than GC but the only
        ones that exist.

        APPLIED, and the split matters: 18 obsoleted, 23 COMPLETED. Those are
        different terminals. "Already done" means the work EXISTS; recording it
        as obsoleted would file finished work as rejected and destroy the
        evidence that it shipped. All 23 carry a closure-evidence event
        (686-7qcm, ok:closure-evidence:23 checked). Ready 410 -> 369.

        THE LARGEST DRAIN IS NOT RETRACTION, IT IS MERGING. Thirteen rows are
        ALREADY IMPLEMENTED on branches that were never merged into linux-next:

          origin/windows-next  795-jjw3 (carries its own completed fragment),
                               805-ek9e, 805-yzhw, 808-43mw, 808-7yrd,
                               809-7e4m, 810-jeg7, and half of 806-2r4s
          origin/osx-next      804-deux, 733-mppc, and 798-q4m9
          local fork branches  765-tkq2, 786-kjke

        These are deliberately NOT retracted and NOT closed: the code is not on
        this branch, so the honest status is ready-pending-merge. They close by
        merging.

        AND ONE OF THEM WAS BUILT TWICE. 798-q4m9 was implemented independently
        on origin/osx-next (beb7a68de, criterion 3 measured at 1 vCPU,
        81.3ms -> 5.9ms) AND on origin/windows-next (ced3e8236). That is the
        duplicated-work cost of unmerged branches, paid in full, and it is the
