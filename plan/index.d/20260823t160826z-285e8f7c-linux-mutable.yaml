      OPERATOR RELEASE GATE 2026-08-23: the local expert system running on an accelerator on BOTH Windows/Silverblue twins is the condition for merging to main and cutting a STABLE release. This row is the Linux-side half and it is closer than the ledger suggests.

      EVIDENCE ALREADY IN HAND: yoga (Silverblue Ryzen5, AMD) is the ONLY host in the fleet with a GPU CONTAINER LANE — capability-matrix reports derived_tier gpu-rocm and `schedulable: gpu/container/ollama`. That is an accelerator serving inference inside a container, which is most of what this packet asks for. Start by reading yoga capability row and its 850-bif2/855-wrr3 events rather than re-deriving the bringup.

      WHAT THE REST OF THE FLEET LOOKS LIKE, so nobody assumes CUDA works here: lenovinha has an RTX 3070 marked `present-unscheduled ... no engine covers lanes [host-native]` — USABLE but with NO container lane, so it is NOT passing CUDA through to podman. macuahuitl reports derived_tier gpu-cuda with `schedulable: none` on a row whose ts predates the engine-lane work and is stale. Exactly one GPU container lane exists fleet-wide and it is AMD ROCm on yoga.

      THE WINDOWS HALF IS STRUCTURALLY BLOCKED AND THAT IS NOT THIS ROW FIX. yolanda reports `schedulable: none` at BOTH loci: the NPU is wsl2-npu-not-exposed and the GPU is wsl2-no-dri-render-node. 854-8p9d established this is vendor-universal, not an AMD or a driver problem — the WSL2 guest PCI bus carries only Microsoft paravirtual functions, no DRM driver binds for any vendor, and there is no PCI passthrough. So "on both twins" cannot be met inside WSL2 by any amount of work on our side. The options are a native-Windows-host expert outside WSL2, waiting for Microsoft to expose a compute lane, or gating the stable release on the Linux twin alone. That is an operator decision, not an implementation.
