    title: |
      `tillandsias --uninstall` / `tillandsias-tray --uninstall` exist on all three binaries and are the ONLY path that removes operator data: print the full list, stop everything, destroy the derived set, remove every manifest entry, the Vault store, the models, every keyring entry including the install anchor, revert merged system files; `scripts/uninstall.sh` and `-Uninstall/-Purge` delegate to it; keep-models fixtures retired
    context: |
      Spec: host-state-lifecycle "Manual uninstall removes everything, manifest-driven" (all four
      scenarios); environment-runtime "Accountable uninstall" (accountability unchanged, --wipe
      is the default); tillandsias-vault "Uninstall is the only path that clears".

      Today: no --uninstall flag on any binary. scripts/uninstall.sh removes the binary, libs,
      ~/.local/share/tillandsias, ~/.config/tillandsias, ~/.local/state/tillandsias, PATH blocks,
      desktop entries; keeps the cache unless --wipe (a hardcoded ~/.cache path, not XDG-aware);
      keeps models under TILLANDSIAS_RESET_KEEP_MODELS; never touches keyring entries, podman
      containers/volumes/secrets/networks or the non-forge images. install-windows.ps1 -Purge
      unregisters the distro, removes cache/logs/wsl, calls Clear-TillandsiasVaultHostCredentials,
      leaves state\, wsl-swap.vhdx, wsl-build and the .wslconfig keys it added. macOS
      uninstall.sh preserves the VM directory unless --wipe.

      Do: (1) tillandsias_core::uninstall: plan() builds the ordered removal list from the
      platform's derived set, the download manifest (or "manifest absent" — print it), the
      operator-data roots host-state-lifecycle names, the keyring entries INCLUDING
      installation-uuid-v1 / tillandsias-vm-uuid, the binary and launcher registrations, and
      the marked blocks of merged system files; execute() prints the list, stops the tray or
      headless process and every tillandsias-* container, removes in order, reverts (never
      deletes) merged files, reports; (2) --uninstall on headless, macOS tray, Windows tray
      dispatching to it (macOS/Windows: require_no_live_tray first, like reset); (3)
      clear_host_vault_credentials and the two tray siblings are called from here and nowhere
      else (1437-qza3's source-shape arm pins it); (4) scripts/uninstall.sh: delegate to the
      binary when present, fall back to its own list and print that it did; --wipe accepted as a
      no-op; keep-models variable ignored; (5) install-windows.ps1 -Uninstall and -Purge:
      delegate likewise; (6) retire scripts/test-uninstall-keeps-models.sh and
      litmus-uninstall-keeps-models.yaml with a one-line note citing 2026-09-27 (they pin the
      superseded contract); keep test-uninstall-preserves-vm (macOS VM dir) only if the spec
      still preserves it — it does not: uninstall removes the VM dir too; retire with the note;
      (7) fixture scripts/test-uninstall-removes-everything.sh: hermetic HOME with a seeded
      manifest, store, models and a marked .wslconfig-style file; after --uninstall none of the
      listed paths exist, the merged file keeps only its user lines, a decoy project tree is
      untouched (reuse the 1401-p3k7 seam: every absolute path is seamed, fail closed).
    exit_criteria:
