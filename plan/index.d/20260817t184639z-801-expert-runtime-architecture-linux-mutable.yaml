      summary: |
        MEASURED THE WHOLE PATH ON THE FAT CUDA HOST. This packet is the
        "thinnest rung" and it is thinner than it looks: every hard part
        already works. Whoever picks it up should start from these facts
        rather than re-deriving them.

        THE HOST: Intel Core Ultra 7 265KF (20 cores), 62 GiB RAM, NVIDIA RTX
        A5000 with 24564 MiB VRAM, Intel NPU at /dev/accel/accel0, 953 GB NVMe.

        WHAT THE STACK IS DOING WITH IT: nothing. The dev inference container's
        HostConfig.Devices is [], there is no /dev/nvidia* inside it, and the
        GPU sits at 4% / 576 MiB (the display). It serves qwen2.5:0.5b on CPU,
        which is why spec_answer's synthesis falls back to the documented
        retrieval-only cited-digest floor: a 0.5B model on a 24 GiB accelerator
        that is not plugged in.

        WHAT I VERIFIED, in order:
          1. `nvidia-ctk cdi generate` works ROOTLESS, rc=0, from
             ~/.local/bin/nvidia-ctk with no rpm and no second sudo — which is
             exactly what order 408 asks for. It emits kind nvidia.com/gpu with
             devices "all", "0" and the GPU UUID. Only cosmetic warnings
             (nvidia_drv.so / libglxserver — X server libs, irrelevant to
             compute). Spec installed at ~/.config/cdi/nvidia.yaml.
          2. `podman run --device nvidia.com/gpu=all` against
             localhost/tillandsias-inference:latest: the entrypoint printed
             `vram_mb=24564`. The container SEES the card.
          3. Same run printed `engine backends available: cuda_v12 cuda_v13
             vulkan`. The ollama payload already carries CUDA.

        WHAT IS ACTUALLY MISSING, and it is two lines. The same run printed
        `tuning: tier=cpu ... vram_mb=24564` — it saw 24 GiB and chose CPU,
        because entrypoint.sh:165 reads `${TILLANDSIAS_INFERENCE_TIER:-cpu}`
        and nothing sets it. Tier is an INPUT that gets corroborated against
        /dev/nvidia0 (entrypoint.sh:227-237), not something derived from the
        hardware. So scripts/dev-inference-ensure.sh needs:
             --device nvidia.com/gpu=all
             -e TILLANDSIAS_INFERENCE_TIER=cuda
        and the existing corroboration will accept it here and refuse it on a
        host without the device — which is the fail-loud behaviour already
        designed and already unit-tested by order 433.

        WHY THIS MATTERS BEYOND ONE HOST: the policy router's fallback chains
