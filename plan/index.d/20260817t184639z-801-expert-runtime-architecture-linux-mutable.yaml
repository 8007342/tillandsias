packets:
  - packet_id: expert-index-lifecycle-belongs-to-the-mirror-not-the-forge
    order: 801-a2by
    status: ready
    desired_release: v0.5
    priority: p1
    kind: enhancement
    title: "the expert index dies with the thing that should be disposable — key its lifecycle to the git-mirror (durable) instead of the forge and /dev/shm (both ephemeral), so a relaunched forge lands warm"
    deliverable: "the spec index lives on a durable, named volume keyed by the corpus+model fingerprint that spec-index-ensure.sh already computes, shared by every forge and every bare-metal harness on the host; a forge relaunch is a fingerprint hit, not a 12-minute rebuild"
    pickup_role: linux
    release_target: forge-local-experts-milestone
    capability_tags: [experts, forge, lifecycle, velocity, rag]
    estimated_hours: 5
    context: |
      OPERATOR FRAMING, 2026-08-17, and it is the right decomposition: "the
      expert system IN-FORGE lifecycle tied to commits is actually tied to the
      GIT-MIRROR lifecycle, so the forge can be idempotent and die and relaunch,
      but as long as the git-mirror and the inference container remain alive,
      the next forge launch will land on warm everything."

      OBSERVED, macuahuitl 2026-08-17:
        * The index is built into ${FORGE_EXPERTS_STATE_DIR:-/dev/shm/
          tillandsias-experts}/spec-index. /dev/shm is TMPFS. In-forge it dies
          with the container; on bare metal it dies on reboot.
        * Cold build measured: 9910 chunks, ~12 minutes. Warm re-run: 0.048s,
          because spec-index-ensure.sh already fingerprints corpus+model and
          short-circuits. The expensive path is being paid for a cache that is
          thrown away, while the cheap path already exists.
        * So every forge relaunch re-pays 12 minutes for a corpus that did not
          change, and concurrent forges each pay it separately.

      THE DECOMPOSITION THIS ASKS FOR — a durable tier and an ephemeral tier:
        durable   : git-mirror, inference, (nix-cache, 801-kqme), expert index
        ephemeral : forge containers, N concurrent, freely destroyed
      The forge keeps every idempotence and ephemerality guarantee it has now.
      It simply stops being the owner of state that outlives it.

      WHY THE MIRROR IS THE RIGHT KEY AND NOT JUST "SOMEWHERE DURABLE": the
      index's validity is a function of the CORPUS, and the corpus is whatever
      the mirror's refs say it is. The mirror is also the one component that
      already knows when the corpus moved. Keying to it means invalidation
      stops being a timer or a launch hook and becomes an actual dependency.

      NOT A BLANK CHEQUE ON SHARING: two harnesses at different commits must
      not silently read one index as if it described both their checkouts.
      That is 801-g9nn's problem and the two packets should land in that order
      or together — a shared warm index without caller-relative staleness is
      a faster way to be confidently wrong.
  - packet_id: nix-binary-cache-service-on-the-enclave-for-warm-forges
    order: 801-kqme
    status: ready
    desired_release: v0.5
    priority: p2
    kind: enhancement
    title: "give the enclave a nix binary-cache SERVICE backed by the store 795-h8er already keeps, so an ephemeral forge lands on a warm cache without a host bind-mount"
    deliverable: "a substituter reachable at http://nix-cache:<port> on the enclave network, serving the existing persistent host store read-only; forge builds hit it and stay fully disposable; concurrent forges share it safely; no host path is mounted into the forge"
    pickup_role: linux
    release_target: convergence-velocity-milestone
    capability_tags: [nix, forge, enclave, cache, velocity]
    estimated_hours: 6
    context: |
      OPERATOR QUESTION, 2026-08-17, verbatim in substance: should the nix
      cache be another container wired into the stack, or "just a mounted
      cached filesystem layer"?

      ANSWER, with the reasoning rather than a verdict: STORAGE does not need a
      container, SERVING does, and they are different things. 795-h8er already
      gave the host a persistent, rooted, GC-bounded store anchored in $HOME
      (5.8 GiB, 4478 paths, pin + ceiling policy). Keep that exactly as it is;
      it serves host-side builds — gates, forks, the toolchain — and no
      container is involved.

      WHY NOT BIND-MOUNT THAT STORE INTO THE FORGE, which is the tempting
      answer:
        * It punches through the property the forge exists to have. Forge
          containers are enclave-only by spec (forge-offline), and the host
          mount is a deliberate opt-in guard (order 437) precisely because it
          is a boundary violation. Making the fast path require it inverts the
          default.
        * Nix validity is not bytes on disk. A read-only /nix/store without
          the SQLite db gives you paths nix does not consider valid; making it
          work means either sharing a WRITABLE db across concurrent forges —
          a lock-contention and corruption surface with N forges — or --store
          gymnastics that the 790-mbk9 logical-vs-physical path trap already
          bit us on once.
        * It couples every forge to a host path layout, which is what makes
          the same forge image behave differently on macOS and Windows.

      WHY A SUBSTITUTER SERVICE IS THE IDIOMATIC ANSWER: it is nix's own
      protocol for exactly this. Read-only by construction, content-addressed,
      safe under concurrent readers, no shared mutable db, and it composes —
      when 790-6n2k eventually picks a remote cache, that becomes an upstream
      substituter of this one rather than a second mechanism. The forge needs
      one config line (substituters + trusted-public-keys) and stays byte-for-byte
      as disposable as it is today.

      OPEN QUESTIONS FOR THE IMPLEMENTER, none of them blocking:
        * nix-serve vs harmonia — harmonia is the maintained performant one;
          measure before assuming.
        * Signing: a substituter needs a keypair unless the forge marks it
          trusted. Prefer a real signing key generated on the host and kept out
          of the image, so the same mechanism survives becoming remote.
        * The enclave has no egress except through squid; the cache must be a
          first-class enclave service (proxy/vault/git-mirror shape), not a
          host loopback the forge cannot reach.
  - packet_id: expert-citations-must-carry-a-version-the-caller-can-compare
    order: 801-g9nn
    status: ready
    desired_release: v0.5
    priority: p1
    kind: enhancement
    title: "an expert citation is `path:45-49` with no version, so a concurrent agent reads that span in ITS OWN checkout and may be reading different bytes — cite the commit, and say when the caller is behind"
    deliverable: "each citation carries the commit whose blob it was extracted from; the envelope carries the mirror's ordering position; and when the caller's HEAD differs, the answer SAYS which cited files moved between the two — including the case where the citation is ahead of the caller"
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [experts, git-mirror, concurrency, fail-loud, citations]
    estimated_hours: 8
    context: |
      OPERATOR FRAMING, 2026-08-17, and this is the idea with the most value in
      it: "the expert system lives in the lamport clock space of the git-mirror
      so it has better context than the in-forge agent has ... when it replies
      'yeah, look at this file' it should actually say 'look at this
      file:vnnnnnn' which might reference a file in the future from the agent's
      checkout perspective."

      OBSERVED TODAY: a spec_answer envelope carries citations as
      {path, line_start, line_end} plus ONE top-level freshness
      {source_commit, indexed_at}. So the answer knows what it was built from
      and the caller does not know whether that matches what they are looking
      at. An agent handed "openspec/specs/forge-offline/spec.md:45-49" opens
      line 45 in its own checkout. If the file moved, it reads the wrong lines
      and acts on them with full confidence. That is the same failure shape as
      every other defect this milestone has collected: an answer that is true
      in one frame and silently wrong in the reader's.

      ONE CORRECTION TO THE FRAMING, because it changes the design. Git is a
      DAG with a PARTIAL order, not a Lamport clock — two concurrent branches
      are genuinely unordered and no `vNNNN` can be derived from commits alone.
      What IS available:
        * per-citation COMMIT: exact, cheap, and already known at index time.
        * ancestry between caller HEAD and answer commit: gives the honest
          verdict same | behind | ahead | diverged.
        * a mirror-maintained monotonic EPOCH for the human-readable version
          number the operator wants. This is not a new invention here: the
          mirror already publishes refs/tillandsias/upstream-auth/<state>/<epoch>
          (756-2jnj), so a monotonic counter over ref updates is established
          practice in this codebase.
      So: cite the commit, carry the epoch, and derive the relationship. Do not
      claim a total order that git cannot give.

      THE CASE THAT MAKES IT WORTH BUILDING is the operator's: a citation in
      the caller's FUTURE. With concurrent harnesses sharing one mirror-backed
      index (801-a2by), an expert can legitimately answer from a commit the
      asking agent has never fetched. Served bare, that is a line number
      pointing into a file the agent cannot see; labelled, it is the single
      most useful thing the expert can say — "this changed under you, fetch".

      SUGGESTED FIRST RUNG, small and useful alone: add `commit` to each
      citation and a `caller_relation` to the envelope, computed from the
      caller's HEAD when the tool can see it. `verify-answer` then has
      something falsifiable to check, which is what keeps the whole envelope
      contract honest.
