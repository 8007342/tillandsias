        is wrong but because the GPU lane was never offered to it. The fleet
        therefore has no HIGH-tier reference measurement at all — LOW and MID
        are being characterised on yolanda and esmeraldinha while the machine
        that defines the ceiling reports as CPU.

        NOT DONE HERE deliberately: I did not change dev-inference-ensure.sh.
