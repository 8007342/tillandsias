        openspec/litmus-bindings.yaml FORCES FULL although it is class `specs` and
        therefore SCOPED by the tiers. The bindings file is WHAT MAKES A LITMUS TEST
        EXIST, and pirria's measured incident is the argument: an arm written and never
        bound, with the suite reporting 37 PASS / 3 FAIL and that test in NEITHER
        number. A shrinking corpus reports a clean number.

        scripts/test-support/* FORCES FULL, and this one came from a CORRECTION rather
        than from the review proper. Those four files — a podman mock, a secret-tool
        fake, a github-login fake, a litmus podman guard — are not fixtures SCOPED would
        execute; they are FAKES that fixtures LOAD. pirria's formulation, adopted
        verbatim because it is better than the one it replaced: a fake is not a file
        that is run, it is a file that DECIDES WHAT RUNNING MEANS for everything that
        loads it. The tier runs the FIXTURE; the fixture's verdict depends on the fake
        being faithful; a fake that drifts turns every fixture loading it green for the
        wrong reason and nothing in SCOPED notices.

        THE FIXTURES THEMSELVES STAY SCOPED, as a stated decision. SCOPED RUNS them and
        drops cargo, so a test-*.sh edit is executed by the tier that lands it. Making
        all 352 unconditional would cost most of SCOPED's value to re-cover what the
        tier already does. WHAT WOULD CHANGE IT: slice 2's matrix showing a SCOPED
        landing that does NOT run the fixture it touched. pirria raised these as a
        candidate and not a recommendation and asked for that measurement.

        ARM 5b IS ABOUT SILENCE. The classifier's vocabulary has nine classes and these
