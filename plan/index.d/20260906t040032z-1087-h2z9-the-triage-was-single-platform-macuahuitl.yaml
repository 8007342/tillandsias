        number, a plausible target. NOTHING IN THE OUTPUT SAYS THE PARSE WENT
        WRONG. The defect was not unseen, it was DISGUISED AS A RESULT, which
        is the sharpest form yet of this packet's subject: a check nothing runs
        can carry a defect indefinitely, and this one would have been chased
        rather than doubted.

