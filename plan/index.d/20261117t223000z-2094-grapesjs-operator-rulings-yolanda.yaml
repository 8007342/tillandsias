      host: yolanda
      summary: "OPERATOR RULING (decision 1): on Windows the studio opens in the same containerised chromium-framework window the dev-browser uses, NOT the host's default browser, and it MUST be a dev browser so agents can drive the authoring tool too. This replaces the 'native Windows browser window' wording and dissolves the host-CA-trust question (the dev browser already trusts the enclave CA inside its container)."
