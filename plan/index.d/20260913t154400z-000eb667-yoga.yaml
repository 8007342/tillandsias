          3. files     fallback_vault-shamir-share-v1, fallback_vault-root-token-v1
          4. dir       <init-cache>/vault-data
        Clearing any two leaves the room warm, which is why the verdict says so
        explicitly on a partial result rather than reporting success.

        THE SAFETY-CRITICAL HALF, found by reading before writing anything that deletes.
        The keychain also holds `installation-uuid-v1` (INSTALL_ANCHOR_V1, next to
        VAULT_SHAMIR_SHARE_V1 in vault_bootstrap.rs). It is the Linux counterpart of the
        Windows script's `tillandsias-vm-uuid` and carries the same hazard: clearing it
        makes the next vault UNDERIVABLE rather than merely re-initialised. It is
        preserved, said aloud in the output, and pinned by an arm — because an arm that
        only checks what IS removed cannot catch a clearer that removes too much.
        `/etc/machine-id`, from which the unseal key is derived by HKDF, is likewise
        never touched: a clean room re-initialises a vault, it does not re-identify the
        machine.

        NEVER MATERIALISES A SECRET (criterion 4): `secret-tool clear` deletes by
        attribute and prints nothing. `secret-tool search --all` prints the secret
        inline and put live tokens into two transcripts on 2026-08-25.

        CRITERION 3, BOTH DIRECTIONS, 6/6 and mutation-verified with the diff proven
        non-empty before each run:
          forward   a warm room is cleared in all three locations
          reverse   a wipe path that does NOT clear leaves the room warm, and that is
                    detectable — the arm the row demands and the half that was missing
                    when four legs reported a clean room that was not one
          anchor    the installation anchor is never cleared
          plus idempotence, the consent gate (refuses 2 and clears NOTHING), and
          --dry-run mutating nothing.
        Mutations: also clearing the anchor reds 5/6; skipping the data directory reds
