    exit_criteria:
      - 'the fixture passes with a planted target/work/wt-x/ checkout that references a spec the tree does not; red today'
      - 'it still fails when a spec is referenced ONLY from genuine build output (target/debug/... or target/release/...)'
    verifiable_closure: |
      scripts/test-precommit-zero-trace-scan-scope.sh with a planted target/work/wt-x/crates/a.rs containing spec:no-such-spec passes, and with the same token planted under target/debug/build/ it fails.
    next_action: Exclude target/work (nested git checkouts) from the with-build-output sweep, or sweep only paths git ls-files does not track plus build dirs; plant both cases red then green.
