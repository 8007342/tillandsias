packets:
  - packet_id: plan-diagnostics-is-gitignored-while-skills-call-it-durable-and-committed
    order: 745-48q6
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    kind: bug
    title: "plan/diagnostics/ is gitignored, three skills tell agents to file durable findings there, and one runs `git add` on it — the write silently cannot persist"
    deliverable: "one answer to 'is plan/diagnostics durable?', applied to .gitignore and the skills together"
    pickup_role: any
    capability_tags: [plan, gitignore, skills, fail-loud, findings-persistence]
    estimated_hours: 2
    context: |
      MEASURED 2026-08-15 on tlatoani while widening the findings-persistence gate
      (741-3y48 / 743-rhr4). The repo contradicts itself about this directory:

        .gitignore:90                     /plan/diagnostics/
                                          (under "# Generated diagnostic dumps")

        skills/diagnose-forge/SKILL.md:31 "plan/diagnostics/diagnostics_*-summary.md
                                           — distilled summaries (DURABLE, COMMITTED)"
        skills/build-windows-tray:25      "Capture findings into a per-day file in
                                           `plan/diagnostics/`"
        skills/probe-macos-tray-on-windows:164
                                          "git add plan/diagnostics/build-macos-tray-
                                           from-windows-YYYY-MM-DD.md"

      Verified behaviour on a clean tree:

        $ echo test > plan/diagnostics/.gate-probe.md
        $ git add plan/diagnostics/.gate-probe.md
        The following paths are ignored by one of your .gitignore files:
        plan/diagnostics
        hint: Use -f if you really want to add them.
        $ git status --porcelain -- plan/diagnostics
        (nothing)

      So an agent following `diagnose-forge` or `build-windows-tray` writes a
      findings file, `git add` REFUSES it, `git status` does not show it, and the
      file is invisible to every persistence check — including the new
      741-3y48 gate, which cannot see ignored paths by construction. It dies with
      the container, or with the next clean checkout.

      WHAT MAKES IT WORSE THAN A PLAIN GAP: 76 files ARE tracked under
      plan/diagnostics/ (README.md, build-windows-tray-2026-05-29.md,
      diagnostics_*-summary.md, …), added before the ignore rule or force-added.
      So the directory LOOKS committed and durable to anyone who lists it, and
      only NEW writes fail. That is the most misleading possible state: the
      evidence that the surface works is right there next to the write that
      silently didn't.

      This is the same family as 741-3y48 (a finding filed correctly and lost
      anyway) but a different mechanism: there the substrate was ephemeral, here
      the substrate refuses the write while every doc says it accepts it.
    outcome: |
      plan/diagnostics/ has ONE meaning. Either it is durable and the ignore rule
      stops covering the files skills commit there, or it is scratch and no skill
      claims otherwise or runs `git add` on it.
    exit_criteria:
      - "Decide and apply: EITHER narrow .gitignore so the durable summaries skills commit are trackable (e.g. ignore only the raw dumps by pattern, not the whole directory), OR redirect every skill that files durable findings to a tracked surface and delete the `git add plan/diagnostics/...` step."
      - "Whichever way it goes, the 76 already-tracked files stay consistent with the new rule — no half-tracked directory."
      - "An executable check proves it: writing a findings-shaped file to the durable location and running `git add` must succeed (or, in the scratch reading, no skill instructs a durable write there). Verify by doing it, not by reading .gitignore."
      - "NEGATIVE CONTROL: genuinely generated dumps must still be ignored — a fix that tracks every diagnostic dump trades a silent loss for a noisy repo."
    notes: |
      Do not 'fix' this by adding `-f` to the skills' `git add`. Force-adding into
      an ignored directory keeps the contradiction and makes the next reader
      believe the ignore rule is advisory.

      Check plan/localwork/ and plan/steps/ for the same shape while here — both
      are referenced by skills and neither was examined during this measurement.
    events:
      - type: filed
        ts: "2026-08-15T00:45:00Z"
        host: linux_immutable
        agent_id: tlatoani-linux-immutable-20260814
        summary: |
          Found while widening the findings gate to the whole plan/ tree: the
          gate cannot see plan/diagnostics because git ignores it, and three
          skills tell agents it is durable. Reproduced the refused `git add` and
          the invisible `git status` on a clean tree; 76 tracked files already
          sit there, which is what makes the surface look healthy.
