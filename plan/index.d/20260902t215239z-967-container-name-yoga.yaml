packets:
  - packet_id: accel-proof-probes-a-container-name-dev-hosts-do-not-run
    order: 967-6ax6
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: the 793-zumy proof rungs exec into `tillandsias-inference`, but the dev inference lane creates `tillandsias-dev-inference` — so accel_proof stays `-` on a host whose lane demonstrably works
    deliverable: 'the Reachable/Placed producers resolve the inference container by a single source of truth shared with dev-inference-ensure.sh, so a dev host reports the rung its lane actually earns instead of `-`'
    pickup_role: any
    release_target: stable-milestone-v1
    depends_on: accel-probe-blind-to-wsl2-paravirtualised-gpu
    capability_tags:
      - accel
      - probe
      - fail-loud
      - soundness
    estimated_hours: 1
    context: |
      MEASURED on yoga 2026-09-02, on linux-next at a7530d166 with a freshly
      built tillandsias-headless (the merge of 793-zumy's producers).

        accel_class=cpu-only accel_gpu=present-unusable
        accel_reason=container-lane-unverified accel_proof=-
        render_nodes: []

      THE CAUSE:
        crates/tillandsias-headless/src/accel_probe.rs:1810
          const INFERENCE_CONTAINER: &str = "tillandsias-inference";
        scripts/dev-inference-ensure.sh:102
          DEV_CONTAINER="tillandsias-dev-inference"
        $ podman exec tillandsias-inference true
        Error: no container with name or ID "tillandsias-inference" found

      `probe_container_render_nodes()` execs into a container that does not
      exist on a dev host, gets nothing back, and the rung stays at `-`. That is
      the producer behaving correctly on the input it was given; the input is
      the wrong name.

      THE LANE ON THIS HOST DEMONSTRABLY WORKS, which is what makes `-` a lie
      rather than a gap. Measured the same day against tillandsias-dev-inference:
      /dev/kfd (235,0) and /dev/dri/{card1,renderD128} present INSIDE the
      container, TILLANDSIAS_INFERENCE_TIER=gpu-rocm, OLLAMA_IGPU_ENABLE=1, and
      `curl -fsS --max-time 2 http://127.0.0.1:11434/api/ps` answering from
      inside it with a parseable body (size_vram 0 — a definite zero, so the
      correct rung here is Reachable, not Placed).

      WHY THIS IS NOT COSMETIC. `accel_proof=-` is indistinguishable from "this
      host has no accelerator lane at all". The envelope now reads MORE
      pessimistic than the pre-merge binary did on the same hardware — that one
      said accel_class=workstation-gpu, accel_gpu=usable — so a verifier
      comparing before and after reads a hardware regression where the truth is
      a probe looking in the wrong place. This is the third instance in a week
      of the same family: 937-68n4 (a tier label that named wiring which had not
      happened), the HostConfig.Devices `[]` false negative, and now this. Two
      of the three fail toward UNDER-claiming, and that direction is the one
      that survives review, because chasing it looks like diligence.

      IT ALSO NARROWS A FLEET CLAIM. The 2026-09-02 statement that "no host can
      produce `placed`" was retracted when lenovinha produced it on an RTX 3070.
      This packet is the other half of why the fleet's picture was confused:
      lenovinha's ollama runs where the probe looks, and yoga's does not, so the
      two hosts were never answering the same question.

      NOT DECIDED HERE, deliberately, because it changes what the rung MEANS and
      that is 793-zumy's owner's call: whether a dev-lane container may earn
      Reachable at all, or whether the rung is about the product runtime only.
      A candidate list (product name, then dev name, first that exists) and a
      single shared source of truth are both viable; a second hardcoded constant
      beside the first is not, since that is how the pair drifts.
    exit_criteria:
      - |
          The inference container name used by the proof producers and the name
          created by scripts/dev-inference-ensure.sh come from ONE source, so
          renaming either cannot silently disable the rung.

      - |
          On a host running only the dev inference lane, `--capabilities`
          reports the rung the lane earns (Reachable when the nodes are
          stat-able inside the container and residency is a definite zero)
          rather than `accel_proof=-`.

      - |
          A test pins the miss: a host where the product container is absent and
          the dev container is present must not report `-`, and the assertion
          names both container names so a future rename fails the test rather
          than the fleet.
    next_action: |
      Ask 793-zumy's owner (yolanda, windows-next) which container the rung is
      allowed to be about before changing the constant — the answer decides
      whether this is a one-line candidate list or a scope change to the rung.
      Reproduce with: build tillandsias-headless at a7530d166 or later on a host
      running scripts/dev-inference-ensure.sh, run `--capabilities`, observe
      accel_proof=- while `podman exec tillandsias-dev-inference ls /dev/dri`
      succeeds.
