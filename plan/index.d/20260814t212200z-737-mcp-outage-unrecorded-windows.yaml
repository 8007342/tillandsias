packets:
  - packet_id: mcp-expert-outages-are-invisible-to-the-plan
    order: 737-zcj5
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: forge-local-experts-milestone
    kind: bug
    title: "An MCP expert server can go down mid-session and nothing records it — the outage leaves no trace in the plan at all"
    deliverable: "a recorded-outage path (and the discipline that uses it)"
    pickup_role: any
    capability_tags: [mcp, experts, observability, fail-loud, methodology]
    estimated_hours: 3
    context: |
      OPERATOR DIRECTIVE 2026-08-14, verbatim in substance: when the MCP servers
      fail that must be recorded in ./plan — "they're part of the project we're
      building, not just random ignorable infra when it goes down. Any
      shortcomings are worth fixing and improving."

      MEASURED THIS SESSION, and the packet exists because the host it happened
      to (this one) did the wrong thing:

      Mid-session all 28 deferred MCP tools became unavailable — 14
      mcp__forge-plan__* and 14 mcp__project-info__* — because the servers
      disconnected. The host fell back to ./target/release/tillandsias-plan.exe
      for every subsequent ledger read and write (next-order, append-event,
      set-field, check, query) and carried on. The operator later reconnected
      them by hand.

      NOTHING WAS RECORDED. Not a packet, not an event, not a loop-status line.
      The outage is invisible in the ledger, and would have stayed invisible.

      THAT IS A RULE VIOLATION, not a judgement call. methodology's
      mcp_first_read_path names exactly three reasons to drop to the filesystem
      and says of the first: "unavailable (MCP down or confidence=unsupported —
      fall back and keep going, THEN RECORD IT so a systematically-refusing
      expert stays visible)". The fallback half was honoured; the recording half
      was not.

      THE DEEPER SHORTCOMING, which is why this is a packet and not just a
      mea culpa: there is no MECHANISM. Recording an outage depends entirely on
      an agent noticing and choosing to write it down, which is the same
      "a guard only an attentive agent honors is a suggestion" shape this
      milestone keeps repairing. cycle-metrics reports per-server CALL VOLUME
      (`mcp: servers=1 plan-expert-calls=N`) but has no notion of a server being
      DOWN — an expert that is unreachable for an hour and an expert nobody
      called look identical in that line.

      SECOND, SEPARATE MEASUREMENT worth keeping with it: with the servers back,
      the deterministic tier answers well — plan_next returned 5 cited packets
      at confidence=exact over 46 eligible — while a story-shaped question
      returns a refusal:

        answer "what coherent story should the windows host work next"
        -> confidence: unsupported, zero citations

      That is not an outage; it is the L1 semantic tier being unbuilt
      (milestone bare-metal-expert-inference-parity, 718-jqt5). Recording it
      here because an operator asking for "coherent stories from the expert"
      should find the measured answer in the ledger rather than rediscover it.
    outcome: |
      An MCP outage leaves a durable trace that a later cycle can find, and the
      trace does not depend on an agent remembering to write it.
    exit_criteria:
      - "An outage is recorded automatically or semi-automatically — a cycle that loses the plan expert produces a ledger artifact without an agent choosing to. Naming the shape is part of the work: a loop-status line, an event on a standing packet, or a counter cycle-metrics reads."
      - "cycle-metrics can distinguish `server down` from `server never called`. Today both render as absence, and the `mcp:` line is the place that claims to answer 'are the servers used?'."
      - "NEGATIVE CONTROL: a healthy session must NOT emit outage noise — a signal that fires every cycle is one nobody reads, which is this milestone's own recurring failure."
      - "The methodology's fall-back-and-record rule gains a concrete referent: it currently says 'record it' without saying where, which is part of why it was skipped."
    notes: |
      Do not fold in the semantic-tier gap. `confidence=unsupported` on a
      story-shaped question is 718-jqt5's scope and is a FEATURE being built,
      not a failure; conflating an unbuilt tier with a downed server would make
      both harder to see. The only reason they appear together here is that both
      were measured in the same hour.
    events:
      - type: filed
        ts: "2026-08-14T21:22:00Z"
        host: windows
        summary: |
          Filed at operator direction after this host let an MCP outage pass
          unrecorded, in violation of mcp_first_read_path's own instruction.
          The rule was followed halfway: fell back, kept going, said nothing.
