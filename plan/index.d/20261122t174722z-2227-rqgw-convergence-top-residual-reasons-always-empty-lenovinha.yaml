      Found while porting write_convergence_artifacts (2224-x32n). The bash writer set trap 'rm -f <temp files>' RETURN, then sourced scripts/plan-binary-probe.sh for the score-checks call (977-j6qu). A RETURN trap also fires when a sourced file finishes, so the residual-reasons file was deleted after the loop filled it and before it was read; the record then got []. Measured with the trunk writer: one failing check, file 175 bytes after the loop, top_residual_reasons []. 2224 carries this on purpose (CARRY_EMPTY_TOP_RESIDUAL in scripts/lua/local-ci-convergence-artifacts.lua), on the coordinator's bug-for-bug ruling, so its parity evidence stays pure.
    exit_criteria:
      - "a failing run's record lists each failed check's spec, reason and weight in top_residual_reasons; the arm is red before the fix"
