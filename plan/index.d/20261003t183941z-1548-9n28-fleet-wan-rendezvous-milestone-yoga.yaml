    title: |
      tillandsias-fleet-core's canonical encoder and lease state machine run unchanged in a Cloudflare Worker with ONE SQLite Durable Object (rendezvous.tlatoani.net, workers_dev failsafe) and in tillandsias-fake-rendezvous: a heartbeat signed by an unknown key, a stale ts or a replayed seq is refused storing nothing, the roster comes back signed by the rendezvous key, at most one live holder exists per service with strictly increasing epochs, expiry is driven by one alarm and no timer, and tillandsias fleet deploy-rendezvous / publish-roster upload the Worker and the tree's keys and services.yaml
    context: |
      Design note §1 and design Decisions 1-3: Workers Free 100k req/day,
      DO 100k req and 100k rows written/day, SQLite backend only on Free;
      single-threaded DO makes compare-and-set a plain event; setTimeout
      makes the object non-hibernateable (billed up to 140 s per wake).
      Constants: HEARTBEAT 900 s, LEASE_TTL 3600 s, MIN_PRESENCE 4 h.
      Auth is Ed25519 over canonical bytes (Workers WebCrypto) — no Access,
      no service token. Deploy uses the operator's Cloudflare bundle
      (Workers Scripts Write); the DNS token is set by the operator as a
      Worker secret and is 1548-pg32's.
