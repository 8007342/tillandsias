    order: 1548-9n28
    status: ready
    kind: milestone
    priority: p1
    desired_release: v0.6
    pickup_role: any
    capability_tags: [fleet, rendezvous, cloudflare, workers, durable-objects, ssh, vault, git-mirror, fleet-experts, leader-election, milestone]
    estimated_hours: 6
    owned_files:
      - openspec/changes/fleet-wan-rendezvous/
      - plan/issues/fleet-wan-rendezvous-design-2026-10-03.md
    title: |
      MILESTONE — every host enrolled by the operator's --github-login and --cloudflare-login announces itself to a signed Cloudflare Worker + Durable Object rendezvous (rendezvous.tlatoani.net, failsafe workers.dev), the fleet elects a holder per service preferring always-on hosts (macuahuitl first for git-mirror and local-experts), and host-to-host traffic goes LAN-direct or over Cloudflare Mesh off-LAN, trusted only by per-host CAs pinned in plan/fleet/peers; today no host knows another's address or keys, plan/fleet does not exist, and each host's experts see only its own refs
    context: |
      OPERATOR (2026-10-03, rulings numbered in the design note): Cloudflare,
      not Tailscale; Cloudflare carries the CONTROL plane (discovery, CA
      exchange, leases, status page) and never bulk data; heartbeats slow
      (15 min), leases about an hour, several hours of presence before a
      takeover; leadership per service with operator affinity; macuahuitl
      (24/7, strongest GPU/CPU/RAM) is the first git-mirror (read AND write,
      GitHub the source of truth, every host keeps its local mirror as a
      failsafe) and local-experts holder, so the experts see the whole
      fleet's refs; push identity is the shared Tillandsias GitHub App
      credential with per-host committer identity preserved; LAN direct is
      the primary data path and the one or two off-LAN laptops use
      Cloudflare Mesh for ALL host-to-host traffic in v1 (downloads and
      images never use Mesh; direct IPv6 WAN is a later goal); the logins
      gate ENROLLMENT only — connections trust the CA pinned in the peer
      record and never a live token; the Pi is out of scope for v1.
      RESEARCH (2026-10-03, design note §1-§4): a Worker + one SQLite
      Durable Object is on the Workers Free plan and is a strongly
      consistent compare-and-set store with alarms; at a 15-min heartbeat
      for 10 hosts it uses about 1 % of requests and 2.2 % of rows written;
      Ed25519 is in Workers WebCrypto, so the control plane needs no Zero
      Trust identity; DNS-only records with TTL 60 written by the Durable
      Object are the only rootless floating name that works on every
      platform; OpenSSH has no CA chaining and Vault never exports a CA key,
      so each host's own CA vouches only for its own names.
      WHAT EXISTS (models, not re-filed): the PKCE login and its Vault
      bundle (1505-kc5f etc., landed 7985e2469); the fake Cloudflare
      (1505-svve); cloudflare_names (1505-iky3); the per-host Vault ssh
      signer mounts (vault_bootstrap.rs:5752-5754); the mirror's pre-receive
      relay (openspec/specs/git-mirror-service/spec.md:171-200); the Noise
      identity plan (1506-32k5) and the LAN rung (1506-7tq4); the Mesh
      sidecar research and join (1506-euvq, 1506-t97c) and Zero Trust init
      (1505-6w7d), all ON this milestone's critical path for off-LAN hosts.
      DESIGN PRINCIPLES (binding on every child): no fixture needs the real
      Cloudflare account (fakes for OAuth, rendezvous and DNS); the host,
      the fake and the Worker share ONE pure core crate; no timer in the
      Durable Object; no host holds a DNS token; discovery never confers
      trust; no connection path consults a live login; every fallback is
      printed, never silent; bulk data never crosses Cloudflare.
