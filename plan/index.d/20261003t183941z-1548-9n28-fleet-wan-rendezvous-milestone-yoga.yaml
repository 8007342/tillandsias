# Operator direction 2026-10-03 (yoga session, rulings 1-14 in the design
# note): Cloudflare Worker rendezvous as the control plane, per-service
# leases preferring always-on hosts, macuahuitl as the first git-mirror and
# local-experts holder, LAN-direct data with Cloudflare Mesh for off-LAN
# hosts, connection-time trust by pinned per-host CAs only.
# Milestone 1548-9n28 and its children, plus two goals and two findings.
# Research and sources: plan/issues/fleet-wan-rendezvous-design-2026-10-03.md
