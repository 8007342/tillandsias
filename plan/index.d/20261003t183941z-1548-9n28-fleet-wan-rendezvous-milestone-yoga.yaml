      gave Err(AddrParseError(Socket)) for the unbracketed form and Ok for
      "[2001:4860:4860::8888]:53"; ~/.config/containers/containers.conf:3
      reads pasta_options = ["--ipv4-only"]; main.rs:9105 calls the injector
      whenever the probe fails. Two ECMP default routers on yoga, one (the
      Pi) black-holing: flow-label-pinned probes lost 9/9 via the Pi and
      0/7 via the Motorola. The repair reports per-router results
      (egress=<ok>/<routers>) and is also the egress signal 1548-2ilf uses
      for service eligibility. Rootless containers have had no IPv6 on any
      Linux host since this probe shipped (9b493d7a5).
    exit_criteria:
      - 'scripts/test-ipv6-probe.sh exits 0: a unit test proves the probe''s address list parses; with a stub route table of two routers where one black-holes, the probe reports egress=1/2 and does NOT declare IPv6 functional; with both working it reports 2/2 and init leaves containers.conf without --ipv4-only (pre-fix: the parse fails and the injector always runs)'
    verifiable_closure: |
