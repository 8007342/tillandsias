        shape was a packet carrying a `completion` event and a `ready` status at the same
        time, which is invisible. This instance is worse in the one way that matters for
        detection: the row carries NO terminal event at all. It was offered as fresh work
        while its fix sat in git history, so nothing in the ledger disagreed with anything
        and the only way to notice was to run `git log` against the packet's commits before
        claiming it — a step the claim protocol has no place to put.

        Two observations about the detection surface, both offered as scope for whoever
        takes this, neither claimed as the fix:

          1. A packet's `files:` list is already the join key. 1229-2862's files are
             crates/tillandsias-plan/src/groundtruth.rs and the corpus-declaration fixture;
             the commits that closed it touch exactly those paths. Checking "has every
             listed path been touched by a commit newer than the row's ready->claimed
             transition" would have caught it on day one and costs no agent judgement. It
             will produce false positives on a packet that legitimately re-touches a file
             while still open, so the cheap form is to SURFACE it as a claim-time warning
             ("this row's files moved in N commits since it was filed; the next action may
             already be landed") and leave the claim standing. A warning nobody has to
             un-ignore is worth more here than an automatic demotion that will be argued
             with on day three.

          2. A host that is about to spend a cycle on a p1 should be able to SEE that prior
             work exists without leaving the selector. plan_next cannot know, and asking it
             to would put git history in the selection hot path; the batch note's own
             "a cycle learns this by reading commits; the ledger is what makes it cost
             money" is the correct diagnosis and the ledger half of it is what this packet
             should build.

