    title: |
      a model of the client is not the client — write the instrument rule into methodology, with tonight's three instances and the two-observers-one-instrument corollary
    context: |
      THE RULE. When you check a behaviour, the check must exercise the thing
      that will actually run, not a stand-in that is easier to invoke. A
      stand-in answers a question of its own, and the two questions agree right
      up until the moment they matter.

      THE COROLLARY, which is the part that actually bit. Two people measuring
      independently with the SAME instrument have not measured independently.
      The coordinator measured A1 with `ssh-keygen -F`, I re-measured it
      separately with `ssh-keygen -F`, we got the same answer, and I reported it
      as an independent confirmation — which was true about the data and false
      about the confidence it bought. Agreement between observers is evidence
      only to the extent their instruments differ.

      THREE MEASURED INSTANCES FROM ONE NIGHT, all on lenovinha 2026-09-21:
      1. `ssh-keygen -F` vs the ssh client (1341-mgry). `ssh-keygen -F` does ONE
         literal known_hosts lookup; the real client does not stop there. The
         model said a bare `@cert-authority` line cannot match at port 2222; the
         client accepted it. An amendment instructing a future reader to "fix"
         correct code was derived from the model and struck only after someone
         ran the client.
      2. build-image.sh vs a lane launch (1344-q6uc). Checking the IMAGE for a
         fix returned yes; the sidecar a lane actually started did not have it.
         Two build paths write one tag from two different trees.
      3. A fixture that ran under the cliff (1342-r4pv). `scenario_renewal`
         renewed three times against a MaxAuthTries of six and asserted only
         that renewal had happened, so it could not have failed on the broken
         code whatever it asserted. An arm that cannot reach the failing region
         is a model of the test, not the test.

      RELATED AND NOT DUPLICATE: 1287-myx8 is about instruments that MATCH
      THEMSELVES (a pgrep that finds its own shell). This is the neighbouring
      error — an instrument that matches something else entirely, faithfully,
      and is believed because it is green. Both belong under one heading.
