    title: |
      A new project in the forge gets working branch-discipline hooks with no hand repair: install-hooks sets a repo-local hooksPath under the image's global one, tillandsias-plan is on PATH, raise writes a usable work_ref, and the hook, derive and warn-phase output tell the truth
    context: |
      Evidence: https://github.com/8007342/kumbia-kombat/blob/main/FORGE_DIAGNOSTICS.md (read with gh api repos/8007342/kumbia-kombat/contents/FORGE_DIAGNOSTICS.md).
      End users onboarding with prompt-to-app hit defects 1 and 2 first, so slices 1 and 2 must ship in the next stable (coordinator, 2026-10-18).
      Fix order is the exit_criteria order; each criterion is one slice and fails on today's code. The forge's unauthenticated gh is a known GitHub-flow gap and gets no row here.
      Refusal sites: crates/tillandsias-plan/src/discipline_hooks.rs:134 (refused:install-hooks:<scope>-hooks-path), scripts/install-hooks.sh:38, scripts/ensure-hooks.sh:99.
    exit_criteria:
      - "1 HOOKS-PATH: in a repo whose GLOBAL core.hooksPath is set (the forge image's ~/.gitconfig), `tillandsias-plan discipline install-hooks` exits 0, sets LOCAL core.hooksPath to the installed hooks dir, and prints a line naming that it did; red today (refused:install-hooks:global-hooks-path). NEGATIVE CONTROL: nothing is written into the global hooks dir (the 1442-wyf9 guard holds)"
      - "2 PLAN-ON-PATH: in the forge image, `command -v tillandsias-plan` resolves for the forge user's login and non-login shells, and an installed pre-push stub does not print blocked:hook:pre-push:no-plan-binary; red today (binary only in /usr/local/lib/tillandsias/policy-bin). Must ship in the next stable"
      - "3 WORK-REF-DEFAULT: `discipline raise --to 2` writes work_ref: 'work/[0-9]{3,4}-[a-z0-9]{4}' and `discipline check-ref work/1234-abcd` then passes; a template-looking value (work/<id>) is refused as not-a-regex at raise/validate time; red today (no work_ref written)"
      - "4 DENIED-MESSAGE: the embedded pre-push template prints the seed's messages.default_branch_denied when set (fixture: a custom string appears verbatim in the refusal); red today (canned wording)"
      - "5 DERIVE-HOOKS-PATH: `discipline derive` lists installed hooks from core.hooksPath when set (fixture: local hooksPath with a pre-push stub -> installed_hooks contains pre-push); red today (installed_hooks=[])"
      - "6 WARN-PHASE-LOUD: while seed-ahead-of-reality downgrades default-branch-protected to a warning, the pre-push output contains a line stating the push WILL be accepted; red today (a probe commit landed on kumbia-kombat origin/main unnoticed)"
      - "7 NO-CWD-METRICS: running tillandsias-plan inside a project writes no .cache/metrics under the project CWD (fixture: run a discipline subcommand in a scratch repo, assert no .cache/ created); red today (.cache/metrics/command-policy-audit.jsonl in the repo root)"
      - "8 NO-TRAILING-SLASH: no discipline/tooling output renders the integration branch as 'game/' (fixture greps the rendered wording for '<branch>/ integration'); red today"
    unscoreable: "unpinnable-until-the-guard-exists: each slice writes its fixture red first in the same change (tillandsias-plan cargo tests for 1,3,4,5,6,7,8; a forge-image litmus for 2)"
    next_action: >
      Slice 1 first: in discipline_hooks.rs, when only a GLOBAL hooksPath is set, set the local one and say so instead of refusing; mirror in scripts/install-hooks.sh. Then slice 2 in the forge image build.
