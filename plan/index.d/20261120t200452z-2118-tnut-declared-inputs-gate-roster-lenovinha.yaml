      Accepted plan: (a) declared inputs on non-Rust steps, each skip mutation-proven, keep-unconditional untouched; (b) Rust families concurrent with shell steps, same target dir only where cargo's lock serialises builds, peak RSS under 70% of RAM or a capped job count; (c) a Rust skip only for plan-ledger-only trees; (d) a worktree-shared archiver memo keyed on content.
