packets:
  - packet_id: bare-metal-expert-inference-parity
    order: 718-rtnh
    status: ready
    desired_release: v0.5
    priority: p1
    kind: milestone
    title: "Expert-system inference parity for bare-metal development hosts (Windows/WSL2 first, Linux second)"
    pickup_role: any
    capability_tags:
      - experts
      - inference
      - windows
      - wsl2
      - mcp
    context: |
      OPERATOR DIRECTIVE 2026-08-13: development hosts should use the same
      expert system the in-forge agents use, not a deterministic YAML reader
      wearing its name. The stated purpose is an inference layer ON TOP of the
      deterministic ledger query, so story-shaped questions ("what's next",
      "what's blocking story N", "give me forgotten bugs nobody is fixing")
      return answers with the entropy a pure minimax triage cannot produce —
      the operator's framing is that WLLN and SLLN have to play together, and a
      deterministic ranker alone starves the tail forever.

      MEASURED FIRST, because the gap is smaller and differently shaped than it
      looks from the outside. Three tiers exist and only the top one needs
      inference at all:

        L0   deterministic — plan_answer/query/next/status/ready/blocked_*,
             methodology_ask/path, grade, spec-index, spec-retrieve,
             spec-envelope. Pure Rust, network-free. ALREADY at parity on every
             host; a working binary is its only requirement.
        L0.5 semantic fallback — semantic_expert.rs. Deterministic keyword and
             heading scoring over plan/loop_status.md + plan.yaml, with an
             OPTIONAL Ollama /api/generate call that only REWORDS the section it
             already selected. Absent endpoint returns the raw section with the
             same citation and the same confidence. Cosmetic.
        L1   RAG spec expert (spec_answer) — the ONLY capability that genuinely
             dies without inference, because it needs an embedding endpoint both
             to embed the query and to have built vectors.jsonl at all.

      AND THE PARITY BAR IS LOWER THAN "MATCH THE FORGE", because the forge does
      not have this either: TILLANDSIAS_EMBED_ENDPOINT and
      TILLANDSIAS_SPEC_EXPERT_ENDPOINT are read by
      images/default/config-overlay/mcp/forge-plan.sh and assigned NOWHERE in
      the repo; nothing builds the RAG index; orders 549 and 552 (the wiring
      packets) are still ready. A delegate hit exactly this on 2026-08-13 and
      filed 712-r5x8. So this milestone is not "catch Windows up" — it is
      "build the tier once, on the host that can iterate on it fastest, and
      wire the forge to the same contract".

      WINDOWS ARCHITECTURE, corrected against a wrong first reading. The MCP
      servers on this host are NOT Git-Bash processes reading a Windows binary:
      .mcp.json launches `bash images/default/config-overlay/mcp/*.sh` and the
      bash that answers is WSL's. Evidence: every envelope this host received
      across 1766 expert calls carries
      `citation_root: /mnt/c/Users/bullo/claudia/tillandsias` — a WSL path — and
      target/release/tillandsias-plan is an ELF. So the servers already live in
      WSL2 and the ELF is the CORRECT binary there.

      That is the whole architectural finding: on Windows the expert servers and
      the container runtime share one substrate, so an endpoint does not have to
      cross the Windows/WSL boundary. It has to be reachable FROM THE DISTRO.
      This host's WSL networking mode is `nat`, so a Windows-side
      127.0.0.1:11434 is NOT reachable from the distro, while an endpoint inside
      it is trivially so. A bare-metal Windows ollama is therefore the WORST of
      the available options, not the obvious one.
    outcome: |
      A development host answers story-shaped questions through the same
      cited-envelope contract the forge uses, with inference adding entropy and
      synthesis on top of the deterministic ledger rather than replacing it.
    exit_criteria:
      - "Every rung below is closed, or explicitly retired with its reason."
      - "The same endpoint contract serves bare metal and in-forge; no host carries a private variant."
    events:
      - type: filed
        ts: "2026-08-13T23:00:00Z"
        host: windows
        summary: |
          Filed from operator directive plus two research passes. Milestone, not
          implementation: the rungs below are the demonstrable steps.

  - packet_id: expert-inference-endpoint-contract-for-dev-hosts
    order: 718-ja7g
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: bare-metal-expert-inference-parity
    kind: feat
    title: "One documented endpoint contract a dev host can satisfy, and a probe that says which tier is live"
    deliverable: "env contract + a `tillandsias-plan experts-probe`-style verdict consumed by both MCP servers"
    pickup_role: any
    capability_tags: [experts, inference, mcp, fail-loud]
    estimated_hours: 3
    context: |
      TILLANDSIAS_INFERENCE_ENDPOINT is READ in three places
      (semantic_expert.rs, lib-inference-state.sh, project-info.sh) and WRITTEN
      in none. TILLANDSIAS_EMBED_ENDPOINT and TILLANDSIAS_SPEC_EXPERT_ENDPOINT
      are read by forge-plan.sh and written nowhere. The contract exists as
      three orphan reads; a host cannot satisfy it because nothing states what
      satisfying it means.

      Two live traps for whoever writes it, both found by reading the code
      rather than by running it:
        * semantic_expert.rs:212 parses the endpoint with `addr.parse::<SocketAddr>()`,
          so a HOSTNAME silently yields None. `inference:11434` — the forge's own
          alias — cannot work through this path. It needs a literal IP:port.
        * semantic_expert.rs:182 ignores any value not starting with `http://`,
          so an https endpoint is silently dropped.
      Both fail closed and silently, which is the class this repo keeps
      repairing. Fix them or document them, but do not leave them as folklore.
    exit_criteria:
      - "A single documented contract names each variable, its shape (Ollama native vs OpenAI /v1), and which tier it unlocks."
      - "A probe reports which tiers are live as a typed one-line verdict, in the closed vocabulary lib-inference-state.sh already uses, and both MCP servers consume it instead of each re-deriving reachability."
      - "The two silent-drop traps in semantic_expert.rs are fixed or explicitly documented as constraints, with a test either way."
      - "NEGATIVE CONTROL: with no endpoint set, every L0 tool still answers with citations and the probe says so — degradation must stay silent-free, not answer-free."

  - packet_id: wsl2-inference-substrate-decision
    order: 718-nkm2
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: bare-metal-expert-inference-parity
    kind: decision
    title: "Where the dev-host inference endpoint lives on Windows: in-distro, published container port, or mirrored networking"
    deliverable: "a recorded decision + the smallest wiring that satisfies it"
    pickup_role: windows
    capability_tags: [windows, wsl2, inference, networking]
    estimated_hours: 3
    context: |
      The MCP servers run inside WSL2 (see the milestone). WSL here is in `nat`
      mode. That makes the options concrete and unequal:

        A. ollama INSIDE the tillandsias-build distro — endpoint 127.0.0.1:11434
           from the servers' own perspective. No boundary, no gateway IP, no
           global WSL setting. Costs a second model cache in the distro.
        B. publish the podman inference container's port
           (`--publish 127.0.0.1:11434:11434` in build_inference_run_args,
           main.rs:3593-3752, which today publishes nothing). Reuses the model
           cache and the tier/GPU pinning already built. Requires the container
           runtime and the MCP servers to share a reachable network.
        C. mirrored WSL networking (.wslconfig networkingMode=mirrored) so
           Windows-side localhost is reachable from the distro. Global to every
           distro on the machine; an operator-scope change.
        D. bare-metal Windows ollama — WORST under nat: unreachable from the
           distro without the gateway IP, which moves across reboots.

      Do not pick by preference. Pick by which one an unattended cycle can
      re-establish after a reboot without an operator, and record why.
    exit_criteria:
      - "The decision is recorded with its reason and its failure mode after a host reboot."
      - "The chosen option is wired so a cold host reaches a live endpoint with no manual step, or the manual step is named in the startup context."
      - "Measured: an actual expert call on this host returns a synthesized-and-cited envelope, quoted in the closing event."

  - packet_id: story-shaped-eager-work-packets
    order: 718-jqt5
    status: ready
    desired_release: v0.5
    priority: p2
    release_target: bare-metal-expert-inference-parity
    kind: feat
    title: "Story-shaped expert questions that generate eager work packets, with inference supplying the entropy triage cannot"
    deliverable: "expert query surface + the packets it yields"
    pickup_role: any
    capability_tags: [experts, plan, triage, entropy]
    estimated_hours: 4
    context: |
      OPERATOR FRAMING, recorded because it is the design rationale and not a
      restatement of the feature: triaging strictly by points starves the tail —
      some things never get done — while triaging everything equally makes no
      progress. An inference layer over the deterministic query introduces the
      noise numerical methods need for monotonic convergence, letting the weak
      and strong laws of large numbers operate together.

      Note the selector ALREADY implements the deterministic half of this:
      score-weighted entropy over the top-3 epics from a printed seed
      (methodology/distributed-work.yaml cycle_batch_triage). This packet is the
      layer above it — questions a human asks in words, answered over the same
      cited envelopes: "what's next", "what's blocking story N", "give me a few
      forgotten bugs nobody is fixing".

      "Forgotten" is the interesting one and the reason this is not a prompt
      template: it is a property of the LEDGER (no events for N days, no lease
      ever taken, low blocking weight so minimax never surfaces it) and the
      deterministic layer can compute it exactly. Inference should phrase and
      cluster the result, NOT decide it — otherwise the entropy stops being
      reproducible and the batch stops being replayable from its seed.
    exit_criteria:
      - "A deterministic `forgotten`-style projection exists (age since last event, never-leased, low blocking weight) and is unit-tested, so the selection is reproducible from a seed."
      - "Story-shaped questions route through it and return cited envelopes; an absent inference endpoint degrades to the deterministic list rather than refusing."
      - "Running it yields real packets filed as fragments, and the closing event quotes at least three that were genuinely un-surfaced by minimax."
      - "NEGATIVE CONTROL: the same seed yields the same set, so the added entropy is reproducible and auditable rather than nondeterministic."
