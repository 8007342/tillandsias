packets:
  - packet_id: remove-nogpgcheck-from-base-images
    order: 588-3irh
    desired_release: v0.5
    title: "The base image installs everything with RPM signature verification DISABLED, while enforcing Sigstore on optional tools"
    status: ready
    kind: fix
    deliverable: images/default/Containerfile.base + images/chromium/Containerfile.core
    depends_on: []
    pickup_role: linux
    capability_tags: [security, supply-chain, containers, provenance]
    estimated_hours: 2
    outcome: >
      VERIFIED 2026-08-01. images/default/Containerfile.base:14 and
      images/chromium/Containerfile.core:10 install the ENTIRE base — bash,
      coreutils, git, gh, gcc, rust, node, java — with --nogpgcheck, i.e. RPM
      signature verification turned OFF. The same image then enforces Sigstore
      attestation on OPTIONAL on-demand utilities.
      So the layer everything else stands on is the unverified one, and the layer
      verified hardest is the one that matters least. That is provenance applied
      upside down, and it is the cheapest correction available.
      Likely to just work: images/chromium/Containerfile.framework:22 and :43 and
      images/inference/Containerfile:17 ALREADY run microdnf install without the
      flag, so the pattern is proven in this repo. NOT yet tested with a build —
      the flag may have been added for a real reason nobody recorded, and if so
      that reason belongs in a comment beside it.
      Independent of all brew work and strictly larger in blast radius.
    exit_criteria:
      - "no Containerfile installs packages with --nogpgcheck, or each remaining use carries a recorded justification"
      - "the images still build and the litmus suite passes"
      - "a litmus fails if --nogpgcheck reappears without a justification comment"

  - packet_id: bake-allowlisted-tools-into-the-image
    order: 588-dx63
    desired_release: v0.6
    title: "Bake the Fedora-available on-demand tools into the image so no runtime credential is needed for them"
    status: ready
    kind: implementation
    deliverable: images/default/Containerfile.base + a reduced brew tools allowlist
    depends_on: [remove-nogpgcheck-from-base-images]
    pickup_role: linux
    capability_tags: [supply-chain, containers, brew, provenance, ephemerality]
    estimated_hours: 6
    outcome: >
      Measured 2026-08-01: the brew tools allowlist carries 80 entries; 14 are
      already baked into Containerfile.base; of the remaining 66, roughly 43
      resolve in Fedora 44 under first-guess package names (an APPROXIMATE
      mapping — treat as a lower bound and re-derive before relying on it), and
      about 23 have no Fedora package (cosign, sops, dive, pandoc, zellij,
      starship, lazygit, dasel, gron, jless, taplo, broot, bottom, watchexec, xh,
      doggo, websocat, ast-grep, kubectl, fx, dust, lazydocker, 7zz).
      Baking the Fedora-available set covers roughly 57 of 80 with NO runtime
      credential, and moves their provenance to RPM signing at image BUILD time,
      which is where a credential is legitimate. It also removes a second package
      manager from a container meant to be disposable.
      Cost, stated rather than hidden: image size grows, and the tool set becomes
      a rebuild-cadence decision rather than an on-demand one. The operator should
      see the size delta before this lands.
    exit_criteria:
      - "the Fedora-available subset is installed at build time and the allowlist shrinks to only what genuinely needs brew"
      - "no runtime credential is required for any baked tool, proven by installing one in a lane with no token present"
      - "the image size delta is measured and reported, not assumed acceptable"

  - packet_id: own-the-attestation-fetch-so-lanes-need-no-github-identity
    order: 588-ttex
    desired_release: v0.6
    title: "Fetch and pin attestation bundles at BUILD time; verify at runtime with a shipped bundle so no forge holds a GitHub identity"
    status: ready
    kind: implementation
    deliverable: build-time bundle fetch + pinned trusted root + runtime verification against the shipped bundle
    depends_on: [bake-allowlisted-tools-into-the-image]
    pickup_role: linux
    capability_tags: [security, supply-chain, provenance, sigstore, brew, credentials]
    estimated_hours: 10
    outcome: >
      THE DESIGN THAT REMOVES THE IDENTITY — the operator's objection answered
      structurally rather than mitigated.
      ESTABLISHED BY RESEARCH 2026-08-01: verifying a Sigstore/SLSA attestation
      requires NO identity from the verifier. Reproduced with no token, no gh
      config, and inside a network namespace with no interface at all: exit 0,
      real certificate chain, correct signer; one flipped byte gives exit 1. The
      GitHub token in Homebrew's path is a RATE-LIMIT credential for the API call
      that FETCHES the bundle. gh refuses any API call without a token, which is
      a CLIENT-side gate, not a server-side one — gh's own authors exempt the
      bundle flag from that check, and Homebrew never passes it.
      SO: fetch bundles anonymously at IMAGE BUILD time, ship them plus a pinned
      trusted root (about 34 KB) into the image, and at runtime fetch the bottle,
      verify it against the shipped bundle and pinned root, then install. Pure
      shell; gh is already in the base image.
      THREE CORRECTIONS THAT WOULD OTHERWISE BITE, each from adversarial review.
      Do NOT pin a single signer workflow: homebrew-core signs from several, so
      pinning one fails closed on every dispatch-rebottle-signed bottle — use a
      certificate-identity regex. ORDERING IS LOAD-BEARING: disabling Homebrew's
      own verification and checking AFTER install is verify-after-execute, which
      is strictly weaker than today; fetch, verify, THEN install. And runtime
      egress does not collapse to ghcr.io, because the shim still clones the
      Homebrew repo and resolves formulae via the brew.sh API — what this removes
      is Sigstore egress and the credential.
      HONEST COSTS: upstream bottle digests rotate, so pinned bundles go stale and
      the affected formula fails until rebuild (arguably a feature here); and a
      cached trusted root cannot observe key revocation between builds — GitHub
      warns about exactly this, so regenerate it every build.
    exit_criteria:
      - "a forge lane installs an allowlisted tool with attestation verified and NO GitHub credential present anywhere in the lane"
      - "verification runs BEFORE install, proven by a fixture where verification fails and nothing is installed"
      - "the trusted root is regenerated per image build, and a stale root is detected rather than silently trusted"

  - packet_id: cheatsheet-provenance-make-the-validator-honest-then-sign-a-manifest
    order: 588-8mh8
    desired_release: v0.5
    title: "Cheatsheets claim provenance nothing verifies, and the tooling renders that absence to agents as a verification badge"
    status: ready
    kind: fix
    deliverable: policy-crate validator honesty + a signed cheatsheet manifest gating the image bake
    depends_on: []
    pickup_role: linux
    capability_tags: [security, provenance, cheatsheets, agents, prompt-injection, supply-chain]
    estimated_hours: 8
    outcome: >
      OPERATOR DIRECTION 2026-08-01: "Rightful provenance at every abstraction
      layer is the way to go" — binaries AND cheatsheets.
      MEASURED, not asserted. crates/tillandsias-policy/src/main.rs:4505-4513
      emits its partial-verify marker PRECISELY WHEN NO HASH EXISTS. INDEX.md
      carries 143 such markers and zero verified ones. 144 of 144 bundled
      cheatsheets have no baked sha256, and main.rs:326-334 routes that to notes
      rather than warnings, so strict mode prints "all tier checks passed" and
      exits 0. The rest of the frontmatter is unenforced assertion: 36 files
      violate the authority enum; 93 assert current status while their own
      last_verified is past the spec's 90-day cutoff; 48 of 170 claiming
      hand-curated also carry a literal TODO marker saying they were not; 0 of 73
      pull-on-demand recipes contain any integrity check.
      THE VERIFICATION LAYER WAS TOMBSTONED IN PLACE.
      litmus-cheatsheet-source-layer-shape.yaml:85 asserts that the source
      contains the string "no sources fetched yet; nothing to validate" — a test
      asserting the presence of the message a checker prints when it verifies
      nothing. Coverage measures the presence of a checker, not of checking.
      WHY THIS OUTRANKS THE BINARY LAYER. A tampered binary runs sandboxed as the
      user. A tampered cheatsheet is INSTRUCTIONS AN AGENT FOLLOWS, plus shell
      commands it is told to run, delivered into context with an authority badge,
      while the agent holds the lane's credentials. lib-common.sh has three
      unauthenticated merge paths, including an undeclared project shadow copied
      over a forge default with NO in-file marking (its own comment says so), and
      a pass that appends every markdown file in the pull cache to the index as
      pulled. That is OWASP LLM01 indirect prompt injection crossed with LLM03
      supply chain.
      PROPORTIONATE FIX, and GitHub's own guidance says exactly this: sign
      manifests that include hashes of contents, NOT individual documentation
      files. One signed manifest, not 219 signatures.
      TIER 0, no crypto, do first: make the validator honest. Never claim
      verification where no hash exists; route a missing hash to warnings; COMPUTE
      status from last_verified rather than trusting it; validate the authority
      enum; make the TODO-marker-plus-hand-curated combination an error; and fix
      or delete scripts/check-cheatsheet-staleness.sh, whose line 3 is a freshness
      header dated today asserting everything is under 90 days while the script
      reports 217 of 217 stale — 215 of those only because it greps for a prose
      "Last updated" line the corpus abandoned for frontmatter. The checker
      measures a field that no longer exists, then self-attests that it ran clean.
      TIER 1: a sorted sha256 manifest (pure coreutils), signed in the release
      workflow with cosign sign-blob. THE SIGNER IS THE WORKFLOW'S OIDC IDENTITY,
      NOT A HUMAN'S — the correct answer to the operator's inversion complaint,
      and something this repo already gets right for binaries. UNRESOLVED BEFORE
      BUILDING: verifying at boot against a manifest baked into the same image
      layer is a self-consistency check, not an authenticity check, unless the
      trust root is pinned OUTSIDE the image. Solve that first or this rebuilds
      the same false badge at a higher altitude.
      TIER 2, no crypto, highest blast-radius value: anything reaching the
      in-image cheatsheet directory that is not in the manifest gets a mandatory
      in-body banner at merge time, before any content. The silent
      undeclared-shadow copy must not stay silent, and the pulled marker must say
      UNVERIFIED.
      RESIDUAL, stated plainly: none of this answers whether a cheatsheet's
      content matches its cited sources. That was the tombstoned source layer's
      job, it is genuinely harder, and a manifest signature must not be allowed to
      imply it.
    exit_criteria:
      - "no marker claims verification where no hash exists; strict mode FAILS on the current corpus until the gaps are closed or explicitly waived"
      - "status is COMPUTED from last_verified, never trusted from the file"
      - "a signed manifest gates the image bake, with the trust root pinned outside the image"
      - "any unmanifested cheatsheet reaching the in-image directory is banner-marked in-body before its content"
