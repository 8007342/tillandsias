- packet_id: macos-status-poll-stops-reading-the-keychain-twice-per-tick-and-root-token-memo-is-memory-only
  order: 1919-keyc
  status: ready
  kind: feature
  priority: p0
  desired_release: v0.5
  pickup_role: macos
  capability_tags:
  - macos
  - vault
  - keychain
  - security
  estimated_hours: 4
  title: macOS status poll no longer spawns security find-generic-password twice per tick; Vault root token is memoized in memory only and zeroized
  context: 'operator-requested audit 2026-10-28. Source: scratch/research/caching-audit.md rows 4 and 5, fix 3. installation_uuid::deliver_and_handover_in runs from the action_host status poll, so every tick spawns security find-generic-password twice (share + token) and logs "recovered root token"; read_and_handover_root_token has 18 call sites with no memo (50 ms to several s each). Fix: a per-process "handover delivered for guest boot-id" flag (cache the flag, never the secret) plus an in-process OnceLock<Mutex<Option<Zeroizing<String>>>> root-token memo cleared on heal_stale_root_token / persist_healed_root_token. Sensitive: memory only, zeroize, never disk. The fallback_vault-root-token-v1 plaintext file is a separate concern for the no-plaintext-credentials ruling, not this packet. Rule: any new cadence or interval needs operator approval with its wakeups/hour; prefer event sources.'
  exit_criteria:
  - A 10-minute idle macOS tray run under fs_usage/execsnoop shows 0 security spawns from the status poll after the first delivery; today 2 per tick.
  - '`tillandsias --debug` launch log has at most one "recovered root token" line per process; today one per Vault op, up to 18.'
  - A test asserts the memo is zeroized on drop and never written to disk.
  verifiable_closure: Log and spawn counts attached from a macOS host plus the zeroize test passing.
  unscoreable: 'unpinnable-until-the-guard-exists: the fixture or probe named in the exit criteria lands with the fix (1136-n8sh).'
  next_action: 'Nothing is built yet. Left: add the delivered-flag keyed on guest boot-id, add the zeroizing memo with invalidation on heal paths, write the log-count test first, then measure on a macOS host.'
  provenance: operator-requested audit 2026-10-28; research report scratch/research/caching-audit.md rows 4 and 5, fix 3 (macuahuitl, 2026-10-28). Operator asked for the audit; priorities set by the filing request.
