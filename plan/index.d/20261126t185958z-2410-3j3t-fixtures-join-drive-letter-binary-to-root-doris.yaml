    title: |
      Six Lua fixtures treat a C:/ plan binary as relative (`x:sub(1, 1) ~= "/"`), join it to ROOT, and spawn "C:/root/C:/..." on msys (os error 123)
    context: |
      fixture.plan_binary() returns a drive-letter path on Windows. These fixtures absolutize with
      `if X:sub(1, 1) ~= "/" then X = ROOT .. "/" .. X end`, so the spawn fails with os error 123
      ("filename, directory name, or volume label syntax is incorrect") and every arm built on it is red or
      skipped. Siblings (test-litmus-budget-tally, test-door-serial-lua-declaration, test-fixture-scratch-git-added)
      already add `and not X:match("^%a:[/\\]")`; the same guard is applied here. Linux is unchanged: a
      Unix path never matches ^%a:.
