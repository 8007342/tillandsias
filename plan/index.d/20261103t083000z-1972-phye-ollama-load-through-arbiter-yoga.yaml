    title: An Ollama model load goes through the GPU arbiter, so it evicts a resident image engine before claiming VRAM
    context: 'Split from 1971-3erz criterion 3 (coordinator macuahuitl-fedora, 2026-11-03). #883 keeps a resident sd-server warm for TTL seconds; it yields to studio jobs (they take the GPU queue) and exits at its TTL, but an inference request to Ollama loads its model without asking the 1957-emar arbiter, so the two can sit in VRAM together and the second loader can OOM or spill to the CPU. The arbiter today only evicts LLM residents FOR image jobs, never the other way round.'
    exit_criteria:
      - 'A host-side LLM load (the inference path the tray brokers) takes a GPU-queue turn and calls imagegen_warm::release before the model loads; a fixture with a resident-engine stub and a stub Ollama shows the release happens before the load request (red on today''s tree: no release).'
      - 'gpu.status lists the resident image engine as a holder (name, model, VRAM when measurable), so an agent can see why VRAM is taken.'
      - 'MEASURED on a GPU host: with the image engine warm, an LLM request leaves no tillandsias-imagegen-warm container running and the LLM placement is GPU, not mixed.'
    verifiable_closure: 'The ordering fixture red on today''s tree, plus the live arm recorded as an event with its regime.'
    unscoreable: 'unpinnable-until-the-guard-exists: the claimer writes the fixture and names its litmus in the same commit (1136-n8sh).'
    next_action: 'Find where the tray brokers an inference request to Ollama; take the GPU turn there and release the warm engine first; add the holder to gpu.status.'
    provenance: macuahuitl-fedora 2026-11-03 (coordinator), split from 1971-3erz criterion 3; filed by yoga.
    depends_on: [image-generate-reports-its-engine-timings-and-a-second-call-within-minutes-reuses-a-warm-engine]
    related: [1971-3erz, 1957-emar]
    events:
      - type: filed
