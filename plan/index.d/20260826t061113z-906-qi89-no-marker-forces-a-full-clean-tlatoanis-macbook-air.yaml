packets:
  - packet_id: absent-marker-triggers-a-full-cargo-clean-on-an-unbloated-host
    order: 906-qi89
    status: ready
    kind: enhancement
    pickup_role: any
    priority: p3
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    depends_on: []
    deliverable: |
      `reason=no-marker` initialises the marker rather than prescribing a full
      `cargo clean` on a host that is nowhere near the size threshold — or the
      policy states deliberately that a never-swept host should pay one sweep,
      and says why.
    capability_tags:
      - tooling
      - velocity
      - methodology
    tags:
      - build-cache
      - trigger-semantics
      - v0.5
    title: |
      A never-initialised marker makes the build-cache sweep "due" on a host at 18 GiB of a 40 GiB threshold, prescribing a full `cargo clean` — paying a complete rebuild for a bookkeeping absence.
    context: |
      MEASURED on tlatoanis-macbook-air across three consecutive cycles
      2026-08-26: `due:build-cache-sweep:bytes=18981728256:gib=17:marker=absent:reason=no-marker`.

      The verdict is correct by the letter of the rule. `build_cache_hygiene`
      triggers on "target/ exceeds 40 GiB, OR a marker older than 14 days",
      and a marker that has never been written is not younger than 14 days.
      But THE TWO TRIGGERS MEAN DIFFERENT THINGS and the reason field already
      distinguishes them: `over-size` is evidence of bloat, `stale-Nd` is
      evidence of neglect, and `no-marker` is evidence of NEITHER — it says
      only that this host has not stamped before.

      The prescribed action is `cargo clean`, which the policy itself calls
      out as expensive: "a full `cargo clean` forces a full rebuild next
      cycle, so it must be rare". Paying that because a marker was never
      initialised, on a host at 45% of the size trigger, inverts the rarity
      the rule is built around. A fresh host would pay it on its first cycle,
      which is also the cycle where a warm cache is worth the most.

      WHAT I DID INSTEAD, offered as data rather than as the answer: stamped
      the marker with an honest action string recording that no reclaim was
      performed and why — `cargo-clean:SKIPPED-under-threshold(18GiB<40GiB);
      reason:trigger-was-marker-absent-not-size`. That starts the 14-day
      clock, leaves the cache intact, and is falsifiable by anyone reading the
      marker. It is defensible under the `--action` requirement, which exists
      so a stamp records WHAT ran rather than merely that something did — but
      it is an agent deciding the trigger did not mean what it said, which is
      the shape this packet exists to resolve properly.
    exit_criteria:
      - |
          `no-marker` on a host under the size threshold either (a) initialises
          the marker and reports not-due, or (b) remains due WITH the policy
          stating explicitly that a never-swept host pays one sweep and why
          that is worth a full rebuild. Either is fine; the current state —
          due, with the expensive action prescribed and no rationale for the
          no-marker case specifically — is what should not persist.
      - |
          The three reasons stay DISTINGUISHABLE in the verdict, whichever way
          it resolves. `over-size`, `stale-Nd` and `no-marker` are different
          facts and a caller branching on `due:` alone cannot tell them apart.
      - |
          NEGATIVE CONTROL: a genuinely bloated host (over the size threshold)
          and a genuinely stale one (marker past the window) both still report
          due. Without this leg, "initialise on no-marker" could be
          implemented as "always initialise", which would disable both real
          triggers and pass every not-due assertion.
    verifiable_closure: |
      NAMED: extend `litmus:build-cache-sweep-trigger` with a no-marker case
      under the size threshold, asserting whichever verdict the resolution
      chooses, PLUS the two negative-control legs above so the fix cannot
      degrade into a blanket not-due. The suite already contains both trigger
      directions, so the controls are cheap to add beside them.
    notes: |
      Filed by the host that hit it three cycles running and each time
      declined to run the clean. Related but separate: 905-97xh, the same
      script recording its marker date in local time while its own `utc=`
      field records UTC.

      This is a POLICY question as much as a code one — whether a fresh host
      should pay a sweep it has no evidence of needing — so the answer may be
      "leave it, and document the reasoning", which is a legitimate outcome
      and should be recorded as a decision rather than left implicit.
