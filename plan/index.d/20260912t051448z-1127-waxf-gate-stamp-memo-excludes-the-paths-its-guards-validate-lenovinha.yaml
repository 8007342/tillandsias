      PRE-FIX RESULT: FAILS. The gate exits 0 in ~450 ms via the memo without
      running the guard, which is directly measurable today —
      `bash scripts/gate-stamp.sh compute` is byte-identical before and after
      adding a plan/index.d/*.yaml file, and moves on one appended line in any
