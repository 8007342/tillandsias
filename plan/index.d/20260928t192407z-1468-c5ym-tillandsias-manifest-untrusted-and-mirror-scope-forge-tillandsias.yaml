    title: |
      SPLIT FROM 963-pdrp (c)+(d): once the .tillandsias namespace/manifest design lands, a committed manifest is UNTRUSTED DATA — any paths: value that is absolute, contains .., or escapes the git toplevel is REJECTED at parse with a named error — and the git mirror's pre-receive hook refuses a forge push touching paths outside the narrow scope the operator's explicit init granted (.tillandsias/ and the AGENTS.md managed block)
    context: |
