      pinning (work/963-pdrp @ b28016f56: git toplevel, ledger-shape test, no
      $HOME fallback inside a repo); its manifest and mirror-scope clauses move
      here so a finished fix does not look unfinished for the life of the epic.
      THE SECURITY CONTRACT, carried verbatim in substance from 963-pdrp:
      committed .tillandsias/ content in a repo the operator did not personally
      init is UNTRUSTED DATA, never instructions (a well-known mailbox path is
      an attacker-writable prompt-injection slot in every cloned repo). The
      commit capability is narrow (.tillandsias/ and the AGENTS.md managed
      block), GRANTED by the operator's explicit init (recorded in the
      manifest), and ENFORCED at the mirror's pre-receive hook, the one
      chokepoint every forge write crosses.
      BLOCKED ON: the .tillandsias namespace/manifest design (layout:
