        THIRD INSTANCE, MINE, AND IT LANDED IN A PUSHED COMMIT MESSAGE — which is the one place this defect is UNFIXABLE.

        Commit 7dc5aff21 was meant to read "a five-line rationale on stderr that every caller discards with `| tail -1`". It landed as "...discards with ." Bash command-substituted the backtick-quoted token out of a double-quoted `git commit -m` argument, printed two syntax errors that scrolled past under a successful land, and the subject of the sentence is gone. A pushed commit message cannot be corrected, so unlike the two ledger instances this one is permanent.

        THE IRONY IS LOAD-BEARING, NOT DECORATIVE: the commit was filing 993-yqie, a finding about a real signal being destroyed by the channel it travels through. I destroyed the sentence describing that, through the same mechanism, in the act of describing it.

        WHAT THIS SAYS ABOUT 971-7muc'S SCOPE, and it is the reason I am recording it here rather than as a new row. This packet's exit criteria are written for the LEDGER path — append-event and packet filing take prose from a file or stdin. That fix is right and it is landed. It does not cover `git commit -m`, which is the same hazard through a different tool, and every host writes commit messages every cycle. My own earlier commits tonight used `git commit -F -` with a QUOTED heredoc delimiter and were unaffected; this one used `-m` with a double-quoted string and was not. So the remedy already exists and is simply not universal: the safe form is `-F -` with `<<'EOF'`, and the unsafe form is one keystroke away and looks identical in a transcript.

        WHAT I AM NOT PROPOSING: a guard that scans commit messages for backticks. The pre-commit hook could reject an unbalanced backtick, but the corruption here produced a BALANCED, valid, plausible sentence — "discards with ." parses fine and reads as clumsy prose rather than as damage. That is the same property that made the ledger instances invisible, and it is why the remedy has to be at the input channel rather than at a validator.

        CONCRETE ASK for whoever implements this packet: extend the exit criteria to commit messages, and state the safe form explicitly where agents will read it — `git commit -F -` with a quoted heredoc, never `-m` with a double-quoted string containing prose. Three instances now, three different tools (append-event argv, filing heredoc, commit -m), one mechanism.
