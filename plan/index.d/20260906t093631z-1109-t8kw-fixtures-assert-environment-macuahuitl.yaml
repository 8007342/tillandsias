      scripts/test-selector-drops-cross-branch-claims.sh, is a shell fixture.
      
      Take all three together; they are one class and separate repairs would
      re-derive the same rule three times. For each, first REPRODUCE the red on a
      host that lacks the property (no repo-local identity; low-end tier), then
      make the arm either construct the property or skip with a named reason.
      Then check whether any OTHER fixture asserts a property of its host —
      enumerate rather than fix the three that happened to fire, since these three
      only surfaced because a release gate and a low-end host ran them.
