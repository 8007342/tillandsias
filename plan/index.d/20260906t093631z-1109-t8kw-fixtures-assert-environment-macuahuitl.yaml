    verifiable_closure: |
      bash scripts/run-litmus-test.sh meta-orchestration --phase pre-build and
      bash scripts/run-litmus-test.sh forge-environment-discoverability must both
      pass on a host with NO repo-local git identity in the scratch checkout and
