      summary: |-
        THE THREE-LANE INVERSION, found by pirria-tillandsias-forge and the real lesson of this packet. macOS is bounded by explicit policy: guest_sizing is half the host less a named 6 GiB reserve, capped at 32 GiB, rounded to a whole GiB, with the comment 'No lower clamp: the reserve wins (978-juw4)' at vz.rs:980. VERIFIED on trunk - GUEST_FLOOR_MEMORY_BYTES now survives only in comments describing what the OLD tests asserted, so macneo's inversion landed and the sizing bug is NOT on current trunk. Windows/WSL2 is bounded INCIDENTALLY, not by policy: nothing in the tree configures a WSL2 memory bound, and .wslconfig appears in wsl.rs only as operator advice inside error text, never as something we write - so the guest is bounded by whatever the WSL2 runtime defaults to, a bound we neither set, read, nor assert. That is a THIRD state, 'bounded by someone else's default', unfalsifiable from inside our tree. Linux is the only lane with no bound at all. THE INVERSION: the lane where bounding is HARDEST - a VM, where memory must be decided before boot and cannot change after - got a considered policy, a named reserve, a cap, a rounding rule, a loud refusal below viability, and a whole packet devoted to fixing its floor. The lane where bounding is EASIEST - a cgroup, one flag on the podman line, adjustable at runtime - got nothing. Difficulty of mechanism is INVERSELY correlated with care over policy, because a VM forces the question at boot while a cgroup lets you never ask it. An unset cgroup limit is not a decision anyone had to make, so nobody made one. THIS ALSO EXPLAINS HOW 3d7fb86da PASSED REVIEW, which is more useful than blaming the commit: on a lane where the number must exist for the guest to boot, computing it IS most of the work and a pure helper is a defensible slice. On this lane the helper was the ONLY work, because nothing downstream ever demanded the value. There was no boot to fail, so the reviewer had no way to feel the absence. METHOD LIMIT stated by pirria: three lanes read from source on one host, n=1 for the Linux runtime evidence and n=0 for the other two; the macOS verdict is exactly as strong as that function being pure and exactly as weak as the assumption that its call site passes real host numbers.
