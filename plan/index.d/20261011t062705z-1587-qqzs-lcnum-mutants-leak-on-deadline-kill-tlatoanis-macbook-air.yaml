    context: |
      MEASURED on tlatoanis-macbook-air 2026-10-11, worktree work/1586-gway:
      - 2 of 2 `taskpolicy -b ./build.sh --preflight` runs ended with the guard listed as `skip:preflight:test-awk-float-lc-numeric:deadline:12s/13s` (5s deadline). Both left the same 3 untracked .mutant-lcnum-* files.
      - They sit BESIDE the originals in the checkout, not under $TMPDIR (mpath(), scripts/test-awk-float-lc-numeric.sh:74), so `ls $TMPDIR/.mutant-lcnum-*` cannot see them.
      - Consequence observed: a standalone check-sigpipe-verdict-pipelines-added then refused 12 "added" pipelines, all in the leaked mutants.
      NOT REPRODUCED outside preflight. A script that copies the door's no-setsid kill (TERM to the guard pid, 1s grace polled in tenths, then KILL; build.sh _pf_run_guard) left 0 leaks in 3 of 3 runs. That held plain and again at taskpolicy -b beside 20x `yes`. A bare SIGTERM also cleaned up: the EXIT trap ran (rc=143).
      Open hypotheses, unverified:
      - a SIGKILL landing while the cleanup trap is deferred behind a foreground child;
      - the window between make_mutant's copy and its MUTANTS+= append;
      - the door's concurrency.
      macOS has no setsid, so the door signals only the guard pid, never its group.
