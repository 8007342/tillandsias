      - "cargo test -p tillandsias-plan --lib ledger_cache::tests::the_byte_cap_evicts_oldest_first: five 1000-byte entries under a 2500-byte cap leave exactly the two newest; pre-fix result: FAILS (no enforce_cap exists)"
