    title: |
      the plan binary's snapshot cache (ledger_cache.rs) is bounded — enforce_cap evicts oldest-first by mtime after every save_ledger/rebuild until at most DEFAULT_MAX_ENTRIES (64) files and DEFAULT_MAX_BYTES (256 MiB) remain — and build.sh points TILLANDSIAS_PLAN_CACHE_DIR at target/plan-cache so the gate's fixtures write their scratch snapshots to a disposable dir
    context: |
      INCIDENT, macuahuitl 2026-10-19: ~/.cache/tillandsias/plan-cache held
      328 GB in 122k `*.snap` files, 35% of the 952 GB btrfs main disk,
      which was at 96% before the RAID build root arrived (1802-fbld). The
      directory was deleted by hand and regrew to 270 MB within two hours of
      land-queue gates. CAUSE: cache_path keys the snapshot by a hash of the
      index's ABSOLUTE path (deliberately, so a scratch `--index` cannot
      collide with the real ledger), and every fixture builds its scratch
      repo at a fresh mktemp path, so every fixture invocation in every gate
      left a new 2-23 MB snapshot and nothing ever evicted one.
      FIX, two levers: (1) the binary bounds its own directory on every
      write — a leftover `.tmp` from a crashed writer counts as an entry;
      (2) the gate sets TILLANDSIAS_PLAN_CACHE_DIR to target/plan-cache
      (which cache_path already honours) so the fixtures' churn lands on the
      disposable, fast build root rather than beside the operator's cache.
      Red first: the new test's pre-fix run printed `192 distinct scratch
      indexes left 192 cache entries; cap is 64`.
    exit_criteria:
