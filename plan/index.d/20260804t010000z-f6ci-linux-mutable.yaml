packets:
  - packet_id: release-skill-lost-its-gate-silently
    order: 601-f6ci
    status: completed
    desired_release: v0.4
    role: release
    tags: [release, ci, skills, false-green, self-inflicted]
    title: >
      The release skill kept its "wait for CI" step after CI was deleted, and
      gh pr checks exits 0 on "no checks reported" — so it read as a passing gate
      while verifying nothing.
    problem: >
      MEASURED 2026-08-04, correcting an earlier claim made in the same session.

      The earlier assessment said the release skill would REFUSE, on the theory
      that zero reported checks exits non-zero. That is wrong. `gh pr checks 86`
      and `gh pr checks 86 --watch` both print "no checks reported on the
      '<branch>' branch" and exit 0 IMMEDIATELY — no block, no failure.

      The real defect is worse than a refusal. skills/merge-to-main-and-release
      step 3 said "ALL required checks pass -> proceed to merge" and ran
      `gh pr checks --watch` followed by `gh pr merge --auto`. After the
      2026-08-03 Actions removal and the clearing of main's three required
      contexts, that sequence merges linux-next into main with ZERO verification
      while reading exactly like a gate that passed. A false green.

      Two further statements in step 4 had become false: "PRs to main require the
      three CI checks but ZERO approvals" and "ci.yml has no path filters, so a
      VERSION-only PR still gets its checks". ci.yml is deleted and
      required_status_checks.contexts is [].

      `--auto` had a second, quieter failure: auto-merge waits for a check that
      will never report, so the PR would sit open indefinitely rather than merge.
    resolution: >
      Step 3 is now "Gate LOCALLY, then merge": `./build.sh --ci-full` and
      `scripts/release-preflight.sh`, both hard-exiting, followed by a direct
      `gh pr merge --merge` with `--auto` dropped. The note explains WHY the old
      text was dangerous rather than silently replacing it, because the next
      reader needs to know the exit-0 behaviour to avoid reintroducing it.
      Step 4's false claims are corrected in place and marked as corrected.
    lesson: >
      When a dependency is deleted, the danger is not the caller that breaks —
      that one announces itself. It is the caller that keeps returning success
      because the absent thing was only ever consulted, never required. Removing
      a gate's SUBJECT does not remove the gate's REPORT.

  - packet_id: release-runbook-drift-audit
    order: 601-462g
    status: ready
    desired_release: v0.5
    role: methodology
    pickup_role: any
    tags: [release, skills, drift, audit, cross-platform]
    title: >
      Audit every runbook step that asserts an external precondition, for the
      same exit-0-on-absent failure.
    problem: >
      601-f6ci was one instance of a class: a runbook step that consults an
      external system, and reports success when that system has nothing to say.
      The skills are full of `gh`, `podman`, `wsl.exe`, and `git` invocations
      whose "nothing there" and "all good" answers are the same exit code.

      Known siblings of this shape already recorded in this repo: a squid log
      that shows no denials because deny_info rewrites them to TCP_DENIED/200; a
      litmus that passed on linux-next while main was still scheduling cron; a
      freshness gate that greps its own comment; hooks that shipped uninstalled
      and therefore never failed.
    exit_criteria:
      - >
        Enumerate every skill step that gates on an external command's exit
        status. For each, state what the command returns when the thing it asks
        about is ABSENT rather than failing.
      - >
        Any step where absent and healthy share an exit code is either rewritten
        to assert a positive fact, or explicitly documented as advisory.
      - >
        At least one executable check per rewritten step, so the distinction is
        pinned rather than described.

