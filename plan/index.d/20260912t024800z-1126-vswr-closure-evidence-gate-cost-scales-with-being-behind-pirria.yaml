        summary: |
          CORRECTION RECORDED DELIBERATELY. pirria first reported this to the
          coordinator as "one tillandsias-plan process per ledger fragment, 28
          minutes", which does not survive multiplication: plan/index.d holds 26
          fragments and 26 x 2.9s is 75 seconds, not 28 minutes. The real driver is
          the DIFF against base_ref on a behind worktree (650 paths, because
          compaction makes removed fragments read as added), which does reproduce
          the observed time. The wrong version is kept here rather than quietly
          replaced: a floor-tier performance claim that nobody multiplied is the
          same class of defect as the instruments this fleet keeps finding.
