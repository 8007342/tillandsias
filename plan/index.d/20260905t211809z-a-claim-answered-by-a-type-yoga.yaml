      - "a packet whose claim is followed only by a NOTE saying it was released is STILL reported, because prose is not a signal; pre-fix result: passes by accident and must keep passing by design"
      - "a packet with a claim and nothing since is still reported; pre-fix result: passes and must keep passing"
    unscoreable: |
      Pinned by a unit test carrying four rows — owed, typed-release, prose-only,
