packets:
  - packet_id: newly-issued-device-flow-tokens-are-revoked-within-minutes-while-old-ones-survive
    order: 907-8ypf
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      a freshly-issued gho_ token for this account died 158 seconds after issue, after authenticating once, while two MONTHS-OLD gho_ tokens for the same account keep working — operator-owned, no host can see the cause
    deliverable: |
      the account security log and OAuth app authorisation list read by someone
      who can see them, against the timeline below
    pickup_role: operator
    owner_host: operator
    depends_on: []
    capability_tags:
      - credentials
      - multi-host
      - operator-action
    estimated_hours: 1
    context: |
      MEASURED 2026-08-26 across three hosts. This is filed because 894-scxy
      explicitly scopes it out ("the underlying revocation is NOT this packet
      and cannot be answered from a host") and it has been living in nobody's
      packet while blocking two hosts.

      THE TIMELINE (pirria, all from keyring metadata and non-extracting probes):

        07:20:33Z  keyring entry written (created == modified: fresh device flow)
        07:22:5xZ  check-credential-channel.sh -> ok:gh-keyring-push-verified
                   (the guard's bounded dry-run push AUTHENTICATED)
        07:23:0xZ  git push -> remote: Invalid username or token
        07:23:11Z  gh api user -> HTTP 401

      **158 seconds, with one successful authenticated operation in the middle.**

      NOT A TTL, AND THIS IS THE KEY READING (yoga): the token authenticated at
      07:22:5x and was 401 by 07:23:0x — seconds apart. Nothing ISSUES a
      158-second token. That is a REVOCATION EVENT landing between two
      operations, so the question is what fires in that gap.

      FIVE HOSTS, SAME ACCOUNT (8007342). COMPLETE FLEET COVERAGE: every
      working host was queried on the exact window and all four answered NO,
      each from artifacts rather than memory:

        host        token   created/modified            state
        macbook     -       cdat 2026-05-14 / mdat 2026-08-11   WORKING
        macuahuitl  gho_    2026-06-07 / 2026-06-25     WORKING all night
        lenovinha   -       2026-07-08 / 2026-08-20     WORKING
        yoga        gho_    2026-07-21                  WORKING
        pirria      gho_    2026-08-26 07:20:33Z        DEAD in 158s

      Nothing on any working host was written today. The nearest credential
      artifact to the window is six days old (lenovinha, 2026-08-20).

      macuahuitl and yoga are both gho_ — the OAuth device-flow prefix, same as
      pirria's. yoga disclosed this AGAINST THEIR OWN INTEREST, having assumed
      theirs was a classic PAT and therefore a clean control; it is not.

      WHAT THIS ELIMINATES, AND EXACTLY HOW FAR IT REACHES. macbook drew the
      boundary and it must not be over-read: a surviving OLD token is
      "consistent with" the mutual-revocation hypothesis, not a TEST of it —
      their 15-day-old credential is not the token that hypothesis predicts
      would die, so it is a bystander, and a second instance of the same limited
      evidence rather than an independent one.

      What the data DOES eliminate is narrower and still decisive for the
      immediate question: **pirria's issuance did not revoke siblings.** If it
      had, the three established tokens would have died at 07:20:33Z; all three
      were verified alive after that instant. So the event targeted the NEW
      token, not the account's other credentials.

      THE EXPERIMENT THAT WOULD ACTUALLY TEST IT, recorded so nobody improvises
      it: two device-flow logins for the same OAuth app, seconds apart, on
      different hosts, with the first token probed immediately after the second
      completes. Both yoga and macbook independently identified this and both
      declined to run it unasked, correctly — it is a deliberate credential
      mutation on a fleet whose push lane depends on those credentials, with one
      host already blocked.

      WHAT THIS ELIMINATES. "Device-flow logins revoke each other" does not
      survive: if pirria's 07:20 issuance revoked siblings, macuahuitl's and
      yoga's tokens would have died at 07:20. Both were verified working after
      that instant. **pirria's issuance did not revoke ours — something killed
      pirria's own new token and left established ones untouched.**

      SO THE SURVIVING SHAPE IS NARROW: something revokes NEWLY-ISSUED
      device-flow tokens for this account within ~3 minutes, without touching
      established ones. A GitHub-side abuse or rate-limit heuristic on repeated
      re-issuance fits better than any fleet-internal cause, precisely because
      it explains why old tokens of the same kind are unaffected.

      A LOCAL EXPLANATION WAS FALSIFIED FIRST, and the method belongs in
      894-scxy. The refresh left TWO secret-service entries for gh:github.com,
      one with an EMPTY username — exactly the shape that would make gh retrieve
      a stale token while a good one sat unused. pirria compared them BY HASH
      rather than by printing:
        sha256[0:16] entry(username=8007342) = d8a3bec341da198f
        sha256[0:16] entry(username='')      = d8a3bec341da198f   same
      Same token in both, so gh reads the right secret and GitHub rejects it.
      No secret was ever materialised.

      AND THE TWO-ENTRY SHAPE IS BENIGN — ELIMINATED, not merely unsupported.
      Confirmed on three working hosts:
        macuahuitl  /login/14 "…'8007342'…" 2026-06-07, /login/28 "…''…" 2026-06-25
                    (metadata-only busctl enumeration; no secret retrieved)
        yoga        both entries frozen since 2026-07-21
        lenovinha   RAN PIRRIA'S HASH PROBE ON A WORKING HOST:
                      username=8007342  sha256[0:16]=390bc07d21dece6f
                      username=<empty>  sha256[0:16]=390bc07d21dece6f   same
      That last one is the decisive control: identical digests on a host whose
      credential WORKS. So two entries with one empty username is the ordinary
      residue of `gh auth login`, present on healthy hosts, and cannot be
      masking anything. The local stale-entry explanation is dead on two hosts,
      which STRENGTHENS the server-side reading — the alternative is eliminated
      rather than just unevidenced.

      THE HASH PROBE HAS A BOUND, and it must travel with the method (lenovinha).
      It is strictly better than curl-with-the-token for "is gh reading a stale
      entry" — it answers without RENDERING anything. But `secret-tool lookup`
      does WRITE the value to stdout; the probe is safe only because that stdout
      is piped straight into a digest. One careless `tee`, one `set -x`, one
      interactive run and it is the exact leak that bit two hosts on 2026-08-25.
      894-scxy mandates "never materialise the secret" and this technically
      does. It belongs there as a BOUNDED addition — digest-only, direct pipe,
      never `--all`, never interactive — with the hazard stated beside it, not
      as a relaxation of the criterion. A method note that carries the technique
      without the trap is how the trap gets re-sprung.
    outcome: |
      Either the revoker is identified, or fresh device-flow tokens stop dying
      and the two blocked hosts can push again.
    exit_criteria:
      - 'The account security log for 8007342 is read across 2026-08-26T07:20:00Z-07:23:30Z and the revocation event is either found or shown absent. No host can do this; it needs the operator view.'
      - 'The OAuth app authorisation list is inspected for how many live tokens exist for this app and whether an app-side policy caps or rotates them.'
      - 'If the cause is a GitHub-side heuristic on repeated issuance, record the trigger and the backoff, because the fleet has been re-running gh auth refresh in response to failures — which would be feeding the thing that causes them.'
      - 'NEGATIVE CONTROL, and it must not be skipped: whatever change is made, macuahuitl and yoga keep working. Two established credentials are currently the only reason the fleet can push at all.'
      - 'DO NOT test this by running gh auth refresh on a working host. yoga was asked implicitly and refused, correctly: it risks taking a working credential offline while a host is already blocked. If that experiment is wanted it is an operator decision with a rollback, not an improvised diagnostic.'
    verifiable_closure: |
      A freshly issued token for this account survives longer than one
      authenticated operation, demonstrated on the host that has been blocked.
    notes: |
      BLOCKED HOSTS DRIFT SILENTLY, and that is a second-order cost worth
      recording: pirria reported 895-j8ag still reproducing, and it is not —
      their checkout predates lenovinha's fix (66fac2135, date -u at line 101;
      verified reading current:2026-08-26 on two working hosts). They cannot
      fetch it because they cannot authenticate. From inside a blocked host,
      "the fix is absent" and "my copy is old" look identical.

      Earlier figures of "~27 minutes" and "~30 minutes" were NOT lifetimes.
      They were the latency between issuance and the host's first push attempt.
      Two agents, including this one, reasoned about a half-hour window that
      never existed. 158 seconds is the first measured number.
