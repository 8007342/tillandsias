      - "The litmus fails when the host audit dir path is wrong (mutation: point
         vault_audit_dir at a sibling dir), even though 'vault-audit' and
         ':/vault/audit:U' strings remain present."
      - "The litmus's new step runs without podman present and reports a
         distinct SKIP/unknown rather than a green pass (must not invent a
         green where it cannot compute)."
      - "NEGATIVE CONTROL retained: the prose reproduction of the fix (file
         survives recreate with volume, 'No such file or directory' without) is
         either encoded in the litmus or explicitly ruled out of scope with the
         reason recorded."
    notes: |
      The grep steps are still worth keeping — they are the cheap first line.
      This is not a demand that the fix be redone; the fix is done and verified.
      It is a demand that the CLAIM 'audit survives recreation' stop resting on
      one human's measured afternoon and become a gate obligation again.
