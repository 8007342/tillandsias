  title: tillandsias-metrics sampler tests take 147-186 s each because every one walks the host's disks
  context: 'Measured on tlatoanis-macbook-air 2026-10-29 (darwin, taskpolicy -b): in a full nextest workspace run, nine tillandsias-metrics tests took 147-186 s each and the headless metrics_server tests about 128 s each, making them the critical path. The suite alone took 397 s. Cause, measured with sample(1): not a sleep, but MetricsSampler::new() -> sysinfo Disks::new_with_refreshed_list() -> apple::disk::get_disk_properties (CoreFoundation volume properties), about 46 s for new_does_not_panic run alone. The coordinator first suspected the sample interval; the interval is not the cost. Production cadence and new() stay unchanged. Side observation, not measured end-to-end: the shipped tray''s metrics path on macOS pays the same walk at sampler construction.'
