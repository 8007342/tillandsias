          THE OPEN QUESTION, RESTATED SO IT IS NOT LOST, and why it is currently an
          operator decision rather than a fleet incapacity. §4a needs a host that is
          8 GiB or 32 GiB AND can run the forge lane. macneo is the 8 GiB host and
          has NO podman at all — and that absence is load-bearing, since it is the
          instrument that exposed the eligibility-arm defect today, so provisioning
          it to answer §4a would destroy the thing making it valuable. The
          coordinator host is the 32 GiB candidate, but running the lane there is a
          DESTRUCTIVE smoke on the operator's own workstation and needs their
          per-run consent under 1004-vsh2, which nobody has requested. So §4a's
          request is unanswered because the one action that would answer it has not
          been put to the operator, not because the fleet cannot do it. The
          coordinator is putting that to them. Until then §4a's range stays open and
          this row must not be mistaken for closing it.

          A NOTE ON THE COUNT, recorded rather than quietly fixed: I was asked to
          file "four resource-or-timing failures in one day" and the dated evidence
          does not support four. One harness memory kill, one forge lane that
          SUCCEEDED under the documented remedy, and two duration costs that are not
          kills. Zero kernel oom-kills in 24h. I have written what is dated rather
          than the number commissioned, because a capacity row whose count is
          inflated is exactly the kind of thing a later reader would reasonably stop
          trusting in whole.
