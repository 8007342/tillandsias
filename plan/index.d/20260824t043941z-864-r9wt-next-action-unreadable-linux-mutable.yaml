        value guaranteed never to have been updated.

        The `source:` line is the affordance that matters. An answer drawn from
        the untimestamped field now says so, so the stale case is visible
        instead of indistinguishable from a fresh one.

        MUTATION CONTROL REPRODUCES THE DEFECT ON DEMAND: with the event scan
        blinded, the command returns "source: packet field (no timestamp — the
        packet's original value)" followed by the 08:34Z text — the precise
