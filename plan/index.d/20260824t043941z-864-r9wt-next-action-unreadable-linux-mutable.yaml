# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by linux_mutable (macuahuitl), 2026-08-24T04:39:41Z.
packets:
  - order: 864-r9wt
    packet_id: the-coordinators-own-queue-could-not-be-read-back-by-the-instrument
    desired_release: v0.5
    title: "next_action is written as events but read as a packet field, so every cycle that read it got an arbitrarily old queue"
    status: completed
    kind: defect
    pickup_role: any
    priority: p1
    capability_tags: [plan, crdt, ledger, orchestration, developer-experience]
    deliverable: crates/tillandsias-plan/src/main.rs
    depends_on: []
    estimated_hours: 2
    discovered_by: "this host acting on a twenty-hour-stale queue whose three items were all closed"
    context: >
      THE QUEUE EVERY CYCLE READS WAS UNREADABLE BY THE INSTRUMENT. The
      coordinator's ordered work list lives in 831-ezea's `next_action`, and the
      cycle prompt says to read it FIRST, before deriving anything. There was no
      command that returns it.

      It is written as EVENTS, and it has to be: `packets:` is a G-Set, so
      re-declaring a packet does not change its fields — the rule 864-hv2n's
      gate exists to enforce. Each cycle therefore appends an event carrying a
      fresh `next_action`, while the packet-level field keeps whatever value the
      row was created with.

      SO READING THE FIELD RETURNS AN ARBITRARILY OLD ANSWER THAT LOOKS CURRENT.
      Measured 2026-08-24: this host read the packet field, got the 08:34Z queue
      — whose three items (Tier B top-k, the bigger embedder, 846-idhn) had all
      been closed in the intervening twenty hours — and began planning against
      it. The live value was an event at 22:35Z saying the campaign was finished.

      THE HAND-ROLLED READER FAILED TWICE OVER, and the second way is the one
      worth recording: in the BASE the events are NESTED UNDER THE PACKET, not
      at the document's top level, so a loop over `doc["events"]` finds nothing
      at all and silently falls back to the field. That is the obvious loop to
      write. Anyone who writes it gets a stale answer with no error.

      THIS IS THE THIRD AD-HOC PROBE TO LIE IN ONE SESSION — `pgrep -f` matching
      its own command line, a YAML reader whose `rescue` swallowed the parse of
      the one file that mattered, and now this. The pattern is not carelessness
      about any one probe; it is that the ledger is queried by re-implementing
      readers instead of asking the instrument, exactly as CLAUDE.md's "ask,
      don't read" warns. The fix is not a better ad-hoc reader.
    exit_criteria: >
      (1) `tillandsias-plan next-action <id|order>` returns the EFFECTIVE value:
      the newest of the packet field and any event carrying one, ISO-8601
      lexicographic order.
      (2) It names its SOURCE on stderr, so an answer that came from the
      untimestamped packet field is visible as such rather than passing for
      current.
      (3) An unresolved reference exits non-zero rather than printing nothing.
      (4) Mutation control: blind the event scan and the command must return the
      stale field value — reproducing the exact defect on demand.

