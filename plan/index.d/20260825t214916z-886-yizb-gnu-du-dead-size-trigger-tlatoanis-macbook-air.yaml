packets:
  - packet_id: gnu-du-b-made-the-build-cache-size-trigger-dead-on-macos
    order: 886-yizb
    status: done
    kind: bug
    pickup_role: any
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    depends_on: []
    deliverable: |
      check-build-cache-sweep.sh measures target/ with POSIX `du -sk` instead of
      GNU-only `du -sb`; litmus:build-cache-sweep-trigger asserts the
      MEASUREMENT and not only the threshold comparison; check-bash-dialect.sh
      refuses `du -b` so the family cannot reach a Mac again.
    capability_tags:
      - shell
      - portability
      - macos
      - tooling
    tags:
      - bsd-vs-gnu
      - dead-mechanism
      - litmus-quality
      - v0.5
    title: |
      `du -sb` is GNU-only, so the build-cache SIZE trigger was dead on macOS — and its litmus passed anyway, because the size case pinned the threshold comparison rather than the measurement.
    context: |
      MEASURED on tlatoanis-macbook-air 2026-08-25, during the daily-maintenance
      body: `scripts/check-build-cache-sweep.sh` reported
      `due:build-cache-sweep:bytes=0:gib=0:marker=absent` on a host whose
      `target/` is 14 GiB. BSD du REFUSES `-b` outright (it is not ignored), so
      `bytes="$(du -sb "$d" 2>/dev/null | cut -f1)"` produced the empty string
      and the `[ -n "$bytes" ] || bytes=0` fallback beside it silently became
      the answer. The size half of a two-trigger gate could never fire on
      macOS; only marker-age could.

      THE MORE USEFUL HALF IS WHY THE LITMUS DID NOT CATCH IT. The DUE-by-SIZE
      case sets `TILLANDSIAS_BUILD_CACHE_MAX_GIB=0`, so `gib >= 0` holds
      whatever du returned. It pinned the COMPARISON and never the
      MEASUREMENT — and a test shaped that way passes identically on a working
      host and a broken one. The packet that closed the gate (709-in2f)
      reported 8/8 from a Linux host in good faith.

      A SECOND GNU-ISM in the same suite, found by running it here: the
      DUE-by-AGE step built its old marker with `date -d '30 days ago'`, so
      that step had been RED on every macOS run since it landed and nobody was
      looking. Both defects are the family this very file's header cites —
      803-bqte's GNU-sed `\b`, which made three markers write-only on macOS
      while every self-test passed on Linux.

      `scripts/check-bash-dialect.sh` (761-g36m) exists to stop exactly this
      and had no rule for du(1), only for bash-4 constructs and date(1).
    exit_criteria:
      - |
          check-build-cache-sweep.sh measures with a POSIX form and reports a
          real byte count on macOS. VERIFIED: `bytes=15798390784:gib=14` on
          tlatoanis-macbook-air, where it previously reported bytes=0.
      - |
          litmus:build-cache-sweep-trigger gains a leg that writes a file of
          KNOWN size and demands the reported count reflect it, and the whole
          suite is green on macOS. VERIFIED 9/9 (was 8 steps with the age step
          red on this platform).
      - |
          check-bash-dialect.sh refuses an unexempted `du -b` / `--bytes`, with
          the same following-window and line-exemption convention as its
          date(1) rule, and the tree is clean under it.
    verifiable_closure: |
      HAND-FALSIFIED IN BOTH DIRECTIONS, which is the point of this packet
      rather than the one-character fix:
        * Reintroducing `du -sb` makes check-bash-dialect.sh emit
          `blocked:bash4-unguarded:1` naming the exact file and line; restoring
          `du -sk` returns `ok:bash-dialect-clean`.
        * Reintroducing `du -sb` turns the new litmus leg RED
          (`expected=ok: the byte count tracks real content`, `output=`) while
          steps 1-3 stay GREEN — demonstrating directly that the old suite
          could not see this defect.
      Bound to spec meta-orchestration via the existing
      litmus:build-cache-sweep-trigger binding.
    notes: |
      The generalisable lesson, and the reason this is filed rather than just
      fixed: a threshold test that sets the threshold to zero is testing the
      comparison operator. Whenever a gate MEASURES something and then compares
      it, the suite needs one leg where the measurement itself is the assertion
      — otherwise the measuring code is untested by construction, and the
      failure is invisible on whichever platform the author was not using.
    events:
      - type: completed
        ts: "2026-08-25T21:51:04Z"
        agent_id: "macos-tlatoanis-macbook-air-opus5-20260825t215104z"
        host: tlatoanis-macbook-air
        evidence_refs:
          - scripts/check-build-cache-sweep.sh
          - scripts/check-bash-dialect.sh
          - openspec/litmus-tests/litmus-build-cache-sweep-trigger.yaml
          - litmus:build-cache-sweep-trigger
        summary: |
          FOUND during the daily-maintenance body on macOS, not by looking for it: check-build-cache-sweep.sh printed `due:build-cache-sweep:bytes=0:gib=0` on a host whose target/ is 14 GiB. BSD du REFUSES `-b` (it does not ignore it), so the command substitution was empty and the `|| bytes=0` fallback beside it silently became the answer. The size half of a two-trigger gate could never fire on macOS.

          FIXED with POSIX `du -sk` x 1024. VERIFIED on tlatoanis-macbook-air: `bytes=15798390784:gib=14`, where the same command previously reported bytes=0.

          THE PART WORTH KEEPING is why the litmus was green through all of it. Its DUE-by-SIZE case sets TILLANDSIAS_BUILD_CACHE_MAX_GIB=0, so `gib >= 0` holds no matter what du returned — it pinned the COMPARISON and never the MEASUREMENT, and a test shaped that way passes identically on a working host and a broken one. Added a leg that writes a file of KNOWN size and demands the reported count reflect it.

          A SECOND GNU-ism in the same suite, found only by running it here: the DUE-by-AGE step built its old marker with `date -d '30 days ago'`, so that step had been RED on every macOS run since it landed and nobody was looking. Now BSD-arm-first with the GNU form as fallback. Suite is 9/9 green on macOS; it was 8 steps with one permanently red on this platform.

          check-bash-dialect.sh (761-g36m) exists to stop exactly this family and had rules only for bash-4 constructs and date(1) — nothing for du(1). Added a du-rule with the same following-window and line-exemption convention as the date rule, so a portable `|| du -sk` arm nearby still passes.

          HAND-FALSIFIED IN BOTH DIRECTIONS, which is the real deliverable: reintroducing `du -sb` makes check-bash-dialect.sh emit `blocked:bash4-unguarded:1` naming the exact file and line, and turns the new litmus leg RED (`output=` against `expected=ok: the byte count tracks real content`) while steps 1-3 stay GREEN — showing directly that the old suite could not see this defect. Restoring `du -sk` returns `ok:bash-dialect-clean` and 9/9.

          GENERALISABLE, and the reason this was filed rather than quietly fixed: a threshold test that sets the threshold to zero is testing the comparison operator. Any gate that MEASURES and then compares needs one leg where the measurement itself is the assertion, or the measuring code is untested by construction and the failure is invisible on whichever platform the author was not using.
