packets:

  - packet_id: vsock-exec-expect-driver-drops-guest-error-envelope
    order: 689-xpq7
    status: ready
    desired_release: v0.5
    priority: p2
    title: "The expect-driven vsock-exec driver has no ControlMessage::Error arm — the guest's only diagnostic is discarded, then replaced by an opaque timeout"
    kind: bug
    deliverable: Error arm on the expect driver + a shared regression harness covering all three drivers
    depends_on: []
    pickup_role: any
    capability_tags: [control-wire, vsock, exec, fail-loud, diagnosability]
    estimated_hours: 2
    context: >
      Found by the 2026-08-11 macOS I/O audit and adversarially verified (the
      verifier CORRECTED the original severity claim, which is recorded here
      honestly rather than at its first-reported strength).
      THE DEFECT: the drain loop of `exec_over_stream_expect_dynamic`
      (crates/tillandsias-vm-layer/src/vsock_exec.rs:611-657) matches exactly
      three shapes — PtyData{ToHost} (614), PtyClose (651), and a catch-all
      `_ => {}` (655). A terminal `ControlMessage::Error` from the guest falls
      into the catch-all and is silently dropped. Both sibling drivers in the
      SAME FILE handle it: `exec_over_stream_with_input` (262-264) and
      `exec_over_stream_with_input_streaming_timeout` (398-400). The comment at
      257-261 records that this exact bug was caught live by the order-128
      conformance harness on 2026-07-14 and pinned by
      `exec_with_input_surfaces_guest_error_instead_of_hanging` (692) — the fix
      landed on two of three drivers and the pin only covers one, so the third
      regressed the same way undetected.
      HONEST BOUND (verifier's correction, believed over the finder): this does
      NOT produce an unbounded hang on its own. `read_exec_envelope`
      (vsock_exec.rs:107-124) still applies a fresh idle timeout per call, so a
      swallowed Error costs ~300s and an opaque "connection stale" instead of
      the guest's actual message. Further, every Error emission site in the
      headless crate (vsock_server.rs:865, 888, 1062, 1211) fires BEFORE a PTY
      session exists for that exchange, so today the swallow is reachable only
      on early rejection (e.g. exec-allowlist refusal of PtyOpen). The real cost
      is diagnosability, not liveness — the unbounded wedge is 689-y2my.
    outcome: >
      A guest-side error reaches the operator as the guest's own message, from
      every exec driver, and a new driver cannot silently omit the arm.
    exit_criteria:
      - "exec_over_stream_expect_dynamic returns the guest's Error message instead of discarding the envelope"
      - "the existing single-driver regression pin is lifted into a shared harness asserting the behavior for all three drivers, so adding a fourth without the arm fails the suite"
      - "a negative control asserts a normal PtyClose path is unaffected by the new arm"
    events:
      - type: filed
        ts: "2026-08-11T23:31:12Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260811t233112z
        host: macos
