          refuted with per-site evidence.

  - packet_id: guest-vm-boot-time-and-sizing-baseline
    order: 689-eux9
    status: ready
    desired_release: v0.5
    priority: p3
    title: "Record a real VM boot-time baseline and revisit the hardcoded 4 GiB / 4-vCPU guest sizing"
    kind: investigation
    deliverable: measured boot baseline in the cheatsheets + a decision on whether guest sizing should scale with host resources
    depends_on: []
    pickup_role: macos
    capability_tags: [macos, vz, performance, sizing]
    estimated_hours: 2
    context: >
      OPERATOR QUESTION 2026-08-11: whether the guest's memory ceiling was
      behind the observed slowness, and whether raising it to 8 GiB would help.
      MEASURED ANSWER (this host, M5 / 16 GiB): it was not, and it would not.
      A full `--exec-guest` cycle — stage guest binary, boot the VM, reach phase
      Ready, run a guest command over the control wire, stop the VM — completes
      in 9 SECONDS end to end (evidence: identical invocation differing only in
      stdin redirection; see 689-stig). The apparent slowness was two separate
      unbounded waits, neither resource-bound; in the wedged runs the VM process
      did not exist at all.
      SIZING FACTS for whoever picks this up:
      crates/tillandsias-vm-layer/src/vz.rs:1379-1381 hardcodes
      `memory_bytes: 4 * 1024 * 1024 * 1024` (4 GiB — NOT the 8 GiB assumed) and
      `cpu_count: available_parallelism().min(4)`. Neither is configurable and
      neither scales with host resources. That is defensible as a conservative
      default but is currently undocumented and unmeasured, so it gets argued
      about from assumption rather than data — which is what happened here.
      NOT A BUG REPORT: boot is fast. This packet exists so the numbers are
      written down and the sizing choice becomes explicit.
    exit_criteria:
      - "a recorded boot-time baseline (stage, start, phase Ready, exec, stop) on at least one macOS host, in a cheatsheet with provenance"
      - "a decision recorded on whether guest memory/vCPU should scale with host resources or stay pinned, with the measurement that justifies it"
      - "if the sizing stays pinned, the constants carry a comment naming the measurement and the rationale"
    events:
      - type: filed
        ts: "2026-08-11T23:31:12Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260811t233112z
        host: macos
        summary: >
          Filed to close an operator question with data instead of intuition:
          4 GiB is the real setting, boot is 9s, and the slowness had a
          different cause entirely.
