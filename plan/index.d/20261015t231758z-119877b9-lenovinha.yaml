      summary: |
        Same defect as 1742-zg7r, filed from the Linux v56.10.15.1 smoke. Its fix is PR #462 (work/1742-zg7r): VaultGitHubTokenStore::read_bundle now returns Err(vault-unavailable) when the Vault container is not running, Err(vault-root-token-unavailable) when the root token cannot be read, and treats only NotFound as absent. The first due-check therefore retries on the 60 s error backoff instead of reporting NoToken and waiting 15 minutes. That is this row's first exit criterion; its unit test is github_rotation_retries_on_the_error_backoff_until_vault_is_up (red with the old behaviour restored). The fix is in the shared vault_bootstrap.rs that the macOS guest runs. This row's live macOS arm (an expired token at boot, list loaded within 2 minutes of Ready) still needs the Mac to verify it on the next cut.
