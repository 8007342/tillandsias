packets:
  - packet_id: windows-tray-staged-guest-asset-restage
    order: 689-gipe
    status: ready
    desired_release: v0.5
    priority: p1
    title: "Windows tray embeds a guest binary older than its checkout: staged asset is 0.4.260809.2 against workspace 0.4.260810.1, so cargo test is red and a local tray injects a version-skewed guest"
    kind: fix
    deliverable: plan/issues/windows-tray-staged-guest-asset-stale-2026-08-11.md
    depends_on: []
    pickup_role: windows
    owner_host: windows
    capability_tags:
      - windows
      - wsl
      - musl
      - build
    estimated_hours: 2
    outcome: >
      crates/tillandsias-windows-tray/assets/tillandsias-headless-x86_64-unknown-linux-musl
      carries the workspace VERSION, so a tray built from a checkout injects
      that checkout's guest and the embed-integrity test is green because the
      asset is current rather than because it is empty.
    next_action: >
      On a host that can cross-build musl, run scripts/build-guest-binaries.sh
      then scripts/build-windows-tray.ps1 and commit the restaged asset. Not
      attempted in the filing cycle: the cross-build does not fit the recurring
      loop budget, and a 13 MB binary is not a commit to make blind.
    exit_criteria:
      - "cargo test -p tillandsias-windows-tray embedded_guest_headless_matches_workspace_version exits 0 AND the x86_64 asset is non-empty (a zero-byte slot passes that test trivially by design, so emptiness is not closure)"
      - "a tray built from the checkout provisions a guest reporting the checkout's VERSION on a distro that had no prior Tillandsias guest"
    events:
      - type: filed
        ts: "2026-08-11T22:43:46Z"
        agent_id: "windows-claude-opus5-20260811t215500z"
        host: windows
        summary: >
          Found while draining order 154. cargo test -p tillandsias-windows-tray
          is red at a clean HEAD (confirmed by stashing the cycle's edits and
          re-running): the staged x86_64 guest asset is 13731128 bytes, mtime
          2026-08-09 02:22, highest embedded version string 0.4.260809.2 — the
          PUBLISHED release, against a workspace VERSION of 0.4.260810.1. The
          aarch64 slot is correctly zero-byte. The test is a true positive; the
          asset is what is wrong. Two consequences: any tray built here embeds a
          guest older than its checkout (the version skew order 350 criterion 1
          exists to catch), and it falsifies cycle 1's inference that
          guest_version == tray version showed this cycle's rebuild reached the
          guest — the guest binary (in-VM, mtime 2026-08-09 21:32) predates the
          rebuild and reconcile_adopted_guest returns early on a version match.
          A correcting note is on 627-sgtt.
