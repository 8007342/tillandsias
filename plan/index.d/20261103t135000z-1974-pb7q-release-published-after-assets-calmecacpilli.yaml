    title: A release is published only after every platform asset is attached
    context: 'Seen in the macbookair smoke of v56.11.3.1 (run 41637934780): the release workflow created the release object at 13:13:33Z, but the macOS assets arrived at 13:40:06Z. So the prerelease was public for about 27 minutes with no macOS assets. A smoke or curl-install in that window finds a release missing its platform binary.'
    exit_criteria:
      - 'For a release cut after the fix, the release published_at is no earlier than its last asset upload (gh api repos/8007342/tillandsias/releases/tags/<tag>: published_at >= max(assets[].updated_at)). Pre-fix result: FAILS on v56.11.3.1 (published 13:13:33Z, the last macOS asset 13:40:06Z).'
    verifiable_closure: 'gh api repos/8007342/tillandsias/releases/tags/<tag> --jq "[.published_at, ([.assets[].updated_at]|max)]" on the first release cut after the fix.'
    unscoreable: 'the property is a fact about a published GitHub release (published_at vs last asset upload), observable only after a real cloud release run; no local litmus can score it.'
    next_action: 'In the release workflow, create the release as a draft (or upload every asset to a draft), then publish it in a final job that needs all the platform jobs to succeed.'
