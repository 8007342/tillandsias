packets:
  - packet_id: unstable-release-channel-and-landing-simplification
    order: 621-2re2
    status: completed
    desired_release: v0.5
    priority: p1
    title: "Rolling UNSTABLE release channel + simplified landing-page installer surface"
    kind: feature
    deliverable: README.md
    depends_on: [stable-release-channel]
    pickup_role: linux
    capability_tags: [release, channels, readme, installers, ci]
    outcome: >
      Operator directive (2026-08-09): the landing page must advertise exactly three primary
      installers — Linux curl, Windows portable exe/zip, macOS portable DMG — and carry a
      collapsible "Unstable Releases" section whose curl installers resolve the newest DAILY
      build on all three platforms, so Tillandsias hosts (and later, opt-in users in the wild)
      can exercise a build on real hardware BEFORE it is promoted to stable.

      Implementation:
      - .github/workflows/release.yml: rolling `unstable` git tag + a rolling GitHub PRERELEASE
        tagged `unstable`, deleted and recreated by the Linux job every daily and re-populated
        by the macos-release and windows-release jobs from the SAME run. Recreate-not-clobber is
        deliberate: clobbering in place would strand a stale macOS/Windows asset whenever a
        platform job failed, and the channel would then serve a mismatched artifact set that
        still read as current.
      - .github/workflows/release.yml: version-stable portable aliases for Windows
        (tillandsias-windows-x64.zip, tillandsias-tray.exe). The packaged zip carries the version
        in its NAME, so it could never be linked from /releases/latest/download/<asset>, which is
        what the landing page requires. Alias checksums are appended to SHA256SUMS-windows BEFORE
        the Cosign signing step, so the file a user actually downloads is covered by the signed
        checksum file.
      - scripts/install.sh, scripts/install-macos.sh: `--channel stable|unstable` flag +
        TILLANDSIAS_CHANNEL env; TILLANDSIAS_RELEASE_BASE still overrides both so the
        curl-install smoke can keep pinning one exact release.
      - scripts/install-windows.ps1: TILLANDSIAS_CHANNEL env (an `iex`-piped script cannot take
        parameters, so env is the only channel seam on Windows). Kept pure ASCII — the
        v0.3.260723.1 regression where a non-ASCII byte made the saved .ps1 parse as a different
        program is the reason that constraint exists.
      - All three installers print an UNSTABLE banner before touching the host.

      Promotion path is unchanged and still gated: scripts/promote-stable.sh requires
      curl-install e2e PASS evidence naming the exact tag, then flips prerelease=false, which is
      what moves /releases/latest and therefore every stable command on the landing page.
    verifiable_closure: >
      After the next daily release run: `gh release view unstable` returns a prerelease carrying
      the Linux, macOS, and Windows artifact set from one single run, and
      `curl -fsSL .../releases/download/unstable/install.sh | bash -s -- --channel unstable`
      installs that build on a Linux host. Landing-page stable links resolve:
      /releases/latest/download/{install.sh,Tillandsias.dmg,tillandsias-tray.exe,tillandsias-windows-x64.zip}.
    events:
      - ts: "2026-08-09T03:05:00Z"
        event: completed
        summary: >
          Unstable channel wired end to end (workflow + three installers + landing page).
