  - packet_id: builder-container-serial-killer
    order: 957-bcsk
    status: ready
    kind: investigation
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    depends_on: []
    capability_tags: [podman, build, forensics]
    title: >
      Something killed the tillandsias-builder toolbox six times in one
      night — fresh podman CLI, exact :00 seconds at least three times,
      only during builder-resident full builds — and every attribution
      lane came up empty.
    context: |
      Kill timestamps 2026-08-31/09-01: 22:05:23Z, 23:58:54Z, 01:52:31Z,
      03:39:14Z, 04:14:00Z, 04:17:00Z (last three during rebuilds seven
      and nine; the on-the-minute pair suggests minute-granularity
      scheduling). Ruled out with evidence: user+system systemd timers,
      crontab, harness crons (only the :23 coordinate slot), podman
      healthchecks (builder has none, none armed), other local Claude
      sessions (none), repo scripts (no podman-kill call site matches),
      OOM (journal clean), operator activity (asleep for the later kills).
      A PATH-shim forensic wrapper caught nothing because the kill window
      did not recur while armed — and broke the toolbox-internal podman
      probe (the shim itself is a lesson: /usr/bin/podman is not the entry
      point inside a toolbox). --check gates (~90s in the same container)
      were never hit; the kill window is ~15min into a run. WORKAROUND
      PROVEN: TILLANDSIAS_SKIP_TOOLBOX=1 host-native ci-full+install
      completed where five builder-resident attempts died. Next
      instrumentation: podman events --stream with process accounting
      (forkstat/execsnoop) armed BEFORE a deliberate builder-resident
      build, on a host that can spare the hour.
    verifiable_closure: |
      The killing process is named with its full ancestry, or 72h of
      armed instrumentation across builder-resident builds records zero
      kills and the packet closes as ceased-with-instrumentation.
