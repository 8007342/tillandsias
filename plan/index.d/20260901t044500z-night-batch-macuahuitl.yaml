packets:
  - packet_id: forge-first-launch-tax
    order: 953-fflt
    status: ready
    kind: fix
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    depends_on: []
    capability_tags: [forge, images, performance]
    title: >
      The forge schedules its heaviest job concurrently with its own entire
      startup, and the warm path structurally never covers a user's first
      launch — prebake tillandsias-plan at image build and serialize the
      expert bootstrap.
    context: |
      Full evidence and the three-point bracket (cold+idle 233s vs
      stale+contended 516s — a 2.2x inversion; self-contention, not cache
      state, is the risk; timeout bump RETIRED at 61% idle headroom) in
      plan/issues/esmeraldinha-n100-forge-audit-2026-09-01.md. Measured by
      esmeraldinha on the N100 lower-bound host. 781-6gys's copy-out design
      HELD under hostile test and stays. The shim first-launch tax
      (105s-once) is already fixed on trunk; this packet is the bootstrap
      half: prebake (the publish logic exists, runs one stage too late) +
      do-not-build-during-startup.
    verifiable_closure: |
      A fresh forge guest at a new release reaches forge-plan MCP ready
      without any cargo build (podman logs show the prebake restore path),
      and startup load1 on a 4-core guest stays under 4 through expert
      readiness.

