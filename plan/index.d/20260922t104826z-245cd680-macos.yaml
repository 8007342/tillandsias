    value: "THE OUTPUT: on a host with no readable /proc/meminfo, `./build.sh\n--preflight` counts check-gate-memory-floor as SKIPPED and — with no other\nfailure — EXITS 0. Today it exits 1 on every Mac, so the step the fleet\nmade mandatory before `gh pr ready` can never be satisfied there.\n\nThe informative `could-not-run:` line STAYS. A reader must still see which\ninstrument could not answer and why; what changes is that the decider also\nends on a line the scorer recognises.\n\nNEGATIVE CONTROL, and it is the arm that matters: a host that CAN read\nMemAvailable and is below the floor must still emit\n`refused:gate:insufficient-memory` and be scored a FAILURE. A fix that\nturned the real refusal into a skip would convert this guard into\ndecoration — the direction 1176-fn2p exists to prevent.\n\n\n[2026-09-22T09:59:12Z macos] \nDELIVERED ON work/1354-apns, PR #152. THE OUTPUT the row asked for, measured on\nthis host with 1352-vmbc's build.sh applied to the worktree so the preflight\ncould run at all (that fix is PR #150 and is NOT in this diff):\n\n  before  refused:preflight:ran=94 skipped=16 failed=1\n  after   ok:preflight:ran=93 skipped=18 isolation=none-no-setsid   EXIT 0\n\nFIRST TIME `./build.sh --preflight` HAS EXITED 0 ON A MAC. The mandatory step is\nsatisfiable there.\n\nEach could-not-run now also ends on `skip:gate-memory:<reason>`. The informative\nline and the exit status are unchanged: the preflight matches `^skip:` anywhere\nand the litmus runner reads the LAST non-empty line, so one terminal line\nsatisfies both readers without either being touched.\n\nTHE NEGATIVE CONTROL IS PINNED RATHER THAN ASSUMED, because widening a\nnon-failure vocabulary is the one change that can quietly dissolve a red: a real\nbelow-floor refusal still emits refused:gate:insufficient-memory, carries NO skip\nline, and exits non-zero. MUTATION-VERIFIED IN BOTH DIRECTIONS — removing the\nterminal skip reds the new arm, and adding a skip line to the REAL refusal reds\nthe control. The second mutation is the one worth having: it is the only arm\nthat would catch this fix being widened into decoration later.\n\nFixture 12/12 -> 14/14; its count was already derived, so the total moved on its\nown.\n\nDEPENDENCY, stated so the queue is not surprised: the exit-0 measurement needs\n#150. On trunk today the preflight still reports ran=0 on macOS for the setsid\nreason, so if #150 lands after this, the macOS exit-0 result appears then. The\ndecider's own output and both fixture arms are independent of #150.\n\n[2026-09-22T10:48:26Z macos] \nLANDED with land81; 6af5d56c6 is an ancestor of origin/linux-next, verified at\nthe tree rather than taken on report: all three could-not-run exits in\nscripts/check-gate-memory-floor.sh carry their terminal skip: line, and the\nnegative-control arm (\"carries no skip line\") is present in\nscripts/test-gate-memory-refusal.sh."
