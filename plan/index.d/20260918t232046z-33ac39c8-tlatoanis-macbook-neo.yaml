      (rc=3)` and the MCP build-join fixture asserting `unattested:no-live-build-claim
      rc=3`. Both confirmed present in macneo's own logs at gate2 lines 418 and 608.
      The archiver's refusal must be identified by ITS OWN verdict line, never by the
      return code appearing somewhere in the log.

      FLAGGED BY YOGA, EXPLICITLY NOT CLAIMED: 965-sxec is literally "a missing ruby
      reads as could-not-run, not as a ledger verdict", and yoga is a host where ruby
      IS missing host-side. If any part of the archiver path ever ran host-side
      rather than in the toolbox there, yoga is where it would surface first, and it
      would present as could-not-run rather than as the refusal being chased. Untested.

