      THE FINDING IS A HOST/TOOLBOX SPLIT, NOT A VERSION.
        HOST     command -v ruby -> "ruby: commande introuvable"  (NO RUBY AT ALL)
                 ruby --version  -> "ruby: commande introuvable"
        TOOLBOX (tillandsias-builder, where ./build.sh --check actually runs)
                 command -v ruby -> /usr/bin/ruby
                 ruby --version  -> ruby 4.0.6 (2026-07-14 revision 03b6d3f889) +PRISM [x86_64-linux]
                 RbConfig libdir -> /usr/lib64
      yoga asked explicitly that this NOT be recorded as "yoga has ruby 4.0.6",
      which is true of the toolbox and FALSE of the host, and is exactly the
      collapse that makes this regime look like macuahuitl's.

      FOUR LAYOUTS NOW, and yoga is the only one where host and toolbox differ in
      whether ruby EXISTS:
        macneo      host /usr/bin/ruby 2.6.10 universal.arm64e-darwin26 — IN-GATE GREEN
        macuahuitl  host AND toolbox both 4.0.6 at /usr/lib64 — identical
        yoga        host: none. toolbox: 4.0.6 at /usr/lib64

      CORRECTION TO THIS ROW'S EARLIER macneo ENTRY, found by yoga's framing and
      owned by the holder. That entry recorded macneo's HOST ruby as "the layout".
      That happens to be correct for macneo but for a reason the entry never stated:
      build.sh re-execs into the tillandsias-builder toolbox on Fedora Silverblue and
      into the tillandsias-build WSL2 distro on Windows, and "non-Silverblue hosts
      skip with zero overhead" — so on macOS the gate runs HOST-NATIVE and host ruby
      IS the gate's ruby. Verified at build.sh:39-52 on trunk. The axis that matters
      is therefore the ruby in the EXECUTION CONTEXT, not the ruby on the host, and
      the two coincide on macOS and can diverge maximally on Silverblue. The earlier
      entry compared the right thing on macneo and would have compared the wrong
      thing on any Silverblue host.

      THE system-vs-managed CANDIDATE IS NOT SUPPORTED BY THIS DATA. yoga's toolbox
      ruby is a distro package at /usr/bin, like macneo's; the difference is the host
      having none. If system-vs-managed were the discriminator, yoga's toolbox should
      behave like macneo's host — and yoga is historically one of the two hosts that
      HAS reproduced the refusal. The obvious candidate is not obviously right. It
      remains untested rather than refuted; nobody has run the discriminating
      experiment.

      NAMESPACE DIVERGENCE: not resurrected here. yoga notes it was tested against
      macuahuitl's regime and refuted THERE, but that refutation DOES NOT TRANSFER to
      yoga, because macuahuitl's test established host==toolbox and on yoga they
      differ maximally. A refutation is a property of the regime it was run in.

      RECURRENCE: NEGATIVE, AND EVIDENCED. No in-gate archiver refusal on yoga
      tonight across three completed full gates on three different trees, plus one
      running. Every one green:
        archiver check passed / ok:archive-answerability:332/332 /
        PASS: archiver could-not-run verdict 4/4 (965-sxec) /
        archiver could-not-run self-naming check passed
      So no rc=3 and no out2 token, and yoga has NO exit-3 site to name. Two of the
      fleet's regimes are now green in-gate, including one of the two hosts that
      originally reproduced the refusal. Whether the refusal still reproduces
      anywhere is now an open question this row should answer before chasing which
      site fires.

      TRAP, FROM YOGA, WHICH WOULD HAVE COST THE HOLDER TIME: grepping gate logs for
      `rc=3` DOES hit, and none of the hits is the archiver. They are other fixtures'
