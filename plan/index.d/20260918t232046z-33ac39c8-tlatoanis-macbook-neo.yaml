        - no memo line anywhere in the archiver block (lines 5045-5048), and the
          block reports substantive work: 1049 packets archived, ready set 531,
          332/332 answered.
      So macneo's green stands as a real in-gate execution. It was one grep from
      being the same mistake.

      WHAT GENUINELY RAN ON LENOVINHA — the 965-sxec fixture, on a host with no ruby:
          ok   no usable ruby -> exit 3 (could-not-run), not a bare 127
          ok   the skip-eligible cause is tokenised
          ok   no substantive ready-set claim on a check that could not run
          PASS: archiver could-not-run verdict 4/4 (965-sxec)
      On a host that genuinely has no ruby, the designed path is exercised and
