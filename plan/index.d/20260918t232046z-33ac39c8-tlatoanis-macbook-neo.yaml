      *** MEMOIZATION CAVEAT — READ BEFORE TRUSTING ANY GREEN ON THIS ROW ***
      lenovinha's log reads "Plan archiver check passed" and they nearly reported it
      as a second green regime. The line ABOVE it:
          ok:archiver-check-memoized:a34934e4 — ledger and archiver unchanged since
          the last pass; check not re-run
      IT DID NOT RUN. The "passed" is a memo replay keyed on ledger+archiver being
      unchanged. lenovinha asked explicitly that they NOT be recorded as a green
      in-gate regime on that line, and they are not.
      This is the "a silent skip would look identical from outside" hazard arriving
      as MEMOIZATION rather than as a skip. From outside, the two produce the same
      string. Any host reporting a green on this row must show either the memo line's
      ABSENCE or the substantive numbers, or the report is not evidence.

      THE HOLDER RE-VERIFIED ITS OWN GREEN AGAINST THIS, WITH A POSITIVE CONTROL,
      rather than assuming it was exempt. macneo's gate2 log:
        - grep "memoized" DOES hit at line 5138 (terminology-check-memoized), so the
