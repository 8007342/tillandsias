# Two operator decisions: keep both implementations of 798-tk7b as bound TWINS,
# and the forge stays nix-free because it is ephemeral by design.
events:
  - packet_id: two-implementations-of-the-enclave-service-report
    event:
      type: note
      ts: "2026-08-19T02:45:00Z"
      agent_id: linux-macuahuitl-opus5-20260819T024500Z
      host: linux_mutable
      summary: |
        OPERATOR DECISION — KEEP BOTH. Their words: "why not both? CRDT all the
        way baby. The one proven useful in the long run will remain, the other
        one will get cleaned up ... they might both provide meaningful insights
        we don't want to lose."

        Accepted, and the reasoning is stronger than the ruling I was going to
        ask for. Two hosts independently reached the same diagnosis, the same
        vocabulary family and the same stale-healthy observation without
        conferring. That agreement IS the evidence, and deleting one
        implementation at 20:30 on the strength of having written the other
        destroys the sample rather than resolving it.

        BUT "KEEP BOTH" AND "ACCUMULATE BOTH" ARE DIFFERENT THINGS, and the
        difference is the whole content of this decision. Six byte-identical
        exit_pause traps (828-h7kw) are what unbound duplicates become. Four
        drifts in orchestrate-enclave.sh (825-uxzu, 826-gsjg) are what happens
        when a copy diverges from the source of truth it was cloned from. The
        operator's own proposal — a cross-reference comment, "when updating
        here, also look at <blah>" — is necessary and NOT sufficient: this
        project has 138 uppercase MUST/NEVER statements and ~2 working
        enforcers, so a comment is a rule that rots.

        SO THEY BECOME TWINS, which is a bound pair, on three conditions:

        1. MUTUAL REFERENCE. Each implementation names the other at its head,
           and each packet names its twin. This is the operator's cross-ref and
           it is the cheap half.
        2. A SHARED CONFORMANCE FIXTURE. One fixture, both implementations run
           against it. Divergence then shows up RED instead of as a comment
           nobody read. This is the half that makes the cross-reference
           load-bearing, and it is what would have caught all four
           orchestrate-enclave drifts on the day they landed. The grammar is
           already converged (yoga's dialect, adopted here), so the fixture has
           something concrete to assert.
        3. A RETIREMENT CRITERION, STATED NOW, NOT LATER. "The one proven useful
           in the long run will remain" is only true if we say in advance what
           counts as proof. Otherwise the horizon never arrives and the twins
           become the six exit_pause copies. Proposed criterion for THIS pair:
           at the next de-slop sweep that finds both still present, retire the
           one with zero recorded invocations since twinning — the product
           surface is invoked by `tillandsias --diagnostics`, the script by
           cycle-preflight, and both leave traces, so this is measurable rather
           than a judgement call.

        WHY THIS IS THE CRDT ANSWER AND NOT A DEPARTURE FROM IT. In a CRDT you
        never delete; the READ resolves. Twinning gives a duplicated pair a
        resolution function — the retirement criterion — so the read eventually
        converges on one. A pair with no resolution function is not a CRDT, it
        is a junk drawer. That distinction is exactly what separates "CRDT all
        the way" from the accumulation 829-dkuc exists to sweep.

        METHODOLOGY: the operator asked "should we also come up with
        ./methodology for fixing concurrent correct fixes?" Yes — but NOT as a
        new section here. methodology/distributed-work.yaml:885 already rules:
        "Do not grow this section ad hoc — reduce through that packet", naming
        collaborative-work-scheduling-research (order 335, ready). Twinning is
        post-collision reconciliation rather than pre-collision dispatch, but it
        is close enough that routing it through 335 is the disciplined path, and
        obeying that rule is worth more than the paragraph I would otherwise
        have added. Recorded against 335 below.
