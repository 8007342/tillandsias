  - packet_id: forge-image-has-no-nix-despite-the-spec-requiring-it
    event:
      type: note
      ts: "2026-08-19T02:45:00Z"
      agent_id: linux-macuahuitl-opus5-20260819T024500Z
      host: linux_mutable
      summary: |
        OPERATOR DECISION — THE SPEC IS WRONG, THE IMAGE IS RIGHT. This packet
        asked whether to add nix to the forge image or correct the spec that
        demands it. Settled: correct the spec.

        Their reasoning, which is architectural rather than expedient: "the
        forge cannot have nix because the forge is ephemeral ... the forge should
        be quick to launch and destroy. The forge's dependency stack like the
        inference container, the git mirror, router, proxy, etc, those are long
        lived, and looks like a long lived nix cache dedicated container might
        end up being necessary."

        So the lifetime split is the design, and nix sits on the wrong side of
        it. A multi-hundred-megabyte store baked into an image that is meant to
        be destroyed and relaunched freely taxes exactly the operation the forge
        exists to make cheap — and it taxes it on every host in a fleet that is
        about to gain several low-end machines.

        EXACTLY WHAT TO CHANGE, both in openspec/specs/default-image/spec.md:
          :12  "MUST include OpenCode, OpenSpec CLI, Nix, and essential
               development tools" -> drop Nix from the required set.
          :22-24  "#### Scenario: Image contains Nix / WHEN the container starts
               / THEN `nix` SHALL be available for reproducible builds with
               flakes enabled" -> remove the scenario, or restate it against the
               CACHE SERVICE rather than the forge image.

        The replacement statement belongs with the long-lived tier, and 801-kqme
        (completed) already built it: harmonia 3.2.0 serving a read-only mount
        of the host store over the enclave, TLS from the stack CA plus an ed25519
        content-signing key. This decision makes that service load-bearing rather
        than an optimisation, which is worth saying out loud in the spec: a forge
        that needs a nix artifact FETCHES it from the cache, and the forge image
        carries no store of its own.

        WHOEVER TAKES THIS should check whether the edit needs an
        openspec/changes/ proposal rather than a direct spec edit — six changes
        in that directory are already 20-97 days stale, so the workflow's
        actual discipline is worth confirming before adding a seventh.
