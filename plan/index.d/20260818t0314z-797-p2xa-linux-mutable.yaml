packets:
  - packet_id: podman-mock-secret-arm-reads-the-subcommand-as-the-secret-name
    order: 813-frih
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "podman-mock's `secret rm` and `secret inspect` read the SUB-SUBCOMMAND as the secret name, so removal is a no-op that reports success and inspection always reports absent"
    deliverable: "`secret rm <name>` removes the secret the mock created and `secret inspect <name>` finds it; both read the name from its actual argv position, with a fixture that creates, inspects, removes and re-inspects so a no-op removal cannot pass"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [fail-loud, testing, podman, litmus, secrets]
    estimated_hours: 2
    context: |
      OBSERVED on macuahuitl 2026-08-18 while auditing the same file for
      797-p2xa. Reproduces in four lines against the tracked mock:

        export LITMUS_PODMAN_STATE_DIR=/tmp/probe
        printf 'hunter2' | scripts/test-support/podman-mock.sh secret create my-secret -
        scripts/test-support/podman-mock.sh secret inspect my-secret   # rc=1  (WRONG: it exists)
        scripts/test-support/podman-mock.sh secret rm my-secret        # rc=0, file SURVIVES

      MECHANISM. `create` extracts the name by scanning argv for the token
      after `create`. `rm` and `inspect` do not - both do
      `secret_name="${2:-}"`, and with `secret` as the subcommand at $1, $2 is
      the SUB-SUBCOMMAND. So `rm` deletes a file literally named `rm` (never
      the secret) and `inspect` stats a file named `inspect` (never present).
      The name is at $3.

      WHY THIS IS THE 797-p2xa CLASS AND NOT A TYPO. `rm` exits 0 having done
      nothing, so any test that asserts "the secret was removed" by checking
      the exit status passes while the secret is still on disk - a silent pass,
      one arm over from the three just closed. `inspect` is the mirror image:
      it always answers "absent", so a test asserting absence passes without
      the mock ever having looked. The consumers reaching this arm are
      litmus:credential-isolation and the secret-lifecycle architecture in
      methodology/event/016-secret-lifecycle-litmus-architecture.yaml.

      NOT FIXED UNDER 797-p2xa DELIBERATELY. Flipping `secret inspect` from
      always-absent to sometimes-present changes what the credential-isolation
      tests observe, and the lesson of 797-p2xa itself is that a mock's
      behaviour change needs its own measured blast radius, not a drive-by
      inside someone else's packet. Budget one full pre-build litmus at
      --size all (about 25 minutes on macuahuitl, 316 executed tests) and
      expect any movement to show up in the secret-lifecycle specs.
