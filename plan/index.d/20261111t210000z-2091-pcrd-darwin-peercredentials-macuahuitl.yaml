    title: |
      tillandsias-headless --features host-services fails to compile on darwin (E0425): mcp_socket::lane_listener_pid calls nix sockopt::PeerCredentials, which nix defines only for linux/android
    context: |
      Reported in the 2068-dmck macOS handoff as preflight red #2 (rust-clippy E0425 on tlatoanis-macbook-air). Checked on macuahuitl 2026-11-11 against origin/linux-next e1f8d7f01: cargo clippy -p tillandsias-headless --features host-services --all-targets is clean on Linux, so it does not reproduce there. The ungated call is mcp_socket::lane_listener_pid, added by 8e2884e01 (2070-mtf9 slice 1, 2026-11-09); mod mcp_socket is gated only on feature host-services, not target_os. The other PeerCredentials user, guest_credentials, is already gated cfg(target_os = "linux"). Pre-existing on linux-next; not caused by 2068-dmck.
    exit_criteria:
      - 'red first: cargo clippy -p tillandsias-headless --features host-services --all-targets fails with E0425 on darwin at lane_listener_pid on the pre-fix code'
      - 'the same command is clean on darwin after the fix (LOCAL_PEERPID via nix LocalPeerPid, or a cfg(target_os = "linux") gate with a darwin None), and still clean on Linux'
    verifiable_closure: 'cargo clippy -p tillandsias-headless --features host-services --all-targets on a darwin host'
