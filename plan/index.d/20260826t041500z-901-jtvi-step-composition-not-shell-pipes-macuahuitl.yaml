packets:
  - packet_id: the-test-and-runbook-tier-composes-with-shell-pipes-instead-of-steps
    order: 901-jtvi
    status: ready
    desired_release: v0.5
    priority: p1
    kind: enhancement
    release_target: fail-loud-diagnosis-milestone
    title: |
      litmus/runbook steps are raw shell strings containing pipes, so a step has ONE exit code, SIGPIPE is implicit and stderr routing is ad-hoc — five separate findings in one night were instances of this
    deliverable: |
      a step model with per-stage exit codes and explicit error handling for the
      tier that currently uses `bash -c "a | b"`
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - fail-loud
      - testing
      - runbook
      - architecture
    estimated_hours: 8
    context: |
      OPERATOR DIAGNOSIS, 2026-08-26. The framing is theirs and it is the common
      cause of a defect cluster the fleet had been treating as five unrelated
      bugs:

        "The idiomatic layer should not be doing exec('piped command | other
         step'), the whole purpose of the idiomatic layer is to have
         exec('piped command').then('other step').onError(handler()). You SHOULD
         NOT be dealing with pipes all over the place. That's what the idiomatic
         layer is meant to prevent. Also, this should allow you to control
         success and exit codes more granularly, instead of in bulk."

      MEASURED, BECAUSE THE DIAGNOSIS LANDS ON A DIFFERENT TIER THAN IT NAMES.
      The Rust product code is NOT the offender and already does the right thing:

        rust command-string pipelines                    0
        e.g. vz.rs decompress: Stdio::from(final_out)    a real file handle,
                                                         not `| xz -d > file`
        openspec/specs/vm-idiomatic-layer already carries
          discipline.wsl-encapsulation (MUST, measurable) and
          invariant.no-wsl-shellouts-outside-vm-layer

      The pipes are all in the TEST AND RUNBOOK tier, which has no such layer:

        litmus `command:` fields containing a pipe      1248
        shell scripts with tee/head/tail/grep pipelines  212 files
        SKILL.md runbook snippets with pipes              57
        set -o pipefail                                  346 files
        PIPESTATUS references                             39

      `scripts/run-litmus-test.sh:89` — step commands run in CHILD `bash -c`
      shells. So a litmus step IS a raw shell string. Representative, and it is
      exactly the failing shape:

        command: "tillandsias --init --test 2>&1 | head -20"

      `head` exits at 20 lines, SIGPIPEs the producer, and the step's exit code
      is `head`'s, not the binary's. The 346 `pipefail` files and 39 `PIPESTATUS`
      references are the tax already being paid to hand-compensate for this —
      badly, and non-portably.

      FIVE FINDINGS FROM ONE NIGHT, ALL THIS ONE SHAPE. They were filed
      separately because each looked like its own bug:

        1. `| tee "$LOG" | head -30` SIGPIPE'd tee and TRUNCATED THE PRIMARY
           EVIDENCE FILE at 75 lines with no RESULT line (899-6pwv, yolanda).
        2. `PUSH_EXIT=$?` after a pipeline captured `tail`'s status, so a
           REFUSED PUSH read as success (yoga).
        3. `${PIPESTATUS[0]}` is bash-only and empty under zsh 5.9, macOS's
           default shell — so the workaround for (2) silently fails on a whole
           platform (macbook).
        4. `2>/dev/null` on a probe swallowed `ps: unknown option -- o`, so a
           broken primitive returned a confident wrong ownership verdict
           (899-q9di, mine, found by yolanda).
        5. `timeout 40 build.sh --check --install > "$TDIR/combined.log" 2>&1`
           with `trap 'rm -rf "$TDIR"' EXIT` — the warning was written and then
           DESTROYED, which is why 897-5m9y took four hosts to diagnose.

      Every one is a stage's failure or side effect made invisible by being
      inside an opaque shell string that yields one status at the end.

      WHY THIS IS THE SAME CLASS THE MILESTONE IS ABOUT. Tonight's recurring
      shape is "a check that passes identically whether or not the thing works".
      A pipeline is a machine for producing exactly that: the last command's
      exit code stands in for the whole chain, so `false | true` succeeds and
      `producer | head` succeeds even when the producer died. The tier that
      grades our correctness composes its assertions out of the one construct
      that most reliably hides failure.
    outcome: |
      A test or runbook step can state what runs, what consumes it, which stage's
      status decides the verdict, and what happens on error — without a pipe.
    exit_criteria:
      - 'A step model exists for litmus `command:` (and the runbook idiom) expressing stages with PER-STAGE exit codes and explicit error handling, rather than one shell string. The operator''s shape is the target: run(...).then(...).onError(...). Truncation/paging becomes a property of the CONSUMER, not a signal delivered to the producer.'
      - 'MIGRATE A REAL SUBSET AND MEASURE, do not convert 1248 fields on faith. Take the ~57 runbook snippets plus the litmus steps whose pipe terminates in head/tail — those are the SIGPIPE-exposed ones — and show at least one existing green step going red because a producer failure was previously masked. If nothing turns red, say so plainly; that is a real and reportable outcome about how much the cluster actually cost.'
      - 'NEGATIVE CONTROL: a genuinely passing pipeline still passes, and a step that legitimately wants only the first N lines can still say so without its producer being killed. Do not fix this by banning pipes and forcing every author to hand-roll a temp file — that trades one implicit hazard for a noisier one.'
      - 'The 39 PIPESTATUS sites and any `2>/dev/null` on a PROBE are audited as part of this, since both are the same defect wearing a workaround. A discarded stderr must be a decision the step records, not a default.'
      - 'PORTABILITY IS AN EXIT CRITERION, NOT A FOLLOW-UP. Whatever lands is exercised on linux, darwin and msys before it is wired into --check. Three defects in eight hours were primitives that worked where they were authored: GNU-only `du -sb`, GNU-only `\S` in sed, and `ps -o ppid=` absent on MSYS. `${PIPESTATUS[0]}` being empty under zsh is a fourth.'
    verifiable_closure: |
      A migrated step whose producer fails mid-pipeline reports the PRODUCER's
      failure, and the same step passes unchanged when the producer succeeds —
      both proven by fixture on all three lanes.
    notes: |
      THE OPERATOR'S DIAGNOSIS IS RIGHT AND THE CORRECTION TO IT IS NARROW: the
      Rust idiomatic layer is not the offender. It builds zero command-string
      pipelines, uses structured `Stdio` handles, and already carries a measurable
      invariant against shellouts escaping it. The tier that needs the idea is the
      one that never had a layer at all — litmus definitions, scripts, and the
      runbook snippets agents copy verbatim. Recording that distinction because
      "fix the idiomatic layer" would send the implementer to code that is already
      correct.

      DO NOT scope this as a lint that bans `|`. The value is per-stage status and
      explicit error handling; a ban delivers neither and would be trivially
      satisfied by moving the pipe into a helper.

      Related: 899-6pwv (the tee|head guard, yolanda) is a member of this class
      and should probably become a slice of it rather than a separate fix — one
      guard for one idiom cannot cover 1248 sites. 897-5m9y and 899-q9di both
      record instances.
