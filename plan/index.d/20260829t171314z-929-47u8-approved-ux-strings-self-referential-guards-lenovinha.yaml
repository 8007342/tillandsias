      host: linux
      summary: |
        Filed from 626-w3fn, at the coordinator's request, under the
        observer-files rule. Found by mutation-testing my own guard rather than
        by review: I assumed the in-file assertion enforced the operator's
        approval, and it did not.

        The general shape is worth more than the instance — a guard that lives
        in the same editable unit as its subject can enforce consistency but
        never authority. It is also the tenth instance in my recent work of a
        guard defeated by its own subject, and the first where the subject is a
        governance rule rather than a behaviour.
