# Ledger fragment — append-only, IMMUTABLE once written.
packets:
  - packet_id: approved-ux-strings-are-guarded-by-assertions-that-live-in-the-same-file
    order: 929-47u8
    status: ready
    title: |
      Every operator-approved UX string in the tree is guarded — where it is
      guarded at all — by an assertion sitting in the same file as the string,
      which one find-and-replace edits into agreement; audit the fleet and
      anchor each to the ledger
    kind: bug
    pickup_role: any
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - tray-ux
      - governance
      - fail-loud
      - tests
    estimated_hours: 3
    deliverable: |
      An audit of every end-user-facing UX string that spec:tray-ux governs,
      recording for each whether an operator approval exists in the ledger and
      whether anything mechanically enforces that the shipped string still
      equals the approved one; plus a ledger-anchored guard for each string
      that has an approval, on the scripts/check-approved-ux-strings.sh
      pattern, each mutation-verified.
    context: |
      MEASURED on lenovinha 2026-08-29 while implementing 626-w3fn (b), and it
      is a governance hole rather than a test-quality complaint.

      crates/tillandsias-headless/src/bringup_progress.rs carries a test
      asserting the emitted line equals the operator-approved template. The
      assertion is a LITERAL IN THE SAME FILE as the constant it checks, so a
      single find-and-replace edits both and the suite stays green. Verified by
      mutation: rewording "Getting your workspace ready…" to "Setting up your
      workspace…" across that file left ALL SIX TESTS PASSING.

      The neighbouring vocabulary test DOES fire when a reword introduces a
      BANNED word — "Preparing the container stack…" trips it on `container`.
      That is why the hole is easy to miss: the file looks well guarded, and it
      is, against the wrong failure. The change the approval gate exists to
      prevent is an unapproved reword with CLEAN vocabulary, and nothing caught
      that. It would have been discovered by the operator noticing different
      words on their screen.

      spec:tray-ux states that approval lives "recorded in the plan ledger (an
      operator_note or operator-attributed event on the packet)". So the ledger
      is not a convenient second copy — it is where the authority IS, and a
      guard that does not consult it is not checking approval, it is checking
      self-consistency.

      ROOT CAUSE, and it is the generalizable part: A GUARD THAT LIVES IN THE
      SAME EDITABLE UNIT AS ITS SUBJECT CANNOT ENFORCE AUTHORITY OVER IT. It
      can enforce internal consistency, which is a different and weaker claim.
      Authority has to be anchored in a place the edit cannot reach — a
      different file, written by a different actor.
    why_it_matters: |
      An unapproved UX change is not a style regression; spec:tray-ux is
      explicit that one "found at review MUST be reverted and the incident
      recorded", with the reset-guest menu leaf (added 2026-07-21 without
      approval, removed by operator order 2026-07-22) as the standing
      precedent. A guard that cannot detect the violation leaves that
      enforcement entirely to a human noticing, which is exactly the reliance
      the gate exists to remove.
    exit_criteria:
      - |
          An inventory of end-user-facing UX strings under spec:tray-ux, each row saying: does a recorded operator approval exist, and is the shipped string mechanically pinned to it. The inventory is MEASURED — grep the tree, do not recall — and rows with no approval are named as such rather than quietly omitted.
      - |
          Every string that HAS an approval is pinned by a check that reads the string from source and requires it to appear in the ledger, on the scripts/check-approved-ux-strings.sh pattern, wired into ./build.sh --check.
      - |
          MUTATION-VERIFIED per guard, and the mutation is the one that matters: an innocuous reword using CLEAN vocabulary. A guard verified only against a banned-word reword repeats the exact defect this packet is about.
      - |
          NEGATIVE CONTROL: the clean tree passes every added guard, and the guards do not fire on diagnostic/agent-facing surfaces, which spec:tray-ux deliberately leaves under normal engineering discipline.
    notes: |
      scripts/check-approved-ux-strings.sh (626-w3fn) is the worked example and
      the mechanism; it currently covers exactly one string. Its header records
      the measurement and its own deliberate non-claims — it cannot verify that
      approval exists for a string nobody has added yet, and it cannot tell an
      operator_note from a persuasive note calling itself one. Keep those
      non-claims when generalizing: overstating a governance guard is the same
      category error it exists to catch.

      DO NOT let this sweep become a licence to touch UX text. Auditing and
      pinning are ungated engineering; changing any string is not, and needs
      its own operator approval per surface.
events:
