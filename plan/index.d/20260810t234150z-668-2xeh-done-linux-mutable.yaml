        "plan-only lane: validated <path>" line per file and a
        "plan-only lane clean" verdict, so a push record names exactly what was
        accepted without a build.

        FAIL CLOSED, demonstrated live in a fixture repo with a real bare
        origin and a real `git push` through the installed hook: a mixed diff
        (fragment + src/lib.rs) is refused with the unchanged full-gate
        message and the remote does not move; modifying an EXISTING fragment
