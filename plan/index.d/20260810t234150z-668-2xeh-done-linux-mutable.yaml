        fragment fails lane validation and falls to the full gate; ref
        deletions, new remote refs (no base to diff), nested paths, and a host
        with neither yq nor the plan binary all decline the lane. The lane can
        only accept a strictly smaller class of pushes than the stamp path —
        a fresh stamp still passes exactly as before.

