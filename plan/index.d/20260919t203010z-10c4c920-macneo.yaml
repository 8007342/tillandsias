        level, so by reading it should have been excluded; but it is the only input
        class present in the reproducing tree and absent from the non-reproducing one.
        CHEAPEST DISCRIMINATING TEST, for whoever takes this: on one host, stamp a
        tree, merge a commit adding ONLY plan/index.d fragments, verify; then stamp
        again, merge a commit adding ONLY a TOP-LEVEL plan/issues/*.md, verify. If the
        second stales and the first does not, the plan/issues arm is the defect and the
        row has its mechanism. If neither stales, the difference is elsewhere in the
        two trees and this hypothesis is dead — which is also a result.
        NOT CLAIMED: that this is the cause. It is the only difference two reports make
        visible, which is a reason to test it first and nothing more.

        A NOTE ON WHAT THE NON-REPRODUCTION DOES NOT DO. It does not weaken the
        reproduction. The macneo measurement stands on its own evidence — verify said
