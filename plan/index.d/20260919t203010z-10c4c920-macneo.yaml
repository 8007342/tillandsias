        THE ONE DIFFERENCE VISIBLE IN THE TWO REPORTS, offered as the first hypothesis
        to test and explicitly NOT as a finding:
          macneo's merge:     3x plan/index.d/*.yaml  AND  1x plan/issues/*.md
          macbookair's merge: 3x plan/index.d/*.yaml  only
        The plan/issues arm is the more complex of the two exclusions. compute() skips
        plan/index.d/*.yaml with a single pattern, but skips plan/issues/*.md only at
