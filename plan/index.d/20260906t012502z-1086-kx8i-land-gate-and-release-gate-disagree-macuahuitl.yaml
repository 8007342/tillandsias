      THREE OF THE NINE ARRIVED WITHIN ELEVEN HOURS. The release gate runs ONCE
      PER DAY, so a full day of landings accumulates defects that no individual
      land can detect. Every host on 2026-09-05, the coordinator included,
      landed green through a gate blind to all nine.

      FAILURE 1 IS NOT COSMETIC AND IS THE ARGUMENT FOR THE PACKET'S PRIORITY.
      a00a0f76b deleted `build_local_projects_submenu` and left its doc comment
      behind. The orphaned block shifted the CLOUD submenu's entire doc —
      including `@trace spec:tray-ux, spec:remote-projects` — onto
      `cloud_overflow_row`. The real `build_cloud_projects_submenu` at line 3405
      lost its annotation, and `validate-traces.sh` still reports 100% coverage
      because the marker exists in the FILE. A trace satisfied by a function
      that does not implement it is a false green in the trace ledger, and it
      was invisible to every land for 28 hours.

      THIS IS THE SAME CLASS AS FOUR OTHER FINDINGS OF THE SAME NIGHT, which is
      why it is filed as a class and not as nine fixes (yoga's framing): THE
      ARTEFACT EXISTS AND THE PATH TO IT DOES NOT.
        - a fix on trunk that hosts had built and never installed
        - a tool built and not invoked, its answer re-derived from scratch
        - four guards shipped and wired to nothing
        - a gate step that moved into scripts/gate-steps.d/ while a scan of
          build.sh for it did not follow
        - and this: a gate that runs daily, so its coverage has a 24-hour lag

      THE QUALIFIER IS MACNEO'S AND IT MUST TRAVEL WITH THE PACKET, or the fix
      produces the next defect: THE PATH EXISTING IS NECESSARY AND NOT
      SUFFICIENT — the artefact at the end of it must answer the question the
      path is named for. Demonstrated the same night on
      `check-plan-binary-current.sh`: wiring it would have printed
      `ok:plan-binary-current` on binaries that were stale in the way that
      mattered, because it probes ONE commit's refusal under a name claiming
      the general property. An unwired guard is inert; a wired guard answering
      a narrower question than its name is ACTIVELY MISLEADING, because it
      hands you a green to cite.
    next_action: |
      LEFT TO DO:

      1. ENUMERATE BOTH GATES' STEP SETS and diff them. `--check` and
         `--ci-full` share build.sh; the divergence is which blocks are guarded
         by the ci-full flag plus which litmus phases run. Eleven steps now
         live in scripts/gate-steps.d/*.step, so an enumeration that greps
         build.sh alone will under-count — that mistake was made once already
         on 2026-09-05.

      2. DECIDE PER CONDITION whether it belongs in --check. Some legitimately
         do not: all-features clippy and the full litmus suite are expensive,
         and forcing them onto every land is how a gate gets bypassed. The
         deliverable is not "run everything everywhere"; it is that the set
         enforced only in the daily gate is DECLARED and BOUNDED, so a
         condition cannot join it silently.

      3. BUILD THE CHECK THAT FAILS ON SILENT DIVERGENCE — a condition enforced
         in one gate and not the other, with no declaration. That is this
         packet's scorable closure and it must be written before the nine are
         fixed, or the fixes will pass and the class will recur.

      4. DO NOT FIX THE NINE UNDER THIS ORDER. They belong to their owners:
         #4 python routes to yoga (bde83aa26, plus check-tray-refresh-no-
         polling.sh from the same commit, unflagged but worth checking);
         #1 to whoever owns tray/mod.rs; #3's orphans are two wired by yoga,
         one renamed by esmeraldinha to lib-sigpipe-verdict.sh with a
         refused:not-a-check exit, and one (check-plan-binary-current.sh)
         held by macuahuitl pending a rewrite.

      5. WORKED PRECEDENT, from pirria: test-cycle-preflight-cargo-resolution.sh
         was bound to NOTHING until 1005-m6rz bound it, and the moment it ran
         in a gate it went 11/15 and exposed two host-dependent arms. Binding
         an unrun check surfaces real failures immediately; budget for that
         rather than being surprised by it.
