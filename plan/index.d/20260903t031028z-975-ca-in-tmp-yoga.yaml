packets:
  - packet_id: enclave-ca-bundle-lives-in-tmp-so-containers-cannot-restart
    order: 975-rsgm
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: the enclave CA bundle is materialized under /tmp, so every container that mounts it becomes permanently unrestartable once /tmp is cleaned
    deliverable: 'the CA bundle is materialized somewhere that survives a /tmp clean and a reboot, or the services that mount it re-materialize it before starting — so `podman start tillandsias-proxy` recovers instead of failing forever'
    pickup_role: linux
    release_target: stable-milestone-v1
    capability_tags:
      - enclave
      - containers
      - proxy
      - fail-loud
      - lifecycle
    estimated_hours: 2
    context: |
      MEASURED on yoga 2026-09-03, after FIVE consecutive cycles in which
      cycle-preflight.sh reported the same line and I reported it onward as an
      operator item without diagnosing it:

          fail:enclave-service-start-failed:service=tillandsias-proxy:action=operator

      The cause is not the proxy:

          $ podman start tillandsias-proxy
          Error: crun: cannot stat `/tmp/tillandsias-ca/intermediate.crt`:
                 No such file or directory: OCI runtime attempted to invoke a
                 command that was not found
          $ ls /tmp/tillandsias-ca/
          ls: cannot access '/tmp/tillandsias-ca/': No such file or directory

      The container's bind is
      `/tmp/tillandsias-ca/intermediate.crt:/etc/squid/certs/intermediate.crt:ro`.
      container_deps.rs:32 declares the Service::CaBundle rung as "Materialized
      CA bundle under `/tmp/tillandsias-ca`", and remote_projects.rs mounts the
      same path into other containers at :316 and :647.

      SO THE FAILURE IS STRUCTURAL, NOT INCIDENTAL. /tmp is volatile by design —
      cleared on reboot and swept by systemd-tmpfiles on a timer. Podman records
      the bind SOURCE in the container definition, so once the file is gone,
      `podman start` can never succeed again for any container that mounts it.
      The launch path materializes the bundle; the RESTART path does not, and a
      restart is exactly what happens after the reboot that cleared it.

      WHY IT LOOKED LIKE AN OPERATOR PROBLEM FOR FIVE CYCLES, which is the part
      worth keeping. The proxy's own last words are a clean shutdown —
      "Squid Cache (Version 6.12): Exiting normally", exit 0 — and preflight's
      verdict names the SERVICE and an owner (`action=operator`). Nothing in
      either signal mentions a missing file on a filesystem nobody chose to
      involve, so the honest reading of both is "a service is down, ask the
      operator". The diagnosis costs one `podman start` and nobody ran it,
      because the verdict already told a complete-sounding story.

      SAME CLASS AS 964-zedm, CLOSED HOURS EARLIER: the spec-index builder
      staged into /tmp and died on a 256 MB tmpfs while the index root had 1.2 TB
      free. Both are "/tmp used for something whose lifetime must exceed /tmp's".
      Two independent instances in one day suggests the ambient temp directory is
      being reached for as a default rather than chosen, and that a third
      instance is likely somewhere else in the launch graph.

      NOT INVESTIGATED, so nobody assumes it was: whether the other mounters
      (remote_projects.rs :316 and :647, tray/mod.rs:2223) fail the same way, and
      whether a fresh `tillandsias --init` re-materializes the bundle and
      recreates the containers — which would explain why this has not been fatal
      fleet-wide, and would make the fix "re-materialize on the restart path"
      rather than "move the directory".
    exit_criteria:
      - |
          After the CA directory is removed, `podman start tillandsias-proxy`
          either succeeds or fails with a verdict naming the missing bundle and
          the command that re-materializes it — never with a bare crun stat error
      - |
          A host that has rebooted (or had /tmp swept) reaches a running proxy
          without an operator hand-repair
      - |
          The path is asserted in ONE place; a test fails if a bind source for
          the CA bundle is introduced under an ambient temp directory again
    verifiable_closure: |
      Remove /tmp/tillandsias-ca, run the enclave restart path, and observe the
      proxy reach Running — or, if it cannot, observe a verdict that names the CA
      bundle and the remedy rather than a crun stat failure.
    events:
      - type: filed
        ts: "2026-09-03T03:10:28Z"
        agent_id: linux-yoga-claude-20260903t030913z
        host: yoga
        summary: |
          Diagnosed after five cycles of reporting the preflight verdict onward
          without running the one command that explains it. The proxy exits
          cleanly and cannot restart because its CA bind source lives in /tmp.
    notes: |
      Sibling to 964-zedm (spec-index staging in /tmp) — same class, found the
      same day, different subsystem.
