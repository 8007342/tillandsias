packets:
  - packet_id: 945-vpg3
    order: 945-vpg3
    status: ready
    owner_host: windows
    capability_tags: [windows, tray, forge, headless]
    title: >-
      Windows has no headless forge-launch entry point, which blocks automated
      release blessing
    summary: |
      The Windows tray can only launch a forge from a GUI menu arm
      (MenuAction::Attach / Maintain -> launch_open_shell_terminal, which builds
      the forge-wrapped in-VM argv and opens it through wsl.exe). There is no
      invokable equivalent, so the forge-launch leg of a release smoke cannot be
      driven without an operator click.

      FOUND BY: the v0.4.260830.5 blessing round on yolanda, 2026-08-31. Every
      other leg ran headless from the downloaded release binary — --reset-guest
      wiped and reprovisioned to "VM Ready — control wire up", --provision-once
      returned Ready in 14s against the fresh substrate (idempotency
      demonstrated, not asserted), vault and proxy came up healthy on both
      enclave networks, systemctl --failed was empty, and the guest images
      carried the v0.4.260830.5 tags from the Windows parity lane. Only the
      forge launch could not be exercised.

      WHY IT WAS NOT WORKED AROUND, which is the point of the packet: a forge is
      a podman container in the guest (hostname forge-<project>, network
      tillandsias-enclave, project bind-mounted at /home/forge/src/<project>),
      and an equivalent podman run could have been hand-rolled. That would have
      tested the tester's argv rather than the client's — the substitution that
      makes a smoke worthless. The image is also absent on a fresh substrate
      (built on first launch), and the runtime guest deliberately does not mount
      the repo, so scripts/build-image.sh is not reachable from inside it.

      CONVERGENCE, and the reason this should not be designed alone: the
      operator directed the same capability on the Linux side the same night —
      launching interactive agents inside a freshly built forge, with the agent
      reporting back to the coordinator over remote control. The Linux CLI lanes
      (--claude / --codex / --opencode <project>) already exist as entry points
      and macuahuitl is extending prompt and reporting support on them. Windows
      needs the entry point ITSELF extracted from the tray's Attach arm into
      something invokable. Same contract, two platforms; the Linux wiring lands
      first and is the reference shape.

      SCOPE: extract the launch path behind MenuAction::Attach into a headless
      entry point that takes a project and a launch kind, so the tray menu and a
      CLI invocation share one implementation rather than the menu owning it.
      Not in scope: changing what a forge IS, or the enclave's refusal to mount
      the repo (both correct as they stand).

      EXIT CRITERIA:
        1. a forge launch is invokable without a GUI click on Windows
        2. the tray menu arm and the headless path go through the SAME code, so
           a smoke that passes headless is evidence about what the menu does
        3. the v0.4.260830.5-style blessing round can run its forge leg
           unattended, and the blessing checklist stops carrying a manual step
