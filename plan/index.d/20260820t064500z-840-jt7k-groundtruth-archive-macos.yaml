packets:
  - packet_id: archival-sweep-broke-four-groundtruth-citation-pins
    order: 840-jt7k
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "the 550-packet archival sweep moved 394a/394c/394d and experts-construction-research out of plan/index.yaml, and the rung-1 groundtruth set pins those citations BY PATH — expert accuracy fell 100% -> 81% with no expert change"
    deliverable: "the groundtruth set grades against archived packets too, or its pins move with the archiver; the archiver's acceptance assertions include the harness"
    pickup_role: any
    release_target: forge-local-experts-milestone
    capability_tags: [plan-ledger, experts, ci-gates, fail-loud]
    estimated_hours: 2
    context: |
      MEASURED 2026-08-20 on macOS, immediately after merging origin/linux-next:

        expert_accuracy: pass=22 total=22 rate=100%   (cycle 2026-08-19T20:38Z)
        expert_accuracy: pass=18 total=22 rate= 81%   (cycle 2026-08-20T04:31Z)

      Nothing about the experts changed between those two readings. The merge
      brought commit 178d1a068, "chore(plan): heavy maintenance sweep — 550
      archived, 56% index reduction" — a Tlatoāni-authorised sweep, correctly
      done, with the rows moved to plan/archive/packets-2026-08.yaml rather
      than deleted. NO DATA WAS LOST and this packet should not be read as
      criticism of the sweep.

      WHAT BROKE. `tillandsias-plan grade` names the four failures:

        FAIL plan-active-release-experts-milestone
        FAIL plan-blocked-by-394c
        FAIL plan-closure-downstream-of-394a
        FAIL plan-status-of-394a

      and the assertion text is explicit about why:

        no citation satisfies {path=plan/index.yaml, order=394a, ...}
        no citation satisfies {path=plan/index.yaml, order=394d, ...}
        no citation satisfies {path=plan/index.yaml,
                               packet_id=experts-construction-research, ...}

      The pins name `path=plan/index.yaml`. The packets are now at
      plan/archive/packets-2026-08.yaml. The expert answers correctly from the
      data it can see; the grader is asserting a location that is no longer
      where that data lives.

      WHY THIS IS WORTH A PACKET RATHER THAN A PIN EDIT. The sweep's own commit
      message records that ATTEMPT 1 archived 569, "passed both acceptance
      assertions", and still turned check-fragment-status-loss.sh red with 38
      violations — orphaning events aimed at archived rows. That was caught and
      handled. This is the SAME class of consequence, one step further out: the
      acceptance assertions do not include the groundtruth harness either, so
      archiving silently degrades the fleet's only measure of whether the
      experts are RIGHT. The next sweep will do it again.

      NOTE THE FAILURE MODE IS THE GOOD ONE, and preserving that matters more
      than the number: the harness went RED and named the exact pins. It did not
      quietly re-grade against whatever it could still find. A grader that
      "helpfully" resolved archived packets would have kept printing 100% while
      answering from a different corpus than the one under test.

      THREE OPTIONS, and the packet should pick deliberately:
        1. Teach the grader to accept a citation from plan/archive/*.yaml when
           the packet is archived — closest to the truth, since the answer IS
           correct; risks blessing an expert that cites stale rows.
        2. Move the pins with the archiver, as a step in the sweep itself —
           keeps the assertions exact, and makes the sweep own its blast radius.
        3. Re-pin rung-1 to packets chosen for being long-lived — cheapest, but
           it selects the query set for convenience rather than coverage, which
           is how a groundtruth set stops measuring anything.

      Whichever is chosen, add the harness to the archiver's acceptance
      assertions so a future sweep fails loud instead of moving a number
      nobody attributes to it. This one was caught only because cycle-metrics
      prints expert_accuracy every cycle and the previous cycle's 100% was
      still in the handoff to compare against.
