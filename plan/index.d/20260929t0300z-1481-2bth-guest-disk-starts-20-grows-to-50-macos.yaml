    title: |
      OPERATOR RULING 2026-09-29: the macOS guest disk starts at 20 GiB and grows in 10 GiB steps up to a 50 GiB cap (it was a 250 GiB sparse disk), keeping the current qcow2 path
    context: |
      OPERATOR (2026-09-29): "Why is the VM trying to take 250gb? That's way too
      much. Can we limit that to MAX 50GB, but start much lower ... and let it
      grow from there." Then, on the exploration results: "Yes, ... adopt the
      file size limits".
      The 250 GiB disk (GUEST_DISK_SIZE_GIB in vz.rs) was SPARSE: it cost only
      written bytes (731 MB after expansion, 11.33 GiB measured after forge
      builds per scripts/uninstall.sh). But it showed as 250 GB, and it let the
      guest fill the host volume.
      PROVEN on branch exploration/raw-xz-rootfs (tlatoanis-macbook-air,
      2026-09-29): next_guest_disk_size plus grow_guest_disk_if_needed (at VM
      start, the VM stopped) grows the file one 10 GiB step when its allocated
      bytes pass 75% of its size, capped at 50 GiB, never shrinking. Real
      boots: a 20 GiB disk, and the guest's vda2 and btrfs filled all 20 GiB on
      first boot (cloud-init growpart); the file extended to 30 GiB, and the
      guest showed 30 GiB on the next boot, with 972 MB allocated on the host.
      KEEP THE QCOW2 PATH (measured the same day: 731 MB allocated, 1.3 s,
      against raw.xz's 803 MB and ~21 s). Port only the size policy from the
      branch, not rawxz.rs. The forge floor of >= 32 GiB (the pin in
      convert_grows_raw_disk_before_first_boot) is met by growth, pinned at
      compile time.
    exit_criteria:
      - 'a fresh provision creates a 20 GiB rootfs.img, and the guest root filesystem spans it (pre-fix result: FAILS — 250 GiB apparent)'
      - 'next_guest_disk_size is unit-tested: no growth below 75% allocated, one 10 GiB step at 75%, clamped at 50 GiB, never shrinks an existing larger disk (the old 250 GiB disks are left alone)'
      - 'MEASURED on a Mac: the file grown one step with the VM stopped, and the guest root filesystem shows the new size on the next boot'
    unscoreable: |
      the pin is the unit test on next_guest_disk_size plus one measured boot;
      the branch already carries both, to be ported.
