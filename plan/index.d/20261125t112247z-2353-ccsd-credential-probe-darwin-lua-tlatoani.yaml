  context: >-
    The probe asked only the Secret Service over D-Bus, so every Mac answered could-not-run:no-busctl and a macOS
    smoke could never say which credential state it ran in (v56.11.24.1 macOS smoke, finding 4). On darwin it now runs
    `security find-generic-password -s tillandsias -a vault-shamir-share-v1` WITHOUT -g/-w, which prints attributes
    (names, cdat, mdat) and never the password; exit 44 is no item. The fallback-share check (1149-vgn2) applies on
    both. The verdict moves to the house grammar: ok:credential-state:cold|warm (exit 0),
    could-not-run:credential-state:<why> (exit 3; the .sh used 2, and every caller ends `|| true`).
  change: >-
    scripts/lua/probe-credential-cold-state.lua replaces the .sh; its fixture is ported to
    scripts/lua/test-credential-cold-state-probe.lua (10 arms) and runs as gate step 352. It left step 350's
    private-bus harness (it cannot source private-session-bus.sh) and keeps 1903-djsq its own way: every probe run gets
    a DBUS_SESSION_BUS_ADDRESS that does not exist, and both platform paths run with uname, busctl and security
    stubbed. Callers: run_smoke.sh, e2e-step2-linux.sh, both smoke skills, the vault spec, step 350's reads/inputs.
  exit_criteria:
