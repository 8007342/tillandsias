      - 'the fixture owning the property (1127-waxf, whose plan-digest subcommand is exposed so that compute must NOT see a plan fragment) is extended to exercise it ACROSS A MERGE rather than a single fragment write, since the single-file property evidently holds while the merge case does not'
      - 'when verify does answer stale, it NAMES at least one path whose content moved — PRE-FIX RESULT: the verdict names none, which is why this needed a script read rather than a log read to investigate; a stale verdict that cannot say what moved is indistinguishable from this defect by its consumer'
