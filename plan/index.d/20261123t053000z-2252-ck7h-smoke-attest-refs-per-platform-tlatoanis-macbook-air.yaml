  title: 'Smoke attestation refs: refs/attest/smoke/<platform>/<rc-commit-sha>, written by attest-smoke.lua from the evidence dir, and check-smoke-attested.lua passes promotion only on a PASS per platform'
  context: >-
    Coordinator rulings, 2026-11-22. (1) The ref is keyed by the RC's COMMIT sha, not the tag (immutable beats readable). The message carries the tag and the release-asset sha256, and the checker takes --version and resolves it.
    (2) A run is attested either way. An unmeasured credential step is verdict=partial:credential-unmeasured, and the checker does NOT count a partial as a pass. A partial blocks main until the operator signs in and a re-run on the same sha upgrades it. The step is never faked.
    Built here:
    - attest-smoke.lua writes a commit whose TREE is the evidence dir, built through a throwaway index in the git dir so the checkout's index is untouched. Its message carries `Smoke: <host> <platform> <sha> <tag> <asset-sha256> <verdict>`, and a re-run is a child of the previous one.
    - It refuses `pass` unless credential-step.txt starts with `measured`. It refuses any evidence file not newer than 00-run-start.txt (1189-7yvu).
    - check-smoke-attested.lua counts a ref only if its Smoke: line names the same platform and sha.
    Not built: the smoke skill's wiring (writing credential-step.txt and calling attest after section 5), and the promotion step calling the checker.
  exit_criteria:
