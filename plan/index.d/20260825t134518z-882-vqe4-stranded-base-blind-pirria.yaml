    capability_tags:
      - guards
      - plan
      - ledger
      - coordinator
    deliverable: scripts/check-stranded-in-progress.sh
    depends_on: []
    estimated_hours: 2
    context: |
      MEASURED ON pirria 2026-08-25T13:47Z against the live ledger at
      7247c2a94. The detector reported:

        stranded  831-ezea  any  three-horizon-cycle-model-arrival-control-by-routing
        stranded  865-n8vq  any  the-trunk-has-been-unreleasable-for-a-week-behind-a-gate-no-push-runs
        summary: population=2 in_progress=2 stranded=2 threshold_events=0

      Both are actively worked. 865-n8vq is a p0 the COORDINATOR was pushing
      progress events into four times today, the most recent 1h46m before the
      detector called it stranded (11:57:32Z vs 13:43Z).

      THE COUNT, side by side:

        packet     events the detector sees   events that exist
        865-n8vq            0                       35
        831-ezea            0                        1

      THE CAUSE IS ONE LINE. check-stranded-in-progress.sh:112 counts activity
      with `grep -rh -A3 "packet_id: ${pid}$" plan/index.d/*.yaml`. Events live
      in `plan/index.d/` only until compaction folds them into the base; after
      that they are in plan/index.yaml and this grep cannot see them. So the
      detector's window is "since the last compaction", and compaction is
      routine garbage collection that the meta-orchestration skill tells every
      cycle to check for and run. The longer a packet is worked, the more likely
      its evidence has been folded, and the more confidently the detector calls
      it abandoned.

      WHY THIS IS WORSE THAN A NOISY GUARD. 641-e2qa created this check because
      an `in_progress` packet is invisible in BOTH directions — `ready` queries
      skip it and burndown does not count it — and 21 packets sat that way. The
      check is the thing that makes such work visible again. Reporting a
      well-tended p0 as abandoned inverts it: the signal that exists to find
      neglected work now points at the work being attended to hardest, and
      genuine strandings are diluted in the same list. The skill's instruction
      to watch whether "the count is rising cycle over cycle" is unusable while
      the count tracks compaction rather than neglect.

      IT ALREADY COST A FALSE ALARM. This host's 2026-08-25T07:43Z loop-status
      entry escalated 865-n8vq — "not a thing to leave sitting in a state where
      `ready` queries skip it and burndown does not count it" — about a packet
      the coordinator had touched that morning. The detector was the only
      evidence, and it was wrong.

      THE FIX IS THE 704-zcgi LESSON AGAIN: this is a hand-rolled re-derivation
      of a fold that tillandsias-plan already performs correctly for every other
      reader. Counting by grep over one of the two storage locations is the
      defect; the durable answer is to ask the folder, not to add a second grep
      over the base. If no subcommand exposes a packet's folded events today
      (none does — `fragment-event-packets` and friends all take a fragment
      path), that missing tool IS the finding, per the skill's own "if the loop
      needs it repeatedly, that is a missing tool — file a packet".
    exit_criteria: |
      (1) The detector counts a packet's activity across BOTH the compacted base
      and the fragment overlay, so folding a fragment can never change a
      packet's stranded verdict. Prefer exposing the folded events through
      tillandsias-plan (e.g. `plan-events <packet_id>`) and consuming that, over
      adding a second grep against plan/index.yaml — the second grep is the same
      defect with a wider window.
      (2) A hermetic fixture with a scratch ledger where one packet's only
      events are in the base and another's are in a fragment: neither may report
      stranded, and a third packet with a claim and no events anywhere MUST
      still report stranded. The true positive is the whole point of the check
      and must be pinned, not just the false one.
      (3) A compaction-invariance arm: run the detector, compact, run it again,
      and assert the verdict set is identical. That is the property that was
      violated and it is directly testable.
      (4) Verified against the live ledger: 865-n8vq and 831-ezea must stop
      reporting stranded while they carry recent progress events, and
      `summary: stranded=` must reflect neglect rather than compaction age.
