  - packet_id: plan-only-lane-excludes-the-captures-the-loop-must-write
    order: 889-twhe
    status: ready
    kind: enhancement
    pickup_role: linux
    priority: p2
    desired_release: v0.6
    depends_on:
      - lane-branch-methodology-for-a-fleet-that-outruns-its-slowest-host
    multi_cycle: false
    capability_tags:
      - hooks
      - gate
      - multi-host
      - coordinator
    deliverable: scripts/hooks/pre-push-local-gate.sh + scripts/check-issue-citation-convention.sh
    estimated_hours: 2
    title: |
      The pre-push plan-only lane accepts the ledger fragments the loop writes and refuses the plan/issues captures the loop is REQUIRED to write, so every finding-bearing cycle pays the full gate and re-enters the push lottery.
    context: |
      Shaped from the calmecacpilli criterion-6/7 datapoint on 863-iicc (same
      fragment as this packet). Measured there: a 1.8-2.0 min gate — among the
      fleet's fastest — paid 4.0 gate re-runs for one landed commit against a
      3.05 min mean inter-push gap, worse than esmeraldinha's 10.5 min gate at
      2.0. The discriminator was lane eligibility, not gate length.

      THE ASYMMETRY. The lane's allowlist is plan/index.d/, plan/loop_status.d/
      and plan/mo-full-attestations.d/ — all append-only, host+timestamp-named,
      textually unconflictable. plan/issues/*.md has every one of those
      properties and is not on the list. Meanwhile the Reduction Engine makes
      writing plan/issues a NON-NEGOTIABLE exit condition, so the excluded path
      is the one the loop must take.

      WHY THIS IS NOT "JUST ADD IT TO THE ALLOWLIST". plan/issues is not
      gate-free: exactly one check reads newly-added issue files —
      check_issue_citation_convention (order 881-29me), the diff-scoped
      convention ratchet asserting new citations name symbols rather than
      source lines. That is precisely the shape the lane ALREADY handles for
      fragments, which it validates with yq/tillandsias-plan before accepting.
      So the extension is symmetric with what exists, not a new kind of trust.

      SCOPE DISCIPLINE THIS PACKET MUST KEEP. Widening what bypasses the
      trunk's only remaining gate is the decision here, and it must stay
      NARROWER than "any plan/issues change": NEW files only (status A in the
      outgoing diff), never modifications — same immutability rule the lane
      applies to fragments, and for the same reason. A modified issue file can
      carry anything; a new one is a capture. If the ruling on 863-iicc denies
      the widening, that is a valid outcome and this packet closes as
      won't-fix with the reason recorded.
    exit_criteria: |
      (1) A decision, recorded on 863-iicc or in methodology/multi-host-development.yaml, on whether NEW plan/issues/*.md files may ride the plan-only lane. A denial closes this packet; record the reason. (2) If granted: the lane accepts an outgoing diff whose every path is a NEW file under the existing three directories OR under plan/issues/, and runs scripts/check-issue-citation-convention.sh against the plan/issues paths before accepting — mirroring the fragment validation already in the lane. A MODIFIED plan/issues file must still fall through to the full gate. (3) A hermetic fixture in the style of scripts/test-pre-push-empty-ref-list.sh proving all four cases: new-issue-only accepted; new-issue plus a code path refused; MODIFIED issue refused; new issue whose citation names a source line refused by the convention check rather than silently accepted. (4) Re-measure re-runs-per-landed-cycle on this host after the change and record it on 863-iicc, so criterion 7 gets a before/after rather than an argument. The before number is 4.0.
