      summary: |
        CRITERION 6 + CRITERION 7 DATAPOINT FROM calmecacpilli, AND IT BREAKS THE
        PACKET'S CENTRAL FRAMING: gate length is NOT the discriminator at current
        contention. This host has one of the FASTEST measured gates in the fleet and
        still paid DOUBLE esmeraldinha's re-run cost in the cycle immediately before
        this one.

        MEASURED, this host, 2026-08-25T20:27Z-22:30Z, landing ONE commit (9296365c0,
        a mode fix plus two plan/issues findings) on linux-next:

          gate wall time, four consecutive green runs .... 107s, 110s, 121s, 122s
          gate runs paid for that one landed commit ...... 4  (a 5th ran red first,
                                                              legitimately: 731-d89b)
          total gate time burned ......................... 460s = 7.7 min
          re-runs per landed cycle ....................... 4.0

        Against the packet's own corroboration table that is the worst figure
        recorded: esmeraldinha 2.0, macuahuitl 0.11 merge ratio, pirria 0.00. And
        pirria's note already established T here is ~1.0-1.5 min, not esmeraldinha's
        10.5 — this host measured 1.8-2.0 min. So a host at the FAST end of the T
        distribution produced the WORST re-run count. T is not the variable.

        CONTENTION IN THIS WINDOW, which is hotter than the regime the packet models:

          59 commits to origin/linux-next in the 3h window ... 19.7/h, mean gap 3.05 min
          (the packet's "live regime" figure was 11.9/h, mean gap 5.0 min)
          4 distinct author identities in the window

        With mean gap 3.05 min and T = 2.0 min, P(beaten) is high for ANY host, and
        the packet's inspection-paradox point applies with full force: this host
        gated immediately after fetching, four times, and lost four times.

        WHAT THE VARIABLE ACTUALLY IS: whether the commit qualifies for the pre-push
        plan-only lane. That lane (scripts/hooks/pre-push-local-gate.sh, the
        `plan_only_lane` scoping block) accepts a push whose outgoing diff adds only
        NEW files under plan/index.d/, plan/loop_status.d/ and
        plan/mo-full-attestations.d/, validates them, and skips the build stamp
        entirely. Qualify and you pay ~0s and win the race; miss and you pay the full
        gate and re-enter the lottery on every rebase, because a rebase onto a sibling
        push invalidates the stamp and forces the gate again. That is the actual
        feedback loop, and it is why the cost is not merely additive: each loss COSTS
        a gate AND buys another ticket.

        THE PART THAT MAKES THIS STRUCTURAL RATHER THAN BAD LUCK. This host's commit
        missed the lane because it carried two `plan/issues/*.md` files. The
        meta-orchestration Reduction Engine MANDATES that capture: "An unfiled finding
        is a lost finding and a contract violation", and Finalization step 1 refuses
        exit until every observation of the cycle is filed under plan/issues/. So the
        loop's own non-negotiable capture step forces every finding-bearing cycle onto
        the full gate, by construction, on every host, every cycle. The lane covers
        the ledger overlays that the loop writes and excludes the prose captures that
        the loop is REQUIRED to write.

        The verbatim refusal this host received, which is correct behaviour and is
        exactly the gap:

          plan-only lane: not applicable — 'plan/issues/cycle-preflight-cargo-absent-
          false-positive-2026-08-25.md' is outside plan/index.d/, plan/loop_status.d/,
          and plan/mo-full-attestations.d/ (full gate required)

        NOT A SEPARATE FINDING, deliberately: criterion 7 already owns "the cheapest
        intervention is a shorter gate, evaluate it before widening branch policy",
        and this is the concrete instance of it. Shaped into 889-twhe rather than
        implemented here, because widening what may bypass the trunk's only gate is a
        ruling, not a unilateral hook edit — the same reason this packet exists.

        ONE CORRECTION TO pirria's CRITERION 7 NOTE, which asked whoever picks this up
        to fix "why the plan-only lane intermittently cannot see its own stdin". That
        is already fixed and is no longer a lever: order 877-mynm landed the decode
        (scripts/hooks/pre-push-local-gate.sh, the empty-REFS early-exit above
        `refuse()`). An empty ref list means git decided to send nothing, so the hook
        now exits 0 with "nothing to gate; if you expected a push, fetch and rebase"
        instead of charging a full gate for a push that cannot happen. pirria's
        observation was right and its remedy has shipped; the remaining lane gap is
        the SCOPE one above, not an stdin one.
