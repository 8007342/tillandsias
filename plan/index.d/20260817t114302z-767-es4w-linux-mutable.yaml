packets:
  - packet_id: squid-exit-time-store-controller-segv-report-upstream
    order: 798-gq9e
    status: ready
    desired_release: v0.5
    priority: p2
    kind: chore
    title: "squid segfaults in exit() running Store::Controller's global destructor on EVERY ordered shutdown — 5-second repro, present in 6.9 AND 6.12, no public report found: file it upstream with the preserved dumps"
    deliverable: "a bugs.squid-cache.org report carrying the minimal repro, the symbolicated backtrace and the eliminated variables, plus the report URL recorded here; or, if an existing report is found first, that URL and the version it is fixed in"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [squid, proxy, upstream, forensics]
    estimated_hours: 2
    context: |
      OBSERVED, macuahuitl 2026-08-17 (767-es4w). Reproduces in about five
      seconds and needs nothing from this project:

        run the Alpine squid image, send ZERO requests, `podman stop`.

      squid completes an orderly shutdown — writes the clean swap log, closes
      its logs, removes the PID file, logs "Squid Cache (Version 6.12): Exiting
      normally." — and THEN dies of a fatal signal. Backtrace (build-id
      0348aa59… for the 6.9 side, three dumps four weeks apart, all identical):

        HttpHeader::clean  <- HttpReply::clean <- ~HttpReply <- ~MemObject
        <- StoreEntry::destroyMemObject <- destroyStoreEntry <- hashFreeItems
        <- Store::Controller::~Controller <- (libc exit)

      then squid's own death() handler reaches an xassert inside
      storeDirWriteCleanLogs() and aborts. No `main` frame appears anywhere in
      the trace: this is a global destructor running from exit(), not a fault
      in the running proxy. storeDirWriteCleanLogs is the DEATH HANDLER, not
      the fault — old 3.x-era tracker hits on that symbol are a different bug.

      VARIABLES ALREADY ELIMINATED, each with the directive verified removed:
        * traffic — zero requests, and also zero with --no-healthcheck so not
          even an aborted TCP probe seeds a StoreEntry;
        * squid version — 6.9-r0 (Alpine 3.20) and 6.12-r0 (Alpine 3.22);
        * the disk cache — cache_dir removed;
        * the store entirely — cache deny all + cache_mem 0;
        * cache_peer / never_direct;
        * ssl-bump, sslcrtd_program, tls_outgoing_options.

      NOT YET ELIMINATED, and this is the load-bearing inference to test FIRST
      because it decides whether the report goes to squid or to Alpine: both
      builds are musl/Alpine. A glibc build of a 6.x squid, same minimal
      config, same `podman stop`, is the one experiment that separates "squid
      static-destruction-order defect" from "musl-specific". It was attempted
      here and failed for environmental reasons only — containers.conf injects
      http_proxy=http://proxy:3128 into every podman build, and
      `podman build --network tillandsias-enclave` refuses with "cannot use
      networks as rootless" — so a host that can build a Fedora/Debian squid
      image should run it before filing.

      MATERIAL TO ATTACH: two symbolicated dumps preserved at
      ~/claudia/tillandsias-forensics/604-vmcg/ on macuahuitl, plus the third
      (PID 3907813, 2026-08-17) symbolicated under 767-es4w.

      WHY IT IS WORTH FILING EVEN THOUGH IT IS HARMLESS: it is harmless to the
      DATA (everything is flushed before the crash) and expensive to the
      OPERATOR — it made every ordered shutdown indistinguishable from a
      crash on this host and cost a two-day unnoticed outage, 263 coredumps,
      and three packets. Downgrading the exit status from 139 to 0 is what
      767-es4w's supervisor does locally; upstream should not need a wrapper.
