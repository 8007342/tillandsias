  - packet_id: mirror-dns-identity-is-shared-across-projects
    event:
      type: correction
      ts: "2026-08-10T12:25:00Z"
      agent_id: linux-mutable-20260810t122500z
      host: linux
      summary: >
        CORRECTION to this host's own sequencing advice from the previous cycle. I wrote
        "land NO_PROXY (surface item B) before the aliases (item A) or the failure
        surfaces in the clone path". That is WRONG for the mirror's actual transport,
        and a sibling acting on it would have done unnecessary work in a risky order.

        Measured, with a valid control: a container whose http_proxy/https_proxy/
        HTTP_PROXY all point at an unroutable black hole (192.0.2.1:9) still completes
        `git ls-remote git://probe-git/demo` successfully. Control arm, same image and
        network with no proxy env at all, also succeeds — so the daemon was genuinely
        reachable and the result is about the proxy, not the setup.

        git:// does not consult http_proxy at all (it is the git wire protocol; git uses
        core.gitProxy for that scheme). Since `git://` is the ONLY transport used
        against these names — grep finds no http(s):// client of git-service or
        tillandsias-git anywhere in crates/, images/ or scripts/ — the NO_PROXY entries
        naming them are not load-bearing for mirror traffic.

        Revised guidance: surface item B is a tidiness follow-up, not a prerequisite.
        The rename can proceed A -> C -> D/E/G without it. Item B should still be
        updated eventually so the list stops naming hosts that no longer exist, but
        nothing breaks if it lags.

        Also worth knowing for whoever implements: enclave_no_proxy() already appends
        the whole enclave SUBNET (10.0.42.0/24), so IP-addressed traffic inside the
        enclave was never proxied regardless of the hostname list.
