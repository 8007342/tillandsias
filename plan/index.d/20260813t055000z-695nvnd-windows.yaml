      summary: >
        Fixed, and the first attempt at the fix was wrong in an instructive way
        worth recording. `ls-files --cached` reads the INDEX, so a file deleted
        from the worktree is still listed and hit the `unsupported worktree
        entry` refusal. The obvious repair — emit a `deleted` frame so the
        deletion is still measured — passed cases 1-5 and FAILED the end-to-end
        case: committing a deletion removes the path from the index, so the
        frame vanishes at commit time and the stamp goes stale at exactly the
        moment the pre-push hook reads it. The double gate would have survived
        the fix.
        The stamp's load-bearing invariant is stated in its own header —
        "staging is invisible, committing is invisible, editing is not" — and
        only DROPPING the entry from the hashed list preserves it. That is not
        a weakening: the deleted path's frame, name and content digest both,
        disappears from the hash, so a deletion still moves the stamp exactly as
        an edit does and cannot ride an older stamp to the trunk. It also stays
        distinct from the case the refusal exists for: an unreadable file
        EXISTS, so it still refuses. Absent is not unmeasured.
  - packet_id: gate-stamp-refuses-deleted-worktree-entries
    event:
      type: verified
      ts: "2026-08-13T05:49:00Z"
      host: windows
      summary: >
        New scripts/test-gate-stamp.sh, 7/7, wired into
        litmus:release-gates-run-locally (a fixture nothing runs is decorative).
        Criterion 1 — case 1: a deletion-only worktree stamps and verifies.
        Criterion 2, the load-bearing negative controls — case 2: a MODIFIED
        tracked file is still `stale:tree-changed-since-gate`; case 5: a tracked
        path replaced by a directory still refuses with
        `stale:cannot-write-stamp`, so "accept deletions" cannot degrade into
        "accept anything". Case 3 pins that deletions are measured rather than
        skipped (the stamp moves on delete and returns on restore).
        Criterion 3 — case 6 runs the compacting cycle end to end: delete the
        folded fragments, gate and stamp ONCE, commit, and the push-time
        `verify` still answers `ok:gate-fresh`. That is the criterion's
        "demonstrated running the full gate exactly once", as a repeatable
        fixture rather than a one-off observation.
        Hand-falsification recorded: neutralising the new branch makes case 1
        fail with the original `unsupported worktree entry` refusal while the
        clean-tree case still passes.
        NOT done here, deliberately: a live `tillandsias-plan compact` on this
        branch. Compaction is eligible (149 fragments) but folding the ledger on
        a platform branch hands the linux coordinator a 1000-line
        plan/index.yaml merge, and ledger GC is theirs to run. The fix is what
        makes their next compaction cost one gate instead of two.
