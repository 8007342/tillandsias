steps:
  - packet_id: delegate-liveness-probe-matched-itself-so-no-death-could-be-detected
    order: 943-3xyf
    status: implemented
    kind: fix
    priority: p1
    desired_release: v0.5
    release_target: architecture-audit-epic
    pickup_role: any
    depends_on: []
    capability_tags:
      - orchestration
      - forge
      - delegation
      - shell
    title: >
      the delegate disposition channel's DEFAULT liveness probe matched the
      shell that ran it, so every delegate reported still-running forever and
      died-without-outcome — the one disposition the channel exists to detect —
      could never fire, while its litmus stayed green by supplying an explicit
      --alive-cmd in every arm
    deliverable: scripts/delegate-outcome.sh default probe + two litmus arms that exercise it
    context: |
      FOUND while exercising the channel for 689-zwzm's G4 gate, which is the
      first thing that ever ran the DEFAULT path on this host.

      THE DEFECT. `register` recorded the default probe as the literal string
      `pgrep -f <id>`, and `is_alive` ran it via `sh -c "$alive_cmd"`. That sh
      process's own command line contains the id, so pgrep matched the PROBE
      rather than the delegate. Measured with a random id no process anywhere
      carried: `pgrep -c -f <id>` from a clean shell returned 0, and
      `reconcile` returned `outcome:still-running`.

      Excluding the caller's ANCESTRY was tried first and was not enough. The
      surviving self-match is the command-substitution SUBSHELL inside
      default_alive: bash forks it from this script so it inherits the script's
      argv (which contains `--id <id>`), and it is a CHILD, so no ancestry
      filter sees it. The reliable discriminator is the tool's own name — a
      real delegate's command line is `tillandsias <project> --<harness>
      --prompt ...` and never contains `delegate-outcome`.

      WHY THE LITMUS DID NOT CATCH IT, which is the reusable half. Every arm of
      litmus:delegate-outcome-disposition-not-silent-shape passes an explicit
      `--alive-cmd false` or `--alive-cmd true`. The suite therefore pinned the
      DISPOSITION GRAMMAR perfectly and never once exercised the probe that
      produces it in production. A green suite over a check that always
      answers the same way — the same shape as the framing ratchet's
      emitter-vs-wiring gap (943-7dn5) filed one cycle earlier.

      BLAST RADIUS. 690-2kwd built this channel precisely so a silent
      mid-task delegate death is "never mistaken for a clean finish", and
      cycle_protocol's CYCLE END step relies on `sweep` auto-filing one. With
      the probe always alive, sweep would have filed nothing, ever. Stage 0 has
      not run on this host, so no death has actually been lost here; a host
      that HAS run stage 0 should re-read its registry rather than assume.
    exit_criteria:
      - >
          the default probe discriminates in BOTH directions on a live host: a
          registered id with no matching process reconciles as
          died-without-outcome, and a real process carrying the id reconciles
          as still-running
      - >
          both directions are pinned as litmus arms, and the pair is documented
          as a pair — the dead-case arm alone passes on a probe hard-wired to
          "dead", the live-case arm alone passes on one hard-wired to "alive"
      - >
          records written by hosts that have not yet taken this fix (carrying
          the old literal `pgrep -f <id>`) are recognised on READ and routed to
          the fixed probe, since a fleet upgrades at different times
    verifiable_closure: >
      litmus:delegate-outcome-disposition-not-silent-shape steps 6 and 7,
      mutation-tested: restoring the old `sh -c "pgrep -f <id>"` default makes
      step 6 fail with the exact original symptom
      (`outcome:still-running` for an id nothing carries).
    events:
      - type: filed
        ts: "2026-08-30T08:35:00Z"
        agent_id: linux-lenovinha-claude-20260830t081427z
        host: linux
        summary: >
          Filed and fixed in the same cycle from the 689-zwzm G4 slice. Order
          minted with `tillandsias-plan next-order`. Status `implemented`
          rather than `completed`: the fix and its negative controls are
          verified here, but the channel has still never carried a REAL
          delegate, which is 689-zwzm criterion 1.
      - type: progress
        ts: "2026-08-30T08:36:00Z"
        agent_id: linux-lenovinha-claude-20260830t081427z
        host: linux
        summary: >
          Fixed. `register` now records the sentinel `:default:`; `is_alive`
          routes that (and the legacy literal) to `default_alive`, which runs
          pgrep directly rather than through `sh -c` and drops any match whose
          `ps -o args=` contains `delegate-outcome`. Verified in three states
          on this host — nothing running -> died-without-outcome; a process
          exec'd with the id in argv -> still-running; after it exits ->
          died-without-outcome again, and `sweep --dry-run` emits
          `would-file:died-without-outcome`. Legacy-record path verified with a
          hand-written .rec carrying the old literal. Litmus 7/7 green, and
          mutation-tested: restoring the old default makes step 6 fail with the
          original symptom.
