        THE FORGE IS A THIRD HOST KIND AND THE PACKET'S TWO OPTIONS DO NOT COVER IT.
        The criterion asks whether a host has host-nix, or passwordless root in a
        toolbox, or neither. A forge has neither AND CANNOT ACQUIRE EITHER: there is no
        toolbox lane at all here, because a forge IS the container and nesting one is
        not the design. yoga's rung is unprovisioned; the forge's rung is structurally
        absent. Those are different rows and they imply different remedies.

        WHY THAT DECIDES THE DECISION RATHER THAN JUST ADDING A ROW. Of the candidate
        shapes, only ONE can ever serve a forge:

          - daemon rung   — needs a nix binary AND systemd. A forge has neither.
          - toolbox rung  — needs toolbox + podman + a writable /nix. A forge has none,
                            and no amount of provisioning gives it them.
          - chroot rung   — needs a nix binary on PATH. Absent, but ACQUIRABLE.
          - static nix + `--store <user-writable>` — needs no root, no systemd, no
                            container runtime. Acquirable.

        So the rootless static-nix shape is not merely the option that avoids root; it
        is the ONLY option that serves all three host kinds with one mechanism. If the
        fleet picks anything else, the forge lane stays permanently blocked and 814-5avq
        closes for two host kinds out of three.

        VIABILITY ON A FORGE, CHECKED RATHER THAN ASSUMED, because "rootless works" is
        the kind of claim that turns out to have a hole:

          - a user-writable store path is available and huge:
                $HOME/.local/share/tillandsias/nix-store  (CHROOT_STORE's default)
                overlay 1.9T, 1.2T free
          - egress for fetching the binary WORKS, but only through the proxy:
                curl -x http://proxy:3128 https://github.com   -> 200
                curl https://releases.nixos.org/ (direct)      -> 000
            The direct failure is not a network fault — it is the enclave being
            `--internal`, which I proved by measurement under 972-a8vh earlier tonight
            (no default route; egress refused in 0.0001s). Any provisioning step MUST go
            through the proxy, and a step written on a bare-metal host will silently
            work there and fail closed in every forge.

        WHAT I DID NOT DO. I did not install nix, pick the fleet's option, or touch the
        pinned verdict grammar. The packet is a decision packet and the choice is not
        one host's to make — least of all the host that benefits most from one
        particular answer. Criterion 2 stays open pending that decision. Criterion 3
        (correcting 606-um5s's precondition note) is also untouched: it needs the
        working invocation, which depends on which option is chosen.

        WHAT I DID LAND (bc6bd3471), because it is true regardless of the decision: the
        forge's verdict said `create-failed` for a creation never attempted — a
