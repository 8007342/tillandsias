packets:
  - packet_id: startup-context-addendum-append-has-no-size-cap
    order: 747-iavs
    release_target: forge-local-experts-milestone
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "The addendum append has no size cap — a 64MB addendum is appended in full, bloating the context file every in-forge agent reads first from ~16KB to ~64MB"
    deliverable: "size-cap the append (e.g. 32KB); an oversized addendum appends nothing but a loud 'ADDENDUM OVERSIZED (<bytes>), NOT APPENDED' placeholder plus a trace_lifecycle warning, and can never fail the launch"
    pickup_role: linux
    capability_tags: [forge, startup-context, fail-loud, adversarial-review]
    estimated_hours: 1
    context: |
      The append (lib-common.sh:3883-3888) has no size bound. Measured: a 64MB
      regular addendum grew the generated .forge-startup-context.md to 64MB
      (baseline 16KB); a symlink to /dev/zero grew it 259MB in 3s before the
      test timeout. The addendum's own comment warns "Keep it short. This is
      appended to a file every in-forge agent reads first, and a long addendum
      is one nobody finishes" — prose, not enforcement.

      A bloat is not only a tokens cost: every in-forge agent's very first file
      read becomes multi-megabyte, so a single large addendum (accidental
      working-tree edit, or a generated file checked in) degrades every launch
      on the host. Combine with 747-kw8u's `[[ -f ]]` gate so the cap covers the
      regular-file case that gate still lets through.
    exit_criteria:
      - "An addendum larger than the cap yields a bounded context file and a loud notice in it."
      - "A normal-sized addendum appends unchanged."
      - "The cap can never fail or hang a launch."
    notes: |
      Suggested shape: `[[ -f ]] && [[ $(stat -c %s) -le 32768 ]]` before
      appending; on the false branch write the placeholder and trace. stat is
      present in the forge base (util-linux/coreutils).
    events:
      - type: filed
        ts: "2026-08-15T01:35:00Z"
