      THE RETRACTION PRIMITIVE ALSO ALREADY EXISTS AND NEEDS NOTHING BUILT.
      `set-field <id> status obsoleted` is a LATERAL terminal in status_entry_wins
      (fragments.rs:309-315): plain LWW, no falsification event, no --evidence
      required (closure_rank returns None for obsoleted, main.rs:3765-3777). It
      writes the top-level `status:` block the fold reads, and Ledger::ready()
      filters status == "ready", so the row leaves SELECTION while every event and
      every base span stays byte-identical. That is the answer to "keep CRDT
      semantics but converge clean": you do not delete from the G-Set, you change
      what the READ returns. Nothing to build; it needs scheduling and budgeting.

