      WHY THE ORDER COUNTER AND NOT DAYS, which is a correction to the operator's
      own proposal and they asked to be argued with: they called days "probably the
      right lamport clock", but Lamport clocks count EVENTS. `next-order` is
      already monotone, collision-free, durable, host-skew-free and side-effect
      free to read, and it advances with WORK — the thing that actually causes the
      skew. A quiet week should not trigger a sweep; a 936-commit burst should. At
      the observed ~45 packets/day, 200 orders is about 4.4 days, which lands on
      the operator's intuition while self-scaling.

      THE CADENCE RESTS ON n=1 AND MUST NOT BE DEFENDED AS DERIVED. One 5-day
      window produced 8 findings, 5 surviving refutation. Ship 200/7d as a SEED,
      have the stamp record findings/confirmed/net_lines every sweep, and
      re-derive from the first four stamps. If sweeps 1-4 average <2 confirmed,
      double the interval.

      HOW IT AVOIDS BECOMING SLOP — these are not optional, each is computable
      from the stamp record:
        * KILL RULE: two consecutive sweeps with zero CONFIRMED findings that led
          to a merged deletion or an armed guard => red:two-sweeps-zero-confirmed,
          and THIS PACKET is set to obsoleted with reason "deslop:ritual:self".
          The step is subject to its own ritual detector, no exemption.
        * NET-NEGATIVE DIFF: a sweep's own commits, excluding litmus and
          scripts/check-*, must have deletions > additions. Arming a guard is the
          one addition allowed, and it is paid for out of deletions elsewhere.
        * FILING CAP: at most 5 packets per sweep, and it must retract at least as
          many rows as it files — so the sweep is a strict non-contributor to the
          2.4:1 growth it is treating.
        * REFUTATION BAND: over 4 trailing sweeps, 0% refutation =>
          red:refutation-rate-degenerate:0 (the refuter is not refuting, which
          makes it an unfalsifiable guard one level up); 100% => the finder is
          producing nothing real. This audit's own 3/8 = 37.5% sits mid-band.

      THE MECHANISM THAT MAKES IT FALSIFIABLE, and the whole design: a finding is
      NOT a claim about the code, it is a PAIR of (mutation command, predicted
      observable). CONFIRMED = mutation applied and the observable changed exactly
      as predicted. REFUTED = it did not, or a repo citation shows the shape is
      documented deliberate design. UNRUN = no re-runnable mutation could be
      constructed — and UNRUN FINDINGS ARE DROPPED, NEVER FILED. That single rule
      is what stops the step being a prose generator: if you cannot write the
      command that proves it, you did not find it.

