      Operator ruling 2026-11-13 (option A): extend images/imagegen-studio with a pinned audio node pack through the same admission path (node-classes.tsv, custom-nodes.toml, models.tsv, the licence registers); no separate web app; everything host-side generic. The CPU audio appliance (2055-grzz, 2055-d9sa, 2068-*) is extended by design, not duplicated: openspec/changes/audio-studio-node-graph design D1 assigns each of the client's eleven capability families to ComfyUI nodes or the appliance. Batch 1 is this packet; batches 2 and 3 are tasks in that change. Demucs is untouched (restricted, demucs-weights-unstated).
      custom-nodes.py gains a `vendored:<dir>` row form pinned by tree_digest, checked at image build. The pack needs no pip dependency.
    exit_criteria:
      - "audio-nodes-selftest.py, run inside the studio image (CPU, --network=none) with the pack mounted, prints ALL OK: a 1 kHz stereo sine at -6.02 dBFS reads -6.02 LUFS within 0.1 LU; the limiter never exceeds its ceiling; the loop-seam wrap step is under 0.01; a loop exported 0.5 s to 2.5 s at 48 kHz reads back smpl 24000..119999 and ComfyUI's own loader reads the WAV; a 180 bpm MIDI with a tempo event parses to the right seconds; an SFZ render is at the right pitch and silent after release. Pre-fix result: FAILS (no tillandsias_audio module)."
      - "custom-nodes.py install refuses an edited pack whose tree digest no longer matches custom-nodes.toml with violation:custom-nodes:vendored-tree-not-at-pinned-digest. Pre-fix result: FAILS (no vendored form)."
      - "Every TillandsiasSFZRender-supported program of the pinned big-rusty-drums, black-and-green-guitars and growlybass commits parses, and every sample path it names exists in that commit's tree."
      - "A rebuilt studio image on a GPU host runs the design D7 pilot graph through studio.run_workflow, with provenance."
