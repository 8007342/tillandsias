      summary: |
        ALL THREE CRITERIA MET, MEASURED ON THIS HOST.

        CRITERION 1 — recorded baseline with provenance:
        cheatsheets/runtime/macos-vz-guest-boot-baseline.md. Mac17,3 / Apple M5
        / 10 logical cores / 16 GiB, two COLD runs (VM stopped ~21h, well
        outside the 663-69kp near-teardown hazard window), each output line
        timestamped with perl Time::HiRes because BSD `date` has no %N:

            starting VM        0.021 / 0.008 s
            VZ start returned  0.329 / 0.315 s
            phase READY        8.454 / 8.444 s
            guest exec         8.534 / 8.515 s
            stopped            9.556 / 9.550 s
            TOTAL WALL         9.573 / 9.562 s

        ~10 ms variance on every phase. This INDEPENDENTLY CONFIRMS the "~9
        seconds end to end" figure recorded when the packet was filed, from a
        different session and a different measurement method.

        READ THE SHAPE, NOT THE TOTAL: VZ itself starts in ~0.3 s. Essentially
        all of the ~9.5 s is guest kernel + systemd reaching Ready, and
        host-side work is noise. So anything that LOOKS like slow boot is either
        inside the guest's own startup or is not boot at all — which is exactly
        what 689-stig found, where the apparent slowness was two unbounded waits
        during which no VM process existed.

        CRITERION 2 — the sizing decision, and the number that decides it.
        In-guest at idle: nproc=4, Mem 3889 MiB total / 3240 MiB available, and
        SWAP 3888 MiB total with ZERO USED. The guest has never touched swap, so
        it has never been under memory pressure. The operator question of
        2026-08-11 — is the 4 GiB ceiling behind the slowness, would 8 GiB help
        — is answered NO on both halves.
        DECISION: PINNED. Two reasons, and the second is the one that would not
        be obvious and is the stronger:
          1. No measured pressure to relieve.
          2. SCALING WOULD MAKE EVERY CROSS-HOST MEASUREMENT INCOMPARABLE. "The
             guest" must mean the same thing on every machine or the fleet
             cannot compare numbers taken on different ones. Not hypothetical:
             798-q4m9's criteria demand a bind-latency measurement on a guest
             constrained to ONE vCPU and explicitly refuse a multi-vCPU pass;
             807-bjjv exists because a shared benchmark is worthless when hosts
             do not run the same workload. A host-derived guest size would
             silently reintroduce that variance into every future measurement.

        CRITERION 3 — the constants now carry the measurement and the rationale
        inline at vz.rs, including the honest limit and a pointer to the sheet.

        HONEST LIMIT, stated in the code comment and the cheatsheet rather than
        buried here: every memory figure is IDLE. Nothing measures the guest
        under a full forge + container-stack load. This justifies KEEPING the
        default; it is not a claim that 4 GiB suffices for every workload.
        Revisit with a loaded measurement, not an opinion.

        ALSO RECORDED, because it cost this session time to rediscover: the
        cheatsheet is `tier: bundled` following the crdt-ledger-fragments
        precedent — it is a project-local measurement record, not an upstream
        tool sheet, so there is nothing to pull on demand and the
        pull-on-demand default (which the validator SAFE-DEFAULTS to) demands a
        `## Pull on Demand` section that would be meaningless here.
        check-cheatsheet-tiers.sh caught that correctly and is green now.
