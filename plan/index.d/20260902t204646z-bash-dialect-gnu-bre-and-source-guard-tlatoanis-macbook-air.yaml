packets:
  - packet_id: bash-dialect-catch-gnu-bre-and-unguarded-source
    order: 964-zgga
    title: "check-bash-dialect.sh: catch `\\+` in a BRE and an unguarded `.` source"
    status: ready
    priority: p2
    pickup_role: any
    kind: task
    owned_files:
      - scripts/check-bash-dialect.sh
      - scripts/test-bash-dialect.sh
    description: >
      The 761-g36m bash-dialect scanner passed over two GNU-only idioms that
      broke the osx-next union on 2026-09-02 (see
      plan/issues/macos-union-red-956-llei-family-2026-09-02.md):
      (a) `\+` used inside a BRE — GNU sed treats it as one-or-more, BSD sed
      matches a literal plus, so scripts/check-litmus-bindings.sh extracted
      NOTHING on macOS and the gate reported ok while enforcing nothing;
      (b) `. <path>` without a preceding `-f` test — bash 3.2, the system shell
      on every macOS host, aborts a non-interactive shell when the file is
      missing and `|| true` does not save it, so a best-effort source in
      scripts/run-litmus-test.sh killed the runner.
      Both are authoring-host-detectable and neither is in the scanner's
      vocabulary. This is the one instrument that could catch them before a
      platform branch falls hundreds of commits behind.
    next_action: >
      Add both idioms to scripts/check-bash-dialect.sh with a fixture arm each
      in scripts/test-bash-dialect.sh (a positive control for the portable
      form, so the rule cannot be satisfied by a scanner that flags everything).
      Sweep the existing corpus for further instances before turning the rule
      on; grandfather nothing silently.
    verifiable_closure: >
      scripts/test-bash-dialect.sh passes with arms asserting that a `\+`-in-BRE
      script and an unguarded-`.` script are both REFUSED, and that their
      portable equivalents are ACCEPTED.
