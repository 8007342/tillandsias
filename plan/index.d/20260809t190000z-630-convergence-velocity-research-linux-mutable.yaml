  - packet_id: velocity-measurement-harness
    order: 630-d2jv
    status: ready
    desired_release: v0.6
    release_target: convergence-velocity-milestone
    priority: p1
    title: "Measure convergence VELOCITY, so every claim in this milestone is falsifiable"
    kind: enhancement
    deliverable: scripts/cycle-metrics.sh
    depends_on: []
    pickup_role: any
    capability_tags: [metrics, convergence, velocity, observability]
    context: >
      Every other packet in this milestone claims a speedup. None of them can currently be
      proven, because nothing measures velocity — cycle-metrics.sh reports expert answer
      rates and packet counts, not cost-per-closure.

      Build the measurement FIRST, or the milestone becomes a collection of plausible
      stories. This is the same discipline the expert metrics already follow: never report
      a metric the tooling did not produce, and never let a quality signal degrade into a
      volume signal.
    exit_criteria:
      - >
        A metric for useful work per unit cost — packets closed (or residual reduced) per
        unit of agent context consumed.
      - >
        An orientation-vs-work split per cycle: how much was spent discovering what to do
        versus doing it. That ratio is the milestone's headline number.
      - >
        Baseline captured BEFORE any velocity change lands. A before/after with no before
        is not evidence.
      - >
        Resistant to gaming in the way convergence.yaml already demands: closing many
        trivial packets must not read as high velocity.
    notes: >
      Guard against the failure mode already named for expert metrics — a change that lets
      the number rise without the underlying quality rising converts a quality signal into
      a volume signal and must be refused on that ground.
