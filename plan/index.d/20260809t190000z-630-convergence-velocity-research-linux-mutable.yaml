packets:

  # ══════════════════════════════════════════════════════════════════════════
  - packet_id: convergence-velocity-milestone
    order: 630-67jk
    status: ready
    desired_release: v0.6
    priority: p0
    title: "Minimize total time-to-converge: triage, expert-driven dispatch, and agentic delegation"
    kind: milestone
    deliverable: methodology/convergence.yaml + methodology/distributed-work.yaml
    depends_on: []
    pickup_role: any
    capability_tags: [methodology, triage, experts, orchestration, velocity, research]
    context: >
      OPERATOR FRAMING. We have monotonic reduction of uncertainty under verifiable
      constraints. What we do NOT have is a bound on how LONG that takes. Each meaningful
      improvement to the loop's overhead should cut total convergence time by a large
      factor, the way decomposing a monolith into asynchronous services does — and for the
      same reason: the bottleneck is not compute, it is context and coordination.

      The alignment is deliberate: CRDT (ephemeral, idempotent, order-independent) plus
      Erlang ("'tis broken? keep goin'") plus numerical methods (entropy is not noise, it
      is what makes a method explore the space and converge). Triage is the gearbox.

      MEASURED BASELINE (2026-08-09, this checkout, 212 ready packets):

        field            populated    role in current selection
        order/status     212          identity
        capability_tags  202          UNUSED by the selector
        kind             202          UNUSED by the selector
        depends_on        97          blocking term
        release_target    71 (33%)    COHESION term  <- 2nd least populated
        priority          38 (18%)    URGENCY term   <- least populated

      The two fields the current minimax score leans on hardest are the two LEAST
      populated. Worse, the failure is silent: scripts/select-work-batch.sh reads
      `.priority // "p3"`, so a missing priority is indistinguishable from a real p3 and
      the urgency term has contributed EXACTLY ZERO to every selection ever made — on
      every platform, undetected until the macOS lane traced it (627-cx24). Meanwhile the
      two best-populated descriptive fields (capability_tags, kind) are ignored entirely.

      A heuristic scoring mostly-absent fields is not a heuristic; it is a coin flip with
      a rationale attached. That is the thing to fix, and it is why this is research
      before it is implementation.
    exit_criteria:
      - Children 630-6nw5, 630-rvp2, 630-vpmq, 630-pc2i, 630-6hyc, 630-d2jv reach a decided disposition.
      - >
        A measured before/after on a real metric — packets closed per unit of agent
        context consumed, or orientation-tokens as a fraction of cycle tokens. A velocity
        claim without a measurement is a story.
      - >
        No change lands that weakens monotonic convergence. Velocity is bounded BELOW by
        correctness: a faster loop that can regress the residual is not faster.
    notes: >
      kind: milestone — criteria holder. Never claim this for implementation; claim its
      children and record burndown here (ambitious_milestone_reduction).

  # ══════════════════════════════════════════════════════════════════════════
  - packet_id: triage-heuristics-fat-agent-research
    order: 630-6nw5
    status: ready
    desired_release: v0.6
    release_target: convergence-velocity-milestone
    priority: p0
    title: "FAT-AGENT RESEARCH: work-packet triage heuristics as a numerical method"
    kind: research
    deliverable: plan/issues/triage-heuristics-research-<DATE>.md
    depends_on: []
    pickup_role: any
    capability_tags: [research, heavy-agent, triage, numerical-methods, methodology]
    context: >
      The operator's assessment: the current triage is "rigid and shortsighted", and
      well-crafted triage could save orders of magnitude in implementation time and steps.
      Triage is the cornerstone and gearbox of implementation velocity.

      This is a FAT-AGENT research packet per ambitious_milestone_reduction: broad
      exploration first, an operator-signed decision record second, smallest demonstrable
      rungs third. Do NOT jump to implementation — scripts/select-work-batch.sh already
      demonstrates the cost of shipping a scoring function before the research
      (see the measured baseline in 630-67jk).
    research_questions:
      - >
        SIGNAL AVAILABILITY. Given the measured field population, which signals should a
        score actually use? capability_tags (202) and kind (202) are the best-populated
        descriptive fields and are currently ignored. Is capability-tag overlap a better
        cohesion signal than release_target (71)? Is `kind` a better urgency proxy than
        priority (38) — is a `security`/`bug` packet reliably more urgent than a `feature`?
      - >
        SILENT-DEFAULT HAZARD. `.priority // "p3"` made a missing field look like a real
        value and zeroed a whole term undetected. What is the general rule? Should a score
        REFUSE to rank on a field below a population threshold, and say so, rather than
        silently defaulting? Propose a falsifiable contract.
      - >
        PROXIMITY / WARM-CACHE COHESION (operator ask). A host repeating similar work
        reuses a warm Nix store, a warm cargo target dir, and warm container layers.
        Quantify it: measure real rebuild cost for same-crate vs cross-crate vs
        cross-language batches on this checkout. If the effect is large, proximity is a
        first-class scoring term, not a nicety. If it is small, say so and drop it — do
        not add a term on intuition.
      - >
        ENTROPY, PROPERLY. Entropy currently exists only in epic choice (squared-weighted
        top-3). Where else does it help convergence? Candidates: occasionally inserting ONE
        unrelated packet into a batch (operator ask — cross-pollination, and it surfaces
        stale/obsolete work that cohesion would never revisit); jittering batch size;
        randomizing verification order. Borrow from simulated annealing / stochastic
        gradient methods and say WHICH analogy holds and where it breaks. An analogy that
        does not survive contact with the ledger is not evidence.
      - >
        BATCH SIZE. Budget is a flat 3 (1 on forge) chosen by assertion, not measurement.
        What is the actual relationship between batch size and useful work per unit
        context? There is a real optimum: too small and orientation dominates; too large
        and the agent's context saturates and quality falls. Find it empirically.
      - >
        ANTI-CIRCLING. A packet can accumulate progress events forever without changing
        status. Design a detector and a disposition (escalate / split / audit-dispose), and
        prove it on real ledger history — several packets should already exhibit the
        signature.
      - >
        OBSOLESCENCE. The operator reports agents working "useless obsolete work". Can
        obsolescence be detected mechanically — deliverable path gone, spec retired,
        superseded-by edges, age with no events? What is the false-positive cost of
        auto-retiring, and what should stay human-gated?
    exit_criteria:
      - A written research report at the deliverable path, with measurements, not opinions.
      - >
        A proposed scoring function with each term justified by MEASURED signal
        availability on this ledger, and an explicit statement of which terms were
        considered and REJECTED, with the reason.
      - >
        A falsifiable evaluation harness: replay historical ledger states, score them, and
        compare against what was actually worked. Without replay the proposal cannot be
        tested before it ships.
      - An operator-signed decision record before any implementation rung is opened.
    notes: >
      DELEGATE. This is explicitly a fat-agent packet: fan the research questions out to
      dedicated sub-agents and keep only the synthesis in the orchestrator's context. The
      point of the packet is partly to demonstrate that working style (see 630-vpmq).

  # ══════════════════════════════════════════════════════════════════════════
  - packet_id: expert-driven-dispatch
    order: 630-rvp2
    status: ready
    desired_release: v0.6
    release_target: convergence-velocity-milestone
    priority: p0
    title: "The EXPERT answers 'what's next?' with a ready-to-work batch, replacing per-cycle orchestration overhead"
    kind: feature
    deliverable: crates/tillandsias-plan/src/answer.rs
    depends_on: [triage-heuristics-fat-agent-research]
    pickup_role: linux
    capability_tags: [experts, plan, mcp, orchestration, velocity]
    context: >
      OPERATOR DESIGN. Most of a /meta-orchestration cycle is management overhead: detect
      host, classify, sync, scan the ledger, select work. That cost is paid per cycle, by
      every agent, on every host, and it is nearly identical every time.

      Move it behind the expert. An agent asks the local expert "what's next?" and receives
      a coherent, already-triaged set — "work on these N packets" — plus, occasionally, one
      unrelated packet (deliberate entropy). The agent then spends its context on the WORK
      rather than on rediscovering what the work is.

      The division of labour the operator described:
        * a Linux host running /multihost-orchestration does triage and grouping ONLY —
          it is the planner, and it writes the groupings into the ledger;
        * every other agent running plain /meta-orchestration just asks the expert and
          executes.
      Planning is centralized and amortized; execution is distributed and cheap.
    exit_criteria:
      - >
        `plan_answer "what's next?"` returns a cited, ready-to-work batch — packet ids,
        why each was chosen, the concrete next action, and the seed — in ONE call.
      - The expert's answer is sufficient to start work with no further ledger scanning.
      - >
        Deliberate entropy: the batch occasionally includes one packet outside the cohesive
        set, labelled as such so the agent knows it is intentional and not a ranking bug.
      - >
        Measured: orientation tokens per cycle before vs after. The whole justification is
        overhead reduction, so shipping it without that number proves nothing.
    notes: >
      Depends on the research because it hard-codes a dispatch contract; building it on the
      current scoring would bake in a term measured to be inert (630-67jk).

  # ══════════════════════════════════════════════════════════════════════════
  - packet_id: agentic-skill-decomposition
    order: 630-vpmq
    status: ready
    desired_release: v0.6
    release_target: convergence-velocity-milestone
    priority: p0
    title: "Rewrite skills as DELEGATING instructions so the orchestrator's context stays lean"
    kind: enhancement
    deliverable: skills/
    depends_on: []
    pickup_role: any
    capability_tags: [skills, methodology, agents, context, orchestration]
    context: >
      OPERATOR FRAMING — the agentic equivalent of decomposing a monolith into
      asynchronous services. Skills today read "do A, then do B", so the main agent
      performs every small task itself and its context accumulates the debris of all of
      them. Rewritten as "have an agent do A, have an agent do B", the orchestrator spends
      its context on ORCHESTRATION and each sub-agent spends a fresh, dedicated context on
      one task — then discards it.

      The primary win is NOT concurrency (we are not concurrency-constrained today). It is
      that bloated context stops propagating. A sub-agent can afford to read six files
      exhaustively precisely because its context dies with the task. The orchestrator then
      sustains far longer sessions and can afford more sophisticated triage.

      This mirrors the CRDT/Erlang posture already in the methodology: ephemeral,
      idempotent, order-independent units whose failure is survivable — "'tis broken? keep
      goin'".
    exit_criteria:
      - >
        An audit of every skill under skills/ classifying each step as DELEGABLE (bounded,
        verifiable, returns a small result) or ORCHESTRATOR-OWNED (needs cross-step
        context, judgement, or commit authority).
      - >
        Delegable steps rewritten in delegating form, with an explicit contract per
        sub-agent: inputs, the SMALL result shape it must return, and its verifiable
        closure. A sub-agent returning a large blob re-imports the bloat and defeats the
        change.
      - >
        Commit authority, push authority, and the exit contract stay with the orchestrator.
        Sub-agents produce evidence and diffs; they do not own the branch.
      - Measured: orchestrator context consumed per cycle, before vs after.
    notes: >
      COUNTER-CASE TO RESPECT. Delegation is not free: a sub-agent that must re-derive
      context the orchestrator already had can cost MORE total tokens. The audit must
      identify where delegation loses, not only where it wins, and say so. "Delegate
      everything" is as wrong as "delegate nothing".

  # ══════════════════════════════════════════════════════════════════════════
  - packet_id: proximity-warm-cache-cohesion
    order: 630-pc2i
    status: ready
    desired_release: v0.6
    release_target: convergence-velocity-milestone
    priority: p1
    title: "Measure whether build/cache proximity should be a triage scoring term"
    kind: research
    deliverable: plan/issues/proximity-warm-cache-measurement-<DATE>.md
    depends_on: []
    pickup_role: any
    capability_tags: [research, performance, nix, cargo, podman, triage]
    context: >
      OPERATOR ASK: a single host repeating work should benefit from a warm Nix cache
      where relevant, so cohesion and proximity likely matter to triage.

      Plausible, and currently unmeasured. Packets touching the same crate reuse a warm
      cargo target dir; packets touching the same image layer reuse podman cache; Nix
      rebuild cost is dominated by what the closure invalidates. If a cross-crate batch
      costs several extra minutes of rebuild per packet, proximity deserves a scoring term.
      If the caches are warm enough that it is seconds, it does not, and adding the term
      would be complexity bought with intuition.
    exit_criteria:
      - >
        Measured rebuild cost for same-crate, cross-crate, and cross-language batches on
        this checkout, with the cache states stated.
      - A recommendation WITH ITS OWN REFUTATION CONDITION — the number below which the term is not worth adding.
      - If recommended, a concrete proximity signal derivable from existing packet fields (deliverable path, capability_tags).
    notes: >
      Note the interaction: proximity pulls TOWARD repetition, entropy pushes AWAY from it.
      They are in direct tension and the research must state how they compose rather than
      adding both and hoping. That tension is the interesting part of this packet.

  # ══════════════════════════════════════════════════════════════════════════
  - packet_id: selector-urgency-term-is-inert
    order: 630-6hyc
    status: ready
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    priority: p1
    title: "The batch selector's urgency term has always been zero; decide what replaces it"
    kind: bug
    deliverable: scripts/select-work-batch.sh
    depends_on: []
    pickup_role: linux
    capability_tags: [triage, plan, selector, bug]
    context: >
      Found by the macOS lane (627-cx24) and confirmed on Linux 2026-08-09.

      `query_json_projection` omitted `priority`, so the selector's `.priority // "p3"`
      returned "p3" for every packet and urgency was a constant 0 in `2*urgency +
      1.5*blocking + neglect`. Every batch ever selected was ranked on blocking+neglect
      alone.

      The projection has been fixed (priority is now emitted, explicit null when absent),
      but that does NOT fix the term: only 38 of 212 ready packets carry a priority at all.
      The field is a recent convention; the legacy base ledger predates it. So urgency is
      now correct-but-mostly-null instead of silently-constant — better, and still not a
      usable signal.

      This packet is the DECISION, and it is deliberately not pre-judged here.
    exit_criteria:
      - >
        Decide the urgency signal: backfill priority across the ledger, derive urgency from
        `kind` (202 populated), drop the term, or something the research surfaces.
      - >
        Whatever is chosen, a missing signal must be VISIBLE rather than silently defaulted
        — the defect here was not a wrong value, it was an absent value wearing a plausible
        one. Prefer refusing to score over scoring on a default.
      - A litmus step that fails if a scoring term becomes inert again.
    notes: >
      The last criterion is the generalizable one. A scoring function that cannot tell
      "absent" from "low" will always fail in this direction, and will always fail quietly.

