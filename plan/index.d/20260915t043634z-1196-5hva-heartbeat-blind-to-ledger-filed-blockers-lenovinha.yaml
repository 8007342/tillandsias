      - 'the per-host line names the packet order, so the reader gets the blocker itself rather than being told to go hunting'
      - 'NEGATIVE CONTROL: a host with no blocker record anywhere and no attestation still reads wedged/dead as it does today — silence must not become "blocked"'
      - 'NEGATIVE CONTROL: the plan/issues markdown source keeps working; this ADDS a second source and removes nothing (864-w7rc''s records are still authoritative where they exist)'
