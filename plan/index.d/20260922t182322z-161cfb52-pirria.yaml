        DEFAULT SETTLED, SCOPE NARROWED, POLICY QUESTION MOVED OFF THIS ROW.

        The default is DECIDED, not open: a forge launched for a cloud project starts on
        the REMOTE'S DEFAULT BRANCH. Relayed to pirria by macuahuitl as the operator's
        direct ratification of macuahuitl's ruling. PROVENANCE STATED because pirria did
        not hear it from the operator in its own session and a decision recorded on a
        ledger should say how it arrived; if the relay is mistaken the correction lands
        on this event rather than on a row that already reads as settled.

        So this row no longer carries the policy question. Its scope is the DEFECT —
        a cloud launch clones the host mirror and inherits its HEAD — with:
          - the default settled as above, and
          - the ANNOUNCEMENT as the load-bearing criterion: the launch must state the
            branch it resolved and where it resolved it from. A closure that changes the
            default and leaves the launch silent has not closed this row, because a
            wrong answer stays indistinguishable from a right one until a human reads
            the prompt line.

        THE POLICY QUESTION IS 1363-xp2v, on trunk at 36b0979ea — a research row at the
        operator's request, explicitly long scope, to be fine-tuned across milestones
        rather than implemented in one pass. Its subject is the thing this finding
        exposed: a project must EARN its branching discipline progressively — a new
        project may push straight to its default branch; once there is code and rules,
        an integration branch and pull requests; once multiple hosts commit, work
        branches and pull requests into the integration branch. The hard part is not
        enforcing a rule but KNOWING WHICH RULE APPLIES, so its real subject is the
        DETERMINATION: the level derived from observable facts rather than set by hand,
        metadata recording it, an affordance for an agent landing with no context in a
        fresh forge, and verifiable constraints evaluated by the Lua runtime.

        This row is cited there as the evidence it starts from, together with the fact
        that every branch rule this fleet has is HOST-shaped and none reaches a forge.

        997-e4v2 and 591-x7ws are kept explicitly apart from both, so nobody closes one
        against the other: those remove host disk ACCESS, and this is the local MIRROR
        leaking host state into a forge that believes it is remote.

