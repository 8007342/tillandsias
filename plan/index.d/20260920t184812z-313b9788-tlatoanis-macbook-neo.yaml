      summary: |
        GAP 4 RESOLVED, and the two halves are kept apart deliberately because they were answered by different means. Questions asked of macbookair, who owns the macOS guest boot path: is provision/ regenerated by provision_main or an input it reads, and is nvram.bin surviving the wipe deliberate VM firmware identity?

        provision/ — SOURCE READ, not a live test. It is OUTPUT: vz.rs (~2341) calls create_dir_all on it before every start and boots WITHOUT the share if that fails, so the host recreates it unconditionally. Its own doc says it "lives under the image root beside heartbeat.state and crashloop.state, so a destroy that resets the guest also resets the record — a marker surviving the guest it describes would be the stale-state defect". Its survival today is UNSWEPT, not deliberate. macbookair explicitly did NOT delete provision.state on a provisioned host to test this, because a false "provisioning never completed" is the exact failure the row exists to prevent — the restraint is worth recording, not just the answer.

        nvram.bin — MEASURED, and the measurement did NOT decide it. macbookair deleted the file and booted: the guest came up and the file was regenerated at 131072 bytes (vz.rs:1852 branches on path.exists() and creates the variable store when absent). That proves it is NOT boot-blocking. It does NOT prove nothing DERIVES from it, and macbookair said so rather than stretching the result.

        THE DECISION IS ASYMMETRIC AND THE ASYMMETRY IS THE REASON. Destroyed: provision/, heartbeat.state, crashloop.state, and console.log.prev — the last found by macbookair at 51 MB on their host, left behind because the wipe removes console.log and not its sibling, same class of byproduct. PRESERVED: nvram.bin, DESPITE the safety measurement. --reset-state preserves installation identity BY CONTRACT and an EFI variable store is not proven to be outside that; the costs are not symmetric — a surviving stale variable store is harmless, while destroying a live anchor is 803-49re, a vault that cannot be re-derived. A measurement that something CAN be destroyed safely is not a reason to destroy it when the thing it might anchor is unre-derivable.

        THE MEASUREMENT THAT WOULD SETTLE IT, named so it is a task and not a doubt: derive a vault against a destroyed-and-regenerated nvram and see if it reproduces. Until someone runs it, the file is spared and this row says why.
