                         (refuse, and charge a rebuild that would produce a
                          functionally identical binary)
          LANDED RULE    validator-surface-hash --check
                         -> ok:validator-surface:7eccd7d460d5e1cc   rc=0
          next-order     -> minted 1311-8f9t, rc=0
                         (the same binary that, under the retired rule, would
                          have handed out an identifier the lane then refused —
                          this row's sharpest instance, now impossible)

        So the disagreement the row is about is reproduced deliberately and the
        new rule is on the correct side of it. The lane's own verdict on this
