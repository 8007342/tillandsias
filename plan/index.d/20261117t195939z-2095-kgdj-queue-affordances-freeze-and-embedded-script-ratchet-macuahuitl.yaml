  - packet_id: an-embedded-script-ratchet-counts-heredoc-to-interpreter-sites-and-inline-awk-jq-python-bodies-and-its-counter-only-falls
    order: 2095-9igs
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.6
    pickup_role: any
    capability_tags: [scripts, lua, gate, migration]
    estimated_hours: 8
    size: M
    implementer_tier: sonnet
    title: "An embedded-script ratchet: a gate counts heredoc-to-interpreter sites in shell files and multi-line inline awk, jq and python bodies, refuses any increase, and its recorded floor only falls"
    context: "Operator direction 2026-11-17, relayed by the coordinator. The operator's language order is Lua, then Rust, then Go. Shell files still carry other programs inside them: by the coordinator's count on linux-next that day, 192 heredoc-to-interpreter sites in 97 shell files and 75 multi-line inline awk, jq or python -c bodies. The filing session did not reproduce those figures (one quick pattern of its own matched 2 sites), so the pattern is not yet pinned and pinning it is the first criterion. An embedded block has no exit code of its own, no name a log can cite and no test, which is what makes a failure inside one ambiguous to a watcher. Model the guard on scripts/check-jq-callsite-ratchet.sh (order 1375-tsfu): the pattern written out in the header with its known non-matches and limits, a declared population, a floor file of count and path lines under scripts/portability rewritten downward only by the guard's own ratchet mode, standing debt never red, any increase refused by name, an empty population refused. New gates are Lua (convergence.yaml carried_obligations), so the guard is Lua. A ported block becomes a file in the operator's language order with a real exit code that emits the shared log events of the runtime-logging and log-schema-versioning specs, so a watch can read its outcome from a declared log without a model."
    exit_criteria:
      - "The guard's header states the two patterns, their known non-matches and limits and the population, and on linux-next its count line reports the heredoc-to-interpreter sites with their file count and the multi-line inline bodies; the record says whether these equal the coordinator's 192 in 97 and 75 and, if not, which pattern difference explains it. Pre-fix result: FAILS, no guard exists and the figures are unreproduced."
      - "A fixture tree that adds one heredoc-to-interpreter site to a file at its floor is refused with a line naming the file; a tree that adds one multi-line inline awk body is refused likewise; a tree that removes a site passes and the ratchet mode lowers that file's floor line; no mode raises a floor line. Pre-fix result: FAILS, all four trees pass every gate today."
      - "A fixture tree with an empty population is refused by name and not reported ok. Pre-fix result: FAILS, no guard exists."
      - "One embedded block is ported in the same pull request to a file with its own exit code that emits one schema-valid log event on success and one on failure; a negative arm makes the ported file fail and shows a non-zero exit and the failure event, where the embedded original's failure was swallowed or indistinct. Pre-fix result: FAILS, the block has no exit code or event of its own."
      - "The guard runs in ./build.sh --check and in --preflight and the floor total after the port is lower than before it. Pre-fix result: FAILS, no floor exists."
    verifiable_closure: "The guard's own fixture script under scripts/, named by the claimer in the same commit, with the four tree arms and the population arm; and the count line on linux-next. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the guard and its fixture land together; the claimer writes the fixture's script name here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: read scripts/check-jq-callsite-ratchet.sh and its fixture, pin the two patterns against the coordinator's figures, write the Lua guard, the floor file and the fixture, port one block, and wire the guard into the check and preflight tiers."
    provenance: "Operator direction 2026-11-17 relayed by the coordinator on macuahuitl; the site counts are the coordinator's and are unverified by the filing session."
    related: [1375-tsfu, 2094-y2bb, 2094-dyvk]
    depends_on: []
