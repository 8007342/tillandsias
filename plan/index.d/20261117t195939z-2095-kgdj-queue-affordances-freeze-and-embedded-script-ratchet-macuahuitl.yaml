  - packet_id: every-restriction-of-the-queue-and-watch-tools-is-in-their-descriptions-schemas-and-responses-and-a-job-declares-whether-it-is-idempotent
    order: 2095-kgdj
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [tray, mcp, forge, docs, queue]
    estimated_hours: 8
