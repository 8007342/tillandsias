  - packet_id: with-memory-critically-short-and-no-queued-job-left-the-tray-freezes-and-never-kills-the-forge-using-the-most-memory-and-notifies-the-operator
    order: 2095-wq8z
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [tray, memory, cgroup, forge, podman]
    estimated_hours: 8
    size: M
    implementer_tier: sonnet
    title: "Last resort: with memory critically short and no queue-started job left to stop, the tray freezes (cgroup freezer, never a kill) the forge using the most memory, notifies the operator, and thaws it from the tray"
    context: "Operator ruling 3 of 2026-11-17 on 2094-65yz, relayed by the coordinator: when nothing queued is left to stop, freeze the forge using the most memory and notify the operator; freeze, not kill. This supersedes the notify-only last step that 2094-mzap's third exit criterion describes; mzap still delivers the pressure levels and the stop-and-requeue, and this packet adds the step after it. On 2026-11-15 a forge running tests outside any queue froze the desktop while systemd-oomd marked its scope and never killed it (2093-gfak, still open). Measured on macuahuitl 2026-11-17: the cgroup.freeze file of a rootless forge's libpod scope under tillandsias.slice is owned by the user, so no root is needed; nothing was written to it. A freeze stops the forge taking more memory and loses no process; it does not release memory. Proposed and not yet ruled: a frozen forge is thawed only by the operator from the tray, never automatically. While frozen, the forge's lane and the tray report frozen and its watches' timers are paused."
    exit_criteria:
      - "At a fixture critical level with no queue-started job running and two forge scopes, the scope holding the most memory is frozen and the other is not; every process of the frozen scope still exists; exactly one desktop notification names the forge and the thaw action. A control arm with one queue-started job running freezes no forge and stops that job instead. Pre-fix result: FAILS, nothing freezes a forge and the last step only notifies."
      - "On a Linux host with rootless podman, a real forge-like container under tillandsias.slice that allocates until the level is critical is frozen by the tray running as the user with no sudo: its cgroup.events reads frozen 1, its process ids are unchanged, and after a thaw from the tray the same process ids continue and cgroup.events reads frozen 0. Pre-fix result: FAILS, the container runs on until the host stalls."
      - "No second forge is frozen within 2 minutes of the first, and no forge is thawed without the tray action over 30 minutes of fixture time at calm. Pre-fix result: FAILS, no freeze state exists."
      - "While a forge is frozen its lane's queue.status and watch.status report frozen, and a watch whose stall interval elapses during the freeze records no stall episode and no judge request. Pre-fix result: FAILS, no frozen state is reported."
    verifiable_closure: "The fixture transcript for the first, third and fourth arms and the real-host transcript for the second, with the kernel and podman versions. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the freeze path and its tests land with the feature; the claimer writes the test names here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: after 2094-mzap's pressure levels exist, add the freeze step, the frozen state, the tray thaw action and the notification; ask the operator whether thaw stays manual before closing."
    provenance: "Operator ruling 3 of 2026-11-17 relayed by the coordinator on macuahuitl; openspec/changes/job-admission-and-host-watch design section 3.2."
