    implementer_tier: sonnet
    title: "Every restriction of the queue and watch tools is stated in their descriptions, schemas and responses; a job declares idempotent and a class; a non-idempotent job is run once and never rerun"
    context: "Operator requirement 2026-11-17, relayed by the coordinator: an agent must learn every restriction of the service from the tool affordances without reading the design. That covers: that the queue may stop and requeue a job or freeze a forge; the job classes and memory ceilings; the retry policy and what is never retried (a full disk); the watch.wait bound of 9 minutes; per-forge visibility. Each goes into the queue.submit and watch descriptions and schemas, and into every refusal and requeue response as a reason, retry_after_seconds where waiting can help, and the class limits. Callers are told to submit work that is idempotent and safe to restart from its start, in reasonably sized bundles (about 30 minutes, a proposed figure). queue.submit gains a required idempotent field with no default beside the class estimate: a job declared not idempotent is never requeued or restarted, is stopped only after every idempotent queue-started job, and when stopped ends as failed with the reason stopped-memory, reported once. The class figures in a description are the ones in force on the serving host. The same three sentences go into images/default/config-overlay/mcp/forge-agent-guidance.md and skills/forge-quick-intro so in-forge agents see them. Design section 11; spec delta job-admission-queue, the two requirements on idempotent jobs and on affordances."
    exit_criteria:
      - "An affordance test asserts that the descriptions and schemas of queue.submit, queue.status, watch.register, watch.status and watch.wait state each of: stop-and-requeue, the last-resort freeze, the three classes with this host's reserve, ceiling and running limit, the restart budget, a full disk as never retried, the 9 minute wait bound as a schema maximum, and own-lane visibility; deleting any one of them from the source makes the test fail naming that restriction. Pre-fix result: FAILS, the tools and the test do not exist."
      - "Every refusal produced by the queue and watch tools in the fixture transcript carries a reason from the closed set and a message; the refusals for a full lane queue and for pressure carry retry_after_seconds and class limits; the refusal for a command given as one string carries no retry_after_seconds. Pre-fix result: FAILS, no refusal shape exists."
      - "A submission without idempotent is refused with idempotent-required and creates no ticket. Pre-fix result: FAILS, the field is unknown."
      - "At a fixture critical level with one idempotent and one non-idempotent queue-started job running, the idempotent one is stopped and requeued; with only the non-idempotent one running, it is stopped, its ticket ends failed with stopped-memory, its command is not run again, and its lane receives exactly one message. A control arm with the run-once rule disabled through the fixture seam runs it a second time. Pre-fix result: FAILS, every stopped job is requeued."
      - "An agent given only the lane socket's tools/list and initialize instructions and asked to run a six-hour test suite submits several queue.submit jobs, each within the bundle size the description names and each with idempotent true and a class, submits no single job for the whole suite, and waits with watch.wait with no sleep loop; the transcript records the model, the harness and three of three runs agreeing. Pre-fix result: FAILS, the tool list names no queue and the agent runs the suite as one command."
      - "A search of images/default/config-overlay/mcp/forge-agent-guidance.md and skills/forge-quick-intro finds queue.submit, idempotent and watch.wait in each. Pre-fix result: FAILS, a search of both for queue.submit finds nothing."
    verifiable_closure: "The affordance test and the job_queue fixture transcript for the first four arms, the agent transcript for the fifth, and the two guidance files for the sixth. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the affordance test lands with the descriptions; the claimer writes its name here in the same commit (1136-n8sh). The fifth arm is an agent-behaviour measurement and is recorded, not gated."
    next_action: "Nothing is built. Left: with or directly after 2094-ay52's tools, write the descriptions and schemas from design section 11, the refusal shape, the idempotent field and run-once rule, the affordance test, the two guidance edits, and run the bundle-splitting arm three times."
    provenance: "Operator requirement 2026-11-17 relayed by the coordinator on macuahuitl; openspec/changes/job-admission-and-host-watch design section 11."
