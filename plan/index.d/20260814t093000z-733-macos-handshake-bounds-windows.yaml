packets:
  - packet_id: macos-tray-handshake-reads-are-unbounded
    order: 733-mppc
    status: ready
    desired_release: v0.5
    priority: p2
    release_target: fail-loud-diagnosis-milestone
    kind: fix
    title: "The tray's push-subscription and post-VZ-connect Noise handshakes have no deadline, so a silent peer parks them forever"
    deliverable: "crates/tillandsias-macos-tray/src/action_host.rs + diagnose.rs"
    pickup_role: macos
    capability_tags: [macos, control-wire, fail-loud, timeout]
    estimated_hours: 2
    context: |
      Split out of 690-eug2's criterion 3 so that packet can close on the work
      its own crate owns. Everything else it asked for is done and verified in
      tillandsias-vm-layer; these two sites are macOS-only and CANNOT BE
      EXERCISED from a Windows host, and this seam is precisely where an
      unexercised fix is worse than the gap.

      THE SHAPE, already fixed once next door. In vsock_exec every setup read
      was a bare, untimed `read_envelope`: a peer that ACCEPTS the connection
      and then never answers parks the host forever, because every bound that
      seam had grown — idle deadline, wall-clock ceiling, heartbeat — lives on
      the DATA path and a connection that never establishes never reaches any
      of them. Fixed there by `read_setup_envelope`, which applies the idle
      timeout and NAMES the stage in the failure, plus a structural test
      asserting no bare setup read remains.

      The two macOS sites are the same shape:
        * action_host.rs:2489 — the push-subscription handshake.
        * diagnose.rs:192 — the timeout covers the VZ connect but NOT the Noise
          handshake that follows it, so a guest that completes the socket and
          then stalls mid-handshake is unbounded. That one is worse than an
          ordinary hang: it is in the DIAGNOSTIC path, so the tool an operator
          reaches for when the host is sick is itself the thing that hangs.

      Do not copy the vsock_exec helper across crates blind — check whether the
      macOS paths want the same env-driven timeout or a shorter one. `diagnose`
      is interactive and should fail fast; a push subscription is long-lived and
      should not.
    outcome: |
      A peer that connects and then goes silent fails both macOS handshakes
      within a bounded time, naming the stage.
    exit_criteria:
      - "Both sites read under a deadline and the failure names the stage, in the vsock_exec pattern."
      - "The `diagnose` bound is chosen deliberately for an interactive tool and the reason is recorded — inheriting an exec-shaped timeout would leave the diagnostic hanging for minutes when the operator needs an answer now."
      - "A test drives a peer that connects and then goes silent at each site and asserts a bounded, stage-named failure — measured on macOS hardware, not inferred."
      - "NEGATIVE CONTROL: a responsive peer completes both handshakes untouched."
    events:
      - type: filed
        ts: "2026-08-14T09:30:00Z"
        host: windows
        summary: |
          Split from 690-eug2 by the host that finished the rest of it. Filed
          rather than attempted: these paths cannot be exercised from Windows,
