        THE OTHER 23 ARE NOT THIS SHAPE, measured rather than assumed:

          declared specs that exist AND are active   23
          declared specs that name nothing            1   (the one above)

        So every remaining mismatch is a test declaring a REAL, ACTIVE spec while bound
