events:
  - packet_id: windows-credential-manager-retains-stale-unseal-share-across-guest-wipe
    event:
      type: note
      ts: "2026-09-01T08:03:51Z"
      agent_id: "windows-yolanda-claude-20260830t162208z"
      host: windows
      summary: |
        A MEASUREMENT-DESIGN CAUTION FOR WHOEVER VERIFIES PART A, plus what this
        host's two guest wipes tonight do and do not establish.

        THE OBVIOUS CHECK IS NOT A TEST. After running --reset-guest twice from the
        v56.8.31.3 release binary, cmdkey /list shows BOTH vault-shamir-share-v1 and
        vault-root-token-v1 PRESENT. That looks like Part A failing. It is not
        evidence either way, because --reset-guest wipes AND REPROVISIONS: a
        credential present afterwards is either the stale one that was never cleared
        (the defect) or a fresh one the reprovision correctly created. Presence alone
        cannot distinguish them, and a verifier who greps cmdkey after a reset will
        conclude whichever they expected.

        WHAT WOULD ACTUALLY DISCRIMINATE: a wipe path that does NOT reprovision. The
        packet names two — the installer's -Purge and the e2e smoke. Run one of those,
        then check cmdkey. A credential surviving a wipe-without-reprovision is the
        defect; the same credential after --reset-guest is expected.

        POSITIVE EVIDENCE, indirect but real, from tonight's blessing round: after
        --reset-guest from the release binary, the fresh guest's vault container came
        up "Up (healthy)" with systemctl --failed empty, twice. This packet's own title
        says a stale share leaves "GitHub login permanently broken" because the tray
        re-pushes it into the fresh guest; a vault that unseals and reports healthy is
        not being handed a share that fails to authenticate. So Part A appears to work
        on the shipped binary — but I did not observe the CLEARING, only its absence of
        consequence, and those are different claims.

        SCOPE, so nobody reads this as progress on the deliverable: the reconcile half
        is explicitly delegated to 890-y72v (pickup_role linux) because
        DeliverCredentialsReply carries no accept/reject discriminator. Nothing in this
        note advances that. Part A landed in a8cd8cc32. What remains for a Windows
        worker is the discriminating verification described above, which I did not run
        because it needs a wipe-without-reprovision and the operator's machine had
        already been reset twice tonight for the release blessing.
