packets:

  - packet_id: ungrouped-p0-work-is-invisible-to-the-selector
    order: 645-n3h6
    status: ready
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    priority: p1
    title: "A p0 packet with no release_target can never be selected while any grouped epic exists"
    kind: bug
    deliverable: scripts/select-work-batch.sh
    depends_on: []
    pickup_role: linux
    capability_tags: [triage, selector, plan]
    context: >
      Found by walking into it. This host filed the v0.4.260810.1 sibling smoke packets as
      p0 — the highest-value work in the ledger at that moment, and the entire reason the
      operator asked for the release — and NEITHER sibling batch offered them. macOS was
      handed three p3 inference packets; Windows two p3 packets.

      CAUSE, and it is this host's own design. The selector chooses an EPIC first, then
      takes packets from it. `UNGROUPED` is deliberately demoted whenever any real epic is
      eligible (order 626), because letting it win on size alone returns the scattered
      batch the selector exists to prevent. The consequence was not thought through:
      **epic selection happens strictly before priority, so an ungrouped packet is
      unreachable at ANY priority while a grouped epic exists.** A p0 and a p3 are equally
      invisible if neither carries a release_target.

      That is a sharp edge on a ledger where 107 of 160 eligible linux packets are
      ungrouped (625-jd5f). The demotion is right; making it absolute is not.

      Worked around immediately by giving the three new packets
      `release_target: stable-milestone-v1`, which is where they belong anyway — both
      sibling batches now lead with their p0 smoke. The workaround is correct for these
      packets and does nothing for the other 107.
    exit_criteria:
      - >
        A high-priority ungrouped packet reaches a batch. Candidate shapes: let UNGROUPED
        compete on its best packet's priority rather than being demoted unconditionally;
        or reserve one slot of the budget for the highest-priority eligible packet
        regardless of epic. Pick one and say why the other was rejected.
      - >
        Cohesion must not be traded away wholesale to fix this. A batch that is one urgent
        outsider plus a cohesive remainder is still cohesive enough to work; a batch of
        three unrelated p0s is the scatter this selector was written to end.
      - A litmus step: an ungrouped p0 is reachable, AND a batch does not become fully scattered.
    verifiable_closure: >
      With a synthetic ungrouped p0 in the ledger, `select-work-batch.sh <role>` includes it,
      and the cohesion step of litmus:cycle-batch-triage-shape still passes.
    notes: >
      This interacts with 625-jd5f (two thirds of v0.5 work is ungrouped) and with
      630-6nw5's measurement that release_target is a WEAK cohesion signal — the dominant
      epic scores 0.110 against a 0.041 random baseline. If grouping is the only route to
      visibility, then a weak grouping signal is also a visibility gate, which is worse
      than it being merely weak. Consider whether anchor-tag grouping (630-6nw5's
      recommendation) resolves both at once.
    events:
      - ts: "2026-08-10T02:28:00Z"
        event: filed
        summary: >
          Filed after the selector buried three p0 packets this host had just created for
          the siblings. Fixed for those three by grouping them; the general defect stands.
