        DELIBERATE DECLINE, RECORDED AS A DECISION — not a gap. Ruling by
        macuahuitl (orchestrator), carried into the ledger by lenovinha because
        their shell is down (tmpfs usrquota exhausted; every write returns
        EDQUOT). They were explicit that nothing was permission-blocked — a
        tooling failure, not a refusal being routed around.

        lenovinha declined this p1 on three consecutive cycles (2026-08-26
        09:37Z, 11:37Z, 13:37Z) while it sat at the head of the selected batch.
        The reason, and the generalisable half macuahuitl asked to have promoted:

          PRIORITY IS NOT PERMISSION.

        This row is `multi_cycle: true` and its own next_action says the
        remaining half "wants either sweep-budget headroom or an operator-paired
        session". An unattended /loop cycle cannot supply either. Starting it
        would produce a half-done p1 that reads as claimed and hides the work
        from selection — the 641-e2qa shape.

        WHY THIS EVENT EXISTS AT ALL: a silently-skipped p1 and a deliberately
        deferred p1 are indistinguishable in the ledger, and only one of them is
        fine. Recorded so the next planner sees a decision.

        NOT CLAIMED, NOT BLOCKED, still `ready` and correctly selectable by a
        host that can pair with an operator.
  - packet_id: groundtruth-harness-reds-the-gate-for-an-undeclared-environment-dependency
    event:
      type: note
      ts: "2026-08-26T16:47:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t163000z
      host: lenovinha
      summary: |
        CRITERION 4 (the WITH-endpoint branch) ROUTED TO YOGA. Ruling by
        macuahuitl, carried by lenovinha (their shell is down, EDQUOT).
        gpu/container/ollama is the deciding factor; neither lenovinha nor
        macuahuitl can take it.

        THE MEASUREMENT RIDES WITH THE ROUTING, which was macuahuitl's explicit
        condition, so yoga starts from evidence instead of re-deriving it at the
        same cost. Measured on lenovinha 2026-08-26 with a working local
        inference endpoint (qwen2.5:0.5b / nomic-embed-text):

          scripts/spec-index-ensure.sh, cold build: 21,592 chunks to embed
          attempt 1  timeout 900s   -> rc=124, killed
          attempt 2  timeout 2700s  -> rc=124, killed
          both printed: spec-index:delta reused=0 embed=21592 of 21592
          podman volume tillandsias-spec-index-tillandsias: 0 bytes, EMPTY
          no vectors.jsonl or chunks.jsonl under ~/.cache or ~/.local/share

        ~60 minutes of embedding across two attempts persisted NOTHING. The first
        build on a host is ALL-OR-NOTHING: it publishes only at the end, so any
        bound shorter than the full build discards the whole attempt.

        `reused=0` is CORRECT and not a delta bug — the reuse pool is prior
        GENERATIONS under $INDEX_ROOT/*/ (spec-index-ensure.sh:471-481) and this
        host has never completed one. Stated because the symptom reads exactly
        like a broken cache and nearly got filed as one.

        CHECKPOINTING IS DELIBERATELY NOT FILED (macuahuitl concurring): at
        b=1.80 the queue is the constrained resource, and a row written from one
        host's inference is worse than one yoga writes with a second host's
        numbers. The condition on that agreement is this event — if yoga finds
        checkpointing is a PREREQUISITE rather than an optimisation, they file it
        then, with their own evidence.
  - packet_id: jq-loop-callers-need-restructuring-not-dispatch-conversion
    event:
      type: implemented
      ts: "2026-08-26T16:50:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t163000z
      host: lenovinha
      summary: |
        HAZARD 4 IS NO LONGER UNGUARDED — macuahuitl asked for this before anyone
        picks the packet up, and the argument was right: of the four classes it
        is the only one whose failure mode is LOOKING DONE, and it sat as prose
        in the one place a future implementer is guaranteed to walk into it, on 4
        of the 17 remaining scripts.

        Their closing point is the one that decided it: "we have measured, twice
        this week, that reading the warning does not prevent the mistake."

        FIXED AT THE SOURCE, not just guarded. All 28 callers that source the lib
        now WALK UP to find lib/tool-dispatch.sh instead of resolving it at a
        fixed depth, so a caller at any depth resolves it. The fragile form is
        gone from the tree.

        GUARDED THREE WAYS in scripts/test-tool-dispatch-lib.sh arm 4f:
          - a CONSTRUCTED caller one level down resolves the lib. Constructed,
            not scanned: every converted caller today lives directly in scripts/,
            so an arm that only scanned the tree would pass vacuously — the
            green-arm-that-cannot-go-red shape this suite keeps finding.
          - MUTATION CONTROL: the old fixed-depth header, given the same
            construction, silently reports RESOLVER-ABSENT. Verified.
          - a tree check that no caller reintroduces the fixed-depth form,
            verified to fire by planting it in a real caller.

        AND THE TREE CHECK ITSELF NEEDED CORRECTING, which is worth recording as
        the ninth instance of one shape in this session: it first matched the
        mutation control's own heredoc inside the fixture — a guard tripped by
        the evidence that the guard works. Scoped to exclude the file where the
        string is a specimen rather than a defect. The standing rule holds:
        assert the behaviour, not the string.
  - packet_id: builder-toolbox-init-set-too-small-for-the-dispatch-pattern
    event:
      type: note
      ts: "2026-08-26T16:52:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t163000z
      host: lenovinha
      summary: |
        The four hazard classes this packet paid for are now a cheatsheet:
        cheatsheets/architecture/host-tool-dispatch-sweeps.md, bundled and
        indexed, so an agent inside the forge finds it at
        $TILLANDSIAS_CHEATSHEETS/INDEX.md. Approved by macuahuitl with two
        conditions, both met: provenance per CLAUDE.md (every figure attributed
        and dated), and a GUARDED / NOT-GUARDED column per class so a reader can
        tell which hazards the suite catches for them and which they must watch
        by hand.

        Hazard 3 (write-path namespace) is marked PARTLY guarded rather than
        guarded, deliberately: the arm checks that the CURRENT callers write
        under /tmp, and cannot check a path someone adds later. Overstating it
        would be the same category error the cheatsheet is about.
