packets:
  - packet_id: append-event-accepts-a-ref-that-resolves-to-no-packet
    order: 896-f8ti
    status: ready
    kind: bug
    pickup_role: any
    priority: p1
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    depends_on: []
    deliverable: |
      `tillandsias-plan append-event <ref>` refuses a ref that resolves to no
      live packet, instead of writing a dangling event, reporting success, and
      failing the release preflight later on another host.
    capability_tags:
      - plan-tooling
      - fail-loud
      - release
    tags:
      - dangling-event
      - late-failure
      - v0.5
    title: |
      `append-event` accepted an order token that does not exist, invented a packet_id from prose, reported "appended", and blocked the release preflight — on a different host, an hour later, minutes before a tag.
    context: |
      MEASURED on tlatoanis-macbook-air 2026-08-26T01:28Z, live, while a
      release tag was imminent.

      I ran `append-event 624-q4jj note "<the macOS e2e pre-commitment>"`.
      **There is no packet with order 624-q4jj.** The string appears in this
      ledger only inside OTHER packets' prose — 635-bhkb's `outcome` field
      says "624-q4jj step 5 prescribed `--version >= 0.4.260809.2`". The same
      is true of `735-6iki`, cited at plan/index.yaml:38390 as
      "`packet_id: v04-release-gate-macos-e2e-evidence, order: 735-6iki`" and
      filed nowhere.

      `append-event` resolved my ref to `macos-unstable-channel-installer-validation`
      — a packet_id that exists NOWHERE in the ledger — wrote a fragment whose
      own header helpfully explains "the target packet is declared only in an
      uncompacted fragment, so the BASE ledger has no block to append into",
      and printed `appended note event to macos-unstable-channel-installer-validation`.

      Every part of that is a success message. Nothing failed.

      WHERE IT ACTUALLY FAILED: `scripts/release-preflight.sh`, invoked by the
      pre-push hook, refused with `blocked:plan-ledger-incomplete` and
      `dropped-entry: … an event for macos-unstable-channel-installer-validation
      — NO SUCH PACKET, so this event is attached to nothing and no reader of
      any packet will ever see it`. That diagnosis is excellent and it arrives
      at the WRONG TIME AND PLACE: at push, on a release-critical path, from a
      script whose name gives no hint that a `plan append-event` an hour
      earlier was the cause.

      THE DISTANCE IS THE DEFECT. The write is where the information is — the
      ref, the resolution, the caller. By preflight time all that survives is a
      filename and an orphaned id. Had a coordinator's `--ci-full` hit this
      during a cut, it would have blocked a release on a fragment whose author
      was on another host and had already reported success.
    exit_criteria:
      - |
          `append-event <ref>` where <ref> matches no live packet EXITS
          NON-ZERO and writes nothing, naming the ref and saying it resolved to
          no packet. The existing "declared only in an uncompacted fragment"
          path must still work — that is a real case and the distinction is
          exactly what the tool currently fails to draw.
      - |
          The refusal distinguishes the two causes, because they need different
          fixes: (a) the ref names nothing at all — a typo or a prose-only
          citation; (b) the packet exists in an unfolded fragment — legitimate,
          proceed.
      - |
          NEGATIVE CONTROL: appending to a packet that exists only in an
          uncompacted fragment still SUCCEEDS. Without this leg the fix could
          be "refuse anything not in the base", which would break the case the
          current behaviour exists to serve.
    verifiable_closure: |
      NAMED: extend `litmus:ledger-fragment-convergence` (bound, spec
      meta-orchestration) with two cases run against a scratch ledger — an
      `append-event` to a nonexistent ref must exit non-zero and leave
      `plan/index.d/` unchanged; an `append-event` to a fragment-only packet
      must exit zero and write. Must be RED before the fix on the first leg and
      GREEN on the second both before and after, so the fix cannot be a blanket
      refusal.
    notes: |
      Filed by the host that caused it, minutes before a release tag it would
      have blocked. Repair was to delete the dangling fragment — mine, unpushed,
      never folded, attached to nothing, so nothing any reader had seen was
      destroyed — and re-append to a real packet. `release-preflight.sh` then
      returned `ok:release-preflight`.

      THE PROSE-CITED-BUT-NEVER-FILED ORDER TOKEN is worth noting as its own
      smaller finding: this ledger contains order tokens referenced in packet
      text that were never filed (624-q4jj, 735-6iki both confirmed). An agent
      reading such a citation reasonably believes the packet exists, and the
      tool then confirms that belief by accepting it.
