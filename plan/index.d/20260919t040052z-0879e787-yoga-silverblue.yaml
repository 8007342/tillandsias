      FOUR OF THE TEN ENGLISH SENTENCES ASSERT TIMING ("~10 minutes", "slower
      than cached path"). Nothing can check those, and they should be deleted
      rather than translated — a timing claim belongs in a budget, not a
      predicate.
      MIGRATE THE 74 FIRST. They are the steps with no teeth today, so they are
      where translation BUYS something; the 2,287 enforceable ones are working
      and a sweep over them is churn with a chance of regression. This is the
      migrate-on-touch rule applied to the corpus.
      ORDERING NOTE: the structured form should be expressible as a 1252-hsrz
      predicate eventually, but this row does NOT depend on it. The keyword
