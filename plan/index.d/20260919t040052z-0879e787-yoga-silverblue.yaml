      [2026-09-18T23:52:34Z yoga-silverblue] MEASUREMENT REFINEMENT 2026-09-19, yoga — THE 10 LONG-SENTENCE BUCKET IS WRONG FOR AT LEAST HALF ITS MEMBERS, and the error has the same shape as the one this row already records about its FIRST classifier. Reproduced the row's counts on today's tree before touching anything and got succeeds=64, success_pattern=85, exit-only=180, long-sentence=10, unenforced total 74 — converging with the row exactly, so the classifier agrees. But CLASSIFYING BY LENGTH CONFLATES LONG LITERALS WITH PROSE. Of the 10, at least 5 are enforceable today. Three contain their expected_behavior verbatim in their own command, so the grep -Fqi fallback matches what the command echoes — for example response_shaped_variants_are_response_only_on_both_transports and rm -f /run/vault-handover/root.token /run/vault-handover/unseal.key, both of which are grep -F arguments in their own step. Two more end in the four characters that make them look like prose, a space then three dots then ok, and are in fact CARGO TEST OUTPUT FORMAT — the command is cargo test -p tillandsias-headless <name> and cargo prints test <name> then space dots ok, so the expectation matches the runner's output exactly. THE SECOND PAIR ALSO DEFEATED MY OWN DETECTOR, which is worth recording because it bounds the method rather than the corpus. I tested enforceability by asking whether the expected_behavior string appears verbatim in the step's own command; that finds literals ECHOED BY THE COMMAND and misses literals PRODUCED BY A TOOL'S KNOWN OUTPUT FORMAT, so it reported those two as prose. A syntactic test over commands cannot see cargo's contract. THE DISCRIMINATOR IS NOT LENGTH AND IT IS NOT MY TEST EITHER — it is whether the output can be relied on to contain the value, which needs a judgement per step. WHAT THIS CHANGES FOR THE WORK: the 64 succeeds steps remain the clean mechanical set, because there the sentence is decorative BY CONSTRUCTION — the interpreter honours the exit code and ignores the string whatever it says, which is a property of the interpreter and not of the text. The 10 are NOT a batch and should not be migrated as one; roughly half already have teeth and translating them would be churn with a regression chance, which is this row's own migrate-on-touch argument turned on itself. The four wall-clock claims remain deletions as the row states. Filed by yoga while implementing, before migrating anything, so the next implementer does not migrate five working steps.

      [2026-09-19T02:11:50Z yoga-silverblue] MIGRATION HAZARD 2026-09-19, yoga, measured before migrating — ONLY 45 OF THE 64 succeeds STEPS ARE EXIT-CODE CHECKS. Nineteen of them match an EARLIER case arm and are adjudicated as NON-EMPTY OUTPUT, not by exit status. The interpreter lists grep succeeds, container id returned, launches without error and shutdown command succeeds BEFORE the generic succeeds arm, with a comment saying those name a specific artefact the step must print so silence really is a failure for them. bash case takes the first match, so containing the word succeeds is NOT the adjudication rule. Simulating the arm order over the corpus gives 45 EXIT CODE ONLY and 19 NON-EMPTY OUTPUT, the nineteen being seventeen grep succeeds and two shutdown command succeeds. WHY THIS MATTERS MORE THAN THE COUNT — migrating all 64 to assert_exit 0 would silently convert nineteen steps from must print something to must exit zero. That WEAKENS them, it is invisible in the diff because every one of those lines looks like every other succeeds line, and it is precisely the class of change this row exists to make impossible. A migration driven by grep for succeeds does exactly that. THE SPLIT FOR THE WORK. The 45 are mechanical and safe, since exit status genuinely was all they ever checked. The 19 are per-step work and land squarely under this row's second exit criterion, which already asks each migration to state what the step now checks BEYOND exit status or to record that exit status was all it ever checked — for these the answer is documented in the interpreter itself and is not exit status. ONE IMPLEMENTATION NOTE, offered not taken. assert_output_matches with a single dot expresses non-emptiness today, since grep -Eq on empty output returns 1, but it is cryptic and a reader cannot tell it from a typo. A dedicated assert_output_nonempty would be clearer and is a small addition, though for the seventeen grep succeeds cases the honest translation is probably to assert WHAT THE GREP SHOULD FIND rather than that it printed anything, which is judgement per step and not a batch. Recorded rather than acted on, because choosing between those is this row's to decide and not a detail to settle inside a sweep.

      [2026-09-19T04:00:52Z yoga-silverblue] METHOD FOR MIGRATING AN ADJUDICATION, 2026-09-19 yoga — ASK WHAT EACH COMMAND DOES, RUN THE ONES WITHOUT SIDE EFFECTS UNDER BOTH RULES, AND THE DISAGREEMENT IS THE FINDING. Translating the sentence is the obvious approach and it is wrong, because the sentence is not the rule; the interpreter's case ORDER is, and the sentence is only what selects an arm. So the migration proceeds by asking what the step's command actually does, then executing the ones that are safe to execute and comparing the verdict under the OLD rule against the verdict under the HONEST one. Where they agree, the migration is mechanical. Where they DISAGREE, the step has been passing for a reason its author did not intend, and that disagreement is worth more than the migration. Measured on the 24 non-empty-output steps — 17 are grep-only and safe, they were run, 16 agreed and ONE did not, and that one had been green for three months while five of its seven conjuncts failed (order 1258-8wfb). The other 7 call podman or tillandsias --init or pkill and were NOT run, because taking side effects on a live host to complete a survey is not a measurement anyone should trust, and the two pkill steps are themselves a self-match hazard filed as 1266-75tr. THE COROLLARY IS THE PART THAT GENERALISES. A sweep driven by grepping the sentence would have migrated all 64 succeeds steps and all 24 non-empty ones uniformly, converting 19 of them from must-print-something to must-exit-zero and never noticing the three-month-old regression, because every one of those lines looks like every other. The defect this row exists to remove is a sentence silently changing what a test checks; a sweep is the same defect wearing the migration's clothes. Per-step judgement is not thoroughness here, it is the only method that can see what the sentences were hiding.
