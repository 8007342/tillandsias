    title: "litmus:forge-trust-refresh-cli fails on darwin: its fixture needs unshare -rm, and could-not-run is scored as a failure"
    context: "Measured 2026-11-08T07:26:34Z on tlatoanis-macbook-air (linux-next, darwin 27.2.0): scripts/run-litmus-test.sh forge-environment-discoverability --phase pre-build --size instant fails only on litmus:forge-trust-refresh-cli, step 1, rc=3, output 'could-not-run:tillandsias-trust' and 'unshare -rm (a rootless mount namespace) is not available here'. The same result appears with and without unrelated working changes, so every darwin run of that spec's suite is red for a reason that is a host capability, not a defect. The step's success_pattern is ok:tillandsias-trust:7 arms and the litmus has no platform gate or skip mapping for could-not-run."
    exit_criteria:
      - "On darwin the step reads as a named skip (the fixture's own could-not-run, mapped by the litmus or gated to linux), and the forge-environment-discoverability suite passes there; on Linux the 7 arms still run and pass. Pre-fix result: FAILS on darwin with rc=3."
    verifiable_closure: "The suite on a darwin host passes with the step reported as skipped for the missing unshare, and on a Linux host the step still reports ok:tillandsias-trust:7 arms."
