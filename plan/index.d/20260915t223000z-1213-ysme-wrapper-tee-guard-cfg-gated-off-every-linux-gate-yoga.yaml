          FALSIFIED, with the mutation PROVEN APPLIED rather than assumed. I
          removed `2>&1 | tee "$LOG"` from the wrapper, confirmed by grep that
          the literal was gone from the file, and the test went RED on the
          intended assertion — "both streams must reach the guest-side log, or
          the next failure is undiagnosable again". Reverting restored green,
          and `git diff --stat` on the mutated file was EMPTY afterwards, so the
          revert was not itself a no-op. Green -> red -> green, each step
          measured.

          A DEFECT IN THE ORIGINAL SCAN, FIXED IN THE COPY. It sliced the
          literal as `&source[start..start + 900]` — a fixed byte count that
          panics on a char boundary or past EOF as soon as the script grows,
          which would read as a defect in the wrapper rather than in the scan.
          The new one bounds on the literal's own terminator.

          AND THE TERMINATOR SEARCH HAS A TRAP I FELL INTO FIRST, recorded
          because the failure looked like the wrapper's fault: the literal opens
          `r#"#!/usr/bin/env bash`, so searching for `"#` from the match start
          hits the OPENING delimiter three bytes in and yields an EMPTY body.
          Every assertion then fails for the wrong reason — my first run died on
          "the wrapper must launch tillandsias-headless --github-login", which
          reads as the launch line being absent when it was the window that was
          empty. The scan now starts after the opening delimiter and searches
          for `"#;`.

          I DELIBERATELY DID NOT TOUCH wsl_lifecycle.rs. Deleting the Windows-
          only original would be editing a file this host compiles a STUB for,
          so I could not verify it still builds — the class I have measured
          before, where `cargo check -p <foreign-platform-crate>` compiles only
          dependencies and a deliberate syntax error in the target file produces
          ZERO errors. The duplicate is harmless (Windows runs both) and the
          original's `start + 900` window is pre-existing. A host that can build
          the Windows tray should remove the original and inherit the bounded
          window; that is the remaining work on this row and it is NOT done.

          SCOPE: this changes which hosts execute an existing assertion. It does
          not change the wrapper, the tee, the login lane, or any runtime
          behaviour on any platform.
