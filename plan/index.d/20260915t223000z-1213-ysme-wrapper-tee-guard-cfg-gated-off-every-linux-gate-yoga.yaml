    title: |
      The assertion keeping the GitHub-login wrapper's tee lives in a cfg(target_os = "windows") module, so a filter naming it on linux-next answers "ok. 0 passed; 18 filtered out" — a guard whose silence reads as protection on every host the fleet gates on
    context: |
      FOUND while verifying a citation yolanda-windows sent me, not by looking
      for it. They had documented the wrapper's history correctly; I checked
      whether the test enforcing it runs here, and it does not.

      MEASURED on yoga in the tillandsias-builder toolbox, before any change:

        cargo test -q -p tillandsias-windows-tray github_login_wrapper_captures
        -> test result: ok. 0 passed; 0 failed; 18 filtered out

      A full run of the crate lists no executing test whose name contains
      wrapper, login, or wipe_guest. THE VERDICT IS A GREEN `ok` OVER ZERO
      EXECUTED TESTS, which order 913-27ex settled is not a pass.

      MECHANISM, verified independently by yolanda: in
      crates/tillandsias-windows-tray/src/main.rs the real module is declared
      `#[cfg(target_os = "windows")] mod wsl_lifecycle;` and a
      `#[cfg(not(target_os = "windows"))] #[path = "stubs/wsl_lifecycle.rs"]`
      stub is compiled everywhere else. The assertion lived beside the wrapper
      inside the real module, so it compiles on Windows alone.

      WHY THIS IS WORSE THAN AN UNTESTED LINE. A doc comment beside the wrapper
      warns a future debugger NOT to de-pipe it on a blank-terminal recurrence:
      piping is not the mechanism (the terminal-safety half is
      `should_own_process_group` in tillandsias-headless), and dropping the tee
      only costs the log that makes the next failure legible. On linux-next that
      warning was PROSE. The change it forbids would have passed every gate
      available to whoever made it, and the 0-byte github-login-last.log that
      made the v0.4.260809.2 blank terminal unreadable is the recorded cost of
      having no log at that moment.

      MEASURED ON THE OTHER SIDE TOO, by yolanda-windows, so the row states
      both halves rather than inferring either. On Windows 11 (MSVC host
      target) the same command answers `ok. 1 passed; 0 failed; 123 filtered
      out`. So the assertion runs on EXACTLY ONE PLATFORM — the one the fleet
      almost never gates on (see the release-tier sampling finding: a host that
      relays every platform branch answers `never:release-tier`).

      AND THE COUNTS THEMSELVES ARE A FREE DETECTOR FOR THIS WHOLE CLASS,
      which is yolanda's observation and worth more than this row:

        yoga (Linux)       0 passed,  18 filtered out
        yolanda (Windows)  1 passed, 123 filtered out

      Same crate, same filter, same command. 105 TESTS EXIST ON ONE HOST AND
      NOT THE OTHER, and neither output says so — each is a complete, healthy
      `ok` about a different world. Comparing PASS counts does not catch it
      (0 and 1 are both plausible); comparing FILTERED-OUT counts does, because
      18 against 123 is not. That is the cheap cross-host tell for a cfg-gated
      module silently absent, and it needs no accident to be true — it is the
      steady state.

      IT NEVER NEEDED THE MODULE. The assertion is a SOURCE SCAN — it does
      `include_str!("wsl_lifecycle.rs")` and reads the raw literal out of the
      file as text. Being inside a platform-gated module was incidental, and
      moving it costs nothing. main.rs's own `#[cfg(test)] mod tests` is not
      platform-gated and already uses the same `include_str!` idiom three
      declarations away; `tray_registry` in the same crate carries an explicit
      comment saying it is deliberately un-gated so its criteria are exercised
      on every host rather than only where a registry exists. Same reasoning.
