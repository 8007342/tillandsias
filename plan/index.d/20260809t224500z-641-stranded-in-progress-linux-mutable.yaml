packets:

  - packet_id: stranded-in-progress-packets-are-invisible-both-ways
    order: 641-e2qa
    status: ready
    desired_release: v0.5
    priority: p1
    title: "21 packets sit in in_progress with no event ever recorded — neither claimable nor closed"
    kind: bug
    deliverable: scripts/check-stranded-in-progress.sh
    depends_on: []
    pickup_role: any
    capability_tags: [plan, triage, ledger, coordination]
    context: >
      A packet in `in_progress` is invisible in BOTH directions: `ready` queries skip it so
      nobody claims it, and burndown does not count it so nobody notices it is unfinished.
      It is neither work nor done.

      MEASURED 2026-08-09: 23 packets in_progress (16 linux, 6 windows, 1 unassigned), and
      21 of them have NO progress/completed/blocked event ever recorded — their most recent
      activity is the claim itself. Oldest is order 153. Against 216 ready packets, that is
      ~9% of the live ledger stranded.

      THIS IS A DIFFERENT LEAK FROM 635-i6vm and the guard written for that one is
      structurally unable to see it:

        635-i6vm   completion WAS declared and the G-Set fold discarded it.
                   check-fragment-status-loss.sh catches that.
        this       completion was NEVER declared. 627-k4mz was filed
                   `status: in_progress`, the fix was written, reviewed and merged by two
                   hosts — and no fragment ever said so. Nothing was discarded, so nothing
                   looked wrong.

      Together the two leaks explain most of the "agents rediscover work that is already
      done" complaint: one class silently loses the completion, the other never writes it.
    outcome: >
      scripts/check-stranded-in-progress.sh reports them. It deliberately does NOT close
      anything and is NOT a gate — a packet legitimately in flight right now is
      indistinguishable from one abandoned an hour ago, so failing a build on it would
      block work for a state that is often correct, and an automated closer that guessed
      would silently mark unfinished work done. That is the most expensive possible version
      of this bug.
    exit_criteria:
      - >
        Each of the 21 is dispositioned by an owner who checks its exit criteria against
        the tree: completed, returned to ready, or blocked with a reason. Not bulk-closed.
      - >
        A claim that produces no event within one cycle returns the packet to `ready`
        automatically, or the claim protocol requires an event at cycle end. A claim that
        can silently outlive its cycle will recreate this set continuously.
      - The detector runs in the coordinator's triage step so the count is visible per cycle.
    verifiable_closure: >
      `scripts/check-stranded-in-progress.sh` reports stranded=0, or every remaining entry
      carries a recorded reason for still being in flight.
