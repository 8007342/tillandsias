packets:
  - packet_id: fragment-overlay-lww-and-events-lost-on-fragment-packets
    order: 585-v2fa
    desired_release: v0.5
    title: "fold() applies LWW status and event appends BEFORE appending fragment-only packets, so no new packet can ever change status or receive an event"
    status: ready
    kind: fix
    deliverable: crates/tillandsias-plan/src/fragments.rs (fold ordering) + unit test pinning the fragment-only-packet LWW/event path
    depends_on: []
    pickup_role: linux
    capability_tags: [plan, crdt, ledger, rust]
    estimated_hours: 2
    outcome: >
      Verified defect (not prose): crates/tillandsias-plan/src/fragments.rs
      fold() runs apply_to_packets over the base clone BEFORE append_packets adds
      the fragment-only packets, so the LWW `status:` register and `events:` set
      never reach packets that exist only in fragments. Every newly-filed packet
      is fragment-only (that is the overlay's filing model), so no packet filed
      via a fragment can be marked claimed/in_progress/completed/blocked, and no
      event can be appended to it — the reduction loop's own bookkeeping is
      blocked on this. Reproduced with the compiled CLI on a synthetic ledger:
      a base packet's status LWW applies (ready->claimed) while a fragment-only
      packet's identical LWW entry is silently dropped (stays ready); the event
      appended to the fragment packet is dropped by the same pass. Silent loss:
      `check` reports the ledger structurally sound. Existing tests never catch
      it because every LWW/event test operates on the base packet alpha.
      Suggested fix: swap the last two statements of fold() (append_packets
      before apply_to_packets); LWW winner is a pure (ts,host) function of the
      fragment set, so ordering is preserved and idempotency holds. Full
      reproduction + reasoning: plan/issues/
      fragment-overlay-lww-and-events-lost-on-fragment-packets-2026-08-01.md.
      Blocks closing every fragment-filed packet including 583-2bpw.
    exit_criteria:
      - "a synthetic ledger where a fragment-only packet receives a later LWW status update and an event shows BOTH under `tillandsias-plan status` / event query — the exact fixture from the issue, before and after"
      - "the fold-order swap keeps every existing fragments.rs test green (idempotency, commutativity, base-packet LWW all still hold)"
      - "a fragment-only packet can be moved ready -> claimed -> completed through subsequent fragments and the read reflects it deterministically"
    events:
      - type: filed
        ts: '2026-08-01T07:06:00Z'
