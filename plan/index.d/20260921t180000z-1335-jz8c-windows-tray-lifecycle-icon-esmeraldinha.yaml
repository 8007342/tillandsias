    verifiable_closure: |
      THREE THINGS, and the first is independent of the other two.

      1. ASSET QUALITY. The Windows tray icon is generated by the BUILD from
         the same Ionantha assets the Linux tray uses, not from a committed
         binary produced by a hand-run ImageMagick command. Regenerating it is
         a build step, not a recipe in a comment.
      2. DYNAMIC ICON. The tray icon CHANGES when VmPhase changes. Demonstrated
         by mutation, not asserted: drive the phase through
         Provisioning/Starting/Ready/Failed and watch the icon differ at each.
      3. NO REGRESSION IN THE EXE ICON. The Explorer/taskbar/Alt-Tab icon stays
         legible; if the tray and exe icons diverge, that is a deliberate choice
         recorded on this row, not a side effect.

      The operator's EYE is the acceptance test for (1) and (3). No fixture can
      tell us an icon is pretty; a fixture can only tell us it changed and that
      it is non-empty at every size.
    title: |
      the Windows tray ships one hand-rasterized outline icon that never changes, while the events and the rendered lifecycle PNGs it would need are already present and unused
    context: |
      OPERATOR REPORT 2026-09-21: the Windows tray icon is ugly, the assets
      began as placeholders and do not match Linux, and the application icon
      is also a placeholder. Researched with a three-way fan-out; the state of
      things is better than the report implies, because almost every piece is
      already built and merely unconnected.

      WHAT WINDOWS SHIPS TODAY. crates/tillandsias-windows-tray/assets/tillandsias.ico
      is a committed 7-size binary (16/32/48/64/96/128/256) produced ONCE, by
      hand, on 2026-05-25, by an ImageMagick command recorded only as a comment
      in tillandsias.rc lines 12-16. It is resource id 1, and resource id 1 is
      BOTH the tray icon and the exe icon — there is no separate application
      icon on Windows. notify_icon.rs:3803 loads it once with LoadIconW at
      NIM_ADD. The two NIM_MODIFY call sites carry NIF_TIP (tooltip) and
      NIF_INFO (balloon) and NEVER NIF_ICON, so no code path can change the
      icon after creation. No script regenerates the .ico; build.rs only
      declares rerun-if-changed on it.

      WHY IT LOOKS BAD, and this was settled by LOOKING rather than by proxy.
      The source is assets/icons/xerographica/bloom.svg. Rendered, it is two
      large HOLLOW OUTLINE curves and a hairline stem with three dots, with
      wide empty margins. Outlines and hairlines survive 256px (where it was
      chosen, as the MSIX Store logo) and disappear at the 16-24px a tray
      actually renders. The Linux tray uses IONANTHA, whose icons are SOLID
      FILLED, dense and fill the frame, and genus.rs:230 already documents
      Ionantha as the tray genus for exactly this reason. A first attempt to
      settle this by counting shapes was MISLEADING — xerographica has fewer
      shapes and thicker nominal strokes than ionantha/bloom — so the shape
      count would have argued for keeping it. Fill-versus-stroke and canvas
      coverage are what matter at tray sizes, and only rendering both showed it.

      WHAT ALREADY EXISTS AND IS UNUSED. tillandsias-core/build.rs renders the
      full lifecycle set with resvg + tiny-skia at build time into OUT_DIR and
      embeds it via include_bytes!, exposed as
      tillandsias_core::icons::tray_icon_png(TrayIconState). The Linux tray
      consumes exactly that (headless/src/tray/mod.rs:2159). tillandsias-core
      IS ALREADY A DEPENDENCY of the Windows tray crate — only its singleton
      and reset_state are used, and its icons module is unreferenced. resvg is
      ALREADY a build-dependency of the Windows tray crate, where it renders
      the three MSIX logos, with an explicit in-tree rationale against
      ImageMagick.

      THE EVENTS ALREADY ARRIVE, which is the finding that makes this small.
      The Windows tray subscribes to VmStatus and handles VmStatusPush at
      notify_icon.rs:2291, calling apply_vm_status (1939), which today
      terminates in update_status_text (220) — tooltip and menu chip only.
      VmPhase (Provisioning/Starting/Ready/Draining/Stopping/Failed) is
      already in hand on every push. NO CONTROL-WIRE CHANGE IS NEEDED. The
      Linux TrayIconState is NOT on the wire and does not need to be: it is
      derived from status on the Linux side too, so Windows can derive it from
      the VmPhase it already receives.

      SO THE GAP IS THREE SMALL PIECES, all inside the Windows crate: a
      VmPhase-to-TrayIconState mapping; an HICON built at runtime from the
      embedded RGBA (CreateIconIndirect or CreateIconFromResourceEx, since the
      tree has no ICO writer); and a Shell_NotifyIconW(NIM_MODIFY) carrying
      NIF_ICON from apply_vm_status. Icons must be destroyed with DestroyIcon
      on replacement or the tray leaks a GDI handle per transition.

      MACOS HAS THE SAME GAP AND ALREADY HAS A ROW: order 496,
      macos-tray-icon-state-machine-parity, status pending, which describes
      this same engine for NSStatusItem. This row is its Windows twin and
      should be sequenced with it rather than inventing a second design.

      SPEC DRIFT FOUND IN PASSING, not fixed here:
      openspec/specs/tray-icon-lifecycle/spec.md requires TrayIconState to have
      EXACTLY FIVE variants (invariant five-states-exactly, and
      five-pngs-generated). The shipping enum has SIX — Stopping — and
      build.rs generates six PNGs. The spec is stale against the code it
      governs. Whoever takes this row should not widen the drift, and the
      correction belongs on its own row.
    next_action: >
      Do the three pieces in the order the closure lists them, because the
      first is independently valuable and needs no Win32 work. START by
      rendering both candidates side by side at 16, 24 and 32 px and putting
      them in front of the OPERATOR — this row exists because an icon looked
      wrong to a human, and no automated check can accept that fix. Only then
      wire the dynamic path, and prove it by driving VmPhase through its
      variants and watching the icon change, not by asserting a mapping exists.
      Destroy the previous HICON on every swap. Do NOT add a control-wire
      variant: the phase already arrives, and a new message would be a second
      way to say something the tray is already told.
