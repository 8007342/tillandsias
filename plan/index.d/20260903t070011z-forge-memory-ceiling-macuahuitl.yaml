packets:
  - packet_id: the-forge-memory-ceiling-was-declared-closed-on-a-helper-nothing-calls
    order: 981-n5vx
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [forge, podman, cgroup, security, spec-compliance, fail-loud]
    estimated_hours: 5
    title: |
      A spec MUST for the forge memory ceiling is unimplemented, the swap escape it forbids is wide open, and the litmus that covers it asserts a pure helper that nothing calls.
    context: |
      FOUND by pirria-tillandsias-forge, a floor host, measuring its own cgroup.
      See plan/issues/forge-has-no-memory-ceiling-2026-09-03.md.
      MEASURED, n=1, that host only: N150, 4 logical cores, 15.35 GiB RAM,
      15.35 GiB swap, native podman, no WSL2, no VM, v56.9.2.1. Live cgroup of
      a running forge from the primary launcher:
        memory.max = max     memory.high = max     cpu.max = max 100000
        cpuset = 0-3         io.max = empty        pids.max = 4096
      The forge is given THE WHOLE HOST MINUS NOTHING. PIDs are the only
      bounded resource, which is also why the earlier fork bomb presented as a
      PID incident rather than an OOM.
      THE SPEC MUSTS IT. openspec/specs/forge-hot-cold-split/spec.md requires
      --memory=<ceiling>m and --memory-swap=<ceiling>m, that --memory-swap MUST
      equal --memory exactly (no swap escape), and that BOTH MUST appear in the
      argv. A cheatsheet even gives numbers: 840m forge, 192m proxy.
      I ANSWERED THE QUESTION pirria named as next and cheapest - regression or
      never built. NEVER BUILT, AND DECLARED CLOSED. Commit 3d7fb86da
      (2026-05-29) "implement --memory ceiling helpers", whose message says it
      "Closes Req 3", touched exactly three files: preflight.rs,
      litmus-bindings.yaml, and the litmus test. IT NEVER TOUCHED A LAUNCH SITE.
      compute_memory_ceiling_mb is defined at preflight.rs:307 and called only
      from its own tests at 459, 465, 475 and 488. Zero production callers.
      AND THE LITMUS ASSERTS THE HELPER, NOT THE ARGV. Its step is named
      "Req 3 --memory ceiling: compute_memory_ceiling_mb pure helper + 256
      baseline" - it says pure helper in the step title. So the requirement was
      marked closed on a computation nothing invokes, and the check that
      "covers" it verifies the arithmetic in isolation. Every gate is green on
      every host and the flag has never been emitted.
      WHY IT IS WORSE THAN AN ABSENT LIMIT. The swap escape the spec explicitly
      forbids is wide open, and this host carries as much swap as RAM, so a
      runaway forge does not OOM - it drives the host into swap thrash, the
      same IO-pressure mode already tracked on 959-fpc5 for the coordinator's
      budget NVMe. The tray, podman and the operator's session all sit OUTSIDE
      the cgroup competing for the same unreserved memory.
      THIRD INSTANCE TODAY of a function called only by its own tests; see
      979-3kfb (fetch_recipe_artifact). It is becoming a recognisable shape.
    exit_criteria:
      - --memory and --memory-swap are emitted into the podman argv at every forge launch site, equal to each other, from compute_memory_ceiling_mb rather than a second computation
      - the guard asserts the ARGV or the resulting live cgroup, not the pure helper; a test that pins only the arithmetic does not discharge this requirement
      - the guard is verified to FAIL when the flags are removed, on a real launch, not reasoned about
      - the ceiling is derived per host rather than a literal, or the literal's regime is stated - a 840m constant is wrong on both a floor host and a fat one
      - check whether the macOS and Windows lanes have the same gap; pirria explicitly did not check them

