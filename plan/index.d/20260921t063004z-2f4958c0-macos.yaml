    value: "ONE lock guards every write to TILLANDSIAS_PODMAN_BIN in this crate, and a\ntest asserts that the two modules use the SAME one rather than each\ndeclaring its own — a source-shape assertion, because the race is\nload-dependent and a green run proves nothing about it.\n\nDO NOT CLOSE THIS BY RE-RUNNING THE SUITE UNTIL IT PASSES. The failure is\nan interleaving; its absence on any one run is not evidence.\n\n\n[2026-09-21T06:25:15Z macos] ONE LOCK, and a test that makes a second one impossible to add silently.\n\npodman_bin_env_lock() in crates/tillandsias-podman/src/lib.rs is now the only\nguard over TILLANDSIAS_PODMAN_BIN. lib.rs's env_lock() delegates to it (the name\nstays; a dozen call sites read well with it) and backend.rs's two #[tokio::test]s\ntake it directly, its own tokio::sync::Mutex removed.\n\nTHE ASYMMETRY THE ROW CALLED THE DESIGN QUESTION DISSOLVES ON READING. A std\nguard CAN be held across the `.await` in backend.rs, because #[tokio::test]\ndefaults to the current-thread flavor and that future is never required to be\nSend. backend.rs's own comment gave \"a tokio mutex rather than std\" as the\nreason it declared a separate lock; the precaution was real-sounding and\nunnecessary, and taking it is what split the guard in two.\n\nTHE SHAPE ASSERTION, and why it is by shape:\nexactly_one_mutex_guards_the_process_global_podman_bin reads lib.rs and\nbackend.rs and requires exactly ONE mutex declaration between them. The defect\nis an interleaving — this crate passed 176/176 on the run immediately after the\nfailure — so no green run is evidence of its absence, and a lock that is\ndeclared but never contended looks identical at runtime to no lock.\n\nMUTATION-VERIFIED, because a guard that has only ever passed proves nothing:\nplanting `static SECOND_LOCK: OnceLock<Mutex<()>>` in backend.rs reds it with\n  \"backend.rs:392: static SECOND_LOCK: ...\"\nnamed by file and line, and removing it greens again. The needles are assembled\nwith concat! rather than written whole — spelled out, the test matched ITSELF\nand failed against a correct tree on its first run.\n\nTHE RACING TEST STAYS LIVE. a_prompt_podman_still_succeeds_under_the_same_budget\nis NOT in scripts/test-known-red.txt and must not be added: it is the negative\ncontrol proving the backend succeeds inside its budget, and retiring it would\nsilence the harness race by discarding the assertion.\n\nFull crate: 177 passed, 0 failed (176 before, plus the new guard). NOT OFFERED\nAS PROOF THE RACE IS GONE — \"passes N/N on re-run\" is exactly the reading this\npacket warns against. The evidence is the single declaration plus the mutation\narm; the suite result only shows nothing else broke.\n\n[2026-09-21T06:30:04Z macos] \nCORRECTION TO THE LOCK TYPE, made after the gate refused the first attempt\n(2026-09-21, BUILD_RC=101).\n\nThe first version made the shared guard a std::sync::Mutex, reasoning that\nholding it across backend.rs's `.await` is SOUND because #[tokio::test] defaults\nto the current-thread flavor, whose future is never required to be Send. That\nreasoning is correct and it is not the binding constraint:\n`clippy::await_holding_lock` denies the pattern, and the gate denies warnings.\nSoundness was never what decided it.\n\nSo the ONE lock is a tokio::sync::Mutex. Async tests take `.lock().await`; sync\ntests take `blocking_lock()`, which is right precisely because they are not in a\nruntime — it panics if one is ever present, which is a loud failure rather than\na deadlock. backend.rs's original instinct to reach for a tokio mutex was\nRIGHT; what was wrong was declaring a SECOND one rather than sharing it. The\nfirst version of this fix repeated the original author's error in the mirror.\n\nONE BEHAVIOUR DIFFERENCE, accepted deliberately: a tokio mutex is not poisoned\nby a panicking holder, so the poison recovery the std lock carried (833-u85z)\nhas no counterpart. The cascade that recovery prevented cannot occur for the\nsame reason.\n\nHOW THE FALSE \"CLIPPY CLEAN\" HAPPENED, recorded because the lesson is not about\nlocks: the crate-local clippy run before the gate was filtered through\n`grep -E \"^error|^warning: unused\"`, which discarded the one lint that mattered.\nA filtered lint run is not a lint verdict. Re-run afterwards as\n`cargo clippy -p tillandsias-podman --all-targets -- -D warnings`, reading the\nEXIT CODE: 0.\n\nTHE SHAPE TEST NEEDED A FIX OF ITS OWN, found by re-running the mutation arm\nafter the type change rather than trusting the earlier verification: it\ndetected declarations with `starts_with(\"static \")`, and the real declaration is\n`pub(crate) static`. As written it would have MISSED the only lock in the tree\nand passed a two-lock tree. It now admits `pub static` and `pub(crate) static`,\nand the mutation arm reds against the tokio-typed second lock:\n  \"backend.rs:372: static SECOND_LOCK: tokio::sync::Mutex<()> = ...\"\n\nCrate after the correction: 177 passed, 0 failed; clippy -D warnings exit 0;\ncargo fmt --check clean."
