      summary: >
        A CORRECTION I OWE THIS PACKET AND TWO OF MY OWN. I filed 864-dvhk and
        864-c956 BLOCKED on this one, saying a low-end host could not obtain a
        model above 0.5B: "the inference container has no registry egress (curl
