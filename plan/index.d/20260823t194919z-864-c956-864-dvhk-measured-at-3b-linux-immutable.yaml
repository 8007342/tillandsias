        So neither packet was ever blocked by this one. I tested the SYMPTOM
        (egress fails) and filed the blocker I expected rather than the one that
        was there — the same shape as the defects this host has been finding all
        week, committed by me while filing affordances about it.

        SECOND OBSTACLE, worth recording because it will bite the next host:
        running ollama against the shared model cache on Silverblue needs BOTH
        --userns=keep-id:uid=1000,gid=1000 (the image runs as uid 1000; rootless
        podman otherwise maps host 1000 to container 0 and the binary is not
        executable) AND --security-opt label=disable (SELinux is Enforcing and
        denies exec from the bind mount). Without the second, the container
        exits 126 with a bare "Permission denied" that reads as a broken image.

        This packet's own rescoping stands and is now independently supported:
        isolated loads pass. phi3.5:3.8b loaded and served fine here with
