    context: |
      The 743-y5wh fix reads the addendum from the MOUNTED CHECKOUT and claims
      "fail-soft by construction". The gate is `[[ -r "$addendum" ]]` followed by
      an UNBOUNDED `cat "$addendum"` (lib-common.sh:3884-3888), wrapped only in
      `2>/dev/null || true` — which cannot help a `cat` that never terminates.

      Measured with the block extracted verbatim (timeout-bounded here; a real
      launch has NO timeout around `inject_startup_context`, entrypoint-forge-opencode.sh:132):

        addendum path = FIFO             -> `cat` blocks forever: launch HANGS
        addendum path = symlink->/dev/zero -> HANGS and grows the context file
                                              259MB in 3s before the test timeout

      Both are reachable from a push. Git stores symlinks as mode 120000, so a
      committed `startup-context-addendum.md -> /dev/zero` (or any char device,
      or a symlink chain landing on a FIFO) hangs EVERY in-forge launch forever
      with no error, while the `|| true` swallows the visible failure mode.
      `[[ -r ]]` is true for FIFOs and character devices; `[[ -f ]]` is false for
      both, true for the legitimate regular file — verified empirically.
    exit_criteria:
      - "A FIFO at the addendum path does not hang inject_startup_context (launch completes normally)."
      - "A symlink to /dev/zero does not hang and does not grow the context file."
      - "A legitimate regular-file addendum still appends verbatim."
    notes: |
      Also the seed of 747-iavs (size bound): even for a regular file, the read
