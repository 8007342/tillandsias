events:
  - packet_id: enclave-ca-bundle-lives-in-tmp-so-containers-cannot-restart
    event:
      type: progress
      ts: "2026-09-03T17:19:59Z"
      agent_id: linux-yoga-claude-20260903t170918z
      host: yoga
      summary: |
        THE FAILURE IS NOW NAMED WHERE IT HAPPENS, and the reproduction was used
        before it was repaired. scripts/check-enclave-ca-consistency.sh, wired
        into cycle-preflight as an advisory `+ca-<state>` segment.

        WHAT IT DETECTS, verified against the LIVE broken state on this host
        rather than a fixture — this was the only machine in the fleet sitting in
        it, which is why I left it broken across two cycles:

            $ scripts/check-enclave-ca-consistency.sh
            desync:enclave-ca-key-secret
              cert   /tmp/tillandsias-ca/intermediate.crt (bind mount)
              key    podman secret 'tillandsias-ca-key'
              CAUSE: the CA was regenerated without rotating the secret.

        Two states, both reaching the preflight verdict: `absent:enclave-ca-bundle`
        (the /tmp clean — podman recorded the bind SOURCE, so `podman start` can
        never succeed again) and `desync:enclave-ca-key-secret` (the remedy ran
        and rotated only half the pair).

        WHY THE DESYNC HAPPENS, which the original filing did not have.
        `ensure_proxy_ca_key_secret` DOES refresh the secret with `--replace`,
        and it is called immediately before every proxy launch — so the launch
        path was never broken. What breaks is every OTHER path: `podman start`,
        which is what the health check's own self-heal does
        (check-enclave-service-health.sh:319) and what its printed REMEDY tells
        an operator to do. Both bypass the refresh. The documented remedy is the
        thing that produces the second failure.

        REPAIRED AND RE-VERIFIED, in that order: rotated the secret from the
        current bundle, confirmed `ok:enclave-ca-consistent`, then recreated the
        proxy through the orchestration. Preflight went from `services-down1`
        (five consecutive cycles) to `services-ok`.

        AND THE REPAIR IMMEDIATELY EXPOSED A SECOND, INDEPENDENT DEFECT — FILED
        AS 994-8r3w. With the proxy container REMOVED rather than broken, the
        health check reported
        `ok:enclave-service-health:services=3:up=3:down=0:dead=0:absent=0` and
        preflight agreed. A service that has ceased to exist reads as perfectly
        healthy. The absent-detection loop is built and correct
        (check-enclave-service-health.sh:338-349) and driven by
        `TILLANDSIAS_ENCLAVE_EXPECTED_SERVICES`, which defaults to EMPTY and
        which no production caller ever sets — only the script's own test suite
        passes `--expect`. Proven both directions in the same moment: production
        form gives absent=0, `--expect tillandsias-vault,tillandsias-proxy` gives
        absent=1. So `absent=0` was never a measurement; it is a structural
        constant.

        STILL OPEN ON THIS ROW, and I am not claiming it: the bundle still lives
        in /tmp. This cycle made the failure legible and recoverable, not
        impossible. Criterion 2 — a rebooted host reaching a running proxy with
        no operator hand-repair — is NOT met, and meeting it needs either a
        durable location or a restart path that re-materializes before starting.

        ONE HONEST COST: I said I would preserve this host as the fleet's only
        reproduction, and then I repaired it. That was the right trade only
        because the detector was built and verified against the live state
        first — the reproduction is now encoded in a script that any host can
        run, which outlives the broken container. But the live specimen is gone
        and I cannot hand it to anyone.
