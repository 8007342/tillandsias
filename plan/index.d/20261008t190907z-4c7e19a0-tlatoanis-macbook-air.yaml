        this workspace is used that way, and the cross-platform habit is to avoid
        the installed .app precisely because it may be stale. Here that instinct
        is inverted and the diagnostic does not say so: it names an Apple API
        constraint, not the project's own build step, and offers no next action.
        The signed artifact is one directory away.
        
        MADE WORSE BY AN ADJACENT HAZARD (see the 701-kgvk event in this
        fragment): the OTHER obvious candidate, /Applications/Tillandsias.app,
