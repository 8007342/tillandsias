packets:
  - packet_id: the-smoke-runbook-emits-timing-records-so-toolchain-less-hosts-feed-the-recurrence-rung
    order: 1013-qv7c
    status: ready
    kind: enhancement
    priority: p3
    desired_release: v0.5
    pickup_role: any
    capability_tags: [metrics, smoke, low-end, observability, measure-before-optimize]
    estimated_hours: 3
    depends_on: [cycle-metrics-report-repeated-and-skippable-steps]
    title: |
      A floor host with no toolchain has never written a timing record, because every emitter is a gate step; the published-release smoke it CAN run should emit one record per step so the recurrence rung reaches the slowest hosts.
    context: |
      MEASURED by pirria 2026-09-04: repeat:/recur:/skippable: all read
      source=absent; .cache/metrics/ is an empty directory the probe created;
      the only emitters (build.sh, local-ci.sh, run-litmus-test.sh through
      timing-log.sh) need cargo, which that host lacks. The emitter itself,
      cycle-metrics.sh --emit-timing, is bash and jq and needs no toolchain.
      The smoke runbook's steps (curl install, destructive reset, --init from
      pristine, the forge lane, the final health check) are exactly the slow
      host's real work and today leave no timing trace; pirria measured them
      by hand (reset 25 s, init 6m42s, forge lane 71m30s). Emitting them
      through the same helper makes the floor visible to the rung built to
      find what slow hosts pay, and makes cold provision a step the fleet can
      compare across hosts and releases.
      Provenance: pirria's finding and reasoning; filed by the coordinator.
    exit_criteria:
      - each smoke step wraps its command with timing-log.sh's timing_emit (step names pinned, phase smoke), best-effort so a metrics write can never fail the smoke
      - |
          a floor host with no toolchain shows a non-absent `timing:` source and a
          `recur:` line after one smoke run
      - the smoke's own runbook says the records exist and what they are named
    unscoreable: >
      The pin is the smoke fixture asserting a record per step after a run,
      which does not exist until the emits do; whoever lands them writes it and
      converts this row.
