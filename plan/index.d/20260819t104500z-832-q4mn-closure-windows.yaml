        ONE SECOND IMPLEMENTATION LEFT DISAGREEING, named rather than left to
        be discovered.

        litmus:plan-index-order-uniqueness step 2 runs the cargo binary when
        cargo is present and otherwise falls back to an inline ruby
        reimplementation of the rule. That ruby reads
        `YAML.load_file('plan/index.yaml')[...]['steps']` — the BASE only — so
        on a host without cargo the gate still has the blindness this order
        removed, and now the two implementations disagree by construction.

        Not fixed here: rewriting a multi-line ruby one-liner embedded in a
        YAML scalar at the end of a cycle is exactly the kind of edit that
        looks free and is not, and the fallback is dead on every host that
        builds this repo (cargo is a hard requirement of ./build.sh). Worth
        either teaching the ruby to fold index.d the same way, or deleting the
        fallback outright on the grounds that a host without cargo cannot run
        the gate that matters anyway — the second is probably right, and is a
        decision rather than a mechanical change.
