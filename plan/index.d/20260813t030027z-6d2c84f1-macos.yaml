packets:
  - packet_id: version-guard-fails-open-via-sigpipe-under-pipefail
    order: 702-pwhc
    status: implemented
    desired_release: v0.5
    priority: p0
    title: "Pre-push VERSION guard failed OPEN via SIGPIPE under pipefail — verdict depended on git's runtime"
    kind: defect
    deliverable: "scripts/hooks/pre-push-version-guard.sh + scripts/test-pre-push-version-guard.sh"
    pickup_role: any
    capability_tags:
      - guards
      - release
      - shell
      - hooks
    estimated_hours: 2
    context: |
      Found while investigating why a push the guard had just refused went
      through minutes later under a different branch name. The answer was not
      a branch exemption. The guard was broken.

      THE DEFECT. The decision line was:

        if git diff --name-only "$r" 2>/dev/null | grep -qx "VERSION"; then

      with `set -uo pipefail` at the top of the file. `grep -q` exits the
      INSTANT it matches. git is then killed by SIGPIPE and exits 141, and
      `pipefail` promotes that to the pipeline's status — so the `if` evaluated
      FALSE precisely BECAUSE the match was found early. `version_touched`
      stayed false and the guard allowed the push.

      It is a TIMING race on git's runtime, not a policy and not a size cutoff:

        range origin/osx-next..HEAD    64 files,  ~7 KB  -> rc=0,   REFUSED (correct)
        range 1496e89f..HEAD          445 files, 23.6 KB -> rc=141, ALLOWED (wrong)

      `VERSION` sorts FIRST in `git diff --name-only` output (ASCII uppercase
      precedes lowercase, so it precedes crates/, images/, plan/, scripts/),
      so grep matches on line 1 essentially always. Whether the guard works
      therefore comes down to whether git had finished walking the tree before
      that first line was consumed. On a small range it has; on a large one it
      has not.

      WHY THIS IS p0 AND NOT A CURIOSITY. The guard fails open exactly where it
      is load-bearing. A foreign VERSION only ever arrives through a large
      cross-branch merge — which is the case that produces the long tree walk
      that triggers the race. Small, local, single-purpose pushes (the ones
      least likely to carry an unintended bump) are the ones it still catches.
      The guard's own header says "a guard has to be right to be obeyed"; this
      one was wrong in the direction that produces silent false confidence.

      Observed live: this host was refused a push of osx-next carrying an
      inherited VERSION divergence (702-eusw), then pushed the IDENTICAL
      content to a new branch minutes later with the guard reporting clean. I
      initially concluded that `agent/*` refs were exempt. They are not. There
      is no exemption; the second range was simply large enough to lose the
      race. Recorded because that wrong conclusion is the natural one to draw
      and would have been written into methodology as fact.

      THE FIX. Remove the pipe from the decision entirely: capture the file
      list into a variable, then match with shell pattern matching. No
      subprocess can be signalled, so the verdict cannot depend on scheduling.

      SIBLING SITES — NOT swept in this packet, deliberately, because each
      needs its own reasoning about whether an early exit can strand a writer:
        scripts/hooks/post-commit-expert-refresh.sh:49
        scripts/hooks/pre-push-local-gate.sh:213
      Both are `| grep -q`-shaped in files that set pipefail. Neither is known
      to be wrong; both are unaudited.
    outcome: |
      The VERSION guard's verdict is a function of the commits being pushed
      only, and a regression to the piped form is caught by a fixture that
      actually reproduces the race.
    exit_criteria:
      - "DONE: the range decision contains no pipeline whose left side can be signalled by an early-exiting right side (scripts/hooks/pre-push-version-guard.sh)."
      - "DONE: scripts/test-pre-push-version-guard.sh covers 4 cases — large VERSION-changing range refused, same as a NEW remote branch refused, a range not touching VERSION allowed (negative control), sync-forward allowed. 4/4 pass."
      - "DONE: hand-falsified — restoring the exact `| grep -qx` line makes cases 1 and 2 FAIL and leaves 3 and 4 passing. The fixture was VACUOUS on first write (600 short paths, ~12 KB, did not reproduce) and was widened to ~120 KB after measuring the threshold; that first version is the reason this criterion is written as falsification and not as 'tests pass'."
      - "OPEN: audit the two sibling `| grep -q` sites listed above and either fix or record why each is safe."
      - "OPEN: wire scripts/test-pre-push-version-guard.sh into a CI phase so the guard cannot silently regress; it is currently runnable but not scheduled."
    events:
      - type: filed
        ts: "2026-08-13T03:00:27Z"
        host: macos
        summary: |
          Filed and fixed in the same cycle. Found by chasing an inconsistency
          — the same content refused on one branch and accepted on another —
          rather than accepting the convenient explanation that agent/* refs
          were exempt.
      - type: implemented
        ts: "2026-08-13T03:00:27Z"
        host: macos
        summary: |
          status 'implemented' with evidence_refs: pipe removed from the range
          decision; test-pre-push-version-guard.sh 4/4 pass; hand-falsified
          (piped form restored -> cases 1+2 fail, 3+4 pass); measured
          reproduction threshold ~28KB of diff output, real-world case 23.6KB.
          Residuals named in exit_criteria: two unaudited sibling grep -q
          sites, and the fixture is not yet wired into CI.
