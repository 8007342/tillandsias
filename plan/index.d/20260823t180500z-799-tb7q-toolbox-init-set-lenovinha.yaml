# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by linux_immutable (lenovinha), 2026-08-23T18:05:00Z.
packets:
  - packet_id: meta-orchestration-compaction-zero-removed-lines-invariant-is-false
    order: 865-ng6r
    status: ready
    desired_release: v0.5
    priority: p3
    kind: bug
    title: the meta-orchestration skill states compaction produces "zero removed lines" — false since field-setting fragments exist, and it costs every agent an investigation
    deliverable: the skill's Ledger-compaction section states the ACTUAL invariant (base bytes are never re-serialized; removed lines are last-write-wins field supersessions and are expected), so a non-zero removed-line count stops reading as evidence of data loss
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags:
      - methodology
      - ledger
      - documentation
    estimated_hours: 1
    context: |
      OBSERVED (lenovinha, 2026-08-23T17:45Z), on a routine eligible compaction:
      29 fragments folded, diff was +888/-17. The skill says:

        "the `plan/index.yaml` diff was 1021 added lines and **zero removed
         lines**. That zero is the property to protect"

      So a non-zero removal count reads as exactly the corruption the paragraph
      warns about, and I stopped the cycle to investigate it. The investigation
      cost several minutes and four tool calls before it resolved to NOTHING
      WRONG: the 17 removed lines were 5x `status: ready` and one multi-line
      `next_action` on order 849-tz8g, every one of them REPLACED by a newer
      value that a `set-field` fragment carried. That is last-write-wins field
      application working correctly. 25 `status:` lines were added in the same
      diff.

      The 849-tz8g case is the clearest: the superseding next_action opens
      "RESCOPED (unchanged, restored after I clobbered it)" — a sibling host had
      already overwritten and restored that field, so the fold was propagating a
      correction, not destroying one.

      WHY THE PROSE IS WRONG RATHER THAN THE CODE. The zero was a real
      measurement, taken on 2026-08-03 (order 582-4wdi, commit 81e12b65) when
      the fold only ever APPENDED new packets and events. Fragments that SET AN
      EXISTING FIELD came later; the moment they did, a correct fold must remove
      the superseded line. The invariant was never updated, so it now describes
      a fold that can no longer exist.

      THE PROPERTY WORTH PROTECTING IS STILL REAL, and the fix must keep it —
      it is just not "zero removed lines". It is that the fold is TEXT-LEVEL and
      never round-trips the YAML: comments survive, the four-space item prefix
      `append-event` locates by survives, and no line is removed EXCEPT one
      whose field a fragment explicitly reassigned. Both halves were true here
      (120 comment lines preserved, 549 packets, integrity `ok:`).

      This is the reduction-engine "log things that make you slower" case: the
      doc turned a healthy routine step into a stop-and-investigate, and it will
      do so for every host that compacts, every time, until it is corrected.
  - packet_id: fragment-fold-silently-ignores-unrecognized-entry-keys
    order: 866-pvsx
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: an `events:` entry carrying an unrecognized key is silently dropped by the fold and every gate still reports ok — the write appears to succeed and does nothing
    deliverable: an entry under `events:` whose payload key is neither `event:` nor a recognized directive is NAMED on stdout by `tillandsias-plan check` (the way `fragment-misplaced-definitions` names misplaced definitions), so a no-op ledger write cannot present as a successful one
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags:
      - ledger
      - fail-loud
      - validation
    estimated_hours: 3
    context: |
      OBSERVED (lenovinha, 2026-08-23T18:05Z), by making the mistake. To
      release a claim and carry a residual forward I hand-wrote a fragment
      entry:

        - packet_id: builder-toolbox-init-set-too-small-for-the-dispatch-pattern
          set_field:
            status: ready
            next_action: |- ...

      `set_field:` is not a key the fold recognizes — the sanctioned path is the
      `set-field` SUBCOMMAND, which writes its own fragment in the real shape.
      Every gate accepted it: `yq` parsed it, `closure-evidence-check` said
      `ok:closure-evidence:0 checked`, `fragment-misplaced-definitions` said
      nothing, and `tillandsias-plan check` said `ok: 550 packets, ids unique,
      live references sound`. The packet count even ROSE by one, because the
      `packets:` half of the same fragment folded correctly — so the fragment
      looked actively successful.

      It was not. `expire-claims --list-live` still showed 799-tb7q claimed by
      this host. The status change and the next_action had gone nowhere. I only
      caught it because I ran the claim listing to confirm, which nothing
      required me to do.

      WHY THIS IS THE 812-d45t SHAPE, ONE STEP OUT. That order added
      `fragment-misplaced-definitions` for a packet written under the wrong KEY
      (`events:` instead of `packets:`) — the same failure mode, caught for one
      specific mistake. The general case is untouched: any unrecognized payload
      key under `events:` is skipped in silence. The existing check is a
      denylist of one known error where an allowlist of known-good keys is what
      the situation calls for.

      WHY IT MATTERS MORE THAN A TYPO USUALLY WOULD. Fragments are IMMUTABLE
      once committed, and the fleet writes them concurrently from five hosts. A
      silently-dropped directive is therefore permanent: nothing will re-apply
      it, and the only evidence it was ever attempted is a committed file that
      every tool reports as fine. The failure mode is a host that believes it
      released a claim and did not — which strands the packet from BOTH `ready`
      queries and burndown for 24h until the reaper runs. That is exactly
      641-e2qa, reachable by an honest mistake rather than by an abandoned
      cycle.
events:
  - packet_id: enclave-squid-proxy-chronic-segfaults-unwatched
    event:
      type: progress
      ts: "2026-08-23T18:12:00Z"
      agent_id: linux-lenovinha-fable5-20260823T173512Z
      host: linux_immutable
      summary: |
        THIS ROW IS MARKED `implemented` AND THE BEHAVIOUR IT PROMISED IS NOT
        PRESENT ON THIS HOST. Not a re-report of the old shape — a live
        reproduction, on lenovinha (Silverblue), found by cycle-preflight rather
        than by anything watching the proxy.

        WHAT THE HOST LOOKED LIKE. `tillandsias-proxy` had been Exited for
        2d22h with `restarts=0`, and `tillandsias-inference` Exited rc=137
        (SIGKILL) for the same 2d22h, also `restarts=0`. `podman inspect
        .HostConfig.RestartPolicy.Name` returns **`no`** for BOTH. So the
        deliverable's first branch (restart under supervision with a crash
        counter in diagnostics) is not in effect here, and its second branch
        (fail the lane loudly when it dies) did not fire either: nothing
        alarmed for nearly three days. The only reason I know is that
        `scripts/cycle-preflight.sh` prints the container census, which is a
        different mechanism than this packet asked for and reports at cycle
        start rather than at death.

        THE CRASH IS NO LONGER A SEGFAULT, AND THAT MATTERS FOR THE ROOT-CAUSE
        HALF OF THIS PACKET. The old census was 263 SIGSEGVs. What this host
        has is deterministic and immediate — `podman start` brings it up and it
        exits rc=1 within seconds, every time, with squid 6.12 saying:

          WARNING: '/etc/squid/certs/intermediate.key' X509_check_private_key() failed
          WARNING: 'HTTP_port [::]:3128' missing private key in '/etc/squid/certs/intermediate.key'
          FATAL: No valid signing certificate configured for HTTP_port [::]:3128

        The intermediate key does not match the signing certificate squid
        loaded (`CN=Tillandsias CA`). That is a provisioning mismatch, not
        traffic-triggered memory corruption, so it will not respond to anything
        aimed at the segfault. Image is localhost/tillandsias-proxy:v0.4.260817.1.

        A PLAUSIBLE MECHANISM, FLAGGED NOT CONFIRMED — I did not chase it,
        because the remedy touches the running enclave stack and this was not my
        packet. 755-qcxh moved the key from a bind-mount to a podman secret
        (`tillandsias-ca-key`), and 23235's sequencing note records hosts
        carrying a STALE pre-fix `/tmp/tillandsias-ca/intermediate.key` from
        before that change. A cert regenerated on one side of that migration and
        a key surviving from the other side would produce exactly this
        mismatch. Whoever takes this should check whether the secret and the
        cert were generated in the same pass before assuming squid is at fault.

        `tillandsias-inference` RESTARTED CLEAN and is healthy — its last log
        lines are ordinary 200s on /api/version, so it was killed from outside
        (reboot or OOM), not a crash loop. I left it running. The proxy I left
        stopped: it cannot start, and re-running `podman start` in a loop would
        only add noise to a deterministic failure.

        SUGGEST THIS ROW MOVES OFF `implemented`. Its own completion gate is
        unmet on a host that has the fix's image, and the observation above is a
        second independent sighting of "enclave service dies, nothing notices,
        for days" — the first was 2026-08-16. Two hosts, two months apart, same
        silence. Noting the overflow rather than promoting it, per the
        Tlatoani-gated promotion rule.
  - packet_id: builder-toolbox-init-set-too-small-for-the-dispatch-pattern
    event:
      type: progress
      ts: "2026-08-23T18:05:00Z"
      agent_id: linux-lenovinha-fable5-20260823T173512Z
      host: linux_immutable
      summary: |
        FIRST SLICE CLOSED AND MEASURED — the init set now carries the four
        tools, so the ~50-script sweep is unblocked. Done on the host that
        actually pays this cost: lenovinha is Silverblue, so every ./build.sh
        here re-execs through with-tillandsias-builder.sh.

        WHAT CHANGED (scripts/with-tillandsias-builder.sh):
        (1) the dnf init set gained `jq yq ripgrep openssl`;
        (2) `_toolbox_initialized` now requires all four, so PRE-EXISTING
            toolboxes across the fleet re-run init and pick them up rather than
            staying silently short. That is the same pattern the musl-gcc
            comment (yoga, 2026-08-23) established directly above it, and
            without it the change would only ever reach freshly-created
            toolboxes.

        MEASURED, not inferred — the deliverable asked for first-run init cost
        before and after. Availability probed in the live toolbox before
        editing: jq 1.8.1, ripgrep 15.2.0, openssl 3.5.7, yq 4.53.3 all present
        in Fedora 44 repos. Install of the four: 6.3 MiB downloaded, ADDED
        INIT COST 8 SECONDS wall-clock. For scale, this host's first forced
        `--check` on a fresh checkout is ~132s (the yoga figure, 850-bif2), so
        the init set grows by ~6%.

        yq IS mikefarah v4 (`yq (https://github.com/mikefarah/yq/) version
        v4.53.3`), verified by running it — this matters because Fedora has
        shipped the kislyuk python wrapper under the same binary name and the
        two take different syntax. v4 is the one whose `yq . <file>` matches
        what the skill's finalization YAML-validation step names, so the
        toolbox fallback and the host path now agree.

        VERIFIED: all four resolve inside the toolbox, and the extended
        `_toolbox_initialized` probe exits 0 against this host's toolbox, so
        init is idempotent and will not re-run in a loop.

        openssl was ALREADY on PATH in the base image — I added it anyway and
        the comment says why: the dispatch pattern needs a guarantee, and an
        inherited base-image binary is an accident that a future image bump can
        withdraw without any signal.

        RESIDUAL, deliberately not taken in this cycle: the ~50 bare-jq / rg /
        openssl callers still assume the host has the tool, and the two nix
        capability probes still judge by host binary alone. Those are now
        POSSIBLE for the first time — the precondition was the blocker — but
        converting 50 scripts unattended is a much wider blast radius than
        growing an init set, and two of the named callers (tray-diagnose.sh,
        diagnose-macos-provision.sh) run on END-USER machines where no
        tillandsias-builder toolbox exists at all, so they cannot take the
        documented fallback unchanged. That distinction wants deciding before
        the sweep, not during it.
