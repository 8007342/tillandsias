        I BUILT THAT AND THEN TESTED WHETHER IT COULD FAIL. It could not. The probe and the fixture read the SAME spec with equivalent filters, so the partition holds almost by construction. I proved it by deliberately loosening the probe filter from exact comma-delimited membership to a substring match and re-running: ALL THREE PLATFORM ARMS STILL PASSED. A check that cannot fail is decorative, and I nearly shipped one into a packet whose entire subject is that unfalsifiable claims drift.

