  title: The lane adoption tests bind under a short runtime root, so they run on macOS
  context: 'mcp_socket::lane_adoption_tests, added with 1863-eckw, never set XDG_RUNTIME_DIR. On darwin the lane socket landed under TMPDIR (/var/folders/<hash>/T/), past the 104-byte sun_path cap, and four tests panicked with "path must be shorter than SUN_LEN". This made every darwin full gate red (measured on work/1879-fi7q, 2026-10-26). On Linux the tests wrote under the real /run/user dir. The fix holds a short /tmp runtime root under the env lock for each test, the 1581-sunl remedy. It does not cfg-skip, so macOS keeps lane-adoption coverage.'
  exit_criteria:
  - 'cargo test -p tillandsias-headless --features tray,listen-vsock --bin tillandsias lane_adoption_tests passes on darwin and on Linux. Pre-fix result: FAILS on darwin, 4 of 5 tests panic with "path must be shorter than SUN_LEN".'
  verifiable_closure: 'cargo test -p tillandsias-headless --features tray,listen-vsock --bin tillandsias lane_adoption_tests passes on darwin and on Linux. Pre-fix result: FAILS on darwin, 4 of 5 tests panic with "path must be shorter than SUN_LEN".'
