  estimated_hours: 6
  title: A crashed forge relaunches and reconnects by itself when it is safe
  context: 'The operator''s eventual goal. The proposed safety gates: the verdict is a crash (never a clean exit or user quit); memory pressure (/proc/pressure/memory) has stayed below the oomd threshold for at least 20s; the vault is unsealed; at most 3 attempts per container, backing off 10, 60 and 300s; the hold window is still open; and no live container holds the name (remove_container_unless_running, main.rs:16163). True reconnection needs the durable session and rejoin verb (1911-3dqo); until then, relaunch means a new container with Continue.'
  depends_on:
  - lane-end-classifier-tells-a-forge-crash-from-a-normal-exit
  - forge-is-killed-by-systemd-oomd-and-its-session-cannot-be-rejoined
  - forge-crash-offers-relaunch-with-a-continue-checkbox
  exit_criteria:
  - 'The gates are specified and each one has a fixture; three crashes in 60s make the fourth relaunch refused, which FAILS on today''s code.'
  - 'With the durable session in place, a killed attach client reconnects automatically to the still-running agent.'
  unscoreable: 'research row: closure is the gate spec plus its fixtures.'
  next_action: 'Spec the gates and the attempt ledger after 1912-n2i8 and 1911-3dqo.'
