  title: After a forge crash the held window offers "Forge crashed, relaunch?" with a [ ] Continue checkbox
  context: 'Operator request 2026-10-28. The hold window is already open after a crash, so it is the cheapest surface: a TUI prompt in run_hold_window (main.rs:18296-18320) that first resets terminal modes (1911-kk84). Continue relaunches the lane with the agent''s resume flag (codex resume --last, and claude or opencode once 1912-uj2f lands); without it, a fresh session starts. It appears only when the lane-end verdict (1912-n2i8) is a crash (Oom, Oomd, Signal, Failed), never on a clean exit or user quit. UX is gated: methodology.yaml:166 requires explicit operator approval, so a mock-up of the text and layout goes to the operator before it is built. Macron art is the GTK phase (1912-v2yp).'
  depends_on:
  - lane-end-classifier-tells-a-forge-crash-from-a-normal-exit
  - hold-window-leaves-terminal-modes-on-after-a-signal-death
  exit_criteria:
  - 'The operator approves a mock-up of the prompt.'
  - 'On a crash verdict the window shows the prompt; with Continue checked the relaunch argv carries the resume flag; a fixture drives stdin and asserts the argv. It FAILS on today''s code.'
  - 'A clean exit or user quit shows no prompt.'
  verifiable_closure: 'cargo test -p tillandsias-headless hold_window_offers_relaunch_after_crash'
  next_action: 'Draft the mock-up for operator approval while 1912-n2i8 lands.'
