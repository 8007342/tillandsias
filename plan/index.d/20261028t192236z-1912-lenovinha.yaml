packets:
- packet_id: lane-end-classifier-tells-a-forge-crash-from-a-normal-exit
  order: 1912-n2i8
  status: ready
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags:
  - headless
  - linux
  estimated_hours: 5
  title: A lane classifies how its forge ended (clean, user quit, failed, signal, OOM, systemd-oomd, host shutdown) and records it
  context: 'Today a crash looks like any other non-zero exit. run_container_attached_observed (crates/tillandsias-podman/src/client.rs:1108-1140) collapses the status, and hold_window_line (main.rs:18212-18227) prints only exit N or signal S. Podman oom and died events are already parsed (events.rs:457-463, 649-667) but nothing consumes them for the forge, and the emitter stops right after the attach returns (main.rs:16616-16625). --rm plus cleanup_forge_ram_workspace removes the container before it can be inspected. A systemd-oomd kill is a SIGKILL from outside the cgroup, not OOMKilled=true, so only the journal line naming the libpod scope separates oomd from the kernel OOM killer. When oomd kills the scope, the lane process can die with it (the operator saw signal 9), so the verdict must also be readable by run_hold_window.'
  exit_criteria:
  - 'A LaneEnd enum is computed between the attach returning and cleanup (main.rs:16607-16616) from the exit status, podman inspect or events, the harness-supervisor evidence, and the oomd journal within a few seconds.'
  - 'The verdict is written to a sidecar next to attached-sessions/<container>.log; run_hold_window and the tray read it, and the hold window prints the kind.'
  - 'A fixture feeding died exit 137 plus an oom event asserts Oom, and one with an oomd journal line asserts Oomd; it FAILS on today''s code (there is no type).'
  verifiable_closure: 'cargo test -p tillandsias-headless lane_end_classifier'
  next_action: 'Add the enum and its pure classifier with fixtures, then wire it before cleanup and add the sidecar.'
  provenance: 'Fable research pass 2026-10-28 (lenovinha), after the Codex forge was killed by systemd-oomd (1911-3dqo).'
  events:
  - type: filed
    ts: '2026-10-28T19:22:36Z'
    host: lenovinha-silverblue
    summary: filed at the operator's request; crash detection is the base for the relaunch prompt
- packet_id: forge-agent-sessions-survive-a-crash-for-every-agent
  order: 1912-uj2f
  status: ready
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags:
  - headless
  - forge
  estimated_hours: 4
  title: Claude and OpenCode session history is lost with the container, so Continue has nothing to resume
  context: 'Codex is fine: codex-safe-state.sh symlinks CODEX_HOME sessions and its SQLite into the per-project cache volume (main.rs:9571), which survives --rm, so codex resume --last works in a new forge. Check that the per-worker CODEX_HOME suffix (main.rs:8736) is stable across a relaunch. Claude keeps ~/.claude on a tmpfs home and vaults only its credentials (main.rs:13439, 17224), so claude --continue finds nothing. No persistence was found for OpenCode data (~/.local/share/opencode). The work tree /home/forge/src is a per-launch tmpfs removed by cleanup, so uncommitted work is lost; that is what push-often (1911-vwjx) and the durable session (1911-3dqo) address.'
  exit_criteria:
  - 'Claude project sessions and OpenCode session data live on the project cache volume (never credentials); a fixture asserts the mount and symlink layout and FAILS on today''s code.'
  - 'A relaunch of each agent with its continue flag finds the prior session; the Codex worker suffix is proven stable.'
  verifiable_closure: 'A litmus step that lists the forge''s persisted session dirs per agent.'
  unscoreable: 'unpinnable-until-the-guard-exists: the session-dir litmus lands with the fix.'
  next_action: 'Mirror codex-safe-state.sh for claude and opencode, excluding credential files, and add the litmus.'
  provenance: 'Fable research pass 2026-10-28 (lenovinha).'
  events:
  - type: filed
    ts: '2026-10-28T19:22:36Z'
    host: lenovinha-silverblue
    summary: filed; Continue needs a session that survives the container
