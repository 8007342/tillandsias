    order: 627-k4mz
    status: in_progress
    desired_release: v0.5
    role: runtime
    priority: p1
    kind: bug
    title: |
      Inference CA override REPLACES the 146 public roots, so squid-spliced upstreams fail verification and the container exits 1 while blaming the proxy.
    deliverable: plan/issues/inference-ca-bundle-replaces-system-roots-2026-08-09.md
    depends_on: []
    pickup_role: linux
    owner_host: linux
    capability_tags:
      - inference
      - containers
      - tls
      - proxy
      - cold-start
      - cross-platform
    estimated_hours: 2
    problem: |
      VERIFIED live on the Windows field host 2026-08-09, image localhost/tillandsias-inference:v0.4.260809.2, container state Exited (1).

      `CURL_CA_BUNDLE` and `SSL_CERT_FILE` REPLACE the default trust set; they do not augment it. images/inference/entrypoint.sh pointed both at /etc/tillandsias/ca.crt, which holds exactly ONE self-signed certificate (subject == issuer == "Tillandsias CA"). That discards the 146 public roots the image ships at /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem.

      squid SPLICES github — order 313 recorded this verbatim ("github is SPLICED by squid — real Sectigo chain against the system store; HTTP 200, 1.4 GB") — so curl is handed GitHub's genuine public chain with no root to anchor it. Result: `curl (60) unable to get local issuer certificate` on all five egress probes, then "FATAL: proxy egress never became ready", then "no ollama binary available — exiting". The proxy was healthy the entire time; the message names the wrong subsystem.

      The system trust store, which WOULD have merged both, cannot be written: store_rc=1 because the container runs as uid 1000 and the Containerfile chowns only source/anchors. So the correct mechanism is unavailable and the fallback breaks the working path.

      CONTROLLED EXPERIMENT (same host, same network, same URL, one variable changed): system store -> "OK: system store verifies github"; CURL_CA_BUNDLE=<enclave CA only> -> curl (60), byte-identical to the container log.
    why_it_matters: |
      This is a regression introduced by order 486's own fix. Its 2026-07-28 progress event states the intent — export CURL_CA_BUNDLE so squid's bumped error page "can never read as a CA problem" — and it does prevent that misreading. It also makes every spliced upstream genuinely unverifiable, which is strictly worse: the old symptom was a misleading message, the new one is a container that cannot start at all.

      Blast radius is every host, not just low-end ones. It is masked because lanes soft-degrade when inference is absent (5ddc80db warn-and-continue), so the operator's opencode session ran fine while inference was dead — the failure is invisible unless someone reads `podman logs` on an exited container.
    fix_landed: |
      images/inference/entrypoint.sh builds the bundle the trust store would have produced: public roots THEN the enclave CA, written to ${TMPDIR:-/tmp} (writable at uid 1000; $HOME is not guaranteed writable once the models volume mounts beneath it), with both variables pointed at it. Falls back to the previous enclave-only behaviour with a loud WARN when no system bundle is readable. The ca-trust diagnostic now reports mode=, bundle= and cert count.

      VERIFIED INSIDE THE REAL IMAGE at the real uid (podman run --entrypoint /bin/bash, CA mounted as the launcher mounts it):
        uid=1000 mode=system+enclave bundle=/tmp/tillandsias-ca-bundle.crt certs=147
        NEW combined bundle -> github: PASS: github verifies
        OLD enclave-CA-only  -> github: FAIL rc=60 (shipped behaviour)
      147 = 146 public + 1 enclave. The enclave side needs no separate proof: the combined file is a concatenation, hence a strict superset that cannot verify less than before.

      bash -n clean. NOT yet exercised through a real image build.
    exit_criteria:
      - |
          The inference image is rebuilt and a cold first launch completes the ollama self-install through the proxy (no curl 60, no exit 1). This is the residual and it is Linux-owned — the entrypoint change is inert until the image is rebuilt.
      - |
          A litmus or in-container probe asserts the effective CA bundle contains BOTH a public root and the enclave CA, so a future change cannot silently drop either half again.
      - |
          The egress-probe summary distinguishes a trust failure (curl 60) from a reachability failure (curl 7/28) instead of reporting "proxy egress not ready" for both. The raw curl error is already printed; only the summary line misdirects.
      - |
          Packet 486 exit criterion 1, recorded closed 2026-07-28, is re-read against this finding — that closure is what introduced the regression.
    notes: |
      Filed from a Windows host but owned by Linux: the residual is an image rebuild plus cold e2e. The diagnosis, the fix, and in-image verification of the mechanism are already done and reproducible from the deliverable.
