    priority: p3
    desired_release: v0.5
    pickup_role: any
    capability_tags:
      - rust
      - paths
      - drift
      - single-source
    estimated_hours: 2
    owned_files:
      - crates/tillandsias-core/src/ca_path.rs
      - crates/tillandsias-core/src/guest_bin_path.rs
      - images/default/ca-path.txt
    title: |
      `${HOME}/.local/state/tillandsias` is now declared twice — as a template in images/default/ca-path.txt and as a literal in guest_bin_path.rs — which is the drift 998-qrwu removed, reintroduced one directory over.
    context: |
      FILED BY THE AUTHOR OF THE SECOND COPY, 1019-ivia (14f1aaa5b), rather
      than left as a note in a cycle entry.

      998-qrwu removed 38 copies of the CA directory string and left ONE
      declaration in images/default/ca-path.txt, read by
      tillandsias-core::ca_path (include_str! + ${HOME} expansion) and by
      scripts/lib-ca-path.sh, with scripts/check-ca-path-literals.sh ratcheting
      the literal count so it cannot grow back. 998-3z6g then made that value
      `${HOME}/.local/state/tillandsias/ca`, chosen because the root is durable
      on a rootless Linux host AND creatable in the guest where HOME=/root.

      1019-ivia needed a home for the staged guest binary with the SAME
      property, and used the same root — correctly, because inventing a second
      answer to "where does durable per-user state live" would have been worse.
      But it wrote the root as a fresh literal in
      crates/tillandsias-core/src/guest_bin_path.rs rather than deriving it,
      because ca-path.txt declares one PATH (the CA directory) and not the ROOT
      those paths share, and overloading that manifest was out of 1019-ivia's
      scope.

      SO THE ROOT NOW EXISTS TWICE, reached two ways: expanded from a manifest
      in one place, hard-coded in another. That is exactly the shape 998-qrwu
      existed to remove — two declarations of one meaning — at N=2 instead of
      N=38, which is the moment it is cheap to fix and invisible enough to be
      forgotten. The ratchet does not catch it: check-ca-path-literals.sh
      counts occurrences of the CA PATH, not of the root.

      WHY IT IS p3 AND NOT HIGHER: nothing is broken today and both copies say
      the same thing. The cost is latent and arrives when someone MOVES the
      root — they will find and update the manifest, the ratchet will stay
      green because its subject did not change, and the guest binary will keep
      being staged at the old location while the CA moves to the new one. That
      is a silent divergence on a path that only matters when something else is
      already wrong, which is the same failure profile as the original.
    next_action: |
      Decide where the ROOT is declared, then have both consumers derive from
      it. Two shapes worth weighing rather than assuming: (a) ca-path.txt gains
      a root line and a leaf line, with ca_path and guest_bin_path both
      expanding root+leaf — keeps one manifest, changes the file's contract;
      (b) a `state_root` function in tillandsias-core that ca_path's expansion
      and guest_bin_path both call, leaving the manifest declaring the CA leaf
      only. Whichever is taken, extend or add a ratchet that counts occurrences
      of the ROOT so a third copy cannot appear, because the existing ratchet's
      subject is the CA path and it will not see one.
    exit_criteria:
      - "`${HOME}/.local/state/tillandsias` appears as a declaration exactly once; both ca_path and guest_bin_path derive from it (pre-fix result: FAILS — ca-path.txt expands it, guest_bin_path.rs hard-codes it)"
      - "a ratchet counts occurrences of the ROOT, not only of the CA path, and refuses a rise (pre-fix result: FAILS — check-ca-path-literals.sh counts the CA path only, and is green with the second copy present)"
      - "moving the root in the one declaration moves BOTH the CA directory and the guest-binary staging directory, proven by a test that changes it and asserts both consumers follow (pre-fix result: FAILS — no such test, and the two would diverge)"
    unscoreable: |
      The third criterion is the mechanical pin and it is a cargo test with a
      mutation control (change the declared root, assert both consumers move),
      not a litmus: the expansion happens in Rust and a shell litmus would test
      the manifest rather than the consumers. Recording the shape rather than
      naming a litmus that would be a forward reference 885-92iu refuses.
