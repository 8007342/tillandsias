    pickup_role: any
    priority: p1
    capability_tags: [fleet, coordination, observability, methodology]
    deliverable: scripts/fleet-heartbeat.sh
    depends_on: []
    estimated_hours: 2
    discovered_by: "yoga being reported SILENT for fourteen hours while committing every cycle"
    context: >
      THE COORDINATOR'S HEARTBEAT NAMES TWO STATES AND THERE ARE THREE. It
      reported attestation age and flagged anything past ~6h as SILENT.
      856-s56y's framing — "a silent host is usually a dead terminal, not a
      finished one" — is right about the pair it names, and both of those want
      the same response: go restart it. The third state wants the opposite.

      MEASURED 2026-08-24, and the numbers are the whole argument:

        yoga, last attestation   2026-08-23T12:11:53Z   14h22m ago
        yoga, last commit        2026-08-24T02:07:03Z      27m ago

      yoga claimed 642-fedr and 776-cm74 at 16:20Z, implemented BOTH completely
      on disk, was interrupted before committing, and then refused three
      successive bootstrap cycles (19:45Z, 21:50Z, 02:00Z) on the dirty-start
      guard. It is alive, looping, and correct: a dirty-start refusal is
      explicitly NOT a work cycle and must not attest. It even pushed a durable
      record of its own wedge — twenty-seven minutes before the coordinator's
      report called it silent.

      SO THE HEALTHIEST POSSIBLE RESPONSE TO BEING WEDGED EMITS THE SAME SIGNAL
      AS BEING SWITCHED OFF. A host that refuses cleanly, files a record, and
      keeps its worktree untouched is indistinguishable from a dead terminal,
      and the difference decides what to do:

        dead    -> restart it
        WEDGED  -> adjudicate its worktree; a restart changes nothing and the
                   next cycle refuses identically

      Ten of yoga's hours passed with the coordinator reporting "silent" each
      time and being wrong each time. Nobody looked, because "silent" during an
      operator stand-down is the expected reading — and that is the trap: the
      stand-down made the wrong classification plausible.

      THE FIX NEEDS NO NEW BOOKKEEPING. Commits already carry the host as
      author on every lane, so "attested long ago BUT committed recently" is
      computable today. It is the absence of the question, not the absence of
      data, that hid this.
    exit_criteria: >
      (1) The report distinguishes healthy / WEDGED / dead / never-attested and
      says which of the two failing states needs a worktree adjudication rather
      than a restart.
      (2) A host that has NEVER attested appears at all — it has no file, so an
      attestation-directory scan cannot see it. The roster comes from the
      capability matrix.
      (3) Mutation control: blind the commit probe and the wedged host must
      collapse back to SILENT, proving the new signal is what separates them.

