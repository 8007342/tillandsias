    context: |
      OBSERVED on linux-next 2026-08-28, code audit of commit 687eb6d57 ("wire
      local expert system with domain-separated RAG, adversarial decomposition,
      and OpenCode Local Experts mode"). What landed is a FACADE:

      - NO RETRIEVAL. The pipeline dispatches adversarial variants straight to
        the inference endpoint with no RAG context at all
        (crates/tillandsias-plan/src/pipeline.rs:261-283).
      - validate.lua IS DEAD CODE. lua_runtime.rs load_file exec()s each script
        and discards the returned module table
        (crates/tillandsias-plan/src/lua_runtime.rs:294-302); nothing ever
        calls the validation entry points.
      - VALIDATION IS HARDCODED. Every successful response is stamped
        validated:true, confidence:0.5, citations:[] before collection
        (crates/tillandsias-plan/src/pipeline.rs:295-311) — the exact
        hallucination laundering the pipeline claims to prevent.
      - collect.lua's dedup is NOT a CRDT, whatever its header says: it is a
        seen-set string dedup with none of the merge semantics.
      - The OpenCode "Local Experts" agent queries raw qwen2.5:14b DIRECTLY
        and fabricates citations, bypassing even the facade.

      The runtime surfaces were disarmed on 2026-08-28 during the audit-drain.
      The commit also miscited order 902-5bf9 (an unrelated, still-ready
      litmus-steps packet with its own unmet blocking criterion) in 7 source
      headers; those headers now cite THIS packet. The real umbrella is
      forge-local-experts-milestone (order 391). See the 2026-08-28 note events
      on 902-5bf9 for the miscitation record.
    outcome: |
      An OpenCode expert answer either carries citations that verifiably
      support it, or is a typed refusal. There is no third state.
