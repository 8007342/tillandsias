    value: "scripts/test-salvage-preserves-exec-bits.sh prints\n`ok:salvage-exec-bits:3/3` and exits 0: (1) a scaffold worktree holding\na new scripts/test-x.sh with mode 100644 (the state a Git Bash/MSYS\ncheckout produces) salvaged by scripts/salvage-dirty-worktree.sh reaches\nthe ref with mode 100755 when the file carries a `#!` shebang, and the\nsalvage prints one `note:exec-bit-restored:<path>` per file; (2) a file\nwithout a shebang keeps 100644; (3) scripts/check-script-exec-bits.sh\ncovers scripts/test-*.sh and openspec-bound fixtures (today it reports\n26 checked of ~700 scripts) and refuses\n`violation:script-exec-bits:<path>` for a shebang script at 100644.\nPRE-FIX RESULT: FAILS — measured 2026-09-20: scripts/test-windows-host-\nlane-refusal.sh and its controls were 100644 in git since yolanda's\nsalvage relay (land 27), every --check gate passed, and the v56.9.20.1\nrelease gate refused litmus:windows-host-lane-refusal step 1\n(`test -x`) on the first run of the tier that checks it.\n\n\n[2026-09-22T05:13:28Z macos] \nITEM (1) DELIVERED ON work/1321-2ixp, PR #147. ITEMS (2) AND (3) REMAIN OPEN —\nsalvage restoring the bit at snapshot time, and\nscripts/test-salvage-preserves-exec-bits.sh. This row does not close on #147.\n\nTHE OUTPUT: a `test -x <path>` or `[ -x <path> ]` assertion in a caller is now a\nREQUIREMENT for the bit, outranking both the positive-pattern gate and the\ninterpreter exclusion. Controlled pair, same decider and run, each fixture set to\n100644 and restored to 100755 afterwards:\n\n  test-macos-vz-orphan-diagnosis.sh  (litmus invokes BARE)\n      refused before, refused after\n  test-windows-host-lane-refusal.sh  (litmus invokes via `bash`, asserts test -x)\n      CLEARED before, REFUSED after — naming the caller and the fix\n\nClean tree unchanged at ok:script-exec-bits:26 checked.\n\nTHE SWEEP HAD TO WIDEN TOO, and the decider's own comment warned about it in\nadvance: \"a form it cannot see never reaches the awk, so a widened filter behind\na narrow sweep reports a clean tree it never examined\". The awk pattern was added\nalone first and the pair still read ok. Recorded because the shape generalises —\nthis guard has a pre-filter, and any widening that stops at the filter is\ninvisible.\n\nTHREE SCENARIOS AND THREE MUTATIONS, each redding its own arms:\n  exclusion precedence removed    -> bracket-dash-x-refused\n  positive gate's requires_x gone -> both new refusal arms\n  sweep widening reverted         -> both new refusal arms\nThe narrowness control — an interpreter-prefixed caller with NO assertion must\nstay silent — never reds under any of them. Without it the requirement form\nwould be free to swallow the exclusion whole.\n\nA SECOND DEFECT FOUND WHILE FIXING THE FIRST: the fixture printed its count as a\nLITERAL \"14/14\" while seventeen scenarios ran — the three added here ran, passed,\nand were reported as 14. litmus-script-exec-bit-shape.yaml pins that count\ndeliberately to catch a rewrite that drops coverage, and against a hardcoded\nstring the pin could never have fired. The count is now derived from the\nscenarios that actually ran, verified against the PASS lines printed, and the pin\nmoves 14 -> 17.\n\nTHE GUARD CAUGHT ITS OWN AUTHOR MID-CHANGE, which is the best evidence it works:\na temp-file rewrite (`> tmp && mv`) dropped the exec bit on\nscripts/check-script-exec-bits.sh in the WORKTREE while the index kept 100755,\nand the very check being extended refused it by name — the pre-staging shape\n887-bz88 added. Third instance of that idiom dropping a mode on this host today.\n\n[2026-09-22T10:20:16Z macos] \nITEM (1) LANDED on origin/linux-next at 635649b12 (land 147), verified at that\ntree rather than taken on report: `requires_x` is present in\nscripts/lib/exec-bits-filter.awk, the `test -x` / `[ -x` alternation is present\nin the sweep in scripts/check-script-exec-bits.sh, and\nopenspec/litmus-tests/litmus-script-exec-bit-shape.yaml pins\nok:script-exec-bits-fixture:17. The fix commit 6d0acccc2 is an ancestor of trunk.\n\nTHE ROW STAYS OPEN. Items (2) and (3) are untouched:\n  (2) scripts/salvage-dirty-worktree.sh restores the executable bit for shebang\n      files at SNAPSHOT time, printing note:exec-bit-restored:<path> per file —\n      still zero occurrences on trunk.\n  (3) scripts/test-salvage-preserves-exec-bits.sh with the three arms the\n      original closure names — still absent.\nItem (1) makes the defect VISIBLE in a second instead of 45 minutes; item (2) is\nwhat stops the next Windows salvage carrying it in the first place.\n\n[2026-09-22T10:24:35Z macos] \nITEMS (2) AND (3) DELIVERED ON work/1321-2ixp, PR #154. All three items of this\nrow now have a change; the row closes when #154 lands.\n\n(2) scripts/salvage-dirty-worktree.sh sets 100755 on any staged file at 100644\nwhose first line is `#!`, printing note:exec-bit-restored:<path> per file, in the\nTEMP INDEX before write-tree. SCOPED TO paths_to_stage, never a repo-wide\n`git ls-files -s` sweep: the temp index carries the whole tree, so a wide sweep\nwould flip unrelated files that were 100644 on purpose and silently edit the copy\nthe tool exists to preserve. Best-effort by contract — an unreadable or\nun-restageable path is left as-is, because this runs on the path that preserves\nwork.\n\n(3) scripts/test-salvage-preserves-exec-bits.sh, ok:salvage-exec-bits:4/4, wired\nas gate step 421-1321-2ixp with the darwin regime recorded from a real run.\nNEEDS NO WINDOWS HOST: `git update-index --chmod=-x` reproduces exactly what a\ncore.filemode=false checkout produces, which is how every controlled pair on this\nrow was measured.\n\nTHE TWO ARMS THAT CARRY THE MEANING, and neither is arm 1:\n  * arm 2, the negative control — a file with no shebang keeps 100644 and is not\n    named. Without it the tool could flip everything it stages and arm 1 would\n    still pass.\n  * arm 3 — arms 1 and 2 EVAL A BLOCK EXTRACTED FROM THE TOOL, so a tool that\n    lost the block would make them VACUOUS rather than red. Arm 3 fails when the\n    extraction finds nothing.\nMutation-proven: block deleted -> 1/4 (arm 3 names the vacuity), shebang test\ndropped -> 3/4 naming data.yaml, note line dropped -> 2/4.\n\nDISCLOSED AND NOT CAUSED HERE: scripts/test-salvage-net.sh, the salvage tool's\nother fixture, fails 24 arms on this host — IDENTICALLY with and without this\ndiff, 24 = 24, measured both ways by stashing. It is referenced by no gate step\nand no build.sh line, so nothing runs it; it is one of the 42 standing\nunreferenced fixtures. Not this row's subject, and this row does not pretend to\nfix it."
