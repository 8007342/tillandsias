      summary: |-
        open -a MASKS THIS BUG AND YIELDS A FALSE PASS - carry this before anyone verifies. MEASURED by macneo with ps eww against two trays of THE SAME BUNDLE on one host: a GUI launch (operator, pid 6708) has PATH=/usr/bin:/bin:/usr/sbin:/sbin, while open -a from a terminal (pid 83334) carries the full calling shell PATH including /opt/homebrew/bin. open(1) PROPAGATES THE CALLING SHELL PATH to the launched app; Finder, Dock and Spotlight DO NOT. Both are .app launches and only one reproduces the failure. SO A REVIEWER WHO CONFIRMS THE FIX BY TYPING open -a Tillandsias - the obvious thing to type - GETS A GREEN THAT MEANS NOTHING, and any smoke script launching the app that way has the same hole. TWO CONSEQUENCES. First, the source-scan guard is the right shape for THIS reason and not only the cfg-gating one: a behavioural test that LAUNCHES the app cannot be trusted unless it also pins the environment, because the launch mechanism silently decides the result. A source scan asserting no provisioning spawn names a binary absent from the minimal PATH is environment-, GUI- and feature-independent by construction. Second, where a live check IS wanted, drive the installed binary under env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin - which is how the end-to-end verification on that host was actually run, so THAT RESULT STANDS. THE INSTRUMENT DECIDED THE ANSWER, third time in one day on one machine, after the ps filter and the missing timeout.
