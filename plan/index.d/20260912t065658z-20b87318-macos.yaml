cation Support/tillandsias' AND '/Users/tlatoani/Library/Caches/tillandsias'; D4 uninstall.sh references Caches/tillandsias too. I ran D2 THREE TIMES tonight and the host models dir is now 4.0K and empty, and the guest reports 0 bytes at /root/.cache/tillandsias/models. So the literal deliverable ('survives rm -rf $VM_DIR') IS met, while the COST the packet exists to remove — the ~2.47 GB re-download — still lands in full on every smoke host, every run. That is a scope question for whoever closes this: narrowing the skills to preserve the models dir would change clean-room semantics deliberately (the Windows lane already documents its cache wipe as by-construction), so it is a decision and not an oversight, and it should be decided rather than inherited. DELIVERABLE PART 2, the guest-side models-vs-images split: I have the BASELINE only, and it is honest to call it that. On a fresh cold-provisioned guest with no forge run: rootfs /dev/vda2 250G with 782M USED, /root/.cache/tillandsias 0, models 0, .tools ABSENT, /var/lib/containers 12M. A populated split still needs a forge lane run that actually pulls the engine and a model, which this slot could not do. The 11.33 GiB figure in the context remains unmeasured as a split. WHY THIS MEASUREMENT WAS POSSIBLE AT ALL TODAY: --exec-guest into a macOS guest did not work before this morning — it hung, which is 1084-x8ya. The keying fix (b77559aa7, on linux-next at f51e96382) is what made the packet's own suggested instrument ('--exec-guest du -sh would settle it') usable on macOS. The context's caveat about not probing a live VM is respected: --exec-guest boots and owns its own VM, and no second VM ran against the disk. Releasing to ready rather than holding the claim — the remaining work is a populated-cache measurement plus a scope decision, and a smoke run preempts me shortly.
