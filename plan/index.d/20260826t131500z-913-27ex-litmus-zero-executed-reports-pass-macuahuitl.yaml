packets:
  - packet_id: litmus-runner-reports-pass-when-it-executed-nothing
    order: 913-27ex
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      the litmus runner prints `Status: [PASS]` and exits 0 after executing zero tests, so a filter that matches nothing is indistinguishable from a suite that passed
    deliverable: |
      a run that executed no tests reports a distinct, non-passing verdict — or
      the runner refuses a filter combination that selects nothing
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - testing
      - fail-loud
      - developer-experience
    estimated_hours: 2
    context: |
      MEASURED on macuahuitl 2026-08-26 while closing 899-6pwv, by running a
      real e2e with a phase filter that did not match it:

        scripts/run-litmus-test.sh subdomain-routing-via-reverse-proxy \
          --phase pre-build --size e2e --compact

        PASS:  0
        FAIL:  0
        SKIP:  1 (excluded from coverage)
        Total: 1 (executed: 0, skipped: 1)
        Pass Rate: 0% (0/0 executed)
        Status: [PASS]

      Exit code 0. The same command WITHOUT `--phase pre-build` executes the
      test and returns `Status: [FAIL]`, exit 1 — a real failure at step 3.

      So the phase filter turned a failing suite into a passing one, silently,
      and the only signal was a `SKIP: 1` line above a green verdict.

      WHY THIS IS THE MILESTONE'S SHAPE AND NOT A COSMETIC COMPLAINT. `Pass
      Rate: 0% (0/0 executed)` is printed directly above `Status: [PASS]`. The
      runner has the fact and declines to act on it. Any caller that greps for
      the status line — or reads the exit code, which is the normal case for a
      gate — gets a pass from a run that proved nothing.

      THE CALLER THAT MAKES IT DANGEROUS. `--phase` and `--size` are exactly the
      knobs a CI lane or a smoke gate sets to keep a run cheap. A filter that
      stops matching (a renamed spec, a changed `size:`, a typo) does not fail;
      it goes quiet and green. That is indistinguishable from success at every
      layer above it, which is the property this milestone exists to eliminate.

      RELATED BUT DISTINCT from the meta-orchestration skill's own 822-4vwa
      note, which is about litmus results in a FORGE being a report rather than
      a verdict. This is narrower and mechanical: zero executed must not be
      spelled PASS anywhere.

      NOT A NEW CLASS — the same 2026-08-25/26 shape catalogued in 899-6pwv:
      an artifact standing in for a measurement that was never taken. Here the
      artifact is the word PASS.
    outcome: |
      A green litmus verdict means tests ran and passed, not that none ran.
    exit_criteria:
      - 'A run with `executed: 0` reports a verdict that is NOT `PASS` — `[NO-TESTS]`, `[EMPTY]`, whatever fits the existing grammar — and exits non-zero, OR the runner refuses the empty selection up front. Pick one and state why.'
      - 'NEGATIVE CONTROL, and it is the one that matters: a run where every executed test passes AND some are legitimately skipped must still report PASS. Skips are normal and routine; the defect is zero EXECUTED, not the presence of skips. A fix that turns any skip into a failure is worse than the bug.'
      - 'NEGATIVE CONTROL: a genuinely passing suite still exits 0, and a genuinely failing one still exits 1. Verified against a real spec, not only a fixture.'
      - 'Whatever lands is exercised by a fixture that drives the runner with a filter matching nothing, so this cannot regress silently — which is precisely how it survived until now.'
    verifiable_closure: |
      `scripts/run-litmus-test.sh <spec> --phase <a-phase-it-is-not-in>` exits
      non-zero with a verdict distinguishable from PASS, on a host where today
      it exits 0 with `Status: [PASS]`.
    notes: |
      Found by accident: I ran the e2e with the wrong phase filter, got a green
      verdict, and only doubted it because the summary above it said 0/0. An
      agent moving faster would have recorded that green as evidence — which is
      how this class survives.
