      summary: |
        `compact --help` PERFORMED THE COMPACTION. Reading the usage WAS the
        mutation.

        Found by doing it. I ran `tillandsias-plan compact --help` to learn the
        flags before touching anything — on the one ledger command carrying a
        p0 and a standing operator prohibition — and it folded 27 live
        fragments into the base and deleted them, including three filed earlier
        the same day.

        THE ARM READ NONE OF ITS ARGUMENTS. main.rs's `"compact" =>` branch went
        straight to `compact_text` without inspecting `args`, so every token
        after the subcommand — `--help`, `--dry-run`, a typo, anything — was
        ignored and the fold ran regardless. There was no invocation of this
        command that did not mutate.

        WHAT SAVED IT WAS THE 843-624y FIX ITSELF. The three unfoldable
        capabilities fragments were refused and survived on disk exactly as
        designed, and the 27 folded ones were genuinely carried into the base —
        I spot-checked four distinctive records and found each present. So the
        cost was a revert, not data. Reverted with `git checkout` (everything
        was committed), tree returned to clean, startup boundary re-verified ok.

        I reverted rather than kept it despite the fold looking correct, because
        I had verified 4 of 27 fragments and 796-4ydb is precisely the error of
        generalising from a partial corpus — and because an unsanctioned
        mutation should not be ratified by the fact that it happened to work.

        TWO DEFECTS, ONE LATENT UNDER THE OTHER. 843-624y made compaction safe
        to RUN. It was never safe to INVOKE, and that second defect was
        invisible while the first one dominated: nobody reaches for `--help` on
        a command they have been told not to run at all.

        FIXED. The arm now parses its arguments before doing any work:
          --help/-h    prints usage, exits 0, touches nothing; names
                       `fragments` as the read-only way to inspect the overlay
          --dry-run/-n validates the fold through parse AND integrity, reports
                       what it would consume and refuse, writes nothing
          unknown      refuses with exit 2 and names the argument, rather than
                       compacting
        --dry-run stops AFTER validation deliberately: the useful half of a dry
        run is learning the fold would be ACCEPTED, which only the integrity
        check can answer. A count alone would prove nothing.

        GATE, and I watched it go RED. Thirteen assertions added to
        scripts/test-compaction-coverage.sh (10 -> 23), each checking the LEDGER
        IS UNTOUCHED rather than merely that the command exited 0 — the base
        cksum is compared byte-for-byte and the foldable fragment must still
        exist. Four of them (`--help prints usage`, `--help says MUTATES`,
        `unknown argument REFUSES (exit 2)`, `the refusal names the argument`)
        failed against the pre-fix release binary under these exact assertions
        and pass after, which is the mutation control. A CONTROL assertion in
        the other direction — a bare `compact` must STILL consume the fragment —
        guards against "fixed" meaning "compaction quietly stopped working".

        AND THE FIRST RUN OF MY OWN GATE WAS INVALID, twice over. I wrote the
        fixture fragment against an invented packet_id
        (`compaction-argument-safety-probe`) when the fixture base declares
        `fixture/alpha`, so the fragment was unfoldable and the CONTROL failed;
        and the harness resolves ./target/release while I had built only debug,
        so the first six failures were an old binary plus a bad fixture rather
        than the code. Both are repeats: the invented-slug orphan event I filed
        on 2026-08-21, and 796-4ydb's partial-corpus shape. Checking WHICH
        binary a harness resolves is now the first thing to ask when a new
        assertion fails.

        SO THE PROHIBITION CAN NARROW BUT NOT LIFT. `compact` no longer eats
        unfolded fragments (10/10 before this cycle) and no longer mutates on a
        read-only invocation (23/23 now). What remains is 846-idhn: the
        capabilities channel still has no base representation, so those three
        fragments can never be folded and the overlay cannot fully drain. Use
        `compact --dry-run` or `fragments` to inspect; a bare `compact` is now
        an ordinary deliberate act rather than a p0 hazard.
