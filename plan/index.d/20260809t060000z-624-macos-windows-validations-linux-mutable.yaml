  - packet_id: platform-litmus-expression-pinning-repair
    order: 624-cf9f
    status: ready
    desired_release: v0.5
    priority: p2
    title: "Repair expression-pinned litmus steps in the macOS and Windows columns"
    kind: enhancement
    deliverable: plan/evidence/litmus-expression-pinning-scan-2026-08-09.tsv
    depends_on: [litmus-expression-pinning-candidate-scan]
    pickup_role: any
    capability_tags: [litmus, ci, guards, macos, windows, technical-debt]
    context: >
      622-rmit (approved by The Tlatoani 2026-08-09) produced the ranked candidate list:
      643 of 1762 litmus steps across 300 files match fixed text against source, and 166
      tests carry NO negative control at all. Distribution: 383 steps at score 5, 202 at
      4, 54 at 3, 4 at 2.

      Platform-specific tests are the ones Linux cannot safely repair, because rewriting a
      guard to assert a PROPERTY requires knowing what the property actually is on that
      platform. `litmus:windows-tray-diagnose-cli-surface` alone carries 10 score-5 steps.
    request: |
      On your platform's own cycle, take the highest-scoring tests that belong to your
      column and convert them from expression-pinning to property-assertion.

        scripts/scan-litmus-expression-pinning.sh | head -60

      Windows-owned candidates to start with (score 5):
        litmus:windows-tray-diagnose-cli-surface   (10 steps — highest single test)
      macOS-owned candidates: filter the scan output for macos/darwin/accel tests, e.g.
        litmus:accel-envelope-reaches-the-forge    (6 steps)

      The repair pattern, from 622-rmit's own three fixes:
        - Prefer EXECUTING the thing and asserting its output over grepping its source.
          `scripts/check-installer-channel.sh` is the worked example: it runs an
          installer's own resolution prologue and reports the answer under a falsifiable
          grammar.
        - Every allowlisted indirection pays for itself with its own proving step (the
          `$stamp` / `$index_dir` pattern in litmus-forge-experts-ephemerality-shape).
        - Add a NEGATIVE CONTROL: prove the check FAILS when the property is violated. A
          guard that has never been seen to fail is not known to guard anything.
      Do NOT bulk-rewrite. Each repaired step must still be green for the right reason.
    exit_criteria:
      - At least the top platform-owned test for your column is converted to property assertions.
      - Each converted test gains a negative control.
      - Re-running the scan shows those steps dropped out or scored lower; record before/after counts.
    verifiable_closure: >
      `scripts/scan-litmus-expression-pinning.sh` candidate count for the named tests is
      lower than the 2026-08-09 baseline in plan/evidence/, and the repaired tests pass
      via scripts/run-litmus-test.sh.
    notes: >
      SCOPE LIMIT: this is repair of EXISTING guards only. Making "no new expression-pinning
      guard may be added" an enforced rule is a bar-raise and remains Tlatoani-gated
      (methodology/convergence.yaml -> bar_raise_governance). Do not add such enforcement.

