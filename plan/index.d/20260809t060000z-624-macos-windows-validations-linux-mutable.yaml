  - packet_id: ghost-traces-point-at-nonexistent-specs
    order: 624-9u7n
    status: ready
    desired_release: v0.5
    priority: p2
    title: "Nine @trace annotations name specs that do not exist"
    kind: bug
    deliverable: openspec/specs/
    depends_on: []
    pickup_role: linux
    capability_tags: [openspec, traces, documentation, hygiene]
    context: >
      `./build.sh --check` reports ghost traces on every run and does not block on them:

        spec:enclave-service-catalog        6 refs (crates/tillandsias-headless/src/main.rs)
        spec:macos-tray-build-and-release   3 refs (incl. scripts/install-macos.sh:15)

      A @trace pointing at a nonexistent spec makes the generated trace index assert a
      relationship that has no other end. TRACES.md is regenerated and committed as
      evidence every cycle, so this is wrong evidence being refreshed on a schedule.

      `macos-tray-build-and-release` is an unarchived openspec CHANGE (76 days old) — the
      spec would exist had it been archived. 15 changes are currently unarchived, 6 of
      them 76-86 days old, and the archive-age warnings are printed on every commit and
      ignored on every commit.
    exit_criteria:
      - Every ghost trace resolves: the spec is created, the change is archived, or the annotation is removed.
      - The two named specs specifically are dispositioned, with the reason recorded.
      - A decision (not necessarily an implementation) on whether ghost traces should FAIL --check rather than warn.
    verifiable_closure: >
      `./build.sh --check` emits zero `ghost trace` notices.
    notes: >
      The discard-over-repair bias applies: if `enclave-service-catalog` was never going to
      be written, deleting six stale annotations is the better close than inventing a spec
      to justify them.

