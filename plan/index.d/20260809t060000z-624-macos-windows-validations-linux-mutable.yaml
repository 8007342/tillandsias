  - packet_id: windows-unstable-channel-installer-validation
    order: 624-su5r
    status: ready
    desired_release: v0.5
    priority: p0
    title: "Validate the UNSTABLE channel + portable downloads on a real Windows host"
    kind: validation
    deliverable: plan/issues/windows-unstable-channel-validation-<DATE>.md
    depends_on:
      - unstable-release-channel-and-landing-simplification
      - sha256sums-windows-missing-trailing-newline
    pickup_role: windows
    capability_tags: [windows, release, channels, installer, validation, e2e, wsl]
    context: >
      621-2re2 shipped the UNSTABLE channel and made two NEW Windows artifacts primary
      landing-page downloads: tillandsias-tray.exe and tillandsias-windows-x64.zip. They
      are unversioned aliases of the packaged zip, published so /releases/latest/download
      can link them at all (the versioned filename never could).

      Both were produced and verified only from Linux, by downloading them. Nobody has
      RUN the aliased exe on Windows. And 623-iwq4 — a corrupt SHA256SUMS-windows that
      shipped Cosign-signed in v0.4.260809.1 — was found by verification, not by reading
      code, which is exactly why this packet exists.
    request: |
      Run on a Windows host with WSL2 available. PowerShell unless stated otherwise.

      1. UNSTABLE curl install (the exact one-liner the README publishes):
           $env:TILLANDSIAS_CHANNEL='unstable'
           irm https://github.com/8007342/tillandsias/releases/download/unstable/install-windows.ps1 | iex
         MUST print an "UNSTABLE channel" banner BEFORE downloading.
         MUST resolve .../releases/download/unstable. Then clear the variable and confirm
         a second run resolves /releases/latest/download instead (channel default).

      2. Portable EXE — the landing page's primary Windows download. Download and RUN it
         directly, with no installer and no unzip step:
           https://github.com/8007342/tillandsias/releases/latest/download/tillandsias-tray.exe
         This alias has NEVER been executed. Confirm: tray appears, no flashing consoles,
         WSL2 provisioning starts, --diagnose works. If a bare exe cannot work standalone
         (missing sibling files from the zip), that is a REAL DEFECT in 621-2re2 — file it
         and say so plainly; do not work around it.

      3. Portable ZIP:
           https://github.com/8007342/tillandsias/releases/latest/download/tillandsias-windows-x64.zip
         Extract, run the tray from the extracted dir, confirm parity with step 2.

      4. Checksum integrity — the 623-iwq4 regression check:
           curl -sLO .../releases/latest/download/SHA256SUMS-windows
           (download the versioned zip, the alias zip, and the alias exe)
           sha256sum -c SHA256SUMS-windows      # ALL THREE lines must parse and verify
         v0.4.260809.1 fails this; v0.4.260809.2 must pass. If any line is merged with
         another, the fix regressed — paste the raw file.

      5. install-windows.ps1 is pure ASCII (v0.3.260723.1 regression class — a non-ASCII
         byte made the saved .ps1 parse as a DIFFERENT program):
           $b=[IO.File]::ReadAllBytes("scripts\install-windows.ps1"); ($b | ? {$_ -gt 127}).Count
         Expect 0.
    exit_criteria:
      - Steps 1-5 each recorded with actual output in the deliverable file.
      - An explicit verdict on whether the bare tillandsias-tray.exe alias is USABLE standalone.
      - Step 4 green on v0.4.260809.2, confirming 623-iwq4 is actually fixed in the field.
      - Any FAIL filed as its own plan/issues packet.
    verifiable_closure: >
      plan/issues/windows-unstable-channel-validation-<DATE>.md exists on windows-next with a
      per-step verdict, and `sha256sum -c SHA256SUMS-windows` is recorded fully green for
      v0.4.260809.2.
    notes: >
      Commit findings to windows-next. The standalone-exe verdict in step 2 is the one
      answer Linux genuinely cannot produce and the landing page depends on.

