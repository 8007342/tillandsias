  - packet_id: macos-unstable-channel-installer-validation
    order: 624-q4jj
    status: ready
    desired_release: v0.5
    priority: p0
    title: "Validate the UNSTABLE channel curl installer on a real macOS host"
    kind: validation
    deliverable: plan/issues/macos-unstable-channel-validation-<DATE>.md
    depends_on: [unstable-release-channel-and-landing-simplification]
    pickup_role: macos
    capability_tags: [macos, release, channels, installer, validation, e2e]
    context: >
      621-2re2 shipped a rolling UNSTABLE channel and rewrote the landing page around it.
      It was designed and verified ENTIRELY on Linux. The macOS half — install-macos.sh
      channel selection, the DMG the landing page now advertises as a primary download,
      and the SHA256SUMS-macos path — has never been exercised on Apple hardware.

      This is the highest-value macOS ask right now because the landing page is already
      live advertising these artifacts to anyone who visits the repo.
    request: |
      Run on an Apple Silicon macOS host, in this order. Record every command's actual
      output; a step that is skipped must say so explicitly.

      1. UNSTABLE curl install (the exact one-liner the README publishes):
           curl -fsSL https://github.com/8007342/tillandsias/releases/download/unstable/install-macos.sh \
             | bash -s -- --channel unstable
         MUST print an "UNSTABLE channel" banner BEFORE downloading anything.
         MUST resolve https://github.com/8007342/tillandsias/releases/download/unstable
         (not /releases/latest/download).

      2. Channel-resolution probe (no install, fast, falsifiable grammar):
           scripts/check-installer-channel.sh scripts/install-macos.sh
           scripts/check-installer-channel.sh scripts/install-macos.sh unstable
           scripts/check-installer-channel.sh scripts/install-macos.sh bogus
         Expect base:.../releases/latest/download, base:.../releases/download/unstable,
         and refused:unknown-channel: (exit non-zero) respectively.

      3. Checksum integrity of the macOS artifact set (this is what 623-iwq4 was about
         on the Windows side; confirm macOS has no equivalent defect):
           curl -sLO .../releases/download/unstable/SHA256SUMS-macos
           curl -sLO .../releases/download/unstable/Tillandsias.dmg
           curl -sLO .../releases/download/unstable/tillandsias-tray-<VER>-macos-arm64.tar.gz
           sha256sum -c SHA256SUMS-macos      # every line must parse AND verify
         Report the FULL file contents if any line fails to parse — a merged line is the
         623-iwq4 signature.

      4. STABLE portable download, the other thing the landing page advertises:
           curl -fsSLO https://github.com/8007342/tillandsias/releases/latest/download/Tillandsias.dmg
         Open it, drag to Applications, launch. Confirm the tray appears and provisions
         the Fedora VM. This doubles as the order-455 curl-install e2e still owed for
         v0.4.260809.2 (see plan/issues/stable-promotion-v0.4.260809.2-2026-08-09.md).

      5. Tray launches and reports the expected version:
           /Applications/Tillandsias.app/Contents/MacOS/* --version   (or tray About)
         Expect 0.4.260809.2 or newer.
    exit_criteria:
      - Steps 1-5 each recorded with actual output in the deliverable file.
      - A PASS/FAIL verdict per step; any FAIL filed as its own plan/issues packet.
      - If step 4 passes, say so explicitly — it discharges the order-455 macOS smoke for this tag.
    verifiable_closure: >
      plan/issues/macos-unstable-channel-validation-<DATE>.md exists on osx-next, carries a
      per-step verdict, and either records `sha256sum -c SHA256SUMS-macos` fully green or
      files the defect.
    notes: >
      Commit findings to osx-next (platform branches commit their own plan/ edits; the
      Linux coordinator merges them back). Do NOT wait on Linux for anything here.

