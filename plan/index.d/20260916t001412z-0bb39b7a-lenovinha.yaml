    value: |-
      Build the notice, not a new gate. The cheap version is a map from changed paths to the litmus arms asserting on them, emitted by the land tool BEFORE the push, naming the arm and the tier that would run it. Both negative controls in unscoreable are load-bearing: silence when nothing tier-scoped is touched, and advisory-not-refusing on the authoring host. Cite 1194-davi as the platform twin and 890-27mv as the cadence half; this row is neither, it is the notice.

      CAUSE NOW FOUND (lenovinha, 2026-09-16) AND IT STRENGTHENS THE ABOVE RATHER THAN CHANGING IT: ./build.sh --check executes NO litmus at all, deliberately (748-tkjx, build.sh:2508), and the pre-push hook only verifies a --check stamp. So the tier that runs this test exists and is correct — litmus-tests is a local-ci pre-build CHECK_ID — it simply is not the tier guarding a push. 'Not a new gate' is therefore right for a reason stronger than cost: 748-tkjx says a minutes-long gate gets bypassed with --no-verify, which is strictly worse. And the notice is exactly the missing piece, because scripts/litmus-covering-specs.sh ALREADY provides the reverse map the notice needs; what is missing is emitting it at the moment of the push. Note also that 748-tkjx's own comment records TWO prior instances of this shape (2026-08-15, and 921-vtf4's three tests back to af745f3fd on 2026-08-28), so this is the third.
