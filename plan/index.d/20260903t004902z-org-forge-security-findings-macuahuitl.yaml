# Ledger fragment — append-only, IMMUTABLE once written.
# Findings from macuahuitl-tillandsias.org-forge while building the public explainer.
# ALL FOUR VERIFIED INDEPENDENTLY BY THE COORDINATOR against the tree, not taken on report.
# These are PUBLISHED at tillandsias.org (operator-directed), which raises the value of fixing them.

packets:
  - packet_id: security-litmus-steps-cannot-fail
    order: 972-cvdg
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [litmus, security, fail-loud, soundness]
    estimated_hours: 3
    title: |
      Five litmus steps echo the SAME success token on both branches of a shell OR, so they pass whether the security flag is set or not — and they are the steps that check the hardening flags.
    context: |
      REPORTED by macuahuitl-tillandsias.org-forge; VERIFIED HERE line by line.
      openspec/litmus-tests/litmus-podman-idiomatic-security-flags.yaml lines
      31, 36, 41, 46, 51. Line 41 verbatim:
        ... | grep -q 'keep-id' && echo 'USERNS_KEEP_ID_SET' || echo 'USERNS_KEEP_ID_SET'
      and the step's expected_behavior is USERNS_KEEP_ID_SET. The step emits its
      own success token on the failure branch, so it is structurally incapable
      of going red. Same shape at 46 (CAP_DROP_ALL_SET) and 51
      (NO_NEW_PRIVILEGES_SET), and at 31/36 with a nested fallback.
      SCOPE, MEASURED, and it is the good news: a sweep of the entire litmus
      corpus for "same token on both sides of ||" finds FIVE occurrences and
      all five are in this one file. This is contained, not systemic.
      SECOND DEFECT, and it is why this survived: the steps inspect a container
      the test LAUNCHES ITSELF earlier in the same file with the hardening flags
      typed on its own command line. Even a step that could fail would be
      testing podman's handling of flags the test supplied, not Tillandsias's
      choice to supply them.
    exit_criteria:
      - each of the five steps fails when the flag it names is absent, proven by a mutation that launches the probe container WITHOUT that flag
      - the steps assert against a container the PRODUCT launched, not one the test launched with flags of its own
      - a corpus-wide check rejects any new step whose success token appears on both branches of an OR

  - packet_id: hardening-envelope-has-no-production-enforcement
    order: 972-6vaj
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [security, rust, podman, fail-loud]
    estimated_hours: 4
    title: |
      validate_launch_argv has ZERO production call sites — every caller is test code, so nothing in a shipped binary stops or logs a launch with the hardening flags turned off.
    context: |
      VERIFIED HERE. crates/tillandsias-podman/src/policy.rs:110 defines it;
      every other occurrence in the tree is inside test code
      (policy.rs:289/296/300/317/330 and container_spec.rs:381/538, all
      assertions). The reporter adds that the one non-test reference is a
      debug_assert! in build_run_argv, which is compiled out of release builds.
      Either way the shipped binary validates nothing.
      The four flags are bool fields on a struct (userns_keep_id, cap_drop_all,
      no_new_privileges, label_disable) defaulting true but settable false, and
      cap_add passes through unvalidated. So the spec's word is "immutable" and
      the implementation is "defaults".
    exit_criteria:
      - a release build refuses, or at minimum loudly logs, a launch whose argv lacks a required hardening flag
      - the refusal is proven by a test that runs the RELEASE profile, since a debug_assert cannot
      - cap_add is validated against an allowlist or the field is removed

  - packet_id: control-wire-ships-unauthenticated-by-default
    order: 972-umik
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [security, control-wire, vsock, fail-loud]
    estimated_hours: 5
    title: |
      The secure control wire is opt-in via an environment variable that nothing in the product ever sets, so the shipped default is a plaintext listener bound to any CID.
    context: |
      VERIFIED HERE, with ONE CORRECTION to the report. The reporter wrote that
      TILLANDSIAS_SECURE_CONTROL_WIRE "appears nowhere in crates/, packaging/
      or the installers — only in plan documents". That is FALSE: it appears in
      six files under crates/. What is TRUE, and is the substantive claim, is
      that every one of those occurrences READS it, documents it, or logs it —
      the only "export" in the tree sits inside the message string of a test
      marked #[ignore]. Nothing sets it.
      Default confirmed at vsock_server.rs:85-100: VarError::NotPresent maps to
      Off, and an EMPTY value also maps to Off, so both absence and blank yield
      the plaintext path.
      The reporter also notes the PSK is the SHA-256 of the released binary,
      which authenticates the build rather than the caller, and that per-boot
      key mixing is deferred. Not independently verified here.
    exit_criteria:
      - the secure path is the default, or the plaintext path refuses to bind without an explicit documented opt-out
      - an empty value is a hard error rather than a silent Off, since blank-equals-insecure is the shape an operator sets by accident
      - a test asserts the shipped default of a release binary, not the behaviour of the parser in isolation

  - packet_id: enclave-network-created-without-internal-in-the-shell-path
    order: 972-a8vh
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [security, enclave, network, podman]
    estimated_hours: 2
    title: |
      orchestrate-enclave.sh creates the enclave network without --internal, contradicting a MUST in the enclave-network spec that the Rust launcher honours.
    context: |
      VERIFIED HERE. scripts/orchestrate-enclave.sh:81-84 runs
      podman network create --driver bridge --subnet "$ENCLAVE_SUBNET"
      "$ENCLAVE_NET" with no --internal. The Rust launcher passes it; nothing
      guards the script path, so which binary created the network decides
      whether the enclave is isolated.
    exit_criteria:
      - the shell path passes --internal, and a guard fails if either launcher omits it
      - an existing network created without --internal is detected and reported rather than reused silently
