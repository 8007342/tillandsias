        WHAT THE DEFECT ACTUALLY WAS: not a bug in any one file but a CONTRADICTION
        ACROSS THREE. The hook called work/<order> "the GATED hand-off and demands the
        stamp"; the methodology said pre_push_gate EXCLUDES work/<order> while calling it
        "a GATED commit"; and creation_regex admitted no work/ ref at all. A work branch
