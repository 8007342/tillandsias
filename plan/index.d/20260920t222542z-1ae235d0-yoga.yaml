        measured consequence is the one that should be quoted: 92 salvage/* refs against
        34 work/*, hosts using the emergency RESCUE lane as their everyday branch because
        it was the only ungated one.

        THE ENFORCEMENT TRIGGER HAS ITS PRE-FIX NUMBER, measured against real history
        rather than asserted:
          landing-provenance:7.days:queue=7 plan=75 relay=64 direct=28
          code landings: queue=7 direct=28 of 35
        Direct pushes outnumber queue landings FOUR TO ONE. The migration has not
        happened, which is exactly what this row exists to change and what the operator's
        later flip will be measured against. The reading rule is printed WITH the number
        so it cannot be fitted afterwards to whatever the number turned out to be, and
        plan-only is classified BY CONTENT rather than by subject — a commit that says
