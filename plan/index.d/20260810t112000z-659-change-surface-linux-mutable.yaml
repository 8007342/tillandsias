             The two constants to make per-project.
          B. NO_PROXY — 5 literals containing "git-service,tillandsias-git":
             container_profile.rs:398, :410, :683, :696 and the
             ENCLAVE_NO_PROXY_BASE const at main.rs:1150. If these miss the new name,
