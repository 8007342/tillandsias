      summary: |
        CRITERION 2 MET LIVE (2026-10-13, tlatoanis-macbook-air, operator's VM, PR #400 head e79bcb3c9; darwin preflight refused=0, wall=499s). Identity survives a fresh VM:
        - 16:41:45Z: the operator signs in (cloud-projects: 15 entries).
        - 16:42:43Z: tray kill -9, relaunch. The tray logs "reset: REBUILD (unclean previous stop; the Vault store is on the identity disk, so sign-ins are kept)" and replaces rootfs.img.
        - The rebuilt guest logs "vault unsealed (sealed=false)", with no "vault initialized" and no WIPING.
        - 16:44:12Z: cloud-projects: 15 entries, with no device login.

        Runs 1 and 2 failed and each found a real bug. The partial-init guard wiped the surviving store because the share's fallback copies were on the rootfs: first because they were written there, then because no session ever rewrote them. Fixed in ffae052d9 (fallbacks written beside the store; read from the store, then the cache) and 643aee680 (the first read settles rootfs-only fallbacks beside the store). The upgrade path also passed live: provisioning moved an existing rootfs store onto the identity disk and Vault restored it.

        Follow-ups filed:
        - 1658-6ca6 (p1): the guard decides "absent" before delivery can arrive, on every platform.
        - 1656-e4ws (p1): the installation anchor is minted from the clock and the pid.

        Correction to the design note: a VERSION change rebuilds images, not the rootfs, so installs did not lose sign-ins. HARD resets and 5b rebuilds did. Criteria 1, 3, 4 and 5 remain.
