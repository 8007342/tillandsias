packets:
  - packet_id: the-coordinator-infers-idleness-from-commit-timestamps
    order: 980-krib
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [coordination, methodology, multi-host, fail-loud]
    estimated_hours: 3
    title: |
      The coordinator establishes "this host is idle" by reading git timestamps, so a host between commits is indistinguishable from a host that has stopped, and it gets dispatched work it is already doing.
    context: |
      FOUND independently by yolanda-windows and yoga-silverblue within minutes
      of each other on 2026-09-03, both correcting the same coordinator
      dispatch pass.
      WHAT HAPPENED. I read ListAgents for session state and plan/loop_status.d
      plus git log for last activity, concluded seven hosts were idle, and
      dispatched all of them. Two of those were wrong:
      - yoga had closed a cycle roughly an hour earlier (031057194 split,
        906bfa900 feat, 517ea9eba record, MO-FULL COMPLETE). I briefed them to
        start work they had finished.
      - yolanda had been reading six call sites and had caught two errors in my
        own classification, one about to ship into a handover specification. In
        their words: "an idleness signal derived from commit timestamps is a
        proxy standing in for the thing it claims to measure."
      WHY IT MATTERS BEYOND THE WASTED BRIEF. A host that has genuinely wedged
      and a host mid-analysis look IDENTICAL from the outside, and only one of
      those is the coordinator's problem. The proxy cannot separate them, so it
      either under-dispatches (idle fleet, the failure this rule exists to
      prevent) or over-dispatches into work in flight, and it reports both
      outcomes with the same confidence.
      SAME SHAPE, THIRD TIME IN ONE DAY: a summary standing in for the artifact
      it summarises. The other two were also mine - a packet context block read
      as current state, and a query fold read as the whole ledger when ARCHIVED
      rows resolve only through status.
      RELATED: 976-kk6x reads status ready while being an unclaimable split
      parent, because its split_into landed as PROSE in next_action and
      split-parents returns nothing for it. That is the same defect from the
      ledger side: the machine-readable state contradicts the human-readable
      one, and the coordinator trusted the machine. yoga owns that half.
    exit_criteria:
      - idleness is established by ASKING the host, not by inferring from git or session state; a host reports whether it is working and on what
      - a host mid-analysis with no commits is distinguishable from a host that has stopped, and the coordinator can say which it is observed
      - the dispatch path refuses to brief a host on work that host has already completed, or the brief carries the head it was written against so the host can detect the staleness itself
      - a wedged host is still detected - do not fix over-dispatch by removing detection and reintroducing the idle fleet
