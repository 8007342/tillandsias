events:
  - packet_id: a-dispatch-wrapper-that-execs-into-a-container-cannot-be-killed-so-a-cancelled-gate-keeps-running-in-the-same-checkout
    event:
      type: investigated
      ts: "2026-09-13T07:26:07Z"
      agent_id: linux-yoga-claude-20260913t072607z
      host: yoga
      summary: |
        THE RULE I ADDED ONE COMMIT AGO, VIOLATED IN THE SAME COMMIT THAT ADDED IT.
        Found by yolanda on WSL after the fix landed green there.

          ln: failed to create symbolic link '.../opaque/103/environ': No such file or
              directory
          PASS: competing-gate detector 11/11 (1141-vf9w)

        The symlink was NOT created on that substrate and the arm passed anyway, because
        an ABSENT file satisfies `[ ! -r ]` exactly as a dangling one does. So the arm
        was passing for a reason other than the one it names — which is precisely the
        defect it had been rewritten to remove one commit earlier — and `ln`'s stderr
        went to the log with nothing reading it.

        MY RULE, APPLIED TO THE SETUP INSTEAD OF ONLY THE ASSERTION: prove the failure
        you INJECTED actually occurred. I wrote that sentence about negative controls
        and then trusted a construction step without checking it, in the same change.
        The assertion was fine; the thing that produced the condition it asserts over
        was not checked at all.

        FIXED BY ASSERTING THE PROPERTY RATHER THAN THE MECHANISM. The arm needs one
        thing — that environ cannot be read — and a dangling symlink and an absent file
        both give it; which a substrate allows is not the subject. So the arm now
        verifies `[ -r ]` is FALSE before proceeding, and FAILS LOUDLY if neither
        construction denied the read, instead of running an assertion over a condition
        that was never established. That is better than checking `ln`'s exit code, which
        would pin the MECHANISM and red on substrates where absence is the honest
        construction.

        Verified 11/11 at uid 1000 and uid 0, and the guard has teeth: replacing the
        construction with a readable file reds the arm by name (10/11) rather than
        passing.

        A SECOND TRADE-OFF FOR THE PROMOTION CRITERION, from yolanda. The
        exit-between-list-and-read race that can suspend a real accusation SCALES WITH
        SCAN DURATION — so the same detector is more silenceable on a slow host than on
        a fast one, and both Windows hosts are the slow ones. Detection is therefore
        weakest exactly where the scan is slowest, which is not the distribution anyone
        would choose. It still cannot manufacture a false accusation, so the direction
        is right for an advisory; but "how often does churn suspend a true positive"
        is a question the promoter must answer on a SLOW host, not on yoga.

        THE SHAPE OF THIS WHOLE EXCHANGE IS WORTH ONE LINE. Three rounds, each one a
        fixture passing for the wrong reason: an env var it inherited, a chmod that did
        not deny, a symlink that was never created. Every one of them green on the host
        that wrote it. The fixture was never wrong about the CODE; it was wrong about
        itself, three different ways, and only a second substrate exposed each.
