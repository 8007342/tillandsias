          RUN 1, ambient PATH (sha256sum resolves at /sbin/sha256sum):
            ok:   ARM 2: an artifact matching its signature emits cosign:verified:1/1
            ok:   ARM 3: a substituted asset whose SHA256SUMS entry was regenerated PASSES the hash check and is REFUSED on the signature (cosign:FAILED:tillandsias-linux-x86_64)
