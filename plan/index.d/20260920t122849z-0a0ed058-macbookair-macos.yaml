        THE TWO OUTPUTS ARE BYTE-IDENTICAL. I diffed them. Two runs that exercised two DIFFERENT digest tools produced indistinguishable artefacts, so a green 5/5 — in a log, in a gate record, in a land attestation — cannot tell a reader which candidate was proved. That is the precise thing this row is about, arriving one layer in: the fix made the step work in both regimes, and the step still cannot REPORT which regime it ran in. A recorded second-regime run is only evidence if the recording distinguishes the regimes; two identical greens are one green written twice.

        HOW I ESTABLISHED WHICH CANDIDATE EACH RUN TOOK, since the fixture prints no resolved-tool line: I replicated its own selection loop under each PATH rather than asserting it from the platform.

          run 2 PATH:  sha256sum -> <no output>;  "shasum -a 256" -> e3b0c442…b855   SELECTED: shasum -a 256
          run 1 PATH:  sha256sum -> e3b0c442…b855                                    SELECTED: sha256sum

        So the shasum branch — the one a stock Mac actually takes — is now exercised for the first time on any host, and it is green. Before yoga's fix, ARM 2 FAILED here with cosign:FAILED because the stub could not reach its digest under the narrowed PATH, and ARM 3 passed VACUOUSLY: the stub refused everything, so ARM 3's expected refusal arrived whatever it substituted. Both are now earned.

        A TRAP IN THE INSTRUCTION ITSELF, worth the row's notes because it is the same class as the defect: narrowing PATH to hide sha256sum also hid `timeout`, which on this host is homebrew coreutils and not under /usr/bin:/bin. My first attempt at run 2 died rc=127 before reaching the fixture. A PATH-narrowing instruction can silently remove the HARNESS's own tools, and the failure looks like the subject failing.

        WHAT I AM NOT CLAIMING: I have not measured the openssl candidate. It is third in the list and unreachable on this host while shasum is present, so a third regime would need a box with neither sha256sum nor shasum.
