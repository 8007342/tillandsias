  estimated_hours: 3
  title: The release restores a Nix and Rust cache that main saved; a tag run never saves a cache nobody else can restore
  context: 'Releases are dispatched on a new tag ref, and GitHub restores a cache only from the run ref or the default branch. Every cache so far is under refs/tags/v* (gh cache list: v56.10.31.2, v56.11.1.1), so each release cold-builds about 499 derivations (67 min on v56.11.1.1). The 1916-nxcs cache_seed input exists but was never dispatched on main. Fix: a push to main runs the seed path (build and save, publish nothing), and the cache saves are scoped to refs/heads/main so tag runs only restore. No schedule; signing stays on tag refs (the Sigstore SAN pins refs/tags).'
  exit_criteria:
  - 'A workflow lint refuses any cache save in release.yml not scoped to refs/heads/main, and refuses a workflow with no main producer; it is red on the pre-fix workflow.'
  - 'The next release after a main push logs a Nix cache hit restored from the main scope.'
  verifiable_closure: 'litmus:release-cache-is-saved-only-by-main'
