packets:

  - packet_id: freshness-inventory-conflates-code-and-corpus-populations
    order: 678-pgzf
    status: ready
    priority: p3
    title: "freshness-inventory's unstamped-draw offers cheatsheet corpus, which uses frontmatter last_verified — coverage can never reach 100% by code-stamping"
    kind: enhancement
    deliverable: freshness-inventory.sh population split (code components vs corpus with last_verified) + honest per-population coverage
    depends_on: []
    pickup_role: linux
    capability_tags: [freshness, cheatsheets, metrics]
    estimated_hours: 2
    context: >
      Cycle-9 freshness audit (2026-08-11): the freshness-next unstamped draw
      offered cheatsheets/data/postgresql-indexing-basics.md. It is curated
      REFERENCE CORPUS with proper frontmatter provenance (`since`,
      `last_verified: 2026-04-27`, `sources:`), referenced from
      cheatsheets/INDEX.md — legitimate seed data for the cheatsheet expert
      (packet 400), not project code. The `# freshness:` shell/code-comment
      stamp convention does not fit a markdown+YAML-frontmatter corpus file
      (a leading comment would corrupt the frontmatter), and corpus already
      HAS a freshness mechanism: its own `last_verified` field against
      `sources:`. So freshness-inventory counts ~all of cheatsheets/**.md in
      its 1000+ unstamped denominator while they can never be code-stamped —
      coverage is structurally pinned below 100% and the two populations are
      audited by different, incomparable criteria. Split them: code
      components tracked by `# freshness:` stamps; corpus tracked by
      `last_verified` freshness against `sources:`; report coverage per
      population so neither drags the other's number.
    exit_criteria:
      - freshness-inventory distinguishes code components from last_verified-bearing corpus and reports coverage separately; the unstamped-draw for code stops offering corpus files
    events:
      - ts: "2026-08-11T03:40:00Z"
        event: filed
        summary: filed from the cycle-9 freshness audit — the audit of the freshness mechanism itself.

  - packet_id: gate-and-litmus-operations-mutate-tracked-files-unsafely
    order: 678-er2c
    status: ready
    desired_release: v0.5
    priority: p2
    title: "Recurring class: gate/litmus/install operations mutate tracked files (VERSION, gate-stamp) without kill-safety — a killed run poisons the tree and blocks pushes"
    kind: research+enhancement
    deliverable: an inventory of tracked-file-mutating gate/litmus/install steps + a shared kill-safe write discipline (temp+atomic-rename, or untracked location) + guard
    depends_on: []
    pickup_role: linux
    capability_tags: [gates, litmus, safety, tracked-files, cross-host]
    estimated_hours: 4
    context: >
      THREE independent instances landed across hosts in ~24h, same shape —
      a gate/litmus/install step writes a TRACKED file, and an interruption
      or the write itself leaves the tree dirty/poisoned so pushes break:
      (1) 671-jvcg (linux, this session): ./build.sh --install auto-bumps
      tracked VERSION, which the push guard then forbids off-main — every
      on-branch install leaves mandatory-uncommittable dirt.
      (2) 675-dkif (windows): gate-stamp computed 2 forks/file, a silent
      ~20-minute pre-push hang.
      (3) 677-33be (windows): a litmus mutates tracked VERSION without
      kill-safety — a killed run poisoned the tree and blocked pushes.
      Individually each is p2/p3; together they are a CLASS: automation that
      mutates version-controlled files as a side effect, without atomicity
      or a rollback-on-interrupt story, against the meta-orchestration exit
      contract that treats any cycle-created dirt as commit-or-block. The
      reduction: inventory every gate/litmus/install step that writes a
      tracked path, and give them ONE discipline — write to an untracked/
      external location, or temp+atomic-rename with an interrupt trap that
      restores — enforced by a guard, not goodwill.
    exit_criteria:
      - a committed inventory of tracked-file-mutating gate/litmus/install steps, each dispositioned (moved off tracked paths, or made kill-safe with a restore trap)
      - an executable guard fails loud if a gate/litmus step leaves a tracked file dirty after an interrupt fixture
    events:
      - ts: "2026-08-11T03:40:00Z"
        event: filed
        summary: >
          Filed as the consolidating parent of 671-jvcg/675-dkif/677-33be
          after the third instance in 24h; the pattern is the finding.
