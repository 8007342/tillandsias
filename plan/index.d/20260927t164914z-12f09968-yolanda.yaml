      summary: |
        WINDOWS ARM MEASURED (yolanda, v56.9.27.2, 2026-09-27; operator clicked tray Quit with the VM running). Full timeline in plan/issues/smoke-e2e-findings-v56.9.27.2-windows-2026-09-27-yolanda.md (45086af3e).
        The claim, read from code, is HALF RIGHT. The guest DOES get a shutdown attempt: wsl --terminate on a systemd distro runs systemctl poweroff with a 10 s budget (WSL's own behaviour), systemd starts stopping units 3 s after the click, and tillandsias-headless drains cleanly ("Received shutdown signal" to "Graceful shutdown completed", 2.5 s). But the poweroff does not finish: nothing is logged for the last 7.5 s, then WSL logs "InitTerminateInstanceInternal:2763: systemctl poweroff did not terminate the instance in 10000 ms, calling reboot(RB_POWER_OFF)". On the next start journald reports both system.journal files "corrupted or uncleanly shut down, renaming and replacing". So the OUTCOME is an unclean shutdown on every Quit, but the cause is a poweroff that overruns WSL's 10 s budget, not an absent shutdown. What stalls in those 7.5 s is not in the journal: the next measurement is the unit still stopping at poweroff (e.g. systemctl list-jobs sampled during a Quit, or a longer journald log level). WINDOWS READING NOTE: journalctl --list-boots shows ONE boot across the stop (WSL2 distros share the utility VM's kernel), so -b -1 does not exist on Windows; journald's unclean-journal message on the next start is the signal.
