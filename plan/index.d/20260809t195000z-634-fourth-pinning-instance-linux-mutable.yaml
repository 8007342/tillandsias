    context: >
      622-rmit measured the debt (643 of 1762 steps match fixed text against source; 166
      tests carry no negative control) and its enforcement rung was explicitly left
      Tlatoani-gated per methodology/convergence.yaml -> bar_raise_governance. This packet
      does NOT enable it. It reports that the incident rate now justifies asking.

      Four instances between 2026-08-08 and 2026-08-09, every one a FALSE red caused by a
      CORRECT change:

        1. forge-plan-expert-build-shape/2   619-vwau moved `&` onto an enclosing subshell
        2. forge-experts-ephemerality-shape/5 619-vwau wrote through a local $index_dir
        3. inference-model-preload-policy/20  627-k4mz made the CA bundle AUGMENT system
                                              roots instead of replacing them — the guarded
                                              property got STRONGER and the guard failed
        4. release-gates-run-locally/8        the pre-push marker was bumped v3 -> v4

      Instance 4 is the clearest statement of the shape: a guard that pins a VERSION token
      is not at risk of a false red, it is SCHEDULED for one at the next bump.

      The cost is not the fix. Each took minutes. The cost is that two of the four were
      inherited across a merge and had to be proven pre-existing before this host could
      tell whether it had broken them — one required standing up a worktree at the
      pre-merge commit and re-running the suite there. With push CI gone (599-w5jd) the
      local gate is the only verification left, and false reds are how a sole remaining
      gate stops being believed.
