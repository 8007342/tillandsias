packets:
  - packet_id: cycle-preflight-resolves-plan-binary-by-execution
    order: 720-fmvu
    status: done
    desired_release: v0.5
    priority: p1
    release_target: bare-metal-expert-inference-parity
    kind: fix
    title: "cycle-preflight.sh must resolve the plan binary through the shared probe, not a hardcoded path"
    deliverable: "scripts/cycle-preflight.sh sources scripts/plan-binary-probe.sh"
    pickup_role: any
    capability_tags: [windows, wsl2, preflight, fail-loud]
    context: |
      The preflight added yesterday (718-nkm2, commit 009fe525) verifies the
      instrument it just rebuilt by running

          ./target/release/tillandsias-plan capabilities

      On this shared Windows/WSL checkout that path is a Linux ELF left by a WSL
      build, sitting beside the runnable tillandsias-plan.exe. Under Git Bash it
      is selected on existence and dies with "Exec format error", so the
      preflight printed

          blocked:preflight:plan:capabilities-refused

      and — per its own contract, correctly — refused to let the cycle start.
      The instrument was freshly built and perfectly healthy; the verdict was
      about a filename.

      This is the FOURTH site to reintroduce the bug that scripts/plan-binary-probe.sh
      was centralised (704-zcgi) to stop recurring, after check-stranded-in-progress.sh,
      check-fragment-closure-evidence-added.sh and select-work-batch.sh. The probe's
      own rule is the diagnosis: an executable bit or a file extension is a claim,
      running the binary is evidence.

      Worth noting what worked: the preflight is a HARD gate and it failed loud,
      on its first real Windows cycle, one commit after it landed. A soft
      advisory here would have let the cycle proceed on the stale ELF and the
      failure would have surfaced later, somewhere less legible.
    outcome: |
      cycle-preflight.sh sources the shared probe and takes whatever
      resolve_plan_binary returns, so the capabilities check runs against the
      binary this host can actually execute. Verified on windows-next:
      ok:cycle-preflight:rebuilt:skip:not-wsl (exit 0).
    exit_criteria:
      - "cycle-preflight.sh contains no hardcoded target/release path; it sources plan-binary-probe.sh."
      - "The preflight returns ok:cycle-preflight:* on a Windows checkout carrying both an ELF and an .exe."
    events:
      - type: filed
        ts: "2026-08-13T19:15:00Z"
        host: windows
        summary: |
          Found by the first windows-next full cycle after 009fe525: the
          preflight blocked the cycle on its own hardcoded binary path.
      - type: completed
        ts: "2026-08-13T19:20:00Z"
        host: windows
        summary: |
          Fixed by sourcing scripts/plan-binary-probe.sh. Re-ran the preflight on
          this host: ok:cycle-preflight:rebuilt:skip:not-wsl, exit 0. The cycle
          that filed this packet is the one it unblocked.

  - packet_id: plan-binary-probe-usage-sweep-and-gate
    order: 721-nyev
    status: ready
    desired_release: v0.5
    priority: p2
    release_target: bare-metal-expert-inference-parity
    kind: fix
    title: "Eight more scripts still execute the plan binary without the shared probe; convert them and gate the pattern"
    deliverable: "converted call sites + an executable check that fails on a new hardcoded site"
    pickup_role: any
    capability_tags: [windows, wsl2, tooling, fail-loud]
    estimated_hours: 3
    context: |
      Fixing 720-fmvu answered the immediate block but not the class. A sweep of
      every script that EXECUTES the plan binary found eight further sites, none
      of which mention tillandsias-plan.exe and none of which source
      scripts/plan-binary-probe.sh:

        scripts/check-fragment-status-loss.sh          (candidate loop, no .exe)
        scripts/check-groundtruth-mutable-status-pins.sh (candidate loop, no .exe)
        scripts/reclaim-stranded-claims.sh             (candidate loop, no .exe)
        scripts/cycle-metrics.sh                       (two candidate loops)
        scripts/delegate-outcome.sh                    (direct hardcoded call)
        scripts/drain-queue.sh                         (candidate loop)
        scripts/hooks/pre-push-local-gate.sh           (direct, plus an [[ -x ]] test)
        scripts/release-preflight.sh                   (direct, plus an [[ -x ]] test)

      On a shared Windows/WSL checkout every one of these selects the Linux ELF
      at target/release/tillandsias-plan over the runnable .exe. The failure is
      not uniform, which is why it keeps being rediscovered one site at a time:
      the checkers degrade to "binary absent, check skipped" (a silent hole),
      while pre-push-local-gate.sh's `[[ -x ]]` test PASSES on the ELF and then
      runs a fragment check that cannot execute — a gate reporting on evidence it
      never gathered.

      704-zcgi centralised the probe on the reasoning that fixing instances is
      not enough; 720-fmvu is the fourth instance since. So the closure here has
      to be the gate, not another round of edits.
    exit_criteria:
      - "All eight sites resolve the binary through resolve_plan_binary; none names a target/ path it then executes."
      - "An executable check fails when a tracked script executes a hardcoded target/{release,debug}/tillandsias-plan without sourcing the probe, prints a one-line typed verdict, and is wired into the local gate."
      - "The check is red before the conversion and green after — demonstrate both, so it is proven to be able to fail."
      - "NEGATIVE CONTROL: plan-binary-probe.sh itself, and any script legitimately naming the path in a comment or a message, do not trip the check."
    events:
      - type: filed
        ts: "2026-08-13T19:25:00Z"
        host: windows
        summary: |
          Filed from the 720-fmvu sweep. Counted by grep across scripts/: eight
          executing sites, zero .exe mentions, zero probe sourcing.
