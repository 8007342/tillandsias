    order: 974-uk95
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [attestation, fail-loud, ledger, meta-orchestration]
    estimated_hours: 2
    supersedes_note: continues meta-orchestration-full-mode-exit-attestation-gap (ARCHIVED, order 614-2gqx / 651-2x5s)
    title: |
      A push-retry loop between the work push and `mo-full-attest.sh record` silently skips the record, so the terminal marker verifies COMPLETE while the durable ledger line was never written.
    context: |
      MEASURED by lenovinha in their own finalization, 2026-09-03, and reported
      rather than quietly repaired. Sequence: `record` ran while HEAD was still
      unpushed and CORRECTLY REFUSED; their push-retry loop then landed the work
      WITHOUT re-running `record`; and the terminal `self` printed COMPLETE,
      because by that point local and remote genuinely agreed. Every tool
      behaved as designed. The emitted marker was valid and the per-host ledger
      line — what scripts/check-mo-full-attestations.sh and every automated
      consumer actually read — was absent.
      THIS RESTORES 651-2x5s's ORIGINAL CONDITION THROUGH A DIFFERENT DOOR.
      That order added `record` precisely because a transcript marker nothing
      parses is decorative. Here the marker is emitted AND verified while the
      durable half is missing, so an auditor reading the LEDGER sees a cycle
      that never happened and an auditor reading the TRANSCRIPT sees a clean
      COMPLETE. The two disagree, and only one of them is consumed.
      THE RECIPE IS CORRECT ON THE HAPPY PATH, which is what makes it
      dangerous: Finalization step 6 has already pushed by the time step 9
      runs. Insert a fetch/rebase/retry between them — which every host does on
      a busy trunk, and which pirria measured as unavoidable when four green
      gates produced zero landings — and `record` is skipped on any iteration
      that refused.
      AUDITED ON macuahuitl BEFORE FILING: its ledger carries a line for every
      cycle this session, so this host does not have the defect and the packet
      is not written from its own wreckage. CAVEAT for anyone auditing: expect
      the WORK head in the ledger, never the record commit's own head — the
      line attests the work and committing it moves HEAD, which is why the
      terminal marker is re-derived one commit later. Checking for the wrong
      one concludes the bug is present when it is not.
      The meta-orchestration skill now carries the measurement, the trap and
      the audit command at Finalization step 9.
    exit_criteria:
      - a cycle whose first `record` attempt refuses, and which then pushes on a retry, still ends with a ledger line for that head — proven by a fixture that forces a refusal then a successful retry
      - the terminal `self` marker refuses to print COMPLETE when the ledger carries no line for the head it is attesting, so the marker cannot outrun the record
      - the audit command is in the skill and names the WORK-head-not-record-head caveat, since checking the wrong head reports a false positive
