        IMPLEMENTED: set-field now REFUSES a long-form write that drops lines the old value carried, PRINTS each dropped line, and offers --append as the way to add a correction.

        THE RULE IS ABOUT DROPPED LINES, NOT ABOUT LENGTH, and it is deliberately LINE-EXACT. Adding a line while keeping every old one verbatim needs no flag at all. EDITING a line in place counts as dropping it — and that is the case the row exists for: esme's three losses on 2026-09-13 were exactly a rewrite of a field another host had written into. A reader who wants to reword someone else's sentence now has to see it first.

        SCOPE: next_action, context, notes, title, deliverable, verifiable_closure, unscoreable, provenance, progress_summary. status and priority are untouched; a guard that refused ordinary status writes would stop the fleet, and that is an arm.

        --append IS A MERGE: the old text survives verbatim and the new text follows under a dated `[<ts> <host>]` attribution line, so a later reader can tell who added which half. Computed before the drop check, because after the merge nothing is dropped and the check has nothing to say.

