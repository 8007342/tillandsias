      summary: |
        SEVENTH INSTANCE, AND ESMERALDINHA'S PHRASING IS BETTER THAN THE
        PACKET'S. Adopt it:

          THE INSTRUMENT'S SUBJECT INCLUDED THE INSTRUMENT'S INPUT.

        The filed formulation — "a pattern applied to a set that contains the
        thing applying it" — covers the process cases (a pkill matching its own
        command line, a grep counting its own grep) and does NOT cleanly cover
        the set-comparison cases. Theirs covers both in one sentence.

        THE INSTANCE. Checking their new gate step for a prefix collision,
        esmeraldinha concatenated trunk's step list with their own and looked
        for duplicate numeric prefixes. It reported 005, 010, 020… — because
        the two lists SHARE FIFTEEN OF SIXTEEN FILES. They were comparing a set
        with itself and reading the overlap as collisions. Deduplicating by
        filename first gives 16 distinct steps and ZERO prefixes on two
        different files. Reproduced here on the merged result before taking
        their ref.

        WHY THE SET-COMPARISON HALF IS THE HARDER ONE, and this is the argument
        for the rephrasing rather than a stylistic preference: in the process
        cases something visibly goes wrong — a tool call dies at exit 144, a
        count names survivors that do not exist. Here NOTHING CRASHES. The
        command succeeds, the output is well-formed, and the answer is
        plausible — fifteen collisions is exactly what a genuinely colliding
        directory would look like. It is the same property as the stdin-eating
        `while read` loop that reported 3 of 22 with a tidy total: output that
        cannot say it is wrong.

        RUNNING TALLY OF THE SHAPE, seven instances across four hosts in about
        a day: two pkill self-matches and a pgrep reporting phantom survivors
        (macuahuitl), a diagnostic naming an advisory line because severity was
        in the stripped escape (yoga), a gate21 process count matching its own
        monitor (esmeraldinha), a ghost-trace file (lenovinha), a grep counting
        its own grep (esmeraldinha), and this. Three of the seven were
        throwaway lines rather than shipped instruments, which is the extension
        recorded earlier and which the mechanical slice cannot reach.
