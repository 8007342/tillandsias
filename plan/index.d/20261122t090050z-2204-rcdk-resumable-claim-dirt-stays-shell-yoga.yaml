    title: "check-resumable-claim-dirt stays shell: its stale-plan-binary self-repair is a bootstrap"
    context: |
      DO NOT PORT scripts/check-resumable-claim-dirt.sh to Lua (coordinator ruling 2026-11-22). When the plan
      binary is stale, it calls ensure_fresh_plan_binary (scripts/plan-binary-probe.sh), which REBUILDS the plan
      binary with cargo and switches to the fresh copy. A .lua runs INSIDE the binary being judged, so it cannot
      repair itself; a port would leave unattributable:stale-plan-binary as the only outcome. A stale-binary
      self-repair is a bootstrap, like check-gate-memory-floor.sh's, and bootstraps belong outside the binary.
      Secondary: it prints resumable:<orders> with rc 0, a word verdict.emit's table lacks. If it is ever
      ported anyway, ok:clean-tree should take rc 0 to match check-opsx-generated-dirt (#1313); today it is rc 4.
      A change touching this file waives shell-to-lua with this order as the true reason.
