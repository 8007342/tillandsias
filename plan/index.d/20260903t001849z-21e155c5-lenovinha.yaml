        CORRECTION TO MY OWN CLOSING EVENT, from yolanda's question, and they were right: my evidence for the discrete arm was narrower than the rule I wrote around it.  WHAT I CLAIMED: "a prefetchable BAR >= 1 GiB is an aperture only dedicated memory has (discrete — how the 3070 is classified)". I wrote that as though it were a fact about the card.  WHAT THEY POINTED OUT: resizable BAR is FIRMWARE AND DRIVER STATE, not a property of the silicon. With ReBAR on, a discrete card exposes its whole VRAM as one large aperture and the rung fires. With ReBAR off — still the default on plenty of boards, and the historical PCIe behaviour — the same card exposes the legacy 256 MiB aperture and the rung does not.  MEASURED ON THIS HOST, which confirms their model and not my phrasing: lspci -vv -s 01:00.0 reports "Region 1: Memory at fa00000000 (64-bit, prefetchable) [size=8G]". ReBAR is enabled here. So the discrete arm has been demonstrated against ONE FIRMWARE CONFIGURATION of one card, not against the card — and a reader of my event would have taken it as the arm being proven against real discrete hardware in general.  THE SAME 3070 WITH ReBAR DISABLED REACHES NO RUNG AT ALL: no mem_info_vram_total (the proprietary driver never exports it, so rungs 1 and 3 cannot fire) and a 256 MiB aperture (below rung 2's floor). It lands on undetermined.  THAT FAILURE IS BENIGN AND YOLANDA SAID SO BEFORE I DID, which is worth recording because it would have been easy to present this as a defect and it is not one. undetermined is honest. The mislabel would have been unified, and the ladder does not produce it. What was wrong was the CLAIM, not the code.  WHAT CHANGED: the rung's doc comment now states the firmware dependency, names the measurement that establishes ReBAR is on here, and says explicitly that the arm is demonstrated against one configuration. The fixture that already covered the non-ReBAR case existed but was incidental — it lived inside a general "no evidence, no answer" test — so it is now its own named test, a_non_rebar_discrete_card_lands_on_undetermined_not_unified, asserting both that the classifier refuses and that the envelope renders undetermined rather than unobservable-from-this-side. yolanda's phrase for why: falsifiable rather than fortunate.  WHAT I DID NOT DO, and they explicitly did not propose it either: no vendor fallback. Adding 0x10de back to paper over a firmware-dependent rung would be the same trade this packet refused two hours ago, and it would answer for the non-ReBAR card free and correctly, which is exactly what makes it tempting. The ladder is allowed to be incomplete. It is not allowed to guess.  76 accel_probe tests pass.
