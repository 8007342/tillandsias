      summary: >
        CODE HALF LANDED; packet stays OPEN pending 819-qgy2. Criteria 1 and 2
        are done, criterion 3 (1-vCPU cold-boot measurement) is split out
        because performing it requires `wsl --shutdown` on an operator's
        machine mid-loop, and criterion 4 is recorded in that child packet's
        method note.
        (1) `maybe_spawn_vsock_listener` now runs FIRST in run_headless_async,
        ahead of all five background spawns, carrying its order-620-duta
        vsock_loopback preflight with it. The bind was always first in program
        order INSIDE the vsock task; the task itself was the last thing the
        function spawned. Nothing below it — metrics retention, evidence-bundle
        retention, log cardinality, trace budget, disk usage — is a
        precondition for accepting a control-wire connection.
        (2) Both blocking bodies moved off tokio worker threads.
        `run_disk_usage_check` is a sync fn (blocking Command::output() to
        `bash manage-cache.sh`, plus first-boot runtime-asset materialisation)
        that was wrapped in `async move {}` — now `spawn_blocking(fn)` directly.
        `run_trace_budget_enforcement` needed more care and the first attempt
        was WRONG: its comment claimed "no .await inside it", but it does await
        `tokio::fs::read_to_string`. The real cost is the serde_json parse of
        every line AFTER that read, with no further yield, so it holds a worker
        through the parse. Comment corrected to say that. Also switched
        `futures::executor::block_on` to `tokio::runtime::Handle::current().block_on`
        — the inner await is a tokio fs future and needs the tokio reactor
        driven, so the futures executor would have hung rather than sped
        anything up.
        Verified: `cargo check -p tillandsias-headless` clean in the Linux
        build distro, `./build.sh --check` green. NOT verified, and cannot be
        on this host: that any of it measurably moves bind latency.
