    order: 819-qgy2
    status: ready
    desired_release: v0.5
    priority: p2
    kind: implementation
    title: "798-q4m9's measurement half: bind latency before and after the spawn reorder, on a guest constrained to ONE vCPU, cold boot — the only configuration where the defect is observable"
    deliverable: "before/after cold-boot bind latency on a 1-vCPU WSL2 guest, with the readiness clock's origin stated (daemon-start, not `systemctl enable --now`), and the fetch gate's contribution quantified if it can contribute"
    pickup_role: windows
    release_target: architecture-audit-epic
    capability_tags: [windows, wsl2, vsock, performance, measurement]
    context: |
      SPLIT from 798-q4m9 (order 264's pattern: when implement+verify does not
      fit the envelope, split rather than half-claim). The code half landed
      this cycle; this is the half that did not.

      WHY IT WAS NOT DONE HERE, stated plainly rather than deferred silently.
      Criterion 3 requires a guest constrained to ONE vCPU. On Windows that
      means editing %USERPROFILE%\.wslconfig and running `wsl --shutdown` for
      it to take effect — which stops EVERY distro on the host, including
      tillandsias-build (this host's Linux-artifact lane, and where
      ./build.sh --check re-execs) and the running tray. Doing that as a side
      effect of an unattended loop iteration, on an operator's machine, is not
      a reasonable unprompted act. It needs either an operator-attended window
      or a second machine.

      WHY THE CODE HALF IS STILL WORTH HAVING WITHOUT IT: the reorder is
      correct on its own terms — nothing below the bind is a precondition for
      accepting a control-wire connection — and moving two blocking bodies off
      tokio worker threads is right regardless of how much latency it buys. The
      measurement decides the SIZE of the win, not whether the change was
      sound.

      WHAT THE PACKET FORBIDS, and why this split exists rather than a closure:
      "A pass on a multi-vCPU host is not evidence for this packet — that is
      the exact 'verified where it was written' shape 757-4hdt filed against
      itself." This host is 8C/16T. Any number it produces today would be the
      forbidden evidence. 798-q4m9 therefore stays OPEN.

      METHOD when a window exists: set `[wsl2] processors=1` in .wslconfig,
      `wsl --shutdown`, cold-boot the tillandsias distro, and time from
      daemon-start to a successful host-side connect — NOT from
      `systemctl enable --now`, because the unit declares
      Requires=/After=tillandsias-headless-fetch.service with
      TimeoutStartSec=300s, and on the download variant of fetch-headless.sh
      that is up to ~135s of retry plus transfer BEFORE the binding process is
      even launched. A clock started at the wrong origin attributes that to
      bind latency. Then repeat on a build carrying the reorder.
    verifiable_closure: "a before/after bind latency pair from a 1-vCPU cold boot, with the clock origin named"

