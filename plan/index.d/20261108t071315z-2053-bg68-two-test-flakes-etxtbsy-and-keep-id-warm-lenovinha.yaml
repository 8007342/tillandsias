    title: |
      tillandsias-headless self_exe::tests::a_self_spawn_works_after_the_running_binary_is_unlinked fails intermittently with ETXTBSY (Text file busy) at the spawn after std::fs::copy: a sibling test's fork between the write and the exec holds the write fd
    context: |
      MEASURED on macuahuitl (relayed by coordinator macuahuitl-fedora, 2026-11-08): the test failed with "Text file busy" at self_exe.rs:131 (cmd.output().unwrap(), right after std::fs::copy writes the probe copy) and evicted #1012. It is the write-then-exec race: a parallel test forks while the copy's write fd is open, and the child holds it until its own exec, so an exec of the copy in that window is ETXTBSY. Same class as 1478-9r6f (the podman stub in tillandsias_podman backend tests), still open: one shared test helper (write, close, exec with a bounded retry on ETXTBSY only) can serve both.
    exit_criteria:
      - 'RED FIRST: the race is reproduced under parallel spawning load (a sibling thread forking in a loop while the test copies and execs), failing with ETXTBSY on the pre-fix code'
      - 'the exec retries on ETXTBSY only, with a short bounded backoff, and any other error still fails at once; or the copy-and-exec is serialised against every test that forks, with the reason stated'
      - 'NEGATIVE CONTROL: an exec that fails with another error (a non-executable copy) is not retried and fails the test'
    verifiable_closure: 'the reproduction loop run N times after the fix with zero ETXTBSY failures, and the negative control red'
    unscoreable: 'none.'
