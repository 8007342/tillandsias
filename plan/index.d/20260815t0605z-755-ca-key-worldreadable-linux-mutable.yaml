packets:
  - packet_id: proxy-ca-private-key-world-readable
    order: 755-qcxh
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: socket-audit-master
    kind: security
    title: "The enclave's TLS-interception CA private key is 0644 in /tmp — any local uid can mint certificates the enclave trusts"
    deliverable: "the CA key is unreadable to uids other than its owner (podman secret, tightened bind mount + group mapping, or uid-mapped 0600) with the 2026-07-22 vault-cli field repro and SELinux relabel semantics kept green"
    pickup_role: linux
    depends_on: []
    capability_tags: [security, proxy, tls, secrets, permissions]
    estimated_hours: 4
    context: |
      ensure_ca_bundle (main.rs:2366) deliberately sets intermediate.key to
      0644 and re-asserts it every pass, in CA_DIR=/tmp/tillandsias-ca.
      Production mounts it into the proxy by bind mount; the entrypoint's
      podman-SECRET branch (which handles ownership correctly) is dead code —
      no launcher creates the tillandsias-ca-key secret. Squid-as-proxy-user
      under --userns=keep-id reads the key only BECAUSE it is world-readable;
      0600 reproduces the filer's startup failure. Fix directions ranked in
      the dated issue (secret delivery preferred: it makes the correct branch
      reachable instead of deleting it).
    exit_criteria:
      - "On a provisioned host, stat -c %a of the live CA key is not group/world-readable (or the key is delivered as a podman secret and no longer materialized world-readable on the host), demonstrated by a litmus that fails on a 0644 key."
      - "Squid starts healthy and vault-cli require_cacert stays green on a fresh guest (the 2026-07-22 field repro path)."
      - "The entrypoint's unreachable branch is either made reachable (secret delivery) or removed in the same change — no fallback nobody takes remains."
