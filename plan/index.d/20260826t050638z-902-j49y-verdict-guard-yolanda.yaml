packets:
  - packet_id: order-531-verdict-fires-on-an-empty-usage-log-not-a-refusing-expert
    order: 902-j49y
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: the order-531 verdict guarded a claim about the USAGE LOG with a number from the GROUNDTRUTH HARNESS, so a fresh or rotated log reported a healthy expert as refusing everything
    deliverable: scripts/cycle-metrics.sh verdict arm ordering
    pickup_role: any
    release_target: harness-mcp-expert-validation
    capability_tags:
      - metrics
      - observability
      - fail-loud
    estimated_hours: 1
    context: |
      FOUND on yolanda 2026-08-26, surfaced by 890-t9pu rotating the usage log
      to a path both userlands can read. Not caused by that change — exposed by
      it. Any fresh host hits this on its first cycle.

      The arm read:

        elif [ "$graded" -gt 0 ] && [ "$answered" -eq 0 ]; then
            verdict="attention:expert-answered-nothing-check-base-branch"

      `graded` comes from the GROUNDTRUTH HARNESS. `answered` comes from the
      USAGE LOG. Two independent sources, and the guard for a claim about one
      was taken from the other. With an empty usage log `answered` is 0 while
      `graded` is whatever the harness scored, so the arm fires.

      MEASURED, both lines from the same run:

        expert_accuracy: pass=28 graded=28 total=33 rate=100% source=groundtruth-all-sets
        verdict: attention:expert-answered-nothing-check-base-branch

      A 100% accuracy score and "the expert answered nothing" cannot both be
      true. And the verdict is not a mild one — order-531 means THE ARTIFACT IS
      WRONG, check the base branch, i.e. a forge seeded from a pre-expert
      commit. It sends the reader to re-examine the build.

      The correct verdict already existed one arm below —
      `attention:experts-never-called` — and was UNREACHABLE whenever the
      harness had graded anything, which is exactly when the report is most
      likely to be read. "The expert ran every time and answered nothing" is
      false when it never ran.

      Fixed by requiring `calls > 0` on the order-531 arm. Same state now
      reports `attention:experts-never-called`.

      This is the night's recurring shape once more, in the verdict layer
      itself: an ABSENT measurement read as a FAILING one. The ledger already
      carries it in the gate stamp (889-8tcb), the split timing log (890-t9pu),
      a grep that could not match its target, a word-absence test that fired on
      its own negation, a bump warning deleted by its own trap (897-5m9y), and
      an ancestry probe whose unsupported flag made it blame the holder
      (899-q9di). The metric that reports on all of it had the same defect.
    verifiable_closure: |
      With an empty usage log on a clean worktree, `cycle-metrics.sh` reports
      `attention:experts-never-called` rather than
      `attention:expert-answered-nothing-check-base-branch`.
    evidence:
      - 'same run: expert_accuracy rate=100% alongside verdict:attention:expert-answered-nothing-check-base-branch'
      - 'after the fix, clean tree, empty usage log: verdict:attention:experts-never-called'
      - 'commit e62b80f30'
