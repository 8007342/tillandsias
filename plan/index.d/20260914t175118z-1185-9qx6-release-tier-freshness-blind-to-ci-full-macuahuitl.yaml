    owned_files:
      - scripts/check-release-tier-freshness.sh
      - scripts/local-ci.sh
      - build.sh
    title: |
      check-release-tier-freshness.sh cannot read a green ./build.sh --ci-full as fresh: target/convergence/check-logs.jsonl records only pre-build phases (245 of 245 entries ever), so the guard's "FULL-tier run" can never exist from the run it guards, and the daily release-tier exercise's green is invisible to the instrument that exists to detect its absence.
    context: |
      MEASURED on macuahuitl 2026-09-14 (890-27mv criterion 1, cadence half b):
      before the exercise the guard read never:release-tier (newest index run
      local-ci-20260914T001822Z, pre-build only); ./build.sh --ci-full on
      ed669a32e went red (rc=1 in 1840s, two litmus fixture constructs, fixed
      forward) and the re-run on e6d73cc15 went GREEN (rc=0 in 1813s, litmus
      364 PASS / 0 FAIL, launcher installed) — and the guard STILL read
      never:release-tier, newest run local-ci-20260914T171946Z covering only
      [ pre-build]. The index has never held any other phase: every one of
      its 245 entries is ci_phase pre-build. So the 1174-6r4k fix (a
      phase-only local-ci run must not satisfy the guard) is right and
      complete, and the writer side never produces the record the reader
      now requires: ci-full drives the pre-build litmus through local-ci
      (indexed) and runs its build, test, post-build and install phases
      outside the index. The v56.9.13.1 cut's ci-full of 2026-09-13 left no
      FULL-tier record either, which is why the guard read never all day.
      WHAT TO BUILD, for the claimer to weigh: (a) ci-full records a
      full-tier run in the index when it completes green — one record per
      phase it ran, or one closing record naming the phases — written by
      build.sh at the end of --ci-full; or (b) the guard accepts a second
      artefact ci-full already leaves (the gate stamp with its tier, or a
      dedicated stamp under $GIT_DIR) as the full-tier answer. Either way the
      negative control stands: a phase-only local-ci run must still read as
      not a release-tier answer. NOT IN SCOPE: changing what ci-full runs.
      Side observation for the same claimer, unscored here: after the green
      ci-full installed the tree's launcher, `tillandsias --version` reports
      v56.9.12.2 while VERSION is 56.9.13.1 — the ci-full-installs-the-
      launcher shape of 2026-09-11 (a stale label baked at build time); say
      whether the installed binary is the tree's.
    exit_criteria:
