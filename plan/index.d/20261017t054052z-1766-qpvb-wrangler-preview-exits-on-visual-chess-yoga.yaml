  - packet_id: publish-local-auto-on-a-wrangler-project-starts-the-wrangler-preview-or-keeps-the-exited-containers-logs-to-say-why
    order: 1766-qpvb
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    size: M
    pickup_role: any
    capability_tags: [forge, web-preview, wrangler]
    related: [1723-2fiq, 1625-6iwd]
    depends_on: []
    title: |
      On visual-chess (wrangler.jsonc), publish_local {"runtime":"auto"} fails every time with `runtime_not_ready: managed runtime exited`, and the exited container is gone, so service_logs answers `not_running` and nobody can say why
    context: |
      MEASURED on yoga 2026-10-17 with published v56.10.16.2, a fresh OpenCode forge on visual-chess@497f976 after a green `npm ci` + `./build.sh --dev`: publish_local {"category":"WEB","runtime":"auto"} returned `MCP error -32000: runtime_not_ready: managed runtime exited` on 7 of 7 attempts across two rebuilds. service_status then said {"state":"stopped","last_failure":{"step":"ready","class":"timeout","reason":"runtime_not_ready: managed runtime exited","remedy":"host-retry","previous_preview_serving":false}}, and service_logs said `not_running: no preview container; publish_local first`. `podman ps -a` on the host held no preview container afterwards. runtime "static" published the same dist/ fine every time.
      By source: auto selects the wrangler profile when a wrangler config is present (local_web_preview.rs), and ready_backend_inner returns "managed runtime exited" when the container's State.Status is not running inside the 30 s window; it reads the last 20 log lines only to look for remote_binding_forbidden and keeps nothing else. The remedy "host-retry" is wrong for a deterministic exit.
    exit_criteria:
      - "on a wrangler project (visual-chess, or a fixture with a wrangler.jsonc Worker), publish_local auto reaches a serving wrangler preview, or refuses with a reason that names what the runtime printed before it exited (red today: a bare 'managed runtime exited' every time)"
      - "after a failed start, service_logs returns the exited container's last lines (or service_status carries a bounded, redacted tail), instead of not_running"
      - "a deterministic exit is not classed as remedy host-retry"
    verifiable_closure: "cargo test -p tillandsias-headless local_web_preview"
    next_action: >
      Reproduce on a Linux host: publish_local auto on visual-chess, capture `podman logs` of the web-wrangler container before it is removed (or run the same image and argv by hand), and name the exit cause; then keep a redacted tail on the failure path, red unit test first.
    provenance: |
      Filed by yoga, 2026-10-17, from the 1723-2fiq live arm.
