    title: |
      GNU-only shell idioms pass every gate on the host that wrote them and then freeze an entire platform on first contact — FIVE in one night, each costing a fleet-wide stall, and nothing in the gate looks for them
    context: |
      FIVE ENVIRONMENT-DEPENDENT DEFECTS IN ONE NIGHT (2026-09-12), every one
      of them green on trunk before it bit. Listed because the pattern, not any
      single instance, is the argument:

        1. audit-guard-activation.sh `grep -Rl` over .claude/skills — GNU grep
           follows symlinked dirs during traversal, BSD grep does not. Five
           correctly-wired guards reported ORPHAN; ./build.sh --check red;
           every macOS land refused. (1087-h2z9)
        2. check-cheatsheet-refs.sh `rg` with NO PATH OPERAND — ripgrep reads
           STDIN when stdin is a readable stream, so under a piped stdin it
           blocked forever. The gate HUNG rather than failing: no error, no
           exit code, 43 minutes of a land that was dead while being reported
           as slow.
        3. test-gate-stamp-does-not-memoize-guard-owned-paths.sh `sed -i` —
           GNU-only; BSD reads the next arg as the backup suffix, so arm4's
           strip silently did nothing and the arm FAILED ITSELF while the code
           under test was correct. Blocked every macOS land. (1127-waxf)
        4. ugrep-as-grep verdict skew — a host with ugrep on the interactive
           PATH runs audit-guard-activation.sh BY HAND and it PASSES, while the
           identical script under a child bash resolving /usr/bin/grep FAILS.
           "Measured green" and "red in the gate" were both true on ONE machine.
        5. git-credential-osxkeychain — answers in the operator's GUI session,
           hangs forever headless on a locked login keychain. Same helper, same
           platform, same repo: one host pushes fine, another times out with
           rc 124 and zero output. (macneo, 2026-09-12)

      THE COMMON SHAPE, and why a test suite does not catch it: every one PASSES
      WHERE IT WAS WRITTEN. The author runs it, sees green, lands it. It is not
      a logic error and no amount of additional test CASES finds it, because the
      defect is in the relationship between the code and the environment, and
      the gate only ever observes one environment at a time. Three of the five
      also fail in the most expensive possible way — they HANG or report a FALSE
      RED, so the receiving host reads "my machine is slow" or "someone broke
      trunk" rather than "this idiom is not portable".

      LENOVINHA'S SWEEP OF THE SAME NIGHT ADDS TWO MORE, and one of them is
      the worst shape in the set: `find -printf` in
      scripts/hooks/pre-push-local-gate.sh — a HOOK, on the path macOS pushes
      through — where BSD find yielded an empty `$_newer` and the refusal never
      fired at all. Nothing went red; the guard simply stopped guarding. Also
      three `touch -d` in test-plan-binary-freshness.sh. That makes SEVEN known
      instances across three hosts in one night.

      TWO OF THEM WERE THE SAME FIX TRAVELLING WRONG. 1087-h2z9's `grep -R`
      (GNU-correct, BSD-broken) and the `sed -i` above are the same mistake in
      two utilities; and the obvious repair for the second — `-i ''` — breaks
      GNU in the mirror image. A guard that knows the PAIR is worth more than
      one that knows either half.
    deliverable: |
      A non-blocking, COUNTED advisory gate step that greps scripts/ (and
      build.sh) for known-non-portable idioms and prints one line per hit with
      file:line and the portable form. Counted so the number is the signal, and
      ADVISORY so it never becomes the thing that freezes a platform — the
      failure mode it exists to prevent.

      THE TALLY IS SPLIT BY SEVERITY, SILENT CLASS FIRST (lenovinha's
      distinction, and it is the right one). Where the idiom sits decides how
      the failure presents:
        * SILENT-DEGRADE — a hook or a production script. It fails on the host
          that PUSHES, produces no error, and the wrong answer looks exactly
          like the right one. lenovinha's `find -printf` in
          scripts/hooks/pre-push-local-gate.sh is this: on BSD find the
          `$_newer` set went silently EMPTY, so the hook's refusal simply did
          not fire on macOS — a guard that was not guarding, on the very path
          macOS pushes through. COUNT AND PRINT THESE FIRST.
        * LOUD-FAIL — a fixture. It fails on the host that RUNS it, with a red
          line and a name. Expensive (it froze macOS lands twice tonight) but
          self-announcing, and nobody ships a wrong result on the back of it.
      A tally that mixes the two hides the dangerous half behind the noisy one.

      Idiom set, every entry from a real 2026-09-12 incident:
        * `sed -i` without a following empty-string argument   (GNU-only)
        * `sed -i ''`                                          (BSD-only — the
                                                                mirror trap)
        * `grep -R`/`-r` where the searched path is a symlink farm
        * `rg` with no path operand                            (reads stdin)
        * `find -printf`                                       (GNU-only; the
                                                                silent-empty case)
        * `touch -d`                                           (GNU-only; three
                                                                in
                                                                test-plan-binary-freshness.sh)
        * `readlink -f`, `date -d`, `stat -c`                  (GNU-only forms)

      NOT a blocking gate, and that is deliberate: tonight already demonstrates
      that a check which can freeze a platform is more expensive than the
      defects it catches.
