      summary: |
        THE ENABLING CHANGE LANDED. Left `ready`, NOT completed — the durable
        path now EXISTS but has not been proven end to end, and the reason is
        specific rather than a shrug (below).

        WHAT THE PACKET SAID WAS TRUE, RE-VERIFIED AT HEAD. vz.rs had exactly
        one `setDirectorySharingDevices` call building an NSArray of length
        one from a single `Option<PathBuf>` + a single tag. The model cache
        lives inside rootfs.img not because anyone chose an undurable path but
        because THERE WAS NO OTHER PATH TO CHOOSE.

        NOW: `VzBootConfig.shares: Vec<VzShare>` with per-share tag and
        read_only, the builder loops, and `start()` passes two — `home-src` and
        `model-cache` -> ~/Library/Caches/tillandsias/models.

        THE LOAD-BEARING TEST USES REAL VZ OBJECTS, NOT A SOURCE SCAN: build a
        two-share config and assert the framework reports two directory-sharing
        devices. Falsified three ways, each turning exactly one test red:
          - collapse the list to one            -> red
          - call setDirectorySharingDevices ONCE PER SHARE -> red, left: 1,
            right: 2. That trap is MEASURED, not theorised: VZ replaces the
            whole device list per call, so the per-share shape silently keeps
            only the last share. It is the obvious way to write this loop.
          - remove all shares                   -> the empty-case test holds

        WHY ~/Library/Caches AND NOT image_root: on macOS the install, data and
        config dirs all collapse onto ~/Library/Application Support/tillandsias,
        which IS the VM directory — that collapse is what made 804-bpke a p0.
        Anything stored there, or inside rootfs.img which lives there, dies with
        the VM. Caches is the idiomatic macOS home for large re-downloadable
        state, survives --reset-guest and any rootfs rebuild (the FREQUENT
        operations), and is still cleared by a deliberate full-wipe e2e — which
        is correct, because that flow is asking for a from-scratch install.

        THE HAZARD I DID NOT EXPECT, AND IT IS THE REASON THIS IS NOT CLOSED.
        main.rs chowns the cache tree to uid/gid 1000 because the inference
        container runs as uid 1000 under --userns=keep-id. On a virtio-fs share
        ownership is mapped by the HOST, so that chown can simply fail — and it
        was written `let _ = chown(...)`, i.e. silently. Silence there
        reproduces order 313 EXACTLY: the container cannot write the tree, the
        entrypoint's own mkdir/install errors are already swallowed by
        `2>/dev/null`, and the only symptom is /api/generate returning HTTP 500
        while /api/version answers. Two silent layers is one too many, so
        chown_tree now counts failures and reports the first one with the
        order-313 consequence spelled out. That does not FIX the ownership
        question — it makes the answer observable the first time anyone boots
        this.

        WHAT IS NOT PROVEN, PLAINLY: cloud-init runs on FIRST BOOT ONLY, so the
        new fstab entry reaches only a freshly provisioned guest. The existing
        guest will boot with a `model-cache` device that nothing mounts —
        harmless, and deliberately so (`nofail`) — but it means the end-to-end
        claim "models survive a VM rebuild" cannot be demonstrated here without
        re-provisioning, which destroys the 11.83 GiB VM and the in-VM Vault
        and is not authorised. So: capability verified on real VZ objects,
        guest wiring verified by source scan, MIGRATION UNVERIFIED.

        ALSO FIXED, AND IT IS MY OWN REGRESSION:
        `live_boot_spec_caps_cpu_at_4_and_carries_4gib_memory` was RED at
        osx-next HEAD and had been since 05b1ebc6f — my own 798-q4m9 commit,
        shipped two cycles ago. That test source-scans the window starting at
        `let spec = boot::VzBootConfig {` for `.min(4)`; 798-q4m9 hoisted the
        cap into `pinned_cpu_count` a few lines above so the measurement seam
        could constrain it. The cap never changed and is still 4 — only the
        LITERAL left the window. It is 828-itr9's failure mode with the better
        ending: anchored to a moveable literal, but going loudly red rather
        than silently vacuous. Re-anchored on the derivation, and it now
        ASSERTS THE ANCHOR EXISTS before scanning, so the next rename is red
        instead of a test that passes while checking nothing. Falsified both
        ways: loosening the cap to .min(8) -> red; renaming the anchor -> red
        with the explanatory message.

        I did not catch it at the time because the gate does not run tests and
        my full-suite run was truncated — see 829-g4xf, which is the more
        important half of this cycle.
