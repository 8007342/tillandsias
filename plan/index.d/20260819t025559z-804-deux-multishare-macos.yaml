packets:
  - packet_id: cargo-test-workspace-stops-at-the-first-failing-target
    order: 829-g4xf
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "`cargo test --workspace` aborts after the first failing test binary, so every ad-hoc 'the suite is green except X' claim on this fleet is an undercount — measured, 1 reported failure was actually 8"
    deliverable: "the documented/scripted way to run the suite uses --no-fail-fast, so a failure count means what it says"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [rust, ci-gates, fail-loud]
    estimated_hours: 1
    context: |
      MEASURED ON macOS 2026-08-18/19, same tree, two invocations:

        cargo test --workspace                  -> 801 passed,  1 failed
        cargo test --workspace --no-fail-fast   -> 1911 passed, 8 failed  (73 binaries)

      Cargo runs test binaries sequentially and STOPS at the first one that
      fails. `proxy_cache_policy` (828-etu6) fails early, so more than half the
      workspace's tests never ran at all — and the seven failures behind it
      were invisible.

      WHY THIS IS WORTH A PACKET RATHER THAN A HABIT. I reported "801 passed,
      1 failed, and the failure is filed" in a cycle close-out on 2026-08-18.
      That sentence was wrong in both numbers and I had no way to notice from
      the output I had: a truncated run and a complete run look identical
      except for the totals, and nobody knows the totals in advance. The
      failure mode is silent under-reporting of test coverage, by an agent
      being careful.

      NOTE `./build.sh --check` DOES NOT RUN TESTS AT ALL (it is check + clippy
      + fmt + the local gates), so the gate never contradicts the claim either.
      `--test` is the phase that runs them; see whether it inherits the same
      truncation.

  - packet_id: macos-podman-tests-poison-a-shared-mutex-and-take-five-with-them
    order: 829-wp9x
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "one Linux-assumption test panics while holding tillandsias-podman's global test mutex, and the five tests that touch it afterwards die of PoisonError rather than of anything real"
    deliverable: "platform-inapplicable tests skip loudly instead of panicking, and the shared guard survives a panicking test"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [rust, macos, podman, ci-gates, fail-loud]
    estimated_hours: 2
    context: |
      SURFACED 2026-08-19 by the first --no-fail-fast run of this workspace on
      macOS (see 829-g4xf). 8 failures, but only THREE root causes:

      ROOT 1 — crates/tillandsias-podman/src/lib.rs:1379
        assertion failed: require_desktop_user_session("desktop runtime test").is_err()
        A Linux desktop/XDG-session assumption. On macOS the call does not
        return Err, so the test panics.

      COLLATERAL — crates/tillandsias-podman/src/lib.rs:1228:56, FIVE tests:
        local_transport_isolation_env_enables_storage_overrides
        local_transport_uses_host_defaults_without_isolation_env
        log_helper_writes_one_line_to_stderr
        remote_transport_uses_remote_flag_and_skips_local_storage_args
        runtime_lane_classification_prefers_service_account_then_devtest_then_desktop
        Every one dies with `Result::unwrap() on an Err value: PoisonError`.
        They are not failing on their own merits at all — ROOT 1 panicked while
        holding the shared guard at :1228, poisoning it, and `.unwrap()` on a
        poisoned lock turns one real failure into six red tests. The five say
        nothing about the code they name, which is the expensive part: anyone
        triaging this reads six failures and starts in the wrong place.

      ROOT 2 — crates/tillandsias-metrics/src/sampler.rs:822
        assertion failed: s.previous_diskstats.is_some()
        Reads /proc/diskstats, which does not exist on macOS. Linux-only test,
        not gated.

      ROOT 3 — proxy_cache_policy, already filed as 828-etu6.

      TWO SEPARABLE FIXES, and the second is the one that generalises:
        1. Gate or skip the platform-specific tests (ROOT 1, ROOT 2) so they
           report "not applicable here" instead of red.
        2. Stop `.unwrap()`ing the shared guard. Recovering from poisoning
           (`.unwrap_or_else(|e| e.into_inner())`) keeps one failure worth one
           failure. A test-support mutex that converts any panic into a cascade
           makes every future failure in this crate harder to read.

