        - "crates/tillandsias-vm-layer/src/vz.rs — VzShare + shares: Vec<VzShare>; builder emits N devices in ONE setDirectorySharingDevices call"
        - "two_shares_become_two_directory_sharing_devices — real VZ objects, asserts device count 2"
        - "falsified: per-share setDirectorySharingDevices measured to keep only 1 device (left: 1, right: 2)"
        - "cloud-init persists `model-cache /root/.cache/tillandsias/models virtiofs nofail 0 0`; mount point pinned against the unit's Environment=HOME=/root"
        - "crates/tillandsias-headless/src/main.rs — chown_tree now reports failures instead of `let _ =`, naming the order-313 consequence"
        - "live_boot_spec_caps_cpu_at_4_and_carries_4gib_memory: broken by my own 05b1ebc6f, re-anchored, now asserts its anchor exists; falsified both ways"
