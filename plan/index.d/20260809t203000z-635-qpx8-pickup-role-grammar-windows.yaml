        "linux (litmus harness); Windows/macOS replicate later"      -> claimable as macos, windows
        "linux (Rust launcher + lib-common.sh); Windows/macOS verify" -> claimable as macos, windows
        "windows/macos with linux control-wire support"               -> claimable as linux, macos

      Found by a Windows cycle draining its own queue: packet 513
      dev-end-user-gating-litmus is owned by linux and its Windows clause says
      "replicate LATER", but it appeared in `query --role windows` and was the
      third packet the cycle opened.

      This is the over-match half of 632-39p3. That packet records the
      under-match half (`any` dropped, starving the sibling lanes). One field,
      two consumers, opposite failures.

      Three co-owned values ("linux (XDNA2 lane) + macos (Metal lane)" and
      friends) are NOT part of this: both lanes genuinely own a half and matching
      both is correct. The checker counts them separately and does not fail on
      them.
    exit_criteria:
