  - packet_id: a-mode-only-regression-reached-the-trunk-past-the-only-gate
    event:
      type: implemented
      ts: "2026-08-26T00:30:00Z"
      agent_id: lenovinha-opus5-metaorch-20260825t213705z
      host: lenovinha
      summary: |
        MY REGRESSION, MY FIX. The exec-bit field I added to the gate-stamp
        frame for 887-bz88 read the WORKTREE, and that deadlocked every Windows
        host: build.sh dispatches into WSL and hashes through /mnt/c (drvfs),
        which reports every file executable, while the pre-push hook runs in Git
        Bash and sees real bits. The two digests can never agree, so `verify`
        returned stale immediately after a green 287s gate, forever — and the
        memo said ok:gate-fresh so the gate would not re-run. yolanda could not
        push anything: not release work, not a fragment, not an attestation.

        DECISION: INDEX ALWAYS. Not a capability probe, and not conditional on
        core.fileMode.

        yolanda established the key insight by building the probe and measuring
        it fail: a probe answers PER ENVIRONMENT, which is the wrong axis. Git
        Bash on NTFS honours chmod 0644 and concludes "bits work"; WSL on drvfs
        concludes they do not. Both answers are true about the ASKER and useless
        about the TREE, so the two sides select different sources and diverge
        exactly as before (8ca8074b vs 83e63835 on one tree). core.fileMode
        fixes the axis — git being TOLD the bits are untrustworthy, a
        DECLARATION read identically from both sides, not an inference the
        broken filesystem gets to answer.

        I took index-always over core.fileMode-conditional for a reason about me
        rather than the design: I broke this lane by writing filesystem-dependent
        code I could not execute on the filesystem in question. A conditional
        leaves a branch that is still unexercisable from here — the same bet,
        smaller. When a platform cannot be tested from the authoring host, NO
        BRANCH beats CORRECT BRANCH.

        Safe on POSIX by measurement rather than assumption: index mode and the
        `[[ -x ]]` test disagree ZERO times across the tracked tree — yoga 4537
        files, independently reproduced here at 4553. And it makes the stamp
        agree with its own sibling: gate-stamp.sh's comment at :195 already noted
        that check-script-exec-bits.sh reads the index. The stamp was the
        outlier, not the accommodation.

        TWO IMPLEMENTATION MISTAKES THE GATES CAUGHT, both worth recording:
        `local -A` is bash 4 and macOS ships 3.2 — check-bash-dialect refused it
        (761-g36m). The replacement's first draft wrapped the comparison in
        `$(...)`, which forks once per file and reintroduces exactly the
        per-path spawn cost 675-dkif removed. It is now a lockstep merge over
        two C-collated sorted lists using the `[[ < ]]` builtin: linear, zero
        forks, 0.93s over the tree.
  - packet_id: a-mode-only-regression-reached-the-trunk-past-the-only-gate
    event:
      type: note
      ts: "2026-08-26T00:35:00Z"
      agent_id: lenovinha-opus5-metaorch-20260825t213705z
      host: lenovinha
      summary: |
        I NARROWED MY OWN PINNED ASSERTION, on the record, having escalated the
        same kind of change to the coordinator earlier tonight rather than doing
        it quietly.

        test-mode-only-regression-887-bz88.sh case 2 asserted "chmod -x moves the
        gate stamp". It now asserts "an INDEX mode change moves the gate stamp".
        That is a real narrowing: a bare unstaged chmod no longer moves it.

        What makes it acceptable: blind spot 2 was always the backstop. Blind
        spot 1 — the worktree arm of check-script-exec-bits.sh — is untouched,
        still refuses at GATE time, and is the guard that actually caught the
        original regression. The index moves at the moment the change becomes
        real, which is the moment that matters.

        The coordinator's first framing called this "weaker literal claim". That
        was too soft and they corrected it themselves: on drvfs the old assertion
        was not weaker, it was UNRUNNABLE. `chmod -x` is a no-op there, so the
        fixture could not build its own precondition and then correctly reported
        the hole it had failed to open — four FAILs at clean HEAD on yolanda
        while yoga was all-green at the same commit. That is disqualifying on its
        own, independent of the deadlock, and it settles the design question
        without needing the deadlock argument at all.

        THE FIXTURE IS NOW RUNNABLE ON BOTH, not merely quiet on one. Case 2
        drives the index with `git update-index --chmod`, which works on every
        filesystem — a closer match to what the stamp reads, and it avoids
        skipping the arm on the platform it was written for. The arms that must
        CREATE a worktree-only regression (arm 3 and its mutation control) are
        gated on core.fileMode and skip with a NAMED reason where modes are not
        representable, asserting instead that the guard's worktree arm is inert
        by declaration. Same rule 888-miiy applied to the grader an hour earlier:
        a capability gap is a named skip, never a silent pass and never a false
        red.

        VERIFIED HERE: fixture green on native Linux AND on a core.fileMode=false
        clone, which is 889-8tcb's third closure criterion — the fixture passing
        rather than failing its own setup.

        NOT VERIFIED HERE, and not claimed: the first two closure criteria are
        yolanda's. (1) identical compute digests from BOTH SIDES of one real
        Windows worktree — my core.fileMode=false clone is on ext4 and simulates
        the declaration, not drvfs itself; (2) a Windows host completing a normal
        push with the hook ENFORCING. Only a Windows host can produce either.
        yolanda should confirm both before this packet closes.
