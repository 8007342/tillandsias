    title: |
      `if ! <pipeline>` inverts guards: `grep -q` exits on first match, the producer dies of SIGPIPE, `pipefail` promotes 141, and the guard PASSES BECAUSE the violation was found.
    context: |
      THE MECHANISM. Under `set -o pipefail`, `if ! producer | grep -q
      PATTERN; then FAIL; fi` does the opposite of what it reads as. `grep -q`
      exits 0 the instant it matches; the producer then writes to a closed
      pipe, takes SIGPIPE, and exits 141; `pipefail` promotes 141 to the
      pipeline status; `!` inverts a nonzero status to success; the guard
      reports PASS. The pass is CAUSED by finding the violation.

      TWO p0 INSTANCES ALREADY IN THE LEDGER, both with real consequences:
        * 702-pwhc — failed the release guard OPEN.
        * 731-pc5r — silently disabled EVERY Rust check below an advisory
          step.
      AND 792-ksr8 found the shape FOUR TIMES IN ONE NIGHT. That is the
      argument for a gate rather than a fourth fix: the class reappears faster
      than it is found by reading.

      WHY THIS IS 700-nz4n's SHAPE AND NOT MERELY A BASH BUG. The guard
      DETECTED the condition correctly — the pattern matched, the violation
      was really there — and the detection was wired to a PASS. That is
      "a correct diagnosis that stops nothing", in its purest form.

      THE PRECEDENT AND THE REPLACEMENT BOTH ALREADY EXIST:
        * precedent for a bannable construct: scripts/check-no-python-scripts.sh
          and scripts/check-no-base64-script-injection.sh
        * the house `case` idiom, already used correctly:
          scripts/freshness-inventory.sh and scripts/check-no-tracked-binaries.sh
          capture output first, then `case "$out" in *pat*) ... ;; esac` —
          no pipeline status is ever consulted as a verdict.
    exit_criteria:
      - |
          A gate refuses `if ! <pipeline containing a spawn>` in scripts/, in
          the same family as check-no-python-scripts.sh, wired into
          `./build.sh --check`.
      - |
          Every existing occurrence in scripts/ is converted to the `case`
          idiom or explicitly annotated with a reason it is safe, so the gate
          starts GREEN and cannot be landed as advisory-only.
      - |
          NEGATIVE CONTROL, mandatory (bar-raise 634-39ik): the gate accepts
          `if ! <single command>` with no pipeline and accepts the `case`
          idiom, so "fail loud" cannot degrade into "refuse every conditional".
          Proven by fixture scripts the gate must PASS.
      - |
          The class is recorded once where the next author will read it — a
          cheatsheet entry or methodology rule — rather than only in the
          gate's error text.
    verifiable_closure: |
      NAMED: `scripts/check-no-spawn-in-if-not.sh`, wired into
      `./build.sh --check`, plus `litmus:if-not-pipeline-guard-shape` carrying
      the negative controls: a fixture script using `if ! grep -q` in a
