    title: |
      There is no single lowest-level place that constructs a `wsl.exe` child, so every cross-cutting policy about wsl.exe has to be applied N times and can be forgotten N times.
    context: |
      FOUND WHILE IMPLEMENTING THE WSL_UTF8 SLICE (2026-08-17). The operator
      directive was "rely on frameworks doing their thing — maybe just set the
      right env var". Setting it turned out to need edits in three crates
      because there is no shared constructor:

        * `tillandsias-vm-layer` cannot depend on `tillandsias-podman` and
          says so in-code ("this crate cannot depend on the podman crate for
          one flag", lib.rs, above `no_window_async`).
        * `tillandsias-podman` does not depend on `tillandsias-vm-layer`.
        * `tillandsias-vm-layer` does not depend on `tillandsias-core`, which
          is the only crate BOTH spawning crates already share.

      So `no_window_async`/`no_window_sync` already exist TWICE, once per
      crate, as acknowledged mirrors — and as of this session
      `wsl_command_async`/`wsl_command_sync` do too. That is two copies of a
      policy surface, which is exactly the shape that let WSL_UTF8 be applied
      at 5 of 17 sites for months while the other 12 hand-scrubbed NUL bytes
      out of UTF-16LE output.

      THE EVIDENCE THAT THIS COSTS SOMETHING REAL. Before this session, six
      call sites set `WSL_UTF8=1` and eleven did not; the eleven compensated
      with `.replace('\u{0}', "")`. The compensation is not merely ugly — it
      is indistinguishable from the LEGITIMATE scrubs on hcsdiag.exe and the
      CIM probe output, which are different binaries that WSL_UTF8 does not
      reach. A reviewer cannot tell the two apart by grep, and the audit that
      produced this chain mis-classified two of the five sites it named for
      exactly that reason.
    exit_criteria:
