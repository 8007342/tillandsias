  - packet_id: host-guest-transport-windows
    event:
      type: note
      ts: "2026-08-17T07:10:08Z"
      agent_id: windows-opus5-subtractive-20260817
      host: windows
      summary: |
        NEGATIVE RESULT, MEASURED — the Windows non-elevated control wire is
        NOT corrupted by wsl.exe. Recorded here because this is where the
        non-elevated wire is documented, and because the risk was raised as
        open by the 2026-08-17 architecture audit.

        THE WORRY. The non-elevated Windows transport (order 312 fallback) is
        `wsl.exe -d <distro> -- socat STDIO VSOCK-CONNECT:1:<port>` with binary
        postcard frames riding the child's stdio. wsl.exe is known to mangle
        its OWN output (it emits UTF-16LE unless WSL_UTF8 is set — measured
        the same session). If it also transformed CHILD stdout, every frame on
        that wire would be silently corrupt.

        THE MEASUREMENT, on yolanda, 2026-08-17. 65536 bytes from
        /dev/urandom were written inside the guest, then piped out through
        `wsl.exe -d tillandsias-build -- cat`. SHA256 in-guest and SHA256 on
        the Windows side are IDENTICAL:
          90b86eca564cd8b4e7e3668ce1f998bacd33ccf496d7116af09535ec006e5e2f

        CONCLUSION. wsl.exe child stdout is byte-transparent. The UTF-16LE
        behaviour applies to wsl.exe's OWN messages only. The non-elevated
        wire is sound on this axis, and no framing defect should be attributed
        to it. Two consequences worth carrying forward:
          1. NUL-scrubbing applied to guest-produced bytes on this path was
             always dead code, never protection.
          2. Real framing defects on this wire have other causes — see
             795-57y6 (a non-cancellation-safe read inside a select!) which is
             a live mechanism for silently desynchronizing exactly this wire.
