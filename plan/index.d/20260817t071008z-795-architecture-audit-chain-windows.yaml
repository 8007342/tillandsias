  - packet_id: select-over-non-cancel-safe-read-exact-on-guest-connection
    order: 795-57y6
    status: ready
    kind: bug
    pickup_role: any
    priority: p1
    desired_release: v0.5
    release_target: architecture-audit-epic
    depends_on: []
    deliverable: |
      The guest connection loop stops racing a non-cancellation-safe read
      against six other select! arms; the four mitigations built on top of the
      resulting corruption are deleted.
    capability_tags:
      - rust
      - tokio
      - vsock
      - all-platforms
      - architecture
    tags:
      - exec-wire
      - cancel-safety
      - framing
      - v0.5
      - audit-2026-08-17
    title: |
      `select!` races a non-cancellation-safe `read_exact` against six other arms on the guest connection loop, so a preempted partial frame is silently discarded and the next read interprets payload bytes as a 4-byte BE length.
    context: |
      THE MECHANISM, read in the code. `crates/tillandsias-headless/src/
      vsock_server.rs:977` opens a 7-arm `tokio::select!` over one `stream`.
      The inbound arm at :1112 is `result = read_envelope(&mut stream)`, and
      `read_envelope` (:1575) does `read_exact` for the 4-byte BE length and
      then `read_exact` for the payload. `AsyncReadExt::read_exact` is
      DOCUMENTED as not cancellation-safe: if the future is dropped mid-read
      the bytes already consumed are gone.

      Six other arms — connection_shutdown, the PTY outbound pump, and four
      push-subscription receivers — can all complete first and preempt it.
      The loop then `continue`s on the SAME stream. The partial frame is lost
      with no error and no log line, and the next `read_envelope` reads a
      length field out of the middle of the previous payload. That is an
      arbitrary 32-bit length: it either allocates absurdly, blocks forever
      waiting for bytes that will never come, or silently desynchronizes the
      wire.

      THE CORRECT PATTERN IS ALREADY IN THE TREE, on the sibling transport.
      `crates/tillandsias-macos-tray/src/pty_vsock_bridge.rs:117-118` calls
      `into_split()` and runs a dedicated `reader_task` (:265) and
      `writer_task`. Neither task's read is ever a select! branch, so
      cancellation cannot reach it. Port that shape; do not invent a third.

      WHAT THIS UNLOCKS. Four mechanisms exist to survive or diagnose the
      corruption this defect causes. File them as dependent children or carry
      them as exit criteria here — either way they go in the same change:
        * the v1 IN-BAND HEARTBEAT — crates/tillandsias-headless/src/
          pty_handler.rs:677 and crates/tillandsias-vm-layer/src/
          vsock_exec.rs:1057-1069, :693
        * the 4-HOUR WALL-CLOCK CEILING — vsock_exec.rs:81-151, :1033
        * `TILLANDSIAS_VSOCK_EXEC_TRACE` — vsock_exec.rs:672-687
        * `write_envelope_with_shutdown` — vsock_server.rs:1610
    exit_criteria:
      - |
          The guest connection's read is owned by a dedicated task over an
          `into_split()` read half, and NO read future appears as a select!
          branch anywhere on that stream.
      - |
          The four mechanisms above are deleted, each named in the commit.
      - |
          NEGATIVE CONTROL: a genuinely truncated frame (peer closes
          mid-payload) is still reported as an error and still closes the
          connection. The fix must not convert a real truncation into silence.
      - |
          A regression test drives a frame interleaved with a push on the same
          connection and asserts the frame arrives INTACT — and the same test
          FAILS against the pre-fix code.
    verifiable_closure: |
      NAMED: `litmus:vsock-frame-survives-concurrent-push` — opens one guest
      connection, subscribes to a push topic, then sends a large inbound
      envelope while pushes are in flight, and asserts (a) the envelope is
      received byte-identical, (b) the connection is still usable for a second
      envelope afterwards, and (c) by source scan, that `read_envelope(` does
      not appear inside any `tokio::select!` block in vsock_server.rs.
      Criterion (c) is the one that cannot silently regress.
    events:
      - type: filed
        ts: "2026-08-17T07:10:08Z"
        agent_id: windows-opus5-subtractive-20260817
        host: windows
        summary: |
          Filed from the 2026-08-17 architecture audit, operator-approved. The
          audit's judgement, recorded because it explains the four deletions: the
          heartbeat, the 4h ceiling, the exec trace env var and the
          shutdown-aware writer are all COMPENSATIONS for a wire that can
          silently desynchronize. Remove the cause and they have nothing to
          compensate for.
