  - packet_id: windows-connect-path-unbounded-and-uncancellable
    order: 795-tb4a
    status: ready
    kind: bug
    pickup_role: windows
    priority: p2
    desired_release: v0.5
    release_target: architecture-audit-epic
    depends_on: []
    deliverable: |
      A real bound on the Windows hvsocket connect, a bound on the hcsdiag
      shell-out, and a runtime that actually exits.
    capability_tags:
      - rust
      - windows
      - winsock
      - vsock
      - architecture
    tags:
      - transport
      - timeout
      - v0.5
      - audit-2026-08-17
    title: |
      The Windows connect path is unbounded and uncancellable — SO_SNDTIMEO does not bound `connect()` on Winsock, the connect runs in an uncancellable `spawn_blocking`, and the VM-ID lookup shells out with no timeout, so `Runtime::drop` blocks after the last line prints.
    context: |
      THREE INDEPENDENT CAUSES, ONE SYMPTOM.
        1. `crates/tillandsias-vm-layer/src/transport_windows.rs:218-227` sets
           `SO_SNDTIMEO` with the stated intent of bounding `connect()`. On
           Winsock `SO_SNDTIMEO` bounds `send()`, NOT `connect()`. A blocking
           `connect()` to an hvsocket that never answers runs to the stack's
           own timeout, which is not the value configured here.
        2. `:253` runs that connect inside `spawn_blocking`. A blocking task
           cannot be cancelled; `tokio::time::timeout` around it returns to
           the caller while the thread stays parked in the syscall.
        3. `wsl_utility_vm_id()` at `:129-140` shells out to `hcsdiag list`
           with no timeout at all.
      NET EFFECT: `Runtime::drop` waits for the blocking pool, so the process
      appears to hang AFTER printing its last line — the single most
      misleading failure shape there is, because every log says the work
      finished.

      SEPARATE DEFECT, SAID EXPLICITLY SO NOBODY MERGES THEM. This is NOT the
      cause of the 2026-08-16 build-install smoke's apparent hang. That was
      the Windows tray's missing unknown-flag refusal (E4): the smoke invoked
      `--provision`, no arm matched, the binary fell through to the GUI tray
      and went resident. `target/build-install-smoke-e2e/20260816T113732Z/
      03-provision.log` is 528 lines of the child wsl.exe's dnf output with
      ZERO `[provision]` lines and ZERO RESULT lines, and `provision_once()`
      prints `[provision] starting recipe provisioning…` as its very first
      line — so it never ran. The flag fall-through is fixed as of this
      session. BOTH defects are real; only the flag one explains that log.
    exit_criteria:
      - |
          The connect is bounded by a mechanism that actually bounds connect
          on Winsock — non-blocking connect + WSAPoll with an explicit
          deadline, or an equivalent — and the bound is proven by connecting
          to an address that never answers and measuring the elapsed time
          against the configured budget.
      - |
          The connect is cancellable, or the process exits deterministically:
          `Runtime::shutdown_timeout` (or an explicit `std::process::exit`
          after the last write) so a parked blocking thread cannot hold the
          process open past its last printed line.
      - |
          `wsl_utility_vm_id()` bounds its `hcsdiag list` child.
      - |
