packets:
  - packet_id: explicit-seed-cannot-override-ordinal-routing
    order: 949-uv5k
    status: ready
    kind: fix
    priority: p1
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    pickup_role: linux
    depends_on: []
    capability_tags:
      - orchestration
      - plan
      - coordination
    title: >
      select-work-batch.sh documents "pass --seed explicitly to override" for a
      host routed onto a thin epic, and under ordinal routing the seed is never
      consumed — the escape hatch is unreachable, and it disappears as the
      roster fills.
    context: |
      MEASURED on lenovinha 2026-08-31T10:53Z. Seven unrelated seeds (`aaa`,
      `zzz`, `12345`, `macuahuitl-20260819`, `yoga-x`, `pirria-q7`, a random
      one) produced BYTE-IDENTICAL output: same epic, same `pick=2/7`, same
      score. The batch line reports `route=rank:2/7:width=7`.

      THIS IS NOT THE DOCUMENTED SEED-COLLISION DEFECT. That one (host KIND
      instead of identity) was fixed by `derive-host-identity.sh`, and ordinal
      routing (847-wgy4) deliberately supersedes seeding for separation —
      ordinals give zero collisions where hashes give ~2.5. Routing is right
      and this packet does not propose weakening it.

      THE DEFECT IS THAT THE DOCUMENTED ESCAPE HATCH NO LONGER EXISTS. The
      KNOWN TRADEOFF comment in `select-work-batch.sh` says, of a day landing
      on an epic that cannot be drained: "Squared weighting holds that at
      roughly 1 day in 10; pass --seed explicitly to override when it happens."

      The pick is then taken as:

          if [ "$ROUTE" != "seed" ]; then
              pick="$routed_pick"
          else
              pick=<seeded draw over the score-weighted probabilities>

      Under routing `ROUTE` is `rank:<n>/<m>:width=<w>`, so the seeded branch is
      dead and `--seed` is inert. The remedy the comment names cannot be
      performed by the hosts the comment is about.

      IT GETS WORSE AS THE ROLLOUT SUCCEEDS. Routing engages only for a host
      with a published capability row that is not `low-end`; the seeded path
      "remains for hosts with NO row". Rows are landing host by host under
      850-bif2, so every host that gains one silently loses the override. The
      escape hatch decays in exact proportion to the roster filling up.

      TODAY'S INSTANCE, which is what surfaced it. This host has been routed to
      `architecture-audit-epic` for four consecutive cycles. Its four packets
      are not thin on residual — they are thin on ACTIONABILITY HERE: 689-zwzm
      needs an operator authorization recorded on a different host, 795-5itp's
      remaining sites are macOS/Windows-owned files, and 245/251 are
      multi_cycle packets in `phase: review` that no worker may close. Meanwhile
      `socket-audit-master` sits at the top of the frontier with residual 22.1
      and `blocking=9`, holding real Linux work (156 linux-native-stream-audit,
      157 headless-podman-unix-streams, 147, 148), and is unreachable from this
      host today.

      SO THERE IS A SECOND, LARGER QUESTION THIS PACKET DOES NOT DECIDE:
      routing has no notion of whether the epic it routes a host to contains
      work that host can actually do. Residual is a property of the epic;
      actionability is a property of the (epic, host) pair. Restoring the
      documented override is the small correct fix and is all this packet
      claims. Whether routing should also weigh actionability is a design
      question for the coordinator, and filing it as one is deliberate — a
      worker quietly reseeding around the router would destroy exactly the
      cross-cycle cohesion and cross-host separation the router exists for.

      ALSO NOTED, same class, not fixed here: the triage litmus's arm
      "REPRODUCIBLE: the same seed yields the same batch" runs
      `--seed fixed-seed-1` twice and compares. On a ROUTED host that arm
      passes because the seed is ignored — it would pass against a build that
      had deleted seeding entirely. Its sibling entropy-floor arm already
      detects routing and declares itself n/a; this one does not.
    exit_criteria:
      - an explicitly passed --seed takes the seeded score-weighted pick even when ordinal routing is active, while the DEFAULT (no --seed) still routes by rank so separation and cross-cycle cohesion are unchanged
      - the batch line stays inside the grammar the triage litmus pins - an explicit-seed run reports no route= field, because the pick did not come from rank
      - a fixture proves BOTH directions with mutation testing - explicit --seed varies the epic under routing, and absence of --seed does not
      - the litmus reproducibility arm is made non-vacuous on a routed host, or explicitly declares itself n/a there the way the entropy-floor arm does
    notes: |
      Order minted with next-order. Found while orienting cycle
      20260831t105311z; select-work-batch.sh is fleet-shared, so the change is
      announced to the coordinator rather than landed silently.
