      summary: >
        THE RELEASE NOW CARRIES THE BINARY, AND THE RESOLVER LOOKS WHERE THE
        INSTALL PUTS IT. Route (a) plus route (c) of the two the packet offered.
        Route (b) — resolving the installed tray as a capability candidate — was
        not taken: the tray does not expose the probe surface, so it would have
        meant teaching a GUI binary a second vocabulary to avoid shipping a
        binary that already speaks it.

        WHY (c) IS NEEDED EVEN WITH (a). install-windows.ps1 extracts into
        $LOCALAPPDATA\Programs\Tillandsias, and that directory is NOT on PATH —
        measured on yolanda, `command -v tillandsias` finds nothing on a host
        with a tray installed. So shipping the binary without (c) would have put
        it on disk where nothing looks. The installer is deliberately NOT made
        to edit the user's PATH: that is a permanent change to state the platform
        does not own, made on every install, for a nicety this packet does not
        need.

        THE REGIME GUARD IS THE POINT OF THE THIRD ARM. The candidate exists only
        when LOCALAPPDATA is set, so the in-guest Linux locus never consults a
        Windows path and never reports a Windows binary as its own — which is the
        same failure mode 889-ewvt names and the reason esme declined both
        substitutes in the original context.

        AND 1172-dyvd STILL APPLIES THERE. Living in the install directory is not
        a currency claim; a stale installed tillandsias.exe is refused by name
        exactly like any other candidate. Without that arm this order would have
        re-opened the stale-row defect through a new door, which is why the
        vocabulary probe was kept on the new candidate rather than exempted.
