    title: |
      The operator, 2026-09-14, on 804-deux's scope finding: "let's add the keep models flag to our resets." TILLANDSIAS_RESET_KEEP_MODELS=1 lets a clean-room reset and an uninstall --wipe spare the model cache (cache_root()/models) on the operator's word, with the default unchanged: the clean room stays clean (the 2026-09-13 reset ruling). Where models live decides the shape: Linux keeps them already (the podman reset and the credential clearer never touch ~/.cache/tillandsias/models, so the flag is a documented no-op there); macOS wipes them today because both smoke runbooks rm -rf the whole cache dir inline — that destroy moves into scripts/e2e-step2-macos.sh, one source for both runbooks (803-49re: a second copy is where the fix does not go), which honours the flag; uninstall.sh --wipe honours it on both. Windows is a separate row: the weights live INSIDE the distro (806-a4tu), so wsl --unregister cannot spare them until they move to a host-side mount.
    context: |
      Measured by macbookair (804-deux part 2, 2026-09-14): the v56.9.13.1 macOS
      smoke wiped the models dir wholesale hours before the survival test, so
      the dir was absent and had to be seeded; ~2.47 GB re-download per smoke
      run. The coordinator decided the clean room stays clean by default and
      surfaced a keep-models knob as one line and the operator's word; the
      operator said yes. Semantics: opt-in, per run, env-driven so a smoke
      runbook or an operator's uninstall can set it without a CLI change;
      never the default; the residue assertion must still run and must NAME
      the spared directory so a run that kept models cannot read as a clean
      room by accident. The fixtures are hermetic (a fake HOME with a seeded
      models/ and non-model files, no real tray, no podman: shadow podman with
      a stub on PATH for uninstall.sh).
    exit_criteria:
      - 'e2e-step2-macos.sh: flag set → models/ byte-identical and named in the residue line, everything else gone; flag unset → everything gone (pre-fix result: FAILS — no script existed; the runbooks rm -rf inline)'
      - 'uninstall.sh --wipe: flag set → $CACHE_DIR/models survives; flag unset → gone (pre-fix result: FAILS)'
      - 'both smoke runbooks call the script on macOS; e2e-step2-linux.sh reports the models dir it spared; the DESTRUCTIVE sections document the flag and the operator ruling'
      - 'NEGATIVE CONTROL: the variable appears in no other executed path'
