      host: linux
      summary: |
        TWO HONESTY DEFECTS IN MY OWN INSTRUMENT, found by USING it rather than by
        testing it. I emitted this cycle's record, read the views back, and both views
        were saying something adjacent to what they claim — which is the exact class this
        packet exists to remove.

          1. token_recur RANKED A ZERO-SPEND LABEL. Two cycles under one label, both
             subagent_tokens=0, rendered as
                 top3=advance-work-from-plan-drain:tokens=0:runs=2
             The top "token-expensive repeated work" was work that spent no tokens. A
             label now counts toward recurrence only once it has actually cost
             something.

          2. token_max RENDERED `label=- cycle=-` ON A NON-EMPTY LOG. The max only
             updated on `st > maxv`, so a window where every record spent 0 never set a
             label, and the line was indistinguishable from having no data at all.
             "The largest spend was 0, and here it is" and "there is nothing here" are
             different answers and must not share a rendering. Now the first stamped
             record always names a cycle.

        Both pinned (15/15, was 13). Neither was reachable from the fixtures I wrote,
        because every fixture arm I built used NON-ZERO spends — the fixture corpus was
        unrepresentative of the first real host to use the thing, which spawns no
        sub-agents at all. Dogfooding found in one reading what the test suite could not.

        WORTH GENERALISING: the negative-control arms I was careful about all asked "does
        a zero-agent cycle report zeros" — they did — and none asked "what do the RANKING
        views say when everything is zero". A control that checks the record and not the
        VIEW leaves the view unexamined.
