# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by windows (yolanda), 2026-08-17, meta-orchestration FULL cycle.
# Intake: OPERATOR-REPORTED failure during the v0.4.260817.1 curl-install smoke.
#
# The operator clicked "GitHub login" on a freshly curl-installed, freshly
# provisioned v0.4.260817.1 and it failed. It was not a GitHub problem: the flow
# never reached GitHub. Vault's generate-root self-heal could not authenticate,
# and the correct unseal key was sitting in the guest's own podman secret the
# whole time.
#
# Root cause chain, each link verified rather than inferred:
#   1. Windows Credential Manager retains vault-shamir-share-v1 across a guest
#      wipe. NOTHING in the product ever deletes it.
#   2. deliver_credentials_and_check_handover pushes that host copy into the
#      guest on every tray connection, making the host authoritative over the
#      guest's live vault state.
#   3. A re-provisioned guest has a NEW share. The stale host share overwrites
#      the guest's correct one within seconds of every tray start, so the guest
#      can never converge.
#   4. generate-root therefore fails forever, retrying ~every 30s, and the error
#      shown to the operator prescribes a remedy far more drastic than needed.

packets:
  - packet_id: windows-credential-manager-retains-stale-unseal-share-across-guest-wipe
    order: 803-49re
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "every Windows reset path (--reset-guest, installer -Purge, the e2e smoke) wipes the guest vault but never clears vault-shamir-share-v1 from Credential Manager, so the tray re-pushes a stale share into the fresh guest and GitHub login is permanently broken"
    deliverable: "the host->guest credential handover reconciles instead of overwriting (a host share that fails to authenticate against the live vault loses to the guest's own unseal secret), AND every guest-wipe path clears vault-shamir-share-v1 + vault-root-token-v1 from Credential Manager"
    pickup_role: windows
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [windows, tray, vault, rust, release, fail-loud]
    context: |
      OBSERVED 2026-08-17, operator-reported, on a freshly curl-installed
      v0.4.260817.1 whose guest had been wiped and re-provisioned ~40 minutes
      earlier by the release smoke. Tray menu -> GitHub login failed in ~1.3s,
      twice (tray.log 18:42:42Z, 18:43:35Z, both `signing-in` -> `signed-out`).

      What the operator saw (guest /root/.cache/tillandsias/github-login-last.log):

        [tillandsias-vault] cached root token rejected by the token store
        [tillandsias-vault] heal: fallback file Shamir share rejected by generate-root
          "error decrypting seal wrapped value ... cipher: message authentication failed"
        Error: OPERATOR ACTION REQUIRED: generate-root rejected the stored Shamir
        share. The share no longer matches vault storage. Storage was left
        untouched — recover the correct share or perform an attended
        storage-preserving re-init. Do NOT wipe the vault-data volume.

      MEASURED, not inferred. Two generate-root attempts against the live vault:

        A  share derived from podman secret tillandsias-vault-unseal -> complete=true
        B  share from /root/.cache/tillandsias/fallback_vault-shamir-share-v1
             -> rejected, "cipher: message authentication failed"  (the operator's error)

      The two are genuinely different keys (base64-decoded A != B), not one key
      in two encodings — checked explicitly, because the lengths differ (32 raw
      vs 44 base64) and that alone would have been an easy false conclusion.

      THE OVERWRITE IS OBSERVABLE. The fallback share was repaired from the
      podman secret at 18:49:51Z and verified authenticating. The tray was
      relaunched at 18:50:0xZ. By 18:50:30Z the file was stale again. The host
      copy wins, every time.

      MECHANISM. crates/tillandsias-windows-tray/src/installation_uuid.rs:155
      `deliver_credentials_and_check_handover` reads vault-shamir-share-v1 and
      vault-root-token-v1 from Credential Manager (:159-160) and sends them into
      the guest as DeliverCredentials (:166-171) BEFORE calling GetVaultHandover
      (:194) to read the guest's real values back. Delivery is unconditional:
      nothing checks the delivered share against the vault it is being delivered
      to.

      WHY EVERY RESET PATH HITS IT. `delete_installation_uuid_for` (:141) is the
      only credential-delete in the crate and is called from TESTS only (:239,
      :285, :291). Nothing in the product deletes the two vault credentials:
      not `tillandsias --reset-guest` (whose own help says "wipe the guest
      substrate (vault + enclave containers/volumes/secrets) ... you'll
      re-authenticate once"), not `install-windows.ps1 -Purge`, not the Windows
      lane of either e2e smoke runbook. So the product's OWN advertised reset
      bricks its own GitHub login.

      THE ERROR TEXT IS THE SECOND DEFECT. "recover the correct share or perform
      an attended storage-preserving re-init. Do NOT wipe the vault-data volume."
      Nothing needed recovering — the correct share was in the guest's own
      podman secret, which the vault entrypoint had already used to unseal
      successfully in the same boot ("unseal key material loaded (32 bytes)",
      "vault unsealed (sealed=false)"). The self-heal never consults that source.
      An operator following this text would perform an attended re-init, or wipe
      more state, to fix a vault that was healthy and unsealed the whole time.

      IT ALSO SPINS. The self-heal retried ~every 30 seconds, in pairs, for the
      full hour between the first failed login and the repair — 18 aborts logged
      in one 10-minute window. A permanently-impossible operation should back off
      and say so once, not busy-retry forever.

      REPAIR APPLIED ON THIS HOST (operator-directed, non-destructive; vault
      storage untouched, exactly as the error text demanded):
        1. stop the tray
        2. cmdkey /delete:vault-shamir-share-v1 ; cmdkey /delete:vault-root-token-v1
           (tillandsias-vm-uuid deliberately preserved)
        3. rewrite the guest fallback share from the podman secret
        4. relaunch the tray
      read_credential_string returns Ok(None) on NOT_FOUND (:73-74), so with the
      host entries absent the tray delivers None and GetVaultHandover
      re-populates Credential Manager from the guest's real state. Verified
      after: fallback share still correct across a tray restart, Credential
      Manager re-populated, `root generation finished` replacing `aborted`,
      cached root token authenticates (display_name=root), zero aborts in 90s.

      NOTE for whoever fixes this: do NOT repair Credential Manager with
      `cmdkey`. read_credential_string parses the blob as UTF-8 (:85) and cmdkey
      stores UTF-16, so a hand-written credential fails with "credential blob is
      not UTF-8". Deleting and letting the handover re-populate is the only
      correct manual path today.
    verifiable_closure: "a test that wipes the guest vault while leaving a host-side share in place and asserts the guest's share wins (or that the wipe cleared the host entries) — red against today's unconditional delivery"
    evidence:
      - "guest /root/.cache/tillandsias/github-login-last.log (operator's original error, preserved)"
      - "tray.log 18:42:42Z + 18:43:35Z github-login -> signed-out in ~1.3s"
      - "generate-root A/B test: podman secret complete=true, fallback file MAC failure"
      - "fallback share repaired 18:49:51Z, stale again by 18:50:30Z after tray relaunch"

  - packet_id: windows-e2e-reset-must-clear-host-side-vault-credentials
    order: 804-ckst
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "the Windows destructive-reset step in both e2e smoke runbooks is not actually a clean room — it wipes the distro and caches but leaves the host's Credential Manager vault entries, so 'truly cold' runs are not cold"
    deliverable: "Windows §2 in both e2e skills clears vault-shamir-share-v1 and vault-root-token-v1 from Credential Manager (preserving tillandsias-vm-uuid), and the report template stops claiming a cold run without it"
    pickup_role: windows
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [windows, testing, docs, vault]
    context: |
      Discovered as the direct cause of 803-49re. The 2026-08-17 curl-install
      smoke report claimed a "truly cold" run because it purged the 34.9GB
      ext4.vhdx AND the rootfs cache — both true, and both irrelevant to the
      host-side credential store the Windows tray treats as authoritative.

      The Host Matrix's Windows destructive-substrate cell reads "`wsl
      --unregister tillandsias` plus cache purge". Neither half touches
      Credential Manager, so every Windows e2e "clean room" silently carries the
      previous install's vault identity forward. That is exactly the class of
      state a clean-room test exists to eliminate, and its survival is what made
      the release look healthy in the smoke and then fail for the operator forty
      minutes later on the first real action.

      The correction has been appended to
      plan/issues/smoke-e2e-findings-v0.4.260817.1-2026-08-17.md rather than
      left to stand — the PASS verdict is still correct for what it measured,
      but the "truly cold" claim was not.
    verifiable_closure: "the Windows lane of both e2e skills names the two credential targets to clear, and a grep of the runbooks finds them"
