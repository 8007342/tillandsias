      host: tlatoanis-macbook-air
      summary: |-
        Raised to p1 and claimed by macbookair-macos on coordinator ruling. Fix:
        (1) cmd_release refuses a live lease the caller does not hold, with refused:release:not-holder:<id>:held-by=<lease_id> and exit 3, removing nothing. The caller is the holder when TILLANDSIAS_LEDGER_LEASE_ID equals the holder's lease_id. With no id set, it is the holder when the holder's host is this host. That same-host fallback is needed because the default lease_id is hostname-pid, new in every process, while the meta-orchestration skill and the fixtures claim and release in separate processes. A missing or stale lease is released as before.
        (2) drain-queue reads the claim verdict from stdout alone (stderr goes to its log), fails closed (only claimed:/reclaimed: proceed), and exports one TILLANDSIAS_LEDGER_LEASE_ID for the whole drain, so its own release is recognised.
        Also fixed: test-drain-queue-bare-refuses' stub printed ok:claim:<id>, which the real script never emits; it now speaks claimed:/released:. That fixture is 3/3 again.
        DESIGN QUESTION for the coordinator: with no id set, the same-host fallback still lets a second same-host agent release a lease. drain-queue no longer does that because it now carries an id. Should the skill also be required to set an id, which would make the check exact everywhere?
