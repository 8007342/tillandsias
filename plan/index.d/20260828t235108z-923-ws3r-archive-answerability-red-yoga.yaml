packets:
  - packet_id: archive-answerability-sweep-cannot-find-a-plan-binary-in-its-own-hermetic-tree
    order: 923-ws3r
    status: ready
    title: |
      scripts/archive-plan-packets.sh --check is red on a CLEAN linux-next:
      the hermetic tree it builds excludes ./target, so the sweep hands its
      Ruby half a RELATIVE target/release/tillandsias-plan that does not
      exist there — and the freshness probe returns that path without
      running it
    kind: bug
    pickup_role: any
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - plan
      - ci
      - fail-loud
      - archive
    estimated_hours: 3
    deliverable: |
      archive-plan-packets.sh --check either passes on a clean checkout or
      fails with a verdict naming the missing binary in the hermetic tree —
      and the freshness probe never returns a path it did not successfully
      run.
    context: |
      MEASURED on yoga (Fedora Silverblue, toolbox builder), 2026-08-28,
      at 63fe57f68 with a CLEAN worktree (`git status --short` empty), and
      again at a50096a8c's parent with my own changes stashed. Not caused by
      the 823-u3k9/889-ewvt work; it reproduces without it.

        bash scripts/archive-plan-packets.sh --check   ->  exit 1
        fail:archive-answerability:sweep-failed

      THE ROOT CAUSE, measured rather than inferred. Re-ran with `--keep` and
      looked in the hermetic tree:

        $ ls target/archive-answerability/tree/target/release/tillandsias-plan
        ls: no such file or directory

        $ cat target/archive-answerability/log/sweep.out
        archive-plan-packets: could not read the fold via
        target/release/tillandsias-plan (--index plan/index.yaml, status
        completed). REFUSING to fall back to a base-index grep: that is the
        defect this replaced, and it silently archives reopened rows.

      check-archive-answerability.sh copies the checkout with
      `--exclude=./target` (the prune list is load-bearing and correct — see
      its own comment about .claude being 60 GB), then runs the sweep inside
      that copy. The sweep resolves its OWN binary there via
      ensure_fresh_plan_binary and passes the answer to the .rb, which
      received the RELATIVE path `target/release/tillandsias-plan`. Relative
      to the hermetic tree, that path does not exist. The caller had already
      exported an ABSOLUTE TILLANDSIAS_PLAN_BIN
      (check-archive-answerability.sh:136) pointing at the real repo's
      binary; the sweep's own resolution overrode it.

      THE SECOND, SHARPER DEFECT — and the reason this belongs to the
      fail-loud milestone rather than being a one-line path fix.
      ensure_fresh_plan_binary RETURNED SUCCESS for a path that cannot be
      executed: the sweep printed neither of its two refusals ("no runnable
      tillandsias-plan" / "the resolved tillandsias-plan is STALE"), so it
      believed it held a fresh, runnable binary. This repo has already named
      that exact rule twice — an executable BIT is a claim, RUNNING the
      binary is evidence (704-zcgi, 721-nyev). The probe is asserting the
      claim.

      WHY IT HID. The failure is ADVISORY inside build.sh: `./build.sh
      --check` still exits 0 with this red inside it, so every host has been
      pushing over a standing failure. The verdict it does print — "the plan
      archiver would change the ready set, OR ITS CHECK COULD NOT RUN" —
      merges a real ready-set regression with an infrastructure miss, so the
      one that is happening cannot be told from the one that would be
      serious.

      RELATED, not the same: 921-vtf4 (three litmus tests standing red behind
      a green --check) is the same disease in the litmus lane, and 748-tkjx
      is the general form.
    exit_criteria:
      - |
        On a clean checkout, `bash scripts/archive-plan-packets.sh --check`
        exits 0 — or exits non-zero with a verdict that NAMES the absent
        binary in the hermetic tree, distinct from the ready-set verdict.
      - |
        The ready-set verdict and the could-not-run verdict stop sharing one
        message: "would change the ready set" and "the check could not run"
        become separate tokens. A guard whose failure text covers both cannot
        be acted on.
      - |
        ensure_fresh_plan_binary does not return a path it has not
        successfully RUN (704-zcgi / 721-nyev applied to the probe itself);
        a resolved-but-unrunnable path is one of its named refusals.
      - |
        NEGATIVE CONTROL: with the fix in place, deliberately removing the
        binary from the hermetic tree still produces the named
        binary-absent verdict and never a silent pass.
    verifiable_closure: |
      On a clean linux-next worktree, `bash scripts/archive-plan-packets.sh
      --check` exits 0, and `bash scripts/check-archive-answerability.sh`
      prints an ok: verdict rather than
      fail:archive-answerability:sweep-failed.
  - packet_id: append-event-archive-guard-counts-files-in-the-live-fragment-directory
    order: 923-28js
    status: ready
    title: |
      scripts/test-append-event-archived-refusal.sh counts files in the REAL
      plan/index.d/ before and after, so ANY concurrent writer fails it — and
      the failure text blames the code under test ("a refusal still wrote a
      fragment") rather than the race
    kind: bug
    pickup_role: any
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - plan
      - ci
      - fail-loud
      - multi-host
    estimated_hours: 2
    deliverable: |
      The archive-refusal test observes only fragments it could have caused —
      a private index, or an identity-based comparison rather than a count —
      so a concurrent writer cannot turn it red, and any red it does produce
      names the fragment that actually appeared.
    context: |
      MEASURED on yoga, 2026-08-28, by tripping it accidentally:

        FAIL: a refusal still wrote a fragment: 62 -> 65
        append-event-archived-refusal: 3 passed, 1 failed
        [build] append-event's archive guard regressed — either events are
        landing on completed work again, or legitimate writes to
        fragment-only packets are being refused

      Nothing had regressed. I had run `git stash push -u` and `git stash
      pop` in the same checkout while `./build.sh --check` was running, to
      test whether an unrelated failure predated my changes. The stash
      removed three untracked fragments and the pop restored them — inside
      the test's measurement window.

      THE MECHANISM (scripts/test-append-event-archived-refusal.sh:90 and
      :119):

        before="$(ls "$ROOT"/plan/index.d/ | wc -l)"
        ... exercise the refusal ...
        after="$(ls  "$ROOT"/plan/index.d/ | wc -l)"

      It counts FILES IN THE LIVE LEDGER DIRECTORY. Any writer active in that
      window — another agent session, a driver cycle, a `git` operation, a
      concurrent `set-field` — moves the count and fails the test. A count is
      also the weakest available observation: it cannot say WHICH file
      appeared, which is why the message has to guess at a cause and guesses
      wrong.

      WHY THIS MATTERS BEYOND ONE FLAKE. This fleet runs driver cycles and
      prompt-launched agent cycles concurrently on the same checkout (see
      873-zcim on stacked cycles). A gate that is red for a reason its own
      message denies is worse than a gate that is absent: the honest reading
      of that output is "append-event's archive guard regressed", and acting
      on it means investigating code that is fine. This is the same class the
      milestone keeps repairing — a truthful component observation supporting
      a false conclusion.

      NOT CLAIMED: that this has ever produced a wrong FIX. I caught it
      because I knew what I had just done. Whether another host has chased it
      is unknown; the point is that the output gives no way to tell.
    exit_criteria:
      - |
        The test no longer reads the live plan/index.d/ for its
        before/after observation — it uses a private index (the tooling
        already supports --index) or compares the SET of fragment names, not
        a count.
      - |
        A red names the specific fragment path that appeared, so a reader can
        tell a real refusal-leak from someone else's write.
      - |
        NEGATIVE CONTROL, the one that matters: with the fix in place, a
        concurrent writer adding an unrelated fragment mid-test does NOT turn
        it red; a genuine refusal-that-wrote-a-fragment still does.
    verifiable_closure: |
      bash scripts/test-append-event-archived-refusal.sh passes while a
      background loop creates and deletes unrelated files in plan/index.d/,
      and still fails when the refusal path is deliberately made to write a
      fragment.
