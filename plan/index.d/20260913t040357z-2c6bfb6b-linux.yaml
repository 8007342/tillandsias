        ROUTING — nothing publishes it, no HTTP_PROXY names it, no build passes it. It
        is not about REACHABILITY: enclave containers share a network with the proxy and
        can dial it by container address whether or not anything routes them there. The
        comment is accurate and the defect is still live; they answer different
        questions.

        That distinction is also this row's own class — a configuration that asserts what
        the code does not do — applied one level up: a comment that correctly describes
        intent reads, to a reviewer, as evidence about exposure.

        HALF 2 — the credential helper. images/git/git-credential-tillandsias.sh drains
        stdin and explicitly does NOT branch on it: "this helper is wired per-invocation
        by the relay for one specific remote, so answering unconditionally is correct".
        It then returns the GitHub token for ANY caller. The justification is a TRUST
        ASSUMPTION about the caller, which is precisely what a credential helper should
        not rest on: a misconfigured remote, an attacker-influenced URL, or a future
        second caller gets a live GitHub token. The stated cost of the check ("avoids
        parsing a format we would then have to keep in sync") is small — the credential
        format is documented and stable.

