            http_port 3129 ssl-bump ...        (no bind address -> 0.0.0.0 in-container)
            acl build_port localport 3129
            http_access allow build_port       (no source ACL, no allowlist)
        So any container on the enclave network can dial proxy:3129 and egress ANYWHERE,
        bypassing the 3128 allowlist that is the whole point of the strict port.

        THE FILE'S OWN COMMENT DOES NOT REFUTE THIS, and I checked carefully because it
