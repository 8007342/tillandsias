    verifiable_closure: |
      A fixture that creates an untracked symlink to a non-existent absolute
      target in a scratch checkout, runs the harness's tree copy, and asserts
      the copy succeeds and names the skip; plus a control where a tracked file
      is unreadable and the copy still fails. Pre-fix result: FAILS with
      tree-copy-failed (yolanda-windows, native, 2026-09-26).
