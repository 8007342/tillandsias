    estimated_hours: 2
    owned_files:
      - scripts/check-archive-answerability.sh
    title: |
      check-archive-answerability.sh copies the whole working tree, and an untracked symlink whose target does not exist on this host (a Nix `result` -> /nix/store/... left by a WSL build) makes native tar fail, so `archive-plan-packets.sh --check` reports tree-copy-failed before it judges anything
    context: |
      MEASURED on yolanda-windows 2026-09-26, native Windows, while collecting
      1380-u7sq's closure evidence. log/copy.err:
        tar: ./result: Cannot create symlink to
          '/nix/store/swqkkbiacxi7vsb4cqh53s1kj70v8v24-tillandsias-0.0.0':
          No such file or directory
        tar: Exiting with failure status due to previous errors
      and the verdict was
        fail:archive-answerability:tree-copy-failed
      `result` is gitignored and untracked: an artifact of a Nix build that ran
      inside WSL, whose target exists only in that distro's store. With it
      moved aside, the same run got past the copy.
      The harness copies what is ON DISK, so the check depends on which build
      artifacts a host happens to have lying around, not on the ledger.
    exit_criteria:
      - 'a checkout carrying an untracked dangling symlink (pre-fix: a `result` pointing at a missing /nix/store path) no longer fails with tree-copy-failed; the copy prunes or skips it'
      - 'a skipped entry is NAMED in the harness output (skip:archive-answerability:dangling-symlink:<path>), never silently dropped'
      - 'a TRACKED file that fails to copy still fails the run: only untracked dangling links are skippable'
    unscoreable: |
      unpinnable-until-the-guard-exists (1136-n8sh): the deliverable includes
