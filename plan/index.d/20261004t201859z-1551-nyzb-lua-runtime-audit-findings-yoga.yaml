      FIX (in this landing): in supervise, a capture abandoned by a kill or
      a scope close is reported truncated. A deadline is already typed as
      timed_out and is left alone. A handle killed while its child is still
      running was already not ok (signaled); it now also says truncated.
    exit_criteria:
