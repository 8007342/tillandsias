    title: |
      sh.run / expert.shell asks the command policy about the repository root and then runs the child in the inherited process cwd with the caller's whole environment and no default deadline — measured: with the runner started outside the root, proc.run of rm -r victim answered consent:policy:workspace-destroy while sh.run of the same argv exited 0 and the directory was gone; a secret set on the runner reached the child's printenv; timeout_ms=0 meant already expired
    context: |
      Audit note §2 F1 has the table. Both installers of the door
      (build_environment_logged in lua_predicate.rs, Host::install in
      lua_process.rs) called policy_gate with cwd None, which substitutes
      the root, and built the command with no current_dir, no env_clear and
      a timeout only when named. openspec/specs/command-runtime already
      required the opposite for every door. Confirmed independently by the
      coordinating session before the fix. No shipped .lua calls the door
      (0 of 37), so the exposure is agent-authored scripts.
      NOT RUN, by reading only: under regime=fixture the same substitution
      feeds the rule that asks whether a request touches the real checkout,
      so a git push through this door would be judged against the scratch
      root while running in the real one. The fix removes the mismatch for
      every regime; nobody has run that case.
      FIX (in this landing): prepare_shell in lua_predicate.rs, called by
      both installers — one cwd for the policy request and the child,
      base_env_command, the default deadline, 0 meaning none.
      WHAT THE POLICY SAYS, so the test is not misread: rm -r of a
      directory INSIDE the workspace is allowed; from a cwd outside it the
      same argv needs consent. The defect was never that the policy was too
      loose, it was that it was asked about one directory while the child
      acted in another. The test therefore puts the victim only in the
      inherited cwd and asserts nothing there is touched.
    exit_criteria:
