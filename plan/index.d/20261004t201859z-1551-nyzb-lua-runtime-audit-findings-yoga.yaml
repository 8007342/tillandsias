      child is gone. Live exposure today: _pf_run_guard in build.sh runs a
      .lua guard under setsid with no --timeout and stops it with a group
      TERM, and check-centicolon-ratchet.lua runs bash centicolon-grade.sh
      through proc.run. It is also the premise of 1520-z95v (the preflight
      door ported to proc.spawn).
      FIX (in this landing): reap_on_termination in script_run.rs — TERM,
