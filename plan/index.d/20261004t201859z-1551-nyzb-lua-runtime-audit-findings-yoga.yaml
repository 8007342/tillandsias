    title: |
      crates/tillandsias-plan/tests/lua_proc.rs ran thirteen distinct Python programs (ten written into its fixture directory at seventeen sites, three passed inline with -c) through twenty-three python3 invocations as the child processes the Lua runtime supervises — forty lines naming python in the test suite of the runtime that exists to retire ad hoc scripting, against tlatoani_hard_no_python — and scripts/check-no-python-scripts.sh reported "ok: no Python runtime references" on that tree, because the guard scans scripts/ and the litmus YAML for LINES BEGINNING with python and never a Rust test source or an interpreter named as an argv string
    context: |
      RAISED BY THE OPERATOR, 2026-10-04, verbatim: "I see some tests
      sneaking in python. What's that about? The whole reason of gettig rid
      of BASH in favor of LUA is for it to work along with our ban of
      python. We don't like random scripting languages in this project.
      Justify sneaking in pythin inside another scripted language". There
      is no justification. Neither the audit sub-agent nor the coordinating
      session flagged it, and the coordinating session had the lines on
      screen while reading the test file.
      WHERE IT CAME FROM (git log -S python3 on the file): the 1534-puyz
      commits from d3dd5f676 (2026-10-02) and the 1538-pwdr commits
      (2026-10-03). The likely reason, read from the code: the command
      policy refuses sh -c <string>, so the tests needed a program in a
      FILE and wrote Python ones; the later 1538 tests in the same file
      use sh files instead.
      WHY THE GUARD SAID OK (read from check_no_python_scripts in the
      policy crate): is_script_or_harness covers script extensions,
      scripts/, the litmus YAML and a few named files;
      has_python_runtime_reference matches a line that starts with python
      or contains forms like "python3 -c". A Rust file under
      crates/*/tests/ is not scanned, and "python3" as a quoted argv entry
      matches none of the forms. Measured: guard rc 0 on linux-next
      724309173.
      FIX (in this landing): every child program is a mode of one Rust
      helper, tests/support/fixture_child.rs, built as a [[bin]] of the
      plan crate (integration tests get CARGO_BIN_EXE only for bins) and
      copied by no installer; the thirteen programs and the python3 argv
      entries are gone from lua_proc.rs; the guard now scans
      crates/*/tests/**.rs for a quoted interpreter name or a quoted *.py
      file name, with unit tests holding the exact lines that landed.
      DECLARED LIMIT of the widened guard: unit tests inside src/ are not
      scanned (src/ holds two legitimate mentions: the matcher itself and
      the methodology router's keyword).
      NOT DONE HERE: the later tests in the same file still write small sh
      files (select-producer.sh and others). sh is not banned; whether the
      Lua runtime's tests should use the Rust helper for those too is a
      follow-up for this row's reader to raise, not a silent rewrite.
      The gate also depended on python3 being present in the builder
      toolbox for these tests; nothing declares that dependency.
