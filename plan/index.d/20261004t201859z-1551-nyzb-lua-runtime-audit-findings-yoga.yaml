  - packet_id: the-lua-runners-instruction-hook-does-not-follow-script-created-coroutines-so-code-keeps-running-after-a-caught-verdict-and-an-async-door-inside-one-returns-a-truthy-value-without-waiting
    order: 1551-pemw
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    release_target: lua-bash-replacement-and-policies-2026-09-27
    pickup_role: any
    capability_tags: [rust, lua, plan, sandbox, verdict-integrity]
    estimated_hours: 2
    owned_files:
      - crates/tillandsias-plan/src/lua_predicate.rs
      - crates/tillandsias-plan/tests/lua_proc.rs
    title: |
      The Observing class exposed the coroutine library while the runner's stop mechanism is an instruction hook that mlua 0.10 keeps on one thread — measured: after pcall(verdict.ok) the main thread stopped, but inside coroutine.wrap the script ran 20,000,000 more iterations and fs.write succeeded; and p:wait() called inside a coroutine returned a truthy userdata instead of waiting, so a script can go green without having waited for the process it judges
    context: |
      Audit note §2 F6, confirmed independently before the fix. The comment
      in run_to_verdict says a caught verdict or error "cannot keep
      executing or launch a new child"; the second half held, the first
      did not. Without --timeout a CPU loop inside a coroutine was
      unbounded.
      FIX (in this landing): the Observing coroutine table is narrowed to
      yield alone in build_environment_logged, so script code cannot CREATE
      a coroutine. No shipped .lua used the library (0 of 37, counted two
      ways). The Cacheable class never had it.
      WHY NOT REMOVED OUTRIGHT, measured the hard way: dropping the global
      made EVERY Observing script fail to start ("error converting Lua nil
      to table"), because mlua builds each async function from
      coroutine.yield read from the GLOBALS at creation time, and process
      handles create theirs while the script runs. A bare yield from script
      code is resumed at once by the async driver, on the thread the hook
      covers; the test calls one.
      IF COROUTINES ARE EVER WANTED BACK they need a hook that covers every
      thread, which mlua 0.10 does not offer; that is a new row, not a
      revert.
    exit_criteria:
      - 'in the Observing class the coroutine table holds yield and nothing else, and the Cacheable class has no coroutine table, asserted by scripts through the runner; pre-fix: the whole library in Observing'
      - 'the measured probe (run past a caught verdict inside coroutine.wrap) can no longer be written, and a bare coroutine.yield does not stop or hang a script'
    verifiable_closure: |
      cargo test -p tillandsias-plan --test lua_proc script_code_has_no_coroutines_and_cannot_load_bytecode
      passes on the fixed tree and fails against a 0.1.0+579b43ef754b46de
