    title: |
      timeout_ms on proc.spawn bounds line delivery to Lua as well as the child, and delivery was capped near 40-50 thousand lines a second by a 1 ms sleep after every pump — measured: proc.run of seq 1 400000 with timeout_ms=3000 exited in 10 ms while proc.spawn of the same argv was timed_out after 3004 ms with 156114 lines delivered and an empty capture; seq 1 2000 with timeout_ms=200, waited after half a second of other work, was timed_out although the child had long exited
    context: |
      Audit note §2 F4. Two causes.
      (a) FIXED in the landing that files this row: Host::wait and the
      proc.select loop slept 1 ms after every pump, including one that had
      just dispatched a full batch. They now yield while events flow and
      sleep only when the queue was empty. No throughput number has been
      re-measured after the change; that is this row's first step.
      (b) OPEN: the per-process timer in supervise keeps running after the
      leader has exited, so the deadline covers delivery. A comment in
      read_stream says that is intended ("Sending queued lines may take
      arbitrarily long within the process deadline"), while the design
      says timed_out means the child produced no exit code. Those disagree,
      and the choice belongs to whoever takes the row: after the leader
      exits, either only the scope deadline applies, or the result keeps
      the real exit status and is marked truncated. It fails closed today.
    exit_criteria:
      - 'the row records lines per second for proc.spawn of seq 1 400000 before and after change (a), each with its command; the pre-change figure is 156114 lines in 3004 ms'
      - 'a child that exits 0 well inside its timeout_ms is never reported timed_out, however slowly its lines are consumed, asserted by a test whose consumer is deliberately slow; pre-fix: timed_out (measured 2026-10-04)'
      - 'the rule that survives is stated in the comment in read_stream and in the spec; the two no longer disagree'
