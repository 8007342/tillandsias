        FIXED BY INVERTING IT RATHER THAN SCOPING IT, which is the coordinator's
        third option and the right one: an arm scoped to macOS would be SILENT on
        Linux, and a fixture that says nothing on a platform cannot catch a row
        leaking onto it. It now asserts the correct thing on each side — where
