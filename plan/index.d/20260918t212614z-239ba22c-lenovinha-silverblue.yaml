      [2026-09-18T21:26:14Z lenovinha-silverblue] THE PRE-PUSH ORDER FOR A NEW CRATE, IN GATE ORDER. This row was reported
      "essentially solved" on a green build, green tests and two green shell suites,
      and the tree was refused TWICE after that. The honest closure note is the
      ordered list, because each step refused a tree the others had passed:

        1. cargo fmt --all --check                 <- the FIRST Rust step in build.sh
        2. cargo clippy --workspace --all-targets --all-features -- -D warnings
        3. cargo test -p <crate>
        4. the shell suites

      WHAT ACTUALLY HAPPENED, in order:
        - build + tests + suites green        -> reported "essentially solved"
        - clippy REFUSED (collapsible_match). Predicted in advance by macuahuitl,
          which is why the lint was split out of the unblocking land rather than
          riding it into a relay eight hosts were waiting on.
        - cargo fmt REFUSED: one "let Ok(src) = ... else { continue };" that rustfmt
          expands to three lines. It runs BEFORE clippy, so it refused a tree that
          had already passed clippy.

      Three of those four steps have now refused a tree the others passed. A NEW
      crate is where that happens, because a mature crate has already been through
      all four. Run them in this order before pushing instead of discovering them one
      land at a time, as this row did.

      METHOD NOTE, and it is the same defect this lint reports. My verification of the
      merged tree was written as "cargo clippy ... | tail -5; echo EXIT=$?", which
      reports TAIL's status: it printed EXIT=0 over a FAILED build. A pipeline's exit
      status is its last command. That is hazard shape 1, written by the author of
      this lint, in the same session in which they measured 545 instances of it and
      had already been burned once by the same shape in the lint's own launcher.
      TWICE, by someone who knew it cold. That is the argument for 1252-fg9e: the
      executor packet is about the shape being CONSTRUCTIBLE, not about ignorance.

      AND A THIRD TIME, IN THE ACT OF FILING THIS NOTE. The first attempt passed this
      text as a double-quoted shell argument containing backticks; the shell
      command-substituted them and fragment 20260918t212512z-05f3f8b3 recorded only an
      attribution line with the body consumed. A second attempt using read -d '' set
      an empty variable and lost it again (20260918t212526z-099e1d95). That is the
      unquoted-heredoc-into-an-immutable-fragment incident that
      scripts/host-capability-probe.sh exists to prevent, reproduced twice by someone
      who had read that file's header the same session. The --append contract is what
      limited the damage: every prior line was preserved both times, so the loss was
      only my own addition, and the two empty fragments remain in the ledger as
      evidence rather than being editable away.

      ALSO: a verification run in a bare "git worktree" produces a FALSE RED. cargo
