        WINDOWS DATAPOINT + A NAMED MECHANISM FOR CRITERION 2, and a bisect window narrowed from five releases to two adjacent ones. Read this before downloading dailies.

        THIRD PLATFORM (relayed from esme-windows via coordinator, not measured by me): v56.9.12.1 cold --provision-once fails deterministically with "hvsocket open: secure handshake failed: noise: input error"; VM boots, nine backoffs, Ready never observed; esme reached Ready in 117s on v56.9.2.1. Same snow Error::Input signature as macneo's macOS instance, over hvsocket instead of vsock. The wire is now the shared suspect and this is NOT macOS-specific.

        BISECT NARROWED BY CONTAINMENT, not by downloading anything. `git tag --contains` on the wire crates across v56.9.2.1..v56.9.12.1:
          - crates/tillandsias-secure-channel: ZERO commits in the entire window. The handshake implementation itself never changed.
          - crates/tillandsias-control-wire, between the two ADJACENT releases v56.9.5.1 and v56.9.11.1, exactly TWO commits:
              79e3ca876 feat(secure-wire)!: the control wire is encrypted by DEFAULT (972-umik commit B)   [in 11.1, 12.1; NOT in 5.1]
              a55927754 feat(980-ja2m): heartbeat-bounded guest liveness, slice (b)                        [in 11.1, 12.1; NOT in 5.1]
          - Everything else in the window (54a9471a1 WIRE_VERSION 3, ac41fc8c9 discriminant pins, e6a80609f/08a7d3cc7 the earlier flip-and-revert) is ALREADY in v56.9.5.1.
        PREDICTION FOR THE BISECTING HOST: v56.9.5.1 should PASS and v56.9.11.1 should FAIL. If so the cause is one of those two commits, and 79e3ca876 is the prime suspect — it makes an absent TILLANDSIAS_SECURE_CONTROL_WIRE mean ON. Testing 5.1 and 11.1 answers it; the other dailies are wasted downloads.

        THE MECHANISM, read in the source on both ends rather than inferred from the symptom. The guest is ALREADY TELLING US THE CAUSE IN PLAIN TEXT AND THE HOST THROWS IT AWAY.
          1. PSK is version-bound: channel_psk(build_version, wire_version, hop) — secure-channel/src/lib.rs:135, with unit tests asserting the PSK differs across build_version and across wire_version.
          2. NNpsk0 mixes the PSK into the FIRST message, so on a PSK mismatch it is the RESPONDER (guest) that fails, at hs.read_message, with Decrypt — not Input.
          3. The guest does not close silently. Per the order-137 cutover contract, headless/src/vsock_server.rs:791-813 writes a PLAINTEXT ControlEnvelope carrying ErrorCode::Unauthorized whose message is: "secure control wire required: the version-bound secure-channel handshake failed; plaintext or mismatched-version peers are not served".
          4. The host is still inside client_handshake waiting for a NOISE frame. It reads those plaintext bytes and feeds them to hs.read_message, which rejects them as malformed — snow::Error::Input — and snow_err flattens that to "noise: input error" (secure_stream.rs:39-41), which action_host.rs:380 prints.
        So "noise: input error" is the host's mis-parse of an explicit, human-readable rejection notice. That accounts for every observation at once: why the signature is Input rather than Decrypt; why it is identical on vsock and hvsocket; why the guest serial console carries nothing about noise (the guest's own record is a tracing warn! and the notice goes on the wire, not the console); and why macbookair's guest can assert readiness at t=4.66s with its listener bound and still never be observed — the listener IS up and is actively REFUSING the host.

        WHY staged_matches_bundle=true DOES NOT ACQUIT SKEW, which is the constraint macbookair's datapoint asked for: the PSK binds the VERSION STRING, not the binary hash. Host and guest reach it by different routes — host-shell/src/vsock_client.rs:325 and windows-tray/src/hvsocket.rs:56 use env!("WORKSPACE_VERSION") from a build.rs that declares rerun-if-changed on ../../VERSION, while the guest (headless/src/vsock_server.rs:110) uses tillandsias_secure_channel::workspace_version(), which is include_str!(VERSION) in a crate with NO build.rs. Two different mechanisms reading one file. I have NOT proven they diverge — include_str! does register a rebuild dependency — so this is named as the thing to measure, not as the cause.

        WHAT WOULD SETTLE IT, cheaply, and it needs no VM: have the guest and the host each PRINT the PSK-input triple (build_version, wire_version, hop) and compare. Equal triples refute version skew for good; unequal triples name the cause outright. That is a smaller experiment than any bisect.

        CONSEQUENCE FOR (a), which I am now implementing: classifying the snow variant is necessary but NOT sufficient. On the host the answer will always read Input in this scenario, because the discriminating failure happened on the guest. So (a) must ALSO attempt to parse the bytes received during a failed handshake as a plaintext ControlEnvelope and, when it is Error{Unauthorized}, report the guest's own message instead of "noise: input error". The fixture becomes three arms, not two: a too-short frame (Input), a wrong-PSK peer (the responder's Decrypt, and the host seeing its notice), and a peer that sends the Unauthorized envelope (reported as the guest's refusal, verbatim). Pre-fix result FAILS on all three: today every one of them prints "noise: …".
