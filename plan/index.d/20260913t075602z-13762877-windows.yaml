        EVIDENCE FROM esmeraldinha, and it changes this row's blocking status. This note exists because the measurement was taken and landed as a document without ever being attached to the row it is evidence for — plan-events on this order carried ZERO esme entries, so a reader of the packet saw "REMAINING 1 is operator-gated (Vulkan ICD)" with no way to discover that the gate no longer binds. That gap is mine and this closes it.

        THE OPERATOR GATE NO LONGER BINDS, because a host with the ICD already exists and nobody provisioned it for this criterion. esmeraldinha's tillandsias-build distro carries a Vulkan loader and the stock Fedora mesa-vulkan-drivers ICD set, and enumerates a real non-CPU device over /dev/dxg. Re-verified this cycle, not quoted from the earlier run:

          /dev/dxg present, /dev/dri ABSENT
          GPU0  PHYSICAL_DEVICE_TYPE_INTEGRATED_GPU
                Microsoft Direct3D12 (Intel(R) UHD Graphics)   DRIVER_ID_MESA_DOZEN
                vendorID 0x8086  deviceID 0x46d1
          GPU1  PHYSICAL_DEVICE_TYPE_CPU
                llvmpipe (LLVM 22.1.8, 256 bits)               DRIVER_ID_MESA_LLVMPIPE

        So criterion 1 and the WSL2 half of criterion 3 are satisfiable by OBSERVATION on this host rather than by the "deliberate, recorded ICD install on yolanda" the packet names as its smallest next action. yolanda declined that install and the packet records the refusal as correct; that reasoning stands and is simply no longer the only route.

        BOTH ARMS OF CRITERION 2 ARE LIVE ON THIS ONE HOST, which no other host has been able to produce. GPU1 above IS the PHYSICAL_DEVICE_TYPE_CPU / DRIVER_ID_MESA_LLVMPIPE device the criterion requires be REJECTED, sitting in the same enumeration as a genuine GPU0 — on yolanda there was nothing to reject because nothing enumerated at all. And the sibling distro (tillandsias) is /dev/dxg present with no loader installed, which is the engine-missing state, unchanged, on the same machine. A rubric that merely counts enumerated devices passes wrongly here with a count of two, which is the discriminating case the packet needs and could not previously construct.

        THE PROBE WAS RUN, under an explicit authorisation, debug build. The envelope still reports:

          accel_class=cpu-only accel_gpu=present-unusable
          accel_gpu_name=WSL2_paravirtual_GPU_dev_dxg
          accel_reason=engine-missing_no-vulkan-icd
          accel_proof=unknown  accel_gpu_path=dxg-d3d12
          render_nodes: []   engines: []

        accel_reason is FALSE on this host: it asserts no Vulkan ICD is installed, and one is, and it enumerates an INTEGRATED_GPU. By symbol this is not a detection that failed — wsl2_paravirtual_gpu_reason() returns that string literal unconditionally and enumerate_gpus assigns it to every WSL2 dxg device. Nothing reads icd.d, libvulkan, or an enumeration result. Criterion 2 requires detection by ENUMERATION, not file existence; the current code does neither.

        The verdict itself is NOT challenged. usable:false and cpu-only may well be right here — no inference was run, no throughput measured, and an N100 iGPU may be a loss exactly as yoga measured for gfx1152. What is wrong is the REASON, which states a provisioning fact untrue of this host.

        MEASUREMENT CAVEAT THAT APPLIES TO ANY FUTURE PROBE RUN ON THIS ROW: --capabilities serves ~/.cache/tillandsias/capabilities.json when it exists, with nothing in the envelope saying so, so a probe result can be a replay of an earlier provisioning state. That is filed as 1139-xe5m. The envelope above was taken with the cache moved aside and restored afterwards; a run that does not do this proves nothing about the host's current state.

        INDEPENDENCE CAVEAT, unresolved and not to be assumed away: the ICD package on this host reports installed 2026-08-17, one day after the yolanda experiment the companion document describes. No evidence connects them. If it was a deliberate follow-up rather than routine image provisioning, this host is less independent of that experiment than the framing above assumes. Whoever owns the builder image can settle it.

        Full evidence, commands and the refuted first inference: plan/issues/research/wsl2-igpu-vulkan-over-dxg-esme-intel-vantage.md

        SUGGESTED SMALLEST NEXT ACTION, replacing the ICD install: make wsl2_paravirtual_gpu_reason() a detection rather than a constant, and run the probe on esmeraldinha to see it report something true. That is Rust with a fixture and is beyond this host's compile-free lane, so it is offered rather than claimed.
