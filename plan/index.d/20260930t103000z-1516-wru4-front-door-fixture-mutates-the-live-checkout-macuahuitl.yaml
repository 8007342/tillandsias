    title: |
      scripts/test-preflight-front-door.sh plants check scripts and gate steps, and appends a function to build.sh, INSIDE the live checkout while it runs; a gate or snapshot running at the same moment sees them.
    context: |
      MEASURED 2026-09-30 on macuahuitl: a meta-orchestration boundary snapshot
      taken while litmus ci-release ran recorded four untracked paths that were
      not the operator's or the cycle's: scripts/gate-steps.d/999-zz-1499-serial.step
      and scripts/test-zz-1499-serial-{a,b,c}.sh. They vanished when the run's
      trap cleaned up, which invalidated the snapshot (re-taken on the clean
      tree, noted in the cycle entry). Reading the fixture: it also writes
      scripts/check-zz-1305-planted.sh, scripts/check-zz-1499-{planted,args}.sh,
      scripts/gate-steps.d/999-zz-{1305-planted,1496-gate-only}.step, and it
      APPENDS a never-called function to the live build.sh (restored by trap).
      Any ./build.sh --check, land gate, stamp computation or boundary snapshot
      that runs during that window reads a tree carrying planted guards and a
      modified build.sh. The fixture exists to prove the door picks up a newly
      wired guard, which needs a tree to plant into; it just must not be the
      live one.
    outcome: |
      The fixture plants into a scratch copy of the tree (the files build.sh
      --preflight reads: build.sh, scripts/, scripts/gate-steps.d/,
      scripts/hooks/) and runs that copy's build.sh --preflight; the live
      checkout is byte-identical before, during and after a run.
    exit_criteria:
      - "Running scripts/test-preflight-front-door.sh leaves `git status --porcelain` empty at every sampled moment of the run (sample in a loop from a second shell), and build.sh's sha256 unchanged throughout. Pre-fix, the sample shows the zz-* paths and a changed build.sh."
      - "The fixture's own arms stay green (planted guard picked up and refused, argument vector passed, serial exclusivity, gate-only declared skip, budget)."
    verifiable_closure: |
