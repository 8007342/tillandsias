      summary: |-
        MEASUREMENT BEFORE DESIGN — pirria (4x Alder Lake-N, the floor host), 2026-09-12.
        Two full gate runs, TILLANDSIAS_GATE_PROFILE=1 TILLANDSIAS_FORCE_CHECK=1, 182
