      MARKER (least new machinery): a git commit trailer, read with
      `git log --format='%(trailers:key=Website-Update,valueonly)'
      <prev-stable>..<tag>`. No new file, no VERSION-adjacent state; the trailer
      travels with the change that caused it.
      EXISTING CAPABILITY REUSED: promote-stable.sh step 4
      (scripts/advance-deploy-ref.sh, 1798-khw6) is a post-flip side effect with
      a falsifiable `verified:` line; step 5 sends the message in the same shape,
      using the 1826 client's ordinary send-message verb, not a new HTTP path.
      A failed send (no token, coordinator unreachable) prints
      `website-update:deferred:<tag>:<why>` and does NOT fail the promotion; the
      marker is recomputable from git, so a re-run sends it.
      Website rule: the message carries only tag + trailer reasons, no host or
      fleet detail.
