    title: |
      `scripts/session-tokens.sh` derives main_ctx, main_ctx_cumulative and the sub-agent totals from the session's own harness transcript; `--emit-tokens --from-transcript` records them, on every host and in forges
    context: |
      T5 of the 2026-09-27 trims. The token log has 19 rows, all from one
      host, main_ctx=0 on every row since 2026-09-14, because --emit-tokens
      writes only what the caller passes and the caller never had a number.
      The harness exposes one: the transcript at
      ~/.claude/projects/<cwd-slug>/<session>.jsonl carries message.usage on
      each assistant record with timestamp, sessionId and cwd; sub-agent
      transcripts sit under <session>/subagents/; the session id is in
      CLAUDE_CODE_SESSION_ID. That format is documented as internal and
      version-dependent, so the script asserts the field names it reads and
      answers schema-drift rather than zero when one is missing (a proxy
      reported as a measurement is the defect agent-observability.yaml
      proxy_discipline exists to prevent). main_ctx is a BILLED-token sum
      and is named so at every surface, never a context-size proxy. Hosts
      on opencode or codex, and a forge whose HOME lacks the directory,
      record source=absent. Windows: the path is $HOME/.claude/projects
      under Git Bash; state the regime in the record when it differs.
