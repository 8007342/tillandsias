# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by linux_mutable (macuahuitl), 2026-08-18T07:50:00Z.
#
# The expert health probe reports on a server it starts itself, not on the one
# the agent is talking to. Found by asking the L1 expert a question and being
# answered from another host's filesystem.
packets:
  - packet_id: expert-health-probe-tests-a-server-it-spawns-not-the-one-in-use
    order: 823-u3k9
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "check-mcp-expert-health.sh launches its OWN server instance from the registration, so it validates the FILE and can never see that the session's long-lived MCP process is running stale code — it reported ok:experts-healthy while the L1 spec expert was unusable"
    deliverable: "the health verdict reflects the server the caller actually reaches — e.g. the running process answers a question that names its own build, so a stale process is a named state rather than a green one"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [experts, fail-loud, mcp]
    estimated_hours: 4
    context: |
      OBSERVED 2026-08-18T07:40Z, macuahuitl, following the CLAUDE.md rule to
      ask the experts before grepping. I asked spec_answer a cross-cutting
      question and got:

        confidence=unsupported: "the spec RAG index is not built at
        /mnt/c/Users/bullo/claudia/tillandsias/target/spec-index ... Build it:
        tillandsias-plan spec-index --root ... then embed each chunk's text via
        http://127.0.0.1:11434/v1/embeddings into vectors.jsonl"

      A WSL path, on a Linux host. Four things are measurable here and they do
      not agree:

        1. L0 IS FINE. plan_answer returned confidence=exact with
           citation_root=/home/tlatoani/claudia/tillandsias and
           source_commit=5d70244e0 — my HEAD, indexed 07:06:50Z. It cited a
           fragment filed thirty minutes earlier.
        2. THE INDEX IS FINE. scripts/spec-index-ensure.sh on this host reports
           `ok:spec-index:built:19486`, and the durable volume measured for
           801-a2by carries chunks.jsonl + vectors.jsonl in three
           fingerprinted entries, 578 MB.
        3. THE FILE IS FINE. images/default/config-overlay/mcp/forge-plan.sh
           was fixed by order 799-j4xd. Its current refusal names the DURABLE
           ROOT and adds a `_si_note` distinguishing a stale
           FORGE_SPEC_INDEX_DIR override from a cold tier. The message I
           received contains neither, and recites the embed-by-hand prose that
           799-j4xd explicitly removed.
        4. THE PROBE SAYS HEALTHY. scripts/check-mcp-expert-health.sh returns
           `ok:experts-healthy`.

      SO THE RUNNING PROCESS PREDATES THE FIX. 799-j4xd's own comment names
      this exact failure and this exact host — "Observed on macuahuitl
      2026-08-17: a LINUX session answered with /mnt/c/Users/.../target/
      spec-index, inherited from a tracked config that 2b1f8d188 had already
      fixed — A FIX IN A FILE DOES NOT REACH A PROCESS THAT ALREADY READ IT."
      It recurred, and nothing caught it.

      WHY THE PROBE CANNOT CATCH IT, which is the packet. At :439 it does
      `cmd="$(server_command "$reg" "$name" "$override")"` and then
      `probe_server "$name" "$cmd" ...` — it reads the registration and starts
      a FRESH server. That new process reads the current file and is healthy by
      construction. The long-lived process the agent's tool calls actually
      reach is never contacted. The probe is a syntax-and-registration check
      wearing the name of a health check.

      L0 hides it further: plan_answer shells out to the freshly built
      binary, so its `source_commit` tracks HEAD no matter how old the server
      shell is. The freshest-looking signal in the envelope is the one least
      able to detect this.

      COST. The L1 tier — the operator's own expert-architecture investment,
      including 803-su4n's 19,435-chunk code corpus — was silently unavailable
      for an entire session while every health signal read green, on the night
      whose stated discipline is "ask the experts before grepping". I fell back
      to grep and named the gap, which is the documented fallback, but the
      point of the probe is that I should not have had to discover it by
      asking a question.

      NOT CLAIMED: that a fresh server would answer the question correctly. The
      index and the resolution logic are both healthy (2 and 3 above), so it
      very likely would, but I did not spawn one and drive a JSON-RPC session
      to prove it. That is the first thing whoever takes this should do, since
      it also gives them the harness the deliverable needs.

      RELATED, not the same: 819-s92y (the image bakes a /opt/skills copy
      nothing reads) is the other half of "which artifact is the live one".
      Both are about a fix landing somewhere the running system does not look.
