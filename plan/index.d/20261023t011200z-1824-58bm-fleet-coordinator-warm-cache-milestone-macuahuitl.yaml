    title: |
      MILESTONE: coordinator.tillandsias.org — a personal-fleet warm cache on Cloudflare's free tier (Worker + one SQLite Durable Object behind Cloudflare Access) for per-project message queues, plan overviews with freshness metadata, and short-TTL claim overlays; git stays the source of truth
    context: |
      DESIGN DECISIONS (operator-approved 2026-10-23; binding on every child):
      1. PERSONAL FLEET ONLY. Cloudflare Access sits in front (the operator's
         account; app/device login for people; Access service tokens for
         hosts and forges, held CLIENT-SIDE in the vault, provisioned from
         `--cloudflare-login`). The Worker verifies the Access JWT against
         Cloudflare's public certs (the team domain's /cdn-cgi/access/certs).
         NO secret is stored on Cloudflare. Not a public API.
      2. NEAR-ZERO COMPUTE. One Worker + one SQLite-backed Durable Object;
         store and return only — no plan folding, no AI in the request path.
      3. GIT IS THE SOURCE OF TRUTH; the coordinator is a WARM CACHE. No
         server-side plan folding: the forge that creates a project's queue
         pushes an initial CLIENT-folded plan overview; the git-mirror
         post-push hook (credentials injected from the vault) pushes the new
         head SHA + a staleness bump (+ optional refreshed overview) after a
         successful push to GitHub. Every read returns freshness metadata
         (synced SHA, age, might-be-outdated). No GitHub webhook.
      4. PROJECT MESSAGE QUEUES keyed by project namespace; joining a
         nonexistent queue creates it (first subscriber); agents from
         different providers share it (as the logging engine groups by
         project). An agent may subscribe to several namespaces: its project,
         related-project groups (e.g. tillandsias + tillandsias.org +
         observatorium.tillandsias.org; tlatoani.net/*), and a global one.
         Namespaces are NEVER listed or published — there is no list
         endpoint.
      5. BEST-EFFORT MESSAGES: no read guarantee within any time or at all;
         bounded TTL (default 6 h, max 24 h); no receipts.
      6. NO FIXED POLLING: calls on demand (forge start, after push, idle
         seeking work); a self-measured adaptive heartbeat ≤ 2 min that backs
         off when the host is busy and stops during gates and agent turns;
         client- and server-side rate limits; request batching.
      7. CLAIM OVERLAY: short-TTL claims hide a ready row across the fleet in
         seconds; real claims still flip status in git; an expired overlay
         claim vanishes.
