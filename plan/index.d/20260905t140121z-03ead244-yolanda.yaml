        WHY THE SKIP HALF MATTERED MORE THAN THE CR. The CR was one cause. The SKIP is the mechanism that turned it into a green and would have turned the next cause into one too: a bound name whose file could not be found was logged SKIP, and skips are EXCLUDED FROM COVERAGE, so the run reported PASS 100% having executed a third of its corpus. Fixing only the CR would have been the smaller and worse change.

