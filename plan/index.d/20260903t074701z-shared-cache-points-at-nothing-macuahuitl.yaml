packets:
  - packet_id: forges-export-a-shared-cache-path-that-does-not-exist
    order: 986-andw
    status: ready
    kind: bug
    priority: p3
    desired_release: v0.5
    pickup_role: any
    capability_tags: [forge, nix, environment, fail-loud]
    estimated_hours: 2
    title: |
      Every forge exports TILLANDSIAS_SHARED_CACHE pointing at /nix/store on a host where /nix does not exist.
    context: |
      FOUND by lenovinha-tillandsias-forge while measuring 814-5avq, and handed
      over as a loose end rather than fixed inside an unrelated packet.
      MEASURED on that host: no /nix at all, no host-nix, no systemd, no
      podman, no toolbox, and sudo not installed. The environment variable is
      exported regardless and names a path that cannot resolve.
      WHY IT IS WORTH A ROW DESPITE BEING p3. Anything that reads the variable
      and trusts it gets a path that silently is not there. The failure surfaces
      wherever the consumer happens to be rather than at the point the wrong
      value was set, which is the shape that costs an afternoon. It also states
      something untrue about the environment to every process in the forge.
      RELATED: 814-5avq is deciding how a nix store reaches a forge at all. If
      that lands as rootless static-nix with an explicit user-writable store,
      this variable should point at THAT store, so the two should be settled
      together rather than this one being patched to empty first.
    exit_criteria:
      - the variable names a path that exists, or it is not exported at all
      - whichever is chosen, a consumer that reads it can distinguish "no shared cache on this host" from "shared cache at this path" without stat-ing it
      - the forge lane is checked for other exported paths that do not resolve; one wrong variable is rarely alone
      - resolved consistently with whatever 814-5avq lands, not patched independently first
