  title: 'scripts/check-committable-branch.sh is the shell-to-lua item the carried-obligations guard offers, but it runs in foreign checkouts that may lack tillandsias-plan, its litmus copies it standalone into scratch repos, and both worker skills name it, so the port needs a design first'
  context: 'check-carried-obligations offered this 107-line script as the due shell-to-lua item on work/1247-amcu-batch (#848, 2026-11-02). It cannot be a plain port: (1) it is the Committable Branch Guard (order 476) and its own header says it runs in any project checkout, where tillandsias-plan script run may not exist; (2) litmus:committable-branch-guard-shape copies the .sh into a fresh git init repo and runs it there, with no plan binary; (3) skills/advance-work-from-plan and skills/meta-orchestration (and their images/default copies) name scripts/check-committable-branch.sh, and check-host-tools.sh lists it; (4) test-cycle-preflight-cargo-resolution.sh runs it by path. Options to weigh: Lua through a runner every forge carries, or a thin shell shim that execs the Lua when tillandsias-plan is present and keeps the current behaviour when it is not (then the shim, not the logic, is what stays shell).'
  exit_criteria:
  - 'The guard logic lives in scripts/lua/ and runs on tillandsias-plan script run, with the same five stdout verdicts (ok:branch-<name>, blocked:committable-cycle-on-main, blocked:detached-head, blocked:not-a-git-repo, blocked:no-git-identity) and the same why/remedy stderr lines.'
  - 'A checkout without tillandsias-plan still gets a verdict (whatever the design picks), asserted by a fixture that runs it with no plan binary on PATH.'
  - 'litmus:committable-branch-guard-shape, both skills and check-host-tools.sh name what now runs; the shell-decider floor drops by one.'
  verifiable_closure: 'A fixture runs the guard in five constructed repos (main, detached, non-repo, no identity, topic branch) through the new entry and asserts each verdict and its why/remedy, plus once with no tillandsias-plan on PATH. Pre-fix: the Lua entry does not exist.'
  unscoreable: 'unpinnable-until-the-guard-exists: the claimer writes the fixture and names its litmus in the same commit (1136-n8sh).'
  next_action: 'Pick the design (runner or shim) for foreign checkouts, write the fixture first against the .sh, then port and point every caller at the new entry.'
