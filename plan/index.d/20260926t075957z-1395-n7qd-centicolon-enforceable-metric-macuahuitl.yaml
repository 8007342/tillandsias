  - packet_id: centicolon-grader-earns-positively-tested-only-from-an-enforced-reachable-requirement-keyed-litmus-step-with-a-recorded-green-run
    order: 1395-88tp
    status: ready
    kind: improvement
    priority: p1
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    pickup_role: linux
    capability_tags: [centicolon, lua, litmus, bindings, fail-loud]
    estimated_hours: 8
    depends_on:
      - centicolon-extractor-is-a-cacheable-lua-predicate-over-spec-scenarios-so-the-obligation-denominator-is-a-pure-function-of-repo-bytes
    owned_files:
      - scripts/lua/centicolon-grade-static.lua
      - scripts/lua/centicolon-grade-observed.lua
      - scripts/test-centicolon-grade.sh
      - scripts/run-litmus-test.sh
    observed_by: macuahuitl
    unscoreable: ""
    verifiable_closure: |
      scripts/test-centicolon-grade.sh builds a hermetic corpus (extractor
      output plus litmus files, a bindings registry and a results stream) and
      asserts, per obligation -- A, named by a `requirement:` key on a step
      with an assert_* key, in a bound non-retired pre-build instant file,
      with a green results record for that file's digest, is
      positively_tested; B, named by an UNBOUND file, is traced with reason
      inert:unbound; C, named by a `phase: retired` file, is traced with
      inert:retired; D, named by a step with only expected_behavior, is
      traced with unenforced; E, a `requirement:` key naming a req-id the
      extractor did not emit, is REFUSED by name; zero resolved keys over a
      non-empty litmus corpus is a refusal, never ok:0; MUTATION arm --
      deleting A's results record moves A back to traced. The results stream
      is one JSONL line per executed litmus test written by
      run-litmus-test.sh with ts, host, regime, litmus name, status and the
      sha256 of the litmus file plus its spec file. Pre-fix result: FAILS
      (no grader, and the runner writes no per-test record -- check-logs.jsonl
      carries one row per check id). Fixture wired as a gate step in the same
      commit.
    title: |
      nothing binds below spec level (0 of 454 litmus files name a req-id) and no artifact records that a litmus test ran green on a tree, so a grader earns positively_tested only from an ENFORCED step naming the req-id in a REACHABLE file with a RECORDED green run, and everything else stays traced with a named reason
    context: |
      The lattice (obligation.rs, 977-56fd) and its ranking function exist;
      what never existed is the input. The existing rules are reused, not
      re-decided -- ENFORCED is census-litmus-step-enforcement.sh's KEY rule
      (2,178 of 2,613 steps carry only expected_behavior today), REACHABLE is
      1333-jpq5/1334-57at's rule (bound AND not retired, 66 of 247 enforced
      steps inert), binding truth is test-litmus-binding-truth.sh's, the
      mutation-arm shape is 1059-pb2j's guard. The `requirement:` key already
      appears in two litmus files in the pre-976-suab dotted form; both
      spellings are accepted and counted separately during migration.
      Per-regime states -- a record counts for the regime of the host that
      wrote it; the state used for R is the minimum over the regimes named by
      the spec's gate step STEP_SECOND_REGIME lines, and regimes with no
      record are printed as unmeasured, never satisfied. The static half is
      Cacheable and memoised on the bytes read; the observed half reads the
      results stream and is never cached. Coordination -- 902-5bf9 owns the
      runner's dispatch seam; the per-test record is an append at the point
      the runner already prints PASS/FAIL and must not touch that seam. On a
      duplicate fix, hold.
    provenance: |
      macuahuitl 2026-09-26, Fable research-and-design agent. Design doc
      section 4. Linux host -- lenovinha then yoga.

  - packet_id: centicolon-r-is-printed-every-check-and-ratcheted-so-a-lost-satisfaction-is-refused-an-added-requirement-is-a-scope-change-and-a-vanished-obligation-needs-a-change-record
    order: 1395-ue3i
    status: ready
    kind: improvement
    priority: p1
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    pickup_role: any
    capability_tags: [centicolon, gate, ratchet, deciders, fail-loud]
    estimated_hours: 6
    depends_on:
      - centicolon-grader-earns-positively-tested-only-from-an-enforced-reachable-requirement-keyed-litmus-step-with-a-recorded-green-run
    owned_files:
      - scripts/check-centicolon-ratchet.sh
      - scripts/test-centicolon-ratchet.sh
      - scripts/portability/centicolon-floor.txt
      - scripts/check-scorable-obligation-added.sh
      - scripts/check-declared-closures-added.sh
    observed_by: macuahuitl
    unscoreable: ""
    verifiable_closure: |
      scripts/check-centicolon-ratchet.sh prints one line every --check of
      the form ok:centicolon:R=<n> denominator=<d> declared=<a> traced=<b>
      positively_tested=<c> negatively_tested=<e> inert=<i> unmeasured=<u>
      excluded=<x> regime=<monotone|broken:<why>> floor=<f>, fed through
      `tillandsias-plan score-checks` (one obligation per line at the
      positively_tested bar) so there is ONE ranking function.
      scripts/test-centicolon-ratchet.sh pins, against a hermetic base and
      head -- R falls with the denominator unchanged, ok and the floor file
      lowered; a new req-id raises both, regime=broken:scope-added:<n>, never
      refused; a req-id vanishes with no openspec/changes record or tombstone
      line, warn:centicolon-ratchet:scope-removed-unrecorded in phase 0 and
      refused: under TILLANDSIAS_CENTICOLON_ENFORCE=1; a `requirement:` key
      removed with the denominator unchanged, warn:centicolon-ratchet:lost=1
      in phase 0 and refused: under the switch; a hand-edited floor file with
      no lowered R in the same diff, refused; zero population, blocked:
      never ok:0. check-scorable-obligation-added.sh accepts the fourth
      scorable form `centicolon: <req-id>[, ...]` and
      check-declared-closures-added.sh refuses one naming a req-id the
      extractor does not emit. Pre-fix result: FAILS (no script; the two
      ledger gates reject the new form as unscoreable/unresolvable). Wired as
      a gate step with a STEP_SECOND_REGIME line recorded by a second host
      before it enters --check.
    title: |
      R is computed by nobody, so the convergence guarantee has no number; print R with its denominator, histogram and regime on every --check, ratchet it like the jq and shell floors, and refuse (after the operator flips the switch) a rise caused by a lost satisfaction or a fall caused by an unrecorded deletion
    context: |
      Design doc section 5. Phase 0 is REPORT AND WARN and needs no approval
      (bar_raise_governance -- reporting a number is not a finding class).
      The flips from warn: to refused: are bar raises the operator approves
      against the printed number, the 1325-ygq5 shape (WARN in migration,
      refusal later ON A NUMBER). The 16 check ids score-checks scores today
      keep printing as a gate-health line under a different name and stop
      being reported as CentiColons; replacing expected_total_cc in the
      release signature is the release-boundary bar raise and is NOT this
      row. Goodhart moves and what catches each are tabled in section 5.5;
      the one not caught mechanically (an assert that cannot fail) is named
      residue, section 6. The verdict grammar is the house one so the
      preflight door and the gate loop classify it through the same
      classifier (_pf_run_guard today, verdict.classify after 1384-bqhy).
    provenance: |
      macuahuitl 2026-09-26, Fable research-and-design agent. Any host;
      lenovinha first, macbookair records the second regime.

  - packet_id: centicolon-velocity-is-computed-from-the-r-line-in-loop-status-records-on-trunk-so-v-c-is-a-number-and-below-minimum-is-a-report-not-a-hook
