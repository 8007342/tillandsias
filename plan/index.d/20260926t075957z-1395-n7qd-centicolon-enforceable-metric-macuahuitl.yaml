      - scripts/centicolon-velocity.sh
      - scripts/test-centicolon-velocity.sh
    observed_by: macuahuitl
    unscoreable: ""
    verifiable_closure: |
      cycle-metrics.sh emits one pinned line, centicolon: R=<n>
      denominator=<d> regime=<m> tree=<digest> host=<h>, into the loop status
      record, and scripts/centicolon-velocity.sh reads the last four records
      for the same host on origin/linux-next and prints
      centicolon-velocity: v_c=<obligations/hour> window=<n>
      comparable=<yes|no:<why>>. scripts/test-centicolon-velocity.sh pins
      over synthetic records -- four comparable records give the (R_t-3 -
      R_t)/delta_t value to one decimal; a denominator change inside the
      window gives comparable=no:denominator-changed and no velocity; three
      records give window=3 and no velocity; V_c below V_min prints
      note:centicolon-velocity:below-minimum and exits 0 (a report, never a
      refusal). Pre-fix result: FAILS (cycle-metrics.sh has no centicolon
      line; the velocity script does not exist).
    title: |
      the coordination skill defines V_c = (R_t-3 - R_t)/delta_t with V_min = 1 unit/hour and nobody computes either, so the R line lands in plan/loop_status.d on trunk and a velocity script reads it there; the alignment event stays a coordinator decision made against the printed number
    context: |
      Design doc section 5.3. The skill's R formula sums three different
      units (weighted cc, unimplemented requirements, open issues); this row
      reports R from the ratchet line and the ready-queue length beside it in
      its own unit, and the event on the skill (methodology change, operator)
      amends the formula afterwards. Records across a broken regime are not
      comparable and say so, because centicolon_function's Regime is exactly
      the qualifier math-foundations.yaml puts on monotonicity. Whether
      V_min = 1 obligation/hour is a sensible floor for THIS R is decided by
      the operator against the first four comparable records.
    provenance: |
      macuahuitl 2026-09-26, Fable research-and-design agent. Any host; yoga.

