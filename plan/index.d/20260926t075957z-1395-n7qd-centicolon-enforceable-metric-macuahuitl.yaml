    observed_by: macuahuitl
    unscoreable: ""
    verifiable_closure: |
      scripts/test-centicolon-extract.sh runs `tillandsias-plan predicate
      scripts/lua/centicolon-extract.lua` (class cacheable) over a hermetic
      spec root holding three specs and asserts the JSON it emits (via
      expert.log_info until 1384-bqhy's out.line exists) -- an active spec with
      two requirements and three scenarios yields three obligations with ids
      `cc:<req-id>:<sha256(title)[:8]>`; an obsolete spec yields zero and one
      `excluded:obsolete`; a requirement heading with no req-id is REFUSED by
      name, never counted; a spec directory absent from litmus-bindings.yaml
      is reported as `unregistered`, never silently skipped. On the real
      corpus the fixture asserts the digest of two consecutive runs is equal
      and the obligation count is greater than zero. Pre-fix result: FAILS
      (the predicate file does not exist; `predicate` exits 1 naming it). The
      fixture is wired as a gate-steps.d step in the same commit (1325-ygq5).
    title: |
      the CentiColon denominator is 16 CI check ids in local-ci.sh and never the 670 requirements or 1,436 scenarios in openspec/specs, so a Cacheable Lua predicate extracts one obligation per `#### Scenario:` under a req-id'd requirement in an active spec, byte-identical across hosts
    context: |
      Measured 2026-09-26 on origin/linux-next 1047cb178 -- the signature
      line local-ci.sh wrote the day before reads expected_total_cc 990,
      actual_earned_cc 990, residual_cc 0, litmus_tests_run 0, while
      1381-za6b was being reopened for three unmet criteria. The obligations
      `score-checks` scores are check_weight's 16 gate ids; no spec obligation
      has ever entered the denominator (977-3dee's backfill reached 2.6% at
      ceiling traced for the same reason). Feasibility measured with the
      shipped binary -- a 40-line script using fs.read, yaml.parse,
      hash.sha256 and json.encode over gh-auth-script printed 7 requirements
      and 19 scenarios, sha256 of stdout identical across three processes.
      Unit, identity rule and status filter are in the design doc, section 3.
      Status is read in both spellings the corpus uses (36 files carry
      `status: <word>` on its own line, 143 carry the bare word under
      `## Status`).
    provenance: |
