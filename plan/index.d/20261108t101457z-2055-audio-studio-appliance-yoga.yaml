    title: "An audio studio appliance, a sibling studio beside ComfyUI, runs ffmpeg, sox, rubberband and a glitch detector on audio inputs and writes outputs with provenance under /work/tmp"
    context: |
      Coordinator relay 2026-11-08 of an operator approval: a GENERIC audio studio, alongside ComfyUI (registry id comfyui, kind sibling, image imagegen-studio, order 1921-2krx). Operator-approved contents:
      rubberband and sox, GPL tools inside the container only and never shipped in a release artefact (built on the host like imagegen-studio);
      ffmpeg with libopus and the native AAC encoder (permissive or LGPL, no fdk-aac);
      Python with numpy, scipy, librosa, soundfile and pyloudnorm, for glitch detection: clicks, dropouts, spectral holes, clipping and loop seams.
      Requirements: GPU work goes through the shared host queue; outputs go under /work/tmp/audio with provenance, as studio.run_workflow writes them; there is no egress (model downloads belong to 2055-d9sa and 2055-dihg); the registry declares it with good_for, not_for and edits.
      Stem separation is 2055-d9sa; generative repaint, extend and lego are 2055-dihg; ComfyUI's LoadAudio input binding stays 2018-auin.
      The Python lives in the appliance image for users, not in this repo's scripts or tests (standing no-Python rule): tests are cargo or Lua.
    exit_criteria:
      - "images/studio/registry.lua declares an audio studio (kind sibling, its own image) with good_for, not_for and edits; build-studio-registry.lua accepts it, and webstudio.options lists it with those fields."
      - "One studio tool runs a named transform (at least: loudness-normalise, time-stretch with rubberband, convert to opus and to AAC) and one runs glitch detection, which returns JSON findings with a time range and kind for each of: click, dropout, spectral hole, clipping, loop seam. Each tool writes its output under /work/tmp/audio with a provenance record naming the tool, its version, the input hashes and the parameters."
      - "A cargo or Lua fixture feeds synthetic audio with one planted fault of each kind and asserts each is found at its planted time range, plus a clean control file with no findings. Pre-fix result: FAILS, no audio studio exists."
      - "The release artefacts carry no rubberband or sox binary, checked by listing the tray bundle."
    verifiable_closure: "The planted-fault fixture finds each of the five fault kinds at its planted range and reports nothing on the clean control; the registry lists the studio with good_for/not_for/edits; a bundle listing shows no rubberband or sox. Pre-fix result: FAILS, no audio studio exists."
