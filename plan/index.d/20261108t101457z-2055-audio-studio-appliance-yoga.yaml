  - packet_id: the-audio-studio-separates-a-mix-into-stems-with-demucs-and-builds-cumulative-tiers-from-chosen-stems
    order: 2055-d9sa
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [studio, audio, models, licence, gpu]
    estimated_hours: 8
    depends_on:
      - an-audio-studio-sibling-appliance-runs-analysis-and-transform-tools-on-the-gpu-queue-with-provenance
    owned_files:
      - images/audio-studio/stems.toml
    title: "The audio studio separates a mix into stems with Demucs v4 (htdemucs, 6-stem where available) and builds cumulative tiers by adding chosen stems, with the weights fetched only after accept-licence and the consent token"
    context: |
      Operator approved Demucs v4 / htdemucs on 2026-11-08 (coordinator relay). The weights' licence is checked through accept-licence BEFORE any fetch: the code licence is not the weights' licence, and htdemucs_6s may differ from htdemucs. The fetch goes through the model-hubs egress tier (2041-i3nk) behind the consent token, never a direct download.
      Layering is generic, though kumbia (the first client) wants vertical layering: one arrangement per level, split into stems, with tiers built by adding stems. So a tier tool takes stems plus an ordered list of tiers (each tier names the stems it adds) and writes one loudness-matched mix per tier. It never assumes a song form.
    exit_criteria:
      - "Before any weights fetch, the studio refuses with licence_acknowledgement_required unless the Demucs weights' licence is acknowledged through accept-licence; once acknowledged, the fetch goes through the model-hubs egress tier with the consent token, and a fetch without the token is refused."
      - "A separation on a real GPU host (through the shared queue) writes 4 stems for htdemucs, or 6 for htdemucs_6s where present, under /work/tmp/audio with provenance (model id, weights hash, input hash). The sum of the stems reconstructs the input within a stated tolerance."
      - "The tier tool, given stems and tiers [[drums],[drums,bass],[drums,bass,other]], writes three mixes. Each mix contains exactly its stems (checked by residual energy against the stem sum) and is loudness-matched to a stated LUFS target."
      - "Pre-fix result: FAILS, no separation tool exists."
    verifiable_closure: "A real GPU-queue separation writes 4 or 6 stems whose sum reconstructs the input within tolerance, with provenance; the tier fixture's three mixes each contain exactly their stems at the LUFS target; the weights fetch is refused without the licence acknowledgement and the consent token. Pre-fix result: FAILS, no separation tool exists."
    unscoreable: |
      unpinnable-until-the-guard-exists: the implementer adds the tier fixture and the refusal arms in the same commit (1136-n8sh).
    next_action: >
      Read the Demucs weights' licence (htdemucs and htdemucs_6s separately) and run accept-licence if it is outside the permissive list; then write the tier fixture.
    provenance: |
      macuahuitl-fedora relay 2026-11-08 (operator approval of Demucs; kumbia's vertical layering as the first client).
    events:
      - type: filed
        ts: "2026-11-08T10:14:57Z"
        host: yoga
        summary: "filed at the coordinator's request; stems and tiers slice of the audio studio"
  - packet_id: the-audio-studio-repaints-extends-and-adds-or-removes-one-instrument-with-ace-step
    order: 2055-dihg
    status: ready
    kind: feature
    priority: p3
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [studio, audio, models, licence, gpu]
    estimated_hours: 12
    depends_on:
      - an-audio-studio-sibling-appliance-runs-analysis-and-transform-tools-on-the-gpu-queue-with-provenance
    owned_files:
      - images/audio-studio/ace-step.toml
    title: "The audio studio regenerates a time range (repaint), extends or completes a piece, and adds or removes one instrument track (lego/extract) with ACE-Step 1.5, run natively or through pinned ComfyUI nodes"
    context: |
      Asked by the coordinator 2026-11-08 (permissive-list item; the licence is still checked before any fetch, as in 2055-d9sa). Two routes, and the implementer picks one with a measurement: ACE-Step 1.5 native in the audio studio image, or pinned ComfyUI nodes in imagegen-studio. The ComfyUI route needs 2018-auin (the LoadAudio input binding) first. Either way the call goes through the shared GPU queue, outputs go under /work/tmp/audio with provenance, and the weights come through the model-hubs egress tier behind the consent token.
      Each operation is checked by a property, never by listening: repaint changes only the requested range; extend keeps the original prefix; lego/extract changes one track.
    exit_criteria:
      - "Repaint of [t0,t1] on a real GPU host returns audio whose samples outside [t0,t1] match the input (outside a stated crossfade), and whose inside differs; with provenance (model id, weights hash, seed, range)."
      - "Extend returns audio whose first N seconds match the input within tolerance and whose length grows by the requested amount."
      - "Lego (add a named instrument) and extract (remove one) each return audio whose separated stems (2055-d9sa's tool) differ from the input's only in the named instrument's stem, beyond a stated threshold."
      - "The route choice (native or ComfyUI nodes) is recorded with the measurement that chose it (VRAM, wall time on yoga's GPU). Pre-fix result: FAILS, no generative audio tool exists."
    verifiable_closure: "On a real GPU host: repaint changes only the requested range; extend keeps the prefix and grows by the request; lego and extract change only the named instrument's stem; each output carries provenance; the route choice cites its measurement. Pre-fix result: FAILS, no generative audio tool exists."
    unscoreable: |
      unpinnable-until-the-guard-exists: the implementer adds the range/prefix/stem property checks in the same commit (1136-n8sh).
    next_action: >
      Read ACE-Step 1.5's code and weights licences; measure VRAM and wall time on yoga's GPU for the native route against the pinned-ComfyUI-node route, then pick one and record why.
