packets:
  - packet_id: host-preamble-does-not-check-git-identity-or-name-its-cargo-assumptions
    order: 1005-m6rz
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [preamble, git, fail-loud, low-end, hooks, discoverability]
    estimated_hours: 2
    title: |
      A fresh or re-imaged host cannot commit until someone sets a git identity, nothing in the preamble checks it, and a third script assumes cargo is on PATH.
    context: |
      FOUND by pirria-cachyos 2026-09-04 while landing its smoke report on a host
      whose toolchain had vanished. (1) git identity was UNSET: `unable to
      auto-detect email address (got 'lapto@pirria.(none)')` blocked the commit
      outright; pirria set it repo-locally to the operator's identity to finish
      the push. No preamble step (cycle-preflight, credential guard, committable
      branch guard, daily maintenance) checks that a commit is even possible, so
      a fresh or re-imaged host discovers it at the first commit, after the work.
      (2) scripts/check-cheatsheet-tiers.sh:57 emits `cargo: command not found`
      as a non-blocking validation ERROR on the commit hook; cosmetic on that
      host, but it is the same cargo assumption surfacing in a third place after
      cycle-preflight (876-irn7 / the cargo-absent ordering packet filed this
      night) and host-capability-probe.sh (which refuses without a runnable
      tillandsias binary, so pirria could not publish its row). Credit recorded
      where due: the pre-push gate handled the missing toolchain WELL, taking the
      plan-only lane, validating the fragment through the yq tier, and saying
      plainly that the schema and status-loss checks were skipped; that is the
      graceful degradation the other three sites lack.
      Provenance: pirria-cachyos measured; filed by macuahuitl (coordinator).
    exit_criteria:
      - the preamble (cycle-preflight or the committable-branch guard) checks that user.name and user.email resolve, and refuses with the exact git config commands as the remedy before any claim is made
      - check-cheatsheet-tiers.sh either resolves cargo through CARGO_HOME/bin and HOME/.cargo/bin like cycle-preflight, or names its cargo dependency as skipped-absent rather than printing a bare command-not-found on the commit hook
      - the cargo assumption sites (cycle-preflight, host-capability-probe, check-cheatsheet-tiers) are listed in one place so the next one is added to the list rather than discovered on the floor
    verifiable_closure: |
      scripts/test-cycle-preflight-cargo-resolution.sh is bound and invoked by
      ./build.sh --check; the identity arm and the cheatsheet-tiers arm do not
      exist yet and are this packet's deliverable inside that fixture (or a
      sibling named at closure).
