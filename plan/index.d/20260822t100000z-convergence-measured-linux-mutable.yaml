        THE QUEUE SHRANK. First time this campaign, and the first time anyone
        measured it rather than arguing about it.

          ready at campaign start (2026-08-19)   410
          ready now (2026-08-22)                 386
          net                                    -24 over three days

        Against a pre-campaign trend of +26/DAY. So the sign flipped: roughly
        +78 expected over this window, -24 observed.

        THE ROUTING RULE, measured on its own terms. Since 2026-08-19 this host
        appended 146 EVENTS and filed 4 ROWS — a 36:1 ratio. Before the rule
        most of those 146 observations would have become rows, because "capture
        is mandatory" and "a new row" were the same act. They are now different
        acts and the ledger shows it.

        b, WITH THE ARITHMETIC STATED SO IT CAN BE CHECKED:
          terminal writes by this host   53   (29 completed, 6 done, 18 obsoleted)
          rows filed by this host         4   (833-ecdg, 843-624y, 844-aq78, 845-7a88)
          b over the whole window         4/53 = 0.075
          b excluding the one-time sweep  4/12 = 0.33

        The second number is the one to quote. 41 of the 53 closures came from
        the 2026-08-19 triage, which drained accumulated STOCK and cannot
        recur — steady state is 12 closures, and 4 filings against those is
        0.33. Both are below the R2'' target of b < 1; at 0.33 and mu ~ 19/day,
        dL/dt = 2.2 - 0.67*19 = -10.5/day, which is the sign the whole campaign
        was for.

        THREE CAVEATS, because a number this good invites over-reading:

        1. I AM NOT COMPARING 0.33 TO 1.80. The 1.80 was measured across FIVE
           hosts doing feature work. This is ONE host over three days doing
           almost entirely closure and repair. Different population, different
           work shape. The honest claim is "the routing rule is compatible with
           b well under 1 on this host", not "curation cut b by 5x".

        2. A CLOSING CAMPAIGN FLATTERS THE RATIO. Filing is what feature work
           does; I spent three days fixing gates and closing rows. The test that
           matters is a cycle that BUILDS something and still files few rows —
           and 844-aq78 is a small piece of that evidence: real defect, real
           fix, and it was already a row rather than a new one.

        3. EVENTS ARE NOT FREE, and the 36:1 should not be read as costless. 146
           events grow the base and get folded by compaction. What they do not
           do is enter READY, which is the queue the operator stood the fleet
           down over. The cost moved from the selectable set to the corpus, and
           the corpus has its own bound (the 2026-08-22 sweep took the base from
           72,168 to 33,379 lines).

        WHAT THIS DOES NOT SETTLE. R2'' is a FLEET criterion and this is a
        single-host reading. The rejoin plan's gate — measure b over the
        previous host's participation before adding the next — is unchanged and
        this measurement is exactly the baseline it needs. The first rejoining
        host should be measured the same way: events appended versus rows filed,
        and terminal writes versus filings, over its first three days.
