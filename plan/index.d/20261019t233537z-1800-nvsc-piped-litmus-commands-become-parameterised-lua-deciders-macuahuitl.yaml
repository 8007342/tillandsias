packets:
  - packet_id: every-piped-litmus-command-becomes-a-parameterised-lua-decider-call-that-names-its-inputs-never-passes-on-an-empty-population-and-names-what-failed
    order: 1800-nvsc
    status: in_progress
    kind: epic
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [litmus, lua, ci, fail-loud, convergence, epic]
    estimated_hours: 3
    related: [1799-5kvy, 1624-bv73, 1384-bxhk, 1577-57u3, 902-5bf9]
    owned_files:
      - openspec/changes/litmus-parameterised-lua-deciders/
      - methodology/convergence.yaml
    title: |
      EPIC — every piped litmus `command:` (950 on 2026-10-19, 155 with three or more pipes) becomes a call to a parameterised Lua decider (scripts/lua/litmus-decide.lua <family> --options) that captures its producer's error states, never passes on an empty population, names what failed, retries only transient failures, and caches one producer run per tree state for every step that judges it
    context: |
      OPERATOR DIRECTION (2026-10-19), verbatim intent: piped bash in
      `command:` lines should be parameterised Lua scripts that parse and
      capture error states gracefully and provide affordances for recovery,
      retries and caches. Direction: green work lands without the
      coordinator.
      MEASURED on linux-next the same day: 3204 command: lines, 950 with a
      pipe outside quotes (1477 by raw `|`, which counts `||` and regex
      alternation), 155 with three or more. By decision family (upper bounds
      for the minority families; census-litmus-pipes.lua): file-grep 421,
      script-output 205, structured-field 88, podman-probe 66,
      text-transform 49, cargo-other 37, plan-query 36, cargo-test 28,
      process 12, git-query 8.
      WHY EACH PIPE IS A DEFECT WAITING: `grep -q` under pipefail inverts on
      SIGPIPE; `head` truncates the line a reader needed; `|| true` swallows
      the producer; a `$(...)` capture with no echo on the failing branch
      goes red with EMPTY output — incident 1799-5kvy, step 20 on the
      v56.10.19.1 release gate, nobody could tell which test failed.
      WHAT EXISTS: check-shell-ratchet.lua (1384-bxhk, 1577-57u3,
      1624-bv73) refuses a NEW piped litmus command beyond each file's floor;
      standing debt was never driven down. methodology/convergence.yaml
      carries counter-based carried-obligation backlogs (shell-to-lua).
      DESIGN (binding on every slice; design.md of the change): ONE script,
      the family is the first argument (the runtime nils `require`, so the
      shared library is a section of the file); an empty population is
      could-not-run, never ok; a tool that cannot spawn is could-not-run
      naming it; every non-ok verdict prints why: and remedy: and names the
      thing; retries are bounded and transient-only; a cached producer run is
      keyed on tree state (HEAD + sha256 of `git diff HEAD` + untracked
      contents) and says cache=hit|miss|off; a conversion keeps or TIGHTENS
      the expectation, and a step that turns red on conversion is a finding,
      never a reason to loosen the decider.
      BURN-DOWN: the litmus-piped-commands backlog in
      methodology/convergence.yaml, advisory under the operator's latest
      ruling (warnings only); counter = census-litmus-pipes.lua's `piped=`
      line printed on every --check; item = one converted command: with its
      floor line lowered; editing an existing piped command converts it
      (1800-f56m's ratchet arm, a warning at this stage).
      PICKUP: Linux-first (cargo and podman producers); file-grep and
      text-transform slices run on any host with the plan binary.
    exit_criteria:
      - 'scripts/lua/census-litmus-pipes.lua prints ok:litmus-pipe-census:piped=0 on linux-next (2026-10-19: piped=950)'
      - 'the `litmus` lines of scripts/portability/pipe-site-floor.txt sum to 0 (2026-10-19: 958)'
      - 'every slice below is done and the litmus-piped-commands backlog is retired from methodology/convergence.yaml under its retire trigger'
