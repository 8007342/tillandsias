# Epic 1800-nvsc and its eight slices. Direction for every row: green work
# lands without the coordinator.
# Change: openspec/changes/litmus-parameterised-lua-deciders/ (proposal,
# design, tasks, spec deltas litmus-framework and ci-release).
# Counter: scripts/lua/census-litmus-pipes.lua on this branch:
#   piped=950 three-plus=155 file-grep=421 script-output=205
