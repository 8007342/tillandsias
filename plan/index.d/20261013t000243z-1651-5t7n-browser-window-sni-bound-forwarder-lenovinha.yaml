    title: |
      A browser.open window can reach only its own project: a per-window SNI-bound forwarder replaces the router on the window's network, and the router enforces Host == SNI.
    context: |
      1649-xqet (#391) put each browser.open window on its own --internal network, joined only by the shared router (alias router). Chromium's --host-resolver-rules confine the browser itself to the project.
      Residual, measured on a private store with the real router image (plan/evidence/1649-xqet-browser-open-container-2026-10-12/live): a raw request from inside the window container to router:8443 with SNI and Host www.other.localhost gets 200 PREVIEW-OTHER. The router routes by Host/SNI across every project, so a compromised browser process is not confined to its project.
      Design (coordinator, option B):
      - Per window, a tiny forwarder container replaces the router on the window's network (alias router). It joins the window network and the enclave network.
      - It passes only TLS whose ClientHello SNI is *.<project>.localhost and forwards those bytes to the router's :8443. It refuses everything else, including plaintext.
      - The router gets strict_sni_host, so the Host header must equal the SNI.
      - The http:8080 MAP rule is dropped, because a plaintext Host header cannot be bound to a project.
      - The forwarder's lifecycle is the window's: started in start(), removed in stop().
    exit_criteria:
      - 'from inside a window container for project demo, a raw TLS request to router:8443 with SNI www.other.localhost is refused, and one with SNI www.demo.localhost but Host www.other.localhost is refused by the router (strict_sni_host); measured live on a private store, red on the 1649-xqet tree first'
      - 'the window still renders https://www.demo.localhost:<preview-port>, and the 1649-xqet live criteria (own network, no host listener, no host chrome, nothing else reachable) stay green'
      - 'plaintext from the window reaches nothing: the http:8080 mapping is gone from the resolver rules and the forwarder accepts no plaintext'
