      summary: |
        OPERATOR RULING (2026-10-17, asked by lenovinha): "Automatic, user scope". At launch and at publish, Tillandsias installs a separate preview CA into the user-scope browser trust stores it finds (~/.pki/nssdb for Chrome and Chromium, the .pki/nssdb of Chromium-family Flatpaks such as Brave, and existing Firefox profile cert9.db files). It never writes a system store. There is no prompt and no menu item, and the uninstaller removes the CA. Design: the preview CA carries critical nameConstraints permitting only DNS localhost and excluding all IPs. It lives a year and is renewed at launch with the 1762-bano 60-day margin. Preview leaves are signed by it, not by the enclave CA, which stays host-untrusted under check-enclave-ca-not-host-trusted.lua. Measured on lenovinha: no certutil on the host and none in any local image, so the install runs certutil from an image that gains nss-tools.
