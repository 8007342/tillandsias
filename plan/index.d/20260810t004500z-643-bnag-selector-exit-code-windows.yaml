  - packet_id: selector-exit-code-counterfeit-completion
    order: 643-bnag
    status: completed
    desired_release: v0.5
    priority: p1
    title: "select-work-batch.sh discarded the query's exit code, so a stale plan binary reported a drained ledger"
    kind: bug
    deliverable: scripts/select-work-batch.sh
    depends_on: []
    pickup_role: windows
    capability_tags: [plan, orchestration, triage, tooling, data-integrity]
    context: >
      Second occurrence of the counterfeit-completion defect fixed by 632-retq,
      reached through a different door and LIVE rather than hypothetical.

      `--claimable-by` landed with 632-39p3 a few hours earlier. On any host whose
      tillandsias-plan predates it — including this Windows checkout — the query
      exits 2 with `unknown query flag: --claimable-by`. The script captured
      stdout with `2>/dev/null` and tested only `[ -n "$raw" ]`, so the failure
      arrived as `refused:no-eligible-work` — the greedy loop's TERMINAL state.

      The binary was not at fault: it named the unknown constraint on stderr and
      exited non-zero. The script discarded both, inferring health from output
      volume. Under that test every failure mode of the query — stale binary,
      unreadable ledger, permissions, panic — is indistinguishable from an empty
      result set.

      632-retq guarded one specific dependency (jq) rather than the shape, which
      is why it did not catch this. A preflight enumerates the failures you
      thought of; an exit-code check covers the ones you did not.
    outcome: >
      The query's exit code and stderr are now captured and branched on:
      non-zero with `unknown query` in stderr -> `refused:stale-plan-binary:`
      naming the binary and the rebuild command; non-zero otherwise ->
      `refused:query-failed:` quoting the code and the real stderr line; zero and
      empty -> `refused:no-eligible-work:`, which now means what it says.

      The `unknown query` match is deliberately loose because the wording is
      version-dependent (older binaries say "flag", newer say "constraint");
      pinning either would degrade the diagnosis to the generic branch on half
      the fleet.

      Also fixed: argument validation now precedes environment probes, so
      `--budget 0` on a jq-less host refuses as a bad budget rather than a
      missing tool. One bad invocation had been producing different diagnoses on
      different hosts.

      TILLANDSIAS_PLAN_BIN added as a test seam — without it these refusals are
      untestable on hosts whose binary is current, i.e. exactly the hosts CI runs
      on, which is why the hole survived its first fix.
    verifiable_closure: >
      litmus:cycle-batch-triage-shape gains three two-sided negative controls
      (stale-plan-binary, query-failed with the reason quoted, and bad-budget
      under an absent jq); each asserts the right token appears AND
      no-eligible-work does not.
    events:
      - ts: "2026-08-10T00:45:00Z"
        event: completed
        summary: >
          Found on the windows host while checking why the selector still refused
