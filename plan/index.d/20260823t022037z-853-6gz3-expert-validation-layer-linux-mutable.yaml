packets:
  - order: 853-6gz3
    packet_id: expert-validation-layer-returns-verified-not-merely-verifiable
    desired_release: v0.6
    title: "an unfold/verify/fold layer inside the expert system, so callers get VERIFIED answers through the unchanged interface"
    status: ready
    kind: enhancement
    pickup_role: linux
    priority: p1
    capability_tags: [experts, rag, answer-envelope, crdt, inference, verification]
    deliverable: crates/tillandsias-plan/src/answer.rs
    depends_on: []
    estimated_hours: 24
    context: >
      ORIGIN. Operator design (The Tlatoani), 2026-08-22/23. Recorded here in
      the operator's own framing because the framing is the contribution.

      THE PROBLEM IT SOLVES, and it is measured rather than supposed. The fat
      spec expert cannot refuse an out-of-corpus question (821-73es). The
      obvious fix — a cosine threshold — is DEAD at realistic sample size: at
      n=579 the in-corpus and out-of-corpus bands overlap by 0.3024 globally and
      by 0.17-0.28 in EVERY corpus, and a top1-vs-top2 margin overlaps by 0.1306
      (worse than the raw score). Even in-corpus floor 0.5620 versus genuine
      far-field ceiling 0.6911 overlaps by 0.1292. A single scalar conflates
      "topically near" with "actually answers"; those are different properties
      and no cutoff separates them. Measurements and harness at
      scripts/refusal-calibration/, events on 824-6qxh.

      THE DESIGN. An agent asks ONE ordinary question. Inside the expert system,
      invisibly to the caller:

        1. UNFOLD the question into n adversarial, individually verifiable
           sub-questions. Not paraphrases and NOT repetitions of the same
           prompt — COMPLEMENTS. "Does this project support X?" also asks
           "does it support X's alternatives?", "can it function without X?",
           "how does X support this project?", and where X decomposes, the
           not-X / opposite-of-X / X-alternative forms. The search-engine
           analogy the operator gave: a media engine searching "Miley Cyrus"
           also searches "<term> albums", "<term> songs", "<term> soundtrack",
           then ranks what comes back.
        2. ANSWER each sub-question through the existing RAG path, which
           already returns evidence (file, spec, cheatsheet references).
        3. COLLECT the results CRDT-style — a G-Set of sub-answers, merge by
           union, no single winner elected early. This is the same accumulate-
           then-fold shape the ledger already uses, which is why the operator
           observed it "only matches our CRDT approach".
        4. VERIFY every collected response against its own references.
        5. FOLD the verified set into ONE answer for the ORIGINAL question.

      WHY THE COMPLEMENTS ARE LOAD-BEARING, not decoration. Repeating one prompt
      resamples the SAME bias and converges confidently on the same wrong
      answer — the law of large numbers gives you the expected value, and if the
      estimator is biased the expected value is wrong. methodology/philosophy.yaml
      `convergence_via_velocity` already states the condition: BOUNDED SKEW, not
      merely many samples. Adversarial complements are how the skew is bounded,
      because complementary framings fail in different directions. Consistency
      across them is evidence; DIVERGENCE ACROSS THEM IS THE HALLUCINATION
      SIGNAL, by design.

      MEASURED, AND THIS IS THE RESULT THAT JUSTIFIES THE DESIGN. The complement
      pair detects a useless judge with NO ground truth and NO labelled set.
      Asked of qwen2.5:0.5b about a passage that genuinely answers a question
      AND a CSS cheatsheet that does not, both framings — "does the passage
      answer the question?" and "is the passage MISSING the answer?" — returned
      YES on both passages. A single-prompt harness sees a confident working
      judge; the complement pair exposes a flat contradiction. That property is
      what makes this deployable at runtime rather than only in a lab: it
      converts "is this true?", which needs labels, into "do complementary
      framings agree?", which needs only more queries.

      TRANSPARENT BY CONSTRUCTION. The wrap point is
      `answer_question(ledger, question, source_rel) -> Envelope`
      (crates/tillandsias-plan/src/answer.rs:1230). Same signature, same return
      type, so plan_answer / spec_answer / methodology_ask and every in-forge
      caller change NOT AT ALL. It is middleware, not a redesign. Operator
      intent is explicit that the development-environment runtime uses this too,
      not only the forge.

      L0 MUST BYPASS THE LAYER. `Confidence::Exact` is a deterministic ledger
      lookup — the answer IS the content. Fanning it out would spend inference
      re-deriving certainty and would let an inferential layer contradict
      deterministic bookkeeping. Verification applies to `Retrieved` only. This
      preserves the boundary the operator set earlier: deterministic
      bookkeeping and querying with CRDT-friendly types, inference as the sugar
      that explains it.

      TWO TIERS, AND THE CHEAP ONE NEEDS NO MODEL.
        TIER A — REFERENCE INTEGRITY. Deterministic, zero tokens: does the cited
        path exist, does the span resolve, does the quoted text match? Kills
        every fabricated or rotted citation before any inference runs.
        scripts/check-source-slice-bounds.sh already performs this shape for a
        different purpose and should be the starting point rather than a
        reinvention. Tier A is UNBLOCKED TODAY.
        TIER B — SUPPORT JUDGEMENT. Inferential, complement-paired: does the
        real span actually answer the question? Runs only on citations Tier A
        already proved real. BLOCKED on 849-tz8g.

      AFFORDANCES, NOT JUST RANKS. Operator requirement, and it changes the
      return type rather than decorating it. A numeric score cannot carry this:
      a high cosine means "more textually similar", never "more true", so the
      top answer is a RECOMMENDATION, not a verdict. Low-graded answers must
      still be RETURNED — the caller may be investigating precisely that edge
      case, and suppressing them removes the agency the layer exists to give.
      What makes the difference usable is that the WHY is machine-readable.
      Follow the project's existing pattern (Confidence, CitationKind): a CLOSED
      vocabulary with a mandatory reason.

        Intended    — the designed path
        Compatible  — works, not idiomatic; name the idiomatic one
        Discouraged — works, has costs; name them
        Prohibited  — never without explicit operator permission; name the
                      damage, the cost, and what must be discussed first

      Much of this is DERIVED, not judged. The methodology already encodes
      irreversibility, release authority, cloud-minute cost, the token policy
      and the no-force-push rule, so "Prohibited: never push --force to main"
      is a lookup rather than an opinion the model forms. Operator's example of
      the target register: "please don't try this, it would damage <x> and <y>
      and has financial cost on <z>, ask for exceptions for investigation but
      don't proceed ever without USER explicit permission after very clear
      discussion of consequences."

      WHY THIS JUSTIFIES THE HARDWARE PROGRAMME. Every stage is numerical
      methods run LOCALLY: embedding, cosine, aggregation, small-model
      judgement, all parallel, all accelerator-friendly. It is the reason the
      fleet's CPU/NPU/GPU spread matters — tune on the high-end host, run on
      commodity hardware. Operator intent is that this becomes open source.

      OPEN DECISION, OPERATOR-OWNED: what the fold does when sub-answers
      DISAGREE. Conservative (any unresolved contradiction -> Unsupported),
      majority (report consensus, drop dissent), or divergence-surfacing
      (report consensus AND attach the contradiction). The operator's own
      framing — divergence in hallucinations is proof-of-convergence by design —
      argues the third, since voting the disagreement away discards the signal
      the fan-out was built to produce. Recorded as a decision, not assumed.

      NAMING: the layer needs one. Deferred by the operator; do not invent one
      in passing and let it stick by accident.
    exit_criteria: >
      (1) `answer_question` returns a VERIFIED envelope through an UNCHANGED
      signature — no caller, MCP tool, or in-forge agent edited to accommodate
      it. A caller diff of zero is part of the acceptance.
      (2) Tier A alone demonstrably rejects a fabricated citation and a rotted
      one (a path compaction has folded away), with a negative control proving
      it ACCEPTS a real one. Shippable before 849-tz8g clears.
      (3) `Confidence::Exact` answers bypass the layer entirely, proven by a
      test that fails if an L0 lookup is fanned out.
      (4) The affordance vocabulary is closed and every returned candidate
      carries a reason; a candidate with an empty reason is a hard error, not a
      default. Prohibited entries name damage, cost, and the permission needed.
      (5) The complement probe runs as a SELF-CHECK: the layer detects and
      reports its own judge answering YES to both a claim and its complement,
      rather than silently averaging a degenerate judge into a confident answer.
      (6) Measured on the committed 579-question set BOTH directions —
      in-corpus answered rate AND out-of-corpus refused rate. A layer that
      refuses everything scores 100% on half the set, which is exactly how the
      0.5B judge first read as a success.
      (7) A per-call budget: n sub-questions x waves is bounded and reported, so
      an answer cannot silently cost an unbounded number of model calls.

