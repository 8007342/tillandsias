    title: |
      The landed login refusal explains the tray lane's failure as "the guest holds no checkout", which invites the remedy "then give the guest a checkout" — but the guest ships no git to clone one, and separately the refusal IS written to a log file that nothing points the operator at
    context: |
      FOLLOW-UP TO 1211-34v6 (landed e15c81e6d, closed 2faf4c3ce). That row
      removed an inert remedy and named a working one. This row sharpens the
      sentence explaining WHY the tray lane cannot satisfy the probe, against
      two measurements taken by yolanda-windows after the text was written.

      MEASUREMENT 1 — PERISHABLE, AND FLAGGED AS SUCH BY ITS AUTHOR. In the
      WSL distro `tillandsias`, Fedora Linux 44 (Container Image), guest binary
      Tillandsias v56.9.12.2, measured 2026-09-15: `rpm -q git` and `rpm -q gh`
      both answer "package ... is not installed". yolanda first measured this
      with `command -v` and replaced it, correctly: `command -v` answers about
      one shell's PATH, `rpm -q` answers about the installed package set, and
      the second is the claim actually being made. THIS IS A PROPERTY OF THAT
      IMAGE BUILD, NOT OF "THE GUEST". An implementer must re-measure before
      restating it; if a later image ships git, the sharpened sentence is wrong
      and must change with it.

      THE DURABLE HALF, which does not depend on the image: the resolver
      SURVIVES the absence. Command::new("git") fails to spawn, and
      read_host_project_origin_url falls through to parse_gitdir_origin_url,
      which reads .git/config directly. yolanda hand-wrote one in the guest and
      it parsed. So a checkout in the guest is NOT impossible — what is missing
      is a tool to CLONE one. "Lacks a tool" and "cannot hold a checkout" are
      different claims wanting different fixes, and the landed text implies the
      second.

      MEASUREMENT 2 — AND THE REASON THIS ROW IS NOT THE ROW I FIRST DRAFTED.
      I was going to file "the tray lane has no sink for the refusal". That is
      FALSE. The Windows tray tees the full output to
      /root/.cache/tillandsias/github-login-last.log
      and prints the path on exit. The file is 1263 bytes and holds the entire
      refusal.

      CITE IT CORRECTLY, because I got this wrong first: the tee is NOT Rust.
      In crates/tillandsias-windows-tray/src/wsl_lifecycle.rs the enclosing
      symbol is `WslLifecycle::inject_bootstrap_logic`, and the LOG= assignment
      naming github-login-last.log lives inside a SHELL HEREDOC that function
      injects — it is injected script, not code the Rust compiler ever sees.
      An implementer editing "the function that writes the log" will not find
      it by reading Rust. (I have misread a heredoc body as code twice before;
      this is the check that caught it.)

      RELEVANT HISTORY IN THE SAME FILE: a doc comment there records that a
      0-byte github-login-last.log is what produced the v0.4.260809.2 blank —
      so this sink has already failed once by existing and being empty, which
      is another well-formed output. Read that comment before changing the tee. yolanda withdrew their
      own row on this and rewrote it as a withdrawal rather than deleting it.

      HAD I FILED THE DRAFT, THE IMPLEMENTER WOULD HAVE BUILT A SINK THAT
      ALREADY EXISTS. The defect is not that the message is lost; it is that
      tray.log — the log an investigator actually opens — carries no pointer to
      the guest-side file, and the path is announced in a window that closes.
      That cost yolanda a session of guest forensics (podman event timelines,
      Vault state, source reading) reconstructing a message the tool names on
      its way out. One session is the measurement, and it is why this is worth
      a line rather than nothing.

      WHY BOTH LIVE ON ONE ROW: they are the same sentence's two halves. The
      implementer is editing the paragraph that explains the tray lane's
      failure, and it should say that the lane reaches the refusal every time,
      that the refusal IS recorded and where, and that the guest lacks the tool
      to produce the checkout the remedy asks for — not that it cannot have one.

      SCOPE, STATED SO A LATER READER DOES NOT OVERREAD IT: this changes text
      only. It does not decide where a login should resolve its repository from
      when its lane has no checkout by construction — that design question is
      yolanda's row and is untouched here. It also does not assert anything
      about macOS, and it is not about the retry loop.
