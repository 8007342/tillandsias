    deliverable: >
      The fold materializes next_action_ts beside a set-field next_action win;
      effective_next_action seeds its clock from it; compaction persists the
      sibling into the base text so the fix survives folds; the next-action
      subcommand names the winning channel.
    context: |
      MEASURED LIVE 2026-08-25T04:35Z on the coordinator's own queue. 831-ezea's
      next_action is the fleet's ordered work queue, refreshed each cycle via
      `tillandsias-plan set-field ... next_action` (the LWW channel). Two
      consecutive refreshes (02:45Z, 03:44Z) were silently invisible:
      `next-action 831-ezea` kept answering with a next_action EVENT from
      01:00:59Z. Root cause: apply_to_packets inserted the winning LWW VALUE
      but dropped its (ts, host); effective_next_action then treated the field
      as the hand-authored "untimestamped original" that yields to any event.
      Every host reading the queue during that window worked from a stale
      assignment. The two write paths (event with next_action payload;
      set-field LWW) each worked; the READ merged them with one channel blind.
    exit_criteria: |
      (1) A set-field next_action newer than the last next_action event wins
