- packet_id: a-cloud-lane-sizes-its-source-tmpfs-from-the-config-on-the-branch-the-forge-checks-out
  order: 2006-srcs
  status: ready
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [forge, launcher, git-mirror, linux]
  estimated_hours: 4
  title: A cloud lane ignores the declared [forge] src_mb when the config is committed on the integration branch and not on the mirror's HEAD
  context: 'macuahuitl 2026-11-06, first real run of 2006-srcr: kumbia-kombat commits [forge] src_mb = 4096, memory.max 12 GiB, yet /home/forge/src was 1.5 GB. CAUSE (code and GitHub, lenovinha): forge_declared_src_mb runs git show HEAD:.tillandsias/config.toml in the mirror, whose HEAD is upstream default main; the config exists only on game. A cloud forge resolves its seed itself (lib-common resolve_forge_seed_branch: the discipline seed integration.forge, here game), so the forge works on game while its tmpfs is sized from main; None falls back to the floor.'
  exit_criteria:
  - 'The launcher reads src_mb from the branch the forge will check out, by the same rule as resolve_forge_seed_branch (host checkout branch; else the seed integration.forge or linux; else default_branch; else main or master; HEAD last), and logs which branch it read.'
  - 'A real-launch test on a cloud project whose config exists only on its integration branch shows the declared size in the forge; red on trunk first.'
  verifiable_closure: 'A real cloud-lane launch of kumbia-kombat on a Linux host showing /home/forge/src at the declared size (clamped).'
  unscoreable: 'none.'
