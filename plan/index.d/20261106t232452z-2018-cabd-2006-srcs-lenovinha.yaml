  capability_tags: [images, git-mirror, vault, linux]
  estimated_hours: 2
  title: The git image's /etc/tillandsias/ca.crt is a symlink to a file the image never creates, so single-file CA binds are unreadable and token reads fail
  context: 'Operator on macuahuitl 2026-11-06, after #961 (1998-mvrs b): repeated GitHub Login prompts and the tray stuck loading repos; journal "vault-cli: CA bundle not readable at /etc/tillandsias/ca.crt" 17 times in an hour from short-lived containers. images/git/Containerfile made ca.crt a symlink to ca-trust/intermediate.crt and never created the target. The mirror binds the trust directory and worked; remote_projects.rs:331 and :792 (repo listing, clone) bind the single file at /etc/tillandsias/ca.crt, which lands on the missing target. Only the git image carries the symlink (all ten local images checked). Coordinator reproduced it and tested the fix as a local derived image.'
  exit_criteria:
  - 'The built git image reads the bound CA under -v file, --mount file and the directory bind, in a real container; a control build of the pre-fix shape fails the file binds. litmus:git-image-ca-bind-styles.'
  - 'Why the gate missed it is stated: no test ran the built image with a single-file bind.'
  verifiable_closure: 'litmus:git-image-ca-bind-styles green on a Linux host, plus the operator no longer seeing login prompts on macuahuitl after the image is rebuilt.'
  unscoreable: 'none.'
  next_action: 'Land work/2018-cabd.'
