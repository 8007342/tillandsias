    title: |
      tillandsias --update [--check-only] [--channel stable|next] resolves by channel tag (never releases/latest), verifies, installs atomically and execs --upgrade-handoff; the tray checks every UpdatesConfig.check_interval_hours (default 24, 0 disables), stages in the background and installs only when idle; every run ends with exactly one of upgraded / up-to-date / deferred:<reason> / refused:<reason>
    context: |
      No updater exists. UpdatesConfig (crates/tillandsias-core/src/config.rs:328;
      check_interval_hours default 6 at :347; check_on_launch=true) is written
      into config.toml (:678-679) and read by nothing;
      openspec/specs/update-system/spec.md is marked obsolete (1397-eppt). The
      only release downloads are the guest fetch scripts (vz.rs:1122
      releases/latest; the WSL path pinned to the workspace version).
      Downgrades are already refused by downgrade_refusal (main.rs:2869) via
      version_guard. Channel tags are defined in openspec/specs/versioning
      "Rolling channel tags"; signature verification follows
      openspec/specs/binary-signing when it provides one. Staged downloads go
      under downloads/updates/ and are recorded in the host-state-lifecycle
      download manifest. The install step is the SOFT tier (hot upgrade); when
      the handoff is refused the installed file is left staged, the running
      instance is untouched, and the outcome names the relaunch command.
      Design D6; spec delta update-system (obsolete -> draft).
