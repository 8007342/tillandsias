        ts: "2026-11-17T19:47:46Z"
        host: macuahuitl
        summary: "filed p2 ready, waits on 2081-v7qx"
  - packet_id: judge-placement-is-a-capability-keyed-table-and-its-cpu-row-is-measured-on-a-desktop-with-an-intel-npu-and-a-discrete-gpu
    order: 2094-s3ub
    status: ready
    kind: feature
