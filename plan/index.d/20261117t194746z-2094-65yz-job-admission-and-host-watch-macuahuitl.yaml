  - packet_id: a-watch-ends-on-a-declared-literal-condition-and-retries-by-a-declared-policy-that-never-retries-a-full-disk
    order: 2094-y2bb
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.6
    pickup_role: any
    capability_tags: [tray, mcp, forge]
    estimated_hours: 6
    size: M
    implementer_tier: sonnet
    title: "A watch may end on a declared literal condition (exit, marker line, file exists) and declares its retry policy as data inside the fixed budget, with a built-in list of failures that are never retried"
    context: "The 2081 watch ends on a progress file of kind checklist, lines or marker, and its restart budget is fixed with only fatal_exit_codes declared. Most host waits are a verdict line in a log or a plain exit. On 2026-11-17 two local models at temperature 0 (Qwen2.5 0.5B and 7B, one sample each) judged a No space left on device build failure retryable; a retry does not free a disk, so that case belongs to the rules. This packet adds until with the closed kinds exit, marker_line and file_exists (literals matched against a whole line or the start of a line, evaluated only at exit and at the deadline timer, the log never watched), and retry with max, back-off, exit codes and up to 8 never-retried log literals, bounded by the 2081 budget, plus a built-in never-retried list shipped as data."
    exit_criteria:
      - "A watch declaring a marker_line condition reports done when the log holds the literal as a whole line and the job exits 0, and reports the condition unmet when the only matching text is inside a longer line that does not start with it. Pre-fix result: FAILS, watch.register refuses the unknown until field or ignores it."
      - "A job that exits non-zero with No space left on device in its last 40 log lines escalates with a reason naming the literal, with zero judge requests and zero restarts; a control arm with the built-in list emptied through the fixture seam reaches the judge. Pre-fix result: FAILS, the episode goes to the judge or is restarted."
      - "A registration declaring a regular-expression pattern, a retry maximum of 10, or a back-off under 30 seconds is refused, each with its own named reason. Pre-fix result: FAILS, the fields are not recognised."
    verifiable_closure: "The watchdog module's fixture transcript with the three arms. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the condition and policy tests land with the feature; the claimer writes the test names here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: wait for 2081-v7qx's registry and rules table, then add the until kinds, the retry policy and the built-in literal list."
    provenance: "Design filed 2026-11-17 from operator direction; the 2026-11-17 classification sample in the research note."
    related: [2081-v7qx, 2081-ngd8]
    depends_on: [watch-register-attends-a-declared-job-by-rules-alone-and-restarts-it-only-by-its-declared-argv]
