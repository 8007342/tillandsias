  - packet_id: memory-pressure-reaches-the-queue-as-a-kernel-event-and-it-stops-and-requeues-only-a-job-it-started
    order: 2094-mzap
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [tray, memory, cgroup, events, queue]
    estimated_hours: 10
    size: M
    implementer_tier: sonnet
    title: "Memory pressure reaches the queue as a kernel event with no poll; under pressure it admits nothing, and under sustained pressure it stops one job it started itself and puts it back in line"
    context: "On 2026-11-15 a forge's runaway tests starved macuahuitl and froze the desktop; systemd-oomd marked the scope and the kill never landed (2093-gfak, still open and not fixed by this packet). memory_stall_watch.rs warns and never acts. Measured 2026-11-17 on kernel 7.3.3 without root: a pressure-stall trigger is accepted on /proc/pressure/memory and on tillandsias.slice's memory.pressure with a 2 s window and refused with a 1 s window; the slice's memory.events is readable and counts high 276147. This packet holds those triggers open in the tray, keeps the three levels calm, tight and critical, stops admission at tight, and at critical stops the most recently admitted queue-started job of the lane whose scope holds the most memory, requeues it with a back-off, tells its lane once, and after three requeues escalates with the reason memory. It never signals a forge, a harness or a job it did not start; when nothing is left to stop it sends one desktop notification through the notifier notify_memory_stall uses. The cadence is the operator's question 1 on 2094-65yz and nothing here is built before that ruling."
    exit_criteria:
      - "A fixture tight event with two jobs waiting admits neither until the level returns to calm, and both running jobs continue. Pre-fix result: FAILS, no pressure level exists and nothing gates admission."
      - "A fixture critical level with two queue-started jobs running stops exactly one, returns it to the head of its lane, and delivers exactly one requeued message with the reason memory; a second job is not stopped within the next 2 minutes of fixture time. Pre-fix result: FAILS, nothing is stopped."
      - "With the level critical and the heaviest lane running a job the queue did not start, that job's process receives no signal from the tray and exactly one desktop notification names the lane's scope. Pre-fix result: FAILS, no such notification path is driven by pressure level."
      - "On a Linux host with cgroup v2 and an unprivileged user manager, a real allocation inside a throwaway scope under tillandsias.slice raises the level to tight within two trigger windows, with the tray running as the user and no sudo; the transcript records the kernel version and the trigger line accepted. Pre-fix result: FAILS, the tray opens no trigger."
      - "Over 30 minutes on a calm host the pressure listener records zero wakeups. Pre-fix result: FAILS, no listener and no counter exist."
    verifiable_closure: "The pressure listener's fixture transcript with the first three and the fifth arms, and the real-host transcript for the fourth. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the listener and its tests land with the feature; the claimer writes the test names here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: wait for the operator's cadence ruling on 2094-65yz and for 2094-ay52's queue, then build the trigger listener, the level machine and the stop-and-requeue path."
    provenance: "Design filed 2026-11-17 from operator direction; the 2026-11-15 freeze and 2093-gfak; pressure probes on macuahuitl 2026-11-17 in the research note."
    related: [2093-gfak, 2067-dwqd, 1913-ebv8, 1376-8zdz]
    depends_on: [queue-submit-starts-a-declared-job-only-when-the-host-has-room-and-lanes-take-turns]
    events:
      - type: filed
        ts: "2026-11-17T19:47:46Z"
        host: macuahuitl
        summary: "filed p1 ready, waits on the operator's cadence ruling and on 2094-ay52"
  - packet_id: a-host-agent-session-submits-and-waits-on-jobs-through-a-host-lane-and-its-job-runs-in-a-scope-with-a-memory-ceiling
    order: 2094-dyvk
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.6
    pickup_role: linux
    capability_tags: [tray, mcp, systemd, cgroup, host-session]
    estimated_hours: 12
    size: L
    implementer_tier: sonnet
    title: "A host agent session reaches watch and queue tools through a host lane and a bridge subcommand; its job runs in a transient user scope with a memory ceiling; watch.wait blocks until the next event"
    context: "A host session's .mcp.json carries forge-plan and project-info and no client for the tray's lane socket. The release gates run on the host and are waited on by shell loops: 314 sleep lines in 135 files under scripts and skills (counted 2026-11-17). The harness reaps a background waiter under memory pressure and kills a foreground command at its 10-minute limit, and a host gate has no memory limit of its own. This packet adds one host lane listener per project in mcp_socket.rs (attributed by the accepting listener as LaneIdentity with instance host, never mounted into a container, carrying watch, queue and gpu.status only), a bridge subcommand of the installed binary in main.rs that answers tray-not-running by name within a second, host jobs started in a transient systemd user scope beneath tillandsias.slice with MemoryHigh and MemoryMax from the job's class, and watch.wait bounded at 9 minutes. The tool descriptions say that sessions of one user can read one another's host lanes. No shell is added; the same pull request replaces one until-sleep waiter under scripts with a queued job."
    exit_criteria:
      - "A host session's tools/list through the bridge names the watch and queue tools and gpu.status and no browser, publish, studio or cloud tool; inside a running forge no host lane path exists. Pre-fix result: FAILS, no host lane and no bridge exist."
      - "With the tray stopped, queue.submit through the bridge is refused within one second with tray-not-running and the command that starts the tray, and no process is started. Pre-fix result: FAILS, there is no bridge to answer."
      - "On a Linux host, a host job that allocates past its scope's MemoryMax is stopped inside that scope, its ticket reports the reason memory, no process outside the scope is killed, and machine-wide memory pressure avg10 stays under the tight threshold during the run. A control arm with the ceiling removed through the fixture seam is not stopped. Pre-fix result: FAILS, a host job runs with no scope and no ceiling."
      - "A host job submitted by one bridge process is still running after that process exits, and a second bridge process on the same project reads its status by ticket id. Pre-fix result: FAILS, the job is a child of the session."
      - "watch.wait returns within 2 seconds of a job's finish with state done, and returns at its timeout with the current status and zero judge requests when nothing happens. Pre-fix result: FAILS, the tool does not exist."
    verifiable_closure: "The host lane's fixture transcript with the first, second, fourth and fifth arms, and the real-host transcript for the third. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the host lane, the bridge and their tests land with the feature; the claimer writes the test names here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: wait for the operator's rulings on 2094-65yz and for 2094-ay52's queue, then build the host lane listener, the bridge subcommand, the scope launcher and watch.wait, Linux only."
    provenance: "Design filed 2026-11-17 from operator direction; openspec/changes/job-admission-and-host-watch design section 4."
    related: [2081-v7qx, 2081-bdss, 2012-kuw4, 2014-slpw]
    depends_on: [queue-submit-starts-a-declared-job-only-when-the-host-has-room-and-lanes-take-turns, a-watch-reports-done-or-stuck-exactly-once-on-the-lane-connection-the-lane-inbox-and-the-desktop]
