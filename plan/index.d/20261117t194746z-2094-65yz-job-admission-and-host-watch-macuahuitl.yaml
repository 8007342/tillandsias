    size: S
    implementer_tier: opus
    title: "DESIGN FIRST - a memory-aware job queue shared by forges and host sessions, the watchdog reachable from the bare host, and the judge placed per hardware capability across the fleet"
    context: "Operator 2026-11-17: babysitting long-running tasks moves off cloud-model minutes and off until-grep-sleep loops onto small local models on the fleet's own hardware; the babysitter checks status, retries sensibly, minds memory and queues work so several forges share one computer fairly; it must serve forges and agent sessions on the host. The 2026-11-13 watchdog design (2081-z7sh) attends one job in one forge and is not repeated. This story adds what it leaves out: admission and queueing (the 2026-11-15 freeze, 2093-gfak), a host lane for bare-metal sessions, conditions and declared retry policy on a watch, and judge placement for every hardware tier in the fleet matrix. Measured on macuahuitl 2026-11-17: Qwen2.5-0.5B decodes 42.9 tokens/s on CPU and is resident at 936 MB under the runtime's default context; a 7B model decodes 5.3 tokens/s on CPU at 6.9 GB; unprivileged pressure-stall triggers are accepted on /proc/pressure/memory and on tillandsias.slice with a 2 s window and refused with a 1 s window; the slice's memory.events reads high 276147 and oom_kill 0; the Intel NPU opens without root and still has no graph compiler."
    exit_criteria:
      - "Each of the eight questions in the design's section 10 carries an operator ruling recorded as an event on this row, and the change's proposal, design, specs and tasks agree with the rulings. Pre-fix result: FAILS, no ruling exists."
    verifiable_closure: "The operator's rulings as events on this row, and the amended change."
    unscoreable: "operator-decision: the closure is the operator's rulings on eight questions; no script can produce or check them."
    next_action: "Left: the operator reads openspec/changes/job-admission-and-host-watch/design.md section 10 and rules on the eight questions, the pressure cadence first. Then amend the change and release the children. Build nothing before that. The seven questions of 2081-z7sh are separate and still open."
    provenance: "Operator direction 2026-11-17 relayed by the coordinator on macuahuitl; host probe, fleet matrix reading and external research of the same day in plan/issues/local-babysitter-fleet-hardware-and-admission-research-2026-11-17.md."
