  - packet_id: queue-submit-starts-a-declared-job-only-when-the-host-has-room-and-lanes-take-turns
    order: 2094-ay52
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [tray, mcp, forge, memory, queue]
    estimated_hours: 12
    size: L
    implementer_tier: sonnet
    title: "queue.submit, queue.status, queue.cancel and queue.list start a declared job only when the host has memory headroom for its class, serve lanes round-robin, and attend the admitted job as a watch"
    context: "Nothing decides whether a heavy job may start. gpu_queue.rs (wait_for_gpu, Arbiter) arbitrates the GPU only; studio_jobs.rs gives one tool's batch a ticket with no admission; forge_budget.rs ForgeBudget sizes a forge and not a job. Three forges and a host gate can each start a 20-thread build in the same minute. This packet builds the queue with pressure as a fixture input: tickets, classes as data read at start, a pure admission function over a snapshot (available memory, recent admissions, class limits, turn), round-robin across lanes with the three-skip reserve rule, the holding rule named in queue.status, per-lane visibility, and registration of each admitted job with the 2081-v7qx watch registry. The queue.* row in host_tools.rs GROUPS and the descriptions are as written in design section 6. Rust in the tray beside the watchdog module; no shell."
    exit_criteria:
      - "Three lanes each submit a build job within one second against a fixture snapshot with room for one: exactly one is running, and the other two are admitted one at a time as each predecessor exits. Pre-fix result: FAILS, the lane socket's tools/list carries no queue tool and all three would start at once."
      - "Lane A submits 10 jobs and lane B then submits 1: lane B's job is admitted no later than second. A control arm with round-robin disabled through the fixture seam admits it eleventh. Pre-fix result: FAILS, no queue exists."
      - "A heavy job skipped 3 times blocks further light admissions until it has been admitted; queue.status for a blocked light job reports reserved-behind. Pre-fix result: FAILS, no queue exists."
      - "Lane B asking queue.status for lane A's ticket is answered as for an unknown id, and lane B's own status behind two of lane A's jobs reports position 3 and contains no string from lane A's submissions. Pre-fix result: FAILS, no ticket exists."
      - "Over 30 minutes of fixture time with nothing queued or running, the queue records zero admission evaluations. Pre-fix result: FAILS, no counter exists."
      - "A submission whose command is one string, whose class is unknown, or that is the lane's 17th queued job is refused, each with its own named reason, and no ticket is created. Pre-fix result: FAILS, all three are refused alike as an unknown tool."
    verifiable_closure: "The job_queue module's fixture transcript with all six arms. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the job_queue module and its tests land with the feature; the claimer writes the test names here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: wait for the operator's rulings on 2094-65yz and for 2081-v7qx's watch registry, then build the tickets, the admission function, the fairness rule and the four tools with pressure as a fixture input."
    provenance: "Design filed 2026-11-17 from operator direction; openspec/changes/job-admission-and-host-watch."
