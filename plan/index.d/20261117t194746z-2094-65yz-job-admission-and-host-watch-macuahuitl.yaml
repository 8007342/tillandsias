    implementer_tier: sonnet
    title: "Hardware tier: desktop with an Intel NPU and a discrete GPU - the judge placement table exists as data keyed by capability, its CPU row is measured beside a running build, and its memory ceiling is enforced"
    context: "Hardware capability: an x86 desktop with more than 24 GiB of memory, an Intel NPU bound to intel_vpu, a discrete CUDA GPU and no integrated GPU (the fleet's example is the Core Ultra 7 265KF host, 62 GiB). Measured there 2026-11-17 through the host's Ollama, one sample each: Qwen2.5-0.5B decodes 42.9 tokens/s on CPU and is resident at 936 MB under the default 32,768-token context; a 7B model decodes 5.3 tokens/s at 6.9 GB. The NPU opens without root (npu-umd-test Device tests 6 of 6) and has no graph compiler; that row is 2081-4cpi's and is only wired here. This packet creates the placement table under images/inference/tiers as data keyed by what accel_probe.rs reports, the memory-ceiling rule by host memory, the explicit 4,096-token context, and the refusal to load unless the pressure level is calm."
    exit_criteria:
      - "The placement table is a data file with one row per capability and a CPU row last; a host whose probe reports an NPU as engine-missing is given the next row with that reason, and watch.status names the row that decided a verdict. Pre-fix result: FAILS, no table exists and placement is not reported per row."
      - "On a host of this tier, with a 20-thread compile running, the judge on the CPU row (4 threads, lowest priority, 4,096-token context) records its decode rate, its time to a schema-bound verdict and its resident size for each judge tier; the resident size is under the tier's ceiling, and the compile's wall time with and without ten verdicts differs by under 5 percent. Pre-fix result: FAILS, no such measurement exists; the 2026-11-17 samples used the default context and no concurrent build."
      - "A tier resident above the host's ceiling is refused by name, and an ambiguous episode at pressure level tight starts no judge and escalates. Pre-fix result: FAILS, no ceiling and no pressure check exist."
    verifiable_closure: "The placement fixture transcript for the first and third arms and the measurement record for the second, filed under plan/issues with the kernel, runtime and model revisions. Pre-fix result: FAILS."
    unscoreable: "research-measurement: the second arm is a measurement on real hardware of this tier; its numbers are recorded, not asserted against a threshold other than the two stated."
    next_action: "Nothing is built. Left: wait for 2081-bgh8's judge lane and 2081-ngd8's tier choice, then write the table, the ceiling rule and the measurement. Do not attempt the NPU row here; read 2081-4cpi's result."
