  title: vault-client tests take 68-85 s each because reqwest's default builder looks up the macOS system proxy
  context: 'Measured on tlatoanis-macbook-air 2026-10-29: every tillandsias-vault-client test took 68-85 s in the parallel darwin suite, including a pure URL-join unit test. A probe test found that reqwest Client::builder().build() takes 3.0 s per process at normal priority and 16.5 s under taskpolicy -b, while .no_proxy().build() takes under 3 ms. Only the first build in a process pays it, and nextest runs each test in its own process. The cost is the macOS system-proxy lookup; scutil --proxy itself returns in 8 ms with no proxies configured. Side measurement: the shipped macOS tray uses reqwest via tillandsias-vm-layer (fetch.rs, vz.rs) on the image-download path, so it likely pays about 3 s once per process there. That path is not the menu, and it was not changed. The tray does not link sysinfo, so 1924-smpl does not affect it (cargo tree; no sysinfo strings in the shipped binary).'
  exit_criteria:
  - 'Every http_roundtrip test passes in under 2 s on darwin, enforced by a Timed 2 s bound, and test_budget_fails_a_slow_test proves the bound fires.'
