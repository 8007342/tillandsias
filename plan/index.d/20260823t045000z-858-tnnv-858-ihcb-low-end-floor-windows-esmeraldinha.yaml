      ts: "2026-08-23T04:50:01Z"
      agent_id: windows-esmeraldinha-opus5-20260823T042116Z
      host: windows
      summary: >
        The Windows cousin is measured and filed as 858-tnnv; this packet is
        NOT claimed and stays with the Silverblue host, per the coordinator.

        THE ONE NUMBER THE SILVERBLUE ROW SHOULD COMPARE ITSELF AGAINST, and
        it is not a throughput figure: on this host the expert layer's
        sub-queries are STRICTLY SERIAL. OLLAMA_NUM_PARALLEL=1, four cores, a
        single memory channel — fanning out does not overlap, it time-slices
        the same ~21.3 GB/s. At ~2.3 s per unfold-and-verify sub-query
        (1.9 s generate + 0.44 s to embed the query), the budget is:
        10 s answer -> ~4 sub-queries, 30 s -> ~13, 60 s -> ~26.

        That makes 853-6gz3's floor N x 2.3 s in the fan-out width N, which is
        a qualitative difference from macuahuitl rather than a slower version
        of it: a design where fan-out is nearly free does not degrade
        gracefully here, it degrades linearly. Worth checking whether the
        Silverblue cousin's runtime serialises the same way — if it does, that
        is a property of the tier and not of WSL2.

  - packet_id: accel-probe-blind-to-wsl2-paravirtualised-gpu
    event:
      type: note
      ts: "2026-08-23T04:50:02Z"
      agent_id: windows-esmeraldinha-opus5-20260823T042116Z
      host: windows
      summary: >
        Evidence, not a new packet — this one already names the defect.

        esmeraldinha published two capability rows this cycle and BOTH carry
        gpu present-unusable / wsl2-no-dri-render-node. Structurally that is
        correct for the distro's current provisioning state: /dev/dri absent,
        /dev/accel* absent, the guest PCI bus carrying only virtio and one
        Microsoft 0x1414:0x008e class-0x030200 function, and ollama's own
        discovery finding `inference compute id=cpu library=cpu` and nothing
        else even with OLLAMA_VULKAN already true in its environment.

        But this host MEASURED on 2026-08-17 that the same Intel UHD is
        reachable from inside WSL2 through /dev/dxg via Mesa dzn — ollama
        bound it at 100% offload and delivered 190.6 tok/s prefill, 2.16x the
        CPU lane. yolanda measured the same path on AMD the day before. So the
        reason string is a PROVISIONING statement wearing the costume of a
        HARDWARE statement, and the matrix now publishes it twice for a
        machine that has already used the device it calls unusable.

        Per 806-2r4s this is "ship a lane", not "buy hardware", and yolanda's
        universality write-up said so carefully as "could in principle". It is
        stronger than in principle — measured on both vendors the fleet owns
        (793-zumy AMD, this host Intel), enablement reduced to three Fedora
        packages under 793-a8e7. A scheduler reading present-unusable will not
        ship the lane, so the vocabulary is doing the wrong work here.

  - packet_id: dual-locus-preflight-must-rebuild-every-gate-locus
    event:
      type: note
      ts: "2026-08-23T04:50:03Z"
      agent_id: windows-esmeraldinha-opus5-20260823T042116Z
      host: windows
      summary: >
        Independent second-host confirmation, and it sharpens the hazard.

        esmeraldinha's WSL locus binary was mtime 2026-08-17 05:20:45 -0700,
        1,647,416 bytes — six days behind HEAD and predating 07cfec83e
        ("compact must not mutate on --help", 2026-08-22 07:52:42). The same
        destroyer. Rebuilt in the gate's own locus and re-verified through the
        sanctioned probe: same resolved path, mtime 2026-08-22 21:24:31,
        1,945,456 bytes, 41 capabilities.

        THE SHARPENING: this checkout was a FRESH CLONE, 40 minutes old
        (reflog bottoms out at `clone:` 2026-08-22 20:40:32), and ./target/
        did not exist at all, so resolve_plan_binary in the Git-Bash locus
        returned nothing. Every freshness signal available inside the checkout
        was maximally reassuring — clone minutes old, clean status, no build
        directory, HEAD at origin/linux-next — and all four were irrelevant,
        because the locus the gate resolves lives inside the WSL distro's
        filesystem, OUTSIDE the checkout. Re-cloning does not touch it;
        neither does deleting target/ or git clean -xdf.

        Consequence for exit criterion (1): the two loci here disagreed not on
        vintage but on EXISTENCE, so a preflight verdict that merely names
        which locus it rebuilt would have reported the native lane truthfully
        and left the only locus that matters stale. And the vintage handshake
        should be anchored to the checkout (built from a tree containing
        `git rev-parse HEAD`), not to the clock — an mtime check passes a
        binary rebuilt five minutes ago from a stale worktree.

        Related, same family, found in the same minutes: .git/hooks/ on this
        fresh clone held only *.sample and core.hooksPath was unset at every
        scope, so pre-push-linux-next-merged.sh was installed nowhere and
        enforcing nothing until scripts/install-hooks.sh was run. Hook
        enforcement is a post-first-build property, not a post-clone property.

  - packet_id: joining-host-must-publish-a-capability-row
    event:
      type: note
      ts: "2026-08-23T04:50:04Z"
      agent_id: windows-esmeraldinha-opus5-20260823T042116Z
      host: windows
      summary: >
        esmeraldinha, the last silent Windows host, published both loci this
        cycle through the self-serve path: capability-matrix moved from
        "5 row(s), 4 of 7 known host(s) reporting" to "7 row(s), 5 of 7",
        SILENT down to forge and tlatoanis-macbook-air.

        The in-guest row is the first WSL2 row in the matrix that is actually
        SCHEDULABLE (cpu/container/ollama + cpu/host-native/ollama), and that
        is entirely a probe-context effect rather than a hardware one: it was
        deliberately taken in the RUNTIME `tillandsias` distro, which carries
        ollama 0.32.14 and podman, where yolanda's sibling row was taken in
        tillandsias-build, which carries neither. This demonstrates the
        distro-dependency caveat yolanda predicted, with a concrete divergence
        rather than a hypothetical.

        Recommendation for the row-on-join design: make the product's
        `tillandsias` distro the canonical in-guest locus, or add the distro
        to the host+locus fold key. A second, practical constraint for
        whoever implements that: the runtime distro sets
        [automount] enabled = false in /etc/wsl.conf, so the checkout is NOT
        visible at /mnt/c there and no in-tree script can run in place — the
        probe binary and scripts had to be copied in via \\wsl.localhost. A
        self-serve path that assumes the checkout is reachable will fail in
        exactly the distro this recommendation makes canonical.
