  - order: 858-ihcb
    packet_id: bench-inference-floor-publishes-a-cached-prefill
    desired_release: v0.5
    title: "every prefill_tok_s the benchmark harness has ever emitted was measured against a warm prompt cache, and the projection line multiplies two superseded constants"
    status: ready
    kind: bug
    pickup_role: any
    priority: p2
    capability_tags: [inference, benchmark, measurement, fleet]
    deliverable: scripts/bench-inference-floor.sh
    depends_on: []
    estimated_hours: 2
    context: >
      D1. scripts/bench-inference-floor.sh bench_model() runs a warm-up with
      the IDENTICAL prompt, then measures with the same prompt. The warm-up's
      output is discarded, as its comment says, but the KV cache it fills is
      not — so prompt_eval_duration on the measured run covers a cache hit and
      prefill_tok_s is inflated by an unknown factor.

      Measured on esmeraldinha 2026-08-23, qwen2.5:0.5b, one server, one
      model: identical prompt repeated gives 934.4 / 1008.4 tok/s
      (prompt_eval_ms 87 / 81 for 82 prompt tokens); the harness itself
      reported 1334.59 tok/s this cycle. The same model, lane and machine
      under full 793-zumy controls on 2026-08-17 measured 88.3 tok/s.

      A second, instructive wrong answer is recorded with it: appending a
      UNIQUE SUFFIX to a shared prompt does not defeat the cache either, since
      the long common PREFIX is still reusable and only the novel tail is
      evaluated (365.8 / 474.3 / 394.1 tok/s). The control that works is a
      prompt that is unique EARLY, which is exactly what 793-zumy's method
      already specified and what this harness did not adopt.

      Scope: decode is UNAFFECTED (four measurements across two harnesses and
      six days agree inside 3%), and so is the embed: line. Only prefill_tok_s
      is wrong — but it is wrong on every host that has ever run this harness,
      and those numbers are not comparable to the 793-zumy-method figures
      already in the ledger. Engine-lane decisions in
      images/inference/engine-tuning.sh are the consumer this matters to.

      D2, same file. The `project:` line multiplies CORPUS_CHUNKS (defaults to
      1592, the estimate the 2026-08-17 measurement replaced with a measured
      9,909) by the per-chunk cost of a 2000-char chunk, when the real corpus
      p50 is ~236 chars. This cycle it emitted full_rebuild_s=3918.5 (65 min)
      against a true ~72 min. It is close BY CANCELLATION — the chunk count is
      6.2x too low and the per-chunk cost is 5.6x too high — so it will stop
      being close the moment either input is corrected on its own.
    exit_criteria: >
      (1) bench_model generates a unique prompt per repetition with the unique
      token FIRST, isolates prefill with num_predict=1, and discards the first
      post-load repetition (the cold-dispatch trap 793-zumy documented pulls
      the opposite way, so both controls are needed together).
      (2) A hermetic fixture that fails if a reused prompt can reach the
      measured run — the defect must not be able to return silently.
      (3) The project: line derives both the chunk count and the chunk size
      from the real chunker rather than from constants, or stops emitting a
      projection at all.
      (4) Prefill figures already published by this harness are marked
      superseded wherever the ledger cites them as engine-lane evidence.

