packets:
  - packet_id: start-of-cycle-should-surface-sibling-overlap-without-being-asked
    order: 903-8wsa
    status: ready
    desired_release: v0.6
    priority: p2
    kind: enhancement
    release_target: fail-loud-diagnosis-milestone
    title: |
      the sibling heads-up protocol depends on an attentive agent noticing an overlap, which this codebase has twice proven does not happen — the overlap should be computed and printed
    deliverable: |
      a Start Of Cycle check that names the sibling whose live claim touches
      this batch's surface, so the heads-up is prompted rather than remembered
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - multi-host
      - meta-orchestration
      - fail-loud
    estimated_hours: 5
    context: |
      Operator direction 2026-08-26 established the sibling heads-up protocol
      (methodology `sibling_heads_up_protocol`, meta-orchestration Start Of
      Cycle 2a): message a sibling BEFORE changing a surface their lane depends
      on. The direction is right and the worked example is measured — macbook's
      731-eupn change was green on both branches and E0063 in the union,
      costing a red gate and ~30 minutes for a change whose author knew
      everything needed to prevent it.

      THIS PACKET EXISTS BECAUSE THE PROTOCOL AS WRITTEN IS PROSE, AND THIS
      CODEBASE HAS A MEASURED RECORD OF WHAT PROSE ACHIEVES:

        - The meta-orchestration skill documents the `| tee $LOG | head -N`
          SIGPIPE trap with a dated incident. A host READ THAT SECTION and
          walked into the trap hours later the same night (899-6pwv).
        - The same skill mandates TILLANDSIAS_SKIP_VERSION_BUMP=1 on every gate
          invocation. The release runbook does not set it, and nobody noticed
          until VERSION moved during a release cut (897-5m9y).

      The skill states the principle itself: "a guard only an attentive agent
      honors is a suggestion, not a constraint". The heads-up protocol is
      currently a suggestion.

      WHAT IS ALREADY AVAILABLE, so this is assembly rather than invention:
        - `tillandsias-plan expire-claims --list-live` names live claims and
          their holding host.
        - `scripts/select-work-batch.sh` already prints the batch this cycle
          intends to take.
        - `ListAgents` names which hosts are reachable right now.
      The missing piece is the JOIN: which live claim's surface intersects my
      batch's surface, and is its host reachable.
    outcome: |
      A cycle is told who to talk to, instead of being asked to remember that
      talking is possible.
    exit_criteria:
      - 'Start Of Cycle prints either `ok:no-sibling-overlap` or one line per overlap naming the sibling host, the claimed order, and the shared surface. Silence on the healthy path — a signal that fires every cycle is one nobody reads.'
      - 'DEFINE "SURFACE" FALSIFIABLY, and start narrow. Files touched by the claimed packet vs files this batch expects to touch is a defensible v1; shared TYPES across lanes would be better and is harder. Whatever is chosen must be stated, because an overlap rule nobody can predict produces noise and gets ignored, which is worse than no rule.'
      - 'NEGATIVE CONTROL: two hosts working on genuinely unrelated packets produce NO overlap line. Measure the false-positive rate on real recent cycles before wiring it anywhere; a check that cries overlap every cycle will be muted within a week.'
      - 'ADVISORY, NEVER A GATE. A missed heads-up must not block a cycle. The failure it prevents is a red union gate, which is recoverable; blocking cycles on a coordination heuristic is not.'
      - 'The check does NOT auto-send messages. It names who to talk to; a human-authored sentence is the point, and an auto-generated broadcast is exactly the channel-nobody-reads failure the protocol warns about.'
    verifiable_closure: |
      Replayed against the 2026-08-26 cycle where macbook held the 731-eupn
      surface and the coordinator merged it blind, the check names macbook and
      the control-wire surface; replayed against a cycle with genuinely
      disjoint work, it prints `ok:no-sibling-overlap`.
    notes: |
      DO NOT build this as a chat bot or a broadcast. The value is the JOIN and
      the prompt; the message stays human-authored and short.

      Related: 901-jtvi (step composition) and 902-5bf9 (the Rust+Lua litmus
      form) are the other two v0.6 packets from the same operator session.
    events:
      - type: filed
        ts: "2026-08-26T05:10:00Z"
        agent_id: linux-macuahuitl-claude-20260826t050548z
        host: macuahuitl
        summary: |
          Filed alongside the methodology section it hardens, because that
          section's own honest caveat says a prose-only protocol will be
          honoured inconsistently and that the mechanical check is worth filing
          rather than assuming.
