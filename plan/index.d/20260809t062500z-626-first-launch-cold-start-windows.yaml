packets:
  - packet_id: tray-sign-in-state-unknown-until-observed
    order: 626-r7kq
    status: needs_clarification
    desired_release: v0.5
    role: host-shell
    priority: p1
    kind: bug
    title: |
      The tray offers an actionable "GitHub Login" while its own automatic sign-in check is still in flight, so users sign in again when they are already signed in.
    deliverable: plan/issues/windows-first-launch-cold-start-findings-2026-08-09.md
    depends_on: []
    pickup_role: any
    owner_host: any
    capability_tags:
      - host-shell
      - tray-ux
      - windows
      - macos
      - lifecycle
    estimated_hours: 3
    blocked_on: operator UX approval (spec:tray-ux UX curation governance)
    problem: |
      VERIFIED at crates/tillandsias-host-shell/src/menu_state.rs:258-267 — `GithubLoginState` has exactly three variants (LoggedOut, LoggingIn, LoggedIn) and NO variant for "not observed yet". VERIFIED at :332 — `MenuState::initial()` starts at `LoggedOut`. VERIFIED at :458-466 — `LoggedOut` + `login_runtime_ready` renders the ENABLED `GitHub Login` leaf.

      `login_runtime_ready` flips true on the first VmStatus observation (one wire round-trip, milliseconds after Ready). The real sign-in state arrives from `refresh_github_login`, whose guest handler runs `probe_github_username` — a CONTAINER run (remote_projects.rs:384, vault read + `gh auth login` + `gh api user`) taking seconds to minutes. Nothing couples the two, so for that entire interval the menu shows an actionable sign-in button that is indistinguishable from a genuine signed-out state.

      The automatic path itself is NOT broken — `run_vm_status_push_listener` subscribes and then runs an initial sync precisely because pushes are change-gated. The defect is purely that the unobserved state renders as a known one.

      FIELD PROOF (tray.log, 2026-08-09): Ready at 06:10:33.736, subscription at 06:10:34.018, operator clicks `github-login` at 06:10:51.790 — the click was ACCEPTED, so the row was enabled, not the disabled "Setting up…" variant. At 06:12:26.889 the operator clicks a PROJECT leaf, which `build()` emits only under `LoggedIn` — proving the stored credential was valid all along. The same pattern recurs in every session in the log (2026-07-24, 2026-07-28 x2).
    why_it_matters: |
      The user is invited into a multi-minute interactive sign-in they do not need, for an account they are already signed into. It happens on EVERY cold start, and it is the first thing a new user sees.

      This state was specified and lost in implementation: the ratified Observable Streams Contract (plan/issues/observable-streams-contract-2026-06-30.md, boundary B1) writes `watch::channel(LoginState::Unknown)` as the required design. Orders 154/230/231/260 landed the streams; `Unknown` never reached `MenuState`.
    proposed_ux_change: |
      RECOMMENDED (introduces NO new user-visible string): add a fourth
      `GithubLoginState::Unknown` used as the initial state, and render it with
      the ALREADY-APPROVED disabled row the menu uses today when the runtime is
      not ready:

          📋 Setting up…        (disabled)

      Effect: the row stays "Setting up…" from launch until the first CONFIRMED
      sign-in observation, then becomes either the project body (signed in) or
      the actionable 🔑 GitHub Login leaf (genuinely signed out). Item ids,
      ordering, and label text are all unchanged — only the condition under
      which an already-approved label applies.

      ALTERNATIVE (needs approval of new text): a distinct row such as
      "🔄 Checking your account…" so the two waits are distinguishable.

      OPERATOR: approving the RECOMMENDED option requires no new UX vocabulary
      and is the smaller change.
    exit_criteria:
      - |
          A sign-in state that has never been observed is NEVER rendered as an actionable sign-in leaf; unit test on `build()` covering the unobserved state.
      - |
          The first confirmed observation resolves the row in both directions (signed in -> project body, signed out -> actionable leaf), with the LoggingIn transitional path unchanged.
      - |
          Shared-layer fix in host-shell `menu_state.rs`, so the Windows and macOS trays inherit it identically; the Linux native tray's own menu builder is read and either shares the fix or is recorded as out of scope with a reason.
      - |
          Verified in a field tray.log using the order-626-r7kq INFO lines: the interval between "Ready" and "github sign-in state resolved" exists and the menu never offered a sign-in inside it.
    notes: |
      BLOCKED ON OPERATOR APPROVAL, not on engineering. spec:tray-ux "UX curation governance" forbids altering the enable/disable state of a menu row without recorded approval on the packet. Implementation is small once approved.
    events:
      - type: filed
        ts: "2026-08-09T06:25:00Z"
        agent_id: windows-claude-fable-20260809t062500z
        host: windows
        summary: |
          Filed from an operator field run of the published v0.4.260809.2 release. Operator's initial hypothesis was that the tray never attempts an automatic sign-in; investigation showed the opposite — the automatic path is present and correct, and the defect is that the not-yet-known state renders as "signed out" with an actionable button. Root cause traced to a missing enum variant that the ratified Observable Streams Contract had already specified as `LoginState::Unknown`.

  - packet_id: first-run-long-work-is-silent-across-surfaces
    order: 626-w3fn
    status: needs_clarification
    desired_release: v0.5
    role: runtime
    priority: p1
    kind: bug
    title: |
      Multi-minute first-run work (sign-in preflight, enclave bring-up) reports nothing to the user; only image builds announce themselves.
    deliverable: plan/issues/windows-first-launch-cold-start-findings-2026-08-09.md
    depends_on: []
    pickup_role: linux
    owner_host: any
    capability_tags:
      - headless
      - podman
      - tray-ux
      - lifecycle
      - cross-platform
    estimated_hours: 5
    blocked_on: operator UX approval (spec:tray-ux UX curation governance)
    problem: |
      Two surfaces, one defect.

      (a) SIGN-IN PREFLIGHT. VERIFIED: `run_provider_login` in crates/tillandsias-headless/src/main.rs has exactly ONE unconditional println! — the terminal "authentication complete" line. The pinned test `github_login_prompts_after_infrastructure_preflight` guarantees that image ensure, `ensure_git_login` (EnclaveNetwork -> EgressNetwork -> CaBundle -> Vault -> Proxy), two health gates and a helper container start ALL happen before the first prompt. All of it is silent or debug-gated.
      FIELD PROOF: /root/.cache/tillandsias/github-login-last.log in the guest is ZERO BYTES, mtime Aug 8 23:10 local == 06:10Z, the operator's click. The 620-9xpg wrapper tees all output there, so an empty file proves no output was produced in the ~95s before the operator gave up and closed the window.

      (b) CONTAINER BRING-UP. VERIFIED at crates/tillandsias-podman/src/client.rs:1849 — `emit_launch_event` returns early unless `debug_enabled`, so the already-well-shaped starting/running/failed events from `run_container_observed` are invisible by default. The whole `run_opencode_mode` chain (cleanup, router ensure, proxy, vault ensure, AppRole mint, git, inference, attached forge) is `if debug` or silent.

      The ONE thing that does announce itself is a missing IMAGE build (order 332): "building missing image X; this may take several minutes". Operator's run emitted four such lines — the guest had just been reconciled to v0.4.260809.2 and `versioned_image_tag` embeds the version, so every image rebuilt. That announcement is exactly right; nothing else has an equivalent.
    why_it_matters: |
      The user experience of a version bump is: four "this may take several minutes" lines, then several silent minutes, then either an agent or a stack trace. A blank window is indistinguishable from a hang, and the operator did in fact close one, concluding the flow was stuck.
    proposed_ux_change: |
      NEEDS OPERATOR APPROVAL — both surfaces are end-user-facing terminal
      output. Proposed shape, deliberately free of internals vocabulary
      (no VM/enclave/container/vault/podman/proxy per spec:tray-ux):

        (a) before the sign-in preflight:
            [tillandsias] Getting things ready — this can take a few minutes
                          the first time. No action needed yet.

        (b) during bring-up, one line per stage:
            [tillandsias] Getting your workspace ready… (2 of 5)

      Alternative for (b): promote the EXISTING `emit_launch_event` lines to the
      default path instead of adding new text — cheapest to build, but that text
      was written as diagnostics and reads as internals, so it likely fails the
      end-user vocabulary rule as-is.
    exit_criteria:
      - |
          A user starting a sign-in sees output within ~5s of launch, before any silent preflight begins.
      - |
          Enclave bring-up reports progress at a cadence no coarser than one line per stage, on the DEFAULT path with no --debug.
      - |
          No internals vocabulary in any of the added text (spec:tray-ux); pinned by a test over the emitted strings.
      - |
          Cross-platform: the same lines appear on Windows, macOS and Linux launches, since all three run the same headless lane.
    notes: |
      Order 270 (macos-attach-first-use-materialization-blackout, status ready) already owns "materialization emits a progress signal the tray can render" for the IMAGE-BUILD half. This packet is the same defect one layer out — container lifecycle and the sign-in preflight — and cross-platform. Whoever claims either should read both; they may merge.
    events:
      - type: filed
        ts: "2026-08-09T06:25:00Z"
        agent_id: windows-claude-fable-20260809t062500z
        host: windows
        summary: |
          Filed from the same v0.4.260809.2 field run. The operator named this one directly: "we have to make sure long running tasks are well documented for users". Zero-byte github-login-last.log is the hard evidence for the sign-in half; the debug-gated emit_launch_event is the code evidence for the bring-up half.

  - packet_id: opencode-harness-gate-blind-to-tui-runtime
    order: 626-p4xd
    status: ready
    desired_release: v0.5
    role: forge
    priority: p1
    kind: bug
    title: |
      Every opencode harness health gate is blind to the native TUI library load, so a binary that cannot start records itself as last-good.
    deliverable: plan/issues/windows-first-launch-cold-start-findings-2026-08-09.md
    depends_on: []
    pickup_role: linux
    owner_host: linux
    capability_tags:
      - forge
      - harness
      - opencode
      - supply-chain
      - cold-cache
    estimated_hours: 4
    problem: |
      FIELD FAILURE (operator, v0.4.260809.2 first launch): the forge started and opencode died with
        Failed to initialize OpenTUI render library: Failed to open library
        "/$bunfs/root/libopentui-h3hyjpa5.so": ... cannot open shared object file
      then `[OpenCode] forge session exited: ... exited with status 1`. `/$bunfs/` is the virtual filesystem inside a bun single-file executable — opencode failing to materialize its own embedded native render library. The operator RELAUNCHED AND IT WORKED, so this is a cold-cache first-run race, not a broken upstream release.

      The structural defect does not depend on pinning the race. VERIFIED at images/default/lib-common.sh:1803 — `harness_probe` is `-x` + `timeout 30 "$bin" --version` + `harness_contract_ok` (flag greps) + `opencode_auth_contract_ok`. VERIFIED at :2164 — `curl_install_opencode` -> `opencode_validate_or_rollback` uses that same probe set. NONE of these load OpenTUI; that happens only when a real TUI starts. VERIFIED at images/default/entrypoint-forge-opencode.sh:72 — the entrypoint guard is a bare `[ -x "$OC_BIN" ]`.

      Consequence 1: a binary that cannot start a TUI passes every gate and reaches the user as a raw upstream stack trace.
      Consequence 2 (worse): `opencode_record_curl_last_good` (:2175) records that same binary as LAST-GOOD, so the order-284 rollback path can roll back TO a TUI-broken snapshot. The safety net inherits the blind spot.
    why_it_matters: |
      Order 284 built a last-good rollback specifically so a bad harness cannot take the lane down, and order 439 extended probing from liveness to flag contracts for exactly this reason ("a harness that starts but no longer accepts a flag we pass is broken FOR US"). The same argument applies to a harness that starts but cannot render: it is broken for us, and today it is not only undetected but actively recorded as good.
    hypothesis: |
      NOT REPRODUCED — state as hypothesis until verified. The foreground `require_opencode` -> `curl_install_opencode` writes $HARNESS_CURL_ROOT/opencode/bin/opencode while the backgrounded `ensure_forge_harnesses` (entrypoint-forge-opencode.sh:56) touches the same tree. A bun SFA reads its OWN executable file to extract embedded assets, so a binary replaced underneath a starting process yields exactly this error. lib-common.sh:2044-2050 already documents this hazard class for the npm channel and guards it with the npm-update lock; the curl channel from order 459 has no equivalent guard.
    exit_criteria:
      - |
          The opencode health gate exercises the native TUI library load, not just --version and flag greps. A binary that cannot initialize its renderer FAILS the probe.
      - |
          A binary that fails that gate is never recorded as last-good, and the rollback path is verified to select a genuinely TUI-capable snapshot.
      - |
          The race is reproduced before it is fixed: wipe the harness cache volume, launch opencode cold, capture /tmp/forge-lifecycle.log alongside the failure. If the hypothesis is wrong, record what the log actually shows and re-scope.
      - |
          If the curl channel does need a serialization guard, it shares the npm channel's lock discipline rather than growing a second, divergent one.
      - |
          Litmus pins the gate with a fixture binary that passes --version but fails to load its renderer.
    notes: |
      Sibling of order 284 (broken upstream publish) and order 291 (fatal require on empty cache). Both were fixed for the failure modes then visible; this is a third mode neither covers, because both reasoned about the binary being ABSENT or CRASHING, never about it being present, startable, and unable to render.
    events:
      - type: filed
        ts: "2026-08-09T06:25:00Z"
        agent_id: windows-claude-fable-20260809t062500z
        host: windows
        summary: |
          Filed from the v0.4.260809.2 field run. Operator confirmed a second launch succeeded, which is what establishes this as a cold-cache race rather than an upstream breakage — and is also why it has never been caught: every warm-path test runs against an already-extracted binary.

