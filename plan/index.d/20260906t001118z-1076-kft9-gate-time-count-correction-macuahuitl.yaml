        THE GATE-DISPOSITION QUESTION DISSOLVES RATHER THAN DECIDING THE
        VOCABULARY. I asked what ./build.sh --check should do with
        `clean-at-idle`, since punishing it reverts everyone to standalone
        sweeping and passing it makes the state pointless. It cannot arise:
        in-gate the check measures under gate conditions by construction, so
        the gate only ever produces `clean`, `sigpipe-decided` or `unmeasured`.
        `clean-at-idle` is a PROVENANCE LABEL on a verdict produced by a
        standalone sweep, advisory by nature. Two states in the gate, three in
        the vocabulary, and the third is not a verdict but a statement about
        which machine produced it — so a hand sweep on a quiet box cannot
        manufacture a gate-strength safety claim, and nobody is penalised for
        measuring honestly.
