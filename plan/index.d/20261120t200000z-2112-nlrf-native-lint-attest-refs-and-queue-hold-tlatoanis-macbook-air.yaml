- packet_id: native-lint-attestations-are-refs-keyed-to-the-crate-subtree-and-a-merged-combination-holds-instead-of-evicting
  order: 2112-nlrf
  status: in_progress
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: macos
  capability_tags: [land-queue, native-lint, macos, ci-release]
  size: M
  implementer_tier: sonnet
  estimated_hours: 4
  title: 'Native-lint attestations are refs (refs/attest/native-lint/<crate-subtree-sha>) written by darwin preflight, and the queue HOLDS a PR whose merged crate content is unlinted instead of evicting it'
  context: >-
    MEASURED 2026-11-20 in a scratch repo with the real scripts. When the base did not touch the crate (the P5 exit as first written), the check already passed: the trailer stays in base..HEAD with the same subtree. The case that costs round trips is when the base DID change the crate: refused:native-lint:stale, and the PR is evicted for another PR's change. Coordinator ruling (b)+(c): an unlinted combination must not land, but the PR is HELD, not evicted.
    Built in this ref:
    - attest-native-lint.sh --ref [--push] [--at <commit>] writes refs/attest/native-lint/<tree>. The ref points at a parentless commit whose tree IS the linted subtree, so it verifies itself. It adds no branch commit, and --at lints another commit's content in this single checkout and switches back.
    - check-native-lint-attested.sh accepts a valid ref. A forged ref, whose tree is not its name, does not count. --hold answers hold:native-lint:<pkg>:<merged-subtree> (rc 3) when the candidate's own subtree was attested but the merged one was not. An author's own unattested edit still refuses.
    - darwin ./build.sh --preflight writes and pushes the ref when the tree changes the crate. A clippy failure refuses the preflight.
    Queue side, owned by yoga: land-queue.sh calls the check with --hold, labels the PR needs:native-lint with the merged subtree sha, keeps it queued, and fetches +refs/attest/*:refs/attest/*.
  exit_criteria:
  - 'scripts/lua/test-native-lint-hold.lua gives 7/7. Against the pre-change scripts, arm 3 (CASE 2 holds with the merged subtree, rc 3) FAILS with rc=1 refused:native-lint:stale.'
  - 'After attest --ref --at <merge>, the SAME candidate passes with no new commit on the branch (arms 4-5).'
  - 'The existing scripts/test-native-lint-attested.sh still gives 10/10. Both existing callers pass only --base, so they are unchanged.'
  - 'Queue (yoga): a CASE 2 candidate yields one hold plus a label and zero evictions, and passes once the ref exists.'
  verifiable_closure: 'test-native-lint-hold.lua and test-native-lint-attested.sh on darwin, then a real attest --ref --push of a macos-tray subtree.'
  unscoreable: 'none.'
  next_action: 'yoga wires --hold, the label and the refs/attest fetch in land-queue.sh. The darwin host services needs:native-lint labels with attest-native-lint.sh --ref --push --at <merge>.'
  provenance: 'tlatoanis-macbook-air 2026-11-20. Proposal adopted by the coordinator (macuahuitl-fedora) as P5; ruling (b)+(c) after the measurement.'
