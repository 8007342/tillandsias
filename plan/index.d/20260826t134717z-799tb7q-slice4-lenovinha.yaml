        could never go red — the same class as the `secret-service` word-absence
        test and the `lib/tool-dispatch.sh` string match earlier today. Rewritten
        to pass the needle as an awk variable; the mutation now fires
        (`test-bench-prompt-uniqueness.sh:80`) and the clean tree is silent.

        THE RULE I WOULD GIVE THE NEXT CONVERTER, now paid for twice in one
        slice: run the converted scripts, do not trust `bash -n`. Syntax was
        valid in both broken cases. And when one fails, stash-and-compare before
        recording anything — `generate-dashboard.sh` last slice looked broken and
        was not; these two looked fine and were.

        All 15 verified: the self-verifying fixtures re-run green
