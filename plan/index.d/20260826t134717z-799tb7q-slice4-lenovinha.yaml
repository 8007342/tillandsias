      summary: |
        FOURTH SLICE — 15 more flat callers converted, and A TRAP FOUND THAT
        BREAKS A MECHANICAL SWEEP.

        Converted: build-image.sh, check-base-ledger-status-loss.sh,
        check-fragment-status-loss.sh, check-nix-deps-stability.sh,
        dev-inference-ensure.sh, nix-toolbox.sh, probe-complement-selfcheck.sh,
        windows-host-capability-probe.sh, and the test-* family
        (bench-prompt-uniqueness, build-sh-ci-full-install-prep,
        build-step-timing-attribution, codex-mcp-registration,
        default-vault-cli-security, opencode-vault-auth-content, trace-coverage).

        THE TRAP: `$JQ` MUST NEVER GO INSIDE A HEREDOC. A blanket
        `| jq` -> `| "$JQ"` substitution is unsafe wherever the line sits in a
        heredoc that GENERATES another script, because the variable belongs to
        the generating scope and not the generated one.

        MEASURED, and it broke two fixtures in opposite ways:
          - test-opencode-vault-auth-content.sh went PASS -> FAIL. Two
            substituted lines were inside a heredoc emitting a stub `opencode`;
            in the stub $JQ is unset, so the pipeline ran with an EMPTY command
            and the rollback assertion failed with no hint as to why. I caught it
            only because I ran the converted fixtures instead of trusting
            `bash -n`, then stashed to confirm PASS-before / FAIL-after rather
            than assuming the failure was pre-existing.
          - test-bench-prompt-uniqueness.sh had the same shape in a generated
            `curl` stub, but its heredoc is UNQUOTED, so $JQ would expand at
            GENERATION time and bake a literal
            `toolbox run --container tillandsias-builder jq` into the stub —
            breaking on exactly the jq-less host the sweep exists to serve.
            Wrong in both directions, for opposite reasons.

        Both reverted to bare `jq`, which is correct: a synthetic test double is
        not a dev-host script and legitimately assumes the host tool.
