# Ledger fragment — append-only, IMMUTABLE once written.
packets:
  - packet_id: gather-context-cost-baselines-across-the-fleet
    order: 997-pdgf
    status: ready
    kind: chore
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [metrics, observability, methodology, multi-host, measure-before-optimize]
    estimated_hours: 5
    title: |
      Collect context-growth baselines on every host so token-trimming remedies can be chosen from data, and explicitly adopt none until they are.
    context: |
      OPERATOR DIRECTIVE 2026-09-03: become token-conscious now, act later.
      Their words, and the constraint is the point: "don't implement them yet,
      let us arrive at them organically and have agents agree on when to add
      either /compact and/or /clear to methodology steps".
      LANDED WITH THIS PACKET, instrumentation only:
      agent_observability_protocol.cycle_metrics.context_cost_metrics in
      methodology/agent-observability.yaml, and
      `scripts/cycle-metrics.sh --emit-context`.
      THIS AMENDS A DOCUMENTED DECLINATION rather than filling a blank.
      cycle_metrics.honest_limits.token_and_wallclock_efficiency says token
      efficiency "belongs to the harness - not derivable in-repo". THAT STANDS.
      A token count is still not derivable here. What is derivable is a family
      of CONTEXT-GROWTH PROXIES, added under their real name.
      THE PROXIES, and every one is named as a proxy at every surface:
      transcript bytes and JSONL lines per cycle (BYTES, NOT TOKENS - the
      bytes-per-token ratio is model- and content-dependent and this project
      does not assume one); tool calls and messages per cycle; cycles per
      session before a compaction; and step REPETITION counts, because the
      expensive step is rarely the slow one, it is the one paid many times.
      FIRST DATAPOINT, this session, emitted by the new hook rather than
      asserted: transcript_bytes 10,325,437 / transcript_lines 6,009 /
      compactions 1. That is one host, one session, one workload - a starting
      point and not a baseline.
      WHAT THIS PACKET IS NOT: it does not adopt /compact, /clear, or sub-agent
      delegation. Those are recorded in the methodology as candidates so the
      option space does not have to be re-derived, and so that adopting one is a
      visible decision rather than a drift.
    unscoreable: >
      This is a MEASUREMENT CAMPAIGN, and its closure is the existence of data
      across hosts rather than a test turning green. No litmus can assert "ten
      cycles of context records exist on every active host" without becoming a
      fleet-state assertion that fails on any host that is merely offline.
      Naming a litmus that does not exist would be worse than saying so - this
      session recorded three dead references today, two of them mine. The
      emitter's own grammar IS pinnable and should get a litmus when someone
      writes one; the campaign is not.
    exit_criteria:
      - every active host emits context records for at least ten cycles, so creep is measurable rather than a single reading
      - the top three repeated steps per cycle are identified on more than one host, and the repetition count is reported alongside the duration rather than instead of it
      - a candidate remedy is proposed ONLY with the measurement that motivates it, and states what a cycle would LOSE, not only what it saves
      - the loss question is tested against a real multi-exchange investigation - what would this have discarded during 996-bcjx, where three corrections arrived across four exchanges and each depended on the prior ones
      - no remedy is adopted without fleet agreement on the step it attaches to; record the agreement or the disagreement
      - the operator's hypothesis is stated as testable or retired: that many small minimal-context agents may beat one large agent with a large context

  - packet_id: the-methodology-refusal-points-at-the-tool-that-cannot-help
    order: 997-q8jm
    status: ready
    kind: bug
    priority: p3
    desired_release: v0.5
    pickup_role: any
    capability_tags: [experts, mcp, fail-loud, discoverability]
    estimated_hours: 2
    title: |
      methodology_ask refuses with "ask it a path" — but methodology_ask only routes prose, and the tool that takes a path is methodology_path.
    context: |
      FOUND by the operator telling me to try the local expert instead of
      reading files, which is the bootstrap rule I had been skipping.
      THE EXPERT IS CORRECT AND HONEST. It refused two malformed questions,
      listed its eleven routed forms, cited freshness at the current HEAD, and
      returned confidence=unsupported with zero citations rather than guessing.
      The same query through `methodology_path` returned an EXACT match with a
      file:line citation. Nothing is broken.
      THE DEFECT IS ONE SENTENCE OF GUIDANCE. The refusal says: "This engine is
      a YAML PATH QUERY - ask it a path (e.g. `forge_cycle_budget.rule`) rather
      than prose." But `methodology_ask` routes prose through a fixed
      CANONICAL_QUESTIONS table and cannot accept a path; passing one gets the
      identical refusal. The tool that takes a path is `methodology_path`,
      which the refusal never names.
      MEASURED: I followed the guidance exactly, re-asked with a dotted path,
      and got the same refusal - then reached the answer only by switching
      tools. An agent trusting the refusal loops.
      I NEARLY FILED A MUCH LARGER AND WRONG VERSION OF THIS. Two refusals in a
      row led me to conclude the whole cycle_metrics section was unroutable and
      invisible to the expert. It is not: methodology_path resolves it exactly.
      The settling read shrank the finding for the third time in one day.
    unscoreable: >
      No existing litmus covers the methodology expert's REFUSAL TEXT, and I am
      not going to name one that does not exist. What would make this scoreable
      is a test that follows the refusal's own guidance literally - re-ask with
      the path form it suggests - and asserts an answer comes back rather than
      the identical refusal. That test is worth writing and is not this packet;
      whoever takes this should file it or write it, and then this row becomes
      scoreable rather than staying exempt.
    exit_criteria:
      - the refusal names methodology_path as the tool that accepts a path, or methodology_ask accepts one
      - the fix is verified by following the refusal's own guidance literally and reaching an answer
      - whether the eleven-entry route table should grow is decided or explicitly deferred; a fixed table is a legitimate design and its limits should be stated rather than discovered
