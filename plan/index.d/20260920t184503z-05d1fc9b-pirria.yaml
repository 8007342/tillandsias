        RULING for the case that decides the design: --preflight NEVER BUILDS. A decider
        needing a binary joins only behind resolve-or-named-skip — if the policy binary
        resolves, run it; if not, print skip:preflight:no-python:no-runnable-policy-binary
        and go on. The front door's verdict carries counts, ok:preflight:ran=<n>
        skipped=<m>, so a fresh checkout reads a green that NAMES what did not run rather
        than a refusal about itself or a green that means nothing. The checker's own
        `cargo build` stays where it is and --preflight does its own resolve: a script
        that behaves differently depending on which caller invoked it is a script nobody
        can read, and the gate's behaviour does not move in this row at all.

