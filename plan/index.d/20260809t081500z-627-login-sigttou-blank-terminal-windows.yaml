packets:
  - packet_id: login-lane-background-process-group-stop
    order: 627-sgtt
    status: implemented
    desired_release: v0.5
    priority: p0
    title: "Tray GitHub Login is STOPPED by the kernel, not slow: startup setpgid(0,0) backgrounds every forked interactive lane (peke field failure: permanently blank terminal, 0-byte log)"
    kind: fix
    deliverable: plan/issues/windows-github-login-blank-terminal-2026-08-09.md
    depends_on: []
    pickup_role: windows
    owner_host: windows
    capability_tags:
      - windows
      - wsl
      - login
      - podman
      - job-control
    estimated_hours: 5
    outcome: >
      Interactive lanes keep the launching shell's foreground process group, so
      `podman exec --interactive --tty` can raw the controlling terminal instead
      of earning SIGTTIN/SIGTTOU and being group-stopped before it writes a
      byte. The graceful-shutdown group sweep is gated on actually leading the
      group so it can never SIGTERM the operator's shell. Provider-login
      preflight reports progress unconditionally on interactive lanes.
    next_action: >
      VERSION bump is REQUIRED for this to reach any provisioned guest —
      reconcile_adopted_guest returns early on a version match, so neither the
      guest binary nor the injected wiring is redeployed at an equal stamp.
      Then rebuild the tray and re-verify both lanes on a clean guest.
    exit_criteria:
      - "tray-menu GitHub Login reaches the token prompt and authenticates (DONE on peke, real token)"
      - "no process in the login chain is in state T; pgrp == tpgid for all of them (DONE)"
      - "project-lane click opens a working agent shell (blocked on tray rebuild)"
      - "workspace tests green incl. interactive_lane_keeps_the_terminal_foreground_process_group"
    events:
      - type: filed
        ts: "2026-08-09T07:30:00Z"
        agent_id: windows-peke-claude-opus5-20260809t073000z
        host: windows
        summary: >
          Filed from the peke field host running the PUBLISHED v0.4.260809.2.
          Root cause live-verified: main() calls setpgid(0,0) unconditionally;
          the tray's injected wrapper FORKS the binary, so the call succeeds and
          moves it into a background process group. podman exec --tty then
          touches the controlling terminal from that group and the kernel
          group-stops it (state T, do_signal_stop, PGRP=18495 vs TPGID=18494).
          setpgid is EPERM for a session leader, so it is a no-op on every
          exec'd path — inert where it was wanted, fatal where it was not.
      - type: note
        ts: "2026-08-09T07:35:00Z"
        agent_id: windows-peke-claude-opus5-20260809t073000z
        host: windows
        summary: >
          CORRECTS 626-F2 and qualifies 620-9xpg. 626-F2 read the 0-byte
          github-login-last.log as a silent-but-working multi-minute preflight;
          it is a permanent hang, so F2's progress-output fix alone would print
          a few lines and still hang forever in the same place. 620-9xpg's
          "real-token login VERIFIED end-to-end" went through --with-token, and
          provider_login_exec_args adds --tty only for LoginInputMode::Terminal
          — so the stdin-token lane never allocates a tty and never hits the
          trap. The tray-menu lane, still unchecked in 620-9xpg exit criteria,
          is the broken one.
      - type: progress
        ts: "2026-08-09T08:05:00Z"
        agent_id: windows-peke-claude-opus5-20260809t073000z
        host: windows
        summary: >
          Implemented on windows/sigttou-login-hang (based on origin/windows-next
          bbe704a7): should_own_process_group + terminal_foreground_pgrp in
          main(), leader-gated group SIGTERM, unconditional interactive login
          progress. Guest binary rebuilt in-VM and installed; A/B on a real pty
          shows the SAME wrapper going 0-bytes-hang -> prompt-in-seconds across
          the binary swap. Operator authenticated with a real token on the
          rebuilt guest. Headless suite: 361 passed, 7 pre-existing
          environmental failures (no git binary in the guest).
      - type: note
        ts: "2026-08-09T08:10:00Z"
        agent_id: windows-peke-claude-opus5-20260809t073000z
        host: windows
        summary: >
          An early hypothesis blamed the wrapper's `2>&1 | tee` pipeline; an
          adversarial re-check refuted the mechanism (a non-interactive bash
          pipeline does not change process groups — every stage stays in the
          script's group) and showed the proposed de-pipe would have recreated
          the 0-byte-log blindness that made this bug hard to read. The tee is
          retained deliberately and pinned by a guard test.

  - packet_id: wt-reparse-breaks-every-quoted-lane
    order: 627-wtrp
    status: implemented
    desired_release: v0.5
    priority: p0
    title: "wt.exe re-parse crashes EVERY project lane, not just login: inline `bash -lc \"...\"` argv arrives with an unbalanced quote (peke: exit 2 on every project click)"
    kind: fix
    deliverable: plan/issues/windows-github-login-blank-terminal-2026-08-09.md
    depends_on:
      - login-lane-background-process-group-stop
    pickup_role: windows
    owner_host: windows
    capability_tags:
      - windows
      - tray
      - process-creation
    estimated_hours: 2
    outcome: >
      wt.exe is used only when every argv token is quote-free; anything that
      std::process must quote takes spawn_wsl_console, where argv reaches
      CreateProcess verbatim with no second parser in the chain.
    next_action: >
      Rebuild the tray and confirm a project click opens the agent shell.
      Field workaround needing no rebuild: launch the tray with
      %LOCALAPPDATA%\\Microsoft\\WindowsApps removed from PATH — wt.exe then
      fails to resolve and spawn_wsl_terminal takes its existing plain-console
      fallback (verified on peke: `where wt.exe` returns 1).
    exit_criteria:
      - "project click opens a working agent shell on a wt-capable host"
      - "argv_survives_wt_reparse rejects the real project argv (DONE, unit test)"
    events:
      - type: filed
        ts: "2026-08-09T08:00:00Z"
        agent_id: windows-peke-claude-opus5-20260809t073000z
        host: windows
        summary: >
          620-9xpg moved ONLY GithubLogin onto spawn_wsl_console ("wt keeps the
          other intents"). The project lanes carry a whole inline
          `bash -lc "export ... && exec tillandsias-headless --cloud 'owner/repo'
          --opencode"` — strictly more quoting than the login argv that already
