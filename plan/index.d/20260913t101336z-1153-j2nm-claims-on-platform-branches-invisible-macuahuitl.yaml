    title: |
      Claims and closures written on osx-next or windows-next reach plan_next on other hosts only when the coordinator relays the branch, so the claim event cannot do its job across platforms: 1127-apa8 was verified and closed by macneo on osx-next and, an hour later, by lenovinha on linux-next, whose plan_next saw a ready row. The ledger's canonical home is linux-next; claim and closure fragments should go there from any host through the plan-only lane, with code staying on the platform branch.
    context: |
      MEASURED 2026-09-13: macneo closed 1127-apa8 on verification (osx-next
      ae9d9e42d, ~08:40Z); lenovinha picked the same row from plan_next on
      linux-next and closed it on verification (358e3f4f3, ~09:50Z). Both
      verifications were sound and reached one verdict by different routes;
      the cost was a fat-host cycle. lenovinha's plan_next could not know:
      macneo's claim (set-field in_progress) and closure lived on osx-next,
      which the coordinator relays once per pass. The claim event exists to
      prevent exactly this and cannot, because methodology sends a platform
      host's plan edits to its platform branch (multi-host-development.yaml:
      "agents working on platform branches MUST commit and push all edits
      (including plan updates) directly to their active platform branch").

      WHAT TO BUILD. (1) Methodology: plan/index.d fragments that are claims,
      progress, closures or filings may — and for claims MUST — be pushed to
      origin/linux-next from any host, in a commit carrying only new
      fragment files, through the plan-only lane; code and everything else
      stays on the platform branch. (2) The lane: accept a push to
      refs/heads/linux-next from a checkout whose HEAD is a platform branch
      when the outgoing diff is fragments-only (a temporary index commit
      onto origin/linux-next, the salvage script's plumbing shape, so the
      host's branch is untouched). (3) The coordinate skill: relay the
      platform branches' remaining plan edits as today. Until (2) lands, the
      coordinator relays platform-branch fragments on the shortest clock it
      can and hosts announce claims by message.

      NOT IN SCOPE: moving code pushes off platform branches, or changing
      what counts as canonical for methodology/openspec/cheatsheets.
