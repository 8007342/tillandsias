    split_from: 657-zm2n
    context: |
      SPLIT OUT OF 657-zm2n because it is the ONLY independently actionable part
      and no existing criterion covers it — all four of the parent's criteria
      are sidecar-conditioned. This needs a criterion written, not inherited.

      MEASURED at HEAD, crates/tillandsias-headless/src/main.rs:

        fn detect_inference_tier() -> &'static str {
            #[cfg(target_os = "macos")]
            { "metal" }
            #[cfg(not(target_os = "macos"))]
            { ... }

      The `macos` arm is a COMPILE-TIME cfg selecting a runtime capability
      claim. The guest is linux-aarch64, so in the guest that arm is compiled
      OUT and can never execute — while on a macOS HOST the binary that carries
      it is not the binary that answers for the guest's accelerator. A tier
      reported from `cfg!(target_os)` describes where the code was BUILT, not
      what the running machine can do.

      This is the same register as the night's other findings: a value that is
      true about the artefact and false about the property it names. It needs no
      sidecar lane and does not wait on 657-zm2n's dependencies.
    exit_criteria:
      - "detect_inference_tier() no longer derives a tier from cfg!(target_os); the macos arm is gone or is replaced by an OBSERVATION of the running machine"
      - "a fixture asserts the pre-fix behaviour FAILS: a build whose target_os is macos must not be able to report `metal` for a linux-aarch64 guest, and the arm must red on the unfixed function"
      - "the replacement states what it MEASURED, or reports unmeasured — a tier that cannot be observed must not be guessed from the build target"
    next_action: |
