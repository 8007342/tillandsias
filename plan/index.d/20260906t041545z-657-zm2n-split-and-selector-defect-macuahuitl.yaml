  - packet_id: the-ledger-has-more-than-one-place-to-look-and-every-reader-looks-in-one-so-five-writes-landed-somewhere-nothing-consults
    event:
      type: note
      ts: "2026-09-06T04:15:45Z"
      host: macuahuitl
      summary: |
        THE SELECTOR OFFERS WORK BLOCKED BY UNSTARTED DEPENDENCIES, and this is
        this packet's family with the READER and WRITER SWAPPED. macbookair's
        finding, verified here.

        657-zm2n depends on two packets that are `ready` — declared, structured,
        and simply not started. Measured:

          tillandsias-plan blocked-by 657-zm2n   ->  NOTHING
          no parked-block row mentions it
          `ready` offers it as claimable

        THE PARKED-BLOCK MECHANISM FLAGS DEPENDENCIES AT `implemented` AND
        `blocked` AND NEVER AT `ready`. So a dependency whose work has not
        STARTED is not treated as an edge at all, and the dependent is handed to
        whoever draws it. Every prior instance of this family was a WRITE that
        landed somewhere real and nothing consulted. This is a DECLARED EDGE
        that the consulting tool declines to weigh — same consequence, a host
        claims work it cannot finish, reached from the other side.

        THE COORDINATOR IS THE PROXIMATE CAUSE HERE. I routed 657-zm2n to
        macbookair this cycle and told them I had verified it against the fold.
        I had: status `ready`, unclaimed, v0.5, deps clear. The fold was right
        and incomplete, and my check consulted exactly the field that cannot see
        this. A dispatch preflight that asks `blocked-by` and gets silence
        cannot distinguish "no dependencies" from "dependencies nobody started".

        NOT PROPOSING THE FIX. Whether `ready` deps should be edges is a
        semantics call with a real cost — it would park a large number of
        packets at once, and 750-zrt4 exists because a parent competing with its
        own children is also a defect. The measurement is the contribution.
