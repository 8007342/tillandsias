    context: |
      Attack on scripts/check-mo-full-attestations.sh (order 742-ye7w). The
      per-file loop skips the README:

          case "$f" in
              */README.md) continue ;;   # contract prose, not a ledger

      plan/mo-full-attestations.d/README.md is the one file in the directory
      that is never scanned — and the gate's own contract says "grammar over
      every file". A fabricated marker that would be REFUSED anywhere else (a
      bare `MO-FULL: ...` with no heading, or a 40-hex of all nines) passes
      silently if it is appended to the README.

      EMPIRICAL (fixture repo, gate copied in):
          # plan/mo-full-attestations.d/README.md contains ONLY a bare marker:
          MO-FULL: COMPLETE 9999999999999999999999999999999999999999 linux-next 9999999999999999999999999999999999999999
          scripts/check-mo-full-attestations.sh   # -> ok:mo-full-attestations:no-ledger-dir 0 markers verified  rc=0

      Two defects: (1) the marker is never read, so a fabricated line rides to
      origin in the README with no gate; (2) the verdict text is actively
      misleading — "no-ledger-dir 0 markers verified" prints when the
      directory EXISTS and contains a (skipped) file, so a human reading the
      verdict believes there was nothing to check. This is the README-shaped
      Trojan: an attacker (or a sloppy writer) hides the fabricated line in the
      one file the gate itself declared exempt.
    exit_criteria:
