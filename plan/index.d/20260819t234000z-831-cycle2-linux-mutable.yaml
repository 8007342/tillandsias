      summary: |
        ARCHIVING DESTROYS THE PROPERTY RETRACTION RELIES ON. Found while
        verifying the archiver fix, and it is a design question for the
        convergence model rather than a bug in the tool.

        MEASURED: after archiving, an archived packet answers
        `no packet matches`. `Ledger::collect_archived_ids` (lib.rs:295) keeps
        REFERENCES to archived ids sound — nothing dangles — but it does not
        make the row readable. 577 packets leave the query surface entirely.
        The content survives in plan/archive/*.yaml, greppable by search_code
        and by nothing that answers a plan question.

        WHY THIS MATTERS TO CONVERGENCE. The 2026-08-19 ruling on this packet
        argues aggressive retraction is safe precisely BECAUSE nothing is lost:
        "The row stays. Every event stays. The REASONING for why it was filed
        stays — and that reasoning is exactly what stops a later agent
        re-proposing it. Only SELECTION changes."

        That holds for `obsoleted`. It stops holding the moment the archiver
        runs, because `obsoleted` is in its terminal set. Retract a row today
        for a stated reason; the next sweep archives it; the reason is no longer
        in any answer; an agent re-proposes it. Under the convergence model
        retraction becomes the PRIMARY drain (~182/week against +26/day), so
        this is not a corner — obsoleted rows would come to dominate exactly the
        population that must stay legible.

        Today the exposure is small: 8 obsoleted vs 564 completed. That is the
        argument for deciding it now rather than after the first big sweep.

        THREE OPTIONS, and I am not picking one unilaterally because it changes
        what the operator's ruling means in practice:

          (a) EXEMPT `obsoleted` from archiving. One line. Retracted rows stay
              queryable forever and keep their anti-re-proposal reasoning. Costs
              index size in exactly the population that will grow fastest —
              which is the unbounded-growth problem wearing a different hat.
          (b) MAKE THE ARCHIVE READABLE. Extend the fold to answer `status` /
              `query` from plan/archive for archived ids. Strictly the best
              answer — nothing leaves the corpus, the index still shrinks, and
              the retrieval-size win the operator asked about is preserved
              because the archive need not be indexed for SELECTION. Largest
              change of the three.
          (c) ACCEPT THE LOSS for completed/done, exempt obsoleted, and treat
              plan/archive as cold storage reachable by grep. The pragmatic
              middle, and it makes the asymmetry explicit: a thing that was DONE
              does not need to argue against being re-proposed, because doing it
              again is usually just wasted work; a thing that was REJECTED does.

        I lean (c) then (b) — (c) is a one-line change that buys the correct
        semantics immediately, and (b) is the real fix whenever the fold work is
        worth it. Recording rather than deciding: the sweep does not run until
        this is answered, and it is cheap to answer.
