        WHAT I RECORDED YESTERDAY: "THE ARCHIVER NEVER READS plan/index.d AT
        ALL", therefore a base-closed row REOPENED by a fragment reads terminal
        and gets archived, therefore 424 and 437 vanish. The observation was
        true and independently verifiable (`grep -cE 'index\.d|fragment'` -> 0).
        The causal claim attached to it was never tested.

        IT IS FALSE. I fixed the fold read first — the archiver now asks
        `query --status` instead of grepping the base — and re-ran the
        acceptance test. 424 and 437 STILL VANISHED, byte for byte the same two
        rows. A correct fix to a real defect changed nothing about the symptom,
        which is the cleanest possible refutation.

        THE ACTUAL CAUSE, found by looking at the two rows instead of theorising
        about them: the row-header regex was /^    - (packet_id|id): /, and
        NINETEEN of the 1031 base rows lead with `- order:` instead. YAML
        mapping keys are unordered; nothing ever required a first key.

        And a missed header does not skip a row — the row simply has no header,
        so its lines are ABSORBED into the PRECEDING packet's block and share
        that packet's fate. 424 is preceded by
        macos-curl-installer-gatekeeper-overwarn (:20305), which is terminal. So
        424 was never "archived" by any decision about 424; it was swallowed by
        its neighbour. Both lost rows are `- order:`-led. Both are recovered by
        widening one alternation.

        THIS IS 797-5kqe — asserting an unmeasured cause — filed by me, three
        days ago, and committed in the same cycle that filed its sibling. The
        specific error is worth naming precisely because it is seductive: I had
        a true observation, a plausible mechanism, and a matching symptom, and
        the missing step was the cheap one. Dry-running the fold fix alone would
        have cost two minutes and refuted it immediately.

        THE ACCEPTANCE TEST IS NOW THE GATE, which is the durable part. Three
        changes, in scripts/archive-plan-packets.{rb,sh} and build.sh:

          1. Closure is decided by the FOLD (`query --status`), not a base grep.
             Still correct, still needed — a line grep cannot tell a packet's
             own status from one nested in an event (752-pst5), and the base is
             not the ledger. It was simply not the cause of the row loss.
          2. ROW_HEADER accepts `order`. This is the fix that recovers 424/437.
          3. `--check` asserts the READY SET IS BYTE-IDENTICAL across a run.
             Archiving moves terminal rows; a ready row is by definition not
             terminal; so the ready set is the invariant. It used to assert only
             idempotency, which an archiver that deterministically eats the
             wrong rows satisfies perfectly — and the script's freshness header
             cited that green as evidence of soundness.

