    title: |
      every GPU and NPU in the fleet reports present-unscheduled or engine-missing — the hardware is there and no runtime claims it, on all seven hosts
    deliverable: |
      at least one accelerator moves to schedulable in the capability matrix,
      through a container-lane engine rather than a host install
    pickup_role: linux
