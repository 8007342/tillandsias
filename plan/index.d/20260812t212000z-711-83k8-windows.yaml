packets:
  - packet_id: fragment-host-suffix-may-not-match-writing-host
    order: 711-83k8
    status: ready
    desired_release: v0.5
    priority: p3
    title: "A ledger fragment written by the forge agent carried a -macos host suffix; the filename's host tag may not name the host that wrote it"
    kind: research
    deliverable: this packet
    depends_on: []
    pickup_role: any
    owner_host: any
    capability_tags:
      - plan
      - observability
    estimated_hours: 1
    outcome: >
      Either the host suffix in a fragment filename reliably names the writing
      host, or it is documented as advisory so nobody traces provenance with it.
    next_action: >
      DO NOT INVESTIGATE ON THIS OBSERVATION ALONE (operator directive
      2026-08-12). One occurrence is within the noise a fleet of agents is
      allowed to produce. If a SECOND mismatch is observed, that is the second
      data point and the packet becomes worth an hour: check whether the suffix
      comes from TILLANDSIAS_HOST_KIND, an inherited env var, or a --host flag
      the caller passed, and decide between fixing the source or documenting the
      field as advisory.
    exit_criteria:
      - "a second independent occurrence is recorded here, OR the packet is closed as not-reproducing after the next fleet-wide compaction"
      - "if pursued: the host suffix either names the writing host or is documented as advisory in the fragment-writing contract"
    events:
      - type: filed
        ts: "2026-08-12T21:20:00Z"
        agent_id: "windows-claude-opus5-20260811t215500z"
        host: windows
        summary: >
          Noticed while reading the fleet's overnight output, not while chasing
          anything. Packet 702-griq was filed in
          plan/index.d/20260812t183449z-9c4e21ab-macos.yaml, but the cycle
          record covering that window is the FORGE agent
          (forge-antigravity-20260812t1500z) working on linux-next. So the
          filename's `-macos` suffix does not name the host that wrote it.
          Harmless for the fold — fragment filenames only need to be unique, and
          uniqueness is unaffected — but it misleads anyone tracing which host
          filed what, which is exactly what the suffix looks like it is for.
          Plausible causes, unverified: the suffix is taken from
          TILLANDSIAS_HOST_KIND, which a forge launched from a macOS session may
          inherit; or a --host flag was passed through from the launching
          context.
          FILED LOW AND DELIBERATELY NOT INVESTIGATED, per operator directive:
          agents are allowed weak-law-of-large-numbers side effects, and one
          occurrence is noise. It is written down so that a second occurrence
          has something to land on rather than being discovered from scratch.
