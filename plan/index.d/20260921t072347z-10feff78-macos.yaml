    value: "Each of the three fixtures, driven into a could-not-run state, is scored\nSKIPPED by scripts/run-litmus-test.sh and lands OUTSIDE the pass rate;\neach in its healthy state still scores PASS. Both halves are required —\na fixture that scores SKIPPED in every state has been disarmed, not fixed.\n\nTHE PRE-FIX RESULT IS PART OF THE CLOSURE. Show the same command scoring\nFAIL before the change, so the row rests on a difference rather than on a\ngreen.\n\n\n[2026-09-21T06:19:46Z macos] MEASURED ON BOTH SIDES OF THE CHANGE, same command, same host\n(tlatoanis-macbook-air 2026-09-21), fixture driven into a could-not-run state\nwith TILLANDSIAS_TRAY_BIN pointed at a path that does not exist:\n\n  BEFORE  [FAIL] spec=vm-provisioning-lifecycle test=litmus:macos-vz-orphan-diagnosis\n                 Check implementation\n          PASS: 0  FAIL: 1   Pass Rate: 0% (0/1 executed)\n          Test Verdicts: passed=0 skipped=0 not-run=1 failed=1\n\n  AFTER   PASS: 1  FAIL: 0   Pass Rate: 100% (1/1 executed)\n          Step Verdicts: advisory=0 skipped=1\n          Status: [PASS]\n\nSTATED PRECISELY, because the two verdicts are not the same thing: the STEP\nthat could not run now scores SKIPPED and sits outside the rate, which is what\nthis row fixes. The TEST scores PASS rather than SKIPPED, carried by its other\nstep — the parse/exec-bit check, which genuinely ran and genuinely asserted.\nA test whose every step skipped would score skipped; this one has a step that\ndoes not depend on the host.\n\nTHE HEALTHY STATE STILL PASSES: ok:macos-vz-orphan-diagnosis:4 on a host with\nthe bundle and a free image, re-run after the holders() change that arm 1\ndepends on. Without this half the row could be \"closed\" by disarming the\nfixture.\n\nEVERY COULD-NOT-RUN FAMILY GOES THROUGH ONE HELPER, so the three spellings\ncannot drift apart again: off-platform, no app bundle, no provisioned image,\nimage already held, cache not empty, guest asset uninspectable, guest predates\nthe lane, no home-src share. Verified by execution for the bundle family in all\nthree fixtures and for the already-held family in the orphan fixture:\n\n  unsupported:macos-vz-orphan-diagnosis:image-already-held-by-pid-69456-precondition-unmet\n  skip:macos-vz-orphan-diagnosis:image-already-held-by-pid-69456-precondition-unmet\n\nTHE BINDINGS HAD TO MOVE TOO, and this is the part a source-only fix would have\nmissed: both litmus step commands filtered the fixture's output through\n`grep -E '^(ok|violation|unsupported):<name>:'`, which would have DROPPED the\nnew terminal line before the runner ever saw it. The grep now admits `skip`.\n\n[2026-09-21T06:56:48Z macos] Gate on the pushed tree: BUILD_RC=0, ok:test-baseline:ran=2476 new-red=0\ntolerated=0 stale=0, stamp fresh; pushed on osx-next at 61b3f785d with the\npre-push hook's own checks passing (ok:linux-next-merged:1, not bypassed).\n\nONE CASE WAS PROPOSED FOR THIS HELPER AND REFUSED, and the distinction is this\nrow's finding rather than a detail of it.\n\nmacneo ran a COPY of the fixture from /tmp. ROOT resolved to `/`, and the\nfixture answered no-app-bundle. Before this row that printed `unsupported:` and\nscored FAIL — loud, if misattributed. After it, a terminal `skip:` scores\nSKIPPED and leaves the rate silently. The proposal was to route that case\nthrough cannot_run with the rest. THAT WOULD HAVE TURNED A RED INTO A SILENT\nSKIP, introduced by the very fix meant to stop could-not-runs being misread —\nthe \"six characters that make a red disappear\" run-litmus-test.sh:948 warns\nabout.\n\nA RELOCATED SCRIPT IS NOT A COULD-NOT-RUN. \"No app bundle\" is a TRUE statement\nabout `/` and a FALSE description of what happened: the fixture cannot tell\nwhether it is looking at a checkout at all, which is the wrong-subject shape one\nlevel up from the version-skew case. cannot_run means \"the HOST cannot answer\nthis question\" and must not also mean \"this script does not know where it is\".\n\nThe agreed remedy is a named REFUSAL, not a skip, because `refused:` is in the\nrunner's failure set at run-litmus-test.sh:966 — checked FIRST and\nshort-circuiting, so it stays red whatever follows it:\n\n    refused:macos-vz-orphan-diagnosis:root-is-not-a-tillandsias-checkout-<path>\n\nasserted BEFORE anything derived from ROOT is trusted (build.sh and crates/\npresent). Proposed as a skip by macuahuitl-fedora, refused with this reason,\nand agreed; it is carried on the follow-up identity slice together with the\n--version half, NOT in this row's landed change.\n\n[2026-09-21T07:23:47Z macos] \nLANDED ON origin/linux-next AT fc39b9ab2 (land52), verified at that tree rather\nthan taken on report: the cannot_run helper is present in\nscripts/test-macos-vz-orphan-diagnosis.sh (5 sites), the terminal skip line is\npresent in scripts/test-macos-model-share-writable.sh, the widened\n`(ok|violation|unsupported|skip)` filter is present in\nopenspec/litmus-tests/litmus-macos-vz-orphan-diagnosis.yaml, and the pushed head\nff3d2ada4 is an ancestor of it."
