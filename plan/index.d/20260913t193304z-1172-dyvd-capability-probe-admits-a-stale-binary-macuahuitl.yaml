    owned_files:
      - scripts/host-capability-probe.sh
      - scripts/test-host-capability-probe-currency.sh
    title: |
      resolve_probe in host-capability-probe.sh admits a candidate when `--inference-tier` exits 0, which proves it RUNS and nothing about whether it knows the current vocabulary; on yolanda a native build from 2026-08-29 (extensionless, so it resolves) predates accel_side and present-unusable, the probe exits 0, and the published windows-host row shows no GPU and no NPU on a host with an AMD Radeon 860M and an NPU. esme's missing binary refuses loudly (1171-ccf2); a stale one publishes silently, and the matrix routes on the row. The resolver must refuse a candidate it cannot show is current, by name.
    context: |
      MEASURED on yolanda 2026-09-13, same command against two binaries:
      release (Aug 29) accel_gpu=none accel_gpu_name=- accel_npu=none
      accel_ram_gb=- with no accel_side at all; debug (Sep 13)
      accel_gpu=present-unusable accel_gpu_name=AMD_Radeon_TM_860M_Graphics
      accel_npu=present-unusable accel_npu_name=NPU_Compute_Accelerator_Device.
      host-capability-probe.sh --fragment exits 0 on the stale one and the
      ledger already carries the result (host:yolanda locus:windows-host
      ts:2026-09-12T04:07:21Z, schedulable none, cpu only). This is esme's
      793-zumy lesson — correct token, live run, wrong binary — inside the
      probe's own resolver, in the silent polarity: the resolver has no
      binary-versus-source freshness check, and the probe is the thing that
      writes the ledger. Fixing only 1171-ccf2 (the loud half) would hand
      esme a runnable path that could publish quietly wrong rows too, so
      this lands FIRST and 1171-ccf2 after it.

      WHAT TO BUILD, yolanda's proposal: resolve_probe REFUSES a candidate it
      cannot show is current — a vocabulary probe (the candidate's
      --capabilities output carries accel_side, or whatever the current
      contract's discriminating key is) as the honest check, mtime against
      accel_probe.rs as the fallback — with a named refusal rather than a
      silent fallthrough; then yolanda's own wrong row is republished from a
      current binary as the closure, and the matrix shows the 860M and the
      NPU. NOT IN SCOPE: producing the native Windows binary (1171-ccf2).
