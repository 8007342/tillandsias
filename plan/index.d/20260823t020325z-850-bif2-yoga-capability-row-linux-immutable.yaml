# AMD GPUs "cannot be detected at all". On bare-metal Linux that is NOT what
# happens: the generic Vulkan/DRI path detects the Radeon 840M and reports it
# usable=true — but identified only as "Vulkan GPU" (no vendor-specific name,
# no VRAM, no bandwidth), while legacy_tier=gpu-rocm comes from host rocminfo
# (gfx1152), a PATH fact a toolbox/container run would flip to cpu. The
# missing rocm/amdgpu code costs IDENTIFICATION, not presence — the
# cannot-be-detected state is the WSL2-guest locus (yolanda in-guest:
# present-unusable wsl2-no-dri-render-node), not Linux bare-metal.
# The XDNA NPU is present-unusable (engine-missing; driver amdxdna,
# fw 1.1.2.64, /dev/accel/accel0). engines=[] (no ollama/llama-server on
# host PATH), so capability-matrix will report schedulable: none.
#
