        FOR WHOEVER WRITES THE FIXTURE — THE EMPTY-STRING ARM IS A TRAP, AND IT IS
        TREE-STATE DEPENDENT. Line 44 is
        `RUNTIMES="${SKILLS_CHECK_RUNTIMES:-.claude .opencode .codex .github .gemini}"`,
        and `:-` substitutes the default when the variable is unset OR EMPTY. So
        "set the runtime list to empty" — the natural way to express "the population can
        shrink to nothing" — does not empty the population at all:

          on a BROKEN tree:  SKILLS_CHECK_RUNTIMES="" -> violation:...        rc=1
          on a FIXED  tree:  SKILLS_CHECK_RUNTIMES="" -> ok:...:5:16          rc=0

        The fixed-tree case is the dangerous one, and it is the one a fixture author
        will meet, because they write the arm against a tree they have just repaired.
        They intend an empty population, they get `ok`, and they record a passing
        negative control for a defect the arm never exercised. The count says 5 and
        nothing makes them read it — **Hole A's own disease reproducing inside the test
        written to catch Hole A.** This is
        `a-control-must-not-derive-from-its-treatment`, in a fixture author's hands.

        REQUIRED of every arm on this row:
        - use names that DO NOT EXIST (`.nope-one .nope-two`), never an empty string,
          and carry a comment saying why empty does not work — the next person will try
          empty first, because two of us already did;
        - assert the LITERAL VERDICT STRING (`ok:skills-single-source:0:16`), never
          `rc=0`. An exit-code-only arm passes in all four cases above, including the
          two that prove nothing.

        DO NOT "FIX" THIS BY CHANGING `:-` TO `-`. That would let an explicitly-empty
        environment value reach the loop and make the vacuous `0:16` reachable FROM THE
        ENVIRONMENT — easier to hit, not harder. Pin the population first; the
        substitution is a free choice afterwards.

