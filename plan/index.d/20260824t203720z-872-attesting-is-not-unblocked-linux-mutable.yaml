    discovered_by: "872-c9nd — reporting yoga healthy on the same cycle its four hours of work were confirmed destroyed"
    context: >
      THIRD ITERATION OF ONE BLIND SPOT, and each fix assumed something the next
      failure disproved.

        864-t4nq  taught the report to see WEDGED, from commit recency.
        864-w7rc  taught it to keep saying BLOCKED after the commits stop, by
                  reading the host's own filed record.

      Both assumed a wedge ends when someone RESOLVES it. yoga's ended when the
      wedged checkout was REPLACED BY A FRESH CLONE (872-c9nd), destroying four
      hours of finished 642-fedr/776-cm74 work. The host then attested normally
      from the clean clone, and this report called it `healthy` on the very
      cycle the destruction was confirmed — while its own record still read
      `Status: blocked`.

      The signal could not distinguish "unwedged" from "wedge deleted", because
      both present as a host that started attesting again. Recovery and erasure
      look identical from outside.

      WHAT IT DOES NOT DO, deliberately: a host that IS attesting is not
      reclassified as blocked. yoga really is cycling and doing work; calling it
      blocked would be its own kind of lie, and would earn the same distrust the
      earlier false SILENT did. The open record is SURFACED BESIDE the healthy
      line instead. Exactly one of two things is then true and both want
      attention: the record is stale and should be closed, or the block outlived
      the symptom that made it visible.

      THE VERDICT GRAMMAR IS DELIBERATELY UNCHANGED at five fields. I widened it
      four-to-five one day ago (864-w7rc) and wrote there that widening a
      falsifiable line is a breaking change for anything parsing it. Doing it
      again the next day would be churn, so the count lives in a stderr remedy
      block and the per-host line carries the annotation.
    exit_criteria: >
      (1) A host that is attesting AND has an open blocker record it filed about
      itself is annotated with the record's path, not silently called healthy.
      (2) It is NOT reclassified as blocked — it is attesting, and the report
      must not contradict that.
      (3) The verdict grammar stays at five fields.
      (4) Mutation control: close the record and the annotation must disappear.

