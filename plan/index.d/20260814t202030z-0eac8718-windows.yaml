      summary: >
        CORRECTED, and the packet as filed was wrong. Both hypotheses it named are refuted; the provisioning failure was my own build error.  WHAT ACTUALLY HAPPENED: I built the staged guest with   cargo build --release --target x86_64-unknown-linux-musl -p tillandsias-headless and omitted `--features listen-vsock`. Without that feature the vsock listener is not compiled in, so the guest never bound port 42420 and no host could ever connect. The guest states it at every start:   [tillandsias] --listen-vsock requires the binary to be built with --features listen-vsock  REFUTED, and to be ignored by anyone reading the original issue file:   * the GuestCommunicationServices registry lead — there is nothing wrong with the host registry; a correctly built guest connects without any registration being added;   * the suggestion that WSL 2.7.11.0 regressed something — same host, same WSL version, wire Ready in ~1.5 minutes once the binary could listen.  PROOF: rebuilt with the feature, purged, re-provisioned from scratch on the same host. `--diagnose` exit 0, phase=Ready, podman_ready=True, guest_version 0.4.260812.1, podman 5.8.4 active in the guest. Posted in full on 735-dim8, which is now PASS.  WHAT THIS PACKET SHOULD NOW BE ABOUT — the gap that let a build error look like a product failure for an hour: Every guest-side readiness signal was GREEN while nothing was listening.   * headless-preflight.sh: `vsock_device=present` — it tests only for /dev/vsock, which vsock_loopback alone provides, and this image loads that module deliberately via /etc/modules-load.d/tillandsias-vsock.conf;   * systemd: unit `active (running)`, with `--listen-vsock 42420` right there on the command line;   * the process: logged `app.started` and `preflight vsock_loopback loaded`. Not one of them asks whether a listener is actually bound. A binary that cannot honour its own flag starts, announces itself healthy, and stays "running" indefinitely — and the flag it cannot honour is the entire reason the process exists.  That is worth fixing on its own merits: the same silence would greet a genuine regression, a feature-flag mistake in CI, or a guest built by a future contributor who copies the cargo line I copied.  RESCOPED exit criteria:   1. The guest fails LOUD when `--listen-vsock` is passed to a binary that cannot honour it — non-zero exit, so systemd reports failed rather than active.   2. headless-preflight.sh stops accepting /dev/vsock as evidence of a bound listener; it checks the property, not a proxy for it.   3. NEGATIVE CONTROL: a correctly built guest still starts and still reports ready — a preflight that refuses everything is not an improvement.   4. Consider whether scripts/build-guest-binaries.sh should be the ONLY sanctioned way to stage a guest, since the documented cargo fallback is what I got wrong. Priority dropped p0 -> p2: nothing about the product is broken, and the release is not blocked by it.
