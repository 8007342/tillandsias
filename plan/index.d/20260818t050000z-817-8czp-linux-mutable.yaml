      at the one link in the chain that was fine. Here it pointed at the
      provider while the fault was a stale credential the log named in full.

      The lane must still FAIL — it did not complete — so the change is to the
      CAUSE, not the verdict.

      NOT FIXED HERE, and it is the actual blocker: `blocked:upstream-auth-stale`
      itself. That is 809-w2xy, operator-owned. This packet only stops the
