      AND THE EXIT CONTRACT IS WHY THERE IS NO MARKER. meta-orchestration says
      a cycle that cannot push must NOT emit one — "the missing marker is
      itself the loud failure". So the single state in which a missing marker
      is CORRECT was the state the checker described as an agent crash.

