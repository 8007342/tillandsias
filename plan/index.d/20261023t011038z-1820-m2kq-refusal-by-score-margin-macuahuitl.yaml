    title: |
      The grounded pipeline refuses out-of-coverage questions by a score MARGIN (best − median of top-k) plus a lexical-overlap check between query and best chunk, with thresholds calibrated on scripts/refusal-calibration/* corpora, instead of an absolute cosine floor/band alone
    context: |
      Today refusal is an absolute-score floor and mid band (pipeline.rs
      tests below_floor_retrieval_refuses_out_of_coverage,
      mid_band_score_refuses_out_of_coverage). 824-6qxh
      (spec-expert-refusal-threshold-fleet-decision) measured that absolute
      bands are a property of (embedder, corpus, prefix), so they move with
      every corpus change; a margin over the top-k median is corpus-relative
      and travels between hosts. The lexical-overlap check catches the
      near-miss where an embedding is close but no query content word occurs
      in the chunk. Calibration corpora already exist:
      scripts/refusal-calibration/questions-wide-579.jsonl,
      negatives-declined-alternatives.jsonl, labels-true-near-miss-33.txt,
      with measure-bands.sh / analyze-bands.sh as the band instruments.
    exit_criteria:
      - 'a margin-band measurement over questions-wide-579 + negatives-declined-alternatives reports in-corpus false-refusal and out-of-corpus false-answer rates for the margin rule and for the current floor rule on the same index; the margin rule is adopted only if its out-of-corpus false-answer rate is ≤ the floor rule''s at equal or lower false-refusal (pre-fix result: no margin measurement exists)'
      - 'a unit test with a synthetic top-k where the best score is high but equal to the median (flat) refuses, and one with a clear margin answers (pre-fix result: FAILS — the flat high set answers under the absolute floor)'
    unscoreable: |
      unpinnable-until-the-guard-exists: scripts/refusal-calibration/measure-margin-bands.sh
      (new) prints the two rules' rates on the live index; cargo test
      -p tillandsias-plan margin_refusal_flat_topk_refuses pins the rule.
