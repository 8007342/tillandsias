        THREE CLASSES THAT MUST NEVER BE CONVERTED, each of which would have
        looked like ordinary work:

          1. CURL-PIPED INSTALLERS. scripts/install-macos.sh is fetched from a
             release URL and piped straight into bash — release.yml:408 and the
             smoke runbook's macOS row both do exactly that. THERE IS NO
             CHECKOUT AND NO SIBLING FILE TO SOURCE. Converting it breaks the
             macOS installer for every user. This is the shipped-diagnostic rule
             from slice one, one step more severe: those at least run from a
             directory, this one runs from a pipe.

          2. BOOTSTRAP WRAPPERS. with-tillandsias-builder.sh CREATES the
             toolbox. It cannot use the toolbox to decide how to make the
             toolbox. Same for with-wsl2-builder.sh.

          3. SHIPPED DIAGNOSTICS — already guarded from slice one.

        All three are now pinned by fixture arms, because each reads as an
        oversight to whoever finishes the sweep.
