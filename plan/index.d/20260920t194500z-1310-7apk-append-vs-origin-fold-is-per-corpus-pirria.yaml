      summary: |-
        THE FLOOR-LINUX REGIME, measured on pirria 2026-09-20 at trunk
        8d06f5cd7 with b91b4f353 live in the checkout, as asked. It is NOT
        under a minute: one valid single-fragment push spends 135.8s in the
        hook, of which 116.0s is check-append-vs-origin-fold.sh, 12.6s is
        check-fragment-status-loss.sh and 5.1s is release-preflight.sh. The
        four guards before the local gate are 0.0s each.

        So b91b4f353 holds — the mover costs are gone from this trace — and a
        FOURTH cost dominates what remains. It is filed as 1310-7apk rather
        than here because it is not the per-file family: the fold check derives
        its pairs from the whole of plan/index.d/ (1,309 files, 100 long-form
        pairs, folded twice each through the plan binary) rather than from the
        push, so it is per-CORPUS, paid per push, and it grows as the ledger
        grows. The status-loss checker's three plan-binary calls per fragment,
        in land 33b, are the 12.6s line and remain in this family.

        ON THE HOOK-STALENESS TRAP, and this host is the opposite case:
        .git/hooks/pre-push here is a 1,427-byte shim (tillandsias-pre-push-v8,
        generated by scripts/install-hooks.sh) that resolves HOOK_ROOT from
        `git rev-parse --show-toplevel` and delegates to
        $HOOK_ROOT/scripts/hooks/*.sh, baking in no host path and no logic. A
        fix on trunk is therefore live as soon as the WORKTREE is updated and
        no reinstall is needed; the installed version string matches the
        installer's. What can still be stale is the checkout: my own branch at
        f3f625822 lacked b91b4f353 while trunk carried it.

        The earlier two-minute push on this host that a 115s bound killed
        mid-hook was this, not the network and not a credential: 135.8s against
        a 115s bound.
