    title: |
      test-pre-push-main-branch-affordance arm 2 plants `: > $W/not-runnable` as TILLANDSIAS_PLAN_BIN to prove the hook fails closed with no-plan-binary; on a Windows host's WSL2 guest the scratch dir is on /mnt/c (v9fs), where a fresh empty file is mode 777 and executing it returns rc=0, so the hook gets past capabilities and prints no-verdict instead
    context: |
      MEASURED on yolanda-windows 2026-10-08. Preflight of four refs (each diff
      one exec-crate Rust file) refused only this guard:
        FAIL: arm 2: lines=14 rc=1 out=[blocked:main-branch-affordance:no-verdict]
      The coordinator measured it 5/5 GREEN on Linux trunk (a09275137+), arm 2
      included, so the defect is the host's filesystem, not trunk.
      ROOT CAUSE, probed in the tillandsias-build guest (not assumed):
        /mnt/c/.../target/plan-scratch: mode=777 fs=v9fs   exec rc=0
        mktemp -d (/tmp):               mode=644 fs=ext2/ext3 exec rc=126
      The fixture's scratch base is $ROOT/target/plan-scratch, which in the
      guest is the Windows checkout on 9p. Every file there is executable, and
      bash runs an empty executable as an empty script that exits 0. The probe
      honours TILLANDSIAS_PLAN_BIN on existence alone (by design, 1287-family),
      so the hook's `"$PLAN" capabilities` succeeds, the Lua call prints
      nothing, and the stub prints its fallback no-verdict.
      CORRECTION: the first diagnosis, relayed to the coordinator, was that
      plan-binary-probe found the real binary despite the planted one. The
      probe above refutes that; the planted file IS used, and it is runnable.
      The hook still FAILS CLOSED (rc=1, a blocked: line), so nothing unsafe
      passed. The fixture's premise ("this file is not runnable") is false
      on this host, and the arm reads as a regression.
