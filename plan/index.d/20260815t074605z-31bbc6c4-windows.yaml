      summary: >
        THE WIRE IS UP. And the residue turned out to be two things, one of which was my probe failing a healthy system.  THE HOST-SIDE ACCEPTANCE READING, taken with the distro deliberately held running instead of racing WSL's idle shutdown:    distro_running True  guest_version 0.4.260815.1   wire {"reachable": true, "phase": "Ready", "podman_ready": true,         "last_event": "tillandsias-in-vm", "error": null}  So `VmStatusRequest: early eof` from the previous cycle was TRANSIENT — the guest was mid-restart when I sampled it. I filed it as a third undiagnosed problem; it was not one. Worth saying plainly because I had written it into the smoke report as needing its own investigation, and the honest correction is that I sampled a moving target. The earlier WSA_ERROR(10060) was real and is explained by the daemon being killed every fifteen seconds.  WHAT WAS REAL, and it is the worst of the three defects in my own 735-ewzp work. With the wire reachable and phase=Ready, the readiness unit still sat in `activating`. Measured:    vsock_loopback loaded: 0   socat VSOCK-CONNECT:1:42420 -> E connect(... cid:1 ...): Network is unreachable  CID 1 is VMADDR_CID_LOCAL and reaching it requires the vsock_loopback module. The HOST does not use that path at all — it arrives over hvsocket to the VM's own CID. So my probe asserts a property the host does not depend on, and on a fresh guest, where the module is not loaded, it reports the control wire down WHILE THE CONTROL WIRE IS WORKING. A false alarm about a healthy system is the mirror of 735-ewzp's original defect, and I had now managed both mirrors of it in one script:    1. wired so failing it stopped the daemon        (fixed last cycle)   2. deadline assumed an already-warm guest        (fixed last cycle)   3. asserts a path the host never uses            (this one)  THE FIX, and why it does not just paper over it. The two failure modes are DISTINGUISHABLE at the syscall level and were being conflated:    ENETUNREACH  "Network is unreachable"  -> no loopback transport; a guest-local                                             probe cannot observe the property   refused/reset                          -> transport fine, nothing listening,                                             which IS the defect 735-ewzp catches  The probe now modprobes vsock_loopback first (best-effort, it is a one-liner and the daemon already knew it was missing), and if CID 1 is still unreachable it emits a distinct INDETERMINATE verdict with its own exit code, saying explicitly that it implies nothing about host reachability and naming the command that does answer that. Reporting INDETERMINATE as OK would recreate the always-passes probe; reporting it as NOT-BOUND is the false alarm.  FALSIFIED BY EXECUTION IN THE LIVE GUEST, all three states, each with the module state forced:    A  module absent, listener up   -> probe loads it, "vsock_listener=bound"     exit 0   B  transport up, port 42999 dead-> "vsock_listener=NOT-BOUND ... Last error:                                       connect(... cid:1 port:42999): Connection                                       reset by peer"                            exit 1   C  modprobe suppressed          -> "vsock_listener=INDETERMINATE ... says                                       NOTHING about host reachability"          exit 2  State A is the case that was false-alarming. State B proves 735-ewzp's discrimination survived all three rewrites — an unbound port is still caught. Only ENETUNREACH is special-cased; anything else falls through to NOT-BOUND, so the branch fails safe in the direction that reports a problem.  Unit tests now pin the modprobe, the INDETERMINATE verdict and the ENETUNREACH branch, alongside last cycle's assertions that the daemon unit carries no ExecStartPost and that provisioning enables the assertion without --now.  STILL NOT MET: exit criterion 1 asks for a clean-room provision from a REBUILT installer reaching a reachable wire. What exists is a reachable wire on a guest whose units I edited by hand, plus the code change that would produce those units. The rebuild-and-reinstall loop has not been run. The packet stays open and I am not claiming that criterion.
