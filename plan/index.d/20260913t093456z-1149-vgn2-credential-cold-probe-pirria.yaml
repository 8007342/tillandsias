packets:
  - packet_id: credential-cold-probe-certifies-cold-while-a-fallback-share-keeps-every-reset-warm
    order: 1149-vgn2
    status: ready
    pickup_role: linux
    kind: bugfix
    priority: p1
    owner_host: linux
    capability_tags: [testing, vault, release, linux]
    title: |
      The credential-cold probe asks the keychain; vault reads keychain OR a fallback file
    owned_files:
      - scripts/probe-credential-cold-state.sh
      - scripts/test-credential-verdict-script.sh
    request: |
      `scripts/probe-credential-cold-state.sh` reports `credential-cold` on a host where
      the unseal share is present, so a run that did NOT exercise the keychain-volume
      resync path is certified as one that did.

      The probe asks the host keychain and nothing else. Vault reads the keychain OR a
      file fallback under `~/.cache/tillandsias/` (`fallback_vault-shamir-share-v1`,
      `fallback_vault-root-token-v1`), and that fallback is outside everything
      `podman system reset --force` destroys.

      MEASURED on pirria 2026-09-13, v56.9.12.2 smoke, one run: the probe answered
      `credential-cold`; the fallback share was present and dated 2026-09-01; and after a
      reset that zeroed the store to 0/0/0, the product's own init log said it recovered
      the share "from host keychain or fallback" and was "preserving existing data volume
      (Shamir share present in keychain)". The resync path was not exercised — the
      900-z3kv condition exactly — while 900-z3kv's criterion-2 instrument said otherwise.

      WHY A FALSE COLD IS WORSE THAN AN HONEST WARM. yoga and lenovinha report
      `credential-warm` and a reader discounts their clean-room claims correctly. pirria
      reports cold, so a reader CREDITS this lane with coverage it does not have — and
      pirria is the floor host cited when the fleet wants a cheap clean-room result. A
      wrong warm is discounted; a wrong cold is spent. Every pirria clean-room result
      since 2026-09-01 is re-labelled warm by this measurement.

      The vault message is the thing that hid it: it asserts "present in keychain" for a
      share that came from the fallback, so the substitution is unreadable from the log.

      SCOPE LIMIT. This is criterion 2's instrument being made to answer the question it
      claims to answer. It does NOT settle criterion 1's open (a)/(b) decision about
      whether the reset SHOULD clear the share — that decision now covers the fallback
      files as well as the keychain, and it is the operator's. The files were deliberately
      left in place on pirria.
    exit_criteria:
      - The probe reports warm when EITHER a keychain entry OR a `~/.cache/tillandsias/fallback_*` share is present, and names which source it found.
      - The probe reports cold only when NEITHER is present.
      - "`could-not-run` still covers the case where either question cannot be asked, and is never read as cold."
      - Metadata only — the probe never reads the contents of a fallback file, the same rule that kept `secret-tool search --all` out of it.
      - A negative control proves the check FAILS when the property is violated.
    unscoreable: |
      unpinnable-until-the-guard-exists: the deliverable IS the guard. Future litmus
      filename: credential-cold-probe-sees-the-fallback. With a `fallback_vault-shamir-share-v1` present and no keychain entry, `scripts/probe-credential-cold-state.sh --format=md` must answer warm and name the fallback file as the source. PRE-FIX RESULT: FAILS — it answers `credential-cold`, measured on pirria 2026-09-13 during the v56.9.12.2 smoke, in the same run whose init log said "preserving existing data volume". NEGATIVE CONTROL the guard must also carry: with no keychain item and no fallback file the probe still answers `credential-cold`, and with a keychain item present it answers warm as it does today, so the existing verdict is not regressed. Write that litmus in the same commit as the probe change (1136-n8sh).
    notes: |
      Companion wording fix, same owned file's caller rather than the probe: the vault
      bootstrap line that reads "Shamir share present in keychain" should say "keychain or
      fallback", since that wording is what made the substitution invisible. Filed here
      because it is the same defect seen from the product side; split it out if the fix
      lands in a different crate.
