packets:
  - packet_id: containers-conf-dns-servers-guard-is-presence-not-content
    order: 926-3vs6
    status: ready
    title: |
      ensure_containers_conf_dns_servers returns early on
      `content.contains("dns_servers")`, so a host whose resolver changed keeps
      the old list forever — and init prints "configuring containers.conf
      dns_servers = [...]" naming servers it then does not write
    kind: bug
    pickup_role: linux
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - provisioning
      - podman
      - dns
      - fail-loud
      - convergence
    estimated_hours: 2
    deliverable: |
      Either init converges the [network] dns_servers line to the detected
      upstream servers, or it declines and says so — but it must never
      announce a configuration it did not perform. Whichever is chosen, the
      decision about who OWNS that line is recorded.
    context: |
      MEASURED on yoga 2026-08-29, while closing 923-rmtw, and it is the same
      defect one function away in the same file at the same call site.

        $ tillandsias --debug --init
        [tillandsias] init: host uses a loopback resolver stub; configuring
          containers.conf dns_servers = ["209.18.47.61", "209.18.47.63",
          "2001:1998:f00:2::1", ...]

        $ cat ~/.config/containers/containers.conf
        [network]
        dns_servers = ["1.1.1.1", "8.8.8.8"]

      The announced servers are the detected upstreams; the file kept a list
      written on 2026-07-08. crates/tillandsias-headless/src/main.rs
      ensure_containers_conf_dns_servers:

        if content.contains("dns_servers") {
            return Ok(());
        }

      A PRESENCE test, exactly like the one 923-rmtw removed from
      ensure_containers_conf_proxy_env next door. Any file that has ever had
      the key keeps its first value forever.

      TWO DEFECTS, and the second is the one that makes this fail-loud work:
        1. IT NEVER CONVERGES. A host whose resolver changed — a new network,
           a different VPN, systemd-resolved reconfigured — keeps stale DNS in
           every container it launches.
        2. IT ANNOUNCES A WRITE IT DID NOT PERFORM. The eprintln! sits at the
           CALL SITE, before the call, and prints the servers it intends. The
           early return is silent. So `--debug` output states a configuration
           that did not happen, which is the same false-success shape 923-rmtw
           found on the proxy line ("proxy env written to …" over a no-op).

      NOT THE SAME DISPOSITION AS 923-rmtw, which is why this is filed rather
      than fixed alongside it. The proxy block was ORPHANED — nothing consumed
      it and removal was provable. dns_servers is live configuration whose
      correct value is a host-policy question: overwriting an operator's chosen
      resolver on every init is a bigger claim than deleting an unused proxy
      block, and 923-rmtw's scope did not authorize deciding it.

      NOT CLAIMED: that yoga's stale DNS has broken anything. 1.1.1.1 resolves
      fine. The measured harm is the false message; the stale-resolver harm is
      latent, and would bite a host on a network that blocks public resolvers.
    exit_criteria:
      - |
        A host whose detected upstream servers differ from the deployed
        dns_servers ends init either converged, or unchanged WITH a message
        saying it declined and why. The current third option — announcing the
        new servers and writing nothing — is gone.
      - |
        The debug message moves to where the outcome is known, so it can
        report a write as a write and a no-op as a no-op.
      - |
        NEGATIVE CONTROL: an operator's hand-set dns_servers is not silently
        replaced without the behaviour being the documented, chosen one.
      - |
        A hermetic fixture covers: no file, file without the key, file with a
        DIFFERENT list, file already matching.
    verifiable_closure: |
      On a fixture HOME whose dns_servers differ from the detected set, init's
      output and the resulting file agree — and a test asserts that agreement
      rather than asserting the file alone.
