packets:
  - packet_id: macos-terminal-attach-renders-corrupt-from-launch
    order: 702-6jza
    status: ready
    desired_release: v0.5
    priority: p1
    title: "macOS attach terminal renders corrupt from launch: row offset, 24x80 birth size, dropped TERM, stderr bleed"
    kind: defect
    deliverable: "crates/tillandsias-host-shell/src/pty/attach_client.rs, crates/tillandsias-macos-tray/src/action_host.rs, crates/tillandsias-headless/src/main.rs, images/default/entrypoint-forge-claude.sh"
    pickup_role: any
    capability_tags:
      - terminal
      - pty
      - macos
      - rendering
    estimated_hours: 5
    context: |
      Operator report, macOS, 2026-08-12: "since launch the terminal isn't
      'fully clean' and it gets overwritten on render, scrolling up and down
      sometimes also messes up a little" plus "there's some screen bleeding".

      A four-lens investigation with independent adversarial verification
      REFUTED three plausible hypotheses and confirmed four real defects. The
      refutations are recorded because they are the expensive part and must not
      be re-derived:

      REFUTED — do NOT "fix" these:
      - PtyOpen is NOT hardcoded 24x80 on the interactive path. The tray gates
        PtyOpen on the attach client's Hello, which carries the window's real
        TIOCGWINSZ geometry (attach_client.rs:136-143, :199, :200-205;
        action_host.rs:1226-1256). Row/col ordering is consistent at every hop
        through vsock_server.rs:1047-1056 and pty_handler.rs:544-557.
      - TERM is NOT `dumb` on the interactive attach; the wire pins
        TERM=xterm-256color / COLORTERM=truecolor / LANG=C.UTF-8
        (pty/mod.rs:277-279). The `rows: 24, cols: 80, TERM=dumb` triple at
        vsock_exec.rs:288/431/672 belongs to the NON-INTERACTIVE one-shot exec
        helpers, which the tray attach never touches.
      - Raw mode is established on the window tty BEFORE any guest byte can
        reach it; both pumps are spawned after cfmakeraw.

      CONFIRMED DEFECTS:

      D1 — ROW OFFSET (most likely the primary cause of the operator's exact
      words). The attach client never clears the screen or homes the cursor:
      MODE_RESET at attach_client.rs:97-98 contains only DECRST
      1000/1002/1003/1006/1007/1049 and DECSET 25 — no ED (\e[2J), no CUP
      (\e[H) — and is written verbatim at :224 and :353. Terminal.app's
      `do script` (terminal_attach.rs:137-140, :289-303) leaves its own login
      banner PLUS the full echoed command line, which is long enough to wrap
      several rows at typical widths (built at :170-178: full exe path + slave
      path + sock path + banner + `exit`). Meanwhile the guest child is
      launched with rows = the ENTIRE window height (action_host.rs:1256). The
      guest therefore believes it owns the screen from row 1 while the session
      actually starts several rows down. Every absolute cursor positioning is
      displaced by that offset — which is precisely "isn't fully clean",
      "gets overwritten on render", and "scrolling up and down messes up".

      D2 — 24x80 BIRTH SIZE ON SLOW ATTACH. action_host.rs:1226 seeds
      `(24,80)` and :1228 waits only 10s for the attach client
      (`timeout(Duration::from_secs(10), listener.accept())`); on timeout
      :1246-1249 logs "no attach client within 10s; launching at 24x80" and
      PtyOpen is sent AT THAT SIZE (:1256-1257). The late-attach lane
      (:1290-1295, 120s accept) only forwards a corrective PtyResize
      afterwards (:1301-1319 -> pty_handler.rs:701-709). podman sizes the
      container PTY at exec time, so everything rendered between PtyOpen and
      the late resize is laid out for 24x80 inside a larger window. A cold
      Terminal.app launch on first click is exactly the case that exceeds 10s.
      Distinguishing signature: D2 self-corrects on the first window resize;
      D1 does not.

      D3 — TERM DROPPED AT THE CONTAINER BOUNDARY (regression). The pinned
      TERM=xterm-256color is lost for the Claude, Codex, Antigravity and
      Maintenance lanes: main.rs:11455-11462 does
      `if !non_interactive_prompt { spec = spec.interactive().tty(); }` and
      nothing in build_forge_agent_run_args_with_vault (11440-11900) sets TERM
      or COLORTERM, so podman injects its default TERM=xterm
      (container_spec.rs:151-156, 320-323 emit --interactive/--tty with no TERM
      default). The 2026-07-27 fix for this exact anomaly was applied ONLY to
      the OpenCode lane — compare main.rs:5203-5219, which explicitly pushes
      --env TERM/--env COLORTERM with the comment "with --tty, podman injects
      its default TERM=xterm unless one is set explicitly". The entrypoint-level
      backstop likewise exists only for OpenCode
      (entrypoint-forge-opencode.sh:164).

      D4 — STDERR BLEED ONTO A LIVE TUI ("screen bleeding", with documented
      history). entrypoint-forge-claude.sh:54 and :58 background
      `ensure_forge_prebuilt_tools >>/tmp/forge-lifecycle.log &` and
      `ensure_forge_harnesses >>/tmp/forge-lifecycle.log &`. `>>` redirects fd 1
      ONLY; fd 2 stays on the container tty, so both jobs write stderr
      concurrently with the foreground entrypoint and, later, with the live
      agent TUI. The tree already documents this hazard twice, including
      lib-common.sh:2046-2049 ("this function is backgrounded by the agent
      entrypoints and shares the TTY with a live TUI").
    outcome: |
      A freshly launched macOS attach terminal renders correctly from the first
      frame: the guest's geometry matches the region it actually owns, the PTY
      is never born at a fallback size a real window contradicts, TERM survives
      the container boundary on every lane, and no background job can write to
      a tty a TUI is drawing on.
    exit_criteria:
      - "D1: the attach client homes the cursor and clears the screen before the first guest byte is pumped (ED+CUP added to the MODE_RESET write at attach_client.rs:224), OR the guest is told the geometry of the region it actually owns. Verify by launching a lane and confirming the session begins at row 1 with no banner above it."
      - "D2: the 10s attach-client wait no longer births the PTY at a fallback size that a real window contradicts — either the child launch waits for real geometry, or the fallback is not used to size a window that is about to be resized. Negative control: a genuinely headless launch with no attach client must still succeed rather than hang."
      - "D3: TERM and COLORTERM are set explicitly for the Claude, Codex, Antigravity and Maintenance lanes as they already are for OpenCode at main.rs:5203-5219. Unit test asserts each lane's run args carry --env TERM; the test must FAIL when the addition is reverted."
      - "D4: the backgrounded jobs in entrypoint-forge-claude.sh redirect stderr as well as stdout (>>log 2>&1), and a check refuses a backgrounded invocation in an agent entrypoint that redirects only fd 1."
      - "Each of D1-D4 is falsified by hand before closure: reverting the individual fix must reproduce its symptom or fail its test. A blanket 'terminal looks better' observation does not close any of them."
    events:
      - type: filed
        ts: "2026-08-12T18:39:19Z"
        host: macos
        summary: |
          Filed from a live operator report. Four-lens investigation with
          independent adversarial verification per finding: three plausible
          hypotheses REFUTED (24x80 PtyOpen, TERM=dumb, late raw mode — all
          belong to the non-interactive exec path or are already correct) and
          four defects CONFIRMED with line-level evidence. D1 is the best
          explanation of the operator's exact wording; D2 is distinguishable
          from it by whether a window resize self-corrects the display.
