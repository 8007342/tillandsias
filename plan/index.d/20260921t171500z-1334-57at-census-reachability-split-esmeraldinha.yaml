    verifiable_closure: |
      scripts/census-litmus-step-enforcement.sh prints ENFORCED-REACHABLE and
      ENFORCED-INERT as separate lines; the closure figure names the REACHABLE
      count; and scripts/test-census-enforced-reachability-split.sh pins by
