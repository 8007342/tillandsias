        summary: |
          Filed as the reduction step for 599-3b9h criteria 2-3: every prerequisite is staged and re-verified, but the reads depend on an attended watcher because no unattended lane-launch surface exists on Windows. Converting the watcher into a lane-startup self-record makes the first lane launch on ANY platform deliver the measurement durably. Aligned with the 2026-08-16 operator directive to cover experts/forge reliability for both bare-metal and in-forge lifecycles.
