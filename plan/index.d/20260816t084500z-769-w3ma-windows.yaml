    title: |
      Lane startup self-records the accel envelope and a token-absence verdict, so 599-3b9h-class reads never need a watcher.
    context: |
      599-3b9h criteria 2-3 (accel envelope first line = cpu-only; env grep for
      GH_TOKEN/GITHUB_TOKEN/HOMEBREW_GITHUB_API_TOKEN = nothing, the first
      post-82160687 measurement on Windows) have been ready since 2026-08-11
      with every prerequisite staged (re-verified 2026-08-16: guest
      v0.4.260815.1, vault+proxy healthy) — blocked ONLY on "one exec, two
      greps, recordable by whoever is watching that session", because the
      Windows tray has no unattended lane-launch surface (FULL smoke
      2026-08-16: forge --opencode "N/A on Windows"). "Whoever is watching" is
      the guard-by-attentive-agent pattern this project forbids. The lane's
      startup context (images/default/lib-common.sh, "Accelerators" line)
      already renders the OBSERVED envelope agent-facing; it is not persisted
      anywhere a later cycle can read. The claim side (headless
      main.rs .env(TILLANDSIAS_ACCEL_ENVELOPE, ...)) must stay distinct from
      the observed side — the measurement exists to catch drift between them.
    exit_criteria:
      - |
          At lane startup, the forge entrypoint appends exactly one machine-parseable line to a log that OUTLIVES the lane container (the guest-side forge lifecycle log, or an equivalently durable guest path): lane-observed: agent=<id> accel_class=<value|unknown> tokens=<none|comma-separated-names-found>. The token check greps the lane's OWN environment for GH_TOKEN, GITHUB_TOKEN, HOMEBREW_GITHUB_API_TOKEN; names only, never values.

      - |
          A litmus test executes the emitting code path against a fixture env (envelope present/absent; a planted fake token name) and pins the line grammar and the never-fails property (emission failure must not block lane startup).

      - |
          599-3b9h's two deferred reads become: read the first lane-observed: line for this host after the first real lane launch. Record that consumption path as a progress event on 599-3b9h when this lands.
