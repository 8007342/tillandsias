        MEASURED FOR 1004-vsh2 WHILE HERE, on a real cmdkey, so the fallback packet has evidence rather than a reading of the code: `cmdkey /list:<target>` ECHOES the target in its header line ("Currently stored credentials for <target>:") even when the body is "* NONE *". So `$listed -match [regex]::Escape($cred)` is TRUE for every target, existing or not - the delete guard always fires (harmless no-op) and the §2 verifier always throws. Esme's report is confirmed and the mechanism is the header. CAVEAT recorded so nobody lands the obvious fix: testing for absence of "* NONE *" is LOCALE-DEPENDENT, as is the header string, so an English-text predicate trades a bug that fails on every run for one that fails only on some operators' machines. The fix must exclude the header rather than match localized body text, or avoid localized text entirely. Not settled here.
