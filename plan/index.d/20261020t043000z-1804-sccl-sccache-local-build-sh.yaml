    title: |
      build.sh exports RUSTC_WRAPPER=sccache when `sccache` resolves on PATH (opt out TILLANDSIAS_NO_SCCACHE=1; an explicit RUSTC_WRAPPER wins), with SCCACHE_DIR defaulting to ~/.cache/tillandsias/sccache so the operator's bind mount (1805-relo) puts it on the fast root without any env change, and prints one `sccache: on|off …` line; macuahuitl measured cold vs warm and found the cache key includes the absolute target directory
    context: |
      MEASURED on macuahuitl 2026-10-20 (20 cores, 62 GB, cache and target
      dirs on the NVMe RAID0, sccache 0.18.0 installed into ~/.cargo/bin,
      which the builder toolbox shares). cargo build --release -p
      tillandsias-plan (the gate's plan binary; lto=true, codegen-units=1):
        fresh target, no wrapper                       68 s
        fresh target, sccache populating (clean run)   80 s   (0 hits, 244 Rust misses)
        fresh target at the SAME path, warm            34 s   (276 hits, 100% Rust)
        fresh target at a DIFFERENT path, warm         96 s   (0 Rust hits, 32 C hits)
      The gate's own regime (1599-egzz touches every tracked file, so
      workspace units rebuild from the same bytes): touched rebuild of the
      release plan binary 48 s without, 32 s with sccache (6 hits of 10
      requests; the remainder is the LTO link, uncacheable).
      cargo test -p tillandsias-plan --no-run: 26 s cold without, 33 s
      populating, 23 s warm at the same path (275 hits) — the dev/test
      profile is incremental for workspace crates, which sccache passes
      through, so the test build gains little.
      FINDING: the Rust key includes the absolute target directory. The
      same commit into another CARGO_TARGET_DIR is a 0% miss. On this host
      every worktree under target/work/<name> has its own target/, so
      sccache does NOT make a new worktree's first build warm; it repays a
      clean of the same target, a toolchain bump, and the touched release
      units of every gate. Cross-worktree or cross-host hits need one
      canonical target path on both sides (1806-lanc).
      One run of plan-cold-sccache taken while a preflight ran beside it
      measured 109 s and is discarded as contaminated; the 80 s is the
      clean repeat.
    exit_criteria:
      - "./build.sh --preflight 2>&1 | grep -c '^sccache: ' prints 1 on a host with sccache on PATH and the line says on; with TILLANDSIAS_NO_SCCACHE=1 the line says off; pre-fix result: FAILS (0 lines, build.sh never sets RUSTC_WRAPPER)"
      - "with the cache warm, cargo build --release -p tillandsias-plan into a fresh target dir at the same path reports Cache hits rate (Rust) 100% in sccache --show-stats and finishes in half the no-wrapper time (34 s vs 68 s on macuahuitl); pre-fix result: FAILS (no wrapper, no stats)"
    unscoreable: "the timings are host measurements; the scoreable part is the build.sh line and the sccache stats, both read on the host"
    verifiable_closure: "./build.sh --preflight 2>&1 | grep '^sccache: on' on macuahuitl, then sccache --show-stats after a warm same-path build"
    next_action: >
