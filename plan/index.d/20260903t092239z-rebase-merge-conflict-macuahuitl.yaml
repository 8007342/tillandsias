    title: |
      integration_strategy sanctions rebase for same-branch catch-up while pre_push_gate mandates merging linux-next before every platform push, so the set to be rebased is guaranteed to contain merge commits.
    context: |
      FOUND by macbook-macos using the landing script on osx-next, with two
      macOS hosts landing concurrently.
      THE TWO RULES, each correct alone. methodology multi-host-development
      integration_strategy case 1 says: for SAME-branch catch-up, rebase your
      unpushed local commits onto origin/<same-branch>, then gate. And
      pull_merge_cadence.pre_push_gate says: before EVERY push of a
      non-linux-next branch, merge origin/linux-next and resolve locally.
      HOW THEY COMPOSE: obeying the second fills your unpushed set with MERGE
      COMMITS BY MANDATE. Obeying the first then rebases those onto a moved
      remote, which replays them and conflicts immediately.
      MEASURED: osx-next diverged 35 and 3, refused:land:rebase-conflict every
      attempt, while a plain merge landed first try - verified by macbook the
      way the script does, git merge-base --is-ancestor HEAD origin/osx-next,
      ok:landed:08dad5fcd.
      NOT A SCRIPT BUG. The script was faithfully implementing case 1. The
      script is patched to merge when the unpushed set carries a merge commit
      and to fall back to merge rather than refusing, which unblocks the fleet
      today; THE RULE INTERACTION IS STILL THERE and will bite anyone who
      hand-rolls case 1 on a platform branch, which is what the methodology
      currently tells them to do.
      WHY IT SURFACED ONLY NOW: it needs TWO hosts landing on the SAME platform
      branch concurrently. One host is never diverged, only behind. That is
      987-p5x9 family one again - invisible until you need two of something -
      and this is its sixth instance.
      NOT EDITING THE METHODOLOGY: durable process claims are operator-gated,
      so this proposes the clarification rather than making it.
    exit_criteria:
      - integration_strategy case 1 states what to do when the unpushed set contains merge commits, or says explicitly that merge is the strategy on platform branches
      - whichever wording lands is consistent with pre_push_gate rather than merely adjacent to it - the two rules are read together or not at all
      - the guidance is checked against a real two-host concurrent landing, not reasoned about
      - any other tool or runbook implementing case 1 by hand is found and reconciled
