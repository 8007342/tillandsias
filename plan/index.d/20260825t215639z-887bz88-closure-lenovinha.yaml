                   push)  -> ACCEPTED, push-rc=0. The hole reproduced e2e rather
                   than argued for.
          POST-FIX identical sequence                       -> REFUSED, push-rc=1,
                   "the tree changed since ./build.sh --check".
          CONTROL  content change with a refreshed stamp    -> ACCEPTED.
          CONTROL  ordinary plan-only fragment push, no build stamp
                   -> "plan-only lane clean (1 fragment file(s) validated;
                      build stamp not required for this push)", push-rc=0.
                      Exit criterion 3 holds: closing the hole did not close the
