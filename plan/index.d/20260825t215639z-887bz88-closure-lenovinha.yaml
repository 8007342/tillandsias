  - packet_id: a-mode-only-regression-reached-the-trunk-past-the-only-gate
    event:
      type: note
      ts: "2026-08-25T22:05:00Z"
      agent_id: lenovinha-opus5-metaorch-20260825t213705z
      host: lenovinha
      summary: |
        ANSWERING EXIT CRITERION 1 — the lane is NEITHER (a) NOR (b) as written.
        It is a third mechanism: TWO BLIND SPOTS COMPOSED, and neither alone
        would have done it. Reported by the host that CAUSED the regression, so
        this is the sequence itself, not a reconstruction.

        (a) THE PLAN-ONLY FAST LANE IS RULED OUT. The push carried scripts/ and a
        plan fragment, so the lane's own classifier never applied. Confirmed by
        negative control below: an ordinary plan-only push still takes the lane.

        (b) IS HALF RIGHT, AND THE HALF IT MISSES IS THE POINT. The packet asked
        "whether its drift detector sees st_mode at all". It does not —
        gate-stamp.sh compute() hashed path + kind + CONTENT and nothing else.
        But a stale stamp alone would not have mattered, because the chmod
        happened BEFORE the gate ran, not after. The actual chain:

          1. `mv` over the script during an edit dropped the exec bit in the
             WORKING TREE. The index still said 100755 — nothing was staged yet.
          2. `./build.sh --check` ran. check-script-exec-bits.sh reads the INDEX
             (`git ls-files -s`), saw 100755, and PASSED. The guard that exists
             for exactly this defect was looking at the wrong view. The gate then
             stamped the tree.
          3. `git add` wrote 100644 into the index. That changed no BYTES, so the
             content-only stamp stayed fresh.
          4. The pre-push hook verified a fresh stamp and accepted.

        So the ordering matters and is structural, not accidental: the skill runs
        the gate at Finalization step 4 and stages at step 5. Any mode change
        introduced by an edit is worktree-only when the gate looks, and invisible
        to the stamp once staged. Every host runs that order every cycle.
  - packet_id: a-mode-only-regression-reached-the-trunk-past-the-only-gate
    event:
      type: implemented
      ts: "2026-08-25T22:10:00Z"
      agent_id: lenovinha-opus5-metaorch-20260825t213705z
      host: lenovinha
      summary: |
        Both blind spots closed, because closing either alone leaves the hole
        reachable by the other route.

        1. scripts/gate-stamp.sh — the file frame now carries an exec-bit field
           (`file\0<path>\0<x|->\0<digest>`). Any chmod moves the stamp, so the
           hook refuses and the gate re-runs; by then the mode IS staged, so the
           index arm sees it too. This CHANGES THE FRAME: every existing stamp
           goes stale once and the next `./build.sh --check` on each host writes
           a current one. Self-healing, one re-run per host, and the header's
           now-false "frames are BYTE-IDENTICAL" claim was corrected in place.
           `core.filemode=false` hosts are unaffected (git ignores the bit there,
           so no regression can originate from one).

        2. scripts/check-script-exec-bits.sh — a candidate is condemned if EITHER
           the index OR the worktree says non-executable, gated on
           core.filemode so Windows checkouts do not report every script as a
           violation. The worktree arm is what makes the failure land at gate
           time, before staging, which is the only point with cheap feedback. The
           index arm stays: it is what makes a pristine clone of a red trunk
           report red. The remedy line now branches — `chmod +x` for a
           worktree-only case, `git update-index --chmod=+x` for an index one.
           Printing the index remedy for a worktree regression would have told
           the reader to STAGE the broken mode.

        Also corrected scripts/test-script-exec-bits.sh, whose `executable-bare-ok`
        scenario set the index mode with `update-index --chmod` while leaving the
        file 644 on disk — an index/worktree split real git never produces, since
        checking out a 100755 entry materializes an executable file. The fixture
        was asserting on an impossible tree; it now materializes the mode it
        declares. 14/14 scenarios still green, same pinned line.
  - packet_id: a-mode-only-regression-reached-the-trunk-past-the-only-gate
