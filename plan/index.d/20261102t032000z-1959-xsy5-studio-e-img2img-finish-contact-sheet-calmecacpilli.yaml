  context: |
    demon_attack needs an empty centre lane in every layered ship part and a near-black navy palette; kumbia-kombat finishes one accepted high-res frame once per room at native size. Both start from previous frames or rig renders. openspec/changes/studio-asset-pipeline design D11 (img2img, inpaint, layout: sd.cpp --init-img/--mask/--strength; studio $init_image/$mask/$layout_mask/$strength; kept pixels composited back), D12 (finish: alpha, nearest-neighbour grid snap, palette quantise, fixed encoder, integer arithmetic, .finish.json), D13 (contact sheet with embedded bitmap font and .contact.json). Spec: specs/imagegen-studio/spec.md, the three E requirements. Schema: contract/family-spec.v1.schema.json gains layout, finish, palette file format, reserved_regions_empty.
  exit_criteria:
  - image.generate on an sd.cpp tier passes --init-img, --mask and --strength, and every pixel under a black mask or inside a reserved region is byte-identical to the input
  - studio.run_workflow binds the same keys and refuses workflow_has_no_input:<name> before queueing
  - studio.finish_pixels writes the same sha256 twice and matches a committed golden; studio.validate_family refuses palette_contains_outline and reserved_regions_empty
  - studio.contact_sheet writes a labelled grid and a .contact.json that resolves every cell to an output and a provenance path
  verifiable_closure: |
    cargo test -p tillandsias-headless pixel_finish contact_sheet imagegen_init_mask passes, including the twice-run sha256 equality and golden-sha256 tests of D12 and the kept-pixel identity test of D11.
