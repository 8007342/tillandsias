    order: 1847-5xv3
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    release_target: fleet-coordinator-warm-cache-milestone
    pickup_role: linux
    capability_tags: [forge, coordinator, opencode, bash]
    estimated_hours: 5
    owned_files:
      - images/default/lib-common.sh
      - scripts/forge-run-queued-task.sh
      - scripts/test-forge-run-queued-task.sh
    title: |
      When the 1828 "what's next" answer at forge start is a queued task addressed to an agent lane (payload names skill + args, lane=opencode), the forge claims it, runs that lane headless with a prompt naming the project's skill, waits to completion, reports done/failed with the agent's last line back to the queue, and the forge exits so the launcher closes it — and an unclaimable or absent task changes nothing about an interactive start
    context: |
      Operator request 2026-10-24: the website update is a dogfood test, so
      the agent doing it must be NON-CLAUDE (the forge's OpenCode lane or
      another model), launched with an ephemeral checkout, run to completion,
      then the forge closed.
      EXISTING CAPABILITY REUSED, do not rebuild:
        - ephemeral checkout: `tillandsias --cloud <owner/repo>` already
          resolves an ephemeral project with host disk untouched (exercised in
          776-jcf3's 2026-10-18 progress event).
        - headless prompting: `--opencode --prompt "<text>"` is parsed by
          crates/tillandsias-headless (the `--prompt` argv handling) and is
          what smoke-curl-install-and-test-e2e and
          scripts/litmus-opencode-e2e-launch.sh already drive.
        - claim/report: the 1826 client's claim and done verbs; the start hook
          is 1828's coordinator_join_at_start.
      New is only the glue: a task payload {kind: skill-run, skill, args,
      lane} → claim → exec the lane with prompt "Use the /<skill> skill
      <args>; finish with its last-line grammar" → report → exit status.
      A non-Claude lane is enforced: payload lane must be opencode (or a
      future non-claude lane); lane=claude is refused with
      refused:task-lane-must-be-non-claude so the dogfood cannot silently
      fall back. Timeouts bound the run (payload max_minutes, default 90);
      a timeout reports failed:timeout and still exits.
    exit_criteria:
      - 'stub coordinator returns a skill-run task (lane=opencode, skill=update-website), stub opencode on PATH records argv and prints ok:refreshed:v1: the script claims, invokes opencode with a prompt containing "/update-website", reports done with "ok:refreshed:v1", and exits 0 (pre-fix result: FAILS — script absent, no claim)'
      - 'same task with lane=claude: no agent exec, report failed with refused:task-lane-must-be-non-claude (pre-fix result: FAILS — script absent)'
      - 'stub agent sleeps past max_minutes (scaled for test): report failed:timeout, exit non-zero, no orphan child (pre-fix result: FAILS)'
      - 'next returns no task: script exits 0 printing no-task and the interactive start path is unchanged (pre-fix result: PASSES vacuously — recorded)'
