      summary: |
        A BIGGER EMBEDDER MAKES SEPARATION WORSE, NOT BETTER. The operator's
        model-size question, finally answerable now that 849-tz8g turned out to
        be my own error, is answered NO.

        Same 561 questions, same relabelled ground truth, full index rebuilt
        with each model, quiet GPU:

                              nomic-embed-text   bge-m3
                              137M / 768-dim     567M / 1024-dim
          band overlap        0.2058             0.2513
          margin overlap      0.1104             0.1222
          in-corpus floor     0.5620             0.4753
          near-miss ceiling   0.7677             0.7266

        Four times the parameters and a third more dimensions, and the bands
        overlap MORE. That is consistent with everything else measured here: a
        scalar similarity cannot express "does this passage answer the
        question", and embedding the wrong axis more precisely does not fix the
        axis. It also closes the last cheap hope for the threshold approach.

        CAVEAT, stated because it bounds the claim: neither index used
        model-specific query/passage prefixes, and nomic-embed-text in
        particular documents `search_query:` / `search_document:` prefixes. Both
        models were used the same way, so the COMPARISON is fair, but neither
        number is that model's best possible showing. This refutes "a bigger
        embedder rescues the threshold", not "bge-m3 is a weak model".

        TWO DEFECTS FOUND IN MY OWN DELTA RE-EMBED WHILE SETTING THIS UP, both
        shipped yesterday:

        (1) THE CACHE KEY OMITTED THE MODEL. content_hash is hash_hex(span) —
        the text and nothing else (spec.rs:1020) — so a chunk keeps its hash
        under every model and the delta handed nomic vectors to a bge-m3 build:
        reused=20919 of 21028, 768-dim vectors spliced into a 1024-dim index.
        The identity assertion CAUGHT it and refused, which is the net working
        exactly as designed — but reuse-then-refuse made building with any
        other embedder impossible, which is why this experiment could not run
        until now. Generations now record their model in `.model`, and one
        without the marker is never reused: conservative, costs one rebuild per
        model once, self-heals.

        (2) "endpoint-refused" WAS BLAMING THE NETWORK FOR 849-tz8g. A nomic
        rebuild failed with blocked:spec-index:embed-endpoint-refused purely
        because a bge-m3 build minutes earlier had left its model resident;
        unloading made the identical command succeed. That message sends the
        reader to the proxy and the CA bundle — the wrong half of the system.
        It now lists the resident models and names the order. Verified RED with
        the real condition (qwen3-embedding:4b + bge-m3 resident, 7,910 MiB,
        nomic evicted) rather than assumed.

        BOTH ARE THE SAME SHAPE AS THE FEATURE THEY LIVE IN: a delta that
        reports reused=0 looks like a corpus with nothing to reuse, and an
        endpoint error looks like an endpoint. The measurement was always
        available; only the attribution was wrong.
