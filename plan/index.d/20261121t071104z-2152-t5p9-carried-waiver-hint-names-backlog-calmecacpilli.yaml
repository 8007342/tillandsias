    title: "land-queue's paid-but-taken eviction hint names the backlog, so the waiver it tells you to write is admitted"
    context: |
      On refused:carried:paid-but-taken-by:<ref>:<item>, land-queue read field 3 of the verdict as the backlog and told
      people to write `Carried-Waiver: paid-but-taken-by <reason>`. The guard keys waivers by BACKLOG name (shell-to-lua),
      so that line was never admitted. The guard now prints the waiver as its own column-0 line,
      `Carried-Waiver: <backlog> conflict:<item> (#<pr>)`, which land-queue copies into its hint. land-queue also stops
      reading the backlog from the verdict when the verdict is paid-but-taken-by.
    exit_criteria:
      - "test-carried-obligations.lua arm 'PAID-BUT-TAKEN hint' finds a column-0 `Carried-Waiver: shell-to-lua conflict:...` line; on the trunk guard it finds none (hint=nil)."
      - "arm 'PAID-BUT-TAKEN remedy' commits that copied line verbatim as a trailer and is admitted (waived, exit 0); on the trunk guard it stays refused."
    unscoreable: "decider-not-litmus: scored by scripts/lua/test-carried-obligations.lua, which build.sh runs on every --check."
    next_action: "Land."
