packets:

  - packet_id: lww-channel-naming-obscures-field-correction
    order: 642-fedr
    status: ready
    desired_release: v0.5
    priority: p2
    title: "The only path to correct a non-status field is a channel named `status:`, and the README reads as if none exists"
    kind: enhancement
    deliverable: plan/index.d/README.md
    depends_on: []
    pickup_role: linux
    capability_tags: [plan, crdt, ledger, docs, developer-experience]
    context: >
      fragments.rs keys the LWW register on `{packet_id}\u{1}{field}` and applies
      it to ANY field — the channel is merely NAMED `status:` and its entries
      carry an explicit `field:` key. So a pickup_role correction through
      `status: [{field: pickup_role, ...}]` is valid, and was used this cycle to
      close 635-qpx8 (verified: folded value changed, Windows claimable queue
      7 -> 6).

      plan/index.d/README.md says "Only `status` fields are last-writer-wins",
      which reads as *only the status field*. Combined with 627-c9c2 (never edit
      plan/index.yaml directly — the base is a concurrency block AND the mirror's
      pre-receive Psych gate rejects any push touching it), the documented model
      says a mis-filed pickup_role, priority, depends_on or title can never be
      corrected at all.

      This cycle came one step from filing that as a structural defect of the
      ledger. The real cost of the misreading is an agent either filing a phantom
      defect or reaching for the one thing that IS forbidden — a direct base edit.
    exit_criteria:
      - >
        The channel is renamed `fields:`, with `status:` retained as an accepted
        alias so every fragment already written keeps folding identically.
      - >
        plan/index.d/README.md states the rule as "the fields: channel is
        last-writer-wins per (packet_id, field); events are a set", and carries at
        least one NON-status example.
      - >
        cheatsheets/concurrent-git/crdt-ledger-fragments.md agrees with the README.
    verifiable_closure: >
      A litmus asserts that a fragment correcting a non-status field via `fields:`
      and the same fragment via `status:` produce identical folds, and that the
      README contains a non-status example.
    notes: >
      No fold behaviour changes — the LWW key already includes the field name.
      This is naming and documentation only, which is why it is p2 and not p1.
    events:
      - ts: "2026-08-09T23:20:00Z"
        event: filed
        summary: >
          Found while closing 635-qpx8 from the windows lane. Full write-up:
          plan/issues/lww-channel-named-status-hides-field-correction-2026-08-09.md

