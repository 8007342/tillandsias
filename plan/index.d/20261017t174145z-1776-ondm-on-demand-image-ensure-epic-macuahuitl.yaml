    title: |
      `ensure_image_exists` records a failure marker keyed on (image, source digest) under the init cache dir after a failed build, and while the marker matches the current identity every ensure refuses within seconds with `refused:image-ensure:<image>:build-failed-previously`, the first failure's cause, the log path and the remedy — no podman build spawned; automatic retry after 10 min, then 1 h, then operator-only; the marker clears when the digest changes, on success, or on `tillandsias --retry-image <name>` / the tray's "Retry build" (forced rebuild, foreground); every decision prints one verdict line with both digests; `IMAGE_BUILD_REMEDY` stops saying "retried on each launch"
    context: |
      SOURCE READ (2026-10-17): nothing remembers a failed on-demand build.
      `IMAGE_BUILD_REMEDY` says the build "is retried on each launch";
      `toolchain_exec::prepare` retries after reporting once; the tray's
      forge launch calls `ensure_image_exists` on every click. A Containerfile
      that cannot build (1771-4iw3's stalled index, a vanished pin, a full
      disk) therefore costs minutes of host CPU per launch, per click, per
      MCP call. `InitBuildState` has `failed` entries but only --init writes
      or reads them.
      DESIGN: marker file `init_cache_dir()/image-ensure-failures/<image>.json`
      {image, source_digest, attempts, first_failed_at, last_failed_at,
      next_retry_at|null, cause (the `describe_image_ensure_failure` text),
      log}. Checked after identity, before the decision; re-checked by the
      helper under the flock (a lock waiter must see the winner's marker).
      A dependent (forge) refuses with forge-base's marker and writes none
      of its own. A disk refusal (1776-d5k2) writes no marker.
      VERDICT LINE: `[tillandsias] image-ensure <name> decided=<action>
      digest=<identity> present=<label|none> reason=<reason> marker=<none|n>`
      — the instrument 1775-8tx5 lacked; that row keeps its own fixture.
      The forced path reuses `ImageBuildAction::ForceRebuild`, which
      `decide_image_build` already has.
