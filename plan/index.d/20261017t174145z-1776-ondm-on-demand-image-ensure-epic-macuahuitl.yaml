# Filed by macuahuitl, 2026-10-17, from the operator's live finding: an agent
# in a forge asked for a browser window and the tray said the
# chromium-framework image was missing (the tray never ran --init).
# Operator direction (verbatim intent): "Container launch should create
# missing images/containers on demand … Make it robust: actual build failures
# must NOT keep retrying and kill host resources."
# Epic 1776-ondm and its five children.
# Change: openspec/changes/on-demand-image-ensure/ (proposal, design, tasks,
# spec deltas on-demand-image-ensure and containerfile-staleness).
# Code is cited by symbol, never by line.
packets:
  - packet_id: every-container-launch-ensures-its-image-through-one-seam-that-builds-a-missing-image-once-under-a-lock-remembers-a-failed-build-by-its-inputs-digest-and-refuses-fast-instead-of-rebuilding
    order: 1776-ondm
    status: ready
    kind: epic
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [images, image-build, on-demand, forge, browser, vault, tray, low-end-hosts, epic]
    estimated_hours: 4
    related: [1770-z575, 1771-4iw3, 1775-8tx5, 1744-xjfw, 1502-utcy, 1656-tjv4]
    owned_files:
      - openspec/changes/on-demand-image-ensure/
    title: |
      EPIC — every container launch (tray, CLI, forge MCP) ensures the image it is about to run through the ONE seam `ensure_image_exists` (present and current → go; missing or stale → build exactly once under the per-image lock, deps first, bounded in disk and CPU/IO, visible in the tray); a failed build is remembered by (image, inputs digest) and every later launch refuses within seconds with the cause and a named remedy until the inputs change or the operator retries; today the forge's first browser.open dies on a missing chromium-framework image and a Containerfile that cannot build is rebuilt by every launch
    context: |
      LIVE (operator, 2026-10-17): a forge agent's browser window request was
      refused "chromium-framework image missing". The tray had never run
      --init; the forge launch (`run_opencode_mode`) ensures only proxy,
      router, git, inference, forge.
      SOURCE READ (macuahuitl, 2026-10-17, headless crate): the mechanism
      mostly exists in `main.rs` `ensure_image_exists` — per-image flock
      (`resource_lock`, 900 s), detached helper (`--internal-ensure-image`),
      content identity over the whole build context (`image_identity` →
      `compute_image_build_identity`), dependency recursion
      (`image_dependency`: forge→forge-base, chromium-framework→chromium-core),
      downgrade guard. The gaps are coverage and memory:
      (1) `browser_open.rs` `TrayBrowserContainers::start`'s Chromium branch
      starts `forwarder_spec` and the window from
      `tillandsias-chromium-framework:v<VERSION>` with pull_never and NO
      ensure; its WebKit branch (`start_webkit`, 1656-tjv4) does ensure on
      first use with a notice — the precedent.
      (2) Four inline ensure arrays have drifted (`run_opencode_mode`,
      `run_opencode_web_mode`, `ensure_enclave_for_project`,
      `run_status_check`).
      (3) `vault_bootstrap.rs` `build_vault_image` is a second mechanism
      (identity + build, no lock, no detach); `toolchain_exec.rs` `prepare`
      is a third and "a failed build is reported once, then a later call
      retries".
      (4) Nothing records a failed on-demand build; `IMAGE_BUILD_REMEDY`
      says "the build is retried on each launch". `InitBuildState` records
      `failed` for --init only and the launch path never reads it.
      (5) `free_bytes_at` exists but only DESCRIBES a failure (1744-xjfw);
      nothing checks space before a build; no CPU/IO bound wraps the build.
      (6) 1775-8tx5 (yoga) measured a stale forge image reused under one
      version string; the content identity should have rebuilt it and the
      launch printed nothing to show which digest it decided on.
      DESIGN (binding on every child): ONE seam; a refusal names
      `refused:image-ensure:<image>:<why>` with log and remedy; a failure
      marker keyed on (image, source digest) with backoff 10 min / 1 h /
      operator-only; the marker clears on digest change, on success, or on
      `tillandsias --retry-image <name>` / the tray's Retry; a disk refusal
      records NO marker; builds run under systemd-run --user weights or
      nice; every decision prints one verdict line with both digests;
      --init is unchanged and clears markers for what it rebuilds.
      NOT PRE-BUILDING chromium in `run_opencode_mode`: the operator's
      low-end-host ruling is to never build what the session may not use;
      first browser.open builds it, visibly, once.
      PICKUP BY PLATFORM: all children are Linux-first (the headless crate;
      the macOS and Windows guests run the same code inside the VM). A
      macOS or Windows host can take 1776-brk3 and 1776-pr0g (pure
      Rust + Lua fixtures over a podman shim, no live podman needed);
      1776-ch4m, 1776-v1t4 and 1776-d5k2 want a Linux host with podman for
      their live arms.
    children:
      - 1776-ch4m
      - 1776-brk3
      - 1776-v1t4
      - 1776-d5k2
      - 1776-pr0g
    exit_criteria:
