      The `macos` arm is a COMPILE-TIME cfg selecting a runtime capability
      claim. The guest is linux-aarch64, so in the guest that arm is compiled
      OUT and can never execute — while on a macOS HOST the binary that carries
      it is not the binary that answers for the guest's accelerator. A tier
      reported from `cfg!(target_os)` describes where the code was BUILT, not
      what the running machine can do.

      This is the same register as the night's other findings: a value that is
      true about the artefact and false about the property it names. It needs no
      sidecar lane and does not wait on 657-zm2n's dependencies.
