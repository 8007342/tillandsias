  context: >-
    The darwin fixture pins the enriched "boot loader is invalid" text: with a VM helper holding nvram.bin, a second start must fail naming
    the holder and steering away from --reset-guest (arm 2), a SIGKILLed tray must leave no helper (arm 1), and the image must start again (arm 3).
    Arm 0 guards the explainer in vz.rs on every host. The port keeps the arms, their order, the verdict lines and the subject/image clauses.
    PORT FINDING: proc.spawn makes its child a process-group leader and kills that group when the leader exits, so a helper sharing the
    tray's group died with it and a first port read green on the outlive mutant the .sh reds. A bare setsid did not fix it, because the
    new group's id is the leader's own pid. The port launches the live tray through a perl fork plus setsid, so its group is one the
    spawned leader never owned. The litmus steps now call the .lua and no longer pipe into grep.
