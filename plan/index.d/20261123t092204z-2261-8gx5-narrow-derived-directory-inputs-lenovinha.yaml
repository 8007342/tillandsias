      - "(4) a fixture may DECLARE its inputs (`# inputs: <paths>` / `-- inputs: <paths>` in its header, or STEP_INPUTS on its .step); the selector trusts the declaration over the derived directory-wide read, and a decider refuses a declaration that misses any literal repo path the file names"
