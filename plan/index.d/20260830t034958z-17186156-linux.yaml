      STATE 2026-08-30 (lenovinha). THE ENUMERATION REDESIGN IS BUILT, WIRED AND LANDED. TWO CRITERIA REMAIN AND BOTH NEED A WINDOWS HOST — do not attempt them from Linux.

      LANDED: DRM render-node enumeration (PCI vendor+device, bound kernel driver), a Vantage axis (host vs container), a Proof axis (Enumerated/Reachable/Placed with proves_a_lane() matching Placed alone), the two pinned INDEPENDENT, and the AMD arm no longer claiming a container lane it cannot prove. Nine tests, fixture-based, four mutation-verified.

      REMAINING 1 — CRITERION 1 AND THE WSL2 HALF OF CRITERION 3 ARE ONE TASK, ON A WINDOWS HOST. /dev/dxg is not a DRM device and creates no render node, so nothing on the WSL2 path enumerates and the software-rasterizer rejection has nothing to reject in. It needs a Vulkan ICD installed, Vulkan enumeration added, and PHYSICAL_DEVICE_TYPE_CPU / DRIVER_ID_MESA_LLVMPIPE rejected. Yolanda declined to install the ICD and was RIGHT to — provisioning the operator's machine to make a criterion pass is not evidence — so whoever takes it should treat installing it as a deliberate, recorded act, not a side effect.

      REMAINING 2 — THE PROOF RUNGS ARE MODELLED BUT INERT. Nothing currently produces Reachable or Placed. Reachable wants a stat from INSIDE the container: images/inference/entrypoint.sh already does exactly this (`[ -e /dev/nvidia0 ]` before accepting a cuda tier) and is the working precedent. Placed wants a runtime's residency — ollama /api/ps size_vram. Until something produces them the model is honest but does no work, and an honest model that does nothing is only half the fix.

      DO NOT MOVE legacy_tier WITHOUT TELLING YOGA. With their passthrough branch live it is what makes dev-inference-ensure.sh pass their device nodes at all; moving it silently strips them. One-line coupling, but a live one.

      FIELDS ARE STABLE for yoga's hwfp-v2 schema bump: vendor_id: u16, device_id: u16, driver: String, node: String, plus vantage and proof. Use vendor_id AND device_id TOGETHER — 0x1638 is BOTH yoga's Krackan 840M/860M AND this host's Cezanne, so device id alone would call one machine the other; vendor alone collides across every AMD part.

      THE CLASS THIS PACKET NOW CARRIES, worth reading before touching any probe: A LABEL THAT SUBSTITUTES FOR THE WIRING IT NAMES (yoga's framing). Four measured instances. And the two rules the fleet paid for: PROVEN BY WHAT CAN BE STATTED FROM WHERE THE WORK HAPPENS, and — because a stat is not enough — ONLY PLACEMENT PROVES A LANE. A stat proves the device is reachable; a lane needs a runtime that can drive it. Those are different questions, not degrees of one.
