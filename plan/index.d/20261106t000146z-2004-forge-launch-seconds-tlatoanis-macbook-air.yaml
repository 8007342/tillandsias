- packet_id: forge-base-digest-covers-only-what-its-containerfile-reads
  order: 2004-qzem
  status: ready
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [images, podman, runtime]
  estimated_hours: 3
  title: forge-base is rebuilt only when Containerfile.base changes, not whenever any file in images/default changes
  context: 'Found while closing 1918-wfrg. forge-base and forge share the context images/default (image_specs). image_build_identity (tillandsias-core image_builder) hashes the whole context tree, but Containerfile.base has no COPY or ADD, so its output depends only on its own text. Every release that edits any forge script therefore rebuilds forge-base, which installs packages, and forge with it. The inputs are real content, not a per-release stamp: v56.11.3.1 to v56.11.4.1 changed 3 files in images/default (lib-common.sh, host-tools-index.md, forge-agent-guidance.md), and Containerfile.base itself last changed in d3baa3889. Measured on tlatoanis-macbook-air (M5, guest 8 vCPU / 8 GiB), 2026-11-04 v56.11.4.1 first launch: "Building Forge" at 07:55:48Z, forge-base tagged 07:57:17Z (89 s), forge tagged 07:57:33Z (16 s). A content-unchanged forge-base would retag (ImageBuildAction::Retag) instead.'
  exit_criteria:
  - 'The forge-base source digest is unchanged when only files that Containerfile.base does not read change; a fixture edits lib-common.sh and asserts the same forge-base digest and a changed forge digest.'
  - 'An edit to Containerfile.base, or to a file it COPYs if one is added later, still changes the forge-base digest; a fixture asserts it.'
  - 'A first launch of a release that changes only forge scripts logs a forge-base Retag on the macOS M5 tier, against 89 s of rebuild today.'
  verifiable_closure: 'The two digest fixtures passing, plus the image-ensure line from a published release that changed only forge scripts.'
  unscoreable: 'unpinnable-until-the-guard-exists: the digest fixtures land with the fix (1136-n8sh).'
  next_action: 'Scope the forge-base identity to Containerfile.base plus the paths its COPY/ADD lines name (none today), then write the two fixtures.'
  provenance: 'Coordinator macuahuitl-fedora 2026-11-06, condition 2 on closing 1918-wfrg: name the input that changed and file it if every release pays.'
  events:
  - type: filed
    ts: '2026-11-06T00:20:00Z'
    host: tlatoanis-macbook-air
    summary: filed p1 ready from the 1918-wfrg rebuild finding
