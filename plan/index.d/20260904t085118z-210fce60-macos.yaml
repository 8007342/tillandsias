        THE FORCE SHAPE WAS ALREADY COVERED AT THE RECEIVING END. The packet was filed
        expecting the mirror to be blind to esme's case — a stale branch force-pushed
        over an advanced trunk. It is not. Measured 2026-09-04 against
        images/git/pre-receive-hook.sh with a stub relay, pushing with --no-verify:

          remote: [pre-receive] REJECT: non-fast-forward branch update is disabled: refs/heads/main
          remote: [pre-receive] Push rejected: transaction or receive hardening policy failed before upstream relay
          ! [remote rejected] stale -> main (pre-receive hook declined)

        That rule predates this work (order 579's zero-trust containment pass). So exit
        criteria 1 and 3, for the FORCE shape, were already met by a different rule
        under --no-verify. Porting the client's set difference verbatim would have added
        a second refusal for a case that already had one, and I would have reported it
        as new coverage.

        THE REAL GAP IS THE FAST-FORWARD ONE, and it is worse than the one filed. A
        merge commit whose resolution DROPS the trunk's files deletes them relative to
        the remote tip while remaining a clean fast-forward. No force is involved, so
        the non-FF rule never looks at it. Measured on the unpatched hook:

          is this a fast-forward for main?           YES
          files this push would DELETE vs main:      D trunk_d, D trunk_e
          files its commits TOUCHED (git log):       mine.txt
          push --no-verify ->  63ead96..9503238  stale -> main
                               "Relay verified: upstream durably accepted"

        Accepted, relayed, two files silently reverted.

        WHY THAT SHAPE IS THE ONE THIS FLEET SHOULD FEAR. Every non-linux-next host
        merges origin/linux-next before every push by standing policy
        (methodology pull_merge_cadence.pre_push_gate, restated in CLAUDE.md). So the
        dangerous operation is not an exceptional force push by a wedged host — it is
        the ROUTINE merge every platform host performs on every cycle, with a
        resolution that goes the wrong way. And `git log --name-only` does not show a
        merge commit's own changes, which is exactly why the deleted files never enter
        the touched set and why nothing upstream of this guard sees them.

        LANDED: stale_base_revert_violation() in the hook's PRE-RELAY pass, so it
        rejects while both repositories are still unchanged and a reverting transaction
        never reaches upstream — the same placement argument the CI-workflow gate makes
        one section down. Same set difference as the client hook, same
        `blocked:stale-base-revert:<ref>:<n> file(s)` token so a reader sees one message
        from either end. POSIX sh: the client's `comm -23 <(...) <(...)` is bash-only,
        so this uses temp files and `grep -Fxv -f`, with the empty-touched case handled
        explicitly because an empty pattern file is not portable across greps.

        FIXTURE FIRST, AND IT WAS RED FIRST: scripts/test-no-stale-base-revert-pre-receive.sh
        drives a real bare remote with the real hook installed, and EVERY arm pushes
        with --no-verify. Before the hook change it scored 2/6 with arms 2 and 3 red;
        after, 6/6. That sequence is the mutation control — the two arms that flipped
        are the two the change is for, and the four that were already green stayed
        green.
          arm 1  the force shape is refused          (REGRESSION arm: it already was;
                                                      pinned so relaxing the non-FF rule
                                                      cannot silently reopen it)
          arm 2  a FAST-FORWARD merge that discards the trunk is refused   <- the new one
          arm 3  the refusal NAMES the reverted files
          arm 4  an ordinary push on a current base is accepted
          arm 5  a deletion the commit itself made is accepted
          arm 6  a new remote ref is never blocked   (the salvage path, 872-c9nd)
        Arms 4-6 are what stop arms 1-3 being satisfied by a hook that refuses
        everything. Wired into ./build.sh --check beside its 1000-rqmx sibling; the
        sibling still passes 6/6, so the client half did not regress.

        WHAT IS NOT DONE, and it is the deployment half: this changes the hook SOURCE in
        images/git/. A running mirror carries the hook installed into its own
        hooks/pre-receive, so existing mirrors keep the old one until the image is
        rebuilt and the container recreated. I have not verified the propagation path
