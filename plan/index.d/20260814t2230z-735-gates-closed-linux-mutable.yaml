events:
  - packet_id: v04-release-gate-windows-e2e-evidence
    event:
      type: verified-by
      ts: "2026-08-14T22:30:00Z"
      agent_id: "linux-mutable-20260814-release"
      host: linux_mutable
      summary: |
        GATE ACCEPTED — CLOSED ON THE WINDOWS HOST'S EVIDENCE, and an apology
        for the delay is owed with the acceptance.

        All four exit criteria are met by the event of 2026-08-14T20:20:01Z:
        commit tested b482b279 (carrying the candidate eab19744); eleven
        per-stage verdicts, all measured; the final --diagnose --json run AFTER
        the last mutating step per this packet's own criterion (exit 0,
        version=guest=0.4.260812.1, phase=Ready); native
        cargo test -p tillandsias-windows-tray --bins 89 passed; stamp applied.

        The evidence was posted and I did not see it, for two reasons, both mine
        to own:

        1. I had not merged origin/windows-next, so the fragments carrying it
           were not in my tree when I called the gate outstanding.
        2. I described the windows-only sources as "the largest unverified
           surface in this release". That was WRONG, and 736-28m7 says exactly
           why: the stamp is written under $GIT_DIR, so it is structurally
           incapable of crossing a host boundary. My gate will report
           `never-verified` forever, before and after any number of green
           Windows runs. I read a verdict about MY VISIBILITY as a claim about
           THE SOURCES, and then quoted it to the operator as a release risk.

        The windows host's guest-build retraction is also worth recording as a
        model: it caught its own false FAIL by adversarial verification against
        its leading hypothesis, retracted publicly, and preserved the one real
        finding underneath (every guest-side readiness signal green while
        nothing was bound). That is what kept a build error from sitting in the
        ledger overnight as a p0 blocker.

  - packet_id: v04-release-gate-macos-e2e-evidence
    event:
      type: verified-by
      ts: "2026-08-14T22:30:30Z"
      agent_id: "linux-mutable-20260814-release"
      host: linux_mutable
      summary: |
        GATE ACCEPTED — CLOSED ON THE macOS HOST'S EVIDENCE.

        Commit tested e71bc6f7, confirmed an ancestor of the promotion candidate
        (osx-next merged; drift 0). Every criterion met: per-stage verdicts with
        evidence-dir citations; codesign REPORTED AND ASSERTED on both dist/ and
        the installed bundle, which is more than the criterion asked; cold
        re-provision from a destroyed substrate green; and the final diagnose
        after the last mutating step.

        Two things in that run deserve to outlive it. The freshness gate
        (embedded=head=e71bc6f7) caught the class where a loosely-resolved macOS
        bundle lets a whole e2e exercise a stale artifact. And step 2b is a live
        NEGATIVE control for 735-2g5i: a destroyed substrate returns exit 2, not
        3 — had it returned 3, the converging fix would be telling automation to
        wait for something with nothing running to deliver it.

  - packet_id: v04-release-promotion-linux-owned
    event:
      type: progress
      ts: "2026-08-14T22:31:00Z"
      agent_id: "linux-mutable-20260814-release"
      host: linux_mutable
      summary: |
        EVIDENCE CONTRACT, stated so no host has to guess again. This packet's
        two gates were BOTH satisfied while I reported them outstanding, so the
        ambiguity was real and it was on the requester.

        A release gate is satisfied when there is an event ON THE GATE PACKET
        whose packet_id is the one in this packet's depends_on — not on a
        sibling packet, not in loop_status, not in a commit message — carrying:
          - the exact commit tested, which must be an ancestor of the candidate;
          - one verdict line per stage of the runbook actually run;
          - the final health check RE-RUN after the last mutating step;
          - for a host with native-only sources, the native test result.
        The requester's obligation is symmetric and is where this went wrong:
        MERGE the sibling branch before reading the gate, because fragments live
        on the branch that wrote them.

        Both gates are now closed. The remaining dependency 736-mcy3 is closed
        (measured from a pristine clone, both directions). This packet is
        unblocked.
