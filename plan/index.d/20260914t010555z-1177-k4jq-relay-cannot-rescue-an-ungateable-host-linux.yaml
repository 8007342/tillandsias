      - 'NEGATIVE CONTROL: the coordinator gates a relayed work/ ref before it reaches trunk — the exemption moves WHERE the gate runs, never WHETHER it runs'
      - 'NEGATIVE CONTROL: --no-verify remains unnecessary and unused on this path; the fixture asserts the sanctioned push succeeds without it'
