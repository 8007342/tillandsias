    title: |
      The relay protocol exists so a host that cannot gate can hand work to the coordinator, but pushing the `work/<order>` ref that starts the handoff itself requires a valid gate stamp — so the escape hatch is unreachable from exactly the state it was built for.
    context: |
      MEASURED ON LENOVINHA 2026-09-14, immediately after two land attempts
      were SIGKILLed for memory in the same gate phase (sibling row). The
      coordinator directed a relay. The handoff push was refused:

        git push origin HEAD:refs/heads/work/1159-g96c
          plan-only lane: not applicable — refs/heads/work/1159-g96c is new on
          the remote; no base to diff against (full gate required)
          pre-push refused: the tree changed since ./build.sh --check last
          passed
          CHANGED SINCE THE GATE RAN (12 paths): Cargo.lock, VERSION, build.sh,
          crates/tillandsias-headless/..., README.md, ...

      The 12 paths are the release back-merge the coordinator had just told this
      host to take. So the sequence is: take the back-merge as instructed, gate
      it, be killed for memory, be told to relay, and find the relay closed
      because the tree changed — by the merge that was instructed.

      THE SHAPE. A gate stamp is a promise about a tree. Requiring one to push a
      `work/` ref treats that ref as if it were landing, and it is not: a work/
      ref moves nothing on trunk, and the coordinator GATES IT ON ARRIVAL before
      relaying. The stamp is being demanded twice for one landing, at a point
      where the host demonstrably cannot produce it.

      WHY `--no-verify` IS NOT THE ANSWER, stated because the refusal itself
      offers it: the skill's own rule is never to use it, and it is right —
      it would push an ungated tree with nothing marking it ungated, which is
      the failure the stamp exists to prevent. The fix is not to bypass the
      check but to make the work/ lane express what it actually is: a HANDOFF OF
      AN UNGATED TREE to a host that will gate it.

      NOT A THEORETICAL GAP. Two hosts in this fleet gate slowly or marginally
      enough to need the relay, and it is the floor-tier and memory-constrained
      hosts — the ones most likely to be unable to gate — that the protocol was
      written for. An escape hatch reachable only from the states that do not
      need it is not an escape hatch.

      NOT IN SCOPE: the memory ceiling and the silent OOM (sibling row), and
      whether the coordinator should relay at all (it works, once the ref
      exists).
    exit_criteria:
