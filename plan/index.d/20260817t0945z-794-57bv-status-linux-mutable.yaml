packets:
  - packet_id: fragment-status-loss-guard-cannot-see-unrecognized-shapes
    order: 797-qm4t
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "check-fragment-status-loss.sh reports ok when a fragment declares a transition in a shape the fold does not recognize — it compares only the statuses it already parsed, so an ignored declaration is invisible to it"
    deliverable: "a fragment that intends a status transition but writes it in a shape the fold ignores is NAMED by the guard, in the same typed way 796-4ydb made an unparseable fragment name itself"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [plan-tooling, fail-loud, ledger]
    estimated_hours: 3
    context: |
      OBSERVED, macuahuitl 2026-08-17, on this cycle's own closure fragment.

      20260817t0930z-794-57bv-closure-linux-mutable.yaml declared the
      transition as a top-level `events:` entry with `event.type: status` and
      `from: ready` / `to: completed`. The fold does not read that as a
      closure. Measured, all three on the same fragment:

        tillandsias-plan fragment-terminal-events <frag>   -> prints nothing
        tillandsias-plan closure-evidence-check <frag>     -> ok:closure-evidence:0 checked
        tillandsias-plan status 794-57bv                   -> ready
        scripts/check-fragment-status-loss.sh              -> ok:no-fragment-status-loss:55 checked

      The last line is the defect. That guard exists to catch "a fragment set
      a status the fold did not carry". Here a fragment set a status the fold
      did not carry, and the guard said ok — because it builds its expected
      set from declarations it RECOGNIZES, and an unrecognized declaration
      contributes nothing to compare against. Its blind spot is exactly its
      subject.

      Note the near miss: `closure-evidence-check` printing "0 checked" is the
      one honest signal in that set, and only because it states its denominator
      rather than just a verdict. A checker that says "ok" without saying over
      how many is unfalsifiable when the answer is zero — the same shape 785-sqe6
      fixed in this very guard when its verdict went from "2 checked" to
      "9 checked" and nobody had noticed the seven.

      RELATION TO 796-4ydb, closed this cycle: that packet made an UNPARSEABLE
      fragment name itself instead of being skipped with a warning. This is the
      adjacent case — a fragment that parses perfectly but whose declaration is
      in a shape nothing consumes. Parseable and understood are different
      properties, and only the first one is currently checked.

      SUGGESTED SHAPE: the fold already knows which keys it consumes. A
      fragment containing an `event.type` or a top-level key it does NOT
      consume is reportable — most cheaply as a warning listing the ignored
      key and path, in the same typed grammar 796-4ydb established. Do not
      hard-fail the fleet on it (699-dycj): one host's unusual-but-harmless key
      must not turn every host's build red.
