    value: "The pre-build litmus tier is run by the release gate only (1302-7j8p's\nshape: a gate step wired from one regime), so a mode lost on a Windows\nhost is invisible for a whole day of Linux lands. Two fixes, both\nneeded: the salvage tool restores the executable bit for shebang files\nat snapshot time (a Windows host cannot express the bit; the relay\ncannot know it was meant), and the exec-bits decider covers the\nfixtures the litmus corpus binds, so the 19-decider relay preflight\nrefuses it in a second instead of the release gate refusing it after\n45 minutes. Do not \"fix\" by chmod on the relay side alone: the next\nWindows salvage carries the same defect.\n\n\n[2026-09-22T05:06:22Z macos] \nVERIFIED BY EXECUTION ON macbookair 2026-09-22; THE ROW IS NOT CLOSABLE AND THE\nREMAINING WORK IS NARROWER AND SHARPER THAN AS FILED.\n\nWHAT ff82d1001 DID: chmod +x on ONE fixture\n(scripts/test-installer-probes-by-attempt-not-by-help.sh) and a join-the-fleet\nedit. That is precisely the fix this row's next_action forbids — \"Do not 'fix' by\nchmod on the relay side alone: the next Windows salvage carries the same defect.\"\nIt is a correct stopgap for one file and closes nothing here.\n\nMEASURED, each by running the thing rather than reading it:\n\n  scripts/test-salvage-preserves-exec-bits.sh          ABSENT — criterion 1\n                                                      cannot be met\n  scripts/salvage-dirty-worktree.sh                    ZERO occurrences of\n                                                      exec-bit restoration or\n                                                      `note:exec-bit-restored`\n                                                      — criterion 2 untouched\n  scripts/check-script-exec-bits.sh                    EXISTS, is wired into\n                                                      ./build.sh --check:2171,\n                                                      and ALREADY covers\n                                                      openspec/litmus-tests/*.yaml\n\nTHE COVERAGE CRITERION WAS ALREADY MET BEFORE THIS ROW WAS FILED, and the row's\nframing of it is wrong in a way that would have sent the next reader at the wrong\ncomponent. The decider was created by 731-d89b (b68233a92) with litmus YAMLs\nalready in its caller list. \"26 checked of ~700 scripts\" is not a coverage\nceiling: the decider sweeps ALL of scripts/ and SELECTS the at-risk ones — 26 is\nthe count of shebang scripts currently at 100644, not the count it examined.\n\nSO WHY DID A 100644 FIXTURE REACH THE RELEASE GATE? A CONTROLLED PAIR, same\ndecider, same run, two fixtures differing only in how their litmus invokes them:\n\n  test-macos-vz-orphan-diagnosis.sh   litmus runs it BARE\n        -> violation:script-not-executable:1, naming the caller and the fix\n  test-windows-host-lane-refusal.sh   litmus runs it as `bash scripts/...`\n        -> ok:script-exec-bits:27 checked — SELECTED AS A CANDIDATE AND CLEARED\n\n(Both were set to 100644 with `git update-index --chmod=-x`, measured, and\nrestored to 100755; the restoration was verified.)\n\nTHE GAP IS NOT COVERAGE, IT IS THE REQUIREMENT TEST. The decider condemns a\n100644 shebang script only when a caller BARE-INVOKES it, which is correct as a\ngeneral rule — a script run as `bash foo.sh` genuinely does not need the bit. But\nlitmus-windows-host-lane-refusal.yaml step 1 asserts\n`test -x scripts/test-windows-host-lane-refusal.sh` while step 2 runs it via\n`bash`. A `test -x` assertion IS a requirement for the bit, and the decider does\nnot recognise it as one. That is the whole reason ./build.sh --check passed for a\nday of Linux lands while the release gate refused on the first tier that checks\nit.\n\nWHAT IS LEFT, in the order a taker should do it:\n\n  1. THE DECIDER LEARNS THAT `test -x <path>` IS A REQUIREMENT. One pattern in\n     scripts/lib/exec-bits-filter.awk beside the bare/subst/yamlcmd forms it\n     already carries. This is the half that makes the defect visible in a second\n     instead of 45 minutes, and it needs no Windows host to build or to verify —\n     the controlled pair above is its fixture, and it must show the windows\n     fixture condemned WITHOUT changing the macOS one's verdict.\n\n  2. THE SALVAGE TOOL RESTORES THE BIT AT SNAPSHOT TIME, with\n     `note:exec-bit-restored:<path>` per file, for shebang files only. Untouched\n     today. This is the half that stops the NEXT Windows salvage carrying it.\n\n  3. scripts/test-salvage-preserves-exec-bits.sh with the three arms the closure\n     names. Its arm (1) needs a scaffold worktree, not a Windows host.\n\nTWO CORRECTIONS TO THIS ROW'S OWN CLOSURE TEXT, so a taker is not measured\nagainst a string that does not exist:\n  * the decider emits `violation:script-not-executable:<n>`, NOT\n    `violation:script-exec-bits:<path>`.\n  * \"covers scripts/test-*.sh and openspec-bound fixtures\" is already true;\n    the criterion that is NOT met is the `test -x` requirement form above."
