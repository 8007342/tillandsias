    title: "Lua deciders that judge the current checkout run git in the caller's PWD, not the runner's repository root"
    context: |
      Cause: a proc.run with no cwd runs in default_cwd() = find_repo_root(), which reads TILLANDSIAS_REPO_ROOT, then
      PROJECT_ROOT, then walks up from the process cwd (lua_predicate.rs locate_repo_root). The litmus runner exports
      PROJECT_ROOT and land-queue sets TILLANDSIAS_REPO_ROOT, so a decider whose contract is "judge where I am run" judged
      the tillandsias checkout instead. Found porting check-version-bump-isolation (2165-vcgh): under the litmus runner it
      examined nothing.
      Sweep: 99 scripts/lua files call git without a cwd. Most judge the repository root on purpose, and some callers point
      TILLANDSIAS_REPO_ROOT at a scaffold while running from elsewhere, so a blanket switch to PWD would break them. Fixed
      here are the deciders whose contract is the caller's checkout: check-committable-branch and
      check-gate-step-prefix-across-refs (its header said "git runs in the caller's cwd"; it did not). Already correct:
      check-forge-expert-base, check-hooks-armed. Fixed in their own PRs: check-version-bump-isolation (#1264),
      check-plan-schema-divergence (#1265).
      The helper is INLINED, not a lib/lua/common module: `require` resolves lib/lua against the process cwd, which is
      exactly what is not the repository for these deciders (measured: a common.here require broke both scripts' fixtures).
