      summary: >
        Two fixture bugs of my own, caught and fixed, both instructive.
        (1) The combined-dispatch case asserted the run reached "Checking Rust
        formatting" — but build.sh's install block runs BEFORE the check
        block, so a bounded run spends its budget compiling and never gets
        there; the assertion now requires the memo to be absent AND the
        process to still be working at the bound (rc=124), which excludes the
        real failure (an instant exit 0). (2) The red-gate case injected a
        badly formatted NEW .rs file that no module declares — invisible to
        `cargo fmt --check --all`, so the gate went GREEN and the fixture
        reported a false failure. An injected defect the checker cannot see
        proves nothing; it now appends to an already-compiled file.

        Out of scope, noted not acted on: the `--check --install` fixture case
        bumps VERSION and four crate Cargo.tomls as a side effect (the
        702-eusw shape). I reverted them before committing, but a fixture that
        mutates VERSION is a trap for the next reader — worth either a
        dedicated no-install probe or an explicit restore inside the fixture.
