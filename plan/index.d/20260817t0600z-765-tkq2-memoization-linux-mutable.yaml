        MEASURED, same worktree, same binary: build-check 62305ms ->
        build-check-memoized 372ms (167x). The packet predicted ~0.3s and the
        floor is 0.372s — ~60ms of stamp hash over ~4200 files plus the
        preamble (hook install, sidecar staleness). This worktree is COLD, so
        62.3s is a cold-cache full gate; on a warm checkout the same run is
        8-20s and the memo floor is unchanged, so the ratio is smaller and the
        absolute saving still the whole gate.

        WHAT IT DOES NOT SAVE, stated plainly: the first --check after ANY
        byte changes, which is the common case in an active cycle. The memo
        pays off on the 2nd..5th run of a cycle — re-running after a
        ledger-only commit, after the attestation commit, after a rebase —
        which is exactly the pattern the velocity audit measured.

        DESIGN CHOICE (the judgment the directive asked for): memoize the
        WHOLE gate, not the expensive steps. Per-step memoization needs each
        step's input set — which files that step's verdict depends on — and
        the stamp makes no such claim and cannot; it vouches for the tree as a
        whole. Inventing per-step input sets here would duplicate the
        change-class taxonomy 765-xpct is building AND would be a scope claim
        with nothing verifying it. So the memo asserts exactly what the stamp
        already proves. Partial credit on a CHANGED tree stays with 765-xpct,
        where the taxonomy will be real.

        COMPOSES WITH 765-dt8h rather than bypassing it: memo-check requires
        `scope full` and refuses a scoped stamp outright
        (stale:scoped-stamp-cannot-memoize-full-gate), because a subset stamp
        cannot vouch for a whole-gate skip — the silent-green the scope field
        was added to prevent.

        TOOLCHAIN: new `toolchain` field digests `rustc -V` + `cargo clippy -V`.
        Deliberately NOT enforced by `verify`, only by `memo-check`. verify
        answers "did the gate validate these bytes" (what pre-push needs —
        trunk correctness is a property of the code); memo-check answers
        "would re-running here produce the same verdict", which a clippy bump
        changes. Keeping verify untouched means no second fleet-wide re-stamp,
        and a pre-765-tkq2 stamp simply never memoizes.

        FIXTURE 14/14 (scripts/test-gate-stamp-memoization.sh), two layers:
        hermetic decision cases in a throwaway repo (edited tracked byte, NEW
        untracked file, toolchain change, absent toolchain field, legacy v1
        stamp, no stamp, scoped stamp, foreign dispatch, plus a negative
        control that a fresh stamp still memoizes after all the refusals) and
        WIRING cases against the real build.sh (loud memo hit naming the
        override and running nothing; TILLANDSIAS_FORCE_CHECK=1 bypass;
        --check --install never memoizes; and the critical one — a RED gate
        leaves the stamp byte-identical, so nothing can memoize a failure as
        green).

        NON-VACUITY PROVEN: neutering the two toolchain guards reds exactly
        cases 4 and 5 (`stale:toolchain-changed`, `stale:no-toolchain-recorded`)
        and leaves the other twelve green.

        SAFETY VERIFIED ON THE PUSH PATH ITSELF: this edits the gate the whole
        fleet pushes through, so a real `git push origin fork-765-tkq2` was
        exercised — refused correctly while the tree was dirty after a
        stamp, accepted after a fresh gate run. ./build.sh --check rc=0
        unmasked; ok:bash-dialect-clean.
