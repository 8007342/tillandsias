        wt.exe's re-parse, and the flattening exists only because the guest exec
        allowlist used to admit nothing but `/bin/bash -l|-lc <string>`
        (795-zshi). That constraint is already gone on the guest side: the
        verbatim-argv arm and CAP_EXEC_ARGV_VECTOR both exist today. Sending a
        verbatim argv removes the string entirely — no re-parse, no predicate,
        no conhost fallback, and paste and clickable links return without a
        wrapper script to maintain. Filed as 823-u5zf. Keep 805-ek9e open as the
        UX statement of the defect, but prefer 823-u5zf's fix over the wrapper.
