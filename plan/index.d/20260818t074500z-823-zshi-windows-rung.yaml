        ROOT CAUSE IDENTIFIED UPSTREAM, and this packet's proposed remedy is
        probably the wrong one. 805-ek9e proposed an injected guest wrapper
        script so the lane argv would be quote-free and pass
        argv_survives_wt_reparse. That works, but it treats the predicate as a
        fixed constraint. It is not: `argv_survives_wt_reparse` exists ONLY to
