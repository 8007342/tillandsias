    context: >
      OPERATOR DIRECTIVE 2026-08-23, given to esmeraldinha after it reported
      losing a push race: move slow-host work onto a private branch, file the
      shortcoming, and have the ORCHESTRATOR produce updated methodology for
      worktrees and branches so the larger fleet can work concurrently. The
      operator's framing: "we might not need to merge every cycle in some
      cases, but at the end of a complete set of work", plus "custom rules on
      how to merge multiple hosts racing on linux-next and windows-next". The
      operator named esmeraldinha the primary affected user and required the
      scheme be VETTED AND APPROVED BY THE ORCHESTRATOR before it becomes
      fleet practice. This packet is that request, with measurements.

      THE MEASUREMENT (72h to 2026-08-23T15:29Z, simulated against the real
      commit timeline; a first pass by this host quoted a median inter-commit
      gap of 1.3 min as though the surface moved that fast, which is a
      CLUSTERING ARTIFACT and is corrected here):

        253 commits reachable on origin/linux-next, 241 on origin/windows-next
        `git rev-list origin/windows-next ^origin/linux-next` in-window = 0
          -> ONE moving surface, not two: linux-next already contains
             everything windows-next has, so the pre-push merge of
             origin/linux-next is usually a no-op that still costs a full gate
        6 distinct identities push to it, interleaving within single minutes
        Rate is BURSTY: the 72h window holds an 18.9h and an 8.4h dead
          stretch; the live regime since 2026-08-22T23:21Z is 183 commits in
          15.38h = 11.9/h, one every 5.0 min
        Median inter-PUSH gap (commits clustered at 2/5/10 min): 9.1/16.4/23.2
          min — the same order as this host's entire gate

      Simulating a T-minute gate started at every minute of the burst:

        T = 3 min    P(beaten) 0.15   E[gate runs] 1.16   3.8 min to land
        T = 10.5 min P(beaten) 0.49-0.61  E[runs] 1.86-2.50  21-29 min to land
        T = 15 min   P(beaten) 0.64   E[runs] 2.48   40 min to land
        T = 30 min   P(beaten) 0.89   E[runs] 6.72   213 min to land

      Two facts sharpen this. First, the cost is STRONGLY CONVEX in gate
      length — halving the gate is worth far more than any retry tuning.
      Second, this host does not start at a random moment: it gates
      immediately after fetching, i.e. immediately after observing activity,
      which is an inspection-paradox worst case. Anchored at an observed
      commit, P(beaten) is 0.79-0.82 against 0.56-0.61 for a uniformly-timed
      start — deferring the gate past a burst tail is worth ~20 points on its
      own, and quiet gaps of >=12 min still cover 70.3% of even the burst's
      wall-clock (longest 64.8 min), so "wait for quiet" is viable.

      TWO INDEPENDENT CORROBORATIONS that this is real and specific to the
      floor, not a modelling artifact:
        - Merge ratio over 72h: esmeraldinha authored 6
          `Merge remote-tracking branch 'origin/...'` commits against 9
          substantive commits = 0.40, the highest of any host. macuahuitl is
          0.11; lenovinha, yoga and pirria are 0.00.
        - Reflog: 3 landed push cycles on windows-next paid exactly 6 origin
          merges = 2.0 re-merges per landed cycle. Separately, 8 of 8 observed
          fetches of origin/linux-next found the tip advanced, including one
          only 12 minutes after the prior fetch. Zero "already up to date".

      THE MECHANISM ALREADY EXISTS AND IS ALREADY EXEMPT. branch_namespaces
      (rung 1 = order 499, completed) defines lanes
      `agent/<host>/<base>/<yyyymmdd>-<slug>`, and
      pull_merge_cadence.pre_push_gate.lane_exclusion excludes agent/* and
      salvage/* from the trunk-merge requirement. Verified in CODE, not prose:
      scripts/hooks/pre-push-linux-next-merged.sh gates exactly
      `refs/heads/osx-next|refs/heads/windows-next` and nothing else, so a lane
      push is unaffected today. Rung 2 (order 500, mirror-namespace-hook) is
      completed and its grammar enforcement is WARN-ONLY.

      WHAT IS ACTUALLY BLOCKED, corrected from this host's first reading. The
      2026-08-06 security rescope does NOT block lane CREATION. Order 579's
      containment makes the mirror pre-receive hook reject every ref DELETION
      before invoking the privileged upstream relay; because port 9418 is
      anonymous, keeping a bulk-delete bypass so a lane could be torn down
      would let any enclave peer borrow the mirror's privileged credential to
      delete refs. The recorded ruling is that lane creation may remain
      anonymous as interim containment while DELETION waits for the
      authenticated administrative path in order 451. So a host may create a
      lane today; what it cannot do is have one reaped.

      The rollout map, since the methodology's own "orders 500-504" is off by
      one: rung 1 = 499 (completed), rung 2 = 500 (completed, warn-only),
      501 is NOT a rung but the sticky-HEAD prerequisite whose completion note
      says "Lane-branch creation deliberately NOT included (packet 502)",
      rung 3 = 502 (pending), rung 4a = 503, rung 4b = 504 (pending). 502's
      sole unmet dependency is 451 authenticated-forge-write-transport-impl,
      itself pending on 606-bvnp (BLOCKED) and 610-txvr. This is two levels
      from claimable and will not unblock soon, which is precisely why an
      interim ruling is worth more than waiting.

      A TRAP FOR WHOEVER PICKS THIS UP: order 503 carries `status: ready` in
      the ledger while its only dependency (502) is pending. The
      dependency-unaware `ready` subcommand lists it; the dependency-aware
      `next`/`select-rows` correctly omit it. A reader trusting the stored
      status field alone would think rung 4a is claimable. It is not.

      GAPS THAT MAKE UNSUPERVISED FLEET ADOPTION UNSAFE:

        1. NO REAPER, AND IT CANNOT BE BUILT YET. sweep_role binds lane GC to
           the coordinate-multihost-work role with deadlines (merged ->
           delete, idle >24h -> salvage packet, >72h -> operator, >14d ->
           archive). That is order 504, pending, and it inherits 451 because
           the deletion path itself is what 579 denies. A lane created today
           is a ref nothing can reap through the sanctioned path.
        2. NO GREEN-EXIT. The gate's intent survives "at the boundary" via a
           lane-exit procedure that MUST merge origin/linux-next when <base>
           != linux-next. Its sole sanctioned command, scripts/lane-exit.sh,
           has NEVER existed on any ref (`git log --all -S` finds nothing);
           scripts/ledger-checkpoint.sh is likewise absent. Every lane holder
           will improvise the landing — which is the class 859-4jny just
           caught, where an ad-hoc loop reported LANDED for a REJECTED push.
        3. LEDGER RULE IS SILENT ON FRAGMENTS. ledger_rule says lanes are
           "code-only for shared ledger state: plan/index.yaml, plan.yaml,
           plan/loop_status.md, and methodology/**". It predates and does not
           name the fragment overlays plan/index.d/*.yaml and
           plan/loop_status.d/*.md (582-nqw5). Those are append-only and
           host+timestamp-named, so they cannot textually conflict — but the
           rule's rationale is that "every recorded order-number collision
           came from delayed ledger landing", and the collision surface is the
           MINTED ORDER TOKEN: `next-order` reads the folded ledger, so a
           token minted on a lane against a stale base can collide with one
           minted elsewhere in the same window. This is the single most
           consequential ambiguity for a host filing 3-6 fragments a cycle.
        4. NO LAUNCHER, SO SLUGS ARE HAND-ROLLED. lane_grammar mandates the
           slug be `<mode>-<instance>-<launch-epoch>`, launcher-synthesized
           and never reused. With 502 unshipped there is no launcher, so this
           host's own lane slug (`low-end-floor`) satisfies creation_regex but
           NOT the documented slug shape. Any interim ruling should either
           relax the slug rule or state the interim form.
    exit_criteria: >
      (1) An orchestrator RULING recorded in
      methodology/multi-host-development.yaml on whether lanes are sanctioned
      for hosts whose gate exceeds the fleet's median inter-push gap, given
      that creation is permitted today and only deletion is contained. If
      lanes stay held, the ruling must say what such a host does instead;
      "keep retrying" is valid only paired with 859-4jny exit criterion 2.
      (2) ledger_rule amended to state explicitly whether plan/index.d/ and
      plan/loop_status.d/ fragments may ride a lane, addressing the
      order-token collision window rather than the file-conflict question
      (fragments cannot textually conflict; tokens can collide).
      (3) A merge/landing rule for hosts racing one integration surface: who
      merges whom, whether landings are merge-only, and what a host does when
      its gate exceeds the branch's inter-push gap. Note for whoever writes
      it: windows-next currently contains nothing linux-next lacks, so the
      per-push merge of origin/linux-next is usually a no-op that still costs
      a full gate — the rule may be buying less than it charges.
      (4) A worktree position: whether a slow host should hold MULTIPLE
      worktrees (one per lane) so a long gate is not invalidated by a merge
      into the same tree, and what that costs on a 256 GB budget SSD.
      host_identity already records worktree_path and start_of_session
      mentions a worktree root, so the vocabulary exists.
      (5) Lane lifecycle answered even if lanes stay held: either 504 is
      scheduled, or the ruling names an interim owner who reaps lanes by hand,
      since the sanctioned deletion path is denied by 579 until 451 lands.
      (6) Verified on a host whose gate exceeds the fleet's median inter-push
      gap — esmeraldinha or pirria. Neither problem reproduces on a fast host.
      (7) OPTIONAL BUT HIGHEST-VALUE, from the convexity above: the cheapest
      intervention is not a branch scheme at all, it is a shorter gate. At
      T=3 min the loss rate falls to 0.15 and expected time-to-land to 3.8
      min, against 21-29 min at T=10.5. If a scoped or incremental gate is
      reachable for plan-only cycles, it dominates every other lever here and
      should be evaluated before the branch policy is widened.

