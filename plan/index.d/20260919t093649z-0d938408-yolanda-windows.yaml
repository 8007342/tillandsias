        Identical to esmeraldinha. Two Windows hosts, same mechanism, so it is the MSYS argument-conversion layer and not one host's install.

        THE TITLE IS WRONG AND THE AUDIT IS NEARLY EMPTY — this is the finding that closes the row.

        THE TRANSPORT PRESERVES THE EXIT STATUS. Measured, D is the distro:
          wsl.exe -d D -- bash -lc 'exit 7'  then outer read   -> 7            CORRECT
          wsl.exe -d D -- bash -lc 'false'   then outer read   -> 1            CORRECT
          if wsl.exe -d D -- bash -lc 'exit 3'; then ...       -> else, rc=3   CORRECT
        So the if-then form and an OUTER rc capture are both sound and need no conversion. "every rc measured through it on a windows host is decoration" is too broad, and an auditor acting on the title would rewrite working code.

        ONLY AN EXPRESSION COMPUTED INSIDE THE ARGUMENT STRING IS UNSAFE, and the mangling is wider than the question mark:
          bash -lc 'false; echo "$?"'            -> 0        wrong
          bash -lc 'false; rc=$?; echo "$rc"'    -> empty    never evaluated
          ${a[1]} where a=(x y z)                -> empty    no question mark present
          v=ok; echo "$v"                        -> empty
          v=ok; set | grep "^v="                 -> v=ok     THE ASSIGNMENT DID HAPPEN
          echo "$HOME"                           -> /root    pre-existing env fine
          echo "$$"                              -> correct inner pid
        PIPESTATUS is therefore in the affected set, so the obvious rc-to-stdout-token conversion is as broken as what it replaces and fails silently.

        THE CENSUS, comment-stripped so a comment mentioning the defect is not counted as an instance: across scripts/ and build.sh there is NO instance of the real pattern anywhere in the tree except the canary's own two deliberate ones in scripts/lib-wsl-exec.sh. There is nothing to convert. The conversion half of this row is a no-op on the current tree.

        NOT THEORISED FURTHER, deliberately: the assignment demonstrably executes yet same-string expansion of the assigned name returns empty, and I could not close that gap without more time than the finding is worth. Recording what was measured rather than a cause I cannot support.

        WHAT A FUTURE PICKUP SHOULD DO, since the audit is empty today: re-run the census when new wsl.exe callers appear, and treat the canary as the instrument. The operational rule is unchanged and stronger than the title: anything COMPUTED inside the argument string is untrustworthy; put the logic in a script FILE and read a token from stdout. Do NOT ban bash -lc through wsl.exe — the form is correct for anything reporting through stdout, which is most of what the fleet measures.

        TITLE CORRECTION IS RECORDED but the packet_id is immutable, so the id keeps the overbroad claim. Anyone reading the id alone will overestimate the blast radius; this event is the correction.
