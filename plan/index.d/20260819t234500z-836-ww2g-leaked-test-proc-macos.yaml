    kind: bug
    title: "a tillandsias-tray unit-test binary re-executes itself as `<test-bin> handshake`, and the child is orphaned to PID 1 and survives the test run — found still alive after 2d01h, with no gate anywhere that would notice"
    deliverable: "the helper child is reaped when its test ends, and a check fails loud when a tillandsias test process outlives its run"
    pickup_role: macos
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [rust, macos, testing, fail-loud, process-lifecycle]
    estimated_hours: 3
    context: |
      FOUND 2026-08-19 at Finalization, by the Non-Negotiable Exit Contract's
      "ensure any tillandsias background binaries or test processes are fully
      terminated" step. Nothing else in the loop looks for this.

        $ ps -o pid,ppid,etime,command -p 64140
          PID  PPID     ELAPSED COMMAND
        64140     1 02-01:39:43 .../target/debug/deps/
                                tillandsias_tray-d53c0b1dfe1d6717 handshake

      PPID 1, elapsed TWO DAYS ONE HOUR. It did not come from this cycle — it
      predates it by two days, which means it survived every intervening cycle,
      every build, and at least one daily-maintenance pass, unnoticed.

      WHAT IT IS. `tillandsias_tray-<hash>` is the compiled unit-test binary
      for the `tillandsias-tray` bin target (crate tillandsias-macos-tray,
      Cargo.toml:11). The `handshake` argument is the self-re-exec helper
      pattern: a test spawns its OWN binary with a marker argument to act as
      the peer half of a connection. Under `cfg!(test)`,
      `std::env::current_exe()` is the TEST binary rather than the product
      binary — the exact hazard already commented on one crate over
      (tillandsias-headless/src/main.rs:2372, which guards it with
      `!cfg!(test)`); terminal_attach.rs:290 reaches for `current_exe()` with
      no such guard. Whether that specific site is the spawner is for the
      packet to confirm; the pattern and the orphan are both established.

      WHY IT MATTERS BEYOND ONE STRAY PROCESS. Three ways, in rising order of
      cost:

        1. It holds a debug artifact open. `cargo clean` and the daily
           build-cache GC (build_cache_hygiene) delete a binary that still has
           a running image, and the reclaimed-space accounting silently misses
           it.
        2. If the helper binds or connects to a fixed socket path, a stale
           two-day-old peer is exactly the kind of ghost that makes the NEXT
           run of that test flaky for reasons nothing in the log explains.
           638-ehzi is the fleet's worked example of a shared-fixture race
           costing two cycles of misdiagnosis; a live orphan is strictly
           worse than a leftover file.
        3. It is invisible. No gate, litmus, or CI phase asserts that a test
           run leaves no tillandsias processes behind. The only reason this
           was found is that a human-written line in the exit contract told an
           agent to look, and the agent happened to look on a host where it
           had been sitting for two days.

      THE GENERAL SHAPE, and it is this cycle's third instance of it: a check
      that exists only as prose in a skill is a check that runs when someone
      remembers. Compare 833-fpe7 (a refusal rule with no detector), 834-7ut9
      (a real checker that prints and does not block, 48 instances deep), and
      this (no checker at all). The fix worth having is not just reaping the
      child — it is a post-test assertion that fails loud, so the next orphan
      is caught by the run that created it rather than by a Finalization step
      two days later.

      SCOPE NOTE: this host terminated PID 64140 (TERM, confirmed gone) to
      satisfy the exit contract. That is cleanup, not a fix, and it destroyed
      the live evidence — anyone reproducing should re-run the macos-tray test
      suite and check `pgrep -f tillandsias_tray` immediately after, rather
      than looking for this PID.
