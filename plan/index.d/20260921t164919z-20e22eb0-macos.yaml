    value: "THREE OUTPUTS, each stated as what a reader sees rather than as the\nmechanism that produces it.\n\n1. EVERY verdict — ok, violation, refused and skip alike — carries the\n   subject's full `--version` line, sha and build stamp included. A reader\n   of any past run can say WHICH BINARY answered. Demonstrated on a run of\n   each of the three fixtures.\n\n2. A copy of a fixture run from outside a checkout prints\n   `refused:<fixture>:root-is-not-a-tillandsias-checkout-<path>` and the\n   runner scores the step a FAILURE. Demonstrated by copying one fixture\n   to a temp directory and running it, showing the runner's step verdict.\n   IT MUST NOT BE A SKIP — see the deliverable.\n\n3. A tray built from a different tree than the guest it drives either\n   REFUSES by name, or says in the verdict that skew could not be\n   determined. Which of the two is honest depends on what the image\n   records, and the answer measured before this row was filed is that IT\n   RECORDS NO VERSION (see context) — so a closure claiming a skew\n   refusal must first show the state it compares, or must deliver the\n   \"cannot determine\" wording instead. DO NOT CLOSE THIS BY COMPARING\n   VERSION STRINGS: two specimens below differ in git sha and agree in\n   version.\n\nPRE-FIX RESULTS ARE PART OF THE CLOSURE, both already measured: a dist/\nrun that raised a violation about the wrong subject, and a relocated copy\nthat exited 0 with a silent skip.\n\n\n[2026-09-21T16:49:19Z macos] \nDELIVERED AND MEASURED ON tlatoanis-macbook-air; PR #127 from work/1332-tdde.\n\n1. IDENTITY IN EVERY VERDICT. All three fixtures route every verdict through one\n   `verdict` helper that appends the subject, so identity cannot be separated\n   from the result. The WHOLE --version line, never a parsed field:\n     healthy  ok:macos-vz-orphan-diagnosis:4 subject=[tillandsias-tray 56.9.20.1\n              (git 8047a2d8c-dirty, built …)] image=[phase=start\n              guest_binary_sha256=absent] skew=undetermined-image-records-no-version\n     absent   skip:…:no-app-bundle-… subject=[absent(/nonexistent/tray)]\n   THAT HEALTHY LINE IS THE ROW'S OWN SPECIMEN: a 56.9.20.1 bundle against a\n   newer tree, on the filing host, visible for the first time.\n\n2. REFUSAL WHEN ROOT IS NOT A CHECKOUT, verified on all three by copying each\n   fixture out of the tree and running it:\n     refused:<fixture>:root-is-not-a-tillandsias-checkout-/var/folders/… exit 1\n   and the runner's failure grammar matches it (checked directly against\n   run-litmus-test.sh's `^(violation|refused|blocked):` test, which\n   short-circuits before any skip check).\n\n3. SKEW, ENDED HONESTLY RATHER THAN INVENTED. provision.state records no version\n   — read at vz.rs 862/864/1306 — so the verdict names both identities it can\n   see and says skew=undetermined-image-records-no-version. A refusal becomes\n   possible the moment that state names the tree that built the image; this row\n   does not pretend it can today.\n\nBINDINGS MOVED TOO, and it was not optional: both litmus greps would have eaten\nthe refused: line exactly as they would have eaten 1330-i4hu's skip: line, and\nboth failure_patterns now catch a refusal rather than only a violation.\n\nTWO DEFECTS OF MY OWN, recorded because both were caught by re-reading output\nrather than by the change looking wrong:\n  * zsh read `$name:root-…` as its `:r` modifier and silently ate \":r\", so the\n    first refusal printed `…diagnosisoot-is-not-…`. Caught by reading the\n    emitted line, not the source.\n  * the awk splices rewrite through a temp file, which does not carry the mode,\n    so all three fixtures landed 100644. The litmus step asserts `test -x`, so\n    this would have surfaced as a failure after landing. The first commit's own\n    summary printed \"mode change 100755 => 100644\" and I had looked only at the\n    name-status list. Fixed in its own commit, verified 100755 in the tree."
