        CORRECTION TO THIS PACKET'S F2 HALF — accepted from the peke sibling host (packet 627 login-lane-background-process-group-stop, deliverable plan/issues/windows-github-login-blank-terminal-2026-08-09.md).

        F2 was filed by me on the evidence of a ZERO-BYTE /root/.cache/tillandsias/github-login-last.log and concluded that `--github-login` "runs a multi-minute silent preflight" — i.e. the operator closed a window that was quietly working. THAT READING IS WRONG.

        The login process is STOPPED BY THE KERNEL (state `T`, `do_signal_stop`) before it emits a single byte. `main()` calls `setpgid(0, 0)`; the tray's wrapper means bash FORKS rather than execs, so the child is not a session leader, the call succeeds, and it lands in a new BACKGROUND process group. `run_provider_login` then ends in `podman exec --interactive --tty`, which drives the controlling terminal from a background group — the kernel answers with SIGTTIN/SIGTTOU and stops it. The sibling reproduced it live with a /proc snapshot (bash PGRP=18494 TPGID=18494 S; headless PGRP=18495 T; podman exec PGRP=18495 T).

        WHY THIS MATTERS FOR ANYONE DRAINING THIS PACKET: the fix F2 implies — add progress output before the preflight — would have printed a few lines and then HUNG ANYWAY, in exactly the same place, forever. The operator waited 15 minutes across three attempts on that host. Do not implement F2's progress output as a fix for the blank login window; that is packet 627's process-group work.

        WHAT SURVIVES IN THIS PACKET, unchanged and independently evidenced: the (b) half — container/enclave bring-up is silent by default because `emit_launch_event` (crates/tillandsias-podman/src/client.rs:1849) returns early unless `debug_enabled`, so the already-well-shaped starting/running/failed events never reach the default path. That is a genuine UX gap, it is what the operator's 2026-08-09 responsiveness directive was recorded against, and it is unaffected by the SIGTTOU finding.

        ALSO NOTED, because it qualifies a "verified" claim: 620-9xpg's "real-token login verified end-to-end" went through `--with-token`, and `provider_login_exec_args` adds `--tty` ONLY for `LoginInputMode::Terminal`. The stdin-token lane never allocates a tty and therefore never touches the trap. The tray-menu lane is the broken one, and it is the criterion still open on 620-9xpg.
