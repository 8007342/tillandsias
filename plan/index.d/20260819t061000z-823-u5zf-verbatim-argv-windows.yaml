events:
  - packet_id: windows-lane-sends-a-verbatim-argv-and-drops-its-escaping-workarounds
    event:
      type: progress
      ts: "2026-08-19T06:10:00Z"
      agent_id: windows-yolanda-opus5-20260818t2350z
      host: windows
      summary: |
        launch_spec emits a VERBATIM ARGV for project lanes. The shell, and
        with it every quoting layer, is gone from that path:

          before: /bin/bash -lc "export HOME=\"${HOME:-/root}\" && export
                  XDG_RUNTIME_DIR=... && install -d -m 0700 ... && exec
                  tillandsias-headless --cloud '8007342/tillandsias' --opencode"
          after:  /usr/local/bin/tillandsias-headless --cloud
                  8007342/tillandsias --opencode

        WHY THIS FIXES A UX FAILURE AND NOT JUST A SHAPE. notify_icon's
        argv_survives_wt_reparse admits only tokens of [A-Za-z0-9 / \ . - _ : =].
        The old third token could never qualify, so EVERY project lane took the
        conhost arm — no clickable links, no working paste — which is why the
        operator could not complete a device-code login inside a Claude or
        Antigravity lane on 2026-08-17 (805-ek9e). Every token of the new form
        qualifies, so the lane reaches spawn_wsl_terminal.

        THE THREE THINGS THE SHELL WAS DOING, and where each went:
          - `install -d -m 0700 "$XDG_RUNTIME_DIR"` -> ensure_xdg_runtime_dir(),
            already in the tree under this order.
          - `export HOME=...` / `export XDG_RUNTIME_DIR=...` -> NEW
            ensure_lane_process_env(), added this cycle. It reproduces
            `${VAR:-default}` semantics exactly, INCLUDING `/root` as HOME's
            fallback, because parity matters more than improving the default
            while both launch shapes exist.
          - `export TILLANDSIAS_VAULT_API_BASE_URL=...` -> needed nothing:
            vault_api_base_url() already self-defaults to the enclave URL in-VM.

        WHY THE BINARY AND NOT THE LAUNCHER, established by reading rather than
        assumed: PtyOpenOpts.env carries ONLY terminal identity
        (TERM/COLORTERM/LANG, audit D7) and the guest PTY handler env_clear()s
        the child, so the wire lane has no other channel for HOME/XDG_RUNTIME_DIR.
        The Windows lane has none at all — the tray spawns wsl.exe with
        spec.argv and drops spec.env entirely. The process that needs the value
        is the only thing present on every path.

        ARGV[0] IS ABSOLUTE on purpose. env_clear() means a bare
        `tillandsias-headless` would resolve only through the PATH the `-l`
        login shell used to rebuild — and removing that shell is the point.

        VERIFICATION, both crates, on this host:
          cargo test -p tillandsias-host-shell   76 passed, 0 failed
          cargo test -p tillandsias-windows-tray 93 passed, 1 failed, 7 ignored
        The single tray failure is embedded_guest_headless_matches_workspace_version
        — 827-h4tz's staged-guest version skew, identical to the pre-change
        baseline measured this cycle before touching anything. ./build.sh
        --check green (286s of gate phases).

        A STALE PIN FOUND AND REPAIRED, worth recording as its own finding.
        notify_icon's `project_lane_argv_is_never_routed_through_wt` hardcoded
        the old flattened argv "verbatim from tray.log" and asserted it was
        wt-unsafe. It kept PASSING after the product stopped emitting that
        string — a pin that is true about something nothing builds any more
        says nothing about the product, and its name then asserted the opposite
        of the shipped behaviour. Rewritten as
        `project_lane_argv_reaches_wt_and_legacy_scripts_still_cannot`: the
        REAL argv must clear the predicate, and the legacy flattened shape must
        still be refused as a negative control, so the guard cannot have been
        weakened to obtain the first result.

        The composing crate now asserts the wt-safety property itself
        (launch_spec tests), rather than leaving it to a consumer three crates
        away to notice.

      evidence:
        - "cargo test -p tillandsias-host-shell: 76 passed, 0 failed"
        - "cargo test -p tillandsias-windows-tray: 93 passed, 1 failed (827-h4tz skew), 7 ignored — identical to the pre-change baseline"
        - "./build.sh --check exit 0, 286s of gate phases"
        - "no litmus pins vm_login_shell_argv / install -d -m 0700 / argv_survives_wt_reparse — checked before changing"

