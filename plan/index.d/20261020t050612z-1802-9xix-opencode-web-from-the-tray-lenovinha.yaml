  - packet_id: the-chromium-app-window-shows-no-unsupported-no-sandbox-warning-bar
    order: 1802-w7qu
    status: ready
    kind: bug
    priority: p3
    desired_release: v0.5
    pickup_role: any
    capability_tags: [browser, chromium, ux]
    estimated_hours: 2
    owned_files:
      - images/chromium/chromium-framework-launch.sh
      - openspec/specs/browser-isolation-tray-integration/spec.md
    related: [1656-6c97]
    title: |
      Every Tillandsias Chromium window shows the infobar "You're using an unsupported command-line flag: --no-sandbox. Stability and security will suffer.", because images/chromium/chromium-framework-launch.sh adds --no-sandbox (Chromium's setuid sandbox cannot start under cap-drop ALL and no-new-privileges)
    context: |
      Operator report, lenovinha, 2026-10-20: the OpenCode Web app window opened with that warning across its top. The flag is load-bearing today: without it the container exits 21 ("no usable sandbox"). The spec scenario "Chromium sandbox flag is probed" covers only wrapper-level unknown-flag warnings, not Chromium's own infobar.
      Two directions to decide between: (a) make Chromium's namespace sandbox work inside the container (a user namespace for the sandbox, or a seccomp profile that allows clone with CLONE_NEWUSER), which removes --no-sandbox; (b) keep --no-sandbox, because the container is the sandbox, and suppress the bar (for example --test-type), recording why.
    exit_criteria:
      - 'RED FIRST: a screenshot of a fresh app window shows the --no-sandbox infobar (today)'
      - 'no Tillandsias Chromium window shows the infobar, and the chosen direction is recorded in the spec with its security reasoning'
    verifiable_closure: |
      litmus:chromium-window-shows-no-sandbox-infobar asserts the launch flags for the chosen direction and records the live screenshot.
    provenance: |
      Filed by lenovinha at the operator's direction, 2026-10-20.
    events:
      - type: filed
        ts: "2026-10-20T05:06:12Z"
        host: lenovinha
        summary: |-
          Chromium app windows show the --no-sandbox warning bar; remove it, by a working sandbox or a recorded suppression.
