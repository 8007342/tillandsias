packets:
  - packet_id: opencode-web-launched-from-the-tray-loads-in-the-confined-app-window-on-every-platform
    order: 1802-9xix
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [opencode-web, browser, router, tls, tray, cross-platform]
    estimated_hours: 8
    owned_files:
      - crates/tillandsias-headless/src/main.rs
      - crates/tillandsias-headless/src/browser_open.rs
      - openspec/specs/browser-isolation-tray-integration/spec.md
    title: |
      OpenCode Web launched from the tray opens an empty app window ("check your proxy settings"): since the 2026-08-08 hardening (63784ddb8) removed --network host from the project browser, the window is on podman's default pasta network, where opencode.<project>.localhost is the container's own loopback, and nothing replaced the route to the router
    context: |
      Operator report and measurement on lenovinha, v56.10.19.1, 2026-10-20. Tray "OpenCode Web" on cloud project 8007342/devxsd ran tillandsias --cloud 8007342/devxsd --opencode-web. The forge came up, and its opencode server listened on :4097 behind the sse proxy on :4096. The router route http://opencode.devxsd.localhost:8080 is the auth-gated reverse proxy. The window opened in app mode (no URL bar), titled opencode.devxsd.localhost, but showed only Chromium's proxy-settings error page.
      Measured cause: tillandsias-browser-devxsd has NetworkMode pasta, and getent in it maps *.localhost to its own ::1/127.0.0.1. The router publishes 127.0.0.1:8080 and 127.0.0.1:18443 on the HOST loopback, so nothing in the browser container answers. git show 63784ddb8 (615-x3b8, "harden browser ContainerSpec") removed .network("host") from the project browser and asserts its absence; no route to the router replaced it, so host-launched OpenCode Web has been unreachable since then.
      The confined windows that browser.open opens work (verified 2026-10-19 on rf3c-smoke), because browser_open.rs puts each window on its own --internal network with a forwarder container aliased router, and passes --host-resolver-rules "MAP *.<label>.localhost router:8443, MAP * ~NOTFOUND". That mapping is TLS-only on purpose: a plaintext Host header cannot be bound to a project (1651-5t7n). The opencode route exists only as plaintext http on :8080.
      Operator direction (2026-10-20): launching OpenCode Web from the tray is fully supported on every platform, now that the browser workarounds exist (the confined window network on Linux, WSLg and vz on the guests).
    exit_criteria:
      - 'RED FIRST: from a cold start, the tray-path launch (--opencode-web on a local and a cloud project) opens a window whose page is the OpenCode app, not a Chromium error page (fails today with the proxy-settings page)'
      - 'the OpenCode Web window runs on the same confined per-window network as browser.open (--internal, forwarder aliased router, host-resolver-rules mapping only *.<label>.localhost), never --network host or pasta'
      - 'the router serves the OpenCode route over TLS on its preview listener (https://opencode.<label>.localhost, leaf cert for the label), and the OTP session flow (spec:opencode-web-session-otp) runs over it'
      - 'the same launch works on macOS (vz) and Windows (WSL) through each platform window path; the Mac and Windows hosts record their runs on this row'
    verifiable_closure: |
      litmus:opencode-web-window-reaches-the-app pins the window spec (confined network, resolver rules, the TLS app URL) and the router's TLS route for opencode.<label>; the live arm records the window's page title and a screenshot that show the OpenCode app on each platform.
