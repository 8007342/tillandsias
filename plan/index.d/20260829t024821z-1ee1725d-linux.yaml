        WHAT THE CONVERSIONS ACTUALLY FOUND — the windows were not only fragile, several were UNFALSIFIABLE, which the packet did not anticipate.  Three measured on 2026-08-29 while converting:   * podman-idiomatic-error-classification asserted only the type NAME inside a     30-line window (grep 'StreamError'), so it passed whether the arm mapped to     true or to false. It could not fail if the classification INVERTED. Same for     'ParseError'; the NotFound step nested a SECOND window (-A 5) and passed on     any 'false' near the name.   * host-browser-mcp-lane-socket-shape matched ErrorCode::Unsupported in the     match arm's own COMMENT, two lines in, so the code beneath could have been     changed to any other code and the pin would have held.   * podman-idiomatic-enclave-network asserted 'tillandsias' within 2 lines — a     substring the crate path itself satisfies — so it could not fail on a wrong     FORMAT. Renaming the pattern to tilla-{}-enc passed the old form. Each now asserts the actual mapping/format, verified to FAIL on a mutated copy.  THE SHARPEST ONE, because it fails in the direction nobody looks: terminal-status-vocabulary-shape read the status list through -A3 and COMPARES it to the guard script's list. Reflowing the matches! across five lines — ordinary rustfmt output, no semantic change — makes the window see ONE status where the function has four. The step then reports the GUARD as drifted. A window that truncates an input to a comparison does not fail; it accuses something else. Measured on a copy: -A3 saw 'completed', the awk range saw all four.  COUNT: 21 at filing (2026-08-28), 23 by the next morning, 25 converted. It grew while the packet sat in the queue, which is the whole argument for the check rather than a one-off sweep.  TWO PROCESS FINDINGS WORTH MORE THAN THE SWEEP: 1. YAML SWALLOWS AWK ESCAPES SILENTLY. One conversion embedded /\$OLLAMA_LIBDIR/    in an awk regex; the YAML double-quoted scalar ate the backslash, awk read    $ as end-of-line, the range matched nothing and the step FAILED CLOSED.    Caught only because every converted command was EXECUTED as decoded rather    than reviewed as written. Anyone converting more of these must run the    decoded form; reading the diff is not enough. 2. check-litmus-pin-claims.sh (721-77yu) refused this work twice — once for the    coverage fixture's stand-in names under 748-tkjx, once because this packet's    own explanatory comments named two tests without their -shape suffix. Both    were true positives. A script naming a litmus test that does not exist reads    as verification and supplies none, and that guard is very good at saying so.
