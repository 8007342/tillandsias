      summary: |
        THE REGRESSION ARM IS ON TRUNK: 0fbffa6ce (land47). The row's closure stands on
        dc42e7271; this event adds the arm's landed SHA so a reader who asks "what stops
        this recurring" has an object on trunk to look at rather than a work ref.

        VERIFIED ON THE LANDED TREE, not on mine: ok:work-ref-lane:7/7 with ARM 0 and
        ARM 0b executing, run after checking out 0fbffa6ce.

        AND THE VERIFICATION ITSELF NEARLY REPORTED A FALSE GREEN, which is worth more
        than the arm. My first run on this host printed ok:work-ref-lane:5/5 — the
        PRE-ARM count — while `git show origin/linux-next:scripts/test-pre-push-work-
        ref-lane.sh | grep -c 'ARM 0'` said 4. The artifact check read the REMOTE blob;
        the fixture run read MY WORKTREE, which was 11 commits behind because an earlier
        `git merge --ff-only ... 2>/dev/null` had not taken and I never read its output.
        Two instruments answering about two different trees, one of them silently stale.

        THE DISAGREEMENT IS THE ONLY REASON IT SURFACED. Either measurement alone was
        plausible: 5/5 is a passing line and would have been reported as a pass, and the
        grep was correct about trunk. Had I run only the fixture I would have recorded
        "the arm is landed and green" while it had never executed on this host. That is
        this fleet's standing hazard — a green for the tree it ran on — and the specific
        lesson is narrower: WHEN AN ARTIFACT CHECK AND A RUN DISAGREE, THE RUN IS THE
        ONE MORE LIKELY TO BE ABOUT THE WRONG TREE, because `git show <ref>:<path>` names
        its subject and a worktree run does not.

        A suppressed merge is how a worktree goes stale without saying so. `-q` plus
        `2>/dev/null` on a merge means a refusal is indistinguishable from a
        fast-forward, and every measurement after it is about a tree nobody chose.
