    title: |
      The tillandsias.org update-website skill (release-refresh.sh + audit-site-claims for ask:judgement items) completes inside a forge with an ephemeral checkout and no operator: clone and history dirs default inside the forge's project scratch, the full-history runtime clone comes from the forge's mirror/remote, judgement items an agent can settle are settled per audit-site-claims, unsettleable ones end as a filed finding, and the result leaves the forge only as a git push through the mirror
    context: |
      EXISTING CAPABILITY REUSED: tillandsias.org already has
      skills/update-website (one command, last-line grammar
      ok:refreshed:<tag> | ask:judgement:<n> exit 3 | blocked:<why>),
      skills/audit-site-claims and skills/file-findings. This packet makes
      them unattended-safe; it does not write a new updater.
      Gaps read from SKILL.md today: (1) checkouts default to
      ~/.cache/tillandsias-org/clones and the history clone is "created once"
      by hand — a fresh ephemeral forge has neither; (2) "Push only when the
      operator's flow says so" and "a push to main deploys" — an unattended
      agent needs an explicit, mechanical delivery rule; (3) "Never run this
      on main / work in a worktree outside the checkout" must hold inside a
      forge's single ephemeral checkout.
      Site rule (AGENTS.md): the site is about architecture, not the fleet;
      no host names, fleet sessions or coordinator detail may enter site
      text as a side effect of the automated run.
      Delivery default filed here (operator may overrule, see story's design
      question): push to a branch website/update-<tag> and open a PR, not to
      main; deploy stays the existing push-to-main publish.
