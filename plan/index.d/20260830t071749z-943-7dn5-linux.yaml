steps:
  - packet_id: emit-flow-has-no-caller-so-overhead-ratio-has-never-been-computable
    order: 943-7dn5
    status: ready
    kind: fix
    priority: p1
    desired_release: v0.5
    release_target: local-telemetry-for-bottleneck-finding-milestone
    pickup_role: any
    depends_on: []
    capability_tags:
      - telemetry
      - metrics
      - orchestration
      - coordination
    title: >
      cycle-metrics.sh --emit-flow has no caller anywhere in the loop, so the
      flow log holds seven rows from a single day with completed=0 in every
      one and overhead_ratio has never once been computable — while
      litmus:cycle-flow-telemetry-shape stays green because it exercises the
      emitter rather than the wiring
    deliverable: >
      the worker loop emits one flow record per cycle, so `flow:` reports real
      numbers, plus a guard that fails on a STALE log rather than on a
      malformed one
    context: |
      FOUND while defining 689-zwzm's stage-lift gates (criterion 2), which
      name `overhead_ratio not degrading` as the first gate metric. It cannot
      be a gate: it has never produced a number.

      MEASURED 2026-08-30 on lenovinha:
        * .cache/metrics/tillandsias-cycle-flow.jsonl holds SEVEN rows, all
          from 2026-08-26 between 05:53Z and 17:47Z. File mtime 2026-08-26.
          Four days and many cycles across the fleet have added nothing.
        * `completed` is 0 in all seven. cycle-metrics.sh computes
          overhead_ratio only `if $c > 0`, so it has printed `-` every time
          the metric has existed.
        * `grep -rn emit-flow` over the tree finds NO caller outside
          scripts/test-cycle-flow-emit-idempotency.sh (its own fixture) and
          litmus-cycle-flow-telemetry-shape.yaml (its own litmus). The worker
          skill's section 7.0 tells agents to RUN cycle-metrics.sh and report
          its output; nothing tells them to EMIT.

      THIS IS THE SUBSTITUTION SHAPE, not a missing feature. 682-epud shipped
      the emitter and is `done`; the emitter works and its fixture proves it.
      What was never built is the call. And the litmus cannot see the gap
      because it invokes --emit-flow itself: a green light on a dead log.

      WHY IT MATTERS BEYOND ONE METRIC. overhead_ratio is the number
      682-yiz7 (greedier batching) was filed to answer and the number
      689-zwzm gates its concurrency ramp on. A ramp gated on a metric that
      is structurally `-` either never lifts, or lifts on the absence being
      read as calm. 689-zwzm's gate block therefore records G1 as BLOCKING
      and states the rule an unfed metric is a RED gate, never a pass.
    exit_criteria:
      - >
          every cycle of the worker loop appends exactly one flow record on
          the host that ran it, and `scripts/cycle-metrics.sh` reports a
          NUMERIC overhead_ratio on a host that has completed at least one
          packet. Idempotency is already pinned (801-tpxd, cycle= minting) and
          must keep passing.
      - >
          NEGATIVE CONTROL, and it is the load-bearing half: a guard fails
          when the flow log is STALE — no record newer than N cycles/hours on
          a host that has been committing — not merely when a row is
          malformed. The current litmus is green against a four-day-dead log,
          so staleness is exactly the condition nothing detects. Prove it by
          pointing the guard at the log as it stands today and watching it
          refuse.
      - >
          the fix is in the shared worker protocol, not one host's habit, so
          every host emits without being told twice.
    verifiable_closure: >
      Extend litmus:cycle-flow-telemetry-shape with a STALENESS arm: a log
      whose newest record predates the freshness horizon must be refused with
      a named verdict, and the arm must be mutation-tested by pointing it at a
      log it should accept. The existing shape arms stay; they are correct
      about the emitter and were simply never asked about the caller.
    events:
      - type: filed
        ts: "2026-08-30T07:30:00Z"
        agent_id: linux-lenovinha-claude-20260830t071426z
        host: linux
        summary: >
          Filed from the 689-zwzm criterion-2 slice. Order minted with
          `tillandsias-plan next-order`. Grouped under the 682 telemetry
          milestone because the gap is in that set's wiring, not in the ramp.
