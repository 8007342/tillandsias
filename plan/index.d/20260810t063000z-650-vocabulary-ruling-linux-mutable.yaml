packets:
  - packet_id: terminal-status-vocabulary-ruling
    order: 650-dq6u
    status: ready
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    priority: p2
    title: "TLATOANI DECISION: is the terminal status `done` (spec) or `completed` (371 packets)?"
    kind: research
    deliverable: methodology/distributed-work.yaml
    depends_on: [terminal-status-vocabulary-is-split]
    pickup_role: tlatoani
    capability_tags: [plan, methodology, governance, operator-decision]
    context: >
      649-b2e4 fixed the CODE so no finished work silently blocks: is_terminal_status()
      accepts completed|done|obsoleted. That is a union, chosen because widening can only
      stop correctly-finished work from blocking. It is explicitly NOT a ruling.

      The underlying disagreement is unresolved and only the operator can settle it:

        methodology/distributed-work.yaml -> status_transition_protocol declares the
          canonical statuses as pending/ready/claimed/in_progress/blocked/stalled/DONE/
          failed, and describes `completed` as an EVENT TYPE whose effect is "changes
          status to done". `completed` is not a declared status at all.

        the ledger has 371 packets at `completed` and 3 at `done`.

      So the documented canonical value is the rare one, and the overwhelmingly practised
      value is undocumented. Every agent that has ever written `completed` was following
      the ledger's example; the macOS lane that wrote `done` was following the spec. Both
      were reasonable and they disagreed.
    exit_criteria:
      - >
        A ruling: either the methodology adopts `completed` (ratifying practice), or the
        ledger migrates to `done` (ratifying the spec). Recorded with who/when.
      - >
        Whichever wins, `set-field` refuses the loser at write time so the split cannot
        reopen, and is_terminal_status() narrows to the ruled set in the same pass.
      - >
        `implemented` (2 packets) is dispositioned too — it is in neither the spec nor the
        practised set, and is currently NOT terminal, so anything depending on those two
        is silently blocked today.
    verifiable_closure: >
      One terminal value in the methodology, the ledger consistent with it, set-field
      refusing anything else, and litmus:terminal-status-vocabulary-shape updated to the
      narrowed set.
    notes: >
      Migration cost is asymmetric and worth stating before choosing: adopting `completed`
      is a documentation edit; migrating to `done` rewrites 371 packets. That is an
      argument about cost, NOT about which is right — the spec is the source of truth per
      CLAUDE.md, and ratifying practice purely because practice is large is how the spec
      stopped being true here in the first place.
    events:
      - ts: "2026-08-10T06:30:00Z"
        event: filed
        summary: >
          Split out of 649-b2e4 so the code fix could land without this host picking a
          winner between the methodology and 371 packets.
