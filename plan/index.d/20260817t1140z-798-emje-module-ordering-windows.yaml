# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by windows (yolanda), 2026-08-17T11:40Z.
#
# 798-emje closed by execution: the readiness probe's vsock_loopback dependency
# is now satisfied deterministically on BOTH paths, verified on genuine
# kernel-cold boots including a deliberately adverse one.
#
# It also corrects a measurement method this project has now been bitten by
# twice in the same area — see 800-7jbs below. `wsl --terminate` is not a cold
# boot for anything that lives in the kernel.
packets:
  - packet_id: wsl-terminate-is-not-a-cold-boot-for-kernel-state
    order: 800-7jbs
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "`wsl --terminate <distro>` restarts the distro's init but NOT the shared WSL2 kernel, so every module/kernel-state 'cold boot' taken that way is kernel-WARM and silently proves nothing"
    deliverable: "the cold-boot verification vocabulary distinguishes distro-cold from kernel-cold, in a place a verifier reads before designing the run: which WSL command resets what, and which one a given property actually needs"
    pickup_role: windows
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [windows, wsl, verification, fail-loud]
    tags: [verification-method, wsl, audit-2026-08-17]
    estimated_hours: 2
    context: |
      MEASURED on yolanda, 2026-08-17T11:30-11:32Z, while verifying 798-emje.

      Three "cold boots" were run as `wsl --terminate tillandsias` followed by
      a fresh `wsl -d tillandsias`. All three reported the readiness probe's
      new instrumentation as `vsock_loopback before=loaded`. The adverse test
      then REMOVED /etc/modules-load.d/tillandsias-vsock.conf entirely and
      terminated again — and the module was STILL `before=loaded`.

      That result is impossible if the boot were cold, and it is the tell:
      `wsl --terminate` kills the distro's PID 1 and its namespaces, but every
      WSL2 distro shares ONE utility VM and ONE kernel. A module loaded by an
      earlier boot stays resident across any number of `--terminate` cycles.
      Only `wsl --shutdown` tears the VM down, and only then does module state
      reset — confirmed by the monotonic clock, which read 85,806,268,214 us
      (~23.8h, the VM's uptime) after `--terminate` and 1,853,311 us (~1.8s)
      after `--shutdown`.

      WHY IT IS WORTH A PACKET. This is the same family as the already-recorded
      trap that `journalctl -b` in WSL2 does not mean "this boot" (the boot id
      does not rotate across terminate/start, so `-b` silently returns the
      ORIGINAL boot). Both have the same shape: a WSL command that looks like a
      reboot, is documented like a reboot, and resets strictly less than a
      reboot — so a verifier gets a green result from a run that never
      exercised the thing under test. The journalctl half is written down; the
      terminate/shutdown half was not, and cost a wasted adverse run in this
      very cycle even though the operator brief already carried the journalctl
      warning.

      NOT CLAIMED: that `--shutdown` is always the right granularity. It stops
      EVERY distro on the host, including build distros other agents may be
      using, so it is a coordination event and not a free reset. That tradeoff
      is exactly what the vocabulary should state.
    exit_criteria:
      - |
          A verifier reading the cold-boot guidance can tell, before designing
          a run, whether the property under test needs distro-cold
          (`--terminate`) or kernel-cold (`--shutdown`) — with the kernel
          module / boot-id cases named as the worked examples.
      - |
          The existing `journalctl -b` trap and this one are stated together,
          as one class, rather than as two unrelated anecdotes.
    verifiable_closure: |
      The cold-boot vocabulary is committed where a verifier reads it before
      designing a run, naming both members of the class (`journalctl -b` boot
      id, kernel module residency) and the `--terminate` vs `--shutdown`
      distinction, with the monotonic-clock evidence that separates them.
    events:
      - type: filed
        ts: "2026-08-17T11:40:00Z"
        agent_id: windows-yolanda-opus5-20260817T1121Z
        host: windows
        summary: |
          Found while verifying 798-emje: an adverse test that deleted the
          modules-load.d entry still reported the module loaded, because
          `--terminate` had never unloaded it. Re-run under `--shutdown`
          immediately produced the expected `before=missing`.

