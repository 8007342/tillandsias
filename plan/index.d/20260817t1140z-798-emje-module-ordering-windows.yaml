      summary: |
        VERIFIED ON GENUINE COLD BOOTS, INCLUDING THE ADVERSE ORDERING. The
        guest's unit + script were hot-swapped to exactly what the fixed code
        emits (extracted from the raw-string literals, not retyped); the live
        /usr/local/bin/tillandsias-headless was NOT touched — md5
        bde2426cb60b1f1e21d32d1cec3cf8e8 before and after.

        FIRST, A CORRECTION TO THE METHOD (filed as 800-7jbs). Three boots run
        as `wsl --terminate` + start all reported `before=loaded` — and so did
        an adverse run with /etc/modules-load.d/tillandsias-vsock.conf DELETED.
        That is impossible for a cold boot, and it is the tell: `--terminate`
        restarts the distro's init but not the shared WSL2 kernel, so the
        module was still resident from an earlier boot. Monotonic clock
        confirms it: 85,806,268,214 us (~23.8 h) after `--terminate` versus
        1,853,311 us (~1.8 s) after `--shutdown`. Only `wsl --shutdown` is a
        kernel-cold boot. Everything below was re-run that way. The three
        terminate-boots are reported as what they were — distro-cold,
        kernel-warm — and are not counted as evidence for the module property.

        KERNEL-COLD, FIXED CONFIG — 3 boots, 3 identical verdicts:
          READY_RESULT=success  READY_EXECSTATUS=0  AFTER_HAS_MODLOAD=1
          [tillandsias-ready] vsock_loopback before=loaded after=loaded
          [tillandsias-ready] vsock_listener=bound port=42420
        systemd-modules-load EXITED before the probe STARTED on every one, by
        1.185 s / 1.244 s / 1.218 s (ExecMainExitTimestampMonotonic vs
        ExecMainStartTimestampMonotonic). The ordering is measured, not assumed.

        KERNEL-COLD, ADVERSE — modules-load.d entry removed so the module is
        genuinely absent at boot. 1 boot:
          2026-08-17T11:31:36.962506Z [tillandsias-ready] vsock_loopback before=missing after=loaded
          2026-08-17T11:31:36.975972Z [tillandsias] preflight vsock_loopback loaded
          2026-08-17T11:31:37.008322Z [tillandsias-ready] vsock_listener=bound port=42420
        Read those three lines together, because they are the whole argument.
        The backstop loaded the module and the run still passed — and the
        daemon's own preflight then printed `loaded` only because the probe had
        loaded it 13 ms earlier. Under the old code this boot printed nothing
        distinguishable from a healthy one. Now it says `before=missing`, which
        is the regression signal, in the journal, on the boot it happened.
        Note also that systemd-modules-load.service reported active/success on
        that boot while loading NOTHING — which is exactly why the edge is
        `Wants=` plus a reporting backstop rather than a gate.

        THREE-STATE MATRIX, re-falsified by execution as 757-4hdt did:
          bound         exit 0  before=loaded   vsock_listener=bound port=42420
          NOT-BOUND     exit 1  before=loaded   vsock_listener=NOT-BOUND port=42999
                                (transport up, nothing accepts; socat reported
                                 "Connection reset by peer" for the dead port)
          INDETERMINATE exit 2  before=missing after=missing
                                (rmmod vsock_loopback + a modprobe stub that
                                 refuses, so the transport is genuinely gone)
        Guest restored afterwards: module reloaded, conf restored, probe back
        to exit 0.

        SOURCE-LEVEL: litmus:guest-vsock-loopback-ordered-before-readiness-probe
        8/8 PASS (new), litmus:wsl-daemon-orchestration-shape 1/1 PASS,
        cargo test -p tillandsias-windows-tray wsl_lifecycle 20/20 PASS.

        NOT CLAIMED: that a from-scratch clean-room provision was executed. The
        operator directive forbids any install path that overwrites the live
        guest binary, so the clean-room half is verified at source level (the
        modprobe-before-enable ordering is pinned by litmus step 3) and by the
        adverse boot above, which reproduces the same state the clean-room path
        produced — module absent when the probe starts.

