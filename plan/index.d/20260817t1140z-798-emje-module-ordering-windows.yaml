events:
  - packet_id: readiness-probe-depends-on-a-module-load-that-races-it
    event:
      type: progress
      ts: "2026-08-17T11:35:00Z"
      agent_id: windows-yolanda-opus5-20260817T1121Z
      host: windows
      summary: |
        IMPLEMENTED. Two paths were racing, and fixing either alone leaves the
        other; both are now deterministic, and neither uses a poll or a
        deadline.

        BOOT PATH — one declared systemd edge. tillandsias-headless-ready.service
        gains `After=systemd-modules-load.service` and
        `Wants=systemd-modules-load.service`. That service consumes
        /etc/modules-load.d/tillandsias-vsock.conf. The edge was ALREADY implied
        (systemd-modules-load is Before=sysinit.target; the ready unit is
        After=basic.target by DefaultDependencies) — but implied is not
        declared: it is invisible to a reader, unassertable by a test, and lost
        the day anyone adds DefaultDependencies=no or socket-activates the unit.
        Declaring it costs nothing at runtime and converts "it happens to work"
        into "systemd refuses to run it early". MEASURED, and this is the point
        of doing it: `systemctl show -p After` on the guest went from

          tillandsias-headless.service systemd-journald.socket basic.target
          system.slice sysinit.target

        to the same set PLUS systemd-modules-load.service. The edge is real in
        systemd's own resolved graph, not just in the file.

        `Wants=`, never `Requires=`: on a guest where the module genuinely
        cannot load, the loader fails and the probe must STILL RUN so it can
        report INDETERMINATE. Requires= would skip it and collapse the third
        state into "never ran".

        CLEAN-ROOM PATH — a statement move. inject_bootstrap_logic wrote
        modules-load.d and modprobed at its very END, ~60 lines AFTER
        `systemctl enable --now`. So a first provision started the daemon,
        started the readiness assertion, and only THEN loaded the module. That
        is precisely 757-4hdt's truly-cold recording: `preflight vsock_loopback
        missing`, module present 249 ms later. 249 ms is not a slow kernel, it
        is two statements in the wrong order. The block now runs BEFORE the
        enable, and it CONFIRMS the load (`[tillandsias-provision]
        vsock_loopback=loaded` / `=unavailable`) instead of assuming a
        best-effort modprobe worked. It does NOT fail provisioning when the
        module is unavailable — that is a legitimate guest, the host wire is
        hvsocket and never touches loopback, and the right verdict for it is
        the probe's INDETERMINATE, not a dead provision.

        WHY NOT THE ALTERNATIVES, in the order they were considered:
          * modules-load.d ALONE — already present, and already insufficient:
            it is written by provisioning, so on a first provision
            systemd-modules-load has already run and the entry only takes
            effect NEXT boot. It also cannot say whether it did anything.
          * ExecStartPre=/usr/sbin/modprobe on the ready unit — the strongest
            ordering available, and rejected: an ExecStartPre failure fails the
            unit BEFORE ExecStart, which deletes the INDETERMINATE verdict
            (exit 2) that 798-emje explicitly requires be preserved. The `-`
            prefix that would soften it is the lazy escape 757-4hdt forbids by
            name, because it makes failure advisory and unobserved.
          * a bounded wait-for-module loop — hand-rolled polling for a
            sequencing problem systemd already solves declaratively, and
            additive where the standing directive is subtractive.
          * a new module-loader oneshot unit — a whole new unit to re-state a
            dependency the framework can express in one line.

        THE BACKSTOP STAYS, and stopped being silent. The script's own
        best-effort modprobe is load-bearing (removing it recreates 757-4hdt's
        false alarm on a guest whose modules-load.d entry was never written),
        but it now prints the state it OBSERVED before acting:

          before=loaded  -> the ordering held; nothing was raced
          before=missing -> the ordering did NOT hold and only the backstop
                            saved the run

        A probe that works by winning a race and one that works because its
        dependency was satisfied print the SAME verdict. Those two words are
        the only thing that tells them apart, and their absence is how this bug
        survived from 735-ewzp through 757-4hdt to 798-emje.

        Files: crates/tillandsias-windows-tray/src/wsl_lifecycle.rs
        (ready unit literal, inject_bootstrap_logic ordering, headless-ready.sh
        instrumentation, 4 new source-pinning assertions in
        wsl_headless_service_prepares_runtime_env).

  - packet_id: readiness-probe-depends-on-a-module-load-that-races-it
