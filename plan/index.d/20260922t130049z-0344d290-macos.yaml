    value: "THE OUTPUT: for every fixture that prints a self-reported total, either the\ntotal is DERIVED from what actually ran, or the file is recorded as\nexamined-and-correct with the reason. A reader can tell which without\nre-deriving it.\n\nTHE CONTROL, and it is the same one the family always needs: for at least\none fixture changed, show that REMOVING an arm moves the printed total.\nA derived count nobody has seen move is a literal that has not been caught\nyet.\n\nDO NOT close this by editing fifteen files. The unscoreable is the point:\nthe finding is per-file and some files are fine.\n\n\n[2026-09-22T11:09:03Z macos] \nREAD THIS FIRST — WHY THE ROW EXISTS, AND WHAT WOULD CLOSE IT BADLY.\n\nTHE PIN THAT EXISTS TO CATCH THIS CANNOT FIRE AGAINST IT, and that is the\nstrongest thing here. openspec/litmus-tests/litmus-script-exec-bit-shape.yaml\npins `ok:script-exec-bits-fixture:14` DELIBERATELY, with a comment saying the\ncount is pinned to catch a wholesale fixture rewrite that drops coverage —\n\"which already happened once under 758-jw6v\". The fixture printed 14 whatever it\nran, so the pin could never fire. The guard and the guarded were agreeing on a\nCONSTANT, and both looked green.\n\nWhoever built that pin anticipated the REWRITE and not the LITERAL. That is the\ndifference between a defended PROPERTY and a defended NUMBER: a number can be\nsatisfied by a string, a property cannot.\n\nTHE FIFTEEN FILES ARE A CANDIDATE SET, NOT A FINDING, and this belongs in the\nclosure rather than only in the unscoreable because it is the thing a taker will\nget wrong under time pressure:\n  * THREE are the three already fixed (test-script-exec-bits.sh,\n    test-skills-single-source.sh, test-litmus-bindings.sh). Three for three is\n    why this row exists AND SAYS NOTHING ABOUT THE OTHER TWELVE.\n  * TWELVE ARE UNEXAMINED. Not twelve defects. A literal total is wrong only\n    where the count can DRIFT from what ran; a fixture with a fixed arm count\n    pinned elsewhere may be perfectly honest.\n  * A FILE THAT ANSWERS THE QUESTION WELL IS LEFT ALONE AND RECORDED AS\n    EXAMINED, with the reason. This is a closure requirement, not a courtesy.\n\nTWELVE MECHANICAL EDITS WOULD CLOSE THIS BADLY IN TWO WAYS: it would convert a\nsurvey into churn, and it would DESTROY THE EVIDENCE OF WHICH FILES WERE FINE ON\nPURPOSE — so the next person re-derives the same twelve, which is the cost this\nrow is trying to stop paying.\n\nTHE ONE QUESTION, in its fixture form: ask what a fixture prints when an arm\nSILENTLY STOPS RUNNING. If the answer is the same number, the total is a claim\nrather than a measurement.\n\n[2026-09-22T12:58:19Z macos] \nTHE SURVEY, DONE TO ITS MEASUREMENT AND NO FURTHER. Thirteen verdicts, not\nthirteen edits. No file below was changed.\n\nTHE COUNT IS THIRTEEN, NOT TWELVE, and the difference is worth stating because\nthis row is about miscounted populations. The candidate set is 15 on this tree:\nthe three already-derived files were test-script-exec-bits.sh (landed),\ntest-skills-single-source.sh and test-litmus-bindings.sh (fixed on work refs\n#157 and #158, which had NOT landed when the set was greped, so they still show\nliterals on trunk and still matched the pattern). 15 minus those two unlanded =\n13 unexamined.\n\nEVERY ONE OF THE THIRTEEN PRINTS A LITERAL, and on this tree every literal\nmatches what the fixture actually emitted today — so none is currently WRONG.\nThat is not the finding and must not be read as one: a literal cannot move when\nan arm stops running, so \"correct today\" is the state every one of these was in\nbefore the three known cases drifted.\n\nWHAT DISTINGUISHES THEM IS WHETHER ANYTHING CLAIMS TO COVER THE COUNT. Measured\nfrom each fixture's litmus step rather than from the file as a whole (a first\npass grepped the first (N/N) in the litmus FILE and mis-attributed another\nstep's pin to three fixtures — corrected before recording):\n\n  CLASS A — literal, and a litmus pins the FULL count. EIGHT files:\n    test-capability-manifest-guard.sh        pin \"capability manifest guard (4/4)\"\n    test-capability-routing.sh               pin \"fixture 8/8\"\n    test-litmus-tracked-file-kill-safety.sh  pin \"litmus tracked-file kill safety (4/4)\"\n    test-pre-push-version-guard.sh           pin \"pre-push VERSION guard (4/4)\"\n    test-resumable-claim-dirt.sh             pin \"fixture 6/6\"\n    test-summarize-pubspec.sh                pin \"summarize-pubspec behavior (3/3)\"\n    test-windows-only-sources-verified.sh    pin \"windows-only source verification report (11/11)\"\n    test-windows-tray-diagnose-surface.sh    pin \"windows tray diagnose surface check (6/6)\"\n  These are the script-exec-bits case exactly: a pin that BELIEVES it covers the\n  count and cannot fire, because the fixture prints the pinned number whatever\n  it ran. THIS CLASS IS WORSE THAN NO PIN AT ALL, and that is the survey's main\n  correction to the row's framing — a pin does not rescue a literal, it converts\n  an unguarded number into a guarded-looking one.\n\n  CLASS B — literal, and the litmus pin STOPS BEFORE THE NUMBER. TWO files:\n    test-gate-stamp.sh          pinned as \"PASS: gate-stamp (\"\n    test-gate-stamp-scope.sh    pinned as \"PASS: gate-stamp-scope (\"\n  The assertion is that the fixture PASSED, not how many arms ran. Nobody is\n  misled; the literal can still drift, and no guard claims otherwise. Whether\n  the truncation was deliberate I could not establish from the surrounding\n  comments, so it is recorded as observed behaviour rather than as intent.\n\n  CLASS C — literal, no litmus reference at all. THREE files:\n    test-all-fragments-intact.sh\n    test-podman-sync-budgets.sh\n    test-reclaim-stranded-claims.sh\n  Unguarded and not pretending otherwise.\n\nONE SUB-CASE WORTH ITS OWN LINE: test-summarize-pubspec.sh emits NO per-arm\noutput at all — its \"(3/3)\" is the only line it prints. Drift there is\nundetectable from output even by a reader watching the run, which the other\ntwelve are not.\n\nCONFIRMED-GOOD, recorded by name so nobody re-derives them:\n  scripts/test-litmus-kill-adjudicator.sh — derives ${pass}/${total}; proven by\n    1358-9wzz adding two arms and watching it move 5/5 -> 7/7 unaided\n  scripts/test-script-exec-bits.sh — derived, landed\n  scripts/test-skills-single-source.sh, scripts/test-litmus-bindings.sh —\n    derived on work refs #157 and #158, awaiting the freeze lift\n\nWHAT THE TAKER SHOULD DO WITH THIS: Class A is the work, and its eight pins must\nmove WITH each fixture or the pin goes on believing a constant. Class B and C\nare judgement calls that may be left alone — recorded as EXAMINED, which is the\nthing that stops the next reader re-deriving all thirteen.\n\n[2026-09-22T13:00:49Z macos] \nHEADLINE — READ THIS BEFORE THE SURVEY ABOVE.\n\nA PIN DOES NOT RESCUE A LITERAL. It converts an unguarded number into a\nguarded-looking one, which is WORSE THAN NO PIN AT ALL.\n\nThis row was filed on the opposite assumption — that a literal total might be\nhonest where the arm count is fixed and pinned elsewhere — and the survey\nrefuted it. Eight of the thirteen are in exactly that state: a litmus asserts\ntheir full count and cannot fire, because the fixture prints the pinned number\nwhatever it ran. THOSE EIGHT ARE THE WORK, and each pin must move WITH its\nfixture or it goes on believing a constant.\n\nTHE MODEL FOR WHAT GOOD LOOKS LIKE is class B, and it was not predicted by\nanyone: an assertion that STOPS BEFORE THE NUMBER — \"PASS: gate-stamp (\" —\nclaims the fixture passed rather than how many arms ran. The literal can still\ndrift and no guard pretends otherwise. Recorded as observed behaviour, not as\nintent: the surrounding comments did not establish which it was.\n\nAND ONE STATE IS WORSE THAN A WRONG TOTAL: test-summarize-pubspec.sh prints NO\nper-arm output at all, so its \"(3/3)\" is the only line it emits. Drift there is\ninvisible even to a human watching the run — not merely unasserted, unobservable.\n\nThe coordinator who filed the original framing recorded the correction as theirs;\nit is kept here because the row would otherwise read as if the survey confirmed\nits own premise, and it did the opposite."
