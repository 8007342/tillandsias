      agent_id: windows-esme-claude-20260919t193000z
      host: esmeraldinha
      summary: |-
        THE "SLOW HOST" IN THIS ROW IS A SLOW REGIME, NOT A SLOW MACHINE, AND ON ONE OF THE TWO WINDOWS HOSTS THE REGIME IS MIS-SET IN A WAY THAT COSTS GATE TIME FOR NO CAPACITY REASON. Measured on esmeraldinha and yolanda 2026-09-20, jointly, and recorded here because this row's cost model rests on a gate duration it carries as an uninspected claim.

        WHAT THIS ROW CURRENTLY CARRIES ABOUT THIS HOST, and its status is correct: "esme: ~6000s per gate; cited as the second host, not inspected from here". I am the second host and I am NOT closing that gap. I did not re-time the gate today. My own figure is ~94-100 minutes, which is consistent with ~6000s, but it comes from a prior session's note and not from a measurement in hand, so the provenance line should stay exactly as written. What follows is the REGIME that produces that duration, which I did measure today, and which is a different claim from the duration itself.

        ESMERALDINHA, measured 2026-09-20:
          .wslconfig: [wsl2] memory=8GB, processors=4; [experimental] autoMemoryReclaim=gradual. No swap/sparseVhd/pageReporting/networkingMode line.
          Guest tillandsias-build: MemTotal 7942 MB, 2048 MB swap, nproc 4. Host 16 GB, N100 (4c/4t).
          build.sh:120 therefore engages: guest < 16 GB, so CARGO_BUILD_JOBS=1.
          CARGO_TARGET_DIR: distro-native, set by the gate at scripts/with-wsl2-builder.sh:305 to /root/.cache/tillandsias-wsl2-target/$REPO_BASENAME. 57 GB, ext4, 881 GB free. Keyed by repo BASENAME, so two checkouts of the same name SHARE one target dir.
          In-tree /mnt/c/.../target: 2.2 GB, stale logs only. No .cargo/config.toml at either locus - stock linker, stock codegen-units. One checkout, two distros.

        YOLANDA, measured on that host and relayed by it with its own numbers:
          .wslconfig is two lines: [wsl2] memory=5GB. NO processors= line. Nothing else set.
          Guest: MemTotal 4.80 GiB, nproc 16. Host 16 GB, Ryzen 7 (8c/16t).
          Native CARGO_TARGET_DIR unset; in-tree target/ holds BOTH a Linux ELF and a .exe of tillandsias-plan.

        THE FINDING, and it is the ratio, not either number alone. WSL2 defaults processors to ALL logical CPUs when the line is absent. So yolanda's guest is 16 vCPUs inside 4.8 GB - 320 MB of guest RAM per vCPU, against this host's 2 GB per vCPU. A 6x difference, on the host with the BETTER processor. The memory cap makes build.sh's jobs ceiling engage there too (4.8 GB < 16 GB, so CARGO_BUILD_JOBS=1, same as here), so cargo itself behaves; but every other concurrency in the gate that sizes itself from nproc rather than from memory sizes to 16 in a guest that cannot feed 16 of anything.

        A PREDICTION OF MINE THAT WAS REFUTED, recorded because it is the obvious wrong guess. I predicted yolanda's reaps came from the jobs cap DISENGAGING - that a guest at or above 16 GB would get no cap and up to nproc rustc writers. False: its guest is 4.8 GB, so the cap engages harder there than here. The cap was never the variable. The vCPU-to-memory ratio was, and the same absent processors= line produces both.

        THE SECOND HALF, confirmed as yolanda's alone: with native CARGO_TARGET_DIR unset, a bare cargo build on the Windows side bypasses build.sh entirely, so it takes NO memory-derived cap and up to 16 jobs on the host, while the guest separately holds its 5 GB. Two rustc fleets, neither aware of the other, on one 16 GB host. That is a sequencing failure and needs no capacity story. Note also that native cargo on a Windows host is a SECOND COPY of the work and not a faster one, because ./build.sh re-execs into the builder distro and runs cargo there.

        WHY THIS BELONGS ON THIS ROW RATHER THAN A NEW ONE. This row's argument is that the pre-push rule degrades hardest on the slowest host, and it treats gate duration as a fixed property of that host. It is not fixed: a sizeable part of it is a .wslconfig regime, and at least one Windows host is paying gate time to a mis-set line rather than to its silicon. That MATTERS for how the row is read in two directions and I want both stated so neither is over-claimed:

          IT DOES NOT WEAKEN THE ROW. The row already forecloses this: "DO NOT start by making the gate faster ... any finite gate loses this race on a busy enough trunk." Tuning a regime shortens the window; it does not make the window converge against a moving trunk. Candidate 1 (plan-only trunk movement does not count as unmerged) remains the structural fix and this note is not an argument against it.

          IT DOES CHANGE THE COST MODEL. If gate duration is partly configuration, then "the slowest host" is not a stable identity, and a remedy calibrated to a specific host's minutes is calibrated to a number that can move under it. Prefer the structural fix, which does not care what the duration is, over any threshold expressed in minutes.

        WHAT IS NOT MEASURED, so it is not inferred. Defender exclusions on the repo and target directories are UNKNOWN on BOTH Windows hosts: Get-MpPreference refuses from an unelevated shell ("Must be an administrator to view exclusions"). Neither host should be assumed to have exclusions the other lacks; settling it needs an elevated comparison of both ExclusionPath lists by the operator, and it is only worth doing if reaps continue. Peak host memory during a gate is also uninstrumented on both sides. The instrument that would settle balloon-versus-exhaustion is a 1 Hz sampler reading Windows free memory and the guest's MemAvailable TOGETHER and seeing which crosses first; yolanda is wiring it on its next gate. Until then, every explanation on this axis is a theory including mine.

        A COMPARABILITY CAVEAT ON EVERY DURATION ABOVE. This host's timings are filesystem-regime-dominated - ext4 versus drvfs measured at roughly 20x on the same tree here - so no duration from this host ports to another without naming the locus and the cache state. A gate figure without those two is not a measurement.

        NO CHANGE WAS MADE ON EITHER HOST. .wslconfig is operator machine configuration, it needs wsl --shutdown to take effect, and yolanda had a land gating at the time. Yolanda is putting processors=4 (and possibly memory=8GB, which on its host still trips the sub-16GB cap) to its operator as a recommendation with these numbers. This note records the measurement, not a remedy applied.
