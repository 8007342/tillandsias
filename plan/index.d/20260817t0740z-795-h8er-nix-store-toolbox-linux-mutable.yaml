# Filed by linux_mutable (macuahuitl), 2026-08-17, from a direct operator
# question: "Can simple workers have a container/toolbox with the nix cache?
# idempotent, ephemeral(-ish, because it caches stuff), and toolbox friendly?"
packets:
  - packet_id: persistent-nix-store-for-worker-toolboxes
    order: 795-h8er
    status: ready
    desired_release: v0.5
    priority: p1
    kind: enhancement
    title: "Worker agents cold-compile ~1000 dep crates per worktree because the daemonless nix rungs start from an EMPTY store — give the toolbox a persistent store while the toolbox itself stays disposable"
    deliverable: "scripts/nix-toolbox.sh gains a persistent host-side nix store that survives toolbox/container recreation — ensure-if-missing, reuse-if-present, never duplicated, safe to delete (the next ensure rebuilds it, slowly) — plus a stated GC policy so 'ephemeral-ish because it caches stuff' cannot grow without bound"
    pickup_role: linux
    release_target: convergence-velocity-milestone
    capability_tags: [toolbox, nix, velocity, cache, idempotence]
    estimated_hours: 4
    context: |
      OPERATOR REQUEST, 2026-08-17, in their own framing: idempotent,
      ephemeral-ish (because it caches), and toolbox friendly. This is the
      caching half of the 777-amku toolbox directive; the ROUTING half is
      already done.

      OBSERVED (measured on this fleet, 2026-08-16/17):
        * scripts/nix-toolbox.sh already prefers daemon -> chroot -> toolbox
          and reports ok:nix-toolbox:chroot on macuahuitl with NO host daemon.
        * The chroot store starts EMPTY (recorded by the 765-8hc3 fork), so
          every fork agent in a fresh worktree pays a cold dependency build.
          The 790-mbk9 fork paid exactly that to verify its lane: a real cold
          build of two musl targets.
        * Concurrency is now normal — four agents built simultaneously on one
          host the night this was filed — so a shared store must be safe under
          concurrent readers/writers, not merely fast.

      LOAD-BEARING FACT, and the reason this is not speculative: crane's deps
      derivation is CONTENT-STABLE, proven by measurement in 765-8hc3 (a
      source-only edit leaves the deps drv unchanged; only a Cargo.lock edit
      moves it — which falsified audit finding F7 in the process). A
      persistent store will therefore HIT rather than churn.

      WHY THIS BEFORE 790-6n2k (the remote binary cache): that packet asks the
      operator to choose cachix (account + token + a world-readable closure)
      or self-hosted attic (a service to run), each needing a signing keypair.
      A LOCAL persistent store needs no account, no secret, no network trust
      boundary, and no operator decision — and it captures most of the win,
      because today's repeated cost is the SAME host rebuilding the same deps
      in a different worktree, not cross-host sharing. Land this first; then
      790-6n2k becomes the narrower, better-posed question of sharing between
      HOSTS, decided with real hit-rate data.
    exit_criteria:
      - "A second worktree on the same host reuses the store instead of recompiling — demonstrated with before/after wall-clock and store paths, the evidence shape 765-8hc3 used."
      - "Deleting the store directory is safe: the next ensure rebuilds it, and the verdict grammar stays honest about which rung ran and whether the store was cold."
      - "Concurrent ensures from two agents cannot corrupt or duplicate the store — the four-concurrent-agents case is the normal one now, not the edge."
      - "A GC/size policy exists and is stated, owned by the daily build_cache_hygiene lane, so the cache cannot grow without bound."
      - "nix-toolbox.sh keeps its one-line verdict contract for callers, extended rather than replaced."
    notes: |
      TRAP for the implementer: do not reintroduce a host-daemon assumption
      while adding persistence — the whole point of the directive is that no
      host state outside the toolbox/store is required. 790-mbk9's lesson also
      applies: with --store, `nix build --out-link` writes a symlink to the
      LOGICAL store path, so anything staging artifacts must resolve through
      the store root or it will silently stage nothing.
