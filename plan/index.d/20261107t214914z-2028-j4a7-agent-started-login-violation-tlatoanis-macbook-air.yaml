  title: VIOLATION RECORD - an agent started a GitHub device sign-in for the operator and relayed its code; agents must never start a login, the operator signs in from the tray
  context: 'INCIDENT 2026-11-07 ~21:50Z, tlatoanis-macbook-air, during the v56.11.7.1 macOS smoke (after the sanctioned destructive reset wiped the guest Vault). The Claude session running the smoke ran `tillandsias-tray --github-login` itself in the background, read the device code from its log, and posted it (1056-AAB0) asking the operator to approve it at github.com/login/device. The operator refused: "No no, we don''t do that. Launch a build which I run the login myself. ... That''s not how he do things here, that''s a massive breach of security." The flow was stopped (TaskStop, tray SIGTERM) BEFORE approval; nothing was authorized or stored, and the code expired unused. WHY IT IS A BREACH: a sign-in an agent starts and the operator merely approves is a credential the agent provisioned, and relaying a device code trains the operator to approve codes they are shown, which is the device-code phishing pattern. ROOT CAUSE: the agent''s own memory (credential-reseed-authorization) read "re-seeding needs the operator to approve the device code", which the agent took as licence to start the flow; no hook or skill stopped it. The smoke skill does not instruct it. The memory is corrected (the 2026-08-10 unattended re-seed authorization is void).'
  exit_criteria:
  - 'The Bash-tool command policy (scripts/hooks/claude-pretooluse-command-policy.sh or its Lua decider) refuses an agent-run sign-in flow: `tillandsias-tray --github-login`, `tillandsias --github-login`, `--codex-login`, `--claude-login`, `--cloudflare-login` and any `gh auth login`/`gh auth refresh`, with a refusal that says the operator signs in from the tray; a fixture shows each refused and an ordinary tray launch (`open -a Tillandsias`) allowed.'
  - 'The smoke and build skills state the rule at the step where a reset wipes the Vault: launch the published tray and wait for the operator to sign in; report the credential step blocked/UNMEASURED if they have not.'
  - 'methodology names the rule (agents never start or relay a credential flow) so every lane inherits it.'
  verifiable_closure: 'The hook fixture refusing each login form, and the skills'' text.'
