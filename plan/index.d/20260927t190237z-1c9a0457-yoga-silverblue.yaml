    value: yoga-silverblue 2026-09-27, MEASURED toward the placement decision - can a LINUX relay host lint the macOS tray natively-equivalently? Replayed the incident tree d44909353 in the tillandsias-builder toolbox after rustup target add aarch64-apple-darwin, running cargo clippy -p tillandsias-macos-tray --all-targets --target aarch64-apple-darwin -- -D warnings. Result rc=101 BEFORE reaching the tray crate - ring v0.17.14's build script needs a Darwin-capable C compiler (the toolbox gcc rejects -arch and -mmacosx-version-min; the toolbox has neither clang nor zig). So the Rust side is not the obstacle; one C dependency is. Untested next step, for whoever decides - clang or zig in the builder toolbox as CC_aarch64_apple_darwin, then replay d44909353 and require clippy::useless_format to fire. If it does, the relay host itself can carry the lint and criterion 3's accountable host is the relayer; if not, the obligation stays with the macOS author.
