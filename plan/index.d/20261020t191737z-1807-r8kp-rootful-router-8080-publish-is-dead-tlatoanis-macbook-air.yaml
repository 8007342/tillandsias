    context: |
      Same cause as 1794-rf3a, measured on the v56.10.18.1 macOS guest: `-p 127.0.0.1:28081:8080` on an internal network timed out while the same image on a bridge answered. 1794 (b) (PR #594) dropped the equally dead rootful 8443 publish and left this one alone because it was out of that slice. Still to establish: which in-guest caller, if any, dials the 8080 host port on a rootful guest (select_router_host_port, the http_port carried by ensure_router), and whether those callers should dial the router's enclave address instead, as the 1794 probe does.
    exit_criteria:
