      summary: >
        BLOCKING DEFECT: the per-host nix cache INVERTS its own purpose — when the cache answers, upstream substitution is lost and the build falls back to a full from-source stdenv bootstrap. Found on the N150 (Intel N150 4c/4t, 15 GiB, NVMe, Fedora Silverblue) while measuring what the cache buys on 4 cores, which nobody had done. MEASURED A/B, same host, same flake, same commit, `nix build .#tillandsias-x86_64-musl --dry-run` through TILLANDSIAS_BUILD_LANE=container: (A) cache ANSWERING (nix-cache-service.sh ensure, status running, flags injected) => "these 3145 derivations will be built", ZERO paths fetched. (B) cache STOPPED (substituter-args empty, so the wrapper injects nothing and images/builder/nix.conf applies as written) => "these 490 derivations will be built" plus "these 389 paths will be fetched (245.3 MiB download, 986.0 MiB unpacked)". Turning the cache ON therefore multiplies from-source derivations 6.4x (490 -> 3145) and eliminates 245 MiB of upstream substitution. ROOT CAUSE, precisely: nix-cache-service.sh:457 emits `--substituters "$(endpoint_host)"` and `--trusted-public-keys <cache key>`. In nix, --substituters and --trusted-public-keys REPLACE the configured value; only the --extra-* forms append. images/builder/nix.conf sets `substituters = https://cache.nixos.org` with the cache.nixos.org public key, and its own comment states the intended invariant verbatim: "Upstream stays available so a cold cache degrades to slow, never to broken." The injected flags overwrite exactly that line, so an EMPTY per-host cache becomes the only substituter and every upstream path must be rebuilt — the build starts bootstrapping tinycc-mes / bash-static / stdenv-linux from source. On this hardware that is not slow, it is unbounded; a full real (non-dry-run) attempt ran past every budget I gave it and failed with a stdenv bootstrap dependency failure. Suggested fix, NOT applied by me: emit --extra-substituters and --extra-trusted-public-keys at nix-cache-service.sh:457 so the per-host cache is added to cache.nixos.org rather than substituted for it; the nix.conf comment is then true again as written. SECOND DEFECT, independent, same run: the failed real build exited 0 through the lane. Output ended `error: Cannot build .../tillandsias-0.0.0.drv` followed by `ok:nix-populate:copied=0` and EXIT=0, so with-nix-builder.sh reports success on a build that produced nothing — copied=0 is itself the tell and is not treated as one. Any caller gating on this lane exit status will read a total failure as a pass. THIRD DEFECT, operational: an interrupted lane build leaves the `tillandsias-nix-builder` container running, and the next invocation dies with "container name already in use" — the lane self-wedges until a manual `podman rm -f`, with no --replace and no cleanup trap. Cost me two runs before I recognised it. SCOPE NOTE that reframes the original question: the lane serves NIX INVOCATIONS ONLY (with-nix-builder.sh header — the builder image carries no cargo and cannot run build.sh), so the nix cache cannot touch the build.sh --check path at all. My 11m31s cold / 3m50s warm --check figures on 941-trcf are NOT a baseline this cache was ever able to improve, and the 26% ledger-parse overhead there remains the warm-loop target regardless of any cache outcome. HOST LEFT SAFE: cache service stopped (ok:nix-cache-stop:stopped), stale builder container removed, so builds here degrade to the working upstream path rather than the broken one. Host is otherwise nix-capable (nix 2.34.8) and available to verify a fix.
