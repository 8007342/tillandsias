      - 'a budget kill is distinguishable from a failed assertion BY THE VERDICT LINE ITSELF, not by a qualifier a reader must scroll to — PRE-FIX RESULT: the verdict reads "[FAIL] spec=ci-release test=litmus:litmus-bindings-reconciliation-shape" with nothing in it naming the budget'
      - 'the reconciliation''s per-run cost is recorded somewhere a later reader can compare against — PRE-FIX RESULT: unrecorded; the 427-file figure and the 36s/37s timings in this row are the only measurements of it on the macOS tier'
