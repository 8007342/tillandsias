        TWO THINGS THE EXERCISE PRODUCED THAT ARE NOT ABOUT THIS ROW.

        `gh pr create --fill` fails for a work ref pushed from a differently named local
        branch — it resolves `<base>...<head>` as LOCAL refs, and this host works on
        work/1325-ygq5 while pushing to work/1329-m8dk. --title and --body must be
        passed explicitly. Every host using the relay lane will meet this, because the
        relay never needed a local branch matching the remote name.

        And a retraction that belongs beside the claim: I reported that opening this PR
        from a branch 27 commits behind would have proposed deleting 16 files belonging
        to other hosts. That was WRONG. `git diff <base> <head>` — two dots — compares
        two snapshots and renders everything trunk gained as deletions on my side;
        GitHub renders `<base>...<head>` — three dots — the branch's own changes since
        the merge base. Measured on the real tip: two dots gave 1 A / 16 D / 4 M, three
        dots gave 1 A and nothing else. The PR was only ever one added file. The merge
        of trunk was harmless and unnecessary, and the correction is in the PR body
        where the alarm was.

