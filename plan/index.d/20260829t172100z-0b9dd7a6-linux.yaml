      summary: >
        DECISION RECORD — (b) as an explicit operator knob, (c) as the documented default, and NOT (a) as an auto-tune. Implemented; the default is byte-identical to today.  NEW EVIDENCE THIS SLICE ADDS: THE CPU-FLOOR REGIME, MEASURED RATHER THAN INFERRED. The packet says "INFERRED: CPU-floor hosts (0.5b) are in the same regime with even lower ceilings". lenovinha runs qwen2.5:0.5b against a live Ollama, so I measured it instead.    LATENCY, 3 runs, same prompt: 927 ms / 2231 ms / 2885 ms.   All INSIDE the 3000 ms quick budget — but run 3 is within 4% of it.    CITATION CONTRACT, 4 runs, IDENTICAL prompt, keys echoed out of 2:       2/2 , 0/2 , 1/2 , 2/2   And run 2 did not merely omit a key, it FABRICATED one:       [source=cheatsheets/architecture/host-tool-disPATCH-SWEETS.md]   — an invented filename. Attribution of the 265 ms figure was wrong in 1 of 4.  THE INFERENCE IN THE PACKET IS WRONG, AND THE CORRECTION CHANGES THE DECISION. The CPU floor is NOT latency-bound. 0.5b fits the budget. What it fails is the CITATION CONTRACT, non-deterministically, on identical input. So the two regimes are different problems wearing the same symptom:    darwin/7b     : model CAN cite, is too SLOW for the budget      -> a budget problem   lenovinha/0.5b: model is FAST ENOUGH, CANNOT reliably cite      -> a capability problem  No budget change touches the second one. That is the whole reason (a) — auto-tune the budget from measured endpoint latency — is the wrong mechanism: it would not help the CPU floor at all, and on hosts that deliberately run tiny models to stay snappy it would silently stretch an interactive tier because one synthesis happened to be slow. Trading a user's latency for answer quality without asking is precisely the class of silent behaviour this repo keeps repairing, and the packet's own constraint says the answer must not regress CPU-floor interactivity.  WHAT LANDED (smallest implementation, 914-ahsy precedent):   * TILLANDSIAS_SYNTH_BUDGET_MS — a deliberate operator override, clamped to a 60 s ceiling. The darwin 7b host (10-24 s per synthesis against a 3000 ms quick budget) sets it and accepts the wait it is buying.   * THE DEFAULT IS UNCHANGED. resolve_synth_budget_ms(tier, None) == tier.budget_ms() for all four tiers, pinned by a test and mutation-verified. Every CPU-floor host is byte-identical after this change, which is what made it safe to land without a second host to try it on.   * The ceiling is not negotiable: a budget is a promise that the wait ENDS. An operator who sets ten minutes has configured a hang, not patience.  THE CITATION BAR DOES NOT MOVE, and it would have been easy to read "0/6 keys echoed" as a filter that is too strict. It is the opposite. build_envelope_scored_with_freshness cites a chunk only if its key literally appears in the prose, so the fabricated "disPATCH-SWEETS.md" matched nothing, produced zero citations, and fell back to the cited retrieval-only digest. ON THE CPU FLOOR THAT FILTER IS THE ONLY THING BETWEEN THE USER AND AN INVENTED SOURCE. Retrieval-only there is not a degraded answer — it is the more accurate one, and that is what makes (c) honest rather than a consolation prize.  EXIT CRITERION 1 is met by composition rather than by new code: the three producers already carry distinct messages (920-pxg6), so a timeout says "the model is slower than the budget allows, not missing" and names 927-2q4w; a host whose model exceeds the budget now either raises it deliberately or gets a retrieval-only answer whose mode is documented. Never a silent timeout misattributed to configuration.  EXIT CRITERION 2 (negative control) holds unchanged: SynthOutcome::EndpointFailed still produces the no-endpoint digest, distinct from TimedOut. I did not touch that discrimination.  WHAT I DID NOT DO, and it is the honest boundary of a design slice: I did not exercise this on a slow-model host. lenovinha has no 7b, so the darwin half of the verifiable_closure needs macuahuitl or tillandsias-91 to set TILLANDSIAS_SYNTH_BUDGET_MS and record the latency. The CPU-floor half is done and recorded above. I would rather hand over a measured half and name the missing one than claim a closure I cannot evidence.
