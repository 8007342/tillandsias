    title: |
      a status carried by a channel is either preserved or declared absent, and absent is a first-class value the consumer must handle — five instances in one day read a substituted integer as a verdict
    context: |
      FIVE INSTANCES, 2026-09-18, ONE SHAPE: a status READ from something other
      than the thing that produced it, with nothing marking the substitution.
        1. 1256-cqsy (macneo): a backgrounded ./build.sh --check that exited 1
           was reported `[exited with code 0]` by the wrapper.
        2. 1155-jurn (esme, yolanda): `wsl.exe … bash -lc` drops the child's rc;
           `false; echo $?` prints 0 on two Windows hosts. rc is decoration.
        3. esme: `git push` whose real exit was 1 reported PUSH_RC=0 — `$?`
           after a pipeline is the last stage's.
        4. macbookair (via macneo): a gate KILLED at 7% produced no verdict and
           the wrapper supplied 144, indistinguishable from a red to anyone
           reading the wrapper. Verdicts are TERNARY: green, red, ABSENT.
        5. macneo: a delete script printed a scripted "empty above = both
           deleted" line while both refs were still listed — a sentence that
           reads like a result, produced by nothing that checked.
      THE SHARED REMEDY, which none of the child rows states: every channel that
      carries a status must PRESERVE it or DECLARE that it cannot, and the
      consumer must be able to tell `rc=0` from `no rc reached me`. That is the
      fleet's source=absent discipline for missing data, applied to exit
      status. And the rule must say what to DO on absence — re-run, or refuse
      to push — because "treat it as unresolved" is read as "use your
      judgement", which in practice means using the wrapper's integer.
      Framing: macneo-macos and macbookair-macos, 2026-09-18; instances from
      esmeraldinha and yolanda the same day.
