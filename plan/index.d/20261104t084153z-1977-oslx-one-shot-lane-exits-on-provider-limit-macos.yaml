  context: 'Measured on tlatoanis-macbook-air, v56.11.4.1 (d55a07b5f), 2026-11-04: tillandsias-tray --cloud 8007342/tillandsias --opencode --prompt "…" printed "[forge] provider usage limit reached, retry after 2026-11-05T07:58:37Z (opencode)" and "blocked:provider-usage-limit:provider=opencode:retry_after=2026-11-05T07:58:37Z" at about 07:58Z, then nothing until the smoke''s 20-minute bound (08:12Z). The host CLI process and its VM were still running, and exited only on SIGTERM. 1941-rlim (a provider usage limit "ends the lane, and holds later launches") reports the limit correctly, but in one-shot mode the lane does not end. Evidence: plan/issues/smoke-e2e-findings-v56.11.4.1-2026-11-04-macos-macbookair.md (PR #913).'
