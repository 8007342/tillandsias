        CRITERION 1 — --install refuses on Darwin naming the macOS path.
        MEASURED: `./build.sh --install` now exits 2 and prints a refusal naming
        scripts/build-macos-tray.sh; `./build.sh --ci-full --install` takes the
        same path and also exits 2.
        PLACEMENT IS THE PROPERTY, and it is why the refusal sits immediately
        after flag parsing rather than beside the install block. THREE things
        downstream mutate state before install work begins: the FLAG_INSTALL
        pre-gate's _bump_build_version + _check_trace_coverage,
        _prepare_ci_full_install_inputs on the --ci-full --install path, and the
        main install block. Refusing at ANY of those still dirties VERSION —
        and build.sh then tells the operator not to commit the dirt it just
        made. MEASURED after both refusals: `git diff --stat -- VERSION
        Cargo.toml Cargo.lock` is EMPTY. NEGATIVE CONTROL RUN, not assumed:
        `./build.sh --check` still exits 0 (38s, gate stamp recorded), so the
        paths that DO work on macOS are untouched.
        CRITERION 2 — --init builds the binary it then executes, BEFORE the
        podman gate and the version bump. VERIFIED BEHAVIOURALLY by parking
        target/debug/tillandsias and running --init: the output order is
        `target/debug/tillandsias is absent — building it first (723-whrx)` ->
        `Compiling tillandsias-headless` -> `Finished dev profile in 2.66s` ->
        only THEN the VERSION bump. The rebuild was incremental and cost 2.66s,
        so the "a full debug build is too expensive to verify" worry carried in
        from the plan was wrong and is recorded as such. The VERSION bump that
        follows is --init's own long-documented behaviour, not something this
        change introduced; the test's dirt was reverted.
        PINNED: scripts/test-build-sh-darwin-install-refusal.sh (13 assertions)
        + litmus:build-sh-darwin-install-refusal bound under spec:dev-build
        (4 steps, all OK). The behavioural arm runs ONLY on Darwin — invoking
        `./build.sh --install` on Linux would start a real install — so off
        Darwin it falls back to source ordering, and the fixture says so rather
        than implying full coverage.
        FALSIFIED AGAINST TWO SHAPES: removing the Darwin guard fails three
        assertions; moving the --init build after require_podman fails
        init-builds-before-the-podman-gate. WORTH RECORDING — falsifying shape
        A is mildly DESTRUCTIVE: with the guard disabled the fixture's real
        `--install` ran and bumped VERSION, and that dirt persisted into the
        next runs until reverted. A falsification that disables a guard performs
        the act the guard prevents; budget for the cleanup.
        THE FIXTURE'S OWN FIRST DRAFT WAS WRONG, and the failure is instructive:
        its ordering assertions matched its OWN explanatory comment inside the
        --init block (which names require_podman and _bump_build_version while
        describing the bug), so it reported the ordering broken while the
        behavioural arm passed. Comments are now stripped before the ordering
        search. A source-shape assertion that cannot tell code from prose about
        code is worse than none — it fails on correct code and would pass on a
        block whose only mention of the gate is a comment.
