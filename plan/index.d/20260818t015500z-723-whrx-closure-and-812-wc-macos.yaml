        it was invisible from Linux. After `| tr -d '[:space:]'` the whole
        dev-build litmus suite is PASS on this host (exit 0), where it had been
        FAIL:1. Found by BINDING A NEW TEST — running the suite to check my own
        litmus surfaced someone else's broken step.
