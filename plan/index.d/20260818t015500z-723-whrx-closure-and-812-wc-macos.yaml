    title: "litmus:no-tracked-binaries-shape compared a padded BSD `wc -l` against \"1\", so the step could never go green on macOS while the guard it wraps passed cleanly"
    deliverable: "tr -d '[:space:]' on the wc count in litmus-no-tracked-binaries-shape.yaml; dev-build suite green on macOS"
    pickup_role: macos
    release_target: convergence-velocity-milestone
    capability_tags: [portability, macos, bsd, litmus, gates]
    estimated_hours: 1
    context: |
      FOUND BY BINDING A NEW TEST — running the dev-build suite to check my own
      litmus surfaced someone else's failure. Fixed in the same cycle.

      The step read:

        [ "$(echo "$out" | wc -l)" = 1 ]

      BSD `wc -l` PADS its count with leading spaces. Measured here:

        compare result: [       1] vs [1]   -> DOES NOT MATCH

      GNU coreutils prints "1" unpadded, which is why this was invisible from
      Linux. So on every macOS host the step failed with EMPTY output while
      `scripts/check-no-tracked-binaries.sh` itself passed cleanly
      (`ok:no-tracked-binaries:38 binary-classified 38 allowlisted`, exit 0) —
      confirmed on a stashed clean tree, so it was pre-existing and not caused
      by the changes in this cycle. After `| tr -d '[:space:]'` the dev-build
      suite is PASS end to end on this host.

      THIRD OF ITS CLASS IN ONE SESSION, on the host that is the declared
      bash-3.2/BSD floor:
        * 803-bqte — GNU-only `\b` in three observability readers, which made
          every macOS stamp write-only;
        * 805-pr3p — bash 3.2 rejecting "${arr[@]}" on an EMPTY array under
          `set -u`, which killed the pre-push fast lane exactly when no checker
          was missing;
        * this one — BSD `wc -l` padding.
      All three are correct on the authoring platform, fail SILENTLY or
      INVERTED on the floor, and pass `./build.sh --check` on both. The pattern
      is not "someone was careless"; it is that nothing in the loop executes
      these surfaces on a BSD userland until a macOS cycle happens to touch
      them.

      SCOPE NOT SWEPT, deliberately: `wc -l` appears in 31 litmus files. Most
      uses are counts fed to arithmetic (`-gt`, `-eq`), where padding is
      harmless because the shell strips it; only STRING comparison breaks. I did
      not audit all 31 this cycle because distinguishing the harmful use from the
      harmless one needs care and a blind `tr` sweep would be churn. Recording
      the class rather than silently half-fixing it.

      PROPOSED CONSTRAINT, filed not built (bar-raise discipline — this needs
      operator review before it can block a push): the `bash-dialect-clean` gate
      already runs on every `./build.sh --check` and stayed GREEN through all
      three defects above, so it does not cover this class. Extending it to flag
      the three now-measured shapes — GNU-only sed/grep atoms (`\b`, `\u`, `\U`,
      `\L`), bare `"${arr[@]}"` under `set -u` without a length guard, and
      STRING comparison against an unstripped `wc` count — would have caught all
      three at authoring time on Linux.
