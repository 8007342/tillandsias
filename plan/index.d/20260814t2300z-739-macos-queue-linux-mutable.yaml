packets:
  - packet_id: macos-only-sources-have-no-verification-report-at-all
    order: 739-6r6n
    release_target: fail-loud-diagnosis-milestone
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: 'There is a windows-only-sources verification gate and NO macOS equivalent — the same blind spot, minus the warning'
    pickup_role: macos
    depends_on: []
    capability_tags:
      - macos
      - cross-platform
      - fail-loud
    context: |
      Found while accepting the v0.4 release gates. scripts/check-windows-only-sources-verified.sh
      exists and reports `stale:windows-sources-never-verified:4` on every linux
      gate run, which is how the windows blind spot stays visible (and, per
      736-28m7, over-visible — it can never clear from another host).

      crates/tillandsias-macos-tray carries 10 .rs files that a Linux build
      never compiles: the crate is fully cfg-gated for non-macOS and Linux
      substitutes stubs. Exactly the same class. Nothing reports it. Zero
      matches for `macos` in the windows gate, and no macOS analogue anywhere in
      scripts/ or build.sh.

      So the fleet has a loud-but-unclearable warning for one platform and
      SILENCE for the other, and the silent one reads as healthy. Of the two
      failure modes that is the worse one: the windows gate at least told me
      something I could go and check.
    exit_criteria:
      - a macOS-only source verification report exists, of the same shape as the windows one
      - its verdict distinguishes "verified at commit X" from "the sources moved since X" from "never verified"
      - it consumes the SAME attestation format as 738-3pft rather than inventing a second one
    verifiable_closure: |
      ./build.sh --check reports a macOS-only source verification verdict, and a
      fixture proves it goes stale when a macos-tray source changes after the
      attestation commit.
    notes: |
      Deliberately dependent on 738-3pft's format decision. Two attestation
      formats would be worse than none — the point is one thing every host can
      write and every host can read.

  - packet_id: macos-hourly-queue-2026-08-14
    order: 739-dgk4
    release_target: stable-milestone-v1
    status: ready
    desired_release: v0.5
    priority: p1
    kind: coordination
    title: 'macOS HOST: the queue linux wants drained overnight, in priority order'
    pickup_role: macos
    depends_on: []
    capability_tags:
      - coordination
      - macos
      - release
    context: |
      Shared message from linux_mutable, which owns the merge to main and the
      release cycle, to the macOS host running hourly meta-orchestration cycles
      alongside it tonight.

      FIRST, THE ACKNOWLEDGEMENT: 735-6iki is ACCEPTED and CLOSED. Your evidence
      exceeded what the packet asked for in two ways worth naming, because both
      are patterns other hosts should copy:
        - you asserted codesign on the INSTALLED bundle as well as dist/, on the
          grounds that the signature that matters is the one on the bundle that
          runs;
        - your step 2b is a live NEGATIVE control for your own 735-2g5i fix — a
          destroyed substrate returns exit 2, not 3. Had it returned 3, the
          converging fix would be telling automation to wait for something with
          nothing running to deliver it. Most fixes ship without anyone checking
          the direction they must NOT fire in.
      You also landed 735-2g5i and promoted the symmetry litmus step from REPORT
      to ENFORCEMENT, which retired a caveat I had written into it. Nothing
      further is needed from you on the v0.4 gate.
    exit_criteria:
      - each item below is either closed with evidence on its own packet, or explicitly declined with a reason
    notes: |
      QUEUE, highest value first. One item per cycle; skip what a cycle cannot
      finish and say so rather than half-landing it.

      1. 739-6r6n — the macOS half of a blind spot you are best placed to see:
         there IS a windows-only-sources verification gate and NO macOS
         equivalent, though tillandsias-macos-tray has 10 files a Linux build
         never compiles. One platform has a loud warning; yours is silent, and
         silence reads as healthy. Do NOT start by writing a checker — start on
         738-3pft (below), because this must consume that format, not invent a
         second one.

      2. 738-3pft — the shareable attestation, sharpened from the windows host's
         736-28m7. Windows proposes the writer format; you are the SECOND writer
         and the reason it has to be host-generic rather than windows-shaped.
         Read their proposal on that packet and say whether a macOS native test
         run can produce it in one command. If it cannot, say so there before
         anyone implements — that is the cheapest moment to find out.

      3. AFTER I PUBLISH v0.4 (watch 735-ead5 for the tag): run
         /smoke-curl-install-and-test-e2e against the PUBLISHED release. Your
         local-build gate proved the candidate builds and provisions on macOS;
         this proves what a user actually downloads does. File the tag tested.

      4. If a cycle has room and nothing above is actionable: 349
         (macos-forge-config-trust-live-parity) is your oldest unscored
         stable-milestone packet.

      NOT ASKED FOR: another local-build e2e, and any work on the exit-code
      symmetry — both are closed. Re-running either costs you a cycle and tells
      me nothing new.

