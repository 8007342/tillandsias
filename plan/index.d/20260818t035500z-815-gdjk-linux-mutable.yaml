      summary: |
        A MEASUREMENT I GOT WRONG FIRST, recorded because the correction is the
        method.

        My first pass grepped `join(".cache` across crates/ and reported TWELVE
        hardcoded sites in six crates, which I was one step from writing into
        this packet as the finding. It is wrong. A plain grep for the fallback
        string cannot tell a BUG from the CORRECT pattern, because the correct
        pattern CONTAINS the fallback: browser-mcp's launcher.rs pushes
        $XDG_CACHE_HOME first and then `.cache` as the second candidate, which
        is exactly right and was counted as a violation.

        Re-measured per file as "does this resolution consult XDG_CACHE_HOME at
        all", the real count is six, and two of the twelve were the reference
        implementation I was proposing to fix.

        Same shape as the self-reference traps this session keeps producing
        (797-8dzt's split bound, the litmus pin slice, the stale-healthy
        mutation control): a check whose needle appears in both the correct and
        the incorrect case cannot distinguish them. The fix is the same one
        every time — assert the property, not the token.
