packets:
  - packet_id: two-cache-roots-xdg-honouring-and-home-hardcoded
    order: 815-gdjk
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "the tree has TWO cache roots — most of it resolves $XDG_CACHE_HOME with a $HOME/.cache fallback, six Rust sites (including the model cache) hardcode $HOME/.cache — so a host that sets XDG_CACHE_HOME splits its cache in two"
    deliverable: "one cache-root resolution, used everywhere; the six deviating sites routed through it, with the model-cache move handled rather than orphaning an existing download"
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags: [portability, runtime-diagnostics, fleet]
    estimated_hours: 3
    context: |
      OBSERVED 2026-08-18, macuahuitl, by reading the tree. The operator named
      this directly when prioritising 518 ("resolve the XDG_CACHE_HOME
      divergence — the litmus uses ${XDG_CACHE_HOME:-$HOME/.cache}, main.rs
      hardcodes .cache"). 518 is completed, but its fix gave the litmus a
      SCRATCH cache dir, which sidesteps the divergence rather than resolving
      it. This is the remaining half, filed separately because it is a
      different change with a migration in it.

      THE PROJECT ALREADY DECIDED, which is what makes these deviations rather
      than an open question. `init_cache_dir()` resolves XDG_CACHE_HOME and
      falls back to $HOME/.cache (main.rs:1706 -> :1710); so does the forge
      gitconfig resolver at :8734 -> :8743, browser-mcp's launcher.rs, and
      materialize-cli.rs. 29 shell and litmus sites spell it
      `${XDG_CACHE_HOME:-$HOME/.cache}`, including spec-index-ensure.sh — the
      EXPERT INDEX's own durable root — and check-daily-maintenance.sh. Order
      434 even fixed a test that raced on the real cache, and its comment
      documents the fallback as the intended contract.

      THE SIX THAT DO NOT, each reading $HOME directly and appending .cache
      with no XDG consultation anywhere in the resolution:

        crates/tillandsias-headless/src/main.rs:4142  model cache (the operator's instance)
        crates/tillandsias-headless/src/main.rs:8788  forge_gitconfig_dir
        crates/tillandsias-headless/src/main.rs:9000  forge git dir
        crates/tillandsias-headless/src/main.rs:9318  a tillandsias cache root
        crates/tillandsias-core/src/image_builder.rs:513   packages cache
        crates/tillandsias-headless/src/accel_probe.rs:98  accel probe cache

      The sharp part is that headless main.rs does it CORRECTLY twice and
      incorrectly four times, in the same file.

      NOT OBSERVED, and deliberately not claimed: any live breakage. This host
      has XDG_CACHE_HOME unset, so both spellings resolve to the same directory
      and nothing is currently wrong. The consequence on a host that DOES set
      it — expert index and daily maintenance under $XDG_CACHE_HOME/tillandsias
      while models, forge gitconfig and the packages cache land in
      $HOME/.cache/tillandsias — is INFERRED from the two spellings, not
      measured. Whoever takes this should set the variable and measure first;
      that is a ten-minute experiment and it decides whether this is a real
      split or only an aesthetic one.

      scripts/uninstall.sh:28 uses the $HOME/.cache spelling and therefore
      AGREES with the product today. I expected it to disagree — it would have
      meant 804-wfcu's model-cache reporting silently missing the models on an
      XDG host — and checked rather than asserting it. It does not.

      WHY IT MATTERS NOW rather than whenever. The fleet is about to gain
      several hosts (two 4-core low-end, an 8GB 12-year-old laptop, an RTX 3070
      laptop, an M5 macOS host, possibly a MacNeo), and hardware-matrix
      convergence depends on hosts agreeing about where cached state lives. A
      split cache root is cheap to fix while six sites deviate and expensive
      once a dozen hosts have populated two roots each.

      MIGRATION IS THE REAL WORK, not the resolution. On a host with
      XDG_CACHE_HOME set, routing the model cache through the shared resolver
      MOVES it — orphaning an existing download that is 1.5 GB on the CPU tier
      today and tens of GB once 408's GPU tier pulls larger models. The fix
      must adopt an existing cache rather than silently starting a new one.
