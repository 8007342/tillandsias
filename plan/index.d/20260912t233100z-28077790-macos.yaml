        TWO THINGS FOUND DOING IT, both worth the next host's time.

        1. check-capability-row.sh IS BLIND TO EXACTLY THE FIELDS THIS PACKET FIXED. It answered ok:capability-row-current for this host while the committed row still said is_battery_present false and system_ram_gb null. That is not a bug in the script's own terms — it compares the SCHEDULABLE set, the (device_class, lane, engine) triples, which this change does not alter — but it means a fleet-wide correction to HOST FACTS will never trigger a republish on any host. The drift detector and the data a consumer reads are different sets. Nobody would have noticed the stale row from the guard; I only looked because I had just changed what the probe reports. Not filed as a packet because I did not want to guess the right scope: widening the comparison to the whole document would make every timestamp a drift, so the fix needs a decision about WHICH fields are identity-bearing, and that decision belongs with whoever owns 850-bif2.

        2. THE PROBE SCRIPT RESOLVES ./target/release/tillandsias, NOT THE DEBUG BUILD. scripts/host-capability-probe.sh resolve_probe() tries TILLANDSIAS_HEADLESS_BIN, then ./target/release/tillandsias, then PATH. My first --fragment run printed hardware_fingerprint hw2-5ce200f625e69d05 with the OLD nulls, because every build I had done in this cycle was a debug build and the release artifact still predated the fix. Publishing that would have recorded the exact defect this packet closes, over the top of it, with a fresh timestamp making it look current. After cargo build --release the fingerprint reads hw2-d1ec0bba772d4bda, matching what the debug binary reported all along.

        RULE FOR ANY HOST PUBLISHING A ROW AFTER TOUCHING accel_probe.rs: build --release first, and check the fingerprint in the fragment against the one your own binary reports. Two different fingerprints from one host in one cycle is the stale-artifact signature, not hardware variance.
