events:
  - packet_id: lane-branch-methodology-for-a-fleet-that-outruns-its-slowest-host
    event:
      type: note
      ts: "2026-08-26T14:35:34Z"
      agent_id: linux-calmecacpilli-opus5-metaorch-20260826t135312z
      host: linux_immutable
      summary: |
        CRITERION 4, THE FAST-EXTREME REGIME — measured by macuahuitl, RELAYED
        AND RECORDED BY ME because their shell died mid-measurement (tmpfs quota,
        see below) and the data existed only in their transcript. **Everything in
        this event is MEASURED BY macuahuitl ON macuahuitl and REPORTED to me; I
        have verified none of it.** My own criterion-4 event, filed earlier this
        cycle, is the one I measured.

        THEIR REGIME, stated first because it is the point: 20 cores, 62 GiB,
        NVMe, 952 GB disk / 251 GB free, rustc 1.95.0. That is the FAST extreme
        against this host's 4-core floor, **so their wall-clock figures are a
        LOWER bound and mine are an upper one. The two bracket the fleet;
        neither is typical**, and a ruling that quotes either alone will be
        wrong in a predictable direction.

          worktree add ......... 0.15 s  (calmecacpilli 0.34 s)
          tracked source ....... 52 MB   (calmecacpilli 52 MB — exact agreement)
          .git ................. 163 -> 164 MB (shared, as here)
          new worktree target/ . ABSENT (as here)

        **THE NUMBER I ASKED FOR — cold full gate in a fresh worktree:**

          cold ./build.sh --check ..... 125 s, GREEN
          resulting target/ ........... 4.1 GB;  worktree total 4.4 GB
          warm gate, main tree ........ 48 s   -> ~2.6x, +77 s one-time
          (cargo build --workspace alone: 18 s, 345 crates, 2.6 GB — offered as
           a cross-check against my headless-alone floor, not as a derivation)

        **A CORRECTION TO BOTH OUR DISK FIGURES, AND IT FAVOURS LANES.** My
        7.7 GB and their 32 GB are both ACCUMULATED CRUFT in long-lived main
        trees — theirs is 30 GB of `debug` grown over weeks. **A fresh worktree
        that runs one full gate costs 4.4 GB, not 7.7.** So my "~9 lanes of
        headroom on 75 GB free" was roughly right for the wrong reason; the
        correct figure is closer to 16 lanes by disk alone, and the per-lane
        cost is dominated by a one-time 4.4 GB rather than by a main tree's
        historical debug output.

        **A PREREQUISITE NEITHER OF US COSTED:** a fresh worktree cannot cargo
        build at all until `scripts/build-sidecar.sh` stages its untracked
        artifact (order 710-w9kc). 16 s there. It fails loudly and names its own
        remedy, but **any lane recipe that omits it panics on first build**, and
        both of our cost models silently assumed a tree that could already
        build.

        **MY .cargo-lock CLAIM IS CONFIRMED — and they nearly reported the
        opposite.** Two concurrent `cargo build --workspace` into one shared
        CARGO_TARGET_DIR produced, in the second lane's log:

            Blocking waiting for file lock on artifact directory

        So a shared target dir DOES serialise lanes and the cheap mitigation
        does defeat its own purpose. **The near-miss is worth more than the
        confirmation**: they first grepped for "build directory" — the phrase in
        their head, not cargo's — and then for case-insensitive "blocking",
        which matched A CRATE NAMED `blocking` and returned a false positive.
        Either search would have let them tell me my argument was unsupported.
        Only reading the log found it. Related trap: the "package cache" blocks
        that appear alongside are the ~/.cargo REGISTRY lock, a different and
        harmless thing, and they are what you see FIRST.

        **AND THEY FLAGGED A CONTAMINATED MEASUREMENT OF THEIR OWN**, which is
        why the rest is usable: their first cold figure came back 17 s because
        the concurrent build they fired to test my lock claim warmed the same
        target dir mid-measurement. They ran the contention test and the timing
        test against one directory and made each the other's confound. The
        125 s / 18 s figures are clean re-runs.

        **UNREQUESTED, AND IT OUTWEIGHS THE REQUESTED PART — PACKET GAP #1
        OBSERVED LIVE ON THE COORDINATOR.** macuahuitl is ALREADY running an
        uncosted multi-worktree regime: `.claude/worktrees/` holds **13 agent
        worktrees totalling 60 GB**, created 2026-08-16/17 — nine to ten days
        ago — each with its own target/, 141 MB to 15 GB. All 13 verified clean,
        every HEAD an ancestor of origin/linux-next, nothing at risk. **But
        nothing reaped them.** That is this packet's gap #1 ("NO REAPER, AND IT
        CANNOT BE BUILT YET") measured rather than argued: **~60 GB per ten
        days.** On this host's 75 GB free that regime alone would consume 80% of
        the disk.

        **It also breaks criterion 4's framing a second way.** The criterion asks
        whether a slow host SHOULD ADOPT multiple worktrees. The live answer is
        that a host can already be running thirteen with no policy, no budget
        and no reaper — so the ruling needed is not "adopt or not" but "what
        governs the ones already there". They did not delete any (operator call;
        872-c9nd forbids automated worktree deletion) and neither would I.

        **A FLEET HAZARD, WHICH I VERIFIED ON THIS HOST BECAUSE IT APPLIES
        HERE TOO** — the one thing in this relay I did check. macuahuitl killed
        their own shell by running the lane worktree and two concurrent
        full-workspace builds inside the agent scratchpad, which lives on a
        RAM-backed tmpfs with usrquota; every Bash call and file write now fails
        with EDQUOT while the host itself is idle. They first misattributed it to
        CPU/RAM exhaustion; it is the quota.

        MEASURED BY ME, on calmecacpilli, just now:

            findmnt /tmp -> tmpfs, 3.9 GB, options include usrquota

        **This host's scratchpad is on a 3.9 GB tmpfs.** A cold gate in a lane
        worktree costs 4.4 GB. **A lane built in the scratchpad here does not
        merely risk the quota, it exceeds it by construction** — it would have
        killed this session outright. I created my measurement worktree at
        /tmp/wt-measure and did NOT build in it, which is the only reason this
        cycle survived to file anything. That was luck, not judgment.

        Do not build in the agent scratchpad. Use a path on real storage. This
        belongs in whatever lane recipe comes out of criterion 4, since the
        recipe is precisely what would tell the next agent to create a worktree
        somewhere convenient.

        SCOPE: criterion 4 only, matching their scoping and mine. Silent on
        criteria 1, 2, 3, 5, 6 and 7. Cost data for whoever rules, not a
        recommendation — neither of us has said whether lanes are worth it.
