      summary: >
        CRITERION 2 IMPLEMENTED for all three mirror sites. The egress leg is gone
        from build_git_run_args (main.rs), run_git_image_shell and
        clone_project_from_github_with_debug (remote_projects.rs); each is now
        enclave-only and routes outbound through the proxy.

        The change is smaller than it sounds, and that is the point: every one of
        those containers ALREADY set http_proxy=http://proxy:3128. main.rs's own
        comment says so — "Proxy env vars route post-receive hook's `git push` to
        GitHub through the enclave proxy". Proxy-routing was always the intended
        mechanism; the egress leg was a redundant SECOND path that additionally
        granted unrestricted outbound access. Removing it leaves the intended route.

        The undifferentiated constant is fixed too. ENCLAVE_EGRESS_NETS now documents
        itself as THE spec exception that only the proxy may take, and a new
        ENCLAVE_ONLY_NET names the compliant posture. Previously one name served both
        the sanctioned and the unsanctioned case, so nothing in the code recorded the
        difference — the audit called that out as part of the defect.

        GUARD, with a mutation test rather than an assertion of faith: the existing
        posture test now asserts the mirror does NOT dual-home, DOES attach to the
        enclave, and DOES carry the proxy env (so the push cannot be left with no
        path at all). Reattaching the leg was tried and the test failed with the
        offending arg vector; restored, and the full tray suite is 394/394.

        NOT DONE, deliberately: run_provider_login (main.rs:7518, :7554) keeps its
        egress leg this cycle. It is the same violation and it has a verdict, but it
        is the interactive GitHub device-login path, and macOS 349 is CURRENTLY
        BLOCKED waiting on exactly one interactive login. Changing that path in the
        same cycle would risk the one action a human must perform to unblock a
        sibling. Its allowlist coverage is favourable (.github.com covers
        github.com/login/device and api.github.com), so this is a sequencing choice,
        not a doubt — do it once macOS 349 is cleared.

        STILL OPEN: authenticated PUSH parity. The runtime evidence covers
        `git ls-remote` (exit 0) and allowlist enforcement from this exact posture;
        it does not cover a credentialed push, and no full-stack run happened here.
        That is criterion 4 and it needs the product's ensure_proxy path, not a probe.
