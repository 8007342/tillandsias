# recorded: the status transition is NOT declared here. `packets:` is a G-Set,
# so re-declaring 764-sunk with `status: completed` is a silent no-op — the
# exact shape plan/index.d/README.md records linux hitting on 2026-08-09, where
# 11 of 21 completions were discarded and nothing reported it.
# check-fragment-status-loss.sh caught it here BEFORE commit
# ("declared 'completed' in a fragment, folds as 'ready'"). The transition is
# made with `tillandsias-plan set-field`, which writes its own status: entry.
# The closure evidence lives in the events block below.
#
# CROSS-HOST CAPABILITY ENVELOPE, this host, measured in-guest:
#
#   accel_class=cpu-only accel_gpu=none accel_gpu_name=- accel_npu=none
#   accel_npu_name=- accel_reason=- accel_cpu_cores=16 accel_ram_gb=7
#   legacy_tier=cpu  schema_version=1
#   device: cpu / amd / "AMD Ryzen AI 7 350 w/ Radeon 860M" usable=true
#           physical=8 logical=16 system_ram_gb=7.34
#           avx512f avx512_bf16 avx512_vnni avx_vnni avx512_vbmi2 avx512_bitalg
#           avx512_vp2intersect (Zen5 — a strong CPU tier, worth recording)
#   engines: ollama/llama-server (cpu, gpu)   measurements: []
#   host: is_battery_present=true kernel=6.18.33.2-microsoft-standard-WSL2
#   cache: /root/.cache/tillandsias/capabilities.json  probe exit 0
#
# vs linux (macuahuitl): accel_class=workstation-gpu accel_gpu=usable
#                        accel_npu=present-unusable accel_reason=engine-missing
#
# The two rows are NOT comparable as written, and the difference is a DEFECT,
# not a hardware fact — see 806-2r4s. Do not build the tier matrix on this row
# until that packet lands.

packets:
  - packet_id: accel-probe-reports-none-where-its-own-contract-promises-present-unusable
    order: 806-2r4s
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "on Windows/WSL2 the accel probe reports accel_gpu=none accel_npu=none accel_reason=- on a machine whose GPU and NPU are both present and healthy — collapsing 'absent' and 'unreachable' into one value the fleet tier matrix cannot distinguish"
    deliverable: "the probe reports present-unusable with a named accel_reason on Windows when the host carries an accelerator the guest cannot reach (e.g. wsl2-no-dri, wsl2-npu-not-exposed), matching the contract lib-common.sh:3956 already documents"
    pickup_role: windows
    release_target: forge-local-experts-milestone
    capability_tags: [windows, wsl2, inference, accel, fail-loud]
    context: |
      MEASURED 2026-08-17 on yolanda, in-guest, probe exit 0:

        accel_class=cpu-only accel_gpu=none accel_gpu_name=- accel_npu=none
        accel_npu_name=- accel_reason=- accel_cpu_cores=16 accel_ram_gb=7

      CORROBORATED FROM THE WINDOWS HOST — both accelerators exist and are OK:

        Win32_VideoController : "AMD Radeon(TM) 860M Graphics", Status=OK,
                                driver 32.0.31035.1003
        Get-PnpDevice         : "NPU Compute Accelerator Device",
                                Class=ComputeAccelerator, Status=OK
        CPU                   : AMD Ryzen AI 7 350 w/ Radeon 860M, 8C/16T
        Host RAM              : 15.2 GB

      So `none` is FALSE about the machine and true only about the guest's view.

      THE CONTRACT IS ALREADY WRITTEN AND THIS VIOLATES IT. lib-common.sh:3956,
      the text the forge briefing hands every agent, says verbatim:

        `cpu-only` is never a bare verdict: when hardware is present but
        unreachable, `accel_gpu`/`accel_npu` read `present-unusable` and
        `accel_reason` names the obstruction (e.g. `cdi-spec-missing` ...
        `engine-missing` ...). Report the reason rather than concluding the node
        has no accelerator.

      This host is exactly that case and reports the bare verdict with an EMPTY
      reason. Linux gets it right (accel_npu=present-unusable
      accel_reason=engine-missing); the Windows path has no equivalent branch.

      WHY IT MATTERS MORE THAN ONE WRONG FIELD: the brief's stated goal is a
      fleet tier matrix for dynamic tiering. A matrix built from these rows
      records this machine as cpu-only HARDWARE, when it is an AI-branded APU
      with an NPU and an iGPU the runtime cannot currently reach. Those are
      different engineering problems — "buy different hardware" versus "ship a
      D3D12/DirectML lane" — and the envelope cannot tell them apart. This is
      the order-531 shape in the capability layer.

      WHAT THE GUEST ACTUALLY SEES (the raw material for the right reason codes):
        /dev/dxg          PRESENT  (crw-rw-rw- 10,258) — WSL GPU paravirt
        /usr/lib/wsl/lib  libd3d12.so libd3d12core.so libdxcore.so
        /dev/dri          ABSENT   — no DRI render node, so no Vulkan/Mesa dzn
        /dev/kfd          ABSENT   — no ROCm
        /dev/accel*       ABSENT   — NPU not exposed into WSL2 at all
      The GPU IS deliverable to the guest via /dev/dxg + D3D12; it is unreachable
      only by the engines currently shipped. That is precisely a present-unusable
      with a nameable reason.

      SECOND, SEPARATE MATRIX CAVEAT (do not lose it): accel_ram_gb=7 is the
      WSL2 guest's slice, not the machine's 15.2 GB. Cross-host comparison of
      that field compares a bare-metal number on linux with a VM allocation on
      windows. The matrix must say which it is.

      RELATED, NOT DUPLICATED: 402 (windows-inference-tier-verification) owns the
      tier itself. This packet is about the CAPABILITY VOCABULARY feeding it —
      402 cannot be verified against an envelope that cannot express the state
      this host is in.
    verifiable_closure: "on a Windows host with a PnP ComputeAccelerator or a display adapter present, the probe emits present-unusable + a non-empty accel_reason; a genuinely accelerator-free VM still emits none"
    evidence:
      - "in-guest envelope + /root/.cache/tillandsias/capabilities.json (probe exit 0)"
      - "Win32_VideoController and Get-PnpDevice ComputeAccelerator both Status=OK on the host"
      - "images/default/lib-common.sh:3956 — the documented contract this violates"

  - packet_id: windows-e2e-step-2-destroys-the-model-cache-inside-the-vhdx
    order: 806-a4tu
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "the Windows model cache lives at /root/.cache/tillandsias/models INSIDE the VHDX, so `wsl --unregister` — the e2e smoke's own Step 2 — destroys it every run; the Linux analogues (518, 804-wfcu) have no Windows counterpart"
    deliverable: "the Windows model cache is either held outside the VHDX (host-side, mounted in) or the destructive-reset step declares the loss explicitly and the runbook stops calling the result a cache"
    pickup_role: windows
    release_target: forge-local-experts-milestone
    capability_tags: [windows, wsl2, inference, testing]
    context: |
      Flagged by the linux host as unfiled for Windows; filing it. 518
      (inference-deferred-model-pulls-litmus-destructive-and-red) and 804-wfcu
      (uninstall-deletes-the-model-cache-then-reports-it-preserved) are the Linux
      analogues; linux's 2026-08-17 fragment states the mount is durable and the
      cache is not.

      On Windows the containment is worse, because the destruction is not a
      subtle unmount but the documented reset step.
      /root/.cache/tillandsias/ lives inside the tillandsias distro's
      ext4.vhdx, and skills/smoke-curl-install-and-test-e2e Step 2 (Windows lane)
      runs `wsl --unregister tillandsias`, which deletes the VHDX outright.

      CONFIRMED BY DOING IT. This host ran that exact step earlier today
      (2026-08-17T18:00Z): the 34.9 GB ext4.vhdx and the rootfs cache were
      purged, and the freshly provisioned guest came back with
      `measurements: []` in capabilities.json and no models cached. Every
      published-release smoke on Windows therefore begins by throwing the model
      cache away and then measures a cold host — while the same runbook elsewhere
      treats warm-vs-cold cache as a meaningful distinction.

      The build distro is deliberately separate for exactly this reason
      (with-wsl2-builder.sh's header: "destructive smoke e2e unregisters that
      distro on every run — coupling the build environment to the smoke substrate
      would wipe toolchains mid-cycle"). The same reasoning was never applied to
      the model cache, which is larger and far more expensive to refill than a
      toolchain.
    verifiable_closure: "a check asserting the Windows model cache path is not inside the distro that the destructive-reset step unregisters"

  - packet_id: ensure-toolbox-p3-silent-noop-property-is-red-on-a-windows-host
    order: 806-6y3h
    status: ready
    desired_release: v0.5
    priority: p3
    kind: bug
    title: "litmus:ensure-toolbox-include-shape fails on a Windows host: scripts/ensure_toolbox.sh's P3 'silent noop where no toolbox exists' property does not hold, and its negative control passes, so the assertion has teeth"
    deliverable: "either ensure_toolbox.sh is genuinely silent (rc=0, both streams empty) on a host with no toolbox, or the property declares its host-kind precondition so a Windows run reports skip rather than a false red"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [shell, guards, windows, testing]
    context: |
      OBSERVED 2026-08-17 on yolanda while running the dev-build litmus suite for
      an unrelated packet (764-sunk). Captured rather than stepped over.

      scripts/test-ensure-toolbox-properties.sh, exit 1:

        FAIL: P3 silent noop on a host with no toolbox (rc=0, both streams empty)
              — the property does NOT hold for scripts/ensure_toolbox.sh
        ok: NEG-P3 silent noop (mutant refused, so the assertion has teeth)
        -- 1 ok, 1 failed, 4 n/a

      The negative control passing is what makes this worth filing: the assertion
      can distinguish a mutant, so the red is about the artifact, not the test.

      NOT caused by this cycle's work — the cycle's diff touches
      scripts/with-wsl2-builder.sh and openspec/litmus-bindings.yaml, while this
      property exercises scripts/ensure_toolbox.sh. Recorded so a Windows host's
      dev-build suite has a known, owned red instead of an unexplained one.

      Toolbox is a Silverblue affordance, so "a host with no toolbox" is the
      NORMAL Windows condition and 4 of the 6 properties report n/a. Whether the
      fix belongs in the script or in the property's preconditions is the open
      question — do not assume the latter, because P3 is precisely the property
      that should hold off-platform.
    verifiable_closure: "scripts/test-ensure-toolbox-properties.sh exits 0 on a Windows host, or declares a host-kind precondition and reports skip rather than fail"

events:
  - packet_id: wsl2-builder-wrapper-rewrites-sourcer-shell-options
    event:
      type: note
      ts: "2026-08-17T21:30:00Z"
      agent_id: windows-yolanda-opus5-20260817t2059z
      host: windows
      summary: >
        764-sunk closed on yolanda. with-wsl2-builder.sh declared `set -euo
        pipefail` unconditionally at line 43; `source` runs in the CALLER's
        shell, so every sourcer inherited errexit/nounset/pipefail permanently —
        including local-ci.sh, whose run-every-check, report-at-end design omits
        -e on purpose and dies at its own advisory step when errexit is silently
        re-armed. Applied the pattern that landed on the Silverblue sibling
        2026-08-16: capture $- and [[ -o pipefail ]] in the CURRENT shell (never
        via $(...), which clears errexit and would record -e as absent), then
        restore by REMOVING only what the caller lacked. Deliberately NOT a
        RETURN trap — `trap - RETURN` inside the running handler does not
        reliably clear across sourced-file boundaries (observed 2026-08-16 on the
        sibling, re-firing at the next sourced file's return with the handler
        already unset). Explicit restore calls at exactly the two sourced return
        sites (the uname guard and the TILLANDSIAS_SKIP_WSL2 guard); every other
        exit in the file is `exec`, where caller options are moot. VERIFIED RED
        BEFORE GREEN via TILLANDSIAS_WSL2_WRAPPER_UNDER_TEST aimed at the pre-764
        file from git — 2 of 4 cases fail there with flags=ehuB pipefail=1 where
        the caller had none of the three; 4/4 against the fix. Four cases,
        one-directional: a caller without the options keeps none (the
        regression), a caller with all three keeps all three (a fix cannot pass
        by blanket-clearing), a mixed caller is preserved exactly (nor by
        blanket-applying), and no _W2_CALLER_* variable leaks. The fixture's own
        first draft ended each case on a counter assignment, which returns 0, so
        every case passed regardless of its assertions — kept in its comments
        because it is the same class the file exists to catch. Harness-verified
        as [PASS] litmus:wsl2-builder-shell-options-shape under
        `scripts/run-litmus-test.sh dev-build --phase pre-build --size instant`.
