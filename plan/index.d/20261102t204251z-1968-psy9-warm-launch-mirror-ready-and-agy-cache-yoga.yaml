    title: A warm forge launch has its git mirror READY in seconds, not after a per-ref startup retry-push
    context: 'MEASURED on yoga 2026-11-02 (linux-next f5bc8b9ca, trunk tray up, images cached, `--cloud 8007342/tillandsias --opencode`, 3 runs): launch to agent prompt 78.0 / 77.0 s steady state, the forge created at 61 s. The OpenCode lane re-creates the git mirror and inference containers on every launch (+3-5 s). The mirror''s GitHub fetch completes in 4 s, but images/git/entrypoint.sh sends READY only after the startup retry-push walks all 1489 refs one push each; with no upstream credential every push fails ("HTTPS upstream credential is unavailable"), 12:38:11.52 -> 12:39:00.87 = 49.3 s, then 2.3 s of probes. The opencode lane''s readiness gate is also not wrapped in bringup_timer, so mirror-seed never prints.'
    exit_criteria:
      - 'The git mirror sends READY right after its seed fetch; the startup retry-push runs after it, in the background.'
      - 'With no upstream credential the startup retry-push is skipped with ONE log line, not one failed push per ref.'
      - 'A launch reuses a healthy running git mirror and inference container instead of re-creating them (the 1956-4pxj bring-up lock still serialises it).'
      - 'The OpenCode lane''s mirror gate prints its bringup: step=mirror-seed line.'
      - 'MEASURED: a warm launch on yoga reaches mirror READY in <= 10 s, 3 runs, regime recorded.'
    verifiable_closure: 'A fixture drives the git entrypoint''s startup with N stranded refs and no credential: READY is sent before any retry-push and no per-ref push is attempted (red on today''s tree); plus the 3-run yoga measurement as an event.'
    unscoreable: 'unpinnable-until-the-guard-exists: the claimer writes the fixture and names its litmus in the same commit (1136-n8sh).'
    next_action: 'yoga: reorder images/git/entrypoint.sh (notify after the fetch, retry-push backgrounded, skipped without a credential), reuse healthy mirror/inference on the opencode lane, wrap its gate in bringup_timer, re-measure.'
    provenance: macuahuitl-fedora 2026-11-02 (coordinator) from yoga's warm-launch measurement; filed and claimed by yoga.
