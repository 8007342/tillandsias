    discovered_by: "the fleet retrospective's synthesis ran ls-remote and found ZERO salvage refs on origin"
    context: >
      THE LOSS-PREVENTION MECHANISM BUILT AFTER 872-c9nd HAD NEVER LANDED A REF
      ON ORIGIN, AND STRUCTURALLY COULD NOT for the incident class it was built
      for. Verified live on macuahuitl: `bash scripts/salvage-dirty-worktree.sh`
      from a genuinely dirty tree returned `fail:salvage:push:` — with an EMPTY
      error, because the script surfaces only the first line of stderr and git's
      refusals often begin with a blank one.

      THE STRUCTURAL CAUSE: the salvage exemption in pre-push-local-gate.sh ran
      AFTER release-preflight and the cheatsheet-sync guard. The sync guard
      inspects WORKTREE STATE — and a dirty tree containing a cheatsheet edit
      is by definition out of sync, so the guard refused the push before the
      exemption was ever consulted. yoga's destroyed dirt contained
      cheatsheets/concurrent-git/crdt-ledger-fragments.md: the net would have
      failed the EXACT incident it was built for. Any guard that inspects
      worktree state will, on some dirty tree, refuse the push that exists to
      preserve that dirty tree — so no such guard may run before the exemption.

      The exemption is now the hook's FIRST decision. Proven live in both
      directions:
        - salvage from this host's dirty tree ->
          ok:salvaged:refs/heads/salvage/macuahuitl/20260824-dirty-start, ref
          VERIFIED ON ORIGIN via ls-remote, round-tripped: both in-flight edits
          readable from the fetched ref, worktree untouched.
        - mixed push (salvage + a normal ref that actually transfers) -> full
          gate, refused on the stale stamp. My FIRST mixed control was invalid
          — an up-to-date linux-next contributes no stdin line to the hook, so
          the push was salvage-only and the exemption fired correctly; redone
          with a commit that transfers.
    exit_criteria: >
      (1) The salvage exemption is the first decision in the local gate, before
      any guard that inspects worktree state. (2) A live salvage lands a ref on
      REAL origin and round-trips. (3) A mixed push that actually transfers a
      non-salvage ref hits the full gate. All three measured, not argued.

