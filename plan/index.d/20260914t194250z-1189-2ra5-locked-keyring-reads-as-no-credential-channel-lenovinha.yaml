    unscoreable: "unpinnable-until-the-arm-exists: the deliverable is the discriminator. Future litmus scripts/test-credential-channel-names-a-locked-keyring.sh; the claimer writes it in the same commit and moves this text into verifiable_closure: with a secret-service on the bus whose collection reports Locked=true, check-credential-channel.sh answers blocked:gh-keyring-locked and its remedy text says UNLOCK and says NOT to re-auth (pre-fix result: missing:no-credential-channel, measured on lenovinha 2026-09-14T19:47Z); NEGATIVE CONTROL: a host with NO secret service at all still answers missing:no-credential-channel, and an unlocked keyring with a live token still answers ok:gh-keyring-push-verified."
    owned_files:
      - scripts/check-credential-channel.sh
    title: |
      check-credential-channel.sh reports a LOCKED-but-present keyring as missing:no-credential-channel, so the one verdict an agent gets points at re-auth — the remedy 1025-a896 forbids because it evicts every other host — when the actual remedy is to unlock a keyring that still holds a valid token.
    context: |
      MEASURED on lenovinha 2026-09-14, during the 1185-9qx6 cycle. The guard
      answered ok:gh-keyring-push-verified at 18:52Z. At 19:37Z
      land-on-platform-branch.sh integrated and re-gated GREEN and was refused
      at the push: refused:land:auth-failed, "fatal: could not read Username
      for 'https://github.com'". At 19:47Z the guard answered
      missing:no-credential-channel.
      THE CHANNEL WAS NOT MISSING. On the same host, same minute:
      gnome-keyring-daemon --components=secrets is running (pid 331152),
      org.freedesktop.secrets is on the user bus, and
        busctl --user get-property org.freedesktop.secrets \
          /org/freedesktop/secrets/collection/login \
          org.freedesktop.Secret.Collection Locked
      answers `b true`. ~/.config/gh/hosts.yml is intact and UNCHANGED since
      2026-08-20 (mtime 2026-08-20T11:36:42Z), carrying the user with the token
      held in the keyring rather than inline. `gh auth status` does not fail —
      it HANGS, because it is waiting on an unlock that cannot be prompted for
      in a headless agent session, so the guard's bounded probe times out and
      the verdict falls through every arm to missing:.
      WHY THIS IS P1 AND NOT COSMETIC. missing:no-credential-channel means
      "there is no credential here", and the obvious response to that is to
      create one — `gh auth login`. 1025-a896 forbids exactly that, because a
      re-auth on one host evicts the operator's token on all the others. So the
      guard's verdict names the single action that converts one host's locked
      keyring into a fleet-wide outage, and the guard's own header already
      distinguishes blocked:* ("the channel EXISTS but cannot be used") from
      missing:* for precisely this reason — the LOCKED case just has no arm.
      There is no ambiguity to resolve either: Locked is a boolean readable over
      the bus the guard can already reach.
      This is also why the eviction in this window is recorded as UNATTRIBUTED
      TO ANY SIBLING: nothing remote is needed to explain it. A local keyring
      locked between two checks.
      WHAT TO BUILD: before falling through to missing:, ask the secret service
      whether a collection exists and is locked. If it is, answer
      blocked:gh-keyring-locked and print the unlock remedy AND an explicit "do
      NOT run gh auth login/refresh — 1025-a896" line. Keep the 988 portability
      rule: the probe must be bounded, and a host with no busctl/no secret
      service must still reach missing: rather than a fabricated answer.
    exit_criteria:
      - 'with a present secret service whose collection reports Locked=true, the guard answers blocked:gh-keyring-locked (pre-fix result: FAILS — missing:no-credential-channel, lenovinha 2026-09-14T19:47Z)'
      - 'the remedy text names UNLOCK and explicitly says not to re-auth, citing 1025-a896'
      - 'NEGATIVE CONTROL: a host with no secret service on the bus still answers missing:no-credential-channel, and an unlocked keyring with a live token still answers ok:gh-keyring-push-verified'
      - 'the new probe is bounded via the script''s own _ccc_timeout (order 988) and never runs unbounded'
