      summary: >
        A SECOND FAILURE MODE FOR THE SAME ENVELOPE, found while grading during
        the 21:41Z coordination pass and filed as 967-xq5e. This packet's case is
        a question the corpus does not cover being answered with confident
        citations. The case measured today is a question the corpus DOES cover,
