      summary: |
        TWO SELF-INFLICTED INSTANCES OF THE SAME FAILURE WHILE BUILDING THIS,
        both caught, both worth recording because the subject of this packet is
        silence and I produced it twice in the act of removing it.

        1. THE AUDIT THAT REPORTED CLEAN. My first corpus scan was a ruby
           one-liner containing `d = YAML.load_file(f) rescue exit 0`, run in a
           shell loop with `2>/dev/null`. `rescue exit 0` is a SyntaxError in
           this ruby, so EVERY invocation died before parsing anything, stderr
           was discarded, the loop printed nothing, and I read the empty output
           as "corpus clean". It is not clean; there are three. This is exactly
           the defect I filed against spec-index-ensure.sh two cycles ago
           (`curl ... 2>/dev/null`, so a 400 became "refused" with no cause) —
           committed by me, in an audit, for the same class of bug.

        2. THE ADVISORY THAT PRINTED NOTHING. The first wiring joined file and
           id with "\\t" inside double quotes — a literal backslash-t, not a
           tab — and the reader split on a real tab. Nothing ever split, every
           line hit `continue`, and the block printed nothing while the guard
           reported ok. Removed the separator entirely: each id is prefixed
           with its file at collection time.

        WHAT CAUGHT BOTH was refusing to accept a negative result from a thing
        I had not seen succeed. The scan "found nothing" on a corpus I had just
        been told contained three; the advisory "worked" on a corpus where I
        knew three instances existed. In both cases the check was cheap:
        run it against a case that MUST produce output.

        The general rule this session keeps re-deriving, now for the fourth
        time in different clothes: a checker that has never been observed to
        fire is not evidence of absence. Silence has to be earned.
