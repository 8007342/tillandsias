    kind: bug
    title: "a packet DEFINITION written under `events:` instead of `packets:` passes every gate and is dropped entirely by the fold — no packet_id is claimed, so even the unknown-packet check cannot see it"
    deliverable: "the fold's silence becomes a named advisory: file, packet_id, and the remedy"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [plan-tooling, fail-loud, ledger]
    estimated_hours: 3
    context: |
      OBSERVED 2026-08-18, on a real closure. The 801-kqme fork filed three
      follow-up packets (801-x1nx, 801-vm4p, 801-7tqe) as entries under the
      top-level `events:` key rather than `packets:`. Every signal was green:
      `./build.sh --check` rc=0, `plan check` rc=0, the fragment's own status
      transition folded correctly, and `closure-evidence-check` was satisfied.
      All three packets simply did not exist. The fork found out by asking for
      them back rather than trusting the green, and filed a corrective fragment.

      WHY THE EXISTING CHECKS CANNOT SEE IT. 797-qm4t closed three channels —
      a status block, a terminal event, and (tonight) any non-terminal event —
      that name a packet_id the fold does not know. This entry names no
      packet_id as an event at all. It is a well-formed DEFINITION sitting
      under the wrong key, so there is nothing for those passes to compare
      against. Verified in a sandbox before writing any code: `plan check`
      rc=0, `plan status 901` -> "no packet matches", and
      check-fragment-status-loss.sh -> `ok:no-fragment-status-loss:1 checked`.

      THE SIGNATURE IS UNAMBIGUOUS: an `events:` entry with NO `event:` key
      that DOES carry definition fields (order / title / kind / deliverable).
      A real event always nests `event:`; a real definition never appears here.
      Requiring a definition field, rather than merely "no event key", keeps a
      malformed-but-intended event from being misreported as a lost packet.

      ADVISORY, NOT VIOLATION, on the same terms as 797-qm4t's non-terminal
      channel: the three live instances sit in an append-only fragment nobody
      may rewrite, and 699-dycj forbids making one host's past mistake every
      host's red build. The silence was the defect.
