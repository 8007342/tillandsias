packets:
  - packet_id: litmus-pin-claims-unverified
    order: 721-77yu
    release_target: architecture-audit-epic
    status: ready
    desired_release: v0.5
    priority: p2
    kind: fix
    title: 'A script can claim "Pinned by litmus:<name>" for a litmus test that does not exist, and nothing checks'
    pickup_role: any
    depends_on: []
    capability_tags:
      - gates
      - fail-loud
      - traceability
    context: |
      scripts/check-added-fragments-parse.sh carried the header line "Pinned by
      litmus:added-fragment-parse-gate-shape" from the day it was written (order
      698-7n6q). No such litmus test existed. The claim read as verification and
      supplied none — a reviewer who greps for the pin finds the sentence, not
      the test.

      The gap was found while closing 720-24u6 and the missing test was written
      in that same commit, so the specific instance is closed. A sweep of every
      `litmus:<name>` token appearing in scripts/*.sh against the `name:` fields
      in openspec/litmus-tests/ found no other live false claim — which is the
      argument FOR a guard, not against one: the invariant currently holds by
      accident and nothing keeps it holding.

      There is a second, weaker link in the same chain: a litmus file can exist
      and still never run, because execution is driven by
      openspec/litmus-bindings.yaml. The new test passed 6/6 locally while being
      silently absent from every suite run until it was bound. An unbound litmus
      is as inert as a missing one.
    exit_criteria:
      - a check resolves every `litmus:<name>` token claimed in scripts/ against the litmus-test name set and fails naming any unresolvable claim
      - the same check verifies each resolved test is BOUND in openspec/litmus-bindings.yaml, since an unbound test never executes
      - a fixture script claiming a nonexistent litmus name fails the check, and a fixture claiming a real bound one passes
    verifiable_closure: |
      A fixture script whose header claims `litmus:does-not-exist` makes the
      check exit non-zero and name that token; a fixture claiming a real, bound
      test passes. Wired into ./build.sh --check.

