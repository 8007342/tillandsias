  - packet_id: compaction-launders-unquoted-timestamps
    event:
      type: progress
      ts: "2026-08-13T20:05:00Z"
      agent_id: "linux-mutable-20260813t1917z"
      host: linux_mutable
      summary: >
        All three exit criteria met. (1) Fragment-writing subcommands already
        emit quoted timestamps — all six `ts:` emitters in
        crates/tillandsias-plan/src/main.rs (set-field, append-event,
        loop-status-append and their callers, lines 2748/2920/3025/3066/3180/3188)
        write `ts: "{ts}"`. So the 231 bare scalars folded on 2026-08-13 came
        from HAND-AUTHORED fragments, not from the tool; the criterion was
        satisfied before the packet was filed and the real hole was the
        admission gate. (2) scripts/check-added-fragments-parse.sh now refuses an
        added/modified fragment carrying an unquoted ISO-8601 `ts:` scalar,
        verdict `violation:added-fragment-bare-timestamp:<n>`, diff-scoped like
        the rest of that gate so an inherited fault warns rather than turning
        every host's push red. (3)
        scripts/check-plan-schema-divergence.sh gained a third verdict,
        `blocked:index-load-failed: <file>: <first line of parser message>`, and
        build.sh no longer restates "vocabularies diverge" for every failure
        mode — the verdict line is now the cause.
        NEW litmus:added-fragment-parse-gate-shape (6/6 PASS) pins all of it
        with hermetic throwaway-repo NEGATIVE controls: a bare-timestamp
        fragment must be refused, the same fragment quoted must pass (so the
        refusal cannot be a gate that rejects everything), an unloadable index
        must report index-load-failed and must NOT report a divergence, and the
        live ledger must load and agree. That test did not exist despite the
        script claiming it as its pin since 698-7n6q; filed as 721-77yu.

  - packet_id: compaction-launders-unquoted-timestamps
    event:
