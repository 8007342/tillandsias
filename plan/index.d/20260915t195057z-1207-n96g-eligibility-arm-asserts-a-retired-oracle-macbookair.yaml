    context: |
      HANDED TO THIS HOST 2026-09-15 by macuahuitl; the MECHANISM AND THE
      REMEDY HOOK ARE macneo's WORK and are credited here rather than
      re-derived. Verified independently on this host before filing, by symbol
      rather than by line:

        vz_guest_is_live()            e2e-preflight.sh, defined and consulted
                                      by the eligibility verdict
        TILLANDSIAS_VZ_IMAGE_OVERRIDE documented in that function's comment as
                                      existing "so the fixture can point this
                                      at a file it controls"
        the litmus arm                13 podman references, ZERO VZ-shaped ones

      WHY IT CANNOT PASS, and the reason is better than "the probe consults
      something else". 723-fndi removed podman from the Darwin path
      DELIBERATELY: asking podman there produced a verdict carrying NO
      INFORMATION — it printed skip:live-runtime-present both with nothing
      running AND with a live VM (measured 2026-08-17). A constant is not a
      probe. So the more thoroughly the arm stubs podman, the more certainly it
      fails: it is asserting the oracle that was retired for being uninformative.

      WHAT CHANGES THE SCOPE, found by reading the neighbours rather than the
      arm: THE DARWIN CONSTRUCTION ALREADY EXISTS AND IS GREEN. `bash
      scripts/e2e-preflight.sh fixture` answers 4/4 on this host, TRUE_RC=0
      captured unpiped:
        ok: unheld-image-is-not-a-live-runtime (eligible)
        ok: held-image-refuses (skip:live-runtime-present)
        ok: released-image-is-eligible-again (eligible)
        ok: absent-image-is-not-a-live-runtime (eligible)
      It is exactly the remedy the hand-off described — temp image, the override,
      hold it open, a genuine skip:live-runtime-present through the real code
      path — plus two cases nobody named (release-then-eligible-again, and
      absent-image).

      SO THE DEFECT IS NOT A MISSING DARWIN BRANCH. It is that the litmus arm
      does not USE the construction sitting beside it in the same tree. That is
      the third instance this week of a remedy that already existed with nothing
      pointing at it — the others being a next_action advertising landed work,
      and a symbol search asking whether a consumer NAMES a type when it only
      prints its Display.
