packets:
  - packet_id: forge-smoke-verdict-depends-on-how-much-the-agent-chose-to-run
    order: 822-4vwa
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "the forge smoke lane's verdict is not reproducible — the same prompt on the same host passed once and failed at 1/252 the next time, because 'keep it small' does not name a set"
    deliverable: "the smoke runbook names an EXACT verification set that is passable inside a forge, so two runs of the same prompt cannot disagree"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [meta-orchestration, ci-gates, fail-loud]
    estimated_hours: 3
    context: |
      OBSERVED 2026-08-18, macuahuitl, seven consecutive e2e Step 1 runs. Two
      of them reached a working smoke lane (i.e. after 818-cgpn stopped the
      credential guard from ending the run early). They disagreed:

        20260818T053811Z  post-build PASSED 11/11, forge lane MO-SMOKE: PASS
        20260818T063931Z  FORGE_EXIT=126,
                          MO-SMOKE: FAIL litmus pre-build 0% pass rate (1/252);
                          infrastructure-dependent failures expected but unconfirmed

      Same launcher, same prompt ("Use the /meta-orchestration skill in smoke
      mode (verify-only)"), same host, ~25 minutes apart, seed verified fresh
      both times (`seed-staleness: ... behind=0 fetch-age-h=0 verdict=fresh`).

      THE SECOND AGENT DID NOTHING WRONG. It ran the pre-build litmus suite,
      got 1/252, and refused to call that a pass, saying so precisely: "most
      failures are likely infrastructure-dependent (vault, podman, vsock
      unavailable in this forge), but the core forge substrate is healthy" —
      and then failed BECAUSE it could not confirm that. That is exactly the
      fail-loud discipline this milestone is about. The first agent's PASS is
      the one that should worry us: it presumably ran a smaller set and never
      met the wall.

      THE ROOT IS THE RUNBOOK, not either agent. Smoke Mode rule 2 says
      "prefer `scripts/run-litmus-test.sh --size instant --phase pre-build
      --compact` scoped with a spec filter when targets are named, plus cheap
      direct checks ... Skip anything that builds, launches containers, or
      exceeds the budget." Inside a forge, a large fraction of pre-build litmus
      DOES need containers (vault, podman, vsock), so an agent that follows the
      first clause literally collides with the third, and how it resolves that
      decides the verdict. A gate whose result depends on how much the agent
      chose to run is not a gate.

      WHAT IT COSTS: this is the LAST thing standing between this host and the
      destructive e2e (§2/§3), which has now been unreachable for four days.
      Seven Step 1 attempts tonight each failed for a DIFFERENT real reason;
      six are fixed, and this is the seventh.

      PROPOSED, not implemented, because a second unverified skill change on
      one night is how this kind of thing compounds: name the in-forge
      verification set explicitly — an enumerated list of spec filters known to
      pass without vault/podman/vsock — and have the runbook say that a
      container-dependent litmus inside a forge is SKIPPED with a named reason,
      never counted as a failure. The enumeration must be checked by something,
      or it rots the first time a test gains a container dependency.

      HISTORICAL NOTE, for whoever wonders whether this ever worked:
      20260806T085959Z is a Step 1 run with rc=0 and post-build passed. So the
      lane is not perpetually broken — it regressed since 2026-08-06.
