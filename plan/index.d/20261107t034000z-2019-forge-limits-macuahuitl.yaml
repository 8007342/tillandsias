- packet_id: a-batch-job-cannot-freeze-the-agent-that-started-it
  order: 2019-mfrz
  status: ready
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [forge, design]
  estimated_hours: 5
  title: A memory-hungry batch job in a forge cannot freeze the agent that launched it
  context: 'On 2026-11-06 a project script with 8 parallel workers held about 11 of a forge 12 GB limit. No OOM kill fired, the forge stalled on memory about 90% of the time for 20 minutes, the agent looked hung with unpushed work, host swap filled and a land gate flaked. podman exec also timed out, so the agent could not be reached that way. Related: 1913-fh6l protects the forge from other work, not an agent from its own children.'
  exit_criteria:
  - 'With a child using memory past a stated threshold, the agent process stays responsive, shown by a measured response under a real pressure fixture in a forge.'
  - 'The offending job is throttled or killed by a stated rule, the agent is told which and why, and the forge and its checkout survive.'
  verifiable_closure: 'A real pressure run in a forge on a Linux host.'
  unscoreable: 'none.'
  next_action: 'Design first: compare a child sub-cgroup with its own memory.high, memory.oom.group and oomd pressure rules, in rootless podman, and state which the host allows.'
  provenance: coordinator macuahuitl-fedora 2026-11-06, live incident.
  events:
  - {type: filed, ts: '2026-11-07T03:40:00Z', host: macuahuitl, summary: filed p1 ready}
