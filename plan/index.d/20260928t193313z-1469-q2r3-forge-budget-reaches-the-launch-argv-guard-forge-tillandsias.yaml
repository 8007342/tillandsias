    title: |
      THE PART OF 981-n5vx THE NEW DESIGN DOES NOT COVER: ForgeBudget (1375-xxzj) is wired at the forge launch sites, but every test asserts only the pure podman_args(); nothing asserts that a real forge launch argv carries the --memory / --cgroup-conf budget, or that the live cgroup holds it, so a launch site that drops it stays green — the exact shape 981 found for the old ceiling
    context: |
      981-n5vx is obsoleted by the 2026-09-26 forge memory/swap design
      (plan/issues/forge-memory-swap-architecture-design-2026-09-26.md,
      crates/tillandsias-core/src/forge_budget.rs): the budget writes the cgroup
      files deliberately and never uses --memory-swap, because that flag measured
      differently across hosts (lenovinha 1 GiB, yoga 2 GiB, for the same flags).
      981's MECHANISM (a helper nothing calls) is fixed: for_this_host() is
      called at crates/tillandsias-headless/src/main.rs (2 argv builders + the
      ContainerSpec path), tray/mod.rs, and tillandsias-podman launch.rs.
      981's GUARD INTENT is NOT covered, measured 2026-09-28 by forge-tillandsias:
      `git grep "cgroup-conf\|--memory="` finds no assertion in the headless,
      tray or podman tests, and forge_budget.rs's tests (tiers, anon peaks,
      pids clamp, no --memory-swap, meminfo) are all on the pure computation.
      981's own words apply unchanged: "the guard asserts the ARGV or the
      resulting live cgroup, not the pure helper", "verified to FAIL when the
      flags are removed".
    exit_criteria:
      - 'every forge launch-argv builder (the headless agent/opencode lanes, the ContainerSpec path, the tray) has a test asserting its argv carries the ForgeBudget flags (--memory=… and the --cgroup-conf memory.high / memory.swap.max entries), enumerated from the builders rather than a hand list, so a new builder without the budget fails'
      - 'a mutation control: removing the budget from one builder turns that test red'
      - 'optionally, where podman is available, one live check reads memory.max / memory.high / memory.swap.max from a launched forge''s cgroup and compares it with ForgeBudget::for_this_host()'
    unscoreable: |
