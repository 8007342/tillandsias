    capability_tags: [fixtures, worktrees, cleanup, hermeticity]
    estimated_hours: 1
    owned_files:
      - scripts/test-preflight-front-door.sh
    title: |
      scripts/test-preflight-front-door.sh's outer wrapper runs `git worktree add --detach target/plan-scratch/front-door.XXXXXX` and removes the worktree only after the inner run RETURNS, with no trap. A SIGTERM (a timeout, a deadline, an interrupt) leaves a registered git worktree under target/plan-scratch that shares the checkout's CARGO_TARGET_DIR
    context: |
      MEASURED on yoga's forge 2026-10-11 (trunk c5c574e81). `git worktree list` shows two leaked, registered, detached worktrees, both at 93cf854e6:
        /home/forge/src/tillandsias/target/plan-scratch/front-door.OlKeGf   (last modified 09:27:48Z)
        /home/forge/src/tillandsias/target/plan-scratch/front-door.X08ICs   (last modified 09:32:48Z)
      THE CAUSE IS YOGA'S OWN RUN: a 1592-idmu fixture sweep (finished 09:31:51Z) ran every affected fixture twice under `timeout 300`. test-preflight-front-door.sh hit the timeout both times (rc 124 and 124), and SIGTERM killed the wrapper between `git worktree add` (line 19) and `git worktree remove --force "$SCR"` (line 30). Nothing traps it.
      This differs from 1553-xs63, the general class where a deadline group-kill skips a fixture's EXIT trap. This wrapper has no trap at all, so a single SIGTERM, which a trap would catch, already leaks.
      WHY IT MATTERS NOW: these worktrees share the checkout's cargo target, which is 1599-egzz's exposure (a gate can run code compiled from another worktree's source). Each leak also adds a stale entry to `git worktree list`.
      LEFT IN PLACE as evidence, per the coordinator. Removing them is `git worktree remove --force <path>` on each.
    exit_criteria:
      - 'the wrapper removes its scratch worktree on EXIT, INT, TERM and HUP (a trap registered right after `git worktree add`), so a run killed with SIGTERM leaves no registered worktree and no target/plan-scratch/front-door.* directory'
      - 'in the same run, the pre-fix wrapper is shown leaking a registered worktree when killed with SIGTERM, and the fixed wrapper is shown leaking none'
    unscoreable: "unpinnable-until-the-guard-exists: the trap and its kill fixture are written together"
    depends_on: []
    related: [1553-xs63, 1599-egzz]
    next_action: >
      Register a trap right after the worktree add that removes the worktree and the .moved marker and kills the sampler. Pin it with a fixture that starts the wrapper, SIGTERMs it after the worktree exists, and checks `git worktree list`. Then the two leaked worktrees above can be removed.
