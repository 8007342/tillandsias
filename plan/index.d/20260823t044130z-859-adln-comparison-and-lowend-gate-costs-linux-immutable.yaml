    context: >
      855-wrr3 said the Silverblue Alder Lake-N host "pairs with its Windows
      cousin later, the same way 854-8p9d pairs yolanda with the Ryzen5". This
      is that pairing, filed with the pirria half already measured and pushed
      (c9caa2984).

      WHY IT IS NOT JUST A SECOND ROW. Comparing pirria against esmeraldinha
      today moves THREE variables at once and isolates none of them:
        1. silicon      N150 vs N100 (different clocks)
        2. memory       DUAL-channel vs single-channel DDR4-2667
        3. OS lane      native Linux vs Windows/WSL2
      The measured split already hints which one dominates: prefill, which is
      compute-bound, is IDENTICAL (107.5 vs 108.9 tok/s, 0.99x), while decode,
      which is bandwidth-bound, is ~1.9x (39 vs 20.5). That is the memory bus
      talking, not the OS and not the cores. But it is an inference from two
      hosts that differ in three ways, and the fleet should not plan capacity on
      an inference when a controlled pair is available.

      WHAT WOULD ACTUALLY SETTLE IT. The Windows Alder Lake-N cousin 855-wrr3
      names runs the SAME suite pirria ran — the commands are in
      cheatsheets/runtime/low-end-cpu-inference-floor.md, which exists precisely
      so this is a re-run rather than a redesign. With its channel count read
      from the OS (dual vs single is the question that matters most), the pair
      separates OS cost from bus width.

      BLOCKED, and the blocker is specific rather than a shrug.
      esmeraldinha is SILENT in the capability matrix: `capability-matrix` today
      reports "6 row(s), 5 of 7 known host(s) reporting — SILENT: esmeraldinha,
      forge, tlatoanis-macbook-air". Its numbers exist only as PROSE in
      plan/loop_status.md:3896, never as a row, so nothing machine-readable can
      be compared against them and no scheduler can see that host at all. The
      first action is not a benchmark, it is esmeraldinha running
      scripts/host-capability-probe.sh --fragment — which is now cheap and
      correct for it, because 856-fwyh gave Intel a disposition check and
      852-dk9z stopped the cache serving stale documents. Before those two, an
      esmeraldinha row would have been WRONG in exactly the way pirria's first
      one was.
    exit_criteria: >
      (1) esmeraldinha publishes a capability row via the self-serve path, so
      the matrix stops reporting it silent. (2) Its channel count is read and
      recorded — the single-vs-dual question is the one the pirria data makes
      load-bearing. (3) The cheatsheet's command set is re-run there and the
      numbers land beside pirria's in the same table. (4) A stated verdict on
      which of the three variables dominates decode, with the arithmetic shown.

  - order: 859-4jny
    packet_id: the-local-gate-is-slower-than-the-fleets-push-interval-and-misreports-stale-instruments
    desired_release: v0.6
    title: "on a 4-core host the pre-push gate loses push races, and when its own plan binary is stale it blames set-field instead of the staleness"
    status: ready
    kind: defect
    pickup_role: linux
    priority: p3
    capability_tags: [build, gates, low-end, developer-experience, staleness]
    deliverable: build.sh
    depends_on: []
    estimated_hours: 3
    context: >
      Both halves observed on pirria (4 Alder Lake-N cores) on 2026-08-23 while
      landing 855-wrr3 and 852-dk9z. Neither is visible on a fast host, which is
      why a lower-bound host is the one that finds them.

      HALF ONE — THE GATE MISATTRIBUTES A STALE INSTRUMENT TO A CODE BUG.
      After rebasing onto origin/linux-next, ./build.sh --check failed with:
        FAIL multi-line: fragment is valid YAML (expected valid, got invalid)
        set-field-yaml-shapes: 8 passed, 3 failed
        [build] set-field can write an unparseable ledger fragment
      That message names a bug in set-field. There was none. The gate executes
      the PREBUILT target/release/tillandsias-plan, which was 55 minutes old
      (built 20:36:58) relative to the fix it was being tested against
      (c6f8cbccc, 21:32:02) — the rebase brought NEW EXPECTATIONS and left the
      OLD BINARY. Rebuilding tillandsias-plan made the gate pass with no source
      change at all. An agent trusting the message would have gone looking for a
      YAML-quoting bug in code that was already correct. This is the same class
      855-wrr3's own context warns about ("slow is recoverable; stale is
      invisible") reached from the gate side: the gate should either rebuild the
      binary it tests or say "your plan binary predates these sources", never
      report the symptom as a defect in the thing under test.

      HALF TWO — THE GATE IS SLOWER THAN THE FLEET PUSHES.
      ./build.sh --check on this host is 336 s cold and minutes warm whenever a
      touched crate must re-check. Between gate START and push, origin/linux-next
      moved TWICE in one session (c9caa2984 -> 649fc5534, then 649fc5534 ->
      a3cf9f5dd), so the pre-push hook refused with "The gate validated a
      different tree than the one you are pushing" and the whole cycle had to be
      repeated. A rebase invalidates the stamp, re-gating takes minutes, and on
      an active day the window never closes on the first try. This is not a
      correctness bug and the hook is right to refuse — but it means a slow host
      can spend more wall clock losing races than doing work, and it silently
      penalises exactly the hosts the fleet added on purpose. It was worked
      around here with a retry loop (rebase -> gate -> push, repeat), which is
      the shape a supported fix could take.
    exit_criteria: >
      (1) A stale plan binary is reported AS staleness — the gate compares the
      resolved binary against the sources it is checking and says so, or
      rebuilds it — so no agent chases a phantom defect in set-field again.
      (2) A supported way to land from a slow host: either the gate stamp
      survives a rebase that does not touch gated inputs, or build.sh grows a
      documented rebase-gate-push retry, rather than every slow host inventing
      its own loop.
      (3) Both are measured on a 4-core host, since neither reproduces on a fast
      one.
