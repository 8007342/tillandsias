      THE FILE TO WRITE, in the same commit as the fix:
      openspec/litmus-tests/litmus-credential-advisory-matches-the-path-taken.yaml
      WHAT IT MUST ASSERT, all three measured on this row already:
        1. WITH NO busctl ON PATH, the guard's stderr does NOT name a locked
           keyring as the cause and does NOT offer an unlock as the remedy. The
           pre-fix control is on this row verbatim.
        2. WITH A busctl THAT ANSWERS "no such service", the existing
           not-serving advisory is UNCHANGED. This is the arm that stops the fix
           being "delete the paragraph": the text is correct on the platform it
           was written for and must survive there.
        3. THE TWO ADVISORIES ARE DISTINGUISHABLE IN THEIR FIRST LINE, so a
           reader can tell which path produced the verdict — the property the
           guard already maintains for its VERDICT strings and does not
           maintain for the sentences under them.
    verifiable_closure: |
      ON A HOST WITH NO busctl, `check-credential-channel.sh` emits an advisory
      whose stated CAUSE and REMEDY belong to the path it actually took. It may
      say it could not ask; it may not say the keyring is locked, and it may not
      tell the operator to unlock one.

      MEASURED PRE-FIX on macneo (macOS 27.0, arm64) 2026-09-22, the guard
      copied alone into a fresh mktemp -d and run as
      `env -i PATH=/usr/bin:/bin TILLANDSIAS_CRED_SKIP_GH=1 bash check-credential-channel.sh`.
      rc=1, stdout `missing:no-credential-channel`, stderr 742 bytes, verbatim:

        [check-credential-channel] No credential channel could be verified, and the secret service was NOT probed (1265-8qr6).
          The keyring MAY BE LOCKED — that is the usual cause — but this guard no
          longer asks: the Locked property read asserts gnome-keyring-daemon 50.0
          in invoke_get_property_in_idle_cb and D-Bus re-activates it LOCKED, so
          the probe manufactures the state it reports.
          REMEDY: UNLOCK the login keyring on this host (log into the desktop
          session, or run a secret-service unlock), then re-run this guard.
          DO NOT run 'gh auth login' or 'gh auth refresh' (order 1025-a896): a
          re-auth on one host EVICTS the operator's token on every other host,
          and it would be trading a fleet-wide outage for a passphrase prompt.

      There is no gnome-keyring on this host, no login keyring in that sense,
      and no secret service to unlock. Every sentence above is about a machine
      this is not.

      THE CONTROL IS ON THIS ROW AND THE FIX MUST NOT BREAK IT. The same guard,
      same host, same invocation, with a stub busctl on PATH exiting 1 with
      "no such service", gives rc=1, stdout
      `blocked:credential-unretrievable-no-keyring-service`, and a DIFFERENT
      737-byte advisory that is correct for that state. So the guard already
      knows how to say the right thing on the not-serving path; the defect is
      that the no-busctl path never reaches it.
    title: |
      The credential guard's advisory block prints unconditionally before the state branch, so on a platform with no busctl it asserts a locked keyring as the cause and an unlock as the remedy — for a question the guard never asked
    context: |
      MECHANISM, read in the source rather than inferred from the output.
      scripts/check-credential-channel.sh: the advisory `echo`s begin at :1011
      and are UNCONDITIONAL; the state reader `_ccc_ss_late` is not consulted
      until :1067. A host with no busctl gets `not-applicable` from
      `_ccc_secret_service_state` (:383-386), the not-serving gate at :563 never
      fires, and execution falls through the advisory on its way to
      `missing:no-credential-channel`.

      THE KNOWLEDGE WAS ALREADY IN THE FILE, SIX LINES ABOVE THE DEFECT. The
      comment at :1002-1005 reads: "a host with no busctl or no secret service —
      every macOS host, the forge, a headless server — falls straight through to
      missing: exactly as before. Absence of the probe is never evidence of a
      lock." The line immediately below it then tells that operator the keyring
      may be locked and to go unlock it. The author knew the path and the text
      under it was never revisited.

      WHY IT IS THE SAME DEFECT AS 1347-r9g8 RATHER THAN A TYPO, and pirria's
      own framing when shown it: that order exists to stop the guard asserting
      what it could not ask. The VERDICT was swept and corrected; the SENTENCE
      UNDER THE VERDICT asserts a cause and a remedy on a platform where the
      guard never reached the question. A verdict string is an interface, and so
      is the advisory beneath it. Only the first was grepped.

      WHO PAYS. A Mac operator whose credential channel is genuinely absent is
      sent to unlock a keyring that does not exist, chasing gnome-keyring-daemon
      on a machine with no gnome-keyring. The correct next step on macOS is
      something else entirely, and nothing in the output points at it. The one
      protection that does survive is the DO NOT re-auth clause (1025-a896),
      which is platform-independent and correct everywhere — so the text is not
      uniformly wrong, which is precisely why nobody caught it.

      NOT A REGRESSION. Present identically in 04a5ea471 and 31ffeaaba: the
      742-byte stderr is byte-identical between the two trees and in the
      PRE+stub run as well. pirria's 1347-r9g8 change does not touch it.
    next_action: |
      Not claimed. Filed by the host that reproduced it; any host can fix it,
      and only a host without busctl can verify arm 1 — macneo will run it.
      1. MOVE THE ADVISORY BEHIND THE STATE, or give the not-applicable path its
         own. The guard already has correct text for the not-serving state
         (measured on this row); this is about reaching it, not writing it.
      2. DO NOT SIMPLY DELETE THE PARAGRAPH. It is correct on the platform it
         was written for, and arm 2 of the litmus exists to refuse that fix.
      3. On the not-applicable path, say what is true and nothing more: the
         secret service was not probed because this platform has none, and name
         the macOS next step or state plainly that the guard does not know one.
         An honest "I do not know what to try here" is worth more than a remedy
         for another operating system.
      4. TIMING, and it is deliberate: 31ffeaaba was queued for the pre-cut
         relay when this was found, and pirria declined to move a candidate's
         head mid-gate for it — the failure that cost yoga a full gate the same
         night. A wrong advisory on a path that already returns the correct
         verdict does not justify moving a queued head. This row is the record
         of that decision as much as of the defect.
