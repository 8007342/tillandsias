    title: |
      On a 15 GiB floor host the forge lane's six containers push the agent harness to kill the smoke's supervising shell for memory pressure while the lane itself survives, so smoke-forge-lane's timing record, the floor's largest term, is lost exactly when it matters, and intermittently
    context: |
      MEASURED by pirria-cachyos 2026-09-04 during 1013-qv7c's evidence run
      (relayed by the coordinator). The harness killed the wrapper script
      mid-lane ("system is running low on memory"); journalctl shows no
      kernel oom-kill; all six forge containers including inference survived
      and were healthy 56 minutes in; only the bash wrapper died. The same
      lane completed in 71m30s that morning, so the condition is MARGINAL:
      the floor's longest and most valuable measurement is the one least
      likely to be captured, and it fails intermittently rather than
      reliably, so a floor timing series is systematically missing its
      largest term. Pirria did not fabricate the record: a duration would have
      measured the kill and an exit code would have attributed a harness kill
      to the product, and a wrong number in a log built to decide what to
      memoise sits in the rolling averages forever. Two consequences: (a) the
      emit lives in the wrapper, so wrapper death loses the record even though
      the work completed; (b) anything supervising a long floor step must be
      resilient to losing its supervisor. Regime: pirria, 15 GiB, rolling
      CachyOS, no toolchain, n=1 kill against n=1 completion the same day.
      Provenance: pirria measured; filed by the coordinator; 1013-qv7c closed
      with the gap recorded rather than filled.
    exit_criteria:
      - "the forge-lane step's timing record is written by something that outlives the supervising shell (the step writes its own start stamp at launch and its end stamp from inside the lane's completion path, or a detached emitter reads both), so a killed wrapper leaves a record with a named cause instead of nothing; pre-fix result: FAILS (record absent after the kill)"
      - "the smoke runbook names the memory floor the forge lane needs on the host tier and says what a harness kill of the wrapper looks like (containers alive, wrapper gone) so it is not read as a product failure; pre-fix result: FAILS"
      - "a floor host's next smoke run produces a smoke-forge-lane record or a named-cause gap, never silence; pre-fix result: FAILS"
    unscoreable: |
      The pin needs a floor host and a real forge lane; the eventual fixture is
