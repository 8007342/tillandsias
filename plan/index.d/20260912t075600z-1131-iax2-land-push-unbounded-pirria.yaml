    title: |
      MEASURED on macneo: `git push` inside the land has no timeout, so a credential helper blocked on a keychain item ACL hung it twice for 2362s and 2360s, ended only by the outer land bound — leaving a zero-byte push log, no verdict, and a SUCCESS-SHAPED exit that reads as a land which simply stopped
    context: |
      FOUND by macneo 2026-09-11 on tlatoanis-macbook-neo, twice in one night,
      while landing osx-next. Measured rather than recalled throughout; every
      number below is that host's.

      WHAT A READER SEES. The land output ends here, with nothing after it:
          land: attempt 1 — push
          [exited with code 0]
      Exit 0, because the pipeline ends in `tail` — the second bug this script's
      own header documents. So the failure is not merely silent, it is
      SUCCESS-SHAPED.

      THE HANG. `git push` has no timeout of its own. The helper was
      `osxkeychain`, configured in /opt/homebrew/etc/gitconfig — NOT
      ~/.gitconfig, so someone checking the obvious place concludes there is no
      helper at all. `sample` showed it blocked in SecItemCopyMatching ->
      SecKeychainItemCopyContent -> CSSM_DecryptDataFinal.

      THE CAUSE IS NOT A LOCKED KEYCHAIN, and two drafts of the remedy said it
      was before four probes settled it: show-keychain-info, list-keychains and
      the item METADATA all read fine, securityd responsive, keychain already
      unlocked — only the DECRYPT hung. What remains is the stored item's own
      access policy waiting on a confirmation the land's session cannot present
      or answer. NOT ESTABLISHED, deliberately: that approving the item from a
      session which can answer is the cure. Nobody has executed it. macneo
      declined to run it on the operator's machine, which is the right
      boundary, and the remedy therefore names the cause and stops.

      NO SELF-RECOVERY. Afterwards, with no land running, the helper alone
      still hangs: `printf 'protocol=https\nhost=github.com\n\n' | timeout 20
      git credential-osxkeychain get` -> rc=124, zero output.

      "GIT WORKS HERE" IS NOT EVIDENCE. `git fetch` succeeded all night, because
      anonymous read never consults the helper. A diagnostic that tests
      connectivity with a fetch reports healthy while every push hangs.

      REPRODUCTION PRECONDITION, easy to miss: the pre-push hook can refuse
      BEFORE the push reaches credentials. On a branch without trunk merged the
      hang appears to be gone when the helper was simply never reached.
