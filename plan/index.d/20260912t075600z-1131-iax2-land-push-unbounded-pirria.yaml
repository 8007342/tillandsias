        summary: |
          Filed with the fix. Every measurement is macneo's; pirria wrote the
          guard and the fixture.

          THE TREE PROPAGATES — the finding that decided whether this guard was
          fixable at all. macneo measured a bare bound against the REAL blocked
          helper: `GIT_TERMINAL_PROMPT=0 timeout 30 git push origin osx-next`
          -> rc=124 at 31s, 0-byte log, and afterwards nothing matching
          osxkeychain|remote-https|git push|git-credential survives. So a
          timeout around `git push` reaches three processes down and no
          `timeout -k` is needed. Had it NOT propagated, the guard would have
          returned a verdict while a helper kept running, and no wording could
          have fixed that.

          THE VERDICT CARRIES THE BOUND, NOT THE ELAPSED. macneo's 30s bound
          returned at 31s: timeout signals at the bound, teardown lands in the
          next tick. A verdict reading 300 on one host and 301 on another
          cannot be pinned by a fixture and would eventually be filed as a bug.

          macOS SHIPS NO `timeout`. It exists on that host only via Homebrew
          coreutils, and `env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin sh -c
          'command -v timeout'` finds nothing — so a bare `command -v` answers
          about the CALLER'S PATH, not the host, and a land from the stripped
          LaunchServices PATH (980-xcaf) would silently go unbounded on a host
          that HAS the tool. The bounder therefore resolves timeout OR gtimeout,
          on PATH and then in the Homebrew prefixes. Where neither exists the
          script SAYS the push is unbounded rather than pretending, and this
          defect persists there — the macOS lane without brew coreutils is not
          fixed by this packet and should not be counted as such.

          A DECLARATION GAP FALLS OUT OF THIS, and it is not filed here:
          check-host-tools.sh:100 declares `timeout` as a gate prerequisite for
          macos ONLY, naming check-credential-channel.sh as its sole consumer.
          This bound makes it a LINUX dependency too and nothing widens the
          scope. That is INCOMPLETE SCOPE rather than absence — distinct from
          rg, which macneo measured as genuinely undeclared. The structural
          weakness is that the row records ONE consumer, so a second consumer on
          another platform's path goes undeclared silently.

          TWO THINGS THE FIXTURE ALMOST GOT WRONG, recorded because both were
          caught by controls rather than by review:
          1. The positive control fired TWICE during development. The fake git
             was never invoked, and every other arm would have passed.
             land-on-platform-branch.sh:41 resolves ROOT from its own
             BASH_SOURCE, so running it from a scratch clone still inspected the
             operator's checkout and refused dirty-worktree before reaching the
             push. A SCRATCH CLONE IS NOT ISOLATION unless the script under test
             is copied into it — a trap for anyone writing a fixture for any of
             these scripts.
          2. The mutation arm went red when the bounder resolution was added,
             because its strip no longer covered the whole guard. It said "arm 1
             has no teeth", which is exactly right. Fixed with an explicit
             `# END ORDER 1131-iax2 push bound` marker, documented IN the script
             as load-bearing for the fixture.

          NO FIXTURE SEAM. An earlier cut added a skip-the-gate knob to the land
          script. macneo objected; the objection stood up, and the resolution
          was to REMOVE the knob rather than harden it — the fixture drops a
          stand-in build.sh into its scratch clone instead, so the production
          script keeps no bypass at all.

          NEAR-MISS WORTH KEEPING: macneo saw SecurityAgent in the process list,
          read its etime as ~2h38m, noticed that matched the stall, and was one
          message from reporting that the approval dialog was on screen. They
          checked `lstart` first — it started 4.5 hours BEFORE the stall and
          proves nothing. Their own lesson, recorded in their words: when a
          number agrees with your hypothesis, read it from a different field
          before you quote it.
