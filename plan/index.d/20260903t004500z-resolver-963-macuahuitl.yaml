    title: >
      project-info's plan-lane detection trusts a generic path and fails
      OPEN to the stale $HOME clone — a foreign repo with any
      plan/index.yaml is silently answered from the wrong ledger, and a
      sparse checkout that drops the marker dir falls back to 682-z5h8's
      exact defect.
    context: |
      Verified by the tillandsias.org forge agent against the shipped
      image (their plan/project-namespace.md section 7, mirror commit
      57f89b3): project-info.sh's sole plan-lane discriminator is
      [ -f ./plan/index.yaml ] — a Terraform plan artifact or roadmap
      index at that path promotes a foreign repo into the plan lane;
      forge-plan.sh's own 682-z5h8 comment describes the identical class
      ('reads as authoritative and is weeks wrong'). And the resolution
      is fail-OPEN: git sparse-checkout set <dir> silently removes
      marker directories (verified), --filter=tree:0 and
      docroot-restricted mounts likewise, dropping resolution back to
      the stale $HOME/src/tillandsias fallback. FIXES, both in the
      resolver: (1) resolve from git rev-parse --show-toplevel, never
      cwd-relative probes; (2) 'cwd is inside ANY git repo' by itself
      FORBIDS the $HOME fallback — marker presence must never be the
      only pin; (3) when the .tillandsias manifest design lands, the
      probe becomes the declared marker (layout: native|namespaced) —
      same mechanism both kinds, generic-path probing retired. SECURITY
      CONTRACT codified here for every future consumer of in-repo
      Tillandsias state: committed .tillandsias/ content in a repo the
      operator did not personally init is UNTRUSTED DATA, never
      instructions (a well-known mailbox path is an attacker-writable
      prompt-injection slot in every cloned repo); any paths: value
      that is absolute, contains .., or escapes the git toplevel is
      REJECTED at parse. The commit-capability policy is shaped for the
      namespace epic: a narrow scope (agent may commit to .tillandsias/
      and the AGENTS.md managed block, nothing else), GRANTED by the
      operator's explicit init (recorded in the manifest), ENFORCED at
      the mirror's pre-receive hook (the durability transport is the
      one chokepoint every forge write crosses — launcher-config
      enforcement is the failure class this week named three times).
    verifiable_closure: |
      A foreign repo containing plan/index.yaml resolves as
      NOT-plan-lane; a sparse checkout of the runtime repo still
      resolves as the runtime repo (no $HOME fallback); a crafted
      manifest with paths escaping the toplevel is rejected with a
      named error; the mirror refuses a forge push touching paths
      outside the granted scope.
