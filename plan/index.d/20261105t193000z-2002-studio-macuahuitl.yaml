  context: 'Agents reach the engine through a hard-coded address to see what ran. Provenance was built from the request, so it recorded an override that never applied (see 2001-stpr). Generic forge capability; kumbia-kombat is the reporting example, and it must also serve projects such as demon_attack, cannonball and macron.dev. Evidence: plan/research/level3-art-pipeline-2026-11-05.md on kumbia-kombat work/1839-intg.'
