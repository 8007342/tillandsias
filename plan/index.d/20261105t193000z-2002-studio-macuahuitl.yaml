- packet_id: studio-jobs-are-tickets-that-survive-a-lane-restart
  order: 2002-stjb
  status: ready
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: linux
  capability_tags: [studio]
  estimated_hours: 6
  title: A studio workflow can queue as a job and return a ticket; status and results survive a lane restart
  context: 'run_workflow blocks its caller, so a long batch needs an agent attending it, and a lane restart loses it. Generic forge capability; kumbia-kombat is the reporting example, and it must also serve projects such as demon_attack, cannonball and macron.dev. Evidence: plan/research/level3-art-pipeline-2026-11-05.md on kumbia-kombat work/1839-intg.'
  exit_criteria:
  - 'Queueing returns a ticket at once; a status call reports queued, running, done or failed with outputs.'
  - 'After a lane restart, the same ticket still reports the status and outputs, tested with a fixture restart.'
  verifiable_closure: 'cargo test -p tillandsias-headless --all-features studio plus a real studio run for hardware claims.'
  unscoreable: 'none.'
  next_action: 'Read the row context, then write the failing test.'
