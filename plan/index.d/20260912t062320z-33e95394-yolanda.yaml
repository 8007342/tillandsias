        injection and paired a debug tray against a RELEASE guest — a mismatched pair
        that fails, looking exactly like a refuted prediction. Forced Reinjected by
        removing /usr/local/bin/tillandsias-headless first (the outcome's own doc says
        absent triggers injection). No unregister and no reset were needed; the
        destructive step I had asked the operator for turned out to be unnecessary once
        the gate was read rather than assumed.

