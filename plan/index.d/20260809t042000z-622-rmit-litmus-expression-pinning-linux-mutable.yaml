    order: 622-rmit
    status: ready
    desired_release: v0.5
    priority: p2
    title: "Rank litmus steps that pin an expression instead of a property"
    kind: enhancement
    deliverable: plan/issues/litmus-guards-pin-expressions-not-properties-2026-08-09.md
    depends_on: []
    pickup_role: any
    capability_tags: [litmus, ci, guards, technical-debt]
    context: >
      Three litmus steps went red in one cycle (2026-08-09) without any of the properties
      they guard being violated: each greps for a literal source expression, so a refactor
      that preserves the property still fails the step. Two of them had been red on
      linux-next since 2026-08-08 and cost a cycle to prove pre-existing (worktree at the
      pre-merge commit, re-run the suite there, purely to answer "did I break this?").

      This matters more than it used to. Push CI was removed 2026-08-03 (order 599-w5jd),
      so the local release gate is the ONLY verification. False reds train agents to treat
      reds as noise, which is how a sole remaining gate stops working.

      The three that fired were repaired in 621-2re2. This packet covers the residual: no
      sweep was done, and the same brittleness is presumably spread across the corpus.
    exit_criteria:
      - >
        A scan classifies every litmus step by whether its command is a pure literal
        grep against a source file — no execution, no negative control — and emits a
        ranked candidate list.
      - >
        The list is recorded as evidence. Repair is NOT in scope: making the debt
        visible and rankable is the deliverable, so later cycles can burn it down
        where it is cheapest.
    verifiable_closure: >
      The scan runs from a script in scripts/, emits a stable line-per-candidate grammar,
      and its output is committed as dated evidence under plan/.
    notes: >
      BAR-RAISE BOUNDARY: turning the scan's output into an enforced requirement ("no new
      expression-pinning guard may be added") expands the loop's contract and is
      Tlatoani-gated per methodology/convergence.yaml -> bar_raise_governance. This packet
      proposes the candidate scan ONLY and must not self-escalate into enforcement.
    events:
      - ts: "2026-08-09T04:20:00Z"
        event: filed
        summary: >
          Filed from the 621-2re2 cycle after three false reds in one --ci-full run.
