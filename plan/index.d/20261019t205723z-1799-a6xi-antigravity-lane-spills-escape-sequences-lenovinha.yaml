    title: |
      An Antigravity forge lane reaches its login screen, then prints raw escape sequences to the terminal instead of taking keystrokes; the operator has to kill the terminal, which leaves the lane's containers running
    context: |
      Reported by the operator through the coordinator, 2026-10-19. It happens on several forge versions, including the latest stable. The Antigravity session gets as far as its login screen. From then on, raw escape sequences appear on screen and keystrokes do not reach the app. Killing the terminal was the only way out, and that left the lane's containers running.
      Suspects to check against the claude and opencode lanes, which take keystrokes normally: the host terminal not put in raw mode for this lane; a different TERM or PTY attach path; terminal replies (DA/DSR, bracketed paste, the kitty keyboard protocol) echoed back instead of consumed.
      Taken by lenovinha. Next step: launch an Antigravity lane and capture what the terminal receives, with script(1) inside a container if needed, then compare the TTY setup with the claude and opencode lanes.
