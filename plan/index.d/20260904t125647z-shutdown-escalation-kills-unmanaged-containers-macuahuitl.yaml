packets:
  - packet_id: headless-shutdown-escalation-sigkills-every-running-tillandsias-container-without-the-ownership-filter
    order: 1019-ba6e
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    release_target: stable-milestone-v1
    pickup_role: linux
    capability_tags: [headless, shutdown, podman, build, install, fail-loud, regression]
    estimated_hours: 2
    owned_files:
      - crates/tillandsias-headless/src/main.rs
      - build.sh
    title: |
      The headless shutdown's SIGKILL escalation (main.rs ~16620-16645) lists every running `tillandsias-` container and kills it after 4 s WITHOUT is_stack_managed_name, so the install-validation instance inside ./build.sh --install kills tillandsias-builder and the build dies 137 — 936-kdev fixed the stop phase and left the escalation phase
    context: |
      MEASURED on macuahuitl 2026-09-04, twice (the 01:09Z meta cycle and this
      one at 12:39Z). Timeline of the second, all UTC, from podman inspect and
      the user journal: ./build.sh --install finished the release build in 1m05s
      and validated the musl launcher; the next step runs the freshly built
      binary for five seconds (`timeout 5 "$RELEASE_BIN" --headless
      /tmp/test-install-validation`); at 12:41:52 tillandsias-proxy stopped
      with exit 0 (the graceful stop phase, which filters by
      is_stack_managed_name and correctly left the builder alone); at 12:42:17
      tillandsias-vault exited 137; at 12:42:21 the journal records
      `podman kill --signal KILL tillandsias-builder` (_COMM=podman, the exact
      argv client.rs:117 builds for kill_container(name, Some("KILL"))); the
      install log's last write is 12:42:21 and it ends rc=137, because build.sh
      runs its steps through the builder (with-tillandsias-builder.sh) and the
      killed exec returned 137 under set -e.
      THE CODE. The stop phase at main.rs ~16585 filters
      `c.state == "running" && is_stack_managed_name(&c.name)`, with a comment
      block that names THIS exact failure ("the 5-second install-validation
      instance inside build.sh stopped the very toolbox the build was running
      in, SIGKILLing the build at rc=137; 5/5 reproducible 2026-08-30") and
      credits 936-kdev. The VERIFICATION phase directly below re-lists
      `list_containers("tillandsias-")`, filters ONLY `c.state == "running"`,
      and after 4 s calls kill_container(&c.name, Some("KILL")) on every one.
      The unit test at main.rs ~18543 asserts is_stack_managed_name refuses
      tillandsias-builder and tillandsias-dev-inference, and the escalation
      never consults it. 936-kdev is completed and ARCHIVED; this is its
      regression by omission, one loop below the fix.
      COST: two coordinator cycles today lost their local build and the
      local-build e2e gate; both times the live enclave's Vault, proxy and
      builder went down with it and the first death was misattributed to the
      Bash tool's 600 s cap (the coordinator's memory note is corrected with
      this packet).
      Provenance: coordinator measured and files; claimed in the same cycle.
    exit_criteria:
      - "the escalation phase kills only containers is_stack_managed_name accepts, through a pure function shutdown_escalation_targets that both phases share; pre-fix result: FAILS (no such function; the loop filters on state only)"
      - "a unit test feeds the function a running tillandsias-builder, tillandsias-dev-inference and tillandsias-vault and asserts only vault is targeted; mutation control: dropping the ownership check makes it fail; pre-fix result: FAILS"
      - "./build.sh --install completes on macuahuitl with tillandsias-builder, tillandsias-vault and tillandsias-proxy still running afterwards (podman ps), measured with start and end timestamps; pre-fix result: FAILS (rc=137, 12:42:21Z)"
    unscoreable: |
