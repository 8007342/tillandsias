events:
  - packet_id: check-host-tools-reports-two-installed-rustup-targets-as-missing-because-it-resolves-rustup-with-bare-command-v-and-never-applies-its-own-path-repair
    event:
      type: note
      ts: "2026-09-12T05:12:21Z"
      agent_id: macos-macneo-claude-20260912t024130z
      host: tlatoanis-macbook-neo
      summary: |-
        TWO MORE INSTANCES ON THIS SAME SCRIPT, found while it blocked a land — the probe is wrong in BOTH directions, and no SCRIPT invokes it.

        INSTANCE 2 — IT IS SILENT ABOUT A PREREQUISITE THE GATE GENUINELY REQUIRES. `rg` (ripgrep) is not declared anywhere in check-host-tools.sh (grep for it: zero entries), yet ./build.sh --check needs it: scripts/check-cheatsheet-refs.sh fails without it. Measured on macneo 2026-09-12: the preflight reported `ok:host-tools:macos:gate:5 present` and the gate then refused the land. So the same probe that reported a FALSE MISSING for two installed rustup targets (the filing instance) is also SILENT about a real missing tool. Both directions wrong, in one script, on one host, in one cycle.

        AND THE GATE'S VERDICT NAMED THE WRONG THING, which is what cost the time. The first failing line was:
          [build] a cheatsheet reference does not resolve (1087-h2z9)
        a definite claim about repository content. The actual cause, further up the same log:
          error: ripgrep (rg) is available neither on this host nor in the tillandsias-builder toolbox
        The check could not RUN and reported its own missing tool as a defect in the thing it checks. That is this packet's own shape, one layer out: a reader who trusts the verdict goes hunting for a broken cheatsheet reference that does not exist. `brew install ripgrep` cleared it.

        A COMPLICATION WORTH RECORDING, because it is why `command -v rg` is not a sufficient probe here: on this host `rg` existed as a SHELL FUNCTION in the interactive environment while no binary was installed. An agent checking by hand sees rg "present"; the gate, running scripts in bash, cannot exec it. Any fix must probe for an executable, not a name that resolves.

        INSTANCE 3 — NO SCRIPT INVOKES IT; ONLY SKILL PROSE DOES. scripts/audit-guard-activation.sh lists check-host-tools.sh among its orphans. Verified: it appears in no invoker script — not build.sh, not scripts/local-ci.sh, not scripts/cycle-preflight.sh. It IS invoked, by skills/meta-orchestration/SKILL.md, i.e. by prose an agent follows rather than by anything a gate runs.

        CORRECTION, MINE, recorded because I published the wrong version first: I initially reported this as "invoked by NOTHING", on the strength of grepping exactly three files. That was an overclaim from a narrow search — the same defect this packet is about, committed by me while filing it. A repo-wide search finds the skill immediately. The accurate statement is: no script invokes it; only skill prose does. (Coordinator's wording, adopted.)

        WHY THAT MATTERS FOR THE FIX: because no gate runs this probe, neither the false MISSING nor the rg silence could ever have been caught automatically — they surface only when an agent calls it by hand, as happened here. So the remedy is not only to correct the resolution logic (the filing instance) and to declare rg (instance 2), but to decide whether a probe that answers "can this host build" belongs in an invoker rather than in prose. Note the counter-argument honestly: it is a HOST probe, and the gate already fails on its own when a tool is missing — so wiring it may be redundant rather than valuable. That is a judgement for whoever takes this packet; what should not stand is the current state, where it is wrong in both directions and nothing exercises it.

        Scope note: instance 2 is measured on macOS. Whether `rg` is equally undeclared-and-required on Linux and Windows hosts is NOT established here.
