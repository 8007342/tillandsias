    value: 'Today state is spread over ~/.cache/tillandsias, ~/.local/state/tillandsias, ~/.local/share/tillandsias, ~/.config/tillandsias and two podman stores (~/.local/share/containers/storage with forge volumes, and a vfs graphroot under ~/.local/share/tillandsias/podman). Implement design D1 of openspec/changes/forge-storage-single-root-and-disk-discipline per operator rulings 2026-10-25: root ${TILLANDSIAS_HOME:-$HOME/.tillandsias} (visible) with config/ state/ logs/ cache/ podman/ forges/ projects/. Tillandsias gets its OWN rootless podman store (graphroot and runroot under <root>/podman) replacing both stores, without editing ~/.config/containers; its containers never collide with the user''s. This costs one rebuild of every image. Vault and CA move from cache/ to state/ and are wiped, not migrated (the vault is thrown away, not recovered).'
