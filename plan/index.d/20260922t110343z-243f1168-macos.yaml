    value: "THE OUTPUT: a bindings entry whose spec_id names a spec that is not in the\nlive tree is REFUSED BY NAME, and the verdict says how many spec_ids were\nresolved so a reader can see the population rather than infer it.\n\nTHE NEGATIVE CONTROLS ARE THE ROW, and both are demanded by the family this\nbelongs to (1255-rvr7):\n  * a bindings file naming a spec that does not exist must RED. Pre-fix it\n    is green — measured, see context.\n  * an EMPTY OR SHRUNKEN population must NOT read ok:. A checker that finds\n    zero spec_ids and prints ok: has the same defect one level up, and this\n    row must not ship it. Ask the one question of the new code: what does it\n    print when it finds NOTHING?\n  * a bindings file whose spec_ids ALL resolve must still pass, or the\n    ratchet turns one silent problem into an undiagnosed red suite — the\n    warning 660-ryhn's own triage carries.\n\n\n[2026-09-22T11:03:43Z macos] \nDELIVERED ON work/1356-vv5m, PR #158.\n\nTHE OUTPUT: a binding whose spec_id names a spec not in the live tree is REFUSED\nBY NAME, and the verdict carries spec_ids/resolved/spec-grandfathered so the\npopulation is visible rather than implied. On trunk today that refusal fires on\nthe real instance:\n  violation:binding-names-absent-spec:expert-serve-grounded-pipeline —\n  openspec/specs/.../spec.md does not exist, so every litmus bound under it\n  points at nothing\n\nRESOLVES TO spec.md, NOT THE DIRECTORY. A directory left by a deletion satisfies\na -d test while holding nothing a reader could open — the same shape-not-\nsubstance mistake one level down, and the one a careless fix would make. Case 7\npins it and the mutation confirms it: switching to -d reds that arm alone.\n\nTHE POPULATION OF THIS CHECK IS ITSELF ASSERTED — zero parsed spec_ids REFUSES\nrather than printing ok:0. This row is the second instrument of a family about\nexactly that defect, so shipping it inside its own fix was the thing to avoid.\nCASE 8 NEARLY PASSED FOR THE W