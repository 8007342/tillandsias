  - packet_id: macos-tray-build-has-no-declared-prerequisite-set
    order: 1004-cp6p
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: macos
    capability_tags: [macos, fail-loud, gate, host-tools, build-prerequisites]
    estimated_hours: 3
    owned_files:
      - scripts/check-host-tools.sh
      - scripts/test-host-tools.sh
    title: |
      The macOS tray build has no declared prerequisite set: check-host-tools.sh declares one undifferentiated macOS list, so `ok:host-tools:macos:5 required present` reads as "this host can build the platform" on a host that cannot build the tray at all, and the SPEC resolves binaries with `command -v` so it could not see a missing rustup target even if the list were right.
    context: |
      FOUND by macneo-macos 2026-09-04 while attempting 980-xcaf criterion 4,
      immediately after the host-tools RESOLUTION packet drafted the same
      morning (timeout prover presupposes a gh token; cargo/rustc read off the
      non-login PATH). SIBLING, NOT A DUPLICATE: that one is about how
      check-host-tools.sh resolves a tool it already declares; this one is
      about WHICH tools it declares at all, and what kind of thing a declared
      prerequisite may be. A fix to either does not touch the other.

      THE OPENING CLAIM: the macOS tray build has no declared prerequisite
      set. scripts/check-host-tools.sh --platform macos declares five required
      tools — git, timeout, cargo, rustc, pkg-config (check-host-tools.sh:74-78)
      — and every one of them is resolved with `command -v`. Neither zig nor
      cargo-zigbuild is among them, and a rustup target is not a binary, so
      even a correctly scoped tray-build list would have passed this host into
      a 166-second failure.

      MEASURED, unpiped, attempt 1:
        $ scripts/build-macos-tray.sh >/tmp/bmt.out 2>&1; echo "rc=$?"
        rc=1
          ERROR: zig not in PATH (install via brew install zig)
      That is the entire output; it dies at scripts/build-macos-tray.sh:45
      before any compilation. Confirmed absent on this host: `command -v zig`
      empty, no /opt/homebrew/bin/zig, and line 46's second prerequisite
      missing too — no ~/.cargo/bin/cargo-zigbuild. The build script is not
      at fault: it fails fast and names its remedy, which is what we want.

      THE GATE SAID THE HOST WAS FINE. A macOS host reads
      `ok:host-tools:macos:5 required present` and still cannot start the
      macOS tray build. The verdict is TRUE as written, because those five are
      what ./build.sh --check needs; it is MISLEADING as used, because a
      reader on a Mac takes it as "this host is equipped", and the platform's
      own build path is the thing they are about to run.

      THE RUSTUP-TARGET INSTANCE, attempt 2 (after the coordinator-authorised
      `brew install zig` and `cargo install cargo-zigbuild`):
      build-macos-tray.sh:141 builds the guest for aarch64-unknown-linux-musl
      (target installed by hand at some point, SUCCEEDED); :142 builds for
      x86_64-unknown-linux-musl (absent): E0463 can't find crate for `core`,
      rc=101, 166 s, build_run_id 20260904T065537Z. The asymmetry is the
      finding: aarch64 present / x86_64 absent is the disk state of ONE host,
      and nothing in the corpus says either is required. Undeclared
      prerequisites propagate by accident of what each host happened to need.

      THE COMPLETE CHAIN AS MEASURED, three links and no fourth:
        1. brew install zig                            rc=0  ~40 s   (:45)
        2. cargo install cargo-zigbuild                rc=0  ~4 min  (:46)
        3. rustup target add x86_64-unknown-linux-musl rc=0  4 s     (:142)
      Attempts: rc=1 <1 s (zig) -> rc=101 166 s (musl target) -> rc=0 126 s
      GREEN, tarball tillandsias-tray-56.9.2.1-macos-arm64.tar.gz 13.64 MiB,
      codesign valid, virtualization entitlement present, freshness gate
      passed, smoke ok, installed to ~/Applications/Tillandsias.app. That
      chain — zig, cargo-zigbuild, x86_64-unknown-linux-musl, plus the
      aarch64-unknown-linux-musl target that was already present — IS the
      declared tray-build set this packet asks for. Stop rule that bounded
      the chain: only links named by the tool's own error or the build
      script, reversible one-liners, no sudo/Xcode/system installer/credential.

      A FLAT ADD IS THE WRONG FIX AND MUST BE REFUSED EXPLICITLY. ./build.sh
      --check does not need zig. Adding zig, cargo-zigbuild and two musl
      targets to the same flat required list would turn every Mac that never
      builds the tray red on a gate that would otherwise pass, trading a
      silent gap for a loud false positive — the same trade the sibling
      packet exists to undo. What the SPEC lacks is a SCOPE, not another row:
      each entry needs to say which consumer requires it (gate-required vs
      tray-build-required), and the verdict needs to name its scope so
      `ok:host-tools:macos:5 required present` can no longer be read as a
      claim about the tray build. And a declared prerequisite must be allowed
      to be a rustup target, verified via `rustup target list --installed`,
      because `command -v` cannot see one.

      PROVENANCE OF THE GAP: if macbookair can build the tray today, it is
      because zig and the musl targets were installed there by hand at some
      point and no gate ever recorded that they are prerequisites. The
      knowledge lived in one host's disk state rather than in the corpus,
      which is why a second Mac discovered it by failing, twice. The record is
      plan/issues/macos-build-findings-2026-09-04.md (sections 065214Z and
      065537Z build-failed, 070100Z ok). Related, not duplicated: 989-ykks
      (the SPEC itself, host-tool-prerequisites-are-prose-a-human-maintains).

      Found and measured by macneo-macos 2026-09-04; filed by the coordinator
      (macuahuitl-fedora) because macneo cannot push (invalid gh token,
      operator ask outstanding).
    next_action: |
      LEFT, all of it: nothing in scripts/check-host-tools.sh has changed. The
      SPEC has no scope column and no target-kind entries. Start by adding
      the scope column and a `kind` for rustup targets to required_tools(),
      then the fixture arms in scripts/test-host-tools.sh (farm minus zig,
      farm minus a gate-required tool, stubbed `rustup target list
      --installed` output missing one triple), then the assertion that the
      declared tray-build set matches what scripts/build-macos-tray.sh:45-46
      and :141-142 actually invoke. macneo's host is now GREEN for the tray
      build, so the negative arms must be farmed, not measured live there.
    exit_criteria:
      - each SPEC entry in scripts/check-host-tools.sh carries a scope column naming the consumer that requires it, at minimum gate-required and tray-build-required
      - zig and cargo-zigbuild are declared for macos at tray-build scope, with remedies `brew install zig` and `cargo install cargo-zigbuild`
      - a declared prerequisite may be a rustup target, verified via `rustup target list --installed`, and a missing one is reported naming the missing triple
      - x86_64-unknown-linux-musl and aarch64-unknown-linux-musl are declared for macos at tray-build scope, remedy `rustup target add <triple>`
      - the declared tray-build set is generated from, or asserted against by the fixture, what scripts/build-macos-tray.sh actually invokes, so list and script cannot drift
      - a host missing ONLY tray-build-scope tools does not fail ./build.sh --check, and the verdict it prints names the scope it covered rather than a bare count
      - a host missing a gate-required tool keeps today's failure and its terminal force — this widens what is described, never what is enforced on the gate
      - |
        `--platform macos` continues to partition its declared tools exactly (the existing fixture arm), with the scope column included in the partition
    verifiable_closure: |
      scripts/test-host-tools.sh exits 0 under ./build.sh --check, with the
      new arms present: (1) farm minus zig -> --check still passes and the
      verdict names its scope; (2) farm minus a gate-required tool -> still
      red; (3) a stubbed `rustup target list --installed` missing
      x86_64-unknown-linux-musl -> tray-build scope reports the missing
      triple by name; (4) the declared tray-build set is asserted against
      build-macos-tray.sh's own `command -v` and build_guest_binary lines.
      The script exists and is already invoked by ./build.sh --check
      (989-ykks); it already has the farm() mechanism and the per-platform
      partition arm. The four arms above DO NOT EXIST YET — they are this
      packet's deliverable. All are cheap and need no network, no GUI and no
