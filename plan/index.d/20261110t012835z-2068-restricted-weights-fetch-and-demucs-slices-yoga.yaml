    context: |
      Coordinator ruling 2026-11-10: keep ALLOWED_SUFFIXES; convert the Demucs weights to safetensors in a one-off auditable step, pin each converted file by sha256 in the register next to the upstream .th hash it came from, and load only the safetensors. weights_only=True is not a substitute (a weaker gate).
      Operator ruling 2026-11-09: both models are treated as non-commercial behind accept-licence per project (no standing grant). The weights' licence is unstated; the register's licence text is the maintainer's README statement ("The license of the weights is not clear: MusDB contains some data that were only usable for research purpose"; htdemucs_6s "was trained only on Meta internal dataset, which likely means CC-NC-BY license is applicable"), hashed at a pinned revision. Upstream files: htdemucs 955717e8-8726e21a.th, htdemucs_6s 5c90dfd2-34c22ccb.th.
    exit_criteria:
      - "The conversion step is a committed, re-runnable script whose run records the upstream .th sha256 and the produced .safetensors sha256; the register row carries both, and the licence text hash."
      - "audio.separate refuses licence_acknowledgement_required for a project with no acknowledgement, naming the accept-licence skill; with one it proceeds to the fetch of 2068-ypgq. Pre-fix result: FAILS, no audio.separate tool exists."
      - "The shipped-register tests (the_shipped_restricted_register_is_well_formed, test-licence-register-restricted.lua) accept the rows."
    verifiable_closure: "audio.separate's refusal arm and the register well-formedness tests pass with the Demucs rows. Pre-fix result: FAILS, no audio.separate tool exists."
    unscoreable: |
