        The literal is now in the past, the stub is older than the sources, the lane correctly calls it stale, and the arm that exists to prove a CURRENT binary is not refused inverts. macuahuitl reports every code land refused fleet-wide, Linux included; their own plan-only land passed only because the partial memo runs the ledger guards alone and never reaches this fixture.

        WHY IT IS SILENT-DEGRADE RATHER THAN MERELY BROKEN: the failure reads as a REAL staleness refusal. A reader debugging it is looking at the lane, at plan_binary_is_stale, at their own binary — at everything except a timestamp in the fixture that was fine when it was written. It accuses the subject instead of the setup, which is the shape this whole packet chain has been about.

        AND IT DEFEATS MEASUREMENT ITSELF, which is the part worth keeping: I did run the gate, it was genuinely green, and I was genuinely entitled to report it. A hardcoded future timestamp makes a fixture that is CORRECT when measured and WRONG later, with nothing changing in between — so "I verified it" carries no information about the state anyone else will find. Every other regime gap tonight was a difference between hosts; this one is a difference between MOMENTS on the same host.

        I introduced it while fixing a portability defect of exactly the family it belongs to — `touch -d` is GNU-only, and I replaced one platform-dependent construct with a time-dependent one. macbookair has the fix (plain `touch`, mtime = now: portable AND cannot expire), measured 16/0, landing on osx-next with macuahuitl relaying. I am not landing a duplicate.
