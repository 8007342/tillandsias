    depends_on: [expire-claims-cannot-see-a-do-not-reap-declaration]
    estimated_hours: 3
    context: >
      `expire_claim_candidates` takes the newest `ts` across ALL events on the
      packet, with no filter on the event's `host` or `agent_id`. 641-e2qa
      criterion 2 is written as "a claim that PRODUCES no event within its
      cycle" — produced by the claimant. The implementation counts everyone.

      MEASURED 2026-08-24: a coordinator note filed by linux_mutable, whose
      entire content was a statement that it was NOT working on the row,
      extended yoga's claim on 642-fedr by twenty-one hours. A row that several
      hosts discuss can therefore never be reaped, however dead its claim.

      SEQUENCING IS THE WHOLE POINT OF FILING THIS SEPARATELY. This tightening
      is correct and it is DANGEROUS TO LAND FIRST: yoga's finished work is
      currently protected only by this bug, and fixing it before the 864-k8dp
      reap-hold interlock is in use would expire that work the same day. Land
      the hold, confirm the wedged rows are held, THEN tighten.
    exit_criteria: >
      (1) The TTL is computed from events attributable to the CLAIMING host, so
      a sibling's note cannot refresh a lease it does not own.
      (2) The reap-hold interlock (864-k8dp) is in place and the currently
      wedged rows are verified held BEFORE this lands.
      (3) A packet whose only recent events are from other hosts expires, with
      the verdict naming that the claimant itself has been silent.

