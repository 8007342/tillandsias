# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by linux_mutable (macuahuitl), 2026-08-24T05:37:57Z.
packets:
  - order: 864-k8dp
    packet_id: expire-claims-cannot-see-a-do-not-reap-declaration
    desired_release: v0.5
    title: "the reaper decides on elapsed time alone, so finished-but-unlanded work is returned to the pool and duplicated"
    status: completed
    kind: defect
    pickup_role: any
    priority: p0
    capability_tags: [plan, crdt, ledger, claims, fleet]
    deliverable: crates/tillandsias-plan/src/main.rs
    depends_on: []
    estimated_hours: 3
    discovered_by: "yoga's wedge: four hours of finished work protected only by prose the reaper never reads"
    context: >
      `expire-claims` decides on ONE fact — time since the packet's last event —
      and cannot distinguish a STALLED claim from a claim whose work is FINISHED
      and merely unlanded. Returning the second to the pool does not free work,
      it DUPLICATES it. 833-fpe7 named the shape: expire-claims launders
      finished work into lost work.

      LIVE, NOT HYPOTHETICAL. yoga claimed 642-fedr and 776-cm74 at
      2026-08-23T16:20:12Z, implemented BOTH completely (16 modified + 1
      untracked path), and was interrupted before committing. It is wedged
      behind a dirty-start refusal it cannot clear itself — three cycles refused
      identically, correctly, leaving the tree byte-identical each time. The
      only thing standing between four hours of finished work and a duplicate
      implementation was the phrase DO NOT RE-IMPLEMENT, written in an event
      SUMMARY. `expire_claim_candidates` reads timestamps. It has never read a
      summary.

      Verified by advancing the clock: at --now-epoch past the TTL both rows
      appear as `expire-candidate`, which is the reaper doing exactly what it
      was built to do to work that is already done.

      A SECOND DEFECT FOUND WHILE MEASURING THE FIRST, and it is the reason the
      deadline was not what I told the operator. The TTL runs from the newest
      event on the packet with NO FILTER ON WHO WROTE IT. 641-e2qa criterion 2
      says "a claim that produces no event within its cycle" — produces, by the
      CLAIMANT. Any host's event refreshes any host's lease. Measured: my own
      coordinator note at 03:34Z, whose entire content was "I am NOT absorbing
      this row", extended yoga's claim by twenty-one hours. So the reaper is
      defeated for any actively-discussed row, and the protection yoga's work
      currently enjoys is an ACCIDENT of that same bug.

      WHICH DICTATES THE ORDER OF REPAIR, and this is the part worth writing
      down. Tightening the TTL to the claimant's own events is the correct fix
      — and doing it FIRST would strip the accidental protection off yoga's
      finished work and expire it at 16:20Z today. The interlock has to exist
      before the tightening is safe. Filed separately as 864-m2vc so the
      sequencing is explicit rather than remembered.
    exit_criteria: >
      (1) An event may carry `reap_hold: <reason>`; the newest such event wins
      and the reaper skips that packet.
      (2) `reap_hold: false` RELEASES an earlier hold. In an append-only ledger
      a hold that cannot be lifted without rewriting history is a permanent
      block, so the release must be expressible as a later event.
      (3) A hold with an empty reason does not hold — the 863-7mhg rule: a hold
      with no named reason is an indefinite block wearing a temporary label.
      (4) Holds are REPORTED (`held-claim`) and counted in the summary, never
      silent. A claim the reaper declined to take is as interesting as one it
      took.
      (5) Proven against the live wedge: with the clock advanced past the TTL,
      yoga's two rows move from `expire-candidate` to `held-claim`.

