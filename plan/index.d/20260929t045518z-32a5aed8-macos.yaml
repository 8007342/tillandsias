        BETWEEN vault_verify and `gh api user` the code runs notify_tray_github_login_stored (connect to an in-guest tray socket, which does not exist on macOS: fails immediately, with 2 s read and write timeouts at most) and then prompt_and_store_git_identity(), which ALWAYS prompts in the login terminal for "Git author name" and "Git author email" (with defaults) when no stdin identity was given. The gap is therefore the OPERATOR ANSWERING TWO PROMPTS, not a timeout and not the healthcheck (the coordinator's lead is ruled out: nothing in the flow waits on container health).
        THE REAL DEFECT IS ORDER: the tray learns of the login only after the identity prompts and the username exec, because login_transition_sentinel_path is written at the very end. The token is in Vault ~13 s (human time) earlier.
        PROPOSED FIX (for the coordinator or operator to accept): write the login-transition sentinel (and so notify the tray) right after vault_verify succeeds, BEFORE prompt_and_store_git_identity; and default the two prompts from the GitHub profile (`gh api user` name, plus the primary noreply email) so the common answer is Enter.
        Criterion 2's "<5 s" is then measured as token -> handle with the prompts still open.
