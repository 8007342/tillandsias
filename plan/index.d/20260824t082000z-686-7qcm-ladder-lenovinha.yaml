      summary: |
        EXIT CRITERION 1 IS NOW GENUINELY MET, AND IT WAS WORSE THAN THE PACKET
        THOUGHT. The next_action said "route compact_text status selection
        through the same rank-aware status_entry_wins rule as the live fold" —
        which presumes the live fold was already correct. IT WAS NOT. Both paths
        were dropping closure rungs, for the same reason, and I found it only
        because I wrote the packet's own regression before touching anything.

        THE DEFECT, in both places. `status_entry_wins` was consulted ONLY when
        a previous FRAGMENT entry existed for that packet+field. The first
        fragment to claim a field hit `None => true` and won unconditionally.
        But `None` does not mean there is no incumbent — the BASE already
        carries a value, and for `status` that value may be a closure rung. So a
        lone fragment writing `implemented` over a base `completed`, with no
        falsified event, won on both paths. That is exactly the move the ladder
        exists to forbid, and it needed no race to trigger it: one host, one
        fragment, no concurrency.

        COMPACTION MADE IT PERMANENT, which is why this is the serious half.
        Reproduced on a synthetic ledger before the fix: base `completed`, one
        fragment writing `implemented`, `compact` wrote `status: implemented`
        into the base AND deleted the fragment it consumed. Nothing survives to
        re-derive the higher rung — the verification record is simply gone. On
        top of that, compact_text did not consult the rank rule at ALL; its own
        comment claimed the wins were "recomputed exactly as `fold` resolves
        them", which stopped being true the day the fold became rank-aware
        (650-dq6u) and went unnoticed because the two paths agree on every case
        EXCEPT a rung-lowering write.

        THE FIX. Both paths now compare an incoming `status` entry against the
        BASE value when no prior fragment entry exists, through the same
        `status_entry_wins`. The incumbent's (ts, host) are passed empty and
        deliberately so: the base has no clock to compare, and the ladder does
        not need one — a higher rung wins outright, a lower rung needs a
        falsified event regardless of timestamp, and equal rungs fall through to
        plain LWW where a real timestamp beats the empty incumbent. That last
        detail is what preserves the previous behaviour for same-rung and
        working-state writes rather than freezing the base.

        VERIFIED, four transition classes, on the real binary and the live
        ledger:
          working -> working   (ready -> in_progress): still applies — this
            cycle's own claim on 686-7qcm folds to in_progress and is correctly
            hidden from `ready`.
          working -> rung      (ready -> completed): still applies — 868-p8xi
            folds to completed.
          rung -> lower rung, no falsified: now REFUSED on both paths (was
            accepted on both).
          rung -> lower rung WITH a same-fragment falsified event: still
            permitted — the positive control, without which a fix that simply
            froze all status writes would pass the other two assertions.
        Tests: `closure_ladder_compaction_tests` 3/3, written FIRST and observed
        failing 2/3 before the change. Full crate suite 220 + 25 green. Live
        ledger unchanged at `ok: 562 packets`.

        A NOTE ON THE FRAGMENT BEING CONSUMED ANYWAY. After the fix the losing
        fragment is still folded and deleted, and that is correct rather than an
        oversight: `fragment_coverage_gaps` documents that a `status:` write
        which loses LWW is designed semantics, not data loss. The packet is
        present and the write is simply not the winner. What changed is only
        WHICH write wins.

        WHAT I DID NOT ASSESS, deliberately: exit criteria 2-4 (the
        invisible-block report, the evidence gate on new closure fragments, and
        the plan_next verification-pickup surfacing). `check` does already emit
        `parked-block:` lines and `closure-evidence-check` exists as its own
