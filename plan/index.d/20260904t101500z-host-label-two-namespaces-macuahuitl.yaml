# Ledger fragment — append-only, IMMUTABLE once written.
packets:
  - packet_id: ledger-host-labels-admit-two-namespaces-and-the-audit-reads-one
    order: 1012-hu7d
    status: ready
    kind: bug
    priority: p3
    desired_release: v0.5
    pickup_role: any
    capability_tags: [plan, identity, observability, fail-loud, multi-host]
    estimated_hours: 2
    title: |
      --host on loop-status-append, set-field and append-event accepts a node name or a host kind (874-idnt), nothing refuses the mismatch, and the cross-host audit derives hosts from the stems it finds — so a host writing as macos reads as silent while the entry is there.
    context: |
      MEASURED 2026-09-04 by the coordinator's recurrence audit (1001-q3zf) and
      confirmed by tlatoanis-macbook-air against the file names: entries with
      the metrics block existed under the stems linux (lenovinha) and macos
      (macbookair) while the lenovinha and tlatoanis-macbook-air stems were
      stale, so the audit reported both hosts NOT-PASTING when they had pasted.
      Stem counts fleet-wide: named hosts dominate (macuahuitl 87, lenovinha 55,
      yoga 38, tlatoanis-macbook-air 34) but the platform names exist beside
      them (macos 15, linux 54, windows 36, linux-immutable, linux-mutable).
      The ledger's own refusal text offers "the node name (e.g. macuahuitl) or a
      documented host kind (e.g. linux_mutable)" as equally valid, so macos is
      not wrong to the writer; it is wrong to every reader that derives identity
      from the label, and a host's packet events and loop-status rows can
      disagree about who it is. Third instance in one day of a correct-looking
      label with no failure and the wrong target (the CA path, the discarded
      accept fd, this). macbookair, deliberately: NOT re-filing the merged entry
      under the right stem (two rows for one cycle is worse than one on the
      wrong stem) and switching both namespaces to the workstation name.
      Provenance: found by the coordinator's audit; framed by macbookair; filed
      by the coordinator.
    exit_criteria:
      - a single canonical host label per writer (the node name from scripts/agent-identity.sh) is required by loop-status-append, set-field and append-event, or a host kind is mapped to the node name at write time and the fragment records both
      - the cross-host audit and fleet-heartbeat resolve either form to one host, so a stem never reads as a second silent host
      - the 874-idnt refusal text names the one form readers derive identity from
    unscoreable: >
      The pin is a fixture writing one entry under a host kind and asserting the
      audit attributes it to the node name; it depends on which form is made
      canonical and does not exist until that is decided. Whoever takes this
      writes it and converts the row.
