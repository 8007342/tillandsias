      "parse-only answers runner-extractability, NOT YAML validity".
    title: |
      the litmus runner's --parse-only says ok for a file that is not YAML, because its extraction is line-based, so the verdict word overrides its own note and a broken litmus reaches a gate
    context: |
      Not silent, and that is the point: the runner prints a correct note
      under a verdict word that overrides it for anyone skimming, and the
      hint text points a person at --parse-only first. The mechanism (esme):
      the runner never loads the document; it extracts steps line by line, so
      it reports "1 step(s)" from a file that is not YAML. Two instruments
      disagreeing about one file, the stricter right and the looser the one
      reached for first, is how a litmus reaches a gate on one host and is
      refused twenty minutes later on another (land 25, 2026-09-20). The row
      decides whether the note is enough or the verdict may not say ok; the
      closure above takes the second: an instrument's verdict word is what a
      reader acts on. Floor-tier: both instruments run on any host in seconds.
    next_action: >
      Make --parse-only load the document (the same loader
      check-litmus-yaml-parses.sh uses, or a call into it) before extracting
      steps, keep the extractability report as a second line, make the
      refusal name the file and line the strict checker names, fix the hint
      text to name the authoritative instrument, and write the three-arm
      fixture with the mutation arm; esme's fixture file lives OUTSIDE
      openspec/litmus-tests on purpose (the strict gate globs that directory).
