packets:
  - packet_id: windows-installer-is-the-only-release-asset-with-no-integrity-path
    order: 756-rfdr
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    kind: bug
    title: "install-windows.ps1 has neither a cosign bundle nor an entry in any signed SHA256SUMS — the README tells Windows users to pipe it straight into their shell"
    deliverable: "an integrity path for the Windows installer equal to the one install.sh already has"
    pickup_role: any
    capability_tags: [release, install, windows, signing, ci-release]
    estimated_hours: 2
    context: |
      FOUND on windows 2026-08-15 while running the published-release smoke
      (skill smoke-curl-install-and-test-e2e) against v0.4.260815.1, the tag
      linux cut this morning. Measured against the live release, 29 assets.

      Assets with NO `.cosign.bundle` sibling:

        SHA256SUMS               -- every file it lists is individually signed
        SHA256SUMS-macos         -- likewise
        tillandsias-tray.exe     -- listed in SHA256SUMS-windows, which IS signed
        tillandsias-windows-x64.zip  -- likewise
        install-windows.ps1      -- listed NOWHERE

      Four of those five have a transitive path: either they are a manifest whose
      entries are each signed, or they are named in a manifest that is signed.
      `install-windows.ps1` is the exception. It carries no signature of its own
      and appears in none of SHA256SUMS, SHA256SUMS-macos or SHA256SUMS-windows.
      Its sha256 on this host is
      e4620c67bbad892c169bd975e23f17b68a2726d673025a4288206d2d80d6c6a2 and there
      is nothing in the release to compare that against.

      THE ASYMMETRY IS THE POINT. The other two installers are individually
      signed:

        install.sh.cosign.bundle         present
        install-macos.sh.cosign.bundle   present
        install-windows.ps1.cosign.bundle   ABSENT

      So a cautious Linux or macOS operator CAN verify the script before running
      it. A cautious Windows operator cannot -- there is no signature to check.

      AND THE README TELLS THEM TO RUN IT ANYWAY. README.md:62:

        $env:TILLANDSIAS_CHANNEL='unstable'; irm https://github.com/8007342/tillandsias/releases/download/unstable/install-windows.ps1 | iex

      All three documented commands pipe to a shell without verifying, so the
      published UX is equally unverified everywhere; that is a separate and
      arguably larger question. This packet is narrower and answerable: on two
      platforms the verification is POSSIBLE and merely not performed, on Windows
      it is impossible. Only the third is a missing artifact.

      WHY IT MATTERS MORE THAN THE COUNT SUGGESTS. `install-windows.ps1` is 24KB
      and is the component with the most privilege in the whole Windows path: it
      writes to PATH, registers a WSL2 distro, and installs a tray that runs at
      startup. It is the single asset where a substitution buys the most and
      costs an attacker the least, and it is the one asset the release does not
      vouch for.

      This surfaced only because the smoke checks integrity BEFORE running the
      installer rather than after. The runbook's own Step 1 says to stop if the
      install errors -- an unsigned installer that installs perfectly would have
      passed every existing check.
    outcome: |
      A Windows operator can verify the installer before executing it, by the
      same means a Linux operator already can.
    exit_criteria:
      - "install-windows.ps1 gains a cosign bundle in the release, produced by the same workflow step that signs install.sh -- verified by listing the assets of a NEWLY cut tag, not by reading the workflow."
      - "OR it is added to SHA256SUMS-windows (which is already signed); either path closes it, but the choice is recorded with its reasoning since the other two installers took the per-file route."
      - "A gate refuses a release whose published asset set contains a script with no integrity path. The count of unsigned assets is not the check -- four of the five here are legitimately covered transitively -- so the check must follow the transitive path, and a fixture must prove it catches a newly-added unsigned script."
      - "NEGATIVE CONTROL: the four transitively-covered assets above do NOT trip that gate."
      - "The README's Windows command either verifies before executing, or the docs say plainly that it does not -- matching whatever is decided for the Linux and macOS lines, which have the same exposure."
    notes: |
      Do NOT close this by signing install-windows.ps1 by hand for one release.
      The Linux installer is signed by the release workflow; if the Windows one
      needs a manual step it will be missing again on the next tag, and the
      absence is invisible unless someone lists the assets.

      Related but distinct: the operator has an Azure Artifact Signing
      subscription for Authenticode on Windows BINARIES (the tray exe/MSI). This
      packet is about the release's own cosign chain over the installer SCRIPT,
      which is the same mechanism already used for install.sh and needs no new
      infrastructure.
    events:
      - type: filed
        ts: "2026-08-15T06:55:00Z"
        host: windows
        summary: |
          Filed from the published-release smoke of v0.4.260815.1, before the
          installer was executed. Worth noting the ordering: every existing
          check on this path runs AFTER the install and asks whether it worked.
          An unsigned installer that works passes all of them.
