packets:
  - order: 873-vgyg
    packet_id: forge-e2e-launch-wedges-on-same-name-container-no-replace-no-corpse-cleanup
    desired_release: v0.5
    title: "P1: one failed forge launch leaves a same-name container that wedges every later smoke/e2e launch until manual podman rm"
    status: ready
    kind: defect
    pickup_role: linux
    priority: p1
    capability_tags:
      - podman
      - forge
      - e2e
      - litmus
    deliverable: crates/tillandsias-headless
    depends_on: []
    estimated_hours: 2
    discovered_by: running litmus:opencode-prompt-e2e-shape twice in quick succession during the 2026-08-24 yoga release-blocker cycle (865-n8vq)
    context: |
      MEASURED ON YOGA 2026-08-24. scripts/litmus-opencode-e2e-launch.sh launches the
      forge via `tillandsias . --opencode --prompt ...`; the headless launch path does
      `podman create/run` with the per-project container name
      (`tillandsias-<project>-forge`). When a container with that name ALREADY exists,
      the launch dies with:
        Error: creating container storage: the container name "tillandsias-tillandsias-forge"
        is already in use by <id>. You have to remove that container to be able to reuse
        that name: ... or use --replace to instruct Podman to do so.
      FORGE_EXIT=1, and the litmus step fails. Two compounding gaps:
      (1) NO DEAD-CORPSE CLEANUP OR --replace: when a previous launch FAILED after
      creating its container (agent crash, hard-cap kill at 1500s/600s — both paths
      kill the wrapper PID, not necessarily the container lifecycle), the exited corpse
      KEEPS THE NAME. Every subsequent e2e/smoke launch on the host then fails with
      name-in-use until a human runs `podman rm`. One crash begets permanent gate red.
      (2) SMOKE-LOCK BYPASS AT THIS ENTRY POINT: the wrapper serializes smokes through
      a lock fd (litmus:smoke-lock-fd-isolation-shape pins that), but invoking
      scripts/run-litmus-test.sh meta-orchestration directly reaches STEP 5 without
      that serialization, so two overlapping suite runs self-collide on the same
      container name (observed three times this cycle; each collision costs a full
      ~5-minute suite pass and reads as a trunk failure).
      Both were observed LIVE: first collision was against a genuinely-running sibling
      smoke (correct contention, wrong surface); subsequent ones against corpses of
      earlier failed attempts (pure wedge). The podman error message itself names the
      remedy the product never applies.
      Related but distinct: macos-concurrent-lane-launch-kills-sibling (order 494) is
      about concurrent lanes tearing shared stack; this row is about the Linux e2e
      launch path refusing/wedging on container-name occupancy.
    exit_criteria: |
      (1) The forge launch path tolerates a same-name EXITED container by removing it
      before create (or passes --replace) while REFUSING loud when the same-name
      container is RUNNING — never killing a live sibling's work. (2) A hermetic
      fixture (or litmus step) reproduces both shapes: dead-corpse relaunch succeeds;
      live-container collision refuses with a distinct verdict, not a raw podman dump.
      (3) Either the direct run-litmus-test.sh entry point takes the same smoke lock as
      the wrapper, or the e2e-shape litmus documents/enforces serialization so two
      overlapping suite runs cannot collide. (4) Measured afterwards: back-to-back
      litmus:opencode-prompt-e2e-shape invocations on one host no longer produce
      name-in-use failures.
