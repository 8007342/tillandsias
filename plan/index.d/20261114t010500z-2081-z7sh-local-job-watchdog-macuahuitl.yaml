  - packet_id: watch-register-attends-a-declared-job-by-rules-alone-and-restarts-it-only-by-its-declared-argv
    order: 2081-v7qx
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [tray, mcp, forge, events]
    estimated_hours: 12
    size: L
    implementer_tier: sonnet
    title: "watch.register, watch.status, watch.cancel and watch.list attend a declared job by rules alone: exit events and one deadline timer, restart only by the declared argv within a budget, escalate when the rules cannot tell"
    context: "The hands of the watchdog, with no model. host_tools.rs GROUPS and the lane socket carry no watch tool today; studio_jobs.rs gives one tool's batch a ticket (studio.queue_workflow) and nothing restarts a dead batch. Rules-only already covers the common cases of the 2026-11-13 render batch: finished, progressing, and exited clean with work left. An ambiguous episode (a non-zero exit, a stall) escalates until the judge exists. Design sections 2, 3, 4 and 8. The registry survives a tray restart, re-attaching by pid and process start time as dead_run.rs identifies a run."
    exit_criteria:
      - "A fixture job that exits 0 after 4 of 10 checklist lines is run again by its declared argv, byte for byte, and reaches 10 of 10; watch.status then reports done. Pre-fix result: FAILS, the lane socket's tools/list carries no watch tool and nothing runs the job again."
      - "A job that dies on every start is restarted at most 3 times and then reports escalated; a control arm with the budget raised through the fixture seam restarts a fourth time. Pre-fix result: FAILS, no watch exists."
      - "A registration whose command is one string, whose progress path leaves the workspace through a symlink, or whose stall interval is 1 minute is refused, each with its own named reason, and nothing is started. Pre-fix result: FAILS, all three are refused alike as an unknown tool."
      - "Over 30 minutes of fixture time with a 2 minute interval and steady progress, the watch records at most 16 timer wakeups and no judge request. Pre-fix result: FAILS, no watch and no counter exist."
      - "Lane B asking watch.status for lane A's watch id is answered as for an unknown id. Pre-fix result: FAILS, no watch exists."
    verifiable_closure: "The watchdog module's fixture transcript with all five arms. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the watchdog module and its tests land with the fix; the claimer writes the test names here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: wait for the operator's cadence ruling on 2081-z7sh, then build the registry, the rules table and the four tools."
    provenance: "Design filed 2026-11-13 from operator direction; openspec/changes/local-job-watchdog."
