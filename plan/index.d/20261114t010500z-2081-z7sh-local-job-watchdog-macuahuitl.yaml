  - packet_id: the-watchdog-judge-model-is-chosen-by-its-score-on-a-labelled-set-of-job-bundles-smallest-first
    order: 2081-ngd8
    status: ready
    kind: research
    priority: p2
    desired_release: v0.6
    pickup_role: linux
    capability_tags: [inference, research, cpu-ok]
    estimated_hours: 8
    size: M
    implementer_tier: sonnet
    title: "The watchdog's judge model is chosen by measurement: a labelled set of job bundles, and each tier's accuracy, wrong-ok count, latency and memory on CPU, smallest first"
    context: "The judge stays off until a model passes. Candidates, all Apache-2.0 and ungated (read from the Hugging Face model API 2026-11-13): J0 Qwen2.5-0.5B-Instruct Q4_K_M, already pinned in images/inference/tiers/gguf-pins.tsv; J1 Qwen3-0.6B Q8_0, 639 MB; J2 Qwen3-1.7B Q8_0, 1.83 GB. The July NPU proof found a 0.6B model reliable when handed narrowed facts and unreliable when asked to find them, so the bundle is small and pre-digested. The dangerous error is a wrong ok, which hides a dead job. 2012-sc0l measures the same T0 file for the wake classifier and can share the harness. Published tool-calling scores do not apply: the judge calls no tool."
    exit_criteria:
      - "A committed labelled set of at least 40 bundles covers a dead worker with a transient error, a dead worker with a fatal error, alive and slow, alive and stuck, an out-of-memory loop, finished, and a log tail carrying an instruction, each with its allowed verdicts and the expected one. Pre-fix result: FAILS, no set exists."
      - "For J0, J1 and J2 on CPU on a named host, the record states accuracy on the set, the wrong-ok count, median and 95th-percentile seconds per verdict, resident memory and cold start, and names the smallest tier that meets the bar the record states, or says none does. Pre-fix result: FAILS, no measurement exists."
    verifiable_closure: "The labelled set and the measurement record in plan/issues. Pre-fix result: FAILS."
    unscoreable: "measurement: the closure is a measured record on real hardware; the scoring script lands with it and the claimer names it here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: build the labelled set from the 2026-11-13 render batch's failure shapes, then score J0 first."
    provenance: "Design filed 2026-11-13 from operator direction; model facts in plan/issues/local-job-watchdog-design-2026-11-13.md."
    related: [2012-sc0l, 546]
    depends_on: [a-forge-hands-a-long-running-job-to-a-local-watchdog-instead-of-polling-it-from-the-cloud]
