    title: "DESIGN FIRST - a forge agent hands a long-running job to a local watchdog (rules, then a tiny offline model, then one escalation) instead of waking a cloud agent to look at it"
    context: "Operator 2026-11-13, first-hand: containers should have NPU and GPU access; a watchdog for local agents with tiny models running locally, and MCP tools whose descriptions state cost, when to use and when to prefer, so cloud minutes are not spent babysitting long-running jobs; re-research zeroclaw; find the minimalist zero-credentials offline container on NPU, GPU, CPU in that fallback order. The same day a cloud agent attended a multi-hour render batch with a scheduled wake every 20 to 30 minutes. The design is filed with this row: rules decide first, a tiny local model in a no-network container chooses only among verdicts the rules allow (ok, restart, escalate), restart runs only the argv the agent declared, and the cadence is one re-armed deadline timer per job (default 10 minutes, floor 2). Nothing is built. The cadence is new and needs the operator's approval before any child is claimed."
    exit_criteria:
      - "Each of the seven questions in the design's section 10 carries an operator ruling recorded as an event on this row, and the change's proposal, design, spec and tasks agree with the rulings. Pre-fix result: FAILS, no ruling exists."
    verifiable_closure: "The operator's rulings as events on this row, and the amended change."
    unscoreable: "operator-decision: the closure is the operator's rulings on seven questions; no script can produce or check them."
    next_action: "Left: the operator reads openspec/changes/local-job-watchdog/design.md section 10 and rules on the seven questions, the cadence first. Then amend the change and release the children. Build nothing before that."
    provenance: "Operator first-hand 2026-11-13 via coordinator macuahuitl; host probe and external research of the same day in plan/issues/local-job-watchdog-design-2026-11-13.md."
