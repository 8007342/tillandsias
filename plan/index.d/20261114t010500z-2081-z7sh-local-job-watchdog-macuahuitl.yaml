  - packet_id: the-watchdog-judge-takes-the-gpu-only-when-it-is-free-and-uncontended-and-never-delays-a-render
    order: 2081-fqw3
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.6
    pickup_role: linux
    capability_tags: [gpu, nvidia-gpu, scheduler, inference]
    estimated_hours: 6
    size: M
    implementer_tier: sonnet
    title: "The watchdog's judge takes the GPU only when free memory covers it and nobody waits, never evicts and never queues, so a render is never delayed by a verdict"
    context: "One GPU job at a time, and renders first. gpu_queue.rs offers wait_for_gpu, which queues, and Arbiter::admit, which evicts a resident LLM; neither fits a background judge. Measured 2026-11-13 on macuahuitl: 22.9 of 24.5 GiB held, 21.0 GiB by one resident LLM, so today the judge would run on CPU. The order is NPU, GPU, CPU with each step taken only when honestly available; watch.status names the tier that decided. On CPU the judge is held to 4 threads at the lowest priority. 1921-yxki is the general lease arbiter for imagegen, vision and music at v0.8; this row asks only for the non-evicting, non-waiting admission the judge needs and should be folded into that arbiter if it lands first. Design section 6."
    exit_criteria:
      - "With one render holding the device and a second waiting, a verdict completes on CPU and the second render starts no later than in a control run with no watchdog, within the fixture's stated tolerance. Pre-fix result: FAILS, no judge exists and gpu_queue has no admission that neither waits nor evicts."
      - "With a resident LLM holding all but 1 GiB, gpu.status lists the same holders before and after a verdict, and watch.status reports cpu for it. Pre-fix result: FAILS, no judge exists."
      - "With the device free, a verdict runs on it, gpu.status lists the judge while loaded and not afterwards. Pre-fix result: FAILS, no judge exists."
    verifiable_closure: "Fixture transcript with the three arms. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the fixture lands with the fix; the claimer writes its name here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: wait for 2081-bgh8, then add the admission and the placement order."
    provenance: "Design filed 2026-11-13 from operator direction; openspec/changes/local-job-watchdog design section 6."
    related: [1957-emar, 1955-rjv3, 1921-yxki]
    depends_on: [the-watchdog-judge-runs-in-a-container-with-no-network-no-credential-and-a-schema-bound-answer]
