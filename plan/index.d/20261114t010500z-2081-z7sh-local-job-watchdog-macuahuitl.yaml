  - packet_id: a-watch-reports-done-or-stuck-exactly-once-on-the-lane-connection-the-lane-inbox-and-the-desktop
    order: 2081-bdss
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [tray, messaging, events]
    estimated_hours: 6
    size: M
    implementer_tier: sonnet
    title: "A watch reports done or stuck exactly once per episode: an MCP notification on the live lane connection, a fleet message in the lane inbox with its receipt, and one curated desktop sentence"
    context: "Escalation is the only point where a cloud agent is reached, so it must arrive once and carry the evidence. The channels exist: lane_events.rs writes notifications/message to live lane connections, the msg_send store (1506-ssb5, 2011-amqd) gives a lane inbox with receipts, and the tray has notify_memory_stall as a notifier precedent. Waking a session that ended its turn is 2012-kuw4 and 2014-slpw; this row delivers the message they wake on and does not build a second wake path. Job output is quoted as untrusted data. Design section 4."
    exit_criteria:
      - "A fixture job stuck past its deadline for an hour of fixture time yields exactly one escalation in the lane inbox with a delivery receipt, one notification on a live lane connection and one notifier call. Pre-fix result: FAILS, nothing is sent."
      - "A finished job yields exactly one done message on the same three channels. Pre-fix result: FAILS, nothing is sent."
      - "A log line that reads as an instruction to the agent appears only inside the message's untrusted-output block. Pre-fix result: FAILS, no message exists."
    verifiable_closure: "Fixture transcript with the three arms. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the fixture lands with the fix; the claimer writes its name here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: wait for 2081-v7qx's verdicts, then wire the three channels."
    provenance: "Design filed 2026-11-13 from operator direction; openspec/changes/local-job-watchdog design section 4."
