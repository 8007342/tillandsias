  - packet_id: the-watchdog-judge-runs-in-a-container-with-no-network-no-credential-and-a-schema-bound-answer
    order: 2081-bgh8
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.6
    pickup_role: linux
    capability_tags: [inference, containers, security, llama-cpp]
    estimated_hours: 10
    size: L
    implementer_tier: sonnet
    title: "The watchdog's judge is a lane of the inference image with no network, no credential, a read-only root and a UNIX socket, and its answer is bound by a schema to the verdicts the rules allow"
    context: "The only part of the watchdog that reads untrusted job output with a model, so the part that can neither reach anything nor act. llama-server binds a UNIX socket when its host ends in .sock, constrains output by a JSON schema, unloads after an idle time and has an offline switch (llama.cpp server README, read 2026-11-13). It is a lane of the existing image in the way llama-server-lane.sh is, serving only a model pinned in tiers/gguf-pins.tsv. It starts on demand and stops when idle. Zeroclaw was considered and not used: an agent runtime configured down is a larger trusted base than a fixed prompt with no tools. Design section 5."
    exit_criteria:
      - "Inspecting the running judge shows network mode none, a read-only root, no capability, a non-root user and an environment with no token, key or proxy variable; the arm fails when the fixture gives the container a network. Pre-fix result: FAILS, no judge container exists."
      - "For every bundle of 2081-ngd8's labelled set, including those whose log tail carries an instruction, the answer parses under the schema and its verdict is a member of that bundle's allowed set. Pre-fix result: FAILS, no judge exists."
      - "Started with a model that has no pin row, the lane refuses with a named reason and a dying fixture job escalates with the judge named unavailable. Pre-fix result: FAILS, no judge exists."
    verifiable_closure: "Fixture transcript with the three arms and the container inspection. Pre-fix result: FAILS."
    unscoreable: "unpinnable-until-the-guard-exists: the fixture lands with the fix; the claimer writes its name here in the same commit (1136-n8sh)."
    next_action: "Nothing is built. Left: wait for 2081-ngd8 to name a tier and 2081-v7qx to supply the rules, then build the lane."
    provenance: "Design filed 2026-11-13 from operator direction; openspec/changes/local-job-watchdog design section 5."
