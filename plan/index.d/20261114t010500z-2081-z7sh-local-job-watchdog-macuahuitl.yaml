        ts: "2026-11-14T01:05:00Z"
        host: macuahuitl
        summary: "filed p2 ready, waits on 2081-bgh8"
  - packet_id: an-intel-npu-compiles-and-runs-a-pinned-small-model-from-a-rootless-container-or-the-blocker-is-named
    order: 2081-4cpi
    status: ready
    kind: research
    priority: p2
    desired_release: v0.6
    pickup_role: linux
    capability_tags: [npu, intel-npu, inference, research]
    estimated_hours: 6
    size: M
    implementer_tier: sonnet
    title: "RESEARCH - an Intel NPU compiles and runs a pinned small model from a rootless container, with tokens per second against CPU, or the record names what blocks it and the licence of each file the fix needs"
    context: "Measured 2026-11-13 on a host with an Intel Core Ultra 7 265KF (NPU PCI id 8086:AD1D, OpenVINO device architecture 3720, intel_vpu bound, /dev/accel/accel0 world read-write): a rootless container with only the accel device passed, SELinux enforcing, lists the NPU through OpenVINO 2026.4.1, and compiling the smallest model fails with ZE_RESULT_ERROR_UNSUPPORTED_FEATURE while NPU_COMPILER_VERSION reads 0. Fedora's intel-npu-driver ships only libze_intel_npu.so and no graph compiler; the PyPI wheel lacks the plugin's compiler loader library. Intel's linux-npu-driver releases carry the compiler as a separate package, validated against OpenVINO 2026.3.1 at driver 1.38.0. llama.cpp's OpenVINO backend lists NPUs with one slot and a small fixed context. accel_probe.rs enumerate_npus reports every NPU usable false with engine-missing, which this measurement confirms from the Intel side. No sudo and no layering on the host: the fix is files in a container image, and a licence outside the permissive list needs the operator."
    exit_criteria:
      - "A record shows, from a rootless container on a host with an Intel NPU, a pinned model compiled for the NPU answering one schema-bound verdict, with prefill and decode tokens per second there and on CPU; or it names the exact blocker with its error text and the licence of each file a fix would add to an image. Pre-fix result: FAILS, the 2026-11-13 compile failed as quoted in the context."
      - "The record states what it changes for orders 481, 542 and 543, and what enumerate_npus would need to report this device usable. Pre-fix result: FAILS, no such record exists."
    verifiable_closure: "The research record in plan/issues with the measurement or the named blocker. Pre-fix result: FAILS."
    unscoreable: "measurement: the closure is a measured record on real hardware with an Intel NPU; no script on a host without one can produce it."
    next_action: "Nothing is built. Left: read the licence of Intel's NPU compiler package, then try it in a throwaway container with the accel device and record the result either way."
    provenance: "Host probe 2026-11-13 by the filing session on macuahuitl; plan/issues/local-job-watchdog-design-2026-11-13.md."
    related: [481, 542, 543, 546, 2014-f45n]
    depends_on: []
