        DEFECT 1 — THE lane FIELD IS A HARDCODED LITERAL AND EVERY RECORD THE FLEET HAS
        EVER WRITTEN SAYS cpu. In record-expert-accuracy.sh the line is
        `lane="${TILLANDSIAS_EXPERT_LANE:-cpu}"`, directly under a comment reading "The
        accelerator lane actually in use, from the capability row rather than from the
        hostname". The code does not read the capability row at all. TILLANDSIAS_EXPERT_LANE
        appears in exactly ONE file in the whole tree (that script) and nothing sets it,
        so the default is what every record carries. My first dry-run produced lane=cpu
        while Vulkan was demonstrably serving; this record reads lane=gpu only because I
        set the override by hand after measuring. This is the same shape as 1253-54zj and
        1254-47xd, now on a third field, and it is worse here than a wrong display value
        because it is stamped into the PERSISTENT SERIES whose entire purpose is comparing
        models ACROSS LANES. A series in which every row says cpu cannot answer that
        question, and nothing in the record marks the value as unestablished.
        It also contradicts this script's own stated doctrine, which is unusually clear:
        "a record that cannot establish one of them writes the field as `unknown` RATHER
        THAN OMITTING IT — an absent field reads as 'not applicable', an explicit `unknown`
        reads as 'we did not establish this', and those are different claims." A hardcoded
        `cpu` is a third and worse thing: a positive false claim.
        917-n3n9 is cited in that comment as where making this anything but cpu is tracked.

        DEFECT 2 — THE PROVENANCE LOOKUP 404s ON ANY HOST CONFIGURED THE PROJECT'S OWN WAY,
        so quantisation and engine record as unknown. The script builds
        `${TILLANDSIAS_EMBED_ENDPOINT:-http://127.0.0.1:11434}/api/show`, but
        TILLANDSIAS_EMBED_ENDPOINT is the OPENAI-COMPATIBLE base — it is
        http://127.0.0.1:11434/v1 in this host's environment, because that is what the
        indexer needs (spec-index-ensure.sh appends /embeddings to it). Appending the
        ollama-native /api/show to a /v1 base gives /v1/api/show, which 404s silently, and
        both fields fall to unknown. The values ARE available: asking the base directly
        returns quantisation F16 and family bert for all-minilm. One environment variable
        is being used for two different API shapes, and the failure is silent in the
        direction that loses provenance. This record therefore carries quantisation and
        engine as unknown, honestly, rather than values I would have had to hand-inject.

        DEFECT 3 — THE SERIES CANNOT BE HARVESTED ACROSS HOSTS. The log resolves to
        .cache/metrics/expert-accuracy.jsonl, and .cache/ is gitignored (.gitignore:146).
        Nothing in the tree copies it into plan/. The script's header states the format
        exists "so CRDT-style harvest across hosts is a concatenation and never a merge
        conflict", but the artifact never leaves the host that wrote it. That is why this
        record is being delivered as an event on this packet rather than by the series:
        the event is the only path to the fleet. Whether the gitignored path is intended
        with an out-of-band harvest, or is a gap, is for this row's holder to decide.

