packets:
  - packet_id: one-shared-plan-binary-probe
    order: 704-zcgi
    status: completed
    desired_release: v0.5
    priority: p1
    title: "Three scripts wrote the same wrong plan-binary probe; the probe now lives in one file that tests by RUNNING, not by an executable bit"
    kind: fix
    deliverable: scripts/plan-binary-probe.sh
    depends_on: []
    pickup_role: any
    owner_host: any
    capability_tags:
      - tooling
      - fail-loud
      - plan
    estimated_hours: 2
    outcome: >
      One sourced probe resolves the runnable tillandsias-plan for every script
      that needs it, preferring .exe and confirming by execution, so a
      non-runnable candidate on a shared Windows/WSL checkout can no longer be
      selected and reported as an answer.
    exit_criteria:
      - "select-work-batch.sh, check-stranded-in-progress.sh and check-fragment-closure-evidence-added.sh all resolve the binary through the shared probe and work on a host where target/release/ holds a Linux ELF beside the .exe"
      - "NEGATIVE CONTROL: with a non-runnable candidate present and nothing else, the probe still fails — a probe that accepted any existing file would satisfy the criterion above while reintroducing the defect"
      - "a runnable stub is selected (positive control), so the probe is not simply refusing everything"
    events:
      - type: completed
        ts: "2026-08-12T09:55:00Z"
        agent_id: "windows-claude-opus5-20260811t215500z"
        host: windows
        summary: >
          evidence_refs: commit on windows-next + the three named runs below.
          select-work-batch.sh arrived from another host this cycle carrying a
          fresh copy of the `[ -x ./target/release/tillandsias-plan ]`
          first-match probe and refused with `refused:no-plan-binary` on this
          Windows host while a perfectly good .exe sat beside the ELF. That is
          the third script with the same bug — two were fixed in place under
          702-68zj one cycle earlier — which is the signal that fixing
          instances was not going to hold.
          VERIFIED on this host: select-work-batch.sh windows now prints a
          batch (was `refused:no-plan-binary`); the stranded sweep and the
          closure gate still work through the shared probe.
          NEGATIVE CONTROLS, run in an isolated temp tree: with no binary at
          all the sweep says `unavailable:no-runnable-plan-binary` and the
          selector says `refused:no-plan-binary`; with a NON-RUNNABLE file at
          target/release/tillandsias-plan (chmod +x, not a binary) the sweep
          still says unavailable rather than selecting it — the exact
          regression the bit-test caused; and a runnable stub IS selected, so
          the probe is not merely refusing everything.
          Also corrected before it became durable: the comments were written
          citing a hand-guessed order token (704-mqx3) before `next-order` was
          run. The minted token is 704-zcgi and every reference was rewritten
          to it prior to commit. Order tokens leak into code comments and
          commit messages and a pushed message cannot be corrected, which is
          exactly why the methodology says to mint first.
