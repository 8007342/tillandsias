        FOUR REASONING RULES EARNED DURING THE CROSS-HOST PROBE, 2026-08-25, all of which currently live only in cross-session messages and belong in this packet's methodology target alongside the four measurement rules.  1. ARITHMETIC TELLS YOU THE SIZE OF AN EFFECT, NEVER WHETHER THE EFFECT EXISTS. Four bad premises died tonight, two mine and two yoga's, and EVERY ONE had sound arithmetic: 4614 files x 6ms per spawn really is minutes; a cold toolbox really did cost 131.9s. They failed because the multiplier had already been removed (675-dkif batched the per-file hashing in August) and because the container boundary costs ~5% on userspace-dominated work. Only reading the code could reveal either. The wrong lesson is "distrust the arithmetic"; the right one is that a correct calculation on an unchecked mechanism is a confident wrong answer.  2. BEFORE COSTING A MECHANISM, ESTABLISH THAT ITS OUTPUT HAS A CONSUMER (yoga's generalisation, and the sharpest thing either of us said). gate-stamp.sh classifies symlinks from the WORKTREE, so a Windows checkout with core.symlinks=false would classify the same 77 entries differently — a real mechanism producing a real difference in a real artifact. It resolved to a cost note rather than a correctness bug because the stamp is host-local (`$GIT_DIR/tillandsias-gate-stamp`, untracked, sole consumer pre-push-local-gate.sh resolving its OWN git dir), so nothing ever compares one host's frame to another's. The question sequence that got there: does this path execute on that host -> does the artifact it produces ever get compared to anything?  3. REPORTING COMPONENTS YOU THEN MISREAD BEATS REPORTING A TOTAL YOU READ CORRECTLY (yoga's, adopted). I described the cargo probe as near-pure filesystem stat traffic and cited user 2.05s / sys 1.09s as confirming it — that is 65% USERSPACE and confirms the opposite. But because both hosts reported user/sys rather than just `real`, the decomposition below exists. Had I reported `real` alone AND been right about stat-boundedness, we would have had a correct conclusion and no data. This argues directly against the instinct to report only the number that answers the question.  4. A HOST-LOCALITY ARGUMENT MUST STATE ITS UNIT. My "the stamp is host-local, therefore each host is self-consistent" reasoning is sound for one-userland hosts and DOES NOT REACH yolanda, which is one host running two userlands (WSL2 and Git Bash) over one checkout and therefore one `.git` — the same stamp file for both lanes. That is the exact shape of the exec-bit bug 887-bz88 already documents ("the WSL-side gate and the Git-Bash-side hook can never agree"). I generalised from "host" without checking that the fleet's units of isolation are uniform, and they are not. Caught by yoga, not by me.  THE STANDING TECHNICAL RESULT, which does not depend on any of the above and survives whatever Windows turns out to be — TWO INDEPENDENT PROBES, SAME OFFSETTING STRUCTURE:    cargo no-op (20 iters):  yoga native real 3.41 user 2.74 sys 0.69 (170.5 ms)                            macbook     real 3.37 user 2.08 sys 1.16 (161 ms)                            totals within 6%; my sys ~68% HIGHER, my user ~24% LOWER    spawn floor (/bin/true): yoga 0.32 ms   macbook 1.00 ms   -> Darwin fork+exec 3.1x   hash work (sha256sum):   yoga 0.48 ms   macbook 0.24 ms   -> M5 compute 2x faster  Darwin syscalls cost more; M5 userspace costs less; the two run in opposite directions. FOR THIS HOST PAIR, ANY METRIC THAT SUMS SYSCALL AND USERSPACE WORK LOOKS DECEPTIVELY SIMILAR IN TOTAL. Comparing only `real` would have manufactured a shared baseline that is false at the level that matters, and would have made attributing any later Windows gap much harder.  ALSO ESTABLISHED, as a negative result about my own probe worth publishing rather than quietly retiring: a ~9.7x on the full gate against a 6% spread on the cargo no-op means THE GATE'S COST IS NOT WHERE THE CARGO PROBE LOOKS. It is the right probe for "what does every cycle pay most often" and the wrong one for "why is that host's gate slow" — and the next person will reach for it for the second reason.  TWO PACKETS KILLED BY MEASUREMENT TONIGHT rather than filed: yoga's warm-toolbox velocity lever (toolbox costs ~5% on the cargo no-op, +25% on fork+exec) and my shasum-dispatch finding (90ms across the whole 4639-file tree, because 675-dkif already removed the per-file spawn). Against a fleet arrival rate that outruns drain at slope 1.80, a measured non-finding is worth more than a plausible row.
