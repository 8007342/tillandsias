        OPERATOR CONSTRAINTS recorded verbatim because they change what
        "healthy" looks like on this machine: 4 cores; building the whole
        project will take a long time and will likely break timeouts on launch;
        cadence around every 4 hours rather than hourly. A cycle that looks
        stalled here is probably just slow, and the failure mode to guard
        against is an operator or a timeout killing a build that was going to
        succeed.

        TWO KNOBS THAT MATTER, both verified in-tree today:
        TILLANDSIAS_BUILD_TIMEOUT_SECS bounds each podman build and defaults to
        1800s (scripts/build-image.sh:455) — likely too tight for this class of
        host. CYCLE_PREFLIGHT_SKIP_BUILD=1 skips the instrument rebuild
        (scripts/cycle-preflight.sh:80) and is TEMPTING HERE AND SHOULD BE
        AVOIDED: measured on macuahuitl the same day, a plan binary 11 hours
        stale made the entire 833-fpe7 resumable-dirt detector inert — it
        answered `unattributable:plan-query-failed` for every dirty tree, which
        falls through to the dirty-start refusal, silently restoring the very
        wedge 833-fpe7 had just closed. Slow is recoverable; stale is not
        visible.
