packets:
  - packet_id: litmus-commands-resolve-the-plan-binary-by-hand-and-go-red-on-windows
    order: 751-vega
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    kind: bug
    title: "14 litmus tests resolve tillandsias-plan with a hand-rolled `[ -x ]` chain; two are RED on windows and the 721-nyev gate never scanned this surface"
    deliverable: "litmus commands that resolve the plan binary through the shared probe, and a gate that covers openspec/litmus-tests/ as well as scripts/"
    pickup_role: any
    capability_tags: [litmus, plan, windows, fail-loud, ci-release]
    estimated_hours: 2
    context: |
      MEASURED on windows 2026-08-15 while running the methodology-accountability
      litmus suite as this cycle's gate. Three of fifteen executed tests are red.
      Two share one root cause, and it is a class this project already declared
      fixed.

        litmus:append-event-rejects-unknown-flags-shape  step 1/3
          expected=ok: flag form parsed
          output=FAIL: [bash: line 1: : command not found]

        litmus:loop-status-count-advisory-shape          step 1/3
          expected=ok: count drift is advisory, verify stays green
          output=FAIL: rc=126

      Both steps resolve the binary like this:

        B=target/release/tillandsias-plan
        [ -x "$B" ] || B="$(command -v tillandsias-plan)"

      THE HOST FACT that breaks it. On a shared Windows/WSL checkout the release
      directory holds BOTH artifacts, and the ELF is not executable to MSYS:

        -rw-r--r--  1598152  Aug 13 04:25  target/release/tillandsias-plan      (Linux ELF)
        -rwxr-xr-x  1787904  Aug 13 19:20  target/release/tillandsias-plan.exe  (runnable)

      So `[ -x ]` is FALSE, `command -v tillandsias-plan` finds nothing on PATH,
      and `B` ends up EMPTY -- the shell then reports `: command not found`,
      which reads as a missing tool rather than a resolution bug. rc=126 in the
      other test is the sibling outcome: found, not executable. A third direction
      exists and has been seen before -- when the ELF DOES carry the executable
      bit, `[ -x ]` selects it and the test runs the wrong architecture.

      The probe resolves all three and was verified against the failing step by
      hand this cycle:

        . scripts/plan-binary-probe.sh; P="$(resolve_plan_binary)"
        probe=[./target/release/tillandsias-plan.exe]
        "$P" append-event NOSUCHREF_LITMUS --type progress ... -> ok: flag form parsed

      WHY THIS SURVIVED A GATE BUILT FOR IT. 721-nyev filed exactly this class
      and shipped scripts/check-plan-binary-probe-usage.sh to make the rule
      enforceable rather than remembered. That gate's own header predicts a tenth
      instance appearing next week. It does not scan openspec/litmus-tests/ --
      it walks `find scripts -name '*.sh'` -- so fourteen instances were sitting
      outside its beam the whole time, and it has been reporting
      `ok:plan-binary-probe-usage:N eligible of M scanned` on every cycle since.
      A gate scoped to one directory reports on that directory, and the verdict
      line does not say which directory. That is the same shape as the packets
      this milestone keeps filing: a signal that reports healthy without
      observing the property.

      THE FOURTEEN FILES (grep -l 'target/(release|debug)/tillandsias-plan'
      openspec/litmus-tests/*.yaml): append-event-rejects-unknown-flags-shape,
      capability-manifest-guard, cycle-batch-triage-shape,
      expert-groundtruth-harness, forge-expert-base-guard-shape,
      forge-plan-expert-build-shape, fragment-closure-evidence-gate-shape, and
      seven more. Not all are defective -- forge-expert-base-guard-shape already
      resolves via `command -v` FIRST with a comment saying hardcoding it broke
      on a host layout, and two files only NAME the path in prose. The sweep must
      classify, not blind-replace.
    outcome: |
      A litmus step that needs the plan binary finds the one that runs on the
      host it is running on, and a new hand-rolled resolution cannot be added
      without the gate saying so.
    exit_criteria:
      - "The two named red tests pass on windows, run as `scripts/run-litmus-test.sh methodology-accountability --phase pre-build --size instant`, with the observed output quoted as evidence."
      - "check-plan-binary-probe-usage.sh covers openspec/litmus-tests/*.yaml as well as scripts/*.sh, and its verdict line names the surfaces scanned -- `ok:...:<n> eligible of <m> scanned` gave no way to notice that a whole directory was outside the beam."
      - "NEGATIVE CONTROL: a litmus file that merely NAMES the path in a precondition or comment is not flagged, and forge-expert-base-guard-shape's deliberate `command -v` first ordering is either left alone or converted with its reasoning preserved."
      - "The sweep is verified by EXECUTION on windows, not by grep: run the affected suites and quote exit codes. The whole class is about an executable bit being a claim while running the binary is the evidence."
    notes: |
      Do NOT fix this by making the litmus runner export a resolved PLAN
      variable. That hides the resolution from the step, and a step copied into a
      terminal by a human debugging it would then fail differently than in the
      suite -- litmus commands are meant to be runnable by hand.

      Also NOT the same bug, found in the same run and filed separately as
      752-8hqx: litmus:plan-only-push-lane-shape step 2/6 fails on windows
      because git's `LF will be replaced by CRLF` warning lands in the captured
      output the step matches against.
    events:
      - type: filed
        ts: "2026-08-15T03:00:00Z"
        host: windows
        summary: |
          Found by running the litmus suite as a cycle gate rather than by
          auditing scripts. Worth recording: the gate that exists for this exact
          class has been green on every windows cycle while two tests in the
          suite were red for that class. The gate was not wrong about what it
          measured -- it was scoped to scripts/ and said so nowhere in its
          verdict.

  - packet_id: litmus-push-lane-step-matches-against-git-crlf-warning-on-windows
    order: 752-8hqx
    status: ready
    desired_release: v0.5
    priority: p2
    release_target: fail-loud-diagnosis-milestone
    kind: bug
    title: "litmus:plan-only-push-lane-shape is red on windows because git's CRLF warning lands in the output the step asserts on"
    deliverable: "a push-lane litmus step whose assertion is not defeated by git's line-ending advisory"
    pickup_role: any
    capability_tags: [litmus, windows, ci-release]
    estimated_hours: 1
    context: |
      MEASURED on windows 2026-08-15, same suite run that produced 751-vega.

        litmus:plan-only-push-lane-shape  step 2/6
          "ACCEPT: a fragments-only push passes the lane without a build stamp
           and the remote advances"
          expected=ok: lane-accepts-fragments-only
          output=warning: in the working copy of
            'plan/index.d/29990101t000000z-existing-x.yaml',
            LF will be replaced by CRLF the next time Git touches it

      Step 1/6 (the gate script parses and defines the lane) passes, so the lane
      logic itself is not implicated. The step writes a fixture fragment into a
      throwaway repo and captures git's combined output; on a host with
      core.autocrlf set, git emits the advisory and the captured string no longer
      equals what the step matches on.

      This is a TEST-HARNESS defect, not a product defect, and the distinction is
      worth keeping: the plan-only push lane is not known to be broken on
      windows. But a permanently-red test on one platform is indistinguishable
      from a real failure to the next agent reading the summary, which is why it
      gets a packet rather than a shrug.
    outcome: |
      The step asserts on the lane's verdict rather than on a captured stream
      that a host's git configuration can add lines to.
    exit_criteria:
      - "The test passes on windows AND on linux, with both runs quoted -- a fix that only silences the warning locally would move the failure rather than remove it."
      - "The assertion targets the lane's own typed output; if the step must capture git, the advisory is filtered by matching the verdict rather than by comparing whole streams."
      - "A sweep for sibling steps in openspec/litmus-tests/ that compare whole captured git output, reported as a count even if it is zero."
    events:
      - type: filed
        ts: "2026-08-15T03:00:00Z"
        host: windows
        summary: |
          Split from 751-vega deliberately: same suite run, different root cause.
          Filing them together would have produced a packet whose exit criteria
          could be half-satisfied and read as done.
