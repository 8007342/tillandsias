      summary: >
        THE CIRCULAR PROBE IS FIXED, AND PROVEN BY THE ONE TEST THAT COULD TELL THE DIFFERENCE.  WHAT IT WAS:     let cdi_ok = effective_tier == "gpu-cuda"; `effective_tier` comes from scripts/inference-tier-probe.sh, which decides gpu-cuda from `nvidia-smi -L` ON THE HOST — the SAME signal as the `nvidia_present` this line sits inside. On any host where nvidia-smi answers, cdi_ok was unconditionally true and `cdi-spec-missing` could NEVER fire. The envelope advertised a `container` lane nobody had checked.  WHAT IT IS NOW: nvidia_cdi_deliverable() reads the CDI spec directories podman actually searches (/etc/cdi, /var/run/cdi, and $HOME/.config/cdi — the user dir a rootless immutable host must use) and asks whether a spec NAMES the nvidia kind AND declares a real /dev/nvidiaN node with no self-referential prefix. Same evidence the runtime uses, at file-read cost.  DELIBERATELY NOT A `podman run` CANARY: this runs on a launch path and must not pay a container round trip, and a canary would need the enclave proxy neutralised to be reliable. Reading the spec is the same fact, cheaper.  THE NEGATIVE CONTROL, which is the only way to test this honestly — on a host where CDI already works, the broken and the fixed check answer IDENTICALLY:    spec in place     accel_gpu=usable          accel_reason=-                 lanes=[container, host-native]   spec moved aside  accel_gpu=present-unusable accel_reason=cdi-spec-missing  lanes=[host-native]   spec restored     accel_gpu=usable          accel_reason=-                 lanes=[container, host-native]  Under the old check all three lines would have read `usable`. That is the fix, demonstrated rather than asserted.  TESTS: cdi_deliverable_requires_a_device_node_not_merely_the_kind pins four shapes against a temp dir — deliberately NOT this machine's state, for the reason above. Both guard clauses mutation-verified to fire: dropping the /run/host guard makes the prefixed-spec arm fail, accepting the kind alone makes the bare-spec arm fail.  THE PARAMETER WENT WITH THE CIRCULARITY, and the compiler proved the severance. `effective_tier` was threaded into enumerate_devices -> enumerate_gpus for ONE consumer: that cdi_ok line. The moment the real check landed, rustc reported it unused at every level. It is now read exactly once, in run_probe, to populate `legacy_tier` — which is the RIGHT place: the document carries the CLAIMED tier beside INDEPENDENTLY MEASURED devices, so the two can be compared instead of one being manufactured from the other.  I BRIEFLY MARKED IT `_effective_tier` AND WAS WRONG. It is genuinely read for legacy_tier; the compiler caught me. Recorded because "unused parameter" was my assumption and the codebase already had the better design.  AND THE CROSS-TARGET GATE EARNED ITS KEEP AGAIN (656-spux). Removing the parameter orphaned a `#[cfg(not(target_os = "linux"))] let _ = effective_tier;` — a fallback that existed only to silence the unused-parameter warning on other targets. It compiles on the host either way; ONLY the Windows target proved the line now referenced something that no longer exists. Third time today a target-gated path caught what the host build could not.  THE MATRIX HALF IS INCIDENTALLY SATISFIED, and I checked rather than assumed. One row set, all three compute paths named truthfully:     cpu      16 cores, 13 GiB RAM     nvidia   usable, lanes=[container, host-native]     (container lane now VERIFIED, not inferred)     amd      usable=false, reason=rocm-runtime-missing, lanes=[host-native] The AMD iGPU is present and honestly reported as unusable for compute, host-native only — and no code routes work onto it, so the placement rule (presence must not choose placement) holds. The 793-zumy enumeration redesign is NOT done; what is done is that this host's envelope no longer lies about any of the three.
