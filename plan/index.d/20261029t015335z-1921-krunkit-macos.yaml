packets:
- packet_id: macos-vm-provider-krunkit-with-vz-fallback
  order: 1921-kr7v
  status: ready
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: macos
  capability_tags:
  - macos
  - vm
  - gpu
  estimated_hours: 16
  title: Boot the macOS guest with libkrun/krunkit, falling back to Virtualization.framework
  context: 'Operator approved libkrun/krunkit as the macOS VM provider on 2026-10-29 (relayed by macuahuitl). Goal: one unified backbone on every platform, accepting gaps in feature parity, with the backend swappable later. Measured 2026-10-28 (plan/issues/macos-gpu-isolation-2026-10-28.md): the VZ guest has no virtio-gpu, so a GPU is reachable only through libkrun. Measured on this host 2026-10-29: krunkit 1.3.2 is already at /opt/homebrew/bin/krunkit (Homebrew), and there is no /opt/podman. Whether the podman .pkg installer ships krunkit is not yet checked. Bundling krunkit in Tillandsias.app versus depending on it is decided in this packet, with no host installs beyond what krunkit itself needs. Sequenced after the CPU baseline (1921-sdv9).'
  exit_criteria:
  - 'A provider seam (VmProvider: Vz | Krunkit) selects krunkit when the binary is present and falls back to VZ with a status line naming why; a test asserts both selections, and it fails on today''s code (VZ only).'
  - 'The bundle-versus-depend decision is recorded with evidence: whether the podman pkg ships krunkit and its libkrun-efi/MoltenVK dependencies, the size, and the signing and notarization impact.'
  - 'The same guest image boots under krunkit with vsock control, virtiofs mounts and networking working; --diagnose --json reports provider=krunkit.'
  verifiable_closure: 'cargo test -p tillandsias-macos-tray vm_provider_selects_krunkit_and_falls_back_to_vz'
  next_action: 'Read how krunkit is packaged (Homebrew formula, podman pkg), map the VZ config (vsock, virtiofs, disks, net) onto krunkit flags, then write the provider-selection test first.'
  provenance: 'Operator approval 2026-10-29 via macuahuitl; research PR #705.'
  events:
  - type: filed
    ts: '2026-10-29T01:53:35Z'
    host: tlatoanis-macbook-air
    summary: filed the krunkit provider with VZ fallback (operator-approved)
- packet_id: guest-vulkan-device-and-icd-under-krunkit
  order: 1921-vk4i
  status: ready
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: macos
  blocked_by:
  - 1921-kr7v
  capability_tags:
  - macos
  - gpu
  - images
  estimated_hours: 6
  title: The krunkit guest exposes a Venus Vulkan device and ICD to forge containers
  context: 'Today the VZ guest has no /dev/dri, no virtio-gpu (0x1050) and no Vulkan ICD (measured 2026-10-28). Under krunkit the guest needs Mesa Venus (virtio ICD) and /dev/dri/renderD128 passed into the containers that run inference.'
  exit_criteria:
  - 'A guest probe reports a virtio-gpu device, /dev/dri/renderD128 and a Venus ICD; `vulkaninfo --summary` inside an inference container names "Virtio-GPU Venus". The probe is a fixture that fails on today''s VZ guest.'
  - 'The render node reaches only the containers that need it; the hardening-envelope validator still passes.'
  verifiable_closure: 'guest probe output attached, plus the device-passthrough argv test'
  unscoreable: 'unpinnable-until-the-guard-exists: the guest probe lands with the fix (1136-n8sh).'
  next_action: 'Once 1921-kr7v boots, add mesa-vulkan-drivers (Venus) to the guest image and pass the render node to the inference containers.'
  provenance: 'Operator approval 2026-10-29 via macuahuitl.'
  events:
  - type: filed
    ts: '2026-10-29T01:53:35Z'
    host: tlatoanis-macbook-air
    summary: filed the guest Vulkan device and ICD under krunkit
