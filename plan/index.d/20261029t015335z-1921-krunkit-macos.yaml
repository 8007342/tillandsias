  title: sd.cpp time per image at 512px, SDXS and SD1.5, CPU on VZ now and Vulkan on krunkit later
  context: 'The CPU baseline comes first, after story 1921 (#704) lands; the Vulkan run follows 1921-vk4i. Same guest, same models, same prompt and seed. Record wakeups and memory as well. No published SD numbers for krunkit exist; the llama.cpp proxy was about 0.6x native Metal and about 3x CPU on prompt processing (llama.cpp discussion #12985).'
  exit_criteria:
  - 'CPU baseline: SDXS and SD1.5 512px time per image (median of 3), peak RSS and wakeups, on the VZ guest (8 vCPU, 8 GB).'
  - 'Vulkan on the krunkit guest: the same measurements, plus an output check against the CPU image (sd.cpp issue #563 reports Vulkan output differing from CPU).'
  - 'Both runs recorded in plan/issues/macos-gpu-isolation-2026-10-28.md with the exact sd.cpp commit, models and flags.'
  verifiable_closure: 'timings table with commands attached to the research file'
  unscoreable: 'measurement packet: the evidence is the recorded timing table, not a test.'
  next_action: 'After #704 lands: build sd.cpp (CPU) in the guest, fetch SDXS and SD1.5, and time 3 runs each.'
