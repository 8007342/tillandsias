- packet_id: release-workflow-saves-the-nix-cache-and-rust-cache-restores-on-tags
  order: 1916-nxcs
  status: ready
  kind: bug
  priority: p0
  desired_release: v0.5
  pickup_role: any
  capability_tags:
  - ci
  - github-actions
  - release
  estimated_hours: 2
  title: The release workflow saves the Nix cache it restores, and rust-cache on macOS and Windows restores on tag runs
  context: 'operator-approved 2026-10-28. Source: scratch/research/build-pipeline.md sections 4 and 5.1. release.yml sets cache-nix-action save: false with a primary key on flake.lock only, so every release restores a key no run writes and cold-builds crane deps; the Nix build step takes 61 of the Linux job''s 63 min. swatinem/rust-cache on macOS and Windows saves only on the default branch, so tag runs restore nothing. About 283 GitHub minutes per release. Speeds other work: every release and its verification.'
  exit_criteria:
  - 'release.yml''s Nix cache step has save: true and a key on flake.lock plus Cargo.lock; rust-cache on macOS and Windows has a key or save-if that a tag run can hit (for example a shared-key saved from a main-branch run).'
  - On the second release run with unchanged locks, the Nix Cache step reports a hit and the Nix build step takes under 15 min; today both are false (no hit, 61 min).
  verifiable_closure: 'gh run view of two consecutive release runs with unchanged locks: the second shows the cache hit and a Nix build step under 15 min.'
  unscoreable: 'unpinnable-until-the-guard-exists: the fixture or probe named in the exit criteria lands with the fix (1136-n8sh).'
  next_action: 'Nothing is changed yet. Left: edit the two cache steps in .github/workflows/release.yml, land, then read the cache step and Nix step timings from two release runs (the first saves, the second must hit) and attach both run ids.'
  provenance: 'operator-approved 2026-10-28; research report scratch/research/build-pipeline.md sections 4 and 5.1 (macuahuitl, 2026-10-28). Operator 2026-10-28: "Yes to fixing github actions and yes to adding timers and metrics to our build process and runtime, we need observability. I approve the work items from the reports. Triage them accordingly, since some of them moved ahead could speed up other work from the queue."'
  events:
  - type: filed
    ts: '2026-10-28T22:10:00Z'
    host: macuahuitl-fedora
    summary: filed p0 from the operator-approved research report (operator-approved 2026-10-28)
