- packet_id: dev-loop-and-gate-sccache-regimes-are-split
  order: 1916-dvlp
  status: ready
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags:
  - build
  - rust
  estimated_hours: 4
  title: 'A dev incremental build works through build.sh: the sccache wrapper is used only for the non-incremental gate regime'
  context: 'operator-approved 2026-10-28. Source: scratch/research/build-pipeline.md sections 1 and 5.4. RUSTC_WRAPPER=sccache with CARGO_INCREMENTAL=1 refuses to compile (incremental compilation is prohibited), so build.sh''s wrapper and a dev incremental loop exclude each other, and the two regimes never share hits. Also add [profile.dev] debug = line-tables-only and split-debuginfo = unpacked. mold measured no gain; leave it out unless measured otherwise.'
  exit_criteria:
  - CARGO_INCREMENTAL=1 ./build.sh compiles; today rustc exits 1 with 'incremental compilation is prohibited'.
  - A one-line edit in tillandsias-headless main.rs followed by one named test runs in under 2 s on the measuring host, with the regime recorded; today 2.6 s.
  - The gate regime (CARGO_INCREMENTAL=0 with sccache) keeps its cache hits; a gate log shows sccache hits as before.
  verifiable_closure: A fixture that runs build.sh with CARGO_INCREMENTAL=1 and asserts that no sccache wrapper is set and the build exits 0.
  unscoreable: 'unpinnable-until-the-guard-exists: the fixture or probe named in the exit criteria lands with the fix (1136-n8sh).'
  next_action: 'Nothing is changed yet. Left: make build.sh drop RUSTC_WRAPPER when incremental is on, add the dev profile, write the fixture first, and record before and after timings with their regime.'
  provenance: 'operator-approved 2026-10-28; research report scratch/research/build-pipeline.md sections 1 and 5.4 (macuahuitl, 2026-10-28). Operator 2026-10-28: "Yes to fixing github actions and yes to adding timers and metrics to our build process and runtime, we need observability. I approve the work items from the reports. Triage them accordingly, since some of them moved ahead could speed up other work from the queue."'
