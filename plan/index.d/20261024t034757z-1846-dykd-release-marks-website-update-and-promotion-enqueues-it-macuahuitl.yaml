      - 'fixture range with no trailer: zero client calls and no website-update line (pre-fix result: PASSES vacuously — recorded so the arm is known not to discriminate alone)'
      - 'stub client exits non-zero: promotion still prints promoted:<tag> and the last-but-one line is website-update:deferred:<tag>:<why> (pre-fix result: FAILS — line absent)'
