    title: |
      A commit trailer "Website-Update: <one-line reason>" anywhere in the range previous-stable..tag marks the release as needing a website update, and promote-stable.sh, after the stable tag lands, enqueues one website-update task (tag, reasons) on the 8007342/tillandsias.org coordinator namespace — idempotent per tag, never blocking promotion
    context: |
      Operator request 2026-10-24 (macuahuitl, in-session): some releases need
      a website update; the first is the release that retires local
      (host-checkout) launches, because tillandsias.org lists local launches
      as a main feature.
      MECHANISM CHOSEN (least new machinery): a git commit trailer, read with
      `git log --format='%(trailers:key=Website-Update,valueonly)'
      <prev-stable>..<tag>`. No new file, no VERSION-adjacent state, no
      release-notes parsing: the range previous-stable..tag already exists in
      promote-stable.sh's world (the `stable` tag is moved by step 3), and the
      trailer travels with the change that caused it, so the author of the
      local-launch retirement PR states it once.
      EXISTING CAPABILITY REUSED: promote-stable.sh already has a post-flip
      side-effect step (step 4, scripts/advance-deploy-ref.sh, 1798-khw6) with
      a falsifiable `verified:` line grammar; the enqueue is a step 5 of the
      same shape. The queue call is the 1826 client, not a new HTTP path.
      The namespace is the site project's (owner/repo normalised per 1828's
      derivation), so the task is picked up by whichever forge opens that
      project. Enqueue failure (no token, coordinator unreachable) prints
      `website-update:deferred:<tag>:<why>` and does NOT fail the promotion;
      the marker is recomputable from git, so a later re-run enqueues.
      Website rule: the task payload carries only tag + trailer reasons, no
      host or fleet detail — the site stays about architecture.
    exit_criteria:
