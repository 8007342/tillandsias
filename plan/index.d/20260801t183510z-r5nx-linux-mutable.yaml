packets:
  - packet_id: release-smoke-clobbers-the-developer-binary-and-wipes-the-runtime
    order: 587-fr7g
    desired_release: v0.5
    title: "The release smoke silently downgrades the workstation: it curl-installs the last release over ~/.local/bin and destructively resets the runtime, then never restores either"
    status: ready
    kind: fix
    deliverable: skills/smoke-curl-install-and-test-e2e + scripts/install.sh prefix isolation + restore step
    depends_on: []
    pickup_role: linux
    capability_tags: [e2e, smoke, release, developer-experience, destructive]
    estimated_hours: 4
    outcome: >
      OPERATOR-VISIBLE 2026-08-01: "The tray is dead, it was build .5, I tried
      relaunching from terminal but it launched an old installed binary from
      path."
      ROOT CAUSE, established from evidence rather than inferred. A sibling ran
      /smoke-curl-install-and-test-e2e and recorded it in commit 5603b2dd
      (plan/issues/smoke-e2e-findings-v0.4.260728.2-2026-08-01.md). That skill
      does exactly what it says on the tin, and the tin is the problem: it
      CURL-INSTALLS the published release into the developer's real
      ~/.local/bin — the smoke's own log confirms "installed version matched
      v0.4.260728.2" — and it performs a DESTRUCTIVE RESET, its own words being
      "containers, volumes, and images were empty afterward".
      So the freshly built and installed v0.4.260801.5 was overwritten by a
      four-day-old release, and the running tray's entire runtime was wiped from
      under it. The tray's clean "Received shutdown signal / Graceful shutdown
      completed" was the CORRECT response to having its world deleted, not a
      crash. Verified after the fact: ~/.local/bin/tillandsias reported
      v0.4.260728.2 with an mtime of 23:41, well after the 23:02 local install.
      WHY THIS IS A DEFECT AND NOT JUST SURPRISING. Simulating a clean operator
      install is exactly the right thing for this smoke to do, and it must keep
      doing it. What is wrong is that it does so IN PLACE, on the developer's
      only PATH entry, and then leaves. The operator loses their build with no
      warning before, no notice after, and no restore — and the failure surfaces
      much later as "why is my binary old", which is precisely how it surfaced.
      It also silently invalidates any concurrent work: another agent mid-cycle
      is now testing a different binary than the one it built.
      FIX DIRECTION, not prescribed: run the smoke against an isolated prefix
      (scripts/install.sh already parameterises INSTALL_DIR) with PATH scoped to
      it, so the real ~/.local/bin is never touched; or snapshot and restore the
      prior binary around the run. Whichever is chosen, announce the destruction
      BEFORE it happens — a destructive step that a human would want to know
      about must say so first, per the project's own confirm-before-destroy
      discipline.
    exit_criteria:
      - "running the release smoke leaves ~/.local/bin/tillandsias byte-identical to what it was before, or the smoke states loudly and in advance that it will replace it"
      - "the destructive runtime reset is announced before it runs, and its scope is stated"
      - "a litmus proves the developer binary survives a smoke run (or that the announcement is emitted), by running the real path rather than grepping the skill text"

  - packet_id: proxy-mediated-github-auth-so-the-credential-never-enters-the-forge
    order: 587-ig9g
    desired_release: v0.6
    title: "Research: perform GitHub authentication AT THE PROXY, so brew can install without any credential inside the forge"
    status: ready
    kind: research
    deliverable: plan/issues/ research doc + decision record
    depends_on: []
    pickup_role: linux
    capability_tags: [research, security, credentials, proxy, brew, forge]
    estimated_hours: 6
    outcome: >
      OPERATOR DIRECTION 2026-08-01: "File a plan packet to investigate if we can
      make that attestation in the proxy through url rewriting, so the credential
      doesn't need to be in the forge even to use it for brew installs."
      THE PRIZE: today HOMEBREW_GITHUB_API_TOKEN is injected into EVERY forge
      lane and is readable from the container config via podman inspect (verified
      at runtime, 93-character value — packet
      forge-env-credentials-land-in-podman-argv). If the proxy supplies the
      authentication, the forge holds CAPABILITY rather than a CREDENTIAL, and
      the zero-credential invariant becomes true instead of aspirational.
      THE CONSTRAINT THAT DECIDES IT, and the first thing to establish: a proxy
      can only add an Authorization header to a connection it TERMINATES. Read
      images/proxy/squid.conf and determine which hosts are SPLICED versus
      BUMPED. Order 390's research already found that api.github.com is spliced
      today, so this would require bumping it — meaning the proxy decrypts GitHub
      API traffic for every lane. That is a deliberate posture change and must be
      argued on its merits, not slipped in as an implementation detail.
      COMPARE THE ESTABLISHED ALTERNATIVE rather than assuming the proxy is the
      answer: this repo already uses a BROKER pattern for exactly this shape
      (git-credential-tillandsias.sh, order 424's mirror work) — a component that
      holds the credential and hands out scoped capability. A broker needs no TLS
      interception. Order 390 also proposed proxy-mediated capability as a fourth
      option on order 435. State clearly which is better HERE and why.
      SEQUENCING: do not start until the attestation root cause is known
      (packet brew-attestation-verification-always-fails-and-stalls-forge-startup).
      If attestation is failing because sigstore endpoints are unreachable or
      because gh reads a different variable, then no amount of header injection
      fixes it, and this packet would be solving the wrong problem elegantly.
    exit_criteria:
      - "a verdict on whether squid can inject the credential for brew's actual GitHub calls, grounded in which hosts are spliced vs bumped TODAY"
      - "the TLS-interception trade is stated plainly with its blast radius, not buried"
      - "the broker alternative is compared on the same criteria, with a recommendation"
      - "the dependency on the attestation root cause is honoured: this does not proceed on the assumption that a missing header is the problem"
