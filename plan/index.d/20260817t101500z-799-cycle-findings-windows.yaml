  - packet_id: windows-host-clock-is-not-ntp-synchronised
    order: 799-yiv5
    status: ready
    kind: bug
    pickup_role: windows
    priority: p3
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    depends_on: []
    deliverable: |
      The windows host's clock is disciplined by a time source, and the
      start-of-day gate can tell whether it is.
    capability_tags:
      - windows
      - hygiene
    tags:
      - v0.5
      - audit-2026-08-17
    title: |
      w32tm reports "not synchronized" with Source: Local CMOS Clock and Last Successful Sync Time: unspecified — the start-of-day gate's clock/NTP check has nothing disciplining it, and measured drift is already 6s.
    context: |
      OBSERVED 2026-08-17 during the start-of-day gate on windows/Yolanda:

        Leap Indicator: 3(not synchronized)
        Stratum: 0 (unspecified)
        ReferenceId: 0x00000000 (unspecified)
        Last Successful Sync Time: unspecified
        Source: Local CMOS Clock

      Measured skew against a network reference (GitHub's HTTP Date header,
      round-trip included): 6 seconds fast.

      Six seconds harms nothing today. An UNDISCIPLINED clock is the finding —
      a free-running CMOS clock drifts without bound, and
      plan/issues/fleet-restart-post-restart-checklist-2026-08-13.md calls out
      clock/NTP sync specifically because skew breaks SSH-CA certificate TTLs
      and freshness stamps. Both failures present as something other than a
      clock problem, which is why this is worth a packet at 6 seconds rather
      than at 600.

      The start-of-day gate currently "verifies clock/NTP sync" by prose. On
      this host that verification passes by not being run.
    exit_criteria:
      - |
          w32tm reports a real time source and a non-empty Last Successful Sync
          Time on this host.
      - |
          The start-of-day gate's clock step is executable rather than prose:
          it emits a falsifiable verdict line including the measured skew, and
          says so out loud when the service is unsynchronised.
    verifiable_closure: |
      A checker emitting one line matching
      `^(ok:clock-synced:[0-9]+s|warn:clock-unsynced:[0-9]+s|skip:[a-z-]+)$`,
      run from the start-of-day gate.
