packets:
  - packet_id: no-litmus-step-redirects-into-the-checkout-needs-cwd-awareness
    order: 799-h5ha
    status: ready
    kind: enhancement
    pickup_role: any
    priority: p3
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    depends_on: []
    deliverable: |
      A constraint that catches a litmus step redirecting into the CHECKOUT,
      without firing on the many steps that redirect to a relative path from
      inside a `cd "$(mktemp -d)"` subshell.
    capability_tags:
      - litmus
      - hygiene
      - meta-orchestration
    tags:
      - v0.5
      - audit-2026-08-17
    title: |
      797-295s's concrete stranding is fixed, but its greppable constraint is not achievable textually — a naive regex produced 97 hits and essentially zero true positives, because the safe uses differ from the unsafe ones only by a `cd` the regex cannot see.
    context: |
      797-295s asked for two things: fix the STEP 5 redirect (done — it now
      writes under `$(mktemp)`, commit in this cycle), and add "a greppable
      constraint that no litmus step redirects to a relative path".

      THE SECOND HALF WAS ATTEMPTED AND WITHDRAWN, with the attempt measured so
      the next person does not repeat it. A whole-tree scan of `command:` lines
      for `>`/`>>` followed by a relative-looking target reported 97
      violations. Inspected, essentially all were false:

        - prose and operators inside command strings: `=>`, `>=`, `-> plan`,
          `N> vram_mb`, `'> v0.4`, echoed text containing an angle bracket
        - genuine relative redirects that are SAFE because the step already ran
          `( cd "$t" && ... )` with `$t` from `mktemp -d` — e.g.
          litmus-release-gates-run-locally.yaml (`echo edited > f.txt`),
          litmus-version-bump-isolation-shape.yaml, and
          litmus-smoke-release-channel-shape.yaml (`printf 'other\n' > other.txt`)

      The safe and unsafe forms are TEXTUALLY IDENTICAL. They differ only by a
      `cd` earlier in the same command string, which is shell semantics, not
      grammar. A regex gate here would fire ~97 times on a clean tree, and a
      gate that cries wolf is worse than no gate — it trains everyone to skip
      the output, which is the exact failure mode 601-462g and 735-ewzp are
      about. So it was NOT shipped.

      The honest options, none free:
        a) BEHAVIOURAL, not textual: assert the worktree is clean after a
           litmus suite runs. This catches every stranding regardless of how it
           was written, needs no shell parsing, and the meta-orchestration
           boundary guard already implements the comparison. Probably the right
           answer.
        b) Parse the command with a real shell grammar and track cwd. Correct
           and disproportionate.
        c) Require every litmus step that redirects to first `cd` into a temp
           dir, and check for the `cd` — a convention plus a cheap grep.
    exit_criteria:
      - |
          A stranding introduced deliberately into any litmus step is caught,
          and a clean tree produces ZERO findings. Both halves demonstrated;
          the second is the one the withdrawn attempt failed.
      - |
          The check names which litmus step stranded which path, not just that
          something did.
    verifiable_closure: |
      A negative control (deliberately strand a file from a litmus step, see it
      caught) plus a positive control (clean tree, zero findings) recorded in
      the same run.
    notes: |
      Do NOT re-attempt the naive regex. The 97-hit measurement above is the
      evidence that it does not discriminate; re-deriving it costs a cycle and
      lands in the same place.
