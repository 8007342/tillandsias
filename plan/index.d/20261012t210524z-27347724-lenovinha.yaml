      summary: |
        Browser container data point from 1641-xbvq (lenovinha, 2026-10-12; evidence plan/evidence/1641-xbvq-browser-wayland-socket-2026-10-12/, PR #383).
        - ContainerSpec sets --security-opt=label=disable for EVERY container (constructor default, no setter).
        - Spike on the chromium-framework browser with the fixed argv (only the Wayland socket file mounted), SELinux enforcing:
          - Without label=disable, chromium could not read its profile dir.
          - Giving only the throwaway profile a private :Z label gets past that, but then chromium logs "Failed to connect to Wayland display: Permission denied (13)".
        - So a confined container_t cannot connect to the host compositor socket. That needs either a relabel of the live socket on the host or a root-installed policy module.
        - The browser is therefore a justified per-container exception for this row. The other containers are not shown to need label=disable by this spike.
