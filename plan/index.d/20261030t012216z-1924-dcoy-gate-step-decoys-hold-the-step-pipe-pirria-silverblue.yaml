  title: Gate-step fixtures leave a background sleep decoy holding the step's stdout pipe, so the runner waits ~248 s per gate for work that takes ~11 s
  context: 'The gate runs each step as bash STEP_SCRIPT > >(tee out) and then waits for tee. A background sleep the fixture started (or a child of one, such as the sleep under flock in the swap fixture) inherits that pipe and outlives the script, so tee sees EOF only when the sleep ends. Profiled: 1231-cbie 120 s wall / 1.6 s work, 1128-4ffr 68 / 8 s, 1376-8zdz 60 / 0.2 s, and the plan ledger check 40 / 0.8 s (untraced). Reproduced on pirria-silverblue 2026-10-30: test-forge-swap-service.sh piped to cat takes 60 s, 1 s unpiped.'
  exit_criteria:
  - Each named step's wall time is within about 2 s of its own work; the fixtures' assertions are unchanged.
  - The gate step runner refuses a step that leaves a background job holding its stdout pipe, naming the holder; today it waits silently.
  verifiable_closure: Piped wall time before and after for each fixture, and the runner's refusal on a planted fixture that backgrounds a sleep on its stdout.
