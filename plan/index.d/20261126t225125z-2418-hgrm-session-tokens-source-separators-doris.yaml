    context: |
      Measured on doris: test-session-tokens arm 3 expected source=<cfg>/projects/-scratch-slug/sess1.jsonl and
      got <cfg>_projects_-scratch-slug_sess1.jsonl. session_tokens.rs builds the path with PathBuf::join
      (backslashes on Windows), and cycle-metrics.sh --emit-tokens strips backslashes and quotes from source
      before writing JSON. So on Windows every --from-transcript record named a path that does not exist.
      The source is now spelled with / on Windows (cfg!(windows)); Unix is byte-identical.
