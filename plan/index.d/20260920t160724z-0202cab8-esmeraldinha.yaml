      summary: |
        THE RECONCILIATION FIXTURE'S BUDGET MEASURES THE HOST, NOT THE ASSERTION — AND THE FIRST PROPOSED FIX WOULD HAVE LEFT IT RED ON THE FLOOR TIER WHILE TURNING IT GREEN ON THE HOSTS THAT PROPOSED IT. Measured on esmeraldinha 2026-09-20, read-only apart from one reverted probe.

        === THE READINGS, BOTH HOSTS, AGAINST A 30 000 ms BUDGET ===

        litmus-litmus-bindings-reconciliation-shape.yaml:29 sets `timeout_ms: 30000`. Case 1 runs scripts/check-litmus-bindings.sh against the live tree, which SKIPS its advisory corpus sweep when neither openspec/litmus-bindings.yaml nor any litmus file differs from origin/linux-next, and RUNS the sweep when one does.

          PATH A — sweep SKIPPED
              esmeraldinha   83s  (cold)
              esmeraldinha   95s  (warm)
              esmeraldinha   93s  (warm)
              macneo        3.2s
          PATH B — sweep RUNS
              esmeraldinha  693s  (11 min 33 s)
              macneo       36.6s

          Ratios: ~26x on A, ~19x on B — the ordinary drvfs/N100 floor-tier ratio, so
          this is the tier behaving normally rather than an anomaly. macneo's two
          numbers are theirs and are NOT re-measured here; they are consistent with
          mine at that ratio, which is why I report them beside rather than against.

          All five readings carry the same verdict line, so nothing about correctness
          varies — only the clock:
              ok:litmus-bindings:files=431 bound=415 retired=6 grandfathered=10

        NOT A CACHE ARTEFACT, and this is why there are three readings on path A rather than one. The 83s was COLD and taken on a tree I had just mutated and reverted, which is exactly the shape that deserves a second look. The two WARM runs came back SLOWER (95s, 93s). So ~90s ± 6 is the honest figure and cache state does not explain it.

        === WHAT THAT DOES TO THE TWO PROPOSED FIXES ===

        macneo's diagnosis — the budget SITS BETWEEN the two paths, so the fixture is killed on exactly the changes it exists to check, with 5/5 assertions passing and only the clock failing (a budget kill counts as FAIL, 820-c8q8) — is correct ON THEIR HOST. 3.2s and 36.6s straddle 30s.

        ON THE FLOOR TIER THE BUDGET IS BELOW BOTH PATHS. ~90s and 693s are both over 30s.

        So the first agreed fix, "run case 1 with the sweep excluded", DOES NOT WORK HERE: it brings case 1 from 693s to ~90s, still ~3x over budget. It would have made the fixture green on macneo's host and on pirria's, and left it red on esmeraldinha for a different reason, with the row reading as closed from the Linux side. THAT IS THE SAME SHAPE AS THE DEFECT THIS ROW IS ABOUT — a verdict that depends on which host ran it — reintroduced by the repair.

        Raising the budget was ruled out separately and fleet-wide; it would also not have survived this tier for long.

        === THE RULING, AND THE REASON IT TURNS ON ===

        Case 1 will assert the reconciliation RULE against a THROWAWAY CORPUS through the 1252-znbn overrides (TILLANDSIAS_LITMUS_BINDINGS / TILLANDSIAS_LITMUS_TESTS_DIR): bounded, and the same cost on every host. The budget stays at 30s. The live corpus sweep remains the GATE's business, which is where it belongs — it is a gate optimisation, not this fixture's subject.

        THE GENERAL RULE, which is the part worth carrying past this fixture: A FIXED MILLISECOND BUDGET ON AN ASSERTION WHOSE COST VARIES 26x ACROSS THE FLEET IS MEASURING THE HOST, NOT THE ASSERTION. A budget is only a test of the thing under test when the thing under test has a host-independent cost; otherwise the slowest host fails an assertion it passed. Note the corollary that made this hard to see: macneo's sharper formulation — a budget that sits BETWEEN two code paths asserts WHICH PATH RAN — is true and is a special case of it, visible only where the budget happens to fall between. Where the budget is below both paths there is no such signal at all; the fixture simply fails everywhere on that tier and looks like a broken fixture rather than a mis-scoped budget.

        This is also the same move 1252-znbn already made for adjudication testing, and for the same stated reason: a guard that cannot be tested without touching the tree it guards does not get tested. Here it is a guard that cannot be BUDGETED against a tree whose size it does not control.

        === SEQUENCING ===

        The fixture fix lands in macneo's slice, because they hold the file; this row's event is cited from it. When their SHA is on trunk, esmeraldinha runs the fixture once as THE SECOND REGIME and reports the line — a fix for a host-dependent verdict that is verified on one host only would be the original defect again. The guard work on this row (the 2a cross-check) builds on that green rather than beside a red fixture: a new guard next to a silently red old one is the same hole with two names.

        === METHOD ===

        Path B required one litmus file to differ from origin/linux-next; the probe appended a single trailing comment to one file and restored it immediately, with `git status openspec/litmus-tests/` verified empty afterwards. Everything else is read-only. Scripts staged as files, because an inline wsl.exe string loses its variables on this host.
