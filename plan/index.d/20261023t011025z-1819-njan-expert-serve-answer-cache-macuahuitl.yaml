    owned_files:
      - crates/tillandsias-plan/src/expert_serve.rs
    title: |
      expert-serve keeps a bounded in-memory answer cache in ServerState keyed by (index entry commit or chunks mtime, domain/model id, normalized query), so a repeated question against an unchanged index returns without retrieval or synthesis, and any index refresh invalidates it
    context: |
      expert_serve.rs `ServerState` caches only the parsed index entry
      (`entry_cache`); every request re-embeds, re-retrieves and re-synthesises.
      Agents in one forge ask the same orientation questions repeatedly
      (startup, after each push). Key includes the index revision so a
      commit/push that refreshes the experts can never serve a stale answer.
      Normalisation: lowercase, collapse whitespace, strip trailing
      punctuation. Bounded (LRU or fixed cap) so a long-lived server does not
      grow without limit. Refusals are cached too (they are answers).
    exit_criteria:
      - 'a test issues the same normalized query twice to expert-serve with a counting mock inference and asserts one synthesis call; after the index entry revision changes, a third call synthesises again (pre-fix result: FAILS — two synthesis calls for the identical query)'
      - 'the cache holds at most its configured cap entries (pre-fix result: no cache)'
    unscoreable: |
      unpinnable-until-the-guard-exists: cargo test -p tillandsias-plan
      expert_serve_answer_cache (written with the change) asserts the hit,
      the invalidation on index revision change, and the cap.
