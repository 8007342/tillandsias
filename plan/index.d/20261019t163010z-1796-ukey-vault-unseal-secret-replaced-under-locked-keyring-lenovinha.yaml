    depends_on: []
    title: |
      After install.sh (whose --reset-state runs podman system reset and so deletes every podman secret), a launch with the OS keyring locked recreates tillandsias-vault-unseal from a machine-id-derived key instead of refusing. vault-data was already initialized, so the vault rejects that key and stays sealed. Every forge launch then fails with OPERATOR ACTION REQUIRED, and the healer cannot recover ("the only recoverable share is byte-identical to the secret vault just rejected").
    context: |
      MEASURED on lenovinha 2026-10-19, metadata only (no secret bytes read):
      - The keyring was locked at install time: git push over https failed with "could not read Username" minutes before.
      - v56.10.18.1 was installed with install.sh at about 03:09 PDT, followed by a --bash lane launch.
      - podman secret tillandsias-vault-unseal: created=2026-10-19 03:09:56 PDT.
      - ~/.cache/tillandsias/vault-data: born 2026-09-25 19:26:02 PDT (the init time). The fallback file fallback_vault-shamir-share-v1 is absent.
      - After reboot with the keyring UNLOCKED, a launch still fails: "cipher: message authentication failed"; "heal: using Shamir share from guest podman secret"; "the only recoverable share is byte-identical to the secret vault just rejected".
      CODE (crates/tillandsias-headless/src/vault_bootstrap.rs at v56.10.18.1):
      - scripts/install.sh:359 runs --reset-state, which is main.rs run_reset_state; it runs podman system reset --force and deletes all secrets. The keychain and vault-data are kept.
      - vault_bootstrap.rs:1046-1058: when unseal_secret_exists() is false, ensure_unseal_key() runs and then create_unseal_secret (podman secret create --replace, :4098). unseal_secret_exists also returns false on a podman error (unwrap_or(false), :4148).
      - ensure_unseal_key: if the keychain read fails and the fallback file is absent, it does not refuse. It derives a key from machine-id plus an installation anchor, which is a new Uuid::new_v4 when no anchor exists (:3974-4050). Nothing checks whether vault-data is initialized.
      - The healer's first candidate is the podman secret itself (:5450-5468), and the keychain was unreachable, so its candidate equals the rejected bytes (:4999-5000).
      NOT NEW: the same gate, the same derived-key branch and the same install.sh --reset-state are in v56.10.17.1 (stable). The 17.1 to 18.1 diff of vault_bootstrap.rs does not touch this path.
      SURVIVAL: the share in the keychain entry vault-shamir-share-v1 should be intact. This path only reads the keychain. It is written only by fresh-init handover capture and persist_healed_root_token, and deleted only by the uncalled clear_host_vault_credentials. There is no backup or rotation file for the share, and podman keeps no secret history. Recovery is the operator's call.
    exit_criteria:
      - "A launch with an unreachable keyring (locked, unavailable or timed out) and an initialized vault-data never creates or replaces tillandsias-vault-unseal, and refuses with a message that names 'keyring locked' and says what clears it (unlock the keyring, then relaunch)."
      - "Its fixture is red on today's code (v56.10.18.1: the derived-key branch writes the secret) and green after the fix, and it EXECUTES the remedy: once the keyring seam returns the share, the launch proceeds."
      - "A podman error in unseal_secret_exists is not read as 'absent' (no --replace on a probe failure)."
    unscoreable: ""
    next_action: >
      Add a pure decision seam fed by the keyring result and a vault-data-initialized flag, which ensure_unseal_key and the :1046 gate consult before create_unseal_secret. Test it in vault_bootstrap.rs mod tests (pattern: unseal_recovery_write_decision_never_writes_a_proven_failing_key, :9083). Prove it red on 18.1 first.
