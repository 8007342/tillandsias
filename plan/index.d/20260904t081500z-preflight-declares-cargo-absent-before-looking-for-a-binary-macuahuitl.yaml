packets:
  - packet_id: preflight-declares-cargo-absent-before-looking-for-a-binary
    order: 1004-ws5q
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [preflight, low-end, fail-loud, instrument]
    estimated_hours: 3
    owned_files:
      - scripts/cycle-preflight.sh
      - scripts/test-cycle-preflight-cargo-resolution.sh
      - skills/meta-orchestration/SKILL.md
      - skills/advance-work-from-plan/SKILL.md
    title: |
      cycle-preflight.sh declares cargo absent before it ever looks for a runnable plan
      binary, and the only way through for a compile-free cycle is an env seam no skill names.
    context: |
      THE ORDER OF CHECKS IS BACKWARDS FOR A HOST THAT NEEDS NO COMPILER.
      scripts/cycle-preflight.sh:116 prints `blocked:preflight:plan:cargo-absent`
      and exits 1 BEFORE resolve_plan_binary (scripts/cycle-preflight.sh:144,
      via scripts/plan-binary-probe.sh) ever looks for a runnable
      ./target/release/tillandsias-plan or ~/.local/bin/tillandsias-plan. The
      verdict is terminal by design (876-irn7: "the tool it would reason WITH is
      the stale thing"), so a host that cannot compile is refused its whole
      cycle even when a healthy instrument is already sitting on disk. The one
      way past it is CYCLE_PREFLIGHT_SKIP_BUILD=1 (scripts/cycle-preflight.sh:80),
      which sets plan_verdict=skipped and jumps the entire block — and that
      variable is named nowhere in skills/meta-orchestration/SKILL.md or
      skills/advance-work-from-plan/SKILL.md (grep on 2026-09-04: no match in
      either skill, nor under methodology/).

      MEASURED on pirria-cachyos 2026-09-04, and this is a TRUE POSITIVE, not
      the 876-irn7 PATH case: cargo, rustc and rustup are absent, ~/.cargo and
      ~/.rustup are absent, and pacman has no rust or rustup package. The
      toolchain vanished between 2026-09-03T00:26Z (four green gates) and
      2026-09-04. The work assigned to pirria — a published-release
      curl-install smoke of v56.9.2.1 — compiles nothing, and the hard stop
      would have cost a 4h floor-tier slot (pirria fires `40 2-22/4 * * *`).
      The coordinator authorised the seam by hand; the resulting cycle ran as
      `ok:cycle-preflight:skipped+services-down2+ca-absent:...` and the smoke
      went green through Step 3. A fix that worked only because a human
      remembered an undocumented variable is the "protects whoever remembers"
      shape this fleet already declined once (1000-rqmx).

      WHAT THIS IS NOT. It is not a request to weaken the genuinely-absent
      verdict: a host with no cargo AND no runnable binary has no instrument
      and must still stop. It is a request to (a) probe for a runnable binary
      before declaring the compiler's absence terminal, (b) make the verdict
      say which it found, and (c) name the compile-free path in the skills as a
      documented verdict segment rather than a seam. The 876-irn7 fix
      (CARGO_HOME/bin then ~/.cargo/bin before absence) stays as it is; this
      packet sits one step after it.

      Provenance: found and measured by pirria-cachyos 2026-09-04 during the
      v56.9.2.1 floor smoke; relayed to and filed by the coordinator
      (macuahuitl-fedora).
    next_action: |
      Read scripts/cycle-preflight.sh:79-150 and the existing arms in
      scripts/test-cycle-preflight-cargo-resolution.sh first (they farm a stub
      cargo, scrub PATH, and never set CYCLE_PREFLIGHT_SKIP_BUILD). Then: move
      or duplicate the resolve_plan_binary probe ahead of the cargo-absent
      exit so a no-cargo host with a runnable binary gets plan_verdict=existing
      (rebuilt / existing / skipped / none), keep `cargo-absent` terminal only
      when the probe also fails, and add arms for all three regimes. Finally
      document the skipped-build segment and when a host may use it in both
      skills (floor-tier, compile-free work only; not a way to dodge a red
      build on a host that can compile).
    exit_criteria:
      - |
        a runnable plan binary is probed (resolve_plan_binary) before
        blocked:preflight:plan:cargo-absent is declared
      - |
        the preflight verdict names which instrument it used, one of rebuilt, existing, skipped,
        or none
      - a host with no cargo and no runnable binary still exits 1 with blocked:preflight:plan:cargo-absent
      - |
        the skipped-build segment is documented in skills/meta-orchestration and
        skills/advance-work-from-plan with its precondition; grep CYCLE_PREFLIGHT_SKIP_BUILD
        matches in both
      - |
        scripts/test-cycle-preflight-cargo-resolution.sh carries arms for no-cargo-with-binary
        (passes), no-cargo-no-binary (blocks), and cargo-present (rebuilt), and exits 0
    verifiable_closure: |
      scripts/test-cycle-preflight-cargo-resolution.sh exits 0 with the three new arms
      (no-cargo-with-binary, no-cargo-no-binary, cargo-present) present and named in its
      output. The script exists today (876-irn7's pin) and is where the new arm goes; it is
      not bound as a litmus in openspec/litmus-bindings.yaml as of filing, so closure is the
      script's exit status, run directly.
