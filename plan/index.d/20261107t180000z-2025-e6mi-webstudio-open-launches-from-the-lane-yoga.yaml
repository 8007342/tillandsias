    context: |
      Operator direction 2026-11-07: asking a forge agent "load this project in an authoring tool" or "open in a studio for editing" must have the tray launch the studio and open it in the dev Chromium framework browser, so the user and the agent co-edit with live preview. Today studio::call answers webstudio.open with an error naming the operator command `tillandsias --studio <id> --cloud <owner>/<project>`, and forge-agent-guidance.md says it "starts nothing from the lane"; the agent relays the command and the operator's run of it failed. 1860-auhm landed run_studio_mode (registry, launcher, write guard, co-edit tools) reachable only from the CLI; the webstudio.open refusal points at 1859-57mi, whose criterion covers only the choice prompt, so no row owned the lane launch. Generic for any project's forge. Rulings that apply: web-studio-lanes spec (dev Chromium window, Wayland-only, opens only after an authenticated 2xx; saves committed; publish alone needs user consent), forge-diagnostics-scope (the launch is a host-started container of the lane and its log is readable from that lane).
    exit_criteria:
