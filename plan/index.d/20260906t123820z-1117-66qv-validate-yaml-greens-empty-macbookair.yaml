    title: |
      tillandsias-plan validate-yaml answers ok:yaml-loads for a ZERO-BYTE fragment, so a heredoc that failed to write reads as validated evidence — and the closure order flips status before committing evidence, which is exactly the window this lands in
    context: |
      MEASURED on tlatoanis-macbook-air 2026-09-06, by hitting it accidentally.

      A shell heredoc writing a ledger fragment failed to parse under zsh. The
      redirection had already created the file, so it existed at ZERO BYTES. The
      validator was then run on it, as the cycle protocol requires, and answered:

        ok:yaml-loads:plan/index.d/20260906t123644z-829-dkuc-governance-detector-macbookair.yaml

      An empty file IS valid YAML - it parses to null - so the validator is not
      wrong about what it checked. It is wrong about what a reader takes it to mean.
      The verdict token says `yaml-loads`, and that is literally true; what the cycle
      uses it for is "this evidence fragment is well-formed", and a zero-byte file is
      not evidence.

      WHY THIS IS WORSE THAN AN ORDINARY FALSE GREEN. The sanctioned closure order
      flips status BEFORE committing evidence. So the window this defect lives in is
      exactly the window where the claim has already been released and the evidence
      has not yet landed. In this instance the sequence was:

        1. set-field ... status ready          -> succeeded, claim released
        2. cat > fragment <<YAML               -> zsh parse error, file left empty
        3. validate-yaml fragment              -> ok:yaml-loads
        4. (would have been) git commit        -> a released packet, no evidence,
                                                  and a green validator line in the
                                                  transcript saying it was fine

      It was caught by reading the file back with wc -l, not by the validator, and
      not by the parse error either - step 2's error scrolled past above two
      successful commands and read as noise.

      REPRODUCED DELIBERATELY AFTERWARDS, not left as an anecdote about my
      own accident. Both arms of the closure below are measured, on this host,
      against ./target/release/tillandsias-plan:

        $ : > /tmp/empty.yaml
        $ tillandsias-plan validate-yaml /tmp/empty.yaml
        ok:yaml-loads:/tmp/empty.yaml            EXIT=0

        $ printf 'foo: bar\n' > /tmp/nofrag.yaml
        $ tillandsias-plan validate-yaml /tmp/nofrag.yaml
        ok:yaml-loads:/tmp/nofrag.yaml           EXIT=0

      So the second arm is not a speculative generalisation of the first: a
      file that parses and declares neither packets: nor events: greens too.

      RELATED SHAPE, same family: 1106-k2df (a value true about the artefact and
      false about the property it names) and 1024-c3h3 (evidence that cites something
      which is not there). This is the third instance this week of a verdict that is
      honest about what it computed and silent about what it was asked.
