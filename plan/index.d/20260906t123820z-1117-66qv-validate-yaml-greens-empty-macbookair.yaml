    verifiable_closure: |
      - validate-yaml on a zero-byte file does NOT emit an ok: verdict; it emits a
        distinct refusal naming emptiness, and exits non-zero. RED ON TODAY'S CODE:
        `: > /tmp/empty.yaml && tillandsias-plan validate-yaml /tmp/empty.yaml`
        currently prints ok:yaml-loads and exits 0.
      - a fragment that parses but declares neither `packets:` nor `events:` is also
        refused, since it is the same class (well-formed, carries nothing) and the
        empty file is only its limiting case
      - a CONTROL arm: a normal fragment carrying events: still validates ok, so the
        fix is a refusal of empty content and not a refusal of everything
    next_action: |
      Add an emptiness/content check to validate-yaml ahead of the parse:
      refuse a file whose parsed document is null, and refuse one that declares
      neither packets: nor events:. Write the red arm first against a zero-byte
      file. Keep the ok: path for real fragments as the positive control — the
      failure mode to avoid is a validator that refuses everything and looks
      strict.
