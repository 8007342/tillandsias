      summary: >
        SCOPE SHARPENED by operator directive 2026-08-13 ("we need a way to sign during development here, and a way to sign in github actions"). This packet now owns the SEAM plus the DEV lane; the CI lane is 724-rpna. They are separated because they fail differently, but they share one seam by construction — otherwise what CI signs stops being what a developer can reproduce.  DEV LANE, concretely: DefaultAzureCredential picks up AzureCliCredential, so a developer who has run `az login` signs with no extra configuration. Two properties this packet must hold:    * DEFAULT OFF locally. The plan is 5,000 signatures/month, and a loop that signs every local build burns quota for artifacts nobody ships. Signing is opt-in for a dev build and mandatory for a release build.   * An unsigned dev build must SAY it is unsigned. This repo's recurring failure is the artifact that looks like a release and is not; a quiet unsigned build is that shape.  ADDED EXIT CRITERION, from the integration doc rather than from taste: TIMESTAMPING IS MANDATORY AND MUST BE ASSERTED. Artifact Signing certificates carry a THREE-DAY validity, so `/tr http://timestamp.acs.microsoft.com /td SHA256` is what keeps a signature valid past the week it was made. An untimestamped artifact passes every check at release time and goes untrusted for every user a few days later — green at the gate, broken in the field, and unfalsifiable from the release run itself. 722-f86z's verification check must therefore assert the timestamp countersignature, not merely the signature.
