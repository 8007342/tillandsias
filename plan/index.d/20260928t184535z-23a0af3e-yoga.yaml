status:
  - packet_id: the-github-token-in-vault-rotates-itself-before-its-8-hour-expiry-through-a-resident-due-check-so-no-host-needs-an-operator-reseed
    field: notes
    value: |-
      size: M
      implementer_tier: sonnet
      p0: every host's push lane goes dark every 8 hours until the operator
      re-seeds by hand.


      [2026-09-28T17:23:19Z yoga-silverblue] yoga-silverblue 2026-09-28 - COVERAGE, stated so nobody expects rotation on an idle host. The scheduler runs in the Linux tray, the guest's resident service, and every lane process (ensure_enclave_for_project). A Linux host with NOTHING open (no tray, no lane) rotates nothing, so its access token lapses after 8 h - and recovers on first use: an already-expired token is due (github_token_rotation_due: expires_at.saturating_sub(now) = 0 <= the 30-minute window), so the first due-check when a lane opens rotates it through the locked exchange. That holds for as long as the refresh token lives (~6 months, refresh_token_expires_at), which the 14-day warning covers. Work ref b40acf7e4 (land84).

      [2026-09-28T18:45:35Z yoga] Named regime, --with-token seed (yoga, 2026-09-28, land84 25f800ec7 installed): Vault secret/github/token holds only `token` (no expires_at) and secret/github/refresh is absent. On such a host the rotation scheduler is a no-op by design, and the credential expires on whatever schedule the pasted token has. Do not expect rotation there. The live 8 h arm moves to macuahuitl (device-flow seeded), running organically once a land84+ build is installed (coordinator, 2026-09-28).
    ts: "2026-09-28T18:45:35Z"
    host: yoga

