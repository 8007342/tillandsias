    title: "The Ctrl-C forwarding test gives its fake toolchain default signal dispositions and fails within 30 s instead of hanging the land-queue gate"
    context: |
      Root cause: the land-queue runs its gate in the background, so the test
      binary inherits SIGINT as SIG_IGN; the fake host's `sh -c "trap ... INT"`
      inherits it too, and POSIX forbids a non-interactive shell from trapping
      a signal that was ignored on entry. The trap silently never fires, the
      forwarded INT is discarded, and read_to_string waits forever. Not a race:
      deterministic under an ignored SIGINT (200/200 hung), green otherwise.
      Fix: fake_host's spawn closure resets INT/TERM/HUP to SIG_DFL in
      pre_exec; the test arms a 30 s watchdog that SIGKILLs the shim and
      panics with a clear message.
    exit_criteria:
      - "Run with SIGINT ignored (`trap '' INT`), shim_forwards_ctrl_c_to_the_toolchain passes 200/200 under a 4-core busy loop. Pre-fix result: FAILS, 200/200 hang."
    verifiable_closure: "(trap '' INT; cargo test ... shim_forwards_ctrl_c_to_the_toolchain) passes in under 1 s. Pre-fix result: FAILS, it never returns."
