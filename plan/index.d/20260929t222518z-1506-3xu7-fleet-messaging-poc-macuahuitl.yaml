    title: |
      tillandsias --msg-serve (the resident, started by the Linux tray beside the control socket) watches every lane's outbox, refuses an envelope whose from.lane differs from the directory it sits in (refused:msg:from-lane-mismatch to dead/), runs the secret check a second time, hard-links into the destination lane's inbox/new, writes delivered:<ts>:via:local receipts, pokes $XDG_RUNTIME_DIR/tillandsias/msg.sock for recv --wait, fans <host>/* out to every lane, and every forge gets its own lane directory bind-mounted at /run/host/tillandsias-msg with TILLANDSIAS_MSG_LANE exported
    context: |
      Decision 3. The model is the mcp-tool-socket spec:
      start_mcp_socket_server_for_lane(project_name, instance) and the
      read-only mount at /run/host/tillandsias-mcp — attribution by what a
      lane holds, never by what it claims. The lane label is the same
      <project>-<instance> (instance defaults to default). The lane
      directory lives on the HOST filesystem so a forge rebuild keeps its
      mailbox. A lane can write its outbox directory directly, bypassing
      the CLI, which is why the mover repeats secret_shaped: the fixture
      proves it with a body only the mover could catch. Bare-metal
      sessions share lane host (one uid, one domain; open question 2).
