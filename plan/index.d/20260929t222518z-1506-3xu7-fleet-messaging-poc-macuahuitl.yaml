      - 'scripts/test-fleet-msg-lan.sh exits 0: a message between two loopback daemons ends delivered:<ts>:via:lan then, after msg ack on the receiving lane, acked:; a captured envelope replayed over a fresh session is answered stored and changes no inbox; an mDNS-shaped hint with a foreign fp is ignored and mdns_ignored increments; an envelope with from.host not matching the authenticated peer is refused:msg:from-host-mismatch; a --ttl 2 message to a dead port is in dead/ within 5 s with status expired:; a seq gap is delivered with gap: (pre-fix: no listener)'
      - 'one live two-host run is recorded in the milestone 1506-3xu7 events as acked:<id> via:lan with both fingerprints'
