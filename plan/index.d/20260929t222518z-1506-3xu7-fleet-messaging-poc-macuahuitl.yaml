    title: |
      --msg-serve listens on TCP TILLANDSIAS_MSG_PORT (default 48640), resolves a peer from plan/fleet/peers lan_hints then mDNS _tillandsias-msg._tcp hints (fp must match the directory, otherwise ignored and counted) then mesh_ip, forwards each outbox envelope inside a Noise XX session and keeps it queued until the receiver answers stored, retries 1 s doubling to 60 s until ttl_s then dead/ and expired:, refuses from.host not equal to the authenticated peer, absorbs a seen (from, id) while answering stored, drops seq more than 1000 behind, and carries the acked receipt back so the sender's status reads acked:
    context: |
      Decision 5. Two receipt levels named apart on purpose: delivered
      (the daemon stored it) and acked (an agent read it and said so) —
      the receipt the fleet never had. Ordering is per (from, to) by seq
      with gaps delivered and flagged; nothing across senders. Framing is
      the control-wire [u32][postcard] inside the tunnel with
      MAX_MESSAGE_BYTES enforced both ways. The hermetic fixture runs two
      daemons on ONE host with two state roots and two ports against a
      temp peers directory; the live arm is the milestone's acceptance
      demo (yoga/host to macuahuitl/<codex lane>) and is recorded, not
      gated. mDNS is on by default pending open question 3; a
      TILLANDSIAS_MSG_MDNS=off switch exists from day one.
