    title: |
      tillandsias --msg-serve --mint [--rotate] generates one X25519 static key into secret/fleet/msg/static of the host's OWN Vault (no forge policy reads it) and writes plan/fleet/peers/<host>.yaml (host, noise_pub, fp, minted, optional lan_hints, mesh_ip); EncryptedStream gains a Noise_XX_25519_ChaChaPoly_BLAKE2s constructor with static keys and no version-bound PSK; after the handshake the remote static is looked up in the directory and an unknown key is refused:msg:unknown-peer:<fp> before any envelope is read; the first in-tunnel frame carries proto and an unknown major is refused naming it
    context: |
      Decision 4. Every host's Vault is its own — there is no fleet CA —
      so the trust root is the tree: whoever can land on linux-next
      already defines the fleet. The existing NNpsk0 pattern binds the
      key to the build version (channel_psk), which is right for the
      control channel and wrong for a coordination channel that must
      survive a rollout; the new constructor sits beside it on the same
      EncryptedStream type. Fingerprint is BLAKE2s-128 of the public key,
      shown in every refusal so the remedy (merge the peer file) is
      obvious. mDNS never adds a peer. The forge Vault policy grants
      nothing under secret/data/fleet/msg/.
