  - packet_id: tillandsias-plan-msg-send-recv-ack-list-status-over-a-maildir-style-lane-store-with-idempotent-ids-per-sender-sequence-explicit-ack-shape-budget-and-secret-shaped-body-refusal
    order: 1506-nvqt
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.6
    release_target: fleet-messaging-poc-a-harness-agnostic-acknowledged-message-bus-between-harnesses-on-the-same-host-and-the-same-lan-proved-before-the-cloudflare-rung
    pickup_role: any
    capability_tags: [fleet-messaging, plan-binary, cli, security]
    estimated_hours: 8
    owned_files:
      - crates/tillandsias-plan/src/msg_store.rs
      - crates/tillandsias-plan/src/msg_shape.rs
      - crates/tillandsias-plan/src/main.rs
      - scripts/test-fleet-msg-store.sh
    title: |
      tillandsias-plan msg whoami|send|recv|ack|list|status|lint|gc over a Maildir-shaped lane store ($XDG_STATE_HOME/tillandsias/msg/lanes/<lane>/{outbox,inbox,acked,dead,receipts}; tmp then rename), with ids m-<utc>-<8hex>, a persisted per-sender seq, recv that presents until ack, status read from receipt files, the 600-byte/8-line KIND-first shape budget and a secret-shaped body refusal, body from stdin or --body-file never argv
    context: |
      Decisions 1 and 2 of openspec/changes/fleet-messaging-poc/design.md.
      The verb lives in tillandsias-plan because that binary is already on
      every host and in every forge, wrapped by forge-plan.sh, and
      advertised by capabilities so a wrapper can refuse honestly on an
      old build. msg_shape is pure (no I/O): the budget from
      distributed-work.yaml sibling_heads_up_protocol.size_budget (KIND in
      HEADS-UP, ACK, LANDED, BLOCKED, ASK, FYI; every further line "- " plus
      a ref of 7+ hex, an order token, work/<order> or a path) and
      secret_shaped over ghp_/gho_/github_pat_, hvs./hvb., AKIA, sk-,
      "-----BEGIN ... PRIVATE KEY", "Bearer ", three-part eyJ tokens and
      any base64/hex run of 40+ chars. Refusals print
      refused:msg:shape:<reason> or refused:msg:secret-shaped:<pattern>
      and write nothing; the whole envelope is capped at 4096 bytes. The
      CLI opens no network socket; delivery is 1506-q7ab and 1506-7tq4.
      Addresses are <host>/<lane>; whoami reads TILLANDSIAS_MSG_LANE and
      refuses refused:msg:no-lane rather than composing one
      (agent-identity's rule). msg lint exposes the shape check alone so
      1437-arjg can wrap it.
    exit_criteria:
