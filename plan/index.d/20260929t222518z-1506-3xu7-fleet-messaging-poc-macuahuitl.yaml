    title: |
      MILESTONE — fleet messaging PoC: a harness-agnostic, acknowledged message bus (tillandsias-plan msg send|recv|ack, forge-plan MCP msg_* tools) delivers between lanes on one host and between hosts on one LAN with Noise XX pinned to plan/fleet/peers, at-least-once with delivered and acked receipts; the Cloudflare rung is researched as a rootless WARP sidecar beside the router, not gated; today Codex cannot receive a message and no channel has a receipt
    context: |
      OPERATOR (2026-09-29): "install Cloudflare's software on the
      containers, inside the router likely, and will always default to the
      FREE version only"; "distinguish LOCAL NETWORK when available and
      handle our own tunnels when possible ... we need to be careful with
      SECURITY"; "start with the PROOF OF CONCEPT ... just for MESSAGE
      PASSING BETWEEN HARNESSES in the same host, and in the same network.
      This is the missing coordination layer our fleet needs."
      PAIN ON THE LEDGER: plan/inbox/codex.md (fab17ec02) is a git-pushed
      file with a hand-appended ACK: convention; plan_only_peers coordinate
      only through the ledger, which is read AFTER work; SendMessage exists
      only for Claude sessions and has no receipt; peers have confirmed
      claims that never reached origin; plan/index.yaml is 31,678 lines.
      RESEARCH (public docs, 2026-09-29; sources in the design note): the
      Mesh docs say proxy-only and DNS-only modes are unsupported and Mesh
      requires Traffic and DNS mode, so 1505-m63i is answered without
      running; Cloudflare documents no container support for the client;
      community practice runs warp-svc with NET_ADMIN and /dev/net/tun and
      reports a firewall failure shape; Mesh is on the Free plan; limits 50
      nodes and 50 service tokens. Every host's Vault is its own — there is
      no fleet CA — so cross-host trust comes from the tree (a peer is a
      host whose public key file is on the checkout).
      DESIGN PRINCIPLES (binding on every child): the CLI is a verb of
      tillandsias-plan (already on every host and in every forge, already
      wrapped as MCP); the daemon is tillandsias --msg-serve in headless;
      attribution is by mount on one host and by the authenticated static
      key across hosts, never by what an envelope claims; bodies obey the
      600-byte/8-line budget and a secret-shaped body is refused at send
      AND at the mover; keys are not version-bound; mDNS is a hint, never a
      peer; no host OS ever runs a Cloudflare daemon; the ledger stays the
      record. PoC RUNGS: same host and same LAN on Linux hosts. ACCEPTANCE
      DEMO: the Codex forge on macuahuitl receives and ACKs a HEADS-UP sent
      by the Claude bare-metal session on yoga; yoga's msg status reads
      acked; the ack event lands on the row the message named.
