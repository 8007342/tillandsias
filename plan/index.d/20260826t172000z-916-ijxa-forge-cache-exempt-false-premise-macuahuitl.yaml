  - packet_id: forge-build-cache-exemption-rests-on-a-premise-that-is-false
    order: 916-ijxa
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      the build-cache sweep exempts forges because "ephemeral forges discard target/ with the container" — forges redirect CARGO_TARGET_DIR onto a PERSISTENT volume, so the one host that never sweeps is the one whose cache actually grows forever
    deliverable: |
      the forge exemption is removed, re-scoped to what is genuinely ephemeral,
      or kept with a true stated reason — and the persistent cargo cache gets
      some sweep path
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - forge
      - build-cache
      - fail-loud
      - tooling
    estimated_hours: 3
    context: |
      MEASURED on macuahuitl 2026-08-26, verified in code rather than inferred.

      `scripts/check-build-cache-sweep.sh` carries:

        # Ephemeral forges discard target/ with the container, so a sweep there
        # buys nothing and costs a full rebuild inside a short-lived cycle.
        if [ "${TILLANDSIAS_HOST_KIND:-}" = "forge" ]; then
            echo "skip:forge-exempt"; exit 0
        fi

      The same exemption is restated in `methodology.yaml` (~line 442).

      THE PREMISE IS FALSE. `images/default/lib-common.sh:1520`:

        export CARGO_TARGET_DIR="$PROJECT_CACHE/cargo/target"

      and its own header comment at :964 says so outright — "CARGO_HOME and
      CARGO_TARGET_DIR live on the persistent project cache". The forge
      container is `--rm`; its BUILD ARTIFACTS are not. They are redirected onto
      a named podman volume that survives the container by design.

      The project's own ephemerality litmus already documents this as
      "THE ONE SANCTIONED CARVE-OUT — `cargo build` writes into
      $CARGO_TARGET_DIR, which DOES live on the persistent cache volume."
      So the carve-out is known and deliberate; what is wrong is that the sweep
      gate was written as though it did not exist.

      THE CONSEQUENCE IS THE EXACT INVERSION OF THE INTENT. The exemption exists
      to avoid paying a rebuild on a host that throws its cache away. The host
      it actually exempts is the one whose cache is the LONGEST-LIVED and least
      observed: no operator opens a forge to run maintenance, nothing else GCs
      that volume, and the sweep that would have is the thing being skipped.
      Every other host in the fleet gets a 40 GiB / 14-day trigger; the forge
      cache volume has neither.

      WHY THIS CLASS AGAIN. `skip:forge-exempt` is a PASS. Nothing in the verdict
      says "not measured" — a caller sees a green line and moves on, and the
      stated reason is one nobody re-checked against the code that contradicts
      it two files away. An exemption whose justification has quietly stopped
      being true is indistinguishable from one that was never true.

      FOUND while answering an operator question about moving builds into
      throwaway toolboxes. The general lesson is the same one that question
      keeps producing: "it runs in a container" is not "its state is
      disposable", and in this codebase the two have been conflated in prose
      three separate times — the forge exemption here, the toolbox `$HOME`
      bind-mount measured on yoga (same device:inode for target/ inside and
      out), and the sweep's own framing.
    outcome: |
      Either the forge cache is swept, or the reason it is not is a true one.
    exit_criteria:
      - 'The false premise is gone from BOTH `scripts/check-build-cache-sweep.sh` and `methodology.yaml`. If the exemption stays, its stated reason must match what the code does — the artifacts persist on a named volume — rather than claiming they are discarded.'
      - 'DECIDE and record whether the persistent forge cargo volume gets a sweep path at all, and if so what triggers it. Note that the size trigger reads `target/` in the checkout, which is NOT where the forge writes, so the existing size check would measure the wrong directory even if the exemption were lifted. Say which directory is measured.'
      - 'NEGATIVE CONTROL: a genuinely ephemeral surface — one whose artifacts really do vanish with the container — must still be exempt, and the fixture must show one. Removing the exemption wholesale would make every forge cycle pay a rebuild, which is the cost the exemption was written to avoid and is a real cost even though its stated reason is wrong.'
      - 'The verdict for a skipped host must not read as a measurement. `skip:forge-exempt` should say what was NOT measured, in the grammar the other verdicts already use.'
    verifiable_closure: |
      `litmus:build-cache-sweep-trigger` gains a case pinning whatever is
      decided, and `grep -n "discard target/" scripts/ methodology.yaml` returns
      nothing that contradicts `images/default/lib-common.sh:1520`.
    notes: |
      Do NOT fix this by simply deleting the exemption. The rebuild cost it
      avoids is real; only its stated reason is false. The work is deciding what
      should actually happen to a persistent cache volume nobody sweeps.

      Related: 906-qi89 and 905-97xh (same script, closed 2026-08-26),
      915-wkm2 (scratchpad quota), and 863-iicc criterion 4, where the same
      "container implies disposable" conflation appears in the worktree cost
      argument.
