  - packet_id: hugging-face-login-for-the-host-via-browser-device-flow-with-a-tray-token-paste-fallback-token-only-in-the-vault
    order: 2080-dhzf
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [vault, oauth, licences, models, tray]
    estimated_hours: 8
    title: "Hugging Face login for the host: `tillandsias --huggingface-login` signs the operator in through the browser (OAuth device flow or PKCE), falls back to pasting a token in the tray, and keeps the token only in the vault for host-side model fetchers"
    context: |
      Operator asked 2026-11-13 for `tillandsias --huggingface-login`. Why: authenticated Hub downloads get higher rate limits and speed, and the operator's own account can accept gated model terms on huggingface.co, which then lets accept-licence admit FLUX.1-dev or SD3.5. Gated terms are always clicked by the human on the website, never by tillandsias.
      What Hugging Face supports, read 2026-11-13 from https://huggingface.co/.well-known/openid-configuration: authorization_endpoint /oauth/authorize, token_endpoint /oauth/token, device_authorization_endpoint /oauth/device, grant_types_supported includes urn:ietf:params:oauth:grant-type:device_code, authorization_code and refresh_token, code_challenge_methods_supported [S256], and a registration_endpoint plus client_id_metadata_document_supported. So both a device flow and authorization code with PKCE are offered; the device flow needs no loopback listener and suits a headless host. App registration and scopes per https://huggingface.co/docs/hub/oauth (read-repos for downloads; gated-repos as applicable). Model on cloudflare_login / cloudflare_oauth (the existing browser-login flow and its vault write).
      Fallback: the tray asks for a pasted user access token (read scope) when the browser flow cannot complete.
      Storage: the token lives only in the vault; no plaintext at rest (operator ruling 2026-10-19: lost credentials beat unencrypted; an unopenable vault is wiped and the operator logs in again). The studio and model fetchers (imagegen_models' proxy fetch, restricted_fetch) read it host-side and send it only to huggingface.co. Forges never see it: HF_TOKEN is already a scrubbed credential in tillandsias-plan child_env.
    exit_criteria:
      - "`tillandsias --huggingface-login` completes a device-flow login against a stub authorization server and writes the token to the vault only; no file under the state, cache or config dirs contains it. Pre-fix result: FAILS (the flag does not exist)."
      - "When the browser flow fails, the tray paste path stores a pasted token the same way."
      - "A host-side model fetch sends Authorization: Bearer only to huggingface.co; a forge's environment has no HF_TOKEN."
    verifiable_closure: "cargo test -p tillandsias-headless --features host-services,tray --bin tillandsias huggingface_login"
    unscoreable: |
      unpinnable-until-the-guard-exists: the implementer adds the huggingface_login test module (stub device-flow server, vault-only storage, no-plaintext scan, forge env scrub) in the same commit; the live login is measured once by the operator on a stable release.
    next_action: >
      Nothing is built. Read cloudflare_login and cloudflare_oauth for the login shape and vault write; register a Hugging Face OAuth app (operator's account, an operator action) or use client metadata documents; write the device-flow tests against a stub server red first.
    provenance: |
      Coordinator relay 2026-11-13 of an operator request (C2); Hugging Face OIDC discovery document read 2026-11-13 by macuahuitl.
