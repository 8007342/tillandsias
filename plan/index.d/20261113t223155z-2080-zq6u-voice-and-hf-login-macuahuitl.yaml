    capability_tags: [studio, audio, gpu, cuda, licences, mcp]
    estimated_hours: 12
    title: "A host-side GPU voice service (text-to-speech and voice conversion: Chatterbox or Kokoro on CUDA, admitted through the licence register) that a forge calls by tool, as it calls studio.run_workflow, so a project never loads its own copy of the model"
    context: |
      Motivating user: the demon_attack project's radio bank, a set of in-game radio voice lines. On macuahuitl 2026-11-10 the demon_attack forge ran 4 workers that each loaded their own Chatterbox model inside the forge; the 12.9 GB forge sat pinned at memory.high (about 9M high events) with host swap full and load about 17 (see the 2026-11-10 yoga correction fragment on the forge resource-stall row). Synthesis belongs on the host, once, on the GPU, like the ComfyUI studio (imagegen_studio) and the audio studio (audio_studio): one admitted model, one process, a queue, and the forge sends text plus a voice reference and receives a wav in its own output volume.
      Shape to copy: imagegen_studio::run_args (own project network, no egress, read-only /models mount from the licence-registered cache, out volume, CDI GPU when present) and the studio.run_workflow tool path in studio_tool. Weights come through the licence register (images/models/licence-register.tsv) and the models manifest only: Chatterbox (Resemble AI, MIT) and Kokoro-82M (Apache-2.0) are the candidates; read cardData.license and gated from the Hub at a pinned revision, safetensors only. A licence outside the permissive list goes through accept-licence with the operator's OS-verified signature, never by an agent.
      Voice conversion and cloning from a reference clip: the clip comes from the calling project; the service keeps nothing between calls (no voice library on the host).
    exit_criteria:
      - "A forge tool call (voice.synthesize: text, voice reference path in the project, output name) returns a wav in the forge's output volume, produced by one host container on the GPU; the forge's own memory does not grow by a model's size. Pre-fix result: no such tool exists (the forge's tool list has no voice.* entry)."
      - "The model files are rows of images/models/licence-register.tsv and the models manifest at a pinned revision with sha256; a file not listed is refused."
      - "Concurrent calls from one forge are queued on the one loaded model, not loaded again per call."
    verifiable_closure: "cargo test -p tillandsias-headless --features host-services,tray --bin tillandsias voice_service"
    unscoreable: |
