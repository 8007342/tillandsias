    title: |
      Every `git push origin work/<order>` through the enclave mirror prints "WARNING: new branch 'refs/heads/work/<order>' does not match the configured branch-creation grammar", though methodology (work_ref_lane, 1315-4a7j) and join-the-fleet §3 prescribe work/<order> as THE hand-off lane — a warning on every correct push trains workers to ignore the warning
    context: |
      OBSERVED on macuahuitl-forge 2026-09-26 pushing work/1254-fdsu:
        remote: [pre-receive] WARNING: new branch 'refs/heads/work/1254-fdsu' does not match the configured branch-creation grammar
        remote: [pre-receive] WARNING: expected namespaces: main | linux-next | windows-next | osx-next | gh-pages | release/* | claude/* | revert-* | agent/<host>/<base>/<yyyymmdd>-<slug> | salvage/<host>/<yyyymmdd>-<slug>
        remote: [pre-receive] WARNING: push accepted anyway — the branch-name grammar is warn-only at this rung
      The grammar lives in images/git/entrypoint.sh:142
      (TILLANDSIAS_BRANCH_GRAMMAR_HINT) and pre-receive-hook.sh:148;
      methodology/multi-host-development.yaml:264 defines work/<order>.
      When the grammar moves past warn-only, every correct hand-off will be REFUSED.
    deliverable: |
      work/<order> (order grammar: digits-4char) added to the branch-creation
      grammar and its hint, with the pre-receive fixture asserting a work/ push
      is silent and a malformed work/ name still warns.
