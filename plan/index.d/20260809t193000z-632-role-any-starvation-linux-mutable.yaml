packets:

  - packet_id: query-and-next-disagree-on-role-eligibility
    order: 632-39p3
    status: ready
    desired_release: v0.5
    priority: p0
    title: "`query --role X` excludes `any` while `next X` includes it, so two readers disagree about who can claim what"
    kind: bug
    deliverable: crates/tillandsias-plan/src/main.rs
    depends_on: []
    pickup_role: linux
    capability_tags: [plan, experts, mcp, triage, coordination]
    context: >
      Measured 2026-08-09 on the same ledger, same instant:

        tillandsias-plan query --status ready --role macos   ->  13 packets
        tillandsias-plan next  macos                         ->  32 eligible
        packets with pickup_role: any                        ->  56

      `next` treats `any` as claimable by every host. `query --role` matches the field
      literally, so it drops all 56. Both are documented as the way to ask "what can this
      host work on", and they return different answers.

      The operational damage was severe and invisible: scripts/select-work-batch.sh used
      `query --role`, so with a budget of 3 a WINDOWS cycle was handed ONE packet and a
      macOS cycle TWO, while 56 packets explicitly marked "any host may do this" sat
      unreachable by them. The Linux lane, whose own role tag covers 131 packets, never
      felt it — which is why it went unnoticed while both sibling hosts starved.

      The selector has been fixed to union role + any (measured after: macos 13 -> 52,
      windows 7 -> 48, both filling their budget). That stops the bleeding; it does not
      resolve which reader is right.
    exit_criteria:
      - >
        Decide the contract for `query --role`: does it mean "packets whose field equals X"
        or "packets a host of role X may claim"? Both are defensible; having both
        simultaneously is not.
      - >
        Whichever is chosen, `next`, `query`, `plan_ready` and the MCP surface agree, and a
        litmus pins the agreement. Two readers of one ledger disagreeing about eligibility
        is the same class of defect as a projection that silently drops a field (627-cx24).
      - >
        If `query --role` keeps literal semantics, the selector's union stays and is
        documented as deliberate; if it gains claimability semantics, the union is removed
        as redundant.
    verifiable_closure: >
      A litmus asserts that for every role, the eligible set reported by `query --role` and
      by `next <role>` are identical, with a negative control proving the check fails when
      they diverge.
    notes: >
      Do NOT change `query --role` semantics without checking consumers — drain-queue and
      the project-info `plan_query` MCP tool both call it, and a silent widening would
      change what other surfaces report.
    events:
      - ts: "2026-08-09T19:30:00Z"
        event: filed
        summary: >
          Found during a coordinator triage cycle whose explicit purpose was keeping the
          macOS and Windows hosts fed. The starvation was the symptom; the reader
          disagreement is the cause.

  - packet_id: selector-release-scope-and-entropy-floor
    order: 633-wb69
    status: completed
    desired_release: v0.5
    priority: p1
    title: "Batch selector ranged across all releases and could starve a frontier epic"
    kind: bug
    deliverable: scripts/select-work-batch.sh
    depends_on: []
    pickup_role: linux
    capability_tags: [triage, selector, plan]
    outcome: >
      Two defects found in the same coordinator cycle, both surfaced by fixing the
      role-any union above.

      RELEASE SCOPE. The selector never passed --release, so `query` returned every
      release and v0.5, v0.6 and v0.7 packets were ranked against each other. The header
      then printed whichever release the first row happened to carry, which read exactly
      like a filter that had been applied — it showed `release=v0.7` while the ACTIVE
      RELEASE was v0.5. Selecting not-yet-relevant work is precisely the "agents work
      obsolete packets" failure the selector exists to prevent. Now defaults from the
      folded ACTIVE RELEASE the same way `tillandsias-plan next` does; --release still
      overrides.

      ENTROPY FLOOR. Release-scoping widened the top score gap to ~6x (23.8 / 4.0 / 3.9),
      and squared weighting turned that into 94.6% for the top epic — twelve consecutive
      seeds all chose it, which the anti-starvation litmus caught. Added epsilon-mixing
      (EPS=0.15 over the top-k), so every frontier epic holds a floor of EPS/k. Measured
      after: p = 0.855 / 0.073 / 0.072, and 24 seeds spread 19/3/2. Coverage over time is
      now a property of the algorithm rather than an accident of the current score spread.

      The litmus steps for both entropy properties were rewritten to assert the PRINTED
      PROBABILITIES rather than sample seeds. The sampling versions were inherently flaky —
      once the gap widened, ~15% of runs would fail on correct behaviour, and a test that
      fails for the right reason 15% of the time still trains people to re-run it. The
      properties that matter (a floor exists; minimax still dominates) are exact.
    verifiable_closure: >
      litmus:cycle-batch-triage-shape 10/10, including the ENTROPY FLOOR and MINIMAX
      DOMINATES steps asserted from probabilities.
    events:
      - ts: "2026-08-09T19:30:00Z"
        event: completed
        summary: >
          Release scoping + epsilon floor landed; both entropy litmus steps de-flaked.
