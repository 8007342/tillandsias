packets:
  - packet_id: forge-image-has-no-nix-despite-the-spec-requiring-it
    order: 801-x1nx
    status: ready
    desired_release: v0.5
    priority: p2
    kind: fix
    title: "the runtime forge image contains no nix at all, so openspec/specs/default-image/spec.md's `MUST include Nix` is unmet and nothing in a forge can consume the 801-kqme binary cache"
    deliverable: "either nix present in the runtime forge image with substituters+trusted-public-keys pointing at nix-cache, or the spec and the welcome banner corrected to stop claiming it"
    pickup_role: linux
    release_target: convergence-velocity-milestone
    capability_tags: [nix, forge, images, spec-drift, cache]
    estimated_hours: 5
    context: |
      MEASURED 2026-08-18 inside localhost/tillandsias-forge:v0.4.260816.1 —
      in the image, not inferred from the Containerfile:
        command -v nix   -> rc=1
        ls -d /nix       -> No such file or directory
        ls /usr/bin/nix* -> No such file or directory

      Yet openspec/specs/default-image/spec.md:12 says the image MUST include
      Nix and :22-24 has a scenario "Image contains Nix ... with flakes
      enabled". The forge banner advertises it too
      (images/default/forge-welcome.sh:60 GUEST_OS="Nix (Minimal)", :171).

      WHY THE DRIFT EXISTS: there are two image paths. The runtime one is
      build-forge.sh -> scripts/build-image.sh -> images/default/Containerfile,
      whose microdnf list has no nix. The nix-built layered image
      (flake.nix packages.forge-image) DOES include nix at flake.nix:261 and
      writes ~/.config/nix/nix.conf at :374 — and nothing builds it.

      WHY IT BLOCKS VALUE RATHER THAN JUST BEING UNTIDY: 801-kqme landed a
      working binary cache on the enclave and the forge cannot use it, because
      it has no nix. The service was still worth landing — cache.nixos.org is
      absent from the squid allowlist, so it is the only substituter reachable
      from inside the enclave at all — but its consumer does not exist yet.

      DECIDE WHICH WAY TO RESOLVE IT. Adding nix to the runtime image is not
      free (image size, build time, a second package manager inside the forge)
      and "the spec claims a capability nobody uses" is a legitimate outcome
      too. Do not add nix just because a spec sentence says so; find out
      whether forge agents actually want it, then make spec and image agree.

  - packet_id: nix-cache-service-into-the-tray-container-lifecycle
    order: 801-vm4p
    status: ready
    desired_release: v0.5
    priority: p3
    kind: enhancement
    title: "the enclave nix cache is started by a script, not by the tray's ensure_*/container_deps graph, so it is not supervised, not scope-managed, and not torn down with the stack"
    deliverable: "build_nix_cache_run_args + ensure_nix_cache_running in main.rs, a Service::NixCache node in container_deps.rs, and a SHARED_STACK_SCOPES row, so the cache has the same lifecycle as vault/proxy/router"
    pickup_role: linux
    release_target: convergence-velocity-milestone
    capability_tags: [nix, enclave, containers, lifecycle, cache]
    estimated_hours: 4
    context: |
      801-kqme delivered the service as scripts/nix-cache-service.sh: it runs a
      real container on tillandsias-enclave with alias `nix-cache`, TLS from the
      stack CA and ed25519 content signing, proven reachable by DNS from an
      enclave container holding no host mount. What it is NOT is part of the
      tray's container graph.

      CONSEQUENCES TODAY, all of them "works but unsupervised":
        * no LivenessProbe entry, so a death is not self-healed
        * no SHARED_STACK_SCOPES row, so teardown/refcount logic does not know
          the container exists (it is neither Core nor LaneScoped)
        * no runtime_phase::container_mutations_allowed() drain gate
        * started by the daily maintenance lane rather than at stack bring-up

      THE MAP IS ALREADY WRITTEN — copy the router, the closest shape (durable,
      Core-scoped, read-only, publishes a loopback port):
        build_router_run_args   main.rs:4244
        ensure_router_running   main.rs:4412
        SHARED_STACK_SCOPES     main.rs:5232
        container_deps.rs       Service enum :27-44, name() :48-58, DEPS :67-99,
                                RealSatisfier::satisfy :302-327, ALL test :458-466
      The one main.rs change 801-kqme DID make is already in: `nix-cache` is in
      ENCLAVE_NO_PROXY_BASE, without which squid resets every request (rc=56).

      SEQUENCING: p3 deliberately. Supervising a service whose only consumer
      does not exist yet (801-x1nx — the forge has no nix) buys little. Do
      801-x1nx first, or do them together.

  - packet_id: harmonia-baked-into-an-image-versus-taken-from-the-served-store
    order: 801-7tqe
    status: ready
    desired_release: v0.6
    priority: p3
    kind: enhancement
    title: "the nix cache runs harmonia out of the store it is serving, so the served binary tracks the host store rather than an image tag"
    deliverable: "a decision, and if 'bake': images/nix-cache/Containerfile carrying harmonia's closure so the service is self-contained like proxy/vault/git"
    pickup_role: linux
    release_target: convergence-velocity-milestone
    capability_tags: [nix, images, cache, reproducibility]
    estimated_hours: 3
    context: |
      801-kqme mounts the persistent store read-only into the cache container
      anyway, so it takes harmonia FROM that store and pins it with a GC root
      (nix/var/nix/gcroots/tillandsias/nix-cache-harmonia, targeting the LOGICAL
      /nix/store path per the 790-mbk9 trap). The image is a stock
      fedora-minimal with no baked content.

      WHAT IS GOOD ABOUT IT: zero duplication, a 0-byte image delta, and it
      reuses 795-h8er's pin mechanism as the delivery mechanism.

      WHAT IS UNCOMFORTABLE: every other enclave service is self-contained, and
      this one's served binary version is a property of the host store rather
      than of an image tag. If the pin is ever lost, gc takes the server.

      NOT URGENT, and deliberately v0.6: baking costs a nix-at-image-build-time
      dependency on every host that builds images, which today only Linux hosts
      with nix satisfy. Measure whether that matters before paying it.

events:
  - packet_id: nix-binary-cache-service-on-the-enclave-for-warm-forges
    event:
      type: note
      ts: "2026-08-18T02:15:46Z"
      agent_id: fork-801kqme-20260818T0207Z
      host: linux_mutable
      summary: |
        Filing correction, recorded because the failure mode is silent and will
        catch the next agent too.

        Three follow-up packets were declared inside the `events:` list of the
        801-kqme closure fragment. The fold reads new packet declarations from a
        top-level `packets:` key; a list item under `events:` with no `event:`
        block is simply ignored. `./build.sh --check` passed, the closure folded
        correctly, and the three packets did not exist —
        `tillandsias-plan status 801-x1nx` -> "no packet matches".

        So a fragment can be well-formed YAML, pass the gate, fold its status
        change, and still silently drop everything else in it. Verify a filing
        by asking for the packet back, not by the gate going green.

        Re-declared in this fragment under `packets:`. The earlier fragment is
        immutable and left as written.
