      agent_id: linux-yoga-claude-20260903t070915z
      host: yoga
      summary: |
        THE PARENT NOW REFUSES A CLAIM RATHER THAN DESCRIBING ITSELF AS
        UNCLAIMABLE. It read `ready` while carrying "do not claim this row, take
        a child" in next_action, and `split-parents` returned nothing for it — so
        the tooling actively contradicted the prose, and a coordinator
        re-dispatched the row as unclaimed work on the strength of the status
        field. Prose in next_action is not a machine-readable constraint
        (750-zrt4).

        Two changes, and the first is the one that bites: status -> blocked, the
        sanctioned resolution for a fully-delegated parent, which actually
        removes it from selection. And split_into landed as a FIELD naming all
        five children, so the relationship is queryable rather than narrated.

        ENFORCEMENT VERIFIED ON ALL THREE SURFACES rather than asserted —
        "if a host can still claim it, the fix is not done":
          tillandsias-plan ready            -> 0 matches
          select-work-batch.sh linux        -> 0 matches
          tillandsias-plan next linux       -> 0 matches

        `split-parents` now correctly reports nothing for it, for the right
        reason: that tool names READY parents competing with their own children,
        and this one no longer is.
