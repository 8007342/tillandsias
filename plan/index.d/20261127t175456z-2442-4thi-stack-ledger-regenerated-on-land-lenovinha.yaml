packets:
  - packet_id: stack-ledger-json-conflicts-every-image-row
    order: "2442-4thi"
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [credits, land-queue]
    estimated_hours: 3
    owned_paths: [scripts/lua/build-stack-ledger.lua, scripts/land-queue.sh, docs/credits/stack.v1.json]
    title: "docs/credits/stack.v1.json is regenerated by every image row, so each landing evicts the next on a merge conflict; regenerate it on land instead"
    context: |
      Measured 2026-11-27: #1725 (2413-jvhh) and #1726 (2413-ucx2) were both evicted at 35383dccd with
      "conflicts in: docs/credits/stack.v1.json". Each 2413 image row adds rows to package-licences.tsv
      (that file merges cleanly, because rows are sorted lines) and regenerates the json. The json carries
      counts and a first-source field for each node, so two regenerations always collide. The fix
      until now: merge trunk, regenerate (the generator is deterministic), re-push, once per eviction.
      DECISION (asked by macuahuitl 2026-11-27: pick whichever keeps the credits guard simplest):
      REGENERATE ON LAND, not a per-image split. Why: the guard is one call,
      build-stack-ledger.lua --check (violation:stack-ledger:stale), over one file. A split needs shard
      files, a merged view, and a guard that checks each shard and their union, which makes both the guard
      and the generator more complex. Regenerating on land keeps the single file and the single check. The
      land tool runs the generator on the merged tree and commits the json into the land commit. --check
      then runs on the land result, which is the only tree that matters, and a PR stops having to commit
      the json at all. Inputs stay where they are: package-licences.tsv and the Containerfiles.
    exit_criteria:
      - "two work refs that each add package rows for different images land in one queue run with no stack.v1.json conflict, and build-stack-ledger.lua --check is ok on the landed trunk"
    unscoreable: "unpinnable-until-the-guard-exists: the deliverable is a land-queue step, measured by a queue run with two such refs."
    next_action: "add a regenerate-and-amend step to the land commit for refs that touch the ledger's inputs; let a PR omit the json; keep --check on trunk."
    provenance: filed by lenovinha at macuahuitl's request after #1725/#1726 were evicted.
    related: [1958-yfib]
    events:
      - {type: filed, ts: '2026-11-27T17:54:56Z', host: lenovinha, summary: stack ledger json conflicts on every image row}
