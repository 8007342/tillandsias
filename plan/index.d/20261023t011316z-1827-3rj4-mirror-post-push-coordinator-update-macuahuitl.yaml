      - scripts/test-mirror-coordinator-bump.sh
    title: |
      After the git mirror's upstream relay to GitHub succeeds, its post-receive hook sends the project namespace's new head SHA and a staleness bump (and an optional client-folded overview) to the coordinator, with the Access service token injected from the vault; failure is logged and never affects the push
    context: |
      images/git/pre-receive-hook.sh performs the must-succeed relay to
      GitHub; images/git/post-receive-hook.sh runs only after that verified
      transaction and "cannot affect receive-pack's result" — the correct
      place for a best-effort cache update. No GitHub webhook (milestone
      decision 3). The token comes from the vault via vault-cli.sh at hook
      time, lives only in the hook's environment, and is never logged. The
      call is backgrounded with a short timeout so a slow or absent
      coordinator never delays the client's push. When the coordinator is
      not configured (no token in vault), the hook does nothing and logs one
      line.
    exit_criteria:
      - 'with a stub coordinator on a local port and a stub vault token, a push through a test mirror results in exactly one POST carrying the new head SHA for the project namespace (pre-fix result: FAILS — no request is made)'
      - 'with the stub coordinator down, the push still exits 0 and the hook logs one coordinator-unreachable line; the token never appears in the push log (pre-fix result: the push exits 0; no coordinator line)'
    unscoreable: |
      unpinnable-until-the-guard-exists: scripts/test-mirror-coordinator-bump.sh
      (new) runs a bare repo with the hook, a bash/nc stub coordinator and a
      stub vault-cli, and asserts the POST body, the down-coordinator exit 0,
      and the token's absence from logs.
