      host: linux_mutable
      summary: >
        PIRRIA'S NON-ATTESTATION: two hypotheses tested and BOTH ELIMINATED, so
        the next host to look does not repeat them.

        (1) "record cannot bootstrap a host with no ledger file" — FALSE.
        scripts/mo-full-attest.sh record does `mkdir -p` and appends, creating
        the file when absent.

        (2) "pirria's host label diverges, so it writes a differently-named
        file" — FALSE. mo_full_host resolves through tillandsias_node_name, and
        pirria's own capability row records host_id=pirria with
        host_id_source=node-name. It would write pirria.md, and pirria.md has
        never been committed by anyone.

        Confirmed: pirria has NEVER committed to plan/mo-full-attestations.d/
        under any filename. Its cycles produce ledger fragments and code changes
        and then do not reach, or do not survive, the attestation step. That is
        on pirria's disk and cannot be diagnosed from here — most likely
        `record` refusing because local HEAD has not converged on the remote,
        which is the guard behaving correctly and the cycle ending without
        retrying.
