packets:
  - order: 872-k4pv
    packet_id: the-liveness-probe-matched-git-authorship-and-one-host-fell-through-it
    desired_release: v0.5
    title: "WEDGED was unreachable for yolanda because its commits carry no string matching its roster name"
    status: completed
    kind: defect
    pickup_role: any
    priority: p2
    capability_tags: [fleet, coordination, observability]
    depends_on: []
    deliverable: scripts/fleet-heartbeat.sh
    estimated_hours: 1
    discovered_by: "investigating why pirria commits but never attests, and finding the probe worked on it by coincidence"
    context: >
      THE PROBE WORKED FOR FOUR HOSTS BY COINCIDENCE OF NAMING AND SILENTLY
      FAILED FOR THE FIFTH. `last_commit_epoch` ran
      `git log --all --author=<roster name>`, a substring search over author
      name AND email. Measured across the roster:

        pirria       16 commits   author "Laptopirria"  matched only because the
                                                        roster name is a substring
        macuahuitl 1029 commits   author "Tlatoani"     matched only via the email
                                                        domain @macuahuitl…
        yoga        232 commits   author "Tlatoāni"     same
        yolanda       0 commits   nothing matched at all

      So the WEDGED classification — "no attestation BUT recent activity" — was
      UNREACHABLE for yolanda. It could only ever be reported dead, which is
      exactly the confusion 864-t4nq was built to end, still live for one host
      three iterations later.

      Nothing about this was visible in the output. Four hosts resolved
      correctly and the fifth looked like a host that simply had not committed.
      A probe that fails by returning "no evidence" is indistinguishable from
      the world genuinely having no evidence.

      THE FIX IS TO ASK FOR DECLARED IDENTITY. A host's ledger events carry
      `agent_id: <kind>-<host>-<model>-<stamp>`, written BY THE HOST ABOUT
      ITSELF. Git authorship is inherited from whatever `git config user.name`
      happens to hold on that machine and was never intended as a host label.

      The git probe is KEPT alongside rather than replaced: it sees work that
      never reached a ledger fragment, which the declared probe cannot. Activity
      is the newer of the two.

      Also corrected the wording. The line read "committed Xh ago" even when the
      evidence is a declared fragment rather than a commit; it now says
      "active", and the dead line says "no activity" rather than "no commits".
      A report that names the wrong evidence type invites exactly the
      misdiagnosis this packet is about.
    exit_criteria: >
      (1) A host's liveness no longer depends on its git author string
      containing its roster name.
      (2) The git-author probe is retained, not replaced — it covers work that
      never produced a fragment.
      (3) Mutation control: blind the git probe entirely and a host with ledger
      fragments must STILL report as active.
      (4) The report's wording names the evidence honestly.

