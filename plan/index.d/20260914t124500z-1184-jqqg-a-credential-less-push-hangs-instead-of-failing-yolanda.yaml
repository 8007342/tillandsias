    title: |
      scripts/salvage-dirty-worktree.sh's push hangs forever rather than failing on a host whose git cannot authenticate, so the one tool built for a stranded commit strands the caller instead — measured on yolanda: 30s bound reached with zero output, versus 1s and a clear message with GIT_TERMINAL_PROMPT=0
    context: |
      MEASURED on yolanda inside the tillandsias-build distro, with a --dry-run
      push so the measurement wrote nothing and minted no ref:

        timeout 30 git push --dry-run --quiet origin HEAD:refs/heads/salvage/probe
          -> rc 124 after 30s, NO OUTPUT AT ALL

        GIT_TERMINAL_PROMPT=0 timeout 30 <same>
          -> rc 128 after 1s
             fatal: could not read Username for 'https://github.com':
             terminal prompts disabled

      WSL has no git credential helper (this is 1131-iax2's regime, and the same
      reason the land tool carries a dedicated exit 7 for a push that emits
      nothing and hits its bound). Git falls back to prompting on a terminal that
      will never answer, and waits.

      WHY THIS MATTERS MORE HERE THAN ANYWHERE ELSE. This is the script a host is
      told to run when its gate went red and its commit is stranded — the
      sanctioned alternative to --no-verify, named in the pre-push refusal itself
      (1177-k4jq). A caller reaching for it is ALREADY in trouble. Hanging is the
      worst available answer at that moment: it looks like slow work, it holds
      the terminal, and it produces no line anyone can act on.

      IT ALSO ALREADY COST THE FLEET A GATE. Tonight the 1177-k4jq step invoked
      this script with `--help`, which pre-d4f14fa49 was treated as a slug; on
      this credential-less host the resulting push hung and took a full
      ./build.sh --check with it — 3h50m elapsed, log untouched for 3h10m. The
      usage guard (d4f14fa49) closes that specific door. THIS FACE IS STILL OPEN:
      a REAL salvage on a credential-less host still hangs, and that is the case
      the script exists to serve.

      THE FIX IS SMALL AND THE SCRIPT ALREADY KNOWS THE ANSWER. It has a
      local-ref path that prints ok:salvaged-local and tells the caller the
      commit is safe locally but has not reached origin — the correct outcome
      here. The push simply has to FAIL so that path is reached.
      GIT_TERMINAL_PROMPT=0 on the push does it, and `timeout` is present in the
      distro (/usr/sbin/timeout) if a bound is wanted as well.

      NOT VERIFIED, and it decides how the bound should be written: whether
      GIT_TERMINAL_PROMPT=0 alone is sufficient on every fleet host, or whether
      some credential helper can still block with prompts disabled. I measured
      one host and one remote. A bounded `timeout` around the push covers the
      residue, but it must be chosen so a slow-but-working push on the floor
      hosts is not killed mid-transfer — which is a measurement on esme or
      pirria, not on this host.
    exit_criteria:
      - 'on a host whose git cannot authenticate, the salvage script answers ok:salvaged-local and EXITS within a bounded wait (pre-fix result: FAILS — it hangs; 30s bound reached with zero output on yolanda)'
      - 'the message names the credential cause, so the caller is not left guessing why origin was not reached'
      - 'NEGATIVE CONTROL: on a host whose credentials work, the push still succeeds and the commit still reaches origin'
