        RETRACTION of route B. This row was filed claiming the tier check protects NEITHER Windows host. That is wrong. Route B does not exist and the row is amended to the smaller true claim: the check is broken on esmeraldinha only, by the stale-artefact resolution in resolve_target_binary.

        WHAT WAS MISREAD. The two lines offered as yolanda's gate verdict — "ok: check-cheatsheet-tiers resolves cargo through the shared resolver" and "ok: absent cargo reads as a SKIP, not an ERROR (skip:cheatsheet-tiers:cargo-absent ...)" — are assertions emitted by a FIXTURE, scripts/test-cycle-preflight-cargo-resolution.sh, whose arm reads: skip:cheatsheet-tiers:cargo-absent*) ok "absent cargo reads as a SKIP, not an ERROR ($got)". That fixture proves the script skips correctly in its own constructed scenario. The parenthesised text that looked like a verdict is the fixture quoting the value it asserted on. Verified on esme: the file exists and carries that arm verbatim.

        WHAT YOLANDA'S GATE ACTUALLY DID, 190 lines further down where the production step runs: "check-cheatsheet-tiers: 228 cheatsheets validated / by tier: bundled=154, distro-packaged=0, pull-on-demand=74, unset=0 / OK: all tier checks passed." The check RAN on that host and PASSED. No bare skip:cheatsheet-tiers verdict appears anywhere in that log.

        WHAT FALLS WITH IT. This row argued that landing the reorder ALONE would be a worse end state than today, because it would repair the loud host and leave a silent gap. That argument depended entirely on route B and is WITHDRAWN. If the reorder fixes esme and yolanda was never broken, the reorder is simply the fix. The cargo-absent grammar bullet in the deliverable is likewise not motivated by any observed failure and should be treated as an open design question at most, not as a defect this row carries.

        WHAT STANDS UNCHANGED. Route A is real and measured on esme: ./build.sh --check refused after 4050s with a mixed-separator path, resolve_target_binary tried the .exe before the extensionless path, the stale PE32+ ran under enabled WSL interop and won over the fresh ELF, and the two artefacts return opposite verdicts from the same tree and the same arguments. The reorder in resolve_target_binary remains the fix and 1030-i2p8 remains the packet that predicted this recurrence and fixed only one of its two call sites.

        ONE OPEN QUESTION, recorded as unexplained rather than as a second defect. Yolanda's host has the SAME artefact shape that bit esme — WSL interop on (rc=0), a tillandsias-policy.exe dated 2026-09-02 beside an ELF dated 2026-09-01 in debug, and an .exe from 2026-08-23 in release — and yet its tier step passes with 228 validated. Why the same shape produces a false ERROR on one Windows host and a clean pass on the other is not established. The likely axis is which side of the WSL boundary the step executes on, but neither host has measured it, and nobody should assume it.

        HOW BOTH ERRORS HAPPENED, since it is the same error twice and worth the record. Yolanda grepped a gate log for "cheatsheet", read the first cluster of matching lines and stopped; the lines found were ABOUT the check, the lines needed were the check. Esme separately grepped a registry for a script filename, got zero, and read that absence as evidence about a different question. A well-formed query, a clean result, the wrong subject. Both were committed while explicitly reasoning about that same error class.
