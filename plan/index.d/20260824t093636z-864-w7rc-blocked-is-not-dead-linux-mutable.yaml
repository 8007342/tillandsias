      summary: >
        A host with an open `Status: blocked` record it filed about itself now
        reads BLOCKED and the report names the file, so silence that has already
        been EXPLAINED stops being reported as suspicious.

        The verdict grammar widened to
        healthy/wedged/blocked/dead/never. That is a breaking change to a
        falsifiable line, so consumers were grepped for BEFORE landing rather
        than discovered after — there were none, and the script's own header was
        the only place still documenting the four-field shape. It now documents
        five, with the reason.

        Left deliberately unchanged: the six-hour WEDGED window. A host that is
        actively committing while unable to attest is a different and more
        urgent condition than one that has settled into a declared block, and
        collapsing the two would lose the distinction 864-t4nq was filed to
        create.
