packets:
  - order: 864-w7rc
    packet_id: a-wedged-host-decays-to-looking-dead-once-it-stops-narrating-its-wedge
    desired_release: v0.5
    title: "the WEDGED signal keys on commit recency, so a host that said it was blocked reads as a dead terminal six hours later"
    status: completed
    kind: defect
    pickup_role: any
    priority: p2
    capability_tags: [fleet, coordination, observability]
    deliverable: scripts/fleet-heartbeat.sh
    depends_on: [the-coordinator-cannot-tell-a-dead-host-from-one-that-is-failing-every-cycle]
    estimated_hours: 2
    discovered_by: "yoga reading WEDGED one cycle and 'likely a dead terminal' the next, while nothing about yoga changed"
    context: >
      864-t4nq SPLIT DEAD FROM WEDGED USING A DECAYING SIGNAL, and the decay is
      the bug. WEDGED was inferred from "no attestation BUT recent commits",
      which holds only while the wedged host keeps committing. A host stops
      committing once it has nothing NEW to say about being stuck — which is
      the correct behaviour, not a fault — so after the six-hour window it
      reverts to reading as a dead terminal.

      MEASURED ACROSS TWO CONSECUTIVE CYCLES, with nothing about yoga changing
      between them:

        08:34Z  yoga  attested 19h22m ago BUT COMMITTED 5h27m ago  <-- WEDGED
        09:34Z  yoga  21h22m  <-- SILENT, no commits either (likely a dead terminal)

      Meanwhile the ledger still knew: yoga's own
      plan/issues/yoga-dirty-start-wedge-2026-08-23.md carries
      `Status: blocked`, and both its rows remain in_progress and reap-held. The
      classifier lost information the repository still had, because it was
      reading a clock instead of a record.

      THE SCRIPT WAS ALREADY GIVING THE RIGHT ADVICE AND NOT TAKING IT. It
      printed "Check plan/issues/ for a record it filed about itself before
      assuming it is idle" — gated on `wedged > 0`. So the hint disappeared at
      exactly the moment the host stopped looking wedged, which is the moment
      the hint was needed. Automating advice the tool already gives is cheaper
      than expecting every reader to follow it at the one time it is absent.

      DURABLE BEATS RECENT. A host's own filed blocker is a standing statement
      about its state; commit recency is a proxy that expires. Where both are
      available the statement wins.
    exit_criteria: >
      (1) A host with an open blocker record it filed about itself reads as
      BLOCKED and the report NAMES the record, rather than reading as a likely
      dead terminal.
      (2) The remedy line appears for blocked as well as wedged hosts — it was
      previously gated on wedged alone, so it vanished precisely when the
      classification decayed.
      (3) Mutation control: blind the blocker probe and the host must fall back
      to "likely a dead terminal", proving the record is what does the work.
      (4) Widening the verdict grammar is checked for consumers before landing,
      not after.

