          workstation fetch refspec, and no upstream credential channel in
          the daemon container, while the healthcheck reported healthy
          throughout and upstream was verified non-empty.

  - packet_id: codex-lane-mirror-wait-unbounded
    release_target: fail-loud-diagnosis-milestone
