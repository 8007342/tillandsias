    title: |
      The codex lane retries the mirror clone forever — no attempt cap, no timeout, no fail-loud.
    context: |
      Observed live 2026-08-16 from ~21:00Z (windows/Yolanda) during the
      mirror-never-seeds defect (777-i7hf): a codex lane hung retrying the
      mirror clone every ~2.5s indefinitely (guest journal; each attempt
      logged by the daemon as "fatal: the remote end hung up unexpectedly").
      Contrast the OpenCode lane in the same launch against the same mirror:
      it fails LOUD after 12 attempts with a FATAL naming the mirror state.
      Only the lane's wait policy differs; the codex lane's unbounded wait
      converts a diagnosable mirror defect into a silent hang.
    exit_criteria:
      - |
          The codex lane bounds its mirror-clone wait (attempt cap and/or timeout) and fails LOUD with a verdict naming the mirror state, consistent with the OpenCode lane's grammar (and with 731-eupn's not-seeded vs upstream-empty disambiguation when that lands).
      - |
          A test or litmus pins the bounded-wait behavior so an unbounded retry loop cannot return silently.
    events:
