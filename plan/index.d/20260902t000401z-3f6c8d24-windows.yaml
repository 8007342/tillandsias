events:
  - packet_id: hardware-fingerprint-makes-the-twin-hosts-a-substrate-control
    event:
      type: evidence
      ts: "2026-09-02T00:04:01Z"
      agent_id: "windows-yolanda-claude-20260830t162208z"
      host: windows
      summary: |
        THIS PACKET'S COST WAS PAID IN FULL ON 2026-08-30/31, by the twin pair it
        names, in the exact way it predicts. Recording it because the incident is the
        packet's own justification and it is otherwise only in a retraction.

        WHAT HAPPENED: yoga measured an accelerator lane slower than CPU at 0.5b and
        reported 0.75x. I ran what I believed was an independent replication on this
        host and reported 0.82x, framed as "replicates on a THIRD SUBSTRATE" —
        language that treats the two hosts as comparable. Both numbers then had to be
        qualified or withdrawn, and the framing was struck on both sides.

        THE FRAMING WAS UNSUPPORTABLE EVEN HAD THE NUMBERS HELD. Nothing in the
        capability document could establish that yolanda and yoga are the same
        substrate, so "replicates across substrates" was a claim about hardware
        equivalence backed by no hardware evidence. We were each describing our own
        machine and calling the pair a control. That is this packet in one sentence.

        WHAT THIS HOST CAN ATTEST, offered as concrete field values a fingerprint
        would need to carry, all read directly rather than inferred:
          NPU        PCI\VEN_1022&DEV_17F0, "NPU Compute Accelerator Device",
                     AMD driver 32.0.20102.3930 — the SAME 1022:17F0 part yoga
                     enumerates on Linux as `amdxdna`
          iGPU       AMD Radeon 860M, PCI\VEN_1002&DEV_1114, gfx1152 — the same
                     target yoga is building a HIP backend for
          RAM        15.2 GB visible to Windows
          host       Windows 11 + WSL2; yoga is bare-metal Linux

        SO THE PAIR IS GENUINELY TWINNED AT THE SILICON (same NPU part, same GPU
        target) AND GENUINELY DIFFERENT AT THE STACK (Windows/WSL2 + ryzenai-llm
        versus bare Linux + RADV/Vulkan). Both halves matter: the first is what makes
        them a usable control, the second is what makes cross-host numbers need the
        fingerprint before they can be compared at all. A fingerprint that captured
        only the silicon would license exactly the comparison that failed tonight.

        VENDOR+DEVICE TOGETHER, per this packet's sibling 793-zumy: 0x1002 alone
        collides across every AMD part, and the device id alone has already caused a
        FABRICATED counterexample in that packet's own comments (corrected
        2026-08-30). The fingerprint must carry both.

        NOT DONE: I have not implemented the fingerprint. This is the evidence for
        why it is needed and the values one host can supply, not the deliverable.
