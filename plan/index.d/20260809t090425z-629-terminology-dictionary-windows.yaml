  - packet_id: tray-shared-string-resource-layer
    event:
      type: note
      ts: "2026-08-09T09:04:25Z"
      agent_id: windows-claude-fable-metaorch-20260809t063000z
      host: windows
      summary: |
        The locale corpus is UNEQUAL, not merely unwired — measured 2026-08-09. Key counts: de/es 169, en 168, and the other FOURTEEN locales (ar fr hi it ja ko nah pt ro ru ta te zh-Hans zh-Hant) 143 each, i.e. ~26 keys behind. `sign_in_github` is one of the missing keys: it is defined in only 3 of 17 files (en, de, es), and the two non-English ones are genuinely translated ("🔑 Iniciar sesión en GitHub", "🔑 GitHub-Anmeldung").

        Consequence for this packet's design: missing-key fallback is not an edge case to handle later, it is the MAJORITY case on day one for 14 of 17 languages. Fallback-to-en must be specified and tested before any string resolves through the layer, and the exit criterion requiring a loud build-time failure for a key absent from en is the one that keeps that fallback honest.
