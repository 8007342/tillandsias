packets:
  - packet_id: terminology-dictionary-and-consistency-gate
    order: 629-t6bx
    status: ready
    desired_release: v0.5
    role: host-shell
    priority: p2
    kind: enhancement
    title: |
      A terminology dictionary (controlled vocabulary) plus a gate, so product and third-party names are spelled one way everywhere.
    deliverable: plan/issues/tray-string-parity-and-i18n-layer-2026-08-09.md
    depends_on: []
    pickup_role: any
    owner_host: any
    capability_tags:
      - tray-ux
      - i18n
      - policy
      - litmus
      - terminology
      - railguard
    estimated_hours: 6
    problem: |
      There is no controlled vocabulary. Spelling of proper nouns, product names and recurring UX concepts is decided per call site, so consistency depends on whoever wrote the line. The operator's ruling on "GitHub" is the first entry in a list that does not exist yet.

      MEASURED before filing, because the raw grep is misleading. `grep -rn "Github"` hits 15 files, but:
        * NO user-visible string misspells it — searching menu labels, locale values and printed output for "Github" returns nothing. The corpus and the trays already say "GitHub".
        * Every hit is a Rust identifier (GithubLoginState, GithubLoginStatusRequest, GithubLoginStatusReply) or the kind() diagnostic string those types produce.
        * The one genuine user-visible defect is a missing SPACE, not a capital: crates/tillandsias-headless/src/tray/mod.rs:3240 renders "🔑 GitHubLogin" (Linux tray). Already tracked in 628-w9sm.
    why_it_matters: |
      A dictionary is what makes 628-h4nx's string gate enforceable beyond exact-match comparison: two platforms can agree byte-for-byte and still both be wrong, and a per-platform diff cannot detect that. It is also what stops the NEXT proper noun (Podman, WSL, Fedora, OpenCode, Codex, Claude, Vault, Antigravity) from drifting the way this one did.
    scope_two_tiers: |
      TIER 1 — user-visible text. Binding. The dictionary governs every string a user can read. This tier is small today: exactly one known offender (the Linux missing space).

      TIER 2 — code identifiers. NOT bundled, and deliberately so. Read literally, "wherever GitHub is referenced" renames ~15 files of Rust identifiers, and "GithubLoginStatusRequest" is a kind() value appearing 6 times in dispatch tables and error text — protocol-adjacent, with real blast radius. Whether tier 2 is in scope is an OPERATOR DECISION this packet must surface with the rename cost measured, not assume. Doing tier 1 does not require tier 2.
    exit_criteria:
      - |
          A dictionary file exists in a machine-readable format, seeded with the operator's "GitHub" ruling and every proper noun the product already uses (Podman, WSL, Fedora, Vault, OpenCode, Codex, Claude, Antigravity, Tillandsias, Observatorium). Each entry records the canonical form and the known-wrong variants it replaces.
      - |
          A check fails when user-visible text uses a non-canonical variant of a dictionary term. Ruby-free, runnable on every host (order 261).
      - |
          The check is scoped to TIER 1 only unless the operator rules otherwise; the tier-2 decision is presented WITH the measured rename cost and blast radius, and recorded either way.
      - |
          Translated locales are handled correctly: a proper noun must keep its canonical form INSIDE a translated string (the corpus already does this — "🔑 Iniciar sesión en GitHub", "🔑 GitHub-Anmeldung"), so the check cannot simply require the whole string to match en.
      - |
          The dictionary is the input to 628-h4nx rather than a parallel mechanism — one vocabulary, one gate, not two.
      - |
          Adding a term is documented as a one-file change, so the dictionary stays cheap to extend and does not calcify.
    notes: |
      Adds a gate and a data file, not a string. No UX-curation approval needed for the mechanism. Applying a correction to any specific user-visible string still needs the operator's ruling for that string — the "GitHub" ruling is recorded and is the first such entry.
    events:
      - type: filed
        ts: "2026-08-09T09:04:25Z"
        agent_id: windows-claude-fable-metaorch-20260809t063000z
        host: windows
        summary: |
          Filed at operator direction alongside the ruling that "GitHub" is the canonical spelling. Scoped into two tiers after measuring: the user-visible tier is nearly clean already (one missing space on Linux), while the identifier tier is pervasive and protocol-adjacent, so bundling them would have turned a one-line fix into a wire-touching rename without the operator choosing that.

