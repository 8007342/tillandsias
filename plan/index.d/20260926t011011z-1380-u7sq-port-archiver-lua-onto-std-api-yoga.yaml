    context: |
      Follow-up to 1375-btuf, option B of the coordinator ruling
      (macuahuitl, 2026-09-26): 1375-btuf sandboxed the lua CLI by default and
      left the archiver on a NAMED opt-in, pinned by file, because the port
      needs verbs the design does not yet specify.
      What the .lua does today: os.execute(string.format("mkdir -p %q", dir))
      :24; os.getenv("TILLANDSIAS_PLAN_BIN") :27 with a HARDCODED
