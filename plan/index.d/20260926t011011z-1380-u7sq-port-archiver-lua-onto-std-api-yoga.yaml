      sh.run{argv}, which deletes quoting as a class, 1252-fg9e); io.stderr,
      os.exit. It also WRITES plan files (index and archive), so the port needs
      Observing-only write verbs (fs.mkdir, fs.write) that the design must
      specify first: rooted like fs.read, and never in Cacheable.
      yolanda's 560 adds a second call site in the same script (the --check
      sweep); the port covers both.
