packets:
  - packet_id: wsl2-overhead-is-the-9p-bridge-not-the-vm-and-the-checkout-is-on-the-wrong-side
    order: 895-bkrn
    status: ready
    desired_release: v0.5
    priority: p1
    kind: optimization
    title: the Windows lane's ~9.7x gate cost is the 9P/drvfs bridge, not WSL2 — measured 45.6x on ONE machine with only the filesystem varying, while WSL2's own VM overhead is 1.5x
    deliverable: the Windows checkout (or at minimum CARGO_TARGET_DIR) lives on the distro's native ext4 rather than under /mnt/c, plus whatever in build.sh/with-wsl2-builder.sh has to change to support it
    pickup_role: windows
    release_target: convergence-velocity-milestone
    capability_tags:
      - windows
      - wsl
      - build
      - performance
    estimated_hours: 4
    context: |
      MEASURED on yolanda 2026-08-26. This closes the question the yoga/yolanda
      pairing was created to answer, and the answer is actionable configuration
      rather than a code defect.

      THE ISOLATING MEASUREMENT. macbook's no-op `cargo check` protocol, run
      twice on ONE machine, same kernel, same distro, same commit
      (52e9978bb), same toolchain, same 20 iterations after two warm discards.
      The ONLY variable is which filesystem the checkout sits on:

        native ext4 (inside the distro's VHDX):
            real 5.009  user 3.212  sys 1.850   ->   250 ms per no-op check
        /mnt/c via the 9P/drvfs bridge:
            real 228.167 user 68.703 sys 55.702 -> 11408 ms per no-op check

        RATIO: 45.6x, with zero hardware, kernel, distro or toolchain
        variables in it.

      THE CPU SPLIT IS THE CONFIRMATION, not decoration. On ext4 the run is
      CPU-saturated (5.06s of user+sys against 5.01s wall — the machine is
      working). Across the bridge only 124.4s of 228.2s wall is CPU at all;
      more than 100 seconds is spent waiting on filesystem round trips. That is
      what stat-bound-on-a-bridge looks like, and it is why the cost scales with
      file count rather than with compile work.

      WHAT THIS EXONERATES, both previously-leading hypotheses:

      1. WSL2 ITSELF IS NEARLY FREE. Native-ext4 250 ms against yoga's
         bare-metal-Linux 170.5 ms on near-identical silicon is ~1.5x, and
         against macbook's Darwin 161 ms it is ~1.6x. The operator's goal of
         "true negligible overhead for the WSL2 lane" is very close to already
         met — on the correct filesystem. The lane is not the problem.

      2. SPAWN COST IS NOT THE CAUSE, and the number everyone was reasoning
         from is stale. MEASURED, 1000 iterations each:
           Git Bash   /bin/true 17.58 ms   sha256sum 18.51 ms
           WSL        /bin/true  0.69 ms   sha256sum  1.33 ms
           yoga       /bin/true  0.32 ms   sha256sum  0.80 ms
         The gate executes INSIDE WSL, where the floor is 0.69 ms — 2.2x
         native, not the 55x the Git Bash side would suggest. And
         `scripts/gate-stamp.sh`'s inherited comment budgeting "~100-150 ms per
         spawn on a Windows/MSYS host" is wrong by 6-9x: the real MSYS floor is
         17.6 ms. That comment is load-bearing for the 675-dkif batching design
         and should be replaced with a measured, dated figure. The batching is
         still correct; only its stated justification is fiction.

      Note also that the two sides do not run the same binary — Git Bash
      resolves `sha256sum` to a PE32+ Windows executable, WSL to an ELF — so
      the two lanes are comparable as LANES but never as implementations.

      WHY THE CHECKOUT IS WHERE IT IS. It lives under /mnt/c because that is
      where a Windows user's files naturally live and because the tray, the
      installer and the Git Bash tooling all reach it there. Moving it is
      therefore not a one-line change: `with-wsl2-builder.sh` re-execs into the
      distro with `cd $PWD`, the pre-push hook runs on the Git Bash side against
      the same worktree, and 890-t9pu already shows what happens when the two
      sides disagree about where state lives. A partial move
      (CARGO_TARGET_DIR onto ext4, source left in place) may capture most of the
      win at a fraction of the risk and should be measured before the full move
      is attempted — the build writes far more than it reads.

      DO NOT GENERALISE THIS TO CONTAINERS. yoga measured their toolbox lane at
      178.5 ms against 170.5 ms native — a 5% isolation cost. The 45.6x is
      specific to the 9P/drvfs bridge, not to running work inside an isolated
      environment.
    verifiable_closure: |
      The same no-op `cargo check` protocol on the Windows host's REAL working
      configuration lands within ~2x of yoga's native baseline rather than
      ~67x, and `./build.sh --check` on that configuration is reported with n
      and forced/warm state for comparison against the 276.5s (n=20) recorded
      before the change.
    evidence:
      - 'native ext4, 20 no-op cargo checks: real 5.009 user 3.212 sys 1.850'
      - '/mnt/c 9P, 20 no-op cargo checks: real 228.167 user 68.703 sys 55.702'
      - 'same machine/kernel/distro/commit 52e9978bb; only the filesystem differs'
      - 'spawn floors: git bash 17.58ms, wsl 0.69ms, yoga native 0.32ms (1000 iterations each)'
      - 'yoga bare-metal baseline 170.5ms; macbook Darwin 161ms; yoga toolbox 178.5ms'
