      summary: >
        A litmus test can now declare `host_kind:` and SKIPS elsewhere instead of
        failing. Modelled directly on the existing phase and size gates — same getter
        shape with the same yq/awk fallback, same log_test_result SKIP path — so it
        adds a case to an established mechanism rather than a new one.

        Defaults to `any`, so every existing test is unaffected: an absent field must
        never start gating anything.

        Host detection prefers TILLANDSIAS_HOST_KIND (the forge sets it, and
        check-credential-channel.sh:66 already trusts it), falling back to uname.
        Deliberately coarse — the gate exists to keep a forge-only test off a laptop,
        not to model the full host taxonomy.

        litmus:forge-policy-binary-discoverability now declares `host_kind: forge` and
        is BOUND. On this host:

          [SKIP] litmus:forge-policy-binary-discoverability
                 Host-kind mismatch: needs forge, this host is linux

        That is the honest third answer. Bound-and-red said nothing about the product;
        unbound was silent, which is exactly what 660-ryhn is about.

        BOTH CONTROLS RUN, because a gate that skips everything would look identical to
        a gate that works:
          A. With TILLANDSIAS_HOST_KIND=forge the runner EXECUTES the test — and it
             fails, since this host has no /home/forge. The gate passes it through
             rather than skipping unconditionally, which is the property under test.
          B. A `host_kind: any` test (spec-traceability, 8/8) is unaffected.

        Full pre-build instant suite: 194 PASS, 0 FAIL, 174 skipped — one more skip than
        before, which is this test now reporting itself instead of being invisible.

        Also deduplicated litmus-bindings.yaml after merging windows-next: both hosts
        independently bound litmus:pickup-role-grammar-shape to ci-release during the
        660-ryhn work and git kept both lines. Only that one duplicate existed; the file
        now has none, and 137 specs still parse.
