packets:
  - packet_id: the-smallest-cited-synthesis-model-exceeds-the-quick-tier-budget
    order: 927-2q4w
    status: ready
    title: |
      The smallest model that satisfies the citation contract (7b) is too
      slow for the budget the pipeline gives it — so a host can have
      grounded synthesis or the quick tier, not both, and the timeout is
      misreported as a missing endpoint
    kind: enhancement
    pickup_role: any
    priority: p2
    desired_release: v0.5
    release_target: forge-local-experts-milestone
    capability_tags:
      - experts
      - inference
      - latency
      - fail-loud
    estimated_hours: 4
    deliverable: |
      A recorded decision plus its implementation, choosing among: (a)
      latency-aware tier classification — measure the synthesis endpoint's
      actual latency and classify tier from it rather than from the query
      text alone; (b) raised or env-tunable synthesis budgets per tier;
      (c) retrieval-only as the documented normal mode on hosts whose
      contract-satisfying model exceeds the budget, stated honestly in the
      agent prompt. Whichever is chosen, the timed-out producer keeps its
      own honest message (landed separately under 920-pxg6).
    context: |
      OBSERVED on darwin (tillandsias-91, M5, 2026-08-29, recorded on
      920-pxg6): qwen2.5:3b meets the quick-tier 3000ms budget but echoes
      0/6 retrieved keys — its prose never survives the only-if-used
      citation filter. qwen2.5:7b echoes 3/6 keys verbatim with a correct
      Sources line — but takes 10-24s per synthesis on that host, so every
      pipeline dispatch times out at the Lua-classified quick tier and the
      answer silently degrades to the cited retrieval-only digest. Tier is
      classified from the QUERY TEXT (tier.lua), not from measured endpoint
      latency, so the budget cannot adapt to the host's model reality.
      INFERRED: CPU-floor hosts (0.5b) are in the same regime with even
      lower ceilings; the fleet-wide answer must not regress the
      interactive latency of hosts that deliberately run tiny models.
    exit_criteria:
      - |
        On a host whose contract-satisfying model exceeds the quick budget,
        a covered question yields EITHER grounded synthesis within a
        deliberately chosen budget OR a retrieval-only answer whose mode is
        documented as normal for that host tier — never a silent timeout
        misattributed to configuration
      - |
        NEGATIVE CONTROL: a genuinely dead synthesis endpoint still
        produces the no-endpoint message, distinct from timed-out
    verifiable_closure: |
      The three retrieval-only producers (no-endpoint, prose-discarded,
      timed-out) each carry their own message under test, and the chosen
      tier/budget mechanism is exercised on one slow-model host and one
      CPU-floor host with recorded latencies.
