    title: |
      tillandsias_podman backend::tests::a_stalled_podman_fails_within_its_budget_and_names_the_operation red the land86 gate with "Text file busy (os error 26)": the test writes a stub podman and executes it at once, and a sibling test's fork between the write and the exec holds the file open for writing (ETXTBSY) — passes 6/6 alone, fails under the workspace run
    context: |
      Measured on the land86 relay, 2026-09-28: the gate's workspace step
      reported new-red=1 on this test; the transcript shows the stub's spawn
      failing with ETXTBSY. The podman crate's suite passed 6/6 run alone on
      the same tree. Classic Linux race: std opens files O_CLOEXEC, but a
      sibling thread's fork() between the write and the child's exec keeps an
      inherited write descriptor alive until that child execs, so executing
      the just-written stub returns ETXTBSY. Any test that writes an
      executable and runs it immediately can hit this under load.
    verifiable_closure: |
      cargo test -p tillandsias-podman passes 20/20 consecutive runs while a
      parallel load of other crates' tests runs (or the workspace run passes
      5/5), and a unit test pins the chosen mitigation (e.g. the stub is
      written to a temp name, synced, closed and renamed into place BEFORE
      any spawn in that test, or the spawn helper retries ETXTBSY with a
      short bounded backoff and names it in the error if it persists).
      PRE-FIX RESULT: intermittent — 1 red in the land86 workspace run.
