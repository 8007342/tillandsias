packets:

  - packet_id: vault-entrypoint-mounts-never-reach-existing-volumes
    order: 674-84bx
    status: ready
    priority: p3
    title: "vault entrypoint provisions mounts on FIRST boot only — additions silently never reach existing vault volumes"
    kind: enhancement
    deliverable: idempotent every-boot mounts pass in the entrypoint, or a loud version-marker refusal + documented Rust-side ensure convention
    depends_on: []
    pickup_role: linux
    capability_tags: [vault, entrypoint, upgrade, idempotence]
    estimated_hours: 2
    context: >
      Surfaced by the 606-bvnp vault-rungs slice (1141a72c): the vault
      entrypoint's mounts/CA section runs only on first boot (later boots
      exit before the token section), so anything added there silently never
      reaches a vault volume provisioned before the change. The SSH engines
      dodged it because the Rust-side ensure re-creates them host-side, but
      the trap remains armed for every future entrypoint addition. Either
      make the mounts pass idempotent on every boot (the enable_endpoint
      2xx|400 idiom already tolerates re-runs) or stamp a provisioning
      version in the volume and fail loud on mismatch.
    exit_criteria:
      - a mount/CA added to the entrypoint reaches a pre-existing vault volume on next boot (or the boot refuses loudly naming the gap), proven by a fixture
    events:
      - ts: "2026-08-11T00:15:00Z"
        event: filed
        summary: filed from the 606-bvnp vault-rungs completion report (finding 5).
