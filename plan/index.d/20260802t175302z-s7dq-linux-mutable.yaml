packets:
  - packet_id: mesh-persistent-storage-substrate-research
    order: 594-s4g4
    desired_release: v0.7
    title: "Research: transparent persistent storage across a mesh where most nodes are NOT always on"
    status: ready
    kind: research
    deliverable: plan/issues/ research doc + decision record
    depends_on: []
    pickup_role: any
    capability_tags: [research, storage, mesh, database, durability, vision]
    estimated_hours: 8
    outcome: >
      OPERATOR THINKING 2026-08-02, captured as research so it informs what we
      build now rather than being re-derived later: "I still don't know how to
      provide transparent persistent pervasive storage. I'm not sure if through a
      clustered nextcloud, or a single nextcloud in a clustered filesystem, or if
      I'll glob a filesystem elsewhere, since we'll likely need some CassandraDB,
      and/or PostgreSQL support. Our users don't need to know anything, they just
      prompt 'add a database' and it works."
      FOUR THINGS WORTH PINNING BEFORE ANY OPTION IS EVALUATED, because each one
      eliminates a candidate that otherwise looks reasonable.
      (1) ALWAYS-ON IS NOT DURABLE. The Pi5 is being adopted for uptime, not
      power, and those are different properties. A node that never reboots still
      loses everything when its storage dies. Conflating the two would put the
      only copy of a user's data on the machine chosen for being cheap.
      (2) NEXTCLOUD IS A FILE SYNC APPLICATION, NOT A STORAGE SUBSTRATE FOR
      DATABASES. Putting live Postgres or Cassandra data files under a syncing
      directory is not merely suboptimal — concurrent sync against files a
      database is actively writing corrupts them, and the corruption is usually
      discovered later, from a backup that also synced. NextCloud may still be
      right for USER DOCUMENTS; it must not be the answer for database state.
      Evaluate the two needs separately or the wrong one will decide both.
      (3) WITH ONE ALWAYS-ON NODE, REPLICATION HAS NOTHING TO REPLICATE TO. Every
      clustered option — Cassandra's quorum, Ceph, Gluster — assumes several
      nodes that are simultaneously up. A single Pi plus laptops that close is
      not that topology. So the honest first phase is ONE DURABLE NODE PLUS
      VERIFIED BACKUPS, and replication becomes available only when a second and
      third always-on node exist. Designing for a cluster that does not exist
      yet would produce something that neither works now nor is simpler later.
      (4) CASSANDRA AND POSTGRES ARE NOT INTERCHANGEABLE and should not be
      offered as if they were. Cassandra is AP — it tolerates partitions and
      suits many-node eventually-consistent workloads. Postgres is CP —
      single-writer, needing real durable storage and explicit failover. Which
      one a user gets should follow from what they asked for, not from which we
      wired first.
      HARDWARE CONSTRAINT THAT DECIDES A LOT: on a Pi 5, SD-card storage is a
      poor host for a database — write amplification and wear make sudden,
      total failure a realistic outcome rather than a tail risk. The Pi 5's PCIe
      lane and NVMe are the credible option, and that turns a storage decision
      into a hardware requirement the operator should know before buying.
      THE QUESTION USERS CANNOT BE ASKED BUT WILL BE DESTROYED BY IS BACKUP. A
      non-technical user who loses their application's database has lost
      something unrecoverable and will not have been in a position to prevent it.
      Under the vision's own standard — "we cannot let users risk things they do
      not understand" — durability and restore cannot be an option presented in a
      prompt. They must be automatic, and the RESTORE must be verified, not just
      the backup: an unverified backup is a belief, not a property.
    exit_criteria:
      - "the document separates USER DOCUMENT storage from DATABASE state storage and answers them independently"
      - "each candidate (clustered nextcloud, nextcloud on a clustered FS, remote/globbed FS, single durable node) is judged against a ONE-always-on-node topology, not an assumed cluster"
      - "a phase-1 design exists that works with exactly one always-on node, and states what changes when a second and third arrive"
      - "backup AND verified restore are specified as automatic, with the verification method named"
      - "the Pi 5 storage medium requirement (NVMe vs SD) is stated as a hardware precondition"

  - packet_id: add-a-database-one-prompt-capability-research
    order: 594-xev8
    desired_release: v0.7
    title: "Research: 'add a database' as a single prompt — what the user never has to know, and what we must therefore decide for them"
    status: ready
    kind: research
    deliverable: plan/issues/ research doc + decision record
    depends_on: [mesh-persistent-storage-substrate-research]
    pickup_role: any
    capability_tags: [research, ux, database, service-catalog, vision]
    estimated_hours: 6
    outcome: >
      OPERATOR GOAL 2026-08-02: "Our users don't need to know anything, they just
      prompt 'add a database' and it works."
      This is the service-catalog vision applied to stateful services, and it
      builds on existing work rather than restarting it: enclave-service-catalog-
      milestone (353), catalog-multi-service-compose (376) and
      web-share-release-milestone (373) already cover launching and composing
      enclave services. What is new here is STATE — a web container can be
      destroyed and recreated freely; a database cannot.
      EVERY QUESTION THE USER IS NOT ASKED IS A DECISION WE MAKE FOR THEM, and
      each should be written down as such rather than defaulted into: which
      engine, where it runs (the 24/7 node, presumably — but stated, not
      assumed), how it is reached from a web container, whether it is exposed
      beyond the enclave (it must not be), how credentials are minted and where
      they live, how it is backed up, how it is restored, and what happens when
      the node holding it is unreachable.
      THE ANSWER TO 'WHICH ENGINE' SHOULD FOLLOW FROM THE PROMPT, not from what
      is easiest to wire. A user asking for "a database" for a small web app
      wants Postgres semantics; nobody prompting in plain language is asking for
      eventual consistency. Offering Cassandra by default because the mesh story
      favours it would give users a database whose behaviour surprises them.
      CREDENTIALS ARE THE PART MOST LIKELY TO GO WRONG, given this project's
      history: a database provisioned by a prompt needs credentials that the web
      container can use and the agent cannot exfiltrate. The broker pattern
      already used for git (a component holds the credential, hands out
      capability) is the precedent to follow, not env injection — which put a
      GitHub token in podman argv for months (order 359, reversed 2026-08-01).
      DELETION IS THE DANGEROUS VERB. "Remove the database" from a
      non-technical user means "I'm done with this app", not "destroy the only
      copy of my data". Whatever the design, deletion of stateful services needs
      a different confirmation path than deletion of stateless ones — and
      probably a recoverable window rather than an immediate destroy.
    exit_criteria:
      - "every question the user is not asked is enumerated with the decision we make on their behalf and why"
      - "engine selection follows from the request, with the default justified against what a plain-language prompt actually means"
      - "credentials follow the broker pattern; no database credential reaches an agent lane as an environment variable"
      - "deletion of a stateful service is specified with a recovery window, distinct from stateless teardown"
      - "the design composes with 353/376/373 rather than introducing a parallel service mechanism"
