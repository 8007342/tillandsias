packets:
  - packet_id: image-rebuild-orphans-the-tag-the-installed-binary-launches-by
    order: 747-knbp
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    kind: bug
    title: "scripts/build-image.sh tags by the VERSION FILE while the launcher resolves by the INSTALLED BINARY's version — a rebuild silently deletes the tag every forge launch needs"
    deliverable: "a rebuild that cannot orphan the launch tag, or a launch that fails loud instead of DOA"
    pickup_role: linux
    capability_tags: [forge, images, version-skew, fail-loud, launch]
    estimated_hours: 2
    context: |
      REPRODUCED 2026-08-15 on tlatoani, by doing the ordinary thing: rebuilding
      the forge image so a source fix (743-y5wh) would reach running forges.

        installed binary            v0.4.260809.2
        VERSION file (checkout)     0.4.260812.1

      `scripts/build-image.sh forge` tags the result from the VERSION FILE:

        Aliases: tillandsias-forge:v0.4.260812.1, tillandsias-forge:latest

      The launcher resolves the image by the RUNNING BINARY's version —
      `forge_image_tag(version)` -> `versioned_image_tag("forge", version)` ->
      `localhost/tillandsias-forge:v<version>` (crates/tillandsias-headless/
      src/main.rs:1874, called at :5167, :5549, :11606). So it asks for
      `v0.4.260809.2`.

      That tag no longer existed after the rebuild:

        podman image exists localhost/tillandsias-forge:v0.4.260809.2
          -> MISSING

      The rebuild had moved the tag onto the new image under a DIFFERENT version
      alias and left nothing at the old one. Any forge launch from the installed
      binary would have been dead on arrival, and the only reason it was caught
      is that this cycle checked the tag before launching rather than after.

      WHY THE SKEW IS THE NORMAL CASE, not an edge case: the installed tray is
      whatever the operator last installed, while VERSION advances with every
      release bump on the branch. Any developer host that rebuilds an image from
      a checkout newer than its installed binary — which is what "rebuild the
      image so my fix is live" means — lands exactly here.

      The Start-Of-Day gate already knows about this class: "rebuild forge images
      at the installed VERSION before launching any forge (version-skew DOA)"
      (skills/meta-orchestration, order 718-nuvm). But that is prose addressed to
      an agent, and `build-image.sh` does nothing to honour it — it neither reads
      the installed version nor warns that it is about to orphan the tag the
      launcher needs. A guard only an attentive agent honours is a suggestion.

      MITIGATED LOCALLY, not fixed: `podman tag
      localhost/tillandsias-forge:latest localhost/tillandsias-forge:v0.4.260809.2`
      restored the launch path on this host and it now points at the NEW image.
      Every other host that rebuilds an image will hit this again.
    outcome: |
      Rebuilding an image cannot leave the installed binary without a resolvable
      forge image, and a launch that cannot resolve one says so instead of dying.
    exit_criteria:
      - "After `scripts/build-image.sh <img>` on a host whose installed binary version differs from VERSION, the tag the launcher resolves still points at a real image — demonstrated by rebuilding under a deliberate skew, not argued."
      - "EITHER build-image.sh also aliases the installed binary's version (reading it from the installed tray, not from VERSION), OR the launcher falls back to `:latest` with a loud named warning, OR the launch fails with a verdict naming the missing tag and the command that fixes it. Any of the three, chosen once."
      - "NEGATIVE CONTROL: a host where the installed binary and VERSION agree must gain no extra tags and no warning — the common case stays silent."
      - "An executable check covers it, so the guarantee is not prose in a skill (the existing Start-Of-Day sentence did not prevent this)."
    notes: |
      Do not fix this by pinning build-image.sh to `:latest` only. The versioned
      alias is what makes a host's image set auditable, and the release path
      depends on it.

      Check whether the same mismatch exists for the other images build-image.sh
      knows (`web`, `proxy`, `git`, `inference`) — the tagging code is shared, so
      probably yes, and a vault or router image that cannot be resolved fails in
      a much less obvious place than the forge.
    events:
      - type: filed
        ts: "2026-08-15T01:10:00Z"
        host: linux_immutable
        agent_id: tlatoani-linux-immutable-20260814
        summary: |
          Reproduced by rebuilding the forge image to deliver a source fix: the
          rebuild tagged v0.4.260812.1 from VERSION and left the installed
          binary's v0.4.260809.2 tag pointing at nothing. Repaired locally with
          podman tag; filing the durable fix.
