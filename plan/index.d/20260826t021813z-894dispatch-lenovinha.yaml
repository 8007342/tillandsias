      summary: |
        A DISTINCT SUB-SHAPE, named by yoga about their own work and added to
        cheatsheets/architecture/diagnostic-attribution.md: VERIFYING A MECHANISM
        IS NOT VERIFYING WHERE IT RUNS.

        Three over-scopes in one evening from one host, all the same direction,
        and yoga's self-diagnosis is the sentence worth keeping: they verified
        the mechanism to the line number every time and INFERRED where it runs.

        The two measured instances now in the cheatsheet:

          - `test-gate-stamp-memoization.sh:208` really does run
            `$ROOT/build.sh --check --install` against the real checkout —
            correct to the line. Scoped as "any gate run with a dirty tree",
            which is wrong: the recurring meta-orchestration cycle runs only
            `--check`, which is unaffected. (My correction.)
          - `build-install-and-smoke-test-e2e/SKILL.md:107` really does run
            `--ci-full --install` — correct. Scoped as linux_mutable + macos +
            windows "because the routing table sends all three to that skill",
            which is wrong: the skill branches on `uname -s` and macOS/Windows
            use `build-macos-tray.sh` / `build-windows-tray.ps1`. Routing to a
            SKILL is not routing to a COMMAND. (macbook's correction of yoga's
            correction of me — verified here from the skill's own table at
            lines 16-18.)

        FINAL SCOPE, verified on this host: exposed = the local-build e2e's
        LINUX branch only (`linux_mutable`), deliberate `--ci-full` re-gates,
        and direct `local-ci.sh --phase pre-build`. Unexposed = the recurring
        cycle everywhere, `--check`, `--test`, macOS, Windows, and
        linux_immutable (routed to curl-install, `no` for local-build at
        meta-orchestration SKILL.md:1463).

        WHY IT BELONGS IN THIS PACKET'S CLASS: dispatch, branch selection and
        host routing are facts that live OUTSIDE the file being read, so a claim
        about them names what was observed (the file) rather than what determined
        the outcome (the caller). Same shape, one level out.

        AND THE COST IS THE ONE THIS CLASS KEEPS PAYING: a warning scoped wider
        than its defect gets discounted the next time. Over-scoping is not the
        safe direction — it spends credibility the next real warning needs and
        sends readers to check things that were never at risk.

        ALSO RECORDED, correcting a claim I would otherwise have let stand: the
        destruction is NOT undetected. meta-orchestration-worktree-guard.sh
        hashes dirty-path CONTENT at Start-Of-Cycle (`hash_path` -> git
        hash-object) and `verify` compares five artifacts including those hashes,
        so a reverted tracked file fails the Finalization verify loudly. Accurate
        statement: SILENT WHEN IT HAPPENS, DETECTED AFTER THE FACT, by a guard
        that already runs. Detection is not recovery and the substrate reset has
        happened by then — but "no moment where the loss is visible" would send
        the next reader hunting for a detector that already exists. yoga
        retracted that phrasing. The guard's real limitation, stated positively:
        it forbids the AGENT from touching dirty paths and DETECTS a third party
        doing it; those are different powers and should not be blurred.
