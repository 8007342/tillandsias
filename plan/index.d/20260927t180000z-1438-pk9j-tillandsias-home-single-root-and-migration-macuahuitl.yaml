      - 'legacy arm: a seeded ~/.cache/tillandsias with vault-data, models and packages is migrated to vault/data, downloads/models and cache/packages with equal digests and the legacy root is removed (pre-fix result: FAILS — no migration exists)'
      - 'second-run arm: a second launch moves nothing and prints no migration line (pre-fix result: FAILS)'
      - 'mixed arm: an interrupted migration (half moved) converges without prompting and names any .legacy-<ts> copy (pre-fix result: FAILS)'
      - 'seam arm: with TILLANDSIAS_HOME=/tmp/x every path the command touched is under /tmp/x (pre-fix result: FAILS — XDG and ~/.cache are consulted)'
      - 'cargo test -p tillandsias-core home:: passes (pre-fix result: FAILS — module absent)'
    verifiable_closure: |
      bash scripts/test-tillandsias-home-layout.sh exits 0 with all five arms and cargo test -p tillandsias-core home passes; pre-fix: both FAIL.
    depends_on: []
    notes: |
      size: L  implementer_tier: opus
      Cross-crate (core + headless + podman), it moves the Vault store's bytes and it is the
      seam every destructive fixture will rely on — a resolver that answers a real home under a
      fixture is the 1401-p3k7 incident again. Do not run the migration against your own real
      home while developing; use TILLANDSIAS_HOME and a temp HOME. macOS and Windows migration
      (~/Library/*, %LOCALAPPDATA%, %APPDATA%) is delivered by 1437-av8u and 1437-3iux on top of
      this resolver; keep the legacy-root table in core so they add rows, not copies.
    next_action: 'write tillandsias_core::home with the resolver and the legacy-root table, then make init_cache_dir and cache_root call it and run the fresh arm to see what still lands outside the root'
