    title: |
      One root: every Tillandsias-owned file lives under ~/.tillandsias/ ({config,downloads,vault,cache,state,vm}) resolved through one TILLANDSIAS_HOME-honouring resolver in tillandsias-core; XDG, ~/Library and %LOCALAPPDATA% roots become legacy inputs that a first launch migrates once (rename or copy-verify-delete, idempotent, converges from any mixed state)
    context: |
      Spec: host-state-lifecycle "Everything Tillandsias owns on a host lives under
      ~/.tillandsias/, and a first launch migrates the legacy roots there" (all four
      scenarios); cache-recovery-mechanism "Cache Directory Lifecycle and Paths" (superseded XDG
      text); environment-runtime "Global and per-project configuration" (config.toml moves);
      inference-container (models at downloads/models). Operator ruling 2026-09-27, verbatim:
      "keep all our configs and downloaded files in ~/.tillandsias/ for a user to easily find
      them, snoop around, and wipe them afterwards"; and "the ephemeral/idempotent approach
      should take care transparently of launching correctly from any state."

      Today (audit in plan/issues/operator-directives-reset-survivors-and-harness-bypass-2026-09-27.md):
      three resolvers disagree — init_cache_dir (XDG or ~/.cache, with a writable probe),
      tillandsias_core::cache_root::cache_root (XDG or ~/.cache or temp), tillandsias_core::
      config::cache_dir (dirs::cache_dir: ~/.cache, ~/Library/Caches, %LOCALAPPDATA%) — plus
      data_dir/config_dir/state_dir; the Windows tray uses %LOCALAPPDATA%\tillandsias\{cache,wsl,
      state,logs}; the macOS tray uses ~/Library/Application Support/tillandsias and
      ~/Library/Caches/tillandsias.

      Do, Linux + core (platform trays are slices of 1437-av8u and 1437-3iux, which depend on
      this row): (1) tillandsias_core::home: home() honours TILLANDSIAS_HOME, defaults to
      ~/.tillandsias (%USERPROFILE%\.tillandsias on Windows, /root/.tillandsias in a guest);
      typed accessors config_dir(), downloads_dir(), vault_dir(), cache_dir(), state_dir(),
      vm_dir(); every existing resolver becomes a thin call into it (init_cache_dir ->
      cache_dir(); cache_root -> cache_dir(); models -> downloads_dir()/models; vault-data ->
      vault_dir()/data; vault-audit -> vault_dir()/audit; config.toml -> config_dir()/config.toml;
      runtime assets -> cache_dir()/runtime/<ver>; logs -> state_dir()/logs); (2) migrate():
      for each legacy root that exists, move each KNOWN child to its home by the table in the
      spec (rename on one filesystem, copy-verify-delete otherwise), leave an existing
      destination alone and remove the legacy copy only when byte-identical (else keep as
      <name>.legacy-<ts> and print it), remove the emptied legacy root, print one line per
      moved child, run before anything else on every launch, idempotent — a second run moves
      nothing and prints nothing; the Vault store moves as bytes (no re-init) and the keyring
      share is untouched; (3) unit tests in core for the resolver and for migrate() over a
      fixture tree (fresh, legacy, mixed/interrupted, second run); (4) fixture
      scripts/test-tillandsias-home-layout.sh: hermetic TILLANDSIAS_HOME + a seeded legacy
      ~/.cache/tillandsias under a temp HOME; run the binary's migration entry (a --diagnose
      is enough to trigger it); assert the layout, the digests, the emptied legacy root, and
      that a second run is silent; negative arm: nothing written outside TILLANDSIAS_HOME;
      bind as litmus:tillandsias-home-layout; (5) update the paths in the cheatsheets that
      name ~/.cache/tillandsias (grep) and in announce_reset_plan's preserved list.

      Consumers filed against this row: 1437-jdgg (manifest at downloads/manifest.json),
      1437-evzi (uninstall removes the root or prompts), 1437-2pix (config/containers/),
      1437-6ghz (config/wslconfig.toml), 1437-av8u and 1437-3iux (platform migration slices).
    exit_criteria:
