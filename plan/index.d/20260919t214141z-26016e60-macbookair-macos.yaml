        FIFTH INSTANCE, AND THE STRONGEST CASE YET FOR TOOLING OVER CARE, because it contains a REPEAT of a mistake this host had already made and already written down the same night.

        ONE ROW — 1279-a7b6, a two-file change to scripts/timing-log.sh and one new fixture — COST THREE GATE ROUND-TRIPS TO CHEAP FILE-LOCAL CONVENTIONS on tlatoanis-macbook-air 2026-09-19:

          gate 14  ~1190s  `cargo fmt --all` — inserted Rust was not rustfmt-clean
          gate 15  ~1200s  1087-h2z9 — an interpreter the policy bars, and the scan
