      - "all six children complete"
      - "LIVE (Linux, no tray): launch a CLI lane, publish a static preview, kill the terminal with SIGKILL; with TILLANDSIAS_IDLE_BUDGET_LANE_SECS=60 and TILLANDSIAS_IDLE_BUDGET_PREVIEW_SECS=180 the forge is gone within 2 min and the preview within 4 min, each with a verdict line; pre-fix result: FAILS (all three containers still running an hour later)"
      - "LIVE: from a new lane of the same project, publish_local returns running on the same URL and serves a file edited after the reap; pre-fix result: FAILS (not_running error path, or the stale container)"
    unscoreable: "an epic; its closure is the children's fixtures plus the two live arms above, recorded as events on this row"
    next_action: >
