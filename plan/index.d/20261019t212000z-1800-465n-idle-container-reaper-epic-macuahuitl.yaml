# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by macuahuitl, 2026-10-19, from the operator's live finding: a
# terminal was killed uncleanly and left its containers hanging; nothing in
# the tree would ever stop them. Operator direction (verbatim in essence):
# watchdogs that gracefully shut down leftover containers when idle; agents
# told "idle containers get terminated"; local serving idempotent (a reaped
# preview is relaunched on demand); grace >= 30 min, ~3 h for baby web
# containers; shared logs aware of the reap afterwards.
# Epic 1800-465n and its six slices. Change:
# openspec/changes/idle-container-reaper/ (proposal, design with the survey
# of existing mechanisms, tasks, deltas on container-idle-reaper,
# local-web-preview, runtime-diagnostics-stream, tray-progress-and-icon-states).
# Code is cited by symbol, never by line.
packets:
  - packet_id: idle-containers-are-reaped-by-a-watchdog-that-outlives-the-launcher-with-per-class-grace-and-local-serving-relaunches-on-demand
    order: 1800-465n
    status: ready
    kind: epic
    priority: p1
    desired_release: v0.5
    pickup_role: any
    size: L
    implementer_tier: sonnet
    capability_tags: [containers, lifecycle, reaper, watchdog, forge, web-preview, router, logging, tray, linux, macos, windows, epic]
    estimated_hours: 4
    related: [1776-ondm, 1779-sq9g, 1784-skfj, 1792-48yg, 1793-wggq, 1723-2fiq, 1560-73zh]
    owned_files:
      - openspec/changes/idle-container-reaper/
    title: |
      EPIC — every container Tillandsias creates belongs to a class with an idle budget (lane/forge 30 min, web preview 3 h, project infra 30 min after its last lane, core never while owned); a watchdog that outlives any one launcher (tray liveness supervisor, a transient systemd --user timer for tray-less CLI lanes, the guest headless on macOS/Windows) detects orphans (owner pid gone) and stops idle containers gracefully; a reaped preview is a defined `state: reaped` that publish_local/service_reload relaunch on the current source; agents are told idle containers get terminated; the reap is a gc.reap curated global event; today a killed terminal leaves forge, git mirror and preview running forever
    context: |
      LIVE (operator, 2026-10-19): a terminal was killed uncleanly and its
      containers stayed up with nothing scheduled to stop them.
      SOURCE READ (macuahuitl, 2026-10-19, origin/linux-next 4e4fd5925):
      every cleanup runs from the launcher's own exit path or the tray's
      shutdown — `cleanup_shared_stack_if_no_running_forge`,
      `cleanup_stack_containers`, `local_web_preview::cleanup_departed_lane`,
      the tray-ux startup sweep. A killed launcher reaches none of them.
      The only idle clock (`WindowRegistry::is_idle_timeout`, 24 h) has no
      caller outside tests. `SHARED_STACK_SCOPES` knows Core/LaneScoped
      only; no container carries a class, owner pid or budget. The
      `[liveness]` supervisor re-ensures Core containers and never removes.
      `reload_inner` (1723-2fiq) already recreates an exited preview from
      its labels — the relaunch primitive — but a REMOVED preview answers
      `not_running: ...`, which agents read as an error.
      `forge-diagnostics-scope` names `gc.reap` as a GlobalEvent kind;
      nothing in crates/ produces it (1779-sq9g). Full survey with gaps:
      openspec/changes/idle-container-reaper/design.md "What exists".
      DESIGN (binding on every child): ONE class table `CONTAINER_CLASSES`
      next to `SHARED_STACK_SCOPES`; labels tillandsias.class/.owner-pid/
      .launched-at/.lane on every launch; idle per class measured from
      real activity (lane: PTY/control-wire/MCP/exec/window; preview:
      router last request); orphan = owner pid dead and lane unadopted,
      budget still applies; one idempotent lock-protected sweep with one
      verdict line per container; graceful stop per class; a reap record
      for previews so status explains and relaunch rebuilds; budgets
      env-overridable for fixtures only; no persistent service or cron.
      LOG ALIGNMENT FOLLOWS 1779-sq9g: slice 1799-dav6 produces gc.reap
      through forge_diagnostics::GlobalEvent once it lands; until then the
      verdict goes through tillandsias-logging as a container stop event.
    children:
      - 1799-haat
      - 1799-qgu5
      - 1799-xdcx
      - 1799-mvmc
      - 1799-dav6
      - 1799-6yyp
