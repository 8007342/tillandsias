         call — cannot make either fixture red. yoga measured the behaviour
         directly on a FREE lock: bare acquire records the invoking shell
         (3551919, dead now) while the harness (8462) lives.

      2. advance-work-from-plan NEVER MENTIONED THE LOCK. Measured before yoga's
         25ec242dc: 0 mentions of checkout-lock|CYCLE_HOLDER_PID there against 4
         in meta-orchestration. Worker hosts took NO checkout lock at all — not a
         broken one. 943-7dn5's shape: the instruction lived only with the
         coordinator. yoga has since landed the section; the FIXTURE half remains.

      3. THE SAFE FIX HAS A MEASURED TRAP ON THE OTHER SIDE. If the script
         resolves the harness pid itself rather than trusting callers, then
         dir_lock_live()'s line 160 becomes binding: on a session harness the
         pid-liveness escape can NEVER fire, so correctness rests entirely on the
         `attested` marker and STALE_S=10800. That file records a MEASURED
         over-hold on macuahuitl 2026-08-26T03:38Z — the hourly fire refused by
         its own $PPID, a live `claude` 07:56:39 old that had already attested.

      THE TWO FINDINGS ARE ONE FIX SEEN FROM OPPOSITE ENDS: too shallow an anchor
      releases at the first tool call; too deep an anchor holds for three hours.

      NOTE, load-bearing and easy to flatten by accident: pid_is_self_or_ancestor
      returns 2 for COULD-NOT-DETERMINE, distinct from "no", for a measured MSYS
      reason. Collapsing that tri-state to a boolean reintroduces the class this
      fleet spent 2026-09-06 dismantling — a probe that cannot answer returning
      the answer that looks like data.
