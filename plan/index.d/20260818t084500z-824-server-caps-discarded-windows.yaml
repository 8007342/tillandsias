# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by windows (yolanda), 2026-08-18T08:45Z.
#
# Found underneath 823-u5zf while trying to implement it: the feature-detection
# path that packet depends on did not exist. Fixed in the same commit; filed
# because the defect is independent of 823-u5zf and outlives it.

packets:
  - packet_id: handshake-discarded-the-capability-list-the-wire-exists-to-advertise
    order: 824-vr2d
    status: completed
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "Client::handshake() destructured server_caps away, so the wire's own rule — hosts MUST feature-detect on HelloAck.server_caps — could not be followed by any caller"
    deliverable: "Client records the guest's advertised capabilities and exposes server_caps() / supports(cap), failing closed before handshake"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [rust, vsock, control-wire, fail-loud]
    context: |
      FOUND 2026-08-18 while implementing 823-u5zf, which depends on exactly
      this path.

      `crates/tillandsias-host-shell/src/vsock_client.rs::handshake()` matched
      `ControlMessage::HelloAck { wire_version, build_version, .. }` and
      returned `(wire_version, build_version)`. The `..` swallowed
      `server_caps`.

      That silently contradicted a rule the wire states in its own source.
      `CAP_EXEC_ARGV_VECTOR` (control-wire/src/lib.rs:88-99) documents:

        "Hosts MUST feature-detect on this before sending that shape: a guest
         predating it refuses the request, and this fleet routinely runs a host
         newer than the guest binary staged beside it. The detection path is the
         one metrics already uses — read `HelloAck.server_caps`, never compare
         wire versions."

      No caller could read `HelloAck.server_caps`, because the only client that
      performs the handshake threw it away. The capability constants, the
      advertisement and the documented rule all existed; the one link that would
      let a host act on them did not. A host following the instruction to the
      letter would have found no API to follow it with.

      This is the same shape this milestone keeps collecting: a signal that is
      produced, documented, and unreachable — indistinguishable from a guest
      that advertises nothing.

      FIXED NON-BREAKINGLY. Sixteen callers across tillandsias-host-shell,
      tillandsias-macos-tray and tillandsias-windows-tray call `.handshake()`,
      so widening its return type would have broken all of them for a value
      fifteen do not want. The client now records the list and exposes
      `server_caps()` and `supports(cap)`.

      FAILS CLOSED, deliberately: an un-handshaked client reports every
      capability ABSENT, so a caller that forgets to handshake takes the
      conservative path rather than sending a shape the guest may refuse. The
      alternative — treating "not yet asked" as "supported" — would turn a
      forgotten handshake into a runtime refusal on the guest, which is the
      harder failure to read.

      Two tests: an advertised capability survives the handshake and is readable
      through `supports()`, and capabilities report absent before the handshake
      has run. The in-crate fake server now advertises CAP_EXEC_ARGV_VECTOR so
      the first test asserts against a real constant rather than a literal.
      8/8 vsock_client tests green; ./build.sh --check green.

      NOT CLAIMED: that this completes 823-u5zf. It removes that packet's
      unstated prerequisite. The Windows tray still flattens argv into
      `bash -lc`, and argv_survives_wt_reparse and wt_safe_title are still live.
    verifiable_closure: "a capability advertised by the guest is readable through Client::supports() after handshake, and reports absent before it"
    evidence:
      - "crates/tillandsias-host-shell/src/vsock_client.rs — server_caps field, capture in handshake(), server_caps()/supports() accessors"
      - "handshake_succeeds_against_fake_unix_server asserts CAP_EXEC_ARGV_VECTOR is readable; capabilities_are_absent_before_handshake pins fail-closed"

