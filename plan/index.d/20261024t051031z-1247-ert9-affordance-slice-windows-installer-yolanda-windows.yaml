    context: |
      Picked by yolanda-windows at the coordinator's request (2026-10-24) as the Windows-scoped 1247-amcu slice. Census of the Windows surface: scripts/*.ps1 carries 5 distinct verdict tokens (build-windows-tray.ps1, sign-windows-artifact.ps1, already with partial reasons) and 37 throw/Die/exit sites; crates/tillandsias-windows-tray carries 3 refusals, each already naming what to pass. The installer is ranked first because END USERS hit it before anything else (prompt-to-app onboarding), not agents reading a gate log.
      Its ten Die sites (install-windows.ps1:236-1061): six already say what to do (update PowerShell, 64-bit Windows, check the connection and retry, the download was damaged so retry). Four do not: :790 "This Tillandsias release is incomplete", :913 "The downloaded Tillandsias does not start (exit N)", :959 "failed its self-check (exit N)", :1061 "could not finish setting up (exit N)" — each names a log and no next step.
      The messages are END-USER text (check-installer-end-user-output.lua and 1639-8gfw keep detail in the log), so the affordance is plain words and never an internal token, a branch name or a developer command.
    exit_criteria:
