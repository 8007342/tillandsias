# WAVE PROVENANCE: a 4-lens multi-agent audit (each lens adversarially verified)
# of the operator's ~/src-vs-~/claudia checkout-collision hypothesis, run
# 2026-08-12 immediately after 694-mhz8 was verified by cross-restart proof.
# The hypothesis was PARTLY RIGHT and in a way that matters: ~/src cannot touch
# vault-data directly, but it IS the sole delivery channel for the guest binary
# that contains the vault logic. Everything below concerns credential DURABILITY
# after 694-mhz8 — none of it refutes that fix; all of it can re-arm the same
# loss by a different route.
packets:

  - packet_id: tray-launch-overwrites-cli-seeded-credentials
    order: 701-g98y
    status: ready
    desired_release: v0.5
    priority: p0
    title: "Launching the GUI tray after a CLI --github-login can overwrite the freshly seeded credentials with a STALE Keychain epoch"
    kind: bug
    deliverable: the host never delivers credentials older than the guest's current epoch
    depends_on: []
    pickup_role: macos
    capability_tags: [macos, vault, credentials, keychain, durability, p0]
    estimated_hours: 4
    context: >
      FOUND 2026-08-12, minutes after the credential seed was verified durable on
      this host. It threatens that exact result.
      A CLI-driven `tillandsias-tray --github-login` never delivers its handover
      to the macOS Keychain: it sets PENDING_HANDOVER in the one-shot process,
      which then exits, so the guest files on rootfs.img become the only copy of
      the new epoch's share and root token. The host Keychain still holds the
      PREVIOUS epoch's values.
      When the GUI tray next connects, `set_in_vm_credentials`
      (crates/tillandsias-headless/src/vault_bootstrap.rs:75-102) delivers those
      stale Keychain values into the guest and OVERWRITES
      `fallback_vault-root-token-v1`. The guest then holds a root token from a
      dead epoch against a Vault initialized in the current one.
      OPERATIONAL CONSEQUENCE RIGHT NOW: this host has a freshly seeded,
      restart-durable token that was written by a CLI login. Clicking the tray
      may replace it with a stale epoch's credentials. Until this is fixed, do
      not treat "the token is durable" as invariant across a tray launch —
      re-verify with `--list-cloud-projects` after the first tray start.
      MITIGATING FACT worth checking before designing the fix: a root-token
      mismatch ALONE is self-healing (the login path re-mints from a valid
      share) and degrades to a loud OPERATOR ACTION REQUIRED rather than a wipe.
      The dangerous combination is stale token PLUS a share that no longer
      matches.
    outcome: >
      A tray launch after a CLI login either delivers current credentials or
      delivers nothing — never an older epoch over a newer one.
    exit_criteria:
      - "the CLI login path persists its handover where the tray will read it, or the tray refuses to deliver credentials whose epoch is older than the guest's"
      - "an epoch/generation marker makes 'older than the guest' decidable rather than inferred"
      - "a test: CLI-login, then start the tray, then read secret/data/github/token — the token must still resolve"
      - "a NEGATIVE CONTROL: a genuinely NEWER host epoch must still be delivered, so the fix cannot degrade into never delivering credentials"

  - packet_id: set-in-vm-credentials-omits-the-share-fallback
    order: 701-se6x
    status: ready
    desired_release: v0.5
    priority: p1
    title: "The 694-mhz8 asymmetry exists at a SECOND site: set_in_vm_credentials writes the token fallback and never the share fallback"
    kind: bug
    deliverable: the delivered Shamir share is persisted wherever the wipe predicate looks for it
    depends_on: [vault-partial-init-guard-inverts-inside-the-guest]
    pickup_role: any
    capability_tags: [vault, credentials, guest, fail-loud]
    estimated_hours: 2
    context: >
      694-mhz8 was exactly this bug at the fresh-init site: the guest wrote
      `fallback_vault-root-token-v1` and never
      `fallback_vault-shamir-share-v1`, so `has_shamir_share_in_keyring()` was
      permanently false inside the guest and the partial-init guard wiped a
      healthy Vault every bootstrap. The same asymmetry survives at
      `set_in_vm_credentials`
      (crates/tillandsias-headless/src/vault_bootstrap.rs:75-102), which
      persists the delivered ROOT TOKEN and not the delivered SHARE.
      CONSEQUENCE: if the guest ever loses only the share file, a macOS tray
      holding a perfectly good share in the Keychain delivers it, the guest uses
      it in memory, and still does not satisfy the wipe predicate — so the next
      launch wipes an intact Vault. The host had the evidence and the guest
      threw it away.
      RELATED FRAGILITY, same area, worth fixing together: the share fallback
      write is best-effort with the error discarded, so one failed 30-byte write
      (ENOSPC, a non-writable cache dir, or a write lost to an unclean VM stop)
      silently re-arms the 694 wipe. 694 removed the permanent failure; it did
      not make the remaining single point of evidence robust or loud.
    outcome: >
      Any Shamir share the host delivers is recorded where the wipe predicate
      reads, and a failure to record it is loud rather than silent.
    exit_criteria:
      - "set_in_vm_credentials persists the delivered share to the same fallback path the predicate consults"
      - "a failed fallback write is surfaced rather than discarded — a silent failure here re-arms a credential-destroying wipe"
      - "a test delivers a share with the guest file absent and asserts the next bootstrap does NOT wipe"
      - "a NEGATIVE CONTROL asserts a genuine partial init (no share anywhere) still wipes, so the guard keeps working"

  - packet_id: guest-binary-staging-is-last-writer-wins-and-invisible
    order: 701-kgvk
    status: ready
    desired_release: v0.5
    priority: p1
    title: "Guest-binary staging is last-writer-wins on one $HOME path, silently downgradeable, and macOS has no skew detection"
    kind: bug
    deliverable: staging that refuses a downgrade, plus an observable guest/host version
    depends_on: []
    pickup_role: macos
    capability_tags: [macos, vz, guest-binary, staleness, observability]
    estimated_hours: 5
    context: >
      THIS IS THE OPERATOR'S COLLISION HYPOTHESIS, CORRECTED. ~/src cannot reach
      vault-data (that mounts at /home/forge/src while vault-data resolves under
      HOME=/root), but it IS the sole delivery channel for the guest binary that
      CONTAINS the vault logic. `stage_embedded_guest_binary()`
      (crates/tillandsias-macos-tray/src/guest_binary.rs:55-81) copies from the
      running .app's Contents/Resources/guest to
      `$HOME/src/.tillandsias/guest-bin/tillandsias-headless`, and the guest's
      fetch-headless.sh (crates/tillandsias-vm-layer/src/vz.rs:539-555) installs
      the staged file over /usr/local/bin/tillandsias-headless UNCONDITIONALLY
      on every boot, BEFORE the "already installed" short-circuit.
      THREE WAYS THIS PUTS A PRE-694 BINARY BACK IN THE GUEST:
      (1) The staging path is keyed only on $HOME, so every tray build on the
      host writes the same file and last-writer-wins. An OLDER Tillandsias.app
      started later silently downgrades the guest, and the downgrade is sticky
      across reboots and even Reset guest until a newer bundle re-stages. This
      host escaped only because the stale /Applications bundle had been deleted
      earlier the same evening.
      (2) Running the tray OUTSIDE a .app (target/release/tillandsias-tray
      --provision / --github-login) stages NOTHING — the dev fallback to
      dist/Tillandsias.app is unreachable because bundle_resource_candidate()
      returns early in the current_exe() branch — and 5 of 6 entry points warn
      about none of it.
      (3) With nothing staged and no prior binary, the guest curls the LATEST
      PUBLISHED RELEASE, which has no relationship to the local checkout and
      predates a56cbbd1.
      AND IT IS INVISIBLE: the only integrity gate compares the VERSION string,
      which does not roll between builds, and the macOS tray discards the
      handshake's guest version — so there is no log line and no --diagnose
      field for guest/host skew. Tonight's 16:44-vs-21:59 skew had to be found
      by hashing files by hand.
    outcome: >
      A guest cannot be silently downgraded, and the running guest's provenance
      is observable.
    exit_criteria:
      - "staging refuses to replace a newer staged binary with an older one, or records the swap loudly; the identity compared must roll per build, not per VERSION string"
      - "--diagnose reports the running guest binary's identity and whether it matches the host bundle's"
      - "a tray invocation that cannot stage (non-bundled run) says so instead of proceeding silently"
      - "a NEGATIVE CONTROL asserts a legitimate UPGRADE still stages, so the refusal cannot degrade into never updating"

  - packet_id: guest-fetch-unit-and-build-flag-latent-wipe-traps
    order: 701-iu9b
    status: ready
    desired_release: v0.5
    priority: p2
    title: "Two latent traps that re-arm the vault wipe: an unordered fetch unit on a nofail mount, and a cfg-gated always-true wipe predicate"
    kind: bug
    deliverable: ordering on the share mount, and a pin preventing the stub predicate from shipping
    depends_on: []
    pickup_role: any
    capability_tags: [vault, systemd, cfg, latent]
    estimated_hours: 3
    context: >
      Both surfaced by the 2026-08-12 collision audit; neither is firing today,
      both silently re-arm 694-mhz8's failure.
      TRAP 1 — ORDERING. tillandsias-headless-fetch.service
      (crates/tillandsias-vm-layer/src/vz.rs:588-592) orders itself only
      After=network-online.target / Before=tillandsias-headless.service. It has
      no RequiresMountsFor=/home/forge/src and no After on the virtiofs mount,
      and the fstab entry (vz.rs:529) uses `nofail`, which per systemd.mount(5)
      removes the ordering before local-fs.target. So a boot where the oneshot
      runs before /home/forge/src is mounted finds no staged file, falls through
      to the "already installed" short-circuit, and silently keeps the previous
      guest binary — which may predate the vault fix. Verified as a code-shape
      claim; NOT yet observed firing, and the audit could not confirm systemd's
      actual ordering at runtime.
      TRAP 2 — BUILD FLAG. `has_shamir_share_in_keyring()` has a
      `#[cfg(not(feature = "vault"))]` variant returning false unconditionally
      (vault_bootstrap.rs ~:1162). With that build, `is_partial_init` is true
      whenever the data volume exists and the wipe becomes unconditional again.
      Today the guest is built with the feature on, but nothing pins it, and the
      694 tests exercise write_vm_credential_fallbacks rather than the predicate
      under the stub cfg — so the tests would stay green while the wipe returned.
    outcome: >
      Neither a boot-ordering race nor a build-flag change can silently restore
      the credential-destroying wipe.
    exit_criteria:
      - "the fetch unit is ordered after the share mount, or it fails loudly when the share is absent instead of silently keeping the old binary"
      - "a check pins that the guest binary is built with the vault feature enabled, failing the build if the stub predicate would ship"
      - "a test exercises the wipe predicate under the stub cfg and documents the intended behaviour there"
