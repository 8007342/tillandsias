      summary: |
        FINDING, separate from this row's fix: a forge's GLOBAL core.hooksPath makes a bare scratch remote IGNORE its own hooks/ directory. In this forge, `git config --show-origin --get-all core.hooksPath` reads file:/home/forge/.gitconfig /home/forge/.cache/tillandsias/git-hooks. A bare repo made with `git init --bare` inherits that, so a fixture that writes <bare>/hooks/pre-receive to make the scratch remote refuse a push SILENTLY NEVER RUNS IT in a forge. The push succeeds, and the arm either fails for the wrong reason or, worse, passes while testing nothing. MEASURED while building this row's fixture arm 7b: the marker push succeeded against a pre-receive that should have refused it; pinning `git -C <bare> config core.hooksPath <bare>/hooks` made the hook fire. Any other fixture relying on a bare remote's server-side hooks (pre-receive, update, post-receive) is suspect in the forge regime and may deserve a sweep row.
