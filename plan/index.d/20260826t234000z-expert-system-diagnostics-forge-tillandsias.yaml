packets:
  - packet_id: expert-system-diagnostics-forge-cpu-only-2026-08-26
    order: 919-ipki
    status: ready
    title: |
      Expert system diagnostics on CPU-only forge: 0.5b and 1.5b model performance baseline
    kind: bug
    pickup_role: any
    priority: p1
    desired_release: v0.5
    release_target: forge-local-experts-milestone
    capability_tags:
      - inference
      - experts
      - forge
      - diagnostics
    estimated_hours: 3
    deliverable: |
      Structured metrics comparing filesystem search, L0 deterministic experts, and L1 RAG pipeline
      (0.5b and 1.5b synthesis models) on accuracy, latency, and hallucination rate. Includes
      host resource constraints analysis and model sizing recommendations for CPU-only forges.
    context: |
      OBSERVED on forge-tillandsias (Apple Silicon M5, Fedora 44 aarch64, 4 vCPUs, 3.8 GiB RAM,
      CPU-only inference, Ollama 0.33.0):

      INFERENCE BENCHMARK:
      - qwen2.5:0.5b: prefill 435 tok/s, generation 128 tok/s, load 1ms
      - qwen2.5:1.5b: prefill 78-106 tok/s, generation 12-18 tok/s, load 1577ms
      - nomic-embed-text: ~19 chunks/sec on CPU (52ms/chunk at 250 chars)

      HALLUCINATION TEST (no RAG context):
      - 0.5b: ALL 6 spec queries hallucinated (forge cache="blockchain", isolation="metal casing")
      - 1.5b: ALL 6 spec queries hallucinated (forge cache="Alibaba Cloud", podman="Docker+K8s")
      - Neither model has meaningful knowledge of this project's specs

      FILESYSTEM BASELINE (rg on openspec/specs):
      - Average query time: ~33ms
      - Broad queries return 34-100 files (5k-18k lines) — too much for an agent to read
      - Precise for negative queries (Python, AWS Lambda correctly return 0)

      L0 EXPERT (plan_answer):
      - Correctly refuses spec-level queries (unsupported) — those belong to spec_answer
      - Average response: ~450ms (binary startup overhead)

      CONSTRAINTS:
      - 3.8 GiB container RAM makes 7b models impossible (~5 GB needed)
      - 3b is theoretical ceiling but leaves <1 GB for OS+KV cache
      - 1.5b is practical maximum on this container
      - Host has 16 GB RAM and 10 cores but only 4 cores / 3.8 GiB allocated to forge
      - CPU-only embedding: full spec index build takes ~60 min (21799 chunks)
    exit_criteria:
      - |
        Metrics file committed to plan/issues/ with full benchmark data
      - |
        Model sizing recommendation documented for CPU-only forge tier
      - |
        Resource request filed for larger container allocation
    verifiable_closure: |
      Run bench-inference-floor.sh on the target host, verify prefill/gen tok/s
      within 20% of recorded values, confirm 0.5b and 1.5b hallucination rates
      remain 100% without RAG context.
    evidence:
      - 'bench-inference-floor.sh output: 0.5b prefill=435 gen=128, 1.5b prefill=78-106 gen=12-18'
      - 'Direct API hallucination tests: 6/6 queries hallucinated by both models'
      - 'Filesystem baseline: rg avg 33ms, broad queries 34-100 files'
    notes: |
      This is a SMOKE diagnostic — baseline metrics for a CPU-only forge with minimal models.
      The full RAG pipeline test (embed -> retrieve -> synthesize) requires the spec index
      build, which takes ~60 min on CPU. Run the RAG test when the index is available to
      measure the complete pipeline accuracy improvement over raw synthesis.

      On sibling hosts (Windows/Silverblue with GPU), 7b models are the sweet spot.
      This host cannot run them. The resource request (919-jii2) addresses the allocation gap.

