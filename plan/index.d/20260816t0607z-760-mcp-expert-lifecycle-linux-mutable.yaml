# Filed by linux_mutable (worktree agent, operator-directed), 2026-08-16:
# root-cause + fix wave for the 2026-08-15 live MCP expert outage observed in
# the operator's host session — project-info died mid-read ("MCP error -32000:
# Connection closed", all tools deregistered) and plan_answer refused the
# bootstrap's own first question ("what is the current Direction?"). The
# outage is a live specimen of the class 737-zcj5/741-* made observable;
# repro + fix evidence in the packets below. Two completions are transitioned
# by set-field in sibling fragments (636-9m79 discipline); two captures stay
# ready for pickup.
packets:
  - packet_id: mcp-stdio-request-fault-isolation
    order: 760-r74a
    status: ready
    desired_release: v0.5
    priority: p1
    kind: fix
    title: "project-info MCP server dies mid-session: a SIGPIPE'd read_file pipeline (or one malformed client line) kills the whole stdio server under set -euo pipefail"
    deliverable: "a fault in one request fails that request at worst — never the server; litmus:mcp-server-request-fault-isolation pins both classes with a proven-red negative control"
    pickup_role: linux
    owner_host: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [mcp, experts, shell, fail-loud, forge]
    estimated_hours: 2
    context: |
      Live outage 2026-08-15 ~17:20Z (operator host session, linux):
      read_file(path=plan/index.yaml, offset=32484, limit=115) runs
      `tail -n +32484 | head -n 115`; head exits after 115 lines, tail takes
      SIGPIPE (141) with ~19k lines still to write, and under
      `set -euo pipefail` the failed command substitution killed the SERVER.
      Reproduced exactly: the pre-fix server exits rc=141 answering ZERO of
      two queued requests. project-info's main loop also parsed each incoming
      line with UNGUARDED jq (forge-plan already carried the `|| true` guard),
      so one malformed client line was a second latent session-killer, and
      unreadable-file `wc -l < f` a third. The outage class is exactly what
      737-zcj5/741-* made observable — this packet closes the server-side
      cause for the stdio surfaces.
    exit_criteria:
      - "the 2026-08-15 killer request replayed against project-info answers BOTH queued requests and the server exits 0"
      - "a malformed (non-JSON) line fails nothing but itself on both servers"
      - "the negative control proves the litmus catches the pre-fix server (rc=141, zero replies)"

  - packet_id: bare-metal-expert-semantic-lane-wiring
    order: 760-3mh8
    status: ready
    desired_release: v0.5
    priority: p1
    kind: fix
    title: "The DEV-host expert system has no semantic tier: enclave-DNS-only inference endpoint, dead hostname resolution in semantic_expert, no launch-if-missing lifecycle, and a stale user-level binary shadowing the checkout"
    deliverable: "bare-metal harnesses resolve open-ended queries through the same expert system as in-forge ones: dev/runtime env hook, loopback endpoint defaults, idempotent linux-container inference ensure, hostname-capable synthesis dispatch, and checkout-artifact preference in dev"
    pickup_role: linux
    owner_host: linux
    release_target: forge-local-experts-milestone
    capability_tags: [experts, inference, mcp, lifecycle, dev-environment]
    estimated_hours: 4
    context: |
      Four stacked causes, each verified live 2026-08-15/16:
      (1) resolve_plan_bin preferred ~/.local/bin/tillandsias-plan (installed
      Aug 12) over the checkout's fresh target/release, so the host session
      was served pre-706-f7mq behaviour — the exact "what is the current
      Direction?" refusal — while the checkout binary answered it CITED
      (plan/loop_status.md:6731-6753). 682-z5h8's stale-clone lesson, applied
      to the BINARY. (2) semantic_expert::query_inference parsed the endpoint
      with SocketAddr::parse, which only accepts numeric IPs — the default
      `inference:11434` NEVER parsed, so ollama synthesis was dead code in
      BOTH environments (718-nkm2's design notes flagged it; now
      ToSocketAddrs). (3) No inference lifecycle existed for the bare-metal
      Linux dev host: 718-nkm2's dev-inference-ensure was WSL-only
      (skip:not-wsl), the runtime container publishes no host port, and
      nothing launched anything — the linux-container lane now runs the
      already-built tillandsias-inference image as `tillandsias-dev-inference`
      on loopback 11434 (reuse-if-running, start-if-stopped,
      launch-if-missing, never duplicate; 620-ca7g kill switch honored;
      shared model cache). (4) The MCP servers had no dev-vs-runtime hook:
      lib-dev-env.sh now names the split, defaults the endpoints to loopback
      in dev, fires the ensure once in the background at server start (INERT
      under TILLANDSIAS_NO_SINGLETON so litmus/test runs never launch
      containers), and the direction-class pointer fallback cites
      plan.yaml's frontier_note when no markdown section clears the scorer.
    exit_criteria:
      - "plan_answer 'what is the current Direction?' through the real forge-plan server on this host returns a CITED envelope (confidence=retrieved)"
      - "with the inference container stopped, the same query still answers cited (deterministic content fallback) and the server survives"
      - "the ensure is idempotent across states: absent -> launched (verified live: tillandsias-dev-inference healthy), stopped -> started, running -> reused, verdict grammar consumed by cycle-preflight unchanged"
      - "test-run contexts (TILLANDSIAS_NO_SINGLETON) provably never autostart the container"

