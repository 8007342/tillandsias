    deliverable: "a dev-host location + build/refresh step for the spec index (552's launch/commit hook or a dev sibling), so bare-metal spec_answer serves the same L1 RAG tier as in-forge"
    pickup_role: linux
    release_target: forge-local-experts-milestone
    capability_tags: [experts, rag, inference, dev-environment]
    estimated_hours: 3
    context: |
      Follow-up capture from the 760-3mh8 wave (2026-08-16): the embed
      endpoint now defaults sanely on dev (ollama /v1), but
      FORGE_SPEC_INDEX_DIR defaults to the tmpfs launch-state dir that only
