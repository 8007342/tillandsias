    exit_criteria:
      - "on a dev host with the ensure green, spec_answer returns a retrieved envelope instead of the index-not-built refusal"
      - "the index refreshes on commit or names its staleness in the envelope"

  - packet_id: stale-user-level-expert-install-refresh
    order: 760-nwzr
    status: ready
    desired_release: v0.5
    priority: p3
    kind: enhancement
    title: "~/.local/bin/tillandsias-plan goes stale silently on dev hosts: nothing refreshes or skew-stamps the user-level install that non-MCP consumers may still resolve"
    deliverable: "either ./build.sh refreshes the user-level install when it exists, or the capability line carries a behavioural version so a weeks-old install names its own skew"
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [experts, staleness, build, capability-honesty]
    estimated_hours: 2
    context: |
      Capture from the 760-3mh8 root-cause (2026-08-16): the dev-env
      preference now routes the MCP servers to the checkout artifact, but the
      Aug-12 ~/.local/bin binary remains on PATH for anything else that runs
      `tillandsias-plan` bare. Order 569's capability manifest catches missing
      SUBCOMMANDS, not behavioural drift within existing ones (706-f7mq
      changed `answer` internals invisibly to the gap check). Options are in
      the deliverable; the wrong fix is deleting the install (the forge
      canonical path must stay authoritative in-runtime).
    exit_criteria:
      - "a dev host with a weeks-old user-level install either gets it refreshed by the normal build flow or sees its skew named by expert_capability"
