# Ledger fragment — append-only, IMMUTABLE once written.
# Story idle-floor-v05 — 2026-11-11 blind-design triage (order 2080-294s).
# Operator ruling 2026-11-11: near-zero idle overhead for EVERYTHING; avoid polling;
# unavoidable polling uses exponential backoff; measured per platform on the design
# floor (16 GB RAM + an accelerator; yoga, yolanda, tlatoanis-macbook-air as examples).
packets:
  - packet_id: every-periodic-wakeup-in-the-product-is-in-one-inventory-and-an-unlisted-one-is-red
