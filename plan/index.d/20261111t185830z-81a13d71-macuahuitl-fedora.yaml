  - packet_id: linux-idle-overhead-is-measured-on-a-floor-host-in-three-states-against-a-committed-number
    order: 2080-anej
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    story: idle-floor-v05
    capability_tags: [measurement, tray, linux, floor-host]
    estimated_hours: 4
    title: |
      Linux: nothing measures idle overhead; a measurement step records tray and service RSS and wakeups per minute for ten minutes in three states (tray only; services up, no forge; one forge idle) on a floor-class Linux host and writes a verdict against a committed number, and adding a one-second timer makes it red.
    context: |
      Both judges (judge 1 packet 8b-c, judge 2 G10). One live sample: tray Pss 16.6 MB, 36 threads, about 22 context switches a second with one forge up. OQ-1/OQ-2 are answered (floor = 16 GB + accelerator; near-zero binds everything), so the number is proposed in the row and confirmed by the operator. The measurer is Rust or Lua, not shell. Every obligation holds per platform: macOS and Windows have their own rows.
    exit_criteria:
      - 'the step writes a per-state verdict with the regime attached (host, kernel, state); a mutation adding a one-second timer to the tray turns it red; today there is no step and no number'
    unscoreable: 'unpinnable-until-the-guard-exists: the measurement step is the deliverable; write it in the same commit.'
    next_action: 'Nothing is done. Build the measurer, run it once on a floor-class Linux host, propose the number to the operator as one plain ask.'
    provenance: blind-design judges 1 and 2; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
    related: [2080-9ijy, 1800-465n]
    events:
