  - packet_id: the-memory-stall-watch-waits-on-a-kernel-pressure-event-instead-of-listing-containers-every-15-seconds
    order: 2080-9wex
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    story: idle-floor-v05
    capability_tags: [polling, tray, rust, linux]
    estimated_hours: 3
    title: |
      memory_stall_watch wakes every 15 s and lists containers each pass even with nothing running; it waits on a PSI memory trigger (Linux, and inside each guest) and does nothing between events.
    context: |
      Judge 2 G11 second arm. Linux exposes /proc/pressure/memory triggers that block in poll() until a threshold is crossed. Where no trigger is available, the fallback backs off exponentially from 15 s, never a fixed short cadence. Holds separately in the macOS guest and Windows distro (both run Linux kernels).
    exit_criteria:
      - 'with no container under pressure, the watch makes zero wakeups in ten minutes (counted with a wakeup counter in a test build); today it makes 40'
      - 'an induced pressure event is still reported within one trigger window'
    verifiable_closure: 'cargo test -p tillandsias-headless memory_stall_watch wakeup-count test; red on the 15 s interval'
    next_action: 'Nothing is done. Add a wakeup counter and the ten-minute test under a simulated clock first.'
    provenance: blind-design judge 2; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
    related: [2080-9ijy]
    events:
      - {type: filed, ts: '2026-11-11T18:58:30Z', host: macuahuitl-fedora, summary: filed p1 from the 2026-11-11 blind-design triage}
  - packet_id: the-lane-freshness-loop-and-the-pty-heartbeat-stop-waking-a-quiet-forge-on-fixed-short-cadences
    order: 2080-a9tb
    status: ready
    kind: enhancement
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    story: idle-floor-v05
    capability_tags: [polling, mcp, rust]
    estimated_hours: 3
    title: |
      The lane-freshness loop wakes every 60 s and PTY_HEARTBEAT_INTERVAL every 30 s whether or not anything changed; freshness is driven by the commit and mirror events it already has, and the heartbeat backs off exponentially while the session is quiet.
    context: |
      Judge 1 packet 8. Symbols in mcp_socket.rs and pty_handler.rs. A dead peer must still be found: the backoff is capped and reset on any traffic.
    exit_criteria:
      - 'a quiet forge session for ten minutes under a simulated clock records at most 5 heartbeat wakeups and zero freshness wakeups without a commit; today 20 and 10'
      - 'a killed peer is still detected within the cap'
    verifiable_closure: 'cargo test -p tillandsias-headless quiet-session wakeup test; red on today''s fixed intervals'
    next_action: 'Nothing is done. Write the simulated-clock test first.'
    provenance: blind-design judge 1; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
    related: [2080-9ijy]
