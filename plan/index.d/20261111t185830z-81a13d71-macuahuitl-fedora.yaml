    capability_tags: [polling, tray, lua, ratchet]
    estimated_hours: 4
    title: |
      No list names the product's periodic wakeups, so nobody can approve them under the polling ruling: one committed Lua table names each cadence, its owner, wakeups per hour, whether it runs with zero containers and the approval it rests on, and a check is red on a periodic loop the table does not name.
    context: |
      Both judges (judge 1 packet 8a, judge 2 G11). Known unlisted loops at e886f596c: memory_stall_watch INTERVAL 15 s (lists containers each pass, 240 an hour), the lane-freshness 60 s loop, PTY_HEARTBEAT_INTERVAL 30 s, the external-logs auditor at 60 s by spec. Extends 1919-gshp (tray no-polling check to images) and the 1919 polling epic; this is the inventory those checks need. Scope: tray, headless, both guest agents, every image entrypoint.
    exit_criteria:
      - 'the check fails on today''s tree naming at least the three loops above; it passes once each is either removed or listed with an approval or an exponential-backoff marker'
      - 'the check reports the population it scanned (files and loops, non-zero)'
    unscoreable: 'unpinnable-until-the-guard-exists: the check is the deliverable; write it in the same commit and move this text into verifiable_closure.'
    next_action: 'Nothing is done. Write the Lua scanner over crates/ and images/ for interval constants and sleep loops; watch it go red on the three named loops.'
    provenance: blind-design judges 1 and 2; filed by macuahuitl-fedora, triage 2080-294s.
