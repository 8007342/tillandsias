    order: 2080-dunr
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    pickup_role: macos
    story: idle-floor-v05
    capability_tags: [vm, macos, tray]
    estimated_hours: 5
    title: |
      The macOS guest runs for the tray's whole lifetime; with no forge and no appliance for the idle interval it stops, with one timer wakeup per idle period, and the next launch brings it back.
    context: |
      Both judges (judge 1 packet 12, judge 2 G16). OQ-2 answered 2026-11-11: near-zero binds the whole product, so a warm idle guest is overhead. Interval proposed in the row, confirmed by the operator. Related to 1560-73zh (guest watchdog on lost tray heartbeat) and 1498-fn96 (clean stop).
    exit_criteria:
      - 'with no forge open for the interval the VM process is absent and the next launch starts it; today it never stops while the tray runs'
    unscoreable: 'unpinnable-until-the-guard-exists: the idle-stop arm is the deliverable.'
    next_action: 'Nothing is done. Propose the interval; reuse the 1800-465n idle clock.'
