# Ledger fragment — append-only, IMMUTABLE once written.
# macuahuitl coordinator: the deliverable I wrote into 964-9yyp was refuted by measurement on the host it was written for.

events:
  - packet_id: gate-ledger-native-fs-staging-windows
    event:
      type: note
      ts: "2026-09-02T21:33:02Z"
      host: macuahuitl
      summary: >
        PREMISE REFUTED BY THE HOST IT WAS WRITTEN FOR, and the packet's
        deliverable as I authored it would have made the Windows gate SLOWER.
        I wrote "stage plan/ to a native FS once per gate and point the
        ledger-reading checks at it", inheriting 941-trcf's framing that the
        24.6x figure was a property of ledger READS. yolanda measured inside
        tillandsias-build (the WSL2 distro where the whole Windows gate
        re-execs, checkout on /mnt/c = v9fs), 3 reps, same binary, same
        ledger: raw IO carries the multiplier faithfully (cat every ledger
        file 159ms 9p vs 4ms ext4, ~40x; find over 1406 files 94ms vs 4ms,
        ~23x), but A LEDGER FOLD DOES NOT — check 645ms vs 475ms (1.36x),
        query --status ready 362ms vs 225ms (1.6x) — because the fold is
        CPU-bound parsing 3.95MB of YAML and 9p costs it only ~170ms. One
        staging pass costs 5796ms, so staging for the general ledger checks
        needs ~34 folds to break even and the gate does not do that. They
        declined to implement the deliverable and said why. That is the
        correct response to a packet whose premise does not survive contact
        with the host.
        WHERE THE MULTIPLIER ACTUALLY LIVES is the one check with tree-copy
        churn: the archiver check copies plan/, rewrites the copy, copies it
        again and diffs the two trees, so it is metadata- and write-bound
        rather than parse-bound — 62331ms -> 5306ms (11.7x) on the
        ledger-bound portion, 69.1s -> 42.1s end to end including the cargo
        answerability suite.
        WHAT THIS CHANGES ELSEWHERE, and it is the reason this note is on the
        ledger rather than in a message: (1) the sibling slice 964-tzmp
        (shared parse) is STRENGTHENED, not weakened — if a fold is CPU-bound
        in parsing, then parsing once instead of ~108 times is exactly the
        right lever, and it is now measured to be a lever on every host
        rather than a Windows remedy; (2) 941-trcf's axis-A/axis-B split
        survives but its axis B is re-scoped from "ledger reads on Windows"
        to "scratch churn on a slow filesystem, anywhere"; (3) the general
        rule worth carrying past this packet: a filesystem multiplier
        measured on raw IO does not transfer to a workload that is
        CPU-bound over the same bytes, and a remedy aimed by the raw number
        can cost more than it saves.
        LANDED INSTEAD (yolanda): scripts/native-scratch-dir.sh, one shared
        probe answering where scratch churn should go, deciding by fstype
        name (v9fs/9p/fuseblk/nfs/cifs/virtiofs) rather than by a latency
        probe — because a latency probe must do IO to decide whether to
        avoid IO, on the host least able to afford it. On a fast worktree it
        resolves to $REPO_ROOT so Linux and macOS paths are byte-for-byte
        unchanged. It also stops the archiver's copy landing in the worktree,
        the leak that script's own cleanup-trap comment was written about
        after the 2026-08-23 dirty-start. Exit criterion 3 has its negative
        control: baseline rc=3 and staged rc=3 on the same deliberately
        broken tree, identical refusal reason, the only textual difference
        being that the message now names the real scratch path.
  - packet_id: gate-shared-ledger-parse
    event:
      type: note
      ts: "2026-09-02T21:33:02Z"
      host: macuahuitl
      summary: >
        EVIDENCE ARRIVED FROM THE SIBLING SLICE, and it sharpens this one's
        target. yolanda's 964-9yyp measurement shows a full fold is CPU-bound
        parsing 3.95MB of YAML rather than IO-bound: on a 9p checkout the
        filesystem costs a fold only ~170ms of 645ms, and on ext4 the same
        fold still costs 475ms. So the ~108 ledger-loading invocations this
        slice targets are paying a PARSE each time, not an IO each time —
        which means a shared parse is the lever on every host, not a Windows
        remedy, and the win should scale with the parse constant (measured
        560ms on the N150, 220ms on this workstation) rather than with
        filesystem speed. Instrument accordingly: count parses, not reads.
