    title: |
      the initialize-bare-metal-host fixture prints the exact verdict 1312-i6da closes on, while testing three different and weaker arms against a stub podman that makes real host state irrelevant
    context: |
      MEASURED ON lenovinha 2026-09-21, while the worker loop asked whether
      1312-i6da could close. It cannot, and the reason is that its closure
      names a fixture verdict rather than the arms themselves.

      THE CLOSURE of 1312-i6da requires
      `scripts/test-initialize-bare-metal-host-idempotent.sh` to print
      `ok:initialize-bare-metal-host:3/3`, WHERE the three arms are: (1)
      IDEMPOTENT - the skill's commands run TWICE ON A REAL HOST yield the same
      checker verdict and NO container's creation timestamp changes; (2)
      REBUILD FROM NOTHING - after `podman system reset --force` on a
      pre-authorised smoke host the skill's commands alone restore the verdict;
      (3) TROUBLESHOOTING - a stopped mirror yields the todo: line.

      WHAT THE FIXTURE ACTUALLY DOES. It builds a STUB podman - its own comment
      says "No real container is touched" - and prepends it to PATH for every
      invocation, so the real podman is never consulted. Arm 1 asks whether the
      CHECKER returns the same string twice against fixed synthetic output; it
      never runs the skill's commands and never compares creation timestamps
      (grep -c CreatedAt = 0). Arm 2 is not rebuild-from-nothing at all but
      SEEDLESS, a different and much cheaper claim (grep -c 'system reset' = 0).
      Arm 3 is stubbed likewise.

      THE MEASUREMENT THAT SETTLES IT, and it is one line. The fixture's own
      arm-1 PASS prints the verdict it validated:
        ok:bare-metal-host:lenovinha:...  lane=off
      while the real checker on the same host at the same moment prints:
        ok:bare-metal-host:lenovinha:...  lane=wired:til:host-push:lenovinha
      The fixture is describing a host that does not exist. It would print 3/3
      on a machine with the entire stack down, which is precisely the condition
      the skill exists to detect and repair.

      WHAT IS NOT WRONG HERE, so the fix does not overshoot: a stub is the RIGHT
      tool for arm 3 and for the seedless claim - both are about what the
      CHECKER says in a given state, and manufacturing that state is legitimate
      and fast. The defect is that the stubbed arms are counted as the closure's
      arms and reported under a verdict string the closure treats as proof of
      them. 1312-i6da's arm 2 in particular cannot run here at all: it needs a
      pre-authorised smoke host, and pretending otherwise is what produced a
      substituted arm.
