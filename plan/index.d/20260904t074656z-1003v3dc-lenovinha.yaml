packets:
  - packet_id: spec-index-durable-tier-unreachable-under-rootless-podman
    order: 1003-v3dc
    status: ready
    desired_release: v0.5
    priority: p1
    kind: defect
    release_target: forge-local-experts-milestone
    title: |
      the spec index's durable tier is unreachable from the host-side producer under rootless podman, so it publishes into target/ — the one directory daily maintenance deletes wholesale — and every diagnostic reports success
    deliverable: |
      rung 4 moves off target/, the rung-1 guard distinguishes EACCES from
      ENOENT, and a demoted durable tier is reported instead of being silent
    pickup_role: linux
    owner_host: any
    depends_on: []
    capability_tags:
      - experts
      - rag
      - podman
      - spec-index
      - durability
    estimated_hours: 4
    context: |
      MEASURED ON LENOVINHA 2026-09-04 (Fedora Silverblue, rootless podman),
      while taking 917-6iwv. Filed as
      plan/issues/spec-index-durable-tier-unreachable-rootless-podman-2026-09-04.md
      and minted into a packet at macuahuitl's routing.

      Order 801-a2by moved the spec RAG index into a durable tier so the cold
      embedding cost is paid once and survives forge destruction and reboot. Rung
      1 is a podman named volume, chosen deliberately over a host bind-mount for
      enclave-correctness reasons.

      Under ROOTLESS podman that rung is unreachable from the host-side producer.
      podman reports a mountpoint:

        $ podman volume inspect -f '{{.Mountpoint}}' tillandsias-spec-index-tillandsias
        /var/home/lenovinha/.local/share/containers/storage/volumes/.../\_data

      and that path is not accessible outside the user namespace that owns it:

        $ ls -ld <that path>
        ls: cannot access '...': Permission denied

      `_tillandsias_spec_index_paths` guards rung 1 with `[ ! -d "$_tsi_root" ]`.
      That test fails for PERMISSION, not for absence, `_tsi_root` is cleared,
      and resolution falls through to rung 4: `<checkout>/target/tillandsias-spec-index`.

      THE FALLBACK IS THE ONE DIRECTORY A ROUTINE GC REMOVES. Start-Of-Day
      maintenance runs `cargo clean` via check-build-cache-sweep.sh, which
      removes target/ WHOLESALE. scripts/metrics-log-path.sh already documents
      exactly this hazard, in its own words, as the reason the METRICS log was
      moved out of target/: "NOT `target/`, AND THIS IS LOAD-BEARING ... `cargo
      clean` removes the target directory WHOLESALE." The spec index is far more
      expensive to rebuild than a metrics log and still lists target/ as a rung.

      AND IT IS SILENT, which is the half that makes it a defect rather than a
      slow path. `--where` reports:

        spec-index:volume=tillandsias-spec-index-tillandsias
        spec-index:root=<checkout>/target/tillandsias-spec-index
        spec-index:serving-exists=yes

      `volume=` and `root=` disagree while the report says the serving directory
      exists. Nothing anywhere says the durable tier was not used.

      COST BEING RISKED, measured: 23,154 chunks requiring a full cold embed on
      this host. The 801-a2by header records 9,910 chunks / ~12 minutes on
      macuahuitl; this corpus is 2.3x that. 888-miiy already records yoga blowing
      both time bounds at 21,592 embeddings with nothing persisted between
      attempts — the same wound. macuahuitl reports 17 GiB of target/ against the
      40 GiB trigger, as does lenovinha, so the fuse is live on at least two
      hosts and unlit only by luck.
    outcome: |
      An expensive, correctly-designed cache stops being published into a GC
      target, and a demoted durable tier becomes visible instead of silent.
    exit_criteria:
      - 'RUNG 4 IS NOT `target/`. It moves to a location a `cargo clean` does not remove — `.cache/spec-index` follows metrics-log-path.sh''s own precedent and is the recommended value. NEGATIVE CONTROL, and it is the one that proves the fix: publish an index, run the real sweep path (or `cargo clean`), and show the index still resolves and serves. metrics-log-path.sh proved its equivalent claim in a throwaway crate (`target/metrics` 1 -> 0 across a clean, `.cache/metrics` 1 -> 1); do the same rather than reasoning about it.'
      - 'THE RUNG-1 GUARD DISTINGUISHES EACCES FROM ENOENT. A permission refusal must never be read as absence. `[ -d ]` cannot make that distinction and must stop being the test; a successful `podman volume inspect` plus a write probe performed INSIDE a container is the shape that can. A host where rung 1 is genuinely absent must still degrade quietly, and a host where it is merely not permitted must not silently demote.'
      - '`--where` REFUSES TO REPORT `serving-exists=yes` WHILE `volume=` AND `root=` DISAGREE. It must emit a distinguishable line — `note:spec-index-durable-tier-unavailable:<reason>` or equivalent — naming which rung actually won and why the preferred one did not. A cache demoted to a GC target with every diagnostic green is the guard-nobody-honours shape this repo keeps cataloguing.'
      - 'THE UNMEASURED HALF IS STATED AS UNMEASURED, not asserted either way. It is NOT established whether the forge — which runs INSIDE the namespace — resolves rung 1 correctly. If it does, producer and consumer disagree about where the index lives, which is 890-t9pu''s writer/reader path defect recurring in a third subsystem. Whoever closes this packet must either measure it on a host with a running forge or record explicitly that it remains unmeasured. Guessing is what this criterion exists to forbid.'
    verifiable_closure: |
      On a rootless-podman host: publish an index, run the build-cache sweep,
      and show the index survives and still serves; show `--where` naming the
      rung that won and reporting the demotion when rung 1 is not permitted;
      and show the rung-1 guard returning different verdicts for a volume that
      is absent versus one that exists but is not readable from the host.
    notes: |
      The three remedies are INDEPENDENT and can land separately. Moving rung 4
      closes the data-loss half on its own and is the cheapest; making the
      demotion loud closes the silence; fixing the guard closes the root cause.
      Do the cheap one first if the cycle is short — a partial fix that stops
      the data loss is worth more than a complete one that lands next week.

      Related: 801-a2by (the durable tier this defends), 890-t9pu (writer and
      reader disagreeing about a path — the shape of the unmeasured half),
      888-miiy (the cost being risked), 917-6iwv (where this was found).
