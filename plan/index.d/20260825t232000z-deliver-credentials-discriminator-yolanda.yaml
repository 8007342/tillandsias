packets:
  - packet_id: deliver-credentials-carries-no-accept-reject-discriminator
    order: 890-y72v
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: 'DeliverCredentials reply says "I received it", never "I accepted it" — so the host cannot learn that the share it delivered was rejected, and 803-49re Part B has nowhere to put the answer'
    deliverable: crates/tillandsias-control-wire (DeliverCredentialsReply outcome) + crates/tillandsias-headless/src/vault_bootstrap.rs (validate before persist) + the Windows/macOS tray delivery sites
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    depends_on: []
    capability_tags:
      - control-wire
      - vault
      - rust
      - fail-loud
      - linux
    estimated_hours: 5
    context: |
      This is 803-49re Part B, split out because Part A (clearing the host
      credentials on every guest-wipe path) landed separately and should not be
      held on it. Filed by the windows host, which read the original failure end
      to end, and written as a REVIEW for whoever implements it — the wire
      change belongs on the Linux side and cannot be compiled or verified from
      Windows.

      WHAT PART A DID AND DID NOT DO. Part A clears vault-shamir-share-v1 and
      vault-root-token-v1 on every wipe path, so a host that wipes AFTER the fix
      lands is self-healing. It does nothing for a host that ALREADY carries a
      stale credential — including every existing user who upgrades into a new
      release without wiping. Only this packet fixes that population, which is
      why the release notes carry a manual cmdkey recovery step regardless.

      THE SHAPE OF THE GAP, read from the code rather than inferred:

        ControlMessage::DeliverCredentialsReply { seq_in_reply_to, success }

      `success` is set from whether the guest RECEIVED and stored the frame
      (vsock_server.rs:1557), not from whether the delivered share
      authenticates against the live vault. `set_in_vm_credentials`
      (vault_bootstrap.rs:75) returns unit — it has no channel to report a
      rejection even if it noticed one — and it persists the delivered share to
      the fallback file unconditionally. So the host is told success=true while
      handing the guest a key that cannot open anything, which is the precise
      reason the operator's 2026-08-17 failure was silent for an hour.

      THE MOST USEFUL THING I FOUND, and the reason this review is worth more
      than a restatement of the bug: THE PRECEDENCE RULE ALREADY EXISTS, it is
      just too narrow. vault_bootstrap.rs:80-85 —

        // If we have a pending fresh handover, the VM's state is strictly newer
        // than whatever the host tray just delivered. Ignore the stale delivery
        // to prevent clobbering the fresh token in memory and the fallback file.
        if get_pending_handover().1.is_some() { return; }

      That is exactly the policy 803-49re's deliverable asks for — "a host share
      that fails to authenticate against the live vault loses to the guest's own
      unseal secret" — already written, already justified in the same words, and
      already shipping. It just triggers on one narrow signal (a handover is
      pending) instead of on the general one (the delivered share does not
      work). So the implementation is a WIDENING of an existing accepted rule,
      not a new policy that needs arguing. Reviewers should weigh it that way.

      WHAT I WOULD ASK THE IMPLEMENTER TO GET RIGHT, in priority order:

      1. VALIDATE BEFORE PERSIST, not after. The 2026-08-17 evidence is that the
         fallback file was repaired at 18:49:51Z and stale again by 18:50:30Z,
         because delivery overwrites the file before anything checks it. A
         validation that runs after the write leaves the same window open.

      2. THE GUEST ALREADY HOLDS THE AUTHORITATIVE ANSWER, and the self-heal
         never consults it. The vault entrypoint unsealed successfully from the
         podman secret `tillandsias-vault-unseal` in the same boot ("unseal key
         material loaded (32 bytes)", "vault unsealed (sealed=false)"), and an
         A/B generate-root proved that secret complete=true while the delivered
         share gave "cipher: message authentication failed". Comparing against
         that secret is a local operation — it does not need the wire at all,
         which means the validation half can land and be tested independently of
         the protocol half.

      3. THE ERROR TEXT IS ITS OWN DEFECT. "recover the correct share or perform
         an attended storage-preserving re-init. Do NOT wipe the vault-data
         volume." Nothing needed recovering; the correct share was in the
         guest's own podman secret. An operator following that text would wipe
         more state to fix a vault that was healthy and unsealed throughout.
         Whatever replaces it should name the source it actually checked.

      4. IT SPINS. The self-heal retried roughly every 30 seconds, in pairs, for
         the full hour — 18 aborts in one 10-minute window. A permanently
         impossible operation should back off and say so ONCE. A warning that
         repeats forever is one an operator learns to scroll past, which is how
         this stayed invisible.

      5. WIRE COMPATIBILITY. A bool cannot carry "received but rejected, and
         here is why" without either a new field or a new frame. Prefer
         whichever keeps an old tray talking to a new guest honest: a tray that
         cannot understand a rejection must not read it as success. Note the
         asymmetry that makes this urgent — the guest is the side a release
         upgrades, the host tray is the side a user may leave stale for months.

      NOT IN SCOPE, deliberately: the host-side response to a rejection (does
      the tray delete its copy, or surface a prompt?) is a UX decision on two
      platforms and should be its own packet once the wire can express the
      rejection at all.
    verifiable_closure: |
      A test that delivers a share which does not authenticate against the live
      vault and asserts BOTH that the guest's own unseal secret still wins (the
      fallback file is not overwritten with the bad share) and that the host
      observes a rejection rather than success — red against today's
      unconditional accept-and-persist.
    evidence:
      - 'vsock_server.rs:1557 sets success from receipt, not acceptance'
      - 'vault_bootstrap.rs:75 set_in_vm_credentials returns unit and persists unconditionally'
      - 'vault_bootstrap.rs:80-85 the narrow precedence rule that already encodes the desired policy'
      - 'operator 2026-08-17: fallback repaired 18:49:51Z, stale again by 18:50:30Z'
      - 'A/B generate-root: podman secret complete=true, delivered share MAC failure'
