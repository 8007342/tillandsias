    title: |
      OpenCode's own auth store (`auth.json` under its data directory, whatever providers `opencode auth login` put there) is harvested to `secret/opencode/auth` and restored before `opencode` starts, alongside the existing Gemini API-key adaptation; a login path exists to seed it once
    context: |
      Spec: tillandsias-vault "Every harness credential document has a Vault home and is restored
      without a prompt", scenario "OpenCode's own auth store round-trips". Operator: "Codex,
      Antigravity and OpenCode Go credentials must likewise be saved transparently and survive
      Vault/container/image wipes."

      Today: OpenCode has NO Vault document; prepare_opencode_vault_auth adapts only
      secret/gemini/api-key into OPENCODE_AUTH_CONTENT ({google:{type:api,key}}), and
      opencode_remove_stale_auth_file deletes any auth.json (the no-file contract of default-image
      "OpenCode consumes Vault authentication without credential files"). A provider the operator
      signs into with `opencode auth login` (Anthropic, OpenAI, or its Zen/Go account) is lost at
      container teardown. Claude, Codex and Antigravity each have a provider-oauth-vault /
      codex-oauth-vault document, a device-auth login path and a rotation watcher.

      Do: (1) add provider `opencode` to provider-oauth-vault.sh: document path
      secret/opencode/auth, field credentials_b64, source file OpenCode's auth.json (XDG data dir
      inside the forge); (2) reconcile with the no-file contract: restore the document as
      OPENCODE_AUTH_CONTENT merged over the Gemini adaptation when OpenCode honours the env
      contract for multiple providers (measure with opencode_auth_contract_ok's probe), else
      materialise auth.json at 0600 and extend opencode_remove_stale_auth_file to tolerate the
      restored file — say which in the fixture header and update the default-image no-file
      scenario if the second path is taken; (3) harvest: a watcher on the auth file (the
      codex-oauth-session pattern) while the session lives, final harvest at exit; (4) login path:
      `tillandsias <project> --opencode` with a one-time `opencode auth login` inside the forge is
      enough if the watcher harvests it — no new host flag unless the device-auth pattern is
      needed; (5) policy opencode-forge.hcl gains read on secret/opencode/auth and the forge's
      harvest write (mirror claude-forge.hcl's shape); (6) fixture
      scripts/test-opencode-auth-store-roundtrip.sh: seeded vault stub, harvest then restore,
      assert byte equality and that the document never appears in argv or the lifecycle log;
      keep scripts/test-opencode-vault-auth-content.sh green.
    exit_criteria:
      - 'scripts/test-opencode-auth-store-roundtrip.sh: a seeded auth store harvested to the vault stub and restored on the next launch is byte-identical and absent from argv and logs (pre-fix result: FAILS — no opencode provider exists in provider-oauth-vault.sh)'
      - 'scripts/test-opencode-vault-auth-content.sh stays green (pre-fix result: passes — positive control)'
      - 'a live forge: opencode auth login once, teardown, relaunch after a Vault-image and container wipe, provider still authenticated with no prompt, noted in the closure event (pre-fix result: FAILS — the store is lost at teardown)'
    verifiable_closure: |
      bash scripts/test-opencode-auth-store-roundtrip.sh exits 0 and bash scripts/test-opencode-vault-auth-content.sh exits 0; pre-fix: the first FAILS.
    depends_on: []
    notes: |
