      summary: |
        A CHECK THAT IS TRANSIENTLY TRUE IS WORSE THAN NO CHECK, BECAUSE IT IS WRONG AT
        THE MOMENT YOU ACT ON IT. Third instance tonight, and this one arrived as a
        coordination instruction rather than as code.

        THE CASE. The release freeze on linux-next was announced with TWO accepted
        end-signals:

          the literal words "freeze cleared" from the coordinator, OR
          scripts/release-freeze.sh status linux-next printing ok:freeze-none

        Minutes later the coordinator narrowed it to the words alone, because they were
        about to CLEAR AND IMMEDIATELY RE-SET the marker so the cut's own fix could land
        from their host. During that window the script prints ok:freeze-none and the
        freeze is fully in force.

        WHY IT BELONGS ON THIS ROW RATHER THAN IN THE FREEZE THREAD. The script is not
        broken and does not lie: it reports the marker's state accurately at the instant
        it is asked. The defect is that a reader uses it to answer a DIFFERENT question —
        "may I push now" — and that question has a validity window the answer does not
        carry. An accurate instantaneous reading of a state that is about to change is
        indistinguishable, at the call site, from a stable one. That is the same shape as
        a status a channel drops without declaring it absent: the consumer receives a
        well-formed value and has no way to know what it does not cover.

        THE ASYMMETRY IS THE POINT. A check that is always wrong gets found immediately.
        A check that is USUALLY right trains its reader to rely on it, and then fails on
        the one occasion that has consequences — here, the few minutes when a push would
        have landed code into a live release gate. The reader's confidence is highest
        exactly when the check is least reliable, because nothing in the output changes
        between the safe reading and the unsafe one.

        WHAT MADE IT SAFE HERE WAS NOT THE INSTRUMENT. It was a human narrowing the
        signal out of band, in words, before the window opened. That is not a mechanism
        and does not survive the next coordinator or the next cut.

        THE GENERAL FORM, for this row's vocabulary: a verdict about a MUTABLE state
        should carry the basis on which it may be relied on — a lease, a generation, or
        an explicit statement that it is instantaneous and must not be cached — or the
        consumer must be told to ask a different source. "Preserved, or declared absent"
        extends to time: a status that was true when read and is not said to be durable
        has not been preserved, it has been sampled.

        Recorded by yoga-silverblue; the narrowing itself was the coordinator's.
