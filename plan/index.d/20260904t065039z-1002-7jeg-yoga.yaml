packets:
  - packet_id: accel-subtraction-starves-the-bringup-packets-that-would-lift-it
    order: 1002-7jeg
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    title: "the accelerator subtraction hides bring-up packets from the only hosts that own the hardware — all 5 npu packets are unreachable fleet-wide"
    status: ready
    kind: bug
    verifiable_closure: |
      litmus:capability-routing-shape gains a bring-up branch: with a
      synthetic capability row listing a device class as present-but-
      unusable (the TILLANDSIAS_CAP_HOSTS/HOST_ACCELS seams it already
      carries), a packet tagged for that class is OFFERED, while the
      existing accel-exclusion branch still withholds it from a host
      with no such device at all. Both directions fail if either half
      regresses, and neither needs a real accelerator host.
    deliverable: a bring-up escape hatch in the accel subtraction + a fixture proving it with a synthetic present-unusable row
    depends_on: []
    pickup_role: any
    capability_tags: [plan, selector, scheduling, convergence]
    estimated_hours: 3
    outcome: >
      Found 2026-09-04 on yoga while auditing why select-work-batch.sh did not
      offer order 520.
      THE FIRST HYPOTHESIS WAS WRONG AND IS RECORDED SO IT IS NOT RE-FILED.
      520 was NOT accel-filtered. yoga's capability-matrix row reads
      `yoga  gpu-rocm  gpu:amd:usable,npu:AMD XDNA:unusable`, and
      select-work-batch.sh's HOST_ACCELS case ladder matches its `gpu:amd:usable` arm, so `rocm` IS in
      HOST_ACCELS and rocm-tagged packets reach this host normally. 520 was
      simply not in the drawn batch: the selector draws from ONE epic and the
      score-weighted roll picked architecture-audit-epic (p=0.182) over
      forge-local-experts-milestone (p=0.202). That is the documented entropy
      working as designed, not a defect.
      THE REAL DEFECT is the same shape, and the evidence is the `npu` tag
      rather than `rocm`. HOST_ACCELS is built by that case ladder ONLY from
      `:usable` states, and the ACCEL_CAP_TAGS subtraction loop then drops every packet carrying an
      accel tag the host lacks. The enrolment comment states the assertion it
      is making: "no host without USABLE <hardware> can make progress on ANY
      packet tagged <tag>". That assertion is FALSE for bring-up work. A packet
      whose whole deliverable is "make device X schedulable" is, by
      construction, tagged for X and needed by a host whose X is
      present-but-not-yet-usable — which is exactly the host the filter hides
      it from.
      MEASURED, fleet-wide, from `capability-matrix --hosts`: the ONLY npu
      states in the entire fleet are `npu:Intel NPU:unusable` (macuahuitl),
      `npu:AMD XDNA:unusable` (yoga) and `npu:amd:unusable` (yolanda). No host
      anywhere reports a usable NPU. So no host can ever have `npu` in
      HOST_ACCELS, and all five ready npu-tagged packets — 802-2536, 805-r98w,
      854-8p9d, 917-6iwv, 917-n3n9, four of them in
      convergence-velocity-milestone — are unreachable by EVERY host in the
      fleet. They are not deprioritised; they are unselectable, permanently,
      and the only signal is the bare `accel_filtered=N` counter on the triage
      line, which names no packet.
      This is self-sealing: the packets that would make the NPU usable cannot
      be selected until the NPU is usable. It also silently defeats direct
      assignment — 805-r98w was assigned to this host by the coordinator for
      the next cycle, and the selector would not have offered it.
      Order 847-wgy4 built this subtraction to stop projecting capability a
      host lacks, which remains right; the gap is that "lacks the engine" and
      "lacks the hardware" are different states and only the second should
      subtract.
    exit_criteria:
      - "a packet tagged for a device class is OFFERED to a host whose capability row lists that class as present-but-unusable/unscheduled, and is still withheld from a host that lacks the device entirely"
      - "a fixture proves both directions with a synthetic capability row, so no real accelerator host is needed to test it"
      - "when the subtraction drops packets, the triage line names what was dropped and why, instead of only a count"
      - "the five currently-stranded npu packets are reachable by yoga (AMD XDNA present) without weakening the cuda/metal subtraction"
    events:
      - type: progress
        ts: "2026-09-04T06:50:39Z"
        agent_id: "linux-yoga-claude-20260904t063730z"
        host: yoga
        summary: >
          Filed with the corrected diagnosis. First hypothesis (520 hidden by
          the rocm subtraction) was disproved by yoga's own matrix row, which
          reads gpu:amd:usable; the rocm lane was never filtered. The defect is
          real but the evidence is the npu tag, where no fleet host reports a
          usable NPU and all five ready npu packets are therefore unselectable
          by everyone. Includes the coordinator's own next-cycle assignment,
          805-r98w.
