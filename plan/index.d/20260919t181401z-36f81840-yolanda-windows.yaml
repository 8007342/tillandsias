        THIS ROW KEEPS THE PRACTICE HALF: an AGENT piping a guard's output through a truncating filter, recorded here as evidence for the status-channel rule. Three times in one session I destroyed a verdict line with my own `| tail -N`, after naming the mistake to the coordinator following the first one. The two halves share a mechanism and have different subjects — a fixture doing it to its own fixture, and an operator doing it to a guard — so a fix to either leaves the other live.

