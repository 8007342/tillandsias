          qemu-img: Could not open '...mixed-clusters.qcow2':
                    Image does not contain a reference count table

        This reader ignores refcounts entirely — it only expands — so it had accepted a
        file qemu considers structurally invalid, and every other test agreed with it.
        With a refcount table and block added the image is genuinely valid and
        qemu-img's expansion matches expected_raw() byte for byte.

        SO THE CROSS-CHECK IS NOT LOST, IT IS STRONGER. It used to be a constant
        captured on one host on one day; it is now re-derived on every run on any host
        that has qemu-img, and it is what stands between this fixture and an invalid
        qcow2 that all five tests would have called good. The one-time proof against the
        REAL Fedora Cloud 44 image (528 MB, byte-identical SHA-256) is recorded on
        980-xcaf and untouched.

        THE GENERALISABLE BIT, now in the module's header: a generator validated only
        against the reader it feeds proves the two AGREE, not that either is RIGHT.
        That is the same shape as this fleet's other findings today — correct-looking
        output, wrong target — except here the two wrong things were mutually
        consistent, which is why nothing looked wrong.

        WHAT THE MIX PRESERVES: four compressed clusters spanning the compressibility
        range (constant fill, deterministic-LCG incompressible block, another constant,
        a structured 0..255 ramp), one normal cluster, three holes — the exact guest
        layout each_cluster_kind_expands_to_the_right_bytes already asserted. The
        compressed streams are packed WITHOUT alignment on purpose, so a stream starts
        mid-sector and shares a sector with its neighbour; that is what exercises
        compressed_span's sector arithmetic instead of sidestepping it.

        The whole-image assertion now compares BYTES, not a hash: a failure names the
        byte and the cluster, and there is no opaque constant for a later edit to
        "update" until it passes.

        ONE PROPERTY WORTH KNOWING FOR ANYONE VERIFYING THIS: check-no-tracked-
