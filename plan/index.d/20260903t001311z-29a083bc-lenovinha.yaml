        IMPLEMENTED AND CLOSED at 23ce57576. Both GPUs in this machine classify correctly in one probe run, which is why this packet came to this host.  THE PACKET'S OWN PROPOSED RULE IS FALSE, AND THIS HOST IS THE COUNTEREXAMPLE. I wrote into the context that mem_info_vram_total "is absent or zero for an integrated part". Measured:    card0  NVIDIA RTX 3070 (DISCRETE)     no mem_info_vram_total at all   card1  AMD Cezanne Vega (INTEGRATED)  mem_info_vram_total = 2 GiB, vis_vram = 2 GiB  Exactly backwards, in both directions at once. The file belongs to amdgpu rather than to dedicated memory: the proprietary NVIDIA driver never exports it, and an APU DOES, because the BIOS carves a UMA region out of system RAM and amdgpu reports that carve-out as VRAM. A classifier built on the rule I filed would have labelled the discrete card integrated and the integrated card discrete — and it would have passed review, because the rule is plausible and it is what the field name suggests. Only a machine carrying both kinds at once shows it up. That is the argument for routing this packet by hardware rather than by speed.  THE LADDER THAT REPLACED IT: three rungs over sysfs, each sound alone, tried in order. (1) vis_vram < vram => discrete. Part of the memory is not CPU-visible, so there is memory behind an aperture, which only exists when the device owns it. The pre-resizable-BAR signature: a 256 MiB window onto 8 GiB. (2) a prefetchable BAR >= 1 GiB => discrete. The ReBAR case, where rung 1 goes quiet because all of VRAM became visible. The 3070 lands here at 8192 MiB. (3) vram known, fully CPU-visible, no large aperture => unified. The UMA signature. The Vega lands here: 2 GiB behind a 256 MiB BAR. Otherwise None.  WHAT I REFUSED TO DO, since the packet's second criterion is about exactly this: no vendor table. Vendor 0x10de would have classified the NVIDIA card for free, correctly, and it would have been a guess — and this packet exists because unified is wrong for a discrete Radeon and discrete is wrong for every iGPU in the fleet. The NVIDIA card is classified from its BAR, which is evidence, or it is not classified at all. A non-resizable-BAR NVIDIA card on some other host will therefore read undetermined, and that is the correct answer rather than a regression.  RUNG 3 IS THE WEAK ONE AND ITS LIMIT IS IN THE CODE, not hidden: a hypothetical discrete board with under a gigabyte of VRAM and no resizable BAR would land there wrongly. No such part is in this fleet, and the rung is guarded by requiring the amdgpu VRAM figure to be present at all, so a driver that reports no VRAM never reaches it.  FIVE RENDERED STATES, NOT THREE, AND THIS IS YOLANDA'S CORRECTION. My first version printed one token, unknown, for all of "no GPU at all", "a GPU whose evidence path cannot run on this side", and "a GPU whose classifier ran and could not decide". They had shipped the same shape in this same file six hours earlier — accel_proof rendering one token for both "nobody to ask" and "asked and found nothing", so a host whose lane was WORKING read identically to one with no accelerator — and yoga caught it. They sent me the caution unprompted while ACKing my heads-up, which is the heads-up protocol paying for itself in the other direction. The envelope now renders no-gpu, unobservable-from-this-side, undetermined, unified, discrete. Only undetermined is a defect in the classifier; only unified licenses reading accel_mem_budget_gb as the whole machine; NONE of the five licenses summing a GPU pool with a CPU pool.  THE WSL2 ROW IS PERMANENTLY unobservable-from-this-side AND THAT IS CORRECT, not a gap: a paravirtual GPU on /dev/dxg exposes no DRM sysfs, so the Linux evidence path cannot run in the guest at all. It is a true statement about the boundary.  WINDOWS ARM NOT TAKEN, and my premise about it was wrong — yolanda checked rather than agreed. I assumed windows_gpus() already had a heap figure to populate; it enumerates Win32_VideoController for Name/PNPDeviceID/DriverVersion and sets the memory fields to None, so there is nothing to populate and it is a NEW EVIDENCE SOURCE, not a one-liner. Their warning belongs with whoever takes it: Win32_VideoController.AdapterRAM is a uint32 that saturates at 4 GiB, so an 8 GiB board reports 4095 MB, and on an integrated part it reports a shared-memory reservation. Present, plausible, and answering a different question — classifying from it would be a proxy standing in for the placement, which is the family 793-zumy exists to close, arriving through the vendor's own API. The honest source is a DXGI adapter's DEVICE_LOCAL heap or DXGI_ADAPTER_DESC.DedicatedVideoMemory. Filed as 968-mp4e.  PROCESS NOTE, recorded because it nearly corrupted this event: my first attempt at this write passed the summary in double quotes through bash, and four backtick-quoted tokens were command-substituted away — leaving sentences like "only  licenses reading" with the subject silently deleted. The fragment was unpushed and had never left this disk, so I removed it and rewrote through a file rather than editing it in place; fragment immutability protects order-independent folds, and nothing can have folded a file no other host ever saw. Worth knowing that a ledger write can lose exactly the words it is quoting and still parse.
