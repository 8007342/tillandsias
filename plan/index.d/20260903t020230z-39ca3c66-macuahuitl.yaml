        RAN THE E2E ON A HOST WITH THE IMAGE, as lenovinha asked. It had never executed end to end in its life, and getting it to do so exposed THREE further defects beneath the tautologies — the last of which is the interesting one.  DEFECT A (fixed here): step 1 ran `podman info --format='{{.Security.Rootless}}'`. That path does not exist; podman 5.8.4 needs `{{.Host.Security.Rootless}}` and errors with "can't evaluate field Security in type system.infoReport". Step 1 therefore FAILED on every run, and since the runner abandons a test at its first failing step, NO security step in this file has ever executed. The tautologies were never even reached. Fixed to the Host-qualified path; by hand it returns `true`.  DEFECT B (fixed here): step 3's image lookup was `grep '^tillandsias-forge:'`, anchored at line start, but podman reports `localhost/tillandsias-forge:v56.9.2.1` with a registry prefix, so it matched nothing and the step reported NO_FORGE_IMAGE on a host holding 34 forge images. Fixed to `grep -E '(^|/)tillandsias-forge:'`, which still excludes `tillandsias-forge-base:` because the colon must follow immediately.  DEFECT C (NOT fixed — lenovinha's call, see below): with A and B repaired the test finally reaches step 7, which returns `HARDENING_NOT_APPLIED: userns cap-drop`. THE CONTAINER IS CORRECTLY HARDENED AND THE ASSERTIONS ARE WRONG. Measured by launching one by hand with the same four flags and inspecting it:   UsernsMode  = "private"        <- step 7 greps for 'keep-id'; podman 5.8.4 records rootless --userns=keep-id as "private"   CapDrop     = ["CAP_CHOWN","CAP_DAC_OVERRIDE","CAP_FOWNER","CAP_FSETID","CAP_KILL",...]   <- step 7 greps for 'ALL'; podman records the EXPANDED set, and no capability name contains "ALL"   SecurityOpt = ["no-new-privileges","label=disable"]   <- this one matches, which is exactly why only userns and cap-drop were reported So the flags ARE applied and podman simply reports them in a different vocabulary than the assertion expects.  THE HISTORY THIS RECONSTRUCTS, and it is the point: the steps were tautological, so they always passed; underneath the tautology the assertions were ALSO wrong; and above both, step 1 aborted the test before any of it ran. Three independent faults stacked, each of which would have hidden the others. Removing the tautology did not reveal the wrong assertions — it could not, because nothing ran. Only executing it on a host with the image did. That is precisely why lenovinha flagged that someone must run it rather than closing it as green, and the flag was worth more than the fix.  WHY I STOPPED AT B. Fixing step 7 means choosing what it should assert, and steps 4, 5 and 6 ALREADY verify the BEHAVIOUR — non-root uid, no surviving file capabilities, a privileged operation refused. Step 7 is the only one asserting the DECLARATION, and whether to re-express it against podman's actual vocabulary or drop it as redundant with the behaviour checks is a design question about what this fixture proves. lenovinha reasoned explicitly about that boundary when they declined to turn it into a call-site audit, so the decision is theirs and not mine to take at 02:00.  STATE: the test is RED on the trunk and was red before (step 1). Two of the three faults are fixed; the third is now diagnosed with measured evidence instead of a symptom.
