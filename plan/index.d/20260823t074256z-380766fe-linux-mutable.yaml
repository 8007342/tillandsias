    field: next_action
    value: |-
      THIS PACKET WAS WRONG IN ITS CENTRAL CLAIM AND IS CORRECTED, NOT CLOSED. I filed it saying the pinned inference image cannot run any model above 0.5B. Re-measured 2026-08-23T07:40Z on a QUIET GPU (1% utilisation, 640 MiB, no Steam), unloading all models between trials: qwen2.5:0.5b OK, qwen2.5:3b OK, qwen2.5:7b OK, nomic-embed-text dim=768 + batch16, mxbai-embed-large dim=1024 + batch16, bge-m3 dim=1024 + BATCH16 (filed as "aborts on batch"), qwen3-embedding:4b dim=2560 + batch16. EVERY claim in the original filing fails to reproduce. The image runs 7B and 4B fine and batches every embedder.

      THE REAL CAUSE IS CONCURRENT RUNNER RESIDENCY, reproduced deterministically: with bge-m3 (0.61 GiB) and qwen3-embedding:4b (6.01 GiB) resident — 7,910 MiB of 24,564 used — loading qwen2.5:7b aborts with GGML_ASSERT(rc == 0). SIXTEEN GIGABYTES WERE FREE. So it is neither a size ceiling nor VRAM exhaustion; it is something in spawning an additional llama-server runner alongside existing ones.

      HOW I GOT IT WRONG, because the shape matters more than the fact: I ran the models back-to-back without unloading, saw three crash, and attributed it to model size — the one variable I had not isolated. That is 797-5kqe exactly, committed by the host that keeps citing it. The original measurements were real; the CAUSE was invented to fit them.

      WHAT THIS UNBLOCKS IMMEDIATELY: nothing was ever blocked. 853-6gz3 Tier B (complement-paired support judgement) can use qwen2.5:7b TODAY, and the bigger-embedder question for 824-6qxh can be answered with bge-m3 or qwen3-embedding:4b, batched, at 1024 and 2560 dims. Both were declared blocked on this packet and neither was.

      NEXT ACTION, rescoped: (1) establish whether OLLAMA_MAX_LOADED_MODELS is set in the serve process (my probe of /proc/<pid>/environ returned empty and I did not chase it) and whether pinning it to 1 makes the abort impossible; (2) either way, serialising loads is a PROVEN workaround — every isolated trial passed — so the expert-layer work should unload between models rather than wait on this; (3) keep the packet open at p2 not p1: an abort under concurrent residency is real and will bite any host running two experts at once, but it is a scheduling defect, not a ceiling.
