      summary: |
        CONTROL-ARM REGRESSION, MINE, FIXED — and it is the defect this fixture exists to catch, occurring inside the fixture.

        WHAT BROKE: macuahuitl's --ci-full went red on armC, the arm whose only job is to prove the rule CAN fail. Its message was correct about itself: "the rule PASSES the pre-fix runner — it cannot have caught this defect."

        CAUSE: armC read the pre-fix runner as `git show HEAD~1:scripts/run-litmus-test.sh`. HEAD~1 IS A MOVING REF. It named the pre-fix runner for exactly as long as my fix was the newest commit; the moment anything else landed on linux-next it named a commit that ALREADY carried rc=, so the rule passed and the control lost its teeth. MEASURED: 5/5 on my host at commit time, 4/5 in the gate an hour later, with NOTHING about the rule changed between them. HEAD~1 at the time of the red carried 4 occurrences of rc=%s — it was a post-fix commit being read as the pre-fix one.

        A guard whose verdict depends on how many commits have landed since is not a guard. That is the same class as everything else this packet documents, and I wrote it into the arm meant to prevent it.

        THE FIX depends on nothing outside the file: a literal pre-fix shape, written inline, that the rule must refuse. It asserts the COUNT — exactly 2 refusals from two pre-fix [FAIL] forms, with a third `rc-exempt:` line that must NOT count — so the arm now pins that exemptions are honoured as well as that something was refused. Deliberately NOT pinned to a fixed SHA instead: a fixed SHA is stable but still absent in a shallow clone, which re-introduces the skip path, and that skip was a silent no-teeth mode of its own. The property is "the rule refuses a [FAIL] printf with no rc", and stating it needs no git at all.

        VERIFIED IN THE CONTEXTS THAT DIVERGED, because one host and one cwd is precisely what produced the bug: 5/5 from the repo root; 5/5 from `/`; 5/5 with git absent from PATH; and 5/5 INSIDE THE tillandsias-builder TOOLBOX, which is where local-ci re-execs and therefore the environment the gate actually runs in. Gate green 255s.

        TWO CORRECTIONS TO THE REPORT, both factual and neither affecting the verdict:
        1. This guard does NOT run under `./build.sh --check`. I was asked to reproduce there because "the arm runs there"; a full --check log mentions it zero times. It is wired in local-ci.sh and runs under --ci-full. Anyone re-testing it with --check will see green and conclude wrongly.
        2. An intermediate observation of mine was wrong and is recorded rather than dropped: a detached-HEAD run returned rc=1 and I first read that as armB failing on a pre-fix runner. It was not — HEAD~2's runner already carries rc=. The detach had stashed my uncommitted fix, so the run executed the COMMITTED (broken) fixture. Benign, and I checked rather than asserting it.

        EVIDENCE: bfdc14c67, verified an ancestor of origin/linux-next before this event was written.
