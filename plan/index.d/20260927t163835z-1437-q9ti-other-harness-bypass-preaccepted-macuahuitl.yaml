    title: |
      Codex, Antigravity and OpenCode forges start with their bypass pre-accepted and MEASURED on the installed binaries (first screen or first JSON event is not a consent prompt); OpenCode's `"permission": "allow"` becomes forge-gated like the flags
    context: |
      Spec: default-image "Forge harness permission bypass is pre-accepted at launch, never
      prompted", scenario "Every harness, empty HOME, no dialog".

      Today: Codex passes --dangerously-bypass-approvals-and-sandbox (forge-gated, TUI and exec
      paths); Antigravity passes --dangerously-skip-permissions (forge-gated); OpenCode passes
      --auto on `opencode run` and relies on "permission": "allow" copied by
      apply_opencode_config_overlay regardless of TILLANDSIAS_HOST_KIND. Whether Codex or
      Antigravity show a confirmation for their flag on an empty HOME is UNMEASURED; the fixture
      is the measurement, and a green pre-fix arm for those two is a positive control, not a
      defect.

      Do: (1) fixture scripts/test-forge-harness-bypass-preaccepted.sh with one arm per harness:
      empty HOME/CODEX_HOME, HOST_KIND=forge, run the harness's non-interactive form with a
      trivial prompt under a timeout and assert the first output is not a consent question
      (Codex: `codex exec --json` first event is thread.started; Antigravity: agy's documented
      non-interactive form; OpenCode: `opencode run --auto --format json` first event); a named
      skip when the binary is absent on the host running the fixture (the forge image has them;
      bare hosts may not); (2) gate the OpenCode overlay's permission value on HOST_KIND=forge —
      either apply_opencode_config_overlay strips the key when not in a forge, or the overlay
      ships without it and the entrypoint merges it in a forge; negative arm asserts the key is
      absent from the effective config when HOST_KIND is unset; (3) if a harness DOES prompt on
      its flag, seed whatever consent record it reads (as 1437-y2wu does for Claude) and record
      the key in the fixture header.
    exit_criteria:
      - 'OpenCode negative arm: with HOST_KIND unset the effective config carries no permission: allow (pre-fix result: FAILS — the overlay copy applies it unconditionally)'
      - 'Codex, Antigravity, OpenCode forge arms: first output is not a consent prompt (pre-fix result: UNMEASURED — the arms are the measurement; a pre-fix green is the positive control and is recorded as such)'
      - 'each arm prints a named skip, never a pass, when its binary is absent (pre-fix result: FAILS — no fixture exists)'
    verifiable_closure: |
      bash scripts/test-forge-harness-bypass-preaccepted.sh exits 0 inside a forge image (all arms pass or named-skip); pre-fix: the OpenCode gating arm FAILS.
