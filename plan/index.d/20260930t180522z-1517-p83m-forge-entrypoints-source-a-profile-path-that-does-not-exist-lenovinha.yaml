    title: |
      every forge entrypoint sources agent-profile.sh from /opt/config-overlay, which the image never installs, and a silent [ -f ] guard skips it, so no forge has run it since 2026-05-14
    context: |
      FOUND 2026-09-30 on lenovinha while verifying 1446-qkx4 criterion 4.
      The four agent entrypoints (claude:15, codex:50, opencode-web:20,
      antigravity:12) run: if [ -f /opt/config-overlay/mcp/agent-profile.sh ];
      then source it. The Containerfile installs config-overlay/mcp/ at
      /home/forge/.config-overlay/mcp/, which is also container_profile.rs's
      ConfigOverlay mount point. /opt/config-overlay exists nowhere. The guard
      makes the miss silent, so since b837eae09 (2026-05-14) no forge has
      exported AGENT_PROFILE, AGENT_SUPPORTS_WEB or AGENT_DISPLAY_NAME, and
      1446-qkx4's generic-skill link never ran.
      LIVE EVIDENCE, lenovinha forge-maintenance, image v56.9.27.2 (carries
      159e494fe): /opt/skills/project-discipline is present, and
      ~/.config-overlay/mcp/agent-profile.sh contains link_forge_generic_skills,
      but /home/forge/.claude/skills does not exist.
      1446-qkx4's fixture sources the file directly, so it could not see this.
      Coordinator ruling (macuahuitl, 2026-09-30): a new p1 row, wider than
      1446. Drop the /opt fallback unless something really mounts there. A
      missing profile is LOUD, with why and remedy on the forge's stderr.
    exit_criteria:
      - 'each of the four entrypoints sources the path the Containerfile COPY installs (static arm) (pre-fix: FAILS — /opt/config-overlay)'
      - 'BEHAVIOURAL: the profile-loading block, run against a scratch HOME laid out like the image, exports AGENT_PROFILE and links project-discipline under the scratch ~/.claude/skills (pre-fix: FAILS — both absent, and nothing printed)'
      - 'a missing profile prints a named warning with why and remedy on stderr, rather than skipping silently (pre-fix: FAILS — silent)'
      - 'no /opt/config-overlay fallback remains unless a launch path mounts there, checked against container_profile.rs and every launch path'
    verifiable_closure: |
