    title: |
      The forge's push report (1264-s4id) names a GitHub BRANCH-PROTECTION refusal on the startup branch ("move away from <branch>"), which the mirror's push dry-run cannot see because --dry-run never sends a pack, so protection and pre-receive hooks never fire
    context: |
      1264-s4id reports the repository-level push capability from the mirror's existing dry-run verdict (refs/tillandsias/upstream-auth/*), and the branch level from the PROJECT's own push discipline (`tillandsias-plan discipline check-ref`, outcome A, coordinator ruling 2026-10-16). Server-side GitHub branch protection is a third source that neither sees: a dry-run push negotiates refs but sends no pack.
      OUTWARD ACT, stated as the coordinator asked: the lookup is a GitHub API call (e.g. GET /repos/{owner}/{repo}/branches/{branch}, whose `protected` field needs only read access; or /rules/branches/{branch}) made with the OPERATOR's token. It must therefore run in the git mirror, which already holds that token via git-credential-tillandsias and already calls GitHub for the dry-run, and stay within that existing credential scope: no new token, no new permission, nothing written.
    exit_criteria:
      - "the mirror publishes the startup branch's protection state beside its upstream-auth verdict, and lib-push-capability.sh reads it into push_branch (a protected branch says `move away from <branch>`)"
      - "the lookup uses only the mirror's existing credential and a read-only endpoint; a fixture shows no write call and no token in any output"
      - "an unanswered lookup (rate limit, network) is unknown, never `ok`"
    unscoreable: "a live protected branch on a real GitHub repository; a fixture with a stub API answers the mapping, the no-write rule and the unknown case"
    next_action: >
