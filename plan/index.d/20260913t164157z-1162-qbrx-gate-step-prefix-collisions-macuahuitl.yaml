    title: |
      Gate-step files are ordered by a scarce integer prefix chosen at commit time; the skill's advice to pick it after the integrate cannot close the race because the window is not merge-to-commit, it is commit-to-gate-FINISHING — six minutes in which any host can land a step. Four collisions in one night (205, 215, 255, 280), the last picked after the integrate. Allocate the prefix at land time, or stop ordering by scarce integers.
    context: |
      MEASURED 2026-09-13 (lenovinha's count): yoga at 205; lenovinha at 215,
      255, and 280 against yoga's 900-z3kv landing mid-gate. The 280 case
      followed the skill exactly — prefix chosen after the integrate — and
      still collided, which is the empirical case that advice cannot close a
      race whose window is the gate itself. Each collision costs a full
      re-gate (8-40 minutes depending on the host).

      WHAT TO BUILD, two candidates for the claimer to weigh: (1) the land
      tool allocates the prefix at land time — after its own integrate and
      before the gate — by renaming the new step to the next free slot and
      amending the commit, so the choice is made inside the only window
      that cannot race; or (2) step ordering stops depending on scarce
      integers (a `after:`/`before:` header the runner topologically sorts,
      with the integer as a tiebreak), so two hosts adding independent
      steps never contend. (1) is smaller; (2) removes the class.

      NOT IN SCOPE: renumbering existing steps.
