packets:
  - packet_id: litmus-runner-filter-should-hint-when-given-a-test-name
    order: 676-jf87
    status: ready
    priority: p3
    title: "run-litmus-test.sh: an unmatched litmus test-name filter should hint its owning spec"
    kind: enhancement
    deliverable: scripts/run-litmus-test.sh
    depends_on: [litmus-name-filter-silent-noop]
    pickup_role: linux
    capability_tags: [litmus, testing, shell, gate-integrity]
    estimated_hours: 1
    context: >
      Follow-on to order 300 (litmus-name-filter-silent-noop). An explicit
      filter that matches zero tests now fails loud with a non-zero exit, but
      a user who passes a litmus TEST NAME (litmus:foo) instead of a spec id
      still gets only "no litmus tests matched filter" — the runner selects
      tests by spec binding, so a name-shaped filter always matches zero
      tests, and nothing tells the user which spec owns that test. When the
      filter is litmus:* / litmus-* and a file under openspec/litmus-tests/
      has a name: equal to the filter, resolve and print that file's spec:
      as a hint. The failure message and non-zero exit stay unchanged
      (642 semantics: an unmatched explicit filter must still fail).
    exit_criteria:
      - "an unmatched litmus:* / litmus-* filter naming a real test prints the owning spec as a hint"
      - "an unresolvable name-shaped typo fails loud with the unchanged diagnostic and NO spurious hint"
      - "the existing fail-loud message and non-zero exit are unchanged"
