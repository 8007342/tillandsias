        Four separate coordination-cycle records inside one session is not relaying
        anyone, and those nine batch perfectly. So the refinement stands — the defect
        is that each was a separate gate-and-push, not that they were landing too
        much — but the exculpation does not follow from the data, and the split
        belongs here rather than the generous reading.

        AND IT SHARPENS THE RULE INTO SOMETHING BETTER THAN "BATCH EVERYTHING":
        a RELAY must land as soon as it is verified, because another host is blocked
        on it; a host's OWN records accumulate to one land per pass. Batching relays
        would trade the coordinator's churn for someone else's block, which is the
        same total delay moved onto whoever is least able to see it.

        ON ATTRIBUTION, and this is why the packet says landings are not
        host-attributable from the repo: the 15 is now supported by 78 recorded
        `ok:land:<sha>` outputs cross-matched against the 19 first-parent landings,
        giving 12 direct SHA matches with 3 more identified by subject. The
        mismatch has a real cause worth knowing — `ok:land:` reports the head AFTER
        integration while a first-parent walk sees the pre-merge commit, so the two
        SHAs legitimately differ on any land that merged. That is stronger than
        recollection and weaker than a measurement, and it is exactly the kind of
        claim that should be labelled as such.
