          3. A fixture. Note what it must not be: an --exec-guest test, which cannot reach a passing state here for reasons already on this row. The shape that works is the boot-triggered oneshot plus the virtiofs side channel, and the honest fixture asserts the CLIENT CONTAINER sees the host's body — a forwarder that starts and answers nothing is the silent-success shape this milestone exists to remove.
          4. The port (42421) and the forward target are currently operator-set env vars. For a shipped lane they need a defined source; that is a real decision, not a detail.
