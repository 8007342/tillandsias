        The body the client received was composed by a process on the macOS host. That is the transparency criterion this packet defined: the name keeps working while the process behind it moves across the VM boundary.

        THE FORWARDER: podman run -d --name tillandsias-vsock-forwarder --network tillandsias-enclave --network-alias inference --cap-drop=ALL --security-opt=no-new-privileges --security-opt seccomp=<derived> --entrypoint socat <forge-base> TCP-LISTEN:11434,fork,reuseaddr VSOCK-CONNECT:2:42421. State running; IP 10.0.42.2 on the enclave network. Confined throughout — the derived profile, not unconfined, no /dev/vsock passthrough.

        A PRIOR FINDING CONFIRMED IN PASSING: the forwarder logged `socat[2] W open("/dev/vsock", ...): No such file or directory` AND SERVED THE REQUEST ANYWAY. The 2026-09-14 arms called that warning incidental to socat rather than a requirement of AF_VSOCK; this is that claim holding under a working relay. Anyone who sees it in logs should not go hunting for device passthrough.

        I STOOD THE REAL INFERENCE CONTAINER DOWN FIRST, and this is a design consequence rather than a test artefact: build_inference_run_args also claims --network-alias inference, so for the host-native tier the forwarder REPLACES that container. Two containers on one alias is a coin flip, not a transport. Whoever wires this must make the tier selection mutually exclusive, not additive.

        WHAT IS NOT DONE, stated plainly because the demonstration is easy to overread. The product does NOT launch this forwarder. I started it from a probe script. Verified rather than assumed: grep for vsock-forwarder / VSOCK-CONNECT across crates/ returns only host_vsock_forward.rs's thread name, readiness.rs's doc comment and an unrelated WSL test — nothing that launches a guest-side forwarder. So:
          HOST LISTENER      in the product, opt-in (TILLANDSIAS_HOST_VSOCK_PORT / _FORWARD_TO), shipped
          SECCOMP DERIVATION in the product, shipped in v56.9.19.1
          IN-GUEST FORWARDER demonstrated only; no code launches it
        The packet's deliverable names "a host-side vsock listener PLUS the in-guest hop", so one of the two named pieces is still a hand-run container. The row stays in_progress.

        WHAT IS LEFT, for whoever takes it — me next, unless routed elsewhere:
          1. headless launches the forwarder when the effective tier is host-native, running the derivation first (decided: at container-start in headless, because vz.rs provisioning is first-boot-only and podman applies seccomp before an entrypoint can act).
