        MEASURED tlatoanis-macbook-air 2026-09-19T19:09:17Z, tray in continuous-runloop mode.

        A container on the enclave network, addressing THE NAME — not localhost, not an IP, not CID 2 — reached a process running on the macOS host:

          CLIENT CONTAINER (separate container, --network tillandsias-enclave, confined):
            curl -sS http://inference:11434/api/version
