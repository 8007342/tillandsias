    exit_criteria:
      - >
        M1 (P0) — `./build.sh --check`. EXPECTED RED TODAY, and the failure was
        reproduced from Linux by extracting accel_probe.rs into a standalone crate
        and running clippy for aarch64-apple-darwin: 7 errors at accel_probe.rs
        163 (unused_mut), 164/165 (unused_assignments), 242 (unused_variables),
        408 (unused_mut), 453 and 587 (dead_code) — all assigned or consumed only
        inside cfg(target_os="linux") blocks. nvidia_model_name was added in-window.
        Nothing suppresses these: build.sh has no macOS re-exec hook (only toolbox
        and WSL2), tillandsias-headless has no crate-level allow (unlike
        tillandsias-macos-tray, shielded at main.rs:11-12), no [lints], no
        clippy.toml, no rustflags override.
        DELIVERABLE = the FULL macOS lint list, not just accel_probe.rs. main.rs
        gained ~1,435 insertions since osx-next's tip and `ring` blocks whole-crate
        cross-compilation from Linux, so the remainder is unenumerated. Fix to green.
      - >
        M2 (P0) — Exercise the release path BEFORE v0.5 is cut:
        `scripts/build-macos-tray.sh && scripts/build-macos-dmg.sh`, then attach
        the DMG and confirm the background asset is present.
        PASS = the tray tarball and Tillandsias.dmg exist and the DMG mounts with
        its background. Requires zig + cargo-zigbuild on PATH
        (build-macos-tray.sh:45-46). This is the first compile of the 8,004-line
        macos-tray crate since 2026-07-27.
      - >
        M3 (P1) — What the VZ guest reports. ONLY THE HARDWARE CAN ANSWER STEP 1.
        The tray must not be running (main.rs:171 require_no_live_tray). Via
        `--exec-guest`, record /dev/dri, nvidia-smi, /sys/class/accel, then
        `tillandsias --capabilities`.
        EXPECTED-CORRECT: all absent -> accel_class=cpu-only, accel_cpu_cores<=4
        (vz.rs:981 clamps host_cores.clamp(1,4)), accel_ram_gb = GUEST RAM not Mac
        RAM. vz.rs configures no graphics device, so absence is the expectation —
        but expectation is not measurement.
        FAIL (serious): /dev/dri present -> the envelope emits
        accel_class=workstation-gpu accel_gpu_name=Vulkan_GPU on a machine with no
        container-deliverable GPU. Both outputs were confirmed byte-for-byte
        against the real accel_envelope() on Linux.
        CONFIRMED NON-ISSUE, do not chase: Metal is never advertised as
        container-deliverable. enumerate_gpus' macOS arm (:245-264) sets
        lanes ["host-native"] only -> present-unusable -> cpu-only. That risk does
        not exist.
        Then launch a forge and confirm the first line of
        $TILLANDSIAS_ACCEL_ENVELOPE is byte-identical to --capabilities.
      - >
        M4 (P1) — Litmus prerequisites, IN ORDER. Check `timeout` first
        (run-litmus-test.sh:825, no gtimeout fallback — absent GNU timeout means
        every step exits 127). Then check `md5sum`: if it is missing,
        litmus-plan-compaction-format-preservation.yaml:79 and
        litmus-loop-status-fragment-overlay.yaml:73 go PARTIALLY VACUOUS AND STILL
        SCORE PASS — both assignments are `md5sum | cut` pipelines, so set -e sees
        cut's exit 0, both vars become empty, and the byte-identity conjunct
        becomes [ "" = "" ]. The other conjuncts still assert; only the identity
        check dies. Both tests are severity:high, and a false green is strictly
        worse than a red.
        If md5sum is unresolved, file it against scripts/litmus-stdlib.sh, which
        exists precisely to hide GNU-vs-BSD dialect behind mf_* helpers. Both
        tests bypassed that sanctioned layer. Do NOT patch them with ad-hoc cmp -s.
      - >
        M5 (P1) — Cloud submenu, EMPTY-REPO case. Requires real hardware and a
        GitHub account with zero visible repos; a non-empty list masks the bug
        entirely. EXPECTED TODAY: "(loading repos...)" forever. CORRECT:
        "(no repos)" once the reply lands.
        de7201c7 added cloud_projects_loaded to the shared MenuState
        (menu_state.rs:304, initial false at :335, gate at :538). Exhaustive grep
        at HEAD: it is set true ONLY in notify_icon.rs:1657 (Windows). macOS
        action_host.rs:2192-2204 never touches it, and :2198's
        `if guard.cloud_projects == projects { return false; }` early-returns on
        the empty path anyway. The Windows lane patched macOS's TEST literal
        (menu_disabled_v2.rs:98) so the workspace kept compiling, and never wired
        the runtime.
        openspec/tray-parity-matrix.yaml:12-16 lists this row as macOS `done`,
        parity `required`. It is the ONLY not-actually-done required macOS row.
      - >
        M6 (P2) — PTY write path under load; macOS has never run it. Attach a
        forge lane, drive a high-volume writer, detach. PASS = no wedge, no hang,
        clean EOF teardown. b13151a1 (order 493, pty_handler.rs +498/-64) landed
        07-28 and is confirmed NOT an ancestor of the pre-merge osx-next. It lands
        directly on pty_vsock_bridge.rs / terminal_attach.rs, adjacent to open
        macOS packets 491 (p0) and 492 (p2).
    notes: >
      DROPPED from this bundle deliberately, as Linux-side work costing zero Mac
      cycles: accel_reason=- on the bare cpu-only verdict (contradicting the
      promise at accel_probe.rs:543), accel_ram_gb=- on the macOS arm, and the
