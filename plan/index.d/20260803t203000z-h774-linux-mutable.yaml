  # ─────────────────────────── PLATFORM BUNDLES ──────────────────────────────
  - packet_id: windows-v05-validation-bundle
    order: 598-yhu5
    status: ready
    desired_release: v0.5
    role: platform-validation
    pickup_role: windows
    priority: p0
    tags: [windows, v0.5, validation, bundle]
    title: >
      Windows v0.5 readiness bundle — six scoped checks, run in order, in one
      session.
    context: >
      Windows runs a native Win32 tray (crates/tillandsias-windows-tray,
      tillandsias-tray.exe) driving a WSL2 distro named `tillandsias` that runs
      the Linux tillandsias-headless guest binary. origin/windows-next was
      fast-forwarded to linux-next (db22caa8) on 2026-08-03 — it was 0 ahead, a
      verified ancestor, so nothing was lost. That fast-forward is also what
      removed ci.yml from this branch: push CI no longer runs here, and W2 is now
      the only gate.
    exit_criteria:
      - >
        W1 (P0) — Native Win32 typecheck.
        `cargo check -p tillandsias-windows-tray --all-features --all-targets`
        and `cargo test -p tillandsias-windows-tray`. PASS = both exit 0.
        `--all-targets` is load-bearing: it is the only thing that compiles
        tests/cli_integration.rs, tests/portable_smoke.rs, and the #[cfg(test)]
        block at src/notify_icon.rs:3588.
        This is plan/issues/cfg-gated-tray-code-never-typechecked-2026-07-21.md
        REOPENED — append evidence there rather than filing a new defect class.
        Do NOT run `cargo check --workspace` natively: it cannot pass, because
        accel_probe.rs:161-162 declares physical_cores/logical_cores and assigns
        them only under cfg(linux)/cfg(macos) then reads both at :233-235 (E0381).
        That is not a regression — windows-tray has zero headless dependency.
      - >
        W2 (P0) — The local gate, from Git Bash: `./build.sh --check`.
        PASS = re-exec into 'tillandsias-build' then all six steps green.
        Report three fail modes DISTINCTLY: (a) wsl.exe not found; (b) no rootfs
        tarball for the first import (with-wsl2-builder.sh:88-95 — this distro has
        never been bootstrapped here); (c) a genuine Rust/ledger failure.
        Note scripts/local-ci.sh:33 sources only the Silverblue wrapper and
        run-litmus-test.sh has none, so both run BARE on Windows — route them via
        `scripts/with-wsl2-builder.sh` or `./build.sh --ci-full`.
      - >
        W3 (P0) — Stage the guest binary, and GATE the destructive e2e on it.
        Build tillandsias-headless for x86_64-unknown-linux-musl WITH
        `--features listen-vsock` (mandatory — without it the guest boots and
        never binds the control wire, order 282). PASS = `file` reports static-pie
        ELF x86-64 and `strings` contains the VERSION string.
        If it FAILS, do NOT run the local-build e2e: it `wsl --unregister`s the
        runtime distro and reprovisioning falls back to a release download
        (wsl_lifecycle.rs:1071) for a tag that does not exist — expect 404 and an
        unprovisionable host.
        Do NOT use `build-guest-binaries.sh --verify` as the criterion: with one
        arch staged, staging_is_current() (:104-106) requires BOTH destinations
        and :121-127 prints verify:skip-stale-staging and exits 0 — a false FAIL.
      - >
        W4 (P1) — What the accel probe reports inside WSL2. ONLY THE HARDWARE CAN
        ANSWER THIS. Inside the distro, record `ls -la /dev/dri`,
        `ls /sys/class/accel`, `command -v nvidia-smi`, the cpuinfo count, and
        `cat ~/.cache/tillandsias/capabilities.json`; then read
        $TILLANDSIAS_ACCEL_ENVELOPE inside a forge lane.
        EXPECTED-CORRECT: accel_class=cpu-only.
        FAIL (serious, file it): accel_class=workstation-gpu with
        accel_gpu_name=Vulkan_GPU. accel_probe.rs:307-336 treats bare /dev/dri
        presence as a container-deliverable GPU and hardcodes vendor "amd" with
        lanes ["container","host-native"]. WSL2 GPU-PV exposes /dev/dri via
        dxgkrnl, which is NOT that capability, so agents would size models for a
        discrete GPU that is not there.
        On an NVIDIA host expect the conservative path instead: no CDI spec ->
        effective_inference_tier() = "cpu" -> cpu-only with
        accel_reason=cdi-spec-missing. Also record whether device_node
        "/dev/nvidia0" (accel_probe.rs:293) is asserted for a node that does not
        exist under WSL2.
        The eventual fix is a RUNTIME WSL2 check (/run/WSL, already used at
        main.rs:2013) — NOT a cfg(target_os="windows") gate, which would be inert
        dead code since that block runs in the Linux guest.
      - >
        W5 (P1) — Guest-binary provenance, not a code review. Record
        `tillandsias --version` inside the distro, and grep a running forge
        container's env for GH_TOKEN/GITHUB_TOKEN/HOMEBREW_GITHUB_API_TOKEN.
        PASS = version matches the current VERSION and the grep returns nothing.
        FAIL = any token present, or an older version, meaning the guest binary
        predates 82160687 and still runs order-359 behaviour.
        Do NOT hunt for a separate Windows credential leak: the tray's only
        credential injection is the Vault Shamir share + root token via Windows
        Credential Manager (installation_uuid.rs:155-220). The token removal
        itself is one file of shared headless Rust and is platform-neutral; the
        Windows-specific risk is purely PROVENANCE, because the newest published
        release predates the fix.
      - >
        W6 (P2) — Record which of `timeout`, `md5sum`, `jq`, `yq`, `ruby`,
        `tillandsias-policy` resolve on this host, then run
        `scripts/run-litmus-test.sh --phase pre-build --size quick --compact`.
        Check `timeout` FIRST: run-litmus-test.sh:825 wraps every step in
        `timeout --kill-after=10s` with no gtimeout fallback and no guard, so if
        GNU timeout is absent every step exits 127 and nothing downstream is
        reachable.
    notes: >
      Expected noise, do not file: scripts/cycle-metrics.sh will end the cycle
      with `verdict: attention:experts-never-called`, because :61 reads
      /tmp/forge-expert-usage.jsonl which only the Linux/Podman forge writes. That
      is a permanent false amber here. The verdict that DOES matter is
      attention:expert-answered-nothing-check-base-branch (order 531).
      Never assert a fragment count as a pass criterion — plan/index.d/ held 28,
      then 29, and is now empty after compaction. Use "parses, non-error, exit 0".

  - packet_id: macos-v05-validation-bundle
    order: 598-kibt
    status: ready
    desired_release: v0.5
    role: platform-validation
    pickup_role: macos
    priority: p0
    tags: [macos, v0.5, validation, bundle]
    title: >
      macOS v0.5 readiness bundle — six scoped checks. M1 is expected RED today,
      with the failure reproduced from Linux.
    context: >
      macOS runs an AppKit tray (crates/tillandsias-macos-tray, objc2 NSStatusItem,
      aarch64-apple-darwin) driving a Fedora 44 aarch64 guest under
      Virtualization.framework. origin/osx-next was fast-forwarded to linux-next
