packets:
  - packet_id: podman-sync-surface-and-streaming-have-no-timeout
    order: 714-4r6w
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    title: "The SECOND podman seam: 34 synchronous call sites bypass the bounded transport, and long operations still buffer to completion"
    kind: fix
    deliverable: "a bounded synchronous podman helper + streaming for build/pull/wait"
    pickup_role: any
    capability_tags:
      - podman
      - fail-loud
      - timeout
      - guest
    estimated_hours: 4
    depends_on:
      - podman-invocations-have-no-timeout
    context: |
      Split from 690-7adz (windows host, 2026-08-13) after its first criterion
      landed. 690-7adz says "it is ONE seam, so a bounded implementation there
      fixes the whole surface at once". Measured while implementing it: that is
      true of the ASYNC seam and false of the product.

      `crates/tillandsias-podman/src/backend.rs` (PodmanBackend::execute) is now
      bounded: every operation class declares a budget, the trait takes it as a
      required parameter so no transport can spell "no deadline", and a caller
      needing longer passes one explicitly via `execute_with_budget`.

      But `podman_cmd_sync()` (lib.rs) returns a bare `std::process::Command`
      and is called from 34 sites across main.rs, remote_projects.rs,
      vault_bootstrap.rs, client.rs, launch.rs and lib.rs itself. `std`'s
      `Command::output()` has no timeout at all, so every one of those calls is
      still an unbounded wait — including the vault container-state and
      `logs --tail 40` probes that run on the vault failure path, which is
      exactly where a wedged substrate is most likely and an operator is most
      stuck.

      Note the two call sites 690-7adz named by line number have MOVED since it
      was filed (2026-08-11); do not chase the line numbers, chase
      `podman_cmd_sync()` and the interactive `Command::status()` exec.

      The interactive token-collecting exec is a genuine design question, not an
      oversight: a human is typing into it, so a wall-clock deadline is wrong.
      What it needs is a deadline on the SETUP (image load, container start) and
      none on the human's typing — which is why it is called out here rather
      than given a number by default.
    outcome: |
      No podman invocation anywhere in the product can wait forever, and an
      operation that moves data reports progress while it does so.
    exit_criteria:
      - "A bounded synchronous helper exists and `podman_cmd_sync()` no longer hands out an unbounded `Command` to call sites that then `.output()` it; a grep-able check or test pins that no call site awaits a sync podman command without a budget."
      - "Long-running operations (build, pull, wait) stream progress rather than buffering to completion, so a multi-minute build is distinguishable from a hang WHILE it runs, not after."
      - "The vault readiness wait and the token-collecting exec carry explicit, justified budgets — with the justification recorded for the interactive case, including why the human-input phase is exempt."
      - "A test drives a stalled SYNCHRONOUS stand-in and asserts a bounded, named failure, with a prompt stand-in as the negative control so it cannot pass by always failing."
    events:
      - type: filed
        ts: "2026-08-13T06:25:00Z"
        host: windows
        summary: |
          Filed from implementing 690-7adz. The async seam is bounded; the
          synchronous surface next to it is not, and the packet's "one seam"
          framing would have closed the work with 34 unbounded calls still in
          the product.
