      FUTURE LITMUS FILENAME: scripts/test-relay-ref-is-discoverable.sh — assert
      the refs/heads/work/ escape appears in at least one surface a host reads
      BEFORE a land, not only in land-on-platform-branch.sh's refusal text. Move
