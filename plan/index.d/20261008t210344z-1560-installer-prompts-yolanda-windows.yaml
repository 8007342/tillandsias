# Ledger fragment — append-only, IMMUTABLE once written.
# Operator ruling 2026-10-08 (relayed by the coordinator), verbatim: "we do not
# ask end users to do power user stuff. That's our guideline. An install prompt
# asking for destructive cases should not be an acceptable case. End user is NOT
# a power user. No prompts like those, we make all the decisions for them, on
# their behalf, for their best interests. So SOFT reset is the default only and
# forever. A power user wanting to do a hard reset should be capable of figuring
# out where to place a flag and which flag, we do not need to print any power
# user messages during install, at all. Install should be for END USER (NOT
# POWER USER) and be a pretty installer, rather than an informational/debugging
# installer. As frictionless as possible for end users."
