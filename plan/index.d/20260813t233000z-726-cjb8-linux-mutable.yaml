packets:
  - packet_id: split-parent-reoffered-as-work
    order: 726-cjb8
    release_target: architecture-audit-epic
    status: ready
    desired_release: v0.5
    priority: p1
    kind: fix
    title: 'The selector re-offers a SPLIT parent as the urgent pick, outranking its own slices'
    pickup_role: linux
    depends_on: []
    capability_tags:
      - plan-ledger
      - selector
      - convergence
    context: |
      A packet that has been split is a criteria holder, not work — the slices
      are the claimable things. It stays `ready` so it can hold the criteria
      until the children close, and nothing taught the selector that.
      Found the cycle immediately after splitting 606-bvnp into four ready
      children: the very next select-work-batch run offered the PARENT as
      `urgent=git-mirror-cross-project-service-identity` again, outranking its
      own slices because it is older and p0. The split had made the work
      claimable and the selector kept pointing past it at the thing no cycle can
      start. Two other split parents sit `ready` in the ledger with the same
      latent behaviour.
    exit_criteria:
      - select-rows skips a ready packet whose split_into names at least one non-terminal child
      - the parent becomes visible again once every named slice is terminal, since closing it is then the right pickup
      - both directions are pinned by a litmus against a fixture ledger
    verifiable_closure: |
      One fixture ledger, flipped in place: with the child ready the selector
      emits the child and not the parent; with the child completed it emits the
      parent.
    notes: |
      Suppressing the parent unconditionally would be the opposite bug. The
      filter is scoped to "while a slice is open" for exactly that reason.

