        existing source-digest idiom; _sha256 falls back to shasum for macOS,
        which runs this script via build-osx.sh; the stamp is written atomically
        (temp + mv) so a concurrent build.sh cannot read a torn one.
        CORRECTNESS, not just speed: the mtime probe could not see WHICH bytes
        were staged, the hazard build-sidecar.sh's own 723-b9cn comment names
        ("a wrong binary left in place would be served to every later build as
        up-to-date"). The stamp hashes the staged artifact, so a tampered,
        corrupted, or wrong-target binary is rebuilt rather than trusted —
        verified live: appending bytes to the staged sidecar produced a restage
        (0.234s) and a valid ELF, where the old probe reported up-to-date.
