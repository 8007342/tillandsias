        the stronger form of the same guarantee: exit criterion 2's "false
        negatives are impossible by construction" holds because ANY content,
        mode, path, or set change moves the manifest digest, and the digest was
        WIDENED (effective target triple, musl-target availability, rustc
        version) with inputs the mtime probe was blind to — widening can only
        cause more rebuilds, never fewer. Manifest shape (path:type:mode:content,
