events:
  - packet_id: enclave-health-absent-detection-is-never-given-an-expectation
    event:
      type: progress
      ts: "2026-09-03T19:20:39Z"
      agent_id: linux-yoga-claude-20260903t190925z
      host: yoga
      summary: |
        FIXED, AND IT CAUGHT A REAL ABSENT SERVICE ON ITS FIRST RUN — which also
        means I HAVE A CORRECTION TO MAKE ABOUT MY OWN LAST CYCLE.

        THE FIX. images/default/enclave-services.txt declares the enclave
        services a provisioned host is expected to be RUNNING;
        cycle-preflight.sh reads it into TILLANDSIAS_ENCLAVE_EXPECTED_SERVICES,
        which the health check's absent-detection loop has always consumed and
        was never given. A health check cannot derive what SHOULD exist from
        what DOES exist — that is circular — so the expectation had to be
        declared.

        THE LIST IS A JUDGEMENT, NOT AN INVENTORY, and the file says so: only
        persistently-running services belong (vault, proxy). GitLogin is
        transient, NixCache is dev-tier and optional by design, the builder is a
        toolbox and dev-inference is the dev lane. Listing any of them would
        manufacture false absents on correctly-configured hosts, and a check
        that cries wolf gets switched off — which is how the original gap
        survived. A Rust test in container_deps.rs asserts the file matches the
        persistent set in BOTH directions, so neither a missing service nor a
        well-meaning addition can drift.

        AND IT IS GUARDED FOR UNPROVISIONED HOSTS: the expectation is only
        exported when tillandsias-vault exists. Vault is the anchor every other
        persistent service depends on in the graph, so its presence distinguishes
        "provisioned and degraded" from "never provisioned". A machine with no
        enclave is not missing anything.

        VERIFIED, and the verification is the correction:

            before: ok:cycle-preflight:...:services-ok
            after:  ok:cycle-preflight:...:services-down0-absent1
            fail:enclave-service-absent:service=tillandsias-proxy:state=absent

        THE CORRECTION I OWE. Last cycle I reported that repairing 975-rsgm took
        this host "from services-down1 to services-ok" and told the operator the
        proxy was fixed. IT WAS NOT. The proxy had been REMOVED and never
        recreated, and `services-ok` was the blind spot — the very one I had
        filed as 994-8r3w minutes earlier. I read my own defect's output as
        evidence of health, in the same cycle I described it. The check now says
        `absent1`, and that is the true state and has been for two cycles.

        THE PROXY IS STILL ABSENT AND I DID NOT FAKE A REPAIR. Both flows that
        bring it up through the orchestration refuse on this build:
        `--github-login` needs a terminal, `--list-cloud-projects` reports "this
        build lacks remote-projects support (requires the `vault` and `tray`
        features)". Hand-crafting a `podman run` would bypass
        ensure_proxy_ca_key_secret and recreate exactly the CA desync 975-rsgm
        is about, so I did not. Restoring it needs a full-featured binary or the
        installed product — an operator/host action, and it is now VISIBLE
        rather than silent, which is what this packet set out to achieve.

        A THIRD INSTANCE OF THE BUILD-VS-EXISTS LESSON, relayed from
        macbook-macos two cycles ago and now landed on me: the flows that would
        recover the proxy are feature-gated out of the binary I have, so "the
        code exists" and "this artifact can run it" are different claims. That
        warning arrived as advice about signature changes; it turned up as an
        inability to repair my own host.
