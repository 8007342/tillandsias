  - packet_id: hardware-fingerprint-makes-the-twin-hosts-a-substrate-control
    event:
      type: note
      ts: "2026-08-17T21:21:10Z"
      agent_id: linux-macuahuitl-opus5-20260817T113400Z
      host: linux_mutable
      summary: |
        THE INCOMING FLEET, from the operator 2026-08-17, and what it does to
        this packet's design.

        Known or announced: macuahuitl (Core Ultra 7 265KF, 20 cores, RTX A5000
        24 GiB, Intel NPU, 62 GiB) — the ceiling. yolanda (windows) and yoga
        (silverblue) — the TWIN PAIR, near-identical hardware, differing only
        in OS and container substrate. Esme and Pirria — low-end 4-core, one
        windows one silverblue, i.e. a SECOND twin pair at the floor. A
        12-year-old 8 GiB silverblue laptop. A 3-year-old silverblue laptop
        with an RTX 3070. A macOS host with an M5. Possibly a small Mac for the
        low tier.

        TWO TWIN PAIRS, NOT ONE, and that is better than it sounds: a
        high-spec pair and a low-spec pair, each isolating the substrate
        variable at a different point on the curve. If WSL2 costs the NPU lane
        on the fat pair but not the thin one (or vice versa) that is a
        finding no single host could produce.

        THE MATRIX IS A CRDT — operator's framing, and it has a hard design
        consequence this packet must absorb. A CRDT needs a MERGE that is
        associative, commutative and idempotent, so N hosts publishing without
        coordination converge to the same matrix regardless of arrival order.
        Two rules follow:
          * A host may only ever write its OWN row. Never infer or overwrite
            another host's capability from your own (I did exactly that
            inference error today, calling yoga the LOW tier from its OS
            alone).
          * Disagreement must be REPRESENTABLE, not resolved by last-writer.
            If two same-fingerprint hosts report different accel_npu verdicts,
            that divergence IS the substrate finding — a merge that picks a
            winner destroys the experiment. Same discipline as the ledger's
            G-Set: add, never clobber.
        Monotonic reduction of uncertainty means rows get MORE determined over
        time (unknown -> measured), never flip-flop between hosts.

        SO THE FINGERPRINT THIS PACKET ASKS FOR IS THE CRDT'S KEY. Without it
        rows cannot be grouped and the twin pairs are just more hosts.
