    title: |
      scripts/clear-vault-host-credentials.sh cannot remove ~/.cache/tillandsias/vault-data on a rootless-Podman host (written from inside the container under a subuid, so a rootless rm -rf is refused), prints warn:clear-vault-credentials:partial and EXITS 0 beside three empty-store assertions — the room reads cold while it is warm, and 900-z3kv's resync path is never exercised without a hand fix; podman unshare rm -rf removes it cleanly and the script never tries it.
    context: |
      MEASURED by pirria 2026-09-14 (v56.9.13.1 daily-channel smoke, the
      report in owned_files, §2): the clearer removed both fallback files,
      could not remove vault-data (drwxr-xr-x 100100, subuid-owned, audit/
      auth/ core/ logical/ sys/ intact), printed the partial warning and
      exited 0; containers, volumes and images were all empty in the same
      breath, which is the shape that makes this invisible. `podman unshare
      rm -rf ~/.cache/tillandsias/vault-data` removed it (rc 0) and
      scripts/probe-credential-cold-state.sh flipped credential-warm →
      credential-cold immediately; only then did --init log "Shamir share not
      found; deriving first-boot dummy key K" — the 900-z3kv path ran for the
      first time, after a hand fix. The runbook already tells readers to
      "read the clearer's last line, not the exit code", which is the sign the
      exit code is wrong rather than that readers need instructions (pirria).
      WHAT TO BUILD: retry the vault-data removal through podman unshare when
      the direct rm is refused and podman is available; re-test the path
      before declaring success; keep the partial warning for the case where
      both fail AND exit non-zero on it; make the smoke's §2 guard the
      clearer's own last line or an explicit test ! -e on the directory (the
      three test -z store assertions pass while this is broken).
