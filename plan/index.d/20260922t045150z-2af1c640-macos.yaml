    value: "a fixture over the probe document in which a render_nodes entry with\nvantage container and a proof value yields a GPU device record carrying the\ncontainer lane, and an entry without proof does not — plus yoga's re-filed\ncapability row reading schedulable: gpu/container/ollama through\ncapability-matrix with no change to the matrix itself.\n\n\n[2026-09-22T04:51:50Z macos] \nFIVE OF SIX CRITERIA DELIVERED ON macbookair; CRITERION 2 IS OUTSTANDING AND\nBLOCKED ON A CAPABILITY THIS HOST DOES NOT HAVE. Stated first so no reader takes\nthe fixture's green for the row.\n\nWHERE THE FIX LIVES, AND WHY NOT WHERE THE DEFECT SHOWS. amd_gpu_disposition\ndecides the lanes, and order 793-zumy REFUSES the container lane there on a\nmeasured argument: its inputs — rocm_gfx, kfd, render_node — are all host-vantage,\nand on yoga all three were true while the container had neither the device nodes\nnor a ROCm backend. That refusal is correct and is UNTOUCHED. The promotion lives\nin run_probe, the first place the container-vantage proof and the device records\nare both in scope, so the lane is DERIVED FROM PROOF rather than guessed from the\nhost.\n\nKEYED PER DEVICE ON ITS OWN NODE. A GPU record's device_node is set from\ndrm_render_node_for(pci_addr) — the render node of the very PCI address that\nnamed it — so matching it against DrmRenderNode::node is the identity relation\nthe record was already built from, not a new guess. \"A GPU exists and some node\nwas proven\" would promote the wrong device on a two-GPU host, and an arm asserts\nexactly that case.\n\nTHE BAR IS Reachable, NOT THE LITERAL Placed, and the reason is in the code: on\nyoga the field escalated reachable -> placed between two runs with NO host\nchange, so a rule keyed on Placed would grant and withdraw the lane as a model\nhappened to be resident. Enumerated is excluded — it says the hardware exists and\nnothing about any lane.\n\nCRITERION 1 (proven vantage reaches the record) — a_proven_container_node_reaches_the_device_record\nCRITERION 3 (unproven stays unproven) — an_unproven_container_lane_stays_unproven,\n  three arms: host vantage, no node at all, and another device's proven node\nCRITERION 6 (vocabulary honoured) — reachable_promotes_and_enumerated_does_not\n  plus promotion_clears_only_the_reason_it_answers, which holds the promotion to\n  the one reason it addresses (a container-reachable device with no engine is\n  still engine-missing)\n\nCRITERION 4 WAS ALREADY MET BY EXISTING CODE, and this row did not implement it —\nrecorded so nobody credits this change with it. probe_container_render_nodes\nexecs INSIDE the container (inference_container_exec) and reads the engine's own\n/api/ps for residency, which is asking the destination. The instrument the row\nnames as WRONG, podman inspect .HostConfig.Devices, appears nowhere in the probe.\n\nCRITERION 5 (the matrix line distinguishes input from output) — a `reading:` line\nnow prints between derived_tier and the schedulable/present-unscheduled lines,\nnaming which is a routing INPUT and which are PROBED OUTPUTS. Existing keys and\nvalues are deliberately untouched: scripts/test-fleet-heartbeat-sees-a-ledger-filed-blocker.sh\nmatches whatever vocabulary this command publishes, so renaming a key to carry\nthe distinction would move the defect into that reader.\n\nMUTATION-VERIFIED, four mutations, each redding its own arm and only its own:\n  vantage check removed (promote on host evidence)  -> unproven arm RED\n  node match removed (any proven node promotes)     -> unproven arm RED\n  bar moved to the literal Placed                   -> vocabulary arm RED\n  clear any reason rather than the one answered     -> reason arm RED\nRestored: 549 passed, 0 failed; clippy --all-targets -D warnings exit 0 read as\nan exit code rather than grepped; cargo fmt --check clean."
