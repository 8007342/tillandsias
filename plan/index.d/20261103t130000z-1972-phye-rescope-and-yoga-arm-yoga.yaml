      summary: |-
        MEASURED on yoga (840M vulkan, work/1972-phye built into the tray, tools/call over the tillandsias-default lane socket, client clock):
        (1) gpu.status with the engine warm and no LLM: holder {kind image, model sdxs09.safetensors, vram_gb null, model_files_gb 1.34, exits_after_idle_s 300}, released_image_engine null.
        (2) Check placed BEFORE the warm call: two podman calls, ~120-150 ms (podman exec curl /api/ps alone 77-85 ms x3); warm calls became 3272 / 3119 ms against bounds 3120 / 3110 (0 of 2). Moved after the reply on a thread: 3114 / 2971 / 3015 ms against 3090 (2 of 3; the miss is 24 ms).
        (3) NEGATIVE ARM: ollama logs "dropping integrated GPU; to enable, set OLLAMA_IGPU_ENABLE=1"; qwen2.5:0.5b loads with size_vram 0. The first cut released the engine anyway ("only partly on the GPU"); fixed to count only models holding VRAM. Re-run: released_image_engine null, tillandsias-imagegen-warm still running. Also: amdgpu mem_info_vram here is the 512 MiB carve-out (0.21 GB free), not what Vulkan uses, so the free-VRAM rule is meaningless on this iGPU unless an LLM holds VRAM.
        Criterion 3's positive arm needs a host whose ollama places the LLM on the GPU.
