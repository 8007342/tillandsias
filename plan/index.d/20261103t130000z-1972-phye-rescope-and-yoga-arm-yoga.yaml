        CRITERION 1 RE-SCOPED (coordinator macuahuitl-fedora, 2026-11-03). As filed it named a mechanism that does not exist on Linux: forges call http://inference:11434 directly on the enclave network (crates/tillandsias-headless/src/main.rs:7163, :9556); the tray relays it only on the macOS/Windows vsock path (vsock_server.rs:3208), so nothing can take a GPU turn before an ollama load. A background /api/ps poll was ruled out: the operator's standing ruling polling-cadence-needs-operator-approval (events over polls; anything not real-time polls in minutes; a new cadence needs operator approval). Criterion 1 now reads: a short warm TTL plus event-driven release only. gpu.status and each warm image call look at /api/ps once and release the resident engine when an LLM holding VRAM is spilled (0 < size_vram < size) or measured free VRAM is under 1 GiB; no background loop.
  - packet_id: an-ollama-model-load-goes-through-the-gpu-arbiter-so-it-evicts-a-resident-image-engine-before-claiming-vram
    event:
      type: question
      ts: '2026-11-03T13:00:00Z'
      host: yoga
      summary: |-
        DESIGN QUESTION FOR THE OPERATOR (recorded at the coordinator's direction, not to be built): should the tray own a proxy in front of inference:11434, so a load passes through the GPU arbiter BEFORE it claims VRAM (the only way to get "release before load" on Linux)? Cost: every forge inference request hops through the tray, and the enclave network changes. Today's event-driven release frees the device after the fact.
  - packet_id: an-ollama-model-load-goes-through-the-gpu-arbiter-so-it-evicts-a-resident-image-engine-before-claiming-vram
