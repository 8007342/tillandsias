    title: |
      tillandsias-plan append-event stops fabricating agent_id=unknown host=linux: host defaults from the compiled platform, agent_id derives from TILLANDSIAS_AGENT_ID or refuses loudly.
    context: |
      Shaped from plan/issues/plan-append-event-defaults-fabricate-host-linux-2026-08-16.md.
      `append-event` without --agent/--host hardcodes agent="unknown",
      host="linux" (crates/tillandsias-plan/src/main.rs append-event arm) —
      a wrong FACT on two of four host kinds, written into an immutable
      fragment by every non-linux host that omits the flags. The binary
      knows its platform at compile time; `unknown` is the hand-composed
      improvisation 756-hn3a removed from claim recipes. Other writer arms
      already share resolve_writer_host, whose own fallback is the literal
      "unknown" plus a warning — also replaceable by the compiled platform,
      which is a known fact, not an absence.
    exit_criteria:
      - |
          append-event with no --host stamps the compiled platform (cfg target_os -> linux|macos|windows), TILLANDSIAS_HOST_KIND still winning when set (forge); resolve_writer_host's shared fallback follows the same rule so set-field/expire-claims stop writing host=unknown.
      - |
          append-event with no --agent derives agent_id from TILLANDSIAS_AGENT_ID; when that is absent (or the value is the literal "unknown") it REFUSES with a loud verdict naming scripts/agent-identity.sh — the literal string "unknown" can no longer be written as an agent_id.
      - |
          Unit tests pin both resolvers: a non-linux build can never default host=linux, and absent/literal-unknown agent identity is an error, not a written event.
    verifiable_closure: |
      cargo test -p tillandsias-plan passes including
      writer_host_default_is_the_compiled_platform_never_a_fabricated_linux
      and writer_agent_refuses_absence_and_the_literal_unknown;
      scripts/test-ledger-ts-guard.sh stays 9/9 green.
