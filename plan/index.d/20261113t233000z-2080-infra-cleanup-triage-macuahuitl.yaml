    owned_files:
      - crates/tillandsias-core/src/config.rs
    title: "The forge's .git directory lives on cold disk instead of the source tmpfs, and compute_source_budget_with sizes the tmpfs for hot source only, without the half-of-memory clamp or the pack-size times four rule"
    context: |
      compute_source_budget_with clamps its result to memory_max_mib / 2, and the base compute_source_budget multiplies the pack size by hot_path_inflation and floors it at hot_path_source_floor_mb. Those rules sized a tmpfs that also held builds and worktrees. Once builds, blobs and worktrees leave (A2) and .git moves to cold, the tmpfs holds working-tree source only and the old rules size something that no longer exists.
      Keep the 2006-srcr high-water and declared-need inputs only if they still mean something for source; otherwise retire them with the rule and say so.
    exit_criteria:
      - "A unit test asserts that compute_source_budget_with for a 10 MB pack with a 4 GiB memory_max returns a size derived from working-tree source and NOT from pack times inflation or memory_max / 2; and a launch fixture shows the project .git directory on a non-tmpfs mount. Pre-fix result: FAILS on both."
    verifiable_closure: "cargo test -p tillandsias-core source_budget exits 0 with the new tests, and the launch fixture reports the .git directory off tmpfs. Pre-fix result: FAILS (the clamp and the multiplier decide the value; .git is on the tmpfs)."
    unscoreable: "unpinnable-until-the-test-exists: the fixture or guard named in verifiable_closure is this row first deliverable and is written in the same commit as the change it tests (1136-n8sh)."
    next_action: "After A1: write the two tests first and watch them fail, then relocate the gitdir (check the mirror clone path and the credential guard still resolve it) and rewrite the budget function."
    provenance: "Operator direction 2026-11-13; compute_source_budget_with read in crates/tillandsias-core/src/config.rs; triage report A."
