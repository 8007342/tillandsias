packets:
  - packet_id: forge-image-fast-linker-and-sccache
    order: 961-flnk
    status: ready
    kind: fix
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    depends_on: []
    capability_tags: [forge, images, performance]
    title: >
      The forge image ships no fast linker and no compilation cache —
      plain GNU ld serializes every link tail on the hardware class that
      feels it most; adding lld (or mold) + sccache is the cheapest
      floor-hardware win on the board.
    context: |
      From the N150 baseline (plan/issues/pirria-n150-floor-baseline-
      2026-09-02.md): lld, ld.lld, mold, ld.gold and sccache are ALL
      absent from the guest; RUSTC_WRAPPER unset. On 4-core hosts the
      serial link tail dominates small-graph builds (cargo -j4 achieves
      only 1.86x on a 12-crate graph), and every litmus cargo step, the
      expert bootstrap, and the per-commit plan-crate rebuild all pay
      it. Image-level: install lld + sccache, set RUSTFLAGS
      link-arg=-fuse-ld=lld and RUSTC_WRAPPER=sccache with the cache on
      the persistent tool-cache volume (960-tpop's boundary — an
      sccache on the overlay would be another rented payload).
    verifiable_closure: |
      A fresh floor guest: cargo build -p tillandsias-plan cold shows
      sccache MISS then a recycle shows HIT with measurably reduced
      wall (bracket both), and readelf on the produced binary confirms
      lld linked it. No regression in the x86_64 musl release lane.

