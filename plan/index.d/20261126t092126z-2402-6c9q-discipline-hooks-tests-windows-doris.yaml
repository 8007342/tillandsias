        `assert!(st.success())` on `git init`. Actual: git refused the scratch global config,
        "fatal: bad config line 2", because the test wrote `hooksPath = C:\Users\...` and git reads a
        backslash in a config value as an escape.
      Fixing that exposed two more Windows-only spellings in the first test: starts_with(repo.canonicalize())
      compared the verbatim \\?\C:\ form against git's C:/ form (panicked at :480), and the note was
      searched for the backslash spelling of a value git reports with forward slashes (:495).
      Production is not affected: it sets core.hooksPath through `git config`, which escapes correctly.
    verifiable_closure: |
      cargo test -p tillandsias-plan --lib discipline_hooks::tests passes on native Windows (2/2 on
      doris) and on Linux, where every change is the identity.
