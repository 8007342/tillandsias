  title: Approval grants are stored in Vault as device-signed statements, and verifiers trust the signature, not the storage
  context: 'Design R1-R3 of openspec/changes/os-verified-approval-gates. Grant path secret/tillandsias/approvals/grants/<host>/<action>/<target-hash>; Vault policy: approval-broker role writes, git-mirror-hook, mcp-gate and release-tooling roles read; file audit device on. Verifiers check SSHSIG and expiry against allowed-signers; a missing or invalid grant (e.g. after a vault wipe) re-prompts. Records carry last_authorized and scope. Trail: hash-chained signed journal in refs/notes/tillandsias/approvals is authoritative; Vault audit is the access trail.'
  exit_criteria:
  - 'A fixture against a dev Vault asserts: the broker role writes a grant and the mcp-gate role reads it; a forge or agent token is denied the write and the denial appears in the audit device; a grant record with a tampered signature placed by the root token is treated as ungranted; after wiping the KV path the next request prompts and stores a new grant; the record shows last_authorized and scope. Pre-fix result: FAILS, no grant path, policy or verifier exists.'
