  title: The GitHub README sends installers to tillandsias.org/#install and summarises the architecture instead of stale per-platform install steps
  context: 'Operator request 2026-10-27. The README carried long, stale per-platform install instructions, a v0.3 "Fedora Pivot" section and a link to a missing README-ABOUT.md. Rewritten as a fleet-agnostic landing page: what Tillandsias is, Install pointing at https://tillandsias.org/#install (anchor confirmed in the live site, the "I want it!" page), a spec-cited architecture summary (tray, forge, enclave network, git mirror, proxy, vault, inference, per-platform substrate), short platform support, License. The RELEASE LEDGER section is kept byte-identical because the release skill appends rows to it, the smoke skill reads its rows, and scripts/check-ledger-distillation.sh counts them.'
  exit_criteria:
