        ACCEPTANCE IS STILL OWED ON TWO REGIMES (this row's own criterion): this
        host, whose mirror was rebuilt 00:13Z and is younger than the fleet's
        others, and yoga's install regime. Arms 9 and 10 run anywhere and are
