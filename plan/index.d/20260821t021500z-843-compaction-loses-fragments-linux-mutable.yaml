# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by linux_mutable (macuahuitl), 2026-08-21T02:15:00Z.
#
# The CRDT's garbage collector destroys data. Found by a collision survey that
# was looking for something else entirely.
packets:
  - order: 843-624y
    packet_id: ledger-compaction-deletes-fragments-it-never-folded
    desired_release: v0.5
    title: "plan compact marks every LOADED fragment consumed, not every FOLDED one, then deletes them — measured evidence loss"
    status: ready
    kind: fix
    pickup_role: linux
    priority: p0
    capability_tags: [plan, ledger, crdt, data-loss, gc, rust]
    deliverable: crates/tillandsias-plan/src/fragments.rs
    depends_on: []
    context: >
      THE DURABILITY GUARANTEE THIS PROJECT RESTS ON HAS A HOLE, AND IT IS IN
      THE GC. Everything else about the ledger is append-only and recoverable —
      that was re-proven on 2026-08-20, when reverting a 550-packet archive
      sweep restored the base and lost NOTHING, because every closure lived in
      a fragment. Compaction is the one operation that can actually destroy,
      and it does.

      THE MECHANISM, one line. crates/tillandsias-plan/src/fragments.rs:642:

          let consumed = fragments.iter().map(|f| f.path.clone()).collect();

      Every fragment that was LOADED is reported consumed — whether or not any
      of its content reached the base. Compaction then deletes exactly that
      list. A fragment whose shape the fold does not recognise contributes
      nothing, is marked consumed anyway, and is removed from the repo.

      THE SIBLING MODULE ALREADY DOES IT RIGHT, 300 lines away in the same
      crate. crates/tillandsias-plan/src/loop_status.rs:625 refuses with
      "compaction would LOSE fragment {} section `{}`". So this is a port, not
      a design problem: loop-status compaction asserts per-fragment coverage
      before deleting; ledger compaction does not.

      MEASURED LOSS, verified three ways against committed refs rather than
      inferred:
        * `git show 9d12276ca^:plan/index.d/20260814t200300z-736-macos-control-wire-evidence.yaml`
          resolves — the fragment existed, and its first record is
          `packet_id: v04-release-gate-macos-e2e-evidence, order: 735-6iki`.
        * Its text ("ADDENDUM — macOS DOES reach a usable control wire…")
          appears NOWHERE under plan/ on linux-next today. `grep -rl` returns
          empty. That is a v0.4 RELEASE-GATE CLOSURE, destroyed.
        * The survey that found it reports 12 of 13 flat-shaped fragments in
          that one compaction contributed nothing and were deleted anyway,
          taking ~20 event records.

      SCALE, for whoever sizes the recovery: 1,144 fragment files have been
      deleted from plan/index.d across all history, across at least five
      compaction commits (1d7ae93ef alone deleted 167). The loss rate is not
      1,144 — most fragments fold correctly — but it is not zero either, and
      nothing today can tell you which is which without replaying history.

      WHY EVERY SIGNAL WAS GREEN, which is the part that generalises:
        * `plan check` passed — 9d12276ca's own message reports "873 packets,
          ids unique, live references sound". It validates what IS in the
          ledger; it cannot see what never arrived.
        * `check-fragment-status-loss.sh` passed — it reads the fragments that
          still exist. The deleted ones are invisible to it by construction.
        * The author hand-verified — by diffing the BASE, which structurally
          cannot show content that never got there.
        * Git was never involved. This is not a merge. No conflict, no history
          of a conflict, nothing for a merge census to find.

      A fourth instance of the week's recurring shape: every gate verified a
      real property, and the property that mattered was not among them.

      AND IT IS A PREREQUISITE, NOT A SIDE QUEST. The operator's 2026-08-21
      proposal (a plan/next.d/ fragment channel; more generally, deriving
      next_action from typed events) INCREASES fragment volume flowing into
      this GC. Adding write channels to a lossy collector multiplies the loss.
      This is why it ranks above every merge-collision item in the survey that
      found it, and above the CRDT roadmap it was commissioned to produce.
    exit_criteria:
      - "fragments::compact reports as consumed ONLY the fragments whose content demonstrably reached the base, per-fragment — the same assertion loop_status.rs:625 already makes. A fragment that folded to nothing is REFUSED, not deleted."
      - "A negative control proves it: craft a fragment the fold does not recognise, run compaction, and show it exits non-zero naming that file. Remove it, show compaction succeeds. Report both exit codes unmasked."
      - "A recovery pass over history reports which of the 1,144 deleted fragments contained records that never reached the base, so the destroyed set is KNOWN rather than merely suspected. Restoring them is a separate decision; enumerating them is not optional."
      - "The 735-6iki macOS release-gate evidence is either restored from 9d12276ca^ or explicitly recorded as unrecoverable with a reason."

