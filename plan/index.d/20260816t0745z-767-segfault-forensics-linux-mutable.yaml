packets:
  - packet_id: enclave-squid-proxy-chronic-segfaults-unwatched
    order: 767-es4w
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "squid (the enclave proxy) has 263 recorded SIGSEGVs since 2026-06-30 and nothing watches it — tonight it sat Exited(139) for two days with zero alarms"
    deliverable: "a proxy that either restarts under supervision with a crash counter surfaced in diagnostics, or fails the lane loudly when it dies; plus a decision on the crash root cause (squid build/config vs traffic pattern)"
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [proxy, squid, enclave, fail-loud, forensics]
    estimated_hours: 4
    context: |
      604-vmcg's notes asked for this packet after confirming whether the proxy
      silently restarted or degraded. CONFIRMED 2026-08-16 (forensics fork):
      `coredumpctl list` holds 263 squid SIGSEGV entries from 2026-06-30
      through 2026-08-12 (census preserved at
      ~/claudia/tillandsias-forensics/604-vmcg/squid-crash-census.txt), and the
      parent session's cycle-0 container sweep found tillandsias-proxy
      Exited(139) ~2 days old with nothing restarting or reporting it — the
      proxy segfaults, STAYS DOWN, and every enclave consumer degrades
      silently. Recent dumps (2026-08-10 onward) are `present` and
      symbolicable; older ones are missing/inaccessible. Two of the 263
      (2026-08-10 02:14, 03:12) ran as uid 525287 (container userns), the rest
      uid 1000. Cadence is near-daily with multi-crash bursts, which reads as
      traffic-triggered, not random.
  - packet_id: forge-pid1-crash-supervision
    order: 767-nkkq
    status: ready
    desired_release: v0.5
    priority: p1
    kind: enhancement
    title: "Supervise the forge harness so an agent crash no longer kills the container silently — the lane must FAIL LOUD with preserved evidence instead of dying as PID 1"
    deliverable: "a minimal PID-1 supervisor (or exec wrapper) in the forge launch path: harness crash -> record signal/rc + last-output pointer into a durable finding surface, mark the lane failed-crashed, exit nonzero; NEVER auto-restart the agent silently"
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [forge, opencode, bun, crash, fail-loud, supervision]
    estimated_hours: 4
    context: |
      Disposition chosen by 604-vmcg's forensics (2026-08-16) from evidence:
      the crash is a Bun/JSC runtime fault (build-id-verified binary
      c30f169b..., Bun v1.3.14/0d9b296a; identical return-address frames
      across the 2026-08-03 and 2026-08-10 x86_64 incidents; frame #1 is a
      literal handler(int){abort()} shim, faulting frames live in
      statically-linked JavaScriptCore entered from JIT code — the same shape
      as the 2026-07-27 arm64 panic). Upstream-shaped: not fixable in this
      repo, may already be fixed in newer Bun (install-at-launch means lanes
      float to newer opencode; RECURRENCE-WATCH: a crash with Bun > 1.3.14
      should be escalated upstream with the preserved dumps). What IS ours:
      today a SIGSEGV in the agent takes the whole container because opencode
      runs as PID 1 — the lane dies with status 139 and only host-side
      systemd-coredump noticed. Supervision converts that into a loud,
      attributable lane failure with evidence, and generalizes to every
      harness (claude/codex), closing the same silent-death class 741-3y48
      closed for findings. Constraint: do NOT silently restart the agent —
      a crashed drain cycle must not re-run its prompt unattended.
  - packet_id: smoke-harness-consecutive-lane-dimension
    order: 767-qrbv
    status: ready
    desired_release: v0.5
    priority: p2
    kind: enhancement
    title: "The smoke/e2e harness runs one lane; both opencode segfaults hit the SECOND consecutive lane of a session — the repro dimension is untested"
    deliverable: "an opt-in smoke variant (or e2e gate step) that runs two consecutive forge lanes against the same stack and asserts the second lane's health, wired into the repro notes of 604-vmcg"
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [e2e, smoke, forge, crash, repro]
    estimated_hours: 3
    context: |
      604-vmcg criterion 4, shaped as its own packet by the forensics fork
      (2026-08-16): incident 1 (2026-08-04) was the second consecutive forge
      lane ~20min after a clean first lane; incident 2 (2026-08-10) was a
      long-running validation lane. The repeat-session dimension exists in
      neither the litmus tier nor the smoke skills, so the crash-prone shape
      is exercised only by accident. Keep it opt-in/rate-limited — a second
      lane doubles smoke cost (the 4h e2e rate limit and the velocity audit
      both bound this).
