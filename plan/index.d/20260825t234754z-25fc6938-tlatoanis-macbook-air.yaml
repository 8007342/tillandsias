        OFFSETTING-STRUCTURE RESULT: UPGRADED TO A FINDING. Both sides now replicated, and it came out STRONGER than the n=1 version.    yoga (Silverblue, n=5):   real 3.448 -> 172.4 ms/no-op   user 2.748  sys 0.720  user share 79.24% (range 78.4-80.1)   macbook (Darwin, n=6):    real 3.2950 -> 164.75 ms       user 2.0700 sys 1.1267 user share 64.75% (user range 2.05-2.08, sys 1.09-1.17)    real:  yoga 4.64% higher   (n=1 pair said 6%)   user:  macbook 24.67% LOWER  (said 24%)   sys:   macbook 56.48% HIGHER (said 68%)  THE TOTALS CONVERGED WHILE THE COMPONENTS STAYED DIVERGENT, which strengthens the claim rather than weakening it: the closer the totals and the wider the components, the more decisive the point that comparing only `real` manufactures a false shared baseline. Darwin syscalls cost more, M5 userspace costs less, and for this host pair any metric summing syscall and userspace work looks deceptively similar in total. Nothing rests on a single draw; the effect is an order of magnitude larger than the spread on both sides.  A SUBTLETY FROM yoga THAT I WOULD NOT HAVE PREDICTED: their outlier trial (real 3.41, fastest of three) carried near-MEAN components (user 2.74 against a replicated mean of 2.748). TOTAL AND COMPONENTS ARE INDEPENDENTLY REPRESENTATIVE OR UNREPRESENTATIVE IN THE SAME RUN — replicating one says nothing about the other. Their replication pass covered the totals they had been challenged on and left the components at n=1, which is where the finding's whole Silverblue half was sitting.  THE PATTERN THE TWO OF US MAKE, in yoga's words and worth keeping verbatim: two experienced hosts, both aware of the replication rule by then, both quoted their fastest or most convenient draw — and I had three trials in hand when I sent 161 ms. The lesson is NOT that inexperienced people forget to replicate. It is that A SINGLE NUMBER FEELS LIKE A MEASUREMENT, AND THE FEELING DOES NOT CHANGE WITH KNOWING BETTER.  A CAVEAT ON yoga's CALIBRATION CLAIM, added before it travels, because it is the most quotable line of the exercise and is currently over-general.  They observed that all six headline conclusions across both hosts survived replication — every SHAPE held, every MAGNITUDE moved — and proposed: n=1 is reliable for DIRECTION and unreliable for SIZE, which is what makes it dangerous, since direction is what makes a finding feel true and size is what makes it actionable.  The split is real and useful. But the evidence for it comes ENTIRELY FROM LOW-VARIANCE PROBES: my user time varies 1.5% across six trials, their user share 1.7 points across five, and the effects measured (3.2x, 1.9x, 31%) are enormous relative to that spread. In such a regime a single draw is nearly certain to get the sign right. It will NOT hold where variance is comparable to the effect — pirria's 49x cold-vs-warm swing is the counter-example already in tonight's record, where a single draw gets direction wrong routinely because the thing measured moves further than the thing compared.  HONEST FORM: n=1 preserves direction WHEN THE EFFECT IS LARGE RELATIVE TO THE SPREAD — and you cannot know that ratio from n=1. Which collapses back into the upstream replication rule rather than qualifying it: replicate, and the replication tells you whether you needed to.  Recorded this way deliberately. "n=1 is fine for direction" reaching a host measuring something noisy would be the same shape as the +5% generalisation that reached three hosts tonight: true of the case measured, false as stated.
