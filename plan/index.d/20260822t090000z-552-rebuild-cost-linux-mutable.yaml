        AND THE WASTE RATIO, which is the actual argument. A typical edit
        touches one file. Rewriting methodology/distributed-work.yaml — the
        largest file in the corpus — changes 120 of 20,657 chunks, or 0.6%. So a
        one-file edit currently pays 100% of an eight-minute embed to update
        0.6% of the index. Delta would make that ~1.5 s. Roughly 325x.

        I TRIGGERED THREE OF THESE TONIGHT BY ACCIDENT, which is how the cost
        became visible: `crates/` is a corpus root, so every edit to
        crates/tillandsias-plan/src/spec.rs — the file that IMPLEMENTS the
        chunker — changes the corpus that the chunker indexes and forces a full
        re-embed. About 25 minutes of GPU time for changes touching a handful of
        files.

        WHY I DID NOT IMPLEMENT IT THIS CYCLE, stated as a judgement rather than
        left as a gap. The embed loop is line-positional: vectors.jsonl line N
        pairs with chunks.jsonl line N, and it carries a per-batch arity check
        whose comment says exactly why — "a server that silently drops one input
        shifts every subsequent pairing, and a shifted index answers plausibly
        and wrongly".

        A delta join REUSES vectors from a prior generation keyed by
        content_hash, and a mis-join produces precisely that shifted index —
        while passing the existing per-batch arity check, because the batches it
        does embed are all the right size. The guard that protects the current
        path is structurally blind to the failure the new path introduces. That
        is not a reason never to build it; it is a reason the build must come
        with its OWN identity check, and not be written at 02:00 at the end of a
        long session on a 200 MB data path whose failure mode is silent and
        confidently wrong.

        THE DESIGN, so the next cycle starts from here:
          * Chunk already carries `content_hash` — the data model supports this
            and only the builder does not use it.
          * Reuse must be keyed on (content_hash) and verified per chunk, not
            per batch: after assembly, assert that every reused row's
            content_hash equals the hash of the chunk it was paired with. That
            is the check the current arity test cannot express.
          * The non-vacuity control writes itself: corrupt one cached pairing on
            purpose and the assembly must refuse. If it does not, the delta path
            is worse than the full rebuild it replaces.
          * Retention is a separate lever worth pricing at the same time: 609 MB
            for three generations, and delta makes a generation cheap enough
            that `keep` could plausibly go up rather than down.
