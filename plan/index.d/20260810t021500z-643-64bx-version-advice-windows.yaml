        Pinned structurally by a new step in litmus:versioning-shape: the commit
        advice must be reachable only under a branch test, and the --no-verify
        warning must be present. Structural rather than behavioural because the
        harmful form is an instruction correct on ONE branch and wrong everywhere
        else — no single-branch run would catch it.

        NOT DONE, and why: criterion 1 (move the local build counter off tracked
        files) and criterion 3 (`./build.sh --install` then a normal push, with no
