    kind: feat
    deliverable: the loop asks experts FIRST for pulling work/triaging/debugging/researching; each gap-driven fallback emits a loud warning naming the gap; a ratchet retires fallbacks (warn -> delete) as the experts close gaps
    depends_on: []
    pickup_role: linux
    capability_tags: [experts, methodology, work-pull, fallback-ratchet, triage]
    context: >
      Operator directive (2026-08-13): FAVOR the expert system when pulling work,
      triaging, debugging, researching — extends bootstrap.mcp_first_read_path
      from reads to the whole work loop (methodology expert_first_work). Where the
      expert has a GAP, fall back to today's method (grep, direct reads) BUT emit
