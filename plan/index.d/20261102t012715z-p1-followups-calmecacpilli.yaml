  order: 1958-22yh
  status: ready
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [approvals, licences, linux, windows, security]
  estimated_hours: 10
  related: [1956-ecpb, 1954-dvz9]
  title: "accept-licence cannot sign on Linux or Windows: the only os-verified approval signer is the macOS tray's Secure Enclave one; there is no enrolment, no allowed-signers writer, no grant store and no broker nonce"
  context: |
    1956-ecpb verifies SSHSIG approvals with ssh-keygen -Y verify in namespace tillandsias-approval@v1, against $TILLANDSIAS_APPROVAL_ALLOWED_SIGNERS or <state_dir>/approvals/allowed_signers. Nothing on Linux or Windows produces those signatures or enrols a key (openspec/changes/os-verified-approval-gates D1, D2 and R2). The operator's acknowledgement #1 records therefore ship unsigned.
  exit_criteria:
  - Linux (fprintd, polkit or FIDO) and Windows (Windows Hello) produce an SSHSIG over the D3 statement with an enrolled per-host key, and the host writes allowed_signers
  - the operator re-signs acknowledgement #1 through accept-licence, and licence_consent verifies it
  unscoreable: "unpinnable-until-the-guard-exists — the deliverable includes a cargo test that signs with the host signer under a software-key test double and verifies it through licence_consent; a live Hello or fingerprint prompt needs a human."
  next_action: Read os-verified-approval-gates design D1-D5 and R1-R4 and the macOS approval_signer.rs; implement the Linux signer first.
  provenance: 1956-ecpb agent report, 2026-11-02.
