packets:
  - packet_id: host-escape-shim-names-non-utf8-env
    order: "2227-shu8"
    status: ready
    kind: fix
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [toolbox, podman, shim, hermetic]
    estimated_hours: 1
    owned_files:
      - scripts/with-tillandsias-builder.sh
    title: "The builder toolbox's host-escape shim skips or names a non-UTF-8 env value instead of failing as flatpak-spawn's opaque conversion error"
    context: |
      The 934-7jd4 shim (scripts/with-tillandsias-builder.sh, _install_host_escape_shims) forwards every TILLANDSIAS_*,
      LITMUS_*, FORGE_*, NIX_*, CONTAINER_HOST and DOCKER_HOST variable to flatpak-spawn --host as --env=NAME=VALUE.
      flatpak-spawn (glib) refuses a value that is not valid UTF-8, with "flatpak-spawn: Invalid byte sequence in
      conversion input", and the wrapped podman or nix never runs. Hit on macuahuitl's land gate for #1295 on 2026-11-22:
      a test set TILLANDSIAS_AGENT_RESULT_FORMAT to b"json\xfe\xff" while a neighbour ran podman (2226-kiwe fixed that
      test's lock). Any caller with such a value in its environment gets the same opaque refusal, which names neither
      the variable nor the shim.
      Fix: before building _fs_args, test each forwarded value for valid UTF-8 (LC_ALL=C.UTF-8 and a bash pattern, or
      iconv -f UTF-8 -t UTF-8 when present). Then either skip that variable with one stderr line naming it and the
      shim, or refuse by name with why/remedy lines; prefer skip, since the variable is forwarded best-effort. Shims
      already installed in existing toolboxes are regenerated by the next init, so note that in the row's closure.
    exit_criteria:
      - "With TILLANDSIAS_X set to the bytes json\xfe\xff, podman through the shim runs (or refuses naming TILLANDSIAS_X and the shim), never 'Invalid byte sequence in conversion input'."
      - "A valid UTF-8 TILLANDSIAS_* value is still forwarded unchanged."
    unscoreable: "unpinnable-until-the-guard-exists: the implementer adds a fixture that runs the generated shim with a stub flatpak-spawn that refuses non-UTF-8 argv, as glib does."
    next_action: "Pick up."
    provenance: "macuahuitl-fedora 2026-11-22: file the shim follow-up (skip/name non-UTF-8 env values) as its own ready row."
    events:
      - type: filed
        ts: "2026-11-22T15:00:17Z"
        host: calmecacpilli
        summary: "filed"
