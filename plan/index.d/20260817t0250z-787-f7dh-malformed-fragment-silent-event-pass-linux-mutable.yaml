# Filed by linux_mutable (macuahuitl), 2026-08-17: adjacent property the
# 785-sqe6 fork hit while building its fixture, recorded rather than folded in.
packets:
  - packet_id: malformed-fragment-makes-the-closure-event-pass-silently-empty
    order: 787-f7dh
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "A fragment that does not parse as YAML makes check-fragment-status-loss's event pass return NOTHING for it — the guard reports ok, and only the separate 698-7n6q parse gate stands between that and a lost closure"
    deliverable: "the event pass distinguishes 'this fragment declares no terminal events' from 'this fragment could not be parsed', and says so loudly for the second; or it hard-depends on the parse gate having run, with the dependency asserted rather than assumed"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [guards, plan-tooling, fail-loud, coverage]
    estimated_hours: 2
    context: |
      Found 2026-08-17 by the 785-sqe6 fork, the honest way: its first
      events-only fixture failed and the cause was NOT the guard. The fixture's
      own summary text contained `": "`, which made the fragment invalid
      YAML, so `fragment-terminal-events` returned nothing and the guard
      passed — a green verdict over a fragment whose closure event was never
      examined.

      That is the same silence 785-sqe6 just closed, arriving through a
      different door: 785-sqe6 fixed "the pass never ran"; this is "the pass
      ran and saw nothing, because the input was unreadable". Both look
      identical in the verdict.

      Defense in depth exists — 698-7n6q added a diff-scoped gate that fails
      when a fragment ADDED by the current change does not parse — so the
      window is a malformed fragment that reaches the tree without passing
      through that gate (a merge, a hand edit, a sibling branch, a fragment
      already present before the gate landed). The fix should make the
      distinction visible at the point of use rather than relying on a
      different guard having caught it earlier: silence from a parser is not
      evidence of absence.
      Note for whoever takes it: `": "` inside an unquoted summary is a
      realistic way to produce this by accident — several packet summaries in
      this ledger contain colons — so a fixture reproducing it is cheap.
