    verifiable_closure: |
      TWO SYMPTOMS, ONE FAMILY — a runner that reports on work it did not do.

      (1) `--list` PRINTS AN EMPTY LIST AND EXITS 0 on a corpus of 444 litmus
          files. Closure: `scripts/run-litmus-test.sh --list` names a non-zero
          number of suites, AND a fixture arm reds if the list is ever empty
          while openspec/litmus-tests/ is not.

      (2) `run-litmus-test.sh dev-build --size all` executes 1 of the 14 tests
          the bindings bind to that spec, exits 1, and accounts for the other
          13 NOWHERE — not in PASS, FAIL, SKIP, not-run, or Total. Closure:
          either all 14 are attempted, or every one that is not appears in a
          named bucket. A count that does not sum to the number of bound tests
          is the defect.
    title: |
      the litmus runner's --list prints nothing on 444 files, and a spec run executes 1 of 14 bound tests while accounting for the other 13 nowhere
    context: |
      MEASURED ON ESMERALDINHA 2026-09-21 at trunk 6c372ed26, in the WSL2
      builder distro. Found while trying to obtain a mutation proof for
      1329-m8dk and finding no way to watch the test under work actually run.

      (1) THE `--list` BUG IS ONE LINE AND IS DIAGNOSED.
      scripts/run-litmus-test.sh:2339-2341 reads the bound names and then does

          local test_file="${LITMUS_TESTS_DIR}/${test}.yaml"
          if [[ -f "$test_file" ]]; then ... print the row ...

      The bound name form is `litmus:cross-target-cfg-gate-check` (a COLON);
      the file is `litmus-cross-target-cfg-gate-check.yaml` (a HYPHEN). So
      `${test}.yaml` is `litmus:...yaml`, which is never a file, so the `-f`
      test is false for EVERY row and the loop prints nothing. The header
      "Available Litmus Test Suites:" is printed unconditionally above it and
      the command exits 0, so the output looks like a successful listing of
      zero suites rather than a failed lookup.

      THE RUN PATH ALREADY HAS THE FIX — line 1949 is
          local test_file="${LITMUS_TESTS_DIR}/${test_name//:/-}.yaml"
      with the comment "Convert colon to hyphen for file lookup". The listing
      path is the copy that did not get it. The remedy is `${test//:/-}` plus
      an arm that reds on an empty list.

      WHY IT MATTERS BEYOND CONVENIENCE — --list is what a newcomer (or an
      agent) uses to find out what can be run. It answers "there are none",
      confidently, and that answer is wrong about 444 files.

      (2) THE 1-OF-14 IS MEASURED BUT NOT DIAGNOSED, AND IS FILED AS AN
      OBSERVATION. yq reads 14 names under spec_id dev-build:

          yq eval '.specs[] | select(.spec_id=="dev-build") | .litmus_tests[]' \
            openspec/litmus-bindings.yaml | wc -l   ->  14

      The run prints exactly one `Executing litmus:...` line
      (litmus:environment-isolation), which FAILS on this host because podman
      is not on the Windows host lane, and then:

          > PASS 0  FAIL 1  SKIP 0  Total 1 (executed 1, skipped 0)
          > Test Verdicts — passed=0 advisory=0 skipped=0 not-run=0 failed=1
          > Status [FAIL]

      13 bound tests are in no bucket. The whole log is 27 lines.

      TWO CANDIDATE CAUSES WERE CHECKED AND ELIMINATED, so that the next
      person does not spend the time again:
        * FAIL-FAST. should_fail_fast_for_spec returns false unless
          STRICT_MODE=1; STRICT_MODE defaults to 0 (line 395) and is set only
          by --strict or the --spec shorthand, neither of which this run used.
        * A STEP EATING THE LOOP'S STDIN. The execution loop feeds the name
          list with `done <<<"$litmus_tests"`, so a step that reads stdin would
          swallow the rest — but the step is already run with `</dev/null`
          (line 459 of the step executor), so it cannot. THIS HYPOTHESIS WAS
          WRONG and is recorded as wrong on purpose.
      The remaining suspect is get_litmus_tests_for_spec (line 592), whose
      first tier returns rc=0 with EMPTY output when the jq query yields
      nothing, a state its own comment says callers must read as "no tests"
      rather than "the lookup failed" — but that tier is fed by `yaml-json`,
      which exists on this binary, so this is a suspicion and not a finding.

      WHAT THIS BLOCKS. litmus:cross-target-cfg-gate-check is bound ONLY to
      dev-build, and dev-build stops at its podman-dependent first test on any
      Windows host. So that litmus, and any assertion added to it, CANNOT BE
      WATCHED TO FAIL from esmeraldinha through the runner at all. That is the
      named reason on 1329-m8dk for three of its 43 steps.
    next_action: >
      Fix (1) first: it is `${test//:/-}` at scripts/run-litmus-test.sh:2340
      plus an arm that reds when --list prints zero rows while
      openspec/litmus-tests/ is non-empty. Do NOT close the row on that alone.
      For (2), instrument get_litmus_tests_for_spec to print what it returned
      and re-run `scripts/run-litmus-test.sh dev-build --size all`; the
      question to answer is whether the loop received 14 names and stopped, or
      received 1. Those are different bugs and the fix differs. Whichever it
      is, the closure condition is the same: the buckets must sum to the number
      of bound tests, because a total that does not sum is how 13 tests went
      missing without a single line of output saying so.
