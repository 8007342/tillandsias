        summary: |
          THE FIRST COMPARISON BETWEEN THESE HOSTS THAT MEANS ANYTHING, and its
          verdict refutes this packet's own title.

            yoga     hw2-e94acbd479cb8b80   (linux, Ryzen AI 5 340, 6c12t, 840M)
            yolanda  hw2-f4e46bd13a0220cf   (windows, Ryzen AI 7 350, 8c16t, 860M)

          Both computed by the product's own key, independently on each host,
          from probes that both now enumerate real devices. They DIFFER. The
          twin pair is not a substrate control and never was.

          The title of this packet - "makes the twin hosts a substrate control"
          - encodes the refuted premise. Left as-is deliberately: renaming it
          would erase the record of what the fleet believed for weeks and what
          it cost to find out. The deliverable underneath survives intact and is
          met: the capability document CAN now prove or refuse a same-hardware
          claim rather than have one asserted over it. Its first real verdict is
          that the assertion it was built to check was false.

          Route: refused by yoga's shell script 2026-08-30 from CPU model and
          core counts; refused again today by an independent Rust implementation
          on both hosts. Same conclusion by an instrument neither host could
          tune to a preferred answer.

          NPU PARITY, the operator's actual instruction, reached the same place:

            yolanda  accel_npu=present-unusable  npu 1022:17f0  engine-missing
            yoga     accel_npu=present-unusable  npu 1022:17f0  (amdxdna)

          The same part, agreeing on the NPU line. On the GPU line the two hosts
          give DIFFERENT honest reasons - windows engine-missing (no
          dispatchable userspace), yoga container-lane-unverified (a host
          enumeration cannot speak for a container). Neither is `none`, which is
          what both said this morning.

          NOT CLOSED. The second half - the accel matrix keyed on
          (fingerprint, substrate) - is untouched, and no usable NPU lane exists
          on either platform: a present device with no runtime this product can
          dispatch to, on both. That is a real project, not a probe fix, and
          recording it as a gap rather than a result.

          THREE ERRORS OF MINE FOUND EN ROUTE, all the same shape: a green that
          names only itself. (1) cargo test passing while clippy failed the
          gate. (2) cargo build passing while the TEST code did not compile.
          (3) FIELD_SET_VERSION not bumped in the commit that introduced it.
          yoga's diagnosis of (3) is the general one and is now recorded in the
          code: a version constant cannot guard the commit that creates it,
          because at that moment there is no previous version to differ from -
          the first use of a new invariant is the one occurrence it cannot
          check.
