      summary: >
        Design note for the next reader: the batched read is deliberately
        FAIL-SAFE rather than fail-fast. A binary predating `query`, a jq-less
        host, or a harness stub that advertises the subcommand without serving
        it yields an empty map — and an empty map would silently pass every
        packet, which is exactly the silent-discard failure this gate exists to
        catch, reintroduced by an optimization. So an unusable batch falls back
        to the per-packet `status` lookups this change replaced, loudly on
        stderr, and scenario 8 of the fixture pins that path against a stub that
        advertises `query` and refuses to serve it. Two observations left for
        others rather than folded in: (1) the `declared`-empty early exit at the
        top of the script also skips the closure-event pass entirely, so a
        fragment carrying ONLY events and no `packets:` block is not examined —
        pre-existing behaviour, preserved deliberately here, but it looks like a
        genuine coverage hole worth its own packet; (2) build.sh's `_step`
        tracker closes the previous phase when the next banner is printed, so a
        765-dfry step record spans banner-to-banner and can absorb un-bannered
        work that follows it — this guard measured 5ms directly but ~1.5s as a
        step record on a 0-pair ledger, so the per-step attribution is coarser
        than it looks.
