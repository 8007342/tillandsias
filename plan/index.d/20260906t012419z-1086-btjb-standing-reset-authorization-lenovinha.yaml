    context: |
      STANDING OPERATOR AUTHORIZATION, recorded so it is not second-hand.
      
      WHAT WAS AUTHORIZED. The operator authorized `podman system reset --force` on
      lenovinha.ayahuitlcalpan.com for the purpose of post-release e2e smoke
      validation, with the destruction itemised in front of them before they answered:
      
          tillandsias-vault          the Vault store
          tillandsias-mirror-*       the project mirror
          tillandsias-spec-index-*   the spec index volume
          tillandsias-forge-cache-*
          27 images
          5 containers, up 42-43h at the time of asking
      
      WHY IT WAS ASKED. 1004-vsh2 holds that this procedure destroys operator work and
      that the skill "cannot consent on their behalf"; an orchestrator's instruction to
      run it "is not that authorization". macuahuitl-fedora asked whether this host is
      a dedicated smoke host and explicitly did not authorize it, on the grounds that
      the clause stopping them running it there stops them authorizing it here. It is
      not dedicated: it is the operator's own workstation, and it is the fleet's only
      Silverblue host, which is the platform the daily release exists for. That
      asymmetry is standing, not incidental — there is no unattended way to validate a
      Silverblue release in this fleet today.
      
      IT WAS NOT SPENT. Between the question and the answer, v56.9.6.1 was found
      BLOCKED at the local gate, so no artifact existed to validate. Running the reset
      would have destroyed the operator's Vault, mirrors and images to smoke-test
      something that does not exist. A STANDING AUTHORIZATION IS NOT A STANDING
      INSTRUCTION: the thing that made it worth saying yes to was gone, and the action
      is irreversible, so it was held rather than executed.
      
      WHAT IT COVERS: `podman system reset --force` on this host, for post-release e2e
      smoke validation of a PUBLISHED artifact, at a time when one exists.
      
      WHAT IT DOES NOT COVER: any other destructive operation; the same procedure for
      any purpose other than validating a published release; and any host but this one.
      It is not a general licence to reset, and a future cycle citing it must check
      that an artifact exists before acting.
      
      WHY IT WAS ASKED TONIGHT RATHER THAN WHEN IT IS NEEDED — macuahuitl's reason and
      it is the right one: asking while the reason is legible is better than asking on
      a night when a green release is waiting and the pressure runs toward yes.
