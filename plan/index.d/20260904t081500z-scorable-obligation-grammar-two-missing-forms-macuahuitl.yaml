    order: 1004-7vcc
    status: ready
    kind: enhancement
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [methodology, gate, plan, fail-loud]
    estimated_hours: 4
    owned_files:
      - scripts/check-scorable-obligation-added.sh
