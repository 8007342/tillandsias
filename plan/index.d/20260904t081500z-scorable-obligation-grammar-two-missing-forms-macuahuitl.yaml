    title: |
      The scorable-obligation grammar has no form for a mutation-controlled cargo test and no form for a packet whose deliverable IS the litmus it names, so two genuine pins in one night had to wear `unscoreable:` and are now indistinguishable by grep from rows that really cannot be scored.
    context: |
      977-448j's gate, scripts/check-scorable-obligation-added.sh, accepts a new
      packet when its body matches one of exactly three tokens
      (check-scorable-obligation-added.sh:95):
        *litmus:*|*unscoreable:*|*scripts/*.sh*
      i.e. a `litmus:<name>` closure, a `scripts/<file>.sh` closure, or an
      explicit `unscoreable:<reason>`. The third exists to refuse SILENCE, not
      to be the home of real pins. TWO INDEPENDENT HITS IN ONE NIGHT
      (2026-09-04) on a rule that is three weeks old:

      HIT 1 — A MUTATION-CONTROLLED CARGO TEST FITS NONE OF THE THREE.
      tlatoanis-macbook-air's 1002-9xmb (fragment
      plan/index.d/20260904t070000z-1002-9xmb-macos.yaml) closed on
      `the_preamble_never_bakes_in_the_hosts_home`
      (crates/tillandsias-macos-tray/src/diagnose.rs:1946). It has a named
      mutation control: reverting ca_dir_template() -> ca_dir() turns it and
      the sibling preamble test red, verified 3/3 runs each way. That is a
      mechanical pin at least as strong as a shell litmus, and it CANNOT be a
      shell litmus: the string it asserts on only exists inside a
      cfg(target_os = "macos") Rust function, so a litmus run off Darwin would
      read a stub and pass vacuously. The row wears `unscoreable:` with the
      author's own note that "a cargo test with a mutation control is a fourth
      kind of real pin that 977-448j may want to admit" — and, because the
      author also filled verifiable_closure with prose, the row now carries
      BOTH keys, which the gate's bag-of-tokens match cannot even notice.

      HIT 2 — THE DELIVERABLE IS THE LITMUS, SO NAMING IT IS A DANGLING
      REFERENCE. yoga's 1003-444f (fragment
      plan/index.d/20260904t075301z-1003-444f-yoga.yaml) exists to CREATE
      litmus:gate-test-coverage-names-every-crate. Naming it in
      verifiable_closure at filing time is a reference to a test that does not
      yet exist, which the 885-92iu gate (scripts/check-declared-closures-added.sh,
      `violation:declared-closure-unresolvable`) refused — correctly; yoga tried
      it and it refused, which is that gate working. So the row wears
      `unscoreable:` purely for lack of a forward-reference form, with the
      intended pin and its negative control written out in prose and a closing
      sentence saying "once that litmus exists this row should carry it as a
      normal verifiable_closure".

      WHY THIS IS A DEFECT AND NOT TWO INCONVENIENCES. `grep -l unscoreable:
      plan/index.d/` now returns three kinds of row and cannot tell them apart:
      rows that genuinely close on a measurement or an operator decision
      (1000-rqmx, an honest one), a row whose pin is a cargo test the grammar
      cannot spell, and a row whose pin is a litmus that will exist by closure.
      The scorer's denominator (977-3dee: 112 of 563 rows carry a closure, 25
      name a litmus) is therefore UNDER-COUNTING real pins, and the honest
      escape hatch is being used as a filing convention — the exact drift the
      gate's own header warns against ("a gate that makes the honest path
      harder than the escape hatch is worse than no gate", the 994-8r3w
      lesson that added the scripts/ form). Two hits in one night on a
      three-week-old rule means the third form is not the last one missing;
      the fix should make the next missing form cheap to add.

      WHAT THE FIX IS. (1) Admit `cargo-test:<crate>::<test>` as a closure form,
      REQUIRED to carry a named mutation control (what edit turns it red), so
      the form cannot be satisfied by a test that asserts a function against
      itself — 1002-9xmb's context records exactly that blindness in the test
      it replaced. (2) Admit a forward-reference form (shape for the
      implementer to pick; e.g. `verifiable_closure_pending: litmus:<name>` or
      a `pending` marker on the existing key) that the 885-92iu resolver
      accepts on a NEW row and refuses only when the packet CLOSES without
      that litmus existing and bound in openspec/litmus-bindings.yaml — the
      refusal moves from filing time to closure time, which is where the
      dangling reference actually does harm. (3) Convert the rows already
      wearing `unscoreable:` for lack of a form — 1003-444f at minimum, and
      1002-9xmb's pin — via append-only events, never by editing the immutable
      fragments. (4) A report (tillandsias-plan or a script) that separates
      forward-reference rows from genuinely unscoreable rows and prints both
      counts, so the denominator stops lying.

      THE FIXTURE THAT SHOULD SCORE THIS EXISTS AND IS NOT WIRED:
      scripts/test-scorable-obligation-gate.sh passes 8/8 on this tree today,
      but nothing in build.sh, local-ci.sh or openspec/litmus-bindings.yaml
      invokes it — only check-scorable-obligation-added.sh is wired
      (build.sh:2480). Wire the fixture, or the new arms are green by
      assertion only (green gate is not property holds).

      PROVENANCE: hit 1 measured by tlatoanis-macbook-air (1002-9xmb, mutation
      control run), hit 2 measured by yoga (1003-444f, the 885-92iu refusal);
      both relayed on the 2026-09-04 fleet board and filed by the coordinator
      (macuahuitl), who counted the gate's three forms and the unwired fixture.
    next_action: |
      Start from the fixture, not the gate: add the four new arms to
      scripts/test-scorable-obligation-gate.sh first (cargo-test accepted WITH
      a control, cargo-test refused WITHOUT one, forward-reference accepted on a
      new row, forward-reference refused at close when the litmus is absent or
      unbound), watch them go red, then widen check-scorable-obligation-added.sh:95
      and the 885-92iu resolver. The closure-time refusal needs a hook where
      a packet transitions to completed; find the existing one before designing
      a new one. Then convert 1003-444f and 1002-9xmb by events, and paste the
      report's two counts into your handoff.
    exit_criteria:
      - check-scorable-obligation-added.sh accepts a new row whose closure is `cargo-test:<crate>::<test>` with a named mutation control, and refuses the same form without one
      - the 885-92iu resolver accepts a forward-reference to a not-yet-existing litmus on a NEW row, and refuses a packet closing while that litmus is absent from openspec/litmus-tests or unbound in openspec/litmus-bindings.yaml
      - 1003-444f carries litmus:gate-test-coverage-names-every-crate as a forward reference via an append-only event, and 1002-9xmb carries its cargo-test pin the same way; no immutable fragment is edited
      - a report distinguishes forward-reference rows from genuinely unscoreable rows and prints both counts; `grep unscoreable:` alone is no longer the only way to find either
      - scripts/test-scorable-obligation-gate.sh covers all four new arms and is invoked by ./build.sh --check, so the fixture that scores this gate is no longer unwired
    verifiable_closure: |
      scripts/test-scorable-obligation-gate.sh exits 0 with its arm count grown from 8 to at least 12
      (cargo-test with and without a control; forward reference on a new row; forward reference
