packets:
  - packet_id: hybrid-cpu-amd-nvidia-matrix-truthful-on-mobile-workstation
    order: 935-jhh5
    status: ready
    title: |
      Every Tillandsias launch on lenovinha warns that CUDA is missing in the toolbox — make the hybrid CPU+AMD-iGPU+NVIDIA-dGPU matrix true, routed, and quiet
    kind: bug
    pickup_role: linux
    priority: p1
    desired_release: v0.5
    release_target: stable-milestone-v1
    capability_tags:
      - accel
      - inference
      - cuda
      - hybrid-gpu
      - fail-loud
    estimated_hours: 6
    deliverable: |
      On a hybrid mobile workstation the launch either uses the NVIDIA dGPU
      for inference or states the one exact remediation — never a recurring
      warning the operator cannot act on; the capability envelope names all
      three compute paths truthfully.
    context: |
      OPERATOR DIRECTIVE 2026-08-29, verbatim intent: every launch on
      lenovinha shows a warning that CUDA is not installed in the toolbox —
      "send Lenovinha on a quest to fix its own hardware matrix, the
      CPU+AMD_GPU+NVIDIA_GPU, which should be a common occurrence on mobile
      workstation." The operator explicitly does not know whether the fix
      belongs in the toolbox or on the host — ANSWERING THAT PRECISELY is
      part of the deliverable.

      THE LEDGER ALREADY KNOWS THE LIKELY ROOT, from lenovinha's own
      capability vote (850-bif2 era, recorded on the vulkan-userspace
      decision): host kind linux_immutable, AMD Cezanne iGPU (2GiB carve-out
      Vega) + NVIDIA RTX 3070, and the tier verdict "RTX 3070
      present-usable but CDI-SPEC-MISSING; effective tier cpu". The launch
      warning is almost certainly the inference lane failing to get the
      nvidia CDI device. The sibling instance is 665-zddn
      (nvidia-driver-update-strands-inference-container, macuahuitl): a
      STALE CDI spec strands the container; the measured remediation there
      was `nvidia-ctk cdi generate --output ~/.config/cdi/nvidia.yaml` +
      container recreate. Lenovinha's case is the MISSING-spec variant on
      an immutable host, where nvidia-container-toolkit provisioning has a
      Silverblue answer (layering vs container) that must be MEASURED, not
      assumed.

      SCOPE, in order:
        1. REPRODUCE and quote the exact warning + its emitter (which
           surface prints it — the launcher, lib-common, the accel probe?).
           A warning whose text cannot be found verbatim in the repo is its
           own finding.
        2. DECIDE host-vs-toolbox with evidence: where does the CDI spec
           live, what generates it on Silverblue, what does the inference
           container actually need at start. Record the answer as the
           packet's central fact — the operator asked this question
           explicitly.
        3. FIX the lane on this host: CUDA inference works (or is one
           named, tested command away), and the warning disappears or
           becomes the single actionable remediation line. Idempotent and
           wired into the maintenance path (665-zddn's regeneration
           belongs in start-of-day or launch preflight, not operator
           memory) — everything ephemeral and rebuildable by design.
        4. THE MATRIX HALF: with both vendors live on one host, the
           capability envelope must name all three compute paths truthfully
           (CPU tier, AMD iGPU present + its honest role per their own
           vote — decode there is a likely regression — NVIDIA dGPU
           usable). This host is the fleet's ONLY dual-vendor fixture and
           the natural place to retire 793-zumy's open enumeration gap
           (file-existence detection cannot represent two GPUs; a real
           enumeration with a software-rasterizer rejection wants exactly
           this hardware to prove itself on). Take that slice if it fits;
           name it out of scope if not.
        5. PLACEMENT stays pinned per their own recorded rule: presence
           must not choose placement — the iGPU existing must not route
           work onto it.
    exit_criteria:
      - the launch on lenovinha no longer warns, or warns once with the exact remediation command, and the choice (host vs toolbox) is recorded with the measurement that decided it
      - CUDA inference demonstrated live on the RTX 3070 through the tillandsias lane (model loaded, tokens generated), with the regime attached
      - the capability envelope on this host names CPU, AMD iGPU, and NVIDIA dGPU truthfully in one row set, and a driver update no longer strands the lane silently (665-zddn's regeneration made automatic or preflighted here)
      - findings recorded for the generic mobile-workstation case, not just this machine — the operator's point is that this matrix is common
    events:
      - type: note
        ts: "2026-08-29T23:10:00Z"
        agent_id: "linux-macuahuitl-claude-20260829t231000z"
        host: linux
        summary: |
          Filed from the operator's three-lane directive (macOS: Apple
          Store + signing; Windows: MSIX/Store, in flight as 776-g6r3;
          Linux: this). Assigned to lenovinha — the measurement host is
          the only correct owner. Their 901-jtvi hand-conversions return
          to the ready queue as fallback work.
