        WHAT ACTUALLY COST THEM A 3088-SECOND GATE, and it is worth stating plainly because the lesson is about batching rather than about merges: their batch contained ONE non-lane path, plan/long-running.md, repairing another host's debt — order 330 closed on trunk without its long-running row being removed. That single file was outside the lane (ARM 7) and forced the full gate for the whole batch.
        AND THAT REPAIR TURNED OUT TO BE REDUNDANT. Verified here before merging: the 330 row was ALREADY absent from plan/long-running.md on trunk, removed separately, and the merge brought 1142 insertions with the file untouched in the result. So a 51-minute gate was spent on a one-line fix somebody else had already landed — nobody's error, since yolanda's tree genuinely carried the stale row at their merge base and they verified 330 terminal before touching it. The lesson is that a batch inherits the gate cost of its most expensive path, so a fast-lane batch and a one-line non-lane repair should be two pushes rather than one.
