packets:
  - packet_id: the-gate-discovers-sub-second-failures-after-ten-minutes-of-work
    order: 1009-gccx
    status: ready
    kind: optimization
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [gate, build, performance, fail-loud, multi-host, token-conscious]
    estimated_hours: 4
    owned_files:
      - build.sh
      - scripts/land-on-platform-branch.sh
    title: |
      A fifth of gate runs end red, and the failures that end them are decidable in under a second (fmt, a clippy lint, a missing scorable obligation, an unresolvable litmus name, a dropped exec bit) — each discovered after the full gate has been paid, so the fleet's most expensive step is paid twice for nothing.
    context: |
      MEASURED ON THREE HOSTS THE SAME DAY, 2026-09-04, from cycle-metrics
      recur: lines (7-day windows): yolanda build-check runs=104 avg_ms=624310
      fail_pct=19; macbookair runs=148 avg_ms=144655 fail_pct=30; macuahuitl
      runs=415 avg_ms=79260 fail_pct=26. Ten minutes a gate on a primary-
      audience Windows host, and roughly one in five runs is red.
      WHAT ENDS THEM. yolanda, one slice, six gate runs, four of them re-runs
      to clear: a fmt nit, a clippy needless-borrow, a missing scorable
      obligation (977-448j), an unresolvable litmus name (885-92iu). The
      coordinator, the same night, four landing refusals: cargo fmt, two
      plan/issues conventions (881-29me line citations, 251 LM-04 long-running
      view membership) and a same-name report collision. macbookair and
      lenovinha each lost a run to an exec bit dropped by an awk rewrite
      (731-d89b). Every one of these is decidable in well under a second by
      the check that refused it, and every one was discovered INSIDE the gate,
      after clippy, the workspace tests and the litmus phases had already run.
      THE SHAPE, not the individual checks, is the defect: the gate runs its
      deciders in an order that pays the expensive work before the cheap
      refusals. Reordering so the sub-second deciders (rustfmt --check, the
      script exec-bit guard, the plan-fragment and plan/issues convention
      guards, the litmus-name resolution and scorable-obligation guards)
      run FIRST and fail fast turns a ten-minute discovery into a one-second
      one without weakening anything: the same checks run, in a different
      order, and the expensive phases run only on a tree that has already
      passed the cheap ones.
      Provenance: yolanda's reading and its reasoning, corroborated by
      macuahuitl and macbookair; filed by the coordinator.
    next_action: |
      Inventory the gate's steps by (median duration, historical fail share)
      from the timing log, then move every step whose median is under a few
      seconds ahead of the first step that compiles; the timing log already
      carries both numbers per step. Keep the memoised-gate path (765-tkq2)
      untouched. Measure before and after on yolanda, the slowest lane.
    exit_criteria:
      - a tree with a fmt, exec-bit, plan-convention, scorable-obligation, or litmus-name defect is refused by ./build.sh --check before any compile or litmus phase starts, and the refusal names the check
      - the cheap deciders are a named, ordered phase in build.sh, so a new sub-second guard is added there rather than at the end
      - build-check fail_pct on yolanda and macbookair is re-read from recur: two weeks after landing and recorded on this packet, with the wall clock of a red run before and after
      - no check is removed or weakened; the reorder is proven by the same negative controls the moved checks already carry
    unscoreable: >
      The pin is a fixture that plants a fmt defect and asserts the gate refuses
      it before its first compile step is logged; it does not exist until the
      phase does. Whoever lands the reorder writes it and converts this row.
