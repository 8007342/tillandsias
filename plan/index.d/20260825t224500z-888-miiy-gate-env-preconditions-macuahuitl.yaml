packets:
  - packet_id: groundtruth-harness-reds-the-gate-for-an-undeclared-environment-dependency
    order: 888-miiy
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      litmus:expert-groundtruth-harness fails the RELEASE gate on any host with no embedding endpoint — a dependency it never declares — and reports a HARNESS ERROR as a red case
    deliverable: |
      the groundtruth glob scenario distinguishes "the harness could not run" from
      "the graded answers are wrong", the way the same fixture already does four
      scenarios earlier
    pickup_role: linux
    owner_host: any
    depends_on: []
    capability_tags:
      - ci
      - litmus
      - release
      - fail-loud
      - inference
    estimated_hours: 3
    context: |
      MEASURED on macuahuitl 2026-08-25T22:19Z, during an operator-directed
      release cut. `./build.sh --ci-full` FAILED with exactly one red out of 2007
      passing steps, and it blocked the release:

        litmus:expert-groundtruth-harness STEP 29/30
          expected = ok:groundtruth-corpus-declaration-fixture:6
          output   = fail: groundtruth-corpus-declaration scenarios failed

      Five of the fixture's six scenarios pass. The sixth
      (scripts/test-groundtruth-corpus-declaration.sh:156-160) grades the REAL
      committed glob. Run directly it does not produce a wrong answer — it
      produces no answer at all:

        HARNESS ERROR: spec.answer needs a built index: no rung of the
        resolution ladder (TILLANDSIAS_SPEC_INDEX_DIR, FORGE_SPEC_INDEX_DIR,
        FORGE_SPEC_INDEX_ROOT, the podman volume, XDG cache) names a directory
        containing vectors.jsonl

      and `scripts/spec-index-ensure.sh` then refuses with
      `blocked:spec-index:embed-endpoint-refused`, HTTP 000 to
      127.0.0.1:11434 — this host has no ollama, no inference image, and an
      empty podman store.

      THE DEFECT IS NOT THE MISSING ENDPOINT. It is that the test cannot say so.

      1. THE PRECONDITION IS UNDECLARED. litmus-expert-groundtruth-harness.yaml
         :53-58 lists the grader, the ground-truth set, plan/index.yaml,
         methodology, the mcp overlay, and cargo/jq/sed. It does NOT list a built
         spec index or a live embedding endpoint. Every declared precondition was
         satisfied on this host and the step still failed.

      2. THE FIXTURE ALREADY KNOWS THE DISTINCTION AND DROPS IT HERE. Scenario 4
         of the SAME file asserts, correctly, that "a declared corpus that is
         missing is a HARNESS ERROR (rc=2), not a red case". Scenario 6 takes a
         HARNESS ERROR and reports it as a scenario failure. The fixture
         contradicts itself four scenarios apart.

      3. THE CONSEQUENCE IS A RED GATE THAT SAYS NOTHING ABOUT THE TREE. The
         release runbook is explicit — if `--ci-full` fails, do not merge, do not
         tag. So a host without inference cannot cut a release, and the reason it
         cannot is indistinguishable from a genuine regression. That is the
         727-kmks asymmetry on the release path.

      WIDER SIGNAL, recorded because it is the same night and the same class:
      pirria independently reported `cycle-preflight` returning `services-down4`
      with `tillandsias-proxy` (rc=1) and `tillandsias-inference` failing to
      start, both `action=operator`. Two hosts, same missing capability. The
      inference lane being down is being absorbed as a degraded REPORT at
      cycle-preflight (correctly) and as a hard RED here (incorrectly).
    outcome: |
      A host without an embedding endpoint gets a named skip on this scenario and
      a green gate, or a named refusal that says the harness could not run — never
      a red that reads as "the expert answers are wrong".
    exit_criteria:
      - Scenario 6 distinguishes HARNESS ERROR from a graded failure, matching scenario 4's existing rule, and emits a distinct verdict token for each.
      - The litmus declares its real preconditions (a built spec index, or the endpoint that builds one) so an unmet environment is visible before the step runs rather than after it reds.
      - 'NEGATIVE CONTROL, mandatory: a genuinely WRONG graded answer must still turn the step RED. The fix must not convert every failure into a skip — that would be a fail-open gate, which is strictly worse than today.'
      - 'Demonstrated on a host with NO embedding endpoint (this one reproduces it) and on a host WITH one, so both branches are exercised rather than argued.'
    verifiable_closure: |
      On a host with no embedding endpoint, `./build.sh --ci-full` no longer
      fails on this litmus, and a seeded wrong answer in the ground-truth set
      still turns it red.
    notes: |
      Do NOT fix this by deleting scenario 6 or by making the whole litmus
      conditional. Grading the real committed sets is the point of the harness;
      what is wrong is treating "could not grade" as "graded and failed".

      Do not fix it by making the gate build a spec index either — that would put
      21,467 embeddings and a live model endpoint on the critical path of every
      release gate on every host.
    events:
      - type: filed
        ts: "2026-08-25T22:45:00Z"
        agent_id: linux-macuahuitl-fable5-20260825t224500z
        host: macuahuitl
        summary: |
          Found by the release gate itself: this single red blocked an
          operator-directed release cut where 2007 other checks passed. Filed
          rather than worked around — the coordinator declined to edit a gate to
          make its own release pass, which is the fail-open pattern this
          milestone exists to prevent.

  - packet_id: the-mandated-cache-sweep-destroys-the-mandated-failure-log
    order: 888-vgs8
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      `cargo clean` — which check-build-cache-sweep.sh instructs every host to run — deletes target/convergence/check-logs.jsonl, the authoritative failure history the skill orders you to read FIRST
    deliverable: |
      the convergence check log survives the build-cache sweep, or the sweep says
      out loud that it is destroying it
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - ci
      - build-gate
      - fail-loud
      - observability
    estimated_hours: 2
    context: |
      MEASURED on macuahuitl 2026-08-25, and it cost a real diagnosis the same
      night.

      The meta-orchestration skill is emphatic on both halves, in two different
      sections that never mention each other:

        "When the Gate Fails, Read check-logs.jsonl FIRST ...
         target/convergence/check-logs.jsonl holds a per-run verdict for every
         check, going back weeks. It is the authoritative record of what failed
         and when. Do NOT diagnose from terminal scrollback."

        Finalization 9c: on a due sweep, "run `cargo clean`".

      `cargo clean` removes `target/` in its entirety, and the convergence log
      lives at `target/convergence/check-logs.jsonl`. So the mandated hygiene
      step destroys the mandated evidence.

      LIVE CONSEQUENCE: this host ran the sanctioned sweep on 2026-08-25 (152 GiB
      against a 40 GiB ceiling, reclaimed 170.9 GiB — the sweep itself was
      correct and due). Hours later `./build.sh --ci-full` failed on
      litmus:expert-groundtruth-harness, and the first diagnostic step the skill
      prescribes returned a file containing exactly ONE record: the failing run
      itself. The question "was this check ever green on this host?" — the
      question the log exists to answer, and the one that separates a regression
      from a standing environmental gap — had no answer, on the night of a
      release cut.

      The skill even warns about the adjacent version of this: "The next run
      overwrites the per-check logs under target/convergence/check-logs/, and
      re-running to 'get a better look' is what destroys the evidence." It
      protects the per-check logs from a re-run and leaves the JSONL history
      exposed to a sweep it separately orders.
    outcome: |
      A host can answer "was this check ever green here" after a cache sweep.
    exit_criteria:
      - The convergence check log survives `cargo clean` — either it moves outside `target/`, or the sweep preserves and restores it, or the sweep refuses until it is archived. Any of the three, chosen once.
      - 'An executable check proves it: run the sweep on a tree with history and assert the history is still readable afterwards.'
      - 'NEGATIVE CONTROL: the sweep still actually reclaims the build cache — a fix that preserves the log by not sweeping is not a fix.'
      - The skill stops instructing two things that cannot both hold, at whichever end is chosen.
    notes: |
      Prefer moving the log out of `target/` over teaching the sweep to special-case
      it: anything inside `target/` is by convention disposable, and a second
      exception is a second thing to forget. Note it must stay gitignored — this is
      host-local history, not shared ledger state.
    events:
      - type: filed
        ts: "2026-08-25T22:45:01Z"
        agent_id: linux-macuahuitl-fable5-20260825t224500z
        host: macuahuitl
        summary: |
          Filed by the host that lost the history and then immediately needed it.
          The sweep was correct and due; the skill's two instructions are
          individually right and jointly destructive.
