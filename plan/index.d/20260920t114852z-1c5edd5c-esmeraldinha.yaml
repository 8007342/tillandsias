        Green, against an installer missing five of the seven literals the step claims to assert. Exactly as yoga filed it.

        === THE CLOSURE WAS CORRECTED BEFORE IT WAS IMPLEMENTED ===

        The instruction reaching this host said "a non-ready diagnose fails the install with its exit". THAT WOULD HAVE FAILED EVERY FIRST INSTALL ON EVERY WINDOWS HOST, and the row would have shipped a worse defect than the one it fixed.

        `exit_code_from()` (crates/tillandsias-windows-tray/src/notify_icon.rs:3130) returns 0 only when `distro_registered && wire.reachable && phase == "Ready"`; DIAGNOSE_EXIT_CONVERGING (=3) when registered and reachable but not Ready; and 2 otherwise, INCLUDING "distro not registered". At the point this check runs the distro is not registered, so the honest answer is 2.

        The removed code knew this and said so in its own comment block (d7bfcdd9f), verbatim:
            #   0 = re-install over an already-provisioned tray (Ready state).
            #   2 = first install: binary works but distro not provisioned yet (expected, ok).
            #   1 = hard failure: binary missing or won't run -> installer fails.
        and its throw was guarded `if ($diagExit -eq 1)`. Exit 1 is not reachable from exit_code_from at all, so it means the binary produced no verdict — crashed or unlaunchable. THE CHECK VERIFIES THE INSTALL BITS, NOT THE PROVISIONING. The coordinator accepted the correction and the implemented closure is the corrected one.

        INDEPENDENTLY CONFIRMED BY yolanda, from a run rather than a read, and their version is worth keeping: the installer ends with `Start-Process` (fire-and-forget) and their two cold provisions took 91s and 79s, so a readiness assertion here would be a race — pass on a fast host, fail on a slow one. On this host the point is stronger still: the diagnose block sits at :452, BEFORE the `Start-Process` at :504, so at that moment the tray has not been launched at all and the distro is unregistered. READY is not a race sometimes lost; it is lost EVERY time on a clean machine.

        === WHAT THE FIX DOES ===

        scripts/install-windows.ps1, immediately after the surviving --version preflight and before the Installed-Software registration:
          - runs `--diagnose --json` through cmd.exe (GUI-subsystem binary; same reason as --version above);
          - FAILS THE INSTALL ON EXIT 1 ONLY, with the exit in the message and the phrase "install bits broken";
          - PROCEEDS on 0, 2 and 3, printing the verdict and the exit so the installer log carries it;
          - surfaces version, build_commit, os_version and wsl_version, each with a NAMED placeholder when absent rather than going silent;
          - carries a comment stating why the test is `-eq 1` and not `-ne 0`, so the next reader cannot "tighten" it into failing every clean install.

        ORDERING, agreed with yolanda for 1286-4437 and settled by the coordinator: (1) --version preflight, (2) THIS check on the install bits, (3) yolanda's --reset-state, (4) yolanda's post-reprovision readiness check. A broken binary therefore aborts BEFORE anything is destroyed. Mine certifies the BITS before destruction; theirs certifies the RESULT after. Neither substitutes for the other.

        === THE HISTORY IS FOUR COMMITS, NOT THREE ===

        Correcting the row's own context, which names three:
          d7bfcdd9f  2026-05-28  ADDED --diagnose --json + the exit-1 "install bits broken" throw + version/pin surfacing
          567009f68  2026-05-30  ADDED the --version preflight, build_commit, and wire-error surfacing
          a9163cdaa             ADDED os_version / wsl_version ("  host:      OS=$osVer; WSL=$wslVer")
          6cdaa8ac2  2026-06-23  REMOVED the diagnose half of all three, KEEPING the --version layer
        a9163cdaa matters because two of the three fields this row's third criterion names originate there. And 6cdaa8ac2 keeping --version while dropping --diagnose is the sentence that explains the chain's shape: conjuncts 1 and 3 still matched, the other five did not.

        === POST-FIX ===

        All seven conjuncts present (counts 3, 4, 5, 1, 2, 2, 2), CHAIN_RC=0.
        Litmus: PASS 9/9, 100%, Status [PASS] — now green for the right reason, with the step declaring `assert_exit: 0` and `assert_output_nonempty` REMOVED.

        === THE NEGATIVE CONTROL, WHICH IS THE POINT OF THE ROW ===

        Criterion 4 asks that deleting any ONE of the seven literals RED the step. Both halves were run.

        (a) On COPIES, all seven, chain-level — the real installer never modified:
