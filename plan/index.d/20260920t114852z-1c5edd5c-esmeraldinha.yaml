        (b) On the REAL installer, step-level, because (a) proves the chain reds and NOT that the LITMUS reds. With 'install bits broken' removed from scripts/install-windows.ps1 and the litmus re-run:
              [FAIL] spec=windows-native-tray test=litmus:windows-tray-diagnose-cli-surface
