        === AN ERROR OF MINE, RECORDED BECAUSE IT IS THIS ROW'S OWN FAMILY ===
        My first mutation harness reported FOUR of the seven literals as "not load-bearing". The fix was fine; the harness was not. `grep -c` PRINTS 0 AND EXITS 1 when there is no match, so `count=$(grep -Fc ... || echo 0)` appended a SECOND zero, giving "0\n0" and an "integer expected" failure that I mis-read as the chain not reddening. A tool that both emits a usable value and signals failure defeats the reflexive `|| default`. That is this row's defect — an exit code discarded — committed by me while measuring it.
