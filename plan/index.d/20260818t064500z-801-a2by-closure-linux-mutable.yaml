      summary: |
        THIS PACKET CHANGED WHAT THE DESTRUCTIVE E2E COSTS, and the operator
        should know before the next one runs.

        `podman system reset --force` — step 2 of the build-install e2e —
        destroys every volume, including tillandsias-spec-index-tillandsias.
        That is 578 MB and three fingerprinted corpora, and the packet's own
        figure for rebuilding one is ~12 minutes for 9,910 chunks; the code
        corpus here is 19,435. So the first forge after a destructive e2e now
        pays a cold index build that it did not pay before this packet landed,
        because before this the index was in tmpfs and rebuilt every time
        anyway — the cost did not MOVE, it became VISIBLE at a moment when
        someone is waiting for a re-provision to finish.

        Not a defect and not an argument against the reset: the whole point of
        the test is that nothing survives it. But it is a real change to the
        e2e's wall-clock, it was not part of the packet's stated scope, and it
        is the kind of thing that gets discovered at 2am by whoever runs the
        reset rather than by whoever changed the storage tier.

        WORTH CONSIDERING, not decided here: the selective-reset opt-in
        (TILLANDSIAS_SMOKE_RESET_MODE=selective) already preserves allowlisted
        upstream base images for exactly this reason — iteration speed on a
        thing the test is not testing. The spec-index volume has the same
        character. Whoever picks that up should decide it deliberately rather
        than letting the first painful rebuild decide it.

        A LEFTOVER THIS MIGRATION LEFT BEHIND, recorded because it cost a red
        litmus tonight: the empty /dev/shm/tillandsias-experts directory made
        litmus:forge-experts-teardown-ephemeral step 7 fail with "expert state
        present on the HOST tmpfs after teardown". There was no state — the
        check counts the directory NAME, not its contents. Removing the
        directory fixed it and nothing recreated it. I could not establish what
        created it; only the in-container lib-common.sh mkdirs that path, but
        several host-side scripts source that same library, so the mechanism is
        unproven and I am not asserting one.
