packets:
  - packet_id: macos-exec-wire-bulk-stdout-wedges-unbounded
    order: 772-qn6j
    release_target: socket-audit-master
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: 'macOS exec wire wedges UNBOUNDED on bulk stdout: >=~44KB from a fast producer hangs the session forever; ~2.4KB line-by-line streams fine'
    pickup_role: macos
    depends_on: []
    capability_tags:
      - macos
      - transport
      - vsock
      - streams
      - fail-loud
    context: |
      Found by the 147 transport-overhead audit measurements on this host
      (dist build git 7bc647f6, healthy substrate). One command reproduces:

        tillandsias-tray --exec-guest bash -lc 'head -c 32768 /dev/zero | base64'

      MEASURED BRACKETS (plan/issues/macos-exec-wire-bulk-stdout-wedge-2026-08-16.md):
        - 8x `--exec-guest true` one-shots: 9-10s each, tight variance — the
          control path is healthy and boringly consistent.
        - 200 echo lines (~2.4KB, slow producer): 9s, clean.
        - 32KB->base64 (~44KB, fast producer): HANG (60s timeout).
        - 1MB->base64 (~1.4MB): HANG (90s timeout).
        - 10MB->base64 (~14MB): HANG, observed 58m31s before manual kill —
          unbounded, no deadline fires (the 689-y2my exec-deadline questions
          apply here too).
        - Post-condition after killing a wedged session: next one-shot 9s
          clean — per-session wedge, no persistent damage.

      The threshold sits between ~2.4KB (slow) and ~44KB (fast), UNDER the
      64K-pipe hypothesis; producer speed may matter, not just size — the
      discriminating follow-ups are a slow 44KB producer (seq + printf loop)
      and fast payloads at 4/8/16KB to find the true edge. Main-thread stack
      of the hung host process sampled (evidence file; symbols need the
      dSYM, load address recorded).

      CLASS LINKS, all corroborated by this live repro:
        - 690-pz68 (macos-unbuffered-bulk-io-paths): its cold-provision
          measurement constraint blocked progress — THIS is a hot-path,
          non-destructive, 60-second reproduction it can use instead.
        - 733-mppc (handshake reads unbounded) — same missing-bound family.
        - 635-kagg (bare exec-wire wedge): its live reproductions launched
          builds whose output is exactly bulk fast stdout; this may be the
          root of that packet's wedge.
      The windows guest half went event-driven under 690-xeda; the macOS
      HOST side of the wire (pty/vsock bridge, exec output pump) is where
      the writer blocks.
    exit_criteria:
      - the wedge is root-caused (buffer site + why the reader stops draining) with the fix's before/after measured on the 32KB fast-producer repro
      - an exec session carrying bulk stdout completes at >=14MB, bounded only by throughput, on the same substrate
      - a deadline actually fires on a wedged exec session (no unbounded hang path remains), verified by fixture or live kill-free timeout
    verifiable_closure: |
      `tillandsias-tray --exec-guest bash -lc 'head -c 10485760 /dev/zero |
      base64' completes with exit 0 in bounded time on macOS, and the
      timing series in the evidence file is re-run green.

