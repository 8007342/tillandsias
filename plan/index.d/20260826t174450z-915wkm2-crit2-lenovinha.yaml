    event:
      type: implemented
      ts: "2026-08-26T18:10:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t173725z
      host: lenovinha
      summary: |
        CRITERION 2 LANDED — scripts/check-scratchpad-headroom.sh, wired into the
        skill's Start-Of-Day maintenance block and pinned by
        litmus:scratchpad-headroom.

        THE THRESHOLD IS ABSOLUTE, AND THE TWO HOSTS' NUMBERS ARE WHY. A
        percentage was the obvious design and is exactly wrong:

          lenovinha   1620M of  5525M =  29% used -> WARN (3.9 GiB, cannot build)
          macuahuitl 15900M of 25564M =  62% used -> ok   (9.6 GiB, can build)

        A "warn above N%" rule PASSES THE HOST THAT WILL WEDGE and WARNS THE ONE
        THAT WILL NOT. The bar is instead what the work costs — one cold Rust
        target/ at 2.6-4.4 GB (macuahuitl's measurement), overridable via
        TILLANDSIAS_SCRATCH_NEED_MB for a host with a different build profile.
        That inversion is now a fixture arm rather than a comment.

        ADVISORY, EXITS 0 ON EVERY PATH, and a fixture arm plus a litmus step
        both assert it. A cycle must not fail because a host is low on scratch;
        it must be TOLD while it can still choose where to build. Gating on a
        capacity condition is the 888-miiy shape.

        LIVE ON THIS HOST IT ALREADY EARNS ITS KEEP:
          warn:scratchpad-headroom-low:3905m-of-5525m
          NOTE: df reports 5286M free, which OVERSTATES what you can use.
        The trap demonstrated on the machine rather than described.

        QUOTA IS QUERIED WITH `quota -s -f <path>`, not a bare `quota -s`. On
        this host /dev/shm, /run/user/1000 and /tmp ALL report as "tmpfs", so
        parsing by device name picks an arbitrary mount — and only one of them is
        the scratchpad.

        WIRED, NOT MERELY WRITTEN. audit-guard-activation.sh reported
        `orphan=1 orphans: check-scratchpad-headroom.sh` before wiring and
        `orphan=0 verdict=ok` after. Per 865-n8vq an orphaned guard is fixed by
        invoking it, not by mentioning it — and the auditor greps for the NAME,
        so a mention would have cleared the verdict while leaving the guard as
        dead as it was. A heads-up went to macuahuitl before landing, since the
        maintenance block runs on every host.
  - packet_id: never-build-a-rust-workspace-in-the-agent-scratchpad
    event:
