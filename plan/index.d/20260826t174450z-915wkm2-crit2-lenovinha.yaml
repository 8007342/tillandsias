      agent_id: lenovinha-opus5-metaorch-20260826t173725z
      host: lenovinha
      summary: |
        scripts/test-scratchpad-headroom.sh, all arms green, hermetic with
        stubbed quota and df. ./build.sh --check green.

        Arms: quota-derived numbers when a quota exists; the tight case
        reproducing this host's live shape (3905m of 5525m) AND asserting the
        stderr names df as OVERSTATING; the 4.6x spread classified correctly by
        one absolute threshold; the percentage inversion demonstrated
        arithmetically; quota-exhausted and disk-full as DISTINCT verdicts (the
        amended criteria asked for this explicitly, since the two have different
        remedies); the no-quota-tool path saying outright it is filesystem space
        and NOT a quota headroom; no-quota-configured skipping rather than false-
        alarming; every path exiting 0; and the grammar pinned.

        TWO FIXTURE BUGS OF MY OWN, both caught before landing and both the shape
        this session keeps producing:

          - THE NO-QUOTA ARMS FOUND THE SYSTEM `quota`. Omitting my stub does not
            hide /usr/bin/quota, because PREPENDING a bin dir cannot mask a
            system binary — so those arms silently tested the WITH-quota path and
            returned skip:no-quota instead of the disk verdict. Same trap as
            masking jq two cycles ago. Fixed with a curated PATH whose absence of
            `quota` is ASSERTED as a precondition rather than assumed.
          - I ASSERTED THE PERCENTAGE POINT BACKWARDS, claiming the warned host
            was FULLER by percent. It is emptier — 29% against 62% — which is the
            stronger form of the argument and the one that actually shows a
            percentage rule inverting both verdicts. The arm failed, which is how
            I found out; had I written it the loose way it would have passed
            while asserting something false.

        NOT DONE THIS CYCLE: criteria 3-4, the reaper and its live-session
        negative control. Deliberately left — landing the check with a real
        fixture beats half of both, and the reaper needs its own care given a
        LIVE scratchpad here is 627 MB of active evidence.
