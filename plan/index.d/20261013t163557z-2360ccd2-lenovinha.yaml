      summary: |
        Coordinator-approved design note (2026-10-13), so nobody simplifies the relay away. WebKitGTK resolves names through GLib, which answers EVERY *.localhost name with loopback and never reads /etc/hosts for those names. Measured: with --add-host www.demo.localhost -> the forwarder, WebKit still dialled 127.0.0.1 and got "Connection refused" for its own project and for www.other alike. So the WebKit window's own launcher runs a relay on the window's loopback (127.0.0.1 and ::1, the preview port only) that passes raw TCP, unread, to the per-window forwarder. The project binding is unchanged: the forwarder admits only this project's SNI, and the router's strict_sni_host binds Host to SNI. --add-host stays for non-GLib clients. Also measured: the image must carry NO USER line, because under --userns=keep-id an explicit USER (65534) cannot write the owner-only host Wayland socket and GTK reports "Failed to open display". The spec delta (openspec/changes/open-it-browser, browser-window-modes) states both.
