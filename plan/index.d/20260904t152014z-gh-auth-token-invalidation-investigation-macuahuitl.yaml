    title: |
      The operator runs `gh auth login` two or three times a day on several hosts, each time told "You were already logged in", while macuahuitl has never needed one; find the mechanism that keeps invalidating the stored gho_* token and the fix (a GitHub App or fine-grained PATs if the OAuth-app token model is the cause)
    context: |
      OPERATOR-REQUESTED, assigned to macuahuitl by the operator through
      pirria-cachyos 2026-09-04 (plan/issues/gh-auth-token-invalidation-
      investigation-2026-09-04.md at 92b0f2134 is the report; this row is its
      order). Seen the same morning on macneo (macOS) and pirria (rolling
      CachyOS): neither OS- nor immutability-correlated. TWO SYMPTOMS, ONE NOT
      A BUG: "! You were already logged in to this account" is printed AFTER
      "Authentication complete" and only means the account was already in the
      config; the device flow succeeded and wrote a new token. The defect is
      that the stored token keeps going INVALID: `gh auth login` reports
      presence, `gh auth status` validates against the API, and "already
      logged in" plus "the token in keyring is invalid" is the signature of a
      credential present locally and revoked server-side.
      RULED OUT by pirria with the fault live: bare-metal gh does not traverse
      the enclave proxy (no proxy env, empty http_unix_socket/api_host, no
      GH_TOKEN, host brew gh 2.100.0). The proxy stays in scope only for the
      in-enclave consumer.
      LEADING HYPOTHESIS H1: OAuth-app token semantics. Every host
      authenticates as the same account 8007342 through the same GitHub CLI
      OAuth app by device flow, scopes gist/read:org/repo/workflow. If a
      fresh authorization for one user+app revokes or displaces prior tokens
      (GitHub caps OAuth-app tokens per user/app/scope-set and revokes the
      OLDEST when the cap is exceeded), every host's login evicts another
      host's copy: predicts the 2-3x/day cadence (= how often some host
      re-auths), the coordinator's immunity (it holds the newest token), the
      OS-independence, and the present-but-invalid signature; and it is
      self-reinforcing. Alternatives ranked in the report: H2 one token
      captured into Vault and fanned out (the enclave runs no device flow; it
      reads a token from Vault and build-image.sh consumes `gh auth token`);
      H3 keyring eviction (weak: gh says INVALID, not unreadable); H4 an 8 h
      expiry (cannot explain the immunity).
      DECISIVE TEST, cheap: fingerprint the token on host A (`gh auth token |
      sha256sum`), run a full `gh auth login` on host B, re-check A untouched.
      Highest-value read: the account's security log at
      github.com/settings/security-log filtered to oauth_authorization and
      oauth_access.destroy, which settles H1 vs H2 vs H4 against recorded
      reality; only the operator can read it.
      ONLINE SEARCH IS A REQUIREMENT (operator, by name): the authoritative
      answer is GitHub's CURRENT token semantics, which have changed; memory
      produces a confident wrong answer here. Provenance: pirria measured and
      filed the report; the coordinator holds the order.
