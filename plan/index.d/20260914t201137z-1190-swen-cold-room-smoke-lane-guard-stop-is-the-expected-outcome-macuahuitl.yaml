    title: |
      A cold Vault holds no GitHub token, so the forge lane after §2's reset publishes no-credential and the Credential Channel Guard hard-stops before any committable work, deterministically — §4 exercises bring-up and the guard and nothing past them, while opencode_exit=0 lets a reader conclude the forge did a cycle's worth of work. RULING (coordinator, 2026-09-14): the guard-stop IS §4's expected cold-host outcome; no scoped token after §3.
    context: |
      MEASURED by pirria 2026-09-14 (04-opencode.log:848–862): the guard
      answered blocked:upstream-no-credential (exit 1); the mirror published
      refs/tillandsias/upstream-auth/no-credential, fresh; the in-forge agent
      "claimed nothing, drained nothing, filed nothing, and committed
      nothing", left git status empty and HEAD == origin/linux-next, emitted
      no MO-FULL marker so the absence stays loud, and asked the launching
      host to file this — correctly refusing to commit from a container
      about to be destroyed. The host could push at the same moment
      (00-credential-channel.txt ok:gh-keyring-push-verified): the asymmetry
      is the design. The coordinator's ruling takes pirria's option (a): the
      lane's pass condition on a post-reset host is "brings the enclave up
      and stops correctly at the credential guard", asserted from the guard
      line, not read from exit 0. Option (b) — a scoped token after §3 — is
      declined: it would test a different machine than the one the smoke
      exists to prove, and a clean room that holds a credential is not a
      clean room. The in-forge handling is not what needs fixing.
