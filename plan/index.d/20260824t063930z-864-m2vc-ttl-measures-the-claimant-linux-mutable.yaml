      summary: >
        THE TTL NOW MEASURES THE CLAIMANT RATHER THAN THE ROOM. 641-e2qa
        criterion 2 says "a claim that PRODUCES no event within its cycle" —
        produced by the claimant. The implementation counted every event on the
        packet regardless of author, so any host's note refreshed any host's
        lease and the reaper was defeated for any row several hosts discussed.

        The claimant is identified exactly as live_claims already does it: the
        newest event whose summary opens "claimed for cycle". Only that host's
        events advance the clock.

        WHEN THE CLAIM CANNOT BE ATTRIBUTED THE OLD RULE STILL APPLIES, and the
        verdict says which rule it used — `claimant:<host>` or
        `claimant:unattributed(any-host-rule)`. Silently reaping harder on rows
        whose provenance is unreadable would expire work for a reason nobody
        could see, which is the same failure as reaping finished work: not the
        wrong answer so much as an answer with no visible basis.

        THE ORDERING MATTERED AND WAS CHECKED, not assumed. This tightening
        removes the accident that was protecting yoga's finished work — my own
        note extending its lease by twenty-one hours. It was only safe to land
        because 864-k8dp's reap-hold went in first; yoga's two rows were
        verified held=2 before the change, after the change, and after every
        subsequent edit including the fmt pass.

        ONE PRE-EXISTING TEST MOVED, and it moved in shape rather than
        substance: expire_claims_partitions_stale_fresh_and_unknown_age asserts
        the exact expired tuple, whose third element now carries the attribution
        rule. The same packet expires and the same one is unknown-age. Its
        expectation was updated to state the new contract explicitly rather than
        to be made to pass — the fixture has no claim event, so
        `unattributed(any-host-rule)` is the correct and documented outcome.
