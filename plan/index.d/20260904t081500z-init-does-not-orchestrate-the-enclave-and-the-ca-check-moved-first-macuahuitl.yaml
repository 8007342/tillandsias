packets:
  - packet_id: init-does-not-orchestrate-the-enclave-and-the-ca-check-moved-first
    order: 1004-xw3q
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [enclave, ca, init, preflight, fail-loud, release-lag]
    estimated_hours: 5
    depends_on:
      - ca-bundle-moves-to-a-durable-directory
    owned_files:
      - scripts/check-enclave-ca-consistency.sh
      - scripts/check-ca-bind-migration.sh
      - scripts/cycle-preflight.sh
    multi_cycle: true
    title: |
      `tillandsias --init` does not orchestrate the enclave, the preflight remedy says it does, and the CA checker moved to the new path before the runtime that binds the old one — the 998-3z6g residual.
    context: |
      FOUND on two hosts, 2026-09-04, running the second regime for
      998-3z6g's closure (live proxy, installed release binary). Three
      findings, one shape: the tree moved on and the instructions, the
      installed app and the checker each describe a different machine.

      (1) THE REMEDY NAMES A COMMAND THAT DOES NOT ORCHESTRATE. lenovinha
      ran `tillandsias --init` TWICE with the proxy first Exited and then
      absent. Both times it exited 0 without creating or starting the proxy:
      the vault was reprovisioned, the images were retagged, the proxy was
      untouched. The binary's own `--help` describes the flag as
      "Pre-build container images" (crates/tillandsias-headless/src/main.rs:1405).
      Yet scripts/check-enclave-ca-consistency.sh:62 prescribes
      "REMEDY: re-run the enclave orchestration (`tillandsias --init`)", and
      scripts/cycle-preflight.sh:283-285 surfaces that line into every
      cycle's preflight. 998-3z6g's closure — "restart, observe the proxy
      reach Running unaided" — names no restart that does this either.

      (2) THE CHECK MOVED BEFORE THE RUNTIME. The installed app on lenovinha
      is v56.9.2.1, which predates 44a33f328 (fix(998-3z6g): the CA bundle
      leaves /tmp). The RUNNING proxy therefore binds
      /tmp/tillandsias-ca/intermediate.crt — the OLD path, which `--init`
      refreshed — while the migrated checker
      (scripts/check-enclave-ca-consistency.sh:52-55) reports
      ~/.local/state/tillandsias/ca/intermediate.crt missing and asserts
      "the proxy binds it by that path". It does not. pirria confirmed the
      released binary ships the /tmp CA. So on every host whose installed
      app predates the fix, the checker reproduces the exact 975-rsgm shape
      (a check pointing at a path the container never bound) that 998-3z6g
      was written to prevent — reintroduced by its own fix. A neighbouring
      script already knows how to ask the container instead of the tree:
      scripts/check-ca-bind-migration.sh:44 reads the bind SOURCE with
      `podman inspect ... .HostConfig.Binds`; the consistency checker does
      not use it.

      (3) THE PROXY IS FINE ONCE SOMETHING LAUNCHES IT — AND THE ONLY THING
      THAT DID IS A TEARDOWN. scripts/orchestrate-enclave.sh brought the
      proxy to health on :3128 (attempt 2, CA at /tmp) unaided. But that
      script is a demo/e2e path: it ends with
      `podman rm -f "$PROXY_CONTAINER" "$GIT_CONTAINER" "$INFERENCE_CONTAINER"`
      (scripts/orchestrate-enclave.sh:470). lenovinha ran it on the remedy's
      wording and it left the proxy ABSENT until the next forge launch
      recreates it. There is no restore path a host can be told to run.

      WHY p1: the preflight is the fleet's first line, and today its remedy
      is wrong on every host with an installed release (esme and pirria just
      installed v56.9.2.1; macuahuitl's install likely predates the fix
      too). A wrong remedy that exits 0 is worse than no remedy: it consumes
      the operator's trust and, followed literally, destroys the enclave.

      CLOSURE NEEDS TWO THINGS THE FINDERS COULD NOT SUPPLY: an installed
      app at or after 44a33f328 (`./build.sh --ci-full --install` first) and
      a real restart trigger for the proxy. That is why this packet is
      multi_cycle and lands on macuahuitl's meta cycle.

      Measured by lenovinha-silverblue (both `--init` runs, the bind path,
      the orchestrate-enclave teardown) and pirria-cachyos (the released
      binary ships the /tmp CA); filed by the coordinator on macuahuitl.
    next_action: |
      What is LEFT, in order. (a) Decide what "the enclave orchestration" IS
      as a restore path — a flag on the binary, or a script that creates or
      starts proxy/git/inference WITHOUT the e2e teardown — and make the
      remedy line at scripts/check-enclave-ca-consistency.sh:62 name it.
      (b) Make the checker report the path the RUNNING proxy binds (reuse the
      `podman inspect` read at scripts/check-ca-bind-migration.sh:44) or say
      explicitly "declared path X, bound path Y". (c) Reconcile `--init`'s
      --help with what it does; whichever way, they must agree. (d) On
      macuahuitl: install at or after 44a33f328, stop the proxy, run the
      named restore command, paste `podman ps` showing Running — that is
      998-3z6g's closure re-run for real, and this packet's.
    exit_criteria:
      - |
        the preflight remedy names the command that actually starts the proxy, verified by running it
        on a host with the proxy Exited and pasting `podman ps`
      - |
        that command is a restore path, not scripts/orchestrate-enclave.sh or any path that ends in
        `podman rm -f` of the enclave containers
      - |
        scripts/check-enclave-ca-consistency.sh reads the bind SOURCE of the running proxy via podman
        inspect, or its output names both the declared path and the bound path and says which one it
        is reporting
      - |
        998-3z6g's closure is re-run on a host whose installed app is at or after 44a33f328 with a
        real proxy restart, on macuahuitl in the coordinator's meta cycle, with the paste in the
        loop-status entry
      - |
        `tillandsias --init --help` text and `tillandsias --init` behaviour agree, verified by
        running both
    unscoreable: >
      No litmus drives a live enclave proxy restart today: the enclave suites
      (litmus:enclave-isolation and siblings under enclave-network) assert
      network shape, not that a named command brings an Exited proxy to
      Running, and naming a test that does not exist is the dead-reference
      failure this fleet recorded three times on 2026-09-03. The intended pin
      is a fixture that stops the proxy, runs the command the remedy names,
      and asserts the proxy reaches Running and binds the CA path the checker
      reports — write that first, and bind it, and this packet becomes
      scoreable.
