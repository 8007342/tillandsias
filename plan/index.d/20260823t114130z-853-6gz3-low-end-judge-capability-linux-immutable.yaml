      summary: >
        THE LOW-END TIER CAN AFFORD THE FAN-OUT. IT CANNOT AFFORD THE JUDGE.
        Evidence only, no packet claimed — this layer stays with the hosts that
        can run it.

        RE-COSTED AFTER THE TIER B RESULT. macuahuitl's measurement concluded
        "k=1 is the bottleneck — unfold the question, retrieve per sub-query,
        judge each, accumulate". That supersedes the k=6 budget this host filed
        on 855-wrr3 by changing the DESIGN, not by correcting an error. At k=1
        on pirria, measured with novel text per rep on an idle box:

          k=1 judge call (~380 evidence tokens)   ~4.3 s   (91-99 tok/s prefill)
          k=6 judge call (~2800 tokens)           ~40 s

        So a complement pair is ~8.6 s and the affordable fan-out is ~3
        sub-queries in 30 s, ~7 in 60 s. That is modest but WORKABLE, and it is
        roughly 10x better than the k=6 shape. The earlier "not one complement
        pair fits an interactive answer" verdict applied to k=6 and no longer
        describes the design.

        BUT LATENCY IS NOT THE BINDING CONSTRAINT HERE, and this is the finding.
        Ran this packet's OWN complement self-check (exit criterion 5) against
        the only judge this tier can run — qwen2.5:0.5b, the 849-tz8g image
        ceiling:

          passage that DOES answer   "answers?" YES  "missing?" NO   coherent
          CSS passage that does NOT  "answers?" NO   "missing?" NO   CONTRADICTION

        The judge is coherent on the in-corpus passage and CONTRADICTS ITSELF on
        the out-of-corpus one — which is precisely the case this whole programme
        exists to handle (821-73es: the fat spec expert cannot refuse an
        out-of-corpus question). Note the direction differs from the YES/YES this
        packet recorded earlier; the contradiction here is NO/NO. What matters is
        that the pair disagrees with itself, which the mechanism detects with no
        ground truth — the operator's design working exactly as intended.

        THE CONSEQUENCE FOR DEPLOYMENT. A layer whose judge is untrustworthy on
        out-of-corpus questions must REFUSE rather than answer, so on this tier
        853-6gz3 would be self-suppressing: correct, and useless. The claim this
        packet rests on — that the layer "runs LOCALLY on commodity hardware" —
        is therefore NOT falsified by throughput on the bottom host. It is
        falsified, for now, by JUDGE CAPABILITY, and that is a different problem
        with a different fix. The fan-out arithmetic says commodity hardware can
        serve this design; the image ceiling says it cannot serve it with a judge
        worth trusting.

        METHOD NOTE, because the first attempt produced confident nonsense. My
        passage offsets ran past EOF (index.yaml is 2.74 MB; the offsets reached
        5.6 MB), so every "passage" was EMPTY, every prompt was identical, and
        ollama served them from KV cache at 1300-1768 tok/s. THE TELL WAS
        prompt_eval_count IDENTICAL ACROSS EVERY REP (52, 52, 52...). On this
        stack an unvarying token count is the signature of a fabricated
        measurement; check it before reading the throughput column.

