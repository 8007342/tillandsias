        WHAT ACTUALLY BLOCKS IT, named precisely, because "dxg does not cross" would be wrong: the device node DOES cross, and the userspace d3d12 libraries are mountable. The missing piece is /usr/lib/wsl/drivers — the WINDOWS DRIVER STORE, thousands of .inf directories that WSL projects into the guest. dzn's D3D12 device creation resolves the real driver out of that store; without it CreateDevice fails and the loader falls back to the software rasterizer. That is a mount policy question for the product, not a kernel or passthrough limitation.

        THE PRODUCT CONSEQUENCE IS A DECISION, NOT A FIX: giving this lane a container would mean bind-mounting the host's Windows driver store into the inference container, read-only, on WSL2 hosts only. That is a large, host-specific, Windows-derived mount inside a Linux container and it is the coordinator's/owner's call whether the product may do that. If yes, the record gains lanes=[host-native, container] BY MEASUREMENT and criterion 1 follows. If no, this row closes with dxg present-unusable and the reason named, which is now a MEASURED reason rather than an unprobed one.

