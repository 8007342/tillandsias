      metrics paste — run scripts/cycle-metrics.sh --cycle-start <your
      Start-Of-Cycle UTC> and put repeat:/recur:/skippable: in the handoff
      with host, tier and release attached; that alone produces the fleet's
      first floor skippable: reading. If a newer tag exists, run the smoke
      skill on it, file findings, then paste the lines. esmeraldinha: the
      803-49re login walk (NOT CHECKED in the v56.9.2.1 run) is the biggest
      gap and needs the operator's `gh auth refresh` first — do not block the
      round on it.
    exit_criteria:
      - |
        every release published since v56.9.2.1 has a floor smoke report (plan/issues/smoke-e2e-findings-<tag>-<date>.md or a coordinator-filed relay naming the floor host) from at least one floor host
      - |
        each floor host's newest entry in plan/loop_status.d/ carries the three lines repeat:, recur: and skippable: with host, tier and release tag attached
      - |
        every finding from a floor smoke is a packet in plan/issues/ or plan/index.d/, never prose only; a relay through the coordinator names the host that measured
      - |
        TILLANDSIAS_HOST_TIER=low-end scripts/select-work-batch.sh <role> --seed <host> offers this row (its batch: line names it) instead of refused:no-tier-work while it is ready and unleased
    unscoreable: >
      This is a MEASUREMENT CAMPAIGN and the closure is data existing per
      release on the floor, not a test turning green — the same reasoning as
      997-pdgf. No litmus can assert "the newest release has a floor smoke
      report and the floor's newest handoff carries skippable:" without
      becoming a fleet-state assertion that goes red the moment a floor host
      is merely powered off, and naming a litmus that does not exist is the
      dead-reference failure this fleet recorded three times on 2026-09-03.
      What IS pinnable: the selector's tier arm (litmus:capability-routing-shape
      already covers the no-tier-work refusal shape) and the recurrence-line
      grammar (litmus:cycle-metrics-recurrence-shape, 1001-q3zf); the intended
      pin for this row is a coordinator audit step that reads the newest
      loop-status entry per floor host and reports missing:<host> when the
      three lines or the release tag are absent — file it as its own order
      once two floor rounds have been pasted, so the audit is written against
      real entries rather than an imagined shape.
