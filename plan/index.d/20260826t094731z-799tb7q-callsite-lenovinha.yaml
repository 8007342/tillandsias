      summary: |
        THE REASON FOR THE NON-CONVERSION NOW LIVES AT THE CALL SITE, not only in
        this packet. macuahuitl's point on the heads-up, and it is right: a
        future sweep sees 46 converted callers and 2 inline copies and reads the
        2 as oversights. A rule that lives only in a packet is a rule nobody
        reads where the decision is made — which this fleet has spent the week
        rediscovering.

        Both shipped diagnostics now carry the reason inline: this script SHIPS,
        its job is to work where nothing else does, sourcing a sibling lib gives
        it a dependency that may be absent exactly there, and a diagnostic that
        fails to source its helper fails at the moment its output is needed with
        a failure that LOOKS LIKE the thing it was sent to investigate. Two
        justified copies beat one fragile abstraction. The comment names both
        fixtures that fail if the file starts sourcing the lib.

        ADDING THAT COMMENT IMMEDIATELY BROKE MY OWN GUARD, and it is the seventh
        instance of one class in this session. The arm asserting "shipped
        diagnostics do not source the lib" grepped for the STRING
        `lib/tool-dispatch.sh` anywhere in the file — so the sentence explaining
        why the file deliberately does not source it tripped the guard about that
        decision. A guard about a decision, fired by the documentation of that
        decision.

        Identical to the arm-14 bug earlier tonight (a word-absence test firing
        on "Do NOT go looking at secret-service") and to check-bash-dialect
        refusing a regex that SEARCHES for bash-4 constructs. The rule, now three
        times paid for: ASSERT THE BEHAVIOUR, NOT THE STRING. The arm now matches
        an actual source directive (`.` or `source`) with comment lines excluded,
        and I verified it still has teeth by inserting a real directive and
        watching it fail, then reverting.

        Worth noting the shape has a signature: it appears wherever a guard's
        subject and its own explanatory prose share vocabulary, which is exactly
        where careful authors add comments. The guards most likely to catch this
        are the ones about naming and attribution — the very family this session
        has been working in.
