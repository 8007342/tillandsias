      summary: >
        FIXED IN CODE AND VERIFIED IN THE LIVE GUEST — but the smoke as a whole still FAILS, and the residue is not this packet.  THE FIX. The readiness assertion is no longer an ExecStartPost on the daemon's unit. It is its own oneshot, tillandsias-headless-ready.service, After= and Wants= the daemon, never Requires=, and provisioning runs `systemctl enable` on it WITHOUT --now (a `--now` would block `enable` for the whole cold-boot image build and then fail the provisioning step, which is the exact coupling being removed) plus a detached `start --no-block`. Deadline raised 15s -> 900s, which is only safe BECAUSE nothing waits on it any more.  VERIFIED BY APPLYING THE SAME UNIT CHANGES BY HAND to the guest that had been failing, then watching it:    before:  ExecStartPost exits 1 at t+15s -> systemd stops a healthy daemon            mid-image-build -> restart -> repeat. Five NOT-BOUND failures,            unit still `activating`, never converged.   after:   headless=active pid=649 unchanged at t+15/30/45/60s and still            unchanged at t+480s. The assertion sat in `activating` the whole            time WITHOUT disturbing the daemon. That is the property this            packet is about: the probe can now fail without being lethal.  Then it converged: once vsock loopback worked, `VSOCK-CONNECT:1:42420` returned 0, the assertion unit logged `[tillandsias-ready] vsock_listener=bound port=42420` and finished `active`. So 735-ewzp's discrimination survives the move — it still proves a bound listener and still says so when there is none.  UNIT TESTS now pin BOTH halves rather than the old single assertion: the daemon unit must contain NO ExecStartPost at all; the assertion must exist on its own unit as Type=oneshot with Wants= and not Requires=; and provisioning must enable it without --now. The last of those first failed against itself — `include_str!` pulls the test into `source`, so a whole-file `!contains` matched the assertion's own literal. Scoped to the enable window. That trap has bitten checks in this file before and now has a comment saying so.  A SECOND, INDEPENDENT CAUSE, found while verifying and NOT covered by this packet's criteria: on the first boot of a fresh guest, `vsock_loopback` was not loaded. The daemon itself logged `[tillandsias] preflight vsock_loopback missing` and carried on. My probe connects to CID 1 (VMADDR_CID_LOCAL), which REQUIRES that module, so on that boot the assertion was unsatisfiable no matter what the daemon did. `modprobe vsock_loopback` made `VSOCK-CONNECT:1:42420` succeed immediately. On a later boot the module was present and the wire bound at t+15s. So the probe I wrote has a dependency I did not know it had, and I verified it originally on a guest where that dependency happened to be satisfied — the same mistake as the deadline, in a different variable.  WHAT IS STILL NOT VERIFIED, stated plainly. The fix was applied to the running guest BY HAND to test the mechanism. It has NOT been verified end to end from a rebuilt tray and a fresh install, because that needs a guest-binary rebuild plus a tray rebuild plus another clean-room provision. This packet's first exit criterion asks for exactly that and it is NOT met yet.  The smoke's own final reading is still a FAIL: tray --diagnose --json now reports guest_version 0.4.260815.1 (so the host can read the guest) but wire.reachable=false with `VmStatusRequest: early eof` — a DIFFERENT error from the WSA_ERROR(10060) timeout seen while the daemon was being killed every 15 seconds. Early-eof means the connection is established and then closed mid-request. That is a third thing and it needs its own investigation; I am not folding it in here.
