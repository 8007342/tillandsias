        THE TRANSFERABLE PART IS NOT THE MIGRATION, IT IS THE CHECK THAT CAUGHT ITS FAILURES. Twice, resolving the conflict "take my side whole" would have silently dropped a binding: yolanda's test-jq-multiline-capture.sh and her test-cmdkey-predicate-discriminates.sh, both landed on trunk after my merge base, both arriving as inline steps in the region being converted. A valid file with an entry dropped is exactly what `bash -n` cannot see, and it is why arms 5 and 6 of the fixture were built by injection rather than inspection.

        The set comparison against origin/linux-next:build.sh is what catches it — LOST must be empty and ADDED must be exactly one's own new fixtures. AND IT MUST RUN AGAINST CURRENT TRUNK AT RESOLUTION TIME, NOT ONCE AT THE START. My first run missed the jq fixture because I ran it against the trunk of my merge base, before that fixture existed. A set comparison against a stale trunk is exactly as blind as any other instrument pointed at the wrong object. macuahuitl caught the first drop; the corrected method caught the second.

        THE FREEZE IS EVIDENCE, NOT A FOOTNOTE. Gates 22, 23 and 24 each took ~32 minutes on this host, and a new inline step landed in that region during the first two — seven conflicts in one day, the defect actively defending itself, since every host that lands a fixture touches those thirty lines. macuahuitl held trunk for gate 24's window and NOTHING arrived. That is the difference between a race decided by gate duration and a scheduled window, and this box has the fleet's longest gate, so it would have lost the next one too. The negative result is the measurement.

