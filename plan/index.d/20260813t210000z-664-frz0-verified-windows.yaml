      summary: >
        716-f5kc exercised end to end for the first time, and hardened where the
        first pass was an honour system.
        `stamp` used to take the caller's word for it. It now REQUIRES the test
        transcript (`stamp --from <cargo-test-output>`) and refuses on any
        FAILED test not named in `scripts/windows-only-known-red.txt`. A bare
        `stamp` answers `refused:stamp-needs-evidence:… a stamp with no
        transcript is an assertion, not a verification`, and an undeclared red
        answers `refused:undeclared-failure:<test>` — both verified live, the
        second by flipping a passing test to FAILED in a copy of the transcript.
        The known-red list exists rather than a blanket "suite must be green"
        for a measured reason: the embedded-guest-asset test fails on any tree
        whose build counter moved without the asset being rebuilt, which is a
        standing condition here. Refusing to ever stamp because of it would
        leave the report reading `stale` permanently — the decay this check's
        own fixture case 5 exists to prevent. So a tolerated failure has to be
        written down, with its issue, by hand.
        This host's verdict is now `ok:windows-sources-verified:4` instead of
        `stale:windows-sources-never-verified:4`, and it is true: those four
        Windows-only sources were compiled and their tests run by a Windows
        toolchain, at a known tree state, with the one failure declared.
