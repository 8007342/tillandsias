packets:
  - packet_id: device-record-carries-its-own-memory-model
    release_target: stable-milestone-v1
    order: 964-r98h
    milestone: 718-rtnh
    status: ready
    desired_release: v0.6
    kind: enhancement
    pickup_role: any
    priority: p3
    tags:
      - accel
      - probe
      - capability-envelope
      - memory
      - v0.6
    title: |
      A DeviceRecord says whether its memory is its own or the host's, so accel_mem_model stops answering `unknown` for every AMD and Intel GPU in the fleet.
    context: |
      Found while implementing 793-qr4t, whose third exit criterion is that a
      unified-memory node publishes ONE budget so no consumer can sum a GPU
      pool with a CPU pool. The envelope now emits `accel_mem_model`, and it
      answers `unknown` for every AMD and Intel DRM device — which is most of
      the fleet's iGPUs and the exact population the criterion is about.

      THE REASON IS A MISSING FIELD, NOT A MISSING RULE. `DeviceRecord` records
      device_class, vendor, name, device_node, driver, lanes and a memory
      BANDWIDTH, and nothing that separates an integrated part sharing DRAM
      from a discrete board with its own VRAM. An AMD device may be either.
      So the classifier asserts `unified` only where the architecture makes it
      true (Apple silicon; a node with no GPU at all, which has one pool and
      nothing to sum) and `discrete` where the vendor does (NVIDIA), and says
      `unknown` for the rest.

      `unknown` IS THE SAFE READING, WHICH IS WHY THIS IS p3 AND NOT p2: a
      consumer that cannot tell must not sum either, so nobody double-counts a
      pool today. What it costs is the AFFIRMATIVE half — a sizing consumer
      (522) that wants to use the whole unified pool on a Ryzen AI laptop
      cannot learn that it may, and falls back to the conservative number.

      Guessing from the vendor is not the fix and would be worse than
      `unknown`: `unified` is wrong for a discrete Radeon and `discrete` is
      wrong for every iGPU in the fleet, and either guess reads as a fact.

      The signal exists on Linux and is cheap — a DRM device's
      `/sys/class/drm/cardN/device/mem_info_vram_total` (amdgpu) is absent or
      zero for an integrated part — and yolanda-windows is already wiring
      vendor_id/device_id/driver/node into the same record under 793-zumy, so
      this belongs beside that work rather than in a second pass over the same
      struct.
    exit_criteria:
      - |
          `DeviceRecord` carries an explicit memory-model field populated by the
          probe, and `accel_mem_model` reports `unified` or `discrete` for an
          AMD or Intel GPU on a host where the evidence is available.

      - |
          A device whose memory model genuinely cannot be determined still
          reports `unknown` rather than a vendor-derived guess, and the
          distinction is pinned by a test.

      - |
          No consumer's reading of `accel_mem_budget_gb` changes: it remains
          exactly one number, and `unified` remains a prohibition on summing.
    events:
      - type: note
        ts: "2026-09-02T21:02:00Z"
        agent_id: "linux-lenovinha-opus5-20260902t202900z"
        host: lenovinha
        summary: |
          Filed from inside 793-qr4t rather than as a separate discovery, and
          the distinction matters for whoever picks it up: the classifier this
          replaces is not a stub someone left unfinished. It is a deliberate
          refusal to guess, documented as such in `mem_model()`, and the
          honest `unknown` it returns is the reason 793-qr4t's third criterion
          could be closed at all. Replace it when the document can answer;
          do not replace it with a cleverer inference over the same fields.
