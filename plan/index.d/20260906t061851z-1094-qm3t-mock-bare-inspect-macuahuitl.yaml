        post-fix convergence fixture     rc=0
        SABOTAGE permissive tail         only the ABSENT arm catches it —
          the two success-side arms pass against a mock that exits 0 for
          everything, which is why the arm set is two-directional
        SABOTAGE old blanket refusal     all three arms fail (rc=97)
