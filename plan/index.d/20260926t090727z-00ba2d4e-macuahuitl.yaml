        RATCHET SEMANTICS THIS FIXES, for 1395-ue3i (the advisory R line) and the grader: (1) ADDING a spec or requirement adds its obligations to the denominator (target) and changes NO existing obligation, met or unmet: reported as scope growth, never as regression. (2) OBSOLETING a spec WITH a tombstone trail (an openspec change or archive record) removes its obligations by design: not a regression. Only an obligation that disappears WITHOUT such a record is the regression the ratchet names. (3) The monotonic promise: no existing obligation's state moves DOWN (a lost satisfaction) unless the obligation itself was lawfully retired; the satisfied count never falls except through a recorded retirement. (4) Unkeyed active requirements (1396-35we) get NEW unique ids assigned forward, CRDT-style: never renumbered, never reused, never derived from position, so an id, once minted, names one requirement forever.
