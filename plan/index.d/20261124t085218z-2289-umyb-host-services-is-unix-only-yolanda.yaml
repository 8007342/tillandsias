    title: "building tillandsias-headless with host-services for a non-unix target fails with one error that says unix-only, not 26 unrelated ones"
    context: |
      Measured on yolanda 2026-11-24, x86_64-pc-windows-msvc, rustc 1.99.0, at f874adf32 and at its merge base bf909254f
      alike: cargo check -p tillandsias-headless --features host-services gives 26 errors (53 with --all-targets), all
      std::os::unix, std::os::fd, nix or libc. Default features build clean there.
      DECISION: host-services is unix-only by design. Cargo.toml's own comment places it in the Linux tray or the VM
      guest, only tray and listen-vsock enable it, and the guest is a linux-musl build even when a Windows or macOS
      host stages it. On Windows the forge runs in the WSL2 guest, so a native port would have no process to live in.
      A compile_error! in main.rs would be a 27th error beside the 26. The build script runs before rustc sees the
      crate, so refusing there is the one error. It must read CARGO_CFG_UNIX (the target), not cfg!(unix) (the host).
    exit_criteria:
      - "cargo check -p tillandsias-headless --features host-services on native Windows prints one crate error naming the feature and unix-only, and no E0433."
      - "Default features still build on native Windows, and host-services still builds on a unix target."
      - "The decision is the target's: the build script refuses with CARGO_CFG_UNIX absent and passes with it present, on any host."
