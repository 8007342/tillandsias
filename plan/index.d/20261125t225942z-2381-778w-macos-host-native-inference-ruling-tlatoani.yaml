- packet_id: macos-host-inference-allowlist-credential-and-caps
  order: 2381-t39p
  status: ready
  kind: security
  priority: p1
  desired_release: v0.5
  pickup_role: macos
  capability_tags: [macos, inference, security]
  size: M
  implementer_tier: opus
  estimated_hours: 8
  title: 'Allowlist between the vsock relay and the host inference service: two operations, tier-table models, per-VM credential, caps'
  context: >-
    SLOT-10.3 and SLOT-10.4. Precedents: Ollama DNS rebinding (CVE-2024-28224); a 0.0.0.0-bound Ollama let a web
    page rewrite a chat template via /api/create (Aug 2026); mlx_lm.server does "basic security checks" only.
    A guest with no caps can exhaust the Mac's unified memory.
  exit_criteria:
  - 'Only chat-completions and embeddings for tier-table models pass; pull, create, copy, delete, push and template edits are refused by name; a test sends each and fails on a pass-through proxy.'
  - 'A missing or wrong per-VM credential is refused; concurrency, token and context caps refuse rather than queue without bound.'
  verifiable_closure: 'cargo test -p tillandsias-vm-layer host_inference_allowlist_refuses_model_management'
  next_action: 'Write the refusal tests first against a stub service.'
  provenance: 'Operator ruling 2381-778w.'
  related: [2381-778w, 2381-iy9u, 1654-6me6]
  events:
  - {type: filed, ts: '2026-11-25T22:59:42Z', host: tlatoanis-macbook-air, summary: 'filed from ruling 2381-778w'}
