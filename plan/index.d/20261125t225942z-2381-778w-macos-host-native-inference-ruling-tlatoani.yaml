packets:
- packet_id: macos-inference-host-native-krunkit-vm-layer-ruling
  order: 2381-778w
  status: implemented
  kind: decision
  priority: p1
  desired_release: v0.5
  pickup_role: macos
  capability_tags: [macos, inference, vm, decision]
  size: S
  implementer_tier: sonnet
  estimated_hours: 1
  title: 'Operator ruling 2026-11-25: krunkit is the macOS VM direction; inference runs host-native by default; small models on host and in containers share one budget'
  context: >-
    Operator, verbatim, in the tlatoanis-macbook-air session, 2026-11-25: "Excellent. I approve krunkit as the
    direction to follow, please triage it appropriately and relay to /list-agents macuahuitl-fedora these updates,
    make sure the specs and plan are updated accordingly. I approve your suggestions on what we should reconsider.
    As per the token limits, our fleet leader /list-agents macuahuitl-fedora is also planning on using small models
    to run babysitter jobs on the metal, and inside the containers, all of these need to be resource-aware and
    plan-aware, they all play together, and should compliment each other."
    The four suggestions approved were:
    (1) host-native inference as the macOS default, not opt-in;
    (2) krunkit narrowed to a better VM layer, not the inference path;
    (3) Apple Foundation Models as an optional first tier;
    (4) benchmark on this base M5 before choosing an engine.
    The operator confirmed the ruling in macuahuitl-fedora's session the same day ("Yes that was me").
    DIRECTION ONLY, NOT RULED (operator 2026-11-25, relayed by macuahuitl-fedora, paraphrased closely):
    - Pool local inference for LAN workers, each host making the best use of its own hardware (NPU, unified memory).
    - Later, share models across trusted fleet workers, so low-end hosts (calmecacpilli, pirria, the Mac Neos)
      can use "LAN agents", and later "WAN agents" over tunnels.
    - Next to look at: NPU performance, macOS krunkit, and a low-overhead encrypted socket like the
      host-to-VM one.
    - A worker with lots of RAM and an NPU will join the fleet soon.
    The pooling design comes later. Nothing in this row rules it, but SLOT-10's per-VM credential and caps,
    and 2381-zueb's one-budget rule, should not preclude a remote caller.
    Research: plan/issues/macos-containers-and-apple-silicon-inference-research-2026-11-25.md.
    Spec: openspec/changes/macos-host-native-inference (SLOT-10, SLOT-11), plus the 2094-65yz edits
    (job-admission-queue: one budget for every model; watchdog-judge-placement: the macOS ruling).
  exit_criteria:
  - 'The ruling is quoted verbatim, dated, in this row and in the change proposal.'
  - 'Every affected row carries a note naming this ruling: 1921-kr7v, 1653-77bt, 1654-6me6, 2094-65yz.'
  verifiable_closure: 'grep -l 2381-778w openspec/changes/macos-host-native-inference/proposal.md plan/index.d/*2381-778w*'
  unscoreable: 'a decision record: its deliverable is the recorded ruling and the notes on the rows it affects, which nothing scores'
  next_action: 'Recorded. The work is in 2381-tfna, 2381-iy9u, 2381-t39p, 2381-zueb and 2381-rt4e.'
  provenance: 'Operator, in session, 2026-11-25.'
  related: [1921-kr7v, 1653-77bt, 1654-6me6, 2094-65yz, 2081-z7sh]
  events:
  - {type: filed, ts: '2026-11-25T22:59:42Z', host: tlatoanis-macbook-air, summary: 'operator ruling recorded verbatim'}
- packet_id: macos-inference-engine-benchmark-on-base-m5
  order: 2381-tfna
  status: ready
  kind: research
  priority: p1
  desired_release: v0.5
  pickup_role: macos
  capability_tags: [macos, inference, benchmark]
  size: S
  implementer_tier: sonnet
  estimated_hours: 3
  title: 'Measure Ollama-MLX vs mlx_lm.server vs llama-server on a base M5 16 GB: small-model chat, embeddings, resident memory'
  context: >-
    No published source covers small models on a base M5 with 16 GB. Published comparisons conflict (one bench has MLX ~1.75x
    llama.cpp decode on an M4 Max; Docker measured llama.cpp ahead of vllm-metal). M5 gains are mostly prefill,
    which is most of classification, summarising and embedding. The engine choice in 2381-iy9u waits on these numbers.
  exit_criteria:
  - 'Decode and prefill tok/s for 0.5B, 1.7B and 4B class 4-bit models on each engine, three runs each, same prompts.'
  - 'Embedding throughput for Qwen3-Embedding-0.6B and EmbeddingGemma on the engines that serve them.'
  - 'Resident memory per model per engine, recorded as the reserves 2381-zueb admits against.'
  verifiable_closure: 'plan/issues/macos-inference-engine-benchmark-<date>.md with the raw runs.'
  unscoreable: 'a measurement: its deliverable is the dated benchmark record with raw runs, not a pass/fail test'
  next_action: 'Upgrade host Ollama to >= 0.40.17 (operator-approved host install required), pin models, write the harness.'
  provenance: 'Operator ruling 2381-778w.'
  related: [2381-778w, 2381-iy9u, 2381-zueb]
  events:
  - {type: filed, ts: '2026-11-25T22:59:42Z', host: tlatoanis-macbook-air, summary: 'filed from ruling 2381-778w'}
