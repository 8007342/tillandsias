packets:
  - packet_id: the-capability-row-guard-verifies-a-row-exists-not-that-it-is-true
    order: 889-ewvt
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      check-capability-row.sh printed green all night over a row claiming hardware the host does not have — and that false row misrouted the release gate
    deliverable: |
      a capability row that disagrees with a live probe is DETECTED, so routing
      cannot consume a stale claim as a current fact
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - capability-matrix
      - routing
      - fail-loud
      - multi-host
      - freshness
    estimated_hours: 3
    context: |
      MEASURED on yoga 2026-08-25, discovered because it misrouted an
      operator-directed release cut.

      THE COMMITTED ROW (tillandsias-plan capability-matrix):

        host:yoga ... ts:2026-08-23T02:11:17Z
          schedulable: cpu/container/ollama
          schedulable: gpu/container/ollama

      THE LIVE PROBE on the same host, run 2026-08-25:

        scripts/host-capability-probe.sh  ->  "engines": []

      No ollama binary, no endpoint, no model. The row was written two days
      earlier and nothing re-verified it since.

      THE CONSEQUENCE: the coordinator's `./build.sh --ci-full` failed for want
      of an embedding endpoint (888-miiy), so the authoritative release gate was
      routed to yoga specifically BECAUSE its row advertised
      `gpu/container/ollama`. yoga could not run it either. A missing row routes
      nothing; a FALSE row routes confidently and wrongly, which is strictly
      worse.

      THE GUARD CANNOT CATCH THIS BY CONSTRUCTION. Its grammar
      (check-capability-row.sh:32) is
      `^(ok:capability-row-reported:<host>|due:no-capability-row:<host>|unavailable:...)$`.
      Every token is about REPORTING. It asks "has this host published a row",
      never "is the row still true". So it printed `ok:capability-row-reported:yoga`
      on every cycle all night, over a row that was false — and it will keep
      printing green for as long as the row exists, however stale.

      THE ACCURATE SIGNAL WAS PRESENT AND WENT UNCONSUMED. `cycle-preflight.sh`
      honestly reported `degraded:image-missing:build-inference` on EVERY cycle
      yoga ran that day, and the skill correctly classifies that as a report
      rather than a gate. So the host was truthfully saying its inference lane was
      down, while the artifact that routing decisions actually read said it had
      two ollama engines. The two never met.

      THE CLASS, NAMED BY yoga AND WORTH KEEPING. This is the third instance in
      one evening of an ARTIFACT being read as evidence of the CHECK that would
      have produced it:
        - a Windows e2e PASS counted as Linux coverage (deferred a Linux run)
        - an unrecorded local build (v0.4.260823.1) counted as "this host is on
          something recent"
        - a capability ROW counted as the capability itself (this packet)
      885-92iu was the same shape in the ledger. macbook reached the same rule
      independently the same night while retracting 889-bx99, and their
      formulation is the one to keep: BEFORE TRUSTING A PROBE, ASK WHAT RESULT
      WOULD HAVE FALSIFIED IT — IF NOTHING WOULD HAVE, YOU MEASURED YOUR OWN
      INPUT. A guard that only checks a row's existence cannot be falsified by
      the row being wrong.
    outcome: |
      Routing consumes capability claims that are either currently true or
      visibly stale — never confidently false.
    exit_criteria:
      - 'The guard gains a TRUTH dimension: a committed row that disagrees with a live probe on this host emits a distinct verdict (e.g. `stale:capability-row-drifted:<host>:<what>`), separate from the existing `due:no-capability-row`. Absence and falsehood must never share a token.'
      - 'A fixture proves both directions: a row matching the probe reads ok; a row claiming an engine the probe does not report reads drifted, naming the engine.'
      - 'NEGATIVE CONTROL: a host that legitimately cannot probe (no permission, probe unavailable) reads `unavailable:` and NOT `drifted` — an unrunnable probe must not manufacture a drift claim, which would be this same defect inverted.'
      - Rows carry enough freshness information that a consumer can decline a stale claim without re-probing every host, and the matrix surfaces row age at read time.
    verifiable_closure: |
      On a host whose committed row claims an engine the live probe does not
      report, `scripts/check-capability-row.sh` emits a drift verdict naming the
      engine; correcting the row returns it to ok.
    notes: |
      Do NOT fix this by making the guard re-probe on every cycle and rewrite the
      row automatically. The row is a committed, shared artifact and silent
      self-correction would destroy the audit trail of what a host claimed when —
      which is exactly the evidence that made this diagnosable at all.

      Do not fix it by deleting the row on drift either: routing needs to know the
      host exists. Drift is a statement about the row's CONTENT, not its right to
      be there.

      Related but distinct: 888-miiy (the gate that reds for an undeclared
      environment dependency) is the defect this one misrouted us into; 864-t4nq
      is the same reading problem for cadence rather than capability.
    events:
      - type: filed
        ts: "2026-08-25T22:55:00Z"
        agent_id: linux-macuahuitl-fable5-20260825t224500z
        host: macuahuitl
        summary: |
          Filed by the coordinator after routing the authoritative release gate
          to a host on the strength of a capability row that was two days stale
          and false. Found by yoga, which ran the live probe rather than trusting
          its own published row — the check the guard never makes.
