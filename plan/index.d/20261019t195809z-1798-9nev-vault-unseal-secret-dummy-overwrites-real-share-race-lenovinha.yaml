    title: |
      Vault first boot: a concurrent ensure_vault_running overwrites the real Shamir share in tillandsias-vault-unseal with the HKDF dummy after init, so the first restart is refused (wrong key)
    context: |
      Measured on lenovinha with v56.10.18.1, 2026-10-19, after the operator wiped the vault container, every podman secret, the vault-data contents and the keyring entry vault-shamir-share-v1. It reproduced on each of three clean cycles.
      Timeline of the debug cycle (tillandsias --tray --debug, launched from HOME):
        19:15:26Z  the entrypoint loads the 32-byte key material (first-boot HKDF dummy K) and launches.
        19:15:27Z  "first boot: running vault operator init", then "vault initialized (handover artifacts written to tmpfs)", then unsealed.
        19:15:29Z  the keyring entries vault-shamir-share-v1 and vault-root-token-v1 are written: the fresh-init handover was consumed and the real share persisted.
        ~19:16     podman secret tillandsias-vault-unseal shows UpdatedAt after CreatedAt. The last write was the dummy.
        19:16:37Z  the vault restarts: "FATAL: unseal request returned HTTP 400: wrong key", "failed to decrypt keys from storage", shutdown.
      Interleaved tray stderr (several bootstrap callers share it; the github and cloudflare token rotations each reach ensure_vault_running):
        [tillandsias-vault] keyring Shamir share get failed/timed out (No matching entry found in secure storage); checking file fallback
        [tillandsias-vault] Shamir share not found; deriving first-boot dummy key K
        note:cloudflare-store:vault-not-running:starting-the-vault-enclave-only (no other image is built or started)
        [tillandsias-vault] vault healthy (initialized=true sealed=false v=1.18.5)
        [tillandsias-vault] creating podman secret tillandsias-vault-unseal (32 bytes from HKDF)
        [tillandsias-vault] writing policy git-mirror-policy
      The HKDF create is logged AFTER "vault healthy (initialized=true)". Reading: one caller passed the unseal_secret_exists() check (vault_bootstrap.rs, ensure_vault_running, the verify-before-persist block) before any secret existed. Its create_unseal_secret(dummy) runs podman secret create --replace, and it landed after another caller's post-init re-pair in read_and_handover_root_token. This is a check-then-act race. The dummy wins and storage is wedged. That reading comes from the interleaved log; the fixture below is what confirms it.
      #569 (1796-ukey, in v56.10.19.1) lets the recovery seam fall back to the keyring share, which should heal it after the fact. It does not remove the race.
    exit_criteria:
      - 'RED FIRST: a fixture with an injected delay between unseal_secret_exists and create_unseal_secret, run as two concurrent ensure_vault_running callers on a fresh first boot, reproduces the dummy overwriting the real share (FAILS on the pre-fix code)'
      - 'two concurrent ensure_vault_running callers on a fresh first boot leave exactly the real share in tillandsias-vault-unseal, and a restart of the vault unseals'
      - 'fix shape: one serialized ensure (a process-wide lock or single-flight); create_unseal_secret refuses --replace whenever vault-data is initialized, so a dummy can never overwrite after init'
    verifiable_closure: |
      litmus:vault-first-boot-unseal-single-flight runs the concurrent-caller fixture: it FAILS on the pre-fix code, then passes with the real share in the secret and a restart that unseals.
