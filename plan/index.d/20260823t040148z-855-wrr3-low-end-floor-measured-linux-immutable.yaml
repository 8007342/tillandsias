      summary: >
        THE LOW-END FLOOR, MEASURED. Host pirria: Intel N150, 4 Alder Lake-N
        E-cores, no SMT, AVX2 + AVX_VNNI, no AVX-512; 16 GiB; Fedora Silverblue
        44. Engine tillandsias-inference:v0.4.260817.1, ollama 0.32.14, which
        selected libggml-cpu-alderlake.so with n_threads=4 — the correct backend
        for this silicon, so these are TUNED numbers, not a misconfiguration.

        TWO OF THE PACKET'S PREMISES ARE WRONG, and both matter for scheduling.

        (1) THIS HOST IS NOT SINGLE-CHANNEL. EDAC reports MC#0_Chan#0 AND
        MC#0_Chan#1 populated, 4x4096 MB = 16 GiB dual-channel. esmeraldinha's
        single-channel DDR4-2667 does not transfer to it. The consequence
        separates cleanly along the compute/bandwidth line: prefill is
        IDENTICAL across the two hosts (107.5 vs 108.9 tok/s, 0.99x) while
        decode is ~1.9x (39 vs 20.5). Same cores, roughly double the bus. A
        fleet predicting decode from core count alone will mis-schedule this
        host. Honest caveat: EDAC's dimm_mem_type reads "Low-Power-DDR3-RAM",
        an igen6_edac misreport on ADL-N; the ACPI SSDT is named Adl_DDR4;
        dmidecode needs root, unavailable unattended. CHANNEL COUNT is solid,
        DRAM TYPE is not.

        (2) THE iGPU IS NOT "DISPLAY SILICON", and the real reason is more
        actionable. It IS present-unusable, but the obstruction is the IMAGE.
        The pinned inference image ships ONLY CPU ggml backends
        (libggml-cpu-alderlake/haswell/icelake/sapphirerapids/skylakex/zen4...)
        and NO libggml-cuda/hip/sycl/vulkan — a search for all four returned
        empty. Meanwhile Mesa ANV Vulkan IS in the Silverblue base with NO
        layering, and the fleet has ALREADY measured this silicon class doing
        Vulkan compute: esmeraldinha, same UHD-on-ADL-N, OLLAMA_IGPU_ENABLE=1,
        100% offload, prefill +31%/+60%, decode -17%/-20%, nomic-embed 58%
        WORSE (loop_status.md:3896). So the correct reason is
        vulkan-backend-absent-from-pinned-image — the same shape as 849-tz8g,
        where the image was the ceiling and the hardware was not. A second,
        independent gap: the inference container mounts no /dev/dri, so even a
        Vulkan-capable ggml would still need passthrough. Runtime
        corroboration: ollama logged initial_count=0 devices, total_vram="0 B",
        tier=T1 (RAM 15GB, VRAM 0GB).

        THE MEASURED FLOOR. Embedder nomic-embed-text via the production call
        shape (POST /v1/embeddings, as spec-index-ensure.sh:427 issues it), real
        corpus chunks of 1200 chars = 393 tokens:
          batch  1   1752 ms/embed   224   tok/s
          batch  8   1598 ms/embed   232   tok/s
          batch 32   1642 ms/embed   230   tok/s
          batch 64   1641 ms/embed   230.8 tok/s   (105.0 s for the batch)
        THROUGHPUT IS FLAT ACROSS BATCH SIZE. Batching buys NOTHING on CPU,
        independently corroborating esmeraldinha's "batching 10-in-1 saves only
        14% — irreducible compute". Any plan assuming batch amortisation on a
        CPU host is wrong before it starts.
        Query-shaped embeds, which is what the expert layer actually issues:
        8 tok -> 85 ms, 24 tok -> 154 ms, 107 tok -> 495 ms (~65 ms fixed
        per-call overhead; asymptote ~230 tok/s).
        qwen2.5:0.5b: prefill 107.5 tok/s at ~240 tok, decode 39-43 tok/s,
        cold load 1321 ms.

        THE RATIO THE PACKET ASKED FOR. A batch of 64 chunks costs 105.0 s here
        against 1.52 s on macuahuitl — 69x. Per chunk, 1641 ms against 23.75 ms.
        Caveat kept: macuahuitl's chunk token count is not in the ledger, so
        that ratio is per-chunk on each host's own corpus. The esmeraldinha
        comparison above IS per-token (its 816k tok / 1592 chunks = 512
        tok/chunk at 2.9 s/chunk = 176.6 tok/s vs 230 here = 1.30x) and is
        therefore the stronger of the two.

        A FULL SPEC-INDEX REBUILD IS NOT POSSIBLE HERE. At 1641 ms/chunk:
        9,910 chunks = 4.5 hours; 20,657 chunks = 9.4 hours, against ~12 min
        and ~490 s on macuahuitl. This host must CONSUME a prebuilt index; it
        can never produce one. Scheduling fact, not preference.

        CRITERION 5 — THE LEANER RUNTIME IS NOT THE ANSWER, recorded as a
        negative result so nobody re-runs it hoping. llama-server driven
        directly — the same binary ollama itself spawns, same GGUF, same ggml
        build, same container, same 4 threads, so ONLY the Go scheduler and HTTP
        layer differ — decoded at 42.6 tok/s against ollama's 40.0. About 6.5%.
        Not material; no deployment decision changes. ollama's overhead is not
        the constraint, the CPU is.

        CRITERION 4 — THE PER-CALL BUDGET, measured rather than extrapolated.
        A judge call reads retrieved evidence and emits a short verdict:
          ~430 tok evidence    95   tok/s prefill    4.9 s
          ~1150 tok            118  tok/s           11.0 s
          ~2800 tok (k=6)      72.3 tok/s           ~40 s
        PREFILL THROUGHPUT FALLS AS CONTEXT GROWS (attention is superlinear;
        peak is near 1000-1500 tokens), so evidence is worse than
        proportionally expensive. 853-6gz3's complement design needs TWO judge
        calls per sub-question, so at k=6 one sub-question with one wave is
        ~80 s, n=3 is ~4 min, n=5 is ~6.7 min. NOT ONE COMPLEMENT PAIR FITS IN
        AN INTERACTIVE ANSWER on this host at k=6.
        THE FLOOR 853-6gz3 MUST DESIGN AGAINST, stated as its criterion 7 wants
        it: the governing quantity is EVIDENCE TOKENS, not sub-question count.
        Budget is roughly tolerable_seconds x prefill_tok_s across the WHOLE
        fan-out. To keep one complement pair under 30 s here, each call gets
        ~1,500 tokens — about k=3, not k=6. The lever is evidence per
        sub-query; adding waves is unaffordable long before it is useful.

        CRITERION 6 — COLD BOOTSTRAP, measurable exactly once, and the
        expectation was miscalibrated in the reassuring direction. From a host
        with NO toolbox, NO ~/.cargo, NO ~/.rustup and NO target/:
          toolbox create (pull fedora-toolbox:44, 2.18 GB)      23 s
          dnf toolchain + rustup + 2 musl targets (1.9 GB)      54 s
          cargo check --workspace + all gate phases            259 s
          ./build.sh --check TOTAL, rc=0, ALL GATES PASSED     336 s
          cargo build --release (tillandsias + plan)           204 s
          COLD BOOTSTRAP TO A USABLE RELEASE BINARY            540 s
        Nine minutes, not the feared hours. The warning that the first --check
        "will take a very long time" was calibrated for a full build; --check is
        cargo check --workspace (build.sh:402) and produces NO BINARIES, which
