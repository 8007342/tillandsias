        ALREADY-EXPIRED TOKEN. The seeding path was never broken; it faithfully
        stored a credential that upstream would refuse. A seed that reports
        success without validating the token against upstream is the same
        fail-open shape as everything else in this milestone, and 759's
        pervasiveness research already names it: "zero seed-time authorization
        validation".

