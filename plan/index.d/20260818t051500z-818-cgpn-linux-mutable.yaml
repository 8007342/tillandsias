    context: |
      OBSERVED, macuahuitl 2026-08-18, two consecutive e2e Step 1 runs.

      RUN A — the limiter allowed FULL. The in-forge cycle ran, hit the
      Credential Channel Guard, got `blocked:upstream-auth-stale` (21504s old
      against a 900s ceiling) and stopped without a marker. Correct: a full
      cycle would have pushed.

      RUN B — the limiter had recorded run A, so the launcher chose SMOKE and
      sent the right prompt ("Use the /meta-orchestration skill in smoke mode
      (verify-only)"). The agent DID enter smoke mode — it emitted MO-SMOKE
      grammar — and reported:

        | Credential channel | blocked:upstream-auth-stale (>900s) |
        | Committable branch | ok:branch-linux-next |
        | Expert base        | ok:expert-base-ready |
        | MCP expert health  | ok:experts-healthy |
        | build.sh --check   | PASS (89s, all gates green) |

        MO-SMOKE: FAIL credential channel blocked (upstream-auth-stale, 22880s > 900s max)

      Everything smoke exists to verify was GREEN. It failed on a push
      credential, in a mode whose own rule 1 says "a smoke run leaves the repo
      untouched" — it claims nothing, commits nothing, pushes nothing.

      THE STRUCTURAL POINT. Smoke is the designed fallback for when the full
      lane is unavailable. Gating it on the same credential means the two paths
      fail together and there is no path. And because litmus:opencode-prompt-e2e-shape
      runs inside `./build.sh --ci-full`, that takes Step 1 down, and the
      runbook's stop rule then forbids §2/§3 — the substrate idempotence test,
      which never touches a credential at all. That is 808-zrzz's series-wiring
      observation with a second link now measured.

      A DEPENDENCY NOBODY CAN SEE FROM THE RUNBOOK: which of A or B you get
      depends on `scripts/forge-e2e-rate-limit.sh` state, i.e. on how recently
      a full forge cycle ran. Before this packet, both outcomes were failures,
      so the dependency was invisible; it would have started mattering the
      moment one of them passed.

      NOT THE AGENT'S MISREADING, or not only. The skill tells every cycle to
      run the guard at Start Of Cycle and the guard's own section says "before
      any worker drain or committable work" — it never exempts smoke, so an
      agent applying it is following the document.
