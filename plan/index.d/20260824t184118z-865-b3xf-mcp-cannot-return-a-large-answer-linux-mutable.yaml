    packet_id: the-forge-mcp-server-could-not-return-a-large-answer-and-blamed-jq
    desired_release: v0.5
    title: "rpc_result_text passed the whole expert answer in argv, so any sufficiently useful reply died with E2BIG while framing"
    status: completed
    kind: defect
    pickup_role: any
    priority: p0
    capability_tags: [forge, mcp, expert-system, ci, release]
    deliverable: images/default/config-overlay/mcp/forge-plan.sh
    depends_on: []
    estimated_hours: 2
    discovered_by: "865-n8vq — triaging the last check failing ./build.sh --ci-full"
    context: >
      THE FORGE'S PLAN MCP SERVER COULD NOT RETURN A LARGE ANSWER. `rpc_result_text`
      built its JSON-RPC frame with

        jq -cn --argjson id "$_rr_id" --arg text "$_rr_text" ...

      and `$_rr_text` is the EXPERT'S WHOLE ANSWER — the one value in that
      function that grows with the CORPUS rather than with the request. Past the
      kernel's argv limit execve returns E2BIG and the frame is never built:

        forge-plan.sh: line 953: /usr/bin/jq: Argument list too long

      Reproduced directly on macuahuitl: a 300 KB payload through the old form
      exits 126 with that exact message; through the new form, rc=0.

      WHERE IT LANDS IS WHAT MAKES IT WORSE THAN A SIZE LIMIT. The server has
      already done the work — retrieved, judged, assembled — and then fails
      while FRAMING THE REPLY. The client receives no result and no error it can
      attribute, and the message names jq, the last honest component in the
      chain. The failure is also monotone in usefulness: the richer the answer,
      the more certainly it is lost. An expert that silently drops its best
      answers is worse than one that refuses, because a refusal is legible.

      It surfaced through litmus:expert-capability-skew-honesty, a test about
      capability honesty that happened to ask for a big enough answer.

      THE OTHER `--arg` SITES IN THESE SERVERS WERE CHECKED AND LEFT ALONE: a
      refusal reason, an embedding model name, the user's question, an error
      message. Each is bounded by the REQUEST. Only the answer is bounded by the
      corpus, which is why only this one had to change.
    exit_criteria: >
      (1) The answer reaches jq via stdin, not argv, so no answer size can
      prevent its own framing.
      (2) Byte-identical output to the old form for payloads that fitted —
      including quotes and embedded newlines — so no wire-format change rides
      along.
      (3) litmus:expert-capability-skew-honesty executes and passes AT A SIZE
      THAT ACTUALLY RUNS IT.

