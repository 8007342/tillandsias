packets:
  - packet_id: e2e-reports-declare-their-own-promotion-clearance
    order: 888-79x3
    release_target: fail-loud-diagnosis-milestone
    status: ready
    desired_release: v0.5
    role: tooling
    priority: p2
    kind: enhancement
    title: |
      An e2e report should declare its promotion clearance in a machine-readable field, so the gate honours "this run does not clear promotion" by construction rather than by prose.
    deliverable: scripts/promote-stable.sh + the e2e skills' report template
    depends_on:
      - promote-stable-evidence-gate-is-platform-aware
    pickup_role: any
    owner_host: any
    capability_tags:
      - ci-release
      - fail-loud
    estimated_hours: 2
    problem: |
      Filed at the coordinator's direction (macuahuitl, 2026-08-25) as the
      follow-up to 888-m75r, and deliberately NOT built that night.

      A real report exists that asserts PASS while explicitly disclaiming
      promotion clearance:
        plan/issues/smoke-e2e-findings-v0.4.260815.1-2026-08-16-windows.md
        "# ... windows FULL lane re-run — PASS (run-scoped; does NOT clear promotion)"

      The gate counts it as evidence. That is the RIGHT call for a matcher —
      the coordinator's reasoning: disclaimer wording is unbounded ("does NOT
      clear promotion" today, some other phrasing next month), and a matcher
      chasing prose degrades into guessing what an author meant. Worse, it fails
      in the dangerous direction eventually: prose that no longer matches the
      pattern reads as clearance.

      So 888-m75r prints a loud warning naming the report and lets the operator
      decide. That is machine-VISIBLE without being machine-INTERPRETED, which
      is the same shape as every other advisory in this tree — but it leaves a
      real residual: an author who means "this run does not clear promotion"
      has no way to SAY so that the gate honours.
    why_it_matters: |
      Converts the residual from "we chose not to read prose" into "reports
      declare their own clearance", which is the honest end state. Until then,
      the only thing standing between a deliberately-disclaimed run and a
      promotion is an operator reading a warning.
    exit_criteria:
      - |
          An e2e report carries an explicit machine-readable clearance field (e.g. a `clears_promotion: true|false` front-matter key) that the gate reads without inference.
      - |
          The gate treats a report declaring no clearance as NOT satisfying that platform, and names it in the refusal.
      - |
          The e2e skills emit the field by default, so the common path declares clearance rather than relying on absence.
      - |
          A report with no field at all keeps today's behaviour (counts, with the prose-disclaimer warning) — the migration must not invalidate every existing report on the day it lands.
      - |
          Negative controls: a declared-no-clearance report does not satisfy its platform even though it says PASS; a declared-clearance report does; an absent field is neither silently cleared nor silently refused.
    notes: |
      The last exit criterion is the one to get right. A field that fails closed
      on absence would refuse every report written before this packet landed,
      i.e. all of them, which is how a correctness improvement becomes an outage.
    events:
      - type: filed
        ts: "2026-08-25T23:20:00Z"
        agent_id: lenovinha-opus5-metaorch-20260825t213705z
