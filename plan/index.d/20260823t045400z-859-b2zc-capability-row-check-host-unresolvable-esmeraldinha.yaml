packets:
  - order: 859-b2zc
    packet_id: capability-row-check-cannot-resolve-a-host-without-the-hostname-binary
    desired_release: v0.5
    title: "the self-serve capability gate answers unavailable:host-unresolvable in every Fedora image, so it has never asked the forge to publish a row"
    status: ready
    kind: bug
    pickup_role: any
    priority: p2
    capability_tags: [capabilities, fleet, forge, wsl2, probe, identity]
    deliverable: scripts/check-capability-row.sh
    depends_on: []
    estimated_hours: 1
    context: >
      scripts/check-capability-row.sh resolves the host with

        host="$(hostname -s 2>/dev/null || hostname 2>/dev/null || echo '')"

      and refuses with `unavailable:host-unresolvable` (exit 2) when that is
      empty. The `hostname` BINARY IS NOT INSTALLED in the Fedora images this
      project runs on, so the check can never answer `ok:` or `due:` there —
      only `unavailable:`.

      Measured on esmeraldinha 2026-08-23, three loci:
        - WSL distro tillandsias-build (where ./build.sh --check re-execs, so
          the locus the gate runs in): `hostname: command not found`;
          uname -n = Esmeraldinha, /etc/hostname = Esmeraldinha. Verdict:
          unavailable:host-unresolvable.
        - WSL distro tillandsias (runtime): same, hostname absent.
        - localhost/tillandsias-forge:v0.4.260817.1, run directly under
          podman: hostname MISSING, uname -n = 9ec7fbc6ca20.

      WHY THIS IS WORTH A PACKET RATHER THAN A ONE-LINE FIX IN PASSING. The
      capability matrix reports "5 of 7 known hosts reporting — SILENT: forge,
      tlatoanis-macbook-air" as of this cycle. 850-bif2's whole design is that
      this check makes the question falsifiable so the Start-Of-Day gate acts
      on it: "a joining host's first cycle answers `due:` and publishes, every
      later cycle answers `ok:` for free". Inside the forge that gate has
      never been able to fire — it has always answered `unavailable:`, which
      is the one verdict that asks nobody to do anything. So one of the two
      remaining silent hosts is silent for a mechanical reason, not because
      nobody got to it.

      IT IS ALSO A KNOWN BUG, REINTRODUCED. scripts/agent-identity.sh already
      carries the correct chain as a sourceable function,
      `tillandsias_node_name()` — hostname -s, then hostname, then uname -n,
      then /etc/hostname, then strip domain and lowercase — added under order
      743-mgf3, whose own comment says in as many words that "some
      environments ship no `hostname`". check-capability-row.sh (order
      850-bif2, newer) re-derived the chain inline and dropped exactly the two
      fallbacks that work in a container image. This is the 704-zcgi shape
      applied to a different probe: an instance re-implementing a shared
      helper and losing the lesson the shared helper exists to hold. The fix
      is to source the helper, not to widen the inline chain — widening it
      leaves a fourth copy to drift.

      SECOND-ORDER POINT, so whoever takes this does not declare victory
      early: sourcing the helper makes the forge answer `due:` instead of
      `unavailable:`, but `uname -n` inside a container returns the ephemeral
      container id (9ec7fbc6ca20 above), not a stable fleet host id. A forge
      that publishes a row keyed on that would add a new matrix row per
      container rather than filling the `forge` slot. The forge needs
      TILLANDSIAS_WORKSTATION (or whatever agent-identity.sh already uses to
      produce a stable forge identity) set in its environment for the row to
      be worth publishing. Fixing the chain without fixing the identity turns
      a silent host into a noisy one.
    exit_criteria: >
      (1) check-capability-row.sh sources scripts/agent-identity.sh and uses
      tillandsias_node_name() rather than an inline chain; no fourth copy of
      the chain remains in the tree.
      (2) Run inside localhost/tillandsias-forge and in a Fedora WSL distro,
      the script answers `ok:` or `due:` — never `unavailable:host-unresolvable`.
      (3) The forge's published host identity is STABLE across container
      restarts, or the check declines to publish and says why; a matrix that
      grows a row per forge container is a regression, not progress.
      (4) A hermetic fixture with `hostname` removed from PATH pins the
      behaviour, so the fallbacks cannot be dropped a third time.

