    title: "The pre-push plan-only lane refuses the Finalization attestation-ledger commit — plan/mo-full-attestations.d/<host>.md arrives as a modification, forcing a ~2.5-min full-gate re-run for a 3-line bookkeeping commit, twice in one night"
    deliverable: "the plan-only lane admits append-only extensions of per-host attestation ledgers under a build-free verifiable closure (append-only byte-prefix property + MO-FULL grammar on added lines + check-mo-full-attestations.sh), fail-closed for everything else, pinned by litmus scenarios"
    pickup_role: any
    capability_tags: [git-hooks, gate, meta-orchestration, overhead]
    estimated_hours: 2
    context: |
      Verified against scripts/hooks/pre-push-local-gate.sh before filing
      (operator instruction): the lane's qualification required EVERY outgoing
      path to be status 'A' AND under plan/index.d/ or plan/loop_status.d/ —
      an append to the existing per-host attestation ledger is status 'M' and
      outside both dirs, so it was refused on two independent grounds. The
      Finalization sequence (SKILL step 9) runs ./build.sh --check BEFORE the
      mo-full-attest record commit, so the bookkeeping push always found a
      stale stamp, fell out of the lane, and paid the full gate again. It bit
      twice during the 2026-08-15/16 smoke finalization on windows.
    outcome: |
      The bookkeeping commit rides the fast lane under a closure as strong as
      the full gate provides for it: the pushed blob must byte-exactly extend
      the remote blob, every added line must be blank, a '## <ISO-UTC> <host>'
      heading, or a well-formed MO-FULL marker with LOCAL_SHA == REMOTE_SHA,
      and check-mo-full-attestations.sh must accept the whole ledger
      (grammar everywhere + own-host commit reachability). Rewrites,
      truncations, README.md edits, and nested paths still fall to the full
      gate; fragment-only behavior is unchanged.
