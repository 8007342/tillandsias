    title: "test-check-credential-channel.sh can no longer rewrite the real checkout: every scratch git call is refused if its path is empty or resolves to the real repo, and INT/TERM exit"
    context: |
      On calmecacpilli 2026-11-22, AFTER 2224-gdir (#1338, the inherited-GIT_DIR fix) landed, a plain
      `TILLANDSIAS_SKIP_TOOLBOX=1 ./build.sh --preflight` left this checkout's origin as
      /tmp/pf-guard.*/cred-channel-test.*/does-not-exist.git, and the next push failed. The preflight door had
      deadline-killed test-keyring-fixtures-use-a-private-bus (step 350), which drives this fixture, in that run.
      The fixture's `trap 'rm -rf "$W"' EXIT INT TERM` RESUMES after a TERM, and any `D="$(...)"` left empty makes
      `git -C "$D" remote set-url origin ...` run in the cwd: the real checkout. The exact kill timing did not
      reproduce by hand (16 tries, parent and process-group TERM), so the fix closes the class instead of the one race.
      Fix: (1) INT/TERM traps exit (130/143); (2) every `git -C "$D"`/`"$d"` goes through scratch_git, which refuses an
      empty path or one whose git dir is the real checkout's; (3) every `D="$(...)"` is followed by D_ok (non-empty,
      exists). A new arm proves the guard bites (empty and real-checkout targets refused, origin unchanged).
      Follow-up sweep, not done here: 20 other scripts/test-*.sh trap `... INT TERM` without exiting AND call
      `git -C "$var"`; the same two-line hardening applies to each.
