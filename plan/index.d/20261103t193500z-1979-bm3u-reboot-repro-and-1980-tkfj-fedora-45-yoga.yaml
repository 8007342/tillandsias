events:
  - packet_id: a-ca-key-that-no-longer-matches-its-certificate-is-reissued-not-served-to-the-proxy
    event:
      type: measurement
      ts: '2026-11-03T19:35:00Z'
      host: yoga
      summary: |-
        CRITERION 2 CAUSE, REPRODUCED by a reboot on yoga (operator system upgrade to Fedora 45, kernel 7.2.15-300.fc45). Before the reboot, #894's build had recreated the CA at 09:01 -0800, a matched pair (public keys equal). After the reboot the tmpfs /run/user/1000/tillandsias/keys was empty, and the installed v56.11.3.1 tray refilled intermediate.key from the keyring at 11:27 under that 09:01 certificate. squid then logged "FATAL: No valid signing certificate configured" again. So the keyring refill (ca_key_store::materialize, keyring=true) returns a key that is not the published certificate's, even after a mint whose seal() wrote the keyring copy. The refill path, or what seal writes, is the defect; #894 only recovers from it.
        RECOVERY on the same state: trunk 7993f2e62 (with #894) as the tray printed "[tillandsias] CA key and certificate were not a pair; wiped the CA state and recreating it from scratch", and tillandsias-proxy came up healthy with no manual step.
        LEFT for criterion 2: read Store::materialize and Store::seal for why a refill does not return the key sealed with the current certificate (the 08:37 rewrite this morning is the same path).
