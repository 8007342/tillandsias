packets:

  - packet_id: parallel-tests-race-on-global-home-and-shared-fixture
    order: 638-ehzi
    status: completed
    desired_release: v0.5
    priority: p1
    title: "The intermittent gate failure was two parallel tests racing on $HOME and one temp dir"
    kind: bug
    deliverable: crates/tillandsias-core/src/image_builder.rs
    depends_on: []
    pickup_role: linux
    capability_tags: [rust, testing, flake, ci]
    context: >
      Root cause of the intermittent `--ci-full` failure this host dismissed TWICE as
      unexplained (cycles 3 and 4, 2026-08-09).

      CORRECTION TO 637-df4z, which was filed on a false premise. That packet claimed the
      failing check names were unrecoverable. They were not:

        * scripts/local-ci.sh already prints a "Failed checks:" block naming each one.
          This host lost them by piping the run through `tail -6` and a grep filter — self
          inflicted, not a tooling gap.
        * target/convergence/check-logs.jsonl already retains a per-run verdict for every
          check, going back to 2026-08-01. The evidence was on disk the entire time.

      Reading that file named the culprits immediately: `rust-tests` and `tray-contract`,
      both cargo runs — never litmus, which is where two cycles of attention went.

      THE RACE. `chromium_framework_keeps_squash_options_and_the_real_core_image_argument`
      and `build_routing_uses_type_specific_containerfiles` both:
        1. call `temp_image_root()`, which keys its directory on `process::id()` — the SAME
           path for both — and then `remove_dir_all`s it, and
        2. `unsafe { std::env::set_var("HOME", &root) }`, a PROCESS-wide mutation.
      Cargo runs a binary's tests concurrently, so either test could wipe the other's
      fixture mid-run or observe the other's HOME. Two shared resources, one race.

      Reproduced ~1 run in 4 across the full workspace and NEVER when the crate ran alone —
      the signature of a cross-test race rather than a bad assertion.
    outcome: >
      Serialized both tests behind a module-level `ENV_AND_FIXTURE_LOCK`. The guard takes
      the lock poison-tolerantly: a panicking test poisons the mutex, and propagating that
      would turn one real failure into a cascade of misleading secondary failures that hide
      the actual defect.

      Verified 8 consecutive full-workspace runs with 0 failures, against a prior rate of
      roughly 1 in 4.

      A lock is the minimal correct fix, not the best one — these tests should not touch
      process-global state at all. 638-ehzi-followup covers the other ten
      `set_var("HOME")` sites in the workspace, every one of which is the same latent race
      waiting for its neighbour to be scheduled differently.
    verifiable_closure: >
      `cargo test --workspace --lib` passes repeatedly; the two named tests hold a shared
      lock for the duration of their global-state mutation.
    notes: >
      The lesson generalises past this bug: an intermittent failure was treated as noise
      twice because the first look was at the wrong artifact. check-logs.jsonl is the
      per-run record, and it should be the FIRST thing consulted on any gate failure — not
      the terminal scrollback, which the next run destroys.
    events:
      - ts: "2026-08-09T21:25:00Z"
        event: completed
        summary: >
          Diagnosed from check-logs.jsonl (which had the answer all along), reproduced,
          fixed with a serialization guard, verified 0/8 against a prior ~1-in-4 rate.

  - packet_id: tests-should-not-mutate-process-global-home
    order: 639-d2bc
    status: ready
    desired_release: v0.6
    priority: p2
    title: "Ten more tests mutate $HOME process-wide; each is a latent parallel race"
    kind: enhancement
    deliverable: crates/
    depends_on: [parallel-tests-race-on-global-home-and-shared-fixture]
    pickup_role: any
    capability_tags: [rust, testing, flake, technical-debt]
    context: >
      `grep -rn 'set_var("HOME"' --include=*.rs crates/` returns 12 sites. Two were fixed
      by 638-ehzi; the other ten are unguarded. Each is latent rather than benign: it
      becomes a real flake as soon as a sibling test in the same binary happens to touch
      HOME or the same fixture path, which is a scheduling accident, not a design decision.
    exit_criteria:
      - >
        Each remaining site either injects the home path instead of mutating the
        environment, or takes a shared lock. Injection is preferred — a lock serializes the
        symptom, dependency injection removes the shared resource.
      - >
        Fixture directories keyed on `process::id()` are audited in the same pass: that key
        is shared by every test in the binary, so it is a collision by construction, not a
        uniqueness guarantee.
    notes: >
      Do NOT paper over this with `--test-threads=1`. That hides every race in the suite
      and slows the gate, converting an observable defect into an invisible one — the same
      failure direction as 627-cx24, 635-i6vm, and this packet's own root cause.

