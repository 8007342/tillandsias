      summary: |-
        FIX LANDED FOR THE ABORT ITSELF, deliberately INDEPENDENT of my unproven race hypothesis. The bare 'systemctl start tillandsias-headless-fetch.service tillandsias-headless.service' at line 373 is now guarded: on non-zero it asks 'systemctl is-active --quiet tillandsias-headless.service'. ACTIVE means the start was redundant — log it and continue, so the readiness start on the next line runs and the guest can report Ready. NOT ACTIVE means a real failure — print systemctl status for both units and fail, because on a first provision this start is what brings them up and a genuine failure must stay fatal. The point is to DISTINGUISH the two cases the silent abort treated alike, not to swallow the status. SABOTAGE, both halves: reverting to a bare start -> RED 'the start must be guarded, not bare'; degrading the fatal branch to true -> RED 'a genuine start failure must remain fatal'. That second arm exists because the obvious wrong fix here is '|| true', which is the same defect with the opposite sign — it would ship a real provisioning failure silently. CORRECTION TO THE ROUTING I WAS GIVEN: the ask was to 'name the unmet dependency of the fetch and headless units on first boot'. THERE IS NO UNMET DEPENDENCY. On the failing boot the journal shows both units reaching active seconds BEFORE the start that returned 1, with headless-preflight reporting headless_binary=ok, vsock_device=present, podman_socket=present, podman_socket_unit=active. The units were healthy; the start was redundant and returned non-zero anyway. A DESIGN NOTE WORTH CARRYING, because it contrasts with my own mistake earlier on this packet: this guard asserts on provision_user_data("off") — the RENDERED SCRIPT — not on include_str!("vz.rs"). That is why it cannot self-match. My instance-id guard read the source file and matched its own assertion literal, and needed assembled needles to fix. Asserting on the artifact the code PRODUCES rather than on the source text that produces it removes the whole class, and is cheaper than concatenating needles. Forced gate on a quiet machine: ok:test-baseline:ran=2302 new-red=0 tolerated=0 stale=0, exit 0. STILL OPEN and unchanged: why systemctl start returns 1 against active units. The enriched trap records systemctl --failed and systemctl status at the moment of failure, so the next occurrence answers it; this fix stops that occurrence from costing the operator a boot.
