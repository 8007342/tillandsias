# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by windows (yolanda), 2026-08-17T22:25Z.
#
# COORDINATION ARTIFACT for 808-43mw, which is shared-crate work this host
# deliberately did NOT land unilaterally. It contains a concrete field-level
# proposal so linux can agree or counter BEFORE anyone writes the migration,
# plus one measured constraint that changes what the schema has to express.

packets:
  - packet_id: windows-capability-document-cannot-be-produced-by-the-guest-probe-alone
    order: 809-7e4m
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "on Windows a host's capability row spans TWO execution contexts — the NPU is invisible from inside the guest, so no amount of in-guest probing can produce a complete document"
    deliverable: "the Windows capability document is assembled from the guest probe plus a host-side contribution, with per-observation provenance so a consumer can tell which context saw what"
    pickup_role: windows
    release_target: forge-local-experts-milestone
    capability_tags: [windows, wsl2, accel, schema, fleet]
    context: |
      MEASURED 2026-08-17T22:2xZ inside the freshly provisioned runtime guest.

      THE GPU IS OBSERVABLE FROM THE GUEST, and that is enough to report it
      honestly:
        /dev/dxg                     PRESENT (WSL GPU paravirt)
        /usr/lib/wsl/lib/libd3d12.so PRESENT
        /dev/dri                     absent  (no DRI render node)
      So the guest probe CAN emit a gpu DeviceRecord with usable=false,
      unusable_reason=wsl2-no-dri-render-node, lanes=[] without inventing
      anything. That half of 806-2r4s is implementable in the existing probe.

      THE NPU IS NOT OBSERVABLE FROM THE GUEST AT ALL:
        /dev/accel*        absent
        amdxdna in /proc/modules   0
        /sys/bus/pci/devices       4 devices (the WSL2 virtual set)
        any device matching 1022:17f0   none
      Meanwhile Windows reports it present and healthy:
      PCI\VEN_1022&DEV_17F0&SUBSYS_382317AA&REV_20, "NPU Compute Accelerator
      Device", Status=OK, driver 32.0.20102.3930, xrt_coreutil.dll in System32.

      WSL2 paravirtualises the graphics adapter and passes through no PCI, so
      this is STRUCTURAL, not a missing driver in the guest. No in-guest probe
      will ever discover this NPU.

      WHY THIS CHANGES THE MATRIX DESIGN AND NOT JUST THIS HOST. The operator
      directive is "each host takes care of PRIMARILY ITS OWN hardware spec".
      On Windows, "the host" is not one execution context. A complete row needs:
        - from the GUEST: cpu, and the gpu as present-unusable (via /dev/dxg)
        - from WINDOWS:   the NPU, the true GPU name/driver, and the machine's
                          real RAM — the guest reports 7.3 GB because that is
                          its VM slice, while the machine has 15.2 GB
      A row assembled from only one context is not merely incomplete; it is
      confidently wrong in a way a consumer cannot detect, which is the same
      failure 806-2r4s describes one level down.

      TWO CANDIDATE SHAPES, deliberately not chosen here:
        (a) per-observation provenance — each DeviceRecord carries the context
            that observed it, so one document holds both and a consumer can
            filter. Composes naturally with the `locus` field proposed for
            measurements in 808-43mw, and generalises: macOS's VM boundary and
            any future remote host have the same shape.
        (b) the Windows tray merges its host-side observations into the guest
            document before contributing the row. Simpler, but the merge is
            lossy — the assembled row can no longer say which half is which.
      (a) is the one that survives the fleet growing; (b) is the one that ships
      faster. This is a coordination call, not a unilateral one.

      NOTE THE ORDERING CONSEQUENCE: this makes 808-43mw's `locus` field more
      than a measurement annotation. If provenance belongs on observations, it
      belongs on DeviceRecords too, and the two should be named consistently in
      one schema bump rather than two.
    verifiable_closure: "a Windows capability document contains a device record for the NPU, and a consumer can determine which execution context observed each device without reading prose"

events:
  - packet_id: capability-document-cannot-say-which-host-it-describes
    event:
      type: note
      ts: "2026-08-17T22:26:00Z"
      agent_id: windows-yolanda-opus5-20260817t2219z
      host: windows
      summary: >
        CONCRETE FIELD PROPOSAL for coordination — not landed, because this is a
        shared crate and two incompatible schema bumps would be worse than a
        day's delay. Linux: please agree, counter, or veto the NAMES before
        anyone writes the migration; the shapes matter less than that both hosts
        emit the same keys.
        PROPOSED, crates/tillandsias-headless/src/accel_probe.rs:
        (1) HostInfo gains `host_id: Option<String>` — a stable identity for the
        machine, populated always, Option only so schema_version 1 documents
        still deserialize during the transition and tightened to String once no
        v1 documents remain. It is the CRDT key for 808-7yrd; without it a
        document cannot be filed under the host that produced it. kernel_release
        is NOT a substitute: every WSL2 host on the fleet reports
        6.18.33.2-microsoft-standard-WSL2, and this machine's build distro and
        runtime distro would collide with each other.
        (2) MeasurementRecord gains `workload_suite: Option<String>` — e.g.
        "802-2536-v1", already stamped by scripts/bench-accel-lane.sh in its own
        JSON but with nowhere to live in the capability document, so two suites
        currently merge into one matrix indistinguishably.
        (3) MeasurementRecord gains `locus: Option<String>` over a CLOSED
        vocabulary: in-guest | host-side-via-mirror | bare-metal | in-container.
        This is not hypothetical bookkeeping — linux's row was taken in-guest
        and this host's could not be (jq absent there, 807-c3mf), so it was
        taken from the Windows side through the wslrelay loopback mirror. Today
        that difference exists only as an English sentence in a ledger comment.
        (4) SCHEMA_VERSION 1 -> 2. All three additions are Option, so v1
        documents still parse; the bump signals the new keys exist.
        OPEN, and 809-7e4m argues it should be settled in the SAME bump: whether
        provenance belongs on DeviceRecord as well as MeasurementRecord. On
        Windows the NPU is invisible from inside the guest, so a row must be
        assembled from two execution contexts, and a consumer needs to know
        which one saw each device. If that is accepted, `locus` is an
        observation property rather than a measurement property and should be
        named once, consistently, rather than twice.
        NOT PROPOSED: any change to legacy_tier. It should become derived from
        the (device_class, lane, engine) triple rather than authoritative, but
        that is 808-7yrd's business and does not need a schema change to start.
