      summary: >
        THE AUDIT, MEASURED. And the headline is not what I expected when I filed this: almost nothing in the tree has a post-governance approval to drift FROM.  THE USER-VISIBLE SURFACE IS ONE PLACE, which makes this tractable: locales/*.toml, not strings scattered through the code. scripts/check-terminology.sh (629-t6bx) already established that and I did not know it when filing. en.toml carries 168 keys; the other 16 locales carry 143, so 25 keys are untranslated — a real finding but somebody else's packet.  THE TWO GATES ARE COMPLEMENTARY, NOT OVERLAPPING, and this is the authority-vs-consistency distinction one level up:   check-terminology.sh      — are the WORDS correct?   (vocabulary, against a dictionary)   check-approved-ux-strings — is this the STRING the operator approved? (authority, against the ledger) Neither subsumes the other. I nearly duplicated the first before reading it.  INVENTORY:   168 user-visible strings in locales/en.toml     1 carries a POST-GOVERNANCE (post-2026-07-22) operator approval — the 626-w3fn bring-up line, now gated   167 carry NONE  That 167 is not a scandal and I want to be precise rather than alarming: the UX curation rule was codified 2026-07-21 (01696cd54). Strings that shipped before it were never approved under it, and demanding ledger backing for them now would be inventing an approval nobody gave. THE GATE THEREFORE COVERS WHAT IS GENUINELY APPROVED AND GROWS A ROW AT A TIME. A check that went red on 167 strings on its first run would be switched off by the next person, which is how a governance gate becomes decoration.  SPEC↔CODE DRIFT ON FIVE APPROVED-LOOKING SURFACES, and the dates make it a different story than it first appears:    spec:tray-ux says            locales/en.toml ships   ─────────────────────────────────────────────────────────   🌹 Unhealthy environment     🥀 Unhealthy environment      (rose -> wilted)   🔧 Maintenance               ⛏️ Maintenance                 (wrench -> pick)   ✅ Environment OK            ✅ Environment ready           (wording)   <Key> GitHub login           🔑 GitHub Login                (capital L)   ☐ Verifying environment ...  Verifying environment …        (glyph dropped, ... -> …)  NOBODY VIOLATED ANYTHING. The shipped strings changed in ef212f2b0 on 2026-04-25 — THREE MONTHS BEFORE the governance rule. The spec's string list was last touched 2026-07-21, the day the rule was codified. So the spec was written down already describing a rendering that had been superseded since April: THE GOVERNANCE DOCUMENT ENSHRINED STALE STRINGS AS ITS APPROVAL RECORD.  That is why I did NOT build a spec↔code enforcement gate, and the restraint is deliberate. Enforcing the spec would break working UX to satisfy a stale document; enforcing the code would rubber-stamp whatever happens to ship. Which side is right is an OPERATOR question, not mine — exactly the boundary this packet's own notes warn about ("auditing and pinning are ungated engineering; changing any string is not"). It is filed as a finding for adjudication.  ALSO WORTH THE OPERATOR'S TIME: the spec is internally inconsistent about its own string, giving `Verifying environment ...` at line 63 and `Verifying environment...` at 59 and 70. A document that cannot agree with itself about a string cannot arbitrate a drift in it.  A NAIVE MATCH WOULD HAVE REPORTED 13 FALSE VIOLATIONS. Of 14 literal strings the spec pins, exactly ONE appears verbatim in en.toml — because the spec writes COMPOSED renderings (status glyph + icon + text, `<Cloud> Remote Projects >`) while the locale stores bare text the code assembles. Anyone building the spec↔code gate later needs that: the spec's renderings are illustrative composites, not storable values.
