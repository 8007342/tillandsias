packets:
  - packet_id: arm64-native-build-for-fedora-on-raspberry-pi-5
    order: 593-9y5r
    desired_release: v0.6
    title: "arm64 Linux native build that runs on the Fedora cloud image on a Raspberry Pi 5 — the 24/7 affinity node"
    status: ready
    kind: implementation
    deliverable: aarch64 release artifact + multi-arch images + a Pi 5 bring-up record
    depends_on: []
    pickup_role: linux
    capability_tags: [arm64, raspberry-pi, fedora, containers, release, mesh, headless]
    estimated_hours: 10
    outcome: >
      OPERATOR DIRECTION 2026-08-02: an arm64 Linux native binary running on the
      Fedora cloud image on a Raspberry Pi 5, to serve as the 24/7 AFFINITY
      BUILD — so a "publish to www.mydomain.com" prompt launches the wired web
      container on THAT Tillandsias rather than on a laptop that closes at night.
      This is the vision doc's headline node made real: "a non-technical user
      logs a Tillandsias into an old computer, plugs it next to a router, and
      walks away" (plan/issues/operator-vision-ai-cloud-region-2026-07-31.md).
      HALF OF THIS ALREADY EXISTS, verified in-repo. scripts/build-guest-binaries.sh
      already produces tillandsias-headless-aarch64-unknown-linux-musl — a
      STATICALLY LINKED aarch64 ELF, built via Nix
      (.#tillandsias-headless-aarch64-musl) with a cargo cross-compile fallback,
      and already checked for arch and static linkage at :58. A static musl
      binary is exactly the right shape for a Fedora cloud image: no glibc
      coupling, no runtime deps.
      ONE REAL CAVEAT ON THAT BINARY: it is built --features listen-vsock,
      because its current consumer is the guest VM inside the macOS/Windows
      hosts, where it binds a vsock control wire. A Pi is a FIRST-CLASS HOST, not
      a guest — it needs the normal host feature set, not the vsock listener. The
      comment at build-guest-binaries.sh:161-164 warns that mismatched features
      produce "a guest that boots but never binds the control wire" (order 282);
      the inverse mistake is equally available here. Decide the Pi's feature set
      deliberately rather than reusing the guest profile because it is already
      wired.
      THE ACTUAL WORK IS THE IMAGES, NOT THE BINARY. Verified: no Containerfile
      or build script does ANY architecture handling — images are built for the
      host arch, full stop (scripts/build-image.sh has no platform/arch logic).
      A Pi needs arm64 images for proxy, router, git, vault, inference, web and
      forge. The base images are mainstream (fedora-minimal:44, alpine:3.20,
      hashicorp/vault:1.18, caddy:2-alpine) and very likely publish arm64, but
      THAT IS UNVERIFIED — a manifest check could not run here because the local
      proxy was down. Verify each base image's arm64 availability FIRST; if any
      lacks it, that single image decides the whole approach.
      SIZE THE INFERENCE LANE HONESTLY. A Pi 5 has no usable LLM accelerator, so
      the accel envelope will report accel_class=cpu-only — which the work landed
      2026-08-01 already handles truthfully rather than pretending. Decide
      whether the inference container ships on this host class at all; a 4-16 GB
      Pi running a model while also serving web containers is a different
      machine from this workstation, and "it technically starts" is not the bar.
      SCOPE HONESTY, because the operator asked for something "small with near no
      dependencies": the BINARY is small and independent. The IMAGES are moderate
      and independent. The AFFINITY ROUTING — "launch the web container on the
      24/7 node instead" — is NOT dependency-free: it needs node discovery and a
      measured uptime-affinity property, which is packet
      node-discovery-and-uptime-affinity, and cross-node authorization from
      mesh-identity-plane-research. Ship the Pi as a working host first; route to
      it second.
      CANNOT BE VERIFIED UNTIL THE HARDWARE EXISTS (operator is building the
      infra). Everything above is a plan against the repo as it stands; the Pi 5
      bring-up record is the deliverable that closes it.
    exit_criteria:
      - "a Fedora aarch64 cloud image on a Pi 5 runs the tillandsias binary and brings up the enclave, recorded as a bring-up log with versions"
      - "every base image is confirmed to publish arm64 BEFORE image work starts; any that does not is called out with its replacement or a stated blocker"
      - "the Pi build's feature set is chosen deliberately and differs from the guest-VM vsock profile where appropriate, with the reason recorded"
      - "the inference lane's presence on this host class is an explicit decision, not a default"
      - "affinity ROUTING is out of scope here and remains with node-discovery-and-uptime-affinity"

  - packet_id: multi-arch-container-image-builds
    order: 593-vnhm
    desired_release: v0.6
    title: "Container images are built host-arch only — nothing supports building or publishing arm64"
    status: ready
    kind: implementation
    deliverable: arch-aware image build + published multi-arch manifests + litmus
    depends_on: []
    pickup_role: linux
    capability_tags: [containers, arm64, build, release, cross-platform]
    estimated_hours: 8
    outcome: >
      VERIFIED 2026-08-02: neither scripts/build-image.sh nor any Containerfile
      carries platform or architecture handling. Every image is built for
      whatever the building host happens to be, which on every current host is
      x86_64. That is invisible today because all hosts share an arch, and it
      becomes a hard blocker the moment an arm64 host exists — which is exactly
      what arm64-native-build-for-fedora-on-raspberry-pi-5 needs.
      Establish first, because it decides the approach: does every base image we
      depend on publish arm64? fedora-minimal:44, alpine:3.20,
      hashicorp/vault:1.18, caddy:2-alpine. They are mainstream and probably do,
      but a manifest check could not be completed here (local proxy down), so
      this is UNVERIFIED and must not be assumed. One missing arm64 base would
      redirect the whole design.
      Then choose between building natively on each arch and cross-building with
      emulation (podman --platform + qemu-user-static). Emulated builds are slow
      and can fail in surprising ways for compiled steps; a native builder per
      arch is faster and more honest but needs a machine. Note the Pi itself
      could be its own builder, which is slow but removes emulation entirely.
      Whatever is chosen, the image TAGS must stop implying an arch they do not
      carry: today a tag like tillandsias-proxy:v0.4.260802.1 silently means
      x86_64, and pulling it on a Pi would fail or, worse, appear to work under
      emulation.
    exit_criteria:
      - "every base image's arm64 availability is confirmed and recorded before any build work"
      - "images build for a named target architecture rather than implicitly for the builder's"
      - "an image tag cannot be mistaken for multi-arch when it is not — either publish manifests or make the arch explicit in the tag"
      - "a litmus fails if a new Containerfile or build path reintroduces implicit host-arch assumptions"
