    order: 689-stig
    status: completed
    desired_release: v0.5
    priority: p1
    title: "663-69kp ROOT CAUSE FOUND: --exec-guest blocks forever in read_to_end(stdin) before the VM is created — it was never a VZ storage lock"
    kind: bug
    deliverable: bounded, observable stdin forwarding + behavioral regression pin
    depends_on: []
    pickup_role: macos
    capability_tags: [macos, vz, boot, fail-loud, stdin, exec-wire]
    estimated_hours: 2
    context: >
      663-69kp recorded the symptom precisely — "hangs before printing even
      '[exec-guest] starting VM…' (nothing reaches stderr)", 7-45+ minutes until
      externally killed — and hypothesized "VZ storage/disk-lock acquisition
      inside vz.start(), or the singleton/socket acquisition before the first
      eprintln". That hypothesis is WRONG, and the packet's own "a 20-40s settle
      after the kill usually (not always) avoids it" was a coincidence of how
      the next command's stdin happened to be wired.
      ROOT CAUSE: crates/tillandsias-macos-tray/src/diagnose.rs (pre-fix
      lines 516-528) read piped stdin as
      `if !stdin().is_terminal() { read_to_end(&mut buf) }`. The guard treats
      "not a TTY" as "a pipe that will EOF". That is true for
      `printf … | tray --exec-guest`, and FALSE for any stdin inherited from a
      parent that keeps the write end open — an agent harness, a launchd job, a
      background shell. There `read_to_end` blocks forever, on the main thread,
      BEFORE the first eprintln! and BEFORE VzRuntime ever creates the VM.
      LIVE PROOF 2026-08-11 (two invocations differing ONLY in stdin):
      with inherited stdin — 12+ minutes, ZERO bytes of output, no
      com.apple.Virtualization.VirtualMachine process in `ps` at any point,
      host-side `sample` showing a single main thread parked in `read` (not
      kevent, not a lock);
      with `</dev/null` — full cycle in 9 SECONDS: stage guest binary, boot,
      phase Ready, guest command executed over the control wire, clean stop,
      exit 0. Samples and both logs under the session's 663-evidence dir.
      COROLLARY, worth more than the fix: the VM boots in seconds. Every
      "macOS boot is slow" reading in the ledger that rests on a wedged
      one-shot is measuring this bug, not the VM. See 689-eux9 for the sizing
      baseline this displaces.
      This is also why 663-acdw's prescribed next diagnostic ("the bounded
      direct guest run") could never be completed: the diagnostic itself was
      run from an agent harness and hit this on the way in.
    outcome: >
      --exec-guest never blocks unboundedly on stdin, and when it does give up
      on stdin it says so on stderr instead of silently continuing.
    exit_criteria:
      - "piped stdin is read with a bounded wait; exceeding it proceeds to boot rather than blocking the process"
      - "giving up on stdin is announced on stderr, naming both the likely causes and the explicit </dev/null remedy"
      - "a behavioral regression test holds a stdin pipe open and asserts the one-shot progresses AND emits the warning; a negative control asserts a promptly-closed stdin still forwards and does NOT warn"
