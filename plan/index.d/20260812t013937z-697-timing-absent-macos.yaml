    title: "build.sh --check emits no timing record, so the cycle's slowest step is unmeasured on every host and `timing:` reads source=absent forever"
    kind: bug
    deliverable: one duration record per heavy step, and a non-absent timing: line naming a real slowest step
    depends_on: []
    pickup_role: any
    capability_tags: [telemetry, cycle-time, build, instrumentation]
    estimated_hours: 3
    context: >
      Observed on macOS 2026-08-12 after `./build.sh --check` ran FIVE times to
      completion in one session: `/tmp/tillandsias-timing.jsonl` never existed
      and `cycle-metrics.sh` reported `timing: steps=0 ... source=absent` every
      cycle.
      This is the metric the meta-orchestration skill introduces with "where
      does the cycle's wall-clock go?" and calls building/testing "the most
      likely bottleneck"; `slowest` is meant to name the one step to attack
      first. While it reads absent, the most expensive part of every cycle on
      every host is unmeasured and 682-emvg's deliverable is not in effect where
      it matters most. This session paid the gate five times (695-nvnd covers
      one avoidable cause) with no record of the cost.
      THE WIRING LOOKS CORRECT, which is why this is filed as research rather
      than a one-line fix: build.sh:66 sources scripts/timing-log.sh (with
      no-op stubs at :67 if that fails), :988 captures the start, :989 traps
      EXIT, :1047 emits; local-ci.sh:429 emits per phase; timing-log.sh:40-58
      shells out to cycle-metrics.sh --emit-timing.
      TWO HYPOTHESES ARE ALREADY REFUTED — do not re-chase them.
      (1) "the emitter is broken": no, called directly it works and creates the
      log (probe record removed afterwards so it cannot pollute a real average).
      (2) "bash 3.2 cannot parse timing-log.sh so macOS silently gets the no-op
      stubs": this was the leading theory, since the host IS bash 3.2 and
      build.sh:66 swallows source failures with `2>/dev/null || true` — a
      textbook silent degradation. It is WRONG: `/bin/bash -n` parses clean and
      a 3.2 source defines the real function, not the stub.
      Next probe: a single trace at the timing_emit call site during one gate
      run distinguishes "never called" from "called, shell-out failed
      silently". Note timing_emit swallows every error by design (`|| true`,
      `2>/dev/null`, `return 0`) so it can never disturb the wrapped step's exit
      code — correct for safety, and exactly why this failed invisibly.
      Full write-up:
      plan/issues/research-build-check-emits-no-timing-record-2026-08-12.md
    outcome: >
      Every cycle can name its slowest step from measurement instead of
      intuition.
    exit_criteria:
      - "./build.sh --check appends exactly one build-check duration record per run, on macOS and Linux"
      - "cycle-metrics.sh reports a non-absent timing: line naming a real slowest step"
      - "a NEGATIVE CONTROL asserts a FAILING step still emits its record with a non-zero exit= — instrumentation that only records successes hides the slow path that matters most"
