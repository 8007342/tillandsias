          TWO CORRECTIONS TO THE FILING ITSELF, both mine.

          I first wrote this packet as TWO sites, because I reported the two
          the doc named and never counted the implementations. Yolanda found
          eight and diagnosed my error as sweeping only their branch's diff;
          that diagnosis is wrong — my sweep was tree-wide and correctly
          returned zero TESTS. I did not miscount the sites, I never counted
          them. Re-counting tree-wide gives TEN, the two beyond yolanda's
          eight being the guard-arm form (vsock_exec.rs:1251,
          router-sidecar/main.rs:150) that a `!=` search does not match.

          I looked at those two expecting a silent fall-through and said so.
          They have explicit mismatch arms and are the best sites in the
          tree. The hunch is recorded here because it was wrong and because
          the search that found them was shaped by it.
