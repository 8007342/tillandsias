      summary: >
        MY DIAGNOSIS ON THIS PACKET WAS WRONG, and the real cause was worth finding.  I filed it as "git's CRLF warning lands in the output the step asserts on". It does not. Every assertion in that step is a `grep -q` against the captured text, and an extra warning line cannot defeat a grep. I read the warning off the FAILURE DUMP — the else branch echoes "$out" — and mistook the noise for the cause without running the step. Filing a root cause from a failure message is the cheap move; running it took four minutes.  WHAT WAS ACTUALLY WRONG, found by executing the step by hand:    pre-push-local-gate.sh: line 176: .../scripts/hooks/../plan-binary-probe.sh:     No such file or directory   pre-push-local-gate.sh: line 177: resolve_plan_binary: command not found   plan-only lane: not applicable - neither yq nor target/release/tillandsias-plan     is available to validate fragments (fail closed; full gate required)  The fixture builds a throwaway repo and copies in the two scripts the hook needed WHEN THE FIXTURE WAS WRITTEN. Order 721-nyev then gave the hook a third dependency — it sources ../plan-binary-probe.sh — and the fixture was never updated. The hook degraded exactly as designed (fail closed) and the test read that as a lane defect.  It is not windows-specific either, which is the part I had backwards. On linux yq is present, the lane takes the yq path, and the missing probe never matters. Windows has no yq, so it falls to the plan-binary path and the missing file surfaces. The bug was cross-platform; only its VISIBILITY was windows-only.  FIXED, three parts, each verified by re-running the suite:   1. the fixture copies scripts/plan-binary-probe.sh alongside the other two (5 sites)   2. it resolves the binary in the REAL checkout with mf_plan_binary and hands it      to the hook through TILLANDSIAS_PLAN_BIN — the fixture repo has no target/,      and this test is about the LANE, not about binary discovery   3. it seeds plan/index.yaml (`packets: []`) so the folded-ledger check has a      base to fold onto  Side effect worth naming: because the override now resolves on both hosts, linux and windows exercise the SAME path through the lane instead of linux silently taking the yq branch and windows the other. Steps 2-5 went green.  THEN STEP 6 WENT RED, and that one is a real product defect, filed as 753-ed7i. The negative control — "an invalid-YAML fragment fails lane validation" — was accepting `packets: [unclosed`. The lane, with no yq, delegates its YAML parse to `tillandsias-plan check`; `check` warns "does not parse and was SKIPPED" and exits 0 with `ok:`. So the lane printed `validated <path>` for a fragment no parser accepts. The lane now reads that warning as the refusal check declines to make. Whether `check` itself should exit non-zero is 753-ed7i's question, because it has callers on three hosts.  litmus:plan-only-push-lane-shape is now 6/6 and methodology-accountability is 15/15 on windows, up from 12/15.
