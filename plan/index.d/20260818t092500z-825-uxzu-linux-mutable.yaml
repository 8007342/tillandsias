      summary: |
        THINGS I GOT WRONG WHILE DOING THIS, all caught by measuring instead of
        continuing.

        1. I read the IPAM error as an ORPHANED lease and was ready to file
           "stale netavark entry survives a reset". Checking which container
           held it showed 29eb69e8 is vault, alive and entitled to the address.
           The fault was a collision, not a leak, and the remedy is the
           opposite of what I would have written.

        2. My first edit inserted the volume line but left a BLANK LINE after
           `--env "GIT_TRACE=1" \`, which terminates a backslash continuation.
           podman then ran with no image and `--volume` executed as a shell
           command: "line 171: --volume: command not found". The script's own
           error output caught it immediately; a quieter failure mode would
           have had me debugging the mirror.

        3. I resolved CERTS_DIR by `find`ing intermediate.crt and taking its
           dirname; the find matched nothing, dirname returned ".", and podman
           refused with rc=125. The script defines CERTS_DIR=/tmp/tillandsias-ca
           outright. Reading the script beat inferring from the filesystem.

        STILL OPEN, deliberately not swept into this packet:
        * The "Image may be incomplete" remedy is still printed on any git
          readiness failure, and is still a cause nobody measured.
        * Two other service containers still run `--detach --rm`, so their
          startup failures remain unforensicable. I removed it only from the
          git block, where I needed the logs, because changing the lifecycle of
          containers I had not observed failing is a different change with a
          different blast radius.
        * Whether the FORGE step after inference works on a cold host is
          untested — the script tears the stack down immediately after
          spawning inference, by design, and I did not hold it up to look.
