      summary: >
        THE FIX IS BLOCKED ON AN ARCHITECTURAL DECISION, AND THE MEASUREMENT IS WHAT REVEALS IT. I am recording this instead of implementing, because implementing either candidate blind would decide the architecture by accident — the exact failure 924-eof7 was split out to prevent.  CANONICAL AND CLEAN-BINARY ARE MUTUALLY EXCLUSIVE ON A PTY. Both halves are now measured or established from the tree, not argued:   * CANONICAL mode is REQUIRED for stdin-EOF. On a PTY the reader sees EOF only when the MASTER closes (which ends the whole session) or when the line discipline interprets VEOF — and VEOF is interpreted only with ICANON set. That is why 925-eofi injects VEOF and why its raw-mode branch REFUSES to write anything: with ICANON clear the byte is data and signals nothing.   * CANONICAL mode is EXACTLY WHAT CORRUPTS THE DATA. The sweep above: six of nine bytes altered, killed or wedged, all by that same line discipline. So on a PTY you can have clean binary stdin OR stdin-EOF, never both. 925-eofi and 926-bin4 are not two independent bugs; they are the two horns of one structural choice, and any fix that takes one horn regresses the other.  WHY THE OBVIOUS FIX IS WRONG. "Set the exec PTY to raw" solves all six bytes and REGRESSES 925-eofi to the hang I verified fixed hours ago: in raw mode the guest's own refusal branch declines to write VEOF, correctly, and a piped `cat` blocks forever again.  WHY THE SURGICAL FIX IS ALSO WRONG, and this took a second look. "Toggle raw around each incoming write, then restore" does solve both — bytes written while ISIG/IXON/ICANON are clear are not interpreted, and canonical is restored in time for the VEOF. But it is only correct for DATA sessions. On an interactive ATTACH session the control bytes MUST be interpreted: a user pressing Ctrl-C is sending 0x03 and expects SIGINT, not a literal byte. Both session kinds run through this identical path, and PtyOpen carries no flag distinguishing them (rows, cols, argv, env, cwd — nothing else). So the toggle silently breaks Ctrl-C for interactive users while fixing exec.  THE DISTINCTION IS THE MISSING PIECE, not the mechanism. The host already knows which kind of session it is opening: exec goes through exec_over_stream_with_input*, attach through the PTY attach path. The guest does not, and cannot infer it. Whatever is chosen therefore needs the SESSION KIND on the wire — which under this fleet's own discipline (CAP_EXEC_ARGV_VECTOR, and the CAP_PROXY_CA_KEY_HEAL rule that a capability names the behaviour depended on) means a capability-gated addition, with an old guest that never learns the kind continuing to behave exactly as today.  RECOMMENDATION, with the trade named: give DATA sessions a PIPE for stdin rather than a PTY. A pipe has no line discipline (all six bytes arrive intact by construction) and closing the write end is a REAL EOF (925-eofi's VEOF injection becomes unnecessary on that path, though the frame stays for the PTY path and for older peers). It is the most invasive option — the PTY exists so attach and exec share one path — and it is the only one that removes the mutual exclusion rather than choosing a horn. Second choice: keep the PTY, add the capability-gated session kind, raw for data sessions, and accept that stdin-EOF on data sessions then needs the pipe anyway or a master-close semantic.  WHAT I DELIBERATELY DID NOT DO: pick one and build it. The measurement was the assigned first step and it changed the question from "how do we escape control bytes" to "should exec stdin be on a PTY at all" — which is a decision for the packet owner, not a side effect of my patch.
