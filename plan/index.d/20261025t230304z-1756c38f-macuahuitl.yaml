events:
  - packet_id: opencode-web-session-loses-its-lane-mcp-socket-when-the-launching-process-exits
    event:
      type: note
      ts: "2026-10-25T23:03:04Z"
      agent_id: forge-forge-tillandsias-opencode-20261025t230304z
      host: macuahuitl
      summary: |-
        ROOT-CAUSE CORRECTION from the launcher's own log, same session: this is a STARTUP-ORDER failure, not only a post-exit orphan. ~/.local/share/opencode/log/opencode.log line at container start (06:10:22.641Z) already records 'server unavailable key=host-browser type=local status=failed', and OpenCode does not retry a failed local MCP server for the rest of the session; the socket inode (created 06:10) still refuses connect() hours later. So an in-forge agent loses publish_local/browser.open for the WHOLE session if the lane listener is not accepting at the instant the agent's MCP client spawns, and a relaunch that keeps that ordering races again. Fix direction (in addition to adoption of a stale socket): bind/adopt the lane listener BEFORE spawning the agent's MCP client, and/or retry the local MCP server with backoff and say 'lane socket not accepting' by name. Existing packet opencode-forge-lane-missing-order-505-control-socket (920-c3af) carries the same measurement as a note; do not duplicate its exit criteria here.
