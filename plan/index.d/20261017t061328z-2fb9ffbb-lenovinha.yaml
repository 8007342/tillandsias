        - "AMENDED 2026-10-17 by OPERATOR RULING (asked directly; the tray menu is under their UX approval), superseding the coordinator's options A and B. A launch re-mints the enclave CA, and the Vault leaf it signs, whenever less than 60 days would remain, to a 365-day validity. Decided from notAfter (openssl -checkend), not file mtimes. A unit test over today's 30-day CA is red with the old 25-day mtime rule. This is the arm that must ship before 2026-10-29: installing the release restarts every tray, which re-mints."
