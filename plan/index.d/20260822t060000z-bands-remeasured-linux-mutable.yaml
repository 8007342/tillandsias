      summary: |
        I AM CORRECTING MY OWN RECOMMENDATION TO THIS PACKET. Two cycles ago I
        reported a 0.031 margin and recommended 0.70. THAT NUMBER WOULD HAVE
        BROKEN methodology_ask, and the reason is instructive.

        My in-corpus set was six SPEC questions. It contained no METHODOLOGY
        question — the corpus that was, at that moment, 94% unembedded because
        of 797-qv4z. So I measured the in-corpus floor on the half of the corpus
        that happened to be healthy, and reported a clean margin that the other
        half did not share.

        RE-MEASURED on the rebuilt index, same method, with methodology
        questions included:

          IN-CORPUS floor   0.6818   (methodology: "new row versus an event")
          NEAR-MISS ceiling 0.6889   (Helm rollback -> git-mirror cheatsheet)

        THE BANDS OVERLAP BY 0.007. There is no value that admits every
        in-corpus question and refuses every near-miss. At 0.70 — my earlier
        recommendation — the Helm near-miss is correctly refused AND a
        legitimate methodology question is refused with it. At 0.68 both are
        admitted.

        SO THIS HOST'S ANSWER TO THE PACKET'S QUESTION IS THE SECOND OPTION IT
        OFFERS: a single global cosine threshold is NOT SUFFICIENT. The packet
        asks for "a threshold value (or a decision that a single global cosine
        threshold is not sufficient)", and on macuahuitl the measurement chooses
        the parenthesis.

        WHAT WOULD ACTUALLY WORK, offered as input rather than a decision:
          * PER-CORPUS thresholds. The overlap is between corpora, not within
            one — spec questions floor at 0.7196 while methodology floors at
            0.6818. CitationKind already exists as a closed vocabulary, so the
            envelope can carry which corpus a citation came from and the
            threshold can be per-kind.
          * A MARGIN test rather than an absolute one: refuse when top-1 and
            top-2 are within some epsilon, which is what a near-miss looks like
            — a diffuse match with no clear winner.
          * Both are cheap to measure and neither needs a fleet-wide constant.

        AND THE STANDING CAVEAT IS NOW SHARPER. Yesterday I warned that 3 points
        of headroom was inside what a corpus rebuild could move. A corpus
        rebuild then moved it — to below zero. The threshold cannot be fixed on
        one host's snapshot; it has to be measured against a corpus whose
        chunking is known good, which as of tonight is the first time that has
        been true.
