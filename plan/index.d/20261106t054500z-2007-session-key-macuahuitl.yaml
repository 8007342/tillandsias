  capability_tags: [vault, credentials]
  estimated_hours: 3
  title: An unavailable keyring keeps the existing CA and refuses to mint, on the tmpfs session key path
  context: 'By code reading, the session key store refill returns Gone on any keyring miss, so a locked or unavailable keyring looks like no entry. ca_bundle_needs_refresh then sees no key file and mints. #942 and #945 cover the key check and the at-rest passphrase, not this path, and any ensure_ca_bundle caller reaches it, with or without Vault running. A candidate for the unexplained replacement on macuahuitl at 21:22 PST on 2026-11-05; not proven live. No plaintext fallback is allowed.'
  exit_criteria:
  - 'With a valid certificate and a keyring that fails to answer, ensure_ca_bundle leaves the CA directory byte-identical and warns ca-key-unavailable by name, and a later call after the keyring recovers refills the key and keeps the same CA.'
  - 'A keyring that answers and truly holds no entry still mints, once.'
  verifiable_closure: 'cargo test -p tillandsias-headless --all-features ca_key_store plus a real locked-keyring run on a Linux host with operator consent.'
  unscoreable: 'none.'
  next_action: 'Make the keyring read return a three-way result, then write the failing test for unavailable versus absent.'
