    title: |
      test-credential-cold-state-probe's stub-host arms (3, 4, 7-10) fail on msys: Git's bin/bash.exe prepends /ucrt64/bin:/usr/bin over the stub PATH, so the real uname and tools win
    context: |
      Measured on doris: a proc.run of Git's bin/bash.exe with PATH=<stubdir> sees
      PATH=/ucrt64/bin:/usr/bin:/c/Users/<u>/bin:<stubdir>, and uname -s prints MINGW64_NT-10.0-26300 from
      /usr/bin/uname. So the probe never sees the stubbed Linux/Darwin host, and arms 3/4 read
      no-secret-service where they expect no-busctl/no-security. The probe is right; the fixture cannot stub
      on this host. Expectation-only change: on msys those arms print a named skip and are not counted. The
      probe and every Unix arm are unchanged. A real fix would run the probe's shell without the
      bin/ wrapper's PATH prepend (usr/bin/bash.exe); that changes the probe, so it is not done here.
    verifiable_closure: |
      On doris: before, violation:credential-cold-state-probe:6-failed; after, ok:credential-cold-state-probe:3 arms
      with arms 3, 4, 7, 8, 9 and 10 printed as skip lines. On Linux the arms run as before.
    unscoreable: "the closure is the fixture itself; no separate litmus pin"
    next_action: >
      Implemented. Un-skip when the probe's msys shell stops prepending /usr/bin.
