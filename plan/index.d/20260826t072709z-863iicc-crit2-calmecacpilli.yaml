  - packet_id: lane-branch-methodology-for-a-fleet-that-outruns-its-slowest-host
    event:
      type: note
      ts: "2026-08-26T07:27:09Z"
      agent_id: linux-calmecacpilli-opus5-metaorch-20260826t072434z
      host: linux_immutable
      summary: |
        CRITERION 2 ANSWERED WITH A MEASUREMENT, and the answer is that
        ledger_rule's stated rationale NO LONGER APPLIES to fragments. Proposing
        an amendment; NOT landing it, because this packet requires orchestrator
        ratification for anything that changes fleet practice.

        THE QUESTION criterion 2 actually asks — deliberately not the
        file-conflict one, since host+timestamp-named fragments cannot textually
        conflict — is whether the ORDER-TOKEN COLLISION WINDOW makes it unsafe
        for plan/index.d/ and plan/loop_status.d/ fragments to ride a lane.
        `next-order` reads the FOLDED ledger, so a token minted on a lane
        against a stale base is minted against less information.

        MEASURED (by me, on calmecacpilli, at 638 packets):

          three mints at HEAD ............... 907-55by  907-kyvu  907-858f
          two mints with plan/index.d/ hidden
          (a deliberately stale base) ....... 903-yyen  903-s5az

        TWO FACTS, and they separate cleanly:

        1. **The PREFIX does depend on ledger freshness.** A stale base minted
           903 where HEAD mints 907 — a four-order gap that is exactly the
           collision window the rule fears. Two hosts on stale bases WILL mint
           the same prefix.
        2. **The SUFFIX does not.** Five mints produced five distinct suffixes,
           including the two minted against the stale base, which did not
           collide with each other despite identical ledger input. The suffix is
           per-mint random, not derived from state.

        So a stale base produces a SHARED PREFIX, never a shared token. And a
        shared prefix is already declared normal and non-reconcilable by design
        — the skill's own words: *"Two hosts landing on prefix 575 produce
        575-k3f9 and 575-m2p1: both correct, both permanent, nothing to
        reconcile."*

        **AND THE RULE'S CITED EVIDENCE IS FROM AN ERA THAT ENDED.** ledger_rule
        justifies itself with "every recorded order-number collision came from
        delayed ledger landing (462/464, 477/479, 478-479/486-487)". Every one
        of those is a BARE numeric token. Measured at HEAD: bare `order: N`
        tokens run to a maximum of 578; suffixed `order: N-xxxx` tokens begin
        at 583. **All six cited collisions predate the suffix entirely.** They
        were real, and they were collisions of a token format that no longer
        exists. The 2026-07-31 pair (560-562, 568-570) is likewise bare-era.

        PROPOSED AMENDMENT to `ledger_rule`, for orchestrator ratification —
        the smallest text that answers criterion 2 without widening anything
        else:

          "Lanes MAY also carry append-only fragments under plan/index.d/ and
           plan/loop_status.d/. These are host+timestamp-named and cannot
           textually conflict. The order-token concern that motivates this rule
           is a PREFIX collision, which suffixed tokens (in force since order
           583) render harmless: a stale base yields a shared prefix and a
           distinct token, and a shared prefix is normal and permanent by
           design. The compacted base and plan.yaml, plan/loop_status.md and
           methodology/** continue to ride integration branches directly."

        WHAT I AM NOT CLAIMING, so ratification is decided on the real residual:
        this says nothing about whether lanes are SANCTIONED (criterion 1),
        about the missing reaper (criterion 5), or about the green-exit command
        that has never existed on any ref (criterion 2's neighbour in the
        original filing). It answers only the fragment question, and only for
        the suffixed-token era.

        PROVENANCE: the mint measurements and the bare/suffixed boundary are
        MEASURED by me on this host, just now, and are re-runnable in one
        command each. n=5 mints is small but the property is categorical rather
        than statistical — a single non-colliding pair from identical ledger
        input already falsifies "the stale base determines the token".
