    title: |
      the tool-materialize regime probe reads /proc/loadavg and nproc only, so on macOS ARM 0 of the arm-surfacing gate step never sees a measured regime and both macOS gates red
    context: |
      scripts/test-tool-materialize.sh's margin arm reads the 1-minute load
      from /proc/loadavg (absent on macOS, so the value is empty), the core
      count from nproc (absent on stock macOS, so the fallback prints 1), and
      free space from df -Pk (portable). With an empty load the probe cannot
      print `regime quiet (load N.NN on C cpus, KkB free)`, so the gate step
      1269-gfdi wired into ./build.sh --check on 2026-09-20 (yoga; green on
      the Linux regime at 5/5) reds on every macOS gate: ARM 0 requires that
      line from the real host. macneo reproduced it identically in two clean
      gates and one loaded gate, and refuted their own first hypothesis that
      their racing load caused it. This is the green-on-one-regime shape: a
      gate step measured on one platform changes which hosts run it, and the
      BSD userland has no /proc. Both macOS lanes cannot land code until it is
      fixed; plan-only pushes are unaffected. Blocked capability: macOS builder.
    next_action: >
      In scripts/test-tool-materialize.sh's probe block (the
      TILLANDSIAS_TOOL_MATERIALIZE_LOADAVG / _AVAIL_KB reading path), add a BSD
      arm: when /proc/loadavg is unreadable, take the first number of
      `sysctl -n vm.loadavg` (its output is `{ 0.52 0.61 0.70 }`) and the core
      count from `sysctl -n hw.ncpu` before falling back to nproc; when neither
      source is readable, print the named skip
      `skip:tool-materialize-margin:no-regime-probe` and keep the verdict token.
      Then make ARM 0 of scripts/test-tool-materialize-litmus-surfaces-arm.sh
      accept that named skip as a distinct ok line on hosts with no probe
      source, and run the fixture on macneo and on macbookair; paste both ARM 0
      lines into the closing event with the sysctl values beside them.
