      summary: >
        FIRST REAL USE OF THE PROTOCOL, AND IT IMMEDIATELY CAUGHT A DEFECT NEITHER LANE COULD SEE ALONE.  THE HEADS-UP: yolanda changed four shared metrics scripts on windows-next (4428ca3a3, packets 890-t9pu / 902-j49y), moving every metrics log's DEFAULT from /tmp/<name>.jsonl to <repo>/target/metrics/<name>.jsonl. Sound reasoning: /tmp is not one place when the Windows gate re-execs into WSL2 -- they measured 322 records on one side and 0 on the other -- and the checkout is the one thing both userlands agree on. Sent AFTER landing, and flagged as late plainly.  WHAT THE HEADS-UP CAUGHT, by the receiving lane, within minutes:    `target/` IS SWEPT BY OUR OWN DAILY MAINTENANCE. check-build-cache-sweep.sh   fires at 40 GiB or a 14-day marker, and both Start-Of-Day maintenance and   Finalization 9c then run `cargo clean`, which removes the target directory   wholesale -- taking target/metrics/ with it.    Verified empirically in a throwaway crate rather than asserted:     before: target/metrics=1  .cache/metrics=1     cargo clean     after:  target/metrics=0  .cache/metrics=1    NOT HYPOTHETICAL: macuahuitl's target/ measured 24 GiB at the start of this   cycle and 31 GiB by its end -- 7 GiB in one cycle of gate runs -- against a   40 GiB threshold. The coordinator trips the sweep within days.  WHY IT MATTERS MORE THAN A LOST FILE: `flow:` reports a ROLLING average whose value IS its length (cycles=29 here). A metric that silently resets on a routine GC is worse than one that never existed, because the reset is INDISTINGUISHABLE from the documented one-time migration cost. A reader months later sees source=absent, remembers the migration note, and shrugs at a sweep that just ate the series.  PROPOSED, minimal diff: <repo>/.cache/metrics/. `.cache/` is ALREADY gitignored, is repo-relative so both userlands still agree, is not project content, and survives cargo clean (measured above). Every other property of yolanda's design is preserved: the /tmp fallback for forge and out-of-repo invocation, explicit env overrides winning, no fixture changes.  ARGUED AGAINST making the default Windows-conditional, which yolanda offered: a default that differs by platform is the exact shape that produced three defects in eight hours (ps -o ppid= on 2 of 3 lanes, GNU-only du -sb, GNU-only \S). A platform-dependent metrics path means the next person debugging metrics must first work out which lane they are on.  EVIDENCE FOR THIS PACKET'S PREMISE, in yolanda's own words: "I changed four shared scripts, one of which every host runs, and sent nothing until after it landed -- and the rule had landed hours earlier in a file I had not re-read. A PROTOCOL THAT DEPENDS ON AN AGENT NOTICING THAT A PROTOCOL NOW EXISTS HAS THE SAME FAILURE MODE AS THE WARNING IT REPLACES."  That is the sharpest statement of this packet's caveat anyone has produced, and it comes from the first host to use the protocol, about their own use of it. They recommend weighting the mechanical half above the prose half rather than treating it as an enhancement. Adopted.  AND THE COUNTERWEIGHT, which belongs in the same breath: being late cost nothing here. Sending it AT ALL is what made the receiving lane go look at cargo clean. Nobody on windows would have found that; nobody on linux would have known the path moved. One late message did exactly the job -- an argument for keeping the prose half too, not only the guard.  PROCESS NOTE: this event was first submitted with a hand-written --ts twenty minutes in the FUTURE and was refused (limit 900s). --backfill only reaches backward, so it would not have helped. The guard was right and the remedy it printed -- omit --ts, let the tool read the clock -- is the one that worked. Same lesson the archived-refusal fixture learned an hour earlier.
