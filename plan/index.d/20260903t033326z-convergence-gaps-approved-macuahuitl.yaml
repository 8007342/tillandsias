packets:
  - packet_id: strong-law-invoked-over-a-sequence-the-design-makes-dependent
    order: 976-bd3n
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [methodology, soundness, documentation, public]
    estimated_hours: 2
    title: |
      philosophy.yaml invokes the STRONG law of large numbers for almost-sure convergence, four lines above the block describing the RAG-cache-on-commits design that makes the sequence dependent.
    context: |
      OPERATOR-APPROVED 2026-09-03. A DOCUMENTATION defect, not a design defect —
      nothing about the iteration scheme changes.
      `methodology/philosophy.yaml`, `convergence_via_velocity.weak_vs_strong`
      (L16-26), states verbatim: "the STRONG LLN (almost-sure convergence) makes
      the stream of iterations converge hard". Four lines below,
      `rag_as_cache_commits_as_lamport_clock` (L31-38) describes refreshing the
      RAG cache on commits — so iteration k+1 reads iteration k's output. THE
      FILE CONSTRUCTS THE DEPENDENCE AND INVOKES A THEOREM FORBIDDING IT, IN THE
      SAME BLOCK. Independence is a hypothesis of the theorem, not a stylistic
      assumption.
      ALREADY PUBLIC: tillandsias.org's explainer states this with a footnote
      pinned at v56.9.2.1, at operator direction. The author is reachable and has
      offered to re-pin the page as the text changes.
    exit_criteria:
      - the almost-sure claim is dropped; the design intent (bounded per-iteration skew, high velocity) and the empirical release-boundary evidence are KEPT
      - the text names the dependence structure the cache-on-commits design creates, rather than eliding it
      - it states what a rigorous claim would require — Birkhoff given stationarity and ergodicity, or a martingale law given E[X_{k+1} | F_k] = mu — without asserting either is argued
      - the explainer author is told so the published footnote can be re-pinned

  - packet_id: implement-the-obligation-lattice-and-wire-the-scorer
    order: 976-kk6x
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [rust, methodology, proptest, ci, scoring]
    estimated_hours: 12
    title: |
      The seven-state obligation lattice exists only on paper, while local-ci.sh computes a DIFFERENT object under the same name — build the model, wire the real scorer, backfill it, then require it hard.
    context: |
      OPERATOR RULING 2026-09-03, verbatim intent: "let's wire things that are
      already existing, and file for any missing ones, CRDT style. Enable the
      scoring function and fill it retroactively on work made and require it
      hard going forward."
      So the two are THE SAME THING and the shell scorer must call the model.
      MEASURED BEFORE FILING, not taken on report: `ObligationState` and
      `centicolon_function` occur ZERO times across crates/ and scripts/;
      `evidence_bundled` (a distinctive state name, chosen as the probe
      precisely because `absent` and `implemented` are ordinary words that
      produce false hits — 197 and 45 of them) occurs ZERO times. The lattice,
      product order, refinement operator and componentwise comparison are a
      paper model in `methodology/math-foundations.yaml` with no
      implementation.
      What IS computed is a weighted checklist of passing CI checks —
      `scripts/local-ci.sh` `total_cc` at L500, accumulated L521. Two things
      sharing a name is how a documentation gap survives a decade.
      SEQUENCE MATTERS: property tests over a paper model test nothing, so the
      model comes first. The explainer author's decomposition, adopted.
      VENUE: proptest, not quickcheck — integrated shrinking that respects
      custom generators, plus a persisted failing-seed corpus that is committed.
      The Lua layer was considered and REJECTED: it is swappable decision policy
      (tier classification, query decomposition, first-wins dedup), explicitly
      not a sandbox, with no shrinking, no seeded reproduction and no reach into
      the Rust structures these properties concern.
    exit_criteria:
      - an ObligationState enum with a derived total order, the allowed-transition table, the product state and the score function exist in Rust
      - local-ci.sh's score CALLS that model rather than computing its own; one source of truth, and the gate's reported number is the model's
      - proptest properties hold - every allowed transition is order-preserving, earned is non-decreasing and residual non-increasing at a fixed denominator, a denominator change emits scope-changed, and a frozen state scores identically twice
      - a failing-seed corpus is committed so a shrunk counterexample reproduces
      - RETROACTIVE BACKFILL - existing completed work is scored under the model, and the fill is recorded rather than assumed
      - HARD REQUIREMENT GOING FORWARD - new work carries its obligation state, enforced rather than requested

  - packet_id: requirements-get-stable-random-identifiers
    order: 976-suab
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [specs, methodology, ci, tooling]
    estimated_hours: 8
    title: |
      Zero of 177 spec files carry a requirement identifier, while proximity.yaml pays 0.10 of evidence credit for having one — generate random stable ids once, idempotently, and enforce them.
    context: |
      OPERATOR-APPROVED 2026-09-03, with the semantics ruled directly.
      MEASURED: 0 of 177 spec files carry an identifier;
      `requirement_has_stable_id: 0.10` at `methodology/proximity.yaml:53` is
      a scoring weight nothing computes; `git grep` at v56.9.2.1 returns
      EXACTLY ONE occurrence in the whole repository. Ten percent of evidence
      credit is paid for a property no artifact has. The lattice model's
      componentwise comparison across releases is defined in terms of aligning
      identifiers that do not exist as data.
      THE OPERATOR'S RULING ON TEXT CHANGES, verbatim: "If the meaning changes
      and no longer reflects the original intent then it's a tombstone plus a
      new id. If the change is a refinement over the original text and the
      original still stands then it's a stable id keeping." So: refinement
      keeps the identifier; a changed obligation gets a tombstone and a new one.
      That boundary is author judgement and CANNOT be enforced by a validator —
      say so in the contributor documentation rather than pretending a guard
      covers it.
    exit_criteria:
      - every spec requirement carries a random identifier, never derived from path or heading text, so it survives a file move
      - the generator is IDEMPOTENT - it stamps only what is missing and never reassigns, because a re-run that shuffles identifiers rebuilds the problem in a new shape
      - a CI validator enforces presence and uniqueness and fails on duplicates
      - tombstones carry identifiers too, or retired requirements drop out of comparison and the non-regression check silently narrows its own denominator
      - the refinement-versus-new-obligation rule is documented where an author will read it, stated as judgement rather than as something the validator checks
      - the 0.10 weight stays UNPAID until the validator is enforcing, so credit is never given for a field no artifact is guaranteed to have
