    title: |
      MILESTONE — tillandsias --cloudflare-login (PKCE, not a device grant: Cloudflare offers none), every instance of one account joins ONE Cloudflare Mesh network named tillandsias-vpn, and a hub serves its Local Experts to the fleet as FLEET EXPERTS; today no host holds a Cloudflare credential, no host can reach another, and floor hosts answer unsupported: where a fat host has the answer
    context: |
      OPERATOR (2026-09-29): "tillandsias --cloudflare-login, analogous to
      --github-login (device flow + QR codes)"; "every Tillandsias instance
      signed in with the SAME Cloudflare account joins ONE private network,
      the TILLANDSIAS-VPN. Normalize all names per Cloudflare's own naming
      rules"; "later share ONE off-forge orchestrator for the whole fleet
      over that network — e.g. macuahuitl serving its Local Experts to the
      fleet as FLEET EXPERTS."
      RESEARCH (public docs, 2026-09-29; sources in the design note):
      Cloudflare states verbatim that it does not support the Device
      Authorization grant for third-party clients — only Authorization Code,
      PKCE S256 required for CLI apps, token auth method none. So a QR that
      ends at a loopback redirect cannot work (the phone is redirected to
      its own 127.0.0.1); the design has three receivers: loopback, QR to an
      operator-owned relay page (sees only code+state, never a token or the
      verifier), and paste. The network product is Cloudflare Mesh (formerly
      WARP-to-WARP / WARP Connector), available on the Zero Trust Free plan;
      participants get a Mesh IP in 100.96.0.0/12; every participant runs
      the Cloudflare One Client (warp-svc, root) enrolled headlessly by a
      per-host service token in mdm.xml; Linux node OSes include Fedora
      43/44 (Silverblue unverified); macOS and Windows join through the
      Linux guest. Account limits: 50 Mesh nodes, 50 service tokens. Names:
      the team name is a DNS label; the strictest rule is adopted for every
      name (cloudflare_names: [a-z0-9-], <=63 label / <=255 display);
      canonical network name tillandsias-vpn, team tillandsias-vpn-<acct8>,
      participant tillandsias-<host>, route <svc>.tillandsias-vpn.internal.
      WHAT EXISTS (models, not re-filed): run_github_device_login,
      render_terminal_qr_in, GITHUB_APP_CLIENT_ID; GITHUB_TOKEN_PATH /
      GITHUB_REFRESH_PATH, GitHubTokenStore, store_github_token_bundle,
      spawn_github_token_rotation_scheduler (1461-8tyy, 1489-8qd6);
      handle_github_login, MenuId::GITHUB_LOGIN; tillandsias-plan
      expert-serve on 127.0.0.1:11436 with provider tillandsias-experts.
      DESIGN PRINCIPLES (binding on every child): no fixture needs the real
      OAuth client (a fake Cloudflare serves every gate); the verifier never
      leaves the process; two Vault paths as for GitHub; forges never
      rotate; the hub's endpoint never binds off-loopback without a bearer;
      nothing installs a host daemon with elevated privileges — it prints the
      step and refuses; every status line is a read fact or unknown:<why>.
