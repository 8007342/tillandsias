  - packet_id: cloudflare-oauth-begin-exchange-refresh-and-revoke-are-pure-pkce-functions-over-an-injected-http-client-and-the-login-announces-a-device-grant-if-discovery-ever-lists-one
    order: 1505-kyx8
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.6
    release_target: every-tillandsias-instance-signed-in-with-the-same-cloudflare-account-joins-one-private-network-tillandsias-vpn-and-a-hub-serves-its-local-experts-to-the-fleet-as-fleet-experts
