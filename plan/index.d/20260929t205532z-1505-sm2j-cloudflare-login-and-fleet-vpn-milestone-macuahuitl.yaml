    owned_files:
      - crates/tillandsias-headless/src/cloudflare_oauth.rs
      - scripts/test-cloudflare-oauth-core.sh
    title: |
      cloudflare_oauth::{begin, exchange, refresh, revoke} implement Authorization Code + PKCE S256 as pure functions over an injected HTTP client (32-byte state, RFC 7636 verifier that never leaves the process, exact redirect_uri), read the OpenID discovery document, and print note:cloudflare-login:device-grant-available if grant_types_supported ever lists the device grant
    context: |
      Cloudflare has no device grant (design note research §1); this is the
      code-grant core every receiver in 1505-kc5f calls. Endpoints come from
      TILLANDSIAS_CLOUDFLARE_BASE_URL (default https://dash.cloudflare.com)
      and are confirmed against /.well-known/openid-configuration at login
      (the secondary-source endpoint list — /oauth2/auth, /oauth2/token,
      /oauth2/revoke, /oauth2/userinfo — must be verified by the
      implementer from the discovery document, not hard-coded from the
      note). Client id: CLOUDFLARE_APP_CLIENT_ID constant, overridable by
      TILLANDSIAS_CLOUDFLARE_CLIENT_ID. A state mismatch is refused before
      any network call. No token is logged even under --debug (mirror the
      GitHub rule: the poll script carries nothing secret on argv).
    exit_criteria:
      - 'scripts/test-cloudflare-oauth-core.sh exits 0 against the fake: begin yields an authorize URL with code_challenge_method=S256 and a 43..128-char verifier; exchange with the right verifier returns a bundle; exchange after a state mismatch makes zero token requests; refresh rotates; a discovery document listing the device grant makes the login print note:cloudflare-login:device-grant-available (pre-fix: module absent)'
      - 'cargo test -p tillandsias-headless cloudflare_oauth passes and no test constructs a network client (the HTTP client is a trait object)'
    verifiable_closure: |
      bash scripts/test-cloudflare-oauth-core.sh exits 0 on the fixed tree
      (fake from 1505-svve on a random port); on today's tree it does not
      exist. The state-mismatch arm asserts the fake's ledger has NO
      /oauth2/token entry, which fails if the check is moved after the
      request.
    depends_on:
      - a-fake-cloudflare-server-serves-openid-discovery-oauth-and-the-zero-trust-api-routes-the-bootstrap-calls-so-every-login-and-fleet-vpn-fixture-runs-without-the-real-app
