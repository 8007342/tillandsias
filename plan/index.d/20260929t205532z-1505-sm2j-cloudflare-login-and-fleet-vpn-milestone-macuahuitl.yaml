    title: |
      A fake Cloudflare (tillandsias-fake-cloudflare) serves OpenID discovery, /oauth2/auth with ?auto=approve|deny, /oauth2/token enforcing PKCE S256, single-use codes and refresh rotation, /oauth2/revoke, /oauth2/userinfo and the Zero Trust API routes fleet-vpn init calls, recording every call to a JSON ledger, so no fixture in this milestone needs the real App
    context: |
      Every other child tests against this. It listens on 127.0.0.1:0 and
      prints its port; fixtures export TILLANDSIAS_CLOUDFLARE_BASE_URL and
      TILLANDSIAS_CLOUDFLARE_API_BASE_URL. The token endpoint must be as
      strict as Cloudflare's documented behaviour (S256 only; exact
      redirect_uri match including port, path and trailing slash; single-use
      code) so a login that passes here is not a false green. The discovery
      document's grant_types_supported is configurable so the device-grant
      adapter note (1505-kyx8) can be tested. The API routes: GET /accounts,
      POST/DELETE /accounts/{id}/access/service_tokens, POST
      /accounts/{id}/teamnet/virtual_networks, the device-profile,
      split-tunnel and gateway-rule routes; each appends {method, path,
      body} to the ledger file named by --ledger. Design: Decision 3 in
      openspec/changes/cloudflare-login-and-fleet-vpn/design.md.
    exit_criteria:
