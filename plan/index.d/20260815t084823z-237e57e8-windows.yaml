      summary: >
        ROOT CAUSE FOUND, FIXED, AND GATED. The installer was unsigned for TWO independent reasons in the same job, neither of which produced any output.    1. The Windows signing loop was an ALLOW-LIST:        for artifact in tillandsias-tray-*-windows-x64.zip SHA256SUMS-windows      so every asset added later was unsigned BY DEFAULT. The Linux job has      always used `for artifact in *`.   2. The step that staged install-windows.ps1 ran AFTER the signing step, so      even a wildcard loop would have missed it.  Either alone would have shipped it bare. That is why the fix is both: the loop now iterates `*` (skipping only *.cosign.bundle, so SHA256SUMS-windows keeps being signed as before), and the installer is staged BEFORE checksums are computed and is now named in SHA256SUMS-windows as well. It ends up with a cosign bundle AND an entry in a signed manifest -- either would satisfy the packet; both is what falls out of doing it the way Linux already does.  THE GATE, and why it is not "count unsigned assets". Run against the LIVE published release, it flags exactly one asset of 29:    $ scripts/check-release-asset-integrity.sh --tag v0.4.260815.1   violation:release-asset-integrity:1     install-windows.ps1 has no integrity path: no install-windows.ps1.cosign.bundle,     and no signed SHA256SUMS names it  No false positives among the other 28. Four of the five bundle-less assets in that release are legitimately covered -- named in a signed manifest, or themselves a manifest whose every entry is signed -- and a gate that flagged all five would have cried wolf four times and been switched off after the first release. So the check follows the transitive path: signed directly, OR named in a trustworthy manifest, OR is a manifest of individually-signed files.  FIXTURE, 6/6, both directions (scripts/test-release-asset-integrity.sh):   1 bare installer caught                      3 TRANSITIVE COVERAGE NOT FLAGGED   2 signed + manifested passes                 4 manifest-of-signed-files covered   5 an UNSIGNED manifest vouches for nothing   6 a newly added asset is caught Scenario 5 matters: without it the check could be satisfied by dropping in a plain checksum file, which is a claim rather than evidence. Scenario 3 is the negative control the packet asked for and is the reason this is a script rather than `ls | grep -c`.  WIRED INTO BOTH RELEASE JOBS over what they actually staged. The Linux job's existing verification was seven `test -f` lines -- an allow-list of files someone remembered, which cannot notice an asset nobody thought to add a line for. The property check runs beside them.  THE BUILD GATE CAUGHT ME MID-FIX, and it was right. I added a litmus step asserting the windows loop "is not an allow-list" by grepping the workflow for the absence of the old literal. build.sh refused it under 634-39ik: a new litmus step must assert a PROPERTY, not pin how source is currently written. I removed it and left a comment saying why, because the property is already covered behaviourally -- if that loop ever becomes an allow-list again, an asset it skips has no integrity path and the gate fails the release. A grep for yesterday's wording is not a guard.  litmus:release-artifact-integrity 6/6. Its previous four steps all grep the workflow for the WORDS of signing; none asked whether the resulting asset set is verifiable, which is exactly how this shipped.  NOT DONE, and it is exit criterion 1: verifying the asset list of a NEWLY CUT tag. The workflow change cannot be verified from this host -- it runs on GitHub runners. The gate is the thing that will prove it, at the moment the next release is built, and it fails the job rather than publishing. Exit criterion 5 (the README's `irm | iex` either verifies or says it does not) is also untouched: it applies equally to the Linux and macOS curl lines and should be decided for all three at once, not patched on the windows one alone.
