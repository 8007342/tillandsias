      summary: |
        R2 IS RETIRED AND REPLACED. I set its target on the wrong side of the
        only threshold that matters, and the operator's velocity argument is
        what exposed it.

        With arrivals lambda = a + b*mu (measured a = 2.2/day, b = 1.80,
        r = 0.868) and service mu, the queue moves at

            dL/dt = a + (b - 1)*mu        so   d(dL/dt)/d(mu) = b - 1

        THE SIGN FLIPS AT b = 1. Above it, throughput is a DIVERGENCE
        multiplier — every host added and every cycle shortened fills the queue
        faster, which is what I correctly concluded at b = 1.80. Below it, the
        same throughput DRAINS the queue, and it converges once mu > a/(1-b).

        R2's target was "b <= 1.30". At b = 1.30, dL/dt = 2.2 + 0.30*mu, which
        is STRICTLY POSITIVE FOR EVERY mu >= 0. That criterion cannot converge
        at any velocity on any number of hosts. I picked 1.30 because it was a
        visible improvement on the measured 1.80, without checking which side of
        the threshold it lands on — a target chosen by direction instead of by
        the arithmetic that defines success.

          R2'' ARRIVAL CURATION PUTS b BELOW 1. Not 1.30. At b = 0.5 and
              today's mu ~ 19/day, dL/dt = -7.3/day.

        AND THE OPERATOR'S POINT IS THE OTHER HALF (2026-08-19): halving
        orchestration overhead roughly doubles a AND mu, so dL/dt doubles WITH
        ITS SIGN PRESERVED. Velocity is a multiplier on the direction already
        being travelled, never a fix for the direction. That is exactly why the
        acceleration they describe — nix cache, reliable experts, 30-minute then
        20-minute cycles — is self-sustaining ONCE b < 1 and self-defeating
        before it. The ordering is forced: curate first, then accelerate, and
        then the acceleration compounds.

        Recorded in methodology/distributed-work.yaml ->
        why_velocity_is_the_other_lever.

