        RULING TAKEN, option (c): `obsoleted` is EXEMPT from archiving. A
        retracted row keeps its reasoning queryable, which is the property the
        convergence model leans on to call aggressive retraction safe. Costs
        nothing today at 8 obsoleted vs 564 completed. It does NOT scale as
        written — once retraction is the primary drain these rows accumulate
        forever — so the follow-on is a TOMBSTONE form: archive a retracted
        row's event history, keep a compact row with id, title and the
        retraction reason at ~5 lines instead of ~80. That must land BEFORE the
        first large retraction wave.

        ATTEMPT 1 — 569 archived, ready 410 -> 410 identical, index
        60,241 -> 25,188 lines. Both acceptance assertions green. AND IT TURNED
        check-fragment-status-loss.sh RED with 38 violations, every one reading
        "an events block addresses it but NO SUCH PACKET is in the fold ... that
        event was discarded".

        WHAT I HAD MISSED: archiving a row does not merely make the ROW
        unqueryable. It ORPHANS every plan/index.d event still aimed at that
        row, and the fold then drops those events in silence. The files remain
        in git and disappear from every answer. That is a strictly worse loss
        than the row, and it CANNOT be repaired by moving the events — fragments
        are append-only and immutable once written.

        This is the same lesson as the 424/437 absorption, one level up: I
        verified the invariant I had thought of (ready set preserved) and the
        one I had not thought of was the one that broke. The difference is that
        this time an EXISTING gate caught it before the push. A gate written by
        someone else, for a different reason, three weeks earlier.

        THE RULE THAT WAS MISSING: a row is archivable only if it is TERMINAL
        AND NOT ADDRESSED by any live fragment. Now enforced in the archiver and
        asserted in --check as a second invariant, compared BEFORE vs AFTER
        rather than absolutely, so a fragment that already addresses a
        never-existent id (a typo, which the advisory tolerates) does not red
        the gate; only the sweep CREATING new orphans does. Mutation control:
        deleting the exclusion line -> exit 1 naming exactly the 38 ids.

        ATTEMPT 2, shipped: 550 archived — 19 fewer, precisely the rows with
        live events still pointing at them. Index 60,241 -> 26,344 lines (56%).
        Ready 410 -> 410 byte-identical. 577 live packets, references sound.
        check-fragment-status-loss.sh exit 0.

