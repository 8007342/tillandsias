        CRITERION 4 WINS. A host-native-only device is present-unusable. Widening accel_envelope's state() predicate so that a dxg device counts as usable without a container lane would be "the same literal-in-place-of-evidence shape as 1253-54zj" — i.e. making the envelope assert a lane nobody measured, which is the exact defect family this packet exists to end.

        SO CRITERION 1 IS MET ONLY WHEN A CONTAINER LANE EXISTS, BY MEASUREMENT. The honest route is the one this row's next_action already named as option (b): probe /dev/dxg from inside a container and let the record gain lanes=[host-native, container] only if it actually enumerates there. If the lane works, criterion 1 follows from evidence rather than from a predicate change. If it does not, this row closes with dxg recorded present-unusable and the reason named — which is a real outcome, not a failure.

        WHAT THIS RETIRES: option (a) (amend criterion 1) and option (c) (split the envelope's notion of usable by lane) are both declined. Do not reopen them by editing state(); the ruling is that the predicate is correct and the missing thing is evidence.

        THE MEASUREMENT IS ROUTED TO esmeraldinha AND IS SPECIFIED AS TWO SEPARATE ARMS, because one of them cannot be claimed for the product's lane:
          ARM 1 — podman run --rm --device /dev/dxg <vulkan-capable image>, enumerate from inside.
          ARM 2 — the same, PLUS a bind mount of /usr/lib/wsl/lib with LD_LIBRARY_PATH set to reach it.
        ONLY ARM 1 CAN BE CLAIMED FOR THE PRODUCT'S CONTAINER LANE, and the row must state which arm produced any usable=true. Arm 2 exists because Mesa's dzn ICD dlopens libd3d12.so/libdxcore.so out of /usr/lib/wsl/lib, a WSL host mount that is in no container image — so a bare arm-1 failure could be an artefact of the missing host libraries rather than of the device node not crossing, and reporting it as "dxg does not reach the container" would be a false negative. "The lane works only with a host-library bind mount" is a DIFFERENT finding from "the lane works", and the difference decides what the product may claim.
        Report outcomes, not a verdict: device node visible or not, loader found or not, ICD enumerating or not, and the same two devices or a different set — per arm.

        A HOST-TOPOLOGY OBSTACLE THE MEASUREMENT MUST ROUTE AROUND, found while preparing it: on esmeraldinha the two required capabilities are in DIFFERENT WSL2 distros and neither locus has both. tillandsias-build has /dev/dxg, the Vulkan loader and the full Mesa ICD set, and NO podman. tillandsias has /dev/dxg, podman and /usr/lib/wsl/lib, and NO Vulkan loader and no /usr/share/vulkan/icd.d at all. So the measurement runs in the tillandsias distro and the Vulkan stack must come from INSIDE the image; the host distro there cannot supply it. No local image is Vulkan-capable (alpine:3.22, hashicorp/vault:1.18, and the two localhost/tillandsias-* images), so this needs an image that carries a loader plus an ICD. That is why this is not the one-line podman run it reads as.
