      summary: >
        EC3 AND EC4 NOW EXIST; yesterday's audit found them missing entirely and
        called EC3 "the valuable half".

        EC3 is two assertions rather than one, because a per-channel test would
        have been the same shape as the defect. First, each known channel round
        trips: a fragment carrying it is folded, compacted, PUBLISHED (candidate
        becomes the base, folded fragments deleted, exactly as `compact` does)
        and folded again, and both the packet document and the capability
        matrix must be unchanged. Second — and this is the one that
        generalises — the test reads its own source with include_str!, extracts
        every top-level key the folder pulls out of a fragment, and requires
        each to have a probe. Adding a channel to the folder without adding a
        probe fails the build.

        That second assertion is what makes the NEXT channel safe rather than
        this one. 843-624y destroyed 100% of the capabilities channel because
        the folder read a key compaction never wrote; 864-p2rk landed the same
        shape hours ago on a cache key that omitted one of its own inputs. A
        list of channels somebody must remember to extend is exactly what both
        of those already were.

        EC4 verified in both directions, since a test that has never gone red
        is not a gate:
          - remove the capabilities probe -> the coverage assertion fails and
            NAMES ["capabilities"], citing 843-624y
          - suppress the capabilities writer -> the round trip fails with
            left ["probe-host/in-guest"], right [] — the original data loss,
            reproduced on demand

        CLOSING WITH ONE RESIDUE CARRIED FORWARD, NOT SWEPT UP. EC2 asks that
        `fold_capabilities` read the base "so a folded row is indistinguishable
        from a fragment row to EVERY caller". It is satisfied behaviourally —
        both production callers splice the base in as a synthetic "0000-base"
        Fragment and `capability-matrix` reports all 7 hosts — but structurally
        the function still takes only fragments, and a third caller would get
        an empty matrix with no error. That is filed as 864-v8kr with its own
        exit criteria. The round-trip test above deliberately MIRRORS the
        caller-side splice rather than improving on it, so it tests the fold
        production actually performs.

        This packet was itself the residue split off 843-624y. Splitting the
        remaining structural nit rather than holding the whole row open is the
        same call, made for the same reason.
