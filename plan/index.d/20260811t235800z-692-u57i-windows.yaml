packets:
  - packet_id: plan-append-event-cannot-reach-fragment-born-packets
    order: 692-u57i
    status: ready
    desired_release: v0.5
    priority: p2
    title: "tillandsias-plan append-event refuses any packet that lives only in plan/index.d/, so a packet cannot be annotated on the day it is filed"
    kind: fix
    deliverable: crates/tillandsias-plan/src/main.rs
    depends_on: []
    pickup_role: any
    owner_host: any
    capability_tags:
      - plan
      - tooling
    estimated_hours: 2
    outcome: >
      append-event resolves a packet through the FOLD (base plus
      plan/index.d/ fragments) exactly as `status` and `query` already do, and
      writes the event to a new fragment when the packet is not in the base —
      so every packet is annotatable from the moment it exists, regardless of
      which half of the ledger it currently lives in.
    next_action: >
      Reproduce with any packet filed as a fragment in the current cycle, then
      route append-event's lookup through the same folded reader `status` uses
      and emit an events-channel fragment for the not-in-base case.
    exit_criteria:
      - "append-event on a packet that exists only in plan/index.d/ exits 0 and the event is visible through the fold"
      - "append-event on a packet in the base still writes to the base exactly as today (negative control: the fix must not silently move all events into fragments)"
      - "the not-found error remains for an id that is in neither base nor fragments"
    events:
      - type: filed
        ts: "2026-08-11T23:58:00Z"
        agent_id: "windows-claude-opus5-20260811t215500z"
        host: windows
        summary: >
          Hit while annotating 689-gipe, filed as a fragment earlier the same
          day. `tillandsias-plan status 689-gipe` resolves it fine — the fold
          sees it — but `append-event 689-gipe note ...` fails with
          "packet_id 'windows-tray-staged-guest-asset-restage' not found",
          because append-event edits the base plan/index.yaml only. The
          workaround is to hand-write an events-channel fragment, which works
          and folds cleanly, but it means the documented filing path (write a
          NEW fragment, never touch the base) produces packets the documented
          annotation path cannot touch. The two halves of the ledger discipline
          disagree, and the loud symptom is a not-found error on a packet the
          same binary will happily print the status of one command earlier.
