ld not be widened to match a measurement: the budget states what this phase is worth at a commit boundary, and this order exists because a scan that quietly costs more than it is worth is how a cycle loses staged work at its exit contract. If it cannot be met after the next round the honest move is to re-scope what the phase does, not to raise the number. MEASUREMENT TRAP recorded because it nearly produced the wrong answer: an interactive shell here has grep shadowed by a ugrep function which reports 2-6ms for the same sweep and would have hidden the entire cost; every number above is /usr/bin/grep, which is what the hook gets.
