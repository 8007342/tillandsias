packets:
  - packet_id: obligation-lattice-model-in-rust
    order: 977-56fd
    status: ready
    desired_release: v0.5
    priority: p1
    kind: implementation
    title: rung 1 — ObligationState, the product order, and the refinement operator exist in Rust
    deliverable: 'crates/: ObligationState as the seven-value chain, SpecState/ProjectState as product orders with componentwise comparison over stable IDs, and a refine() operator — the objects math-foundations.yaml describes and nothing implements'
    pickup_role: linux
    capability_tags: [methodology, model, rust]
    estimated_hours: 3
    context: |
      RE-MEASURED on yoga 2026-09-03 rather than inherited: `ObligationState`,
      `centicolon_function`, `evidence_bundled` and `refine_obligation` each
      return ZERO across crates/ and scripts/ excluding target/. The lattice is
      paper. Meanwhile scripts/local-ci.sh:500 computes `total_cc`, a weighted
      checklist of passing CI checks — a different object under the same name,
      which is how a gap like this survives.

      THE MODEL COMES FIRST BECAUSE PROPERTY TESTS OVER A PAPER MODEL TEST
      NOTHING. That is the whole sequencing argument 976-kk6x was filed on.

      SHAPE, from math-foundations.yaml:12-42. obligation_state is a CHAIN of
      seven — absent < declared < traced < positively_tested < negatively_tested
      < runtime_observed < evidence_bundled — so any two obligation states are
      comparable. spec_state and project_state are PRODUCTS, compared
      componentwise "after aligning stable IDs and tombstones", so most pairs of
      distinct spec states are INCOMPARABLE. That asymmetry is load-bearing for
      rung 2 and is the reason this rung must expose comparability as a real
      partial order rather than as a total one.
    exit_criteria:
      - |
          ObligationState is the seven-value chain in the order the methodology
          declares, with the ordering derived from one declaration rather than
          hand-written twice
      - |
          SpecState and ProjectState compare componentwise over stable IDs, and
          a pair differing in opposite directions on two obligations is
          INCOMPARABLE rather than silently collapsed to equal or less-than
      - |
          refine() is defined over a finite artifact snapshot and is callable by
          rung 2 without a test-only shim
    verifiable_closure: |
      `cargo test` covers construction and comparison, including an explicit
      incomparable-pair case; the type is public enough for rung 2 to import.

  - packet_id: obligation-lattice-properties-that-can-fail
    order: 977-dpbj
    status: ready
    desired_release: v0.5
    priority: p1
    kind: test
    depends_on: obligation-lattice-model-in-rust
    title: rung 2 — proptest the order and refinement properties, with a deliberately wrong model committed so the suite proves it can fail
    deliverable: 'proptest properties over rung 1 covering monotonicity, inflationarity and idempotence, a committed failing-seed corpus, and a wrong-model fixture the suite must reject'
    pickup_role: linux
    capability_tags: [methodology, testing, soundness]
    estimated_hours: 3
    context: |
      TWO INDEPENDENT REASONS THIS RUNG IS THE RISKY ONE.

      (1) THE METHODOLOGY'S OWN VALIDATION IS STRICTLY WEAKER THAN ITS CITATION.
      math.fixpoint.convergence-target@v1 (math-foundations.yaml:61-71) cites
      tarski_1955 and kleene_1952 and validates with
      `refine(refine(state)) == refine(state)`. Knaster-Tarski needs MONOTONE;
      the constructive finite-stabilisation argument needs MONOTONE AND
      INFLATIONARY. Idempotence implies neither.

      And it is not an arbitrary choice — that is what makes it survive review.
      Idempotence DOES deliver stabilisation, trivially in one step: if
      refine∘refine = refine then every point of the image is a fixed point, so
      "iterate until nothing changes" terminates immediately. What it does not
      deliver is anything ORDER-THEORETIC — not that the fixed point is LEAST,
      not that it is reached from below, not that refine respects the product
      order. So the check tests the CONCLUSION's shape while the citations are
      load-bearing for the hypothesis. A validation that passes without
      examining the hypothesis, wearing a proof.

      (2) THE VACUITY TRAP, which would make the fix worthless. Monotonicity is
      `x <= y => refine(x) <= refine(y)`, and on a PRODUCT order most randomly
      generated pairs are INCOMPARABLE. A naive generator draws two independent
      states, the precondition fails, the case is discarded, and the property
      passes having tested almost nothing — while proptest cheerfully reports
      thousands of passing cases. Generate COMPARABLE PAIRS BY CONSTRUCTION
      (draw x, then draw an increment along the order to build y >= x) and
      ASSERT ON THE COUNT of non-discarded cases, so a generator that stops
      producing comparable pairs fails loudly instead of passing silently.
      Inflationarity (`x <= refine(x)`) is unary and has no such problem.

      IF refine TURNS OUT NOT TO BE MONOTONE, THAT IS A FINDING ABOUT THE
      METHODOLOGY'S CLAIM, not a bug in the property test. Record it as one.
      Named risk, since rung 1 is the same author: the tempting failure is to
      quietly adjust refine until the property passes. Report the failure BEFORE
      touching the operator.
    exit_criteria:
      - |
          Monotonicity, inflationarity and idempotence are asserted separately,
          so a model satisfying one and failing another is distinguishable
      - |
          A DELIBERATELY WRONG MODEL is committed as a fixture and the suite
          FAILS against it — the properties prove they can fail rather than
          promising it
      - |
          The comparable-pair generator asserts on its own non-discard count, so
          a degenerate generator fails instead of passing over an empty sample
      - |
          A failing-seed corpus is committed so a reproduction survives the run
          that found it
    verifiable_closure: |
      `cargo test` green against the real model, RED against the committed wrong
      model, and the non-discard assertion trips when the generator is mutated to
      draw independent pairs.

  - packet_id: centicolon-scorer-calls-the-model
    order: 977-j6qu
    status: ready
    desired_release: v0.5
    priority: p1
    kind: implementation
    depends_on: obligation-lattice-properties-that-can-fail
    title: rung 3 — local-ci.sh's total_cc calls the lattice instead of computing a second thing under the same name
    deliverable: 'one scorer: scripts/local-ci.sh consumes centicolon_function over the model rather than accumulating its own weighted checklist, with the denominator and residual reported separately as the methodology requires'
    pickup_role: linux
    capability_tags: [methodology, ci, model]
    estimated_hours: 2
    context: |
      scripts/local-ci.sh:500 declares `total_cc=0`, accumulates a weight per
      passing check at :521, and reports it at :605/:625 as
      `expected_total_cc`. That is a weighted checklist of CI results. The
      methodology's centicolon_function is a bounded ranking function from
      spec_state with a SEPARATELY REPORTED denominator and residual
      (math-foundations.yaml:37-42). Two different objects share the name.

      The operator's ruling is that these are the SAME thing and the shell
      scorer must call the model. Note the methodology's own qualifier survives
      the merge: the function is monotone only for evidence transitions that
      preserve obligation IDs and introduce no penalties, ambiguity, or
      denominator scope changes — so the scorer must be able to say when it is
      OUTSIDE that regime rather than reporting a number as if it were inside.
    exit_criteria:
      - |
          `total_cc` is derived from the model; there is no second accumulator
          computing a score under that name
      - |
          Denominator and residual are reported separately from the earned score
      - |
          A transition outside the monotone regime is NAMED as such rather than
          scored silently

  - packet_id: centicolon-backfill-only-what-evidence-supports
    order: 977-3dee
    status: ready
    desired_release: v0.5
    priority: p2
    kind: implementation
    depends_on: centicolon-scorer-calls-the-model
    title: rung 4 — retroactive backfill over completed work, scoring ONLY rows whose evidence_refs pin the states, everything else explicitly UNSCORED
    deliverable: 'a backfill pass that assigns scores where evidence_refs already pin the obligation states the lattice needs, marks every other row UNSCORED as a first-class value, and tags each backfilled score with its derivation'
    pickup_role: any
    capability_tags: [methodology, ledger, soundness]
    estimated_hours: 2
    context: |
      COORDINATOR RULING 2026-09-03 (7f5fbeac1), on an objection raised before
      this rung was built. The concern: a score computed retroactively over work
      whose obligations were never tracked would be derived from the ledger's
      RECORD of the work rather than the work's actual obligation states —
      measuring HOW WELL PAST ROWS WERE WRITTEN UP while being read as how well
      the work discharged its obligations.

      THE RULING IS (a) AND (b) TOGETHER: backfill only rows whose evidence_refs
      already pin the needed states; every other row is explicitly UNSCORED, a
      first-class value exactly as `unsupported` is for the experts; and tag
      every backfilled value with its derivation so a consumer can tell a
      measured score from an inferred one without reading this packet.

      NOT the "name the field approximate" option alone: a caveat in the schema
      is lost at every call site that reads the NUMBER rather than the name, and
      the number outlives the decision.

      CONSEQUENCE ACCEPTED DELIBERATELY, so nobody has to defend it later: the
      backfilled corpus will be SPARSE, possibly covering a small minority of
      completed work. That is the right outcome. A coverage figure that starts
      low and rises is itself a measurement; a dense inferred one starts at a
      number nobody can audit and never improves, because there is nothing to
      improve toward.
    exit_criteria:
      - |
          Rows without supporting evidence_refs are UNSCORED, not defaulted to a
          number
      - |
          Every backfilled score carries its derivation, distinguishable from a
          measured one by a consumer that reads only the data
      - |
          Coverage is reported as a figure (scored / total), so sparseness is
          visible rather than implied

  - packet_id: centicolon-enforcement-is-hard-not-requested
    order: 977-448j
    status: ready
    desired_release: v0.5
    priority: p2
    kind: implementation
    depends_on: centicolon-backfill-only-what-evidence-supports
    title: rung 5 — require the score hard going forward, and do not let sparse backfill coverage read as evidence enforcement works
    deliverable: 'new work must carry the obligation states the scorer needs, enforced by a gate rather than requested in prose'
    pickup_role: linux
    capability_tags: [methodology, gate, enforcement]
    estimated_hours: 2
    context: |
      SPLIT FROM RUNG 4 DELIBERATELY, for a reason the coordinator named: under
      the backfill ruling the backfill can SUCCEED while covering almost
      nothing, and enforcement must not be allowed to inherit that as evidence
      it worked. They can fail independently, so they are separate rows.

      "A guard only an attentive agent honors is a suggestion, not a constraint"
      — this rung is the one that has to produce a pass/fail exit code.
    exit_criteria:
      - |
          A gate fails when new work lands without the obligation states the
          scorer requires
      - |
          The gate's verdict distinguishes "states missing" from "states present
          but outside the monotone regime"
      - |
          Enforcement's own evidence is independent of backfill coverage — a
          sparse backfill cannot make this rung look satisfied

