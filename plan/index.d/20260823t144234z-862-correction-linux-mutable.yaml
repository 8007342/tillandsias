        caught the claim before it was pushed; nothing else would have.

        THE REAL CAUSE, and macos was right that it is placement — one level
        further out than either of us first looked. New packets are appended
        with `out.push(render_item(p))`, i.e. at the END of the document. The
        `rposition("    - ")` above it only VALIDATES that the last list item
        is a packet item; it does not aim the insertion. That was correct for
        as long as the document ended with the packets list. Putting
        `capabilities:` after it broke exactly that invariant: the next
        compaction pushed a `    - packet_id:` line after the capabilities
        mapping and the candidate stopped parsing — "did not find expected key
        at line 37474 column 7, while parsing a block mapping at line 37424
        column 5".

        Neither the unquoted timestamps nor the non-idempotent strip was this
        bug. Both were real and both needed fixing; neither was what the
        tripwire was complaining about. I had three plausible causes and
        credited the first two.

        FIXED by PREPENDING the block instead of appending it. A top-level
        key's order is semantically irrelevant to YAML, so the channel costs
        nothing at the top and the document keeps ending in the packets list —
        which is what every other writer in this file assumes.

