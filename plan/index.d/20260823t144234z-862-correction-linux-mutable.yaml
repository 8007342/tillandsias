        HOW I FOOLED MYSELF. I folded the live ledger, ran the tripwire, saw it
        pass, and concluded the earlier fix had covered it. But at that moment
        the overlay held exactly ONE fragment — the permanently-refused orphan
        — so `compact_text` returned early with nothing to consume and NEVER
