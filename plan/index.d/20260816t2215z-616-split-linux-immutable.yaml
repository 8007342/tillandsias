    tags: [mcp, spec, litmus, forge, v0.5]
    title: |
      Re-baseline the host-browser-mcp spec + frame litmus onto the per-lane NDJSON socket order 505 actually shipped.
    context: |
      openspec/specs/host-browser-mcp/spec.md:68-110 still mandates that MCP
      rides `ControlMessage::McpFrame` on `/run/host/tillandsias/control.sock`
      and that "no additional Unix-domain socket nodes are created". Order 505
      (dd8fd63fa) DELETED that path: tray/mod.rs:1218-1233 now answers
      McpFrame on control.sock with `ErrorCode::Unsupported` naming the
      per-lane requirement, and the live route is a per-lane NDJSON
      `mcp.sock` bind-mounted at /run/host/tillandsias-mcp. Consequently the
      4 MiB `MAX_MCP_FRAME_BYTES` cap (control-wire lib.rs:88) and all of
      litmus-host-browser-mcp-frame-shape.yaml guard a contract the product
      no longer uses, while the live NDJSON path has NO payload cap at all.
      A spec that describes a deleted transport is worse than no spec: it
      makes every later "parity" claim unfalsifiable.
      Also false: images/default/config-overlay/mcp/host-browser.sh:3-7 claims
      it "wraps each as a ControlMessage::McpFrame" — it is a raw socat pipe.
    exit_criteria:
      - |
          spec.md's transport requirement and its scenarios describe the per-lane NDJSON socket with listener-derived attribution (order 505), with the McpFrame path recorded as superseded rather than deleted silently.
      - |
          litmus:host-browser-mcp-frame-shape is retired or retargeted so no green litmus guards the dead McpFrame contract; the host-browser-mcp litmus set still fails loud if the live path regresses.
      - |
          The host-browser.sh docstring states what it actually does (raw socat to the per-lane socket).
    events:
