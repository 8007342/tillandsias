    tags: [mcp, forge, browser, host-services, v0.5]
    title: |
      Compose the eight browser.* tools into the live per-lane MCP dispatcher (the wiring gap itself).
    context: |
      `crates/tillandsias-browser-mcp` has no [[bin]] and NO crate depends on
      it (grep over Cargo.toml files finds only the workspace member list) —
      it is dead code in the product. The live dispatcher
      (tray/mod.rs::handle_mcp_jsonrpc, ~line 735) advertises exactly three
      tools: publish_local, service_status, service_stop, pinned by the unit
      test at ~4552. So the forge's `host-browser` MCP server reaches a
      dispatcher that has never heard of the browser family.
      Attribution is the constraint that shapes the fix: the project label
      MUST come from the connection's LaneIdentity, never from the request
      and never from BrowserMcpServer::new()'s TILLANDSIAS_PROJECT env read
      (server.rs:56-57).
    exit_criteria:
      - |
          tillandsias-headless depends on tillandsias-browser-mcp; serve_mcp_connection builds ONE BrowserMcpServer (with_project_label from LaneIdentity) plus one runtime per connection, hoisted out of the per-call path.
      - |
          tools/list returns the publish trio PLUS the eight browser.* tools; tools/call routes browser.* through the composed server and leaves the trio and the -32601 unknown-tool fallback untouched. The existing three-tool pin test is updated, not deleted.
      - |
          A test drives a real UnixStream::pair() through serve_mcp_connection with a pinned LaneIdentity (initialize + tools/list + a disallowed-URL browser.open) and asserts eleven tools and a typed error — through the transport, hermetic via with_project_label_and_mode(fake_launch=true).
    events:
      - type: filed
        ts: "2026-08-16T22:15:00Z"
        agent_id: "linux-yoga-claude-20260816t185912z"
        host: linux-immutable
        summary: "Split child 1 of 616-nm7q; the vertical slice that closes the wiring gap."

  - packet_id: host-browser-mcp-ndjson-transport-policy
    release_target: forge-local-experts-milestone
    order: 779-dqsv
    status: ready
    desired_release: v0.5
    kind: fix
    pickup_role: linux
    priority: p2
    depends_on:
      - host-browser-mcp-compose-tool-families-in-dispatcher
    tags: [mcp, transport, concurrency, limits, v0.5]
    title: |
      NDJSON transport policy: a payload cap on the live path, and enough concurrency for the 16-call limit to be observable.
    context: |
      Two findings from the 616-nm7q scoping, both structural:
      (a) The live NDJSON path has NO payload cap — a base64 full-page
      screenshot travels as one unbounded line — while the retired McpFrame
      path's 4 MiB cap is the only limit in the tree.
      (b) 616-nm7q's "17th concurrent call is rejected" criterion is
      UNREACHABLE on today's transport: serve_mcp_connection is a strictly
      sequential `for line in BufReader::lines()` loop, so sixteen in-flight
      tools/calls cannot exist on one connection. The semaphore that
      implements the cap (browser-mcp server.rs:83) is per-connection, which
      only matches "per session" once the loop is concurrent.
      This child owns the socket shared with publish_local, so it is
      deliberately separated for its own review.
    exit_criteria:
      - |
          The live NDJSON path enforces a documented per-line cap, returning a typed JSON-RPC error instead of writing or accepting an unbounded line; the number's provenance (the retired MAX_MCP_FRAME_BYTES) is recorded.
      - |
          The lane loop handles requests concurrently enough that the 16-call semaphore is observable end-to-end, with a test that drives 17 concurrent tools/calls through the real transport and sees exactly one rejection — or, if concurrency is rejected as a design, the semaphore is removed and the limit re-expressed in terms the transport can actually enforce.
    events:
      - type: filed
        ts: "2026-08-16T22:15:00Z"
        agent_id: "linux-yoga-claude-20260816t185912z"
        host: linux-immutable
        summary: "Split child 2 of 616-nm7q; carries the unreachable-criterion finding."

  - packet_id: host-browser-mcp-nix-packaging-parity
    release_target: forge-local-experts-milestone
    order: 779-hae5
    status: ready
    desired_release: v0.5
    kind: fix
    pickup_role: linux
    depends_on:
