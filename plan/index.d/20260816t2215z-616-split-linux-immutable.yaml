    capability_tags: [nix, packaging]
    tags: [mcp, nix, packaging, forge, v0.5]
    title: |
      Nix forge image ships the MCP config overlay and socat (Fedora/Nix packaging parity).
    context: |
      flake.nix:180 binds forgeOpencode to images/default/opencode.json — a
      two-key schema/autoupdate stub — and flake.nix:307 copies only that to
      the forge's opencode config. Nothing installs config-overlay/opencode/
      config.json, config-overlay/mcp/, or config-overlay/claude/mcp.json,
      all of which the Fedora Containerfile:136-142,171 does install (and
      chmod +x). A Nix-built forge therefore has no host-browser MCP route.
      NOT IN THE ORIGINAL FINDING: `socat` is absent from the Nix image
      entirely (it comes from Containerfile.base:33 via dnf), so packaging
      the overlay alone still dies with `socat: command not found`.
      NOTE for pickup: `nix` is NOT installed on the yoga (linux_immutable)
      host — this child needs a Nix-capable host.
    exit_criteria:
      - |
          The Nix forge image installs the config-overlay opencode/mcp/claude files with the mcp scripts executable, mirroring the Fedora Containerfile, and includes socat in the image environment.
      - |
          Presence is asserted in the built x86_64 AND aarch64 .#forge-image outputs (the multiarch half of the original criterion).
