packets:
  - order: 864-hv2n
    packet_id: status-loss-gate-was-blind-to-packets-and-leaked-state-between-files
    desired_release: v0.5
    title: "the fragment-status-loss gate never scanned a real packet declaration and attributed statuses across file boundaries"
    status: completed
    kind: defect
    pickup_role: any
    priority: p0
    capability_tags: [plan, crdt, gates, ledger, fleet]
    deliverable: scripts/check-fragment-status-loss.sh
    depends_on: []
    estimated_hours: 3
    discovered_by: "864-r3wq — the gate refused a push over a packet the cycle never touched"
    context: >
      TWO FAULTS THAT CONCEALED EACH OTHER. The `declared` pass extracted
      (packet_id, status) pairs with:

        /^  - packet_id:/ { pid = $3; st = ""; next }
        /^    status:/    { if (pid != "" && st == "") { st = $2; print pid "\t" st; pid = "" } }

      BLIND. It treats `  - packet_id:` as the start of a packet. Fragments do
      not open a packet that way — the house style is `  - order:` followed by
      `    packet_id:`, which is what every fragment filed this month uses. The
      shape it DID match is the `  - packet_id:` entries under `events:`, the
      one section this pass is explicitly documented as ignoring. So the pass
      that exists to catch "a terminal status declared under `packets:` and
      silently discarded by the G-Set" had never once examined a packet
      declaration.

      NOISY. awk state is global and nothing reset `pid` between FILES. A
      fragment whose last `  - packet_id:` is an event — extremely common, since
      most fragments are pure event appends — leaves that id dangling into the
      next file, where the first `    status:` line is printed under it. The two
      fragments need not be related, share an author, or share a subject.

      HOW IT SURFACED. Filing 864-r3wq produced a fragment declaring
      `status: completed`. The alphabetically previous fragment ended on a
      dangling event for three-horizon-cycle-model-arrival-control-by-routing.
      The gate therefore refused the push with "three-horizon-...: declared
      'completed' in a fragment, folds as 'in_progress'" — naming a packet no
      fragment declares, whose status no one had touched, filed eight minutes
      earlier by a different concern. Two further pairs
      (headless-tray-tests-fail-on-macos, the-local-gate-is-slower-...) were
      misattributed the same way and had been reported as clean because their
      leaked status happened to match.

      WHY IT SURVIVED. Gate memoization (765-tkq2) means a plain `--check`
      short-circuits, so the earlier pushes this cycle never re-ran it. The
      first honest run is what refused. A gate that is usually skipped and
      wrong when it runs is worse than no gate: it is a coin flip that reads as
      an audit.

      AND FIXING IT BROKE A THIRD PASS, which is the part worth remembering.
      The misplaced-definition advisory (812-d45t) is computed early and printed
      late, so it survives only if the "nothing to examine" early exit lets
      execution through. It always did — because a packet definition misfiled
      under `events:` matched the BLIND awk, leaving `declared` non-empty. Once
      the awk correctly ignored `events:`, that advisory silently vanished: a
      gate lost its voice because a bug it had been leaning on was repaired.
      The early-exit guard now names `_misdef_seen` directly. The comment above
      that guard already warned about this exact class from 785-sqe6 and did not
      prevent the recurrence, because prose cannot enforce a dependency — only
      the condition can.
    exit_criteria: >
      (1) awk state resets per file; a dangling event id in one fragment can
      never be attributed a status from another. Pinned by a two-file fixture
      that FAILS pre-fix.
      (2) The pass sees the house key order (`  - order:` then
      `    packet_id:`), so a re-declared terminal status is actually caught.
      Pinned by a fixture that the pre-fix scanner reports as `0 checked`.
      (3) The misplaced-definition advisory no longer depends on another pass's
      output being incidentally non-empty.
      (4) All pre-existing scenarios still pass — 21/21.

