packets:
  - packet_id: containers-conf-routes-every-build-through-an-enclave-proxy-that-may-not-exist
    order: 892-pfnd
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      ~/.config/containers/containers.conf hardcodes http_proxy=http://proxy:3128 unconditionally, so when the enclave is down EVERY image build fails on DNS — and with it the release gate
    deliverable: |
      an image build either does not depend on a service that may be absent, or
      fails with a verdict naming the enclave proxy instead of a raw DNS error
    pickup_role: linux
    owner_host: any
    depends_on: []
    capability_tags:
      - podman
      - enclave
      - proxy
      - build-gate
      - fail-loud
      - release
    estimated_hours: 3
    context: |
      MEASURED on macuahuitl 2026-08-26T00:05Z, while trying to restore the host
      so it could run the release gate. This is the COMPLETE explanation of why
      `./build.sh --ci-full` is red here, and every link is verified rather than
      inferred.

      THE CHAIN:

        1. `tillandsias-proxy` is not running. Neither is `tillandsias-inference`.
           Both have been reported by cycle-preflight as `services-down`,
           `action=operator`, on at least two hosts (macuahuitl, pirria).

        2. ~/.config/containers/containers.conf:7 sets, for EVERY container:
             env = ["http_proxy=http://proxy:3128",
                    "https_proxy=http://proxy:3128", ...]
           `proxy` is the enclave's internal DNS name for that container.

        3. So `scripts/build-image.sh forge` dies at STEP 1/5:
             Error: creating build container: ... pinging container registry
             registry.fedoraproject.org: proxyconnect tcp: dial tcp:
             lookup proxy: no such host

        4. No forge image exists. `podman images` returns ZERO images on this
           host.

        5. SEVEN litmus specs then fail, all container-dependent:
             litmus:forge-gitconfig-bidirectional-quarantine
             litmus:forge-standard-gitconfig-path
             litmus:forge-config-trust-cross-platform-parity
             litmus:mirror-host-cert-and-sshd-shape
             litmus:mirror-sshd-posture-shape
             litmus:ssh-lane-sidecar-shape
             litmus:forge-runtime-ca-trust
           with 1992 other checks passing across 335 specs.

        6. `--ci-full` is therefore red, and the release runbook forbids tagging
           past a red gate. So the enclave being down blocks the release.

      THE KEY MEASUREMENT, because it distinguishes "no network" from "a
      configuration that requires a service that is absent":

        curl -o /dev/null -w '%{http_code}' https://registry.fedoraproject.org/v2/
          -> 200

      The registry is directly reachable. The proxy is not needed for
      CONNECTIVITY; it is required by CONFIGURATION. A host with a working
      network and a dead enclave cannot build an image, and nothing says why in
      those terms — the operator gets a DNS error about a hostname they have
      never heard of.

      WHY THIS IS NOT "JUST START THE ENCLAVE". The enclave being down is an
      operator-owned environment problem and is tracked as such. What this packet
      is about is that a DEPENDENCY THAT IS INVISIBLE UNTIL IT FAILS was written
      into the host's global container configuration, unconditionally and with no
      fallback and no diagnosis. The same host builds fine with the proxy
      running; nothing in the failure says "your enclave proxy is down", and the
      operator is left reading `lookup proxy: no such host` about a name that
      only means something inside the enclave.

      DELIBERATELY NOT DONE: unsetting or bypassing the proxy to make the gate
      pass. The enclave proxy exists for egress control (forge-offline), and
      removing it to unblock a release is the same class of move as editing a
      gate to make one's own release pass — refused on the same grounds. If the
      proxy should be optional when the enclave is down, that is a deliberate
      posture decision and an operator's to make, not a side effect of someone
      wanting to ship.
    outcome: |
      An image build on a host with a dead enclave either succeeds or says which
      service is missing, and a release-gating host can tell the difference
      between "no network" and "no enclave".
    exit_criteria:
      - 'A build attempted with the enclave down emits a verdict NAMING the enclave proxy and the remedy, rather than a raw DNS error about an internal hostname. Demonstrated by stopping the proxy, not argued.'
      - 'A decision is recorded on whether the proxy is REQUIRED (build refuses early with a named verdict) or OPTIONAL when the enclave is absent (build falls back to direct egress). Either is acceptable; the current state — required by accident, undiagnosed on failure — is not.'
      - 'NEGATIVE CONTROL: with the enclave UP, builds continue to route through the proxy exactly as today. A fix that quietly stops using the proxy has changed the egress posture and is refused.'
      - 'The seven container-dependent litmus specs report a NAMED environment skip rather than a failure when the substrate is absent — the 888-miiy treatment, applied to the same class one layer out.'
    verifiable_closure: |
      On a host with no enclave, `scripts/build-image.sh forge` produces a
      verdict naming the proxy; with the enclave running, the build succeeds
      through the proxy unchanged.
    notes: |
      888-miiy is the same shape one layer in: a check that reds the release gate
      for an environmental capability it never declares. That packet fixed the
      groundtruth harness (verified on this host tonight — an absent index now
      SKIPS LOUDLY and counted, a stale one is still a HARNESS ERROR, and a wrong
      answer is still RED). These seven specs are the next instance, and the fix
      should follow the same rule: a host that genuinely lacks the capability
      gets a named skip; a host that HAS it and gets a wrong answer still goes
      red.

      Note the interaction with 747-knbp: build-image.sh tags from the VERSION
      file while the launcher resolves by the installed binary's version. On a
      host where they agree this is invisible; whoever fixes the proxy path
      should not also introduce a skew.
    events:
      - type: filed
        ts: "2026-08-26T00:05:00Z"
        agent_id: linux-macuahuitl-fable5-20260825t224835z
        host: macuahuitl
        summary: |
          Found by the coordinator while trying to restore this host so it could
          gate an operator-directed release. Every link measured: proxy absent,
          containers.conf line read, build failure captured verbatim, zero images
          confirmed, seven failing specs enumerated, and the registry proven
          directly reachable at HTTP 200 so the proxy is a configuration
          requirement rather than a connectivity one.
