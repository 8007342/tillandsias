        Filed from an esmeraldinha finding relayed by the operator: at a 4-hour
        cadence the low-end Windows host still spends a large fraction of every
        cycle merging and rebuilding, and much of that is staying current for
        its own sake rather than for anything the cycle needed.

        Recorded alongside it, because the two are one idea: methodology now
        names side_branch_for_cost_constrained_hosts. The mechanism already
        existed and nobody had written it down — the pre-push merge gate
        matches exactly refs/heads/osx-next and refs/heads/windows-next, so a
        `<platform>-side-<feature>` branch is ALREADY ungated and pays the
        merge once at promotion instead of once per cycle. esmeraldinha reached
        for that shape on its own; the methodology just had not caught up.
