    title: |
      The pre-push gate inside tillandsias-build survives WSL interop loss: resolve_plan_binary learns CARGO_TARGET_DIR candidates so the probe never depends solely on Windows-exe interop.
    context: |
      Measured live 2026-08-16 ~21:00-21:30Z (windows/Yolanda): four
      consecutive `./build.sh --check` runs went red at
      check-fragment-status-loss with "tillandsias-plan not built" while the
      same check passed standalone in Git Bash. Root cause: the gate re-execs
      inside the tillandsias-build WSL2 distro, where WSL interop had died
      (Windows-exe exec = 126; /proc/sys/fs/binfmt_misc/WSLInterop gone —
      likeliest killer: concurrent runtime-distro churn from the operator's
      stress test; the WSL2 utility VM's binfmt table is shared across
      distros). With interop dead the probe has NO live candidate: the
      in-tree .exe cannot exec, no in-tree Linux binary exists (the wrapper
      deliberately uses a distro-native CARGO_TARGET_DIR), and
      /root/.local/bin is login-shell-only PATH. The only trunk-protection
      gate stays red for as long as interop is down. Full forensics:
      plan/issues/enhancement/wsl2-gate-plan-probe-interop-single-point-of-failure-2026-08-16.md.
    exit_criteria:
      - |
          resolve_plan_binary (scripts/plan-binary-probe.sh) includes $CARGO_TARGET_DIR/release and $CARGO_TARGET_DIR/debug tillandsias-plan candidates (execution-probed, same as every other candidate), mirroring resolve_target_binary's CARGO_TARGET_DIR handling (770-ifeg).
      - |
          scripts/with-wsl2-builder.sh ensures a distro-native tillandsias-plan exists before re-exec (idempotent cargo build) or exports TILLANDSIAS_PLAN_BIN to one, so a gate run inside the distro never depends on Windows-exe interop.
      - |
          A fixture pins the interop-dead shape: with an exec-format-failing .exe candidate and a valid CARGO_TARGET_DIR candidate, the probe resolves the latter; with NO live candidate the failure verdict names the dead candidates rather than only "not built".
