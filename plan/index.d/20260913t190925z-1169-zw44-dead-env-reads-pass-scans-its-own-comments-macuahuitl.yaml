    title: |
      check-dead-env-branches: the reads pass scans the detector's own comments, so a variable it names can never be cleared
    context: |
      A knob to design, not a line to delete: the script deliberately excludes itself from the comment/doc pass (so it cannot immunize its own findings) but its reads pass has no such exclusion, so a variable merely QUOTED in its own explanatory comments is re-extracted as a live read forever. The two exclusions must be made consistent -- self-quotes should count as neither documentation nor a read -- which is a design decision about the detector's self-reference, plus a self-test arm.

