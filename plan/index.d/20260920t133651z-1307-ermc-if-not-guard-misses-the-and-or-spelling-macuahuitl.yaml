    title: |
      the if-not pipeline guard catches `if ! pipeline` and not `pipeline && ok || bad`, the same SIGPIPE inversion in the spelling the salvage-audit fixture uses throughout
    context: |
      795-imz3's guard exists because pipefail plus SIGPIPE inverts a
      `grep -q` verdict when the producer is still writing; it names the
      `if ! <pipeline>` spelling and its remedy (capture the exit first, or
      `# sigpipe-ok`). The and-or spelling is the same inversion: under
      pipefail the pipeline's status is 141 with the match present, `&& ok`
      is skipped and `|| bad` fires. A guard that catches one spelling of the
      defect it was written for is the shape this milestone keeps finding
      (1301-ie39 for the no-python policy the same day). The gate refused a
      relay on the `elif !` form at 13:0xZ and passed the fixture that flakes
      on the and-or form in the same hour. Floor-tier: a text check over
      scripts/, runs in a second on any host.
