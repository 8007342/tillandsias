      WHAT THE ISSUE PREDICTED, AND WHAT ACTUALLY HAPPENED. It named two risks:
      claim expiry laundering finished work into lost work, and growing merge
      debt. Both assumed the bits would still be there. The bits were the
      fragile thing. Three cycles verified the 17 paths byte-identical to their
      boundary snapshots and correctly refused to touch them; the boundary guard
      did its job perfectly and protected a directory that someone then deleted
      wholesale. A guard that forbids the agent from touching the work does not
      forbid anything else from touching it.

      642-fedr and 776-cm74 are both still `in_progress` and both appear in
      this cycle's stranded sweep (population=3 stranded=2). Their claims and
      the DO-NOT-RE-IMPLEMENT note events now point at work that does not exist,
      which is worse than a stale claim: the next host to read them will hold
      off re-implementing on the strength of a promise nothing can keep.
