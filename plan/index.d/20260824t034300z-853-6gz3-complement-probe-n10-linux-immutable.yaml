      summary: >
        THE COMPLEMENT PROBE AT n=10 PER MODEL, and it reverses a retraction I
        made yesterday. Five passage/question pairs — each with a passage that
        DOES answer and one that does NOT — both framings, temperature 0:

          qwen2.5:0.5b   sound 5   contradiction 4   inverted 1   (of 10)
          qwen2.5:7b     sound 0   contradiction 9   inverted 1   (of 10)

        THE PROBE DOES DISCRIMINATE, and 7B IS STRICTLY WORSE. Not an artefact
        of truncation: given 40 tokens of room instead of 6, 7B still emits a
        bare [NO] with eval_count=2 to BOTH "does this answer X" and "is this
        MISSING the answer to X".

        THE FAILURE MODE IS SPECIFIC AND SHARED. On the passages that do NOT
        answer, both models say NO to "is the passage MISSING the answer?" —
        they are not processing the negation, they are answering something like
        "is this passage about X". 0.5B at least gets the affirmative framing
        right on all five; 7B gets nothing right.

        THIS AGREES WITH THE FLEET'S OTHER MEASUREMENT rather than contradicting
        it. macuahuitl's Tier B caught 17 self-contradictions in 73 questions
        using this same qwen2.5:7b — the complement pair working AS A DETECTOR
        of an unsound judge. What I measured is the same phenomenon at a higher
        rate. And 824-6qxh independently found bigger EMBEDDERS make separation
        monotonically worse (137M 0.2058 -> 567M 0.2513 -> 4B 0.2744). Two
        different components, two hosts, same direction: in this system, bigger
        is not better.

        MY OWN TRACK RECORD ON THIS QUESTION, recorded because the pattern is
        the lesson:
          cycle 5  0.5B vs 3.8B, ONE pair  -> "bigger is worse, there is a cliff"
          cycle 6  added 7B, ONE pair      -> "no cliff; the probe cannot discriminate"
                                              and I RETRACTED "bigger is worse"
          cycle 7  five pairs, n=10        -> the probe discriminates; bigger IS
                                              worse; the retraction was wrong
        Three claims from an instrument I had never characterised. Each reversal
        came from adding samples, which cost eight minutes at 0.5B and fourteen
        at 7B — less than any one of the cycles spent reasoning about the
        one-pair result. THE FIX WAS ALWAYS n, AND I SHOULD HAVE SPENT IT FIRST.

        WHAT THIS IS AND IS NOT. It is evidence that the bare two-framing
        complement is a poor judging protocol on this tier, and that scaling the
        judge makes it worse rather than better. It is NOT a claim about
        853-6gz3's layer, which uses a harness this probe does not replicate:
        five pairs, one framing template, one temperature, two models from one
        family. The actionable read for the design is that the NEGATED framing
        is the weak half — if a complement is wanted, an alternative phrasing
        that does not rely on the model handling "MISSING" should be measured
        before the mechanism is judged.
