packets:

  - packet_id: gate-stamp-refuses-deleted-worktree-entries
    order: 695-nvnd
    status: ready
    desired_release: v0.5
    priority: p2
    title: "gate-stamp refuses any worktree containing deletions, so every compacting cycle pays the slowest gate twice"
    kind: optimization
    deliverable: gate-stamp accepts deleted tracked entries, with a negative control that modifications are still refused
    depends_on: []
    pickup_role: any
    capability_tags: [tooling, gate, compaction, cycle-time]
    estimated_hours: 2
    context: >
      Captured live during a macOS meta-orchestration cycle 2026-08-12.
      `tillandsias-plan compact` deletes the fragments it folded — that IS
      compaction — and `scripts/gate-stamp.sh write` has no case for a deleted
      worktree entry, so it emits
      `gate-stamp: unsupported worktree entry: plan/index.d/<folded>.yaml` and
      `stale:cannot-write-stamp` on a tree where every gate check just PASSED.
      The pre-push hook requires a stamp for the exact tree being pushed, so a
      compacting cycle is forced to run `./build.sh --check` twice: once before
      the commit (green, no stamp) and again after (green, stamped). On this host
      that check is the single slowest step in the cycle — the `timing:` metric
      exists to surface exactly this — so the cycle's dominant cost roughly
      doubles whenever the ledger is due for GC, which is routine.
      Secondary cost: a fully green gate ends with a warning that reads as
      flakiness, and the only thing that works (re-run it) is unexplained on
      screen.
      Full write-up:
      plan/issues/optimization-gate-stamp-refuses-deleted-worktree-entries-2026-08-12.md
    outcome: >
      A cycle that compacts the ledger pays the gate once, and the stamp still
      refuses trees whose checked content actually changed.
    exit_criteria:
      - "gate-stamp write succeeds on a worktree whose only dirt is deleted tracked files, and the pre-push hook accepts the resulting stamp"
      - "a NEGATIVE CONTROL asserts a worktree with a MODIFIED tracked file is still refused, so the fix cannot degrade into stamping anything"
      - "a compacting cycle is demonstrated running the full gate exactly once"
    events:
      - type: filed
        ts: "2026-08-12T00:51:54Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260812t005154z
        host: macos
        summary: >
          Reduction-Engine capture of a self-inflicted slowdown observed this
          cycle. Filed with the two wrong fixes named up front: do not skip
          compaction, and do not stamp before the deletions.
