    title: |
      the project records no openspec CLI version: every forge launch backgrounds `npm install -g @fission-ai/openspec@latest` into the SAME per-project prefix its foreground `require_openspec` + `openspec init` use, and no step ever moves the committed generated set forward deliberately — so trunk carries three generator versions and each release first surfaces as launch dirt
    context: |
      OPERATOR, 2026-09-27, verbatim: "The orchestrator running meta-orchestration
      should be updating OpenSpec every now and then, when there're updates. So in
      theory any fresh forge checkouts SHOULD NOT see this dirty refresh, as their
      openspec checkouts should match the project's own. Looks like an npm install
      openspec might be colliding with the project's own installed openspec. Please
      investigate and file the ./plan packet and specs for the correct configs, and
      have them implemented as well."
      MEASURED (macuahuitl-forge, 2026-09-27):
      - The collision is forge-internal. Every entrypoint backgrounds
        ensure_forge_harnesses (npm install -g "$pkg@latest", openspec included)
        before clone, then foreground require_openspec + openspec init use the
        same NPM_CONFIG_PREFIX (~/.cache/tillandsias-project/npm/global). Host
        evidence (macuahuitl-fedora): no openspec on the host or in the builder
        toolbox. Legacy channels $CACHE/openspec/bin and /home/forge/.tools/openspec
        are still named in PATH/docs but are absent on disk.
      - Nothing records the version: trunk's generated sets are .claude 1.13.1,
        .opencode 1.13.2, .codex/.github 1.3.1. Every chore(opsx) sync since
        2026-08-17 (aa167d939 .. 64cceb25d) was launch dirt committed by the
        order-540 step, not a deliberate update.
      - A deliberate `openspec update` at 1.13.2 produces files BYTE-IDENTICAL to
        the 18-file launch dirt (0 of 18 differ), so a pinned, deliberately
        regenerated tree is exactly what a forge at that version would write.
      - `openspec update` output depends on the per-machine global profile
        ($XDG_CONFIG_HOME/openspec/config.json); from an empty config it derives
        a custom profile from the committed workflows ("Migrated: custom profile
        with 11 workflows"), so a bump must run with an isolated config.
      - 1.13.2 moves codex skills to .agents/skills and leaves the 11 .codex
        copies stale ("Left 11 files in .codex/ that differ from the copy in
        .agents/"); a bump must report orphans rather than silently keep them.
      - A bare `openspec init` in a checkout sets up EVERY tool it detects,
        including Gemini, whose .gemini/skills symlink points at the canonical
        skills/ tree, so it writes 11 openspec-* dirs into skills/ (measured by
        accident in the main checkout, reverted).
      Coordinator (macuahuitl-fedora) direction: own order stacked on
      work/1440-w8g8; keep it to the pin file, install-the-pin, and the
      coordinator bump step; the regeneration commit that re-levels the trees is
      SEPARATE and made by the new step itself, so the step is proven by use.
      Related: 1253-nmmy (alias-tree version skew; this supplies its "version
      recorded somewhere a gate can read").
    exit_criteria:
