      p1 (bash-lane exec-wire wedge — the tractable unblock of blocked 349),
      657-s6g8 p1 (metal-sidecar-bringup), 663-acdw p1 + 663-69kp p2 (the
      boot-hang pair the macOS host parked after 6 attempts). So the macOS
      queue is NOT converged. Most likely causes, in order: (1) the macOS
      host's LOCAL osx-next is behind the merged state its selector reads
      (it last authored 5d74786d at 20:37 local, merged linux at 21:39, idle
      ~2h since) — pull/re-run the selector; (2) the macOS selector
      under-filters (e.g. treats parked/attempted 663 + hardware-gated 657
