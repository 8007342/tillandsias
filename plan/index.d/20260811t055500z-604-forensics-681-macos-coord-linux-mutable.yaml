      REMAINING tractable ones — 635-kagg, 606-r42f, 421, 155 — should
      surface); (3) a regression of the 627-53gu bash-3.2/yq selector class.
      This needs the macОС host to capture its OWN `select-work-batch macos`
      + `plan next macos` output so linux can compare — a false "no work"
      idles a host that has a p1 (635-kagg) that unblocks a blocked p0-path.
