packets:
  - packet_id: credential-lifecycle-audit-milestone
    order: 590-z3jh
    desired_release: v0.5
    title: "MILESTONE: every credential audited at RUNTIME — none reaches a forge, none at container creation"
    status: ready
    kind: milestone
    deliverable: plan/index.yaml (criteria holder; children carry the work)
    depends_on: []
    pickup_role: any
    capability_tags: [milestone, security, credentials, audit, provenance]
    estimated_hours: 0
    outcome: >
      OPERATOR DIRECTIVE 2026-08-01: "file ./plan packets for all agents to
      individually audit and validate the tokens lifecycle, never making it into
      the forge, nor at container creation."
      THE RULE THIS MILESTONE ENFORCES. Development config and runtime config are
      different lifecycles and must not overlap. A credential may exist where an
      image is BUILT, on a development host. It may not exist in a disposable lane
      a user launches, and it may not be baked in at container creation.
      WHY EACH CHILD MUST VERIFY AT RUNTIME, NOT BY READING SOURCE. This project's
      named recurring failure is "verified where it was written is not verified
      where it runs", and it has bitten repeatedly in exactly this area: a unit
      test asserted a token injection EXISTED while its own name claimed "never
      argv"; litmus:credential-isolation runs against a FAKE podman backend and
      asserts nothing about a real lane; litmus:environment-isolation inspects the
      IMAGE env with no launch args, so every injected variable is structurally
      invisible to it. No test anywhere inspected a launched lane's environment
      until this milestone. Every child therefore closes on evidence from a
      RUNNING container — podman inspect, /proc/<pid>/environ, ls -l
      /run/secrets — never on a grep of the source that produced it.
      THE ONE COMMAND EVERY AUDIT SHARES, so results are comparable:
      podman inspect <lane> --format '{{range .Config.Env}}{{println .}}{{end}}'
      plus a check of .Config.CreateCommand, which retains the full podman argv
      for the container's lifetime and is where --env VALUES come to rest.
    exit_criteria:
      - "every credential in the system has a child packet with a runtime-verified verdict"
      - "no credential appears in any forge lane's Config.Env or Config.CreateCommand"
      - "each child states its evidence as a command an operator can re-run, not as a source citation"

  - packet_id: audit-github-token-lifecycle
    order: 590-4u7a
    desired_release: v0.5
    release_target: credential-lifecycle-audit-milestone
    title: "AUDIT: the GitHub token — prove it reaches the git mirror only, and never a forge lane"
    status: ready
    kind: verification
    deliverable: runtime audit record + litmus asserting a launched lane's env
    depends_on: []
    pickup_role: linux
    capability_tags: [security, credentials, audit, git-mirror, forge]
    estimated_hours: 3
    outcome: >
      THE CREDENTIAL: vault path secret/github/token.
      EXPECTED LIFECYCLE, to be CONFIRMED rather than assumed. Stored in Vault.
      Read by the tray on the development host for gh login and remote-project
      flows. Read by the GIT MIRROR container via
      images/git/git-credential-tillandsias.sh, which fetches it at call time and
      writes it to a credential helper's stdout — never an env var, never argv.
      The forge pushes to the mirror with NO credential; the mirror pushes
      upstream. That is the broker pattern and it predates this audit.
      WHAT CHANGED 2026-08-01: order 359 injected this token into EVERY forge lane
      as HOMEBREW_GITHUB_API_TOKEN for brew attestation. That was reversed in
      commit 82160687. This packet proves the reversal holds at runtime and keeps
      holding.
      AUDIT THE MIRROR TOO, not just the forge. The mirror legitimately holds the
      credential, so verify HOW: confirm it is absent from the mirror's
      Config.Env and Config.CreateCommand, and present only transiently in the
      credential helper's process. A legitimate holder using an illegitimate
      transport is still a finding.
      ALSO CONFIRM the forge's own vault policy still cannot read the path
      (images/vault/policies/forge.hcl must not grant github/token), so a
      compromised lane cannot fetch what it is no longer handed.
    exit_criteria:
      - "a LAUNCHED forge lane shows no github token in Config.Env, Config.CreateCommand, or /proc/1/environ — evidence pasted, not summarised"
      - "the git mirror holds it only via the credential helper: absent from its Config.Env and CreateCommand"
      - "forge.hcl grants no read on secret/github/token, verified against the running vault, not the file alone"
      - "a litmus inspects a REAL launched lane, closing the gap that litmus:credential-isolation left by using a fake podman backend"

  - packet_id: audit-llm-provider-key-lifecycle
    order: 590-mtgn
    desired_release: v0.5
    release_target: credential-lifecycle-audit-milestone
    title: "AUDIT: the LLM provider keys still travel the bad seam — env injection puts them in podman argv"
    status: ready
    kind: verification
    deliverable: runtime audit record + a decision on moving them to the secret/broker pattern
    depends_on: []
    pickup_role: linux
    capability_tags: [security, credentials, audit, forge, llm]
    estimated_hours: 4
    outcome: >
      THE CREDENTIALS: secret/claude/oauth, secret/codex/oauth,
      secret/antigravity/oauth (ProviderId::vault_path, main.rs:7030-7036).
      THIS IS THE UNFINISHED HALF. Removing the GitHub token from forge lanes did
      NOT touch these. They still reach a lane through spec.env(), which
      ContainerSpec::build_run_args (container_spec.rs:331) turns into
      `--env KEY=VALUE` — an argv element of podman run, readable from
      /proc/<pid>/cmdline, and RETAINED IN Config.CreateCommand for the
      container's lifetime. The entrypoint cannot unset that; no amount of
      in-container scrubbing reaches it.
      THE HONEST COMPLICATION, which must be stated in the deliverable rather than
      discovered later: a forge lane runs as uid 1000 and so does the agent. A
      podman secret mounted 0400 owned by uid 1000 is READABLE BY THE AGENT. So
      moving to --secret genuinely removes the value from argv and from the
      container config — a real improvement — but it does NOT isolate the key from
      the agent that needs it. Do not claim otherwise.
      AND THE HARDER QUESTION UNDERNEATH: unlike the GitHub token, these keys are
      needed BY the agent, so the broker pattern does not obviously apply — you
      cannot hand an agent "capability to be an LLM client" without the key. Say
      whether a broker is possible here or whether argv-removal is the honest
      ceiling.
    exit_criteria:
      - "a LAUNCHED lane's Config.CreateCommand is inspected and every provider key found there is listed with its variable name"
      - "a decision is recorded: move to --secret, build a broker, or accept with a stated reason — no silent status quo"
      - "if --secret is chosen, a test proves the value is absent from Config.CreateCommand, and the deliverable states plainly that the agent can still read the file"

  - packet_id: audit-vault-token-and-approle-lifecycle
    order: 590-3hsa
    desired_release: v0.5
    release_target: credential-lifecycle-audit-milestone
    title: "AUDIT: the Vault token and AppRole — the pattern we hold up as correct, checked at runtime"
    status: ready
    kind: verification
    deliverable: runtime audit record + audit-durability fix
    depends_on: []
    pickup_role: linux
    capability_tags: [security, credentials, audit, vault]
    estimated_hours: 4
    outcome: >
      THE CREDENTIALS: the git mirror's Vault token and its AppRole document,
      delivered as podman secrets (GIT_VAULT_TOKEN_SECRET_OPTS and
      GIT_VAULT_APPROLE_SECRET_OPTS, main.rs:2829 and :2838) as 0400 files under
      /run/secrets.
      THIS IS THE PATTERN THE OTHER AUDITS ARE MEASURED AGAINST, which is exactly
      why it must be verified rather than assumed correct. Its own comment states
      the intent: the bootstrap copies each value to a mode-0400 tmpfs file
      "without putting either value in argv or the environment". Confirm that is
      true of the RUNNING container.
      A SEPARATE AND SERIOUS FINDING TO CLOSE HERE: vault's file audit device
      writes to /vault/audit/audit.json (images/vault/entrypoint.sh:224), and
      /vault/audit is NOT a mounted volume — verified, the destination does not
      appear in the container's Mounts. Every audit record therefore dies on
      recreate, including on the destructive reset the release smoke performs.
      Any future claim that a credential is "audited" is false until this is
      fixed, and short-TTL minted tokens without durable audit give the
      APPEARANCE of a trail rather than a trail. HashiCorp additionally
      recommends two audit devices, because with a single device Vault REFUSES
      requests it cannot log — so a full disk becomes an outage.
    exit_criteria:
      - "the mirror's Vault token and AppRole are confirmed absent from Config.Env and Config.CreateCommand on a RUNNING container"
      - "/run/secrets files are confirmed 0400 and owned as intended, from inside the running container"
      - "the audit device writes to a persistent volume and survives a container recreate, proven by recreating and reading prior records"
      - "the single-audit-device outage risk is either mitigated with a second device or accepted with a recorded reason"

  - packet_id: audit-no-credential-at-image-build
    order: 590-pce8
    desired_release: v0.5
    release_target: credential-lifecycle-audit-milestone
    title: "AUDIT: no credential is consumed at image build — not as ARG, not as a build secret, not via a helper"
    status: ready
    kind: verification
    deliverable: build-time audit record + litmus over every Containerfile and build script
    depends_on: []
    pickup_role: linux
    capability_tags: [security, credentials, audit, containers, build]
    estimated_hours: 3
    outcome: >
      OPERATOR DIRECTIVE, the strictest clause: "There is no github token
      available during forge creation at any point... do not build it into the
      forge anywhere, not even during container creation."
      This closes the tier the other audits do not cover. A credential absent from
      a RUNNING container can still have been present while the IMAGE was built —
      baked into a layer, passed as ARG (which persists in image history), or
      handed to a helper the Containerfile invokes. That would satisfy every
      runtime audit while violating the directive.
      AUDIT: every images/*/Containerfile* for ARG or ENV carrying a credential,
      any --secret or --mount=type=secret in the build, any script invoked during
      build that reads Vault or the environment, and the image HISTORY (podman
      history) for a layer containing a credential.
      NOTE THE ONE LEGITIMATE CASE and do not flag it wrongly: the DEVELOPMENT
      HOST may hold credentials for its own purposes (the operator's gh login,
      pushing releases). The rule is about what enters the IMAGE and the
      CONTAINER, not about what exists on a developer's machine.
      This audit also fixes a real risk introduced by good intentions: a proposal
      to "bake attested tools at build time using the dev host's token" was
      considered and REJECTED by the operator. A future agent may re-derive that
      idea as an optimisation; this packet is the guard that catches it.
    exit_criteria:
      - "no Containerfile passes a credential via ARG, ENV, or a build secret, verified across every images/*/Containerfile*"
      - "podman history on each shipped image shows no layer carrying a credential"
      - "a litmus fails if a build secret or credential-bearing ARG is added to any Containerfile"
      - "the development-host exception is stated so the audit does not produce false positives against the operator's own tooling"
