packets:

  - packet_id: on-demand-subject-experts
    order: 707-t3mz
    status: ready
    desired_release: v0.6
    release_target: forge-local-experts-milestone
    priority: p1
    title: "INITIATIVE: On-Demand-Subject-Experts — auto-pull official docs for any technology/best-practice a project uses and stand up a cited, quotable RAG+semantic expert"
    kind: milestone
    deliverable: a phased build (children 707-tiqw/gm3q/kk8u + later rungs) toward experts for any tech a project depends on
    depends_on: []
    pickup_role: linux
    capability_tags: [experts, rag, semantic, cheatsheets, docs, inference, forge, milestone]
    context: >
      OPERATOR VISION (The Tlatoani, 2026-08-12): when a project depends on a
      technology (Rust, Podman, WSL, Bash, JS...) or a best-practice domain
      (A+ Promises, Reactive Streams, IoC, Builders, Factories, DI...), the
      forge should on demand (1) search online for the OFFICIAL docs, (2) pull
      them OFFLINE into the cache layer, (3) summarize / extract cheatsheets
      sized to the doc, (4) build a small RAG expert with a thin SEMANTIC layer
      that gives QUOTABLE, CITED answers — the same "hard quote to a real span"
      the methodology already demands, so a doc-quote answer IS a verifiable
      litmus (it all goes full circle). Experts must be discoverable+affordable
      via forge affordances ("what's next?"). Keep RAG small, semantic layer
      thin. The little models (project-info, qwen2.5:0.5b) answer near-instantly
      with negligible perf hit even under the new semantic layer, so much more
      inference moves into the host.
      KEY DESIGN FINDING (fan-out 2026-08-12): the machinery is ALREADY generic.
      BUILD ON, never rewrite: (a) Antigravity/Gemini's semantic_expert.rs
      (order 706-f7mq) — SemanticSectionProvider trait + SemanticExplainer::
      explain_query<P> (generic over provider; bounded local-Ollama synthesis;
      empty-model -> raw cited section; miss -> None, no hallucination);
      (b) spec.rs RAG kernel (chunk_corpus/cosine/top_k/build_envelope, corpus
      map at spec.rs:64 kept as DATA so a new corpus is one row); (c) answer.rs
      cited Envelope/Citation/Confidence::Retrieved/verify() — the quotable
      contract every expert emits. A NEW subject expert = ONE CORPUS_ROOTS row
      + one CitationKind::Doc + one license-allowlist row + (once) a provider
      registry lift of the single hardcoded seam at answer.rs:693-704. Also
      reuse Antigravity's lease-aware selector (706-ddw6) + CLI telemetry
      (706-jmi7). Does NOT duplicate 400 (code-spec-cheatsheet-expert), 457
      (cheatsheet-expert-rung1), 519 (model-lifecycle-mcp) — it composes them.
      PHASED PLAN (children filed at low-controversy rungs; later rungs pend the
      open questions below): P0 707-tiqw cheatsheet-domain cited answers (v0.5,
      no new corpus); P1 707-gm3q CitationKind::Doc + Podman pilot (Apache-2.0);
      P2 707-kk8u provider registry / domain dispatch; then (to file after the
      operator rulings) P3 standards-backed best-practice expert (A+ Promises /
      Reactive Streams), P4 manifest auto-detect (detect.rs -> pull), P5
      ephemerality/tier-matrix for pulled corpora, P6 auto-pull ANY named tech.
      OPEN QUESTIONS FOR THE OPERATOR (shape the later rungs, recorded here):
      (1) summarize-vs-RAG size threshold (Modelfile/cheatsheet for small like
      the A+ Promises spec vs chunk+embed RAG for large like full Rust std) —
      order 393 mandates a per-corpus no-training technique but no byte cutoff;
      (2) LICENSE policy for pulling official docs offline (bundled Apache/MIT/
      standards-body vs attribute-only vs do-not-bundle -> pull-on-demand; who
      signs off a new license-allowlist.toml domain); (3) authority-fuzzy
      best-practice domains (generic IoC/Factories/DI resolve only to community
      essays = derived authority, which the provenance rule rejects as citable
      — admit as labeled-derived, or defer to standards-backed only);
      (4) model tier for synthesis (keep 0.5b host-local for all, or route
      fat-corpus synthesis to the GPU tier); (5) auto-detect granularity (pull
      every declared dep, top-N, or only README-required).
    exit_criteria:
      - "children 707-tiqw (P0), 707-gm3q (P1), 707-kk8u (P2) verified through the ladder; the burndown records each rung against this milestone"
      - "the five operator open questions are resolved (recorded in methodology/provenance.yaml + a decision note) and the later rungs (P3-P6) filed from the answers"
      - "an in-forge agent can ask a cited-quote question of at least one PULLED external tech corpus (Podman) and get a verifiable answer, proving the full-circle doc-quote-as-litmus property"
    events:
      - type: filed
        ts: "2026-08-12T19:00:44Z"
