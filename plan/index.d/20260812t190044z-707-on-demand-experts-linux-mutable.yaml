    kind: feat
    deliverable: a provider registry replacing the hardcoded answer.rs:693-704 seam, routing a query to the provider matching its domain/capability_tag
    depends_on: [citationkind-doc-and-podman-pilot-expert]
    pickup_role: linux
    capability_tags: [experts, rag, semantic, mcp, rust]
    context: >
      The ONLY structural code change to Antigravity's seam — a lift, not a
