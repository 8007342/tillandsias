      summary: |
        EVERY FILE CLASS UNDER A CORPUS ROOT NOW HAS A DECISION.
        `tillandsias-plan corpus-coverage` -> ok:corpus-coverage:32 class(es),
        0 unclassified.

        The packet asked for "either a boundary rule per remaining file class,
        or a recorded decision that the class is not worth retrieving — the
        point is that the gap stops being invisible". Both halves are here, and
        the second one is the durable half.

        INDEXED, added to CORPUS_CODE_EXTS. Every one already lived INSIDE a
        code root and was excluded by nothing but the extension list, which is
        exactly what made the gap invisible: walk_files returns "no files
        matched" for a class deliberately declined AND for one nobody ever
        considered, and those two silences are identical.
          ps1   61 chunks — the whole Windows build and install surface
                (install-windows.ps1, build-windows-tray.ps1). 803-su4n indexed
                code because the questions costing the most hours were code
                questions; Windows questions are code questions, and the
                rejoin plan has Windows coming back. Its chunking works by an
                accident worth naming: code_boundary's shell branch already
                accepts `function name`, which is PowerShell's exact syntax.
          hcl   14 — the Vault policy set, the only place "what is this role
                actually allowed to do" is written.
          te/fc/if/cil  6 — SELinux policy, the third class this packet named
                by hand. Same argument as hcl.
          fish  20 — shell helpers beside their .sh siblings; excluding them
                was an accident of the extension list, not a decision.

        Neither hcl nor the SELinux set gets boundary detection — `path "x" {`
        matches neither the Rust nor the shell rule — so each becomes ONE span
        subdivided by the character budget landed in 797-qv4z. Imperfect and
        still strictly better than absent: bounded, retrievable, and honest
        about its source file. Worth noting the ordering: this change would
        have been unsafe a day ago, because an unbounded HCL span is exactly
        the shape that used to be silently truncated at 6000 characters.

        DECLINED, with the reason recorded in CORPUS_DECLINED rather than in a
        commit message nobody greps: toml (dependency pins and locale tables
        that ship in zero artifacts), json (structured config with no prose —
        the script that WRITES .mcp.json is indexed), txt (registries, one entry
        per line; embedding a list yields a vector that means nothing, and these
        need referential-integrity gates, which capabilities.txt already has),
        the art and icon formats, the Apple/Windows capability plists (machine
        echoes of prose that is indexed), the single-file config fragments, and
        four SINGLE-FILE LANGUAGES (awk, c, js, rb) with the reversal condition
        stated: if a second file appears, revisit.

        THE VISIBILITY HALF. `corpus-coverage` walks every corpus root and
        classifies each extension indexed / declined / UNCLASSIFIED, wired into
        ./build.sh --check as an ADVISORY beside check-carry-forward.sh. It is
        advisory on purpose: a new file class is news, not a build break, and
        redding the gate the first time someone adds a .lock is how a check gets
        switched off.

        NON-VACUITY: dropping scripts/mutation-probe.zz into the tree turns the
        verdict into `advisory:corpus-coverage:1 class(es) NEITHER indexed NOR
        declined — .zz(1)`; removing it returns `0 unclassified`. Since the
        check is advisory the exit code does not move, so the LINE is the
        signal, and that is what was mutation-tested.

        TWO THINGS THE FIRST DRAFT GOT WRONG, both caught by running it:
          * It reported 40 "classes", most of them noise — Path::extension reads
            a dotfile's whole name as an extension (.zshrc, .gitkeep) and reads
            the tail of a dotted extension-less binary as one
            (tillandsias-headless-x86_64-unknown-linux-musl -> .musl). Real
            signal was buried under 18 phantom classes. Fixed by skipping
            dotfiles and hyphenated pseudo-extensions; extension-less corpus
            members are handled by CORPUS_CODE_FILENAMES, an exact-name list.
          * I appended the new function to the END of spec.rs, which put it
            AFTER `mod tests` — clippy's `items after a test module`. cargo test
            passed; clippy -D warnings did not. Second time this week clippy has
            caught what the test run could not, which is an argument for not
            treating a green suite as a green tree.

        REVERSING ANY OF THIS is one line: move an extension from
        CORPUS_DECLINED into CORPUS_CODE_EXTS, or the other way. The decisions
        are judgements and are labelled as such.
