packets:

  - packet_id: linux-tray-login-vault-poll-to-event
    order: 679-rp9m
    release_target: socket-audit-master
    status: ready
    desired_release: v0.5
    priority: p2
    title: "Linux tray GitHubLogin handler polls Vault for the token 120x at 1s (login-state timer poll) — drive it from an event source"
    kind: enhancement
    deliverable: crates/tillandsias-headless/src/tray/mod.rs GitHubLogin click handler (~L3676-3688) — replace the poll loop with an event-driven wait
    depends_on: [linux-native-stream-audit, vault-blocking-watch]
    pickup_role: linux
    capability_tags: [linux, tray, headless, streams, vault, login]
    estimated_hours: 3
    context: >
      AUDIT finding (order-156 audit half, 2026-08-11). The worst offender in
      the Linux native tray path. The GitHubLogin click handler spawns a task
      that literally polls Vault for the login token:

        // crates/tillandsias-headless/src/tray/mod.rs ~L3676-3688
        for i in 0..120 {
            authed = crate::vault_bootstrap::is_github_key_present();
            if authed { break; }
            ...
            std::thread::sleep(std::time::Duration::from_secs(1));
        }

      This is exactly anti-pattern AP-1 (sleep-based polling loop) applied to
      LOGIN STATE — one of the three surfaces packet 156 names ("no polling
      loops for VM status, login state, or cloud projects") — and it violates
      SC-14 ("Vault token changes observed via blocking-watch HTTP, not a
      periodic GET"): is_github_key_present() is a periodic presence GET, fired
      up to 120 times over a 2-minute window after the user clicks GitHubLogin.
      The event source that should feed this already has a home: packet 147
      (vault-blocking-watch, B6) — Vault's blocking-watch API pushes the token
      update, which the headless turns into a LoginStatePush / a
      tokio::sync::watch<LoginState>. The tray's login-confirmation should
      await that watch edge instead of sleep-looping is_github_key_present().
      NOTE: the one-shot launch probe at ~L3980-4047 (is_github_logged_in fired
      ONCE at tray startup) is already event-shaped and is NOT in scope here;
      only the 120x1s confirmation loop is the poll.
    exit_criteria:
      - "No `for _ in 0..120 { ... sleep(1s) }` (or any interval/sleep poll of Vault token presence) remains in the GitHubLogin click handler in crates/tillandsias-headless/src/tray/mod.rs (currently ~L3676-3688)."
      - "Login confirmation after `--github-login` arrives via an event source — a tokio::sync::watch (or Notify) fed by the Vault blocking-watch (packet vault-blocking-watch / SC-14), not a periodic is_github_key_present() GET; is_github_key_present is called at most once per confirmation edge."
      - "A litmus/test asserts the login-confirmation path in tray/mod.rs contains no per-second sleep-poll constant (no `Duration::from_secs(1)` loop) for the login surface."
    events:
      - ts: "2026-08-11T04:50:00Z"
        event: filed
        summary: >
          Filed from the order-156 audit half. Concrete polling site
          crates/tillandsias-headless/src/tray/mod.rs L3676-3688: login-state
          Vault poll (120x @ 1s). Event source available: vault-blocking-watch
          (order 147, B6) -> watch<LoginState>. SC-14 + AP-1 violation.

  - packet_id: linux-tray-shutdown-atomicbool-sleep-to-notify
    order: 679-vdi6
    release_target: socket-audit-master
    status: ready
    desired_release: v0.5
    priority: p3
    title: "Linux tray watches SIGTERM via AtomicBool+250ms sleep polls (3 sites) — SC-16: use tokio::sync::Notify/watch, not a timer"
    kind: optimization
    deliverable: crates/tillandsias-headless/src/tray/mod.rs shutdown watchers (~L640-655, ~L4081-4082) + install_shutdown_signal_handlers (main.rs:13184) — expose a Notify/watch and await it
    depends_on: [linux-native-stream-audit]
    pickup_role: linux
    capability_tags: [linux, tray, headless, streams, signal-handling, idle-cost]
    estimated_hours: 3
    context: >
      AUDIT finding (order-156 audit half, 2026-08-11). The tray observes the
      shutdown signal by SLEEP-POLLING an AtomicBool at a 250 ms cadence, at
      three sites in crates/tillandsias-headless/src/tray/mod.rs:

        // TrayPhaseHandle::watch_shutdown_and_mark_stopping_blocking ~L640-655
        while !shutdown.load(Ordering::SeqCst) {
            std::thread::sleep(std::time::Duration::from_millis(250));
        }
        // runtime main-wait loop ~L4081-4082
        while !shutdown.load(Ordering::SeqCst) {
            tokio::time::sleep(std::time::Duration::from_millis(250)).await;
        }

      (the first is also spawned from start_control_socket_server ~L1270). This
      is SC-16 verbatim: "No AtomicBool + sleep used as a signaling primitive;
      use tokio::sync::Notify or watch::channel." It is not a status/login/cloud
      surface, but it IS timer-based polling that should be event-driven, and it
      is the only source of periodic idle-time timer wakeups in the Linux tray
      (works against the contract's "zero idle cost: no timer wakeups" property
      and SC-11). Fix: have install_shutdown_signal_handlers (main.rs:13184) also
      publish a tokio::sync::Notify or watch::Sender<bool> alongside the atomic;
      the main-wait loop awaits `notified()` / `changed()`, and the phase watcher
      awaits the same edge before flipping phase to Stopping. CPU today is well
      under 0.1% so this is an idle-cost/correctness-of-primitive optimization,
      not a hot-path bug.
    exit_criteria:
      - "No `while !shutdown.load(...) { sleep(250ms) }` remains in crates/tillandsias-headless/src/tray/mod.rs (currently watch_shutdown_and_mark_stopping_blocking ~L640-655 and the runtime main-wait loop ~L4081-4082)."
      - "Shutdown/SIGTERM is observed via tokio::sync::Notify or a watch::Receiver fed by install_shutdown_signal_handlers — the watcher and main loop await an event edge, not a 250ms timer; SC-16 satisfied."
      - "A litmus/test asserts no `Duration::from_millis(250)` sleep-poll of the shutdown atomic remains in tray/mod.rs."
    events:
      - ts: "2026-08-11T04:50:00Z"
        event: filed
        summary: >
          Filed from the order-156 audit half. SC-16 violation at 3 sites in
          tray/mod.rs (L640-655, L1270 spawn, L4081-4082): AtomicBool + 250ms
          sleep as shutdown-signal primitive. Event source: promote
          install_shutdown_signal_handlers (main.rs:13184) to expose Notify/watch.

