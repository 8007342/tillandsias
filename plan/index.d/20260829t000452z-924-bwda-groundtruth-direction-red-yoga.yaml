packets:
  - packet_id: expert-groundtruth-is-red-at-head-on-the-direction-bootstrap-question
    order: 924-bwda
    status: ready
    title: |
      cargo test -p tillandsias-plan is RED at HEAD: the committed expert
      ground truth fails plan-current-direction-bootstrap-question because
      the answer no longer contains the literal "## Direction" — and it is
      the very first question CLAUDE.md tells a new agent to ask
    kind: bug
    pickup_role: any
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - plan
      - experts
      - ci
      - fail-loud
    estimated_hours: 2
    deliverable: |
      cargo test -p tillandsias-plan is green at HEAD, with the cause named:
      either the answer regressed and is fixed, or the expectation was made
      stale by a deliberate answer-format change and is re-cut with that
      change recorded.
    context: |
      MEASURED on yoga, 2026-08-28, at HEAD 9baf28f24 AND in a clean
      detached worktree at the same commit — so it is not local state and
      not my working tree:

        cargo test -p tillandsias-plan --all-targets
        -> 248 passed; 1 FAILED
        groundtruth::tests::the_committed_query_set_is_green_at_head
        panicked: ground truth is RED:
          ["plan-current-direction-bootstrap-question:
            answer does not contain \"## Direction\""]

      WHAT THE ANSWER ACTUALLY IS. `tillandsias-plan answer "what is the
      current Direction?"` returns a well-formed envelope:

        answer:     "The current Direction is: **forge agents local EXPERTS**."
        confidence: retrieved
        citations:  plan/loop_status.md:13378-13400,
                    authority.key "## Direction — what are we all doing today"

      The CONTENT is right and the citation carries the heading. What is
      absent is the literal string "## Direction" in the answer BODY, which
      is what the expectation asserts.

      TWO CANDIDATES, AND I DID NOT DETERMINE WHICH — naming one would be the
      confident-wrong-cause shape this milestone exists to stop:
        (a) THE ANSWER REGRESSED. It used to echo the heading and no longer
            does, so the expectation is correctly red.
        (b) THE EXPECTATION IS STALE. The renderer was deliberately improved
            to answer in a sentence and cite the heading rather than paste
            it, and nobody re-cut the ground truth.
      Deciding between them is a bisect of groundtruth.rs and the answer
      renderer against
      openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml.
      Whoever takes this should record the first-red commit either way.

      WHY IT MATTERS MORE THAN ONE RED TEST. CLAUDE.md's Bootstrap section
      names "what is the current Direction?" as a good FIRST question, and
      `mcp_first_read_path` makes asking the expert the sanctioned read path.
      This is the graded proof that the sanctioned first read works. It is
      also standing debt nothing surfaces: ./build.sh --check exits 0 with
      this red inside it (the plan ledger tests it runs are a different
      target set), so every host has been pushing over it.

      NOT CLAIMED: that any agent has actually been misled. The answer's
      content is correct, so the practical harm is a red suite, not a wrong
      Direction. The debt is that a graded expert check has been failing
      unnoticed — the same shape as 921-vtf4 in the litmus lane.
    exit_criteria:
      - |
        cargo test -p tillandsias-plan --all-targets is green at HEAD.
      - |
        The first-red commit is named, and the disposition says explicitly
        whether the ANSWER or the EXPECTATION was wrong. A re-cut recorded as
        a fix, or a fix recorded as a re-cut, is a false green either way.
      - |
        NEGATIVE CONTROL: after the repair, changing the Direction heading's
        content in loop_status still turns the graded case red — the case
        must remain able to fail.
    verifiable_closure: |
      cargo test -p tillandsias-plan --all-targets passes at HEAD, and
      tillandsias-plan grade over expert-groundtruth-rung1.yaml reports the
      direction case green.
