packets:
  - packet_id: bound-listener-readiness-parity-linux-and-macos-units
    order: 740-3k4s
    status: ready
    desired_release: v0.5
    priority: p2
    release_target: fail-loud-diagnosis-milestone
    kind: fix
    title: "The Linux and macOS headless units still trust /dev/vsock and `active` — only the Windows path proves a bound listener"
    deliverable: "crates/tillandsias-vm-layer/src/wsl.rs + crates/tillandsias-vm-layer/src/vz.rs"
    pickup_role: any
    capability_tags: [linux, macos, systemd, fail-loud, parity, vsock]
    estimated_hours: 2
    context: |
      Split out of 735-ewzp so the windows half could land verified rather than
      the whole thing landing unverified.

      735-ewzp fixed a readiness chain in which EVERY signal was green while
      nothing was bound: headless-preflight.sh reported `vsock_device=present`
      (it tests for /dev/vsock, which vsock_loopback alone provides and the
      image loads deliberately), the process logged `app.started`, and systemd
      held the unit `active (running)` with `--listen-vsock 42420` on its
      command line. The host saw a seven-and-a-half minute timeout.

      The fix on the Windows provisioning path (wsl_lifecycle.rs) is an
      ExecStartPost probe that CONNECTS to the port, plus a [Unit] start-limit
      so an unbindable guest fails once instead of restarting forever.

      THE OTHER TWO UNITS ARE UNCHANGED and have the identical blind spot:
        crates/tillandsias-vm-layer/src/wsl.rs  — the Linux-host WSL unit
        crates/tillandsias-vm-layer/src/vz.rs   — the macOS VZ unit
      Both carry `ExecStartPre=/usr/local/lib/tillandsias/headless-preflight.sh`
      and nothing that observes a listener. An ExecStartPre cannot: it runs
      before the binary, so there is nothing to observe by construction.

      WHY THIS WAS NOT JUST COPIED ACROSS. The edit is one unit line plus one
      script per path, and it would have been quick. It is deliberately not
      done because this packet's parent is about not trusting readiness signals
      nobody verified — shipping the same probe to two units I cannot start,
      on the strength of it working elsewhere, would be the exact mistake in a
      new place. The probe also took THREE attempts to get right on hardware
      (see below), which is the strongest argument against doing it blind.

      WHAT THE WINDOWS WORK ALREADY ESTABLISHED, so nobody re-derives it:
        * the discriminating form is `socat -T1 VSOCK-CONNECT:1:$PORT /dev/null`
          — CONNECT ADDRESS FIRST. Measured: exit 0 on a bound port, exit 1 on
          an unbound one.
        * `socat -u /dev/null VSOCK-CONNECT:1:$PORT` HANGS against a live
          listener, so it would block ExecStartPost and wedge unit start.
        * putting /dev/null first makes socat exit 0 before the connect can
          fail — it passes against a DEAD port. A check that always succeeds.
        * socat ships in the Fedora guest image built WITH_VSOCK; no new
          dependency is needed.
        * CID 1 is VMADDR_CID_LOCAL, so the probe stays inside the guest.
        * StartLimitIntervalSec / StartLimitBurst are [Unit] directives on
          modern systemd; under [Service] they are silently ignored.
    outcome: |
      All three provisioning paths assert a bound listener, and a guest that
      cannot serve the control wire fails visibly on every host.
    exit_criteria:
      - "wsl.rs and vz.rs install a readiness script and reference it from ExecStartPost, matching the Windows path."
      - "MEASURED ON THE HOST THAT OWNS EACH UNIT: a real provision reaches the probe and passes; the evidence quotes the unit's own journal, not a source diff."
      - "NEGATIVE CONTROL per host: the probe FAILS against a port with no listener — demonstrate it, because two of the three candidate forms silently passed on Windows."
      - "The start-limit directives sit in [Unit] on both, pinned by a test rather than by review."
    events:
      - type: filed
        ts: "2026-08-14T23:00:00Z"
        host: windows
        summary: |
          Filed by the windows host on completing 735-ewzp's windows half.
          Carries the full probe-form findings so the other two hosts do not
          repeat the three attempts it took to get right here.
