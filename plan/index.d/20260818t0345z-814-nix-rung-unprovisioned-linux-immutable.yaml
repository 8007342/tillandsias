packets:
  - packet_id: nix-toolbox-rung-is-unreachable-because-nothing-provisions-it
    order: 814-5avq
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "the toolbox rung of nix-toolbox.sh can never resolve: ensure_toolbox creates the toolbox but no code ever installs nix into it, and the init set was deliberately not extended"
    deliverable: "a fleet decision on how the toolbox rung gets a nix binary without root — and whichever way is chosen, an idempotent step that provides it, so resolve_rung can return `toolbox` on a host with no host-nix"
    pickup_role: any
    release_target: stable-milestone-v1
    capability_tags: [nix, toolbox, forge, fleet, decision]
    estimated_hours: 4
    context: |
      MEASURED on yoga (Fedora Silverblue, no host nix), 2026-08-18:

        scripts/nix-toolbox.sh nix-args   -> blocked:nix-toolbox:no-nix-and-no-toolbox (rc 1)
        scripts/nix-toolbox.sh store-status -> skip:nix-store:no-store
        command -v nix (host)             -> absent
        systemctl is-active nix-daemon.socket -> inactive
        toolbox tillandsias-builder       -> running; `command -v nix` inside -> absent

      THE STRUCTURAL PART, read from resolve_rung (scripts/nix-toolbox.sh:152):
      the ladder is daemon -> chroot -> toolbox. `chroot_works` needs a nix
      BINARY on the host to run against a user store. The toolbox arm calls
      ensure_toolbox, which creates the container and installs nothing, then
      tests `command -v nix` inside it — and nothing in the tree ever puts nix
      there. 606-um5s's own note records that decision explicitly: "The
      with-tillandsias-builder init set was deliberately NOT extended with
      nix."

      So on any host WITHOUT host-nix the ladder can only ever return
      `blocked:no-nix-and-no-toolbox`. That is not a yoga misconfiguration; it
      is the rung being unimplemented. macuahuitl's proof of the lane
      (ok:nix-toolbox:chroot, fork-765-8hc3) ran at the CHROOT rung using the
      host's own nix — which is exactly the rung an immutable host does not
      have.

      WHY I DID NOT JUST INSTALL IT. The conventional installer wants /nix at
      root, and there is no passwordless root inside the toolbox on this host
      (`sudo -n true` fails), so it cannot run unattended. The rootless shape
      that WOULD work is a static nix binary plus `--store <user-writable>` —
      which is the same store mechanism the chroot rung already emits via
      `nix-args`. That is a real design choice about where the fleet's nix
      comes from, it fetches a third-party binary, and it changes a shared
      script, so it is proposed rather than done.

      OPTIONS FOR THE FLEET, none recommended here:
        A. Extend the toolbox init set with nix after all, reversing the
           deliberate 2026-08-16 exclusion. Simplest; makes every builder
           toolbox heavier.
        B. Add an explicit `nix-toolbox.sh provision` step that fetches a
           static nix into a user path and uses the existing chroot store.
           Keeps the init set thin; adds a network fetch to a lane that is
           otherwise hermetic.
        C. Declare the toolbox rung unsupported and require host-nix, making
           606-um5s explicitly unavailable on immutable hosts. Honest, and it
           contradicts the operator's "toolboxes are the substrate" ruling, so
           it needs that ruling revisited rather than quietly ignored.
    exit_criteria:
      - |
          Each host kind records which option it can support and why — in
          particular whether it has host-nix, passwordless root in a toolbox,
          or neither.
      - |
          The chosen option is implemented as an idempotent step, and
          `scripts/nix-toolbox.sh nix-args` returns flags rather than
          `blocked:` on a host with no host-nix.
      - |
          606-um5s's precondition note is corrected to name the working
