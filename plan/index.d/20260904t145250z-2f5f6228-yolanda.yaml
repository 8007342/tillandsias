        §1 INSTALL: PASSES. Pinned to v56.9.2.1, SHA-256 verified, backed up the existing install, registered in Installed Software, and self-verified "tillandsias-tray 56.9.2.1 (d6d3e3ed9)". Cold `--provision-once` reached Ready in 62 s (esme measured 117 s on esmeraldinha; yolanda is the faster host).

        §2 DESTRUCTION: PASSES, AND THE SCOPE IS CORRECT. `wsl --terminate tillandsias` then `--unregister tillandsias` removed ONLY that distro; tillandsias-build (my Linux-target build lane), AlmaLinux-10 and Ubuntu all survived. I checked because an unregister broader than the named distro would have been a finding on this packet; it is not. Credential clearing ran with the 1004-vsh2 fix and is the first real-world proof of it: before -> share=present token=present uuid=present; after -> share=ABSENT token=ABSENT uuid=PRESENT, and THE VERIFIER DID NOT THROW. The old predicate would have thrown on that exact state, which is the whole defect.

        §3 FRESH PROVISION: PASSES. distro_registered=true; the rootfs at %LOCALAPPDATA%\tillandsias\wsl\ext4.vhdx postdates the destruction marker (marker 07:47:17, vhdx 07:48:35), so it is a fresh guest and not a survivor; status polled to phase=Ready podman_ready=True exit 0.

        DEFECT 1, FIXED: `Get-Command tillandsias-tray.exe -ErrorAction Stop` THROWS ON A HOST WHERE THE INSTALL JUST SUCCEEDED. The installer places the binary at %LOCALAPPDATA%\Programs\Tillandsias and does NOT add that directory to PATH — measured: on_disk=True, dir_on_path=False, and Get-Command reports "not recognized as a name of a cmdlet". This is line 2 of §3 and the tray-resolution line of §1, so BOTH blocks fail immediately on a clean host. Fixed in both: resolve via PATH first (an operator may have added it), fall back to the documented install path, and fail only if neither exists. This is the line esme's improvised run must have skipped, which is exactly why a block written from an improvisation rather than a run carries it.

        DEFECT 2, FIXED: §3'S DIAGNOSE ASSERTION CONTRADICTS §3'S OWN NOTE. The block runs `--diagnose --json` LAST and asserts exit 0. Measured INLINE IN ONE SCRIPT with nothing interposed: --status-once read Ready/podman_ready=true, and --diagnose seconds later exited 2 with distro_running=false and wire.reachable=false. The tray log shows the wire closing ~15 s after "provision-once: VM Ready" (14:51:06 Ready -> 14:51:21 "control wire closed"). Nothing holds the guest open once the headless provision exits — which is precisely what the block's own "Ready is not durable after --provision-once" note says, one screen above the assertion that requires a live wire. Diagnose was not failing; it was truthfully reporting a wire that is legitimately down by then, and its report was complete and correct (right version, right build commit). Fixed: assert the report EXISTS and PARSES and carries this tray's identity, and record diagnose_exit as data in 03-diagnose-exit.txt rather than as a pass/fail gate. A missing or unparseable report is still a hard failure.

        WHAT I NEARLY FILED AND DID NOT, recorded because the near-miss is the useful part. My first --status-once returned exit 1, "control wire unreachable ... WSA_ERROR(10060)". That looked like a provision failure and the block would have thrown. It was MY execution: I ran §3 as three separate PowerShell invocations with reading time between them, so minutes passed between the provision and the poll, and Ready had lapsed exactly as documented. The block as a single script does not have that gap — I proved it by re-provisioning and polling immediately (exit 0, Ready, podman_ready true) and by timing the interposed vhdx scan at 1 s. So this is NOT a block defect and is NOT filed as one. The runbook explicitly warns against this ("do not re-run --status-once later and file its exit 1 as a provision failure") and I walked into it anyway; the thing that caught it was measuring the two orderings against each other rather than trusting the first red.

        The distinction between defect 2 and this near-miss is worth stating because they look identical from the outside — both are "exit non-zero after Ready". Defect 2 reproduces inline in one script with nothing between; the near-miss only reproduces when minutes pass. The tiebreaker was elapsed time, and the only way to see it was to run both orderings.

