packets:
  - packet_id: spec-index-delta-reuses-nothing-and-starves-the-floor
    order: 1005-5yvy
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [experts, spec-index, low-end, performance, gate, measurement]
    estimated_hours: 4
    depends_on: [local-expert-system-in-toolboxes-on-accelerated-hosts]
    title: |
      The spec-index delta build reuses nothing (reused=0 of 23,154), so every cycle pays a full embed; on a 4-core floor host it ran past 42 minutes, was killed unresumable, and starved the gate that timed out beside it.
    context: |
      MEASURED by pirria-cachyos (Alder Lake-N, 4 cores, the fleet floor) inside the
      forge lane of the v56.9.2.1 published-release smoke, 2026-09-04
      (06:49:48 to 08:01:18Z; report plan/issues/smoke-e2e-findings landed as
      1f84f2922). The in-forge agent's spec-index step reported
      `spec-index:delta reused=0 embed=23154 of 23154`, ran for more than 42
      minutes without completing (~41 MB of new-vecs.jsonl staged), competed with
      the mandatory gate, and was killed; the partial work is not resumable. The
      agent spent most of its cycle blocked on it.

      TWO FINDINGS, and the first is a hypothesis stated as one. (1) A DELTA build
      that reuses zero of 23,154 chunks is a full rebuild. If that is the steady
      state, the index cost is paid every cycle rather than once, on every host,
      and only the fat hosts fail to notice. pirria could not test further
      without a toolchain; lenovinha built the same 23,154-chunk index cold the
      same night in about twelve minutes on a dev-inference GPU lane (917-6iwv
      evidence), which is the comparison regime. (2) ./build.sh --check CANNOT
      COEXIST with the index build on floor hardware: the gate timed out at 10
      minutes under CPU contention and passed only after the index build was
      killed. On a 4h floor cadence a 45-minute index build is a large fraction
      of the budget.

      WHY THIS IS p1 AND ON THE LINUX LANE: it decides a question on the
      operator's queue. "Install cargo on pirria and its expert system works"
      does not follow while reused=0 stands; whether the floor should run
      experts at all is downstream of this measurement, not upstream of it.
      Relates to lenovinha's same-night finding that the durable tier is
      unreachable from rootless podman and the index falls into target/
      (filed separately from plan/issues/spec-index-durable-tier-unreachable-
      rootless-podman-2026-09-04.md) and to 888-miiy's bounds.
      Provenance: pirria-cachyos measured; filed by macuahuitl (coordinator).
    next_action: |
      Settle reused=0 first, on a fat host with a toolchain: run two consecutive
      spec-index-ensure.sh delta builds on an unchanged corpus and record the
      reused/embed counts of the second. If it is a full rebuild, that is the
      defect; if it reuses, the floor's reused=0 has a cause of its own (a
      missing published entry, a cold volume) and the packet narrows to that.
      Then decide the floor rule: serialize index builds with the gate, or
      exclude floor hosts from index builds and have them consume a published
      index.
    exit_criteria:
      - a second delta build on an unchanged corpus reports reused equal to the chunk count on a fat host; the measurement is recorded with host, engine, and chunk count
      - the floor host either completes an index build inside its cycle budget or is excluded from building one by a documented rule, never killed mid-build by the gate
      - index builds and ./build.sh --check are serialized on hosts where a measurement shows they contend (the 10-minute gate timeout on pirria is the reproduction)
      - the operator's pirria toolchain decision is recorded against this measurement, not assumed from it
    unscoreable: >
      No litmus drives a spec-index delta build against a live inference endpoint
      today, and the closure is a measurement on two hosts. The intended pin is a
      fixture asserting that a second delta build on an unchanged corpus reuses
      every chunk; whoever settles reused=0 should write it and convert this row.
