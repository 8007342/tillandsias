packets:
  - packet_id: worktree-boundary-snapshot-is-unenforced
    order: 717-3bvv
    status: ready
    desired_release: v0.5
    priority: p2
    release_target: fail-loud-diagnosis-milestone
    title: "A cycle can skip the worktree-boundary snapshot, and the skip reads as a stale temp path rather than a missing guard"
    kind: bug
    deliverable: "scripts/meta-orchestration-worktree-guard.sh verify (+ possibly scripts/mo-full-attest.sh)"
    pickup_role: any
    capability_tags:
      - meta-orchestration
      - guards
      - fail-loud
      - exit-contract
    estimated_hours: 2
    context: |
      Filed by the host that did it. Cycle 16 on windows ran Finalization's
      `verify` without ever having run Start Of Cycle's `snapshot`, and the
      guard answered:

        error: state directory does not exist: /tmp/meta-orchestration-boundary.Wxg6hS

      — the path from the PREVIOUS cycle, already removed on its own successful
      exit. Nothing else noticed: the commit landed, the push succeeded, and
      `mo-full-attest.sh self` printed a valid MO-FULL marker, because that
      marker attests HEAD is durably on the remote, not that a boundary was ever
      recorded.

      No damage that time — the tree was clean at start — but that is luck plus
      a clean starting state, not the guard working.

      The guard exists for the case where the tree is NOT clean: sibling or
      operator work that must survive byte-identical. In exactly that case a
      skipped snapshot is invisible, because `verify` fails with a message about
      a missing state directory rather than about the worktree, and an agent
      reading it as "stale temp path from last cycle" is reading it correctly.
      The guard goes quiet about the thing it guards precisely when the stakes
      are highest.

      Full write-up, including the two rejected shapes:
      plan/issues/enhancement-worktree-boundary-snapshot-is-unenforced-2026-08-13.md
    outcome: |
      A cycle that never recorded a boundary cannot finish quietly; the fault is
      named as a missing snapshot rather than described as a missing directory.
    exit_criteria:
      - "`verify` with no prior snapshot answers a typed `blocked:no-snapshot-taken` (or equivalent named verdict), not an errno-flavoured message about a missing directory."
      - "A NEGATIVE CONTROL asserts that a cycle which DID snapshot still verifies clean, so the new verdict cannot degrade into refusing everything."
      - "Decide explicitly whether the terminal MO-FULL attestation should also require a verified boundary for THIS cycle. That changes 614-2gqx's contract, so it is a recorded decision either way — including a recorded decision NOT to."
    notes: |
      Do not bolt this onto mo-full-attest.sh in passing. The marker's invariants
      are order 614-2gqx's and were written after a breach; extending them is a
      deliberate act, and criterion 3 asks for the decision, not the edit.
    events:
      - type: filed
        ts: "2026-08-13T22:00:00Z"
        host: windows
        summary: |
          Filed against the filing host's own miss, in the last minutes of a
          recurring loop window. Deliberately not fixed here: 37 minutes remained,
          and starting a change to the attestation contract with that budget
          would have produced exactly the half-landed guard this packet is about.
