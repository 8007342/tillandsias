  - packet_id: tray-shared-string-resource-layer
    order: 628-c7qd
    status: ready
    desired_release: v0.5
    role: host-shell
    priority: p1
    kind: enhancement
    title: |
      Wire the dormant locales/*.toml corpus into a shared Rust string layer so all three trays resolve every user-visible string by key.
    deliverable: plan/issues/tray-string-parity-and-i18n-layer-2026-08-09.md
    depends_on: []
    pickup_role: any
    owner_host: any
    capability_tags:
      - tray-ux
      - i18n
      - host-shell
      - refactor
    estimated_hours: 12
    problem: |
      VERIFIED: THREE separate string systems exist, and the canonical-looking one is wired to nothing.

      1. locales/*.toml — 17 languages; locales/en.toml is 228 lines with a documented namespace (menu.*, cli.*, init.*, errors.*, notifications.*, stats.*, clean.*, update.*) and already carries `sign_in_github = "🔑 GitHub Login"`. `grep -rn "locales/" crates/` returns NOTHING. Not one Rust crate reads it.
      2. /etc/tillandsias/locales/*.sh — a SECOND corpus in a different format, same 17 languages, read by images/default/lib-common.sh:78, lib-localized-errors.sh:19, forge-welcome.sh:31. No generator between the two; nothing guarantees they agree.
      3. Hardcoded literals in all three trays. This is where the drift lives.

      Surface area, as a floor: 19 balloon sites in crates/tillandsias-windows-tray/src/notify_icon.rs, 31 notification sites in crates/tillandsias-macos-tray/src/action_host.rs, plus every menu label, status chip and tooltip in both menu builders. None share a source.
    why_it_matters: |
      A 17-language translation corpus with a notifications namespace is sitting unused while three trays hardcode English. The operator's framing — "this should be similar to i18n support" — is not aspirational: the i18n asset already exists and was never connected.
    exit_criteria:
      - |
          One shared Rust string layer resolves keys from locales/*.toml; all three trays consume it; no user-visible literal remains inline in any tray source (enforced by 628-h4nx, which depends on this).
      - |
          The two corpora become ONE source of truth: either the .sh corpus is GENERATED from the .toml corpus, or both are generated from a third, with a check that fails on divergence. Two hand-maintained corpora is the defect, not the file format.
      - |
          The refactor is BYTE-IDENTICAL at the surface. Moving a literal into a table is not a UX change only if the rendered bytes do not move. Any string that cannot be preserved exactly is a DRIFT FINDING routed to 628-w9sm — never fixed in passing (spec:tray-ux governance).
      - |
          Missing-key behaviour is defined and tested: a key absent from a locale falls back to en, and a key absent from en fails LOUD at build time rather than rendering an empty menu row.
      - |
          Language selection is wired or explicitly deferred with a reason; en.toml already carries a `menu.language` key, so the surface was designed for it.
    notes: |
      Foundation packet. Can run in parallel with 628-p5tj. Blocks 628-h4nx and 628-w9sm.
    events:
      - type: filed
        ts: "2026-08-09T08:51:57Z"
        agent_id: windows-claude-fable-metaorch-20260809t063000z
        host: windows
        summary: |
          Filed from the operator's directive. The headline discovery is that locales/*.toml already exists in 17 languages with the right namespace and the correct spelling of the very string that has drifted — and nothing in crates/ reads it.

