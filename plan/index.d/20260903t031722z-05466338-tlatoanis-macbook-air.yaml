      summary: >
        THIRD IDIOM for this scanner, found 2026-09-02: multiline data passed through `awk -v var="$data"`. A -v assignment is a STRING LITERAL — gawk tolerates embedded newlines in one, BSD awk (every macOS host) rejects it outright with 'awk: newline in string'. In scripts/check-long-running-view.sh the join then produced NOTHING, every row read as naming no live packet, and the gate reported stale=28 of 28 on a tree where linux-next reported 'ok:28 live packets listed'. Fixed by passing the map as a file (NR==FNR) instead.  That makes three idioms for one scanner, all found on this host within two days, all the same shape — a Linux-authored guard that reads as platform-neutral and silently stops working or starts lying on macOS: (1) \+ in a BRE, (2) an unguarded `.` source under bash 3.2, (3) multiline `awk -v`.  WORTH NOTING FOR THE IMPLEMENTATION: `-v` also expands backslash escapes, so it is the wrong channel for arbitrary data on EVERY platform, not just BSD. The rule can therefore be stated portably — data belongs in a file or on stdin, never in a -v assignment — which makes it checkable without a platform conditional. A sweep of scripts/*.sh found every other -v use is a scalar (a count, a timestamp, a path), so the corpus is currently clean apart from the one fixed; the rule would be a ratchet, not a cleanup.
