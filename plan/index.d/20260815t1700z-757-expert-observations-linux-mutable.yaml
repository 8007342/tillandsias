    pickup_role: linux
    release_target: harness-mcp-expert-validation
    capability_tags: [experts, mcp, telemetry, fail-loud]
    estimated_hours: 3
    context: |
      Witnessed independently twice on 2026-08-15: (a) the linux-mutable
      coordinator's recon — mcp__project-info__read_file returned MCP -32000
      Connection closed mid cited-span read, the whole toolset then
      disconnected for the session; (b) the failed windows forge — transport
      closed during one cited-span read while the start-of-cycle health probe
      had reported healthy. Order 741-t66e made forge-plan MCP outages leave
      an automatic trace; project-info has no equivalent, so a
      systematically-dying server looks identical to an unused one in the
      mcp: metrics line (calls just stop).
    exit_criteria:
      - "A project-info transport failure after a healthy start leaves a durable trace (telemetry line or filed finding) without relying on the agent noticing."
