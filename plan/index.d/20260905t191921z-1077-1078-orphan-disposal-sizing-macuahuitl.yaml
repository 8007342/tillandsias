    estimated_hours: 2
    unscoreable: |
      THIS PACKET IS A DECISION, NOT WORK, and its output is a vocabulary plus
      the two fixtures marked in it. No litmus can score whether a marker
      vocabulary is the right one; what CAN be scored is that after the
      decision, every fixture in the tree is either bound, marked with a term
      from the vocabulary, or retired, with no third state — and the claimer
      names that check if it adds one.
    title: |
      two orphan fixtures are MARK_MANUAL with no vocabulary saying what manual means, so they sit in a state nothing can audit and they are blocking a nine-fixture packet they have nothing to do with
    context: |
      SPLIT OUT 2026-09-05 at lenovinha's request, on lenovinha's line: the two
      MARK_MANUAL fixtures need A DECISION RATHER THAN WORK, and they should not
      sit behind nine cycles of fixture disposal to get it.

      THE STATE TODAY. A fixture is bound into the gate, or it is orphaned. Two
      of 1063-nraf's set are neither: they are deliberately manual, and there is
      no term in the tree that says so, no place that term is recorded, and
      therefore no way to tell a deliberately-manual fixture from one nobody has
      got to yet. That is the same shape as an unattributed loop-status bucket
      or an unclaimed in_progress row — a state that is indistinguishable from a
      failure, so it accumulates.

      WHY IT IS A DECISION. "Manual" could mean: needs a human to interpret its
      output; needs hardware or a live lane no gate has; is a diagnostic rather
      than an assertion; or is a one-shot investigation kept for reference. Those
      four want different treatment and only the fourth argues for deletion.
      Picking is a judgement call about what the corpus is for, and it is cheap
      to make and expensive to leave open.

      WHAT WOULD MAKE IT AUDITABLE, and this is the closure's shape: after the
      decision every fixture is bound, marked with a term from the vocabulary,
      or retired. No third state. Then "orphaned" means something again, and
      1063-nraf's guard can say what it is guarding.
    next_action: |
      LEFT TO DO:

      1. Choose the vocabulary. Three or four terms, each with one sentence
         saying what a reader may conclude from it and what they may not.
      2. Say where a marker LIVES so a scan can find it — a line in the fixture
         itself is the obvious answer and matches how the tree already declares
         freshness and dialect guards.
      3. Mark the two fixtures 1063-nraf identified, with the reason.
      4. Only then, if it is cheap, add the check that every fixture is bound,
         marked or retired. It is the scorable half and it is worthless before
         the vocabulary exists.

      DO NOT let this wait on 1077-vzwq. It is two hours and a judgement, the
      nine-fixture packet is nine cycles of measurement, and they were split
      apart precisely so this one does not queue behind that one.
