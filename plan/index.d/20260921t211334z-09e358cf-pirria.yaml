          RUN 1   tillandsias-proxy   2026-09-21 14:12:48.927367772 -0700 PDT
                  tillandsias-vault   2026-09-21 14:12:30.842546313 -0700 PDT
          RUN 2   tillandsias-proxy   2026-09-21 14:12:48.927367772 -0700 PDT
                  tillandsias-vault   2026-09-21 14:12:30.842546313 -0700 PDT

        Byte-identical to the nanosecond. Nothing was torn down and recreated.

        WHY THE REAL HOST MATTERS HERE, stated because it is the whole reason these two
        arms were held back for one: a stub can report that a command was a NO-OP, but
        only a live container runtime can show that the thing which already existed was
        LEFT ALONE. Those are different facts. An idempotent-looking implementation that
        destroys and recreates a container in under a second satisfies the first and
        fails the second, and only the creation timestamp distinguishes them.

        THE BARE-METAL VERDICT LINE DOES NOT CARRY lane=, AND THAT IS STRUCTURAL rather
        than a defect. scripts/check-bare-metal-host-initialized.sh answered
        `todo:initialize-bare-metal-host:mirror:...` with exit 1, correctly: the mirror
        is PER-PROJECT and comes up at lane launch, which this smoke does not perform.
        The lane field exists in the script and resolves off / unwired:sshd-not-running /
        wired:<principal>, but it is emitted only on the ok: line, so it is unreachable
        from a todo: verdict. A host that has not launched a lane cannot report its lane
        state through this instrument — worth knowing before anyone asks a cold host for
        that field.

        ONE INSTRUMENT NOTE from the same run, because it bit me: the first reading of
