packets:

  - packet_id: freshness-coverage-rate-decision
    order: 640-iujb
    status: ready
    desired_release: v0.5
    priority: p2
    title: "FRESHNESS coverage is open but not convergent: 1013 unstamped at one audit per cycle is ~1013 cycles"
    kind: decision
    deliverable: methodology.yaml
    depends_on: []
    pickup_role: tlatoani
    capability_tags: [methodology, freshness, convergence, scope]
    context: >
      Order 640-iujb fixed a CLOSED loop: the freshness audit queue was fed from
      `freshness-stale:` lines, which are only emitted for files that already
      carry a stamp, so the same 8 stamped files were re-offered forever and the
      unstamped set was unreachable. Measured 969 components / 8 stamped / 0% on
      2026-07-31 and 1021 / 8 / 0% on 2026-08-09 — nine days, +52 components,
      +0 stamps. `freshness-next:` now draws from the unstamped set first.

      That makes the queue OPEN. It does not make it CONVERGENT. At the mandated
      one component per cycle against 1013 unstamped files, full coverage is
      ~1013 cycles, and the inventory grew by 52 components over the nine days
      measured — so the backlog may grow faster than the audit rate retires it.

      Full details: plan/issues/freshness-audit-class-was-a-closed-loop-2026-08-09.md
    exit_criteria:
      - >
        A decision on the target: is the goal 100% coverage, a percentage floor,
        or coverage of a defined subset (e.g. executable components only,
        excluding generated/vendored/event-log files)?
      - >
        A decision on the rate: does a cycle audit one component, or may it batch
        trivially-auditable ones? If batching is allowed, what makes an audit
        "trivial" is stated in a way a script can check.
      - >
        methodology.yaml -> component_freshness records the answer, and the
        freshness advisory reports progress against THAT target rather than
        against an implicit 100%.
    verifiable_closure: >
      methodology.yaml states the coverage target and audit rate; the freshness
      report prints progress against the stated target; and a litmus asserts the
      reported target matches the methodology value.
    notes: >
      Deliberately routed to the Tlatoani rather than resolved in-loop. Choosing a
      coverage target is a scope decision, and methodology/convergence.yaml ->
      bar_raise_governance forbids the loop from setting its own bar: an
      autonomously chosen target would make the convergence point undefined,
      which is exactly what the rule prevents. The loop's job was to make the
      queue reachable and report the rate honestly; both are done.
    events:
      - ts: "2026-08-09T21:45:00Z"
        event: filed
        summary: >
          Filed by the windows host during the standing FRESHNESS audit, which
          surfaced that the audit class could not reach an unaudited file. Loop
          opened; rate decision left to the operator.
