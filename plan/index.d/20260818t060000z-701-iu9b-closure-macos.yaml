      summary: >
        TRAP 1 CLOSED IN BOTH HALVES — ordering AND visibility — and the second
        half is the one that matters most, because ordering cannot help a boot
        where the share is genuinely absent.
        ORDERING: the fetch unit's [Unit] block gains `After=home-forge-src.mount`.
        Measured from systemd's own resolved view during the 2026-08-18
        instrumented boot: RequiresMountsFor= was EMPTY and After= omitted the
        mount, so the dependency genuinely did not exist. The race did NOT fire
        that boot — mount active at monotonic 3.005s, fetch started at 4.461s —
        but the margin was 1.456s, small enough that a slower virtiofs mount
        closes it, and the failure is silent.
        PLAIN `After=`, NOT `RequiresMountsFor=`, and the test asserts the
        ABSENCE of the latter. RequiresMountsFor implies Requires=, the fstab
        entry is deliberately `nofail` because a VZ config may legitimately omit
        the share, and tillandsias-headless.service carries
        Requires=tillandsias-headless-fetch.service — so a hard requirement here
        would turn a benign no-share boot into a DEAD GUEST. That regression
        would surface only on a boot, which is exactly the instrument this fix
        cannot afford to spend.
        VISIBILITY: fetch-headless.sh's silent fall-through
        (`if [[ -x "$DEST" ]]; then exit 0; fi`) now names WHY the staged binary
        was skipped, and distinguishes the two causes, which call for OPPOSITE
        responses and were previously indistinguishable because the path printed
        nothing at all: `staged_binary=unreachable reason=share-not-mounted`
        (the file exists and is invisible — retry / check the share) versus
        `staged_binary=absent` (nothing was ever staged — run the .app bundle,
        701-kgvk). Probed with `findmnt`, not `mountpoint`: findmnt is verified
        present in this guest, and under `set -euo pipefail` a MISSING
        mountpoint binary would make `! mountpoint -q` succeed and report a
        healthy share as unmounted. Diagnostics go to stderr so the journal
        keeps them.
        NOT LIVE-VERIFIED, AND THAT IS STRUCTURAL, not scheduling. cloud-init
        user-data runs FIRST BOOT ONLY, so the edited unit reaches only a freshly
        provisioned guest; the existing VM keeps the old unit baked in. The only
        way to make it take effect is --reset-guest, which wipes the 11.83 GiB VM
        dir and the in-VM Vault (804-bpke/804-deux). So this ships shape-tested
        and is recorded as such rather than implying live verification — the
        exact trap the packet's own notes warned about ("let me verify my TRAP 1
        fix live" leads straight to the destructive verb).
        AN EXISTING TEST BROKE, CORRECTLY, AND WAS WIDENED RATHER THAN PATCHED.
        vz_cloud_init_headless_fetch_unit_is_idempotent pinned the LITERAL string
        `if [[ -x "$DEST" ]]; then exit 0; fi`. Growing that line into a
        diagnostic made a correct change look like a regression — the failure
        mode litmus:litmus-expression-pinning-enforcement-shape exists to
        discourage. Re-expressed as the property the literal stood in for
        (idempotence: an existing binary still short-circuits) plus the new
        announcement.
        TRAP 2 / CRITERION 3 — AMENDED, NOT QUIETLY DROPPED. The criterion asks
        for "a test [that] exercises the wipe predicate under the stub cfg and
        documents the intended behaviour there". The TEST half is UNACHIEVABLE
        BY CONSTRUCTION: `mod vault_bootstrap;` is itself
        #[cfg(feature = "vault")] (main.rs:101-103), so with vault off the module
        and every cfg(not(feature="vault")) item in it is never compiled — no
        test can reach an item that does not exist. The DOCUMENTATION half was
        genuinely undone, and that is now fixed: the stub carried NO comment at
        all, so a reader arriving at the item that LOOKS dangerous found nothing
        — the rationale lived only in main.rs and in this ledger. It now records
        both refutations (the module gate, and the compile_error! at
        main.rs:94-99) at the site.
        NOT DELETED, deliberately: ten sibling cfg(not(feature="vault")) items in
        that file are dead for the same reason, and removing eleven items to tidy
        one is a larger regression surface than the tidiness is worth while the
        compile_error! guard makes the whole class unreachable. Recorded rather
        than swept — the discard-over-repair bias applies to STALE components,
        not to load-bearing-adjacent dead code behind a proven guard.
        FALSIFIED IN BOTH DIRECTIONS: removing `After=home-forge-src.mount` fails
        the ordering assertion; substituting `RequiresMountsFor=` — the
