      summary: |
        VERDICT (2026-10-15): UNREACHABLE FROM FORGES BY DEFAULT SECCOMP. Stays p2; the fixes below are defence in depth.
        Evidence (coordinator on macuahuitl, then measured here):
        (a) MEASURED in the macOS guest (v56.10.14.1, exec-guest, read-only): containers-common-0.67.0-1.fc44; /usr/share/containers/seccomp.json has socket rule SCMP_ACT_ERRNO errno 1 for args[0] == 40 (AF_VSOCK), with ALLOW only for != 40. No containers.conf (/etc/containers, conf.d, /usr/share/containers) sets seccomp_profile or unconfined. Forges launch with no --security-opt seccomp= (coordinator grep of crates/*/src), so socket(AF_VSOCK) is EPERM in a forge. BUT `lsmod` shows vsock_loopback LOADED, so that one seccomp rule (containers-common's, not ours) is the ONLY barrier between a forge and (1, 42420).
        (b) READ: the tillandsias-vsock-forwarder is the one container allowed AF_VSOCK (main.rs derive_vsock_seccomp flips only that rule; cap-drop ALL, no-new-privileges). It runs `socat TCP-LISTEN:11434,fork VSOCK-CONNECT:{cid}:{port}` on the enclave network with alias `inference`, which forges reach BY DESIGN. Its target is NOT validated: vsock_server.rs SetVsockForwardTarget writes whatever {cid}:{port} the tray sends into /run/tillandsias/vsock-forward, and vsock_forward_target() also honours TILLANDSIAS_GUEST_VSOCK_FORWARD_TO. All three sources are trusted (the tray over the authenticated wire, the daemon's env, a root-owned guest path), so this is not reachable by untrusted input today. But a target of (1, 42420) would bridge every forge to the control listener through `inference:11434`.
        (c) Defence in depth to file or implement (p2): 1) the guest refuses a forward target unless cid == 2 (VMADDR_CID_HOST) and port != CONTROL_WIRE_VSOCK_PORT, with a test; 2) the vsock accept path refuses a non-host peer CID; 3) order 142's per-boot host secret, since the PSK root is the hash of a public binary; 4) a forge-spec/litmus arm asserting no forge gets a seccomp override or --privileged, so the single barrier can't silently go away. Still to MEASURE when a release forge is up: the forge one-liner should print EPERM (errno 1). Windows hvsocket is yolanda's question.
