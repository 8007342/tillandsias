  context: 'OPERATOR (first-hand, lenovinha session 2026-11-04): asked whether a tray restart should leave forges up with the new tray taking their tools over, answered "Yes, keep forges (Recommended)"; asked where the explicit stop-everything lives, answered "CLI verb only (Recommended)" (the shared menu stays as it is). Before: every tray exit ran graceful_shutdown_async (all managed containers stopped) and revoked the forges vault tokens. Now a plain Quit, SIGTERM or upgrade restart marks every served lane (mark_lane_tray_owned) and exits; the next tray adoption tick binds them. tillandsias --stop-all leaves a marker and SIGTERMs the tray, or tears down itself when no tray runs.'
