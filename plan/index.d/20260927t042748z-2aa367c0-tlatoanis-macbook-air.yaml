      Measured on the 1426-cb6g live arms (tlatoanis-macbook-air, signed dist bundle, provisioned Fedora 44 guest).
      macOS: vm-layer vz.rs VzRuntime::stop calls requestStopWithError (the guest-visible power request), polls state for
      drain_timeout, then force-stops; the guest never left the running state in 60 s. Windows (read from code, not
      measured): vm-layer wsl.rs WslRuntime::stop takes  and immediately runs ; the tray's
      Quit logs "wire-level drain not yet wired on vsock; falling back to wsl --terminate". The mechanism is left to the fixer
      (e.g. ACPI power-button handling in the guest image, or a guest-side VmShutdownRequest handler — the host already
      sends one and gets no reply, see 1426-cb6g). Coordinator ruling 2026-09-27: file it; it is cross-platform in shape.


