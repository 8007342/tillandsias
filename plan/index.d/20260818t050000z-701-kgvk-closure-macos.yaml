        CRITERION 1 — THE IDENTITY PROBLEM, WHICH IS THE REAL WORK. The criterion
        demands an identity that "rolls per build, not per VERSION string".
        sha256 rolls per build but gives NO ORDER — it can say "different", never
        "older" — and nothing inside the guest artifact carries order either:
        the headless build.rs embeds only runtime assets, and the control-wire
        handshake's build_version is the workspace VERSION string, which is this
        packet's original complaint. The ordering signal therefore had to be
        manufactured host-side, and the tray crate already had one:
        TILLANDSIAS_BUILD_TIME from its own build.rs, in %Y-%m-%dT%H:%M:%SZ UTC,
        which sorts LEXICOGRAPHICALLY — so ordering two stamps needs no date
        parsing and no new dependency. TILLANDSIAS_GIT_SHA rides along for
        provenance a human can act on. Written as a sidecar
        (tillandsias-headless.provenance.json) beside the staged binary, AFTER
        the copy: a crash between them leaves a stale-or-absent sidecar, which
        reads as undecidable and re-stages, whereas the other order would claim
        provenance for bytes that never landed.
        UNDECIDABLE MUST STAGE, LOUDLY — NEVER REFUSE, and this is the part most
        likely to be got wrong. A missing sidecar is the state every host is in
        the first time this ships. Refusing there would freeze the entire fleet
        on whatever guest binary it happens to have, which is STRICTLY WORSE than
        the downgrade this packet is about: a downgrade is recoverable by running
        a newer bundle, a universal freeze is not recoverable at all without
        deleting files by hand. An "unknown" build_time (build.rs's fallback when
        neither git nor `date` answers) is excluded from ordering for the same
        reason — lexicographically "unknown" sorts AFTER every real 2026 stamp,
        so ordering it would read as newest-always.
        CRITERION 3 — VERIFIED BEHAVIOURALLY, not just written. A non-bundled run
        now announces it cannot stage. Measured: `./target/debug/tillandsias-tray
        --provision` prints the four-line NOT STAGING notice BEFORE its
        {"status":"already_provisioned"} output, and the staged binary's sha256 is
        byte-identical before and after (87013bc6…), so the announcement cost
        nothing and touched nothing. ANNOUNCING IN THE FUNCTION rather than
        fixing the seven Ok(None)-dropping call sites (diagnose.rs:595, 723, 966,
        1075, 1384, 1467, 1648 — all seven match only Err) is deliberate: an
        eighth call site would inherit the same silence, and the fact being
