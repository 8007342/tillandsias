    title: |
      A set-field on a long-form field (next_action, context, notes) replaces it wholesale, so a host correcting one sentence silently deletes warnings other hosts wrote into the same field; check-fragment-status-loss guards status only, so nothing in the gate chain catches it. The tool should show what it is about to drop and refuse unless told to replace, and offer --append.
    context: |
      MEASURED on esme 2026-09-13 while attaching evidence to 793-zumy: the
      first set-field on next_action replaced it and dropped three
      load-bearing lines the old value carried — the VERIFICATION DEBT note,
      "DO NOT MOVE legacy_tier WITHOUT TELLING YOGA" (dev-inference-ensure.sh
      greps it with `grep -m1` on raw --capabilities output, so a key placed
      ahead of it silently downgrades a host to cpu), and the hwfp-v2 field
      list. esme restored all three verbatim under a PRESERVED heading, and
      noticed ONLY because the tool echoed the old value's tail in its
      confirmation. Any host correcting a long-form field can silently
      delete another host's warnings; the ledger's integrity guard covers
      status transitions, not prose.

      WHAT TO BUILD. In set-field, for the long-form fields: diff the old
      value against the new by line; if any old line is absent from the new
      value, print the dropped lines under "would drop:" and refuse with rc 2
      unless --replace is passed; add --append (new text after the old, with
      a dated attribution line) as the default way to add a correction.
      Short fields (status, priority, next_action when the old value is a
      single line) keep today's behaviour. The fixture plants a three-line
      field, sets a one-line value, and asserts the refusal names the two
      lost lines; --replace succeeds; --append keeps all three and adds the
      fourth.

      NOT IN SCOPE: guarding fragment files edited by hand (immutable once
      landed, already refused), or merging concurrent edits.
    exit_criteria:
      - 'set-field on a multi-line next_action with a value that lacks old lines prints the dropped lines and refuses rc 2 without --replace (pre-fix result: FAILS — silent replacement)'
      - '--append preserves every old line and adds the new text with an attribution line; --replace replaces wholesale'
      - 'NEGATIVE CONTROL: set-field status, priority and a single-line next_action are unaffected; check-fragment-status-loss still passes'
      - 'the set-field usage text names the three modes and skills/coordinate-multihost-work/SKILL.md tells a correcting host to use --append'
