    estimated_hours: 3
    context: >
      BigPickle's proposal P3 (diagnose-forge session 2026-08-10 20:40-20:47Z,
      titled forge-session-fragment-survival), reconstructed by the coordinator
      after the proposal FILES THEMSELVES died with the container — the third
      loss of in-forge work tonight (round-2 validation fragments, then all
      four diagnose proposals), each needing journald archaeology. The design:
      the per-project named volume (tillandsias-forge-cache-<project>) already
      survives container death; the forge entrypoint/exit path should stage
      any un-pushed plan/index.d + plan/loop_status.d fragments (and, ideally,
      `git bundle` of un-pushed commits) into a staging directory on that
      volume, and the next launch (or the host coordinator) surfaces them
