    title: |
      scripts/hooks/pre-push-local-gate.sh:811-812 nests the fragment-schema and status-loss checks under "the plan binary is present" and, when it is not, records "checks skipped" as a LANE_NOTE on an otherwise successful plan-only push, so a fragment-only push (which is exactly what a ledger reopen is) can carry a shape the full gate refuses onto trunk and freeze every other host's land
    context: |
      FOUND BY lenovinha 2026-09-12T02:10Z while the fleet was frozen. The
      freeze itself: yoga's honest reopen of 1115-yvrq (a falsified event
      beside the old completed event, status back to in_progress through
      --reopen-evidence, 650-dq6u) reached origin/linux-next at 7f0b2cd0f;
      scripts/check-fragment-status-loss.sh refused that shape ("has a
      'completed' EVENT but folds as 'in_progress'"), and because
      methodology's pre_push_gate makes every platform branch merge trunk
      before every push, every host that obeyed it was refused at its gate
      for about an hour. The coordinator taught the guard that a later
      falsified event supersedes the closure (this commit).

      HOW THE SHAPE GOT PAST yoga's OWN PUSH is this packet. lenovinha traced
      it: check-fragment-status-loss.sh:81 prints violation:0 when no plan
      binary resolves but EXITS 2, and build.sh:2597 runs it through _run,
      which returns the child rc — so ./build.sh --check reds on an unbuilt
      binary and the full gate is sound. The escape is the plan-only lane in
      scripts/hooks/pre-push-local-gate.sh:811-812: the whole status-loss
      block sits under an `if` on target/release/tillandsias-plan being
      present, and the else branch appends "target/release/tillandsias-plan
      absent — fragment schema and status-loss checks skipped" to LANE_NOTES
      and lets the push through. A fragment-only push takes that lane and
      skips the build. lenovinha inferred (did not observe) that yoga's push
      took it; the coordinator has not confirmed which lane yoga's land used,
      so the first exit criterion is the confirmation.

      Not-a-check-that-could-not-run is the order-531 shape one hook deep:
      "skipped" printed as a note beside a green push reads as a pass.
    exit_criteria:
