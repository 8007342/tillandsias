      FUTURE LITMUS FILENAME: scripts/test-tool-dispatch-rejects-unusable-host-tool.sh
      — feed resolve_tool a tool that is ON PATH and exits non-zero, assert it
      is NOT returned; and assert check-cheatsheet-refs.sh then reaches its
      exit-2 could-not-run path instead of exiting 0. Write it in the same
      commit as the probe and move this text into verifiable_closure.
    title: |
      resolve_tool accepts any tool `command -v` can see, so a present-but-unusable rg makes check-cheatsheet-refs.sh match nothing and exit 0 — a clean pass over zero references, which is worse than the false refusal 1137-dzzu just fixed
    context: |
      FOUND 2026-09-12 on lenovinha while building 1137-dzzu's fixture, by an
      attempted reproduction that failed in an informative way.

      To reproduce esmeraldinha's absent-rg condition the first attempt put a
      stub `rg` on PATH that exits 127. The checker returned 0, not 2. The chain:
      scripts/lib/tool-dispatch.sh resolve_tool tests the host arm with
      `command -v "$_rt_tool"` — PRESENCE only — and returns the bare name. The
      checker then runs a broken rg for every scan, each invocation fails, the
      accumulated match set is empty, no reference is recorded as broken, and it
      exits 0 with "every reference resolves".

      THE ASYMMETRY IS THE DEFECT, and it is visible in tool-dispatch.sh's own
      comments. The TOOLBOX arm already probes USABILITY — it runs
      `<tool> --version` inside the container, with a comment stating exactly
      why ("the container existing does not mean the tool is in it, which is the
      entire defect this packet was filed for"). The HOST arm was never held to
      the standard its sibling states. 799-tb7q reasoned about presence on the
      host and availability in the toolbox, and presence-without-usability on
      the host fell between them.

      WHY THIS IS WORSE THAN THE BUG IT WAS FOUND UNDER. 1137-dzzu's false
      refusal was loud: it blocked a land and someone read the log. This is
      silent — the gate reports the check PASSED. Every consumer of resolve_tool
      inherits it: the lib is the one definition of dispatch, deliberately, so
      the blast radius is every guard that resolves a tool through it, not just
      the cheatsheet one.

      NOT HYPOTHETICAL ON THIS FLEET. A brew shim whose on-demand install fails
      under attestation verification is precisely a present-but-unusable binary,
      and 965-sxec already measured that shape for ruby on a forge: `ruby` on
      PATH, exit 127 when run. That packet fixed ONE caller's handling of it.
      This asks the shared resolver not to hand such a tool back at all.
    deliverable: |
      resolve_tool's host arm probes usability, not just presence, on the same
      terms its toolbox arm already does.

        * scripts/lib/tool-dispatch.sh — after `command -v` succeeds, run the
          tool's cheapest self-identifying invocation (`--version`) and fall
          through to the toolbox arm when it fails, so a broken host tool is
          treated as absent rather than as available.
        * DECIDE AND RECORD the cost: this adds one process spawn per
          resolve_tool call. Most callers resolve once into a variable, but that
          must be checked rather than assumed before landing — if any caller
          resolves inside a loop, memoise per (tool, container) instead.
        * DECIDE AND RECORD the exception: a tool with no `--version` (or one
          that is expensive) needs a stated probe override, not a silent skip.
        * scripts/test-tool-dispatch-rejects-unusable-host-tool.sh — the fixture
          named in `unscoreable` above, wired as a gate step.

      SCOPE NOTE: do NOT fix this by special-casing rg in
      check-cheatsheet-refs.sh. The lib exists because 48 copies of one rule
      drift; a caller-level patch here would be copy 49 and would leave every
      other resolve_tool consumer exposed.
    next_action: >
      Confirm the blast radius first — grep resolve_tool's callers and check
      whether any resolves inside a loop — because that answer decides whether
      the probe can be unconditional or must be memoised, and it is cheaper to
      learn before writing the probe than after.
    provenance: |
      Found by lenovinha (linux) while implementing 1137-dzzu, from a
      reproduction attempt that returned the wrong exit code. Filed separately
      rather than folded into that story: it is a different defect in a
      different file, and a silent pass deserves its own row rather than a
      paragraph in another packet's closure.
