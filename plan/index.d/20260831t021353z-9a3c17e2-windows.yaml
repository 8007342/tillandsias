        And on /completions with no chat template applied, prompt "The capital of France is":
          CPU     -> " _____. [ ] A: Paris  B: London"   (coherent continuation)
          Hybrid  -> "#|-|-"                             (soup)
        
        So it is the CHECKPOINT. Not the chat template (both endpoints fail), not the endpoint, and NOT accelerated execution as a class — the DeepSeek NPU model is coherent, which is the control that carries the conclusion.
        
        CONSEQUENCES, stated as losses rather than adjustments:
          * 0.82x is dead. Throughput of an arm that does not perform the task is not a slow measurement; it is not a measurement.
