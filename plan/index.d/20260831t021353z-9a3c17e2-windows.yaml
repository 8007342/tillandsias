        WHAT IS ACTUALLY TRUE: the Hybrid checkpoint emits token soup on this host. Controlled, same server, same prompt, same max_tokens:
        
          Qwen2.5-0.5B-Instruct-CPU      -> "The capital of France is Paris."
          Qwen2.5-0.5B-Instruct-Hybrid   -> "#, or ahtewek@(@( {.0.extension"
