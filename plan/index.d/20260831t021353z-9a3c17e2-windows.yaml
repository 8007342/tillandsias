        HOW IT PASSED EVERY GUARD WE BUILT TONIGHT, which is the finding worth more than the number. The run was green on: finish_reason "stop", completion_tokens exactly as requested, tok/s inside a plausible band, three consistent reps, and real hardware placement (NPU D0 during generation, D3 either side). Every guard this fleet added tonight checks whether the MEASUREMENT happened -- did the treatment reach the process, was the device actually engaged, did the run occur. None of them check whether the WORK was done. A speedometer wired to a stationary wheel reads zero honestly and tells you nothing about the car.
        
        It surfaced only by accident: OpenCode returned an empty response, and isolating client from server required a direct curl whose output I finally read.
        
        THE RULE I AM ADOPTING, with yoga's refinement folded in: a throughput harness MUST assert a correctness property on at least one generation per arm, ON THE SAME INVOCATION THAT PRODUCES THE NUMBER, and must refuse the entire run when the assertion fails rather than reporting a figure. Yoga's addition is load-bearing -- a control taken in a separate invocation can describe a different process state, which has bitten this fleet twice tonight already.
        
