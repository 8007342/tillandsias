packets:

  - packet_id: mirror-identity-rolling-upgrade-skew
    order: 666-qbjd
    status: ready
    desired_release: v0.5
    priority: p2
    title: "659-8faj identity change cannot rendezvous with a pre-659 live mirror — shared stack needs a recreate-on-upgrade story"
    kind: bugfix
    deliverable: upgrade-path handling in the mirror ensure path + note in the launch sequence
    depends_on: []
    pickup_role: linux
    capability_tags: [git-mirror, dns, upgrade, launch]
    estimated_hours: 2
    context: >
      Found while landing 659-8faj (per-project mirror DNS identity). The
      ensure-if-running mirror survives binary upgrades by design (order 443),
      so after installing a post-659 binary, a live pre-659 mirror still
      answers only the retired shared aliases: a new forge resolves
      git-<project> and finds nothing, while old forges keep working — the
      exact split-brain the fixture detects (it falls back to a dedicated
      network when it sees a live old-alias mirror). Ensure-if-running needs an
      identity-generation check: when the running mirror's aliases do not
      include the expected per-project name AND no sibling forge is live,
      recreate it; when a sibling is live, fail the launch loud with the
      upgrade explanation instead of a dead clone URL.
    exit_criteria:
      - a post-659 launch against a pre-659 live mirror either recreates it (no live sibling) or refuses with an explicit upgrade-skew error (live sibling)
      - the concurrent-forge litmus grows the skew case
    events:
      - ts: "2026-08-10T20:00:00Z"
        event: filed
        summary: filed from the 659-8faj implementation report (finding 1).

