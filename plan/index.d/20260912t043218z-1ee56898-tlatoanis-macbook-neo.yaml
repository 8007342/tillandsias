        WHAT IS DONE, and where:
        (a) CRITERION-2 REMEDY IS IMPLEMENTED (commit on osx-next, crates/tillandsias-secure-channel/src/secure_stream.rs). snow_err no longer flattens seven snow::Error variants into one InvalidData carrying "noise: {e}". HandshakeFailure classifies into three questions — PeerSentNoUsableFrame, CryptoDisagreement, LocalMisconfiguration — and rides inside io::Error as HandshakeError, so NO shared signature changed: client_handshake/server_handshake still return io::Result and the linux/windows callers of Client::handshake are untouched. ErrorKind discriminates too (InvalidData / PermissionDenied / Other) for callers that never downcast. Fixture is three arms, 15/15 green.

        THE FIXTURE FINDING THAT CHANGES WHAT (c) SHOULD EXPECT, and it is the most useful thing I learned: a plaintext refusal 79 bytes long does NOT read as snow Input. It is long enough to reach the AEAD check and reads as DECRYPT — indistinguishable, by CLASS alone, from a genuine version-bound PSK mismatch. So "classify the variant" is necessary and NOT sufficient. HandshakeError therefore carries `peer_frame`, the raw bytes the peer sent, and the guidance text says to decode peer_frame FIRST and report the peer's own message, treating it as a crypto disagreement only if it does not parse. tillandsias-secure-channel deliberately does not depend on tillandsias-control-wire, so the decode belongs to the CALLER — that wiring (host-shell vsock_client, macos-tray action_host, windows-tray hvsocket) is NOT done and is the natural first slice for whoever takes this next.

        MEASURED ON macneo 2026-09-12, two arms, published-bundle build:
        - Host at the DEFAULT mode (absent env = On since 79e3ca876): "vm-status poll: secure control wire handshake failed: early eof", Ready never observed. NOTE THE SIGNATURE: early eof, NOT "noise: input error". Filed as a distinct arm of the same root cause, not as a match.
        - Host with TILLANDSIAS_SECURE_CONTROL_WIRE=off: the guest ANSWERED, three times, in its own words: control-wire handshake: expected HelloAck, got Error { code: Unauthorized, message: "secure control wire required: the version-bound secure-channel handshake failed; plaintext or mismatched-version peers are not served" }.

        WHAT THOSE TWO ARMS ESTABLISH:
        1. macneo's guest is in SECURE mode. A plaintext guest would have parsed a plaintext hello rather than refusing it. (This RETRACTS my earlier inference that the guest had been baked plaintext at provision; the vz.rs:1244 provision-time baking of TILLANDSIAS_SECURE_CONTROL_WIRE is real, but it did not bake Off here.)
        2. With BOTH ends On the handshake still fails, so on this host MODE is not the discriminator. What remains of the version-bound PSK is build_version: this guest runs the 2026-09-05 binary d677e5f5…, the host is today's build. Different build_version ⇒ different PSK ⇒ failure-closed BY DESIGN.
        3. So macneo's named cause is: an upgraded host never re-provisions an existing guest, and the version binding then strands it silently behind an unreadable error. The wire is doing what it promises; the defects are the absent re-provision-on-version-change and the diagnosis.
        4. The host CAN quote the guest verbatim — but only in plaintext mode, where the notice reads as a ControlEnvelope. Mid-Noise-handshake the identical bytes are unreadable. That asymmetry is exactly what (a) exists to close.

