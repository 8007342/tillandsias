    estimated_hours: 3
    owned_files:
      - scripts/check-host-tools.sh
      - scripts/test-host-tools.sh
    title: |
      check-host-tools.sh declares two macOS tool checks that measure the operator's environment instead of the tool: timeout's cheap prover presupposes a valid gh token, and cargo/rustc absence is read off the non-login PATH.
    context: |
      FOUND by macneo-macos 2026-09-04, on a factory-fresh Mac whose gh keyring
      token had rotted. Both faults are in scripts/check-host-tools.sh and both
      make the gate answer a question other than the one it claims to ask.

      FAULT 1 — THE timeout PROVER IS UNREACHABLE ON A HOST WITHOUT A VALID TOKEN.
      check-host-tools.sh:75 declares:
        timeout|macos|check-credential-channel.sh|blocked:gh-cli-only|...|brew install coreutils
      scripts/test-host-tools.sh builds a farm with timeout AND gtimeout hidden,
      runs the prover, and asserts the last line is blocked:gh-cli-only.
      MEASURED HERE:
        $ PATH="$farm" bash scripts/check-credential-channel.sh   # farm minus timeout,gtimeout
        missing:no-credential-channel
        rc=1
      and the gate reported:
        FAIL without timeout, check-credential-channel.sh reports blocked:gh-cli-only
             got=[missing:no-credential-channel]
        FAIL: host-tools 1/12 red (989-ykks)
      ROOT CAUSE: the blocked:gh-cli-only branch (check-credential-channel.sh:612)
      is reachable only AFTER the guard gets past its token arm. With no token or a
      dead one the guard short-circuits to missing:no-credential-channel
      (lines 638/674/677) and the timeout dependency is never exercised. So the arm
      measures the operator's gh login state, not coreutils. `gh auth status` here:
        X Failed to log in to github.com account 8007342 (keyring)
        - The token in keyring is invalid.
      THE ADVICE IS UNREACHABLE TOO: the SPEC line's remedy is `brew install
      coreutils`, but BOTH /opt/homebrew/bin/timeout and /opt/homebrew/bin/gtimeout
      are already installed on this host. An operator following the gate's own
      remedy installs what they already have and the gate stays red. This is the
      same shape as the 980-xcaf error message that advised a `brew install qemu`
      which could never have helped.
      THE PRECONDITION IS UNSTATED, WHICH IS THE ACTUAL DEFECT. A cheap prover that
      silently depends on ambient operator state is not a prover; it is a second
      unfalsifiable claim wearing a verdict's clothes.

      FAULT 2 — cargo/rustc ABSENCE IS READ OFF THE NON-LOGIN PATH.
      MEASURED HERE, same run:
        $ bash scripts/check-host-tools.sh
          MISSING: cargo   remedy: rustup toolchain install stable
          MISSING: rustc   remedy: same as cargo
        missing:host-tools:macos:cargo,rustc
      while /Users/tlatoani/.cargo/bin/cargo exists, runs, and had just compiled the
      workspace: ./build.sh --check reached its litmus arms, and
      land-on-platform-branch.sh resolved the toolchain unaided. rustup writes its
      PATH edit into a shell rc file that a non-login non-interactive shell never
      sources, and every agent tool call is exactly that kind of shell.
      THIS IS 876-irn7 EXACTLY, ONE SCRIPT OVER. cycle-preflight.sh:104 already
      fixed it there, for the identical reason, with the identical measurement on
      pirria 2026-08-25 (blocked:preflight:plan:cargo-absent on a host carrying
      cargo 1.98.0). The remedy it prints, `rustup toolchain install stable`, sends
      an operator to reinstall a toolchain that is present — unreachable advice
      again, the same failure mode as fault 1.

      PROVENANCE: found and measured by macneo-macos 2026-09-04; filed through
      macuahuitl-fedora (the coordinator) because macneo cannot push (invalid gh
      token, operator ask outstanding).
    exit_criteria:
      - |
        the timeout entry either states its valid-token precondition and SKIPS (not FAILS) when the precondition does not hold on this host, or is replaced by a prover that exercises the timeout dependency without depending on gh's auth state
      - |
        no host-tools verdict prints a remedy naming a tool that is already installed on the host it is printed on
      - |
        cargo/rustc resolve through CARGO_HOME/bin then $HOME/.cargo/bin before absence is declared, matching cycle-preflight.sh:104 (876-irn7); the genuinely-absent case keeps its verdict and its terminal force
      - |
        a fixture arm proves the narrowing on BOTH sides: a host with a resolvable-but-off-PATH cargo passes, and a host with no cargo anywhere still fails
    verifiable_closure: |
      scripts/test-host-tools.sh exits 0. Bound and already invoked by ./build.sh
      --check (build.sh:2761), which is what caught this (989-ykks, 1/12 red).
      Both criteria are checkable there: fault 2's two-sided arm needs only a farm
      with and without a cargo symlink, the same farm() mechanism the fixture
      already has. Fault 1's arm must additionally neutralise gh auth state —
      either by farming a gh stub with a known-good token response, or by
      asserting the SKIP verdict rather than the blocked: one. NOTE, stated
      rather than hidden (macneo-macos): I could not run the negative side of
      fault 1's criterion on this host, because I cannot produce a valid-token
      state without the operator's gh refresh. The arm is specifiable and
      scoreable; I am telling you it is unverified BY ME as of filing.
