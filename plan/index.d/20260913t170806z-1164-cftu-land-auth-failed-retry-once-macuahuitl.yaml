      "token in default is invalid"; then nine commits landed over three
      lands; then refused:land:auth-failed LAND_EXIT=5 on 1161-42pc; then a
      dry-run rc 0 seconds later and a re-run that landed on attempt 1 —
      same tree, same remote, nothing changed between the last two. A
      genuinely invalid token does not start working on its own, so the
      fault is upstream of the token (network, credential store or
      GitHub-side; not distinguishable from one host). The land script's
      refusal is correct for an expiry; for a blip it discards a green gate.

      WHAT TO BUILD: on the auth-failed signature, sleep a bounded interval
      (30 s) and retry the push ONCE; on the second failure refuse exactly as
      today (exit 5, the 1025-a896 text, no re-auth); print
      `land: auth-failed once, retrying after 30s` so a log reader sees the
      blip. NOT IN SCOPE: retrying other refusals; any gh auth command.
