          the remedy futile because the tray overwrote it within 30s.

  - packet_id: forge-preflight-races-the-async-launch-build
    release_target: forge-local-experts-milestone
    order: 783-jdeh
    status: ready
    desired_release: v0.5
    kind: bug
    pickup_role: linux
    priority: p2
    tags:
      - forge
      - experts
      - preflight
      - race
      - v0.5
    title: |
      In-forge cycle-preflight returns a terminal blocked:preflight:plan:capabilities-refused when the async launch build has not yet produced target/release/tillandsias-plan.
    context: |
      Observed on yoga 2026-08-17, second forge lane
      (target/smoke-e2e/06b-forge-lane-after-rebuild.log:32,188). The in-forge
      agent ran `scripts/cycle-preflight.sh`, which returned
      `blocked:preflight:plan:capabilities-refused`. Its own diagnosis:

        $ ./target/release/tillandsias-plan --version
        bash: ./target/release/tillandsias-plan: No such file or directory
        $ ls -la ./target/release/
        ls: cannot access './target/release/': No such file or directory

      There was no binary and no target/ directory at all — the forge's async
      launch build had not delivered it yet. The agent then correctly refused
      to start the cycle, because the skill says a `blocked:preflight:*`
      verdict means the instrument is unverified.

      But the expert-capability contract already distinguishes this exact case:
      `skew=pending-build` means WAIT AND RETRY ("the async launch build will
      deliver it in this session"), as opposed to `relaunch-required` where
      retrying is futile. Preflight collapses both into one terminal refusal,
      so a lane that merely started early is indistinguishable from a lane
      whose instrument can never appear — and the cheap, correct action
      (wait a few seconds and re-probe) is never taken.

      Cost is a whole forge cycle per occurrence: this lane did zero work.
    exit_criteria:
      - |
          cycle-preflight distinguishes "binary absent but a launch build is in flight" from "binary cannot be produced", waiting-and-retrying the former within a bounded window and only then refusing, with the two verdicts named differently.
      - |
          A test drives the absent-binary-with-pending-build case and asserts preflight waits rather than refusing terminally; the futile case still refuses immediately.
    events:
