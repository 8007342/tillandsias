    title: |
      A dev-mode browser window offers the lane that opened it a raw CDP socket under that lane's /run/host/tillandsias-mcp/, so Playwright or Puppeteer inside the forge can drive the window directly. No other lane sees it, and the host gains no TCP listener.
    context: |
      1656-iktu (#401) gives the owning lane full CDP through MCP tools (browser.cdp plus typed tools) over its per-lane MCP socket. The row's optional extra, a raw socket for a library-driven client, was left out. The window's relay (browser_window_cdp_relay.js, from 1655-urz9) serves the --remote-debugging-pipe to exactly ONE client, the tray's broker, which holds the window's emulation session. So a second client needs either a second relay endpoint or the broker multiplexing a lane-facing endpoint. In both cases the broker's emulation and ownership must hold.
      Protocol fit (stated, not yet measured): Puppeteer's connect() accepts a custom ConnectionTransport, so NUL-framed JSON over a Unix socket fits it. Playwright's chromium.connectOverCDP() takes an HTTP or WebSocket endpoint, so Playwright needs a WebSocket (/json/version plus a ws upgrade) served on a Unix socket, or a forge-local shim. Whatever the shape, it must stay a Unix socket mounted only into the owning lane, never a TCP port on the host.
      Full CDP exposes the window's session cookies to the owning lane. This is the same exposure 1656-iktu accepted and states in browser.cdp's description.
    exit_criteria:
      - 'from inside the owning lane''s forge, a Puppeteer (or Playwright) script connects through the lane-scoped socket to a dev-mode window and evaluates 1+1 to 2 in the page; red today (no such socket)'
      - 'the socket exists only under the owning lane''s /run/host/tillandsias-mcp/ mount: another lane of the same project has no path to it, and the host''s `ss -ltn` is unchanged with the socket in use'
      - 'the window keeps its device emulation and the broker session while the library client is attached, and the socket is removed when the window closes'
      - 'a normal (non-dev) window offers no socket'
    unscoreable: "unpinnable-until-the-guard-exists: the lane-scoped mount and the two-lane absence arm are written with the endpoint, in the live browser-open harness"
