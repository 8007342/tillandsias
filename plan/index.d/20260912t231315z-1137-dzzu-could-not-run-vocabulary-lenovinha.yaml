    title: |
      gate steps are data carrying ONE error string, so every non-zero exit printed a content verdict — a host merely lacking rg was told a cheatsheet reference does not resolve, and the land was refused on an answer about nothing that was examined
    context: |
      MEASURED by esmeraldinha (Windows 11 + WSL2 tillandsias-build, Fedora 44)
      and filed as plan/issues/gate-step-reports-absent-rg-as-unresolved-cheatsheet-ref.
      scripts/check-cheatsheet-refs.sh already distinguished its two failure
      modes by exit code — 2 = rg available neither on this host nor in the
      tillandsias-builder toolbox (nothing was checked), 1 = a reference
      genuinely did not resolve. The GATE STEP could not express that
      distinction: steps are data (1072-b7eq) and carry exactly one STEP_ERROR,
      so any non-zero exit printed "a cheatsheet reference does not resolve
      (1087-h2z9)". LAND_EXIT=3, origin/windows-next left unmoved, zero
      references examined.

      TWO AGGRAVATIONS, both from the packet. First, the codebase already had
      the right convention and this step departed from it: the sibling tier
      check prints skip:cheatsheet-tiers:cargo-absent and exits 0. Second, the
      step was promoted from --ci-full to --check on evidence from one host
      class — "measured green and cheap" on a host that HAS rg. Green on the
      measuring host is not green fleet-wide.

      REPRODUCED HERE before fixing, and the reproduction corrected a wrong
      first attempt worth recording: PATH-shadowing rg with a stub that exits
      127 does NOT reproduce this. command -v still finds the stub, resolve_tool
      returns it, the checker runs a broken rg, matches nothing and exits 0 — a
      VACUOUS PASS, which is a different and still-open defect (filed
      separately). Genuine absence — a narrowed PATH plus a toolbox stub failing
      its --version probe — gives exit 2 and esmeraldinha's stderr verbatim.
    deliverable: |
      STEP_SKIP_EXIT: a step may nominate ONE exit code meaning "could not run
      here", giving data-wired steps the vocabulary the tier check already had.

        * build.sh gate-step loop — capture the step's exit code instead of
          testing it inline; on an EXACT match against a non-empty
          STEP_SKIP_EXIT, print a skip: line naming the script and the
          STEP_SKIP_DESC reason and continue; every other non-zero exit still
          takes the STEP_ERROR refusal. Both new fields reset per step so one
          step's nomination cannot leak into the next.
        * scripts/gate-steps.d/165-1087-h2z9.step — STEP_SKIP_EXIT=2 with the
          reason string. STEP_ERROR is untouched: exit 1 still refuses.
        * scripts/test-gate-step-append-no-conflict.sh — a new arm refusing any
          STEP_SKIP_EXIT that is not a bare integer, or that is 0 or 1.
          Nominating 1 would silently downgrade every genuine refusal in that
          step to a skip; this is the packet's negative control made structural.
        * scripts/test-gate-step-skip-exit.sh — the fixture, wired as gate step
          205-1137-dzzu.

      NOT DONE, and named rather than implied: arm 4 of the fixture asserts on
