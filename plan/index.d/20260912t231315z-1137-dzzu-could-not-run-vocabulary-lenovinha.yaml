        THE TWO EXIT CODES WERE MEASURED HERE, not assumed from the packet.
        With rg genuinely absent (PATH narrowed to the system directories, a
        toolbox stub failing its --version probe) check-cheatsheet-refs.sh exits
        2 and prints esmeraldinha's stderr verbatim. With a probe cheatsheet
        carrying an unresolvable @cheatsheet reference it exits 1. The design
        rests on those two being distinct, so the fixture executes both rather
        than citing the packet for either.

        THE FIRST REPRODUCTION ATTEMPT WAS WRONG AND THE CORRECTION IS THE
        FINDING. Shadowing rg with a stub that exits 127 yields rc=0, not 2:
        command -v finds the stub, resolve_tool hands it back, the checker runs
        a broken rg, matches nothing, and reports a clean pass. That is a
        VACUOUS PASS on a host with a broken-but-present rg — a live defect
        this story did not fix, filed as its own row rather than buried in this
        summary. The fixture's arm-1 comment records why the shadow approach is
        not used, so the next author does not re-derive it.

        NEGATIVE CONTROL IS STRUCTURAL, not just asserted: the skip branch
        requires a non-empty nomination AND an exact equality, so exit 1 cannot
        reach it; the append-no-conflict guard refuses any step that nominates
        0 or 1 at all, which stops the downgrade being introduced later by a
        step author rather than only detecting it here.

        LIMIT STATED: fixture arm 4 asserts on build.sh's loop TEXT, because the
        loop is inline in the gate function and cannot be invoked without
        running a gate. Extracting it into a callable function is the follow-up.
