      summary: >
        TOOLCHAIN PROVISIONED AND THE SEAM VERIFIED END TO END on this host. Everything except the Azure identity (722-w7a2) is now in place, and the refusal the build now produces names exactly that.  FOUR DEFECTS FOUND BY THE OPERATOR RUNNING IT, each invisible to the way it had been tested:  1. THE BIG ONE — the signer did not PARSE under Windows PowerShell 5.1, while every fixture scenario passed under PowerShell 7. Root cause: these .ps1 files are BOM-less, and 5.1 decodes a BOM-less script with the system ANSI code page rather than UTF-8. A UTF-8 em dash (E2 80 94) or box rule (E2 94 80) becomes three CP1252 characters, one of which is 0x94 — a curly quote, which PowerShell treats as a STRING DELIMITER. Inside a comment that is harmless, which is why the repo's PRE-EXISTING em dashes never bit; inside a double-quoted string it opens a quote that never closes and the parser reports a missing brace 60 lines away. Fixed by making the three scripts ASCII-only, and pinned by a new scenario that PARSES them with 5.1 (the parser API, never executing them). The whole class was mine: I authored under pwsh 7 and never ran the shell the operator uses.  2. The dlib resolver looked in Program Files. The MSI installs PER-USER, to %LOCALAPPDATA%\Microsoft\MicrosoftArtifactSigningClientTools\. Found by querying the Windows Installer component database for the product's real paths after both guesses missed — a fact about the machine, not about the documentation.  3. The signtool resolver sorted candidates by FileVersion, which is the literal string "4.00 (WinBuild.160101.0800)" on EVERY signtool.exe. The sort was a no-op picking whatever the filesystem listed first. Now sorts on ProductVersion (10.0.26100.7705 here).  4. This host's signtool is 10.0.26100.7705, comfortably above the documented floor, so no SDK work was needed after all.  INSTALLED via winget, all three without elevation: Microsoft.DotNet.Runtime.8, Microsoft.Azure.ArtifactSigningClientTools, Microsoft.AzureCLI.  VERIFIED:   * fixture 6/6 green under BOTH pwsh 7 and Windows PowerShell 5.1;   * `sign-windows-artifact.ps1` with no identity now reaches the IDENTITY check rather than a toolchain one — proving signtool and the dlib both resolve;   * `build-windows-tray.ps1 -Release` packages and prints "UNSIGNED build";   * `build-windows-tray.ps1 -Release -Sign` with no identity THROWS and refuses to package, which is the degradation this packet exists to prevent.
