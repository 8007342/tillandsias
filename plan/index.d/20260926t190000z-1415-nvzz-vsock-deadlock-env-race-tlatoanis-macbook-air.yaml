  - packet_id: a-vsock-exec-test-flips-the-deadlock-report-env-var-on-a-parallel-thread-so-a-sibling-test-sees-its-first-blocked-heartbeat-ignored-and-the-land-gate-goes-red
    order: 1415-nvzz
    status: in_progress
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [rust, testing, vm-layer]
    estimated_hours: 1
    observed_by: tlatoanis-macbook-air
    unscoreable: |
      unpinnable-until-measured: the deliverable is a cargo unit test in vsock_exec.rs (deadlock_report_enabled_from);
      a litmus pin lands with it if the coordinator wants one.
    title: |
      the_deadlock_report_can_be_disabled set_var/remove_var's TILLANDSIAS_VSOCK_EXEC_DEADLOCK_REPORT in-process, so
      a_blocked_guest_is_reported_immediately_not_waited_out, running on a sibling thread, can read "0" for its first
      blocked heartbeat, log it without acting, fail on the second, and count 2 "still waiting" events against an ==1
    verifiable_closure: |
      no test in tillandsias-vm-layer mutates TILLANDSIAS_VSOCK_EXEC_DEADLOCK_REPORT (grep set_var/remove_var on the
      name returns 0 hits under #[cfg(test)]); the env-parsing contract is pinned through a pure
      deadlock_report_enabled_from(Option<&str>); pre-fix result: FAILS (vsock_exec.rs ~2793 set_var/~2795 remove_var).
    context: |
      Cause of the land46 refusal recorded in plan/index.d/20260926t182219z-35719d74-macuahuitl.yaml (1242-4x53 tally:
      vsock_exec.rs:2750 assert_eq!(still-waiting count, 1) got 2). SOURCE READ, not a repro: the PtyHeartbeat arm
      (vsock_exec.rs ~1512-1560) returns Err on the first BlockedOnInput heartbeat when deadlock_report_enabled(), so
      the product cannot double-process; a count of 2 requires the report to be DISABLED for heartbeat 1, which only
      the env test's set_var("0") window produces. Product correct, assertion correct (keep ==1). Coordinator ruling:
      pure-function split over a shared mutex (removes the global mutation; nothing can forget to take a lock).
      Evidence form chosen: static — no test mutates the var — since the race is not deterministically reproducible.
    exit_criteria:
      - 'deadlock_report_enabled() delegates to deadlock_report_enabled_from(std::env::var(..).ok().as_deref()); the test asserts Some("0") -> false, None -> true, Some("1") -> true without touching process env; pre-fix result: FAILS'
      - the ==1 assertion at the blocked-heartbeat test is unchanged
      - vm-layer tests pass on darwin and cargo zigbuild --target x86_64-unknown-linux-musl --tests compiles
