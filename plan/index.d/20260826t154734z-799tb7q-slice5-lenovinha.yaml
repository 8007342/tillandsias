      summary: |
        FIFTH SLICE — the `rg` and `openssl` callers, which the packet named at
        filing. Verified the toolbox actually carries both before converting
        anything (ripgrep 15.2.0, OpenSSL 3.5.7): the dispatch pattern is only
        valid for tools the toolbox HAS, and writing the line for a tool it lacks
        makes things worse than the host failure it replaces.

        rg: check-cheatsheet-refs.sh replaced its
        `exit 2 "ripgrep (rg) is required but not on PATH"` — the mis-shaped
        hard-fail-with-a-host-instruction this packet was filed against — with
        the dispatch, refusing only when NEITHER host nor toolbox has it.
        test-forge-config-trust-cross-platform-parity.sh converted.

        openssl: diagnose-proxy.sh, run-forge-project.sh, orchestrate-enclave.sh.

        A NEW HAZARD CLASS, distinct from the heredoc trap and worth stating
        because it does not apply to jq at all: OPENSSL WRITES FILES. jq is a
        pure filter — stdin in, stdout out, namespace-agnostic — so a toolbox
        fallback is transparent. openssl here generates a CA cert INTO a
        directory, so the fallback only works where the container shares the
        write path. A caller whose path is not shared would have the cert land
        where the caller cannot find it: a SILENT break, not an error.

        MEASURED before converting, rather than assumed: /tmp is shared
        bidirectionally with the toolbox (a file the host wrote is readable in
        the container and vice versa), and all three CERTS_DIR values are under
        /tmp — two literal `/tmp/tillandsias-ca`, one `mktemp -d`. A fixture arm
        now FAILS if any of them starts writing elsewhere.
