          outside packets/events/fields/status, wired into ./build.sh --check
          and pinned by litmus:fragment-keys-are-read (6/6): live-tree
          agreement, the exact `steps:` shape refused, all four channels
          accepted, comments and nested keys ignored, the guard's key list
          checked against fragments.rs, and a wiring arm. Mutation-tested by
          adding `steps` to READ_KEYS — the negative control fails with the
          original symptom. Status `implemented` rather than `completed`: the
          guard prevents recurrence but does not find fragments already lost in
          history, and no one has swept for those.
