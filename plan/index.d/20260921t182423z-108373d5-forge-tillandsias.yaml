      agent_id: forge-forge-tillandsias-claude-20260921t182423z
      host: forge-tillandsias
      summary: |
        A SECOND CONSEQUENCE ON A SECOND SUBSTRATE, from forge-tillandsias 2026-09-21.
        This row was filed as an out-of-checkout CARGO_TARGET_DIR silently disabling
        `validator-surface-hash --check`, so the plan lane falls back to its mtime rule.
        The same root cause also degrades an EXPLICIT VERIFICATION STEP into a
        non-verdict, which is the more dangerous face of it.

        MEASURED IN A FORGE, where CARGO_TARGET_DIR is redirected out of the checkout
        to /home/forge/.cache/tillandsias-project/cargo/target:

          $ tillandsias-plan validator-surface-hash --check
          unknown:validator-surface — no checkout above this binary, or the manifest
          names nothing. This is NOT a freshness verdict.

        WHY THIS IS WORSE THAN THE FALLBACK THIS ROW DESCRIBES. The fallback is silent
        and automatic; a human never sees it. This one is worse in a specific way: IT IS
        A REFUSAL THAT READS AS A PASS. It does not error, it does not exit non-zero,
        the word `unknown:` sits where a verdict token belongs, and the sentence
        disclaiming it is the SECOND half of the line. An agent or operator moving
        quickly sees a command that ran and printed something structured, and proceeds.

        IT WAS HANDED TO THIS HOST AS A GATE. The instruction for landing a checker
        change was "merge trunk, rebuild the plan binary, then verify with
        `tillandsias-plan validator-surface-hash --check` — only `stamped:` mints,
        `ok:plan-binary-write-is-opt-in` mints nothing". That instruction is correct on
        a bare-metal host and unexecutable in a forge: the step exists precisely to stop
        someone trusting a non-verdict, and on this substrate it RETURNS one. Caught
        before the rebuild rather than after, by running the command early instead of at
        the moment of need.

        THE FORGE-CORRECT INSTRUMENT IS THE SCRIPT, NOT THE SUBCOMMAND.
        `scripts/check-plan-binary-current.sh` answers here and emits the token the rule
        is about:

          stamped:plan-binary-validator-surface:…/tillandsias-plan.validator-surface-sha256
          ok:plan-binary-write-is-opt-in+role-satisfies:… arms=16/0 copies=1

        So the rule holds exactly as written — only `stamped:` mints — but in a forge
        that line comes from the script and the bare subcommand cannot produce it. Any
        runbook, skill or review checklist naming the subcommand as the verification
        step is unexecutable on every forge in the fleet.

        AND `stamped:` ALONE IS STILL NOT ENOUGH, which is worth recording here because
        it is the same class: the line proves a stamp was WRITTEN, not that it CHANGED.
        A rebuild that silently did not take effect re-stamps the pre-merge surface and
        prints an identical `stamped:` line. The discriminator is the VALUE — capture
        the hash before the merge and after the rebuild and assert it differs, since a
        merge bringing checker changes into the validator surface must move it. Baseline
        captured on this host for exactly that purpose, at trunk 4ec6f3caa:

          d5bcff7f83874c69a612275f6412c1c2a1fd471d0866902d19af3b0ce128381c

        SUGGESTED, not done here since this row is completed: whatever names the
        verification step should name the script, and the `unknown:` line should not be
        shaped like a verdict — `refused:validator-surface:no-checkout-above-binary`
        would be unmistakable where `unknown:…` is not.
