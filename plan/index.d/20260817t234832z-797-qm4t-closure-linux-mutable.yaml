        qwen2.5:0.5b on CPU, which is why spec_answer's synthesis fell back to
        the retrieval-only cited-digest floor: a 0.5B model on a 24 GiB
        accelerator that was not plugged in.

        WHAT I VERIFIED, in order:
          1. `nvidia-ctk cdi generate` works ROOTLESS, rc=0, no rpm and no
             second sudo — exactly what order 408 asks for. It emits kind
             nvidia.com/gpu with devices "all", "0" and the GPU UUID. Only
             cosmetic warnings (nvidia_drv.so / libglxserver, X-server libs
             irrelevant to compute).
          2. `podman run --device nvidia.com/gpu=all` against the inference
             image: the entrypoint printed `vram_mb=24564`. The container SEES
             the card.
          3. Same run printed `engine backends available: cuda_v12 cuda_v13
             vulkan`. The ollama payload already carries CUDA.

        WHAT WAS ACTUALLY MISSING, and it was two lines: the same run printed
        `tuning: tier=cpu ... vram_mb=24564` — it saw 24 GiB and chose CPU,
        because entrypoint.sh:165 reads `${TILLANDSIAS_INFERENCE_TIER:-cpu}`
        and nothing set it. Tier is an INPUT that gets corroborated against
        /dev/nvidia0 (entrypoint.sh:227-237), not derived from the hardware.

        WHY IT MATTERED BEYOND ONE HOST: the policy router's fallback chains
        terminate in the CPU tier-S terminal by design (ROUTE-2). On this host
        the chain had ALWAYS terminated there — not because the fallback logic
        is wrong, but because the GPU lane was never offered to it. The fleet
        therefore had no HIGH-tier reference measurement at all.

