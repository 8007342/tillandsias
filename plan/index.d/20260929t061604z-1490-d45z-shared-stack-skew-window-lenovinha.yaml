    owned_files:
      - crates/tillandsias-core/src/version_guard.rs
      - crates/tillandsias-headless/src/main.rs
      - scripts/test-shared-stack-skew.sh
    title: |
      Shared-stack version skew is explicit: version_guard gains compatible(binary, image) with a WINDOW_DAYS constant; after adoption an Incompatible shared container is drained-then-swapped only when no forge depends on it, otherwise reported as deferred:skew; forges are never swapped; --diagnose prints the skew table
    context: |
      Image tags are versioned (versioned_image_tag main.rs:2348 ->
      localhost/tillandsias-<name>:v<VERSION>) but container reuse is by name:
      vault (vault_bootstrap.rs:826), proxy (ensure_proxy_running main.rs:3836
      returns early if running), nix-cache (:6419), catalog services
      (container_deps.rs:511). Only ensure_router_running (main.rs:6241)
      compares the running image to the version tag and recreates. After a
      binary swap the shared stack silently keeps running the OLD image while
      new forges get the NEW forge image; skew is neither detected nor
      declared. version_guard (crates/tillandsias-core/src/version_guard.rs)
      already parses the monotonic CalVer and refuses downgrades
      (downgrade_refusal main.rs:2869); it has no notion of "close enough".
      cleanup_shared_stack_if_no_running_forge (main.rs:7776) already knows
      when a shared container has no dependents. Design D3; spec delta
      app-lifecycle "Shared-stack version skew is explicit and bounded".
    exit_criteria:
      - 'version_guard::compatible(binary, image) returns Same / Compatible / Incompatible with WINDOW_DAYS as a named constant (pre-fix: no such function)'
      - 'with one forge running and the proxy on an Incompatible image, the proxy container id is unchanged and --diagnose shows proxy deferred:skew (pre-fix: no report, proxy silently stays old)'
      - 'with no forge running, the same proxy is recreated on the current tag and its readiness probe passes before the run reports upgraded'
      - 'a forge on an old image is listed in the skew table and never swapped'
    verifiable_closure: |
      bash scripts/test-shared-stack-skew.sh exits 0. Pre-fix: the script does not exist.
