  - packet_id: macos-no-read-only-guest-exec-while-the-tray-owns-the-vm
    order: 1897-y7j2
    status: ready
    kind: feature
    priority: p3
    desired_release: v0.5
    pickup_role: macos
    capability_tags: [macos, storage, vm]
    estimated_hours: 3
    title: "No read-only way to run a guest command on macOS while the operator's tray owns the VM"
    context: |
      [M] tillandsias-tray --exec-guest refuses: "needs to boot the VM, but a running Tillandsias tray owns it". So storage task 6.5 (df -hT on /home/forge/src, /tmp, overlay, HOMEBREW_CACHE, TMPDIR inside the guest) could not be run without quitting the tray, which agents must not do. [S] HOMEBREW_CACHE is set only in images/default/brew-shim-exec.sh; TMPDIR is unset in VM provisioning; forge containers get --tmpfs /tmp:size=256m (container_profile.rs).
    exit_criteria:
      - "--exec-guest (or a tray-routed equivalent) runs a command in the already-running guest via the owning tray, and the 6.5 df check is recorded. Pre-fix: FAILS with the owns-the-VM refusal."
    verifiable_closure: "--exec-guest (or a tray-routed equivalent) runs a command in the already-running guest via the owning tray, and the 6.5 df check is recorded. Pre-fix: FAILS with the owns-the-VM refusal."
