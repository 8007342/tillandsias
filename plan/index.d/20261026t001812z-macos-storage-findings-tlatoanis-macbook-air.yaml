packets:
  - packet_id: macos-guest-root-disk-is-in-time-machine-backups
    order: 1893-6crj
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: macos
    capability_tags: [macos, storage, vm]
    estimated_hours: 3
    title: "The macOS guest root disk (20-50 GiB sparse rootfs.img) is in Time Machine backups; only the swap image is excluded"
    context: |
      [M] tmutil isexcluded rootfs.img = Included; vm-swap.img = Excluded. [S] vz.rs boot::exclude_from_time_machine is applied only to the swap image. rootfs.img churns with every guest write, so each backup can re-copy gigabytes. Also rootfs.qcow2 (528 MB download) is kept after conversion (vz.rs fetch_fedora_cloud_image / convert_qcow2_to_raw). vm-identity.img is backed up on purpose and must stay so.
    exit_criteria:
      - "A fixture over the image-root setup asserts rootfs.img (and rootfs.qcow2 or its removal) is passed to the Time Machine exclusion and vm-identity.img is not. Pre-fix: FAILS, only vm-swap.img is excluded."
    verifiable_closure: "A fixture over the image-root setup asserts rootfs.img (and rootfs.qcow2 or its removal) is passed to the Time Machine exclusion and vm-identity.img is not. Pre-fix: FAILS, only vm-swap.img is excluded."
    unscoreable: |
      unpinnable-until-the-guard-exists: the fix adds the fixture named in the exit criterion in the same commit (1136-n8sh).
    next_action: >
      Write the fixture named in the exit criterion first and watch it fail, then fix.
    provenance: |
      macOS research for openspec change forge-storage-single-root-and-disk-discipline tasks.md section 6 (PR #650), tlatoanis-macbook-air 2026-10-25, coordinator-assigned. [M]=measured on this host, [S]=source-read, [U]=unverified.
