  - packet_id: macos-guest-deletes-never-return-space-to-the-host-no-discard
    order: 1894-r3r4
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: macos
    capability_tags: [macos, storage, vm]
    estimated_hours: 3
    title: "Space freed inside the macOS guest never returns to APFS: no discard/TRIM through virtio-blk"
    context: |
      [S] every VZDiskImageStorageDeviceAttachment uses initWithURL:readOnly:error: defaults (vz.rs boot::build_vm_configuration); the guest has no fstrim timer or discard mount option (vz.rs provision_user_data). [M] rootfs.img is sparse on APFS (20 GiB apparent, ~2 GB allocated). [U] whether Virtualization.framework virtio-blk passes discard to punch holes in the sparse file. This blocks the L1/L2 layers (forge-storage-layers): a deleted forge scratch dir would not shrink the host image.
    exit_criteria:
      - "Probe first: in the guest write 1 GiB, delete it, run fstrim -v /, and compare host du of rootfs.img before and after. If reclaim works, enable fstrim (timer or discard) and pin with a fixture asserting the guest config carries it; if not, record the platform limit in design.md and size L1/L2 accordingly."
    verifiable_closure: "Probe first: in the guest write 1 GiB, delete it, run fstrim -v /, and compare host du of rootfs.img before and after. If reclaim works, enable fstrim (timer or discard) and pin with a fixture asserting the guest config carries it; if not, record the platform limit in design.md and size L1/L2 accordingly."
    unscoreable: |
      unpinnable-until-the-guard-exists: the fix adds the fixture named in the exit criterion in the same commit (1136-n8sh).
    next_action: >
      Write the fixture named in the exit criterion first and watch it fail, then fix.
