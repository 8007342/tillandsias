    capability_tags: [macos, storage, vm]
    estimated_hours: 3
    title: "The macOS guest console.log rotates only when the VM boots, so a long-running VM grows it without bound"
    context: |
      [M] console.log reached 126 MB after 3 days of uptime (boot 2026-10-22). [S] vz.rs VzRuntime::rotate_console_log_if_oversized runs only from the boot path (rename to console.log.prev when over CONSOLE_LOG_MAX_BYTES); nothing checks it while the VM runs.
    exit_criteria:
      - "A fixture drives console output past CONSOLE_LOG_MAX_BYTES on a running VM (or the writer seam) and asserts the file stays bounded without a reboot. Pre-fix: FAILS, size grows until the next boot."
