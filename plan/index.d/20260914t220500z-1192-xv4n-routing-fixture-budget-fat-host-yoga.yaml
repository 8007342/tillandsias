      headroom and a comment carrying the measurement (86ac0e26d shows the
      shape), then the guard named in unscoreable, so the next ledger-growth
      increment is reported instead of being discovered as a red. Do not
      "fix" it by shrinking the fixture's coverage to fit the clock.
