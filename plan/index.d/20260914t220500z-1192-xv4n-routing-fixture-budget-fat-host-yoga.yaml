    context: |
      MEASURED on yoga 2026-09-14, and the contention question was settled
      before the row was filed rather than after:

      - `scripts/run-litmus-test.sh ci-release --phase pre-build`, run ONCE
        with nothing else on the host: step 1/5 TIMEOUT at 120s. The runner's
        own diagnostic agreed it was not contended — "cpu.pressure some-stall
