      This is 1187-iij8's class — a single-step litmus budget that assumes a
      fast host — with one fact that row does not yet carry: yoga is NOT a
      floor-tier host, and it misses the budget by fourteen percent on a
      quiet machine. The cost is in the fixture's repeated selector-style
      invocations against a ledger of 947 packets, so the budget decays as
      the ledger grows and every host crosses the line eventually; the floor
      tier crossed it first. Cite 1187-iij8 rather than re-deriving it.

      The SAME failure was hit and fixed in passing at 86ac0e26d, which is
      the second data point: step 5 of litmus-cycle-batch-triage-shape was
      budgeted at 120s, measured 2m24s uncontended, and its timeout ABORTED
      the whole test before step 23 — the arm that packet was about — ever
      ran. A budget miss does not fail one arm; it truncates the test, and
      the arms after it report nothing while looking like they were covered.

