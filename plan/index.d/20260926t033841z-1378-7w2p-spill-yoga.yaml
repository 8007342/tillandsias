      summary: |
        For the budget, from 1378-7w2p (§7.2 table on that row):
        (1) SWAP MAPPING, measured with rootless podman/crun on yoga:
            --memory=1g --memory-swap=1g -> memory.swap.max = 1 GiB (NOT zero)
            --memory=1g --memory-swap=2g -> memory.swap.max = 2 GiB
            --memory=1g --memory-swap=0  -> memory.swap.max = 0
            crun writes --memory-swap to swap.max LITERALLY. Docker's reading
            ("memory-swap equal to memory means no swap") does NOT hold here, so an
            "equal ceiling = zero swap escape" assertion (the 437 shape) grants as
            much swap as memory on these hosts. Emit swap.max explicitly, or pass
            --memory-swap as the swap amount you mean.
        (2) Spill: at W = 2M, tmpfs+swap writes ~22% faster than a disk volume but
            shuffled reads are ~3.6x slower (n=1, incompressible data, zram). Size HOT
            to stay resident; treat the allowance as an OOM guard.
