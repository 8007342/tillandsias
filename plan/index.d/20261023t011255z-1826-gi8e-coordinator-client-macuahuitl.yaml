    title: |
      `tillandsias-plan coord` (join, send, recv, overview get/put, claim-overlay, heartbeat) plus a forge-plan MCP tool: a coordinator client with a client-side rate limit, a self-measured adaptive heartbeat ≤ 2 min that backs off when the host is busy and stops during gates and agent turns, request batching, and an offline fallback that answers from the git ledger with an explicit `source: git-ledger` marker
    context: |
      Binding design: fleet-coordinator-warm-cache-milestone context. The
      client is where "no fixed polling" is enforced: calls happen on demand
      (forge start, after push, idle seeking work); the heartbeat interval is
      measured (round-trip + host load) and only grows when the host is busy;
      it is suspended while a build.sh gate or an agent turn holds the lane
      marker. The Access service token is read from the vault (1824-58bm's
      vault child) and sent as CF-Access-Client-Id / CF-Access-Client-Secret;
      it is never written to disk in plaintext (operator ruling: no plaintext
      credentials at rest). Offline or 429 → the answer comes from the local
      fold (`next`, `status`) and says so. Relation to the existing lane
      messaging (msg_store.rs, 1506-nvqt, receipts and acks): the
      coordinator queue is the cross-host best-effort tier with NO receipts;
      the client must not reuse the ack/receipt vocabulary for it.
    exit_criteria:
      - 'against the 2b Worker running under wrangler dev, `coord join <ns>`, `send`, `recv` round-trip; `coord claim-overlay <order>` makes `coord next` on a second client omit that row (pre-fix result: FAILS — no coord verb)'
      - 'with the coordinator unreachable, `coord next` exits 0 and prints the git-ledger answer with source: git-ledger (pre-fix result: FAILS — no verb)'
      - 'a unit test of the heartbeat scheduler: interval never exceeds 120 s, doubles under a busy signal, and emits no tick while the gate/turn marker is held; the client rate limiter refuses a burst past its budget without a network call (pre-fix result: FAILS — no scheduler)'
      - 'no `jq` or `python` is introduced (pre-fix result: n/a)'
    unscoreable: |
