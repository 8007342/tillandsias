      summary: >
        CORRECTION — this packet OVERSTATED the finding, and the operator caught
        it with "what llm provider keys? I'm not aware of such."
        MEASURED against the running vault: secret/anthropic/api-key,
        secret/openai/api-key and secret/gemini/api-key are ALL EMPTY on this
        host. The injection at main.rs is gated on `!key.is_empty()`, so NOTHING
        is injected. This is a DORMANT code path, not a live exposure. The packet
        described it as current, which was wrong.
        THE MISTAKE UNDERNEATH, worth recording because the next reader will hit
        it: there are TWO enums named ProviderId in this crate.
        main.rs:7029 has GitHub/Claude/Codex/Antigravity mapping to
        secret/*/oauth — the LOGIN flows. vault_bootstrap.rs:931 has
        Anthropic/Openai/Gemini mapping to secret/*/api-key — the LANE injection.
        I read the vault paths from the first, saw `.env(p.env_var(), &key)` in
        the lane builder, and assumed they were the same. Same name, different
        enum, different purpose. That collision is its own defect and is filed
        separately.
        WHAT ACTUALLY HAPPENS with the credentials this host DOES hold: the OAuth
        documents (secret/claude/oauth, secret/codex/oauth,
        secret/antigravity/oauth — all PRESENT) reach a lane through the GOOD
        pattern. The lane receives a scoped Vault token as a PODMAN SECRET
        (--secret, mode 0400 under /run/secrets) and its entrypoint restores the
        provider document inside the container. The OAuth credential itself never
        appears in --env, never on podman argv, never in Config.CreateCommand.
        There is also a credential quarantine: empty tmpfs overlays at
        /home/forge/.ssh and /home/forge/.config/gh.
        SO THE REVISED SCOPE OF THIS PACKET: it is no longer "fix a live
        exposure". It is "prevent a latent one" — if anyone ever writes a key to
        secret/<provider>/api-key, it will be injected via --env KEY=VALUE and
        land in podman argv and the container config silently, with no warning
        and no test catching it. That is worth guarding BEFORE someone sets one,
        not after.
        The exit criteria stand, but the deliverable must state the path is
        currently dormant so a future agent does not go hunting for an exposure
        that is not there and conclude the audit tooling is broken.

