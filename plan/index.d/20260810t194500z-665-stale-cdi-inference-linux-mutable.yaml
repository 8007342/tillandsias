packets:

  - packet_id: nvidia-driver-update-strands-inference-container
    order: 665-zddn
    status: ready
    desired_release: v0.5
    priority: p2
    title: "A host NVIDIA driver update silently strands the inference container and kills every forge launch"
    kind: bugfix+enhancement
    deliverable: launcher-side stale-CDI detection/remediation in the inference ensure path + a litmus pinning the error classification
    depends_on: []
    pickup_role: linux
    capability_tags: [inference, gpu, cdi, podman, launch, resilience]
    estimated_hours: 3
    context: >
      Reproduced live 2026-08-10 on macuahuitl while executing the operator's
      tray-hosted BigPickle launch. The host kernel/driver updated Aug 6
      (610.43.03 -> 610.57.04). The user-level CDI spec ~/.config/cdi/nvidia.yaml
      still described 610.43.03, so `podman start tillandsias-inference` failed
      with `crun: cannot stat /usr/lib64/libEGL_nvidia.so.610.43.03`, the
      container wedged in Created state, and the forge launcher DIED there —
      after router and git-mirror were already up — leaving a half-provisioned
      enclave and a closed terminal window with no durable error anywhere on
      the host (the error was only recoverable from `podman inspect
      .State.Error`). Every subsequent launch hits the same wall: the stale
      Created container is reused, not recreated. Manual remediation that
      worked: `nvidia-ctk cdi generate --output ~/.config/cdi/nvidia.yaml`,
      `podman rm tillandsias-inference`, relaunch — after which inference and
      the forge came up clean. Related surface: order 392b
      (inference-startup-cleanup/gpu-passthrough-tier-matrix).
    exit_criteria:
      - >
        The inference ensure path classifies the crun cannot-stat-driver-lib
        failure explicitly (error text names the stale CDI spec, the current
        host driver version, and the exact remediation) instead of dying
        opaquely mid-launch.
      - >
        A Created-but-never-started inference container whose start fails with
        the stale-driver class is recreated automatically (safe: it never ran),
        and — where nvidia-ctk is available — the user CDI spec is regenerated
        or the operator is told to run the exact command.
      - >
        A litmus pins the error-classification path with a fixture (no GPU
        required: replay the crun error string).
      - >
        A launch failure after partial enclave provisioning leaves a durable
        one-line breadcrumb on the host (not only in a vanishing terminal
        window) naming the failed service and the inspect command.
    events:
      - ts: "2026-08-10T19:45:00Z"
        event: filed
        summary: >
          Filed from the 2026-08-10 coordinator cycle; failure reproduced,
          root-caused (stale user CDI spec after driver update), manually
          remediated, and the relaunch verified green on this host.
