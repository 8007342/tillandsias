      landing sha) and a summary line whose total equals the number of suspect lines,
      exit 0 always (advisory). Its fixture has three arms: a landed order with status
      ready is listed; a landed order with status completed is not; a plan-only commit
      citing an order is not counted as a landing. PRE-FIX RESULT: the script does not
      exist.
    next_action: |
