      summary: |
        THE ALLOW-LIST FIX LANDED at 0e8d62e0c (land46), with the relay-side binding
        litmus:reset-flags-accepted (spec ci-release, phase post-build — it needs the
        binary the gate just built).

        WHAT IT REPAIRS, recorded here because this row is where the contract lives.
        v56.9.20.1 SHIPPED UNINSTALLABLE ON LINUX: its published install.sh calls
        `--reset-state` and its published binary refused the flag.

          Running tillandsias --reset-state (resets local state, then reprovisions...)
          [tillandsias] version: 56.9.20.1
          Unsupported option: --reset-state
          install_exit=2

        Found by the release smoke on pirria at §1, before §2 ran, so no host's substrate
        was destroyed by it. The release is superseded rather than repaired (coordinator
        ruling: fix forward, never a repaired tag), and its README row carries the defect.

        THE CAUSE: the flag is parsed from user_args, documented in usage and in --help,
        and dispatched — and `known_flags` did not contain it, so the allow-list exited 2
        before any dispatch was reached. The ORDER is the defect: parse, then allow-list,
        then refusal, then dispatch. `--reset-guest` was absent from the same list with
        its dispatch likewise after the refusal — rejected by reading the same branch,
        NOT measured, because measuring it costs a host's substrate.

        A FLAG IS NOT ADDED IN ONE PLACE. Parse arm, dispatch, usage line, help line and
        the allow-list entry are five sites, and the first four produce a binary that
        mentions the flag everywhere a reader or a source scan would look while refusing
        it at runtime. I added four of the five.

        AND THE ARM ON THIS ROW COUNTED MENTIONS. litmus:installer-reprovisions-on-install
        step 1 asserted the flag "exists on the Linux surface" by counting occurrences of
        `--reset-state` in main.rs and requiring >= 4. It counted 12 and reported 7/7
        PASS on a tree whose binary refused the flag. Mentions are not acceptance, and
        only running the binary tells them apart — which is what
        scripts/test-reset-flags-are-accepted.sh now does (4/7 before the fix, 7/7 after).

        TWO GUARDS, BOTH MUTATION-PROVEN. The fixture probes `--reset-guest` under
        TILLANDSIAS_DESTRUCTIVE_RESET_OK=0 DELIBERATELY: that path refuses and returns,
        destroying nothing, while `--reset-state` under the same env prints the skipped
        line and calls run_init, which PROVISIONS AN ENCLAVE. A litmus step must not
        bring up a substrate to prove a flag parses, so acceptance is proven on the inert
        flag and the other is covered structurally. The second guard,
        flag_surface_tests::every_dispatched_flag_is_in_the_known_flags_allow_list, is
        the twin of the Windows tray's known_flags_match_the_dispatch_in_main (E4) IN THE
        DIRECTION E4 DOES NOT COVER: E4 iterates KNOWN_FLAGS and catches a flag LISTED
        AND UNUSED; a flag USED AND UNLISTED is never iterated. The Windows tray is safe
        because it HAS the entry, not because that test would have caught its absence —
        the coordinator has propagated that correction to yolanda and macneo.
