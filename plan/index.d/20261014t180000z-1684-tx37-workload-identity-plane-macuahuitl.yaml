    title: |
      Cross-host trust for the fleet mesh and inference swarm: each host publishes its enclave-CA bundle in SPIFFE federation form, and peers trust a listed domain one-way without ever merging bundles
    context: |
      There is no cross-host trust primitive today; 692-zjzg's note says the epoch CA "explicitly punts". The fleet VPN (1505-sm2j) and the inference swarm will need one. Borrow only the SPIFFE federation spec: a bundle endpoint per host, reached over the existing mirror lane or the fleet VPN, with a refresh hint; one-way relationships; bundles kept separate per trust domain. Deferred until lane client certs exist (1689-echb).
    exit_criteria:
      - "host B verifies a client cert chained to host A's published bundle and refuses one from a trust domain it has not listed"
    unscoreable: "deferred design row: scoreable once 1689-echb lands; the cross-host verify arm is the deliverable"
