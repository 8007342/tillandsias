  - packet_id: per-lane-sockets-admit-only-peers-whose-kernel-attested-cgroup-is-the-owning-lane-container
    order: 1692-37qz
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.6
    size: M
    pickup_role: linux
    capability_tags: [security, sockets, attestation, mcp, ssh-ca]
    related: [1684-tx37, 1688-ideu, 1694-j2sk]
    depends_on: []
    title: |
      The ssh-agent sidecar socket and the per-lane control/MCP socket trust whoever can open the file; each must check the peer with SO_PEERCRED and its cgroup against the owning lane's container id (SPIRE's unix + docker workload attestation, without SPIRE)
    context: |
      Per-lane MCP sockets attribute by the accepting listener (openspec/specs/mcp-tool-socket/spec.md), and the ssh-agent volume serves whoever mounts it. A second container mounting the same named volume, or a child process with the right uid, can reuse the lane's signing oracle. On Linux the fix is cheap: SO_PEERCRED gives the peer pid and uid, and /proc/<pid>/cgroup names the libpod container id, which must equal the lane's container. That is exactly SPIRE's unix and docker workload attestors.
      On macOS and Windows the sockets live inside the Linux guest, so the same code applies there. That is inferred and must be verified on both.
      SELinux MCS confinement (1694-j2sk) is the second, independent layer, and the two rows must not depend on each other.
    exit_criteria:
      - "a connection to a lane's ssh-agent socket from a sibling container that mounts the same volume is refused, and the refusal names the peer's container id (red today: served)"
      - "the same check on the per-lane control socket refuses a peer outside the lane, verified on Linux, the macOS guest and the WSL2 guest"
    unscoreable: "unpinnable-until-the-guard-exists: the refusal arm is the deliverable"
    next_action: >
      Find the accept paths: the ssh-lane sidecar's agent socket and the control-socket listener in crates/tillandsias-headless. Write the sibling-container arm first and record it red, then add the peer check.
    provenance: |
      Filed by macuahuitl-fedora, 2026-10-14 (workload-identity study, recommendation 4).
    events:
      - type: filed
        ts: "2026-10-14T18:00:00Z"
        host: macuahuitl
        summary: |-
          Kernel-attested peer check on per-lane sockets.

  - packet_id: selinux-labeling-is-on-by-default-for-every-enclave-container-and-label-disable-is-a-named-exception
    order: 1693-9qfb
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    size: L
    pickup_role: linux
    capability_tags: [security, selinux, podman, enclave]
    related: [1684-tx37, 1694-j2sk, 1641-xbvq]
    depends_on: []
    title: |
      --security-opt=label=disable is one of the four MANDATORY_HARDENING_FLAGS, so every enclave container runs SELinux-unconfined and any other label= is refused as a weakening; invert it so container_t with a per-container MCS pair is the default and label=disable is a named, justified exception
    context: |
      Measured 2026-10-14, crates/tillandsias-podman/src/policy.rs: MANDATORY_HARDENING_FLAGS = [--userns=keep-id, --cap-drop=ALL, --security-opt=no-new-privileges, --security-opt=label=disable], and is_weakening_security_opt() treats every label= value other than disable as a weakening. ContainerSpec (container_spec.rs) pushes label=disable whenever label_disable is set, and browser_open.rs documents it as ContainerSpec's default. There are 42 label=disable sites across 9 crate files.
      This is backwards for SELinux. label=disable removes podman's per-container MCS separation (container_t:s0:cX,cY), which is the kernel's own guarantee that one container cannot read another container's files or connect to another's sockets even when both share a uid.
      There is a precedent: the Vault uses a custom confined type, vault_container_t, inside the guest VM. The rootless-host fallback to label=disable exists because the vault data volume was created unlabeled (plan/issues/vault-rootless-container-exits-immediately-2026-07-03.md). The fix is a one-time relabel (:Z, or a chcon migration), not running unconfined forever.
      Platforms: Linux hosts (Fedora/Silverblue: enforcing) and the macOS VZ Fedora guest enforce SELinux. WSL2 Fedora usually runs without SELinux, so on Windows the row must state what it measures there.
      Expect breakage: bind mounts, the Wayland socket (1641-xbvq), tmpfs lanes and named volumes. Every one needs a :z/:Z or a named exception. Land it incrementally, one container role at a time, with the inventory below as the guard.
    exit_criteria:
      - "the hardening guard refuses label=disable unless the call site names an exception from an allow-list in policy.rs, each with a reason and a row (red today: label=disable is mandatory)"
      - "the forge, mirror, router, proxy, inference and browser containers start under container_t with distinct MCS pairs on an enforcing Fedora host, and a file written by one is unreadable from another sharing the uid (red today: readable)"
    unscoreable: "unpinnable-until-the-guard-exists: the inverted guard and the cross-container read arm are the deliverable"
    next_action: >
      Write the cross-container read arm on an enforcing host first and record it red. Then invert the guard, with every current site on the exception allow-list. Remove the exceptions one container role at a time, starting with the router, which has the fewest mounts.
    provenance: |
      Filed by macuahuitl-fedora on the operator's direction ("plenty of SELinux enforcements"), 2026-10-14; the policy.rs finding was measured while filing.
    events:
      - type: filed
        ts: "2026-10-14T18:00:00Z"
        host: macuahuitl
        summary: |-
          label=disable is a mandatory hardening flag; invert it.

