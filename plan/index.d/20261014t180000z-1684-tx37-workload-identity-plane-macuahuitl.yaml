packets:
  - packet_id: workload-identity-plane-spiffe-model-enclave-mtls-and-selinux-lane-confinement
    order: 1684-tx37
    status: pending
    kind: milestone
    priority: p1
    desired_release: v0.6
    pickup_role: any
    capability_tags: [security, identity, enclave, selinux, mtls]
    related: [692-zjzg, 1685-kwmr, 1686-7miz, 1687-ipmx, 1688-ideu, 1689-echb, 1690-iqh5, 1691-96gk, 1692-37qz, 1693-9qfb, 1694-j2sk, 1695-h8bu]
    depends_on: []
    title: |
      Workload identity plane: every enclave workload is named in SPIFFE form, every enclave connection authenticates both ends, and every lane is SELinux-confined to its own category
    context: |
      The operator's direction (2026-10-14), after a study of SPIFFE/SPIRE: "inference and router and a bunch of services within our enclave are wide open, and would benefit from two-way tls in many other places as well"; name identities in SPIFFE form and "popularize and extend" that, including a "non-aggregatable identity of the agent, providing project, lane, agent, model" on git commits; and for the per-lane sockets "make sure there's plenty of SELinux enforcements on top of that to make it super-duper-extra strong".
      The decision recorded with the study: borrow the SPIFFE MODEL, do not run SPIRE. Its server, agent, datastore and registration workflow are built for clusters, Red Hat scopes its product (Zero Trust Workload Identity Manager) to OpenShift, and floor-tier hosts cannot carry two more daemons. Vault stays the signing authority (SPIRE accepts Vault as an UpstreamAuthority, so the door stays open). JWT-SVIDs are not adopted: X.509 over Unix or vsock sockets is stronger, and the JWT-SVID spec itself lists replay as a weakness.
      What already has the model's shape: the SSH-CA push lane (the workload never holds the key; 30 m certs renewed at 20 m), per-lane MCP sockets that attribute from the accepting listener, and the host-guest PSK keyed to the guest binary digest (1084-x8ya).
      What is open: the anonymous git:// receive path, no client authentication on inference, router, proxy or Vault (bearer tokens only), and `--security-opt=label=disable` as one of the four MANDATORY_HARDENING_FLAGS (crates/tillandsias-podman/src/policy.rs), so every enclave container runs SELinux-unconfined.
    exit_criteria:
      - "every child row below is completed, verified or done, or obsoleted with a recorded reason"
      - "the enclave listener inventory (1688-ideu) reports zero listeners with client-auth=none that lack a named, dated waiver"
    unscoreable: "milestone: closure is its children's closures; it has no deliverable of its own"
    next_action: >
      Land the spec change openspec/changes/workload-identity-plane. Then start the two v0.5 rows: 1685-kwmr (refuse git:// pushes) and 1693-9qfb (SELinux labeling on by default). The listener inventory 1688-ideu comes next, because every mTLS row is judged by it.
    provenance: |
      Filed by macuahuitl-fedora on the operator's direction, 2026-10-14, from a Fable research pass over spiffe.io, the SPIFFE specs, the SPIRE docs and Red Hat's topic page.
    events:
