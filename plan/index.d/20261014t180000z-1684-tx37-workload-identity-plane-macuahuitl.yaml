        ts: "2026-10-14T18:00:00Z"
        host: macuahuitl
        summary: |-
          Umbrella for the SPIFFE-model identity plane, enclave mTLS and SELinux lane confinement.

  - packet_id: the-git-mirror-refuses-anonymous-git-protocol-pushes-and-the-ssh-ca-lane-is-the-only-receive-path
    order: 1685-kwmr
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    size: M
    pickup_role: linux
    capability_tags: [security, git-mirror, ssh-ca, enclave]
    related: [1684-tx37, 756-2jnj]
    depends_on: []
    title: |
      Any enclave container can push to the git mirror over anonymous git:// and the privileged relay carries it to GitHub under the operator's identity; the SSH-CA lane must be the only receive path
    context: |
      openspec/specs/git-mirror-service/spec.md still describes the git:// receive path as interim and anonymous ("network placement SHALL NOT be described as client authentication"). The SSH-CA lane already exists: the per-lane sidecar holds the only key, Vault signs a user cert for principal til:forge-push:<mirror-id> with a 30 m TTL, and the sshd ForceCommand (images/git/tillandsias-receive.sh) takes the principal, serial and fingerprint from the cert and ignores the requested path.
      Threat: a compromised forge or a rogue container on the enclave network fast-forwards refs in another project's mirror, and the upstream relay publishes them as the operator.
      Unverified: whether the mirror's own reconcile or fetch path needs receive-pack on the daemon. Answer that first.
    exit_criteria:
      - "a litmus arm pushing to the mirror over git:// from an enclave container is refused, and the refusal names the SSH lane (red today: the push is accepted)"
      - "a push over the SSH-CA lane from the owning lane still lands, and one from a different project's lane is refused by principal"
    unscoreable: "unpinnable-until-the-guard-exists: the refusal arm is the deliverable"
    next_action: >
      Read images/git/ (the daemon launch, the git-daemon flags, the reconcile path) and confirm nothing internal pushes over git://. Then start the daemon without receive-pack and write the refusal arm. Run it against today's mirror first and record that it goes red there.
    provenance: |
      Filed by macuahuitl-fedora, 2026-10-14 (workload-identity study, recommendation 1).
    events:
      - type: filed
        ts: "2026-10-14T18:00:00Z"
        host: macuahuitl
        summary: |-
          git:// receive path is anonymous; make the SSH-CA lane the only push path.

  - packet_id: workload-identities-are-named-in-spiffe-form-and-carried-in-the-ssh-lane-cert-key-id
    order: 1686-7miz
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.6
    size: S
    pickup_role: any
    capability_tags: [security, identity, ssh-ca, spec]
    related: [1684-tx37, 1687-ipmx]
    depends_on: []
    title: |
      One SPIFFE-form name for every enclave workload — spiffe://<host-trust-domain>/project/<mirror-id>/lane/<instance>[/agent/<harness>] — carried in the SSH lane cert's Key ID
    context: |
      Today workload names are ad hoc: til:forge-push:<mirror-id>, git-<mirror-id>, lane socket paths, container names. A single grammar (SPIFFE ID: one trust domain per host install, path segments project/lane/agent) makes every later row speak one language: the mTLS URI SAN (1689-echb, 1690-iqh5, 1691-96gk), the commit provenance trailer (1687-ipmx) and federation (1695-h8bu).
      The grammar goes in the SSH cert's Key ID, NOT the principal, so sshd's principal match is unchanged. The trust-domain string must be derived per install and must not encode the operator's identity.
      The grammar is specified in openspec/changes/workload-identity-plane/specs/workload-identity/spec.md.
    exit_criteria:
      - "a fixture parses the Key ID of a freshly signed lane cert as a SPIFFE ID whose path names that lane's mirror id (red today: the Key ID is unspecified)"
      - "the grammar is in openspec/specs/ with one parser, used by every consumer and refusing anything else"
    unscoreable: "unpinnable-until-the-guard-exists: the parser fixture is the deliverable"
    next_action: >
      Find where the sidecar asks Vault to sign (images/git/ssh-lane-sidecar.sh, vault-agent-signer.hcl) and what Key ID it gets today. Then add the grammar and its parser, with a fixture that refuses a malformed ID.
    provenance: |
      Filed by macuahuitl-fedora, 2026-10-14 (workload-identity study, recommendation 2; the operator asked to "popularize and extend" the SPIFFE naming).
    events:
      - type: filed
        ts: "2026-10-14T18:00:00Z"
        host: macuahuitl
        summary: |-
          SPIFFE-form workload naming, starting in the SSH lane cert Key ID.

  - packet_id: agent-commits-carry-a-signed-non-aggregatable-workload-identity-naming-project-lane-agent-and-model
    order: 1687-ipmx
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.6
    size: L
    pickup_role: any
    capability_tags: [security, identity, git, provenance, forge]
    related: [1684-tx37, 1686-7miz, 1668-8jmq]
    depends_on: [workload-identities-are-named-in-spiffe-form-and-carried-in-the-ssh-lane-cert-key-id]
    title: |
      Every forge commit carries a workload-identity trailer (project, lane, agent harness, model) that the mirror can verify but that cannot be aggregated across projects, signed with the lane's short-lived SSH cert
    context: |
      Operator, 2026-10-14: "for git commits we might want to provide some non-aggregatable identity of the agent, providing project, lane, agent, model, etc".
      1668-8jmq fixed authorship: the author is the operator's GitHub App identity, and agents are credited in Co-Authored-By trailers. This row adds machine-verifiable provenance next to that and does not replace it.
      Non-aggregatable means two projects' commits must not share a stable agent or lane identifier that an outside reader could join on. The proposal is a pairwise pseudonym, as in OIDC pairwise subjects: an HMAC under a per-project key held in Vault over the lane instance, harness and model. The trailer then names the SPIFFE path with the pseudonym, plus the harness and model in clear, because those are useful and not identifying. The project's own mirror can re-derive and verify it; GitHub readers see stable per-project values that do not correlate across repos.
      Signing: git supports gpg.format=ssh. The lane's short-lived SSH user cert (from the existing sidecar, so the forge never holds the key) can sign commits, and the mirror verifies the signature against the enclave SSH CA before relaying. An unsigned or foreign-signed forge commit is refused at receive.
      Open questions to settle in the spec: whether the model string can be trusted when the harness self-reports it (it can't be attested, so the spec must say so), and how signatures survive the mirror-to-GitHub relay (GitHub shows ssh-signed commits as unverified unless the key is registered; the signature is for the mirror, not for GitHub's badge).
    exit_criteria:
      - "a commit made in a forge lane carries a Tillandsias-Workload trailer whose pseudonym differs between two projects for the same lane, harness and model, and verifies against its own project's key (red today: no trailer)"
      - "the mirror refuses a forge push containing a commit that is unsigned or signed by a key outside the enclave SSH CA (red today: accepted)"
    unscoreable: "unpinnable-until-the-guard-exists: the trailer and the receive-time verification are the deliverable"
    next_action: >
      Write the trailer grammar and the pseudonym derivation into openspec/changes/workload-identity-plane/specs/workload-identity/spec.md (a requirement is drafted there). Then find where the forge configures git (configure_git_identity in images/default/lib-common.sh), and check that a non-interactive gpg.format=ssh signing can go through the sidecar's agent socket.
    provenance: |
      Filed by macuahuitl-fedora on the operator's direction, 2026-10-14.
    events:
      - type: filed
        ts: "2026-10-14T18:00:00Z"
        host: macuahuitl
        summary: |-
          Signed, pairwise-pseudonymous agent provenance on forge commits.

