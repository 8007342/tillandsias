  - packet_id: the-inference-service-admits-only-lanes-presenting-an-enclave-client-cert
    order: 1690-iqh5
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.6
    size: L
    pickup_role: any
    capability_tags: [security, inference, mtls, enclave]
    related: [1684-tx37, 1688-ideu, 1689-echb]
    depends_on: [forge-lanes-authenticate-to-vault-with-a-short-lived-client-cert-not-only-a-bearer-token]
    title: |
      inference:11434 trusts anything on the enclave network; put a TLS-terminating front that requires an enclave lane client cert in front of every inference engine, on all three platforms
    context: |
      Today any container on the enclave network can call the inference engine (ollama or llama-server, plain HTTP) and burn the host's GPU or CPU, or read whatever the engine serves. The engines mostly speak plain HTTP and cannot verify clients, so the fix is a small TLS terminator in front of each one, verifying a client cert chained to the enclave CA with a lane SPIFFE URI SAN. It reuses 1689-echb's lane-client certs.
      macOS: the host-native lane goes through a vsock forwarder (830-xsk2, 1309-rb3p), so the terminator sits on the guest side. Windows: the WSL2 Vulkan opt-in lane (793-a8e7) is inside the guest too. Cost matters on floor-tier hosts: measure the terminator's added latency per request.
    exit_criteria:
      - "a request to the inference endpoint from an enclave container without a lane client cert is refused (red today: served)"
      - "a lane's own request with its cert is served, with the added per-request latency measured and recorded per platform"
    unscoreable: "unpinnable-until-the-guard-exists: the refusal arm is the deliverable"
    next_action: >
      Wait for 1689-echb's lane-client certs. Meanwhile, pick the terminator (a Caddy or stunnel-shaped sidecar already in the image set beats a new binary) and write the refusal arm against today's endpoint.
    provenance: |
      Filed by macuahuitl-fedora on the operator's direction ("inference ... wide open"), 2026-10-14.
    events:
      - type: filed
        ts: "2026-10-14T18:00:00Z"
        host: macuahuitl
        summary: |-
          mTLS front for the inference service.

