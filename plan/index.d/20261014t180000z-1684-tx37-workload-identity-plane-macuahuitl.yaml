    depends_on: [selinux-labeling-is-on-by-default-for-every-enclave-container-and-label-disable-is-a-named-exception]
    title: |
      Per-lane sockets are SELinux-confined: each socket file carries its lane container's MCS pair so only that lane can connectto it, and the forge, mirror, router and proxy get confined types (udica/CIL, following vault_container_t) that allow only their own sockets and ports
    context: |
      Operator, 2026-10-14: per-lane sockets as isolation, with "plenty of SELinux enforcements on top of that to make it super-duper-extra strong".
      Two layers. (1) MCS: a lane's socket file and its directory are labelled with the lane container's category pair, so the kernel denies connectto from any other container_t, regardless of uid or file mode. That is independent of the peer-credential check (1692-37qz), and the defence holds if either one fails. (2) Types: per-role confined types generated with udica or hand CIL, as vault_container_t already is, that grant each role only the sockets, ports and paths it needs. The forge type is denied the mirror's ssh key paths, the Vault data and every other lane's runtime directory.
      Ship the policy modules with the binary and load them at init the same way try_load_vault_selinux_module does. Hosts where a module cannot load must refuse to start that role, or record an honest exception; never silently run unconfined.
    exit_criteria:
      - "on an enforcing host, a container in lane A cannot connect to lane B's socket even with a matching uid and mode 0666, and the denial appears as an AVC naming both categories (red today: connects)"
      - "the forge role runs under its own confined type, and an attempt to read the mirror's ssh host key from a forge is denied by type (red today: no such type)"
    unscoreable: "unpinnable-until-the-guard-exists: the denial arms are the deliverable"
    next_action: >
      After 1693-9qfb puts containers under container_t, label one lane socket with its lane's MCS pair and write the cross-lane connect arm. Then generate a forge policy with udica from a running forge and review every allow rule by hand.
    provenance: |
      Filed by macuahuitl-fedora on the operator's direction, 2026-10-14.
    events:
      - type: filed
        ts: "2026-10-14T18:00:00Z"
        host: macuahuitl
        summary: |-
          MCS-labelled lane sockets and confined role types.

