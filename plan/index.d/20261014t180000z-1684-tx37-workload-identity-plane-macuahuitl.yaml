    title: |
      Vault requires a lane client certificate (1 h, URI SAN = the lane's SPIFFE ID, minted by the existing sidecar) in addition to the AppRole token, so a stolen token alone reads nothing
    context: |
      Today a forge reaching Vault presents a bearer AppRole token (1 h TTL, 24 h max; openspec/specs/tillandsias-vault/spec.md). The enclave CA is ephemeral and on tmpfs and already signs the Vault server leaf. Add a Vault PKI role lane-client (1 h TTL, URI SAN required, cA=false, clientAuth EKU) issued through the same sidecar pattern as the SSH lane, and set the Vault listener to tls_require_and_verify_client_cert. Start with the opencode-forge policy only.
      macOS and Windows: Vault runs inside the Linux guest, so the change is guest-side. Confirm the tray's own Vault calls (host-delivered unseal and shares) keep their path; they may need their own client identity.
    exit_criteria:
      - "a curl to Vault with a valid AppRole token but no client cert is refused at TLS (red today: 200)"
      - "the lane's own client cert plus token reads exactly what the policy allows, and a cert whose SPIFFE path names another lane is refused"
    unscoreable: "unpinnable-until-the-guard-exists: the refusal arm is the deliverable"
