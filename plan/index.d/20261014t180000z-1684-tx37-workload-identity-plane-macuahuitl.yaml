    context: |
      Operator, 2026-10-14: "inference and router and a bunch of services within our enclave are wide open". The study found no client authentication on forge->inference, forge->mirror (git://), forge->router or forge->proxy, and only bearer tokens on Vault. That gap was found by grep, so it is INFERRED; this inventory makes it a measured fact.
