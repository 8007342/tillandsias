packets:
  - packet_id: truly-ephemeral-project-checkout-drop-the-host-mount
    order: 591-x7ws
    desired_release: v0.5
    title: "Remove the host ~/src bind-mount: every forge checks out fresh from cloud into the mirror, then from the mirror into the forge"
    status: ready
    kind: implementation
    multi_cycle: true
    deliverable: launcher + lib-common checkout path + cross-platform parity doc + litmus
    depends_on: []
    pickup_role: linux
    capability_tags: [forge, ephemerality, git-mirror, cross-platform, architecture, windows, macos]
    estimated_hours: 16
    outcome: >
      OPERATOR DIRECTION 2026-08-02. The host bind-mount is to go entirely.
      Instead: a clean checkout from the cloud into the GIT MIRROR every time,
      then a checkout from the mirror into the forge. Truly ephemeral, truly
      idempotent, every launch.
      WHY THIS IS THE RIGHT SHAPE AND NOT JUST TIDIER. Today
      TILLANDSIAS_PROJECT_HOST_MOUNT=1 bind-mounts the host working tree at
      /home/forge/src/<project>, and that single decision propagates defects
      across the whole system. The bind-mounted .git/config carries the host's
      own origin, so the forge needs rewrite_origin_for_enclave_push to install a
      container-ephemeral insteadOf rule (lib-common.sh:448-480) purely to undo a
      problem the mount created. The launcher must seed the forge's branch from
      whatever branch the HOST checkout happens to sit on
      (read_host_project_current_branch -> TILLANDSIAS_FORGE_SEED_BRANCH), which
      is the entire mechanism behind order 531: a checkout parked on main after a
      release silently pins every later forge to main, which carries no
      crates/tillandsias-plan/src/answer.rs, so the forge builds a PRE-EXPERT
      binary and then truthfully reports `experts: ready` while every plan_answer
      returns confidence=unsupported. Truthful state, wrong artifact.
      THE OPERATOR'S KEY INSIGHT: with a fresh checkout there IS no ambient
      branch to inherit, so the whole class disappears rather than being guarded
      against. Branch selection becomes an explicit orchestration decision made
      per unit of work — which is what it always should have been. The release
      skill's non-negotiable "return the checkout to linux-next" step, the
      forge-expert-base guard, and the seed-branch plumbing all become
      unnecessary rather than merely satisfied.
      IT ALSO BITES HARDER OFF-LINUX, which is why the operator raised it now:
      bind-mount semantics differ on Windows and macOS (path translation, case
      sensitivity, file locking, uid mapping through a guest VM), so the mount is
      a recurring source of platform-specific divergence in a project that wants
      1:1 feature parity.
      DOCUMENT CAREFULLY — the operator asked for this explicitly. This change
      touches every platform's launch path, so the design must be written down
      before implementation, with the per-platform behaviour stated rather than
      discovered. Keep the parity matrix honest as it lands.
      HONEST COSTS TO WEIGH, not to hide. A fresh clone per launch costs time and
      bandwidth (the mirror makes the second hop local, so the real cost is the
      cloud->mirror hop, and the mirror can stay warm between launches). And
      UNCOMMITTED HOST WORK BECOMES INVISIBLE TO A FORGE — today an operator can
      edit locally and have a forge see it immediately. That is a genuine
      workflow the mount enables, and removing it must be a deliberate trade with
      a stated answer for "how do I test a local edit in a forge?", not an
      oversight discovered later.
    exit_criteria:
      - "no forge launch path bind-mounts a host working tree; TILLANDSIAS_PROJECT_HOST_MOUNT and its dependent code paths are removed, not merely unused"
      - "a forge's branch is selected explicitly by orchestration, never inherited from a host checkout's current branch"
      - "the design is documented per-platform BEFORE implementation, and the tray-parity matrix stays all-green on required rows"
      - "the answer to 'how do I test an uncommitted local edit in a forge' is written down and works"
      - "a litmus proves two consecutive launches of the same project produce byte-identical checkouts from the mirror, regardless of the host checkout's state or branch"

  - packet_id: tray-cloud-project-overflow-is-a-dead-end
    order: 591-33s6
    desired_release: v0.5
    title: "The tray's 'All cloud projects' overflow item dumps to STDERR — a GUI user clicks it, the menu closes, and nothing happens"
    status: ready
    kind: bug
    deliverable: a real project picker (multi-column fan-out if the platform supports it) on all three trays
    depends_on: []
    pickup_role: any
    capability_tags: [tray, ux, bug, cross-platform, windows, macos, linux]
    estimated_hours: 12
    outcome: >
      OPERATOR REPORT 2026-08-02, reproduced in tonight's logs: "the project
      listing only lists a few projects, and says to click to show them all,
      however clicking the show more projects resets the tray menu and loses
      focus, and launching it again still has the collapsed project count."
      Present on ALL platforms.
      ROOT CAUSE, verified in source. tray/mod.rs:2935-2946 states it plainly:
      "Clicking dumps the full list to stderr (see event dispatch on
      CLOUD_OVERFLOW_ID)." So the overflow item writes to STDERR — which a GUI
      user never sees — and the menu closes because menus close on click. Nothing
      changes, so relaunching shows the same collapsed list. From the user's side
      the control is a no-op that also costs them their menu.
      THE COMMENT NEXT TO IT ASSERTS THE OPPOSITE and should be corrected in the
      same change: "The cap + overflow item is the standard pattern for native
      indicator menus and resolves the user-visible clipping bug on its own." It
      does not resolve it; it relocates the list somewhere a GUI user cannot
      reach. There is already a TODO(@tray-overflow) acknowledging the real fix
      needs window plumbing the tray module does not have — the honest reading is
      that the clipping bug was never closed.
      WHAT THE OPERATOR ASKED FOR: investigate MULTI-COLUMN FAN-OUT — a
      popup/modal submenu with several columns — because "it will be a common
      scenario for users to have tens of projects in their github accounts."
      This host shows 23 today, so the cap is already biting in normal use.
      RESEARCH FIRST, PER PLATFORM, because the tray backends are genuinely
      different and a design that only works on one breaks parity. Linux is
      StatusNotifierItem/DBusMenu over zbus, which is why a window does not exist
      here today; establish what DBusMenu can express (nested submenus? column
      hints?) and what a GTK picker would cost. macOS NSMenu and Windows
      Shell_NotifyIcon have their own constraints. If multi-column is not
      universally available, a scrollable or paginated submenu that WORKS beats a
      multi-column one that only works on one platform — parity is the
      constraint, elegance is not.
      MINIMUM ACCEPTABLE OUTCOME even if the picker slips: clicking the overflow
      item must do something a user can see, or the item must not be clickable.
      A control that silently does nothing is worse than an absent one.
    exit_criteria:
      - "clicking the overflow control produces a visible, usable way to reach every project — verified by a human or a UI-level test, not by reading a log"
      - "the same behaviour ships on Linux, macOS and Windows, with the parity matrix updated"
      - "the source comment claiming the overflow 'resolves the user-visible clipping bug' is corrected"
      - "a multi-column or paginated design is chosen per-platform with its constraints recorded, or multi-column is rejected with a stated reason"
