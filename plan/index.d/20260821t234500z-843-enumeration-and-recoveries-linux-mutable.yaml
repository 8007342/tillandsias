        THE NUMBER. 1,144 deletion records across all refs, carrying 2,562
        records (651 packets, 1,262 events, 647 status, 2 capability rows). The
        fold provably dropped 33 of them; 5 were later re-filed by hand; so
        28 are GENUINELY LOST — 1.09% of records, in 17 of 1,143 fragments
