        ZERO packets, ZERO status writes and ZERO LWW registers were lost. The
        loss is entirely the EVENTS channel plus the CAPABILITIES channel.

        THE PATTERN, which is worth more than the count, because the bug does
        not eat a random sample:

        23 OF 28 (82%) ARE ONE SCHEMA MISTAKE — the FLATTENED EVENT. The writer
        emitted `- packet_id: X` / `type:` / `ts:` / `summary:` at one level
        instead of nesting the body under `event:`. fold_with_sources does
        `let Some(event) = entry.get("event") else { continue };` and skips it
        in silence. 26 such entries exist across 1,262 events (2.1%), and 23 of
        them died.

        AND THE PRECONDITION IS HAND-AUTHORING. Every fragment carrying
        `# Written by: tillandsias-plan set-field` is correctly shaped. EVERY
        loss is hand-written YAML. The four Windows fragments carry the
        canonical header and still flatten; all eight macOS ones have no header
        at all and start bare at `events:`. That is the actionable finding: the
        CLI cannot produce this shape, so routing writers through it — or
        validating hand-authored fragments at write time — prevents 82% of all
        loss this bug has ever caused.

        IT ARRIVES IN PER-HOST BURSTS, not singly. Two clusters: Windows /
        Esmeralda+peke on 2026-08-09 (11 records, 4 fragments) and macOS
        2026-08-14 to 08-16 (12 records, 8 fragments). One host adopts a wrong
        template and every fragment it writes for days carries the defect.

        SECOND MODE, 3 records: the ORPHAN EVENT — a packet_id present in
        neither the base nor any sibling fragment, so there is nothing to
        append to. In one case the author admits inventing the slug (the real
        id was inference-cuda-bringup-fat-host). Two of the three orphan ids
        exist nowhere as packets even today; they were slugs, never ids.

        THIRD MODE, 2 records, and categorically different: the `capabilities:`
        channel is destroyed 100% BY CONSTRUCTION rather than 1% by accident.
        Confirmed independently — `grep -c '^capabilities:'` on the base is 0
        and no fragment at HEAD carries the key.

        THE 5 THAT SURVIVED did so because a HUMAN noticed and re-filed them.
        The destroyed set is 33 and the lost set is 28 only because of manual
        rescue, not because the system recovered. That distinction matters for
        anyone tempted to read 1.09% as evidence the design is self-healing.

