      destroyed fragment established that
      `tillandsias-github-login-<pid>` containers surviving 50-60 minutes are a
      downstream symptom of 627-sgtt/627-wtrp, because `LoginContainerCleanup`
      is a Drop guard that runs on success AND on `?` — so only a KILLED login
      leaks a container. That is a different failure from this one, and
      conflating them is what made the original triage take a day.
    exit_criteria:
