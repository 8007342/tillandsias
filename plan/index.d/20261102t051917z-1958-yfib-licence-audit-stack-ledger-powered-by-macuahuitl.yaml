- packet_id: refresh-powered-by-from-the-stack-ledger-at-each-stable-release
  order: 1958-jyfk
  status: ready
  kind: enhancement
  priority: p2
  desired_release: v0.5
  pickup_role: any
  capability_tags:
  - release-gate
  - website
  estimated_hours: 1
  title: Refresh docs/credits/stack.v1.json and the tillandsias.org Powered By page from it at each stable release
  context: 'The stack ledger is generated, not maintained: dependencies move with every landing, so ./build.sh --check only WARNS when docs/credits/stack.v1.json is stale (1958-yfib). The honest moment to refresh it is the stable promotion, when the website re-pins to the release anyway (tillandsias.org scripts/refresh.py). The site copies the ledger from the tagged runtime checkout (scripts/snapshot-stack.py) and renders the Powered By page from the copy; a pin whose tag predates the ledger keeps the committed copy and says so.'
  exit_criteria:
  - 'At each stable promotion the promoted tag''s tree carries a docs/credits/stack.v1.json for which `tillandsias-plan script run scripts/lua/build-stack-ledger.lua -- --check` prints ok:stack-ledger:fresh, and tillandsias.org''s docs/powered-by/stack.v1.json names that tag as its source.'
  - 'The site PR for the release includes the regenerated Powered By page (var/html/index.html), and the deploy is the operator''s intentional `npx wrangler deploy`.'
  unscoreable: 'a recurring release-runbook obligation, not a litmus: each cycle is scored by `tillandsias-plan script run scripts/lua/build-stack-ledger.lua -- --check` printing ok:stack-ledger:fresh at the promoted tag (docs/RELEASING.md, "Stable promotion" step)'
  verifiable_closure: 'Per cycle: in the runtime checkout at the stable tag, tillandsias-plan script run scripts/lua/build-stack-ledger.lua -- --check -> ok:stack-ledger:fresh:…; in tillandsias.org, python3 scripts/snapshot-stack.py <checkout> prints snapshot-stack: … at <tag> and python3 scripts/build-matrix.py rebuilds the page.'
  next_action: 'At the next stable promotion (scripts/promote-stable.sh, docs/RELEASING.md "Stable promotion" step): regenerate the ledger on a work ref if --check says stale, land it before the cut; then in tillandsias.org run scripts/refresh.py for the tag (it snapshots the ledger) and open the site PR.'
  provenance: macuahuitl 2026-11-02T05:19:17Z, scheduled at the operator's request ("please also schedule an update for our next stable release").
  events:
  - type: filed
    ts: '2026-11-02T05:19:17Z'
    host: macuahuitl
    summary: filed as the recurring refresh of the stack ledger and the Powered By page, tied to the stable promotion
