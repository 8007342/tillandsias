  estimated_hours: 6
  title: Audit every licence our own files declare against GPL-3.0-or-later, generate the stack ledger from the sources of truth, and give tillandsias.org a Powered By page drawn from it
  context: 'Operator 2026-11-01: "our files might have the wrong licenses, some agents randomly hallucinate licenses for new files and we rarely check. The other day I saw some MIT license in one of our own files." Measured on the operator''s host: localhost/tillandsias-inference carried org.opencontainers.image.licenses=MIT with vendor="Fedora Project", and tillandsias-router carried Apache-2.0 — every Tillandsias-built image inherits its base layer''s labels because no Containerfile set its own. Cargo manifests, package.json files and SPDX headers of our own code all said GPL-3.0-or-later or nothing; the only MIT in a file of ours was a litmus fixture imitating a third-party project. The operator also asked for a transparent ledger of everything we auto-wire, with licences as the upstream declares them (never guessed), and an EXTREMELY SIMPLE graph on the website with rings per licence family, dashed optional dependencies and a link to each homepage.'
  exit_criteria:
  - 'scripts/lua/check-own-licence-declarations.lua refuses a non-GPL-3.0-or-later licence on a file of ours and an images/*/Containerfile* or observatorium/Containerfile with no org.opencontainers.image.licenses label; vendored upstream paths are listed in the guard with reasons; wired into ./build.sh --check; red on the tree before this packet (20 images), green after.'
  - 'scripts/lua/build-stack-ledger.lua writes docs/credits/stack.v1.json from cargo metadata, the Containerfiles, the npm lockfiles, the model licence register, the studio registry, the custom-node manifest, the vendored LICENSE texts and the cheatsheet allowlist; every licence is copied from its source or is "unknown"; --check is byte-stable.'
  - 'tillandsias.org has a Powered By entry in its menu rendering the ledger as clustered rings with a searchable credits table (PR into main; deploy is the operator''s intentional step).'
  verifiable_closure: 'litmus:own-licence-declarations (scripts/lua/test-own-licence-declarations.lua: 5 arms, ok:own-licence-declarations-fixture:5); tillandsias-plan script run scripts/lua/build-stack-ledger.lua -- --check -> ok:stack-ledger:fresh:nodes=<n>:edges=<m>'
  next_action: 'Nothing left on this packet. The recurring refresh is 1958-jyfk.'
  provenance: macuahuitl 2026-11-02T05:19:17Z, operator request of 2026-11-01 relayed by the coordinator.
