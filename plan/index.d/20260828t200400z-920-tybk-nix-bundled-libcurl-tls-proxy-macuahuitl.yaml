    context: |
      OBSERVED by BigPickle on lenovinha (n=1 — REGIME ATTACHED, do not relay
      as a fleet rule): the nix binary tarball's bundled glibc + libcurl +
      OpenSSL cannot verify github.com's certificate behind the transparent
      proxy's TLS interception, while system curl on the same host succeeds
      against the same URLs — the proxy CA lives in the system trust store,
      which nix's bundled OpenSSL never consults. Regime: Linux, tarball-
      installed nix 2.35.2 (nix/builder/Containerfile), ayahuitlcalpan
      transparent proxy. Untested: second host, distro-packaged nix
      (expected unaffected), off-proxy.

      WORKAROUND landed in 3d56d69b6: scripts/nix-build-container.sh
      prefetches every flake.lock input with system curl and passes
      --override-input so nix never touches github.com; cache.nixos.org
      substitution works throughout (the failure is verification against the
      intercepted github.com endpoint, not TLS generally).

      SMALLEST FIX candidate: NIX_SSL_CERT_FILE / ssl-cert-file at the host CA
      bundle — the same pitfall already recorded in
      openspec/changes/nix-cache-build-lane/design.md. If it works in the
      affected regime, the prefetch layer is dead weight.
