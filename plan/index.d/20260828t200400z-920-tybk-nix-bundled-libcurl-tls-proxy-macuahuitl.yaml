      nix's bundled glibc/libcurl/OpenSSL cannot verify github.com behind the transparent proxy while system curl succeeds — the container lane routes around it with a 100-line prefetch dance
    deliverable: |
      Reproduce (or bound) the defect beyond n=1, test NIX_SSL_CERT_FILE /
