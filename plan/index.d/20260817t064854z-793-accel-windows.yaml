# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by: windows-opus5-accel-20260816 on windows/Yolanda, 2026-08-16 local
# (host is UTC-7; every `ts` below is UTC).
#
# HIGH-END half of the accelerator research. The sibling host esmeraldinha
# (4-core, low-end) filed the LOW-end half on windows-next (481/482-series,
# plan/issues/research/engine-lane-matrix-complete-2026-08-17.md and
# plan/issues/esmeraldinha-lower-bound-inference-floor-2026-08-16.md); its
# headline was that the LANE dominates the ENGINE by ~30x. This half measures
# the DEVICE axis on a Ryzen AI 7 350 with an RDNA3.5 iGPU and an XDNA2 NPU.
#
# The experiment is done and the numbers are real: iGPU acceleration from inside
# WSL2 over /dev/dxg WORKS (Mesa `dzn` Vulkan-on-D3D12), giving 1.86x-2.04x
# prefill — while COSTING 1.23x on decode for 0.5B-class models. Full provenance,
# exact commands, and the negative results:
#   plan/issues/research/wsl2-igpu-vulkan-over-dxg-measured-2026-08-16.md
#   plan/issues/research/npu-windows-side-inference-path-2026-08-16.md
#   plan/issues/research/accel-capability-envelope-and-routing-2026-08-16.md
#
# All five packets group under milestone 718-rtnh
# (bare-metal-expert-inference-parity), which is the existing home for "what
# inference can this bare-metal host actually deliver to the expert tier". No new
# milestone: the fit is good and 718-ja7g/718-nkm2 already live there.
#
# Deliberately cross-referenced so this does not become a parallel universe:
#   520      ollama-rocm-asset-never-fetched      -> 793-zumy proves ROCm is
#            unreachable on this class of hardware (no /dev/kfd, no HIP runtime
#            in /usr/lib/wsl/lib); Vulkan/dzn is the path that works.
#   522      expert-slots-vram-aware              -> 793-qr4t: on unified memory
#            the "VRAM" number is the guest's RAM re-labelled. Do not sum.
#   409      fedora-vm-image-gpu-awareness        -> 793-a8e7 is the WSL2 analog
#            of the same gap, and the image work should share the rubric.
#   518      inference-deferred-model-pulls       -> the 3B model used here was
#            pulled into an ISOLATED store, leaving the dev-inference store
#            untouched; that isolation is the pattern 518 wants.
#   397      experts-tier-backends                -> 793-qc6q's routing table is
#            the per-phase device policy that tier needs.
#   620-ca7g low-end-no-local-inference-gate      -> every routing rule
#            terminates at CPU so the low-end floor is preserved unchanged.

packets:
  - packet_id: accel-probe-blind-to-wsl2-paravirtualised-gpu
    release_target: stable-milestone-v1
    order: 793-zumy
    milestone: 718-rtnh
    status: ready
    desired_release: v0.5
    kind: fix
    pickup_role: windows
    priority: p1
    tags: [windows, wsl2, accel, probe, gpu, fail-loud, false-negative, v0.5]
    title: |
      The accel probe stops reporting cpu-only on a GPU-capable WSL2 host: /dev/dxg is recognised as a GPU delivery path, and a device that enumerates is never reported as absent.
    context: |
      MEASURED on windows/Yolanda, 2026-08-16. The probe in
      crates/tillandsias-headless/src/accel_probe.rs decides a Linux host has a
      GPU iff `nvidia-smi -L` succeeds OR /dev/dri exists. WSL2 delivers the GPU
      through /dev/dxg and never creates /dev/dri, so this host — an AMD Radeon
      860M (RDNA 3.5) that demonstrably runs inference — reports
      `accel_class=cpu-only accel_gpu=none`.

      This is not a pessimistic-but-harmless verdict. After installing a Vulkan
      loader and Mesa's `dzn` ICD in tillandsias-build, ollama 0.32.9 ran
      qwen2.5:3b at `100% GPU` on
      "Microsoft Direct3D12 (AMD Radeon(TM) 860M Graphics)" (vendorID 0x1002,
      deviceID 0x1114 — the real host PCI IDs) at 188.3 prefill tok/s against
      92.2 on CPU. The probe's `none` was suppressing a 2.04x speedup.

      It also breaks the envelope's OWN contract. accel_probe.rs documents that
      "`cpu-only` is never a bare verdict" and that when hardware is present but
      unreachable the reason must be named. Here hardware was present AND
      reachable, and the envelope said `accel_gpu=none accel_reason=-`.

      Note the ordering trap this created: 599-3b9h's criterion 2 EXPECTED
      `cpu-only` on this host and that expectation was accepted as correct. It
      was derived from the same blind rubric it was checking, so the observation
      confirmed the implementation rather than the hardware. A note event on
      599-3b9h and on 769-w3ma (whose grammar carries accel_class) records this.

      Full evidence, exact commands, reversal steps:
      plan/issues/research/wsl2-igpu-vulkan-over-dxg-measured-2026-08-16.md
    exit_criteria:
      - |
          On a WSL2 guest with /dev/dxg present and a Vulkan ICD that enumerates
          a non-CPU physical device, the envelope reports a usable GPU rather
          than `accel_gpu=none`, and windows/Yolanda specifically stops
          reporting `accel_class=cpu-only`.
      - |
          Detection is by ENUMERATION, not file existence. /dev/dxg present with
          no Vulkan loader installed — the exact state this host was in before
          the experiment — reports `engine-missing` and names it in
          accel_reason, because that GPU genuinely cannot be used.
      - |
          A software rasterizer NEVER satisfies the GPU check. With all Mesa ICDs
          installed the loader also offers lavapipe/llvmpipe, which presents as a
          Vulkan device; a probe that accepts it reports accel_gpu=usable for what
          is a slow CPU path. Devices of type PHYSICAL_DEVICE_TYPE_CPU or driverID
          DRIVER_ID_MESA_LLVMPIPE are rejected, with a test pinning the rejection.
      - |
          Regression is impossible on the hosts that were already correct: a
          native-Linux host with /dev/dri, an NVIDIA host, and a macOS host all
          produce the same envelope they produced before the change.

  - packet_id: capability-envelope-side-and-engine-qualified
    release_target: stable-milestone-v1
    order: 793-qr4t
    milestone: 718-rtnh
    status: ready
    desired_release: v0.5
    kind: enhancement
    pickup_role: any
    priority: p2
    tags: [accel, probe, capability-envelope, wsl2, macos, windows, routing, v0.5]
    title: |
      The capability envelope is side-qualified and engine-qualified, so "not visible from here" is a distinct answer from "does not exist" and a device is only usable when something can actually drive it.
    context: |
      793-zumy fixes the /dev/dxg blind spot. This packet fixes the reason the
      blind spot was expressible at all: the envelope collapses four independent
      facts into one boolean — does the device exist; on which side of which
      boundary is it visible; is there an engine that can drive it; and for which
      WORKLOAD is it actually faster.

      The sharpest instance is the NPU. accel_probe.rs::enumerate_npus returns an
      empty list when /sys/class/accel is absent, a case it names explicitly
      ("PROBE-2: Kernel without accel class (e.g. WSL2) yields empty list"). So a
      WSL2 guest renders the XDNA2 NPU as `accel_npu=none`. Measured on this
      host, that NPU is PRESENT and HEALTHY on the Windows side (PCI
      VEN_1022&DEV_17F0, driver 32.0.20102.3930 dated 2026-06-05) and is merely
      unreachable across the VM boundary. `none` invites "this machine cannot do
      NPU work", which is false and would mis-plan an entire tier.

      Proposed additive grammar (existing keys and meanings preserved so
      769-w3ma consumers and litmus:accel-envelope-reaches-the-forge keep
      passing), with ONE widened value set:
        accel_side=<native-linux|wsl2-guest|windows-host|macos-host|container>
        accel_gpu_path=<drm|dxg-d3d12|metal|cuda|none>
        accel_gpu_engine=<vulkan-radv|vulkan-dozen|rocm|cuda|metal|engine-missing|none>
        accel_mem_model=<unified|discrete>  accel_mem_budget_gb=<n|->
        accel_prefill_dev=<gpu|npu|cpu>     accel_decode_dev=<gpu|npu|cpu>
        accel_npu / accel_gpu gain the value `unobservable-from-this-side`

      MEMORY (this is the 522 hook): on windows/Yolanda the probe reports
      accel_ram_gb=7 (guest RAM) while dzn advertises a 7.58 GiB DEVICE_LOCAL
      heap. Those are the SAME physical DRAM counted twice, and neither is the
      host's 15.2 GB. 522 sizing expert slots off either number sizes them
      against a pool that does not exist. accel_mem_model=unified plus a single
      side-scoped budget, with the rule that unified GPU and CPU budgets are
      never summed, fixes it once in the probe rather than per consumer. 409
      (fedora-vm-image-gpu-awareness) is the same gap in the image path and
      should share this rubric.

      Design detail: crates/tillandsias-headless/src/accel_probe.rs already has a
      `measurements: Vec<MeasurementRecord>` field with prefill_tps/decode_tps
      that has NEVER been populated. It is the correct home for the measured
      per-host crossover 793-qc6q needs.

      Rationale and per-platform detection table:
      plan/issues/research/accel-capability-envelope-and-routing-2026-08-16.md
    exit_criteria:
      - |
          An accelerator that exists but is on the far side of a VM boundary
          reports `unobservable-from-this-side`, never `none`. A WSL2 guest on
          this host reports that for the NPU, and a native-Linux host with no NPU
          at all still reports `none` — the two cases stay distinguishable.
      - |
          The envelope states which SIDE produced it and which ENGINE (if any)
          can drive each device, so a reader can tell "no GPU here" from "a GPU
          with no driver stack" from "a GPU that belongs to the other side".
      - |
          On a unified-memory node the envelope reports one memory budget and
          declares accel_mem_model=unified; no consumer, 522 included, can derive
          a total by adding a GPU pool to a CPU pool.
      - |
          Existing consumers do not break: 769-w3ma's grammar keys keep their
          current names and meanings, and
          litmus:accel-envelope-reaches-the-forge passes unchanged.

  - packet_id: igpu-acceleration-opt-in-for-wsl2-hosts
    release_target: stable-milestone-v1
    order: 793-a8e7
    milestone: 718-rtnh
    status: ready
    desired_release: v0.5
    kind: enhancement
    pickup_role: windows
    priority: p2
    tags: [windows, wsl2, accel, gpu, vulkan, inference, opt-in, v0.5]
    title: |
      A WSL2 host with a capable iGPU can opt in to Vulkan acceleration and gets ~2x prefill, without any host being silently switched to a stack that is slower for its models.
    context: |
      MEASURED, ollama 0.32.9, same GGUF, medians of 3 unique-prompt reps:

        qwen2.5:0.5b  prefill  CPU 397.5 -> GPU 737.8 t/s   (GPU 1.86x)
        qwen2.5:0.5b  decode   CPU  78.68 -> GPU  63.75 t/s (CPU 1.23x)
        qwen2.5:3b    prefill  CPU  92.2 -> GPU 188.3 t/s   (GPU 2.04x)
        qwen2.5:3b    decode   CPU  19.64 -> GPU  26.96 t/s (GPU 1.37x)
        nomic-embed-text        CPU 8.7ms -> GPU 10.2ms     (CPU 1.16x)

      The enablement is THREE PACKAGES, not a code change. ollama 0.32.9 already
      ships lib/ollama/vulkan/libggml-vulkan.so and already had OLLAMA_VULKAN:true
      in its running config; it logged `inference compute id=cpu library=cpu`
      purely because no Vulkan loader existed in the distro. In tillandsias-build
      (Fedora 44):
        dnf install -y --setopt=install_weak_deps=False \
          vulkan-loader vulkan-tools mesa-vulkan-drivers
      giving vulkan-loader-1.4.341.0, vulkan-tools-1.4.341.0,
      mesa-vulkan-drivers-26.1.6 (~200 MiB installed).
      Reverse with: dnf remove vulkan-loader vulkan-tools mesa-vulkan-drivers.

      WHY THIS MUST NOT BE A DEFAULT. Adding those packages to the base image
      would flip every WSL2 host to GPU decode, INCLUDING the 0.5B case where
      that is a 1.23x REGRESSION — and 0.5B is exactly the class the sibling's
      semantic-layer floor work (plan/issues/research/semantic-layer-sub-1b-floor-2026-08-16.md)
      depends on. Enablement must be opt-in/auto-detected against the measured
      crossover from 793-qc6q, with the CPU floor of 620-ca7g intact.

      TWO HAZARDS that ride with it, both observed here:
      (1) A SILENT HANG. On the first cold GPU load of qwen2.5:3b, prompt
          processing stopped at 40% (2048/5093 tokens) and sat >9 minutes with no
          error, no assertion, no device-lost line. A re-run of the same shape
          completed in ~25s and three later reps logged zero assert/device-lost
          lines — intermittent and cold-load-associated, not a hard limit, but
          the worst failure mode for an unattended host.
      (2) dzn self-reports "not a conformant Vulkan implementation, testing use
          only", exposes only Vulkan 1.2, and lacks shaderInt8,
          storageBuffer8BitAccess and cooperative-matrix. The numbers above were
          achieved WITHOUT them.

      Also settles 520: ROCm is not reachable on this hardware class — no
      /dev/kfd, and /usr/lib/wsl/lib carries only libd3d12/libd3d12core/libdxcore,
      no HIP or HSA runtime. Vulkan-over-D3D12 is the path that works; the
      never-fetched ROCm asset should not be pursued for WSL2 iGPUs.
    exit_criteria:
      - |
          A WSL2 host with a usable iGPU can turn acceleration on through a
          documented, reversible opt-in, and the exact package set and its
          removal command are recorded so another host reproduces it without
          rediscovery.
      - |
          No host changes behaviour without opting in. esmeraldinha and every
          existing CPU-only host produce byte-identical inference wiring after
          this lands, and the CPU floor remains reachable everywhere.
      - |
          Routing honours the measured crossover rather than "GPU if present":
          a 0.5B-class model does not get its decode moved onto the iGPU, since
          that is a measured 1.23x regression.
          Depends on 793-qc6q for the policy.
      - |
          The silent-hang failure mode cannot strand an unattended host: GPU
          inference carries a deadline and falls back to CPU when it expires,
          rather than waiting indefinitely with no error.

  - packet_id: npu-inference-service-requires-windows-side-host-install
    release_target: stable-milestone-v1
    order: 793-ee2g
    milestone: 718-rtnh
    status: ready
    desired_release: v0.5
    kind: decision
    pickup_role: operator
    priority: p2
    tags: [windows, npu, xdna2, ryzen-ai, inference, decision, operator-input, v0.5]
    title: |
      DECISION — whether to install a Windows-side NPU inference service (Lemonade Server and/or FastFlowLM) on windows/Yolanda, given that the NPU is structurally unreachable from WSL2.
    context: |
      OPERATOR INPUT REQUIRED: every option here is a host-level software install
      on the Windows side, outside any distro we own. This agent deliberately
      installed nothing and measured no NPU throughput.

      MEASURED CONSTRAINT. The XDNA2 NPU is present and healthy on Windows
      (PCI VEN_1022&DEV_17F0, "NPU Compute Accelerator Device", AMD driver
      32.0.20102.3930 dated 2026-06-05; xrt_coreutil.dll present in System32).
      From inside WSL2 it is unreachable: no /dev/accel, no amdxdna, no PCI
      passthrough — WSL2 paravirtualises only the graphics adapter via /dev/dxg.
      This is STRUCTURAL. No install inside a distro can cross it.

      THE OPTIONS (sources and dates in the issue doc):
        A. Do nothing. iGPU + CPU only. Zero new host software.
        B. Lemonade Server (AMD, lemonade-server.ai). OpenAI-compatible
           /api/v1/chat/completions, /completions, /responses, /v1/embeddings.
           NPU via OnnxRuntime GenAI; NPU gated to Ryzen AI 300-series (this host
           qualifies). Hybrid mode = NPU does PREFILL, iGPU does DECODE.
        C. FastFlowLM (github.com/ROCm/FastFlowLM). OpenAI-compatible, supports
           all XDNA2 parts incl. Kraken (this host), and runs Vision, Audio and
           EMBEDDING models entirely on the NPU.
        D. Windows ML / Vitis AI EP directly — a library, not a server; we would
           write and own the serving layer. Note DirectML is now in "sustained
           engineering" (maintenance), so it is not a forward-looking target.

      WHAT THE RESEARCH REFUTES. The starting hypothesis was "NPU for fixed-shape
      INT8/INT4 embedding/rerank/classifier work — the cheap expert RAG tier".
      It is HALF WRONG. Lemonade's embeddings endpoint "is only available for
      models using the llamacpp or flm recipes. ONNX models (OGA recipes) do not
      support embeddings" — so the mainline Ryzen-AI/ONNX NPU path serves NO
      embeddings at all. Only FastFlowLM puts embeddings on the NPU. Meanwhile
      AMD's own hybrid design points the NPU at LLM PREFILL, which is the same
      axis our iGPU measurements found (prefill is where acceleration pays).

      THE COUPLING TO 718-nkm2 — and the reason this is one decision, not two.
      Any of B/C/D places the endpoint on the WINDOWS side. Measured on this
      host: WSL -> Windows is BLOCKED. The Hyper-V Firewall for the WSL VM has
      DefaultInboundAction=Block with only ICMP and mDNS allow rules, so TCP from
      the guest to a Windows listener times out on both a 0.0.0.0 bind and a
      loopback bind. Windows -> WSL works fine (wslrelay mirrors guest listeners
      into the Windows loopback; LoopbackEnabled=True). An NPU service the
      enclave cannot reach is worth zero, so the networking question must be
      settled first or jointly.

      UNVERIFIED and flagged as such: silent/unattended install switches for
      Lemonade_Server_Installer.exe; whether a reranking HTTP endpoint exists and
      on which device; FLM's embedding model list, quantization requirements and
      licence; and whether either server can bind a WSL-facing interface at all.

      plan/issues/research/npu-windows-side-inference-path-2026-08-16.md
    exit_criteria:
      - |
          The operator records a decision among A/B/C/D with a reason, and the
          decision names whether new listening host software on the Windows side
          is acceptable at all.
      - |
          If any of B/C/D is chosen, the WSL->Windows reachability question is
          resolved in the same decision (Hyper-V firewall rule, mirrored
          networking, or an explicit statement that the service is Windows-only
          and the enclave will not consume it) — because an unreachable endpoint
          is not a partial win, it is zero.
      - |
          If a service is installed, its throughput on THIS host is measured for
          prefill and for embeddings and compared against the iGPU and CPU
          numbers already recorded in 793-zumy, so the routing policy in 793-qc6q
          rests on measurement rather than on vendor claims.

  - packet_id: per-phase-accelerator-routing-policy
    release_target: stable-milestone-v1
    order: 793-qc6q
    milestone: 718-rtnh
    status: ready
    desired_release: v0.5
    kind: enhancement
    pickup_role: any
    priority: p2
    tags: [accel, routing, inference, experts, npu, gpu, cpu, end-user, v0.5]
    title: |
      Work is routed to NPU, iGPU or CPU per PHASE rather than per host, from measured crossovers, with the CPU as an always-available floor and no silent wrong-stack fallback.
    context: |
      The unit of routing is the PHASE, not the host and not the model. Two
      independent lines of evidence agree.

      OURS (793-zumy, medians, ollama 0.32.9 on windows/Yolanda):
        prefill  0.5B: CPU 397.5 -> GPU 737.8 t/s   GPU 1.86x
        prefill  3B  : CPU  92.2 -> GPU 188.3 t/s   GPU 2.04x
        decode   0.5B: CPU  78.68 -> GPU  63.75 t/s CPU 1.23x  <-- crossover
        decode   3B  : CPU  19.64 -> GPU  26.96 t/s GPU 1.37x
        embed        : CPU 8.7ms -> GPU 10.2ms      CPU 1.16x

      Prefill is a batched GEMM and is compute-bound, so the iGPU always wins.
      Decode is memory-bandwidth-bound and on UNIFIED memory the iGPU reads the
      same DRAM as the CPU — no bandwidth advantage, only compute, against a
      fixed per-dispatch cost. At 0.5B that cost dominates; at 3B the arithmetic
      per token absorbs it. The crossover sits between 0.5B and 3B.

      AMD'S (Lemonade hybrid mode, 2026-08-16): "The NPU handles prompt
      processing. The GPU handles token generation." Same axis, independently.

      PROPOSED POLICY:
        prefill -> NPU if usable, else GPU if usable, else CPU
        decode  -> GPU if usable AND model_params >= ~1.5B, else CPU
        embed   -> NPU only if an NPU embedding engine is usable (FastFlowLM);
                   else CPU. Never the iGPU on a unified-memory node.
        rerank  -> CPU until measured (NPU support unverified)

      GUARDS: CPU is the floor and always available (620-ca7g preserved, never a
      hard accelerator requirement); routing is opt-in/auto-detected and always
      stated in the envelope, and a fallback always names its reason; and the
      1.5B crossover is THIS host's — thresholds are measured per host into the
      probe's existing unused measurements[] field, not hard-coded.

      This is the per-phase device policy 397 (experts-tier-backends) needs, and
      it is what makes an END USER's install pick the best available stack on
      their own device with a safe floor: a Ryzen AI laptop gets iGPU prefill, an
      NVIDIA machine gets CUDA, a Mac gets Metal, a four-core office laptop gets
      the CPU floor and is not asked to pretend otherwise. The three silent
      failures now known each get a named state instead of a plausible wrong
      answer: driver stack missing -> engine-missing; device across a VM boundary
      -> unobservable-from-this-side; software rasterizer -> rejected outright.

      plan/issues/research/accel-capability-envelope-and-routing-2026-08-16.md
    exit_criteria:
      - |
          Routing decisions are made per phase (prefill / decode / embed) against
          a measured crossover, and a 0.5B-class model's decode is NOT sent to
          the iGPU on a unified-memory host.
      - |
          Every host retains a working CPU path, and no configuration can make an
          accelerator a hard requirement for inference to function.
      - |
          A fallback is never silent: when work does not land on the device the
          policy preferred, the envelope or the log names which device ran it and
          why the preferred one was not used.
      - |
          The crossover threshold is derived from a bounded per-host measurement
          cached in capabilities.json (the probe's measurements[] field, unused
          since order 480), not from a constant that happens to fit windows/Yolanda.

events:
