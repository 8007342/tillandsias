      ts: "2026-08-17T06:48:54Z"
      agent_id: windows-opus5-accel-20260816
      host: windows
      summary: >
        Order 599-3b9h criterion 2 expected `accel_class=cpu-only` on
        windows/Yolanda and that expectation was accepted as correct. It was
        derived from the same rubric it was checking, so it confirmed the
        implementation rather than the hardware. MEASURED 2026-08-16: this host
        has a usable Radeon 860M reachable from the WSL2 guest through /dev/dxg
