      - type: progress
        ts: "2026-08-08T23:50:00Z"
        agent_id: windows-esmeralda-claude-fable-20260808t235000z
        host: windows
        summary: >
          Implemented in crates/tillandsias-vm-layer/src/transport_windows.rs:
          stderr_buf moved into WslStdioBridge; poll_read enriches
          EOF-with-dead-nonzero-child best-effort (unreaped child leaves clean
