  - packet_id: low-end-bridge-eof-diagnosability
    order: 620-cine
    status: in_progress
    desired_release: v0.5
    priority: p1
    title: "socat stdio bridge failures collapse into bare 'handshake: early eof' when the child outlives the 250ms startup grace (always, on N100-class hosts)"
    kind: fix
    deliverable: plan/issues/low-end-bridge-eof-diagnosability-2026-08-08.md
    depends_on: []
    pickup_role: windows
    owner_host: windows
    capability_tags:
      - windows
      - control-wire
      - diagnosability
      - low-end-hardware
    estimated_hours: 3
    outcome: >
      A bridge child that dies after the startup grace no longer yields a bare
      'early eof': WslStdioBridge keeps the stderr capture and poll_read
      attaches exit status + captured stderr to the EOF when the child is
      reapable with non-zero status, so field logs name the real cause
      (ENETUNREACH, socat absent, distro stopped).
    next_action: >
      Observe the enriched error on the field host (forced listener-stop
      fixture or a naturally failing attempt); append the line to the
      deliverable; consider the follow-ups (grace scaling / litmus) as
      separate ready work.
    exit_criteria:
      - "EOF with dead non-zero child carries 'wsl stdio bridge exited (<status>): <stderr>'"
      - "clean exit-0 EOF and live-child EOF behavior unchanged"
    events:
      - type: filed
        ts: "2026-08-08T22:45:00Z"
        agent_id: windows-esmeralda-claude-fable-20260808t235000z
        host: windows
        summary: >
          July-August field logs on the N100 host show hundreds of bare
          'handshake: early eof' lines; the real socat error (connect
          ENETUNREACH from missing vsock_loopback) surfaced only twice when a
