      [2026-09-20T00:49:34Z tlatoanis-macbook-neo] MECHANISM FULLY NAMED — see the "WRITER IS CAUGHT IN THE ACT" event. The
      contended resource is the PROCESS-GLOBAL XDG_CACHE_HOME. Writer:
      init_build_state_persists_to_cache_directory, which takes env_lock, points
      XDG_CACHE_HOME at a tempfile::tempdir(), and deletes it on drop. Victim:
      forge_credential_quarantine_mounts_present, which takes NO env_lock, resolves
