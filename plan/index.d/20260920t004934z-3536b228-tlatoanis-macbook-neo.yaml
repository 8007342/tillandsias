      shared state at its SOURCE rather than serialise the readers.
      SECOND, AND SEPARATELY: the config write's `.ok()?` must SPEAK. This function
      converts TWO different filesystem failures into the same silent None — the
      documented create_dir_all and an UNDOCUMENTED write — and the undocumented one
      is the one that fires. Whatever the caller does about the cache root, a write
      failure here should name itself rather than present as a missing mount.

