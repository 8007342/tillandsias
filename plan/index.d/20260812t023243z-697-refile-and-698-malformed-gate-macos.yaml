packets:

  - packet_id: build-check-emits-no-timing-record
    order: 697-s3by
    status: ready
    desired_release: v0.5
    priority: p2
    title: "build.sh --check emits no timing record, so the cycle's slowest step is unmeasured on every host"
    kind: bug
    deliverable: "one duration record per heavy step, and a timing: line that names a real slowest step instead of reading absent"
    depends_on: []
    pickup_role: any
    capability_tags: [telemetry, cycle-time, build, instrumentation]
    estimated_hours: 3
    context: >
      Observed on macOS 2026-08-12 after `./build.sh --check` ran FIVE times to
      completion in one session: /tmp/tillandsias-timing.jsonl never existed and
      cycle-metrics.sh reported steps=0 with source=absent every cycle.
      This is the metric the meta-orchestration skill introduces with "where does
      the cycle's wall-clock go?" and calls building/testing the most likely
      bottleneck; its slowest field is meant to name the one step to attack
      first. While it reads absent, the most expensive part of every cycle on
      every host is unmeasured and 682-emvg's deliverable is not in effect where
      it matters most. This session paid the gate five times (695-nvnd covers one
      avoidable cause) with no record of the cost.
      THE WIRING LOOKS CORRECT, which is why this is research rather than a
      one-line fix: build.sh:66 sources scripts/timing-log.sh (installing no-op
      stubs at :67 if that fails), :988 captures the start, :989 traps EXIT,
      :1047 emits; local-ci.sh:429 emits per phase; timing-log.sh:40-58 shells
      out to cycle-metrics.sh with the emit flag.
      TWO HYPOTHESES ARE ALREADY REFUTED — do not re-chase them.
      (1) "the emitter is broken" — no, invoked directly it works and creates
      the log (the probe record was removed afterwards so it cannot pollute a
      real rolling average).
      (2) "bash 3.2 cannot parse timing-log.sh, so macOS silently gets the no-op
      stubs" — this was the leading theory, since the host IS bash 3.2 and
      build.sh:66 swallows source failures with a redirect and an or-true, a
      textbook silent degradation. It is WRONG: /bin/bash -n parses clean and a
      3.2 source defines the real function, not the stub.
      Next probe: one trace at the emit call site during a single gate run
      separates "never called" from "called, shell-out failed silently". Note
      the emitter swallows every error by design so it can never disturb the
      wrapped step's exit code — correct for safety, and exactly why this failed
      invisibly.
      Full write-up:
      plan/issues/research-build-check-emits-no-timing-record-2026-08-12.md
    outcome: >
      Every cycle can name its slowest step from measurement instead of
      intuition.
    exit_criteria:
      - "./build.sh --check appends exactly one build-check duration record per run, on macOS and Linux"
      - "cycle-metrics.sh reports a non-absent timing line naming a real slowest step"
      - "a NEGATIVE CONTROL asserts a FAILING step still emits its record with a non-zero exit field — instrumentation that only records successes hides the slow path that matters most"
    events:
      - type: filed
        ts: "2026-08-12T02:32:43Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260812t023243z
        host: macos
        summary: >
          Re-filed verbatim after the original fragment was found unparseable
          and skipped. Both obvious hypotheses were already tested and refuted
          so the next claimant starts at the actual unknown.

  - packet_id: malformed-fragment-passes-every-gate
    order: 698-7n6q
    status: ready
    desired_release: v0.5
    priority: p1
    title: "A ledger fragment that does not parse is a WARNING, so invisible work can be committed, pushed, and pass every gate green"
    kind: bug
    deliverable: a diff-scoped gate that fails when a fragment added by the current change does not parse
    depends_on: []
    pickup_role: any
    capability_tags: [plan-tooling, ledger, fail-loud, gate]
    estimated_hours: 2
    context: >
      Hit live on macOS 2026-08-12, by me, on the packet directly above.
      `tillandsias-plan check` PRINTS "warning: ledger fragment <path> does not
      parse and was SKIPPED — its contents are not in the answers below" and
      then exits ok. `./build.sh --check` therefore passes, the pre-push hook
      stamps the tree, and the fragment reaches origin carrying a packet that
      exists in git and in NO ANSWER: not in plan status, not in plan next, not
      in burndown, not claimable, not visible to any sibling host. The author
      believes they filed work; the fleet never sees it. My 697-s3by sat in that
      state through a full commit, gate, and push.
      The cause in my case was mundane — an unquoted scalar containing a
      colon-space, which YAML reads as a nested mapping — and that is exactly
      the point: the failure is easy to produce, produces no red anywhere, and
      the loss is total and silent. It is the same shape as the fragment
      status-loss class that already earned its own checker (the fold discarding
      a declared status), and that one is a hard failure.
      DESIGN CONSTRAINT — do not simply make any malformed fragment fail the
      gate fleet-wide: a sibling's bad fragment would then turn every host's
      gate red until someone else fixes it, which converts one host's mistake
      into a fleet outage. Scope it to the CURRENT DIFF, exactly as
      634-39ik's expression-pinning enforcement was scoped when it landed the
      same day (scripts/check-litmus-expression-pinning-added.sh). You break it,
      your push fails; you inherit it, you are merely warned.
    outcome: >
      A fragment that cannot be read by the fold cannot be pushed by the change
      that introduced it.
    exit_criteria:
      - "a check fails when a fragment ADDED or MODIFIED in the current diff does not parse, and is wired into ./build.sh --check"
      - "a pre-existing malformed fragment authored elsewhere still only warns, so one host's mistake cannot red-gate the fleet"
      - "a NEGATIVE CONTROL asserts a well-formed added fragment passes, so the check cannot degrade into refusing all fragment additions"
      - "the failure message names the file AND the parse error location, so the author can fix it without re-deriving the parse"
    events:
      - type: filed
        ts: "2026-08-12T02:32:43Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260812t023243z
        host: macos
        summary: >
          Filed from my own silently-lost packet. The warning already exists and
          is well worded; what is missing is that anything fails.
