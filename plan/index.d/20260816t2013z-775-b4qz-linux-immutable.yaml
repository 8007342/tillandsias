    title: |
      tillandsias-plan set-field writes field values as unquoted YAML scalars — any value containing ": " yields a fragment that does not parse and is silently skipped by the fold.
    context: |
      Reproduced live 2026-08-16 on yoga, twice in one cycle: `set-field
      <packet> next_action "Windows cycle: apply ..."` and `... "Wire the
      handler: route ..."` each produced a plan/index.d fragment whose
      `value:` line contains a bare colon-space, which is invalid YAML. The
      fold's behavior is exactly the malformed-fragment class: `warning: ...
      does not parse and was SKIPPED` — the write LOOKS accepted (exit 0,
      `ok: ... <unset> -> ...` printed) but the correction is invisible to
      every answer. The status-flip channel was unaffected only because its
      values (`completed`, `blocked`) are colon-free; --reason text rides in
      the same fragment and would corrupt it the same way with an unluckier
      sentence. Both fragments were repaired pre-publish (block scalars) in
      commit history adjacent to this filing.
    exit_criteria:
      - |
          set-field emits field values (and reasons/evidence) as YAML block or quoted scalars so any UTF-8 sentence round-trips; a unit test writes a value containing ": ", "#", a leading "- ", and a double quote, then re-folds and asserts the field reads back byte-identical.
      - |
          set-field VERIFIES its own write before exiting 0: after writing the fragment it re-parses it (the same parser the fold uses) and fails loudly (non-zero, fragment removed or named for repair) if the fragment does not parse — the exit-0-on-corruption shape is the actual defect class.
