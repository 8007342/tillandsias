    estimated_hours: 2
    title: |
      A cycle that lawfully relocates to a clean clone can never emit MO-FULL, so its work is unattested however green the gate
    deliverable: |
      The boundary guard and mo-full-attest agree on WHICH worktree a cycle is
      accountable for, so a cycle that relocates to a clean clone can snapshot and
      attest that clone — or the skill states plainly that a relocated cycle
      exits BLOCKED by design and says what to report instead.
    context: |
      MEASURED on lenovinha-tillandsias-forge 2026-09-03. The most productive
      cycle this host has run — three packets, two completed, gate GREEN
      ("Gate stamp recorded", 160s, zero red) and every commit pushed and
      converged — could not emit a marker:

          $ scripts/mo-full-attest.sh record
          MO-FULL: FAIL no verified startup boundary for this cycle

      THE CAUSE IS THE SKILL'S OWN SANCTIONED PATH, followed correctly. The
      shared checkout was dirty at startup with generated opsx artifacts, so
      Start Of Cycle step 3 refused it and forbade committable work there. The
      skill's answer to needing concurrent work on one host is "a separate git
      worktree or a clean temp clone", so the cycle relocated. But the boundary
      snapshot is taken (and verified) against the ORIGINAL checkout, and the
      relocated clone never gets one — so `record` refuses at Finalization, after
      all the work is done and pushed.

      Both halves are behaving as designed and the composition is the defect:
      the refusal protects a checkout the cycle then correctly stops using, and
      the attestation demands a boundary for a worktree the cycle was told to
      leave.

      WHY IT MATTERS MORE THAN ONE MISSING LINE. `MO-FULL:` is how automation
      learns a cycle finished; `scripts/check-mo-full-attestations.sh` re-verifies
      the ledger and nothing else reports completion. So a lawful relocated cycle
      is INDISTINGUISHABLE FROM ONE THAT DIED — the fleet's record says this host
      did not finish, while the trunk carries its commits. That is the 964-r98h
      authorship shape: the findings survive, the evidence of having worked does
      not.

      And it is not rare on a forge. A forge's checkout is a CLONE seeded from the
      host (no bind mount), it is regularly seeded from `main` (965-rb3v), and
      `main` is refused by check-committable-branch.sh — so relocating to a clean
      clone of a platform branch is the NORMAL forge path, not an exception.

      WHAT I DID NOT DO, and it is the reason this is filed rather than worked
      around: snapshot the boundary now and verify it immediately. That would
      have produced a passing marker from a boundary taken AFTER the work, which
      compares a tree against itself and proves nothing. A vacuous verification
      that emits a valid-looking attestation is strictly worse than the missing
      one, and it is the same family as everything else this fleet fixed
      tonight — an instrument reporting success while measuring nothing.
    exit_criteria:
      - |
          A cycle that relocates to a clean clone or separate worktree can take a
          startup boundary for the worktree it will actually work in, and attest
          against it
      - |
          OR the skill states that a relocated cycle exits BLOCKED by design,
          naming what it must report in place of a marker
      - |
          The fleet can distinguish "lawfully relocated, work landed, no marker"
          from "died before finishing" without reading a transcript
    verifiable_closure: |
      On a host whose primary checkout is dirty-start-refused, run a full cycle in
      a clean clone, land a commit, and either emit a verifying MO-FULL marker or
      produce a durable, machine-readable BLOCKED record that names the relocation
      as the cause.
    evidence:
      - 'lenovinha forge 2026-09-03: MO-FULL: FAIL no verified startup boundary, after a green gate with all work pushed'
      - 'meta-orchestration SKILL.md Start Of Cycle step 3 (refuse dirty checkout) vs step 2b (relocate to a worktree or clean clone)'
      - scripts/mo-full-attest.sh — requires cycle-scoped boundary stamps in $GIT_DIR
    notes: |
      Related: 974-uk95 (a valid marker is not evidence the ledger was written) —
      the same seam from the other side. That one asks whether a marker overstates
      what happened; this asks why a cycle that genuinely happened cannot produce
      one at all.
