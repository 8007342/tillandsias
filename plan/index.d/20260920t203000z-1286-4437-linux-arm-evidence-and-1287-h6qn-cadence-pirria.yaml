  - packet_id: the-plan-only-lane-reports-the-resolved-plan-binary-is-stale-and-prints-a-rebuild-remedy-when-the-validator-surface-stamp-file-does-not-exist-beside-a-fresh-binary-so-the-remedy-rebuilds-nothing-and-the-lane-stays-shut
    event:
      type: note
      ts: "2026-09-20T20:30:00Z"
      agent_id: "linux-pirria-claude-20260920t203000z"
      host: pirria
      summary: |-
        A FREQUENCY THIS ROW DID NOT KNOW. Pushing ONE plan fragment
        (1310-7apk's row) to linux-next on 2026-09-20, this host was refused with

          plan-only lane: REFUSED — the resolved plan binary is STALE (full gate required)

        FOUR TIMES IN ONE HOUR, on four separate push attempts, for that single
        fragment. It landed on the fifth. A fifth refusal of the same shape had
        already been recorded against this row earlier the same day on a
        different fragment, so five in one day on one host.

        THE MECHANISM IS THE RACE, not the rebuild. Each rebuild costs 66s
        (`cargo build --release -p tillandsias-plan` in the builder toolbox), and
        each `git rebase` onto a trunk that has moved re-invalidates the
        validator surface the rebuilt binary was stamped against. Trunk was
        taking a land every few minutes during this window. So the sequence is:
        rebuild 66s, rebase, push into a ~135s lane (1310-7apk), discover trunk
        moved, rebuild again. A floor host loses that race by default, and the
        loop that finally won did so by running check-plan-binary-current.sh
        AFTER each rebase — which works because that checker is what WRITES the
        validator-surface stamp, this row's own subject.

        THE SHARPEST PART IS UNCHANGED AND NOW REPEATED: the binary refused as
        STALE is the same binary that allocated 1310-7apk's order number, minutes
        earlier, in the same shell. Recorded as an event rather than a new row on
        the coordinator's ruling: the mechanism is one, the cadence is its
        symptom, and stamping the validator surface where the staleness is
        DECIDED — rather than in a checker a pusher must know to run first — is
        what ends both.
