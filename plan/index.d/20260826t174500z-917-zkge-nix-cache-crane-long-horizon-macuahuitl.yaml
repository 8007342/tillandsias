      WHY IT IS NOT ACTIONABLE TODAY, measured this cycle rather than assumed:

      1. NO HOST USES A NIX CACHE FOR LOCAL BUILDS, and that is by design.
         yoga, pirria, calmecacpilli, macbook and yolanda each independently
         confirmed no nix at all — they are Silverblue boxes with rootless
         podman, which is the intended substrate. macuahuitl has nix and its
         cache service reports `absent`.

      2. 801-kqme BUILT AN ENCLAVE SERVICE, NOT A HOST BUILD ACCELERATOR.
         `openspec/specs/nix-cache-service/spec.md:34-36` requires it NOT be a
         host-loopback-only listener. The host-local half exists
         (`127.0.0.1:5111`, a `substituter-args` subcommand) and has ZERO
         consumers: not build.sh, not local-ci.sh, not flake.nix, not
         release.yml.

      3. A NIX CACHE CANNOT ACCELERATE THE BUILD AS IT STANDS. `./build.sh
         --check` is cargo + rustup. No nix binary cache holds cargo's
         incremental artifacts. Every host lane emits only
         `--extra-experimental-features` and `--store $CHROOT_STORE`
         (`nix-toolbox.sh:329-335`) — 795-h8er gave hosts a warm STORE, not a
         cache.

      4. THE ONE MEASURED SUCCESS SHOWS THE SHAPE AND ITS LIMIT. 2026-08-25 on
         macuahuitl, `.#tillandsias-x86_64-musl` against a fresh store with the
         enclave cache as sole substituter: 96 s, 563 paths substituted, 5 local
         builds. But it was hand-driven, the cache had been pre-seeded with that
         exact closure (113 s), and THERE IS NO PUSH SIDE — 790-6n2k's
         "release.yml pushes to" is `ready` and unstarted. A new commit's crate
         derivations are in no cache anywhere.

      5. cache.nixos.org does not rescue it: 873-b1nx measured a cache-only
         dry-run of the musl target against a fresh store at 2,791 derivations
         to build, 0 fetchable.

      WHAT MAKES IT WORTH DOING ANYWAY, and why crane is the hinge. `flake.nix`
      already uses crane (v0.24.0). Routing the Rust build through it turns
      dependency compilation into nix derivations, which a binary cache CAN
      serve. That is the only condition under which a throwaway toolbox becomes
      affordable — and disposability is otherwise in direct conflict with build
      caching, because the dirty state IS the cache. Measured on macuahuitl:
      `target/` 34 GB against 504 MB of source, artifacts ~180x source; a cold
      full gate in a fresh worktree is 125 s on 20 cores and roughly 10 min on
      a 4-core host.

      THE CONVERGENCE BET being tested here: several packets already point this
      way without being told to — 916-ijxa (the forge cache exemption resting on
      a false ephemerality premise), 915-wkm2 (scratchpad quota), 863-iicc
      criterion 4 (worktree cost), 906-qi89 (sweep triggers). If long-horizon
      filing works, those close individually and this becomes reachable without
      anyone re-planning it. If it does not, this row sits untouched and that is
      the measurement.
