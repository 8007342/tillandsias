        Filed because the operator asked who owns the blocking queue and the
        answer was nobody — every candidate row was `ready` and unclaimed, and
        these two, the largest of them, did not exist as rows at all.

        THERE IS A FEEDBACK LOOP HERE WORTH NAMING. Hosts select work through
        select-work-batch.sh, which picks among the top-3 frontier epics. None
        of the fleet-enabling rows sits in those epics, so the selector never
        offers them, so they stay unowned — including 847-wgy4, the row whose
        whole subject is that the selector cannot route work to the host that
        should do it. The defect is currently protecting itself from being
        fixed. Until 847-wgy4 lands, these rows reach a host only by being
        named in that host's invoking prompt.
