      summary: |
        CRITERION 3 IMPLEMENTED AS A DETECTOR, ADVISORY, plus the caller half of the
        darwin fail-open. Two deliverables, both of them halves I owed.

        THE DETECTOR: scripts/check-no-competing-gate.sh, wired into build.sh's fast
        refusals — the cheapest place to learn that the verdict you are about to spend
        six minutes on may be raced. It implements the three states the measurement
        found, not the two the criterion originally assumed:
          LIVE   a live host-side `toolbox run` in the token group   -> healthy gate
          idle   host side gone, ONLY conmon                         -> normal residue
          STRAY  host side gone AND a live build.sh worker           -> reported
        and a fourth answer that is not a state at all: no procfs -> exit 3,
        could-not-run, never "none found".

        ADVISORY, NOT REFUSING, and the reason is the row's own history rather than
        timidity. This discriminator has been wrong three times in two cycles — "ppid
        is conmon" (false: a legitimate gate is conmon-parented too), a conmon-session
        walk (workable, needless), and now this — and TWICE only a measurement caught
        it. A wrong refusal on build.sh's fast-refusal line stops every Linux host, not
        one. So it reports today, the fixture pins the refusing mode so promotion is a
        flag flip rather than a rewrite, and the flip waits on fleet evidence. Same
        staging check-portability-idioms.sh argues for itself, and the same standard:
        promote on measurements.

        THE CALLER HALF OF THE DARWIN FAIL-OPEN, which is mine and was the more
        embarrassing of the two. with-tillandsias-builder.sh's trap read
        `tillandsias_reap_marked "$TOKEN"; exit 143` — it DISCARDED the verdict and
        exited 143 either way. macbookair is making the reaper return an honest
        `unsupported:dispatch-reap:no-proc` on a host with no /proc; that fixes nothing
        while its caller throws the verdict away, because the silent success just moves
        up one layer wearing the caller's name. The trap now names the failure on
        stderr, says a cancelled gate may still be holding the checkout, prints the
        token to find it by, and repeats that SIGTERM was measured inert on a survivor.
        The exit stays 143, because that is what a terminated wrapper is.

        THE FIXTURE IS PROCFS-SHAPED FILES, NOT PROCESSES. Arms that race real sleeps
        test the scheduler as much as the classifier, and the state this must get right
        — a host-side wrapper that has just died while its child has not — is exactly
        the one that will not hold still. The earlier reap fixture learned that the
        noisy way when a backgrounded child inherited a command-substitution pipe and
        hung it for its whole timeout. A narrow TILLANDSIAS_PROC_ROOT seam buys full
        determinism and makes the no-procfs arm reachable on Linux, which is the arm
        whose absence let the reaper fail open on darwin.

        MUTATION-VERIFIED against the three wrong widenings, each caught by the arm
        written for it, with the diff PROVEN NON-EMPTY before each run: counting conmon
        as a worker folds idle into the defect (6/8), counting any live process makes a
        cargo test's leaked `sleep 600` children a competing gate (7/8), and treating a
        missing procfs as "nothing found" reproduces the darwin fail-open exactly (7/8).
        Restored identical, 8/8, 56ms.

        ONE ARM NOBODY ASKED FOR AND I WOULD KEEP: an UNTOKENED build.sh is invisible
        here. A sibling checkout's gate, or an operator's own build.sh, must never be
        called this checkout's competitor — widening to all build.sh processes would
        refuse across checkouts on any host running two.
