    unscoreable: |
      UNPINNABLE UNTIL THE MESSAGES EXIST, which is the same bind this packet
      is about — fittingly. The closure is a property of two REFUSAL TEXTS that
      have not been written, so any litmus named now resolves to nothing and
      check-declared-closures-added.sh refuses the row (885-92iu). Declaring
      unscoreable is the sanctioned form (the coordinator ruled it so on
      2026-09-12, and this packet exists to make that ruling discoverable
      without a ruling).

      WHAT MAKES IT SCORABLE: with the fix, pin a litmus asserting BOTH
      messages name each other — feed a new-test packet through each guard and
      grep the refusal for the counterpart's form. Two greps, one fixture.
    verifiable_closure: ""
    title: |
      a packet whose DELIVERABLE IS A NEW TEST is refused by 977-448j for naming no litmus and by 885-92iu for naming one that does not resolve yet — the bind is intended, the exit exists, and neither refusal mentions the other or the way out
    context: |
      MEASURED 2026-09-12 while filing 1130-i6xj, both refusals hit in
      succession on the same row:

        1. Filed with no verifiable_closure:
             violation:scorable-obligation-missing:1
             "carries no scorable obligation — add a verifiable_closure naming
              a litmus:<test>, or an explicit 'unscoreable: <reason>' (977-448j)"
           (scripts/check-scorable-obligation-added.sh:361)

        2. Added `verifiable_closure: litmus:<the test this packet will write>`:
             violation:declared-closure-unresolvable:1
             "declares litmus:X — no litmus test declares that name"
           and build.sh:2940-2942 exits 1.

      So a packet that DELIVERS a new test can satisfy neither: it cannot name
      an existing litmus, and it cannot name a future one.

      THE BIND IS INTENDED — the coordinator ruled exactly that on 2026-09-12:
      "a declared pin must resolve, and a packet whose deliverable IS the test
      cannot resolve it yet." The exit is real and already sanctioned:
      `unscoreable: unpinnable-until-the-guard-exists`, naming the exact future
      litmus filename and instructing the claimer to write it in the same
      commit as the thing under test and move the closure text across.

      WHAT IS MISSING IS ONLY THAT THE REFUSALS DO NOT SAY SO. Guard 1's message
      offers `unscoreable: <reason>` but does not say that a new-test packet is
      the case that needs it. Guard 2's message does not mention `unscoreable`
      at all, so the natural next move after reading it is to delete the pin —
      straight back into guard 1. The two guards never reference each other.

      WHY THIS IS WORTH A ROW RATHER THAN FOLKLORE. The wrong turn is ATTRACTIVE:
      declare the pin anyway and let it dangle. That is exactly order 1068-cxmf's
      standing defect — four packets already name litmus tests nothing defines,
      printing violation:declared-closure-unresolvable on every gate — so the
      cost of not saying this is a fifth dangling pin added BY someone trying to
      look rigorous. A filer who reads both messages and neither exit will
      reasonably conclude the system is inconsistent, when it is merely quiet.
    deliverable: |
      Both refusals name the way out and each other.

        * scripts/check-scorable-obligation-added.sh:361 — after the existing
          "or an explicit 'unscoreable: <reason>'", add that a packet whose
          DELIVERABLE IS THE TEST should use
          `unscoreable: unpinnable-until-the-guard-exists`, naming the future
          litmus filename.

        * the unresolvable message — NOTE THE SCOPE: it is emitted by
          `tillandsias-plan declared-closures-check`, i.e. Rust in
          crates/tillandsias-plan, NOT by the shell wrapper
          check-declared-closures-added.sh, which only counts and relays. So
          this half is a code change and a rebuild, not a one-line script edit.
          It should say: "if this test is THIS packet's deliverable, declare
          `unscoreable: unpinnable-until-the-guard-exists` instead of pinning a
          name nothing defines (1068-cxmf)."
    next_action: >
      Start with the shell half (check-scorable-obligation-added.sh:361) — it is
      one string and lands without a rebuild. Then the Rust half in
      tillandsias-plan's declared-closures-check. Pin both with a litmus that
      feeds a new-test packet through each guard and greps the refusal for the
      counterpart's form; that also discharges this row's own unscoreable state
      the way its text prescribes, which is a pleasing but genuine self-test.
