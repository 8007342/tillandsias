      summary: |
        RUNG 5 LANDED — the last of the five. Enforcement is a GATE that refuses,
        wired into ./build.sh --check, with fixtures that prove it can refuse.
        scripts/check-scorable-obligation-added.sh + test-scorable-obligation-gate.sh, 7/7.

        WHAT WAS ALREADY ENFORCED, so this does not duplicate it: 885-92iu's
        check-declared-closures-added.sh refuses a NEW packet whose
        verifiable_closure NAMES a litmus test that cannot run. What it never
        asked is whether a closure exists AT ALL — so a new row with no pin, or
        one whose closure is pure prose, passed it silently. That is exactly the
        row rung 4 could not score.

        WHAT COUNTS AS SCORABLE, and the second half is the load-bearing one:
        either a verifiable_closure naming a litmus:<test>, OR an explicit
        `unscoreable: <reason>`. The second is not a loophole. Some rows
        genuinely close by a measurement, a script verdict or an operator
        decision, and demanding a litmus test of all of them would make the gate
        UNSATISFIABLE — and an unsatisfiable gate is switched off, which is the
        failure this packet family exists to prevent. What is refused is
        SILENCE: a row that says nothing about how it could ever be scored. A
        stated reason is auditable and greppable; an omission is neither.

        CRITERION 2 — the two conditions are DISTINGUISHABLE, and they demand
        opposite responses. `violation:scorable-obligation-missing:N` is a
        refusal (exit 1). `note:scorable-obligation-regime-broken:N` is NOT: a
        row that tombstones an obligation is scorable but has left the monotone
        band, so its score must not be compared with the previous run. Redding
        that would punish the behaviour proximity.yaml:47 REQUIRES when a
        requirement's meaning changes. Two fixture arms assert both halves — the
        break is named, and it is not redded.

        CRITERION 3 — THE EVIDENCE IS INDEPENDENT OF BACKFILL COVERAGE, which is
        why the coordinator split these two rows. Every fixture runs against a
        purpose-built temp git repository; the suite never reads the real
        ledger, so rung 4's 2.6% cannot make this rung pass or fail. And the
        gate is diff-scoped to NEW rows, so the standing debt — 451 of 563
        packets carry no verifiable_closure — is not redded. A gate that reds
        the trunk on day one gets switched off.

        MUTATION-TESTED, because a 7/7 on a suite I wrote proves nothing on its
        own. Replacing the violation branch with a no-op makes the gate accept
        everything, and BOTH refusal arms catch it (want=violation, got=ok). The
        suite fails when the gate stops refusing.

        AND A NEAR-MISS WORTH RECORDING, because it is this session's own theme
        arriving in my own test: the suite reported PASS 7/7 while `L` — the
        variable its fixture tokens are built from — was UNDEFINED. Under
        `set -u` each command substitution aborted, every fixture produced empty
        output, and the arms compared empty against empty. I only caught it
        because a later arm asserted on CONTENT rather than on equality. An
        assertion that compares two things neither of which exists is the purest
        form of the vacuous check this whole packet is about.

        THREE GATE REFUSALS OF MY OWN WORK, all correct and all fixed at the
        source rather than annotated away: `if ! <pipeline>` inverts under
        pipefail + SIGPIPE (795-imz3, in rung 4's script); `mapfile` is
        bash-4-only and macOS ships bash 3.2, so a shared gate using it would
        refuse to run on one host and pass vacuously there (761-g36m); and my
        fixture's literal `litmus:some-test` read as a verification claim that
        does not resolve (721-77yu) — assembled from a variable instead, so the
        fixture stays self-contained without asserting a pin.

        976-kk6x IS NOW COMPLETE ACROSS ALL FIVE RUNGS: model, properties,
        scorer, backfill, enforcement.
