packets:
  - packet_id: timing-log-writer-resolves-three-different-roots-across-hosts
    order: 942-e23x
    status: ready
    kind: bug
    pickup_role: any
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - instrumentation
      - portability
      - fail-loud
    estimated_hours: 3
    title: |
      The timing log lands in (at least) three different places across hosts — /tmp in WSL2, HOME .cache on macuahuitl, repo-relative .cache on pirria — and the reader checks one
    deliverable: |
      One resolution rule for the timing log, shared by writer and reader,
      with the repo-relative rung under target/ per the 760-hzi4 precedent —
      and cycle-metrics.sh finds every host's rows.
    context: |
      THREE MEASURED LOCATIONS in one night, all from hosts going looking
      for their own numbers: yolanda — /tmp/tillandsias-timing.jsonl INSIDE
      the WSL2 build distro (3856 lines, invisible to the reader; reported
      as an 890-t9pu regression); macuahuitl — ~/.cache/metrics/ (HOME);
      pirria — .cache/metrics/ RELATIVE TO THE REPO WORKING TREE (found by
      a filesystem-wide find that turned up exactly one path). None is
      target/metrics/ where cycle-metrics.sh reads per the shared rule.
      So 890-t9pu's framing (a target-vs-/tmp regression) UNDERSTATES the
      defect: the writer's resolution varies per environment — the same
      divergent-resolution class as the spec index (760-hzi4, four
      instances on Windows) and the reader resolves independently. The
      760-hzi4 fix shape applies nearly verbatim: one ladder, repo-relative
      rung under target/ first, agreement between writer and reader
      proven by a fixture that writes then reads on the SAME host, plus
      the divergence control (the old resolution demonstrably differed).
    exit_criteria:
      - writer and reader share one resolution (one function or one sourced snippet), with the repo-relative target/ rung first
      - a fixture writes a timing row and reads it back through cycle-metrics.sh's path on at least two regimes (one WSL2), watched red against today's divergence first
      - the three measured wrong locations are named in the remedy so migration of existing rows is deliberate, not silent loss
