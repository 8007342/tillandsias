    title: |
      resolve_target_binary tries "$dir/$name.exe" BEFORE "$dir/$name", so inside a WSL distro with interop enabled a stale .exe beside a fresh ELF is the binary that runs — every Windows gate refused until it landed
    context: |
      RELAYED FROM macuahuitl, measured by esme, landed from yoga because the
      Windows hosts are the ones it blocks and yoga's gate was warm.

      THE DEFECT IS THE SIBLING OF ONE ALREADY FIXED. 1030-i2p8 reordered
      resolve_plan_binary to try the locus-native ELF first, and its comment
      predicted the masking would lift; resolve_target_binary, fifty lines
      below it in the same file, never got the same change. So the class was
      known, written down, and left half-closed — the second instance was not
      discovered, it was WAITING.

      WHAT ESME MEASURED. On a shared Windows/WSL checkout both artefacts sit
      in one target dir, and with interop enabled the .exe RUNS inside the
      distro — so the probe's run-don't-stat contract does not separate them
      and candidate ORDER decides. A Sep-4 tillandsias-policy.exe was selected
      over the current ELF; the Windows binary joined `/mnt/c/...` with a
      backslash; check-cheatsheet-tiers refused "cheatsheets/ directory not
      found" against a tree where it plainly exists. Same tree, same args:
      .exe -> ERROR, ELF -> silent pass. 67.5 minutes to reach that false
      verdict, and the verdict named the cheatsheets directory rather than the
      binary that could not read it — the instrument blaming the data.

      WHY THE REORDER IS SAFE, the same argument 1030-i2p8 makes: this is a
      RUN-don't-stat probe, so a candidate is returned only when it actually
      executes. Inside a Linux locus the ELF runs and the .exe is skipped; on
      the Windows side the ELF cannot execute and is skipped, leaving the .exe.
      Each locus gets its native artefact without any caller passing a flag to
      say which locus it is in.
    exit_criteria:
      - "resolve_target_binary returns the ELF when a RUNNABLE .exe sits beside it in the same dir. Pre-fix result: FAILS — case 6 returns the .exe, demonstrated by mutation (the diff proven non-empty first, then the arm named the pre-fix order by name)."
      - "The .exe stub in the fixture is RUNNABLE. An unrunnable one would let the ELF win by default and the arm would pass against the pre-fix order too — a green that asserts nothing (1041-up99)."
      - "The candidate order matches resolve_plan_binary's, so the two probes in one file cannot disagree about which artefact a locus prefers."
