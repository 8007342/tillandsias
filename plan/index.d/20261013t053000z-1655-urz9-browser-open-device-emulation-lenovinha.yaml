    title: |
      browser.open{url, device?} opens the container window at the device's fixed size with CDP device emulation, and browser.set_device switches it live.
    context: |
      After 1649-xqet and 1651-5t7n, a browser.open window is a chromium-framework container on its own internal network. It has no CDP at all: CdpSession sent NUL-framed (pipe) JSON to an HTTP DevTools port, which never worked, and there is no host TCP listener by design.
      Design (coordinator, 2026-10-13):
      - The window is opened with --app plus --window-size = the device's CSS viewport at HOST scale (not the device DPR).
      - Over CDP, taken from the 1643-q3at resolver: Emulation.setDeviceMetricsOverride{width,height,deviceScaleFactor,mobile}, Emulation.setUserAgentOverride with client-hint metadata, Emulation.setTouchEmulationEnabled{maxTouchPoints} and Emulation.setEmitTouchEventsForMouse.
      - The broker holds ONE CDP session per window for the window's lifetime (the overrides die with the session) and auto-attaches popups.
      - New tool browser.set_device{window_id, device}.
      - The default device comes from the .tillandsias project config, then desktop.
      - CDP transport: no host TCP listener. Chromium runs with --remote-debugging-pipe inside the container; a small in-container relay exposes it on a Unix socket in a tray-only host dir. CdpSession's framing is fixed for that transport.
    exit_criteria:
      - 'browser.open{device:"iphone 12 pro max"}, then evaluating [innerWidth, devicePixelRatio, navigator.maxTouchPoints] in the page, returns [428, 3, >0]; red on the 1651-5t7n tree first'
      - 'browser.open{device:"galaxy s24"} returns that device''s catalogue viewport width, dpr and touch points'
      - 'browser.set_device{window_id, device} switches a live window: the same evaluation returns the new device''s numbers without reopening'
      - 'the host has no new TCP listener while a window is open (ss -ltn before/after), and the CDP Unix socket lives in a tray-only host dir'
