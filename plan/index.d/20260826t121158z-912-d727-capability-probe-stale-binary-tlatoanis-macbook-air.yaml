packets:
  - packet_id: capability-probe-depends-on-a-binary-no-cycle-rebuilds
    order: 912-d727
    status: ready
    kind: bug
    pickup_role: any
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    depends_on: []
    deliverable: |
      host-capability-probe.sh either rebuilds the binary it depends on, or
      distinguishes "binary is stale" from "binary is missing" from "the probe
      genuinely failed" — and check-capability-row.sh can tell a stale row from
      a current one.
    capability_tags:
      - tooling
      - fail-loud
      - capability-matrix
    tags:
      - stale-artifact
      - probe
      - v0.5
    title: |
      `host-capability-probe.sh` invokes `target/release/tillandsias --capabilities --fresh` — a binary nothing in the cycle rebuilds — and reports a stale binary with the same message as a broken probe.
    context: |
      MEASURED on tlatoanis-macbook-air 2026-08-26T12:1xZ.

          $ scripts/host-capability-probe.sh
          error: ./target/release/tillandsias --capabilities failed

      The probe was not broken. `target/release/tillandsias` was dated
      2026-08-22 and predates the `--fresh` flag, so it answered
      `Unsupported option: --fresh`. Current source knows the flag
      (`main.rs` parses it in the capabilities path and lists it among the
      accepted options). `cargo build --release -p tillandsias-headless --bin
      tillandsias` fixed it outright, and the probe then produced its full JSON.

      TWO THINGS COMPOSE HERE:

      1. NOTHING IN THE CYCLE REBUILDS THAT BINARY. `cycle-preflight.sh`
         deliberately rebuilds `tillandsias-plan` — "rebuild the instrument
         before using it" — and that reasoning applies verbatim to the
         capability probe's instrument, which it does not cover. On macOS
         nothing else builds it either: `./build.sh --install` is refused on
         Darwin (723-whrx), so the binary only exists here if someone built it
         by hand, and then only ages.

      2. THE ERROR NAMES THE SYMPTOM, NOT THE CAUSE. `--capabilities failed`
         is emitted identically for a missing binary, a stale binary that
         rejects a newer flag, and a probe that genuinely failed. The
         `|| { echo ...; exit 1; }` discards the binary's own stderr, which in
         this case said exactly what was wrong in one line.

      AND THE GATE COULD NOT SEE IT. `check-capability-row.sh` reported
      `ok:capability-row-reported:tlatoanis-macbook-air` throughout, because a
      row published on an earlier date exists. So the fleet's capability matrix
      carried a row for this host that the host could no longer reproduce, and
      the gate that exists to notice a missing row cannot notice a stale one.
      That is the 850-bif2 shape one turn further on: a matrix that cannot see
      hardware it was never told about now also cannot see hardware whose
      report has gone stale.
    exit_criteria:
      - |
          The probe either rebuilds its binary (as cycle-preflight does for the
          plan expert) or refuses with a verdict that names WHICH failure it
          hit — absent, stale/flag-rejected, or genuine probe failure. Passing
          the binary's own stderr through is most of the fix.
      - |
          `check-capability-row.sh` distinguishes a row this host can currently
          reproduce from one merely present in the matrix. A freshness field or
          a re-probe, not a presence check.
      - |
          NEGATIVE CONTROL: a host with a CURRENT binary and a CURRENT row
          still reports ok, and the probe still runs without a rebuild when one
          is not needed. Without this leg the fix could be "always rebuild",
          which is correct-but-expensive and would be reverted.
    verifiable_closure: |
      NAMED: extend `litmus:capability-manifest-guard` (bound) with two legs —
      a fixture whose probe binary rejects a flag must yield a verdict naming
      STALENESS rather than a generic failure, and a fixture with a current
      binary must still pass without a rebuild. The first must be RED before
      the fix.
    notes: |
      Found while reading 793-qr4t, whose subject is the accel envelope this
      probe reports. The envelope content is a separate matter recorded on that
      packet; this is purely about the probe's own instrument and its verdict
      grammar.
