        Nothing on the host runs `cloud-init status`, parses it, or branches on it. So the packet's HARM is real and its TARGET was misidentified: nobody is fooled by cloud-init's `done`, because nobody asks cloud-init. What actually happens is that twenty decision points treat FILE EXISTENCE as completion. macneo's cold provision is the proof — rootfs.img exists, `is_provisioned()` is TRUE, the guest never reached Ready, and there is no completion record because none exists to write.

        THE REWORDED CRITERION CONNECTS TO CRITERION 2 RATHER THAN COMPETING WITH IT: the completion record is precisely the fact `is_provisioned()` lacks, and a host-side reader of an image-root marker is what would let those sites distinguish a disk file from a finished provision. One design.

        CRITERION 2 IS ARBITRATED TO macneo, and the deciding argument is SEQUENCING rather than precedence. macbookair independently decided to fix the missing completion record at ~20:1xZ, from evidence macneo had just sent them, and stood down unprompted when macneo flagged it. Neither host wrote anything. The completion record and the marker LOCATION are one change: a completion line written to /var/log inside the guest is unreadable in exactly the condition it exists to report, because order 272 masks sshd and its sockets and symlinks systemd-ssh-generator to /dev/null, making the control wire the only host-to-guest channel by construction. Landing the completion in the guest-only path first means moving it again and rewriting the three-state fixture with it.

        THE CREDENTIAL ASYMMETRY WAS WEIGHED EXPLICITLY, at macneo's request, and did not decide it. macneo cannot push, so their work returns by hash-first relay and costs the coordinator a landing; macbookair could land directly. Routing by credential would concentrate design work on whichever hosts can push, which is a worse failure than one extra relay.

        THE TWENTY BRANCHING CALL SITES ARE THEIR OWN PACKET AND MUST NOT BE ABSORBED HERE. Changing what they mean by "provisioned" is not a small edit and several gate destructive or user-visible behaviour. Slice (a) of 980-ja2m already fixed the REPORTING of that same field — `--diagnose` now says the boot artifacts are on disk rather than PROVISIONED, precisely because macneo found it was a stat() — and the branching half is different work with a different risk profile. File it at criterion 4's close with the 11/7/2 breakdown and the note that the reporting half is done.
