    title: |
      When the preflight door KILLs scripts/test-awk-float-lc-numeric.sh at its deadline, the fixture's .mutant-lcnum-* copies stay in scripts/ (the declared in-checkout writer of 1587). A later guard in the same run, check-bare-mktemp.lua, then refuses the tree on the copies' bare mktemp sites. So one guard's kill false-refuses another, depending on order.
    context: |
      MEASURED (tlatoanis-macbook-air, 2026-10-12, taskpolicy -b ./build.sh --preflight on work/1616-njfd): the summary was refused:preflight:ran=158 could-not-run=1 refused=1. could-not-run was awk-float-lc-numeric-signal (killed). The refusal was check-bare-mktemp.lua with violation:bare-mktemp:new-site:scripts/.mutant-lcnum-select-work-batch.sh:4>floor:0, with sites in .mutant-lcnum-freshness-inventory.sh and refusal-calibration/.mutant-lcnum-measure-bands.sh. The copies were gone by the next run, which on the same tree said refused=0 (ran=168 could-not-run=0 wall=362s).
      WHY IT LEAKS: the fixture's copies must sit beside the producers they copy (scripts/portability/checkout-writers.txt line 6), so they are named .mutant-lcnum-<basename> next to each producer, with no pid in the name. Its TERM/INT/HUP traps clean up, but nothing survives the door's KILL after the grace. That is the 1618-baia shape, with a declared in-checkout pattern where 1618 had a per-pid subdir.
      COORDINATOR RULING (macuahuitl, 2026-10-12): fix it on the door side. On a kill, the door sweeps the killed guard's DECLARED in-checkout artifacts; awk-float-lc-numeric is the one kept writer, so its pattern is known. Do not make check-bare-mktemp skip .mutant-*: that would only hide the next variant.
    exit_criteria:
