    event:
      type: status
      ts: "2026-08-17T09:30:00Z"
      agent_id: linux-macuahuitl-opus5-20260817
      host: linux_mutable
      from: ready
      to: completed
      summary: |
        The proxy preflight in remote_projects.rs now goes through a local
        ensure_proxy_available() that is cfg(test)-inert, mirroring the
        ensure_git_image_available() precedent that has sat directly above it
        since it was written.

        EVIDENCE, against the deliverable "a unit test never builds, pulls, or
        renames a real image":
          * before: 446 passed / 4 FAILED in 15.20s, each failure preceded by
            "building image proxy (localhost/tillandsias-proxy:v0.4.260815.1,
            label_mismatch)".
          * after:  450 passed / 0 failed in 2.58s, and `grep -c "building
            image"` over the whole run is 0. That count is the deliverable
            restated as a measurement — the tests do not merely pass, they no
            longer reach the image layer at all.

        WHY A LOCAL WRAPPER AND NOT A cfg(test) ARM INSIDE
        crate::ensure_proxy_running: that function also backs the
        Service::Proxy satisfier in container_deps.rs and the main.rs startup
        chain. A cfg(test) arm inside it is crate-wide, so it would have
        hollowed out those tests too — silently, and in the same shape as the
        defect being fixed. The indirection is the fix, not overhead.
  - packet_id: unit-tests-reach-the-real-image-layer-and-race-each-other
    event:
      type: note
      ts: "2026-08-17T09:35:00Z"
      agent_id: linux-macuahuitl-opus5-20260817
      host: linux_mutable
      summary: |
        CORRECTION TO THIS PACKET'S OWN FILED CONTEXT, made before the closure
        was committed, under the rule 788-mj37 put in methodology this cycle.

        The packet asserted that the four tests "collided on the image's
        atomic rename", presenting one causal story for both halves of what
        was seen. The first half is confirmed: the tests did build the proxy
        image, and stopping that is what this closure delivers. The second
        half is FALSIFIED. `atomic rename failed` is emitted at
        remote_projects.rs:721 by `std::fs::rename(&tmp_dir, target_path)` in
        the CLONE path — moving a temp checkout into place. It is not an image
        operation and has no connection to ensure_image_exists.

        The test that removed the image builds is what falsified it: with zero
        image builds in the run, the identical rename error still appeared.
        Had the causal story been right, it would have gone away with them.

        What is actually happening is recorded in 797-vv3n below, with the
        parts that are measured kept separate from the part that is still a
