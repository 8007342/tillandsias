        - a_find_that_exits_44_reads_as_absent (the control);
        - a_find_that_fails_any_other_way_is_an_error_naming_the_exit (36, 51, 1);
        - a_failed_find_does_not_generate_and_write_a_new_anchor;
        - a_stored_anchor_read_through_a_failing_find_is_an_error_not_absent (scratch Keychain service only).
        MEASURED in one run: the pre-fix mapping gave 3 FAIL with the 44 control passing; post-fix 13/13; reset_state 10/10.
        UNVERIFIED HYPOTHESIS, still labelled so: that this mechanism caused the darwin gate flakes (anchor read as None at 7fed6879c; exit 45 at 7d3a9a3b9). There were 0/16 standalone reproductions. It is to be judged on the next darwin gates: if the anchor-None flake recurs post-d920a8dbe, this was not its cause.
