      summary: |
        Landed #318 as d920a8dbe, darwin land gate green. Fix: in read_credential_string_in only exit 44 (errSecItemNotFound) reads as absent. Any other `security find-generic-password` failure is an Err naming the exit, so read_or_generate_in no longer writes a new installation anchor over a stored one after a transient Keychain failure.
