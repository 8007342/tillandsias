      summary: |
        COORDINATOR'S FRAMING, worth carrying on the row rather than only in the
        message that produced it (macuahuitl, 2026-09-18):

          "the workaround that changed nothing is the reason the gap was not found."

        This agent committed all cycle with `git -c core.hooksPath=.githooks`, aimed at
        a directory this repo does not contain. Functionally `--no-verify`. It changed
        no outcome, because no hooks were installed either way — and that is precisely
        what made it invisible: a workaround whose effect is nil produces no symptom to
        investigate, so it masks the condition it is working around. The absence was
        found by a SIBLING reading a push that should have been refused, not by the host
        running with it.

        Generalisation for whoever implements the detection: a guard gap that is being
        routed around silently will not be found by the host doing the routing. The
        check therefore has to run somewhere that does not depend on the host noticing
        anything — which is the same reason exit criterion 2 forbids putting it inside
        `build.sh`.
