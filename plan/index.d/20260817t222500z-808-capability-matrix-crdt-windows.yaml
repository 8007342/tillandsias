# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by windows (yolanda), 2026-08-17.
#
# OPERATOR DIRECTIVE, 2026-08-17: "Each host should take care of primarily its
# own hardware spec, but take in mind the composability for different tiers and
# specs. The whole compatibility matrix should be a CRDT with all hosts
# contributing to the capability matrix."
#
# This fragment shapes that into packets. It does NOT implement it — the schema
# it touches is a shared crate and the fold is fleet-wide, so one host must not
# land it unilaterally.
#
# The honest starting point is that TONIGHT'S OWN CONTRIBUTIONS ARE NOT CRDT
# ENTRIES. Linux wrote plan/issues/accel-bench-yoga-cpu-2026-08-17.json; this
# host wrote plan/issues/accel-bench-yolanda-cpu-2026-08-17.json and put its
# envelope in a YAML COMMENT HEADER. Two files, no merge semantics, no schema
# binding them, and nothing that can answer "what is the fleet matrix". The
# directive names exactly the gap those two files opened.

packets:
  - packet_id: capability-matrix-is-a-crdt-of-per-host-rows-not-a-pile-of-json-files
    order: 808-7yrd
    status: ready
    desired_release: v0.5
    priority: p1
    kind: enhancement
    title: "the fleet capability matrix should be a CRDT over per-host capability documents, contributed through the ledger fragment channel that already provides exactly those semantics — today it is two hand-named JSON files and a YAML comment"
    deliverable: "a `capabilities:` channel in plan/index.d fragments holding one CapabilityDocument per host, folded as a map host_id -> LWW-Register(document) resolved by (ts, host), plus a `tillandsias-plan capability-matrix` read that emits the folded matrix"
    pickup_role: any
    release_target: forge-local-experts-milestone
    capability_tags: [fleet, accel, crdt, plan, architecture]
    depends_on: [808-43mw]
    context: |
      THE MECHANISM ALREADY EXISTS AND IS PROVEN. plan/index.d/README.md
      declares three channels with CRDT semantics: `packets:` a G-Set keyed by
      packet_id, `events:` a G-Set keyed by (packet_id, event identity), and
      `status:` an LWW-Register "resolved by (ts, host)". Fragments are written
      to <utc>-<suffix>-<host>.yaml, a filename only one host can produce, so
      git never merges and no host waits on another. Reads fold every fragment
      transparently. That is precisely the shape a capability matrix needs, and
      inventing a second, parallel mechanism for it would be the error.

      THE CRDT IS UNUSUALLY STRONG HERE, and the directive is the reason: "each
      host takes care of PRIMARILY ITS OWN hardware spec" means each key has a
      SINGLE WRITER. Host A never writes host B's row. So the register never has
      to arbitrate a genuine concurrent conflict — LWW only ever resolves one
      host re-measuring itself, where last-writer is trivially correct. Most
      CRDT pain comes from concurrent writes to one key; this design does not
      have that case by construction. Worth stating explicitly so nobody
      "improves" it later into a merge that can lose a host's row.

      SHAPE:
        capabilities:                    # map host_id -> LWW-Register(doc)
          - host_id: yolanda             # the key; only yolanda writes it
            ts: "2026-08-17T21:00:00Z"   # resolves re-measurement of the SAME key
            document: { ...CapabilityDocument, schema_version: N... }

      Folding is a union over host_id, taking max ts per key. A host that has
      never reported is ABSENT from the matrix, which is a different fact from a
      host reporting no accelerator — and the matrix must keep those distinct
      for the same reason 806-2r4s exists one level down.

      WHY p1 AND WHY NOW: this is the substrate 806-6k6k (the inference swarm,
      v0.7) would schedule on. That packet's own constraint — "keep the
      tier/placement decision separable from the transport" — is unachievable if
      placement has no fleet-wide, machine-readable statement of what each host
      can actually run. Building the swarm first and the matrix after would bake
      in per-host assumptions, which is what its author was warning against.

      COMPOSABILITY IS A SCHEMA PROPERTY, NOT A CONVENTION. The schedulable unit
      is the triple (device_class, lane, engine), which DeviceRecord.lanes and
      EngineRecord.supported_device_classes already model correctly.
      `legacy_tier` is the field that flattens all three into one string; it
      should be DERIVED from the triple for backwards compatibility and never be
      the authority. A matrix keyed on legacy_tier cannot express "this host has
      a gpu reachable from host-native but not from container", which is a real
      state on this very machine.

      EXPLICITLY NOT PROPOSED HERE: any scheduler, any transport, any discovery.
      Those belong to 806-6k6k. This packet is the data plane only.
    verifiable_closure: "two hosts' capability documents, written as independent fragments, fold into one matrix keyed by host_id with neither row lost, and a third fragment re-measuring one host replaces only that host's row"

  - packet_id: capability-document-cannot-say-which-host-it-describes
    order: 808-43mw
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "CapabilityDocument has no host identity and its measurements carry neither a workload suite nor a measurement locus, so per-host rows cannot be keyed and cross-host numbers cannot be told apart from incomparable ones"
    deliverable: "HostInfo carries a stable host_id; MeasurementRecord carries workload_suite and locus; schema_version bumped accordingly"
    pickup_role: any
    release_target: forge-local-experts-milestone
    capability_tags: [accel, schema, fleet, rust]
    context: |
      THREE GAPS, all found by trying to contribute a row tonight rather than by
      reading the struct.

      (1) NO HOST IDENTITY. HostInfo is exactly two fields —
      `is_battery_present: bool` and `kernel_release: String`
      (accel_probe.rs:74-77). Nothing in a CapabilityDocument says WHICH host it
      describes. Tonight's two rows are distinguishable only by filenames a
      human chose: plan/issues/accel-bench-yoga-cpu-2026-08-17.json and
      ...-yolanda-cpu-.... A CRDT keyed by host cannot be built on a document
      that does not carry its own key, and a convention-in-a-filename is not
      data. This blocks 808-7yrd outright, which is why that packet depends_on
      this one.

      Note kernel_release is NOT a usable substitute: two WSL2 hosts report the
      same `6.18.33.2-microsoft-standard-WSL2`, and this host's own build distro
      and runtime distro would collide with each other.

      (2) NO WORKLOAD SUITE ON MEASUREMENTS. MeasurementRecord is
      {device, engine, prefill_tps, decode_tps, joules_per_token, degraded,
      degraded_reason} (accel_probe.rs:62-70). The bench harness already stamps
      `workload_suite: 802-2536-v1` in its own JSON, but the capability document
      has nowhere to put it — so two measurements taken under different suites
      merge into one matrix indistinguishably, and the matrix silently compares
      numbers that were never comparable.

      (3) NO MEASUREMENT LOCUS — and this one is not hypothetical, it is the
      caveat this host had to write in prose tonight (807-c3mf). Linux runs
      bench-accel-lane.sh INSIDE the guest. This host could not: jq is absent
      there, so the row was taken from the Windows side against the guest
      endpoint mirrored onto the Windows loopback. Those two numbers went into
      the same matrix with the difference recorded only as an English sentence
      in a ledger comment. A `locus` field with a closed vocabulary
      (`in-guest` | `host-side-via-mirror` | `bare-metal` | `in-container`)
      makes comparability a machine-checkable property instead of a footnote a
      future reader may not find.

      WHY THIS IS THE SAME CLASS AS 806-2r4s. Both are cases where the schema
      cannot express a distinction the fleet needs, so the distinction survives
      only as prose and then evaporates. There the missing distinction is
      absent-vs-unreachable; here it is which-host and under-what-conditions.
    verifiable_closure: "a capability document round-trips a host_id, and a measurement carries suite + locus; two documents from different loci are machine-distinguishable without reading any prose"

events:
  - packet_id: accel-probe-reports-none-where-its-own-contract-promises-present-unusable
    event:
      type: note
      ts: "2026-08-17T22:25:00Z"
      agent_id: windows-yolanda-opus5-20260817t2059z
      host: windows
      summary: >
        CORRECTION to 806-2r4s as filed, narrowing it. That packet's deliverable
        said the probe should report "present-unusable with a named
        accel_reason", implying a missing vocabulary. The vocabulary is NOT
        missing: DeviceRecord already carries `usable: bool` and
        `unusable_reason: Option<String>` (accel_probe.rs, DeviceRecord), and
        `lanes: Vec<String>` already distinguishes container from host-native
        reachability. Linux exercises exactly that — it emits a gpu device with
        usable=true and an npu device with usable=false and
        unusable_reason=engine-missing, which is where its
        accel_npu=present-unusable accel_reason=engine-missing envelope line
        comes from. The Windows defect is therefore smaller and more precise
        than filed: the probe EMITS NO DeviceRecord AT ALL for hardware it
        cannot reach. This host's capabilities.json contains exactly one device,
        the cpu, while Windows reports an AMD Radeon 860M and an NPU Compute
        Accelerator Device both at Status=OK. The fix is to emit device records
        for present-but-unreachable hardware with usable=false and a named
        unusable_reason (e.g. wsl2-no-dri-render-node, wsl2-npu-not-exposed) and
        lanes: [] — not to add a vocabulary that already exists. The summary
        line then follows from the records rather than needing its own branch.
        This makes 806-2r4s a prerequisite for the fleet matrix (808-7yrd) for a
        sharper reason than "the row is wrong": a row that omits unreachable
        hardware is not merely incomplete, it is indistinguishable from a row
        for a machine that does not have the hardware at all.
