    context: |
      MEASURED on yoga 2026-10-17 at trunk 0d8678a41: `scripts/run-litmus-test.sh command-policies --phase pre-build --size instant` passed=4 failed=2, identically on the 1760-nn6u ref. Direct runs: scripts/test-command-policy-consent.sh fails arms 2, 3, 3-mismatch and 5 (each eval answers `consent:policy:soft-reset` rc=4 with consent_source null after a token was granted or planted); scripts/test-smoke-skill-reset-env-matches-policy.sh fails arm 2 for both smoke skills the same way.
      Cause, by source and history: 87c7e9bdc (2026-10-01, "refuse invalid seeds at execution doors and preserve inspection consent") made the `policy eval` arm in main.rs call decide_loaded, which never calls resolve_consent; only decide_execution (proc.run, the run verb) spends a token or honours TILLANDSIAS_SKILL/TILLANDSIAS_DESTRUCTIVE_RESET_OK. Both fixtures were last changed 2026-09-28 (854bce299, 589cbc3f0), before it, and still use `policy eval` as the door that spends.
      Host difference, as far as yoga can see it: NOT the host name (uname -n, gethostname and the fixture's HOST agree), NOT the host kind (no /run/.containerenv, TILLANDSIAS_HOST_KIND unset, read as bare metal with no disagreement), and NOT a stale binary here (resolve_plan_binary gives target/release with build-id = source-revision 1845cefd, built from a tree containing 87c7e9bdc). By source the arms should be red on every bare-metal host running a current binary, so macuahuitl's green full gate most likely either did not execute these two steps (diff scope / not-run) or resolved an older plan binary. Unmeasured on macuahuitl.
