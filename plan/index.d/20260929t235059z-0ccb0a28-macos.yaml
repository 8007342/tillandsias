        WIRE COMPATIBILITY (the coordinator's question; work/1503-qrgz @ 6dc8d0140). WIRE_VERSION UNCHANGED. Why a trailing variant is safe, from source: derive_psk binds "v={build_version};wire={wire_version};hop" into the key, and the host's side of the host-guest hop is channel_psk_for_guest(SHA-256 of the guest binary shipped with THIS tray build). So tray and guest from different builds fail the handshake closed. (a) NEW tray, OLD guest: the handshake fails, so discriminant 36 is never sent to a guest that does not know it. The send path is time-bounded at every step (connect 5 s; handshake 5 s, added at a4350154c because it was the one unbounded step; reply 5 s) with NO retry: one logged failure per wake. (b) OLD tray, NEW guest: cannot handshake either. Layer 2 ships in the tray's provisioning user-data, so it reaches only guests PROVISIONED by the new tray; an already-provisioned guest keeps "makestep 1.0 3" until reprovisioned, and layer 1 covers it at once. No live mixed-version pair was run; this is source plus construction. The latent SetVsockForwardTarget request/reply mismatch is filed separately as 1509-kf4d.
