    title: |
      The smoke's agent-turn check matched SMOKE-AGENT-OK inside a sentence that refused to print it.
    context: |
      Measured in the v56.11.24.1 smoke on lenovinha (plan/issues/smoke-e2e-findings-v56.11.24.1-2026-11-25-linux-immutable-lenovinha.md): the credential check answered blocked, the agent wrote that it could not append the token because the string attests success, and grep -q SMOKE-AGENT-OK passed on that sentence (agent_turn=answered).
      Three places carry the grep: run_smoke.sh and both smoke skills. The prompt also invited the refusal: it never says that the token reports the turn and not the check, so a strict check alone would turn every credential-blocked smoke red.
    exit_criteria:
      - "the three checks accept the token only as a whole line; the recorded refusal sentence, a token in backticks inside a sentence and a missing token are each refused by the same expression read out of the live files"
