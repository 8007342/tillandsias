        THE JOIN IS BY CONTENT HASH, NEVER BY POSITION. chunks.jsonl and
        vectors.jsonl are line-aligned, and the existing per-batch arity check
        exists because "a shifted index answers plausibly and wrongly". A delta
        that paired reused vectors positionally would reproduce that shift
        WHILE PASSING that check, since every batch it does embed is the right
        size. Reuse is therefore keyed on each chunk's own content_hash, and a
        prior generation is read only after its own arity is verified.

        THAT IS STILL NOT ENOUGH, which is the packet's actual point: none of
        the arity checks can see a source generation that was ALREADY
        mis-joined, because the counts are right and the bytes are opaque. So
        the assembled index is spot-checked by RE-EMBEDDING a deterministic
        sample of reused chunks and comparing bytes to what the cache handed
        over. Deterministic (first N reused) rather than random so a control
        can target a sampled row.

        NEGATIVE CONTROL, run twice — once before the arity fix below and once
        after, because I changed the guard's input path and an unre-run control
        is not a control. Swapping two lines of a prior generation's
        vectors.jsonl leaves arity PERFECTLY intact (20963/20963) and is
        invisible to every pre-existing check. The identity assertion refuses:

          blocked:spec-index:delta-identity-mismatch-at-chunk-1
          rc=1

        Restored, it builds green at reused=20960, identity-verified=5.

        AND I NEARLY SHIPPED IT SILENTLY DEGRADED. The first live run reported
        `reused=0` while the scratch-volume runs reused 20,962. Rather than
        accept that as a corpus property I measured the hash overlap between
        generations: 19,720 of 19,850 (99.3%) were reusable and NONE were being
        reused. Cause: the cache loop called `_entry_complete`, which compares
        a directory's vector count against $n_chunks — the CURRENT corpus size.
        That is correct for validating THIS build's entry and wrong for a prior
        generation: the moment the corpus grew by one chunk every older
        generation was rejected. Fixed to compare each generation against its
        OWN chunk count.

        That failure mode deserves naming because it is the quiet one: the
        feature was present, wired, gated and green, and did nothing. A delta
        that reports reused=0 looks exactly like a corpus with no reusable
        content, and the only thing separating those two readings was measuring
        the overlap.

