  pickup_role: any
  capability_tags: [mcp, approval, licence, forge, tray]
  size: L
  implementer_tier: sonnet
  estimated_hours: 8
  title: No MCP approval tool exists, so a forge agent cannot get a licence acknowledgement signed without the operator moving bytes by hand
  context: >-
    OPERATOR-REPORTED 2026-11-14, high priority. Licence acknowledgement signing (skill
    .claude/skills/accept-licence) on macOS: the statement goes INTO the Mac by a typed
    heredoc; the allowed-signers line from `tillandsias-tray --approval-enrol <slug>` and the
    armored SSHSIG from `--approval-sign <slug> <file>` must come OUT by copying text off the
    screen into a forge inside tillandsias-vm. The Mac and the forge share no folder, and the
    text cannot be copied from the screen at all. There is NO MCP tool for approvals (grep for
    "approval." in the MCP tool tables finds none), so the skill promises a flow no tool
    implements. Code: crates/tillandsias-macos-tray/src/approval_signer.rs (enrol_main,
    sign_main), main.rs (--approval-enrol/--approval-sign);
    crates/tillandsias-headless/src/licence_consent.rs (Acknowledgement, statement_text,
    project_acknowledgement_dir, admits_restricted); crates/tillandsias-headless/src/approval.rs.
    SPLIT: this packet is the MCP plumbing and record flow (any host; the signer is a trait
    with a stub). Sibling packets: 2022-89hm (macOS Touch ID signer behind it) and 2022-hn2k
    (cross-host allowed-signers propagation).
    HEADLINE REQUIREMENT (operator UX ruling 2026-11-14, verbatim): "I should tell the agent
    as vaguely as I fucking can 'yo lets accept depry and herpy licenses, duh' and the agents
    prompt should give me all the acknowledgeables in a prompt window, for me to read and scroll
    to the bottom, press touch id, and closes the window. A user who barely understands their
    phone would never run this kind of flow." Vague intent in, resolved licences out; ONE native
    window per request listing every acknowledgeable; zero terminal, zero paste, zero copy; the
    acceptance test is a non-technical user.
  exit_criteria:
  - 'HEADLINE, END-TO-END ON A REAL HOST, NON-TECHNICAL USER: the transcript of one run shows EXACTLY ONE user utterance (vague, e.g. "yo lets accept depry and herpy licenses, duh") and EXACTLY ONE biometric touch, and ends with verified records committed in the project. A transcript with a second user message, any user-typed id/slug/scope/use/expiry, a terminal, a heredoc, a paste or a copied line FAILS. Today this fails at the first step: no tool exists.'
  - 'Vague intent in, resolved licences out: the agent maps fuzzy names ("depry and herpy", "the music stuff", "everything demon attack needs") to register rows itself, by fuzzy and semantic match plus the project pending licence_acknowledgement_required refusals, and proposes defaults from policy (non-sale, one year; standing only where the policy allows). Test: given the register and a fuzzy phrase, the resolved row set equals the expected set; an unresolvable phrase yields one plain-words question to the user, never an id prompt.'
  - 'ONE native window per request lists EVERY acknowledgeable in the batch (possibly several licences): each licence verbatim clauses, the artefacts, and the scope and use in plain words. The approve control is DISABLED until the user has scrolled to the bottom (test: approve is inert at scroll offset 0 and live at the end; a window too short to scroll enables on first full view). One biometric (Touch ID, Windows Hello or polkit) signs ALL licences in the batch, then the window closes. Cancel or close signs nothing and writes nothing. A run that opens one window per licence FAILS.'
  - 'Zero terminal, zero paste, zero copy: per-repo key enrolment happens silently inside the same flow; the agent receives the records over MCP and commits them; nothing is printed that anyone is asked to transcribe.'
  - 'A forge MCP tool (licence.acknowledge, or approval.sign) exists and is listed by tools/list. It takes the project and a BATCH of resolved licence row ids with proposed scope/use/expiry defaults. Today it does not exist, so a test that calls it fails with unknown tool.'
  - 'The host side builds the canonical statement itself via Acknowledgement::statement_text from the row id and parameters; the agent supplies no statement text, so an agent cannot get arbitrary text signed. Test: a call carrying extra statement bytes is refused or the bytes are ignored and absent from the signed payload.'
  - 'The host shows the licence clauses verbatim in a native dialog before signing; a refusal or timeout returns a typed denial and writes nothing (no record, no allowed_signers line).'
  - 'On approval the host enrols the per-repo key if absent, appends its allowed-signers line to the host allowed_signers, writes the record into project_acknowledgement_dir(<project>), and returns the record YAML in the MCP result; admits_restricted then returns true for that project and row on that host, and returned false before the call.'
  - 'END-TO-END on a real host: an agent in a forge obtains a record that `ssh-keygen -Y verify` passes, and the operator typed nothing and copied nothing, only the OS approval gesture. A run whose transcript shows a heredoc, a paste or a copied signature line FAILS this criterion.'
  - 'The accept-licence SKILL.md carries no manual enrol/sign/copy step (this PR already makes it say "not available on this host yet; tell the user it is coming"); when the tool ships, the "NOT AVAILABLE" status section is replaced by the tool call, and no step asks the user to move text.'
  verifiable_closure: 'Transcript of an agent in a forge calling the MCP tool on a real host, the OS approval gesture being the only operator action, followed by ssh-keygen -Y verify output and admits_restricted true. Plus the cargo test for the tool contract.'
  unscoreable: 'none.'
  next_action: 'Read crates/tillandsias-headless/src/approval.rs and how existing MCP tools reach a host-side dialog (the tray-hosted dialogs), then add the tool with a Signer trait; leave Linux a typed unsupported unless 2022-hn2k has landed a Linux signer.'
