- packet_id: macos-tray-signs-licence-approvals-with-touch-id-in-process-for-the-mcp-tool-with-no-cli-copy-step
  order: 2022-89hm
  status: ready
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: macos
  capability_tags: [macos, touch-id, approval, tray, secure-enclave]
  size: M
  implementer_tier: sonnet
  estimated_hours: 6
  title: macOS tray approval signer is reachable only by CLI flags that print to the screen; make it an in-process signer behind the MCP tool
  context: >-
    OPERATOR-REPORTED 2026-11-14 (see 2022-ygqj for the verbatim words). On macOS the signer
    exists only as `tillandsias-tray --approval-enrol <slug>` and `--approval-sign <slug> <file>`
    (crates/tillandsias-macos-tray/src/approval_signer.rs enrol_main, sign_main; main.rs) which
    print the allowed-signers line and the armored SSHSIG to the terminal for the operator to
    copy into a forge. The forge is inside tillandsias-vm and shares no folder with the Mac.
    Needed: the same enrol and sign as an in-process Signer the tray calls when the MCP tool of
    2022-ygqj arrives over the host channel, with the native clause dialog and Touch ID, and the
    result returned over that channel, never printed. Depends on 2022-ygqj for the tool
    contract (blocked on its Signer trait, not on its end-to-end).
    UX RULING 2026-11-14 (see 2022-ygqj): one native window per request listing every
    acknowledgeable, approve disabled until scrolled to the bottom, one Touch ID, window closes;
    a user who barely understands their phone must be able to run it.
  exit_criteria:
  - 'HEADLINE, real Mac, non-technical user: one user utterance and one Touch ID touch produce verified records for the whole batch; a transcript with a terminal, paste, copy or a second prompt FAILS. Today only the CLI flags exist, which fail this by construction.'
  - 'ONE native window per request (not per licence) lists every licence in the batch with verbatim clauses, artefacts, and scope and use in plain words; the approve button is disabled until the scroll view reaches the bottom; a single Touch ID signs every statement in the batch; the window then closes; cancel signs nothing and does not touch the key.'
  - 'With the tray running, an MCP approval call from a forge shows that window and returns the signed records. Today no call path exists.'
  - 'Enrol for a new project slug happens inside the same call (no separate --approval-enrol step); the allowed-signers line is returned in the result and installed in the host allowed_signers.'
  - 'Nothing is printed for the operator to copy: stdout and the dialog carry no signature or key text the operator is asked to transcribe. A run needing a clipboard FAILS.'
  - 'Cancelling Touch ID or the dialog yields a typed denial and no key use; the key is not exercised without the biometric (verified on a real Mac, not a mocked LAContext).'
  - 'The old --approval-enrol/--approval-sign flags either remain as thin wrappers over the same signer or are removed; there is no second implementation of statement building or signing.'
  verifiable_closure: 'Real-Mac run: forge agent calls the MCP tool, Touch ID is the only operator action, ssh-keygen -Y verify passes on the returned record.'
  unscoreable: 'Needs real Touch ID hardware; a VM or CI run cannot close it.'
  next_action: 'Read approval_signer.rs enrol_main/sign_main and factor the shared core into a function returning values instead of printing, then implement the Signer trait from 2022-ygqj over it.'
  provenance: macuahuitl-fedora 2026-11-14, on operator report; carried skill .claude/skills/accept-licence.
  events:
  - {type: filed, ts: '2026-11-14T22:00:01Z', host: macuahuitl, summary: filed p1 ready}
- packet_id: a-licence-record-signed-on-one-host-must-verify-on-another-so-allowed-signers-lines-travel-with-the-project
  order: 2022-hn2k
  status: ready
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [approval, licence, multi-host, ssh-signature]
  size: M
  implementer_tier: sonnet
  estimated_hours: 5
  title: A licence record signed on the Mac cannot be verified on Linux without a hand-added allowed_signers line
  context: >-
    OPERATOR-REPORTED 2026-11-14 (see 2022-ygqj). This Linux host has NO enrolled approval key,
    and its allowed_signers trusts only the Mac's tillandsias-slug key, so a new per-repo key
    needs a manual line added. PR 1090 did this by hand: a signers file committed in the
    project and pinned by fingerprint. Plan: the MCP result of 2022-ygqj also carries the
    signers line; the agent commits it as a signers file in the project next to the record; a
    verifier on another host trusts a signers line only if its key fingerprint is pinned (in
    the committed record or an operator-controlled pin), never merely because the file is in
    the tree, so a project commit cannot grant itself trust. Also covers the Linux signer
    (polkit or FIDO2) so a Linux host can enrol and sign itself.
    UX RULING 2026-11-14 (see 2022-ygqj): the same one-utterance, one-window, one-touch flow
    must work on Linux with polkit or FIDO2, and propagation must be invisible to the user.
  exit_criteria:
  - 'HEADLINE, Linux host, non-technical user: the transcript of one run shows exactly one user utterance and one polkit or FIDO2 touch, ONE window listing every licence in the batch with approve disabled until scrolled to the bottom, and verified committed records; no terminal, paste or copy. Today this host has no enrolled approval key and no tool, so it fails.'
  - 'Propagation is invisible: the user is never asked to add, paste or fetch a signers line; the agent commits it from the MCP result and the verifying host trusts it by pinned fingerprint.'
  - 'A record signed on the Mac verifies on this Linux host with NO manual edit of the host allowed_signers. Today it fails: the Mac per-repo key is not in this host allowed_signers.'
  - 'The signers line travels as a committed project file pinned by key fingerprint; a signers file whose fingerprint does not match the pin is rejected (negative arm: a commit adding a forged line fails verification).'
  - 'admits_restricted on the Linux host consults the pinned committed signers and returns true for the Mac-signed record and false for the forged one.'
  - 'A Linux host can enrol and sign its own approval (polkit or FIDO2 gesture only), or the packet records the exact capability that is missing as a blocker naming a capability, not a host.'
  verifiable_closure: 'Two-host run: record signed on macOS, verified on Linux via admits_restricted with no manual step, plus the forged-line negative arm.'
  unscoreable: 'none.'
  next_action: 'Read PR 1090 for the hand-built signers file shape and the fingerprint pin, then specify where the pin lives so a project commit cannot self-grant trust.'
  provenance: macuahuitl-fedora 2026-11-14, on operator report; carried skill .claude/skills/accept-licence.
  events:
  - {type: filed, ts: '2026-11-14T22:00:02Z', host: macuahuitl, summary: filed p1 ready}
- packet_id: incident-a-consent-gates-trust-anchor-arrived-by-clipboard-paste-so-allowed-signers-must-be-host-written-only
  order: 2083-nfne
  status: ready
  kind: bug
  priority: p0
  desired_release: v0.5
  pickup_role: any
  capability_tags: [incident, approval, credential, security, licence]
  size: M
  implementer_tier: sonnet
  estimated_hours: 6
  title: INCIDENT 2026-11-14 - the approval key's public key and the SSHSIG reached the forge by clipboard and chat paste, so the consent gate verified against a key delivered by the same paste
  context: >-
    P0 INCIDENT, operator 2026-11-14: "THAT'S EXTREMELY FUCKED UP!!! ... this is the stupidest
    weakest most terrible way in which Tillandsias has ever handled a credential." Demucs
    acknowledgement for demon_attack, signed on the Mac. (1) The tray never showed the clauses;
    the operator saw only a chat paraphrase and the statement was typed in by heredoc. (2) The
    accept-licence skill said `ssh-keygen -Y sign -f <key>` but the real path is
    `tillandsias-tray --approval-enrol/--approval-sign`, documented nowhere forge-side. (3) The
    enrol line and SSHSIG went to stdout only, no MCP result, no drop directory. (4) The PUBLIC
    key and the SSHSIG travelled through the macOS clipboard and a pasted chat message into a
    Claude transcript; no private key left the Secure Enclave, but the trust anchor of a consent
    gate arrived over an unauthenticated channel and the forge verified against a key delivered
    by the same paste. (5) Touch ID was not the end of the flow; pasting came after it. (6) The
    coordinator sent "stop" after the operator had already signed, then "finish". Post-mortem:
    plan/issues/licence-acknowledgement-trust-anchor-pasted-incident-2026-11-14.md. Linked to
    2022-ygqj, 2022-89hm, 2022-hn2k (the tool that removes the paste); this packet is the
    security invariant and must not wait for them. Carried skill .claude/skills/accept-licence.
  exit_criteria:
  - 'allowed_signers lines can only be added by the host own enrol path: a test that appends a pasted or agent-written line (via the file, the approval env override, or any tool the agent can reach) is refused or flagged and the gate does not admit a record verified only against it. Today a hand-added line is trusted, so the test fails.'
  - 'Every allowed_signers line carries host-enrol provenance (written by the enrol path, with a fingerprint the host can re-derive); a line without provenance is flagged unattested and admits_restricted refuses records that verify only against it, with the existing Mac-enrolled slug line handled explicitly (re-enrol or documented grandfather).'
  - 'The accept-licence skill can never instruct a manual or terminal flow: a guard greps the skill for ssh-keygen -Y sign, --approval-enrol, --approval-sign, heredoc and paste/copy instructions and fails if any appears outside a prohibition sentence, with a population assert (it must find the prohibition section). Red on the pre-fix skill, which carried ssh-keygen -Y sign.'
  - 'A post-mortem exists in plan/issues (this PR files it) and its open questions are each answered or filed.'
  - 'The tray displays the licence clauses verbatim before any signature; a chat paraphrase is never the only place clauses are shown (covered end to end by 2022-ygqj).'
  verifiable_closure: 'The refused-line test red on the pre-fix code and green after, the skill guard red on the pre-fix skill and green after, and the post-mortem file present.'
  unscoreable: 'none.'
  next_action: 'Read crates/tillandsias-headless/src/approval.rs for how allowed_signers is read and appended, then write the test that appends a pasted line and show it admitted today before gating it on host-enrol provenance.'
  provenance: macuahuitl-fedora 2026-11-14, from the operator incident report relayed by the coordinator.
  events:
  - {type: filed, ts: '2026-11-14T22:00:03Z', host: macuahuitl, summary: filed p0 ready}
