- packet_id: a-licence-record-signed-on-one-host-must-verify-on-another-so-allowed-signers-lines-travel-with-the-project
  order: 2022-hn2k
  status: ready
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [approval, licence, multi-host, ssh-signature]
  size: M
  implementer_tier: sonnet
  estimated_hours: 5
  title: A licence record signed on the Mac cannot be verified on Linux without a hand-added allowed_signers line
  context: >-
    OPERATOR-REPORTED 2026-11-14 (see 2022-ygqj). This Linux host has NO enrolled approval key,
    and its allowed_signers trusts only the Mac's tillandsias-slug key, so a new per-repo key
    needs a manual line added. PR 1090 did this by hand: a signers file committed in the
    project and pinned by fingerprint. Plan: the MCP result of 2022-ygqj also carries the
    signers line; the agent commits it as a signers file in the project next to the record; a
    verifier on another host trusts a signers line only if its key fingerprint is pinned (in
    the committed record or an operator-controlled pin), never merely because the file is in
    the tree, so a project commit cannot grant itself trust. Also covers the Linux signer
    (polkit or FIDO2) so a Linux host can enrol and sign itself.
  exit_criteria:
  - 'A record signed on the Mac verifies on this Linux host with NO manual edit of the host allowed_signers. Today it fails: the Mac per-repo key is not in this host allowed_signers.'
  - 'The signers line travels as a committed project file pinned by key fingerprint; a signers file whose fingerprint does not match the pin is rejected (negative arm: a commit adding a forged line fails verification).'
  - 'admits_restricted on the Linux host consults the pinned committed signers and returns true for the Mac-signed record and false for the forged one.'
  - 'A Linux host can enrol and sign its own approval (polkit or FIDO2 gesture only), or the packet records the exact capability that is missing as a blocker naming a capability, not a host.'
  verifiable_closure: 'Two-host run: record signed on macOS, verified on Linux via admits_restricted with no manual step, plus the forged-line negative arm.'
  unscoreable: 'none.'
  next_action: 'Read PR 1090 for the hand-built signers file shape and the fingerprint pin, then specify where the pin lives so a project commit cannot self-grant trust.'
  provenance: macuahuitl-fedora 2026-11-14, on operator report; carried skill .claude/skills/accept-licence.
  events:
  - {type: filed, ts: '2026-11-14T22:00:02Z', host: macuahuitl, summary: filed p1 ready}
