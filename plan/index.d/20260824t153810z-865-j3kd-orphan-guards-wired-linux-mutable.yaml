      TWO GUARDS SHIPPED WITH NO CALLER. audit-guard-activation reported
      population=67 active=65 orphan=2, failing ./build.sh --ci-full and forming
      one third of the reason the trunk has been unreleasable for a week.

        check-cycle-scheduler.sh    order 856-s56y, added by yoga 2026-08-23 —
                                    is a durable unattended-cycle scheduler
                                    armed on THIS host, and what did it last do?
        check-dead-env-branches.sh  order 829-dkuc — names TILLANDSIAS_* vars
                                    live code READS that nothing ASSIGNS or
