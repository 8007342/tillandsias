      Both are worth having. Neither could simply be gated, because BOTH FAIL
      TODAY: the scheduler probe returns `due:not-installed` (rc=1) and the
      env-branch detector returns `dead=14` (rc=1). Wiring either into the
      blocking path would have swapped one release blocker for another, which
      is not progress — it is the same wall with a different sign on it.

      NEITHER FINDING IS A RELEASE DEFECT, WHICH IS WHY ADVISORY IS HONEST HERE
      RATHER THAN CONVENIENT. `due:not-installed` is TRUE on macuahuitl: this
      host is driven by an external hourly loop, not a systemd timer, so it is
      differently-scheduled rather than broken. `dead=14` is a burndown list
      that predates the release and does not worsen by shipping.

      THE ONE REPAIR WORSE THAN THE DEFECT. audit-guard-activation finds callers
      by grepping for the guard's NAME across a fixed set of surfaces, so a bare
      mention in any of them flips the verdict to green while leaving the guard
      exactly as dead. That is available, cheap, and wrong — the same shape as
      the wedge record's warning "do NOT `git add` the untracked file to flip
      the verdict — that games the guard". Both guards are now genuinely
      executed.

      NOT DONE, AND NOT MINE: arming an actual scheduler is 856-s56y's own work
      and belongs to yoga, which is blocked. Burning down the 14 dead branches
      is 829-dkuc. This packet makes two shipped guards run; it does not pretend
      their findings are resolved.
    exit_criteria: >
      (1) audit-guard-activation reports orphan=0, verdict=ok.
      (2) Each guard is genuinely EXECUTED by its caller, not named in a comment
      — the auditor cannot tell the difference and a reader must be able to.
      (3) Neither invocation can fail the suite: the advisory wrapper returns 0
      even though the guard returns 1.
      (4) Their findings stay visible in the run output rather than being
      swallowed to make the gate quiet.

