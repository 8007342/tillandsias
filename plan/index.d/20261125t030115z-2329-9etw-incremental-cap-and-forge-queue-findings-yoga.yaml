  - packet_id: a-forge-queue-job-runs-with-the-forges-environment-and-host-kind
    order: "2329-at6p"
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [forge, queue, environment]
    estimated_hours: 4
    title: "a job started by queue.submit in a forge runs without the forge's env vars, and is audited as bare-metal"
    context: |
      Reported by pirria (CPU-only forge, build 56.11.23.1), relayed by the coordinator; not reproduced by the filer. The job lacks
      about 64 of the forge's env vars, among them CARGO_TARGET_DIR, RUSTUP_HOME, TMPDIR and TILLANDSIAS_HOST_KIND. It gets
      CARGO_HOME=/usr/local/cargo, which is unwritable, so a cargo step fails rc 101 (pirria reproduced that on one step). The audit
      records host_kind=bare-metal inside a forge. The runner counts could-not-run as fail.
    exit_criteria:
      - "A job submitted in a forge sees the forge's CARGO_TARGET_DIR, RUSTUP_HOME, TMPDIR and TILLANDSIAS_HOST_KIND and a writable CARGO_HOME. Pre-fix result: FAILS."
      - "Its audit record says host_kind=forge."
      - "NEGATIVE CONTROL: a credential variable is not added to a job's environment by the fix."
      - "A could-not-run step is reported apart from a failed one."
    next_action: "needs a host that can run the forge's queue tools (queue.submit)"
    unscoreable: "unpinnable-until-the-guard-exists: needs a forge run"
    provenance: "coordinator macuahuitl-fedora 2026-11-25, from pirria"
