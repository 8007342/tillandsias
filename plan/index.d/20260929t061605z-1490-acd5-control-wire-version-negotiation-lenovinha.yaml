    title: |
      Hello/HelloAck carry wire_version_min and negotiate the highest common version inside a declared window; a disjoint peer is refused as refused:wire:incompatible with the drain-then-swap remedy; the two fixtures hard-coding wire_version 2 use the constant
    context: |
      WIRE_VERSION = 4 (crates/tillandsias-control-wire/src/lib.rs:86). A
      mismatch closes the stream on every side: the guest server
      (crates/tillandsias-headless/src/vsock_server.rs:949, "rejecting vsock
      client with mismatched wire version"), the macOS bridge
      (crates/tillandsias-macos-tray/src/pty_vsock_bridge.rs:229) and the
      Windows client (crates/tillandsias-host-shell/src/vsock_client.rs:182).
      build_version is carried (lib.rs:400,408) but never enforced.
      control_dispatch.rs:268 and :618 send wire_version: 2 as literals, so a
      fixture can disagree with the wire without any test noticing. With a hot
      guest/host upgrade one side is always briefly newer; the wire needs a
      window, not an equality. Design D4; spec delta vsock-transport MODIFIED
      "Framing and handshake are identical to the Unix-socket transport".
    exit_criteria:
      - 'peers offering [3,5] and [4,4] connect at version 4 (pre-fix: any inequality is fatal)'
      - 'peers offering [5,6] and [2,4] are refused with refused:wire:incompatible:[2,4]:[5,6] before HelloAck and no further envelope is sent'
      - 'grep -n "wire_version: 2" crates/tillandsias-headless/src/control_dispatch.rs finds nothing (pre-fix: two hits at :268 and :618)'
    verifiable_closure: |
