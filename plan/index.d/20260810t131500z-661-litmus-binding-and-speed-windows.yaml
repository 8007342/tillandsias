    order: 661-2wsz
    status: completed
    desired_release: v0.5
    priority: p2
    title: "freshness-inventory.sh spawned one grep per candidate — 126.8s on Windows, blowing its own litmus timeouts"
    kind: optimization
    deliverable: scripts/freshness-inventory.sh
    depends_on: []
    pickup_role: windows
    capability_tags: [performance, litmus, cross-platform, freshness]
    context: >
      Found by binding two unbound litmus files (660-* reconciliation) and then
      actually RUNNING the suite on Windows for the first time.

      litmus:freshness-inventory-shape FAILED at step 2 — a PRE-EXISTING step,
      not one of the three added in cycle 3 — with a 15s timeout. Measured on
      this host: the full run took 126,817 ms and even the two-line header took
      23,250 ms.

      Cause: the scan ran `grep -m1` against every candidate — 1026 process
      spawns. On Linux that is cheap enough to go unnoticed; on Windows, process
      creation is expensive and it dominates. The test was failing for a HOST
      PERFORMANCE reason with nothing wrong in its behaviour, and it had been
      failing invisibly because nobody had run the suite here.
    outcome: >
      One `grep -lE` pass now names the files that carry a stamp; only those are
      parsed individually. 1026 spawns -> 1 + 8, because 1018 of 1026 candidates
      are unstamped and every one of those spawns was asking a question whose
      answer was "no".

      MEASURED: 126,817 ms -> 4,710 ms, a 27x speedup, with byte-identical
      output (1026 components, 8 stamped, 1018 unstamped, same stamp and
      unstamped line counts).

      Semantics unchanged by construction: a file absent from the single-pass
      list has no matching line, which is exactly the old empty `grep -m1`
      result; a file present is parsed with the same expression and the same
      first-match-wins rule.

      litmus:freshness-inventory-shape now passes 7/7 on Windows — including the
      three steps added in cycle 3 (next-target grammar, ANTI-STARVATION,
      REPRODUCIBLE), which had never executed anywhere before today.
    verifiable_closure: >
      litmus:freshness-inventory-shape passes 7/7 on Windows; the report's
      component/stamped/unstamped counts are unchanged.
    events:
      - ts: "2026-08-10T13:15:00Z"
        event: completed
        summary: Found by running a newly-bound litmus suite on Windows for the first time.

