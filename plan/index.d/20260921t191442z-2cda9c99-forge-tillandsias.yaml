          b3f5d0f37 plan(unknown):    1 fragment(s) to linux-next … 108373d5-forge-tillandsias

        Every `unknown` is a forge push; every named one is a bare-metal push. The
        FRAGMENT FILENAMES in those same subjects carry `forge-tillandsias` correctly,
        because the plan tool takes the host from `--host`, which the agent passes from
        `scripts/agent-identity.sh`. So within one commit subject the host is present in
        the payload and absent in the attribution — the information was never missing on
        this host, only the one lookup each script uses.

        WHY THIS CHANGES THE ROW'S SHAPE. Filed against one script, the fix is a
        one-line fallback in that script. Two scripts sharing the failure makes it a
        RESOLVER, and a third will be written the same way unless there is one place to
        call. The `next_action` already says not to swap `hostname` for `uname -n`
        because that repeats the single-source assumption; this strengthens that into a
        positive requirement: ONE resolver, used by both, ending in a refusal rather
        than a placeholder.

