      - "forge-gitdir-staging-chown step 7 fails on error[E0425] enforce_ca_key_mode, cfg(unix) at main.rs:2832 called ungated at main.rs:3233"
      - "forge-upstream-auth-gate step 6 A/B: pre-change and post-change both `rc=1 out=missing:no-credential-channel` — pre-existing, not a 828-k3mq regression"
