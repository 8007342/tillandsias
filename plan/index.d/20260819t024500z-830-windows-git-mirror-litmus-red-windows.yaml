    title: "six of twenty executed git-mirror-service pre-build litmus tests are red-by-default on windows at HEAD for host-environment reasons, so the suite's FAIL verdict cannot distinguish a real regression from the standing baseline"
    deliverable: "each of the six is either fixed to be host-portable or explicitly marked as not-executable on windows, so a windows agent running the suite gets a verdict that means something; plus the baseline recorded so the next reader does not re-derive it"
    pickup_role: windows
