    title: |
      Claude forge workers share one config dir, so concurrent delegated Claude runs on a host are gated to sequential until the credential and approvals writers follow CLAUDE_CONFIG_DIR
    context: |
      Order 539 made the Claude lane delegable (claude --print under TILLANDSIAS_AGENT_RESULT_FORMAT=json). Its criterion 5 asked for concurrent-worker safety proven or explicitly gated; it is GATED, and the reason is stated on forge_worker_state_env in crates/tillandsias-headless/src/main.rs: that function emits CODEX_HOME and XDG_DATA_HOME/XDG_STATE_HOME per worker but nothing for Claude. claude reads CLAUDE_CONFIG_DIR (default ~/.claude) for config AND .credentials.json; the forge's OAuth restore (provider-oauth-vault, TILLANDSIAS_CLAUDE_AUTH_FILE defaults to $HOME/.claude/.credentials.json) and the approvals harvester (claude-approvals-vault, launched from entrypoint-forge-claude.sh) both write that default location. Redirecting the dir per worker without moving both writers starts a worker with no credential and harvests nothing.
      The gate today is a statement in code and in openspec/specs/forge-as-only-runtime/spec.md, not a refusal: no dispatcher launches concurrent Claude workers yet, so nothing can trip it.
    exit_criteria:
      - 'forge_worker_state_env emits a per-worker CLAUDE_CONFIG_DIR (and the matching TILLANDSIAS_CLAUDE_AUTH_FILE) when an instance is set, and provider-oauth-vault restore plus claude-approvals-vault watch read and write under that directory'
      - 'two delegated Claude workers with distinct TILLANDSIAS_FORGE_INSTANCE values each restore their own credential and harvest their own approvals, shown by a fixture that runs both writers against two scratch config dirs with no cross-write'
      - 'the sequential-only statement on forge_worker_state_env and in the forge-as-only-runtime spec is replaced by the isolation it describes, in the same change'
    unscoreable: "the two-worker fixture is the evidence; a single-worker launch stays byte-identical"
