  estimated_hours: 4
  title: A cold cloud launch starts the forge clone before the mirror has a resolvable HEAD
  context: 'Measured on macOS 2026-10-28 (local build v56.10.20.1, cold VM, guest boot c660e7fb). The launch ran tillandsias-headless --cloud 8007342/tillandsias --opencode. The git container started at 18:24:41. The forge began cloning git://git-…/tillandsias at 18:25:04, but the mirror''s first seed attempt only ran at 18:25:17. The clone got an empty repository 12 times, then FATAL "unborn-HEAD mirror". wait_for_git_mirror_ready should block while git rev-parse --verify HEAD fails, so the gate was either skipped or passed wrongly. No "waiting for git mirror" line was printed.'
  exit_criteria:
  - 'A fixture reproduces a launch whose mirror HEAD is unresolvable and asserts that no forge clone is attempted before the gate passes; it FAILS on today''s code.'
  - 'A cold cloud launch on macOS waits for the seed or refuses with the mirror''s own seed failure, and never clones an empty mirror.'
  verifiable_closure: 'cargo test -p tillandsias-headless --features tray,listen-vsock cloud_launch_waits_for_mirror_head'
  next_action: 'Trace why the gate did not hold on the cloud path, write the failing fixture, then fix.'
  provenance: 'Live cold repro by macbookair-macos 2026-10-28; assigned by macuahuitl-fedora.'
  events:
  - type: filed
    ts: '2026-10-28T18:30:16Z'
    host: tlatoanis-macbook-air
    summary: filed and claimed from a live cold repro (forge cloned before the mirror seeded)
- packet_id: mirror-seed-fetch-hits-a-proxy-503-on-a-cold-enclave
