  estimated_hours: 3
  title: On a cold enclave the mirror's seed fetch gets a proxy 503 for github.com and is not retried
  context: 'Platform-neutral. Seen on macOS 2026-10-28, cold VM, boot c660e7fb. The seed ran 36 s after the git container started. git said "unable to access https://github.com/8007342/tillandsias.git/: TLS connect error: wrong version number". Squid logged "NONE_NONE/200 CONNECT github.com:443" followed by "TCP_TUNNEL/503 CONNECT github.com:443 HIER_NONE", which points at egress or DNS not being ready yet. The mirror then published upstream-auth/error/no-local-heads. Check whether images/git/entrypoint.sh retries the seed with backoff or fails once.'
  exit_criteria:
  - 'The cause of the 503 is named (egress or DNS readiness, or something else) with evidence.'
  - 'The seed fetch retries a transport failure with bounded backoff, and a fixture that fails once and then succeeds ends with seeded heads; it FAILS on today''s code if the seed is single-shot.'
  verifiable_closure: 'A litmus step runs the seed against an upstream that fails once and asserts that refs/heads exist afterwards.'
  unscoreable: 'unpinnable-until-the-guard-exists: the retry litmus (future litmus-git-mirror-seed-retries-transport-failure.yaml) lands with the fix (1136-n8sh).

    '
  next_action: 'Read the seed path in images/git/entrypoint.sh for retry behaviour; reproduce the 503 on a cold enclave.'
  provenance: 'Live cold repro by macbookair-macos 2026-10-28; filed per macuahuitl-fedora.'
  events:
  - type: filed
    ts: '2026-10-28T18:30:16Z'
    host: tlatoanis-macbook-air
    summary: filed ready (cold-enclave proxy 503 on the mirror seed)
