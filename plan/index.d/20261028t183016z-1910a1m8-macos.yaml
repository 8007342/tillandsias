  title: The Cloudflare OAuth client refuses the device grant, so sign-in falls back to pasting a URL
  context: 'Cloudflare discovery lists urn:ietf:params:oauth:grant-type:device_code (endpoint https://dash.cloudflare.com/oauth2/device/auth). A device-authorization request for client d9d13037… returned 400 invalid_grant: "The requested OAuth 2.0 Client does not have the urn:ietf:params:oauth:grant-type:device_code grant." The login therefore falls back to the relay paste flow, which the operator called an unacceptable flow for a user (2026-10-28). The code already prefers the device grant (1758-wdvf), so the fix is enabling that grant on the operator''s own Cloudflare OAuth app.'
  exit_criteria:
  - 'The operator enables the device_code grant on the Tillandsias OAuth client.'
  - 'A --cloudflare-login run shows a code and a link and needs no pasted URL.'
  verifiable_closure: 'A device-authorization POST for the client returns a device_code instead of invalid_grant.'
  unscoreable: 'operator-action: a dashboard setting on the operator''s account; nothing in the repo to pin.

    '
  blocked_by: operator
  next_action: 'Held for the operator; macuahuitl-fedora queues the dashboard toggle.'
