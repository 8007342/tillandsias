    title: |
      The macOS reset plan says "no share in the Keychain, so the next init re-initialises it" while the share sits on the identity disk and the store is kept
    context: |
      MEASURED 2026-10-13 22:41Z, v56.10.13.1 install on tlatoanis-macbook-air (setup.log): the installer's SOFT reset printed "the Vault store inside the guest — Absent:REINIT-AT-INIT, kept by this reset, but no share is in the Keychain, so the next init re-initialises it". The login keychain did lack vault-shamir-share-v1 and vault-root-token-v1, but the guest did NOT reinitialise: since 1642-cc54 the share fallback lives on the store root (the identity disk), and 1658-6ca6 consults it. The store was kept and the GitHub sign-in survived the install, a kill -9 and an unclean-stop rebuild (0 WIPING lines). The REBUILD plan at 22:42:31Z then listed "keychain: vault-shamir-share-v1" and "keychain: vault-root-token-v1" under WILL BE PRESERVED, though neither item exists.
      Both messages are written from the host keychain alone. Their prediction is wrong in the reassuring direction today, but a reset plan the operator can't trust is the 803-49re failure in another form.
    exit_criteria:
      - 'the reset disposition accounts for the identity-disk share: with the share only on the identity disk it reports the store as kept with its share, never REINIT-AT-INIT (a test, red at 8a00d2583)'
      - 'WILL BE PRESERVED lists a keychain item only when it exists; a test with an empty scratch keychain service lists neither share item'
      - 'NEGATIVE CONTROL: with no share anywhere (keychain empty, no identity-disk record), the disposition still reports REINIT-AT-INIT'
    unscoreable: "operator-facing reset wording, pinned by disposition tests with and without the identity-disk share"
