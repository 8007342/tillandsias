    event:
      type: note
      ts: "2026-08-26T00:18:23Z"
      agent_id: linux-calmecacpilli-opus5-metaorch-20260825t223536z
      host: linux_immutable
      summary: |
        THE LANE ADVICE HAS A REGIME AND I STATED IT WITHOUT ONE. Recording that
        here because the lane is this packet's subject and the correction is
        load-bearing for anyone who reads the earlier note as a rule.

        WHAT I SAID, and macuahuitl relayed to four hosts as a free win: a stale
        fetch disqualifies the lane (`remote base <sha> is not present locally`),
        so fetch immediately before pushing and it qualifies.

        MEASURED by me, on calmecacpilli (gate 1.8-2.0 min): true here. Fetching
        late minimises the staleness window and the lane accepts.

        MEASURED by yolanda, on a 276.5s gate (n=20): FALSE there, and actively
        harmful. Three lost races at 429s, 442s and 453s, each paying a merge plus
        a full re-gate. What finally landed their push was gating and pushing with
        NO fetch in between.

        THE MECHANISM, and it is sharper than "fetch early or late" — **there are
        TWO acceptance paths and they have OPPOSITE preconditions**:

          THE LANE  needs the remote base present locally, i.e. a FRESH fetch
                    (pre-push-local-gate.sh, the `git cat-file -e "$remote_sha"`
                    qualification test).
          THE STAMP needs the tree UNCHANGED since ./build.sh --check passed, and
                    a fetch+rebase changes the tree and voids it.

        So fetching buys the lane and costs the stamp; not fetching keeps the stamp
        and forfeits the lane. **They are mutually exclusive, and which one you
        should aim for is decided by your gate duration, not by preference.** A
        host whose gate is cheap re-gates freely and should chase the lane; a host
        whose gate costs 4.6 minutes cannot afford to void a stamp it already holds
        and should protect it instead. The crossover sits roughly where gate
        duration exceeds the contention interval — about 3 minutes during tonight's
        release burst.

        ONE CAVEAT ON THE SLOW-HOST RULE, so nobody reads it as stronger than it
        is: not fetching does not make a moved remote go away. If trunk actually
        advanced, the push is rejected as non-fast-forward regardless of the stamp.
        What the slow-host discipline buys is a SHORTER interval between gate-end
        and push — it narrows the window rather than closing it. Stated as "gate
        against your last fetch and push without re-fetching", it is a
        variance-reduction move, not a guarantee.

        A SECOND-ORDER PROBLEM THIS PACKET SHOULD NAME RATHER THAN FIX. The
        pre_push_gate rule requires a platform-branch host to merge
        origin/linux-next before pushing, and **that merge imports non-plan paths**
        — yolanda's refusal named `scripts/check-credential-channel.sh`, a file
        they never touched. So a plan-only commit stops qualifying for the lane the
        moment its host satisfies the merge rule, and the two rules compose into a
        treadmill: merge to satisfy the gate, lose the lane, pay the full gate, lose
        the race while paying it, merge again.

        **The widening this packet landed helps the common case and does not touch
        that one.** The lane is structurally unavailable to any host that must merge
        before pushing, which by the pre_push_gate rule is every platform-branch
        host. Recorded so the next reader does not assume the lane is available
        whenever the PATHS qualify — path eligibility is necessary and not
        sufficient.

        PROVENANCE, since this note exists because provenance failed: the fast-side
        numbers are mine, measured here. The slow-side numbers are yolanda's,
        REPORTED to me through macuahuitl and not verified by me. macuahuitl
        broadcast my one-host measurement as a general rule and corrected it
        themselves when yolanda's host inverted it — which is the second
        over-generalisation of the night from the same relay position, and the
        reason the regime belongs in the record rather than in a message.
