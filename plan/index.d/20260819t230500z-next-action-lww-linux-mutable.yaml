      summary: |
        next_action IS LWW, AND THAT IS A HAZARD THE DESIGN DID NOT ACCOUNT FOR.
        Found by using it twice on one row, twenty minutes apart.

        The first write carried the archiver blocker: do not run
        archive-plan-packets.sh, it removes two READY rows. The second carried
        the revised cadence decision. The second SILENTLY REPLACED the first —
        set-field prints `old -> new` and exits 0, and the `next:` line an agent
        reads at cold start showed only the cadence note.

        THAT IS THE DANGEROUS DIRECTION. The lost clause was a DO-NOT-RUN
        warning about a tool that corrupts the ledger. An agent reading the
        surviving next_action would have found a cadence instruction and no
        reason not to run the thing the cadence is about. Restored by hand,
        blocker first.

        WHY THE DESIGN MISSED IT: next_action was picked as the carry-forward
        artifact because a reader in the cold-start path already prints it
        (answer.rs:1664) and its population could be non-empty. Both true. But
        it is ONE scalar under LWW, and a packet can accumulate SEVERAL distinct
        carry-forwards — a blocker, a decision, a next step — from different
        cycles. The chosen artifact holds exactly one.

        THIS IS NOT AN ARGUMENT FOR A NEW FIELD, and adding one would repeat the
        mistake the design already rejected (a third object with no reader). It
        is an argument that the RECONCILER, not the writer, is where this
        belongs — consistent with the operator's convergent-not-stable ruling.
        The events log already holds every carry-forward ever written; only the
        LWW projection loses them. So the sweep should RECOMPUTE next_action
        from the row's events rather than trusting the last writer to have
        merged by hand, exactly as it recomputes anything else it reconciles.

        Until that exists the working discipline is: READ THE EXISTING
        next_action BEFORE SETTING IT, and carry forward what still applies,
        blocker clauses first. I did not do that, which is how this was found.
