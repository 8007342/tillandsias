      absent on MSYS — counted on the shared error text, NOT individually
      reproduced (esme flagged that; verify each before fixing). (3) CRLF:
      salvage-net-roundtrip step 9 grades git's CRLF warning as the verdict
      AT rc=0 (a command that succeeded, scored red because stderr was
      compared against an ok: token); one more arm the same way; and
      plan-answer-envelope-citability 6/21 — jq emits CRLF on MSYS and \r is
      not in the default IFS, so word-splitting leaves it on every field but
      the last (item 1 len=68 ending \r, the same id assigned directly len=67
