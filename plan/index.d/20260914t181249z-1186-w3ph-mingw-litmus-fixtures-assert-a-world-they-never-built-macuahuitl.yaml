      build.sh; the AT-RISK identity probe re-executed inside the same log:
      PROBE_COMMIT_RC=128, TIER unset). By mechanism, from the two reports
      in owned_files: (1) credential-channel-check-shape 8/10 pins
      `env PATH=/usr/bin:/bin`; MINGW keeps git only at /mingw64/bin —
