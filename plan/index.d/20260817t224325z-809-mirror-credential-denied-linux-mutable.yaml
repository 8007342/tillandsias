    deliverable: "the mirror publishes refs/tillandsias/upstream-auth/authorized/<epoch> against the real upstream, so the forge credential guard passes and worker drain can push; plus a note recording WHICH failure it was (expired, missing repo write, or unauthorized SSO) so the next occurrence is diagnosable in one step"
    pickup_role: operator
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [git-mirror, vault, credentials, forge, blocker]
    estimated_hours: 2
    context: |
      MEASURED, macuahuitl 2026-08-17T22:43Z, from the persisted mirror volume:

        refs/tillandsias/upstream-auth/denied/1787006049
        epoch = 2026-08-17T22:34:09Z, age 523s at time of reading
        guard freshness bound = 900s (TILLANDSIAS_CRED_AUTH_MAX_AGE)
        refs present = 1 (this is the only verdict in the volume)

      So the verdict is FRESH and it is DENIED. The probe ran, authenticated a
      `git push --dry-run` receive-pack advertisement with the Vault-backed
      credential, and GitHub answered 403. That is exactly the 2026-08-15 state
      order 756-2jnj built the probe to catch, and the probe caught it.

      WHAT THE GUARD WILL SAY when a forge next checks
      (scripts/check-credential-channel.sh, the `denied` branch):
        blocked:upstream-push-unauthorized
        "The mirror is reachable but upstream currently REFUSES its credential
         ... Fix the GitHub credential in Vault (secret/github/token) or its
         repo permission; do NOT import host credentials."
      The remedy is already written; nobody has executed it.

      WHY IT IS INVISIBLE FROM THE HOST, which is why it survived three cycles
      of directives aimed at it: this checkout's own push path is healthy.
      `scripts/check-credential-channel.sh` on the host answers ok:gh-keyring,
      and every push in this session succeeded. The broken credential is the
      MIRROR'S, held in Vault, used only by the enclave — a completely
      different principal. A host that pushes fine tells you nothing about it.

      PICKUP ROLE IS OPERATOR ON PURPOSE. The remedy is a GitHub credential
      with push rights to 8007342/tillandsias, stored in Vault at
      secret/github/token. The guard explicitly forbids the workaround an agent
      would reach for ("do NOT import host credentials"), and rightly — the
      enclave's whole point is that it holds its own credential rather than
      borrowing the operator's session. I am not going to route around a
      boundary the project built deliberately.

      DIAGNOSTIC STILL OWED, and it is small: `denied` does not distinguish an
      EXPIRED token from one lacking repo write from one whose SSO
      authorization lapsed. All three are 403 and all three need different
      operator actions. Recording which, at probe time, would turn a two-hour
      rediscovery into a one-line answer — that is the follow-on this packet's
      second deliverable asks for.
