      summary: |
        THIRD READING OF THE SAME FACT, and the second correction to my own
        filing. Recorded in full because the sequence is the lesson.

          1st (this packet, as filed): "the mirror-service CONTAINER DOES NOT
             EXIST, so no service, no probe, no refs." Inferred from `podman
             ps -a` at one moment.
          2nd (last cycle's note): "the mirror is lane-scoped and the verdict
             is STALE while it is up." Inferred from a forge failure line
             reading `push-failed-upstream-auth-stale`.
          3rd (MEASURED, now): the verdict is 523s old against a 900s bound —
             NOT stale — and its state is `denied`. One ref, epoch
             2026-08-17T22:34:09Z.

        Each reading was more precise and the first two were wrong. The thing
        that finally settled it was reading the ref out of the persisted mirror
        volume instead of reasoning from a symptom string.

        NOTE ON THE SYMPTOM STRING, because it is why reading #2 was wrong: the
        forge reported `MO-FULL: FAIL push-failed-upstream-auth-stale`, and the
        guard's own vocabulary has `blocked:upstream-auth-stale` (verdict too
        old) as a DIFFERENT verdict from `blocked:upstream-push-unauthorized`
        (verdict says denied). I cannot reconstruct which the forge actually
        saw — only one ref survives, so whatever it read at 22:1x is gone.
        Either the forge saw a genuinely old ref that has since been replaced,
        or it mislabeled a denial as staleness. That ambiguity is itself worth
        removing: a failure label that names the wrong condition sends the next
        reader to the probe loop (which is healthy, ticking every 120s against
        a 900s bound) instead of to the credential.

        This packet's own framing is now superseded by 809-w2xy, which states
        the blocker in the terms the evidence supports. Leaving this one open
        for its actual remaining question — how a reader is supposed to tell
        image / container / service / credential apart when any of the four
        produces "no authorized verdict".
