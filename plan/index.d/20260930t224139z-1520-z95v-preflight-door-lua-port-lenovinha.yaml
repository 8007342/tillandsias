      SPLIT FROM 1384-ddua on the coordinator's ruling (macuahuitl, 2026-09-30).
      ddua's arm 3 asked for the door as Lua. The door runs about 228 guards
      concurrently (TILLANDSIAS_PREFLIGHT_JOBS) under per-guard deadlines, and
      the only landed process primitive is 1384-aixy slice 1's proc.run, which
      is synchronous. A preflight.lua on proc.run alone would run the guards
      SERIALLY, and the door would go from about 90 s (lenovinha, 2026-09-30:
      wall=86-88s) to many minutes, with every verdict matching. A SERIAL DOOR
      IS A REGRESSION EVEN WHEN EVERY VERDICT MATCHES, and the accounting
      arms would not catch it. So this row depends on aixy's proc.spawn slice.
      The classifier already lives in one place (1384-bqhy: script_run::classify,
      which the door calls through script classify). This row moves the
      LAUNCHER: setsid probe, group kill, the tenth-second poll, deadline
      accounting. It absorbs 1353-ryhq (the door behaves differently per
      platform: dead on macOS without setsid, deadline skips on Windows, phantom
      refusals on a full forge tmpfs), and says so in its closing event.
