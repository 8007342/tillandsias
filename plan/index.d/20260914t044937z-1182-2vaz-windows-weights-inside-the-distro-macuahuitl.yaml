    title: |
      The keep-models flag (see the sibling row filed the same minute) cannot spare weights on Windows: they live at /root/.cache/tillandsias/models INSIDE the tillandsias distro (806-a4tu), and the Windows reset is `wsl --unregister tillandsias`, which deletes the vhdx wholesale. Keeping models there means a host-side location (under %LOCALAPPDATA%\Tillandsias, mounted into the guest as the models dir, the shape the macOS lane already has with its virtiofs models share) that the reset leaves alone. Until then the flag is a documented no-op on Windows and the runbook says so.
    context: |
      Filed by the coordinator when the operator asked for the keep-models
      flag on every reset (2026-09-14). Linux spares the models already;
      macOS gets the flag in the sibling row; Windows needs the location
      change first. esme measured the Windows smoke's blast radius on
      2026-09-13 (the guest destroyed, tillandsias-build untouched) — the
      models are on the destroyed side. Measurement and closure belong to a
      Windows host; the design decision (where the host-side dir lives and
      how the guest mounts it) should follow the macOS virtiofs share's
      shape rather than invent a second one.
    exit_criteria:
      - 'a seeded model file survives unregister-and-provision byte-identical with the flag set (pre-fix result: FAILS)'
      - 'without the flag the models are destroyed with the distro, as today'
      - 'the runbook names the flag as a no-op until this lands, then as honoured'
