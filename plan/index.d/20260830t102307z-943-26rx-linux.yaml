    title: >
      the LM-04 gate read only plan/index.yaml, so a set-field closure — the
      MANDATED closure method, which writes a fragment — left a completed
      packet reading as live: the gate demanded it stay in the active
      long-running view and refused the push of anyone removing it
    deliverable: scripts/check-long-running-view.sh fragment status overlay + two litmus arms
    context: |
      FOUND while taking 251's LM-04 slice: checking whether the gate yoga
      landed on 2026-08-25 to stop the view's second drift still holds.

      THE BLIND SPOT. `live_orders()` is a single awk pass over
      `plan/index.yaml`, deliberately (the comment says so). But
      `tillandsias-plan set-field <id> status done` writes the LWW status into
      a `plan/index.d/` fragment, and the worker protocol MANDATES that method
      — section 7.2 is explicit that a status must never be hand-authored into
      the base. So between a closure and the next fold, the base is wrong and
      the gate believes it.

      THE WINDOW IS NOT SMALL. Measured 2026-08-30: 321 unfolded fragments
      spanning FOUR DAYS (2026-08-26 to 2026-08-30), 144 of them carrying a
      `field: status` entry.

      BOTH FAILURE DIRECTIONS ARE BAD, AND ONE WAS LIVE. Order 831-ezea
      (`three-horizon-cycle-model-arrival-control-by-routing`) is `completed`
      per the folding reader and was listed in plan/long-running.md as
      `in_progress`. So the view was advertising a closed packet as claimable
      long-running work — the exact DECOY failure the gate exists to prevent
      (2026-08-25: four obsoleted packets listed, twenty live ones absent) —
      and removing the row would have turned the trunk red.

      WHY THE LITMUS DID NOT CATCH IT. All five existing arms supply a fixture
      INDEX, so every one of them tested the base parse and none could reach a
      fragment. The suite pinned membership arithmetic correctly and never
      asked where "live" comes from.
    exit_criteria:
      - >
          a packet closed via set-field reads TERMINAL to the gate while the
          folded base still says ready, pinned by a litmus arm that uses a real
          order rather than a fixture
      - >
          POSITIVE CONTROL in the same suite: a genuinely live packet still
          reads live, so the overlay cannot satisfy the negative by resolving
          everything to terminal — which would empty the view's obligations
          and be worse than the blind spot
      - >
          the overlay only ever REFINES live -> terminal, and a host with no
          usable plan binary degrades to the old base-only answer instead of
          failing the build (a gate that reds when its optional reader is
          absent gets switched off)
    verifiable_closure: >
      litmus:long-running-view-agreement steps 6 and 7, mutation-tested:
      disabling the overlay makes STEP 1 fail on the live tree, demanding
      831-ezea be re-listed as active work.
    events:
      - type: filed
        ts: "2026-08-30T10:35:00Z"
        agent_id: linux-lenovinha-claude-20260830t101428z
        host: linux
        summary: >
