          minted with `tillandsias-plan next-order`.
      - type: progress
        ts: "2026-08-30T10:36:00Z"
        agent_id: linux-lenovinha-claude-20260830t101428z
        host: linux
        summary: >
          Fixed. `apply_fragment_status_overlay` resolves each base-derived
          order through the sanctioned folding reader
          (scripts/plan-binary-probe.sh) and drops the terminal ones. Second,
          smaller fix found while testing: the `[ -z "$live" ]` emptiness guard
          now asks the BASE parse rather than the final set — it exists to
          catch a broken awk pass, and after the overlay those became two
          different conditions, so a tree whose multi_cycle packets are all
          legitimately closed no longer reports
          `blocked:no-multi-cycle-packets-parsed` for a true answer. The stale
          831-ezea row is removed from plan/long-running.md in the same commit
          — the repair the old gate was refusing. Litmus 7/7.
