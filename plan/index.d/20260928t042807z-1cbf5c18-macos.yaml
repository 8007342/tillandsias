    field: context
    value: |-
      Measured by macbookair-macos on 2026-09-28 against unmodified trunk
      392a0c514 while gating work/1443-qwpj; the reds are independent of that
      change. One cause is named: BSD `wc -l` left-pads its count, so a
      string compare against "consumers=4" sees "consumers=       4". The
      other four are unexamined — they may share the cause or not. The
      release tier runs ci-release on every platform, so a darwin red here is
      a red release gate on the Mac, not a cosmetic one.


      [2026-09-28T03:50:43Z macos] CORRECTION (macbookair, measured 2026-09-28, coordinator-accepted): the five
      reds have FIVE causes, and BSD wc padding is NOT the shared one.
      1. fragment-ts-skew, `consumers=       4`: BSD /usr/bin/grep -lc prints BOTH
         `file:1` and `file` for each match (4 lines for 2 files; GNU prints only the
         names). The wc padding is cosmetic, since [ -eq ] compares numerically.
         Fix: `grep -l`, not `-lc`.
      2. added-fragment-parse (negative control, bare timestamp): with no YAML
         validator (darwin builds no tillandsias-policy and ships no yq) the gate
         printed ok:added-fragments-parse:0 checked and exited 0, skipping even the
         validator-free bare-timestamp test. The plan-only lane's push check
         therefore accepted unparseable fragments and unquoted timestamps unchecked
         on darwin. Fix: fall back to `tillandsias-plan validate-yaml`, and refuse
         (blocked:added-fragments-parse:no-validator, rc 1) when nothing resolves.
      3. fragment-closure-evidence (step 5) and 4. fragment-status-loss (step 6):
         the "stale plan binary" simulation does not make the binary look stale on
         darwin (ok:0 checked / the batched-fold fallback note instead of the skip).
         The staleness trigger is regime-dependent.
      5. validator-surface-currency (step 1): "resolved binary is stale against this
         checkout / could not read both hashes"; cause not yet isolated.
      Order of work (coordinator): #2 first, then #3/#4, then #5.

      [2026-09-28T04:28:07Z macos] CORRECTED ACCOUNT (macbookair, re-measured 2026-09-28 in the GATE regime —
      TILLANDSIAS_PLAN_BIN and CARGO_TARGET_DIR unset, plan binary built from the
      tree). This supersedes both the single-cause "BSD wc padding" story and the
      earlier five-cause append, which was measured in the wrong regime (exported
      TILLANDSIAS_PLAN_BIN, git worktrees, a binary copied from an older tree).
      Three of the five reds were manufactured by that regime.
      1. fragment-ts-skew: REAL, darwin. BSD /usr/bin/grep -lc prints `file:N`
         AND `file` per match (4 for 2). Fixed: `grep -l | wc -l | tr -d ' '`.
         scripts/test-bsd-count-shapes.sh reproduces both BSD shapes with stubs on
         any host (gate step 278).
      2. added-fragment-parse: REAL, darwin. There was no YAML validator, so the
         gate printed a green ok:0 checked that never looked. Fixed: it falls back
         to `tillandsias-plan validate-yaml` and otherwise refuses
         blocked:added-fragments-parse:no-validator.
      3. fragment-closure-evidence and 4. fragment-status-loss: NOT darwin reds.
         They pass unchanged in the gate regime. Their stale-binary stub is named
         tillandsias-plan.exe, and an exported TILLANDSIAS_PLAN_BIN answered in its
         place.
      5. validator-surface-currency: NOT darwin, a WORKTREE bug on any platform.
         find_repo_root required `.git` to be a directory; a linked worktree's `.git`
         is a file, so a binary built in a worktree answers unknown:validator-
         surface. Fixed with `.exists()`.
      Result: darwin ci-release passed=52 failed=0 in the gate regime. The sibling
      worktree finding (test-metrics-log-path-agreement 2/18) is 1455-d7hc.
    ts: "2026-09-28T04:28:07Z"
