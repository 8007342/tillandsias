  - packet_id: fourteen-ghost-traces-are-only-reported-in-files-a-commit-touches
    event:
      type: implemented
      ts: "2026-08-26T07:55:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t073711z
      host: lenovinha
      summary: |
        MY OWN 2026-08-23 NOTE WAS STALE AND I RE-MEASURED INSTEAD OF ACTING ON
        IT. That note listed seven low-fanout ghosts to remove and two to keep.
        Of that list exactly ONE (forge-skills-mapping) is still a ghost today.
        The set had almost entirely turned over. Acting on my own note would have
        edited annotations that no longer exist and left the real ones untouched.

        CURRENT MEASUREMENT: specs=187 traced=180 ghost=7, baseline=7.
          browser-isolation-telemetry  files=1
          control-socket               files=1
          cross-platform-compilation   files=1
          enclave-network-isolation    files=1
          ephemeral-guarantee          files=8
          fail-loud-diagnosis          files=1
          forge-skills-mapping         files=3

        THE DISPOSITION RULE IN MY NOTE WAS ALSO WRONG, AND THIS IS THE FINDING.
        It said prefer REMOVAL for low fanout. Checking each ghost against the
        spec list shows three of the four singletons are not orphans at all —
        they are RENAMES, annotations pointing at a spec that still exists under
        a different name. A "delete the low-fanout ghosts" sweep would have
        destroyed three legitimate links and reported the ratchet shrinking as
        success. Fanout measures how many files cite a trace; it says nothing
        about whether the concept exists.

        RETARGETED (each verified against the candidate spec's own content, not
        by name similarity):
          spec:control-socket -> spec:tray-host-control-socket
            litmus-socket-cleanup.yaml is about leftover sockets after a run;
            the candidate spec carries 4 cleanup/unlink/remove mentions.
          spec:cross-platform-compilation -> spec:cross-platform
            litmus-cross-target-cfg-gate-check.yaml is about un-gated unix-only
            APIs breaking the Windows workspace build; the candidate is
            "Cross-Platform Windows Support".
          spec:enclave-network-isolation -> spec:enclave-network
            litmus-enclave-isolation.yaml verifies enclave network and proxy
            wiring.

        NOT RETARGETED, each with the reason it failed the check:
          browser-isolation-telemetry — the obvious candidate
            (browser-isolation-core) contains ZERO telemetry or logging
            content, so this is a genuinely distinct concept with no spec, not
            a rename. Name similarity would have said otherwise; content did
            not.
          fail-loud-diagnosis — no spec exists, but
            `fail-loud-diagnosis-milestone` appears 175 times in plan/index.yaml.
            The annotation names a PLAN MILESTONE in `spec:` syntax: a category
            error, not a missing spec. Deleting it hides a central concept;
            writing a spec named after a milestone would be wrong too. Needs a
            decision on the annotation's KIND.
          ephemeral-guarantee — fanout 8, all teardown/cleanup/ephemerality
            litmus tests. The nearest spec (ephemeral-secret-refresh) is about
            secrets, not lifetime. This is my note's surviving case: absence
            reads as a spec never written for something central.
          forge-skills-mapping — fanout 3, no near match; left for its own look.

        Ratchet: baseline pruned 7 -> 4 in the same commit, as the gate requires.
        ./build.sh --check green.
  - packet_id: fourteen-ghost-traces-are-only-reported-in-files-a-commit-touches
    event:
      type: note
      ts: "2026-08-26T07:58:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t073711z
      host: lenovinha
      summary: |
        PACKET STAYS OPEN. Four ghosts remain and each needs a decision this
        cycle could not make on evidence alone:

          - ephemeral-guarantee and fail-loud-diagnosis are both CENTRAL
            concepts. Writing a spec for either is spec authorship, not trace
            cleanup, and shipping one as a side effect of a ratchet-shrinking
            cycle would be the wrong way to introduce it.
          - fail-loud-diagnosis additionally needs a ruling on whether a plan
            MILESTONE may be cited with `@trace spec:`. If it may not, the fix
            is a new annotation kind, which is a shared-surface change and by
            the new sibling_heads_up_protocol wants a heads-up before it lands.
          - browser-isolation-telemetry and forge-skills-mapping are small but
            genuinely unresolved.

        WHAT I WOULD TELL THE NEXT PICKER, because it is the reusable half: check
        each ghost against the CONTENT of its candidate spec before deleting.
        Three of four singletons here were renames. The cheap test that
        distinguishes them is one grep of the candidate for the citing test's
        subject — name similarity alone said browser-isolation-core was a match
        for browser-isolation-telemetry, and the content check said it was not.
