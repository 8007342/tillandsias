        Cause: cpu_token() tested `[ -r /proc/cpuinfo ]` BEFORE the Darwin
        branch, so on Linux the sysctl path is unreachable no matter how
        thoroughly `uname` is shimmed — the scenario read this box's real
        /proc/cpuinfo and returned its Core Ultra. The probe inferred the OS
        from a filesystem artifact instead of asking, while os_group() two
        functions above already branched on `uname` correctly.

        THAT IS 851-gpb5'S OWN FINDING, INVERTED. The cycle fixed a fixture
        that only passed where it was written by shimming uname; the Darwin
        scenario it added in the same edit then only passed where IT was
        written. The lesson generalises past both of us: shimming the probe is
        not enough if the SUT reaches the same fact by a second route that the
        shim cannot cover. A hermetic test needs the SUT to have ONE way of
        knowing.

        FIXED by branching on uname first, matching os_group(). 18/18 on this
        Linux host, macuahuitl's slug unchanged at
        linux-core-ultra-npu+nvidia-macuahuitl, and mutation-controlled:
