packets:

  - packet_id: build-bumps-version-then-the-hook-forbids-pushing-it
    order: 643-64bx
    status: ready
    desired_release: v0.5
    priority: p1
    title: "`./build.sh` bumps VERSION, tells you to commit it, and the pre-push hook then refuses it"
    kind: bug
    deliverable: build.sh + scripts/install-hooks.sh
    depends_on: []
    pickup_role: any
    capability_tags: [build, versioning, hooks, developer-experience]
    context: >
      Reproduced live 2026-08-10 when the operator ran `./build.sh --install` on linux-next.
      The three steps contradict each other:

        1. build.sh bumps the local build counter, dirtying six TRACKED files
           (VERSION, Cargo.lock, and four crate Cargo.toml files):
             "NOTICE: Date has changed (260809 -> 260810), resetting build to 1"
             "Bumped build: 0.4.260810.1"
           methodology/versioning.yaml DECLARES this — "Automatic on every local
           build (./build.sh)" — so it is intended behaviour, not a bug on its own.

        2. build.sh then instructs committing it:
             "Commit them with your change: git add VERSION Cargo.toml crates/*/Cargo.toml"

        3. the pre-push hook refuses any commit touching VERSION on a non-main branch:
             "If you intended to bump VERSION, either: 1. Push to main (allowed)
              2. Drop the VERSION change from these commits
              3. Use 'git push --no-verify' to bypass (also skips the local gate)"

      So the build produces a change it instructs you to commit and then forbids you to
      push. Every exit is bad:
        * commit + --no-verify   bypasses the ONLY remaining gate (push CI was removed,
                                 599-w5jd) to push a file the guard exists to protect
        * commit, do not push    a local-only commit, which the meta-orchestration exit
                                 contract forbids outright
        * leave it uncommitted   a dirty tracked worktree, which trips the NEXT cycle's
                                 dirty-start refusal and stalls the loop
        * revert it              what this host did — but the next `./build.sh` recreates
                                 it, so every build on every host pays this again

      This is the 602-tfzg deadlock family (recorded in the v0.4.260804.1 ledger row as
      "exit only via --no-verify at the release"), but reached from the ordinary developer
      path rather than the release path. It fires on `./build.sh --install`, which is the
      single most common command in the project.
    exit_criteria:
      - >
        Decide whether the local build counter should touch TRACKED files at all. If the
        counter is local, it belongs somewhere untracked (target/, or a gitignored stamp)
        and the tracked VERSION moves only at release. That removes the contradiction
        rather than adding an exception to it.
      - >
        If it must stay tracked, build.sh must stop instructing a commit the hook will
        refuse — the instruction is actively harmful, since following it leads to
        --no-verify, which disables the gate.
      - >
        Whichever way it goes, `./build.sh --install` followed by a normal push must
        succeed with no bypass and no manual revert.
    verifiable_closure: >
      On a clean checkout: `./build.sh --install && git status --porcelain` is empty, OR
      the resulting change pushes to a platform branch without --no-verify. A litmus pins
      whichever contract is chosen.
    notes: >
      Do NOT fix this by relaxing the VERSION guard. The guard is load-bearing: it exists
      because main's VERSION is the release identity and a platform branch must not move
      it. The defect is that a routine local build writes to a file under that guard's
      protection.
    events:
      - ts: "2026-08-10T01:05:00Z"
        event: filed
        summary: >
          Hit during an operator-run `./build.sh --install`. This host reverted the bump to
          keep the tree clean and the loop running, and deliberately did NOT use
          --no-verify: bypassing the only remaining gate to push a file that gate protects
          is the worst of the four available exits.
