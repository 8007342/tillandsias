- packet_id: preview-route-on-18443-closes-browser-and-in-forge-connections-while-the-readiness-probe-reports-serving
  order: 1935-svxq
  status: ready
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [local-web-preview, router, tls, browser-open, podman]
  estimated_hours: 4
  related: [1763-nc9d, 1935-mwxr, 1651-5t7n]
  title: "https://www.demon-attack.localhost:18443/ gets net::ERR_CONNECTION_CLOSED from browser.open and 000 from curl inside the forge, while publish_local reports route_ready=true serving=true host_trust=verified"
  context: |
    LIVE (demon_attack-forge, 3 sessions): browser.open (dev and non-dev, visible, before and after service_reload) fails with BROWSER_LAUNCH_FAILED net::ERR_CONNECTION_CLOSED. Wrangler logs only the readiness probe's GET / (200), never the browser's request. Hypothesis: the probe reaches the upstream by a different path, SNI or host than real clients, so it passes while the TLS front (SNI or route keyed on the raw name or the label) closes the client connection. Start by reading what the readiness probe actually connects to in crates/tillandsias-headless/src/local_web_preview.rs, and which name the router's TLS SNI map and cert are keyed on for a project whose label differs from its raw name.
  exit_criteria:
  - a project named with an underscore opens its own preview through browser.open and through curl inside its forge
  - the readiness probe connects the way a client does (same host, SNI and port), so it cannot report serving while clients are refused
  unscoreable: unpinnable-until-the-guard-exists — the deliverable includes a cargo test in tillandsias-headless (name it preview_probe_uses_client_sni_for_underscore_project) that fails on today's tree; write it in the same commit as the fix.
  next_action: A Linux host with podman reproduces the failure with a project named a_b, and captures the router's SNI map and the probe's target.
  provenance: coordinator relay of operator forge evidence, 2026-11-01.
  events:
  - type: filed
    ts: '2026-11-01T23:08:35Z'
    host: calmecacpilli
    summary: filed p1 bug; needs podman and a live preview, so calmecacpilli can't take it
