      ts: "2026-08-17T10:10:00Z"
      agent_id: linux-macuahuitl-opus5-20260817
      host: linux_mutable
      summary: |
        TWO FALSIFICATIONS IN ONE CYCLE, on one symptom. Recorded because
        788-mj37 went into methodology this same cycle and this is its first
        real exercise.

        INFERENCE 1 (in 794-57bv as filed): "four tests collided on the image's
        atomic rename". Falsified by fixing the image builds — with zero image
        builds in the run, the identical rename error remained. The fix was the
        experiment.

        INFERENCE 2 (in 797-vv3n as filed): "fails as a batch under machine
        load", supported by a genuinely suggestive correlation — 3/3 gate runs
        red, 12/13 direct runs green, every red run having something else
        compiling. Falsified by running the gate on a deliberately idle machine
        and getting the same 4 failures. The correlation was real and the
        causal reading of it was wrong: the gate did not fail because the
        machine was busy, it failed because the gate EXPORTS
        TILLANDSIAS_PODMAN_REMOTE_URL and a bare `cargo test` does not. Load
        was a passenger.

        WHAT ACTUALLY FOUND IT was reading the gate's own error text instead of
        theorising about the tests: "podman EXISTS at
        '/tmp/tillandsias-podman-wrapper/podman' but did not answer
        '--version'". That line was in the gate log for all three red runs and
        named the wrapper, the remote form, and therefore the variable. The two
        wrong inferences were both produced without reading it.

        HONEST NOTE ON THE PACKET I FILED: 797-vv3n's context did separate
        OBSERVED from INFERRED and did say "test this before building on it",
        which is why the falsification was cheap and nobody built on it. It
        also proposed a "cheaper second hypothesis" (unrestored PATH after a
        panic, poison-tolerant locks letting it cascade) which was ALSO wrong.
        Two hypotheses, both plausible, both wrong, neither expensive —
        that is the intended cost of the rule, not a failure of it.

        WHAT REMAINS UNFIXED, deliberately: the mock's final bare `exit 0`.
        Skipping global flags stops THIS caller from tripping it, but any
        future unrecognized subcommand still reports success and does nothing.
        Filed as 797-p2xa rather than fixed here, because 22 litmus specs
        depend on this mock's permissiveness and flipping it to a refusal needs
        a full litmus run to bound, which is not a thing to do in the hour
        before a release.
packets:
  - packet_id: podman-mock-unrecognized-subcommand-exits-zero-silently
    order: 797-p2xa
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "scripts/test-support/podman-mock.sh answers an unrecognized subcommand with a bare exit 0 and no output — a mock that fails OPEN, so every test built on it can pass while exercising nothing"
    deliverable: "an invocation the mock does not understand is a loud, typed refusal on stderr with a non-zero exit; the arms that legitimately no-op (network/compose/system) stay explicit, so 'handled deliberately' and 'not handled at all' stop being the same answer"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [fail-loud, testing, podman, litmus]
    estimated_hours: 4
    context: |
      OBSERVED, macuahuitl 2026-08-17, and this is not hypothetical: the
      fall-through cost this cycle roughly four hours across three wrong
      diagnoses (797-vv3n's closure note has the sequence).

      The file ends with a `case` on the subcommand and then, outside it, a
      bare `exit 0`. Any invocation matching no arm therefore reports SUCCESS
      with EMPTY output. The caller sees a podman that did what was asked and
      produced nothing. What that looks like downstream, measured:

        * `atomic rename failed: No such file or directory (os error 2)`
          — the temp checkout the mock never created.
        * `invalid gh JSON: EOF while parsing a value at line 1 column 0`
          — the JSON array the mock never printed.

      Neither message contains the words podman, mock, or unrecognized. The
      failure is maximally far from its cause, which is the definition of the
      fail-loud problem this milestone exists for.

      The trigger this time was `podman --remote --url <u> run ...`, where the
      global flags were not skipped so `--remote` became the "subcommand".
      That specific hole is now closed. The CLASS is not: any future flag,
      any subcommand the product starts using, any typo in a litmus step,
      lands in the same silent success.

      WHY THIS IS NOT A ONE-LINE FIX, and why it was filed instead of done in
      the release hour: `grep -rln podman-mock` finds the litmus corpus plus
      run-litmus-test.sh, test-concurrent-forge-shared-stack.sh and
      remote_projects.rs, and the mock's own header documents six audits
      across four hosts. Some callers may depend on the permissive tail —
      that is precisely what a fail-open default makes unknowable without
      running everything. Budget a full litmus run to bound the blast radius,
      and expect to convert some silent passes into explicit arms.

      NEGATIVE CONTROL THE FIX SHOULD CARRY: invoke the mock with a
      deliberately absurd subcommand and assert a non-zero exit and a
      diagnostic naming the subcommand — a mock that cannot report its own
      confusion is not a test double, it is a source of false green.
  - packet_id: litmus-run-poisons-the-shared-podman-wrapper-for-later-consumers
    order: 797-w8kf
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "a litmus run bakes its EPHEMERAL fake-podman path into the fixed shared wrapper /tmp/tillandsias-podman-wrapper/podman, which then outlives the tempdir and breaks podman for every later consumer on the host"
    deliverable: "the generated wrapper never embeds a path that will not outlive it, or the freshness test that decides whether to rebuild it validates that its exec target still exists; a stale wrapper must not be able to present itself as fresh"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [podman, litmus, host-state, idempotence]
    estimated_hours: 3
    context: |
      OBSERVED, macuahuitl 2026-08-17, twice within one hour — once from a
      wrapper written the previous evening, once regenerated during this
      cycle's own gate run.

        $ cat /tmp/tillandsias-podman-wrapper/podman | tail -1
          ... exec "/tmp/tmp.gxeapvvG0V/fake-podman/litmus-fake-podman-bin/podman" \
              --remote --url "unix:///run/user/1000/podman/podman.sock" "$@"
        $ ls /tmp/tmp.gxeapvvG0V/...
          No such file or directory

      A litmus run creates a fake podman under `mktemp -d`, common.sh writes
      the wrapper to the FIXED path `${TMPDIR:-/tmp}/tillandsias-podman-wrapper/
      podman` with that ephemeral path baked in, and the tempdir is then
      removed. The wrapper survives. Every later consumer that resolves podman
      through it gets `line 5: .../podman: No such file or directory`, exit
      127, on a host where podman is part of the OS image and answers `info`
      in 0.06s.

      WHY IT PERSISTS RATHER THAN SELF-HEALING: the rebuild test is
      `[[ ! -x "$PODMAN" ]] || [[ "$PODMAN" -ot "$_podman_bin" ]]` — is the
      wrapper missing, or older than the real podman binary. A wrapper written
      last night is executable and NEWER than /usr/bin/podman, so it is judged
      fresh forever. The test asks about the wrapper's own mtime and never
      about whether the thing it EXECS still exists.

      MEASURED CONSEQUENCE: `./build.sh --ci-full` reported
      podman-path-availability FAILED with "podman EXISTS at ... but did not
      answer '--version'". `rm -rf /tmp/tillandsias-podman-wrapper` alone
      turned that check green on the next run. The next litmus run recreated a
      freshly poisoned one.

      RELATION TO 793-a62g, whose fix landed today as 8e51ad3b3: that removed
      the STOPWATCH that chose the wrapper branch by racing `podman info`, and
      it is a real improvement — the branch is now configuration, not
      inference. It did not address the wrapper's CONTENT or its lifetime,
      which is this packet. Note the credit where due: 793-a62g's diagnosis
      already named "the wrapper is written to one FIXED path shared by every
      concurrent lane" as a defect; this is the same fixed path biting through
      a different mechanism (time rather than concurrency).
