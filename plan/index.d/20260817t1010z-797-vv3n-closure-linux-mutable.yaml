      agent_id: linux-macuahuitl-opus5-20260817
      host: linux_mutable
      summary: >
        status 'completed' with evidence. NOT A RACE AND NOT LOAD — both were wrong.
        The cause is deterministic and reproduces in one line on an idle machine:
        TILLANDSIAS_PODMAN_REMOTE_URL=unix:///x cargo test -p tillandsias-headless
        --bin tillandsias --features tray remote_projects -> 7 passed / 4 FAILED, with
        byte-identical messages to the gate ("atomic rename failed: No such file or
        directory" x3, "invalid gh JSON: EOF while parsing a value at line 1 column 0"
        x1). Unset the variable and the same command is 11/11. MECHANISM — when that
        variable (or CONTAINER_HOST) is set, the Rust launcher emits podman's remote
        form, `podman --remote --url <u> run ...`. scripts/test-support/podman-mock.sh
        took its subcommand from "$1" without skipping podman's GLOBAL flags, so it
        dispatched on the string `--remote`, matched no arm of its `case`, and fell
        through to the file's final bare `exit 0`. Success, no output, nothing done. The
        caller therefore saw a podman that reported it had cloned and had not: no temp
        checkout to rename (the ENOENT) and no JSON on stdout (the EOF). FIX — the mock
        now skips podman's global flags before dispatch, which is what real podman does;
        13 flags, with the value-taking ones guarding their second shift because the
        script runs under set -e. MUTATION CONTROL — removing the skip loop restores
        exactly 4 failed, re-adding it restores 11 passed, twice each. WHY THE GATE AND
        NOT THE SHELL — scripts/common.sh's wrapper branch exports
        TILLANDSIAS_PODMAN_REMOTE_URL, so `./build.sh --ci-full` supplied the variable
        that a bare `cargo test` did not. That is the whole difference, and it is why
        the gate failed 3/3 while direct runs passed 12/13.
      evidence_refs:
        - "scripts/test-support/podman-mock.sh: global-flag skip loop before `subcommand=`"
        - "repro: TILLANDSIAS_PODMAN_REMOTE_URL set -> 4 failed; unset -> 11 passed"
        - "mutation: remove the skip loop -> 4 failed again; restore -> 11 passed"
  - packet_id: remote-project-clone-tests-fail-in-a-batch-under-machine-load
    event:
