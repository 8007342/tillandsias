      WHAT IT MUST ASSERT — the two arms below, both of which are MEASURED on
      this row already, so nothing in them is invented at writing time. It must
      run the hook against a deliberately staled tree rather than trusting a
      real push, because a push that happens to be gate-current cannot
      distinguish the fixed trailer from the broken one: on a CURRENT tree the
      unconditional line is TRUE, and a test that only ever sees that state
      passes on the pre-fix code. The staled tree is the discriminating case.
    verifiable_closure: |
      A push on a work ref whose stamp is STALE must not end in a line claiming
      ./build.sh --check is current. Two arms, and the pre-fix state fails both.

      ARM A, THE OUTPUT. With the tree deliberately staled (touch any tracked
      file the stamp covers, or simply push a tree that has not been gated),
      push a work/<order> ref and capture the hook's stderr. The LAST line must
      either (i) state the decider tally and the stamp verdict it actually saw,
      e.g. `work-ref lane: 1 decider warned, gate-stamp
      stale:tree-changed-since-gate — the landing queue gates this on arrival`,
      or (ii) not be printed at all on a lane where refuse() returned. What it
      must NOT do is assert `./build.sh --check current for this tree`.
      MEASURED PRE-FIX (macneo, 2026-09-22, push of work/1302-7j8p at
      4eec70dec): line 5 of the log read
        warn:pre-push:pre-push: the tree changed since ./build.sh --check last passed
      and the LAST line read
        local gate: preflight clean, ./build.sh --check current for this tree
      in the same push.

      ARM B, THE INSTRUMENT AGREES. In that same state
      `bash scripts/gate-stamp.sh` prints `stale:tree-changed-since-gate`. The
      hook's trailer and the stamp tool must not contradict each other; the
      test asserts they agree, so the fix cannot be to soften the stamp.
    title: |
      The pre-push hook's last line claims ./build.sh --check is current for this tree unconditionally, after a decider chain whose refuse() degraded to a warn and returned, so the tail of a push log reports a check that no check made
    context: |
      scripts/hooks/pre-push-local-gate.sh:2030 is an UNCONDITIONAL echo at the
      end of the decider chain:
        echo "local gate: preflight clean, ./build.sh --check current for this tree"

      On a work/<order> ref, order 1315-4a7j (phase 1: migration, not
      enforcement) makes refuse() print one `warn:pre-push:<decider>:` line and
      RETURN 0 rather than exit 1. That is the intended lane behaviour and is
      not in question. The consequence is: execution falls through EVERY red
      decider, including the stale-stamp branch at :1808/:1826, and reaches the
      green trailer. The trailer is reached in exactly the state it denies.

      WHY THIS IS MORE THAN AN UGLY LINE. The natural way to read a long push
      log is its tail, and the tail is where a summary line lives — so the one
      line most likely to be unconditional is the one line most likely to be
      read alone. On this host the sequence was: `git push`, `tail -6`, green,
      and a report to the coordinator was one step from going out saying the
      push was clean. The verdict was recovered only because the stamp was
      checked separately, and it said stale:tree-changed-since-gate against a
      stamp dated 2026-09-21T01:53:36Z.

      The failure family is the one this milestone exists for: the trailer is
      TRUE ABOUT ITSELF — the chain did finish — and FALSE ABOUT THE WORLD —
      no check established that --check is current. Same shape as 795-imz3's
      inverted pipeline status and as the hook's own comment at :1994 about a
      warn rendering as a pass because two streams were captured into one blob.
      That comment is eleven lines above a line with the same defect.

      A HUMAN AND AN AGENT FAIL DIFFERENTLY HERE, and both fail. A human
      scrolls and may catch the warn. An agent capturing `tail -N` cannot: the
      warn is outside the window by construction.
    next_action: |
      Not claimed. Unblocked, small, and needs no capability this fleet lacks.
      1. At :2030, branch on whether any decider warned. The lane already has
         the fact — refuse() knows it degraded — so the cheapest fix is a
         counter incremented in the WORK_REF_LANE branch of refuse() and read
         at the trailer.
      2. Make the trailer state what it saw rather than what it assumes: the
         decider tally and the gate-stamp verdict, both of which are already
         computed in this process.
      3. Do NOT fix this by silencing the warn or by making the work-ref lane
         refuse; 1315-4a7j chose warn-and-continue deliberately and this row
         does not reopen it. The defect is the claim, not the lane.
      4. Add the ARM A / ARM B assertions above as a guard, and bind it in a
         .step so it runs in a suite (885-92iu).
