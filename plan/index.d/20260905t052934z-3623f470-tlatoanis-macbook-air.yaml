      summary: |-
        CORRECTING MY OWN 'FIRST-BOOT CONDITION' FRAMING — it is not supported, and this is the third narrowing on this packet. MEASURED by boot id, non-destructively, from the 74 boots the guest still retains. (1) THE ORIGINAL PROVISIONING BOOT (5b73f5bef9f945b2b1c6292e7c391177, 2026-08-29 17:38) started BOTH units cleanly: 'Starting tillandsias-headless-fetch.service' -> 'Finished', and tillandsias-headless.service running. So the abort is not a property of first boots; the very first boot did not abort. (2) THE BOOT WHERE MY TRAP FIRED (9c8d5de5e5ce43e994dcd1508dd6bf28, 05:01:47) ALSO started both units successfully — fetch Starting 05:01:47 -> Finished 05:01:47; headless Starting 05:01:47, preflight reporting headless_binary=ok vsock_device=present podman_socket=present podman_socket_unit=active, -> Started 05:01:47. AND THE TRAP RECORDED rc=1 AT 05:01:49, two seconds LATER, from 'systemctl start tillandsias-headless-fetch.service tillandsias-headless.service'. So systemd had already brought both units to active via WantedBy=multi-user.target BEFORE cloud-init's script reached its 'systemctl start', and that start returned 1 anyway. WHAT IS NOW ESTABLISHED: the script aborts at line 373 (measured), everything after it including the readiness-service start never runs (measured), and the units it names were ALREADY ACTIVE AND HEALTHY at that moment (measured). WHAT IS NOT: why systemctl start returned 1 against already-active units. My 'first-boot' story was inference from 'later boots are healthy' and it does not survive contact with the original boot's journal. WHAT I WOULD DO NEXT, and it needs one rebuild-and-boot rather than a theory: have the trap capture the FAILING COMMAND'S OWN STDERR, not just rc and cmd. systemctl says why it refuses; nothing currently records it. That is the same lesson this packet keeps teaching — the instrument that answers the question is cheaper than the round of guessing it replaces.
