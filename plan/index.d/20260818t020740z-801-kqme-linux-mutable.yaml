    kind: fix
    title: "the runtime forge image contains no nix at all, so openspec/specs/default-image/spec.md's `MUST include Nix` is unmet and nothing in a forge can consume the 801-kqme binary cache"
    deliverable: "either nix present in the runtime forge image with substituters+trusted-public-keys pointing at nix-cache, or the spec and the welcome banner corrected to stop claiming it"
    pickup_role: linux
