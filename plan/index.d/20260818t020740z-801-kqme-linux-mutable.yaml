    estimated_hours: 5
    context: |
      MEASURED 2026-08-18 inside localhost/tillandsias-forge:v0.4.260816.1:
        command -v nix   -> rc=1
        ls -d /nix       -> No such file or directory
        ls /usr/bin/nix* -> No such file or directory

      Yet openspec/specs/default-image/spec.md:12 says the image MUST include
      Nix and :22-24 has a scenario "Image contains Nix ... with flakes
      enabled". The forge banner advertises it too
      (images/default/forge-welcome.sh:60 GUEST_OS="Nix (Minimal)", :171).

      WHY THE DRIFT EXISTS: there are two image paths. The runtime one is
      build-forge.sh -> scripts/build-image.sh -> images/default/Containerfile,
      whose microdnf list has no nix. The nix-built layered image
      (flake.nix packages.forge-image) DOES include nix at flake.nix:261 and
      writes ~/.config/nix/nix.conf at :374 — and nothing builds it.

      WHY IT BLOCKS VALUE RATHER THAN JUST BEING UNTIDY: 801-kqme landed a
      working binary cache on the enclave, and the forge cannot use it, because
      it has no nix. The service was still worth landing — it is the only
      substituter reachable from inside the enclave at all — but its consumer
      does not exist yet.

      DECIDE WHICH WAY TO RESOLVE IT. Adding nix to the runtime image is not
      free (image size, build time, a second package manager inside the forge)
      and "the spec claims a capability nobody uses" is a legitimate outcome
      too. Do not add nix just because a spec sentence says so; find out
      whether forge agents actually want it, then make spec and image agree.

