      host: linux_mutable
      summary: |
        SERVING MECHANISM: harmonia 3.2.0, chosen on measurement rather than
        reputation, as the packet asked.

          harmonia 3.2.0    67 MiB closure,   7 store paths
          nix-serve 0.2    231 MiB closure, 177 store paths  (Perl + deps)

        The decisive property is not size though: harmonia-cache serves the
        store from a FULLY READ-ONLY mount. It needs no write access to the WAL
        SQLite db, so the host keeps building into the same store while the
        service serves it, with no shared mutable state and no corruption
        surface. That is what makes "one store, many concurrent readers" safe
        and is exactly the objection to the bind-mount design.

        Two traps worth carrying forward. First, the `harmonia` dispatcher
        binary shells out to a `nix` CLI (adding a 159 MiB / 63-path runtime
        dependency, which would have erased the size advantage); `harmonia-cache`
        is the real server and needs no nix at all — so the service execs it
        directly. Second, harmonia derives `workers = 0` in this container and
        dies with "workers must be greater than 0"; the config sets it
        explicitly.

        BOTH TRUST MECHANISMS ARE IMPLEMENTED, and the distinction is kept:
          TRANSPORT — a TLS leaf minted from the stack CA (/tmp/tillandsias-ca),
            SANs DNS:nix-cache,DNS:localhost,IP:127.0.0.1, the same shape as
            vault_bootstrap.rs's vault leaf. A client without the stack CA
            cannot complete the handshake (measured: curl rc=60).
          CONTENT — an ed25519 binary-cache keypair generated on the host.
            Clients verify with require-sigs + trusted-public-keys. The secret
            key lives at ~/.local/share/tillandsias/nix-cache/cache-priv.key,
            mode 0600, outside the repo and outside every image.
        The shortcut of marking the cache `trusted-substituters` so signatures
        are skipped was NOT taken: it means "accept whatever this host sends"
        and discards the integrity property that makes a shared cache safe.

        THE HOST STORE IS UNCHANGED. 795-h8er's store keeps serving host-side
        builds directly. Nothing is bind-mounted into any forge.

        MEASURED, from inside the enclave, empty destination store, closure =
        nix-2.34.8 (63 paths / 159 MiB), signature-verified over TLS:
          WARM  (https://nix-cache:5000)   586 / 553 / 566 ms   63 paths, 170 MiB
          COLD  (upstream through squid)   IMPOSSIBLE — connection reset
        Host-side, where a cold fetch is possible at all: 5.9 s from
        cache.nixos.org vs 0.19 s from this cache, both 63 paths / 169 MiB.

        THE COLD RESULT IS THE MORE IMPORTANT NUMBER. cache.nixos.org appears
        NOWHERE in the 207-line squid allowlist, so an enclave container cannot
        reach any upstream substituter. This service is therefore not an
        optimisation over a slower path — inside the enclave it is the ONLY
        substituter that can exist. A forge with nix and without it must build
        from source.

        SCOPE, HONESTLY. What landed is a design plus a working, tested,
        single-host service reachable at https://nix-cache:5000 on the enclave.
        What did NOT land, and why, is filed as three packets below: the forge
        image contains no nix at all, so nothing in a forge can consume this
        yet; and the service is started by a script rather than by the tray's
        ensure_*/container_deps lifecycle graph.
