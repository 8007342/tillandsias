  - packet_id: nix-binary-cache-service-on-the-enclave-for-warm-forges
    event:
      type: note
      ts: "2026-08-18T02:07:40Z"
      agent_id: fork-801kqme-20260818T0207Z
      host: linux_mutable
      summary: |
        NEGATIVE CONTROLS — and the first draft of this fixture was VACUOUS.
        Recording that in full, because the mechanism generalises to any test
        of any binary cache.

        M1, content trust: remove `sign_key_paths` so the server stops signing.
        FIRST DRAFT STILL REPORTED 8/8. The mutation was genuinely live — the
        generated config had no sign_key_paths and the served narinfo had lost
        our Sig line — and the fixture passed anyway.

        Cause: nix keeps a CLIENT-SIDE narinfo cache
        (~/.cache/nix/binary-cache-v7.sqlite) keyed by substituter URL, and
        `narinfo-cache-positive-ttl` defaults to 30 DAYS. nix replayed a
        narinfo captured while the server was still signing. Discriminated on
        the same URL:
          shared cache, default ttl : rc=0, 7 paths   <- masked
          fresh XDG_CACHE_HOME      : rc=1, 0 paths   <- correctly refused
          narinfo-cache-positive-ttl 0 : rc=1, 0 paths <- correctly refused
        An intermediate theory — that a second harmonia on a different port
        proved the cache innocent — was FALSIFIED: that port had never been
        cached, so it never exercised a stale hit. Fixed with both a private
        XDG_CACHE_HOME and explicit ttl 0.

        M2, transport trust: re-mint the leaf from a rogue CA, keeping HTTPS up.
        FIRST DRAFT REPORTED skip:service-down — because the skip gate asked
        `nix-cache-service.sh status`, whose own probe uses the stack CA. So
        the fixture went QUIET at exactly the moment transport trust broke.
        Fixed: the skip gate now asks podman whether the container is RUNNING,
        a fact independent of every property under test.

        AFTER BOTH FIXES:
          baseline            ok:nix-cache-fixture:8/8              rc=0
          M1 signing removed  violation:...:7/8:failed=6            rc=1
          M1 restored         ok:nix-cache-fixture:8/8              rc=0
          M2 rogue CA leaf    violation:...:4/8:failed=3,5,6,7      rc=1
          M2 restored         ok:nix-cache-fixture:8/8              rc=0
        Both restores byte-identical by sha256 (service and fixture).

        OBSERVED vs INFERRED. Observed: every number above; the forge image
        has no nix and no /nix (checked in the image, not inferred from the
        Containerfile); cache.nixos.org is absent from the squid allowlist.
        Inferred and NOT yet tested: that a forge which DID have nix would need
        no change beyond substituters + trusted-public-keys + the no_proxy
        entry. That is the first thing to test when 801-x1nx lands.

