packets:
  - packet_id: builder-toolbox-init-set-too-small-for-the-dispatch-pattern
    order: 799-tb7q
    status: ready
    desired_release: v0.5
    priority: p2
    kind: enhancement
    title: "the toolbox-first dispatch pattern is unusable for jq/yq/ripgrep/openssl because the tillandsias-builder init set does not carry them — grow the init set, then sweep the ~50 scripts that currently assume the host has the tool"
    deliverable: "with-tillandsias-builder.sh's init installs the tools the sweep actually needs (at minimum jq, yq, ripgrep, openssl CLI), with the first-run init cost measured before and after; then the bare-jq / bare-rg / bare-openssl callers take the documented host-preferred-toolbox-fallback dispatch; and the two nix CAPABILITY probes stop judging by host binary alone"
    pickup_role: linux
    release_target: convergence-velocity-milestone
    capability_tags: [toolbox, portability, scripts, idempotence]
    estimated_hours: 6
    context: |
      OBSERVED (777-amku sweep, macuahuitl 2026-08-17). The methodology entry
      multi_host_development.toolbox_first_scripts.tool_dispatch_pattern says:

        command -v <tool> >/dev/null && <tool> … ||
        toolbox run --container tillandsias-builder <tool> …

      That pattern is only valid for tools the toolbox HAS. Read the init block
      in scripts/with-tillandsias-builder.sh: it installs gcc pkg-config file
      cmake make openssl-devel systemd-devel ruby perl-FindBin procps-ng
      findutils diffutils, then rustup and the two musl targets. openssl-devel
      is the headers, not the CLI. There is no jq, no yq, no ripgrep.

      So the ~50 scripts the sweep identified CANNOT be converted yet:

        * bare `jq`, no guard, ~24 scripts — check-forge-service-health.sh,
          cycle-metrics.sh, generate-dashboard.sh, generate-evidence-bundle.sh,
          manage-cache.sh, query-traces.sh, select-work-batch.sh, local-ci.sh,
          update-convergence-dashboard.sh and the test-* family.
        * hard-fail-with-a-host-install-instruction on jq —
          scripts/tray-diagnose.sh:96 and scripts/diagnose-macos-provision.sh:82
          both say `brew install jq` and exit 1. These are exactly the shape the
          directive calls mis-shaped.
        * `rg` — check-cheatsheet-refs.sh:45 exits 2 with "ripgrep (rg) is
          required but not on PATH"; test-forge-config-trust-cross-platform-
          parity.sh:19 calls it bare.
        * bare `openssl` CLI — build.sh:508, diagnose-proxy.sh:35,
          run-forge-project.sh:78, orchestrate-enclave.sh:72.

      Writing the dispatch line for any of them TODAY makes things worse: the
      fallback arm runs and the container reports command-not-found, which is a
      more confusing failure than the host one it replaced. The init set is the
      prerequisite, which is why this is a packet and not a sweep.

      SECOND CRITERION, same root. scripts/check-nix-deps-stability.sh:77
      (`command -v nix … || skip:nix-deps-stability:no-nix`) and
      scripts/select-work-batch.sh:348 (TOOL_CAP_TAGS="nix", host `command -v`)
      both decide "is this host nix-capable" by asking whether the HOST has the
      binary. scripts/nix-toolbox.sh answers that question properly (daemon ->
      chroot -> toolbox). A toolbox-capable host is currently declared
      nix-incapable and has nix-tagged work removed from its pool. The reason
      this was not converted in 777-amku: asking nix-toolbox.sh inside a
      pre-push --check can trigger a `podman pull` of fedora-toolbox, which is a
      change to the gate's COST, not a refactor, and needs a decision about
      whether a check may create infrastructure.

      INFERRED, test it first: that growing the init set is cheap. It is one dnf
      line, but it also lengthens first-run init on a pristine Silverblue host
      and nobody has timed it. Measure the create+init wall time before and
      after; if it is material, split the init into a base set and an on-demand
      set rather than paying it on every fresh host.

  - packet_id: nix-toolbox-run-subcommand-is-broken-on-two-of-its-three-rungs
    order: 799-nx4r
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "scripts/nix-toolbox.sh `run` addresses the dead daemon on the chroot rung and cannot execute at all on the toolbox rung (`exec` of a shell function) — the subcommand advertised as the toolbox-nix entry point works only where it is least needed"
    deliverable: "`nix-toolbox.sh run -- <cmd>` works on every rung `ensure` can return: chroot injects --store, toolbox actually enters the container; plus a fixture case per rung so a rung that cannot execute is a red, not a discovery"
    pickup_role: linux
    release_target: convergence-velocity-milestone
    capability_tags: [nix, toolbox, fail-loud]
    estimated_hours: 3
    context: |
      OBSERVED, macuahuitl 2026-08-17, on a host at rung=chroot (host nix,
      nix-daemon.socket inactive):

        $ scripts/nix-toolbox.sh ensure
        ok:nix-toolbox:chroot
        $ scripts/nix-toolbox.sh run -- nix store ping
        Store URL: daemon
        error: cannot connect to socket at
               '/nix/var/nix/daemon-socket/socket': Connection refused
        rc=1

      The dispatch is `daemon|chroot) exec "$@" ;;` — `run` execs the command
      verbatim and never injects the rung's flags, so on the chroot rung it
      addresses exactly the daemon the rung exists to avoid. `nix-args` returns
      the right flags; `run` ignores them.

      The toolbox arm is worse: `toolbox) exec _toolbox run -c "$TOOLBOX_NAME"
      "$@" ;;` where `_toolbox` is a shell FUNCTION defined next to `_podman`.
      `exec` replaces the process with a program and cannot see functions:

        $ bash -c '_f(){ echo hi; }; exec _f'
        bash: line 1: exec: _f: not found      (rc=127)

      So the toolbox rung of `run` has never executed. Consistent with the
      evidence: all three real consumers use `nix-args`, and
      scripts/test-nix-toolbox.sh only covers daemon and chroot.

      WHY IT MATTERS BEYOND TIDINESS: 606-um5s carries a 2026-08-16 note telling
      the next agent to "use scripts/nix-toolbox.sh run -- nix build ... for
      this packet's verification lane". Following that instruction produces the
      connection-refused above and looks exactly like "this host still needs the
      nix-daemon" — the conclusion the operator has already rejected twice. A
      broken affordance that reproduces a withdrawn blocker is expensive.

      NEGATIVE CONTROL THE FIX SHOULD CARRY: a fixture case that forces the
      toolbox rung and asserts the command actually ran INSIDE the container
      (something only reachable there), not merely that the wrapper exited 0.
      The current failure mode is exit 127 from `exec`, which a `|| true`
      anywhere upstream would hide.
