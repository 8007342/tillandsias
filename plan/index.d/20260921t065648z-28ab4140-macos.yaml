      EVERY COULD-NOT-RUN FAMILY GOES THROUGH ONE HELPER, so the three spellings
      cannot drift apart again: off-platform, no app bundle, no provisioned image,
      image already held, cache not empty, guest asset uninspectable, guest predates
      the lane, no home-src share. Verified by execution for the bundle family in all
      three fixtures and for the already-held family in the orphan fixture:

        unsupported:macos-vz-orphan-diagnosis:image-already-held-by-pid-69456-precondition-unmet
        skip:macos-vz-orphan-diagnosis:image-already-held-by-pid-69456-precondition-unmet

      THE BINDINGS HAD TO MOVE TOO, and this is the part a source-only fix would have
      missed: both litmus step commands filtered the fixture's output through
      `grep -E '^(ok|violation|unsupported):<name>:'`, which would have DROPPED the
      new terminal line before the runner ever saw it. The grep now admits `skip`.

      [2026-09-21T06:56:48Z macos] Gate on the pushed tree: BUILD_RC=0, ok:test-baseline:ran=2476 new-red=0
      tolerated=0 stale=0, stamp fresh; pushed on osx-next at 61b3f785d with the
      pre-push hook's own checks passing (ok:linux-next-merged:1, not bypassed).

      ONE CASE WAS PROPOSED FOR THIS HELPER AND REFUSED, and the distinction is this
      row's finding rather than a detail of it.

      macneo ran a COPY of the fixture from /tmp. ROOT resolved to `/`, and the
      fixture answered no-app-bundle. Before this row that printed `unsupported:` and
      scored FAIL — loud, if misattributed. After it, a terminal `skip:` scores
      SKIPPED and leaves the rate silently. The proposal was to route that case
      through cannot_run with the rest. THAT WOULD HAVE TURNED A RED INTO A SILENT
      SKIP, introduced by the very fix meant to stop could-not-runs being misread —
      the "six characters that make a red disappear" run-litmus-test.sh:948 warns
      about.

      A RELOCATED SCRIPT IS NOT A COULD-NOT-RUN. "No app bundle" is a TRUE statement
      about `/` and a FALSE description of what happened: the fixture cannot tell
      whether it is looking at a checkout at all, which is the wrong-subject shape one
      level up from the version-skew case. cannot_run means "the HOST cannot answer
      this question" and must not also mean "this script does not know where it is".

      The agreed remedy is a named REFUSAL, not a skip, because `refused:` is in the
      runner's failure set at run-litmus-test.sh:966 — checked FIRST and
      short-circuiting, so it stays red whatever follows it:

          refused:macos-vz-orphan-diagnosis:root-is-not-a-tillandsias-checkout-<path>

      asserted BEFORE anything derived from ROOT is trusted (build.sh and crates/
      present). Proposed as a skip by macuahuitl-fedora, refused with this reason,
      and agreed; it is carried on the follow-up identity slice together with the
      --version half, NOT in this row's landed change.
