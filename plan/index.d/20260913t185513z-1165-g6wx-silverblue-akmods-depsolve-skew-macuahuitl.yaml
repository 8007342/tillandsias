      - 'the probe reports skew:… on a host with akmods layered and a kernel bump offered while kernel-devel-matched is absent from the repo, ok:no-skew otherwise, and never mutates the deployment'
      - 'the meta-orchestration preamble runs the probe on immutable Linux and carries the verdict into the handoff'
