    title: |
      On Silverblue, a host layering akmods (the NVIDIA stack drags it in) cannot apply a base update that bumps the kernel until the updates repo publishes kernel-devel-matched for that exact kernel: akmods' rich dependency `(kernel-devel-matched if kernel-core)` fires because kernel-core is present from the OSTree base, depsolve fails, nothing is staged, and the non-depsolving `--check` keeps saying "ready". Transient by construction; the decision (wait, temporarily unlayer, or pin) is the operator's, and the fleet needs to read the symptom correctly.
    context: |
      MEASURED on lenovinha 2026-09-13 (read-only): offered 44.20260913.0
      carries kernel 7.2.4 → 7.2.5; journal "Txn Upgrade … failed: Could not
      depsolve transaction; 4 problems detected" fourteen times 10:07-11:51
      local; Problem 1: akmod-nvidia requires akmods; akmods-0.6.2-14.fc44
      requires (kernel-devel-matched if kernel-core); every
      kernel-devel-matched version refused because it requires a kernel-core
      the base already provides and no repo kernel-core can be layered. The
      updates metadata is dated 2026-09-12T00:52 and the base commit
      2026-09-13T00:50: the image is a day ahead of the repo. No
      ostree-finalize-staged entries, no /run/ostree/staged-deployment — the
      failure precedes staging, which is why "ready, requires restart" (from
      --check and GNOME Software) is followed by a failed apply and nothing
      staged. The kmod matches the booted kernel; nothing is stale. yoga (no
      akmods layered; rocm) is the scope test: a clean apply there confirms
      akmods, not GPU.

      WHAT TO BUILD: a cheatsheet entry (docs/cheatsheets/runtime/) that
      names the symptom, the journal line to read, the rich dependency, and
      the three remedies as the operator's decision; and a read-only probe
      any Silverblue host can run at cycle start so the meta-orchestration
      preamble reports skew instead of a host guessing. NOT IN SCOPE: any
      deployment change by an agent.
    exit_criteria:
