      summary: |
        M5's EMPTY-REPO CASE HAS FIELD EVIDENCE AT LAST — from Windows, from
        someone else's account, which is the only way it could ever have been
        gathered.

        This packet's own next_action states the problem precisely: "verify the
        cloud submenu renders '(no repos)' with a ZERO-repo GitHub account —
        operator-gated (needs such an account attended)", and the M5 note at
        plan/index.yaml:31802 explains why nobody here could do it: "Requires
        real hardware and a GitHub account with zero visible repos; a non-empty
        list masks the bug entirely." The operator's own account has repos. It
        was untestable in-house by construction.

        WHAT WAS REPORTED, on a clean-slate Windows host, latest unstable:
        prompted about WSL2 -> restarted -> worked -> authenticated with a token
        -> "No projects found" for BOTH local and remote -> created a new repo
        -> it appeared in the cloud menu -> checked the project out -> all lanes
        down (operator notes the lanes are known issues on that version).

        WHY THIS IS THE GOOD OUTCOME: M5's EXPECTED-TODAY failure was
        '"(loading repos...)" forever' — a submenu that never resolves. The
        reported behaviour is a RESOLVED empty state, and it then transitioned
        correctly when the repo count went 0 -> 1. That is the whole property
        M5 describes, observed end to end on a zero-repo account.

        THREE CAVEATS, because this is testimony and the temptation is to bank
        it as a pass:

        1. STRING NOT CONFIRMED VERBATIM. The report says "No projects found".
           This ledger records the tray as rendering "(no projects yet)", en.toml
           as "No projects detected", and M5 as expecting "(no repos)" — three
           strings already known to disagree (see the 628-c7qd drift entries).
           A paraphrase by the relayer is the likeliest explanation and nothing
           here turns on it, but "the empty state resolved" is what is
           evidenced; the exact copy is not.
        2. WRONG PLATFORM FOR THIS PACKET. 598-kibt is the macOS v0.5 bundle.
           This observation is Windows. It does NOT close M5 for macOS.
        3. THIS PACKET IS ALREADY `completed` while its next_action still reads
           "The ONLY open item is M5's runtime half". A carry-forward on a
           terminal row is a dead letter no selector reads again — the exact
           shape check-carry-forward.sh exempts. If the macOS half still wants
           an attended zero-repo run, it needs a LIVE owner; it does not have
           one today.

        AND THE UNDERLYING macOS GAP HAS SINCE CLOSED IN CODE, which the M5 note
        predates. That note says cloud_projects_loaded "is set true ONLY in
        notify_icon.rs:1657 (Windows)" and "macOS action_host.rs:2192-2204 never
        touches it". At HEAD it does: crates/tillandsias-macos-tray/src/
        action_host.rs:2342-2343 sets it, :2315 resets it, and :3283-3298 is a
        test asserting the submenu renders the empty state. So the asymmetry
        that made M5 macOS-specific is gone; what remains unproven on macOS is
        the RUNTIME observation, not the wiring.
