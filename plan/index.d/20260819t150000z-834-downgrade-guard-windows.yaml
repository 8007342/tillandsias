    order: 834-r6vn
    status: in_progress
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "launching an older app binary against a newer enclave silently REBUILDS its images backwards — content-identity freshness cannot tell 'older' from 'different', so the rollback is invisible"
    deliverable: "an app older than the images it finds refuses to touch them and says so, unless --force-downgrade is passed; the refusal names both versions and the tag that proves it"
    pickup_role: windows
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [rust, images, versioning, fail-loud, developer-experience]
    estimated_hours: 4
    context: |
      OPERATOR-REPORTED, 2026-08-19, and it is a development-machine hazard
      first. A host accumulates app binaries:

        %LOCALAPPDATA%\Programs\Tillandsias\tillandsias-tray.exe   (installed)
        target/release/tillandsias-tray.exe                        (last local build)
        release-artifacts/tillandsias-tray-<v>-windows-x64/        (any number, unpacked)

      Measured on yolanda at report time, all three answered the SAME version
      string and differed only by embedded SHA:

        local build : 0.4.260817.1 (957262646)   2026-08-18 23:32
        installed   : 0.4.260817.1 (0bba6525f)   2026-08-17 12:48
        artifacts   : 0.4.260812.1, 0.4.260815.1

      47 commits had landed between the two 0.4.260817.1 binaries, because
      `./build.sh --check` does not bump the build counter and nothing else
      had. So the version could not distinguish them at all — which is the
      operator's point about why the auto-incremental counter matters.

      WHY THE ROLLBACK IS SILENT. Image freshness is decided by CONTENT
      identity (order 702-griq, `decide_image_build`): the source digest of the
      embedded assets versus the `io.tillandsias.image.source-digest` label. An
      OLDER app's assets differ from a NEWER image's, so the decision is
      `LabelMismatch -> Build`. It is structurally unable to read that as
      "older"; it reads it as "different", and rebuilds. The enclave is rolled
      back and nothing reports it. The operator's next launch runs yesterday's
      runtime with no indication anything moved.

      WHY A VERSION COMPARE IS LEGITIMATE HERE, when content identity is the
      rule everywhere else: methodology/versioning.yaml DECLARES this scheme
      monotonic — Major/Minor never decrease, YYMMDD "always increases with
      time", Build is "globally monotonic across all machines and branches",
      incremented "on every local build". Monotonicity is the entire purpose of
      the build counter, so "an image is tagged with a version greater than
      mine" is a sound statement that I am the older artifact. The guard
      answers ONLY that question and never decides what to build — that stays
      with decide_image_build.

      LANDED THIS SESSION (compiles, unit-tested):
        - crates/tillandsias-core/src/version_guard.rs — new module. Parses the
          CalVer, orders it COMPONENT-WISE AND NUMERICALLY (string order breaks
          at build 10 vs 9, which is exactly when a dev machine starts to
          matter), and decides Proceed / Refuse / ForcedProceed. 11 unit tests
          including: the build-counter numeric-vs-lexical trap, equal versions
          proceed (the ordinary launch must not break), a NEWER app over older
          images proceeds (an upgrade must never be obstructed), `latest` and
          digest tags ignored but not masking a real newer tag, max-across-
          images decides, empty enclave proceeds, and an unparseable app
          version yields NO verdict rather than a refusal.
        - crates/tillandsias-headless/src/main.rs — `--force-downgrade` flag
          (registered in known_flags and --help), carried to the chokepoint via
          TILLANDSIAS_FORCE_DOWNGRADE the same way TILLANDSIAS_DEBUG already
          is; `tillandsias_image_tags()`; `downgrade_refusal()`; and the call
          at the top of `ensure_image_exists` BEFORE the order-270 detach —
          the helper runs in its own session with no controlling tty, so a
          refusal raised inside it would reach the operator as a bare non-zero
          exit.

      NOT DONE YET, and the reason each is listed rather than assumed:
        - No litmus wires the fixture in. The unit tests exist; the gate does
          not.
        - The guard fires in tillandsias-headless (the binary that builds
          images). The Windows TRAY reaches image builds through the guest, so
          the refusal text surfaces wherever the tray surfaces guest errors —
          NOT yet verified end-to-end from a tray click.
        - No check that the guest headless staged INSIDE a tray matches the
          tray's own version; that is a different skew and probably its own
          packet.
    verifiable_closure: "a fixture that presents an app version older than a planted image tag and asserts ensure_image_exists refuses with the named message, plus a negative control at equal versions and a second at a NEWER app (both must proceed), plus one asserting --force-downgrade converts the refusal into a warned proceed"
    evidence:
      - "cargo test -p tillandsias-core --lib: 194 passed, 0 failed — including 11 version_guard tests"
