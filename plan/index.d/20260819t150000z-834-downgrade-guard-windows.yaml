  - packet_id: version-rolled-forward-to-260819-on-windows-next
    order: 834-p2ld
    status: in_progress
    desired_release: v0.5
    priority: p2
    kind: chore
    title: "VERSION rolled forward 0.4.260817.1 -> 0.4.260819.1 on windows-next so the local build is distinguishable from the installed one — and this collides with 643-64bx's push guard"
    deliverable: "the bump either reaches main through the sanctioned path or is reverted, and whichever happens is recorded so another host does not meet an unexplained divergent VERSION"
    pickup_role: operator
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [versioning, build, hooks, multi-host]
    context: |
      WHY IT WAS BUMPED. Operator direction, 2026-08-19: "fix the version
      conflict rolling forward — that's why our auto-incremental build versions
      are important on every build". Before the bump, the installed tray and
      the freshly built local one both reported 0.4.260817.1 despite 47
      commits between them, so neither the operator nor the new downgrade guard
      (834-r6vn) could tell them apart.

        scripts/bump-version.sh --bump-build
          NOTICE: Date has changed (260817 -> 260819), resetting build to 1
          Bumped build: 0.4.260819.1
        scripts/verify-version-monotonic.sh
          ok: 0.4.260819.1 is monotonically >= latest release v0.4.260817.1

      IT DIRTIES SIX TRACKED FILES — VERSION plus five Cargo.toml — which is
      exactly the 643-64bx deadlock: build.sh bumps, and the pre-push hook
      refuses a VERSION change on a non-main branch. 643-64bx is triaged as
      METHODOLOGY-GATED (its remaining criterion asks whether the local build
      counter should touch tracked files at all, which contradicts
      methodology/versioning.yaml's declared automatic bump).

      SO THIS PACKET IS OPERATOR-OWNED AND EXISTS TO STOP THE BUMP BECOMING A
      SILENT DIVERGENCE. Whoever picks it up must decide one of:
        (a) let it ride on windows-next and reconcile at merge with the LUB
            rule versioning.yaml already specifies ("At merge time, use LUB
            (max of conflicting values)");
        (b) revert the bump and keep 0.4.260817.1, accepting that local builds
            stay indistinguishable until 643-64bx is resolved;
        (c) route it through main, which is the only branch the guard permits.

      WHAT ANOTHER HOST WILL SEE if this is pushed: windows-next carrying
      VERSION 0.4.260819.1 while main is 0.4.260817.1. That is legal under the
      LUB rule but it is NOT obvious from the diff alone, which is why it is
      written down here.
    verifiable_closure: "VERSION on windows-next is either reconciled with main through the sanctioned path or reverted, and no host reports an unexplained version divergence"
