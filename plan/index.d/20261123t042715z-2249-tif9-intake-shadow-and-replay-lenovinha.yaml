      Operator-approved bundle-landing design (2026-11-22, relayed by macuahuitl-fedora). The intake gate (2248-zcqh) is only safe if what it defers is rarely what evicts: a member that passes intake and then reds the bundle gate costs the whole bundle a bisection. Shadow mode records intake's verdict and wall time on each landed PR's head without using it; the replay asks, for every head the full gate evicted since 2026-11-20, whether intake would have refused it too.
    exit_criteria:
