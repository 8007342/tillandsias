packets:
  - packet_id: capabilities-serves-a-cached-envelope-indistinguishably-from-a-measurement
    order: 1139-xe5m
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
