# Filed by linux_immutable (pirria), 2026-08-23T17:22:29Z.
#
# AFFORDANCES. Operator directive: agents should be more likely to pick eligible
# work when other agents are blocked on it. Three cycles of low-end work were
# blocked by 849-tz8g and said so only in PROSE, which no selector reads —
# `plan_answer "what is blocked by 849-tz8g"` returned unsupported, and
# blocking-counts did not list it. These two packets carry the blockage as
# depends_on edges so the blocker finally surfaces; the third records why the
# edge had to be filed rather than added.
packets:
  - order: 864-dvhk
    packet_id: low-end-tier-cannot-validate-the-expert-layers-commodity-hardware-claim
    desired_release: v0.6
    title: "a judge good enough to pass 853-6gz3's complement check may be too SLOW to fan out on this tier — quality and latency trade against each other at the floor"
    status: blocked
    kind: research
    pickup_role: linux
    priority: p2
    capability_tags: [experts, inference, low-end, cpu, image, verification]
    deliverable: cheatsheets/runtime/low-end-cpu-inference-floor.md
    depends_on:
      - inference-image-cannot-run-any-model-larger-than-0-5b
    estimated_hours: 4
    next_action: "On a low-end host that can obtain a 3-8B judge, measure ONE k=1 judge call end to end, then re-run the complement self-check with it; the packet turns on whether a judge that passes the check costs more than a tolerable answer."
    context: >
      MEASURED ON pirria 2026-08-23, and the result inverts the expected verdict.
      The low-end tier CAN afford the fan-out: at k=1 — the shape macuahuitl's
      Tier B result redirected the design to — a judge call is ~4.3 s, a
      complement pair ~8.6 s, so 30 s buys ~3 sub-queries and 60 s ~7. Latency
      is not the obstacle FOR A 0.5B JUDGE.

      But that judge fails 853-6gz3's OWN self-check. Running it against
      qwen2.5:0.5b:

        passage that DOES answer   "answers?" YES  "missing?" NO   coherent
        CSS passage that does NOT  "answers?" NO   "missing?" NO   CONTRADICTION

      Coherent in-corpus, self-contradicting out-of-corpus — exactly the case
      the programme exists to handle (821-73es). The complement mechanism
      CATCHES it, which is the operator's design working; but a layer whose
      judge is untrustworthy where it matters must refuse.

      THE PREMISE I ALMOST FILED WAS WRONG, and correcting it is the point of
      this packet. I first wrote that the image CANNOT load a judge above 0.5B.
      849-tz8g's own next_action explicitly retracts that framing: isolated
      loads PASS, the aborts occur under CONCURRENT residency, and serialising
      loads is a proven workaround — "a scheduling defect, not a ceiling". So
      the question is not whether a bigger judge LOADS.

      THE REAL QUESTION IS WHETHER IT IS FAST ENOUGH, and the arithmetic is
      discouraging. esmeraldinha measures phi3.5:3.8b at 6.53 tok/s decode on
      the same tier. A judge call must prefill the retrieved passage (~380 tok
      at k=1) and emit a short verdict (~30 tok). At 3.8B that is roughly
      20-30 s per call against ~4.3 s at 0.5B — so a complement PAIR costs about
      a minute, and the fan-out that made this design affordable disappears.
      QUALITY AND LATENCY TRADE AGAINST EACH OTHER AT THE FLOOR: the judge that
      passes the self-check is the judge that cannot fan out.

      NOT TESTED HERE, and the reason is worth recording: this host holds only
      nomic-embed-text and qwen2.5:0.5b, and the inference container has no
      registry egress (curl to registry.ollama.ai returns 000 with the proxy
      down), so no larger judge can be obtained to measure. The dependency below
      is for a larger judge REACHABLE on a low-end host, not for a fix to a
      ceiling that 849-tz8g says is not there.
    exit_criteria: >
      (1) The complement self-check is re-run on the low-end tier with a judge
      the image can load above 0.5B, and the out-of-corpus contradiction either
      disappears or persists — either answer closes this. (2) The per-call
      budget is re-measured for that judge, since a larger model changes the
      ~4.3 s figure this packet's fan-out arithmetic rests on. (3) 853-6gz3's
      commodity-hardware claim is recorded as VALIDATED or SCOPED (e.g. "runs
      on hosts that can load a 7B judge"), not left implicit.

  - order: 864-c956
    packet_id: memory-bandwidths-effect-on-inference-is-unmeasurable-fleet-wide
    desired_release: v0.6
    title: "DRAM channel count cannot be priced from a 0.5B model, and the low-end hosts hold no larger one to measure with"
    status: blocked
    kind: research
    pickup_role: linux
    priority: p3
    capability_tags: [inference, capabilities, hardware, low-end, image]
    deliverable: cheatsheets/runtime/low-end-cpu-inference-floor.md
    depends_on:
      - inference-image-cannot-run-any-model-larger-than-0-5b
    estimated_hours: 3
    next_action: "esmeraldinha already holds phi3.5:3.8b: run the shared harness at that size there and on any DUAL-channel Alder Lake-N host, and compare decode — that pair answers it without a new image."
    context: >
      MEASURED across the two Alder Lake-N hosts (859-86kr). A 0.5B model does
      not saturate even ONE DDR4 channel: decode moves 41 tok/s x 0.40 GB per
      token-pass = 16.3 GB/s on the dual-channel host and 29.64 x 0.40 =
      11.8 GB/s on the single-channel one, which is 55% of that host's
      ~21.3 GB/s ceiling.

      CONSEQUENCE: at the only generative size the image can run, bandwidth is
      INVISIBLE. The dual-channel host measures 1.38x faster, not the ~2x a
      bandwidth model predicts, and that 1.38x has no established cause —
      bandwidth is ruled out by the arithmetic above, and DRAM data rate and
      sustained clock cannot be read without root on either host. A capability
      row records channel count that nobody can price.

      This also cost a published claim: 855-wrr3 originally concluded "same
      cores, roughly double the bus" from a decode ratio, and that reasoning was
      retracted in 859-86kr once the arithmetic was done. The question is not
      settled, it is UNASKABLE at 0.5B. esmeraldinha sees phi3.5:3.8b at
      6.53 tok/s x ~2.2 GB = ~14.4 GB/s, approaching its ceiling — that IS the
      size where the question becomes answerable.

      WHAT ACTUALLY BLOCKS IT is model availability on the hosts that would
      answer it, not an image ceiling: 849-tz8g's next_action records that
      isolated loads pass and the aborts are a concurrent-residency scheduling
      defect. pirria simply holds no model above 0.5B and its inference
      container has no registry egress (curl to registry.ollama.ai returns 000),
      so the measurement cannot be taken here as provisioned. esmeraldinha
      already holds phi3.5:3.8b, which makes it the cheaper host to answer this
      on — it needs a dual-channel counterpart, not a new image.
    exit_criteria: >
      (1) Decode measured at 3-4B on one dual-channel and one single-channel
      Alder Lake-N host with the shared harness. (2) A stated verdict on how
      much channel count is worth on this tier, with the GB/s arithmetic shown.
      (3) If the answer is "materially", capability rows should carry channel
      count as a scheduling input rather than a recorded curiosity.

  - order: 864-6qsv
    packet_id: set-field-cannot-write-a-list-valued-reference-field
    desired_release: v0.6
    title: "a blocking edge cannot be ADDED to an existing packet — set-field stringifies every value, so blockage stays prose and reference debt grows"
    status: ready
    kind: defect
    pickup_role: linux
    priority: p2
    capability_tags: [plan, tooling, ledger, affordances, selector]
    deliverable: crates/tillandsias-plan/src/fragments.rs
    depends_on: []
    estimated_hours: 3
    next_action: "Make lww_value_lines accept a structured value (or add a set-field --list flag) so `set-field <pkt> depends_on <id>` writes a YAML sequence, then re-file the 849-tz8g edges through it."
    context: >
      FOUND WHILE TRYING TO RECORD AN AFFORDANCE, 2026-08-23. The operator asked
      that agents be likelier to pick work others are blocked on. The mechanism
      exists: `blocked-by` and `blocking-counts` read depends_on edges. The
      blockage did not.

      `set-field 824-6qxh depends_on "[inference-image-...]"` reports ok and
      writes value: '[inference-image-...]' — a QUOTED SCALAR. lww_value_lines
      (fragments.rs:628) runs every value through
      `serde_yaml::to_string(value: &str)`, so a list can never come out the
      other side. No edge forms: blocking-counts still omits the blocker and
      `plan_answer "what is blocked by 849-tz8g"` still answers unsupported.
      Reverted rather than left in place.

      SO THERE IS NO SANCTIONED WAY TO ADD depends_on TO AN EXISTING PACKET.
      Declaring it at FILING time works. Re-declaring the packet under
      `packets:` is a G-Set no-op, which the set-field fragment header says in
      as many words. set-field is the documented corrector of "ANY field"
      (642-fedr) and cannot correct this class.

      WHY THIS IS NOT COSMETIC. The ledger already warns about exactly this
      shape — `warning (organic reference debt): <pkt>: split_into carries a
      prose annotation '...'` — on split_into, another list-valued reference
      field. The debt is organic because the tool that writes these fields can
      only write prose. Every agent that discovers a dependency AFTER filing
      either hand-edits the folded ledger, files a new packet to carry the edge
      (what this cycle did), or writes prose no selector reads — and the third
      is the cheapest, which is why blockage keeps living in event summaries.
    exit_criteria: >
      (1) set-field can write a YAML sequence to a reference field, verified by
      a round-trip test that the value re-reads as a resolvable edge and not as
      a scalar. (2) blocking-counts reflects an edge added this way. (3) A pass
      over the existing `organic reference debt` warnings decides which are
      genuine edges that should be converted and which are deliberately prose.

