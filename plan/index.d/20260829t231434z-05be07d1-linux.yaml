      summary: >
        THE OPERATOR'S QUESTION — "does the fix belong in the toolbox or on the host?" — ANSWERED WITH MEASUREMENT. It is BOTH, split on a line nobody had drawn, and every clause below was measured on this machine rather than reasoned about.    nvidia-container-toolkit   -> TOOLBOX. No rpm-ostree layering, no reboot.   the generated CDI spec     -> must describe the HOST, not the toolbox.   the nvidia-cdi-hook binary -> must exist ON THE HOST: crun executes it during                                 container setup, so a toolbox-only copy is                                 referenced by the spec and never found.  STEP 1 — REPRODUCE, AND THE WARNING IS NOT WHAT THE PACKET EXPECTED. I could not find any CUDA-missing warning text in the repo, and the packet says that absence is itself a finding. What I found instead is worse than a warning: THE PROBE LIES IN THE OPTIMISTIC DIRECTION.    scripts/inference-tier-probe.sh decides `tier:gpu-cuda` from `nvidia-smi -L`   on the HOST. It reports gpu-cuda here. But:      $ podman run --rm --device nvidia.com/gpu=all <image> true     Error: setting up CDI devices: unresolvable CDI devices nvidia.com/gpu=all     rc=126    The container could not get the GPU at all. And accel_probe.rs computes       let cdi_ok = effective_tier == "gpu-cuda";   from that same tier — which is derived from the SAME `nvidia-smi` signal as   its own `nvidia_present`. SO cdi_ok IS CIRCULAR: on any host where nvidia-smi   works, `cdi-spec-missing` can never fire, and the capability envelope claims   the `container` lane works when it does not. That is the identical   host-binary false-green class as the nix probe in 799-tb7q, in the accel lane.  STEP 2 — THE MEASUREMENTS THAT DECIDED IT:    * NO CDI SPEC EXISTED. Neither ~/.config/cdi nor /etc/cdi was present, and     nvidia-ctk was absent from the host. The driver itself was fine (610.57.04,     nvidia-smi lists the 3070) — so the host half was never the problem.    * A TOOLBOX-GENERATED SPEC IS 98% RIGHT AND 100% BROKEN. Generated inside the     toolbox with no flags: 55 paths, 2 absent on the host —     /etc/vulkan/implicit_layer.d/nvidia_layers.json (the host keeps it under     /usr/share) and the hook. ONE wrong path is enough; crun refuses with     "cannot stat …: No such file or directory".    * `--driver-root=/run/host` FIXES IT, AND ONLY BECAUSE OF A SILVERBLUE FACT:     /run/host is a symlink to /. A path discovered through it is already     host-absolute, so the spec needs no rewriting. 60 paths, 0 absent.    * PODMAN DOES NOT LOOK IN ~/.config/cdi. Its defaults are [/etc/cdi,     /var/run/cdi] — neither user-writable without root, and /var/run/cdi is     tmpfs. 665-zddn's recorded remediation (`--output ~/.config/cdi/nvidia.yaml`)     IS WRONG FOR THIS PODMAN unless cdi_spec_dirs is configured to include it.     Configuring that in the user's containers.conf keeps the whole fix     sudo-free and reboot-persistent.    * TWO SPECS DECLARING nvidia.com/gpu MAKE THE DEVICE "UNRESOLVABLE". Leaving     a second generated file beside the first reproduces EXACTLY the original     error message, which reads as "no spec at all". Cost me an hour; the fix     script now prunes siblings.    * SELINUX IS THE LAST BLOCKER AND IT IS SEPARATE FROM CDI. With the spec     resolving, a rootless container still got "Permission denied" on     /dev/nvidiactl: the nodes are xserver_misc_device_t and the host is     Enforcing. `--security-opt label=disable` — which this repo already uses     for the nix store — makes the devices visible. Callers need it; that is a     fact about the lane, not something the spec can fix.  PROVEN END TO END, no explicit flags beyond the SELinux one:     podman run --rm --security-opt label=disable --device nvidia.com/gpu=all <img>       -> /dev/nvidiactl, /dev/nvidia-modeset, /dev/nvidia-uvm present       -> /usr/lib64/libnvidia-ml.so.1 injected       -> rc=0 Where the same command before this work returned rc=126, unresolvable.  DELIVERED: scripts/ensure-nvidia-cdi.sh — idempotent (verified by running it twice), installs the toolkit in the toolbox, copies the hook to the host, configures cdi_spec_dirs, regenerates the spec against the host root, prunes duplicate specs, and VERIFIES every path in the generated spec exists on this host before declaring success. Re-running it is exactly what a driver update needs, which is 665-zddn's stale-spec strand made automatic.
