      summary: >
        EXIT CRITERION ANSWERED STATICALLY — DO macOS AND WINDOWS SHARE THE GAP? NO, AND THE COMPARISON INVERTS THE INTUITION. All three lanes read from trunk; no host needed for this half, and I say below exactly which half still does.  macOS — BOUNDED, BY AN EXPLICIT AND AUTHORITATIVE POLICY, AND ALREADY FIXED. crates/tillandsias-vm-layer/src/vz.rs guest_sizing() is a pure function of (host_cores, host_memory): memory is half the host, less HOST_RESERVED_MEMORY_BYTES (6 GiB), capped at GUEST_MAX_MEMORY_BYTES (32 GiB), rounded down to a whole GiB. Its own comment states the rule that matters — 'No lower clamp: the reserve wins (978-juw4)' — and records that the old floor is exactly what made a small host hand out more than it had. The vCPU path carries the same correction: 80% of logical cores, ceiling `host_cores.saturating_sub(1).max(1)`, so the host always keeps a core where there is one to keep. VERIFIED BY HAND against the 2 GiB / 2-core case macneo reported: half=1 GiB, after_reserve=0 (saturating), so memory=0 and start() refuses loudly instead of booting; cpus=1, host keeps 1. The bug macneo found is NOT present on current trunk. If two tests still assert the old behaviour they are asserting a pre-978-juw4 world and are themselves the defect — I did not check that and it is worth someone's grep.  Windows/WSL2 — BOUNDED INCIDENTALLY, NOT BY POLICY. Nothing in the tree configures a WSL2 memory bound. `.wslconfig` appears in crates/tillandsias-vm-layer/src/wsl.rs only as OPERATOR ADVICE inside error text (a defaultVhdSize remediation hint), never as something Tillandsias writes. So the guest is bounded only by whatever the WSL2 runtime defaults to on that machine — a bound Tillandsias neither sets, reads, nor asserts. Not the Linux gap, but not the macOS policy either: it is a third state, 'bounded by someone else's default', and it is unfalsifiable from inside our tree.  Linux — THE ONLY LANE WITH NO BOUND AT ALL, which is this packet.  THE INVERSION IS THE FINDING. The lane where bounding a guest is HARDEST — a VM, where memory must be decided before boot and cannot be changed after — got a considered policy with a named reserve, a cap, a rounding rule, a loud refusal below viability, and a packet (978-juw4) devoted to fixing its floor. The lane where bounding is EASIEST — a cgroup, where it is one flag on the podman command line and adjustable at runtime — got nothing. The difficulty of the mechanism is inversely correlated with the care taken over the policy, and the plausible reason is that a VM FORCES the question at boot while a cgroup lets you never ask it. An unset cgroup limit is not a decision anyone had to make, so nobody made one.  THAT ALSO EXPLAINS HOW 3d7fb86da PASSED REVIEW. On a lane where the number must be computed to boot, computing it IS most of the work and a pure helper is a reasonable slice. On this lane the helper was the ONLY work anyone did, because nothing downstream ever demanded the value. There was no boot to fail.  WHAT STILL NEEDS A REAL HOST, since this half is static and I will not imply otherwise: whether the macOS guest actually receives the computed size at the VZ boundary (I read the function, not a running VM), and what a Windows host's WSL2 default actually is in practice. Both are observations, not greps, and neither is mine to make.  METHOD, and its limit: three lanes read from source on one host, n=1 for the Linux runtime evidence and n=0 for the other two — I have no macOS or Windows guest and did not pretend to. The macOS verdict rests on a hand-evaluation of a pure function, which is exactly as strong as the function being pure and exactly as weak as my assumption that the call site passes it real host numbers.
