  title: 'No Lua file tests absoluteness by its first character; a C:/ path is absolute'
  context: >-
    On native Windows fixture.plan_binary() returns C:/.... A `p:sub(1, 1) ~= "/"` test read it as relative and
    prefixed the repo root, so the path pointed nowhere. yolanda's msys run of #1627 measured two reds from it:
    podman-sync-budgets never spawned the plan binary (rc=nil), and pretooluse-command-policy handed its hook stub an
    unrunnable TILLANDSIAS_PLAN_BIN, which allowed everything unchecked. #1627 fixed its own three files. This sweep
    fixes the 14 others: 12 fixtures use fixture.is_abs; test-groundtruth-regime-fails-closed and shadow-intake.lua
    (which do not load common.fixture) take the inline drive test. A new guard, check-lua-posix-only-absolute.lua,
    refuses the shape unless the same line accepts a drive path. It was red on the unswept trunk with exactly the 14
    (violation:lua-posix-only-absolute:14). Its fixture, gate step 152, plants the shape and its controls and reads
    the corpus.
  exit_criteria:
