        toggling only the shim:

          without yq   Total 19 (executed 17, skipped 2)
          with yq      Total 28 (executed 26, skipped 2)

        NINE TESTS WERE NEVER SELECTED on this host. Not skipped-and-reported —
        absent from the count, with the suite printing a confident green over
        two thirds of itself. The grep fallback in get_litmus_tests_for_spec was
        under-selecting by 35%. The nine: fold-incompleteness-typed-shape,
        gate-stamp-portable-digest, macos-portability-residuals,
        release-runbook-external-preconditions-shape, script-exec-bit-shape,
        selector-urgency-not-inert-shape, sidecar-arch-derivation,
        sidecar-is-a-build-graph-input, sigpipe-verdict-pipeline-shape.

        THIS IS A FLEET PROPERTY, NOT A LENOVINHA ONE. Any host without a host
        `yq` reads its test list through that fallback: the Silverblue boxes
        (lenovinha, yoga) certainly, and macOS unless brew has put one on PATH.
        Those hosts have been reporting suite verdicts computed over a subset
        nobody could see, and the subset is silent — there is no "9 not
        selected" line anywhere in the output.

        TWO THINGS WORTH DOING THAT I DID NOT DO HERE. First, the fallback
        should SAY it is a fallback: a suite whose test list came from grep
        rather than yq should print that once, so a green from a degraded
        selector is distinguishable from a green from a complete one. Right now
        they are identical, which is the absence-reads-as-success shape again.
        Second, someone on a host WITH yq should compare full-suite selection
        counts against a Silverblue host to find out whether ci-release is the
        only suite affected — I only measured this one.
