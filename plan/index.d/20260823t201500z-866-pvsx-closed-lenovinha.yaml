    event:
      type: progress
      ts: "2026-08-23T20:15:00Z"
      agent_id: linux-lenovinha-fable5-20260823T195304Z
      host: linux_immutable
      summary: |
        I FILED THIS PACKET YESTERDAY WITH THE WRONG CAUSE, AND THE CORRECTION
        IS MORE USEFUL THAN THE FIX. I wrote that the fold "silently ignores
        unrecognized entry keys" and that the general case was "untouched" —
        that detection was the missing piece. It was not. `fragment_coverage_gaps`
        (fragments.rs) has caught this exact shape all along: an `events:` entry
        with no `event:` block is already flagged, with no requirement that it
        carry definition fields.

        WHAT IS ACTUALLY BROKEN IS WHERE THAT ANSWER GOES. The guard runs at
        exactly two call sites, both inside compaction (`compact` and
        `compact_text`), and what it does with a gap is REFUSE TO DELETE the
        fragment. That protects the bytes on disk and says nothing to the person
        who wrote them. Worse, it only runs when a compaction runs, and
        compaction runs when the fragment COUNT makes it eligible — so a dropped
        entry in a small overlay is reported to nobody, indefinitely. My own
        fragment was never compacted; I ran `check`, and `check` never asked.

        So this was a REPORTING-CHANNEL gap, not a detection gap, and I had
        invented the cause to fit the symptom — 797-5kqe, the same shape this
        ledger keeps recording. The evidence was available before I filed:
        the guard is 300 lines from the fold I read.

        THE FIX, and it is small because the detection already existed:
        `fragments::overlay_coverage_gaps(index)` runs the SAME pass at READ
        time over the current overlay, and `check` emits one
        `dropped-entry: <path>: <reason>` line per gap. Reported, never refused
        fleet-wide — the 699-dycj argument applies unchanged: build.sh runs
        `check` on every host, so a refusal would turn one host's typo into
        every other host's red build on a file they did not write.
        `--strict-fragments` arms the refusal for callers that cannot tolerate a
        partial write, exiting 3 (EXIT_FOLD_INCOMPLETE), distinct from 1.

        A DROPPED ENTRY NOW LANDS THE VERDICT WHERE AN UNREADABLE FILE DOES:
        `ok:` becomes `incomplete:`. Announcing a sound ledger when filed work
        is absent from it is the precise lie 796-4ydb was filed against, and an
        unusable entry makes the corpus partial for the same reason an
        unparseable file does. The two causes stay NAMED separately in the
        verdict, because one is repaired by fixing a parse error and the other
        by rewriting an entry, and a reader who confuses them repairs the wrong
        thing.

        I ALSO SPLIT THE DIAGNOSIS, which is the part I would keep if I could
        keep only one thing. Both mistakes reach the same line and they are
        repaired differently:
          * definition fields present -> "a packet DEFINITION under the wrong
            key (812-d45t); move it under `packets:`", listing which fields.
          * otherwise -> "unrecognized key(s) <names> — the fold has no handler
            for it and skips it in silence, so this write did NOT land
            (866-pvsx); use the `set-field` subcommand rather than hand-writing
            the entry", naming the offending key.
        Reporting my `set_field:` typo as 812-d45t would have sent me hunting
        for a lost packet definition that never existed. The first message a
        defect gives you decides where you look next.

        VERIFIED, four scenarios plus a negative control, on the reproduction of
        the original defect:
          A. `set_field:` entry  -> named, cites 866-pvsx, does NOT cite
             812-d45t, verdict `incomplete:`, exit 0
          B. misplaced definition -> named, cites 812-d45t and says where to
             move it, does NOT cite 866-pvsx
          C. same corpus with `--strict-fragments` -> exit 3
          D. well-formed event -> `ok: 1 packets ...`, silent
        Hermetic tests: `overlay_coverage_gap_tests` 5/5 (the four above plus an
        unparseable base, which must yield no gaps rather than panic — `check`
        has its own louder answer for that and this pass must not change how an
        unreadable ledger fails). Full crate suite 213 + 24 green.

        NO FALSE POSITIVES ON THE LIVE CORPUS: `tillandsias-plan check` against
        the real ledger reports `ok: 552 packets, ids unique, live references
        sound (8 parked-block edges)` — unchanged. That mattered more than the
        unit tests: a read-time guard that fires on the existing 13-fragment
        overlay would be switched off within a day.
