           those drivers, but it sounds like a reasonable mount for legitimate uses."

        READ THE SECOND HALF AS CAREFULLY AS THE FIRST. This is a qualified yes, not an unqualified one. The operator states plainly that the exposed surface is NOT fully known, and approves the mount on the strength of its legitimate use while requiring that the unknown be written down and audited rather than forgotten. An implementer who takes the "yes" and drops the boundary documentation or the audit has not implemented this decision.

        WHAT IS AUTHORISED: on WSL2 hosts, and only there, the inference container gets /usr/lib/wsl bind-mounted READ-ONLY, added in build_inference_run_args where the lane's exact flags are assembled, gated on a host check that the path exists — so it can never apply on native Linux or on macOS, where that path does not exist. With the mount, the dxg device gains lanes=[host-native, container] BY MEASUREMENT (arm 2b, 2026-09-19: the container enumerates the same two devices as the host, Dozen INTEGRATED_GPU driverID=23 beside llvmpipe CPU driverID=13), so accel_envelope's existing container-lane predicate reports it usable and state() needs NO change. Criterion 1 is then satisfied from evidence rather than from a widened literal, which is what the earlier coordinator ruling required.

        THE BOUNDARY, to be documented where the mount is added AND carried here:
          WHAT IT IS: the projected Windows driver store (/usr/lib/wsl/drivers, thousands of .inf directories) plus the WSL userspace libraries (/usr/lib/wsl/lib: libd3d12.so, libd3d12core.so, libdxcore.so). dzn resolves the real D3D12 device out of the driver store; without it CreateDevice fails and the loader falls back to the software rasterizer.
          WHAT IT IS NOT: no user data, and no writable surface — the mount is read-only.
          WHAT IS UNKNOWN: everything else under that tree. Nobody has enumerated what /usr/lib/wsl actually exposes inside a container beyond the drivers and the three libraries named above. That is the operator's stated reservation and it is why the audit row below exists.
          EXIT CRITERION for the mount itself: a container carrying it enumerates THE SAME DEVICES AS THE HOST, with the dzn-less-image negative control from 1265-dyyb beside it — because a dzn-less image also enumerates llvmpipe only, and without that control a passing mount cannot be distinguished from an image that simply could not have used it.

        THE AUDIT IS A DEBT ON THE LEDGER, NOT A MEMORY: filed as 1267-fj2z, cited from the mount's own comment in the code, under the open SELinux and hardening family beside 1252-qyii. The mount ships documented; the enumeration of what it exposes follows.

        WHAT THIS DOES NOT DECIDE: nothing here says the forge or any other container may take this mount, and nothing here makes it a default on non-WSL2 hosts. It is the inference lane on WSL2, read-only, gated on the path existing.
