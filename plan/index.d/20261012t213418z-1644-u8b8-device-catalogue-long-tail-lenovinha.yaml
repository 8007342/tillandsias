    title: |
      Grow the device catalogue (1643-q3at, 127 devices) to the long tail the operator asked for: hundreds of KB covering many brands, so a mobile-first preview can be checked on the phones people actually hold.
    context: |
      1643-q3at shipped the catalogue, resolver, generator (scripts/lua/build-device-catalogue.lua) and manufacturer overlay (crates/tillandsias-core/data/devices/overlay.yaml). Its seed is Playwright plus Chrome DevTools plus four overlay phones. The operator asked for a MASSIVE table. This row grows the overlay; the resolver does not change.
      Coverage wanted:
      - Samsung: Galaxy S (including S24/S25 Ultra), A, Z, Note and Tab lines.
      - Google: Pixel back to Pixel 6.
      - Xiaomi, Redmi and POCO.
      - OnePlus and Nord.
      - Sony: the Xperia 1, 5 and 10 lines.
      - Motorola, Honor, Oppo and Vivo.
      - Apple: iPads.
      - Common laptops.
      Sourcing rules, unchanged from 1643-q3at:
      - Use first-party figures (the manufacturer's own spec page or newsroom) wherever reachable, one source URL per entry.
      - Where a maker publishes only panel figures, use the same labelled derivation: dpr from the nearest Android density bucket, viewport = resolution / dpr, `derivation` stated.
      - No GSMArena scraping, WURFL or DeviceAtlas.
      - Release months go in released.yaml, which drives "newest flagship".
      Known blockers from 1643-q3at:
      - samsung.com renders spec figures client-side; try Samsung newsroom spec sheets.
      - Sony's spec pages block automated fetches.
    exit_criteria:
      - 'the generated catalogue holds >= 500 devices across >= 12 brands'
      - 'every entry still carries a source kind, URL and licence (litmus:device-catalogue-shape stays green), and every derived value is labelled as derived'
      - '"galaxy s24 ultra" and "galaxy s25 ultra" resolve exactly (no longer approximated), and the 1643-q3at resolver tests stay green'
