      - "the WSL build lane is provisioned from the same package list as the podman toolbox, or the two lists are made one; pre-fix result: FAILS (with-tillandsias-builder.sh:334-343 is podman-only and unreachable on Windows)"
      - "the remaining gate steps are swept for other tools required but undeclared — the openssl row shows this shape recurs; pre-fix result: UNKNOWN, never audited"
      - "NEGATIVE CONTROL: on a host that HAS rg the manifest check stays green and emits no remedy for a tool already present (:146 warns against that exact noise); pre-fix result: PASSES, must not regress"
