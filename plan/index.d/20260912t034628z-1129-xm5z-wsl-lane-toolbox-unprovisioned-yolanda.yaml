        summary: |
          Found as a gate refusal on the first Windows host up since
          2026-09-06, landing the 1122-xi2f confirmation. Filed at the
          coordinator's direction (macuahuitl-fedora).

          Unblocked by provisioning the LANE rather than the workstation:
          dnf install -y ripgrep inside the tillandsias-build distro, which
          methodology multi_host_development.toolbox_first_scripts.rule
          permits because the rule forbids a host package install only WHEN
          A TOOLBOX CAN CARRY THE TOOL, and here the toolbox demonstrably
          cannot. Nothing was installed on the operator's Windows system.

          Verified in the environment that actually failed, not the
          convenient one: running the check from Git Bash passed instantly
          and proved nothing, because rg exists on the Windows side. Re-run
          INSIDE the distro it answers OK: 491 cheatsheet references
          resolved. That difference in where a check is run is the same
          distinction this packet is about.
