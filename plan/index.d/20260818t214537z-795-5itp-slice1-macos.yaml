      summary: |
        SLICE 1 LANDED. Deliberately NOT closed — criterion 1 names ten sites
        and one is migrated. Left `ready` rather than `in_progress` so the next
        host can pick it up; the remaining slices are enumerated below.

        THE PACKET'S PREMISE NEEDED THREE CORRECTIONS, all verified at HEAD
        before any code moved. Two of them make the job SMALLER than filed:

        1. CRITERION 2 WAS ALREADY MET IN PRODUCTION. The packet's problem
           statement is "nine independent bounds policies is nine independent
           chances to get the maximum wrong". Measured: eight of the nine files
           ALREADY cite one named constant, MAX_MESSAGE_BYTES = 65_536
           (control-wire/src/lib.rs:52), and every bounded READ in the tree caps
           at exactly that value with identical semantics. The single "divergent"
           file, provisioning.rs, turned out to be a mock responder inside
           `#[cfg(all(test, unix))] mod tests` (:153) — not production framing at
           all. What is actually duplicated is the reader/writer MECHANICS, not
           the policy. That is still worth removing, but it is a readability and
           cancel-safety argument, not the safety argument the packet makes.

        2. THE "Q-OPEN" BLOCKING CRITERION 2 WAS A GHOST. MAX_MESSAGE_BYTES's
           doc comment cited "design.md Q-OPEN (size-cap reconciliation)" over
           McpFrame's 4 MiB, which reads as "you cannot honestly claim ONE
           constant yet". It is stale: order 505 retired McpFrame, it is
           constructed NOWHERE in the tree (only pattern-matched to be refused —
           control_dispatch.rs:466 → Unsupported), and the enforcement its cap
           pointed at lived in `src-tauri/`, a directory that no longer exists.
           MAX_MCP_FRAME_BYTES survives only as the per-LINE cap on the unrelated
           NDJSON socket (779-dqsv). There is exactly one framing ceiling.

        3. THE SAME COMMENT WAS FALSE ABOUT ENFORCEMENT, and this is the one
           worth carrying. It claimed an oversize prefix "trigger[s] an
           `Error::PayloadTooLarge` response and the connection is closed".
           ErrorCode::PayloadTooLarge is constructed nowhere outside
           control-wire's own tests — no framing site has ever sent it. A peer
           that sends an oversize frame learns only that the wire went away.
           Corrected in place at lib.rs, with the check that retired each claim.
           TEN sites, not nine: tests/vsock_listener_e2e.rs:56 frames identically
           and the filed list omits it.

        WHAT LANDED.
          * transport::control_frame_codec() — the ONE construction site, all
            four parameters pinned. max_frame_length is the one that must never
            be defaulted: LengthDelimitedCodec::new() is 8 MiB, 128x looser than
            the bound every read site enforces today.
          * vsock_client.rs migrated onto Framed — the real production host→guest
            path for BOTH macOS and Windows. Chosen as first because its bounds
            already matched (nothing moves) and its stream field is private with
            no accessor, no split and no into_inner, so the buffer-handoff hazard
            that makes the other sites dangerous cannot arise here.
          * router-sidecar retro-fitted onto the shared constructor; it had
            hand-built the identical builder, the one other place the bound
            could drift.

        THE BOUND HAD NO TEST ANYWHERE — that is the real finding of this slice.
        Eleven read sites cap at 64 KiB and NOTHING asserted it, in either
        direction, before today. A migration that dropped max_frame_length would
        have widened every one of them 128x and shipped green. Six tests added,
        each falsified:
          - remove max_frame_length      -> bound test RED (specifically)
          - bound off by one byte        -> bound test RED (pins inclusivity)
          - flip to little_endian        -> golden byte-identity test RED
          - drop the outbound pre-check  -> outbound negative control RED
          - drop the inbound error remap -> inbound negative control RED
        Each falsification hit its own test and left the others green.

        CRITERION 3 IS THE EXPENSIVE PART, MEASURED. "The same error surface as
        before" is not free: falsifying the pre-check showed the codec refuses an
        oversize encode with kind InvalidInput (not InvalidData) and the decode
        side reports the literal "frame size too big". Callers here have always
        seen InvalidData plus "control frame too large" / "inbound control frame
        too large". Both are preserved explicitly and pinned by tests. Seven
        distinct error strings exist across the ten sites, and two sites
        (vsock_exec, main.rs) do not even use io::Error — they return
        Result<_, String>. Preserving the surface is MORE code than the swap.

        INTEROP IS PROVEN, NOT ASSUMED, which is what makes a partial migration
        safe: four host-shell tests drive the migrated Framed client against
        fake guest peers that STILL FRAME BY HAND, and pass. Those peers must
        stay hand-rolled for exactly that reason; a comment now says so.

        REMAINING SLICES, with the hazard that separates them:
          - vsock_server.rs, pty_vsock_bridge.rs, hvsocket.rs each read the
            Hello by hand then hand the stream (or its split halves) onward.
            Framed OWNS a read buffer; building one for the handshake and
            dropping it to reclaim the stream silently discards any pipelined
            bytes — no error, permanent desync, on the interactive PTY path,
            and only when the peer pipelines. Use Framed::into_parts, never
            into_inner, and never migrate one function of a pair.
          - pty_vsock_bridge.rs:241 currently DROPS one oversize message and
            keeps the session alive (`continue`). A Sink error is terminal, so
            a naive swap turns that into "kill the PTY session". macOS-only, so
            no other host's CI would see it.
          - tray/mod.rs cannot migrate as-is: blocking std UnixStream, thread
            per connection, and a subscriber registry typed
            Arc<Mutex<UnixStream>> that cannot hold a Framed. Disposition it
            under criterion 1's second branch rather than rewriting the tray
            onto a runtime.
          - hvsocket.rs is Windows-only, has no production callers (the tray
            uses vsock_client.rs), and its only tests are #[ignore]d live-WSL
            ones. Not verifiable from this host; last, on Windows.
        Filed alongside: 828-r2ek (the eight unbounded WRITES), 828-itr9 (three
        invariant tests that go vacuous rather than red when this migration
        renames their anchors — filed BEFORE the slice that would trip them),
        828-etu6 (an unrelated pre-existing red test found by the full run).

        NOT DONE, SAID PLAINLY: the named verifiable_closure
        `litmus:one-length-delimited-framing-impl` does not exist and cannot
        pass yet — its source scan demands at most ONE u32::from_be_bytes in
        crates/ and there are 16 (was 18). Writing the litmus now would mean
        writing one that fails, so it belongs with the last migration slice.
