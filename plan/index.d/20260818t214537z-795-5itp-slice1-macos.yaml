packets:
  - packet_id: proxy-cache-policy-test-pins-a-launch-literal-a-supervisor-broke
    order: 828-etu6
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "tests/proxy_cache_policy.rs is RED on osx-next: it greps entrypoint.sh for the literal `exec squid -N`, which the squid-supervisor wrapper displaced — the invariant it guards still holds"
    deliverable: "the parse-before-launch assertion matches the supervised launch line, or is rewritten to test the ordering property rather than a literal"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [rust, ci-gates, proxy, fail-loud]
    estimated_hours: 1
    context: |
      OBSERVED 2026-08-18 on osx-next at a474ba5ff, during the 795-5itp
      workspace test run. `cargo test --workspace` is 801 passed / 1 FAILED,
      and the one failure is unrelated to that packet.

        crates/tillandsias-headless/tests/proxy_cache_policy.rs:112
        bumped_origin_tls_and_signed_url_logs_fail_closed
        panicked at: Squid launch

      PRE-EXISTING, PROVEN NOT MINE: re-run with my working tree stashed
      (`git stash push -u`) and it fails identically, so it is not a
      consequence of the framing work. It reads only repo files, so it should
      be equally red on linux-next and windows-next — this is a fleet-wide
      red, not a macOS quirk.

      THE MECHANISM. Line 112 does

        let launch = entrypoint.find("exec squid -N").expect("Squid launch");

      but images/proxy/entrypoint.sh:97 now reads

        exec /usr/local/bin/squid-supervisor squid squid -N

      A supervisor was inserted between `exec` and `squid -N`, so the literal
      no longer occurs and `.expect` panics.

      WORTH SAYING PLAINLY: the property under test is still SATISFIED. The
      parser gate is at entrypoint.sh:84 and the launch at :97, so
      parse < launch holds. The test fails on its own brittle literal, not on
      a regression in the thing it guards — which is the worse failure, because
      the natural fix ("make it match again") can be done without noticing that
      the assertion never had to be literal in the first place. Prefer matching
      the launch by a stable anchor (`squid -N`, or the supervisor path) so a
      future wrapper does not break it a third time.

  - packet_id: eight-production-control-wire-writes-have-no-length-bound
    order: 828-r2ek
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "the control wire bounds its READS at 64 KiB everywhere and its WRITES almost nowhere — eight production send sites can emit a frame every peer is obliged to reject"
    deliverable: "every production framing write either bounds against MAX_MESSAGE_BYTES or documents why it cannot, and a newly-failing write is logged rather than dropped"
    pickup_role: any
    release_target: architecture-audit-epic
    capability_tags: [rust, tokio, vsock, all-platforms, architecture]
    estimated_hours: 3
    context: |
      SURFACED 2026-08-18 by surveying all ten framing sites for 795-5itp
      before migrating any of them. The asymmetry is not something the packet
      predicted and it is the more interesting half of what the survey found.

      READS AGREE. Every bounded read in the tree caps at exactly
      MAX_MESSAGE_BYTES (65_536), strict `>`, inclusive at the limit:
      transport.rs:203, main.rs:11338, tray/mod.rs:573, vsock_server.rs:1645,
      vsock_client.rs:246, pty_vsock_bridge.rs:169 and :275, vsock_exec.rs:355,
      hvsocket.rs:76 and :167, tests/vsock_listener_e2e.rs:59.

      WRITES DO NOT. Only three bound the send side — vsock_client.rs:229,
      pty_vsock_bridge.rs:241, vsock_exec.rs:286. These eight do not:
      tray/mod.rs:590, main.rs:11319, vsock_server.rs:1662, hvsocket.rs:68,
      hvsocket.rs:145, transport.rs:189, provisioning.rs:182,
      pty_vsock_bridge.rs:160 (Hello only).

      WHY IT MATTERS AND WHY IT IS NOT URGENT. An oversize frame is emitted,
      then the PEER rejects it and closes — so the failure surfaces as a
      dropped connection at the wrong end, with the sender believing it
      succeeded. No producer is currently known to exceed 64 KiB, which is why
      this is p2 and not p1.

      THE TRAP FOR WHOEVER FIXES IT, stated because it is easy to walk into:
      tray/mod.rs discards nine write results with `let _ =` (lines 1264, 1300,
      1322, 1345, 1370, 1420, 1439, 1456, 1475). Adding a bare `?` there turns
      a newly-refused write into a SILENT MISSING REPLY, which presents to a
      user as a hang, not as an error. Add the bound WITH logging.

  - packet_id: three-framing-invariant-tests-go-vacuous-on-rename-not-red
    order: 828-itr9
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "three source-scanning tests guard the unbounded-read invariant by grepping for function-name literals — the 795-5itp migration that renames those functions makes them pass while enforcing nothing"
    deliverable: "the scans fail loudly when their anchor disappears, instead of silently examining the wrong region"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [rust, ci-gates, fail-loud, architecture]
    estimated_hours: 2
    context: |
      SURFACED 2026-08-18 while planning 795-5itp's remaining slices. This is
      filed BEFORE the migration that would trip it, because afterwards there
      is by construction no failing test to notice.

        crates/tillandsias-vm-layer/src/vsock_exec.rs:2016  no_setup_read_is_left_unbounded
        crates/tillandsias-headless/src/vsock_server.rs:2082
        crates/tillandsias-headless/src/vsock_server.rs:2103

      All three `include_str!` their own source and locate the production
      region by a literal. vsock_server.rs:2088 is the clearest case:

        .and_then(|tail| tail.split("\nasync fn read_envelope").next())

      `str::split` on a delimiter that does not occur yields the WHOLE string,
      so renaming `read_envelope` does not fail the test — it silently widens
      the scanned region and the assertion continues to pass. The 690-eug2
      unbounded-read invariant would stop being guarded with no signal at all.

      This is the same class 601-462g named (a gate that greps its own
      comment), and vsock_exec.rs:2016 already carries a comment about having
      been bitten by a near neighbour of it — the first version of that scan
      flagged its own filter expression. The remedy is to assert the anchor
      EXISTS before using it, so a rename is a red test rather than a silent
      no-op.

