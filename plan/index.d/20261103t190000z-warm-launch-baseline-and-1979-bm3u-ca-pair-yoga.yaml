packets:
  - packet_id: a-ca-key-that-no-longer-matches-its-certificate-is-reissued-not-served-to-the-proxy
    order: 1979-bm3u
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [headless, proxy, ca, tray]
    estimated_hours: 3
    title: A CA key that no longer matches its certificate is reissued, not handed to the proxy (squid refuses to start)
    context: |-
      MEASURED on yoga 2026-11-03: every launch failed with "readiness gate: a hard requirement is not ready (tillandsias-proxy: no READY=1 within 120s)". The proxy log: "WARNING: '/etc/squid/certs/intermediate.key' X509_check_private_key() failed", "FATAL: No valid signing certificate configured for HTTP_port [::]:3128". ~/.local/state/tillandsias/ca/intermediate.crt was dated 2026-10-30. The key it links to, /run/user/1000/tillandsias/keys/intermediate.key (tmpfs), was rewritten at 2026-11-03 08:37:33 -0800. vault.key in the same dir kept its 10-30 date. The public keys differ: sha256 of `openssl x509 -pubkey` 6c900505... against `openssl pkey -pubout` 64aacbdc....
      SOURCE (crates/tillandsias-headless/src/main.rs): the CA ensure calls ca_key_store::materialize (which refills a dangling key link from the keyring) and then ca_bundle_needs_refresh, which returns true only when a file is missing or the cert is near expiry. It never checks that the key belongs to the certificate. So a refill from a keyring entry of another generation leaves a mismatched pair that is never reissued, and the proxy is dead until someone deletes the cert. Not found yet: what rewrote the RAM key at 08:37.
      Worked around on yoga by moving intermediate.crt aside (copies kept); the next launch minted a fresh pair and all launches passed.
    exit_criteria:
      - 'A test plants a certificate and a key from two different generations and asserts the CA ensure reissues (or refuses loudly, naming the mismatch) instead of returning them. Red today: ca_bundle_needs_refresh answers false.'
      - 'What rewrote the tmpfs key while keeping the old certificate is named from source or a repro, and fixed or filed.'
    verifiable_closure: 'The test red before and green after, and the cause of the 08:37 rewrite named.'
    unscoreable: 'unpinnable-until-the-guard-exists: the claimer writes the test and names its litmus in the same commit (1136-n8sh).'
    next_action: 'Add a key/cert public-key match to ca_bundle_needs_refresh (or right after materialize); then read ca_key_store::materialize for the path that refills from a keyring entry newer or older than the cert.'
    provenance: found by yoga 2026-11-03 while taking the warm-launch baseline for macuahuitl-fedora.
    related: [1118-fqfk]
    events:
      - type: filed
        ts: '2026-11-03T19:00:00Z'
