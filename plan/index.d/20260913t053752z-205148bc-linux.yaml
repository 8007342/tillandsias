        CRITERION 1 was worse than "unpinned": the URL was
        `releases/latest/download/ollama-linux-<arch>.tar.zst`, which is not a version.
        Whatever GitHub resolved at CONTAINER START was downloaded, streamed through
        zstd/tar, and EXECUTED inside the enclave, with no checksum of any kind. Two
        containers from the same image, started an hour apart, could run different code
        and nothing recorded which.

        Now: OLLAMA_VERSION="v0.34.0", the URL is built from it, and a per-arch SHA-256
        is verified BEFORE extraction. Digests came from the GitHub release API, which
        exposes them directly — no 1.4GB download was needed to obtain or to check them,
        which is what makes this cheap enough to keep pinned.

        FAIL CLOSED ON THREE PATHS: no pin for this arch, no sha256sum available, digest
        mismatch. The middle one is the one most likely to be written as a skip, and
        scripts/install.sh does exactly that ("sha256sum not found; skipping checksum
        verification"). That is a defensible usability trade ON A USER HOST, where the
        alternative is an install that cannot run; it is the WRONG trade in an enclave
        that executes the payload, because it switches the integrity gate off precisely
        on the hosts whose tooling is unusual enough to lack the verifier. The
        difference is stated in the code so the next reader does not "harmonise" them.

        CRITERION 2 — DEFERRED AND DECLARED, which the deliverable explicitly permits
