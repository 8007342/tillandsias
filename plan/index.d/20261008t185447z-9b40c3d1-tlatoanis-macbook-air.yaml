        vz_entitlement.rs asks Security.framework about the RUNNING process (SecTaskCreateFromSelf + SecTaskCopyValueForEntitlement), not about a file's signature, because the running task is what macOS enforces. The answer is Present, Absent, or Unknown(why). Absent refuses by name, with why and remedy. Present and Unknown proceed, and when the probe could not answer, VZ's own entitlement error from validate is still mapped to the same named refusal.
        Placement: in VzRuntime::start, after the read-only rootfs and double-start checks (the existing vz_start_fails_clean_when_rootfs_missing contract is kept) and BEFORE the first write to the image root. A NEW HARM, measured and not in the row: pre-fix, an unentitled start grew the guest disk, created a 24 GiB swap image, and rewrote cidata/nvram before failing. Against the real image root, that mutates live VM state.
        The probe agrees with codesign both ways, checked on a throwaway probe binary in a scratch dir: unsigned reads Absent; ad-hoc signed with crates/tillandsias-macos-tray/assets/Tillandsias.entitlements reads Present. Nothing installed was signed or touched, and /Applications was never touched.
        Darwin: vm-layer suite 140/140, strict clippy (vm-layer + macos-tray) 0, fmt clean.
