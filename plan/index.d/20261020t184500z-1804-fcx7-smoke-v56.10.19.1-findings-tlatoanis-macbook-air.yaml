    context: |
      Measured on tlatoanis-macbook-air, v56.10.19.1, 2026-10-19 21:36Z → stopped by hand 2026-10-20 18:35Z. The tray's --opencode <project> --prompt run had printed its final ARM lines, but a tool call (1804-fcx7) never returned and the run never exited, so the tray CLI, the forge and the guest VM stayed up. Backstop: the idle container reaper, 1800-465n, should catch a forge like this one; this row asks for the run's own bound.
    exit_criteria:
      - 'RED FIRST: a prompt run whose tool call never returns ends within a configured bound with a named non-zero exit (today it waits indefinitely)'
      - 'the bound and its verdict are visible to the tray CLI caller (exit code and one named line)'
      - 'cross-reference 1800-465n: the idle reaper reclaims such a forge when the bound is absent or disabled'
