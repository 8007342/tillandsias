    order: 1804-fcx7
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [toolchain-exec, flutter, forge, mcp-socket]
    estimated_hours: 4
    owned_files:
      - images/default/cli/flutter
      - crates/tillandsias-headless/src/toolchain_exec.rs
    title: |
      flutter create run through the forge's toolchain shim (tillandsias/exec) never returns, so no Flutter project can be created in a forge
    context: |
      Measured on tlatoanis-macbook-air, published v56.10.19.1, 2026-10-19 21:43Z, in a fresh forge on a new project (~/src/kumbia-smoke). A non-interactive bash script (stdin not a tty) ran `flutter create --platforms=web --project-name kumbia kumbia 2>&1 | tail -3` via /usr/local/sbin/flutter (the shim that sends tillandsias/exec over the MCP socket). The output file holds only the line before it; the command never completed and no kumbia/ directory appeared. 1788-qlwq slices 10-12 were therefore untested on this release. Not yet split between "the exec never starts", "it runs but the frame stream never ends" and "the shim never reads the exit frame".
    exit_criteria:
      - 'RED FIRST: in a forge, a non-tty `flutter create --platforms=web x` through the shim returns with exit 0 and creates x/ within a bounded time (hangs today on v56.10.19.1)'
      - 'the shim exits non-zero with a named refusal when the exec stream ends without an exit frame or exceeds its bound, never waits forever'
    verifiable_closure: |
      unscoreable: unpinnable-until-the-guard-exists; the future litmus is litmus-flutter-shim-returns-or-refuses.yaml, written in the same commit as the fix.
      A test that drives the shim against a scripted tillandsias/exec server that sends output and an exit frame (returns with that code) and one that closes without an exit frame (returns a named refusal).
    provenance: |
      Filed by macbookair-macos from the v56.10.19.1 macOS smoke, at the coordinator's direction, 2026-10-20.
