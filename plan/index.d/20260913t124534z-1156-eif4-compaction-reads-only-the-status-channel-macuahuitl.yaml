    owned_files:
      - crates/tillandsias-plan/src/fragments.rs
    title: |
      compact_text reads frag.doc.get("status") alone while lww_entries folds both LWW channels ["fields", "status"], so a correction written under the canonical `fields:` spelling is seen by every reader and INVISIBLE to compaction: the candidate renders without it, the real-ledger round-trip test fires, and — had the test not existed — the fragment carrying the intent would have been deleted at the next compact. A rung-lowering write spelled that way was invisible twice over, neither compacted nor reported.
    context: |
      ISOLATED on yolanda 2026-09-13 (windows-next, full gate red on
      compaction_on_the_real_ledger_preserves_every_comment_and_item): removing
      their four beyond-trunk fragments one at a time — the two written by
      `set-field` (status: channel) PASS, the two hand-written (fields:
      channel) FAIL; all four removed, PASS. Trunk itself passed on macuahuitl
      at c2013d4ad, which exonerated c93139300 (the compaction change landed
      hours earlier) and located the defect in the tree that carried a
      fields: fragment. Both functions are correct on their face; only the
      pairing was wrong, and no reading of either would have suggested it —
      the bisection on real data is the finding.

      WHY NOBODY HIT IT: every machine-written fragment uses `status:`
      (set-field emits it; its header says the channel "is named status: for
      historical reasons but corrects ANY field", 642-fedr). `fields:` is the
      canonical spelling — lww_entries lists it first — and is reachable only
      by hand-writing a fragment. The canonical name was the broken one and
      the alias the safe one. windows-next carries one such fragment
      (997-e4v2's next_action correction, 9767d4c88); after this fix it
      compacts correctly, and the immutable originals are the pre-fix
      evidence.

      THE FIX (one line, macuahuitl, cleared with lenovinha who owns the
      adjacent 1123-k3mq reporting): compact_text iterates
      lww_entries(&frag.doc) instead of doc.get("status"). The
      discarded_status reporting sits in the same loop, so the composition
      lands for free: a fields:-spelled rung-lowering write is now refused
      AND reported. lenovinha's warning text names the FIELD status, never
      the channel, so it stays accurate.
