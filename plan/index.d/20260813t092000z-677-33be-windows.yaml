      summary: >
        Criterion 1 met with the trap option, in two layers, because the
        packet's "or" hides an asymmetry worth naming. The test mutates the
        tracked VERSION because the behaviour under test IS build-image.sh
        reacting to that file changing, so copying the tree would test a
        different thing.
        Layer 1: the trap now covers EXIT INT TERM HUP and re-raises the
        original exit code. It was EXIT only, and bash does not run an EXIT trap
        when the default SIGTERM disposition kills the shell — so the single
        exit path that actually occurred on 2026-08-11 was the one not covered.
        Layer 2, and this is the load-bearing one: a stale-sentinel check at
        START restores a leftover `0.0.0-test-retag` from GIT before doing
        anything else. From git, not from the backup copy, because a killed
        run's tmpdir is already gone.
        MEASURED WHILE TESTING, and it changes which layer matters: bash defers
        a signal trap until the current FOREGROUND command returns. A run parked
        inside a long `build-image.sh` call does not restore when SIGTERM
        arrives — only when that call finishes, if it ever does — so a runner
        that follows SIGTERM with SIGKILL skips the trap entirely. That is
        exactly the 2026-08-11 shape. The trap is therefore best-effort and the
        next-run repair is the real protection; the fixture is written to say so
        rather than to imply the trap is sufficient.
