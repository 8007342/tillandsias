    title: |
      §0.4 of the smoke runbook creates target/smoke-e2e with mkdir -p and nothing ever clears it, so a run inherits every evidence file from every previous run; a step that never reaches its write leaves the PREVIOUS run's file under the exact name the report and any out-of-band check read — a stale PASS indistinguishable from a fresh one by name.
    context: |
      MEASURED by pirria 2026-09-14: 03-init-exit.txt containing init_exit=0
      dated 2026-09-13 01:24 was present while this run's --init was still
      building the proxy image, and an out-of-band poll read it as this
      run's result; 14 files from the 2026-09-12/13 runs were present at
      start and were archived by hand under _stale-pre-2026-09-14/. In-block
      assertions are unaffected (they capture status in the same shell);
      every out-of-band read is — the §5 report, an orchestrator polling for
      completion, a human scanning the directory. WHAT TO BUILD: §0.4 moves
      any existing target/smoke-e2e/* aside to a timestamped subdirectory
      (never deletes — prior evidence is worth keeping) before the run
      starts, and the report records the run's own start time so any file
      can be checked against it.
    exit_criteria:
      - 'a stale exit file present before the run is moved aside by §0 and an out-of-band read before the step finds no file (pre-fix result: FAILS — the previous run''s file is read)'
      - 'NEGATIVE CONTROL: the moved-aside evidence is preserved under a timestamped subdirectory, not deleted'
      - 'the §5 report carries the run start time'
