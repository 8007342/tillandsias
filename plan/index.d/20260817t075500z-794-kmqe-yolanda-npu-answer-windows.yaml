        form. Strong form, three layers. (1) KERNEL: the WSL2 kernel
        6.18.33.2 has `# CONFIG_DRM_ACCEL is not set` and NO CONFIG_AMDXDNA
        symbol at all in /proc/config.gz; amdxdna lives under drivers/accel and
        depends on DRM_ACCEL, so /dev/accel/accel0 is not merely absent, it is
        unbuildable on this kernel. (2) GUEST DXCORE: libdxcore.so in
        /usr/lib/wsl/lib does export DXCoreCreateAdapterFactory, so this is
        answerable directly — a DXCore enumerator compiled INSIDE the guest
        against microsoft/DirectX-Headers and linked to the WSL library returns
        exactly ONE adapter for D3D11_GRAPHICS, D3D12_GRAPHICS,
        D3D12_CORE_COMPUTE and D3D12_GENERIC_ML alike: "AMD Radeon(TM) 860M
        Graphics" vendor=0x1002 device=0x1114, attribute HW_GPU. No adapter
        carries HW_NPU or HW_COMPUTE_ACCELERATOR. The guest LUID is REMAPPED
        (0x34835E06 vs host 0x00010153) — a paravirtualised handle, not
        passthrough. (3) THE DECISIVE LAYER: the same enumerator built with MSVC
        against the Windows 11 SDK 10.0.26100.0 and run NATIVELY ON WINDOWS also
        does not see the NPU — two adapters, the 860M and Microsoft Basic Render
        Driver, both HW_GPU, even though DXCORE_HARDWARE_TYPE_ATTRIBUTE_NPU is a
        defined attribute in that SDK and the device is healthy
        (PCI\VEN_1022&DEV_17F0, class ComputeAccelerator, Status OK). There is
        also no "NPU Engine" perf-counter set. The XDNA2 NPU is a
        ComputeAccelerator-class device served by AMD's XRT stack, OUTSIDE the
        DXGI/DXCore world entirely. GPU-PV forwards DXCore adapters; there is no
        DXCore adapter to forward. COROLLARY that matters beyond WSL: ONNX
        Runtime's DirectML EP cannot reach this NPU on WINDOWS either. For
        ESMERALDINHA's generalisation: /dev/dxg-only is universal, and an NPU
        does not merely "expose the same" — it does not exist in that namespace
        at all, so a host having an NPU changes nothing about guest exposure.
