      lua_std withholds `next` (1384-bp6t), so the idiomatic emptiness test `next(t) == nil` dies at runtime with "attempt to call a nil value (global 'next')"; give authors `table.is_empty(t)` and make a call to `next` fail with a message that names it
    verifiable_closure: |
      cargo test -p tillandsias-plan --test lua_std: `table.is_empty({})` is true and
      `table.is_empty({a=1})` / `table.is_empty({1})` are false in BOTH classes, and calling
      `next(t)` raises an error whose text contains "table.is_empty". Pre-fix result: FAILS:
      yolanda's 1380-u7sq archiver Lua (green alone) called `next(terminal_ids)` and the merged
      tree died with "attempt to call a nil value (global 'next')", relay-fixed by macuahuitl
      with a pairs-based check.
    context: |
      Union break found by the coordinator's relay: 1384-bp6t withdrew global `next` (the raw
      walk is hash order, which varies per process) while 1380-u7sq moved the archiver into the
      sandboxed environment. Each was green alone. Keeping `next` withheld is right; what is
      missing is the replacement authors reach for, and an error that points at it.
