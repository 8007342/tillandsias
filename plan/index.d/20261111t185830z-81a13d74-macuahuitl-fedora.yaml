  - packet_id: stop-all-reset-and-enclave-restart-name-the-live-agents-and-unpushed-commits-they-would-destroy-and-refuse-without-consent
    order: 2080-xydi
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    story: forge-safety-v05
    capability_tags: [tray, cli, forge, ux]
    estimated_hours: 4
    title: |
      An operator-approved vault and CA rotation on 2026-11-11 ran --stop-all and --reset-guest and killed a visual-chess forge with live agents, losing its unpushed work; stop-all, reset and enclave restart name each forge with a live agent session or unpushed commits and refuse unless the user confirms for those named forges.
    context: |
      Incident 2026-11-11 (coordinator). Symbols: reset_guest_main and reset_guest_async in the macOS tray; the Linux and Windows stop-all and reset paths. Unattended callers get a refusal with the names, never a silent kill.
    exit_criteria:
      - 'per platform, a fixture with one forge holding an unpushed commit makes --stop-all and --reset-guest exit non-zero naming that forge, and proceed only with an explicit per-forge confirmation; today both proceed'
    unscoreable: 'unpinnable-until-the-guard-exists: the refusal fixture is the deliverable.'
    next_action: 'Nothing is done.'
    provenance: incident 2026-11-11 via coordinator; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
