      A guest reset wiped the forge-cache volume and the mirror, losing unpushed refs and agent transcripts; before a reset the product pushes or exports every unpushed mirror ref and the live sessions' transcripts to a host location the user is told about.
    context: |
      Incident 2026-11-11. Tension with forge-logs-die-with-the-forge: transcripts are exported only by an explicit reset of a live forge, kept for the user, never collected. Multi-machine: an export may go to the Pi-fleet mirror (1548-7onc) when present.
    exit_criteria:
      - 'per platform, a fixture with an unpushed mirror ref and a live transcript runs reset and afterwards the ref is on the host (or upstream) and the transcript is at the named path; today both are gone'
    unscoreable: 'unpinnable-until-the-guard-exists: the reset fixture is the deliverable.'
    next_action: 'Nothing is done. Confirm with the operator that exporting transcripts on reset does not conflict with the log ruling.'
    provenance: incident 2026-11-11 via coordinator; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
