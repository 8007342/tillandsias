  - packet_id: licence-acknowledgements-live-in-the-project-repository-and-the-gate-reads-them-from-git
    order: 2080-qqsm
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    story: licence-in-repo-v05
    capability_tags: [licence, openspec, rust, git]
    estimated_hours: 5
    title: |
      The restricted-fetch gate reads acknowledgements from a state-dir copy (<state dir>/licence-acknowledgements/<project>/), which a state or vault wipe loses; per the 2026-11-11 ruling the record of truth is licences/acknowledgements/ in the project repository, and the gate reads it from the project's git, never a copy.
    context: |
      openspec/changes/licence-acknowledgements-in-repo (filed with this triage). Supersedes the state-dir copy that 1958-fc3y describes. accept-licence step 4 already commits the record into the project; the gate does not read it there.
    exit_criteria:
      - 'with the state-dir copy deleted, a fetch whose project repository holds a valid committed record is admitted; today it is refused'
      - 'holds on Linux, macOS and Windows independently'
    verifiable_closure: 'cargo test -p tillandsias-headless licence_consent — admits from a committed record with no state-dir copy; red today'
    next_action: 'Nothing is done. Implement tasks 1.x of openspec/changes/licence-acknowledgements-in-repo.'
    provenance: operator ruling 2026-11-11; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
    related: [1956-ecpb, 1958-fc3y, 1954-dvz9, 1958-22yh]
    events:
      - {type: filed, ts: '2026-11-11T18:58:30Z', host: macuahuitl-fedora, summary: filed p1 from the 2026-11-11 blind-design triage}
  - packet_id: a-licence-record-is-valid-only-when-the-commit-that-added-it-is-signed-by-a-committed-signer
    order: 2081-qndc
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    story: licence-in-repo-v05
    capability_tags: [licence, signing, rust, git]
    estimated_hours: 5
    title: |
      A licence record's signature verifies against allowed_signers in the host state dir, which a vault or state wipe loses; the signers are committed beside the records (licences/allowed_signers), the record verifies against the signer set as of the commit that added it, and a vault wipe makes a new key without invalidating earlier records (OQ-19 answer a).
    context: |
      openspec/changes/licence-acknowledgements-in-repo. licence_consent::Verifier::for_host reads <state dir>/approvals/allowed_signers today. Git history is the durable record: removing a signer later never invalidates a record added while it was listed.
    exit_criteria:
      - 'after deleting the host allowed_signers and re-enrolling a new key, an old committed record still verifies and a record signed by a key never committed is refused; today the first is refused'
    verifiable_closure: 'cargo test -p tillandsias-headless licence_consent — history-anchored verification fixture over a scratch repository; red today'
    next_action: 'Nothing is done.'
    provenance: operator ruling 2026-11-11; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: [licence-acknowledgements-live-in-the-project-repository-and-the-gate-reads-them-from-git]
    related: [1958-22yh]
    events:
      - {type: filed, ts: '2026-11-11T18:58:30Z', host: macuahuitl-fedora, summary: filed p1 from the 2026-11-11 blind-design triage}
