      invocation (the crate name argument contains "vm-layer" as a
      substring, not a VM launch) is NOT flagged. Then, live:
      `bash scripts/census-litmus-layer-classification.sh` over
      openspec/litmus-tests prints census:litmus-layer:specs=<n>
      misclassified=0 — none of the 10 previously-traced false positives
      (plan/issues/1443-2ef7-census-audit-false-positives-2026-09-27.md)
      still fire. PRE-FIX RESULT: FAILS — the live run reports
      misclassified=10, all traced false positives (crate-path substring
      matches on tillandsias-vm-layer, and grep-pattern/doc-text substring
      matches on 'podman run' / 'build.sh --ci-full' / 'run-forge-standalone.sh').
    title: |
      The 1443-2ef7 census matches command TEXT as a plain substring; it must tokenise each command and match only the executed launcher word, ignoring grep/awk/sed/rg pattern arguments and path components
    context: |
      Follow-up to 1443-2ef7 (macuahuitl-fedora, land77): the live census
      over openspec/litmus-tests flagged 10 hits across 8 specs. Manual trace
      of every one (plan/issues/1443-2ef7-census-audit-false-positives-2026-09-27.md)
      found zero genuine layer misclassifications — every flag fired because
      `match_token` does `grep -qF -- "$t" <<<"$hay"` against the WHOLE
      command line, so it cannot tell "this command RUNS X" from "this
      command's argument NAMES X" (a grep pattern, a doc string, a crate
      path such as crates/tillandsias-vm-layer/src/wsl.rs, or the -p
      argument to `cargo test`). A wrong fix list is worse than none, so no
      rows were filed against 1443-b85g and this packet exists instead.
    next_action: >
      In match_token (or a new helper), split $hay's command text on
      &&/;/| into sub-commands, take each sub-command's first word as its
      launcher (stripping a leading env-assignment or a bash/sh wrapper to
      look at the wrapped script instead), skip sub-commands whose launcher
      is a text-processing tool (grep, egrep, fgrep, rg, awk, sed, cat,
      printf, echo, test, [, bash -n, mf_stage, mf_holds, mf_holds_ere) —
      those consume the token as data, not as a command — and match a token
      only against a survived sub-command's launcher (and, for two-word
      tokens like "podman run" or "build.sh --ci-full", the launcher plus
      its immediate next word/flag). Extend --self-test with the three new
      arms above; verify census:litmus-layer:specs=<n> misclassified=0 live.
    notes: |
      size: S  implementer_tier: haiku
      Mechanical tokeniser change scoped to one file; the false-positive
