      summary: >
        Criterion 1's grep-able check is `scripts/check-podman-sync-budgets.sh`,
        wired into `./build.sh --check`. It deliberately does NOT re-check what
        the type system already enforces; it guards the two ways AROUND the
        type: building a podman `std::process::Command` directly, and growing
        the escape hatch past its reviewed count. The count is a number in the
        script rather than a ban, so adding a second caller-owned spawn is a
        decision someone makes in review instead of a line that slips in.
        Fixture `scripts/test-podman-sync-budgets.sh`, 4/4, where cases 2 and 3
        are the negative controls (a direct command must be REFUSED; a second
        hatch must be REFUSED) and case 4 pins that raising the reviewed count
        is the sanctioned path. Product code only — `crates/*/tests/` may drive
        podman directly, since a test that hangs fails its own harness rather
        than an operator's session.
        Status is `implemented`, not `done`: criterion 2 (streaming for
        build/pull/wait) and criterion 3's interactive-exec justification are
        untouched. The interactive case is a real design question — a human is
        typing into it, so the deadline belongs on the setup, not on the
        typing — and it should be decided, not defaulted.
