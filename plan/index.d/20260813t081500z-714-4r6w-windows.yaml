  - packet_id: podman-sync-surface-and-streaming-have-no-timeout
    event:
      type: progress
      ts: "2026-08-13T08:12:00Z"
      host: windows
      summary: >
        Criteria 1 and 4 landed; the fix is a TYPE, not a rule to remember.
        `podman_cmd_sync()` now returns `SyncPodmanCommand`, which exposes the
        builder methods and `output_bounded` / `output_bounded_with_stdin` /
        `status_bounded`, and does NOT expose `output`, `status`, or `spawn`. A
        call site that forgets its deadline does not compile — which is why the
        conversion was safe to do mechanically: the compiler enumerated all 34
        unbounded sites and refused to build until each had a budget. Budgets
        come from the same `OperationKind::default_budget()` the async seam uses
        (order 690-7adz), chosen per site from the podman subcommand, so the two
        halves of the product now agree on what "too long" means.
        One escape hatch exists and is named for what it costs:
        `spawn_caller_owned_lifetime`, used once, by the image build that
        streams to a log file under the caller's own progress handling.
        Three call sites needed judgment rather than a class budget:
        `stop_container_sync` gets `Container + the -t grace period`, because a
        budget shorter than the stop it is bounding would kill a stop that was
        working; the two containerized `gh` sites in remote_projects.rs keep
        their existing explicit GH/CLONE timeouts.
        Reduction: remote_projects.rs had hand-rolled `run_command_with_timeout`
        for those two calls. It is deleted — one bounded implementation now
        serves every podman call instead of two serving two.
  - packet_id: podman-sync-surface-and-streaming-have-no-timeout
    event:
      type: verified
      ts: "2026-08-13T08:13:00Z"
      host: windows
      summary: >
        Criterion 4 met, with a defect found and fixed in the fix itself.
        Tests drive stalled and prompt SYNCHRONOUS stubs through the real
        wrapper: bounded (returns far inside the stub's 600s sleep), named (the
        message carries the budget and the redacted command), typed
        (ErrorKind::TimedOut). Negative control: a prompt stub under the same
        transport and budget must still succeed. Third test: a stub that writes
        more than a pipe buffer must complete, because the bounded wait drains
        stdout on its own thread — fixing a hang must not introduce a different
        one. cargo test -p tillandsias-podman --lib = 159 passed.
        The defect: the first implementation JOINED the reader threads on the
        timeout path. Killing the child does not close a pipe a GRANDCHILD still
        holds — the stub's `sh` died while its `sleep` kept the write end open —
        so the join blocked forever and the timeout test hung past 600s. The
        readers are now abandoned on that path: each owns nothing but a pipe
        read, and the caller, which is the thing that must not block, returns.
        The deleted `run_command_with_timeout` had reached the same conclusion
        independently; its comment is preserved at the deletion site.
        Second defect, same class: the two stub-installing tests raced, because
        `TILLANDSIAS_PODMAN_BIN` is process-global while cargo runs tests in
        parallel threads. Each overwrote the other's binary and deleted its
        directory; one passed alone, two hung together. The stub helper now
        holds the module's existing `env_lock` for the caller's whole test.
      evidence_refs:
        - "scripts/check-podman-sync-budgets.sh"
        - "scripts/test-podman-sync-budgets.sh"
  - packet_id: podman-sync-surface-and-streaming-have-no-timeout
    event:
