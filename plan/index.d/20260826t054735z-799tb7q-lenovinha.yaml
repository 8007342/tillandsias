  - packet_id: builder-toolbox-init-set-too-small-for-the-dispatch-pattern
    event:
      type: implemented
      ts: "2026-08-26T06:05:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t053715z
      host: lenovinha
      summary: |
        CONTINUING MY OWN 2026-08-24 STATE. That note left one thing blocking the
        ~50-script sweep: "shipped diagnostics (tray-diagnose.sh,
        diagnose-macos-provision.sh) run where no builder toolbox exists and need
        a different answer, DECIDED BEFORE SWEEPING." This decides it and
        implements it for both.

        THE DECISION: A DIAGNOSTIC MUST ALWAYS PRODUCE ITS DATA. Only the
        PRESENTATION may degrade. And a missing parser must never be reported as
        a fault of the thing under diagnosis.

        Both scripts previously did `exit 1` with "brew install jq". Two defects,
        and the second is the expensive one:

          1. It told an END USER to install a developer tool. These ship.
          2. IT NAMED THE WRONG FAILURE. Exit 1 was documented as "could not
             locate or invoke tillandsias-tray, OR jq missing", so a healthy tray
             and an absent parser produced the identical verdict. You run a
             diagnostic precisely when something is already wrong, which makes a
             misattributed verdict costlier here than anywhere else in the tree.
             Same class as 894-scxy, in the one place designed to be read when
             the reader is already confused.

        Dispatch is now host jq -> toolbox jq (the documented pattern, which
        works because this packet's earlier slice put jq in the init set) ->
        DEGRADE. tray-diagnose.sh's degrade prints the RAW tray output and exits
        3, distinct from 1: the data is complete, only the formatted view is
        lost, and the message says outright that this is NOT a tray fault.

        NO SECOND JSON PARSER, deliberately. A hand-rolled jq-free parse would be
        two parsers that can disagree — a misattribution generator, and a
        diagnostic is the last place to put one. Printing the raw answer gives
        the reader everything and cannot drift.
  - packet_id: builder-toolbox-init-set-too-small-for-the-dispatch-pattern
    event:
      type: verified
      ts: "2026-08-26T06:10:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t053715z
      host: lenovinha
      summary: |
        scripts/test-shipped-diagnostic-tool-dispatch.sh, all arms green, pinned
        by litmus:shipped-diagnostic-tool-dispatch (bound; ratchet checked).
        ./build.sh --check green.

        Arms: with no parser reachable the tray's raw answer still reaches
        stdout; exit is 3 and NOT 1; stderr states the tray is not at fault and
        does not tell an end user to brew-install anything; NEGATIVE CONTROL that
        with jq present nothing degrades and the notice stays silent (a degrade
        path that fires when it should not trains readers to ignore it); no bare
        jq survives in either script; both take the documented toolbox fallback.

        TWO OF MY OWN FIXTURE BUGS, both the shape this whole night has been
        about, and both caught only because an adjacent assertion disagreed:

          - THE FIXTURE DID NOT REPRODUCE ITS OWN CONDITION. My PATH was
            "$W/emptybin:/usr/bin:/bin", so jq was still found and the no-parser
            arms silently tested the WITH-parser case — it printed a formatted
            `PASS Version: 9`. Only the exit-3 assertion caught it. THIS PACKET'S
            OWN 2026-08-24 NOTES RECORD THE IDENTICAL TRAP for the no-yq case,
            and I walked into it anyway. The PATH is now a curated bin directory
            and the ABSENCE of jq and toolbox is asserted as a precondition
            rather than assumed.
          - ARM 6 INLINED ITS OWN BASH-4 REGEX, which made the fixture itself
            trip check-bash-dialect.sh: that checker cannot distinguish a bash-4
            construct from a regex searching for one. Assembling the pattern from
            pieces dodged half of it and still matched `mapfile|readarray`. The
            real problem was not the false positive but that a second copy of the
            rule can DRIFT from the first, and then the arm reports "clean"
            against a definition the project no longer uses. It now delegates to
            check-bash-dialect.sh — one definition, already wired into --check,
            already scanning these two files.

        NOT CLOSED — THIS IS A SLICE, and the packet stays open. Remaining, as my
        2026-08-24 note scoped it: the ~24 bare-jq dev-host callers
        (cycle-metrics.sh, select-work-batch.sh, local-ci.sh, generate-*.sh and
        the test-* family), the `rg` callers (check-cheatsheet-refs.sh:45,
        test-forge-config-trust-cross-platform-parity.sh), and the bare openssl
        CLI callers (build.sh, diagnose-proxy.sh, run-forge-project.sh,
        orchestrate-enclave.sh). Those take the documented dispatch and are
        mechanical now that the shipped-diagnostic question is answered; they are
        a separate slice because sweeping ~50 files is not reviewable in one
        change.
