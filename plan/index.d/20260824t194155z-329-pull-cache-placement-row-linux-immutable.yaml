        n=3, alternating disk/tmpfs, idle box, Intel N150 / 16 GiB / NVMe:

          512 MB blob write (fsync)   disk 483/472/487 ms   tmpfs 181/176/177 ms   2.7x
          512 MB blob read (warm)     disk  81/ 77/ 80 ms   tmpfs  82/ 79/ 80 ms   none

        DISPOSITION: keep-as-is. Path 2 (real tmpfs) is NOT needed for the
        pull cache, and the read row is why. A cache HIT is a warm read, and a
        warm read is served from the page cache whether the bytes sit on tmpfs
        or NVMe — 80 ms either way, indistinguishable across three reps. tmpfs
        wins only the WRITE path, which is the cache MISS: the operation the
        cache exists to make rare. Paying RAM to accelerate the miss path is
        the wrong trade.

        AND ON THIS TIER THE RAM IS NOT SPARE. Measured at the same moment:
        15717 MB total, 12258 MB available; one 512 MB blob is 4.2% of
        available. The same host holds a resident model ladder — qwen2.5:7b is
        5.06 GB resident when loaded (864-dvhk). tmpfs bytes and model bytes
        come from one pool, so "move it to tmpfs" competes directly with the
        inference the forge exists to serve. That extends this packet's 4 GiB
        guest-budget argument to bare-metal low-end hosts with numbers behind
        it.

        SCOPE, stated so the row is not read as more than it is. Only the
        pull-cache shape. Checkout, proxy cache, router state, vault and
        git-mirror storage are untouched: they need a running forge with the
        order-333 control-wire counters, and no forge runs here — this host's
        proxy container cannot start at all, because the ephemeral CA under
        /tmp/tillandsias-ca is wiped on reboot. Criterion 3 (macOS virtiofs vs
        Linux tmpfs) is not this host's to answer.

        A THIRD METRIC WAS DISCARDED RATHER THAN REPORTED. I measured
        create/stat/unlink over 2000 files as an LRU-eviction proxy and got
        ~2.1 s on BOTH stores. That is not "tmpfs and disk are equal at
        metadata" — it is ~6000 bash process spawns dominating the
        measurement. The harness was the bottleneck, so the number says
        nothing about storage and is not in the table. A real metadata
        comparison needs the churn inside one process.

