# Filed by linux_mutable (macuahuitl), 2026-08-17, from a false red this host
# produced and then had to talk itself out of.
packets:
  - packet_id: grade-produces-false-reds-when-a-set-is-graded-against-the-wrong-corpus
    order: 786-kjke
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "`tillandsias-plan grade groundtruth/*.yaml` silently grades fixture-backed sets against the LIVE ledger and reports 6 FAILs that are not regressions"
    deliverable: "each groundtruth set DECLARES its corpus (e.g. a top-level `corpus:` path) and `grade` either honours it per-set or refuses the run naming the mismatch — never a plain FAIL that reads as a regression"
    pickup_role: any
    release_target: forge-local-experts-milestone
    capability_tags: [experts, groundtruth, fail-loud, tooling]
    estimated_hours: 2
    context: |
      Observed 2026-08-17 on this host, by walking into it: the natural
      invocation `tillandsias-plan grade openspec/litmus-tests/groundtruth/*.yaml`
      reports `sets=3 total=28 pass=22 fail=6` — and every one of those six
      is a FALSE red. Two of the three sets (expert-groundtruth-fragment-
      provenance, expert-groundtruth-plan-next) are pinned against COMMITTED
      FIXTURE CORPORA and must be graded with
      `--index openspec/litmus-tests/groundtruth/fixtures/<set>/plan/index.yaml`.
      Graded correctly they are 3/3 and 3/3; rung1 alone is 22/22. So the
      true state is 28/28 and the tool reports 22/28.

      Both files DOCUMENT the right invocation in their headers — and that is
      exactly the problem: the contract lives in a comment a machine never
      reads, while the tool accepts the wrong corpus without a word. This is
      the 741-2izr shape (a false outage is as damaging as a missed one: it
      trains every reader to discount the signal) applied to the accuracy
      harness itself, and the harness is what the fleet's
      `expert_accuracy:` metric rests on.

      Note the metric is NOT currently lying — `scripts/cycle-metrics.sh`
      grades rung1 only, so it reports 22/22 truthfully. The hazard is the
      human/agent path: anyone who globs the directory (the obvious thing to
      do) sees six reds and must either re-derive the fixture convention or
      file a phantom regression. Whoever fixes this should also decide whether
      `expert_accuracy:` SHOULD cover all three sets once each can be graded
      correctly in one run — 22/22 of 28 is a scope the metric line does not
      disclose today.
