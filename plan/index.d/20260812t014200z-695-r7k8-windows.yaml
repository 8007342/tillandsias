packets:
  - packet_id: guest-binary-staging-skips-on-version-match
    order: 695-r7k8
    status: ready
    desired_release: v0.5
    priority: p1
    title: "build-guest-binaries.sh treats a VERSION match as up-to-date, so a source change between releases never restages the guest binary"
    kind: fix
    deliverable: plan/issues/guest-binary-staging-skips-on-version-match-2026-08-12.md
    depends_on: []
    pickup_role: any
    owner_host: any
    capability_tags:
      - build
      - guest
      - staging
    estimated_hours: 2
    outcome: >
      The staging fast path is source-aware: a changed source under the crates
      the guest binary is built from causes a rebuild even when the staged
      binary already carries the workspace VERSION, while an unchanged source
      tree still skips.
    next_action: >
      Replace the stamp-only `verify_binaries` fast path with a currency check
      against source mtimes (cheapest honest form), keeping --verify's order-447
      behaviour untouched — this is about the BUILD path's skip decision, not
      the verifier's.
    exit_criteria:
      - "touching a source file under crates/tillandsias-headless/ makes build-guest-binaries.sh REBUILD even though the staged binary already carries the workspace VERSION"
      - "negative control: with no source change, a second consecutive run still SKIPS — a fix that always rebuilds passes the first criterion while making every tray build minutes slower"
      - "--verify still emits verify:skip-stale-staging on stale staging (order 447 unchanged)"
    events:
      - type: filed
        ts: "2026-08-12T01:42:00Z"
        agent_id: "windows-claude-opus5-20260811t215500z"
        host: windows
        summary: >
          Found while restaging the guest to observe a line this same cycle had
          just added to it: after editing
          crates/tillandsias-headless/src/main.rs, build-guest-binaries.sh
          printed "Staged binaries are up-to-date. Skipping build." and then
          verified SUCCESS. The fast path calls verify_binaries, which checks
          existence, arch, staticness and the VERSION string — none of which is
          a currency check against SOURCE. A VERSION stamp only rolls on
          release, so every source change between releases leaves the staged
          binary stale while satisfying every condition tested.
          This is the third face of one mistaken equivalence, version equality
          implies currency, and the three compound: staging skips (this),
          the tray embedded whatever was staged (689-gipe, fixed), and
          reconcile returns early on a version match (visible since 620-duta
          criterion 1 as outcome=skipped-version-match). Together they mean a
          guest-side fix developed between releases can traverse the entire
          build-and-deploy path and reach nothing while every step reports
          success — which is precisely what happened to 627-sgtt.
