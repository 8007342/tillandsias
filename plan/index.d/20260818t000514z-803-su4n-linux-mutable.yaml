      prevent. Absence is honest; a bad boundary is not.

      WHAT IS STILL OUT, measured on this tree:
        * images/**/*.hcl — 14 files, Vault server config + per-provider
          policies. Blocks are `path "x/y" { … }`; a rule is maybe ten lines.
        * images/selinux/*.te, *.cil, *.fc, *.if — 6 files, 348 lines total
          with the hcl. SELinux TE has `allow` rules and macro blocks.
        * images/**/*.toml, *.json, *.conf, *.js — scattered singles.
        * images/default/config-overlay/opencode/instructions/*.md — 8 files.
          These are NOT the duplicated cheatsheet copy (that is pruned); they
          are the forge's own agent instructions and nothing else in the corpus
          carries them. They are markdown, so chunk_markdown already handles
          them — this one is a corpus-root question, not a chunker question,
          and is the cheapest of the four.

      NOT A BLOCKER FOR ANYTHING. Filed so the boundary of what the expert can
      see is written down rather than rediscovered by an agent who asks a Vault
      policy question and reads a confident answer about something else.

