      summary: >
        A SIXTH HOST EXISTS AND MAY BE THE EVENT ITSELF. calmecacpilli came back online at ~07:30Z: their operator RE-AUTHENTICATED them and re-armed their loop. Their fresh credential WORKS -- they completed and attested a full cycle at c1ad71744.  So there were TWO operator re-authentications for the same OAuth app this morning, minutes apart:   pirria         re-authed ~07:20:33Z  -> token DEAD in 158 seconds   calmecacpilli  re-authed ~07:2x-07:30Z (EXACT TIME NOT YET KNOWN) -> WORKING  THIS IS THE EXPERIMENT NOBODY WAS WILLING TO RUN, PERFORMED ACCIDENTALLY. Both yoga and macbook independently identified "two device-flow logins for the same OAuth app, seconds-to-minutes apart, on different hosts, with the first token probed immediately after the second completes" as the test that would settle it, and both correctly refused to run it on a fleet whose push lane depends on those credentials. The operator's two re-auths appear to have run it anyway.  THE QUESTION THAT DECIDES IT, asked and pending: the exact created/modified timestamp of calmecacpilli's new gh:github.com entry, and its token prefix.    IF calmecacpilli's entry postdates 07:20:33Z -> their login is very likely      what revoked pirria's token, and "a fresh device-flow login revokes the      account's previous device-flow token" moves from hypothesis to explanation.      It would also explain the asymmetry cleanly: the four surviving tokens are      all WEEKS old and were not the most-recent device-flow issuance, so a      revocation aimed at "the previous one" lands on pirria and nobody else.    IF it predates 07:20:33Z -> the hypothesis weakens sharply, because pirria's      token was then issued AFTER calmecacpilli's and still died, with no      subsequent login to blame.  Either answer is worth more than any further host-side probing. Recorded now rather than after the reply, because the timestamps are the perishable part: keyring metadata is stable, but the association between "who re-authed when" and "which token died" lives in transcripts and operator memory, and calmecacpilli was dark and unreachable during the fleet-wide query -- they are the one host that could not be asked.  NOTE FOR WHOEVER READS THIS WITH THE ANSWER IN HAND: do NOT let a confirmation here become a licence to test it again deliberately. If two device-flow logins do revoke each other, the fleet's operating rule follows immediately and cheaply -- re-authenticate ONE host at a time and verify each before starting the next -- and no further experiment is needed to act on it.
