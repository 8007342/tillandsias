    title: |
      A gate SIGKILLed for memory stops with an empty log that is indistinguishable from a hang, and the 1047-h88p job ceiling is a step function whose lowest rung is one job — so a host that is still short at one job gets no cap, no warning, and no verdict.
    context: |
      MEASURED ON LENOVINHA 2026-09-14, twice, same phase:

        land attempt 1  killed by the system, low memory
        land attempt 2  killed by the system, low memory
        both died in    clippy (strict + listen-vsock), checking
                        tillandsias-headless
        gate log ends   mid-line, no verdict, no LAND_EXIT

      Tree intact after both: no merge or rebase in progress, worktree clean,
      nothing partially pushed. The land script's sequencing is why an abrupt
      kill left nothing to unpick, and that part worked.

      THE CAP WAS ALREADY AT ITS FLOOR, measured not assumed:

        MemTotal   14142800 kB
        mem_gb     13  (integer div by 1048576)
        13 < 16 -> CARGO_BUILD_JOBS=1
        CARGO_BUILD_JOBS in the environment: UNSET, so the cap is what ran

      So this is not parallelism. It is one rustc on tillandsias-headless under
      the listen-vsock feature, beside a desktop session and an agent process,
      on a 13.8 GB host.

      TWO DEFECTS, AND THE SECOND IS THE EXPENSIVE ONE.

      (1) THE CEILING IS A CLIFF WITH NO RUNG BELOW ONE. 1047-h88p reads
      `if mem_gb < 16 then 1`. A host at 13 GB gets the same cap as a host at
      2 GB, and a host still short at one job has nowhere left to go. The cap
      cannot express "this host should not attempt this phase at all", which is
      the true state here.

      (2) THE GATE CANNOT REPORT ITS OWN RESOURCE EXHAUSTION. SIGKILL leaves no
      exit path, so the log simply stops. A reader cannot tell an OOM from a
      hang, and those need opposite responses — wait longer versus stop and
      hand off. The kernel records the kill; nothing reads it back.

      MARGINAL, NOT ABSOLUTE, and this is why it is a p2 rather than a blocker:
      five packets landed through this same gate on this same host within the
      preceding hours. v56.9.13's tree moved the line, not the host. A cliff at
      16 GB has nothing to say about a host that crosses a threshold mid-day.

      WHAT TO BUILD. A declared free-memory floor checked BEFORE the expensive
      phases, refusing by name with the floor and the reading, so the host stops
      in seconds instead of dying in minutes with nothing to show. Plus a
      post-mortem read of the kernel's OOM record when a child dies on a signal,
      so the driver emits refused:gate:oom-killed rather than stopping. Neither
      needs to make the build fit; both need the failure to be LEGIBLE.

      NOT IN SCOPE: making the gate smaller, tuning codegen-units, or lowering
      the cap below one job (there is no such thing). Those are answers to "why
      is the build big", and this packet is about "why did the gate say nothing".

      A SECOND FINDING THAT FOLLOWS FROM THE FIRST AND IS FILED SEPARATELY:
      the relay protocol cannot rescue a host that cannot gate, because pushing
      a `work/` ref requires a valid gate stamp too. See the sibling row.
