- packet_id: a-damaged-podman-layer-is-repaired-once-by-its-exact-signature-never-silently
  order: 2023-hd7m
  status: ready
  kind: feature
  priority: p2
  desired_release: v0.5
  pickup_role: any
  capability_tags: [podman, storage, recovery]
  estimated_hours: 3
  title: A podman run failing with the corrupt-layer signature runs one `podman system check --repair`, keeps volumes, and says what it removed
  context: 'Same run as 2023-3hgf: once a layer is damaged, every podman run fails with "readlink /var/lib/containers/storage/overlay: invalid argument" and nothing recovers; `podman system check --repair --force` deleted the one damaged image (the vault''s, 4660a752…) and the next launch rebuilt it. --repair DELETES images, so it must be narrow.'
  exit_criteria:
  - 'Only that exact signature (a podman run or create failing with "readlink <graphroot>/overlay: invalid argument", or podman system check reporting damage) triggers it, at most once per process; it runs `podman system check --repair --force` with no volume or container removal flags, prints each image or layer it removed, and the caller then retries its one podman action once.'
  - 'A fixture with a stub podman returning that signature asserts one repair and one retry; another error asserts no repair.'
  verifiable_closure: 'The fixture, plus the live recovery on a guest with a seeded empty link file.'
  unscoreable: 'unpinnable-until-the-guard-exists: the fixture lands with the change (1136-n8sh).'
  next_action: 'Find the single podman-run seam the vault and forge launches share, then add the signature arm with its fixture.'
  provenance: 'Coordinator macuahuitl-fedora 2026-11-07: "(b) p2, with care since --repair deletes images: run it once, only for that exact signature, keep volumes untouched, and say what it removed".'
