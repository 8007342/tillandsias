  capability_tags: [macos, vm, podman, storage]
  estimated_hours: 4
  title: A graceful tray quit while the guest is still building images never leaves podman storage corrupt
  context: 'Measured on tlatoanis-macbook-air 2026-11-07 (v56.11.7.1, VZ guest Fedora 44, kernel 7.2.15, podman 5.8.9, btrfs /var): the curl install writes soft-reset.request, the guest resets podman storage at its next start (10:52Z) and rebuilds images; a SIGTERM to the tray about 3 minutes later (the graceful drain path) stopped the VM while that work was in flight. One overlay layer (d17217275ed6…) was left with an EMPTY link file, after which EVERY podman run failed with "Error: readlink /var/lib/containers/storage/overlay: invalid argument", the vault never started ("podman run vault failed: exit status: 125"), and Ready never came (wait_phase_ready timeout after 300 s). podman system check reported "damage detected in local storage" for that layer.'
  exit_criteria:
  - 'A graceful quit (SIGTERM or the menu''s Quit) while the guest is building or pulling an image either waits for that work to finish (bounded, and shown on the chip) or stops it so podman leaves no partial layer; the guest syncs its filesystems before the VM stops.'
  - 'A test or a live run quits the tray mid-build and the next start passes `podman system check` with no damage.'
  verifiable_closure: 'A run that quits mid-build, then `podman system check` clean and a forge launch reaching Ready, on a published release.'
  unscoreable: 'none.'
  next_action: 'Find how the guest stops on a drain (does headless stop in-flight podman build/pull, and is there a sync before power-off), then reproduce the empty link file deliberately.'
  provenance: 'Coordinator macuahuitl-fedora 2026-11-07: "file both: (a) p1, a normal quit mid-build must not corrupt storage".'
