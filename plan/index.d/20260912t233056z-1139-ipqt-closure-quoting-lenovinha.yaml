    title: |
      check-scorable-obligation-added anchors its patterns to the first character, so a double-quoted verifiable_closure began with a quote and matched nothing — a row naming two scripts was refused for its QUOTING while the same words as a block scalar passed
    context: |
      MEASURED on lenovinha while landing 1137-dzzu, whose closure names two
      scripts and runs them both. Written as
      `verifiable_closure: "scripts/test-....sh passes (10/10)"` the row was
      refused with violation:scorable-obligation-missing. Rewritten as a block
      scalar with the SAME WORDS it passed.

      THE CAUSE is in the awk block extractor: the inline branch took the value
      verbatim, quote character included, and _scorable_p anchors every pattern
      to the first character (scripts/*.sh*, litmus:*, cargo test*). Nothing
      could match.

      WHY THIS IS WORTH A ROW AND NOT A CONVENTION. The refusal tells the filer
      to add a closure naming a litmus or a script. The filer HAS. The moves
      then available are to discover an unwritten quoting rule by trial, or to
      write `unscoreable:` about a plainly scorable row — recording a falsehood
      in the ledger to satisfy a gate. That is the 994-8r3w failure mode in a
      third dialect: a verdict correct about the letter and wrong about the
      intent, which pushes the honest path below the escape hatch. 1033-ev5r was
      the second dialect. The recurrence is the argument for fixing the
      matcher rather than documenting the quirk.

      COST OF NOT FIXING IT, concretely: six other hosts file rows through this
      gate, and the coordinator was about to warn all of them instead.
    deliverable: |
      The inline closure value is UNQUOTED before it is matched.

        * scripts/check-scorable-obligation-added.sh — in the awk inline branch,
          strip a MATCHED surrounding pair of double or single quotes (and only
          from the ends) before assigning `first`. A closure legitimately
          containing a quote keeps it; a lone leading quote is left alone
          rather than guessed at.
        * THE EMPTY CASE IS EXPLICIT: a bare pair of quotes unquotes to nothing,
          and nothing is silence, which is what this gate exists to refuse.
          Stripping must never turn an empty scalar into a pass, so the
          assignment is guarded on a non-empty result.
        * scripts/test-scorable-closure-quoting.sh — five arms, wired as gate
          step 215-1139-ipqt: the measured refusal now passing, the unquoted
          form still passing, the single-quoted form, and TWO negative controls
          — an empty quoted scalar still refuses, and quoted PROSE still
          refuses. The second control is what distinguishes the fix from "any
          quoted string passes".

      FIXTURE DESIGN NOTE, applied to 1136-n8sh's fixture too: both drive the
      guard inside a throwaway detached worktree to isolate the git index, and
      both now COPY THE WORKING-TREE GUARD IN. `git worktree add HEAD` checks
      out the committed script, so without the copy the fixture would test the
      last commit rather than the change being made — green after the commit,
      red before it, and about the working tree in neither case.
    provenance: |
      Found by lenovinha (linux) while landing 1137-dzzu; assigned back by the
      coordinator to fix rather than to warn six hosts about.
