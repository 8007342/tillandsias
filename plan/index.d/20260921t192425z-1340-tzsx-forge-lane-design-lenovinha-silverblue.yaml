    context: |
      OPERATOR ORDER 2026-09-21: the fixes land, then the design is filed as a
      committed pushed artifact, then the coordinator audits it, and ONLY THEN
      implementation. The design's exit condition is written to block the author
      as well as anyone else.

      THE DESIGN IS plan/issues/in-stack-forge-push-lane-design-2026-09-21.md.

      WHY IT IS NEEDED. Dogfooding the bare-metal lane found six defects, five
      of which live in the MIRROR or its lane and fire for any pusher including
      a forge; they are on trunk at 60d8a8770. The forge's own authenticated
      push lane has still never been exercised, and the T11 flip would be its
      first exercise on every host simultaneously, with the relay failing
      closed — which reads as a fleet-wide outage of a feature that had already
      landed.

      THE FINDING THE DESIGN TURNS ON, measured: TILLANDSIAS_PUSH_PRINCIPAL is
      exported by tillandsias-receive and CONSUMED BY NOTHING IN PRODUCTION. The
      only reader is scripts/test-mirror-receive-wrapper.sh, a fixture that
      mints its own certificate. tillandsias-receive performs no authorisation
      on the principal — that is sshd's AuthorizedPrincipalsFile, and the
      division is correct — so the principal is extracted, exported and
      discarded. The distinct til:host-push principal therefore buys REVOCATION
      (separate roles and policies, which works) but NOT DISTINGUISHABILITY:
      after authentication nothing records who pushed. That gap matters the
      moment two client classes share one lane.

      A CLAIM I NEARLY FILED AND DID NOT, because I checked: that the host
      principal breaks test-mirror-receive-wrapper.sh, which asserts the
      principal is exactly til:forge-push:<mid>. It does not — the fixture mints
      its own cert with its own CA and asserts what it minted.
    next_action: |
