      P5 sits in scripts/land-queue.sh between the carried-obligation block and "GATE THE MERGE RESULT".
      P6 adds a STEP_HOST_STATE= field to scripts/gate-steps.d/*.step. A verdict string is an interface: the new flaky: token must have its consumers listed.
    exit_criteria:
