      - "P5.2 auto-draft: a second identical conflict:<paths> eviction at an unchanged head converts the PR to draft and the comment says so"
      - "P5.3 preflight door: ./build.sh --preflight runs on the merge result before the full gate; a decider-level red evicts"
      - "P6.1 STEP_HOST_STATE= field validated by check-gate-step-regimes.sh; set on credential-cold-state-probe (900-z3kv, keyring) and door-index-lock-sweep (1650-fb7z, load)"
      - "P6.2 the build.sh step runner retries a host-state step ONCE after a 10 s settle; a second disagreement emits flaky:<step>:<verdicts>, not violation:; a real failure stays red, the step is never skipped"
      - "P6.3 land-queue treats flaky: as one re-queue at the back and names the token in gate_failed_comment; the flaky: consumers are listed"
      - "FIXTURES red first in scripts/test-land-queue.sh and the step-runner test: a stale head is skipped and a changed head is not; a host-state step flaking once passes and failing twice reads flaky:; a non-host-state step never retries"
