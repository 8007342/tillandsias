      The land queue spends a full ~21-min gate on candidates it could reject or skip first (a stale head re-evicted for a plan-only trunk delta, a repeated identical conflict, a decider-level red), and a host-state flaky step (keyring cold state, door-index lock under load) evicts as violation: with no bounded retry
