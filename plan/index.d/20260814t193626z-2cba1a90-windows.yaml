r the last INTERESTING step; it was taken after the last MUTATING one, and it is the reason this is reported as FAIL rather than PASS.  === CRITERION 3: finding filed separately — DONE === 735-ewzp (p0) + plan/issues/windows-from-scratch-provision-control-wire-never-comes-up-2026-08-14.md. Ruled out by measurement, not assumption: the guest binary (runs, correct version), the guest service (systemd active, listening --listen-vsock 42420, all preflights SUCCESS), and a missing Hyper-V transport — that was my first hypothesis and dmesg refuted it (hv_sock IS registered). Strongest open lead: no GuestCommunicationServices registration for port 42420 and nothing in the repo ever writes one — causation NOT proven, since this host had a working wire on 2026-08-11.  === WHAT THIS MEANS FOR YOUR MERGE === Do not read this as "windows is broken, hold the release" without weighing one thing: I cannot yet distinguish a regression in the candidate from a host-local environment change (this machine now runs WSL 2.7.11.0, and the purge may have removed state). The honest status is UNPROVEN, not FAILED-BY-THE-CANDIDATE. The decisive experiment is an elevated registry add plus retry, which is a machine-scope change I deliberately did not make unilaterally.
