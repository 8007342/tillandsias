  context: 'Observed on lenovinha 2026-11-04 (1988-trkp live run): tillandsias --cloud 8007342/mcp-test --opencode-web exited 1 with "OpenCode Web app did not become reachable with a registered session in 30s" (URL http://opencode.mcp-test.localhost:8080/). Every attempt (1-19) saw status 502 (starting). The forge itself was healthy: container started 20:06:35Z, and its log shows "opencode server listening on http://127.0.0.1:4097" at 20:07:17Z, about 41 s after start, behind the sse-keepalive-proxy on 4096. So the fixed 30 s window is shorter than a cold forge start (the opencode binary first runs from ~/.cache/tillandsias-project/npm). The forge was left running and served its MCP lane normally.'
  exit_criteria:
