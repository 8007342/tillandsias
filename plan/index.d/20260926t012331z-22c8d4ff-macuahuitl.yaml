      summary: |
        PER-LAUNCH VARIANT (macuahuitl, 2026-09-26; operator ruling on 1376-8zdz: a new swapfile every launch, deleted on shutdown). What WSL2 can do: the swap VHD is created by WSL at VM boot when the configured swapFile is absent (default %UserProfile%\AppData\Local\Temp\swap.vhdx; microsoft/WSL discussion 10885) and is a property of the utility VM, not of a container, so "per launch" on Windows means PER VM BOOT: the tray points swapFile at %LocalAppData%\tillandsias\wsl-swap.vhdx, and on tray exit, when wsl --list --running shows only the tray's distro, runs wsl --shutdown and deletes the vhdx; the next start recreates it. Not achievable per forge launch without restarting the VM (which would kill the user's other distros), so per-forge is refused on this platform and the design says so. MEASUREMENT yolanda must take before this lands: (1) with swapFile set, record the vhdx creation time and size, wsl --shutdown, start a distro: is the file recreated (new creation time) or reused (same file, same size)? (2) after wsl --shutdown, can the vhdx be deleted (not locked by vmmem/wslservice)? (3) with sparseVhd=true, is swap=8GB honoured and does the file stay sparse after a forge spill? (4) does wsl --shutdown from the tray ever find another running distro on this host? Report the four answers as an event here. Design: plan/issues/forge-memory-swap-architecture-design-2026-09-26.md section 9.2.
