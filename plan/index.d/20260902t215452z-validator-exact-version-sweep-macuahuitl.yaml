packets:
  - packet_id: validators-pinned-to-an-exact-version-block-the-first-bump
    order: 968-uhzg
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags:
      - fail-loud
      - schema
      - fleet
      - guard
    estimated_hours: 3
    title: |
      A validator that tests `== <version>` makes the first schema bump unpublishable, and stays latent until someone bumps — sweep the fleet for the pattern instead of finding them one host at a time.
    context: |
      FOUND AND SELF-REPORTED BY lenovinha 2026-09-02 while implementing
      793-qr4t: scripts/host-capability-probe.sh validated
      `schema_version == 2` exactly, so their bump to 3 — the change that made
      the row worth republishing — made the row unpublishable. Their framing is
      the packet: the exact pin makes the FIRST bump fail, so the defect is
      invisible until someone bumps, and on a schema nobody had bumped since
      808-43mw it had been latent the whole time.
      WHY A SWEEP RATHER THAN A FIX. This is one instance of a class the fleet
      hit repeatedly on 2026-09-02 — a guard that stops being able to observe
      the thing it guards, and reports success or refusal rather than
      inability. Same day, same class, five hosts: core.hooksPath replacing
      .git/hooks so a spy hook was never invoked (two hosts, independently); a
      mutation arm steered by $1 that silently stopped mutating; a fixture
      inheriting the ambient TILLANDSIAS_BREW_AUTOINSTALL=0 set by the very
      protocol it serves; and this. The remedy the fleet keeps arriving at,
      first stated by yolanda, is a guard that makes the second copy
      impossible to add silently rather than more care on each copy.
      SCOPE: mechanical and cheap. Enumerate exact-equality version
      comparisons in validators and generators across scripts/, images/ and
      crates/; for each, decide floor (`>=`), range, or genuinely-exact with
      a stated reason. An exact pin is sometimes right — it is a claim that
      no later version is acceptable, which must be written down where the
      next person bumping will read it.
    exit_criteria:
      - every exact-version comparison in a validator or generator is enumerated with its file and line, and each is classified floor / range / exact-with-reason
      - the ones that should be floors are changed to floors, and a fixture proves a bumped version still validates
      - a guard or litmus arm names any NEW exact-version comparison introduced in a validator, so the class cannot re-enter silently
      - the four sibling instances from 2026-09-02 are cited in the closure as the class this belongs to, not as duplicates to fix here
