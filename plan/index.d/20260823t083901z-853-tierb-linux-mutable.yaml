        TIER B MEASURED WITH A CAPABLE JUDGE, AND THE COMPLEMENT MECHANISM
        WORKS. Unblocked only because yesterday's "inference ceiling" turned
        out to be my own error — qwen2.5:7b runs fine.

        73 questions (33 true near-miss + 40 in-corpus from the relabelled set),
        complement-paired, quiet GPU (0% / 640 MiB before; 39% / 9.5 GiB during,
        this host's own load), 39s total.

          in-corpus   SUPPORTED    8/40  (20%)
          near-miss   UNSUPPORTED 31/33  (94%)
          balanced accuracy               57%
          CONTRADICTIONS caught by pairing 17/73 (23%)

        THE 94% IS THE TRAP AND THE 20% IS NOT WHAT IT LOOKS LIKE. Scored on
        the near-miss band alone this judge is excellent, which is exactly the
        shape that made qwen2.5:0.5b look perfect before its in-corpus control
        exposed it. But the low in-corpus number is NOT judge bias, and finding
        that out required one more experiment.

        MY LABEL AND MY QUESTION DISAGREED, AGAIN. `in-corpus` means SOME file
        in the repo answers it. The judge is asked whether THIS RETRIEVED
        PASSAGE answers it. Those differ every time top-1 is wrong-but-
        plausible, so the metric was conflating retrieval recall with judgement
        quality. Re-judging the refused in-corpus questions against the SOURCE
        FILE the question set recorded, rather than the retrieved chunk:

          6 of 10 flip to YES

        So the judge was substantially RIGHT to refuse: the passage it was
        shown genuinely did not contain the answer. The bottleneck measured
        here is TOP-1 RECALL, not the judge.

        WHAT IS SOUNDLY ESTABLISHED, label-independent: the complement pairing
        caught 17 self-contradictions in 73 questions (23%) — cases where the
        model answered the same way to "does this answer it" and "is the answer
        missing". That is a property of the judge alone, needs no ground truth,
        and is the operator's mechanism doing exactly what it was designed for.
        Pair distribution: NO/YES 48, NO/NO 15, YES/NO 8, YES/YES 2.

        WHAT THIS ARGUES FOR, and it is the operator's own design: k=1 retrieval
        is the weak link, so the answer is not a better judge but MORE QUERIES —
        unfold the question, retrieve for each, judge each, accumulate. A single
        top-1 that misses is indistinguishable from an unanswerable question,
        which is precisely the confusion this whole programme exists to remove.

        NEXT: re-run Tier B judging over top-k rather than top-1, and score
        against the recorded source file so judge quality and retrieval recall
        are measured separately rather than multiplied together.
