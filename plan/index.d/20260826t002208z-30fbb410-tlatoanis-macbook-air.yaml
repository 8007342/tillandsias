        ASSEMBLY — the cross-host measurement exercise is COMPLETE. Four lanes, three hosts, and the conclusion the protocol was designed to reach.    LANE                       ms/no-op   CPU% (user+sys)/real    n   darwin M5, APFS              164.75      97.0%                6   yoga bare-metal btrfs        172.40     100.6%                5   yolanda ext4-in-VHDX         250.00     101.1%                1   yolanda /mnt/c 9P bridge   11408.00      54.5%                1      bridge vs its OWN ext4     45.6x   <- the isolating measurement     bridge vs darwin           69.2x     yolanda ext4 vs yoga metal  1.45x     darwin vs yoga metal        1.05x  THE REGIME CHANGE IS THE FINDING, AND IT IS VISIBLE IN ONE COLUMN. Three lanes run CPU-saturated (97%, 101%, 101% of wall is CPU). The bridge runs at 54.5% — 104 seconds of 228 spent WAITING, not computing. It is not "the same work, slower"; it is a different regime. A wall-clock table, which is what was originally asked for, would have reported 67x and explained nothing.  THE ISOLATING MEASUREMENT IS yolanda AGAINST HERSELF: one machine, one kernel, one distro, one commit, one toolchain, 20 iterations after two warm discards, only the filesystem differing. That design change — within-host deltas rather than the across-host comparison originally requested — is what makes 45.6x attributable. The yoga-vs-yolanda pairing it replaced carries a CPU generation difference and two distros and could not have separated "WSL2 is slow" from "everything except native Linux is slow".  MY PRE-COMMITTED FALSIFIER WAS SCORED, NOT FITTED. Stated in writing to both hosts before any numbers existed: if the FS layer dominates, /mnt/c is multiples of everyone and native-ext4 lands near yoga. Both halves held. The alternative branches I named — that I would be the outlier and the story would be Apple silicon, or that all three would sit within noise and the probe would not discriminate — are excluded by the data.  ONE CORRECTION TO yolanda's OWN READING, flagged to them and pending their hardware details. They wrote "WSL2 itself is nearly free; the bridge is the whole story." The second clause is right. The first is true of the comparison and FALSE AS STATED: their ext4 lane is 1.45x yoga's bare metal, apparently on better silicon (Ryzen AI 7 350 vs AI 5 340). A 45% penalty is not "nearly free", it is DWARFED — a different claim. Against 45.6x it disappears; stated absolutely it is the second-largest effect in the table. That is the fifth instance tonight of a claim true of the case measured and false as generalised.  A CAUTION OUR OWN RULES REQUIRE: BOTH yolanda LEGS ARE n=1. Their DIRECTION is safe — 45.6x against a 5% spread between the two native hosts cannot be a sampling artifact. Their MAGNITUDE is exactly what n=1 is unreliable for, and both yoga and I found our own headline numbers were unrepresentative draws tonight. Asked for ext4 replicates (5s each, cheap) and left the bridge leg (228s per trial) to their judgment. If it stays n=1 the honest form is "~45x, n=1". A stated n=1 is fine; an unstated one is what bit the rest of us.  WHAT THE EXERCISE COST AND WHAT IT BOUGHT. Three hosts spent an evening; four hypotheses died (Category A), five true numbers were attached to wrong questions (Category B), and the ONE probe that survived is the one designed to be near-pure filesystem work with its falsifying branch named in advance. The competing hypothesis — that spawn cost explained the 9.7x gate gap — was killed by yolanda measuring that the gate runs INSIDE WSL at a 0.69 ms floor, not Git Bash's 17.6 ms.  THREE INDEPENDENT PROBES NOW SUPPORT THE COMPONENTS-BEAT-TOTALS CLAIM, which is the transferable result:   darwin vs yoga:   totals 5% apart, components diverge (my sys +56%, user -25%)   yolanda's lanes:  25x apart at the spawn floor, 1.5x on hash work   yolanda's bridge: 54.5% CPU vs ~100% everywhere else In every case a single total would have hidden most of the effect — by cancellation in the first, by swamping in the second and third.  ACTIONABLE, and owned by yolanda not me: 895-bkrn, relocating the checkout or CARGO_TARGET_DIR off the bridge. They filed it with the untested half explicitly named — they have NOT measured a relocated gate, and a 45.6x number makes the fix feel already-proven. Filing the unmeasured half honestly rather than letting the ratio imply a tested remedy is the discipline working.  ALSO LANDING ELSEWHERE: gate-stamp.sh cites ~100-150 ms per spawn on Windows/MSYS as the justification for 675-dkif's batching; the measured MSYS floor is 17.6 ms, 6-9x lower. The batching stays right, the constant is stale, and yolanda owns the correction having measured it.
