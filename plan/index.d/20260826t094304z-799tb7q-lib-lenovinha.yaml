  - packet_id: builder-toolbox-init-set-too-small-for-the-dispatch-pattern
    event:
      type: implemented
      ts: "2026-08-26T10:00:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t093718z
      host: lenovinha
      summary: |
        SECOND SLICE. The first answered the shipped-diagnostic question that was
        blocking the sweep; this one builds the sweep's instrument and converts
        the three highest-traffic callers.

        MEASURED BEFORE BUILDING ANYTHING: 61 scripts under scripts/ call jq, 15
        already guard or dispatch, 46 remain. The toolbox now genuinely carries
        jq (jq-1.8.1 in tillandsias-builder), confirming this packet's earlier
        slice landed — the dispatch pattern is only valid for tools the toolbox
        HAS, which is why the init set had to come first.

        WHY A LIB RATHER THAN 46 MORE INLINE COPIES. The only two dispatchers
        that existed before today duplicate the six-line block verbatim, and I
        wrote both, in one cycle. That is the drift hazard I flagged in my own
        fixture note the same day: a second copy of a rule can diverge from the
        first, after which a caller handles a missing tool per a definition the
        project no longer uses. 48 copies would be worse.

        scripts/lib/tool-dispatch.sh exposes resolve_tool (echoes a command
        PREFIX, or nothing) and require_tool (same, plus a diagnosis naming BOTH
        places checked). It echoes a prefix rather than running the tool because
        callers pipe, redirect and pass heredocs; a wrapper owning invocation
        would have to reproduce all of that. bash 3.2 clean.

        A HEADS UP WENT OUT BEFORE LANDING, per the new sibling_heads_up_protocol
        — new shared surface, with the known sibling call sites named.

        CONVERTED: cycle-metrics.sh (7 sites), select-work-batch.sh (9),
        local-ci.sh (9) — the three every host runs every cycle. Each keeps a
        literal-jq fallback if the lib cannot be sourced, so a lost lib degrades
        to the previous behaviour rather than to a crash.

        ONE DELIBERATE NON-CONVERSION, and it is guarded because it reads as an
        oversight: tray-diagnose.sh and diagnose-macos-provision.sh SHIP. A
        shipped script that sources a sibling lib acquires a dependency that may
        not exist where it runs, and those two exist to work on a machine that
        has nothing. They keep inline copies; a fixture arm FAILS if anyone tidies
        them into the lib.
  - packet_id: builder-toolbox-init-set-too-small-for-the-dispatch-pattern
    event:
      type: verified
      ts: "2026-08-26T10:05:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t093718z
      host: lenovinha
      summary: |
        scripts/test-tool-dispatch-lib.sh all arms green, pinned by
        litmus:tool-dispatch-lib (bound; ratchet checked). ./build.sh --check
        green. Behaviour of the converted scripts verified unchanged:
        cycle-metrics still emits its eight key=value lines, select-work-batch
        still selects the same batch.

        THE FALLBACK ARM COST ME TWO WRONG ANSWERS BEFORE IT WAS RIGHT, and both
        were harness faults that looked like code faults:
          - `env -i PATH=<curated>` strips the environment podman needs, so the
            toolbox arm returned NONE. I nearly recorded "the fallback does not
            engage".
          - dropping /usr/bin from PATH removes every other utility, so the
            shell could not even start.
        The only construction that isolates the variable is a curated MIRROR of
        /usr/bin with jq omitted. The fixture now ASSERTS the mask before relying
        on it, because a fixture whose environment does not hold its own
        precondition cannot fail for the right reason. Correctly resolved:
        `toolbox run --container tillandsias-builder jq`.

        A COST THE NEXT CONVERTER MUST HAVE, measured here: a single
        `toolbox run ... jq` is ~264 ms against ~1 ms for host jq. For these
        three scripts (7-9 sites each) that is ~2s added on a jq-less host —
        acceptable. IT IS NOT ACCEPTABLE FOR A CALLER THAT INVOKES jq INSIDE A
        LOOP: one call per ledger row would turn milliseconds into minutes. Check
        for loop-invocation before converting, and prefer restructuring to a
        single jq pass over converting a loop.

        NOT CLOSED. 43 callers remain, plus the `rg` callers
        (check-cheatsheet-refs.sh, test-forge-config-trust-cross-platform-parity.sh)
        and the bare openssl CLI callers (build.sh, diagnose-proxy.sh,
        run-forge-project.sh, orchestrate-enclave.sh). The instrument exists now,
        so those are mechanical modulo the loop caveat above; they stay a
        separate slice because a 46-file diff is not reviewable in one change.
