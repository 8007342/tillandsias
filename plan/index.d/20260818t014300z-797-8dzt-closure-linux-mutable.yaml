      summary: |
        THE GUARD'S FIRST DRAFT WAS VACUOUS, IN EXACTLY THE WAY IT EXISTS TO
        CATCH, and its own control caught it. Recording it because the coincidence
        is instructive rather than funny.

        The first version resolved a bound with a fixed-string search:
          grep -rqF -- "$needle" "$crate_src"
        Scenario 2 plants a bound naming a symbol that exists NOWHERE and
        requires a violation. It reported ok. The needle was found — inside the
        very `.split("fn vanished_neighbour")` call under test. Every bound
        resolved to ITSELF, so the guard could never accuse anything, and on the
        real tree it printed a confident `ok:source-slice-bounds:13 checked`.

        That is the same self-reference trap that made the ORIGINAL guard in
        remote_projects.rs unfalsifiable, and the same one that made the litmus
        pin fixture pass earlier tonight when its slice ran to end-of-file and
        swallowed the test's own assertion text. Three instances, one shape: a
        checker whose subject includes the checker.

        Fixed by requiring the needle to appear as a DECLARATION —
        `^[[:space:]]*<needle>[[:space:](<{]` — which a string literal never
        satisfies because `.split("` precedes it.

        WHAT MADE THE DIFFERENCE was not care, it was writing scenario 2 BEFORE
        trusting the green. A guard that has never been shown to fail is not a
        guard, and this one was ok-on-the-real-tree the whole time it was
        broken.

        DELIBERATELY NOT DONE: no attempt to check shell `sed -n '/a/,/b/p'`
        windows for dead end-patterns. Their terminators are structural (`^}`,
        `^## `, `^$`) rather than names, so the failure mode differs — a missing
        structural terminator runs to EOF too, but there is no rename that can
        remove `^}` from a shell function. If someone later bounds a shell slice
        on a FUNCTION NAME, this guard will not see it; that is a known edge and
        a cheap follow-on if it ever appears.
