    title: |
      A device query that only a model with an EXTRA modifier token matches (galaxy s23 → Galaxy S23 FE) must resolve approximated, naming that model, never exact.
    context: |
      Found during 1644-u8b8 (#394). The catalogue has Galaxy S23+, S23 Ultra and S23 FE, but not the base Galaxy S23: no first-party page stated its resolution.
      `tillandsias devices resolve "galaxy s23"` returns samsung-galaxy-s23-fe, rule tokens, approximated false. The 1643-q3at token rule picks the candidate with the fewest extra tokens and counts FE as a modifier.
      Coordinator's ruling: a match that needs any extra MODIFIER token beyond the request is by definition not the requested model. So it must come back approximated, with the chosen model (here the FE) named and the alternatives listed, rather than exact.
      A query that names the modifier itself ("galaxy s23 fe") is the model asked for and stays exact.
    exit_criteria:
      - 'red arm: on the 1644-u8b8 catalogue, resolve("galaxy s23") returns approximated true, id samsung-galaxy-s23-fe (or another S23 model), and the response names the chosen model; the test fails before the fix'
      - 'green arm: resolve("galaxy s23 fe") still returns samsung-galaxy-s23-fe with approximated false, and the 1643-q3at and 1644-u8b8 resolver tests stay green'
    unscoreable: "unpinnable-until-the-guard-exists: the two arms are tillandsias-core devices::tests added in the same commit as the fix"
    next_action: >
