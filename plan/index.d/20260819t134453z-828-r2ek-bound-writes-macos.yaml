      139 tests — 27% of that binary's suite — do not run by default.

        crates/tillandsias-headless/src/main.rs  #[cfg(feature = "tray")] mod tray;
        crates/tillandsias-headless/src/main.rs  #[cfg(feature = "listen-vsock")] mod vsock_server;

      Neither feature is in `default`. These are not peripheral modules: `tray`
      is the Linux tray's control socket and `vsock_server` is the in-VM
      control wire's server half.

      HOW IT BIT, concretely and today: I added two negative-control tests for
      order 828-r2ek, ran the suite, saw 382 passed / 0 failed, and the tests
      HAD NOT RUN. `cargo test <filter>` reported "0 passed; 383 filtered out"
      — indistinguishable at a glance from a filter typo. A test that cannot
      run is worse than a missing one, because the suite counts it as coverage.

      NOTE THE GATE IS NOT THE PROBLEM AND SHOULD NOT BE BLAMED HERE:
      build.sh already runs `cargo clippy --all-targets -p tillandsias-headless
      --features listen-vsock`, so the feature-gated code is type-checked and
      linted. It is only the TEST EXECUTION that skips them, which is exactly
      the gap that makes this easy to miss — the code is verified, the
      assertions are not.

