      finds whole modules never compiled. Together: the number at the end of a
      workspace test run on this fleet does not mean what it appears to mean,
      in two independent ways, and both are silent.

  - packet_id: tray-broadcast-blocks-forever-on-one-stalled-subscriber
    order: 832-me6z
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "broadcast_control_envelope holds the subscriber-list lock across a blocking write_all with NO write timeout, so a single subscriber that stops draining wedges every future broadcast to every subscriber, forever"
    deliverable: "a stalled subscriber is evicted or timed out instead of blocking the broadcast path"
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [rust, tray, host-shell, fail-loud, concurrency]
    estimated_hours: 4
    context: |
      FOUND BY FALSIFICATION 2026-08-19, not by reading. While confirming the
      828-r2ek bound was load-bearing I removed it and expected the test to go
      red. It did not — it HUNG, and the runner reported
      "has been running for over 60 seconds".

      That is the finding. Without a length bound the failure mode is NOT
      "the peer rejects an oversize frame"; it is that the WRITER BLOCKS
      FOREVER once the socket buffer fills, because:

        crates/tillandsias-headless/src/tray/mod.rs
        fn broadcast_control_envelope(...) {
            let mut subscribers = subscribers.lock()...;      // list lock
            subscribers.retain(|subscriber| {
                let Ok(mut stream) = subscriber.lock() ...;   // per-sub lock
                write_control_envelope(&mut stream, envelope).is_ok()
            });
        }

      `write_control_envelope` ends in a blocking `write_all` on a
      std::os::unix::net::UnixStream, and there is NO write timeout anywhere on
      that socket — `set_write_timeout` / `set_nonblocking` / SO_SNDTIMEO do not
      appear in the file. So the blocking write happens while holding BOTH the
      per-subscriber lock AND the whole subscriber-list lock, and every later
      broadcast to every OTHER subscriber queues behind it indefinitely.

      THE 828-r2ek BOUND DOES NOT FIX THIS and must not be read as fixing it.
      Capping frames at 64 KiB makes the oversize path unreachable, but a
      subscriber that simply stops reading — a wedged tray, a stopped
      debugger, a SIGSTOPped process, a peer that is merely slow — still fills
      its buffer at normal frame sizes and produces the same wedge. The bound
      removes one trigger, not the mechanism.

      SHAPE OF THE FIX, not prescribed: a write deadline
      (set_write_timeout) with eviction on expiry fits the existing `retain`
      (a failed write already drops the subscriber), and is the smallest change
      that turns an indefinite hang into a dropped subscriber. Whatever is
      chosen, the invariant worth stating is that no lock covering ALL
      subscribers may be held across an unbounded wait on ONE of them.

