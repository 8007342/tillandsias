      summary: |
        FOUR OF THE EIGHT BOUNDED — the ones this host can verify; two tested.
        Left `ready`; the remainder is dispositioned below rather than guessed
        at.

        BOUNDED, each symmetric with a reader that already had the bound:
          * tray/mod.rs write_control_envelope — its reader has always refused
            inbound frames over MAX_MESSAGE_BYTES; the writer refused nothing.
          * vsock_server.rs write_envelope — the guest could emit a frame every
            peer is obliged to reject, so the connection died at the READER,
            which is the wrong end to diagnose from: the writer saw a
            successful write and a closed socket with nothing linking them.
          * pty_vsock_bridge.rs Hello — its HelloAck reader and its PtyData
            sender both bound; the Hello that OPENS the session did not, so an
            oversize Hello failed at HelloAck with no hint of the real cause.
          * main.rs send_issue_web_session — see the four-not-three note below.

        THE TRAY SITE NEEDED MORE THAN A BOUND, and this is the part worth
        keeping. TEN of its fifteen call sites discard the Result with
        `let _ = write_control_envelope(...)`. A bare `?` there converts a
        newly-refused write into a SILENT MISSING REPLY — a hang, not an error,
        and strictly worse than the unbounded write it replaces. So the
        refusal is BOTH returned and logged via warn!, naming the message kind
        and saying plainly that no reply will be sent.

        TWO NEGATIVE CONTROLS, each asserting the boundary is INCLUSIVE at
        MAX_MESSAGE_BYTES and that nothing reaches the wire on refusal (the
        sink is asserted empty, not just the error checked).

        FALSIFICATION FOUND A BUG, WHICH IS THE POINT OF DOING IT.
        vsock_server's control went red with the guard disabled — a clean
        falsification. tray's did NOT go red: it HUNG, "running for over 60
        seconds". Without the bound the failure mode is not "the peer rejects
        it" but "the writer blocks forever once the socket buffer fills",
        because broadcast_control_envelope holds the subscriber-LIST lock
        across a blocking write_all that has no write timeout. One stalled
        subscriber therefore wedges every future broadcast to every other
        subscriber. Filed as 832-me6z (p1); the bound landed here does NOT fix
        it, because a merely SLOW reader reproduces it at normal frame sizes.
        The test now drains the peer on a thread so the falsified case fails
        fast and for the right reason — a test that hangs under falsification
        cannot tell you whether the thing it guards still works.

        NOT DONE, DISPOSITIONED RATHER THAN GUESSED:
          * hvsocket.rs:68 and :145 (Windows) — cfg(target_os = "windows"), so
            they do not compile on this host and an edit here would be
            unverifiable. Left for the Windows lane deliberately; 795-5itp
            reached the same conclusion about the same file.
          * transport.rs and provisioning.rs writes are TEST-ONLY fakes
            (#[cfg(test)] / #[cfg(all(test, unix))]). They must STAY
            hand-rolled and unbounded — they are the peers that prove
            codec/hand-rolled and bounded/unbounded interop, so bounding them
            would delete the negative half of the evidence.
        FOUR, NOT THREE — AND I ALMOST FILED THE OPPOSITE. I first recorded
        that main.rs's site "is not a length-prefix write at HEAD", because my
        grep pattern was `len() as u32).to_be_bytes`. The real site
        (main.rs:11355, send_issue_web_session) computes the length FIRST —
        `let len = encoded.len() as u32; let mut frame = len.to_be_bytes()...`
        — so a pattern keyed to the inline idiom cannot see it. Caught by
        re-deriving the claim before letting it stand. It is now bounded, with
        the error type matching that function's Result<(), String>. Its ACK
        reader already bounded; the write did not.
        Third instance this cycle of one defect class: a check keyed to a
        surface form rather than the thing itself.

        TWO PROCESS FAILURES OF MY OWN, both caught, both the same shape:
        1. THE COMMENT I WROTE WAS ALREADY WRONG. It cited "nine call sites"
           and nine line numbers; there are TEN, and my own edit had shifted
           every number before the file was saved. Replaced with the count and
           the grep idiom. Pinning line numbers in a comment is precisely
           828-itr9's defect, committed by the person who filed it.
        2. MY FIRST FALSIFICATION WAS SILENTLY INVALID. To confirm the guard
           was removed I grepped the file for its error string — which also
           appears in the TEST's assertion, so the check reported "guard still
           present" when only the test's copy remained. Tracing it showed the
           guard had in fact ALREADY been stripped by an earlier killed run,
           and a whole-file grep had let me read that as intact. Fixed by
           scoping every check to the function body
           (awk '/^fn write_control_envelope/,/^}/'), which is how all three
           guards were then verified present before re-running.
           A verification keyed on a string that occurs in more than one place
           is not a verification. That is the same lesson as (1) and as
           828-itr9, arrived at from a third direction in one cycle.

        Filed 831-wmn4: the two tests above did not run at first and the suite
        said 382 passed / 0 failed. `tray` and `vsock_server` are behind
        non-default features, so 139 of this binary's 522 tests never execute
