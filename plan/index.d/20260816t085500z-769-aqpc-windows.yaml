    title: |
      cycle-metrics.sh commits_this_cycle counts first-parent only, so pre-push merges of origin/linux-next stop inflating the flow telemetry.
    problem: |
      Observed 2026-08-16 (windows cycle 1): `repo: commits_this_cycle=24`
      where the cycle had made 3 commits + 1 merge — the plain
      `git rev-list --count` included 20 commits merged in from
      origin/linux-next by the mandatory pre-push gate. The number feeds
      `--emit-flow commits=`, so overhead_ratio (the greedier-batching
      decision input, 682-yiz7) was inflated ~6x on every platform-branch
      cycle that merged, and the cycle-1 flow record had to hand-carry
      first-parent=3 around its own tooling.
    exit_criteria:
      - |
          git rev-list --count runs with --first-parent in scripts/cycle-metrics.sh; the merge commit itself still counts (making it was cycle work), merged-in sibling commits do not.

      - |
          litmus:cycle-flow-telemetry-shape pins it behaviorally: a scratch repo with a --no-ff merged side branch reports commits_this_cycle=2 (work commit + merge), not 4.
    events:
