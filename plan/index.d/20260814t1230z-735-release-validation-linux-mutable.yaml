packets:
  - packet_id: v04-release-gate-windows-e2e-evidence
    order: 735-dim8
    release_target: stable-milestone-v1
    status: ready
    desired_release: v0.5
    priority: p0
    kind: validation
    title: 'RELEASE GATE v0.4: windows host must post local-build e2e evidence for the merge to main'
    pickup_role: windows
    depends_on: []
    capability_tags:
      - release
      - e2e
      - windows
    context: |
      The linux_mutable host owns the merge to main and the release cycle and is
      preparing to promote linux-next (459 commits ahead of main) as a v0.4
      release. It cannot produce Windows evidence, and a release whose Windows
      half was never run is a release nobody confirmed.
      Linux-side state at request time: ./build.sh --check green, ./build.sh
      --test green, scripts/local-ci.sh --phase runtime 3/3, litmus instant
      pre-build 222/222 after four repairs (see the cycle's loop-status entry).
    exit_criteria:
      - /build-install-and-smoke-test-e2e run on the Windows host against the merge candidate, with the run's own log paths cited
      - the FINAL step is a re-run of the health check AFTER the last mutating step, not after the last interesting one (the 2026-08-10 lesson)
      - result posted as a plan event on THIS packet with pass/fail per stage and any finding filed separately
      - cargo test -p tillandsias-windows-tray run natively, and scripts/check-windows-only-sources-verified.sh stamp applied if green
    verifiable_closure: |
      A plan event on this packet naming the commit tested, the per-stage
      verdicts, and either `stamp` applied or the reason it was withheld.
    notes: |
      scripts/check-windows-only-sources-verified.sh currently reports
      stale:windows-sources-never-verified:4 on every linux gate run. Those four
      files have never been compiled by their own toolchain; a Linux build
      substitutes src/stubs/. That is the single largest unverified surface in
      this release.

  - packet_id: v04-release-gate-macos-e2e-evidence
    order: 735-6iki
    release_target: stable-milestone-v1
    status: ready
    desired_release: v0.5
    priority: p0
    kind: validation
    title: 'RELEASE GATE v0.4: macOS host must post local-build e2e evidence for the merge to main'
    pickup_role: macos
    depends_on: []
    capability_tags:
      - release
      - e2e
      - macos
    context: |
      Same gate as 735-dim8, macOS half. osx-next is fully merged into
      linux-next (drift 0) as of 2026-08-14, so the merge candidate already
      contains every macOS commit — which is exactly why macOS evidence against
      it is meaningful rather than redundant.
    exit_criteria:
      - /build-install-and-smoke-test-e2e run on the macOS host against the merge candidate, with log paths cited
      - the final health check runs AFTER the last mutating step
      - result posted as a plan event on THIS packet with per-stage verdicts
      - codesign --verify --deep --strict on the built app reported explicitly (the check is now asserted rather than piped into a log, order 727-kmks)
    verifiable_closure: |
      A plan event on this packet naming the commit tested and the per-stage
      verdicts.

  - packet_id: macos-tray-diagnose-converging-exit-three
    order: 735-2g5i
    release_target: stable-milestone-v1
    status: ready
    desired_release: v0.5
    priority: p1
    kind: fix
    title: 'macOS --diagnose still collapses CONVERGING into degraded (exit 2); windows separates it as exit 3'
    pickup_role: macos
    depends_on: []
    capability_tags:
      - macos
      - tray
      - cross-platform
    context: |
      Order 647-i98k landed on windows-next: a converging VM and a broken VM
      shared exit 2, so a scripted post-install check that runs --diagnose once
      and branches on the code called a still-provisioning host broken. Windows
      now returns exit 3 for converging. macOS does not.
      Found while validating the v0.4 merge candidate:
      litmus:exit-code-provisioned-zero-degraded-two-symmetric went red because
      it pinned the windows test's NAME, which 647-i98k legitimately renamed.
      Repairing the name pin exposed the real divergence underneath — the suite
      is called "symmetric" and the symmetry is broken.
      The suite now REPORTS the asymmetry rather than enforcing it, deliberately:
      enforcing one host's pending work as every host's red gate is not
      something the fleet can act on.
    exit_criteria:
      - macOS --diagnose returns 3 for a converging VM and 2 only for a genuinely degraded one
      - the macos-tray exit-code pin test covers the converging case
      - the symmetry litmus's ASYMMETRY REPORT step flips to `ok: exit-3 converging parity reached`
    verifiable_closure: |
      litmus:exit-code-provisioned-zero-degraded-two-symmetric prints
      `ok: exit-3 converging parity reached` instead of the PENDING form.

  - packet_id: v04-release-promotion-linux-owned
    order: 735-ead5
    release_target: stable-milestone-v1
    status: in_progress
    desired_release: v0.5
    priority: p0
    kind: release
    title: 'v0.4 promotion: merge linux-next to main and publish, once both sibling gates report'
    pickup_role: linux
    depends_on:
      - v04-release-gate-windows-e2e-evidence
      - v04-release-gate-macos-e2e-evidence
    capability_tags:
      - release
      - coordination
    context: |
      Operator directive 2026-08-14: promote the current v0.4 code to main and
      publish a v0.4 release to latest. linux_mutable owns the merge and the
      release cycle. linux-next is 459 commits ahead of main; the last published
      release is v0.4.260810.1 (4 days old); VERSION is 0.4.260812.1, already
      bumped on main via PR #95 and now merged back.
    exit_criteria:
      - windows and macOS e2e evidence posted (735-dim8, 735-6iki)
      - PR linux-next -> main opened, gated locally, and merged
      - VERSION bumped in its own isolated commit, tag pushed, release workflow dispatched and WATCHED to completion
      - plan records the new latest release so immutable Linux hosts run curl-install e2e against it
    verifiable_closure: |
      `gh release view <tag>` lists the published assets and the plan records the
      tag as the latest tested release.
    notes: |
      Held deliberately at in_progress rather than driven to completion in one
      pass: the two sibling gates are the release's cross-platform evidence and
      neither host has reported yet.
