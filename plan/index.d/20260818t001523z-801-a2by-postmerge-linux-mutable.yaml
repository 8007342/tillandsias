        POST-MERGE REPAIR AND TWO SIGHTINGS.

        BROKEN BY MY OWN CHANGE, FOUND AND FIXED: scripts/bench-accel-lane.sh
        arrived in the merge defaulting to
        /dev/shm/tillandsias-experts/spec-index/chunks.jsonl. After 801-a2by
        nothing writes there, so the accel benchmark — the instrument 406/802
        uses to characterise a host's lanes — would have refused with "no chunk
        corpus" on every host that took this change. It now asks the PRODUCER
        where it publishes (`spec-index-ensure.sh --where`, which needs no
        endpoint and no binary) and keeps the tmpfs literal only as a last
        resort, so a host with a warm legacy index still benchmarks. It is
        deliberately NOT a fourth carrier of the resolution block: one call to
        --where cannot drift from the producer, whereas a fourth copy could.

        THE CONTROL FOR THAT FIX WAS INCONCLUSIVE ON ITS FIRST RUN, and the
        reason is worth recording because it is the shape of a false green. I
        pointed XDG_CACHE_HOME at an empty directory and the bench still
        succeeded — not because resolution was ignored, but because a LEGACY
        /dev/shm index satisfied the last-resort fallback. The fallback was
        working; the control simply was not isolating anything. Redone
        decisively: plant a durable index of eight 425-character marker chunks,
        and require the bench to report p50_chars=423 rather than the real
        corpus's 364. It did, so the durable path really is consulted first; and
        with nothing reachable it exits 2 with the loud refusal.

        SIGHTING 1 — TWO PRODUCERS ARE LIVE ON THIS HOST RIGHT NOW, transiently.
        /dev/shm/tillandsias-experts/spec-index/ holds a complete 183 MiB index
        stamped 17:02, six minutes AFTER my durable build at 16:56. I did not
        write it. The main checkout at ~/claudia/tillandsias is a different tree
        at an older commit, still carrying the pre-801-a2by ensure script, and
        scripts/dev-host-experts.sh (which arrived in this same merge) has
        evidently enabled TILLANDSIAS_HOST_EXPERTS on this host — so its
        post-commit hook is now actively building indexes into tmpfs. This is
        benign and self-clearing: once linux-next carries this change and that
        checkout pulls, its hook publishes to the durable tier instead. But
        until then the host has a stale tmpfs index that the last-resort
        fallback can still serve, and anyone measuring "did the durable tier get
        used" must control for it, exactly as the redone control above does.

        SIGHTING 2 — dev-host-experts.sh AND 801-a2by COMPOSE WELL, unplanned.
        685-yidq gated the post-commit refresh behind a variable nothing set, so
        the refresh had never run on any host; that packet sets it. On its own
        that would mean a per-commit 43s rebuild whose result dies at the next
        reboot. With 801-a2by the same rebuild lands in the durable tier and is
        shared read-only by every forge, which is what makes enabling the gate
        worth the cycles rather than a per-commit tax. Neither packet knew about
        the other; the pairing is the right one.
