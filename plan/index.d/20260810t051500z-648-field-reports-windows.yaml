packets:

  - packet_id: github-login-prompts-for-an-unneeded-token
    order: 648-e5pf
    status: ready
    desired_release: v0.5
    priority: p2
    title: "GitHub login prompts for a token, the token fails silently, and device flow completes the sign-in"
    kind: bug
    deliverable: crates/tillandsias-headless/src/main.rs
    depends_on: []
    pickup_role: linux
    capability_tags: [auth, github, login, ux, secrets, windows]
    context: >
      OPERATOR FIELD REPORT, 2026-08-10: "I pasted the token, then it showed me a
      code and a github.com/login/device url, the device login worked fine but
      then the token would not be needed."

      Evidence. Guest log (one continuous run): the token prompt, then
      "! First copy your one-time code: 94D8-AE05 / Open this URL …
      github.com/login/device", then "Authentication complete / Logged in as
      8007342". Tray log, same window: 04:58:59 signing-in -> signed-out, then
      05:00:34 signed-out -> signed-in. The intermediate signed-out is the tell:
      the pasted token did NOT authenticate; the device flow 95s later did.

      Two costs. (a) A live GitHub token was collected that the system did not
      need — after "please paste your token", the least-surprise expectation is
      that the token is what authenticated you. (b) The prompt makes a promise
      the flow does not keep: GH_LOGIN_TOKEN_SCRIPT aborts on an empty token
      ("No token entered; aborting", exit 1), so the documented escape from the
      prompt is failure, not the device flow that actually works.

      ESTABLISHED: GH_LOGIN_TOKEN_SCRIPT (main.rs:7100) pipes the token to
      `gh auth login --with-token` and contains no device flow; `--with-token`
      never emits a device code; GitHub is registered as AuthModel::OAuthDevice
      (main.rs:523) while being handed the TOKEN-entry script — a declared auth
      model and an actual input method that disagree.

      NOT ESTABLISHED: which component launched the device flow after the token
      attempt failed. Not traced to a call site; deliberately not guessed at.

      Full write-up: plan/issues/github-login-asks-for-a-token-it-does-not-need-2026-08-10.md
    exit_criteria:
      - >
        Decide which path is primary. If device flow is primary, stop prompting
        for a token. If the token is primary, announce the fallback — the prompt
        says a token is optional and Enter continues with browser sign-in, and an
        empty token must not abort with an error.
      - >
        A failed token attempt is reported to the operator rather than sliding
        silently into a different flow.
    verifiable_closure: >
      A litmus or scripted run of the login lane asserts that the operator is
      never asked for a credential the flow does not consume, and that a rejected
      token produces a visible message before any fallback begins.
    events:
      - ts: "2026-08-10T05:15:00Z"
        event: filed
        summary: Operator field report from the Windows host, evidence from guest + tray logs.

  - packet_id: provision-failed-retry-is-a-dead-affordance
    order: 648-jv69
    status: ready
    desired_release: v0.5
    priority: p1
    title: "\"provision failed — retry\" is shown over a stopped process; retry neither retries nor is actionable"
    kind: bug
    deliverable: crates/tillandsias-windows-tray/src
    depends_on: []
    pickup_role: windows
    capability_tags: [windows, tray, ux, provisioning, recovery]
    context: >
      OPERATOR FIELD REPORT, 2026-08-10: "it says 'provision failed - retry' but
      'retry' is not actionable, I don't know if it's retrying at all."

      It was not retrying. Log: attempts 1-9 with backoff 04:34:09 -> 04:40:10,
      then `ERROR WSL recipe provisioning failed err=control-wire handshake did
      not succeed within budget: attempt 10` at 04:41:10, then a diagnostics
      bundle at 04:41:42, then NOTHING. The budget was exhausted, the process
      stopped, and a control labelled "retry" remained. The operator found the
      machine ~15 minutes later, dead behind a live-looking button.

      Same shape as 632-retq / 643-bnag / 647-i98k — a terminal state wearing the
      costume of a live one — but in the UI rather than an exit code.

      Recovery was mechanical: stop the tray, `wsl --terminate tillandsias`,
      relaunch; the control wire came up in seconds and --diagnose reported
      HEALTHY. That the fix is this simple is what makes the dead button worse.
    exit_criteria:
      - >
        Either the tray keeps retrying on a long backoff and SAYS so (with
        attempt count and next-attempt time), or it states plainly that
        provisioning has stopped and the control actually starts a fresh attempt.
      - >
        The operator can always tell, from the UI alone, whether work is still in
        progress.
      - >
        Consider self-recovery: on repeated handshake failure, terminate the VM
        and re-provision before surfacing a failure at all.
    verifiable_closure: >
      After a forced provisioning failure, the tray's state text distinguishes
      "still retrying" from "stopped", and activating the retry control produces
      a new attempt visible in the log.
    events:
      - ts: "2026-08-10T05:15:00Z"
        event: filed
        summary: Operator field report; log evidence shows retries ceased 15 minutes before the report.

  - packet_id: tray-guest-version-skew-wedges-control-wire
    order: 648-772y
    status: ready
    desired_release: v0.5
    priority: p2
    title: "An older tray re-injects older guest wiring, and the newer tray's control-wire handshake then never completes"
    kind: bug
    deliverable: crates/tillandsias-windows-tray/src/wsl_lifecycle.rs
    depends_on: []
    pickup_role: windows
    capability_tags: [windows, tray, vm-layer, provisioning, versioning]
    context: >
      Root cause of the 648-jv69 incident, from the preserved launch-failure
      diagnostics bundle:

        04:33:27 adopted guest wiring is stale — re-injecting bootstrap logic
                 guest_version="0.4.260810.1" tray_version=0.4.260809.2

      A 0.4.260809.2 tray found a guest provisioned by 0.4.260810.1, judged the
      wiring stale, and re-injected OLDER bootstrap logic. Seven seconds later a
      0.4.260810.1 tray started against that downgraded guest and its hvsocket
      handshake (vsock 42420) never completed — ten 30s timeouts, then failure.

      The skew detection is not wrong and downgrading guest wiring to match an
      older tray is defensible. What is missing is RECOVERY: once the handshake
      fails repeatedly against a guest whose wiring was just rewritten,
      terminating the VM and re-provisioning is the known fix and nothing tries
      it.

      Not exotic: "install an older build over a newer guest" is what an operator
      does when an unstable-channel build misbehaves and they roll back. This
      host's log already carries `WARN build version skew` lines from 2026-08-03
      and 2026-08-05.

      Reproduced here by a downgrade-then-restore sequence run during the
      644-a3wj smoke.
    exit_criteria:
      - >
        After a wiring re-injection, a failing control-wire handshake triggers a
        VM terminate + re-provision rather than exhausting the budget.
      - >
        The skew and the re-injection are surfaced to the operator, not only to
        the log.
    verifiable_closure: >
      Installing an older tray over a newer guest and then upgrading again ends
      with a REACHABLE control wire without manual intervention.
    events:
      - ts: "2026-08-10T05:15:00Z"
        event: filed
        summary: Root-caused from the diagnostics bundle during the 648-jv69 investigation.

