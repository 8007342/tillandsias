        the rule that neither yoga's nor macuahuitl's independent design had, and it is
        the one that stops a branch riding LIGHT and SCOPED landings indefinitely and
        never being fully gated.

        EVERY SKIP PRINTS WHAT IT DID NOT RUN, POSITIVELY, with the gate named, the
