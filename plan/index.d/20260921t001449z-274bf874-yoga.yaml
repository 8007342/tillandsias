        coverage. The tiers must not re-create that silence one level up.

        TWO HAZARDS INHERITED RATHER THAN REDISCOVERED, both measured on the plan-only
        lane under 1056-5344 and both fatal here in a worse way:
          (a) `git log --no-merges A..B` is WRONG for "what did this change touch" — a
              commit arriving THROUGH a merge is itself a non-merge commit newly
              reachable, so the scoped set equals the unscoped one and the fix changes
              nothing while looking correct;
          (b) `--first-parent` ALONE IS A BYPASS — park code on a side branch, merge it
              --no-ff, and it arrives through the SECOND parent where a first-parent
