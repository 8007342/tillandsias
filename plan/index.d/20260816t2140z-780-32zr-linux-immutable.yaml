packets:
  - packet_id: mcp-tool-socket-is-a-ghost-spec-trace
    release_target: stable-milestone-v1
    order: 780-32zr
    status: ready
    desired_release: v0.5
    kind: fix
    pickup_role: linux
    priority: p2
    tags:
      - openspec
      - traceability
      - mcp
      - v0.5
    title: |
      16 `@trace spec:mcp-tool-socket` annotations point at a spec that does not exist — the per-lane MCP socket has no spec of its own.
    context: |
      Every commit touching `crates/tillandsias-headless/src/tray/mod.rs`
      prints 16 pre-commit notices of the form
      `✗ OpenSpec: ghost trace 'spec:mcp-tool-socket' … — no spec exists`.
      `openspec/specs/` contains browser-mcp-server, cheatsheet-mcp-server,
      host-browser-mcp and mcp-on-demand — but no `mcp-tool-socket`.

      This is not cosmetic. The per-lane NDJSON socket introduced by order
      505 (listener-derived attribution, 0600 sockets, per-lane mount
      isolation) is a real, security-relevant surface whose invariants are
      currently traced to nothing. Order 779-5ryn (2026-08-16) folded a
      description of the transport into `host-browser-mcp/spec.md` because
      that was the spec that had drifted — but the socket itself is used by
      more than the browser family (the publish/service trio rides it too),
      so `mcp-tool-socket` deserves either its own spec or a deliberate
      redirect of all 16 traces to an existing one.

      A trace that resolves to nothing is worse than an untraced line: it
      reads as coverage and the gate that would catch drift never runs.
    exit_criteria:
      - |
          Either `openspec/specs/mcp-tool-socket/spec.md` exists and states the per-lane socket contract (path shape, 0600, listener-derived attribution, deny-then-close on an unattributable peer, NDJSON one-object-per-line framing), or every `@trace spec:mcp-tool-socket` annotation is retargeted to the spec that actually owns each invariant.
      - |
          The pre-commit OpenSpec ghost-trace notice count for tray/mod.rs is zero, and a litmus or the existing trace-coverage gate fails if a ghost trace is reintroduced.
