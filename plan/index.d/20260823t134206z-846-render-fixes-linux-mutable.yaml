      summary: |
        I FOLDED THE LIVE LEDGER, IT WENT RED, AND I REVERTED. Two defects in
        the renderer I shipped last cycle, both found only by doing the thing
        rather than dry-running it.

        The fold itself looked perfect: 41 fragments consumed, ready set
        BYTE-IDENTICAL at 378, capability matrix unchanged at 9 rows / 7 of 7
        hosts, `check` still reporting 538 packets with sound references. Then
        ./build.sh --check went RED on
        compaction_on_the_real_ledger_preserves_every_comment_and_item, and a
        ruby probe of the new base died on `Tried to load unspecified class:
        Time`. Reverted with git checkout — nothing committed, nothing pushed,
        tree back to 42 fragments and green.

        (1) UNQUOTED TIMESTAMPS MADE THE BASE UNREADABLE TO RUBY. serde drops
        quotes from a string it considers unambiguous; a bare ISO-8601 scalar
        is not unambiguous to Psych, which infers a Time, and safe_load then
        refuses the whole document. 18 such scalars went in, and the base is
        read by ruby tooling in this repo — the plan archiver among it. This is
        the KNOWN class in
        compaction-folds-unquoted-timestamps-past-the-fragment-gate-2026-08-13.md,
        reproduced by a new writer that had never heard of it. Every date-shaped
        scalar in the block is now quoted.

        (2) THE RENDERER WAS NOT IDEMPOTENT. serde emits sequence items at
        column 0 under a top-level key — `- ts:` — and my replace-existing-block
        pass stripped only whitespace-led lines, so a SECOND fold deleted
        `capabilities:` and orphaned every item beneath it. The sequence is now
        indented, which makes the block uniformly whitespace-led and the strip
        exact. Verified: fold, then fold again, base BYTE-IDENTICAL.

        WHAT THIS SAYS ABOUT DRY-RUN. `compact --dry-run` reported `would fold
        41, 1 refused` and passed parse AND integrity — and it was right about
        all of that. It cannot see what it does not check: nothing in the
        integrity gate asks whether the RESULT is readable by the OTHER
        toolchain, or whether folding twice is stable. A dry run proves the
        thing it models; the gap was in the model.

        AND MY IDEMPOTENCE TEST WAS INCONCLUSIVE TWICE before it was real: I
        copied plan/index.yaml and plan/index.d into scratch and the fold
        REFUSED both times on an archived depends_on, because the copy carried
        no plan/archive (190 entries). Both runs then reported "byte-identical"
        and "ruby parses" about a base that had never been folded. A test whose
        subject did not happen will happily report success.

        208/208 lib, 24/24 bin, clippy clean, forced --check green. The live
