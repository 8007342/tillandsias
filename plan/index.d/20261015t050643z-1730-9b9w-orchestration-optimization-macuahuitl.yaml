  - packet_id: release-tier-litmus-reds-surface-the-day-they-land-and-the-queue-locks-its-checkout
    order: 1736-rnx2
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    size: M
    pickup_role: linux
    capability_tags: [land-queue, litmus, release, gate]
    related: [1730-9b9w, 1731-cshq]
    depends_on: []
    title: |
      A litmus pin broken by a landed PR (#427's PASS-line rewording) reached cut time unseen, because only the release tier runs the pre-build litmus; and nothing stops writes to the checkout while the queue gates there. After each land run, run the pre-build litmus scoped to the specs the landed PRs touched; hold a lock while gating
    context: |
      2026-10-15: litmus-forge-experts-discoverability-shape went red on trunk at #427's landing. It was found hours later by manual triage of a peer's release-build failures (fixed in #446). The scoped run reuses the class selector's spec mapping: litmus for the specs owning the changed files. It runs right after a land run ends, on the coordinator host, with no cron.
      Lock: the queue writes a lock while it holds the checkout. The coordinator's command-policy hook refuses git checkout, merge, switch and file writes in that checkout while the lock is held. Measured near-miss: a no-op --ff-only merge mid-run on 2026-10-15.
    exit_criteria:
      - "a land run that lands a PR breaking a pre-build litmus pin reports the red litmus by name in its own output (red today: silent until the cut)"
      - "while the queue gates, a git merge in the checkout from the coordinator session is refused, naming the running unit"
    unscoreable: "unpinnable-until-the-guard-exists: the scoped-litmus and lock arms are the deliverable"
    next_action: >
      Find how the class selector maps changed paths to specs, add a post-run scoped litmus step to scripts/land-queue.sh, then add the lock and the hook rule.
    provenance: |
      Filed by macuahuitl-fedora, 2026-10-15T05:06:43Z.
    events:
      - type: filed
        ts: "2026-10-15T05:06:43Z"
        host: macuahuitl
        summary: |-
          Release-tier reds surface the day they land; the queue locks its checkout.

  - packet_id: every-host-judges-the-ledger-with-a-plan-binary-that-matches-trunk
    order: 1737-xbh3
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    size: M
    pickup_role: any
    capability_tags: [plan-lane, plan-binary, fleet, ledger]
    related: [1730-9b9w, 1734-cqgk]
    depends_on: []
    title: |
      One host's malformed fragment (depends_on naming an order) passed its own plan-lane check and then made every other host's plan push refuse; and hosts resolve different installed plan binaries (~/.local/bin is older than the checkout), so they disagree on whether the same ledger is valid
    context: |
      2026-10-15, about 04:37Z: yoga pushed 1730-zx3t with `depends_on: [1722-2haw]`, an order where a packet_id is required. Trunk's fold then failed tillandsias-plan check, and lenovinha's and macuahuitl's plan-lane pushes were refused fleet-wide. The fix was a list-replace fragment (3d7d3fe52). But macuahuitl's push script resolved ~/.local/bin/tillandsias-plan, which did not fold the replacement, and refused the fix itself until TILLANDSIAS_PLAN_BIN pointed at the current build.
      Two defects:
      - The plan lane's validation must run the SAME check, with a binary at least as new as trunk's schema, on every host. A push that would break trunk's fold must be refused at the pushing host.
      - An installed plan binary older than the checkout must be noticed and rebuilt, or bypassed, before it judges the ledger. The vocabulary probe (memory: currency is a vocabulary probe, not an mtime) is the established method.
    exit_criteria:
      - "a plan-lane push of a fragment whose depends_on names an order is refused AT THE PUSHING HOST, on every host (red today: yoga's passed)"
      - "the push script refuses or rebuilds a resolved plan binary that cannot fold a list-replace on depends_on, instead of judging the ledger with it (red today on macuahuitl)"
    unscoreable: "unpinnable-until-the-guard-exists: the two arms are the deliverable"
    next_action: >
      Find why yoga's check passed: its resolved binary and its version. Then make push-plan-fragments-to-trunk.sh run plan-binary-probe's currency check before folding, and add a depends_on-must-be-packet-id lint to the fragment parse.
    provenance: |
      Filed by macuahuitl-fedora, 2026-10-15T05:06:43Z.
    events:
      - type: filed
        ts: "2026-10-15T05:06:43Z"
        host: macuahuitl
        summary: |-
          A bad fragment blocked every host's plan lane; stale plan binaries disagree on the fold.
