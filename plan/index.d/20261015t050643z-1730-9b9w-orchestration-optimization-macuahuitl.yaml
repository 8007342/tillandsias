  - packet_id: the-land-queue-gates-ready-candidates-as-one-merge-train-and-bisects-only-on-red
    order: 1731-cshq
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    size: L
    pickup_role: linux
    capability_tags: [land-queue, gate, throughput]
    related: [1730-9b9w]
    depends_on: []
    title: |
      The land queue gates every PR alone (~17-35 min each, serially), so a 4-PR run costs 4 gates; stack the ready candidates into one merge train, gate once, land them all on green, and bisect only when the train is red
    context: |
      Measured 2026-10-15: 26 lands took ~26 serial full gates on macuahuitl, the largest coordinator time sink. In a merge train the gate verdict covers the stacked tree. On green, land each PR's merge in order (preserving the per-PR land(<n>) commits and PR comments). On red, bisect (halve the train) until the red PR is found, evict it with the gate's output, and land the rest.
      Keep the existing pre-gate checks (carried obligations, not-a-work-ref, conflict) per candidate before forming the train. The adopt-over-plan-only-move logic must still work when trunk moves during the gate.
    exit_criteria:
      - "a run with 3 green candidates performs ONE full gate and lands all 3, each with its own land(<n>) commit (red today: 3 gates)"
      - "a run with one red candidate among 3 evicts exactly that one, with its gate output, and lands the other 2, in at most 1 + ceil(log2 3) gates"
    unscoreable: "unpinnable-until-the-guard-exists: the train fixture over a scratch remote is the deliverable"
    next_action: >
      Read scripts/land-queue.sh's per-candidate loop (gate, push, adopt) and design the train as a pre-pass that only changes how many gates run. Prove it with a scratch-remote fixture that uses a stub gate.
    provenance: |
      Filed by macuahuitl-fedora, 2026-10-15T05:06:43Z.
    events:
      - type: filed
        ts: "2026-10-15T05:06:43Z"
        host: macuahuitl
        summary: |-
          Merge-train gating for the land queue.

  - packet_id: preflight-catches-the-landing-carried-check-the-combined-features-and-the-work-ref-name
    order: 1732-a7m4
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    size: M
    pickup_role: any
    capability_tags: [preflight, land-queue, gate]
    related: [1730-9b9w, 1731-cshq]
    depends_on: []
    title: |
      ./build.sh --preflight passed for PRs the land queue then bounced: a missing Carried-Waiver trailer (3 on 2026-10-15), the combined tray,listen-vsock test set (1), a non-work-ref branch (1). Preflight must run the same cheap checks
    context: |
      On 2026-10-15 every one of these PRs had preflight refused=0 and still bounced.
      - Carried: the queue runs scripts/lua/check-carried-obligations.lua --landing against trunk, and preflight does not (or not in landing mode).
      - Combined features: the gate's tray,listen-vsock set compiles tests the workspace pass cannot see. A `cargo check --tests -p tillandsias-headless --features tray,listen-vsock`, run only when headless crates changed, catches compile-level breaks cheaply, though not test failures (state that limit).
      - Ref name: the queue skips anything not named work/<order>. Preflight can name the rule when the current branch breaks it.
    exit_criteria:
      - "preflight on a branch touching a carried-obligation area with no trailer is refused with the queue's own reason (red today)"
      - "preflight on a branch that breaks the tray,listen-vsock compile is refused when headless crates changed (red today)"
      - "preflight on a branch not named work/<order> prints the naming rule (advisory)"
    unscoreable: "unpinnable-until-the-guard-exists: the three arms are the deliverable"
    next_action: >
      Find where --preflight assembles its guard list, and add the three checks as deciders with deadlines that fit the preflight budget. The combined compile must reuse the toolbox target dir.
    provenance: |
      Filed by macuahuitl-fedora, 2026-10-15T05:06:43Z.
    events:
      - type: filed
        ts: "2026-10-15T05:06:43Z"
        host: macuahuitl
        summary: |-
          Preflight misses three of the queue's bounce causes.

  - packet_id: the-land-queue-honours-a-draft-mid-run-and-warns-of-overlapping-open-prs-early
    order: 1733-7gpz
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    size: S
    pickup_role: any
    capability_tags: [land-queue, collisions, pull-requests]
    related: [1730-9b9w, 1731-cshq]
    depends_on: []
    title: |
      The queue fixes its candidate list at launch, so a PR made draft mid-run was still gated and landed (#427). Collisions between sibling PRs (#432/#433, #433/#436) surface only at merge. Re-read draft status per candidate, and post an overlap advisory when two open PRs touch the same files
    context: |
      2026-10-15: drafting #427 mid-run did not hold it. Two conflicts cost an eviction and a re-merge each.
      Fix 1: re-check isDraft just before each candidate gates.
      Fix 2: when a PR opens, or each queue run starts, compare its changed files with every other open non-draft PR's, and comment on both PRs naming the overlap and that "whichever lands second merges". `git merge-tree` against trunk gives an instant conflict answer before any gate.
    exit_criteria:
      - "a PR converted to draft after the run starts is skipped with skip:land-queue:<n>:draft (red today: gated)"
      - "two open PRs touching the same file each get one overlap comment naming the other, without duplicates on later runs"
    unscoreable: "unpinnable-until-the-guard-exists: the draft and overlap arms are the deliverable"
    next_action: >
      Add the per-candidate draft re-read (one gh call) and the overlap pass in scripts/land-queue.sh. Test with a stub gh.
    provenance: |
      Filed by macuahuitl-fedora, 2026-10-15T05:06:43Z.
    events:
      - type: filed
        ts: "2026-10-15T05:06:43Z"
        host: macuahuitl
        summary: |-
          Queue honours drafts mid-run; early overlap advisories.

  - packet_id: peers-own-their-prs-end-to-end-and-the-coordinator-stops-relaying-and-re-preflighting
    order: 1734-cqgk
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    size: M
    pickup_role: any
    capability_tags: [fleet, pre-push, pull-requests, windows]
    related: [1730-9b9w, 1735-hjeu]
    depends_on: []
    title: |
      Every peer PR passes through the coordinator by hand (re-push yolanda's salvage ref as work/, open the PR, re-preflight). Let Windows push work/ refs on a preflight stamp, have peers open their own non-draft PRs, and drop the coordinator re-preflight for Linux peers
    context: |
      2026-10-15: yolanda cannot push work/ refs because the pre-push hook demands a full ./build.sh --check stamp that Windows cannot earn in time, so the coordinator re-pushed each salvage ref. The coordinator then opened every peer PR and re-ran preflight about 20 times, catching 0 bounces.
      Proposal:
      - The hook admits a work/<order> push with a fresh --preflight stamp. The land queue's full gate is the real gate for trunk; the hook only protects trunk and release branches.
      - Peers open their own PRs (gh works on every peer).
      - The coordinator stops re-preflighting Linux peers; macOS and Windows preflights skip platform guards, so keep an optional Linux re-preflight for those only if their bounce rate says so.
    exit_criteria:
      - "a Windows host pushes work/<order> with a preflight-clean stamp and no full --check (red today: refused)"
      - "a push to linux-next or main without the full stamp is still refused"
      - "for one week, the coordinator opens no peer PR and relays no salvage ref; recorded on 1730-9b9w"
    unscoreable: "unpinnable-until-the-guard-exists: the hook arms plus the one-week measurement"
    next_action: >
      Read the pre-push hook's work/ handling (scripts/hooks/ and pre-push-local-gate.sh) and propose the preflight-stamp admission with its two arms. Confirm with the coordinator that trunk protection is unchanged.
    provenance: |
      Filed by macuahuitl-fedora, 2026-10-15T05:06:43Z.
    events:
      - type: filed
        ts: "2026-10-15T05:06:43Z"
        host: macuahuitl
        summary: |-
          Peers own their PRs; no coordinator relay or re-preflight.

