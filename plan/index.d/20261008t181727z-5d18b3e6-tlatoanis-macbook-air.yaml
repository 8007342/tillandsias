        Claimed and fixed by macbookair-macos on coordinator assignment (1538 has completed, so lua_proc.rs is free). Test-only change, as the row authorises; no runtime change.
        A named native helper, liveness(pid) -> Alive | Zombie | Gone | Unobservable(why), in tests/lua_proc.rs. Existence comes from kill(pid, 0): ESRCH is the only Gone, while success and EPERM mean the pid exists. The state then separates Zombie from Alive (/proc on Linux, ps -o stat= elsewhere). A failed or empty observation re-checks existence and is otherwise Unobservable, which the grandchild arm PANICS on rather than reading as dead.
        Measured on darwin (macOS 27.0.1 arm64): the old observation reports a live sleep as dead; the cleanup-disabled mutant was a false green before the fix and is red after it. Full lua_proc suite 12/12, strict clippy (-D warnings -A clippy::double_must_use) 0, fmt clean.
        Noted, not changed (outside owned_files): tillandsias-exec tests/group_exit.rs alive() maps a failed ps spawn to dead (Err(_) => false), the same hazard in a smaller form.
