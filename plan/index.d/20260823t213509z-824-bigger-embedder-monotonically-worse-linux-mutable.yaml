      summary: >
        THE BIGGER-EMBEDDER QUESTION IS ANSWERED, AND THE ANSWER IS MONOTONIC.
        Same 561 relabelled questions, same ground truth, a full index rebuilt
        per model, quiet card each time:

          model                params  dims   band overlap   margin overlap
          nomic-embed-text     137M     768   0.2058         0.1104
          bge-m3               567M    1024   0.2513         0.1222
          qwen3-embedding:4b   4.0B    2560   0.2744         0.1163

        A 29x INCREASE IN PARAMETERS AND 3.3x IN DIMENSIONS MAKES SEPARATION
        WORSE, not better, and does so monotonically. Not one corpus separates
        under any model: qwen3 overlaps spec by 0.2090, methodology by 0.1886,
        plan by 0.2517 — and plan, the largest corpus, degrades most (0.1545
        under nomic to 0.2517 under qwen3). The margin hypothesis is flat-dead
        rather than monotonic, hovering at 0.11-0.12 everywhere.

        WHY THIS IS THE EXPECTED SHAPE, stated so the result is not read as a
        surprise about model quality: cosine similarity measures topical
        proximity. A better embedder measures topical proximity BETTER. "Does
        this passage answer the question" is not a topical-proximity question,
        so sharpening the instrument sharpens the wrong axis — and a
        near-miss, which is by construction topically adjacent, gets scored
        MORE confidently as the embedder improves. That is exactly a rising
        near-ceiling, which is what the numbers show.

        THIS CLOSES THE THRESHOLD HYPOTHESIS AT EVERY GRANULARITY TESTED:
        global, per-corpus, raw score, top1-top2 margin, and now across three
        model scales spanning 137M to 4B. The expert layer's answer is not a
        cutoff; it is the Tier A/Tier B judgement already measured at 0/33 false
        positives with recall@5 double recall@1.

        THE CAVEAT SHIPS WITH THE RESULT AND IS NOT SMALL. No index used
        model-specific query/passage prefixes, and both bge-m3 and
        qwen3-embedding are trained to expect them. What is refuted is "a
        bigger embedder rescues the threshold". What is NOT established is that
        these models are weak, or that a correctly-prompted bigger embedder
        would behave the same way. Anyone quoting the monotonic trend as
        evidence about model quality is over-reading it.

