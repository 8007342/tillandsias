    title: |
      On native Windows the Rust metrics fallback PathBuf::from("/tmp") opens <drive>:\tmp, while msys's /tmp is Git's own tmp mount, so outside a checkout the writer and the shell reader name different directories
    context: |
      metrics_default_log() falls back to PathBuf::from("/tmp").join(basename) when no
      checkout is above the binary (an installed binary, a forge-less Windows call).
      On native Windows that path is relative to the current drive: <drive>:\tmp\<name>.
      Under msys Git Bash, /tmp is a mount (normally the user's %TEMP%). Since 2387-x65b
      the printed answers agree as strings ("/tmp/<name>"), but they name two different
      directories, so the strings agreeing hides the split.
      Consumers that would see the mismatch:
        - log_cli_usage (Rust writer of forge-expert-usage.jsonl) vs the shell readers
          of /tmp/forge-expert-usage.jsonl: scripts/cycle-metrics.sh and
          scripts/check-mcp-expert-health.sh / check-mcp-surface.sh;
        - the cycle-metrics.sh 1096-p3tn split guard, which checks /tmp/tillandsias-timing.jsonl;
        - scripts/lua/test-metrics-log-path-agreement.lua arm 1d, which compares strings
          only and so passes while the directories differ.
      Not yet measured: whether any Windows caller actually hits the fallback today. The
      in-checkout path (the common case) is unaffected.
    verifiable_closure: |
      On an msys host, an installed copy of the binary outside any checkout writes its
      usage record to the file the shell's /tmp/forge-expert-usage.jsonl names. Add a
      fixture arm that checks the FILE, not the string. PRE-FIX: expected to fail on doris.
    unscoreable: "the closure is a new arm in scripts/lua/test-metrics-log-path-agreement.lua, which does not exist yet"
