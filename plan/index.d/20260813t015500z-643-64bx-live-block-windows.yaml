# Ledger fragment — append-only, IMMUTABLE once written.
# Written by hand (windows host): append-event refuses packets that live in the
# base index from a fragment-writing host, so the same events shape is written
# directly.
events:
  - packet_id: build-bumps-version-then-the-hook-forbids-pushing-it
    event:
      type: progress
      ts: "2026-08-13T01:55:00Z"
      host: windows
      summary: >
        LIVE RECURRENCE, and this time it blocks a push rather than a build.
        windows-next carries ca8da57e "release: bump VERSION to 0.4.260812.2",
        an OPERATOR-SANCTIONED counter increment (its own message records the
        2026-08-12 ruling that a merge collision on the build counter is
        resolved by incrementing). That commit exists on no remote:
        origin/windows-next is at 0.4.260810.1 and origin/linux-next at
        0.4.260812.1. scripts/hooks/pre-push-version-guard.sh therefore refuses
        every windows-next push, because its sync-forward exception compares
        ONLY against main and the value is neither main's nor a
        release/version-bump-* branch.
        Two distinct defects are visible in one failure, and they should not be
        conflated. (a) The recorded exception set is incomplete for a THREE-tier
        branch topology: a platform branch that merges origin/linux-next
        inherits the integration branch's VERSION, which is a catch-up exactly
        as main-sync-forward is, yet is refused — so merging linux-next into
        windows-next, which the pre-push gate REQUIRES, can itself create an
        unpushable branch. (b) The operator's counter bump has nowhere to land:
        every remaining exit is one the exit contract or this packet forbids
        (--no-verify disables the only trunk gate; not pushing accretes
        local-only commits; reverting discards an explicit operator decision).
        Not fixed here, deliberately. This packet's own note says the guard must
        not be relaxed, and criterion 1 (move the local build counter off
        tracked files) is a release-path decision — the same reason the
        2026-08-10 windows cycle stopped at criterion 2. Changing what the guard
        accepts while holding an operator-authored bump hostage to that change
        would be deciding the release identity question by side effect.
        Escalated to the operator with the blocked cycle.
