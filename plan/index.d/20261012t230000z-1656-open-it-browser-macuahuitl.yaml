    pickup_role: linux
    capability_tags: [browser, images, chromium, fonts, litmus, security]
    estimated_hours: 3
    related: [612-nvf3, 615-x3b8, 1649-xqet, 1656-urmk]
    title: |
      The tillandsias-chromium-framework image has no fonts (a TODO), so pages render with missing or tofu glyphs. No fixture pins the image entrypoint's refusal of --no-sandbox (612-nvf3), so a regression that re-admits it would pass every gate.
    context: |
      Found by the open-it research (plan/issues/research/open-it-browser-2026-10-12.md, defects 4 and 5). The fonts should cover Latin, CJK, emoji and the symbols a typical web app uses, kept small. The entrypoint check is the image's own guard; a fixture should run the entrypoint with --no-sandbox and assert the refusal.
    exit_criteria:
      - 'in the built image, `fc-list` reports at least one Latin, one CJK and one emoji family; red today (no fonts)'
      - 'a fixture runs the image entrypoint with --no-sandbox appended and asserts a non-zero exit with the refusal message; it fails when the entrypoint check is removed (mutation shown in the commit)'
      - 'the image size growth from fonts is measured and recorded'
    unscoreable: "pinned-by-its-own-fixture: the fonts arm and the --no-sandbox arm are the closure"
    next_action: >
      Add the font packages to the framework image, then write the entrypoint fixture and show it red when the check is removed.
    events:
      - type: filed
        ts: "2026-10-12T23:00:00Z"
        host: macuahuitl
        summary: |-
          Chromium framework image fonts plus the --no-sandbox entrypoint fixture.

