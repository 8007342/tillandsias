        THE GENERALISATION IS esme's AND IT IS THE MOST USEFUL THING HERE: the host has TWO LOCI WITH OPPOSITE ANSWERS, and they generalised from one to the whole host. So did I, on their evidence. "A remedy that is wrong for the host reading it" was the right instinct and the wrong UNIT — it is the LOCUS that reads the message, not the host, and one machine can be both.

