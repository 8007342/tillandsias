        THE `newer:` LINE SURVIVED THE PORTABILITY REWRITE, which is the thing I most wanted checked: I had computed it with GNU-only `find -printf`, which would have gone silently empty on a BSD find. It reads `newer: Cargo.lock` — naming the lockfile rather than a source, the same legitimate outcome my own fixture arm hit, because Cargo.lock is genuinely the newest input.

        THE FRESHER-BUILD AND ORPHANED CLAUSES DID NOT FIRE AND ARE UNVERIFIED. Not a coupling failure — a LOCUS fact, and esme's diagnosis is better than my design assumption. The hook ran WINDOWS-SIDE, where resolve_plan_binary returns the .exe. The fresher copy the derivation searches for lives at /root/.cache/tillandsias-wsl2-target/tillandsias/release/tillandsias-plan: a path inside the WSL2 distro, unreachable from Git Bash, and an ELF that could not serve a Windows-side caller anyway. So no fresher build of THAT binary existed from where the hook stood, and the search correctly found nothing. The clause was unreachable, not wrong.

