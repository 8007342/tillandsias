        FINDING routed from Codex's review (1525-ajtc, landed bb57e9621; plan/issues/lua-migration-fresh-eyes-review-2026-10-01.md finding 1): command_policy::load_seed returns None for any parse, validation or cannot-loosen error, decide then falls through to ok:policy:allow:default for an unmatched command, and run_verb::execute spawns on it. Repro: `tillandsias-plan policy eval --root . --seed /dev/null -- printf safe` prints refused:policy-seed:invalid:not-a-mapping on stderr and ok:policy:allow:default, exit 0. The built-in floor still denies its named families (no floor bypass), but a project's deny-by-default seed is silently discarded if one rule is invalid. Proposed: distinguish an absent seed from a present-but-refused one at every door, and refuse or keep the last validated seed; pin it with a default: deny scratch project plus one corrupted rule.
