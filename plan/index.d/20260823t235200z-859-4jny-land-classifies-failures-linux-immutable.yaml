      agent_id: linux-pirria-opus5-20260823T210000Z
      host: linux_immutable
      summary: >
        THE SUPPORTED LAND PATH HAD THE DEFECT THIS PACKET IS ABOUT, and it cost
        real time within hours of shipping.

        scripts/land-on-platform-branch.sh discarded git push's output
        (`>/dev/null 2>&1`) and treated EVERY non-zero push as a lost race. On
        2026-08-23 this host's GitHub token expired mid-cycle; the push failed
        rc=128 "Authentication failed", and the loop rebased, ran the FULL GATE,
        and retried — four times, reporting "origin moved — retrying" for all of
        them. On a host where the gate is the expensive part that is ~20 minutes
        spent on a failure that no retry could ever fix, and the operator-facing
        message named the wrong cause.

        Same shape as this packet's other half: a message that reports a
        plausible cause instead of the real one is worse than no message, because
        it is read during an incident and it redirects the reader.

        FIXED: push output is kept and CLASSIFIED. Authentication failures refuse
        immediately with exit 5 and carry the remedy
        (`gh auth refresh -h github.com && gh auth setup-git`) plus the
        reassurance that the commit is safe locally; anything that is not a
        recognisable lost race refuses with exit 6 and prints the real error.
        Only "non-fast-forward | fetch first | rejected | stale info" retries.

        I also made the mistake this packet warns about while fixing it: my
        first patch's anchor did not match (4-space indent, not 2), the file was
        left unmodified, and I ran the UNFIXED script anyway — burning four more
        gate cycles. Verify the patch applied before running the thing you
        patched.
