  - packet_id: emit-flow-required-a-cycle-id-it-could-have-minted
    order: 801-tpxd
    status: completed
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "scripts/cycle-metrics.sh --emit-flow wrote the sentinel \"cycle\":\"-\" when cycle= was omitted; it has bitten twice, and one repair used a global sed that clobbered a historical flow record"
    deliverable: "--emit-flow mints <host>-<utc> when cycle= is absent, and the sentinel is unreachable by construction (pinned negative control)"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [telemetry, meta-orchestration]
    context: |
      OBSERVED. 682-epud made the emit idempotent on host+cycle and warned when
      cycle= was omitted, writing `-`. The warning did not work: two windows
      cycles shipped a `-` row, and one of them repaired its own row with a
      global sed that took a HISTORICAL record with it.

      The root cause is not caller carelessness. The id was REQUIRED from the
      caller yet fully DERIVABLE by the callee — host + UTC is precisely what
      every cycle assembles by hand. Deriving it removes the failure instead of
      narrating it.

      NOT the bucket-by-clock-hour heuristic 682-epud rightly refused: that
      MERGES distinct cycles and drops genuine records, whereas a
      second-resolution mint is injective over real cycles, so an unlabelled
      retry still APPENDS exactly as before. Passing cycle= remains the right
      thing for replace-on-retry idempotency; it is simply no longer load-bearing
      for the log's integrity.
    events:
      - type: filed
        ts: "2026-08-17T12:10:00Z"
        agent_id: windows-opus5-instruments-20260817
        host: windows
        summary: "Filed and closed in the same cycle."
      - type: completed
        ts: "2026-08-17T12:10:00Z"
        agent_id: windows-opus5-instruments-20260817
        host: windows
        summary: >
          --emit-flow now mints `<host>-<utc>` and announces it as `note:`; an
          explicit `cycle=-` is rewritten too, so no path reaches the record
          printf with the sentinel. Fixture scenario 5 rewritten and scenario 8
          added as the negative control; litmus:cycle-flow-telemetry-shape
          updated to expect 8.
        evidence_refs:
          - "scripts/test-cycle-flow-emit-idempotency.sh -> ok:cycle-flow-emit-idempotency:8 (rc=0), 13 assertions PASS"
          - "NEGATIVE CONTROL (scenario 8): zero `\"cycle\":\"-\"` rows reachable across every emit path, including an explicit cycle=-"
          - "scenario 5: omitting cycle= now prints `note: ... minted cycle=windows-<utc>` and writes a record matching \"host\":\"windows\",\"cycle\":\"windows-[0-9]{8}T[0-9]{6}Z\""

  - packet_id: windows-only-stamp-refusal-prints-an-argv-its-own-parser-rejects
    order: 801-ajcd
    status: completed
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "check-windows-only-sources-verified.sh's stamp refusal read `pass --from X`, so obeying it verbatim produced `stamp pass --from X` and was refused again"
    deliverable: "the refusal prints the exact copy-pasteable argv after `usage: `, the parser tolerates the legacy wording, and the fixture EXTRACTS the argv from the live message and executes it"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [fail-loud, windows, scripts]
    context: |
      OBSERVED. The message was
      `refused:stamp-needs-evidence:pass --from <cargo-test-output>; ...` where
      "pass" was an English verb. Read as what it looks like — an argument list —
      the obedient invocation is `... stamp pass --from out.txt`, whose $2 is
      `pass`, which matches nothing in the parser, so the refusal repeats
      identically.

      WHY IT MATTERS MORE THAN A TYPO: a guard whose own instructions are refused
      teaches the reader that the GUARD is broken rather than that the EVIDENCE
      is missing, and the next move after that is to route around it. 716-f5kc
      built this report specifically so a Windows-only edit could not go
      unverified in silence.

      Both directions of the mismatch were fixed, deliberately: the message now
      prints the exact argv (so copying works), AND the parser accepts a leading
      `pass` token (so anyone who obeyed the old wording, or a script written
      from it during the weeks it was live, is answered rather than refused
      twice).
    events:
      - type: filed
        ts: "2026-08-17T12:10:00Z"
        agent_id: windows-opus5-instruments-20260817
        host: windows
        summary: "Filed and closed in the same cycle."
      - type: completed
        ts: "2026-08-17T12:10:00Z"
        agent_id: windows-opus5-instruments-20260817
        host: windows
        summary: >
          Message and parser fixed; fixture case 8 added. The pin is
          self-referential on purpose and is the only form that cannot drift: it
          EXTRACTS the argv from the live refusal text and EXECUTES it, so a
          future edit to either the message or the parser that separates them
          turns the fixture red.
        evidence_refs:
          - "scripts/test-windows-only-sources-verified.sh -> PASS: windows-only source verification report (8/8), rc=0"
          - "case 8: the argv parsed out of the live `refused:stamp-needs-evidence:usage: ...` line is executed and accepted -> ok:windows-sources-verified:2"
          - "legacy tolerance: `stamp pass --from <file>` -> ok:windows-sources-verified:2 (was: refused again)"
          - "NEGATIVE CONTROLS: `stamp pass` with no --from still refuses; `stamp --from` with no path still refuses — tolerating `pass` did not make evidence optional"
          - "litmus:release-gates-run-locally expected_behavior updated 7/7 -> 8/8"

  - packet_id: loop-status-append-ts-skew-refusal-on-a-long-cycle
    order: 801-w4pn
    status: completed
    desired_release: v0.5
    priority: p3
    kind: bug
    title: "loop-status-append refuses a --ts older than 900s, which a long cycle trips by construction — decide and document the sanctioned path"
    deliverable: "a recorded decision (do NOT widen the window; --backfill is the path) wired into the skill's Finalization step so the refusal is anticipated rather than discovered"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [meta-orchestration, plan-binary]
    context: |
      OBSERVED. crates/tillandsias-plan/src/main.rs:451 sets
      TS_SKEW_LIMIT_SECS = 900; resolve_ts() (main.rs:564) refuses any --ts
      disagreeing with the host clock by more than that unless --backfill is
      passed. A cycle that reads the clock at Start Of Cycle and appends its
      status at Finalization two hours later trips this by construction: the
      status timestamp is, by definition, from when the work happened.

      DECISION (windows-yolanda, 2026-08-17): do NOT widen the window and do NOT
      make cycle-scoped appends exempt. Reasons, in order:

        1. The 900s limit is what catches a fabricated hour — the defect it was
           built for cost a sibling a night diagnosing a clock fault that did not
           exist. Widening it to cover a long cycle would have to reach hours,
           which is exactly the fabrication range.
        2. An exemption keyed on "cycle-scoped" is unfalsifiable from inside the
           binary: every caller could claim it.
        3. The escape hatch ALREADY EXISTS and the refusal ALREADY NAMES IT —
           main.rs:593 reads "omit --ts to use the clock, or pass --backfill if
           the event genuinely happened earlier". --backfill only reaches
           BACKWARD (a future --ts is still refused), so it waives nothing the
           limit protects.

      So the gap was never in the binary; it was that the SKILL never told the
      cycle to expect the refusal. That is now Finalization step 2. Reclassifying
      a refusal as documented-and-expected is a legitimate closure — but only
      because the refusal text already carries the remedy, which was verified
      against the source rather than assumed.
    events:
      - type: filed
        ts: "2026-08-17T12:10:00Z"
        agent_id: windows-opus5-instruments-20260817
        host: windows
        summary: "Filed and closed in the same cycle as a decision, not a code change."
      - type: completed
        ts: "2026-08-17T12:10:00Z"
        agent_id: windows-opus5-instruments-20260817
        host: windows
        summary: >
          skills/meta-orchestration/SKILL.md Finalization step 2 now states that a
          long cycle's --ts legitimately predates its write, that --backfill is
          the sanctioned path, and why widening the window or re-reading the
          clock are both wrong (the latter silently relabels when the work
          happened). No binary change.
        evidence_refs:
          - "verified against source, not assumed: crates/tillandsias-plan/src/main.rs:590-599 already emits 'omit --ts to use the clock, or pass --backfill if the event genuinely happened earlier'"
          - "verified --backfill is backward-only: main.rs:576-589 refuses a --ts more than 900s AHEAD even with the flag"
          - "used live by this cycle's own loop-status-append"

  - packet_id: surface-attestation-has-no-corroborating-observable
    order: 801-m9tk-2
    status: ready
    desired_release: v0.5
    priority: p3
    kind: enhancement
    title: "the MCP surface attestation (801-m9tk) cannot catch an agent that claims `exposed` while holding no such tools — corroborate it against the harness session transcript"
    deliverable: "check-mcp-surface.sh optionally reads the harness session transcript for mcp__* tool_use frames and emits a distinct `conflict:surface-claim-contradicted` verdict when the transcript refutes the claim"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [mcp, observability, fail-loud]
    estimated_hours: 3
    context: |
      801-m9tk split the MCP health fact into a MEASURED handshake and an
      ATTESTED surface, because a subprocess genuinely cannot observe the agent's
      tool surface. That closes the three-cycle blind spot but leaves one
      residual, stated in the script header rather than hidden: a false `exposed`
      attestation is not caught.

      THE CANDIDATE OBSERVABLE, unverified and to be tested first: the harness
      writes per-session transcripts under
      ~/.claude/projects/<project-slug>/*.jsonl on this host (the slug directory
      exists: C--Users-bullo-claudia-tillandsias). If those records carry
      `mcp__*` tool_use frames, then a transcript containing them REFUTES a
      claim of `unexposed`, and — for a session that made any expert read at all
      — their absence corroborates it.

      IT IS ONE-SIDED, and the packet must not overclaim: absence of mcp__*
      calls is also what a cycle that simply never called an expert looks like.
      So the honest deliverable is a `conflict:` verdict for the refutable
      direction plus an explicitly-labelled weak signal for the other, NOT a
      claim that the surface is now measured.

      DO NOT build this by parsing an undocumented transcript schema without
      pinning it: the schema belongs to the harness, not to this repo, and a
      check that silently stops matching after a harness upgrade would report
      `no conflict` forever — the same silent-degradation shape as the defect it
      is trying to close. Pin the shape with a fixture transcript, and make an
      unparseable transcript read `skip:`, never `ok:`.
