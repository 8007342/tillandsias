# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by windows (yolanda), 2026-08-17, meta-orchestration FULL cycle.
#
# ONE STORY: the loop's own instruments lie or trip. Five defects accumulated
# over four cycles, all in the machinery the loop uses to KNOW things — the MCP
# health probe, the start-of-day gate, the flow telemetry, a refusal message,
# and a timestamp guard. Each closure below is a litmus or an executable check
# with a negative control, never prose intent.
#
# The through-line, worth stating once: every one of these is a signal that was
# TRUE about the thing it measured and WRONG about the thing the reader needed.
# That is the order-531 shape, and it does not get fixed by measuring harder —
# it gets fixed by making the gap between the two facts SAYABLE.

packets:
  - packet_id: mcp-health-probe-measures-the-handshake-not-the-agents-tool-surface
    order: 801-m9tk
    status: completed
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "scripts/check-mcp-expert-health.sh reports ok:experts-healthy while no mcp__* tool is bound to the session — three consecutive windows cycles read through the binary fallback and left no trace"
    deliverable: "scripts/check-mcp-surface.sh (companion check joining the MEASURED handshake with the ATTESTED surface) + cycle-metrics `mcp: health=ok-unexposed` as a state distinct from ok and from down, firing the mcp_outage: line"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [mcp, observability, fail-loud, meta-orchestration]
    context: |
      OBSERVED on windows-yolanda 2026-08-15, -16 and -17. Each cycle ran
      scripts/check-mcp-expert-health.sh at Start Of Cycle and got
      `ok:experts-healthy`. In each, NO `mcp__forge-plan__*` /
      `mcp__project-info__*` tool existed on the agent's tool surface, so every
      read fell back to ./target/release/tillandsias-plan. On 2026-08-17 the
      absence was confirmed three ways: not in the loaded tool list, not in the
      deferred-tool list, and `ToolSearch "plan_answer methodology_ask
      forge-plan project-info search_code"` returned "No matching deferred tools
      found".

      THE PROBE WAS NOT LYING. Since 770-f6u4 it speaks initialize ->
      initialized -> a real tools/call and demands the pinned output grammar
      back. The servers genuinely did all of that. It was answering a DIFFERENT
      QUESTION than the cycle needed:

        HANDSHAKE  "if I launch the registered command, does it serve MCP?"
                   Script-observable, falsifiable, thoroughly covered.
        SURFACE    "did THIS session get those tools bound?"
                   Not observable from a subprocess at all.

      A server that is up but not exposed is exactly the outage worth catching —
      the read path is degraded for the whole cycle — and the probe calls it
      healthy. Order 531 again: truthful component state, wrong conclusion about
      capability.

      WHICH HALF IS UNFALSIFIABLE, STATED RATHER THAN PAPERED OVER. A script
      cannot see the agent's tool surface: no file, no socket, no exit code
      carries it. Any check claiming to MEASURE it from a subprocess would be
      inventing the fact, which is the failure being fixed, one level up. So the
      design splits along what is knowable — the PROBE measures the handshake,
      the CYCLE attests the surface, the companion check JOINS them — and the
      join is script-observable and falsifiable even though one input is not.

      WHAT THE ATTESTATION BUYS: the state becomes SAYABLE
      (`unexposed:handshake-ok` and `health=ok-unexposed` are distinct from both
      `ok` and `down`), the DEFAULT is honest (unattested reads
      `unattested:no-surface-claim`, never ok), and a claim EXPIRES after 4h so
      an earlier cycle's marker cannot vouch for this one — the inherited-premise
      failure this fleet has already paid for twice.

      RESIDUAL, not closed: an agent that attests `exposed` while holding no such
      tools is not caught. Narrower than it looks (the attesting agent is the one
      harmed by the lie, since the record exists to explain its own degraded
      reads) but real. Corroboration from the harness session transcript is filed
      as 801-m9tk-2 rather than half-built here.
    events:
      - type: filed
        ts: "2026-08-17T12:10:00Z"
        agent_id: windows-opus5-instruments-20260817
        host: windows
        summary: "Filed and closed in the same cycle; the defect was observed live at Start Of Cycle."
      - type: completed
        ts: "2026-08-17T12:10:00Z"
        agent_id: windows-opus5-instruments-20260817
        host: windows
        summary: >
          Added scripts/check-mcp-surface.sh (attest/check/show/fixture) and
          taught scripts/cycle-metrics.sh to fold a FRESH `unexposed` attestation
          into `mcp: health=ok-unexposed` + the mcp_outage: line. Only ever
          REFINES `ok`; never rescues a `down`, never labels an unattested or
          stale-attested cycle. Wired into skills/meta-orchestration/SKILL.md
          (new "The handshake is not the surface" section) and pinned by four new
          steps in litmus:mcp-expert-health-probe-shape.
        evidence_refs:
          - "scripts/check-mcp-surface.sh fixture -> ok:mcp-surface-check-fixture:9 (rc=0), incl. 4 negative controls: an `exposed` claim cannot launder a down handshake (down:forge-plan rc=2); a stale claim does not vouch (unattested:surface-claim-stale rc=3) while a 14399s-old one still counts (ok:surface-exposed rc=0); an unattested cycle is never ok (unattested:no-surface-claim rc=3); absent stays absent"
          - "THE DEFECT PINNED: healthy handshake + unexposed surface -> `unexposed:handshake-ok` rc=1, distinct from both ok: and down:"
          - "cycle-metrics live 3-way separation: unexposed -> `mcp: ... health=ok-unexposed` PLUS `mcp_outage: records=1 health=ok-unexposed`; exposed -> `health=ok` and NO outage line; stale unexposed -> `health=ok` (no retro-labelling)"
          - "LIVE this cycle: scripts/check-mcp-surface.sh attest unexposed -> ok:surface-attested:unexposed; check -> unexposed:handshake-ok rc=1, while scripts/check-mcp-expert-health.sh printed ok:experts-healthy in the same cycle — the two facts now disagree out loud instead of silently"

  - packet_id: start-of-day-gate-leaves-nothing-verifiable-behind
    order: 801-qasc
    status: completed
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "the .last-daily-maintenance marker the skill and methodology both gate on was never written or read by anything — 'did today's gate run' had no answer on any host for four days"
    deliverable: "scripts/check-daily-maintenance.sh — stamp (refused without --steps) + check with a load-bearing exit code, marker at ${XDG_CACHE_HOME:-$HOME/.cache}/tillandsias/.last-daily-maintenance"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [ops, maintenance, fail-loud, meta-orchestration]
    context: |
      OBSERVED. skills/meta-orchestration/SKILL.md and methodology.yaml
      (development_environment_lifecycle.start_of_day_maintenance) have said
      since 2026-08-13 to gate the Start-Of-Day body on a
      `.last-daily-maintenance` marker under the cache dir. Nothing in the repo
      wrote it and nothing read it:

        2026-08-14  a linux-immutable cycle named it out loud — "a
                    .last-daily-maintenance marker that nothing in the repo
                    writes" (plan/loop_status.d/20260814t232933z-...md)
        2026-08-16  a windows cycle inherited "already stamped today" from its
                    brief, skipped the body, could not confirm the premise
        2026-08-17  the next windows cycle found no marker anywhere on the host

      The failure is not "the gate was skipped". It is that the question had NO
      ANSWER — not "no", which is actionable, but nothing. An unobservable gate
      is indistinguishable from one that never runs, and the cheapest way to
      satisfy it is to skip it.

      SCOPE: this is the marker+check slice. The maintenance BODY (build-cache
      GC, nix/podman prune, delegate reap, dev-expert freshness, the 718-nuvm
      post-restart checklist) remains 719-546b-3, pickup_role linux, deliberately
      unclaimed here — this host has neither nix nor podman.

      DESIGN NOTE, inherited from check-windows-only-sources-verified.sh:
      `--steps` is MANDATORY. A stamp recording that "something happened"
      without recording what would restore exactly the unfalsifiability being
      removed. A LOCAL day, not UTC — the rule is "once per local day" and an
      operator's day boundary is their wall clock; this host is UTC-7, where a
      UTC-day gate flips mid-afternoon. The marker records both.
