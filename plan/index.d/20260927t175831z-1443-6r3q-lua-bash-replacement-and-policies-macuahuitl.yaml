      THE LAND TOOL ASKS THE RUNTIME WHERE TO LAND: before any fetch or gate, scripts/land-on-platform-branch.sh runs the discipline probe — `tillandsias-plan discipline check-ref` on the requested target, the platform's integration branch from the seed when no branch is named, and `git ls-remote origin refs/tillandsias/discipline/*` compared to the checkout's seed digest — and refuses refused:land:discipline:<reason> with the seeded message instead of gating for fifteen minutes and learning the answer from GitHub's GH006
    context: |
