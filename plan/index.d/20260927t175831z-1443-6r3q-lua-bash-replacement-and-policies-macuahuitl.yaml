      branch, and discovers a protected target only after the gate, from
      the remote's rejection (relay-refs.sh prints ADVICE on GH006). A host
      parked on a work ref that runs the tool with no argument pushes that
      work ref as if it were trunk. The probe is cheap (one ls-remote, one
      local verb) and runs FIRST so a refusal costs seconds, not a gate.
      Verdict tokens are an interface (1247-lwek is adding why/remedy to
      the thirteen existing ones): this row ADDS refused:land:discipline:*
      and land:target:<branch>:from=<seed|mirror-ref|default> and changes
      no existing token.
