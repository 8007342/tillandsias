  - packet_id: a-bounded-capture-on-tillandsias-exec-so-a-child-that-out-writes-the-cap-returns-truncated-true-and-ok-false-instead-of-an-unbounded-buffer-or-a-capture-that-looks-whole
    order: 1443-esm5
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    release_target: lua-bash-replacement-and-policies-2026-09-27
    pickup_role: any
    capability_tags: [rust, exec, process, tests]
    estimated_hours: 3
    depends_on: []
    owned_files:
      - crates/tillandsias-exec/src/lib.rs
      - crates/tillandsias-exec/tests/capture_bound.rs
      - crates/tillandsias-plan/src/lua_predicate.rs
    title: |
      tillandsias_exec::Command gains capture_bytes(n): a child that writes past the cap keeps being DRAINED (no deadlock) but the Output says truncated=true and dropped=<n>, proc.run maps that to ok=false, so bounded output is a property of the executor and a capture that looks whole is unrepresentable
    context: |
      Today Command::run holds every byte of both fds in memory; the only
      bound is the deadline. The operator asked for "bounded time and
      output". 1252-fg9e's rule applies: a truncated capture that LOOKS
      whole is the `| tail -1` defect in another form, so the cap is
      reported as a field and never silently applied. The design of
      2026-09-26 §4.3 names capture_bytes for proc.spawn (1384-aixy); this
      row puts it on the synchronous Command::run so every door (proc.run,
      sh.run, the run verb, the MCP tool) inherits one bound. Default 8 MiB
      so no live predicate changes behaviour; callers that want tighter
      write it out.
    exit_criteria:
      - 'a child writing 3 MiB to stdout under capture_bytes(1 MiB) returns Output{completion: Exited(0), truncated: true, dropped: 2 MiB} with stdout.len() == 1 MiB, and the run completes in under the deadline (pre-fix: FAILS — no capture_bytes method exists and stdout holds all 3 MiB)'
      - 'a child writing 64 MiB to stdout AND 64 MiB to stderr under a 1 MiB cap completes (both fds keep draining past the cap; nothing deadlocks at the pipe buffer) (pre-fix: FAILS — no cap; the test would allocate 128 MiB and pass for the wrong reason)'
      - 'proc.run{argv=…, capture_bytes=1048576} on that child returns ok=false, truncated=true, status="exited", code=0, so a Lua caller cannot read a clipped capture as a whole one (pre-fix: FAILS — proc.run rejects capture_bytes as an unknown field)'
      - 'NEGATIVE CONTROL: a child writing 100 bytes under the same cap returns truncated=false, dropped=0, ok=true'
    verifiable_closure: |
      cargo test -p tillandsias-exec --test capture_bound
      plus the proc.run arm in crates/tillandsias-plan/tests/lua_proc.rs.
      Pre-fix: FAILS to compile (Command has no capture_bytes; Output has no
      truncated field).
    next_action: >
      Add capture_bytes to Command and truncated/dropped to Output; drain
      past the cap and count; surface the two fields in shell_result_to_lua
      and proc_run; write the four arms.
    notes: |
      size: S
      implementer_tier: sonnet
      One crate, one method, two fields; the only judgment is the default.
    provenance: |
      Filed 2026-09-27 on macuahuitl from the 1443-6r3q design.
    events:
      - type: filed
        ts: "2026-09-27T17:58:31Z"
        agent_id: "linux-macuahuitl-claude-20260927t175831z"
        host: macuahuitl
        summary: |-
          First slice: the executor bound every door inherits.

  - packet_id: a-command-policy-evaluator-in-the-plan-binary-decides-allow-deny-or-consent-for-an-argv-request-from-a-built-in-floor-plus-a-per-project-seed-that-can-only-tighten-it-and-every-refusal-names-why-and-remedy
    order: 1443-isrk
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    release_target: lua-bash-replacement-and-policies-2026-09-27
    pickup_role: linux
    capability_tags: [rust, lua, policy, security, plan-binary, tests]
    estimated_hours: 10
    depends_on: []
    owned_files:
      - crates/tillandsias-plan/src/command_policy.rs
      - crates/tillandsias-plan/src/lua_predicate.rs
      - crates/tillandsias-plan/src/main.rs
      - crates/tillandsias-plan/capabilities.txt
      - .tillandsias/command-policies.yaml
      - scripts/test-command-policy-evaluator.sh
    title: |
      COMMAND POLICIES ENGINE core: `tillandsias-plan policy eval [--host-kind k] [--regime r] -- <argv>` decides allow | deny | consent for one argv request from a BUILT-IN floor (no shell strings, no credential mutation, destructive classes need consent) plus a per-project seed .tillandsias/command-policies.yaml that can only TIGHTEN the floor; the same evaluator runs inside proc.run/sh.run before spawn; every deny and consent prints refused:policy:<rule-id> with why: and remedy: lines
    context: |
      Spec: openspec/changes/lua-command-runtime-and-policies/specs/command-policies/spec.md.
      REQUEST SHAPE: {argv, cwd, env_keys, host_kind (bare-metal|forge|ci),
      platform, regime (interactive|gate|fixture|hook|relay), caller}. Host
      kind is read from TILLANDSIAS_HOST_KIND, /run/.containerenv and the
      .forge-startup-context.md marker together; a disagreement is reported
      in the decision (a self-declared host kind is not a security fact —
      cheatsheets/concurrent-git/git-mirror-architecture-audit.md).
      THE FLOOR IS COMPILED IN and a seed cannot loosen it: a seed rule that
      would allow what the floor denies is refused at LOAD, not silently
      ignored — otherwise a project file becomes the way round the fleet
      rule (never weaken a fail-closed credential gate for a test).
      THE THREE SEED RULES OF THE FIRST SLICE: no-shell-strings (sh/bash/
      cmd/pwsh with -c/-lc//c/-Command; proc.run's is_shell_string_call
      moves here and is called from there), no-credential-mutation (gh auth
      login|refresh|logout|token, git credential approve/reject, vault
      login), substrate-reset consent (podman system reset, --reset-state,
      rm -rf outside the workspace, git push --force* to a protected ref).
      DEFAULT FOR AN UNMATCHED REQUEST IS ALLOW in this phase (migration,
      not enforcement — the same posture as work_ref_lane); the operator
      decides when the default flips (open question in the design note).
      AFFORDANCE SHAPE is 1247-amcu's: the verdict line stays a token, a
      `  why: <rule>` line names the rule and a `  remedy: <what clears it>`
      line names the argv form or the consent that would be allowed.
    exit_criteria:
      - '`tillandsias-plan policy eval --host-kind forge --regime interactive -- gh auth refresh` prints refused:policy:no-credential-mutation on stdout, a why: line and a remedy: line (naming `tillandsias --github-login --with-token`) on stderr, and exits 1 (pre-fix: FAILS — `tillandsias-plan capabilities` lists no `policy`)'
      - '`tillandsias-plan policy eval -- bash -c "a | b"` prints refused:policy:no-shell-strings with a remedy naming the argv form (pre-fix: FAILS — no verb; proc.run refuses the same argv with a Lua error() and no rule id)'
      - '`tillandsias-plan policy eval --host-kind bare-metal -- podman system reset --force` prints consent:policy:substrate-reset and exits 4; with --host-kind forge it prints refused:policy:substrate-reset:not-grantable-in-forge and exits 1 (pre-fix: FAILS)'
      - 'a seed whose rule sets decision: allow for a program the floor denies is refused at load with refused:policy-seed:cannot-loosen:<rule-id>, and the evaluator then answers from the floor alone, never from a partial seed (pre-fix: FAILS — no seed, no loader)'
      - 'proc.run{argv={"gh","auth","login"}} in the Observing environment returns status="policy_denied", rule_id="no-credential-mutation", why and remedy fields, and NO process is spawned (proven by a wrapper program that would write a marker file) (pre-fix: FAILS — it spawns)'
      - 'NEGATIVE CONTROL: `tillandsias-plan policy eval -- git status --porcelain` prints ok:policy:allow:default and exits 0, and proc.run of the same argv runs'
    verifiable_closure: |
      bash scripts/test-command-policy-evaluator.sh
      exits 0 with the six arms above passing. Pre-fix: FAILS at the first
      arm because the binary has no `policy` subcommand.
    next_action: >
      Write command_policy.rs (Request, Rule, Decision, floor, seed loader
      with the cannot-loosen check), the `policy eval` dispatch arm and
      capabilities token, call it from proc_run and the sh.run closure
      before Command::new, ship the seed with the three rules, write the
      fixture.
    notes: |
      size: L
      implementer_tier: opus
      This is the enforcement path: a wrong rule blocks every agent on the
      fleet, a missing one lets a credential mutation through. Credential
      and security surfaces are opus by the tier rubric.
    provenance: |
      Filed 2026-09-27 on macuahuitl from the 1443-6r3q design; the failure
      shapes it answers are the seven in the design note §1.
    events:
      - type: filed
        ts: "2026-09-27T17:58:31Z"
        agent_id: "linux-macuahuitl-claude-20260927t175831z"
        host: macuahuitl
        summary: |-
          Policy core with three rules; the floor is compiled in and a seed
          can only tighten it.

