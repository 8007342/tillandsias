    title: |
      LUA BASH REPLACEMENT + COMMAND POLICIES ENGINE (operator 2026-09-27): agents execute commands through the Rust-hosted Lua runtime as argv with named parameters and no pipes; a versioned, tighten-only policy seed decides allow/deny/consent per command family, host kind and regime with why+remedy on every refusal; a temporary PreToolUse hook routes raw Bash; branch discipline is SEEDED per project, enforced and published by the enclave mirror, and the land tool asks the runtime where to land
    context: |
      The operator's words (2026-09-27): "a LUA runtime for BASH execution
      with named parameters and NO PIPES … the full LUA runtime to replace
      unbounded bash, we'll add BASH POLICIES" and "land-on-platform-branch
      might need to be a .lua … SEED some BRANCH DISCIPLINE … the git mirror
      should then respond with the level of branch discipline being actively
      enforced for the checked out project".
      WHAT ALREADY EXISTS AND IS NOT RE-FILED: tillandsias-exec (argv, two
      fds drained concurrently, Completion as a value, RunId) landed under
      1252-fg9e; proc.run{argv,cwd,env,stdin,timeout_ms,group} and
      sh.run{argv} are live in lua_predicate.rs (1384-aixy in progress for
      spawn/streams); `tillandsias-plan lua <script>` is sandboxed by default
      (1375-btuf); fs.read/write/mkdir/list are repo-rooted with the symlink
      fixes of 1411-b5fk and 1412-n5cp; the no-pipes design of 2026-09-26
      already filed script run (1384-bqhy), the shell ratchet (1384-bxhk),
      the decider pilot (1384-ddua) and build.sh-as-launcher (1384-j3cv).
      WHAT THIS UMBRELLA ADDS: (A) the AGENT doors onto that runtime — a
      `run --json` verb with named flags, an MCP `run_command` tool, a
      bounded capture, a Windows argv-json form that never crosses MSYS or
      wsl.exe as a string; (B) the COMMAND POLICIES engine — a built-in
      floor plus a per-project seed .tillandsias/command-policies.yaml that
      can only tighten it, evaluated inside proc.run/sh.run/fs.* and the run
      verb, with consent tokens, an audit log and 1247-amcu affordances;
      (C) the MIGRATION bridge — a PreToolUse hook that classifies raw Bash
      against the seven measured failure shapes, with its removal criterion
      written into the hook; (D) BRANCH DISCIPLINE — a per-project seed
      .tillandsias/branch-discipline.yaml, a `discipline` verb and MCP tool,
      mirror-side enforcement at pre-receive plus a published
      refs/tillandsias/discipline/<digest>/<epoch> ref, and the land tool
      first probing the discipline (bash today) then ported to Lua.
      THE SEED CARRIES 1363-xp2v'S TWO AXES (operator ruling 2026-09-22):
      WHICH LEVEL the project has reached (0 = a bare project pushes freely
      to its default branch; 1 = an integration branch and pull requests;
      2 = work refs into the integration branch, multiple hosts) — forward
      only — and HOW HARD each rule is applied (advised | warn | enforced),
      ratcheting per rule. The floor is absolute: a project with no seed is
      level 0 advised and NOTHING refuses its first push. Tillandsias's seed
      is level 2 with default-branch protection enforced and the ref grammar
      at warn (work_ref_lane: migration, not enforcement). 1443-w79y is
      therefore also the first evaluator slice 1363-xp2v asked for; the
      ladder's DETERMINATION (derived versus declared) stays that row's
      research.
      FINDING RECORDED HERE because it changes the operator's proposal:
      `git push --dry-run` sends NO ref commands to the server, so a
      pre-receive hook never runs for it; the mirror's answer is therefore a
      PUBLISHED ref the client reads with ls-remote (and, on request, a
      probe push to a namespace the hook always rejects with the discipline
      text). The dry-run alone would only prove reachability.
