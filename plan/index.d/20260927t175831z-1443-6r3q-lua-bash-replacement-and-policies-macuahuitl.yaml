    title: |
      THE AGENT DOOR: `tillandsias-plan run [--cwd P] [--env K=V]… [--timeout-ms N] [--capture-bytes N] [--stdin-file F] [--json] -- <argv…>` (and `--argv-json -` reading argv as a JSON array on stdin) runs one child through tillandsias-exec after the policy evaluator says allow, from the PROC_RUN base environment only, and prints one typed result — run_id, status, code|signal, ok, stdout, stderr, truncated, wall_ms, argv, policy — so an agent never writes a shell string and a result never crosses a shell boundary as an integer
    context: |
      Spec: openspec/changes/lua-command-runtime-and-policies/specs/command-runtime/spec.md.
      SAME VERB AS 1375-amye. That row files `run` as the timeout/setsid/
      flock replacement with the preflight door as its first caller; this
      row is the AGENT-facing shape of the same verb (named flags, --json,
      --argv-json, the policy gate, the capture bound). Whichever lands
      first, the other adds its arms to the same run_verb.rs; neither may
      add a second spawn path.
      WHY --argv-json: Git Bash's MSYS conversion rewrote `\.` to `/.` in a
      cosign identity regexp and broke a release (1425-8wir, fixed as
      `[.]`); a wsl.exe argument lost its quoting and a fragment ran a
      poweroff as root (smoke-e2e-findings-v56.9.27.2-windows). Both are
      the same class: an argument crossed a shell boundary as text. Reading
      argv as a JSON array on stdin means NO argument is on the command
      line at all, so there is nothing for MSYS or wsl.exe to convert.
      Cross-locus dispatch (Windows host to WSL guest) stays in the one
      constructor 795-jjw3 allows (crates/tillandsias-core wsl.rs) and
      passes argv-json through it; it is out of scope here.
      NAMED PARAMETERS ARE FLAGS: --cwd, --env, --timeout-ms, --capture-bytes,
      --stdin-file. There is no positional string form and no --shell.
    exit_criteria:
      - '`tillandsias-plan run --json --timeout-ms 5000 -- printf "a b"` prints exactly one JSON object with keys run_id,status,code,ok,stdout,stderr,truncated,wall_ms,argv,policy and exits 0; a non-zero child exit is reported as code with the verb exiting 0 (status is a VALUE, not the verb''s exit) unless --exit-with-child is given (pre-fix: FAILS — capabilities lists no `run`)'
      - 'an argument containing a space, a double quote and `*` reaches the child as ONE argv entry, proven by a child that prints argc and its argv[1] — asserted on Linux, and by filed events from macbookair and from yolanda running the NATIVE .exe (pre-fix: FAILS — no verb)'
      - 'with `--argv-json -` and the JSON array ["printf","%s","C:\\x\\."] on stdin, Git Bash on yolanda delivers the third element unconverted (a filed event with the output), where the positional form under MSYS rewrites it (pre-fix: FAILS — no such form)'
      - 'a request the policy denies prints the same JSON with status="policy_denied", rule_id, why, remedy, and no run_id, exits 1, and no child was spawned (pre-fix: FAILS)'
      - 'the child sees ONLY the PROC_RUN_BASE_ENV_PASSTHROUGH set, TILLANDSIAS_* and the --env additions: a caller exporting GH_TOKEN=x runs `run -- env` and GH_TOKEN is absent from stdout (pre-fix: FAILS — nothing to run)'
      - 'stdout exceeding --capture-bytes yields truncated:true and ok:false in the JSON (inherits 1443-esm5)'
    verifiable_closure: |
      bash scripts/test-run-verb-agent-door.sh
      exits 0 on Linux with the six arms (the two platform arms assert on
      Linux and are re-asserted by filed events from macOS and native
      Windows before this row closes). Pre-fix: FAILS at arm 1.
    next_action: >
      Implement run_verb.rs over tillandsias_exec::Command, call
      command_policy before spawn, add the --argv-json reader, print the
      JSON result, and write the fixture; ask macbookair and yolanda for
      the two platform events.
    notes: |
      size: M
      implementer_tier: opus
      The policy call sits in this verb's spawn path (enforcement path
      rule); the argv-json form is the Windows quoting fix and must be
      verified on the native binary, not only in WSL.
    provenance: |
      Filed 2026-09-27 on macuahuitl from the 1443-6r3q design.
    events:
