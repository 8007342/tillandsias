      - scripts/test-mirror-discipline.sh
    title: |
      THE MIRROR ANSWERS WITH THE LEVEL OF DISCIPLINE ACTIVELY ENFORCED: images/git/pre-receive-hook.sh reads .tillandsias/branch-discipline.yaml from the integration branch's tree (level 0 advised when absent — nothing refused), applies each rule at ITS enforcement (advised = silent, warn = today's warning, enforced = rejection): an update to refs/heads/<default_branch> under an enforced rule is rejected with the seed's message before relaying, a new ref outside the grammar is warned or rejected per the rule, refs/tillandsias/discipline-probe/* is always rejected carrying the discipline text, and publish-discipline.sh keeps exactly one refs/tillandsias/discipline/<level>/<enforcement>/<digest>/<epoch> ref pointing at the seed blob on every reconcile tick — so `git ls-remote origin 'refs/tillandsias/discipline/*'` reads the level, the enforcement and the digest without pushing
    context: |
      Spec deltas: openspec/changes/lua-command-runtime-and-policies/specs/git-mirror-service/spec.md
      and specs/branch-discipline/spec.md.
      MEASURED PREMISE THAT REDIRECTS THE OPERATOR'S PROPOSAL: a `git push
      --dry-run` sends no ref commands, so the server's pre-receive never
      runs and cannot answer it. The mirror's answer is therefore a
      PUBLISHED ref in the same family as refs/tillandsias/upstream-auth/*
      (probe-upstream-auth.sh, read by check-credential-channel.sh) and
      refs/tillandsias/sync-state/* (publish-sync-state.sh): ls-remote reads
      the digest in the ref name; a fetch of the ref yields the seed bytes
      themselves. For a client that wants the server's own wording without
      a real ref change, a push to refs/tillandsias/discipline-probe/<epoch>
      is ALWAYS rejected and the rejection carries the discipline lines —
      a rejected push mutates nothing, and the local pre-push gate already
      exempts refs/tillandsias/* (1176-9vqn).
      TODAY the hook never pre-refuses a protected branch (GitHub does,
      after the relay, as GH006 → ADVICE), its grammar is warn-only and its
      env-var regex lacks work/<order> while the methodology admits it.
      FREEZE: the same reconcile tick that publishes the discipline ref
      exports refs/tillandsias/freeze/* from upstream (1429-4y9f owns that
      fix; this row depends on it and does not duplicate it).
    exit_criteria:
      - 'in a scratch bare mirror running the images/git hook scripts with a level-2 seed whose default-branch rule is enforced, a push to refs/heads/main is rejected BEFORE tillandsias-relay-refs runs, and the rejection text equals the seed''s messages.default_branch_denied with the branch names substituted (pre-fix: FAILS — the hook relays and the refusal, if any, is GitHub''s GH006)'
      - '`git ls-remote <mirror> ''refs/tillandsias/discipline/*''` lists exactly one ref whose name carries the level, the enforcement word and the sha256 digest of the seed; `git fetch` of that ref followed by `git cat-file -p` yields the seed bytes; after the seed changes on the integration branch the next reconcile tick replaces the ref (pre-fix: FAILS — nothing is published)'
      - 'ABSOLUTE FLOOR (1363-xp2v ruling 2026-09-22): in a scratch mirror for a project with NO seed, a push to its default branch is ACCEPTED and relayed, no warning is printed, and the published ref reads level 0 enforcement advised (pre-fix: FAILS — nothing is published; and a pre-fix hook that protected HEAD by default would have violated the ruling)'
      - 'with the grammar rule at warn, a push creating refs/heads/feature-x is accepted with the warning (today''s behaviour) and refs/heads/work/1443-uit6 is accepted WITHOUT a warning (pre-fix: FAILS — the env regex lacks work/ and warns on it); with the rule at enforced in a fixture seed, feature-x is rejected with the grammar hint while work/ and salvage/ refs are accepted'
      - 'a push to refs/tillandsias/discipline-probe/<epoch> is always rejected and the rejection carries the four discipline lines (default, integration, work grammar, rebase guidance) (pre-fix: FAILS)'
      - 'NEGATIVE CONTROL: a fast-forward push to the integration branch still relays exactly as today (the existing relay fixture stays green), and refs/tillandsias/upstream-auth/* keeps its single-ref invariant'
    verifiable_closure: |
      bash scripts/test-mirror-discipline.sh
      exits 0 against a scratch bare repository with the hook and
      publisher installed (hermetic; no container needed). Pre-fix: FAILS
      at arm 1.
    next_action: >
      Read the seed in pre-receive (git cat-file from the integration
      branch tip), add the default-branch refusal and the grammar refusal,
