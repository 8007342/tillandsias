  - packet_id: a-temporary-claude-code-pretooluse-hook-classifies-a-raw-bash-command-against-the-seven-measured-failure-shapes-through-the-policy-engine-refuses-with-why-and-remedy-asks-for-consent-on-destructive-classes-and-prints-its-own-retirement-condition
    order: 1443-we89
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    release_target: lua-bash-replacement-and-policies-2026-09-27
    pickup_role: linux
    capability_tags: [hooks, claude-code, policy, bash, migration, tests]
    estimated_hours: 8
    depends_on: [a-command-policy-evaluator-in-the-plan-binary-decides-allow-deny-or-consent-for-an-argv-request-from-a-built-in-floor-plus-a-per-project-seed-that-can-only-tighten-it-and-every-refusal-names-why-and-remedy]
    owned_files:
      - scripts/hooks/claude-pretooluse-command-policy.sh
      - crates/tillandsias-plan/src/command_policy.rs
      - .claude/settings.json
      - images/default/config-overlay/claude/settings.json
      - scripts/test-pretooluse-command-policy.sh
    title: |
      THE TEMPORARY BRIDGE (the operator called it a temporary fix): a Claude Code PreToolUse hook for the Bash tool, a bash-3.2-clean stub of under sixty lines that hands the tool's JSON to `tillandsias-plan policy classify-bash`, which classifies the raw command against the seven measured shapes — unquoted heredoc carrying backticks or $( ), SIGPIPE verdict pipeline under pipefail, verdict read through `| tail -1`, gh auth mutation, destructive class, wsl.exe/bash -c string with a pipe or backtick, token-shaped literal — and answers deny (exit 2 with why+remedy), ask (permissionDecision ask) or allow; `--status` prints the decision counts and the hook's own RETIREMENT CONDITION
    context: |
      WHY A HOOK AND WHY TEMPORARY. The damage of failure shape 1 happens in
      the shell before any file exists to lint: on 2026-09-27 two fragments
      lost their backticked spans to `<<EOF` and one run EXECUTED `openspec
      init` and `openspec update` in a protected checkout (1430-rnpd's
      correction 2aa367c0; 1256-t3w8 is the older row). No decider can see
      that; only the tool boundary can. The hook is the bridge until agents
      call the runtime directly (1443-8pur, 1443-r4cj) and the Bash tool is
      no longer the default door.
      THE CLASSIFIER IS IN RUST, the stub is not: bash cannot be trusted to
      parse bash (the harness's own worktree guard refuses compound shells
      for the same reason). classify-bash is lexical over the seven shapes
      with a stated grammar, not a parser; 1252-r72q's tree-sitter lint is
      the future parser and the classifier hands over to it when it lands.
      DECISION MAPPING to Claude Code's hook contract: deny = exit 2 with
      the refusal on stderr (the model sees it); ask = stdout JSON
      {"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":"ask","permissionDecisionReason":"…"}};
      allow = exit 0 silently. Unknown shapes ALLOW — a bridge that refuses
      what it does not understand stops the fleet.
      RETIREMENT CONDITION, printed by --status and pinned by the fixture:
      the hook retires when (a) 1443-8pur and 1443-r4cj are closed on every
      locus, (b) the audit log (1443-w9hf) shows zero deny and zero ask
      decisions from caller=pretooluse for fourteen consecutive fleet days,
      and (c) the operator flips the Bash tool's default. TILLANDSIAS_
      PRETOOLUSE_HOOK=off is the kill switch and is logged when used.
      WIRING is a settings.json hooks entry for PreToolUse matcher Bash in
      the project's .claude/settings.json and the forge overlay; the
      architect session that filed this row did not edit either file (no
      edits to settings files was its rule), so the operator decides
      whether the project file is committed or the entry is per host
      (open question in the design note).
    exit_criteria:
      - 'hook JSON whose command is a `cat <<EOF` heredoc whose body contains a backtick span exits 2 with refused:bash-policy:unquoted-heredoc-executes-prose, a why: line and a remedy: line naming `<<''EOF''` and `tillandsias-plan run --stdin-file` (pre-fix: FAILS — no hook exists; the command runs and executes the span)'
      - 'a command containing `set -o pipefail` and a pipeline ending in `grep -q` exits 2 with refused:bash-policy:sigpipe-verdict-pipeline and a remedy naming `run --json` and `grep -q PAT <<<"$var"`; a pipeline ending in `| tail -1` whose left side is a check-/test- script is refused:bash-policy:verdict-through-tail (pre-fix: FAILS)'
      - '`gh auth refresh`, `gh auth login` and `gh auth token` exit 2 with refused:bash-policy:no-credential-mutation (pre-fix: FAILS)'
      - '`podman system reset --force`, `tillandsias --reset-state`, `rm -rf <path outside cwd, TMPDIR and the scratchpad>` and `git push --force origin linux-next` print the ask JSON with a reason naming the consent class, never allow (pre-fix: FAILS)'
      - '`wsl.exe -d x -- bash -lc "a | b"` and `bash -c "$(cat f)"` exit 2 with refused:bash-policy:string-crosses-a-boundary (pre-fix: FAILS)'
      - 'NEGATIVE CONTROL: `git status`, `ls -la /tmp`, a QUOTED heredoc `<<''EOF''` whose body contains backticks, and `printf %s "$x" | sort` (no pipefail, no verdict consumer) all exit 0 with nothing on stdout'
      - '`scripts/hooks/claude-pretooluse-command-policy.sh --status` prints decisions=<deny>/<ask>/<allow> from the audit log and the three-part retirement condition verbatim; with TILLANDSIAS_PRETOOLUSE_HOOK=off every input exits 0 and the audit records kill_switch=1 (pre-fix: FAILS)'
      - 'the stub passes scripts/check-bash-dialect.sh (no mapfile, no declare -A, no ${x,,}) and a filed event from macbookair shows it running under bash 3.2'
    verifiable_closure: |
      bash scripts/test-pretooluse-command-policy.sh
      exits 0 feeding each fixture JSON to the stub and asserting exit code,
      stdout and the verdict token. Pre-fix: FAILS at arm 1 (no hook).
    next_action: >
      Add classify-bash to command_policy.rs with the seven shapes and
      their grammar in the header, write the stub, the fixture and the
      two settings entries (pending the operator's answer on where the
      entry lives), then measure one day of decisions before widening.
    notes: |
      size: M
      implementer_tier: opus
      Every agent Bash call on the fleet passes through it; a false deny
      halts work and a false allow repeats the heredoc incident. The
      classifier's grammar must be stated so the negative arms are real.
    provenance: |
      Filed 2026-09-27 on macuahuitl from the 1443-6r3q design; the seven
      shapes are the design note §1 table with their measured incidents.
    events:
      - type: filed
        ts: "2026-09-27T17:58:31Z"
        agent_id: "linux-macuahuitl-claude-20260927t175831z"
        host: macuahuitl
        summary: |-
          The bridge hook, designed as temporary with its removal criterion
          inside it.

