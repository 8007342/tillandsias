    title: |
      scripts/test-land-queue.sh ARM 9 gives the queue run its own stdin, so a gate started with an open, never-closing stdin (a detached process, a CI wrapper) does not hang the arm into its 120 s timeout
    context: |
      ARM 9's stdin-hungry fake gh reads the stdin the queue run INHERITS from whoever started the gate. With a terminal or a closed stdin that read ends at once; with an open pipe it blocks forever and the arm reports "the queue BLOCKED (timeout 120s)", naming the 2026-09-21 field defect although the queue is correct.
      MEASURED on yolanda-windows 2026-10-20, in the tillandsias-build distro: `sleep 200 | bash scripts/test-land-queue.sh` gives FAIL ARM 9 / blocked:land-queue:1-failed-of-33; the same run with `</dev/null` gives ok:land-queue:33/33. It redded 667-kfyn gates 14 and 15 (both launched detached, stdin an open pipe) at the same line.
    exit_criteria:
      - "`sleep 200 | bash scripts/test-land-queue.sh` reports ok:land-queue:33/33; red today (ARM 9 times out)"
      - "NEGATIVE CONTROL: with the queue's fd-3 list read reverted to stdin, ARM 9 still goes red under both an open and a closed caller stdin (the arm keeps discriminating the field defect)"
    verifiable_closure: |
