  - packet_id: store-msix-free-signing-research
    event:
      type: evidence
      ts: "2026-08-31T11:59:53Z"
      agent_id: "windows-yolanda-claude-20260830t162208z"
      host: windows
      summary: |
        EXIT CRITERION 2 RESEARCHED, and it reframes the operator's pending signing
        decision: the Store channel needs NO certificate, and the three things that
        actually block submission are none of them signing.

        THE STORE RE-SIGNS, AT ZERO COST. Microsoft's submission requirements state
        that MSIX/AppX packages "don't have to be signed with a certificate rooted in
        a trusted certificate authority", that the Store "will automatically re-sign
        your MSIX/AppX packages with a Microsoft certificate during the publishing
        process", and that no CA certificate, .pfx/.cer, USB token or HSM is needed.
        Signing with one's OWN certificate can cause validation failures through
        mismatched publisher identity, so unsigned is the PREFERRED submission shape
        rather than a tolerated one.

        SO THE TWO CHANNELS ARE DIFFERENT DECISIONS and should stop being reasoned
        about as one. The 0x800B0100 defect (722-w7a2) blocks the GitHub-release
        sideload channel, where unsigned is uninstallable. It does not block the
        Store channel at all. Also load-bearing for an earlier operator experience:
        the Store does NOT re-sign EXE/MSI submissions and requires a package URL on
        the developer's own infrastructure — which is exactly why Partner Center
        demanded a stable non-redirecting URL. The MSIX path has no such requirement;
        Microsoft hosts and CDN-serves it.

        WHAT ACTUALLY BLOCKS SUBMISSION, verified against the SHIPPED artifact's
        manifest rather than the template:

          Name="Tlatoani.Tillandsias"
          Publisher="CN=TillandsiasTestPublisher, OID.2.25.311729...=1"
          Version="0.4.2608.3005"

        1. THE FIRST VERSION FIELD IS 0 AND THE STORE FORBIDS IT. Sections are
           0-65535 "except the first section, which cannot be 0". This is structural:
           build-windows-tray.ps1:332 takes $vParts[0] from VERSION, which is
           0.4.260830.5. EVERY MSIX this repo can currently build is Store-invalid on
           this alone, and no existing switch changes it.
        2. THE FOURTH FIELD IS 3005 AND THE STORE REQUIRES 0 — it is "reserved for
           Store use". The build already has -MsixStoreRevisionZero for precisely
           this; release.yml never passes it (zero occurrences). Capability present,
           simply unwired.
        3. IDENTITY NAME AND PUBLISHER ARE PLACEHOLDERS. They must match the values
           Partner Center assigns under "View app identity details", and Microsoft
           warns the values are case-, space- and punctuation-sensitive.
           TillandsiasTestPublisher is the unsigned-namespace test publisher.

        SPLIT BY WHO CAN FIX IT: (1) and (2) are code, but (1) is NOT a one-liner —
        a Store-legal quad needs a leading field >= 1, so it requires a decided
        mapping from this repo's 0.4.YYMMDD.N scheme, which is a release-wide
        versioning decision and is not made here. (3) is operator-only; the Partner
        Center identity exists nowhere else.

        DELIBERATELY NOT DONE: I did not wire -MsixStoreRevisionZero. It carries a
        documented collision hazard (revision pinned to 0 means two same-day builds
        share a version), changing the release pipeline while a release decision is
        pending is the wrong moment, and it is useless alone because blocker (1)
        fails the package regardless.

        NOT ESTABLISHED: no submission was attempted. Every claim here is from
        Microsoft's published requirements checked against the shipped manifest, not
        from Partner Center accepting or rejecting anything. One rejected submission
        would convert this from documentation-derived to observed, and that needs the
        operator's dashboard.

        Detail: plan/issues/store-msix-submission-blockers-2026-08-31.md
