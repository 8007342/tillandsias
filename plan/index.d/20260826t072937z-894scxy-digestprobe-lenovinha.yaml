events:
  - packet_id: a-diagnostic-that-names-the-layer-it-observed-rather-than-the-layer-that-failed
    event:
      type: note
      ts: "2026-08-26T07:30:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t072600z
      host: lenovinha
      summary: |
        A STRONGER PROBE THAN THIS PACKET CURRENTLY MANDATES, from pirria, with a
        hazard bound that must travel with it.

        THE QUESTION IT ANSWERS. `gh auth refresh` can leave TWO secret-service
        entries for `gh:github.com`, one with an EMPTY username. That is the
        exact shape in which gh could be reading a STALE entry while a good token
        sits unused — which would be a LOCAL bug, not a revocation, and would
        send the reader to a completely different subsystem. The packet's
        existing criteria (`gh api user` 200/401, the three keyring probes) do
        not distinguish it.

        THE PROBE: hash both candidate entries and compare digests.

          for u in <user> ""; do
            secret-tool lookup service gh:github.com username "$u" \
              | sha256sum | cut -c1-16
          done

        Same digest => gh is reading the same token from both entries, so a stale
        entry is ruled OUT and the rejection is server-side. Different digests =>
        it is local, and the packet's whole diagnosis changes.

        MEASURED ON TWO HOSTS, and the second is the one that makes it useful:
          pirria    d8a3bec341da198f == d8a3bec341da198f   (credential DEAD)
          lenovinha 390bc07d21dece6f == 390bc07d21dece6f   (credential HEALTHY)

        lenovinha carries the same two-entry / empty-username shape while
        `check-credential-channel.sh` returns ok and pushes land all night. So
        THE SHAPE IS BENIGN — the ordinary residue of `gh auth login`, not a
        symptom. Measuring it only on the broken host would have left it a
        suspect; measuring it on a working one eliminates it. That is the same
        platform-fact-vs-host-fact separation the keychain finding needed, and it
        is why the second data point is worth the minute it costs.

        THE HAZARD, AND IT CUTS AGAINST THIS PACKET'S OWN SECURITY CRITERION.
        That criterion says the check must not MATERIALISE the secret. This probe
        does materialise it — `secret-tool lookup` writes the value to stdout —
        and is safe only because it is piped DIRECTLY into a digest and never
        rendered, stored, or teed. It is one careless `tee`, one `set -x`, or one
        interactive run away from the leak that has already bitten two hosts
        tonight.

        SO IT IS RECORDED AS BOUNDED, NOT AS A RELAXATION: digest-only, direct
        pipe, never `secret-tool search --all` (which prints the value inline),
        never interactive. The criterion stands as written; this is a named
        exception with its trap attached. A method note that carries the
        technique without the trap is how the trap gets re-sprung — pirria's own
        first attempt was curl-with-the-token, and they say so.

        NOT CHANGING THE PACKET'S EXIT CRITERIA. The implemented guard does not
        need this probe: `gh api user` already gives it the 200/401
        discrimination without retrieving anything, which is why the shipped
        check should stay as it is. This belongs in a human's hands during
        diagnosis, not in the automatic path — and that distinction is the reason
        it is a note rather than a criterion.
