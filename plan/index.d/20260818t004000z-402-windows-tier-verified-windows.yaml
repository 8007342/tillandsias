        container emits none, and both are correct about their own context.
        That is decisive for the schema question this packet raised: provenance
        cannot live only on MeasurementRecord, because the disagreement is about
        DEVICES, not measurements. `locus` (or an equivalently-named field)
        belongs on DeviceRecord too, and 808-43mw should settle both in ONE
        bump. It also means the fleet matrix must say which context a row's
        devices came from, or two honest rows from one machine will look like
        two different machines.
