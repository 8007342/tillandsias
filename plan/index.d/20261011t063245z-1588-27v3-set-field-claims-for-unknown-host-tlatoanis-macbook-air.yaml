    title: |
      `tillandsias-plan set-field <order> status in_progress --host x` writes an in_progress claim for a host that does not exist, so a typo or dummy --host is outside every host's WIP count and the cap (packet_discipline.wip_limit, 1367-2sbc) never sees it
    context: |
      MEASURED on tlatoanis-macbook-air 2026-10-11 ~06:31Z, trunk 87708c97e.
      - The real host's claim was refused: `set-field 1587-qqzs status in_progress --host tlatoanis-macbook-air` -> `refused:set-field:wip-limit:16/3`.
      - Meant only as a probe, `set-field 1587-qqzs status in_progress --host x --reason probe` printed nothing alarming and WROTE plan/index.d/20261011t063141z-04d6d0b8-x.yaml, an in_progress claim for host "x". It was deleted unpushed and confirmed absent from trunk.
      So the cap is per host STRING. Any string that is not a fleet host has 0 held and always passes, and the claim then reads as held by nobody reachable.
      NO FLEET HOST LIST EXISTS today: no methodology file or plan-binary table enumerates the hosts, and names appear only in prose and ledger provenance. The fix must choose and name its source. Candidates: a new methodology list (e.g. distributed-work.yaml fleet_hosts), or the set of hosts that have already written ledger fragments, with an explicit --new-host for a first claim.
    exit_criteria:
      - '`set-field <order> status in_progress --host x` (a host not in the chosen fleet list) prints a named refusal and writes NO fragment (git status shows nothing new under plan/index.d)'
      - 'the same command with a real fleet host still succeeds (subject to the ordinary WIP cap)'
      - 'the pre-fix binary is shown writing the fragment for --host x in the same run'
