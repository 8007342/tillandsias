      summary: |
        FIRST LIVE EVIDENCE THAT THE PRE-FLIGHT GUARD REFUSES, obtained WITHOUT destroying anything (macneo, 2026-09-20).

        THE HOST STATE IS THE POINT. macneo has NO Tillandsias.app in /Applications and 1.2 GiB of VM state under the real image root — the unexplained condition recorded on this host earlier today, cause still unidentified. That is exactly the state the guard was written for: an install interrupted between the app swap and the reset, where destroying the state would leave nothing to reprovision from, on the broken host the flag exists to repair.

        THE TWO COMMANDS AND THEIR EXITS, run against the locally built tray (NOT the published v56.9.20.1 asset, which had not published at the time):

          TILLANDSIAS_DESTRUCTIVE_RESET_OK=0 tillandsias-tray --reset-state
            [tillandsias] --reset-state: REFUSING to destroy anything -- the reprovision path is missing or not executable:: /Applications/Tillandsias.app/Contents/MacOS/tillandsias-tray
            EXIT=1

          tillandsias-tray --no-such-flag-xyz
            Error: unknown flag --no-such-flag-xyz
            EXIT=2

        THE SECOND COMMAND IS THE CONTROL AND IS WHY THE FIRST MEANS ANYTHING. The same binary DOES reject an unknown flag with a different message and a different exit code, so the first result is the parser accepting --reset-state and the BODY refusing, not a probe that cannot fail. Without it, "the tray printed a refusal" is equally consistent with the flag never having been recognised.

        WHAT IS MEASURED AND WHAT IS NOT, kept apart. MEASURED: the refusal branch fires on a real host in the real broken state, names the missing path, and exits 1. NOT MEASURED: the destructive branch. Nothing was destroyed and no VM was booted; the 1.2 GiB is untouched. The ordering that puts the refusal before the announcement and before any removal is verified by READING (reset_state.rs: refusal, then announce, then wipe) and by the contract fixture's source-order arm, not by a live run. A live fire waits for a smoke with per-run operator consent, as ruled -- firing it here to prove the guard would risk unre-derivable vault state (803-49re) against a property already verifiable two other ways.

        A DEFECT FOUND BY THE SAME RUN: the refusal reads "not executable::" with two colons. RESET_NO_REPROVISION_PATH already ends in a colon and the macOS body formatted it as "{}: {}" while the Windows arm correctly uses "{} {}". It is in the shipped v56.9.20.1 text, in the one message a broken host ever sees. Fixed for the fix-forward cut, with a contract-fixture arm asserting both that the constant still ends in a colon and that no body adds a second.
