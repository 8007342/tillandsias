    verifiable_closure: |
      bash scripts/test-model-tier-routing.sh prints ok:model-tier-routing:5/5
      and exits 0, where, over a scratch ledger with one haiku row, one sonnet
      row, one opus row and one untagged row all claimable by role any: arm 1:
      select-work-batch.sh any --tier haiku emits a batch whose packet lines
      name ONLY the haiku row and whose batch: line carries tier=haiku; arm 2:
      --tier haiku over a ledger with no haiku row prints
      refused:no-tier-work:model-tier=haiku and exits 1 (never the general
      queue); arm 3: --tier sonnet emits the sonnet row and the untagged row and
      not the haiku or opus rows; arm 4: --tier opus emits the opus, sonnet and
      untagged rows and not the haiku row; arm 5: tillandsias-plan next any
      --tier haiku lists the haiku row alone, so plan_next agrees with the
      selector. PRE-FIX RESULT: FAILS — --tier is an unknown argument to both
      tools today and every arm's batch contains all four rows.
    title: |
      `select-work-batch.sh --tier <haiku|sonnet|opus>` and `next --tier` route packets by implementer_tier, refusing the general queue for a haiku caller
    context: |
      T1 of the 2026-09-27 trims. The selector already routes by executor
      class for the low-end floor (HOST_TIER, TIER_TAGS,
      refused:no-tier-work in scripts/select-work-batch.sh) and pins it with
      litmus:capability-routing-shape; this is the same shape keyed on the
      implementer_tier scalar 1437-khnx projects. Rule: a haiku caller's pool
      is exactly the haiku rows; a sonnet caller takes sonnet plus untagged;
      an opus caller takes everything but haiku unless --tier-any. The caller
      STATES its tier (env TILLANDSIAS_MODEL_TIER or --tier); nothing is
      inferred from a model name. Canonical rule:
      methodology/distributed-work.yaml -> cycle_batch_triage.model_tier_routing.
    next_action: >
      Add --tier/TILLANDSIAS_MODEL_TIER to select-work-batch.sh beside the
      HOST_TIER gate (filter the rows JSON on .implementer_tier before the
      epic scoring, print tier= on the batch line, refuse on an empty haiku
