    verifiable_closure: |
      bash scripts/test-claude-delegate-implement.sh prints
      ok:claude-delegate-implement:4/4 and exits 0, where, with CLAUDE_BIN
      pointing at an argv-recording stub and a scratch ledger holding one
      packet whose owned_files lists scripts/a.sh: arm 1:
      scripts/claude-delegate.sh implement <order> launches the stub with
      --model haiku, --effort low and an --allowedTools set that permits
      Edit and Write and no Bash git verb; arm 2: the prompt handed to the
      stub names the packet's verifiable_closure verbatim and its owned_files;
