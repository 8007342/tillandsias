      cargo test -p tillandsias-plan projection_carries_size_and_implementer_tier
      passes, and bash scripts/test-packet-tier-fields.sh prints
      ok:packet-tier-fields:4/4 and exits 0, where arm 1: a scratch fragment
      declaring size: S and implementer_tier: haiku as top-level packet scalars
      is projected by tillandsias-plan query --json with both keys and values;
      arm 2: a scratch fragment carrying the same two as lines inside notes: is
      projected identically (the fallback for rows filed before this landed);
