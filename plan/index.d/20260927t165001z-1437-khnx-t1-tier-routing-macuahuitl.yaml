      argv and the scratch repo's log are unchanged. PRE-FIX RESULT: FAILS —
      implement is not a mode of scripts/claude-delegate.sh today (usage,
      exit 2), so arm 1 records no launch.
    title: |
      `scripts/claude-delegate.sh implement <order>`: a Haiku implementer bounded to the packet's owned_files, with the host session keeping verify and commit
    context: |
      T1 of the 2026-09-27 trims. Today's delegate modes are read-only
      (audit, patch-draft, json). In-session delegation is the preferred way
      a host session runs a cheaper model for a haiku-tier packet: the host
      claims the packet, launches the bounded implementer, verifies with the
      packet's closure, commits and hands off on work/<order> exactly as
      before. The haiku-delegate skill's rule that the primary agent remains
      accountable for scope, verification and commits is unchanged and
      restated in the skill text.
    next_action: >
      Add the implement mode: resolve the packet by order via the plan
      binary, refuse without owned_files, build the prompt from title,
      context, next_action, verifiable_closure and owned_files, launch
      claude --print --model "${CLAUDE_DELEGATE_MODEL:-haiku}" with an
      allowedTools set limited to Read, Grep, Glob, Edit, Write and a Bash
      allowlist that excludes git; print the closure command for the host to
      run. Update skills/haiku-delegate/SKILL.md in the same commit.
    notes: |
      size: M
      implementer_tier: sonnet
      A few files, clear design; the permission boundary is the judgment
      part and is fully specified above.
    provenance: |
      Filed 2026-09-27 on macuahuitl by the trims designer session; design in
