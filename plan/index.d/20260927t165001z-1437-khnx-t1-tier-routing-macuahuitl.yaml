      --strict-fragments refuses implementer_tier: gpt or size: XL with a
      named reason. PRE-FIX RESULT: FAILS — arm 1 today prints a projection
      without either key (query_json_projection lists no such key), arm 3
      writes a field no reader sees, arm 4 accepts any spelling.
    title: |
      The plan binary projects `size` and `implementer_tier` as scalar packet fields, reads the notes-line fallback, and refuses unknown vocabulary
    context: |
      T1 of the 2026-09-27 trims. No packet field names a model tier today;
      the ledger has zero rows with size or implementer_tier. A novel field
      must be a SCALAR (set-field refuses list-valued fields, 1184-tj2q) and
      must be added to query_json_projection in crates/tillandsias-plan/src/main.rs
      or it is writable and unreadable (the must_ship lesson, 1218-25z3).
      Twenty rows filed today carry the two values as lines inside notes:,
      so the projection must read that shape too until they are corrected.
      Vocabulary: size S|M|L, implementer_tier haiku|sonnet|opus.
    next_action: >
