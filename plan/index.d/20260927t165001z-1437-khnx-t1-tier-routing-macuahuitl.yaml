      crates/tillandsias-plan/src/answer.rs; bind a litmus over the fixture;
      keep litmus:capability-routing-shape green (the low-end gate composes
      with the tier gate: both filters apply).
    notes: |
      size: L
      implementer_tier: opus
      Cross-cutting (selector, plan crate, a litmus binding) and a wrong
