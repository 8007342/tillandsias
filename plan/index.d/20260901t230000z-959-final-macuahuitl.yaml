packets:
  - packet_id: tool-payloads-outside-persistent-cache
    order: 960-tpop
    status: ready
    kind: fix
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    depends_on: []
    capability_tags: [forge, images, performance]
    title: >
      Launch-time tool installs land on the container overlay and are
      re-paid per launch: agy 199.3MiB, the linuxbrew tree 80MB + every
      formula, all rented — one persistence-boundary defect, one placement
      decision, not N per-tool bugs.
    context: |
      Consolidates (operator's low-end mandate, both floor scouts):
      require_antigravity's dead ANTIGRAVITY_BIN directive drops agy on
      the overlay (~/.local/bin), so command -v fails every fresh launch
      and 199.3MiB re-downloads concurrent with the expert build
      (pirria); /home/linuxbrew/.linuxbrew has no mount entry, so the
      80MB brew bootstrap plus every installed formula dies with the
      container — measured 364s for ONE incidental tokei probe on the
      N150 (pirria). Persistent mounts under /home/forge are only
      .cache/tillandsias-project, .gitconfig, .config/gh, .ssh. The same
      boundary also relates to 953-fflt's prebake (the expert binary) —
      three payload classes, one decision: what a launch installs must
      land in the persistent tool-cache or the image. 64-shim trap
      surface is common-mode on both floor hosts (64/64 identical + 1
      real watchexec via the cargo persistent mount, proving the
      persistent-mount path already works for tools that use it).
    verifiable_closure: |
      A container recycle on a floor host re-resolves agy and one
      previously-installed brew formula WITHOUT network downloads (podman
      logs show cache/persistent-path hits), and the second launch's
      first-tool-probe cost drops from ~364s to sub-second.
