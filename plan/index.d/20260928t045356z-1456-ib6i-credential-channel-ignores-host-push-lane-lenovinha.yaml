    title: |
      scripts/check-credential-channel.sh (and so check-fleet-membership's todo:credential-channel ... stop-and-report) only knows the gh/keyring push path, so a host whose §6 host-push lane is wired and verified is told to STOP while every push it makes lands through the mirror with the Vault token
    context: |
      MEASURED on lenovinha 2026-09-28. The login keyring re-locks on its own (a gnome-keyring bug the operator says is
      fixed upstream). The operator ran --github-login and the §6 lane was wired and verified: salvage/lenovinha/
      20260928-lane-acceptance and every push since (linux-next and work refs) went "Atomic push ... succeeded" through
      the mirror. Yet with the keyring locked, check-credential-channel answers unknown:secret-service-unprobed, and
      check-fleet-membership emits todo:join-the-fleet:credential-channel:...:stop-and-report, so the worker loop's own
      rule says take no work. A worker following it strictly idles a host that can land everything; one that proceeds
      does so against its instrument.
    exit_criteria:
