        THE HONEST HISTORY OF THIS ROW, written by the host that found it rather than paraphrased, at pirria's request. THIS ROW WAS BELIEVED FIXED ON LINUX FOR SEVEN WEEKS AND WAS NOT, AND THE REASON IS THE INTERESTING PART. The fix landed in build_cloud_projects_submenu, which order 628-p5tj had ALREADY RETIRED to a function carrying allow(dead_code) and the trace 'retired by order 628-p5tj convergence'. So cloud_overflow_row - the non-clickable informational row with the remedy label, the thing everyone believed shipped - has exactly two callers: one at line 3404, INSIDE the retired function (it spans 3344 to 3425), and one in a test. No live caller. The same is true of resolved_max_cloud_projects_in_menu, so the TILLANDSIAS_MAX_CLOUD_MENU_ITEMS override the label advertises as 'a remedy the user can actually act on' does NOTHING when set. Meanwhile handle_cloud_overflow_click IS live - reached from async fn event at 4221 via the CLOUD_OVERFLOW_ID arm at 4358 - and it still prints a terminal tip telling the user to set that dead variable. THE TEST IS THE PART TO CARRY AWAY. cloud_overflow_row_is_informational_not_a_dead_button has been GREEN throughout those seven weeks. It asserts that the row is not clickable and that its label 'must name a remedy the user can actually act on, rather than promising a picker that does not exist'. Both assertions are true of the function, and the function is unreachable. A green test over an unreachable path reads EXACTLY like a closed bug - there is no output anywhere in the tree that distinguishes them. The fix and the proof of the fix migrated into dead code TOGETHER, which is precisely why nothing could report the difference; had either stayed live, the other would have been caught. WHAT COMPOUNDED IT. Three separate prose claims asserted the state the code had abandoned. The dispatch arm at 4358 says 'The menu no longer emits this leaf as clickable (order 591-33s6): it is a disabled, informational row' - false, the shared builder emitted MenuItem::leaf, which is ENABLED on every platform. The parity paragraph at 3389 said 'the macOS tray already treats its overflow row as inert and the Windows tray has no such control at all. Linux was the only tray shipping a dead button' - every clause wrong, and backwards: all three shipped it, Windows included, and macOS being inert IS the dead button rather than a converged good state. And the surviving TODO says a real picker 'still wants a GtkWindow', which is true of a WINDOW and false of a SUBMENU - the observation that unlocked the actual fix. THE CORRECTION IS COMMITTED at 93195e5f7 on work/591-33s6-parity-comment, based on pirria's ef8163ae5 so it applies to their in-flight work; it names the wrong paragraph rather than quietly deleting it, because the wrongness is the history. FOR ANYONE AUDITING SIMILAR ROWS: the cheap check is not whether a fix exists or whether its test passes. It is whether anything LIVE reaches the code the test exercises. allow(dead_code) and the word 'retired' in a doc comment are the tell, and this corpus proves they are worth grepping for before believing any fix that has aged.
