packets:
  - order: 852-dk9z
    packet_id: accel-capability-cache-serves-stale-document-across-probe-code-changes
    desired_release: v0.6
    title: "load_or_probe's cache key cannot see probe-code changes, so a rebuilt binary republishes its predecessor's document as a fresh probe"
    status: ready
    kind: bug
    pickup_role: linux
    priority: p2
    capability_tags: [capabilities, probe, cache, rust]
    deliverable: crates/tillandsias-headless/src/accel_probe.rs
    depends_on: []
    estimated_hours: 2
    context: >
      Measured live on yoga, 2026-08-23, minutes after 54ed95240 (850-bif2's
      AMD-aware enumeration) landed. The binary was rebuilt at 366f2baff and
      run via scripts/host-capability-probe.sh --fragment against a cache
      directory holding the PRE-fix run's document. load_or_probe invalidates
      only on parse failure, schema_version mismatch, or legacy_tier mismatch.
      All three matched (schema 2, gpu-rocm), so the rebuilt binary served the
      bc6c619d0-era document verbatim — generic "Vulkan GPU", driver null,
      engines [] — and the generator wrapped it into a ready-to-file row that
      LOOKED like the new code's output. Nothing on the row says which code
      probed it. Caught pre-commit only because the expected marketing-name
      change from 54ed95240 was known and absent; re-running with a fresh
      cache dir produced the correct "Krackan [Radeon 840M / 860M Graphics]"
      + driver amdgpu + container-lane ollama document.

      This is the confidently-wrong-row failure class the matrix exists to
      prevent (cf. the (host_id, locus) LWW lesson in the 2026-08 archive),
      reached through the cache rather than the fold: staleness dressed as a
      probe. Any probe-code change that alters document CONTENT without
      bumping schema_version or flipping legacy_tier is invisible to the
      cache key, which makes every future enumeration fix (and there will be
      more: the NPU arm, macOS) silently non-observable on hosts with a
      warm cache. Sibling hazard, recorded in yoga's first row fragment
      header rather than here: when the cache IS invalidated (v1 to v2), the
      rewrite silently discards the old cache's measurement rows.
    exit_criteria: >
      (1) The cache key includes a probe-code identity — crate version or a
      dedicated probe revision constant — OR the --capabilities path takes a
      freshness flag the generator uses; either way a rebuilt binary can no
      longer serve a document produced by different probe code as if it had
      probed. (2) A unit test pins it: a cached document stamped with an old
      probe identity is re-probed, not served, by a binary with a newer one.
      (3) scripts/host-capability-probe.sh publishes only fresh probes by
      construction, so a published capability row can never be a stale-cache
      artifact. (4) Negative control: an unchanged binary still serves its
      own cache (the cache continues to exist for the server's hot path).
