# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by linux_mutable (macuahuitl), 2026-08-23T22:39:08Z.
packets:
  - order: 864-v8kr
    packet_id: fold-capabilities-needs-its-base-injected-by-every-caller-separately
    desired_release: v0.5
    title: "the base is spliced in as a synthetic fragment at two call sites, so a third caller silently sees an empty matrix"
    status: ready
    kind: defect
    pickup_role: any
    priority: p2
    capability_tags: [plan, crdt, ledger, capabilities]
    deliverable: crates/tillandsias-plan/src/fragments.rs
    depends_on: []
    estimated_hours: 2
    discovered_by: "auditing 846-idhn's exit criteria rather than trusting its implemented status"
    context: >
      `fold_capabilities(fragments: &[Fragment])` takes ONLY fragments. It never
      reads plan/index.yaml. The base rows reach it because each caller builds a
      synthetic Fragment named "0000-base" from the base document and prepends
      it:

        crates/tillandsias-plan/src/main.rs:2922    (capability-matrix)
        crates/tillandsias-plan/src/fragments.rs:1272

      Both production callers do it, so the behaviour is correct today and
      `capability-matrix` reports all 7 hosts. But the base-reading is
      DUPLICATED CALLER-SIDE rather than being a property of the fold, and the
      duplication is invisible from the function's signature: nothing about
      `fold_capabilities(&frags)` suggests the caller owes it a synthetic
      fragment first.

      846-idhn's exit criterion 2 states the requirement exactly — "fold_capabilities
      reads the base as well as the fragments, so a folded row is
      indistinguishable from a fragment row to EVERY CALLER". Two callers
      satisfying it by convention is not every caller satisfying it by
      construction. A third one gets an empty-looking matrix and no error, which
      is the failure mode this whole channel already had once when compaction
      consumed its fragments (843-624y, yolanda's two rows).

      THE FIX IS SMALL AND SHOULD NOT BE DEFERRED FOR ITS SIZE: give
      fold_capabilities the index path (or a base Value) so the splice happens
      once, inside, and delete both caller-side copies. The signature then
      states the contract instead of relying on the reader knowing it.
    exit_criteria: >
      (1) The base splice happens inside the fold, and neither call site builds
      a "0000-base" Fragment.
      (2) A test calls the fold WITHOUT any caller-side preparation and still
      sees base rows — the property that distinguishes construction from
      convention.
      (3) capability-matrix reports the same 7 hosts before and after.

