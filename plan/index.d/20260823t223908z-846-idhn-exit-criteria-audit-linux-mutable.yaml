        EC3 IS THE VALUABLE HALF AND IT IS THE MISSING HALF. EC1 and EC2 fix
        this channel; EC3 is the one that generalises, and it is precisely the
        criterion that would have caught 864-p2rk's cousin earlier today — a
        key that fails to cover an input to the operation it keys.
