    title: |
      MEASURED on pirria: tillandsias-vault takes the FULL 30s stop timeout and dies of SIGKILL (exit 137) on every shutdown, because its entrypoint is a PID-1 shell that traps nothing and never forwards SIGTERM to the vault process — and the pid it does hold is tee's, not vault's
    context: |
      FOUND by pirria 2026-09-12 during the authorised destructive smoke of
      v56.9.12.2 (§2 reset + §3 pristine init, both PASS). Not a smoke failure —
      it falls out of watching what the tray's own graceful shutdown does.

      OBSERVED, then REPRODUCED DELIBERATELY:
          tillandsias --diagnostics ... "Graceful shutdown completed"
          tillandsias-vault  Exited (137)   <- SIGKILL
          tillandsias-proxy  Exited (0)     <- clean, same shutdown
      Reproduced on demand: start the container, `podman stop -t 30
      tillandsias-vault` -> takes exactly 30s, ExitCode 137, OOMKilled false.
      The proxy in the same sequence exits 0, so this is not podman and not the
      tray — it is this image.

      CAUSE, read from the container rather than inferred. Process tree inside
      tillandsias-vault:
          PID 1   bash        <- images/vault/entrypoint.sh
          PID 10  vault       <- child
          PID 11  tee         <- child
      images/vault/entrypoint.sh:75 launches the server as a BACKGROUNDED
      PIPELINE:
          vault server -config="$VAULT_CONFIG" 2>&1 | tee -a "$ENTRYPOINT_LOG" &
          VAULT_PID=$!
      and the file contains NO trap (grep 'trap' matches one line, 238, which is
      a comment). So PID 1 is a shell with no signal handling: podman's SIGTERM
      goes to the shell, vault is never told to shut down, the 30s grace expires
      and the container is SIGKILLed. Vault's own log confirms it — the last
      lines are "vault is unsealed / serving", and there is NO shutdown entry at
      all. It never hears the signal.

      SECOND DEFECT IN THE SAME TWO LINES, and it survives the first being
      fixed: after a PIPELINE, `$!` is the LAST element's pid — tee, not vault.
      Confirmed in the container: /proc/10/comm = vault, /proc/11/comm = tee,
      and VAULT_PID holds 11. So `wait "$VAULT_PID"` (line 251) waits on tee.
      Anyone adding a trap that forwards to $VAULT_PID would signal tee and
      believe they had fixed it — the container would still take 30s and still
      exit 137, with a plausible-looking trap in place.

      WHY p1 RATHER THAN COSMETIC. This is a SEALED SECRET STORE being killed
      uncleanly on every single shutdown, on every host, with no graceful
      unmount of its storage. The runbook's §3 already names "Vault failing to
      initialize/unseal … keychain<->volume share mismatch" as a thing this
      smoke exists to catch, and cites the resync brick in git history
      738059bc. A store that is never allowed to shut down cleanly is a
      plausible contributor to exactly that class, and it costs 30 seconds of
      every stop besides. Nothing has bricked here — this is the precondition,
      found before an incident rather than after one.

      NOT ESTABLISHED, so nobody over-reads this: that the SIGKILL has ever
      corrupted anything. Vault's file backend is crash-tolerant by design and
      this host's init came up clean immediately afterwards. The claim is that
      the shutdown path is wrong and the risk is unnecessary, not that damage
      has been observed.
    next_action: |
      1. Make the entrypoint forward signals. Either `exec` vault as PID 1 —
         which removes the shell and the pipeline together and is the simplest
         correct shape — or install `trap 'kill -TERM "$VAULT_PID"' TERM INT`
         and wait on it properly.
      2. If the pipeline to tee is kept, FIX THE PID CAPTURE first: `$!` after a
         pipeline is tee's. Use `${PIPESTATUS}`-style handling, a process
         substitution (`> >(tee -a "$LOG")`) so vault stays the direct child, or
         capture vault's pid explicitly. A trap that forwards to the wrong pid
         is worse than no trap, because it looks fixed.
      3. Pin it with a fixture: start the built image, `podman stop -t 30`,
         assert elapsed well under 30s AND exit 0. It must be RED against
         today's image — 30s and 137 — or it is not evidence.
      4. Check the sibling images. proxy exits 0 so it is likely fine, but
         git/inference/forge were not examined here and may share the shape.
