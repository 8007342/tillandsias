        2. check-scorable-obligation-added REFUSED A NEW ROW WITH NO WAY TO SCORE IT:
             violation:scorable-obligation-missing:1
               packet '...' carries no scorable obligation — add a verifiable_closure naming a
               litmus:<test>, or an explicit 'unscoreable: <reason>' (977-448j)
           I had filed 1267-uafx without either. The refusal ALSO named the trap in the remedy: if the deliverable IS the test, pinning a name nothing defines yet is refused by 885-92iu, so use unscoreable with the future filename (1136-n8sh). That is a remedy that anticipates the mistake the remedy would otherwise cause.

        WHY THEY BELONG ON THIS ROW. The failures this family collects share one shape: a channel carries something TRUE that answers a different question than the consumer asked, and the consumer cannot tell. These two are the inverse and show what the fix looks like in practice — the verdict NAMES ITS SUBJECT (the field, the packet, the missing obligation) and REFUSES rather than defaulting. Neither said "ok" about an adjacent arm and fell silent about the one I came for. After a night of cataloguing false greens it is worth recording that two guards said red about me, and were right.

        THE CONTRAST WITH THIS ROW'S FOURTH INSTANCE IS EXACT. check-plan-binary-current.sh printed ok:plan-binary-write-is-opt-in+role-satisfies and minted nothing; the caller had asked it to mint. set-field could have written `completed` and said nothing about evidence. It did not. The difference is not effort, it is whether the producer states the subject it acted on.
