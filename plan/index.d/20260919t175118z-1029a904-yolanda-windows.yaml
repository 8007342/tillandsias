        TWO POSITIVE CASES, recorded because this row's family is almost entirely negative and a guard that says red when it should is the thing being asked for. Both caught a REAL omission of mine, 2026-09-19.

        1. set-field REFUSED `completed` WITHOUT EVIDENCE:
