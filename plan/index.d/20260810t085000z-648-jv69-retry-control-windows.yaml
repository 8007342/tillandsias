      summary: >
        ROOT CAUSE, and it corrects this packet's own filing. I wrote that retry
        "neither retries nor is actionable". The first half was wrong: the retry
        MACHINERY is complete — MenuAction::Retry is implemented and every
        failure path clears PROVISIONING_ACTIVE, so a fresh attempt could start.

        What was missing is the CONTROL. MenuStructure::failed() is the only
        constructor of a `retry` leaf in the codebase, and nothing on the Windows
        path — nor menu_state::build — ever called it; the sole reference in the
        tree is a macOS unit test. The status chip read "Provisioning failed —
        Retry" while no Retry item existed in the menu to click.

        Both halves of the operator's report were true, for two different
        reasons: no control was rendered, AND the chip cannot distinguish "still
        trying" from "gave up".

        FIX: MenuState gains `provisioning_failure: Option<String>`, set on
        terminal failure and cleared whenever an attempt starts (a stale marker
        would show Retry while provisioning runs — the same state-vs-display lie
        in the opposite direction). menu_state::build gains an early-return
        failure branch emitting Retry + Open log + Quit. The early return is
        deliberate: with no VM, every item below is inert or misleading, and
        offering "Attach Here" against a VM that does not exist is the same class
        of lie as the chip that named a Retry with no control behind it. Chip
        text now names the gesture ("right-click > Retry").

        ADDITIVE BY CONSTRUCTION: the new field is None on every existing
        constructor, so the Linux and macOS trays render byte-identically until
        they set it — this makes the capability available to all three rather
        than forking Windows behaviour, which the 1:1 tray-parity mandate
        requires.

        VERIFIED: cargo test -p tillandsias-host-shell 66/66 including the new
        two-sided test — the retry leaf must be present AND enabled when failed,
        and ABSENT on a healthy tray, so the fix cannot become a permanent Retry
        item on a working menu. cargo build -p tillandsias-windows-tray clean.

        NOT VERIFIED, stated plainly: that the leaf appears and is clickable in
        the real tray menu. That is a GUI observation this lane cannot make and
        belongs with 646-qde5. The model-level assertion is real; the pixel-level
        one is not done.
