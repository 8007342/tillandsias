packets:
- packet_id: forge-launches-may-not-carry-sys-admin-or-a-vsock-device-so-a-forge-cannot-reach-host-vsock
  order: 2095-gq43
  status: ready
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: any
