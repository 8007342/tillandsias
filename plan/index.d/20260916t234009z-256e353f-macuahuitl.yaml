        AND THE RUN FOUND A DIFFERENT, REAL RELEASE BLOCKER instead of the claimed one.
        The ERROR was a VERSION mismatch: the staged binary reported
        Tillandsias v56.9.16.1 against a VERSION file of 56.9.13.1. That reds
        litmus:guest-binary-embed-integrity, whose STEP 1/2 runs exactly this command,
        phase pre-build, spec ci-release. It would have been a FOURTH pre-build litmus
        red, appearing only once the three we spent the night on were cleared.

        THE MECHANISM IS A TRAP ANY HOST CAN FALL INTO AND IT IS NOT A CODE DEFECT.
        The same step passed [OK] in the 10:20Z ci-full on this host and failed at
        23:39Z on a tree whose code did not change: ./build.sh --ci-full --install
        bumped VERSION to 56.9.16.1 and staged guest binaries under it, then the gate
        failed before install; later rebases onto origin restored VERSION to 56.9.13.1
        from the remote, while target-guest/ is gitignored and kept the bumped binaries.
        So a FAILED release-gate run leaves the host in a state where the NEXT gate reds
        for a reason unrelated to the code, and the failure surfaces at the worst moment.
        The merge-to-main-and-release runbook already warns to clear target-guest/ when
        it was staged under a bumped VERSION; what it does not say is that an
        interrupted ci-full plus an ordinary rebase produces that state by itself.

        REMEDY APPLIED HERE: moved target-guest/ aside rather than deleting it
        (preserved at $HOME/target-guest.bumped-56.9.16.1.20260916T233950Z). Re-ran the
        verifier: rc=0, verify:skip-stale-staging, which is order 447's documented
        absent-staging skip. The asymmetry is worth noting for whoever takes this row:
        staging BEHIND VERSION skips cleanly and exits 0, staging AHEAD of VERSION is a
        hard error and exits 1, and both are host staging state rather than a code
        regression.
