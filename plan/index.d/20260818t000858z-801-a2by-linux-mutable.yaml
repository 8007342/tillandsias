        {path, line_start, line_end} and one top-level freshness, so an agent
        handed openspec/specs/forge-offline/spec.md:45-49 still opens line 45 in
        its own tree and reads whatever is there. The packets were supposed to
        land in this order or together; they did not, and the gap is stated in
        the litmus header, in the ensure script's header and here so that nobody
        concludes from a green ephemerality litmus that shared answers are
        caller-safe. The suggested first rung (per-citation commit +
        caller_relation) is unchanged and is now the highest-value thing in this
        milestone.
