  - packet_id: expert-index-lifecycle-belongs-to-the-mirror-not-the-forge
    event:
      type: note
      ts: "2026-08-18T00:08:59Z"
      agent_id: fork-801a2by-20260818T0008Z
      host: linux_mutable
      summary: |
        CONCURRENCY DISCIPLINE, MUTATION CONTROLS, AND THE HOLD REASON.

        DISCIPLINE CHOSEN, and why each half is what it is.
          * READERS TAKE NO LOCK. Published entries are content-addressed and
            immutable, assembled in a staging dir and RENAMED into their
            fingerprint name, so a reader resolves a directory that is either
            wholly absent or wholly complete. There is nothing to lock against
            because nothing is ever rewritten in place. This is the property
            that makes N concurrent forges plus bare-metal harnesses free.
          * WRITERS ARE SERIALISED BY ONE GLOBAL LOCK, deliberately not one lock
            per fingerprint. Two builders on different corpora are still two
            builders hammering one single-threaded embedding endpoint, which is
            the measured reason the lock exists. Per-fingerprint locking would
            have looked more parallel and been slower.
          * THE HIT IS CHECKED BEFORE THE LOCK, so serialising writers never
            starves a reader. That reordering is the whole packet.
          * THE FORGE MOUNT IS READ-ONLY, so the ephemeral tier physically
            cannot corrupt the durable tier. That is a mount mode, not a
            convention — verified from inside a real forge container, where a
            touch fails with "Read-only file system".

        MUTATION CONTROLS — each one broke it, showed red, restored, showed green,
        and the restored file was cmp'd byte-identical to its backup.
          1. Resolution-agreement guard, two directions. (a) Drifted ONE
             carrier's XDG fallback by six characters -> violation:...:block-drift
             naming the file with a diff, rc=1. (b) Deleted the block from one
             carrier entirely -> violation:...:no-resolution-block, rc=1. (b) is
             the one that matters: an extractor that silently matched nothing
             would make all three carriers "agree" vacuously forever.
          2. Litmus carve-out pins, three targeted mutations. Flipping the mount
             to MountMode::ReadWrite reddened step 10; drifting the injected env
             off FORGE_SPEC_INDEX_MOUNT reddened step 12; moving the liveness
             state dir out of tmpfs reddened step 1.
          3. Step 13's DISTINCTIVE arm, proven separately because mutation 2c was
             caught by the PRE-EXISTING step 1 and therefore proved nothing about
             the new step. Pointing FORGE_SPEC_INDEX_MOUNT at
             /dev/shm/tillandsias-experts leaves step 1 satisfied (the state dir
             is still a /dev/shm path) and only step 13 can see it: it reported
             "liveness state ... is under the durable index mount". Without this
             the arm would have been an unproven no-op.
          4. Rust unit test. MountMode::ReadWrite -> the rendered-argv assertion
             FAILED, 1 passed 1 failed. This is the net the structural litmus
             cannot provide, because the litmus reads source text and the test
             reads the argv podman would actually receive.
          5. Retention ceiling. Seeded four synthetic stale entries; a build
             pruned 6 -> 3 keeping `current`. Then seeded four more and ran with
             TILLANDSIAS_SPEC_INDEX_KEEP=1 -> exactly 1 entry left, which proves
             the prune really deletes rather than being a no-op that happened to
             match a small store.
          6. Handoff proof negative arm. The same container without the volume
             reads absent and the same retrieve fails, so "present" is caused by
             the mount.
          7. Lock liveness. The warm-caller-served-under-lock result would be
             meaningless if the lock were dead, so the same held lock was hit
             with an UNPUBLISHED corpus: skip:spec-index:already-building. The
             lock still dedups real builders.

        A DEFECT I INTRODUCED AND THEN CLOSED, recorded because shipping it would
        have been worse than not doing the packet. Content-addressing removed the
        old layout's in-place overwrite, so the store grew by 96 MiB every time
        the corpus moved — and the post-commit hook publishes on every
        corpus-touching commit. A week of spec work would have filled the volume
        and the failure would have landed on whoever built next. There is now a
        retention ceiling (keep `current` plus the newest two,
        TILLANDSIAS_SPEC_INDEX_KEEP), pruning only after a successful publish so
        a failed build can never take the working index down with it.

        HOLD REASON — why implemented and not completed. The two in-forge readers
        are IMAGE content (images/default/), and I did not bake a forge image:
        the operator's constraint was explicit that other work depends on this
        host's podman, and the destructive e2e is blocked on 809-w2xy anyway.
        The handoff proof therefore ran the CURRENT image with the two scripts
        bind-mounted in, which proves the scripts work in the real image
        environment but not that the shipped image carries them. A live forge
        lands warm only after the next forge-image bake plus a tray rebuild and
        install. This is the 743-y5wh bake-timing class, the same hold 767-es4w
        took.

        BOTH VERSION SKEWS WERE MEASURED RATHER THAN ASSUMED, because both halves
        will exist in the fleet during the roll-out and neither may answer
        WRONGLY:
          new readers + old tray (no volume, no root) -> state=absent, rc=0,
            resolved to /home/forge/.cache/tillandsias/spec-index
          old readers + new tray (volume mounted, readers ignore it) ->
            state=absent, rc=0, resolved to /dev/shm/tillandsias-experts/spec-index
          new + new -> state=present resolving into the mounted fingerprint dir
        Every skew degrades to the typed `absent` the system already handles.
        None errors and none claims a present index it cannot read.

        WHAT I DELIBERATELY LEFT.
          * No in-forge BUILDER. The forge reads; it never writes. Adding a
            builder would put the expensive path back in the ephemeral tier,
            which is the thing this packet exists to stop.
          * No fallback to the legacy /dev/shm index. A host with a warm tmpfs
            index pays one rebuild. A fallback would have been a second serving
            surface and a second staleness story for a one-time cost.
          * lib-common.sh UNTOUCHED. The expert liveness surfaces (state,
            started_at, plan-source-hash, project-index) stay in tmpfs. Only the
            index moved, and litmus step 13 now refuses to let the rest follow.
          * No cross-project sharing. The volume is per-project, matching
            tillandsias-mirror-* and tillandsias-forge-cache-*.
          * The forge image is not rebuilt (see the hold reason).
