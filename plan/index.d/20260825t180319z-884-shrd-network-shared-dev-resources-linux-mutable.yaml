    estimated_hours: 40
    title: >
      The always-on fat hosts serve shared DEVELOPMENT RESOURCES over the
      local network / private VPN — one nix builder, one pooled inference
      tier — so low-end hosts consume instead of re-paying.
    context: |
      OPERATOR DIRECTION, 2026-08-25, intent close to verbatim: "let's see
      how difficult it would be for the LOCAL NETWORK to host shared
      DEVELOPMENT RESOURCES — a single nix-builder in MACUAHUITL would
      benefit the whole fleet; same thing an inference box in MACUAHUITL
      with some smaller models in LENOVINHA would combined provide a larger
      set of live models at any given time for the whole fleet; then the low
      end devices like Pirria and Esmeraldinha could have access to
      nix-builders and powerful inference for shared resources in-network.
      Definitely not for v0.5 — more like v0.7 or v0.8 — but keep that long
      horizon in mind as we add hosts and naturally-shared resources, so
      that by v0.8 distributed shared resources through our private VPN
      converge easily and organically. This is why we like CRDT and
      mathematical convergence: with the right expectations and scope it's
      all a matter of throwing work effort into reducing the spec into an
      implementation through monotonic reduction of uncertainty through
      verifiable constraints."

      WHAT ALREADY POINTS HERE, so the intermediate releases build toward it
      instead of away from it:
        * the enclave nix cache (801-kqme/801-vm4p) and the 873-b1nx build
          lane are slice one — a warm cache measured at 99.8% closure
          coverage and a 96s cache-only build; the natural v0.8 extension is
          `nix build --store ssh-ng://` / remote-builder entries pointing at
          the fat host, which nothing in the current design precludes (the
          873-b1nx design note says so explicitly);
        * the per-host capability rows (accel_probe) already publish what
          each host can serve — the resource-advertisement half of a shared
          pool is a fold over rows the fleet already writes;
        * the dev-inference endpoint contract rows (718-rtnh/718-ja7g) are
          the seam where "local ollama" becomes "nearest pool member";
        * the 8GB floor host (873-b1nx unknown #3) is the DEMAND-side proof:
          if the floor cannot link the workspace locally, remote builders
          are not an optimisation but the requirement.

      TIER POLICY THAT RIDES THIS DIRECTION (operator, same message): the
      low-end hosts are THE OPTIMIZATION TARGET, not cheap labour. Work
      routed to them should be relevant to their hardware tier — floor
      benchmarks, low-end validation, capability rows, inference-floor
      measurements — because they are the bottleneck the product optimises
      for. Compaction-sized chores there are fine but are not the point;
      heavy builds there are never faster than the fat hosts doing it
      themselves.
    exit_criteria: |
      Deliberately COARSE until v0.7 scoping — this row exists so
      intermediate work converges toward it: (1) v0.6-v0.7 packets that
      touch build, cache, or inference plumbing record how they compose with
      network-shared serving (a sentence in their design, not an
      implementation). (2) By v0.7 close, a scoping slice measures one
      remote-build and one remote-inference round-trip fat-host->low-end
      over the private network, with wall-clock and the trust/authz story
      named. (3) The v0.8 implementation converges from those constraints
      rather than a fresh design.

