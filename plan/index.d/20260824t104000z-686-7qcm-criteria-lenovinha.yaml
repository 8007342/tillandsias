    event:
      type: progress
      ts: "2026-08-24T10:40:00Z"
      agent_id: linux-lenovinha-fable5-20260824T095314Z
      host: linux_immutable
      summary: |
        CRITERIA 2, 3 AND 4 EXERCISED — not read. Criterion 1 landed last cycle.
        2 and 3 are MET, 4 is DECLINED with a reason that is a measurement
        rather than an opinion.

        CRITERION 2 (invisible-block report): MET, both halves. `check` emits 8
        `parked-block:` lines naming the dependent, the blocker, the parked
        status, and the outstanding action where one exists — e.g.
        "authenticated-forge-write-transport-impl waits on
        git-mirror-cross-project-service-identity [blocked] — Amend the unsigned
        SSH-CA design ...". Where the blocker is `implemented` with no
        next_action there is nothing to name, and the line correctly stops at
        the status. The single-packet half works too: `status
        mirror-identity-negative-matrix-litmus` prints three
        `blocked-on-parked:` rows with their statuses.

        CRITERION 3 (evidence gate on new closures): MET — and NOT by the
        mechanism the criterion's wording names, which is worth recording
        because I nearly filed it as a gap. The criterion says "check
        hard-fails". `check` does NOT: I built a synthetic ledger with a
        post-2026-08-12 fragment writing `status: completed` and no
        evidence-bearing event, and `check` answered `ok: 1 packets` at exit 0.
        The enforcement is instead diff-scoped and author-side —
        `scripts/check-fragment-closure-evidence-added.sh`, wired into
        `build.sh:1896` and pinned by
        litmus:fragment-closure-evidence-gate-shape. Exercised it on a real
        staged fragment: `violation:closure-without-evidence` naming the packet
        and the rung, exit 1; negative control on a clean tree,
        `ok:closure-evidence:0 checked`, exit 0.

        THAT DESIGN IS BETTER THAN THE CRITERION AS WRITTEN, for the reason
        699-dycj already established: `build.sh` runs `check` on every host, so
        a fleet-wide hard failure turns one host's hand-authored fragment into
        every other host's red build, on a file they did not write and may not
        be able to fix. The diff-scoped gate stops the fragment at whoever
        wrote it. The criterion's INTENT — a closure with no trace of what
        justified it must not reach the ledger — is satisfied; only its named
        mechanism differs, and deliberately.

        CRITERION 4 (plan_next surfaces verification pickups): DECLINED, and the
        criterion explicitly permits a reasoned decline. THE JOIN KEY THE
        FEATURE NEEDS DOES NOT EXIST.

        Measured: 50 packets sit at `implemented`; 21 carry
        `verification_required`. The `agents[].id` values in those 21 are:

          antigravity-gemini          claude-opus-highthink
          codex-gpt55-highthink       opencode-bigpickle
          host-kind-linux-mutable     host-kind-windows
          host-windows-esmeraldinha   host-windows-yolanda

        That field carries TWO DIFFERENT KINDS OF IDENTITY with nothing
        structural to tell them apart. Four are MODEL/AGENT identities. Four are
        HOST affinities — and even those speak two dialects, a host KIND
        (`host-kind-linux-mutable`) and a specific MACHINE
        (`host-windows-yolanda`). `plan_next` is called with a pickup_role
        (`linux`/`macos`/`windows`/`any`), which is a third vocabulary again.
        Matching "the caller's role" against that field would mean
        pattern-matching a `host-` prefix and then guessing whether the
        remainder is a kind or a hostname — a naming convention doing a schema's
        job, and it would silently miss every packet verified by a model rather
        than a machine.

        WHAT WOULD MAKE IT BUILDABLE, so this is a shaped decision and not a
        dead end: give the verification hand-off an explicit role/kind field
        distinct from the agent identity, or publish an agent -> role map the
        query can join through. Either is a small schema change; neither should
        be inferred from a prefix. Until one exists, a `verification pickup` row
        would be a confident answer computed from a guess, which is the failure
        mode this ledger keeps recording.

        A SECOND OBSERVATION I AM NOT ACTING ON, because it is a different
        packet's shape: 29 of the 50 `implemented` packets carry NO
        `verification_required` at all. For those there is no hand-off to
        surface and no named verifier — they are simply parked one rung below
        `completed` with nobody assigned. If anything deserves a `plan_next`
        surface it is probably that population, not the 21, and it needs no new
        schema to find. Noting it rather than promoting it, per the
        Tlatoani-gated promotion rule.

        WITH 1-3 MET AND 4 DECLINED ON THE CRITERION'S OWN TERMS, this packet's
        exit criteria are satisfied.
packets:
  - packet_id: enclave-service-health-fixture-failed-once-and-i-destroyed-the-evidence
    order: 869-cvdc
    status: ready
    desired_release: v0.5
    priority: p3
    kind: bug
    title: scripts/test-enclave-service-health.sh reported 11 passed 1 failed once, then 12/0 and 6/6 — the failing scenario is unknown because the fixture only names passes
    deliverable: the fixture names the scenario it FAILED, not only the ones it passed, so a single intermittent failure is attributable without a reproduction; then the intermittent itself is diagnosed or shown to be a fixture artifact
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - fixtures
      - flaky
      - fail-loud
      - enclave
    estimated_hours: 2
    context: |
      OBSERVED (lenovinha, 2026-08-24T10:2xZ). Running
      scripts/test-enclave-service-health.sh while investigating an unrelated
      litmus, the last line read:

        enclave-service-health: 11 passed, 1 failed

      The very next invocation, same tree, same host, seconds later:

        enclave-service-health: 12 passed, 0 failed

      and six consecutive runs afterwards were all clean. The fixture exits 0 in
      both cases, which is a second small defect: a run with a failure should
      not report success to its caller.

      I CANNOT SAY WHICH SCENARIO FAILED, AND THAT IS THE ACTIONABLE PART. The
      fixture prints one `ok: <scenario>` line per PASS and prints nothing
      identifying a failure — only the trailing count changes. So a failing run
      is indistinguishable from a passing one except by arithmetic, and the
      moment I re-ran to look closer, the evidence was gone.

      That is precisely the trap the meta-orchestration skill warns about under
      "When the Gate Fails, Read check-logs.jsonl FIRST": re-running to get a
      better look is what destroys the evidence. I walked into it. There was no
      check-logs.jsonl to fall back on either — that file is written by
      scripts/local-ci.sh runs, not by a direct fixture invocation — and
      /tmp/tillandsias-timing.jsonl records only step duration and exit code,
      not scenario outcomes.

      SO THE FIRST FIX IS OBSERVABILITY, NOT THE RACE: make the fixture name the
      failing scenario on stderr and exit non-zero. Until it does, the next
      person to see 11/1 will be exactly where I am — knowing something is
      intermittent and having no way to say what.

      A PLAUSIBLE CULPRIT, offered as a lead and NOT as a diagnosis (I did not
      confirm it and it should not be treated as confirmed): several scenarios
      shell out to `podman ps` against the live host, and this host's enclave
      set genuinely changes underfoot — the proxy is down and has been
      restarted by cycles during this session. A fixture that reads live podman
      state is not hermetic, and its result can depend on what the host is doing
      at that second. Whoever takes this should check whether the scenarios are
      isolated from live state before hunting a race inside the script.
