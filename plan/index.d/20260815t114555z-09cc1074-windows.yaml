        CRITERION 2 MET. exec-bits 16.3s -> 1.3s, and the gate is 127-131s -> 99-103s steady state.    scripts/check-script-exec-bits.sh   16,267ms -> 1,305ms   (12.5x)   ./build.sh --check total            127/131s -> 99/103s   the exec-bits phase now falls below the 5s reporting threshold entirely  At three or four gate runs per cycle that is roughly 90-110 seconds of fixed cost removed per cycle, on top of trace-coverage last cycle.  WHAT CHANGED. One sweep over the 612 caller files instead of one per candidate (~16,000 file-greps), and one awk pass instead of a four-process filter chain per candidate. The shebang test also stopped spawning `head | grep` for each of 260 tracked files.  THE FILTER IS ITS OWN FILE, scripts/lib/exec-bits-filter.awk, and that is a deliberate reversal. I wrote it inline twice in the previous cycle and broke it twice — both times by SHELL QUOTING rather than by logic, once because an apostrophe inside an awk comment closed the single-quoted program. In a file the shell never sees the regexes at all. The inline attempts also cost more time than the optimisation saves; putting it in a file was the cheaper engineering decision as well as the safer one.  I ALSO WROTE, AND THEN DELETED, A DEAD `_unused_legacy_loop()` wrapper around the old code "so the original stays readable". That is decoration, and this project has already made me delete one such helper. The git history is where the old version lives.  THE FIXTURE CAUGHT THE REGRESSION I WOULD HAVE SHIPPED, and it is the same shape as 752-8hqx. Splitting the filter into a second file gave this checker a DEPENDENCY it did not have before. The fixture copies the checker into a throwaway repo but did not copy the new helper, so awk found nothing, the checker reported `ok:script-exec-bits:3 checked`, and all three positive scenarios silently failed. A missing dependency that yields "no violations" is indistinguishable from a clean tree.  Fixed in BOTH directions rather than just the fixture:   * the fixture copies scripts/lib/ too   * the CHECKER now refuses outright when the helper is absent — exit 2 with     `violation:script-not-executable:0` and a message saying it will not report     a clean tree it never examined   * a seventh scenario, missing-helper-refuses, pins that refusal, so the perf     split cannot regress into a checker that always passes  Fixture 7/7. Real tree `ok:script-exec-bits:26 checked`, unchanged from before the rewrite, and the command-substitution correctness fix from earlier this cycle is still green in it.  REMAINING, and now the whole of what is left in this packet: the two top phases are `Ratcheting ghost traces` at 40.9s and `Writing the gate stamp` at 25.8s, both stable across five runs. Both are roughly double their standalone cost (trace-coverage 20s, gate-stamp write 4.5s), which is a cache-state effect under the gate that nobody has characterised. That is a measurement question before it is an optimisation question, and this packet's first criterion applies to it exactly as it applied to the 40s I mis-attributed two cycles ago.
