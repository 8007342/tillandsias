    capability_tags: [plan, claims, multi-host, fail-loud]
    estimated_hours: 2
    owned_files:
      - crates/tillandsias-plan/src/main.rs
    title: |
      A set-field claim whose --reason does not carry the "claimed for cycle <ts> by <agent>" shape is listed by expire-claims as unclaimed-in-progress with dashes, so a claimant the fragment names in its host field reads as nobody to the overlap check
    context: |
      MEASURED by the coordinator 2026-09-04T14:05Z. lenovinha claimed
      917-6iwv at 13:49:18Z with `set-field ... status in_progress --host
      lenovinha --reason "claimed 2026-09-04T13:49:18Z: release blocker, two
      groundtruth misses (cause 4 on 1022-y7kc)"`; the fragment
      (20260904t134919z-0fc59cf5-lenovinha.yaml) carries host: lenovinha on
      both the status record and the note event. `expire-claims --list-live`
      prints `unclaimed-in-progress 917-6iwv ... - - 2026-09-04T13:49:19Z`:
      the host field is there and the row says nobody. Its earlier claims with
      the reason "claimed for cycle <ts> by <agent_id>" printed as live-claim
      rows. So recognition keys on the free-text reason's shape rather than on
      the record's own host field, and the skill's guidance for the dashed row
      ("nobody to send a heads-up to; inspect the diff yourself") is wrong in
      exactly the case where the heads-up has an obvious addressee. The
      failure direction is the expensive one (905-wjfj): an overlap check that
      reads a held packet as unclaimed invites a second host onto it.
      Provenance: coordinator measured and files.
    exit_criteria:
      - "expire-claims --list-live derives the claimant from the status record's host (and agent_id when present) and lists a live-claim row for any in_progress packet whose newest status transition names a host, whatever the reason text; pre-fix result: FAILS (917-6iwv reads unclaimed with host: lenovinha in the fragment)"
      - "a fixture claims with a reason of arbitrary text and asserts a live-claim row; with NO host on the record it asserts the unclaimed row; pre-fix result: FAILS"
      - "the skill text for the dashed row says it means no host on the record, not no claimant; pre-fix result: FAILS"
    unscoreable: |
