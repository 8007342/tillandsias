packets:
  - packet_id: sidecar-staging-never-reached-nix
    order: 736-mcy3
    release_target: stable-milestone-v1
    status: ready
    desired_release: v0.5
    priority: p0
    kind: fix
    title: 'RELEASE BLOCKER: the sidecar staging fix cannot work for nix builds — .gitignore excludes it from craneSrc'
    pickup_role: linux
    depends_on: []
    blocks:
      - v04-release-promotion-linux-owned
    capability_tags:
      - release
      - nix
      - build
    context: |
      Raised by the WINDOWS host as inference while running its release lane,
      with the mechanism named precisely and the caveat stated: no nix on any
      WSL distro there, so it could not be measured. Confirmed here by reading
      all four links; the one link still unmeasured is named below.

      1. crates/tillandsias-headless/build.rs:93 lists
         images/router/tillandsias-router-sidecar among REQUIRED runtime assets
         and panics at :116 without it.
      2. .gitignore:79 ignores that path (correct — order 710-w9kc un-committed
         the blob because it is a build artifact).
      3. flake.nix craneSrc = cleanSourceWith { src = cleanSource ./.; }, and
         `nix build .#…` resolves the flake against the GIT TREE, so an ignored
         untracked file is not copied into the store source.
      4. .github/workflows/release.yml:120-126 builds the sidecar, `install`s it
         into the WORKING TREE, then runs three flake builds — which read the
         git tree, not the working tree.

      So the staging step fixed the working-tree lanes (./build.sh,
      build-image.sh) and could never have fixed the nix lane. The release has
      not exercised it since: the last published release predates the blob's
      removal.

      The failure mode is loud, not silent — the release workflow would panic at
      build.rs rather than ship a broken binary — but it fails the release.
    exit_criteria:
      - the sidecar is a build-graph INPUT of every derivation whose build.rs requires it, not a file a caller remembered to stage
      - a check that runs on a host with NO nix pins the invariant, since the hosts that found this have no nix
      - a real `nix build .#tillandsias-headless-x86_64-musl` from a PRISTINE clone succeeds
    verifiable_closure: |
      From a pristine clone (no stale staged sidecar in the worktree):
      `nix build -L .#tillandsias-headless-x86_64-musl` succeeds.
    notes: |
      FIX LANDED, VERIFICATION INCOMPLETE — stated plainly rather than implied.
      flake.nix now defines stageRouterSidecar and applies it as `preBuild` to
      all three derivations that pass `--bin tillandsias`, so the sidecar
      derivation becomes a dependency edge and the build cannot start without
      it. litmus:sidecar-is-a-build-graph-input (5/5) pins the invariant
      statically and needs no nix.
      The third exit criterion is NOT met on this host: nix 2.34.8 is installed
      but nix-daemon is inactive and `systemctl start nix-daemon` needs
      privileges this session does not have. `nix-instantiate --parse` succeeds
      (syntax only). Until someone runs the pristine-clone build, the fix is
      code-verified and evaluation-unverified.

events:
  - packet_id: sidecar-staging-never-reached-nix
    event:
      type: filed
      ts: "2026-08-14T13:30:00Z"
