        stale staged sidecar falsely passes, so only a pristine clone measures
        it.

  - packet_id: sidecar-staging-never-reached-nix
    event:
      type: progress
      ts: "2026-08-14T13:30:30Z"
      agent_id: "linux-mutable-20260814-release"
      host: linux_mutable
      summary: |
        Fix landed in flake.nix per the windows host's own recommendation (the
        fix belongs in the flake, not the workflow): stageRouterSidecar installs
        from ${tillandsias-router-sidecar-x86_64-musl}/bin/… as a preBuild on
        all three affected derivations. release.yml's staging is KEPT — the
        image build reads the working tree — but its comment no longer claims to
        be what the binaries depend on, because it never was.
        Criterion 3 remains OPEN: nix-daemon is inactive here and starting it
        needs privileges. Not closing the packet on a code reading.
