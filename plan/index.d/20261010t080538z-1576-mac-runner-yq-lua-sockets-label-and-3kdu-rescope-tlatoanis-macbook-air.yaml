  - packet_id: the-lua-runtime-has-no-af-unix-socket-api-so-no-fixture-that-needs-a-real-listening-socket-can-be-ported-to-lua
    order: 1576-luas
    status: ready
    kind: feature
    priority: p3
    desired_release: v0.5
    pickup_role: any
    capability_tags: [lua-runtime, capability-gap, fixtures, tillandsias-plan]
    estimated_hours: 4
    title: |
      The tillandsias-plan Lua runtime has no AF_UNIX socket API, which blocks porting any fixture that needs a real listening unix socket (e.g. test-gate-podman-mode-configuration.sh) to Lua
    context: |
      Found 2026-10-10 by tlatoanis-macbook-air while re-measuring 1428-3kdu. The fixture's whole discrimination is a GENUINE listening socket at $XDG_RUNTIME_DIR/podman/podman.sock (it refuses a non-socket as vacuous). Today it builds that socket with python3, the one grandfathered interpreter call. crates/tillandsias-plan/src/lua_{runtime,std,process,predicate}.rs expose no socket primitive. Under the operator's rule that new gate fixtures are Lua, this class cannot comply.
    exit_criteria:
      - 'a Lua script under `tillandsias-plan script run` can create, bind and listen on an AF_UNIX stream socket at a given path, and remove it on exit; a fixture asserts `test -S` on it on Linux and macOS (pre-fix: no such API)'
    unscoreable: "unpinnable-until-the-guard-exists: the API and its fixture are written together (pre-fix result: no socket primitive in the Lua std)"
    depends_on: []
    next_action: >
      Add a minimal unix-socket listener primitive (bind and listen only, closed on drop) to the Lua std, with the sun_path length limit surfaced as a named error.
    provenance: |
      Filed by tlatoanis-macbook-air on macuahuitl's ruling, 2026-10-10.
    events:
      - type: filed
        ts: "2026-10-10T08:05:38Z"
        host: tlatoanis-macbook-air
        summary: |-
          Lua runtime capability gap: no AF_UNIX socket API.

  - packet_id: after-a-successful-forge-launch-the-tray-label-sticks-on-the-last-build-status-because-the-guest-cannot-see-the-clis-rootless-containers
    order: 1576-lbst
    status: ready
    kind: defect
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [tray, status, podman-events, rootless, macos, ux]
    estimated_hours: 3
    title: |
      After a successful forge launch the tray's status label can stick on the last build status (e.g. "Building Forge"), because the guest daemon's podman events stream cannot see the CLI's rootless login/forge containers
    context: |
      Found 2026-10-10 while fixing 1571-lgex (#283). The tray's label comes only from the CLI's own status pushes. The guest daemon watches `podman events`, but the CLI's login and forge containers are rootless, so the daemon never sees them start or stop. On 2026-10-09 this left "Building Forge" up for 170 s after the login container died. #283 fixes the FAILED-sign-in path by pushing "Sign-in did not finish". The SUCCESS path still has no push that moves the label off the last build status.
    exit_criteria:
      - 'after a successful attach, the tray label moves off the last build status within 10 s of the forge session starting (pre-fix: it can stay on the last build label for the session)'
    unscoreable: "unpinnable-until-the-guard-exists: written with the fix (pre-fix result: label stays on the last build status)"
    depends_on: []
    next_action: >
      Push a status event from the CLI when the forge session is attached (mirroring #283's failure push), or give the daemon visibility of the rootless containers' events.
    provenance: |
      Filed by tlatoanis-macbook-air on macuahuitl's ruling, 2026-10-10.
    events:
      - type: filed
        ts: "2026-10-10T08:05:38Z"
        host: tlatoanis-macbook-air
        summary: |-
          The tray label sticks after a successful launch: rootless containers are invisible to the guest's podman events.
