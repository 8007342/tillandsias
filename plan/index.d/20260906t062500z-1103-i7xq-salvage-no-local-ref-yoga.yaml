      - "the pushed path is unchanged for hosts that can push, and still reports ok:salvaged:<ref>:<sha>; pre-fix result: passes and must keep passing"
      - "a fixture proves BOTH: a bare-origin repo salvages and pushes, and a repo whose origin is unreachable salvages locally and reports the push failure — the second arm is the packet"
      - "NEGATIVE CONTROL: the worktree is byte-identical after every arm, including the failing one. Verified pre-fix on yoga by checksumming every non-.git file before and after; a fix that reaches for the worktree to recover from a push failure would trade data loss for corruption"
