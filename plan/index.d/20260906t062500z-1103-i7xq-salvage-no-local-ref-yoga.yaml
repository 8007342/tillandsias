    title: |
      salvage-dirty-worktree.sh writes its salvage ref only to origin, so on a host that cannot push it fails with no local copy — the data-loss remedy is unavailable in exactly the situation where work is most likely to be stranded
    context: |
      FOUND on yoga 2026-09-06 while writing the worker-skill salvage section
      (1102-93ng), by exercising the script rather than describing it.

      MEASURED, scratch repo with a bare origin, one untracked file:

        ok:salvaged:refs/heads/salvage/yoga/20260906-probe-slug:388fc566...
        local refs:   refs/heads/master
                      refs/remotes/origin/salvage/yoga/20260906-probe-slug
        origin refs:  refs/heads/salvage/yoga/20260906-probe-slug
        salvaged tree contains precious.txt   (the untracked file: recoverable)

      The success path works and the untracked file really is preserved. But
      the only local ref is the REMOTE-TRACKING one. There is no
      `refs/heads/salvage/...` in the working repository.

      AND WITH NO REACHABLE ORIGIN:

        fail:salvage:push:fatal : 'origin' does not appear to be a git repository
        local refs:   refs/heads/master        <- nothing else

      So a failed push leaves NO COPY. The commit object may exist unreferenced
      and unreachable, which is not a record anyone can find.

      WHY THIS IS THE WRONG WAY ROUND. The salvage exists because refusing to
      touch dirt protects it from the agent and not from a fresh clone
      (872-c9nd: four hours of work, the untracked file's name in no commit on
      any branch). The hosts most likely to strand work are the ones having a
      bad time — credential-blocked, offline, mid-incident. macneo could not
      push for a full day on 2026-09-05 (1025-a896); esmeraldinha's token went
      401 mid-session. On any of those hosts this remedy produces nothing, and
      the verdict grammar means a host that does not read `fail:` carefully
      will believe it salvaged.

      THE FIX IS SMALL AND THE ORDERING IS THE WHOLE POINT: write the local
      ref FIRST, then push, then report. A local ref costs nothing, survives a
      dead credential, and turns "no copy" into "a copy that has not left the
      host yet" — which a later cycle, or an operator, can push. The verdict
      should distinguish the three states rather than two: salvaged-and-pushed,
      salvaged-locally-only (push failed), and not salvaged.
    exit_criteria:
