    estimated_hours: 6
    owned_files:
      - research/
      - scripts/lua/check-research-records.lua
      - scripts/lua/test-research-records.lua
      - openspec/litmus-tests/litmus-research-records-shape.yaml
      - openspec/specs/research-records/spec.md
