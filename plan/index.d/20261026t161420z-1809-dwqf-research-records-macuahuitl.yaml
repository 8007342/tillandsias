  - packet_id: research-source-fetcher-into-the-cache-layer-with-archive-request
    order: 1809-3kyb
    status: ready
    kind: feature
    priority: p3
    desired_release: v0.5
    pickup_role: any
    capability_tags: [lua, network, storage]
    estimated_hours: 4
    depends_on: [research-records-format-validator-and-seeded-shared-library]
    owned_files:
      - scripts/lua/research-fetch.lua
      - skills/find-research/SKILL.md
    title: |
      A research fetch command saves a source into the cache layer (XDG_CACHE_HOME/tillandsias/research/<sha>), checks free disk first, requests a Wayback snapshot and prints the archived URL for the record
    context: |
      Slice 5 (openspec/changes/research-records/tasks.md), the disk-aware part of the 2026-10-25 storage direction: fetched PDFs and page text must never land on the forge tmpfs or in the committed store. Today the find-research skill describes curl and the Wayback redirect in prose, and the Wayback availability API rate-limits (429 observed 2026-10-26) so the save flow needs backoff.
    exit_criteria:
      - 'tillandsias-plan script run scripts/lua/research-fetch.lua -- <url> writes under ${XDG_CACHE_HOME:-~/.cache}/tillandsias/research/ and prints archived:<wayback url> or archived:pending:<reason> (today the command does not exist)'
      - 'with the cache path on a filesystem below the free-space floor the command refuses with the remedy and writes nothing'
      - 'a 429 from archive.org is retried with backoff and reported as pending, never as an archived URL'
    verifiable_closure: |
      unscoreable: unpinnable-until-the-guard-exists — the deliverable is scripts/lua/test-research-fetch.lua (a local http server and a faked full disk through TILLANDSIAS_RESEARCH_FREE_MB), written in the same commit as research-fetch.lua and bound as a new step of openspec/litmus-tests/litmus-research-records-shape.yaml; the live Wayback path stays unscoreable in CI.
    provenance: |
      Filed by macuahuitl at the operator's direction, 2026-10-26.
    events:
      - type: filed
        ts: "2026-10-26T16:14:24Z"
        host: macuahuitl
        summary: |-
          p3: research fetch into the cache layer with archive request (slice 5 of the research system).
