    title: |
      Research records: a provenance-backed record format with a Lua validator that refuses a record without sources, a seeded shared library shipped in the image beside the cheatsheets, the find-research and cite-research forge skills, and a research pass at the start of a new project
    context: |
      Operator direction 2026-10-26: forge projects (ranitas, arabiya, cannonball, demon_attack) found good research (GameFlow, flow, attention, animation, response time) and had nowhere durable to keep it; the ranitas field report lost half its cited URLs within days. Build a RESEARCH system analogous to cheatsheets, with provenance, for claims about people rather than tools. Agents cite research in what they build; after repeated fine-tuning of one feature the agent offers a research search; the skills are preloaded; a new project starts with a research pass. Design and prior art: openspec/changes/research-records/design.md.
    exit_criteria:
      - 'scripts/lua/check-research-records.lua exits 1 naming <path>:sources:missing-provenance for a record whose frontmatter has no sources list (today no script reads research records, so such a record is accepted by default)'
      - 'scripts/lua/test-research-records.lua runs the validator on constructed records and its arm 2 (no sources) and arm 3 (no archived link) pass only because the validator refuses them'
      - 'research/ holds at least six records whose sources each resolve (DOI through Crossref, a standards page, or a primary scan) and carry a Wayback archived URL; research/INDEX.md is generated by the validator'
      - 'images/default/Containerfile copies research/ to /opt/research and exports TILLANDSIAS_RESEARCH=/opt/research'
      - 'skills/find-research and skills/cite-research exist; skills/start-a-new-project does a research pass before scaffolding and scaffold.sh creates research/README.md'
    verifiable_closure: |
      litmus:research-records-shape (bound to spec:research-records) passes on the PR head.
    provenance: |
      Filed by macuahuitl (operator forge, session 01UJ1Eg8tWX6NV7g5GN5w1mx) at the operator's direction, 2026-10-26. Implemented in the same PR (work/1809-dwqf).
    events:
      - type: filed
        ts: "2026-10-26T16:14:20Z"
        host: macuahuitl
        summary: |-
          p2: research records format, validator, seeded library, skills and start-of-project hook (slice 1 of the research system).

