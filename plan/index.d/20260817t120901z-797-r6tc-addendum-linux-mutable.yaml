        ONE FAILURE ALONG THE WAY THAT WAS NEITHER A REGRESSION NOR MINE, filed
        as 800-ivkg below: litmus:forge-standard-gitconfig-path lost its 30s
        step budget in the same loaded window described above, and
        scripts/test-forge-standard-gitconfig-path.sh passes standalone in 20s
        on the same tree.

        AND ONE THAT WAS NEITHER, WORTH KNOWING FOR ANY FORK ON THIS BRANCH:
        litmus:litmus-expression-pinning-enforcement-shape went red on a step
        in litmus-proxy-container-shape.yaml I never touched. The enforcer is
        diff-scoped against origin/linux-next, and origin had just moved: order
        767-es4w rewrote that step, so MY tree's older copy of it read as
        "newly added" against the newer base. Merging origin/linux-next cleared
        it. Not a defect in the enforcer — a diff-scoped check is a function of
        two refs, and a stale local ref is one of them — but it does mean a
        long-running fork will see red steps it did not write, and the remedy
        is always "merge first, then read the refusal".
packets:
  - packet_id: forge-standard-gitconfig-path-step-budget-is-load-sensitive
    order: 800-ivkg
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "litmus:forge-standard-gitconfig-path fails a whole gate run on a 30s step budget that is really a container start under load — the same 30s class 793-a62g removed from the storage-backend choice"
    deliverable: "the step's verdict does not depend on how busy the host was: either the budget reflects a measured worst case with headroom, or the fixture reports its own timing so a slow pass is distinguishable from a real failure; a gate that goes red on load teaches readers to rerun rather than to read"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [litmus, fail-loud, git-mirror, timing]
    estimated_hours: 2
    context: |
      OBSERVED, macuahuitl 2026-08-17T11:5xZ, during the 797-r6tc verification.

        ./build.sh --ci-full ->
          [STEP 1/4] Git resolves the injected config from its standard global
          path (timeout: 30s)... [TIMEOUT]
          [FAIL] spec=git-mirror-service test=litmus:forge-standard-gitconfig-path

      Same tree, twenty minutes later, machine quiet:

        bash scripts/test-forge-standard-gitconfig-path.sh -> rc 0,
        "PASS: forge uses the standard read-only global gitconfig path"

      And the same spec was green in the two full gate runs immediately before,
      at the same commit content for that file.

      WHAT THE HOST WAS DOING, measured rather than assumed: an unrelated
      llama-server at ~350% CPU, load average 12.0 on 20 cores, and `podman
      info` answering in 53.1s at that moment against 0.074s once it cleared.
      The step starts a forge container, so it pays that cost directly.

      WHY IT IS WORTH A PACKET RATHER THAN A RERUN: this is the 793-a62g class
      exactly — a fixed second-count standing in for a fact about the host.
      There the cost was a silently wrong storage backend; here it is a red
      gate on a green tree, which is cheaper but trains the reader to rerun
      instead of to read, and this milestone is about not doing that.

      INFERRED, and the first thing to test: that the container start is where
      the 30s goes. It is the only step of the four with a container in it and
      the only one that timed out, but the fixture was not instrumented, so
      nobody has the actual split. Instrument before retuning the number —
      raising a budget you have not measured is how the number got here.

      NOT CLAIMED: that this host's llama-server is a normal condition. It is
      not, and a budget does not have to survive every hostile environment. It
      does have to say which one it failed in.
