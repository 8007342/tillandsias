events:
  - packet_id: env-fail-preflight-cannot-tell-a-timeout-from-a-failed-exec
    event:
      type: note
      ts: "2026-08-17T12:09:01Z"
      agent_id: linux-macuahuitl-opus5-1m-20260817
      host: linux_mutable
      summary: |
        MY OWN FIXTURE COMMITTED THE DEFECT IT WAS PINNING, and it is worth
        recording because the packet is about diagnosis quality.

        As first written, scripts/test-litmus-podman-preflight-diagnosis.sh
        asserted that fixture A's runner invocation returns in under five
        seconds, and called that "the probe failed fast". It is not the probe's
        duration. It is a child run-litmus-test.sh invocation that executes the
        spec's whole instant bucket — five tests — of which exactly one reaches
        the podman preflight.

        OBSERVED: it went red at 10s on a gate run whose host had picked up an
        unrelated llama-server at ~350% CPU and a load average of 12, while
        every wording assertion in the same run passed. Same reading, twenty
        minutes apart, on the same host: `podman info` 53.1s during that window,
        0.074s after it. So the assertion reported machine load wearing the name
        of a property — which is precisely what 793-a62g removed from the
        storage-backend choice and what the ENV-FAIL message this packet
        replaced was doing.

        FIX: the clock is gone. The property is the WORDING and it is fully
        falsifiable without one — an instant failure must not say ">5s", must
        not be classified as environmental, must report its observed status and
        podman's own stderr, and must not carry the timeout wording; the
        genuine stall must carry that wording and timeout(1)'s own 124. A probe
        that had waited out its deadline cannot satisfy both halves.

        MUTATION CONTROL re-run against the CORRECTED fixture, because the
        earlier control validated the earlier fixture: deleting the fix and
        restoring the original two-line preflight (`grep -c _preflight_rc` goes
        5 -> 0, the text is gone, not commented) turns 6 of 8 assertions red at
        rc 1; restoring the fix turns all 8 green at rc 0.
