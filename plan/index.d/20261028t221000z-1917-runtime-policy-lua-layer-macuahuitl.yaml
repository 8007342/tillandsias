  - grep -nE 'pids_limit\(|--pids-limit=' crates/ returns no literal numbers; each limit comes from the table.
  - tillandsias --policy-dump prints the effective table, including GIT_MIRROR_COLD_SEED_MAX_WAIT_SECS and the Vault-ready budget; today the flag does not exist.
  verifiable_closure: A headless test that loads the embedded table and asserts --policy-dump lists every key the code reads.
  unscoreable: 'unpinnable-until-the-guard-exists: the fixture or probe named in the exit criteria lands with the fix (1136-n8sh).'
  next_action: 'Nothing is built yet. Left: list the constants from report section 3 row 1, write the table and loader, replace the literals, add --policy-dump and its test. Credential, mount and cgroup-enforcement code stays in Rust.'
