  context: 'operator-approved 2026-10-28. Source: scratch/research/lua-runtime-layer.md sections 3 (row 1), 5 and 6.2. About 60 of 222 headless main.rs commits in 60 days (27 percent) changed a budget, constant, string, retry rule or sequence. This first step is data only and needs no Lua host: Rust reads the table. Speeds other work: those small fixes stop needing a headless rebuild.'
