      summary: |
        CLOSED. The fix landed from yoga at 5f67cdfea — the spawn carries `set -o
        pipefail` for steps whose verdict the exit status actually decides, a gate step
        at 415-1293-wka4.step, and scripts/test-litmus-step-pipefail.sh, which is 6/6
