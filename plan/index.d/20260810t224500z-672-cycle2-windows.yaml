    capability_tags: [windows, ci, gates, diagnosability]
    context: >
      Every Windows ./build.sh --check prints a non-blocking "Exec format
      error" because the check execs target/debug/tillandsias-policy from
      the in-tree target dir, which on Windows holds only stale Linux ELF
      artifacts (real builds use the WSL2 distro-native CARGO_TARGET_DIR,
      with-wsl2-builder.sh). The check gives zero coverage on Windows while
      printing an ERROR banner that trains agents to ignore red gate text.
      Analysis: plan/issues/cheatsheet-tiers-check-linux-binary-on-windows-2026-08-10.md
    exit_criteria:
      - >
        The check probes binary runnability before exec and emits exactly one
