  - packet_id: plan-expire-claims-subcommand
    order: 672-bz7u
    status: ready
    desired_release: v0.5
    priority: p2
    release_target: architecture-audit-epic
    title: "tillandsias-plan expire-claims — auto-return stranded in_progress claims to ready after a TTL, closing 641-e2qa criterion 2"
    kind: implementation
    deliverable: crates/tillandsias-plan
    depends_on: [stranded-in-progress-packets-are-invisible-both-ways]
    pickup_role: any
    capability_tags: [plan, ledger, coordination, rust]
    context: >
      641-e2qa criterion 2 requires that a claim which produces no event
      within one cycle returns the packet to ready automatically. This
      cannot live in bash: the claim timestamp is not exposed by
      `tillandsias-plan query --json` (probed 2026-08-10), and grepping the
      ledger for status timestamps is the brittle parsing 456 was built to
      eliminate. The mechanism belongs in the plan binary, which already
      folds fragments and knows each packet's status history.
    exit_criteria:
      - >
        `tillandsias-plan expire-claims --ttl-hours N [--dry-run]` lists
        every in_progress packet whose LAST status/progress activity is
        older than N hours; without --dry-run it WRITES a new fragment (never
        edits existing files) returning each to ready with a progress event
        naming the expiry, TTL, and last-activity timestamp.
      - >
        Packets with ANY progress event newer than the TTL are never touched;
        the default TTL is conservative (>= 24h) so a slow legitimate cycle
        cannot be preempted.
      - >
        check-stranded-in-progress.sh gains a line advertising the command
        when stranded > 0, and its threshold_events field reports what
        expire-claims would act on.
      - >
        A litmus or executable test seeds a synthetic stranded claim and
        proves expiry emits the fragment and a fresh claim does not.
    events:
      - ts: "2026-08-10T22:45:00Z"
        event: filed
        summary: >
          Shaped from 641-e2qa's open criterion 2 during the overnight
          drain; probing showed the claim age is mechanically unreachable
          from bash, so the reduction lands the mechanism in the binary.

