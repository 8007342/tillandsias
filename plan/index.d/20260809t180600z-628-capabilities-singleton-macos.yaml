    estimated_hours: 2
    outcome: |
      Found live during 598-kibt M3: every M3 byte-identity attempt died with
      `exec: vsock_exec: read len: early eof` ~4s in. Bisected on the VZ
      guest to the minimal reproducer
      `XDG_RUNTIME_DIR=/run/user/0 tillandsias-headless --capabilities`
      (--version safe; without XDG safe; detached/setsid still fatal;
      output-discarded still fatal). Root cause: order 480's --capabilities
      flag was parsed and dispatched but never added to is_cli_mode, so the
      one-shot acquired the "launcher" singleton, which SIGTERMs the running
      headless service — the vsock server the exec session rides. Guest
      journal: server 'Received shutdown signal' 4s after start, then full
      orderly VM shutdown. This is byte-for-byte the 2026-07-12
      --antigravity incident the is_cli_mode comment already documents; the
      cli_mode_counts_every_lane_flag pin test did not cover the flag. Only
      a macOS/Windows host can observe it (Linux hosts never run a headless
      CLI beside the in-VM server), which is why Linux CI stayed green.
      Likely also the killer of the 2026-08-03 order-76 in-guest image
      build (same M3 procedure, envelope capture step first).
      Fix: add `capabilities` to is_cli_mode + to the pin test's lane list.
      Open question for linux (NOT changed here): --diagnostics and
      --reset-guest are also absent from is_cli_mode — decide whether
      takeover is intended for them.
