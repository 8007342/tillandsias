    title: "--capabilities missing from is_cli_mode: an in-guest run singleton-killed the live vsock server and severed the exec wire"
    kind: fix
    deliverable: crates/tillandsias-headless/src/main.rs is_cli_mode + cli_mode_counts_every_lane_flag pin
    depends_on: []
