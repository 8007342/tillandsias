packets:
  - packet_id: headless-bin-suite-shares-process-global-state
    order: 1021-hf9e
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    title: "tillandsias-headless's bin suite gives a different failure set on every parallel run — the gate runs it serially to stay deterministic"
    status: ready
    kind: bug
    priority: p2
    deliverable: the headless bin suite passes under the default parallel test runner, so the gate's serial pin becomes a choice rather than a requirement
    depends_on: []
    pickup_role: linux
    capability_tags: [rust, testing, ci]
    estimated_hours: 4
    unscoreable: >
      pre-fix result: FAILS, and the pin already exists — litmus:build-ci-dispatch-shape's
      "the gate's test step runs serially and to completion" arm asserts
      `--test-threads=1` is present, which is precisely the workaround this
      packet removes. The closure is that arm INVERTING: the suite passes with
      the flag dropped. Naming a litmus as verifiable_closure would resolve
      against a test that today asserts the opposite of the fixed state, which
      would read as satisfied while nothing had been fixed. Stating it here
      instead so the next reader does not wire a closure to a pin that must
      change.
    outcome: >
      Found 2026-09-04 on yoga while widening ./build.sh --check to the
      workspace (1003-444f). MEASURED, clean tree, tillandsias-headless bin
      target, same commit each time:
        parallel run 1 -> 1 failure   (a stale count pin, fixed in 3330dbbdf)
        parallel run 2 -> 1 failure   (forge_credential_quarantine_mounts_present)
        parallel run 3 -> 2 failures  (count pin + forge_agent_run_args_export_debug_when_requested)
        --test-threads=1 -> 1 failure, the count pin, on every run
      Three runs, three different sets. Every test that appears and disappears
      passes in ISOLATION — forge_credential_quarantine_mounts_present was run
      alone and passed while failing in the same commit's full parallel run —
      so this is interference between tests, not a defect in any one of them.
      THE FAMILY IS KNOWN AND THE FIX SHAPE IS KNOWN. tillandsias-core had the
      identical problem in ca_path: three tests each set the process-global
      HOME under `unsafe set_var` and cargo ran them concurrently in one
      process, so an assertion read another test's value. macbookair fixed it
      by passing the base in explicitly rather than by serialising — removing
      the shared state instead of hiding it, which also dropped three unsafe
      blocks. The headless suite very likely has the same shape (env vars read
      by run-args builders), and the same remedy is preferred over #[serial].
      WHY IT MATTERS BEYOND TIDINESS: 1003-444f made ./build.sh --check run the
      whole workspace through the failure-set ratchet, and a ratchet fed a
      non-deterministic set reports new-red on a coin flip. A gate that fails
      at random is a gate that gets switched off, which would cost the fleet
      the coverage that order just bought. Serial execution is what makes the
      widening safe TODAY; it is a mitigation, not a cure, and the shared state
      is still there for anyone running the suite by hand or in an IDE.
      Serial cost nothing to adopt here (51.6s serial against 61s parallel on
      this host, because the contention costs more than the threads win), so
      there is no urgency argument — only a correctness one.
    exit_criteria:
      - "the headless bin suite produces the same failure set on 10 consecutive default (parallel) runs at one commit"
      - "the shared state is REMOVED rather than serialised — no new #[serial] and no per-test mutex standing in for a fix, following the ca_path precedent"
      - "with the suite fixed, dropping --test-threads=1 from the gate leaves ./build.sh --check green across 5 runs, and litmus:build-ci-dispatch-shape's serial arm is updated in the same commit rather than left asserting a workaround that is no longer needed"
    events:
      - type: progress
        ts: "2026-09-04T13:53:11Z"
        agent_id: "linux-yoga-claude-20260904t133011z"
        host: yoga
        summary: >
          Filed from the 1003-444f widening. The gate is serial today purely to
          keep the ratchet's failure set deterministic. Isolation runs pass, so
          the defect is interference, and the ca_path fix is the precedent for
          removing shared state rather than serialising around it.
