    title: "Scripts that match git's human output force LC_ALL=C on that git call, or read porcelain or an exit code instead"
    context: |
      Measured on calmecacpilli 2026-11-23 (LANG=fr_FR.UTF-8): git prints "CONFLIT", so a scan grepping CONFLICT reported zero conflicts where there were at least six. First sweep, for the owner to complete: land-on-platform-branch.sh lines 874 and 882 match "non-fast-forward|fetch first|stale info|cannot lock ref" (1524-7gn7's ancestry check softens a miss); push-plan-fragments-to-trunk.sh line 526 picks a reason line by "rejected"; test-mirror-receive-wrapper.sh line 170 and test-git-mirror-existing-volume-hardening.sh line 162 match non-fast-forward wording, whose source (git or the mirror's own hook) was not checked. Lua callers were swept by pattern only.
    exit_criteria:
      - "every site in scripts/, lib/ and build.sh that matches git's own wording runs that git with LC_ALL=C or reads porcelain or an exit code; each site left alone is listed with the reason"
      - "a fixture runs one fixed site with LANG=fr_FR.UTF-8 and gets the English verdict; with the fix reverted it reds, or says could-not-run where git ships no French catalogue"
    unscoreable: "unpinnable-until-the-sweep-exists: the fixture is the deliverable."
    next_action: "Complete the sweep, separating git's wording from our own hooks' wording."
    provenance: "measured by calmecacpilli; requested by coordinator macuahuitl-fedora 2026-11-23"
    related: [1524-7gn7]
    events:
      - {type: filed, ts: '2026-11-23T23:25:55Z', host: calmecacpilli, summary: locale-dependent git prose filed}
  - packet_id: preflight-says-when-the-floor-merge-driver-is-unarmed
