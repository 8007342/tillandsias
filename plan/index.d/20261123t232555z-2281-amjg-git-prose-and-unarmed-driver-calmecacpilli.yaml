    capability_tags: [preflight, git]
    estimated_hours: 1
    title: "Preflight and the fleet membership check print an advisory when merge.tillandsias-floor.driver is not set in the clone"
    context: |
      check-hooks-armed.lua already reports an unarmed driver, but preflight and check-fleet-membership.sh were not found to run it. calmecacpilli merged 187 trunk commits 2026-11-23 with the driver unarmed and nothing said so; scripts/ensure-hooks.sh armed it. Unarmed, git merges the floor files textually: in a replay of six historical merges, all six conflicted on a floor or divergence file that way and none did with the driver.
    exit_criteria:
      - "in a clone shipping scripts/merge-floor-driver.sh with the config unset, preflight and the fleet check each print an advisory naming scripts/ensure-hooks.sh, and their exit codes do not change"
      - "an armed clone prints no advisory; a tree without the driver prints none"
    unscoreable: "unpinnable-until-the-advisory-exists: a fixture over both clone states is the deliverable."
    next_action: "Reuse check-hooks-armed.lua's driver test; do not write a second reader of the config."
