        PRE-FIX DEMONSTRATION, measured on BSD sed here, and it is better evidence than the unescaped-newline one because it shows the CONSEQUENCE: for delegate-outcome the old form errors "invalid command code f" and leaves the record at filed=no, so the record is never marked and THE NEXT CYCLE FILES IT AGAIN. The new form yields filed=yes. A no-op that reports success is worse than a crash, which is why this class was the right slice and readlink/date were not.

        A THIRD FALSE-POSITIVE CLASS, and the third time this guard was wrong in its own favour: AN IDIOM INSIDE AN EXPLICIT DIALECT BRANCH. bump-version.sh:157-161 wraps its GNU arm in `if sed --version | grep -q GNU; then … else awk … fi`, and the author had solved MORE than -i: BSD sed also rejects the `0,/re/` ADDRESS, which I measured as a SILENT NO-OP (exit 0, file unchanged, no substitution). So a naive -i conversion there would have removed the warning and left the real defect — the worst possible outcome, and exactly what "read the lines before planning the fix" is for.

        The new rule uses a BOUNDED WINDOW (a dialect probe suppresses six lines), not file-level immunity: a file that branches for one idiom must not get a pass on every other idiom in it, which would be an exemption list wearing a heuristic's clothes. Pinned both directions — bump-version must NOT be flagged, test-source-slice-bounds.sh (bare sed -i, no probe nearby) MUST still be.

        ALSO MEASURED AND WORTH RECORDING: BSD sed DOES support the `/re/,+2d` address form, so ensure-nvidia-cdi.sh's only defect was -i. Not every GNU-looking address is GNU-only, and assuming so would have produced churn.

