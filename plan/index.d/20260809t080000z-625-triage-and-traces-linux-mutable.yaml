  - packet_id: cycle-batch-triage-selector
    order: 625-czpy
    status: completed
    desired_release: v0.5
    priority: p1
    title: "One cycle takes one cohesive, budgeted, minimax-ranked batch"
    kind: feature
    deliverable: scripts/select-work-batch.sh
    depends_on: []
    pickup_role: linux
    capability_tags: [plan, triage, methodology, orchestration, minimax]
    outcome: >
      Operator directive 2026-08-09: consecutive `/meta-orchestration` calls on random
      agents and harnesses must drain the plan in predictable chunks, and must not just
      take "the shiny packets".

      scripts/select-work-batch.sh emits ONE cohesive batch — a single epic
      (`release_target`), at most `budget` packets — plus a triage line and the frontier it
      considered. Budget is 1 on forge (order 264, unchanged) and 3 elsewhere.

      MINIMAX, not priority-first. Epics are scored 2*urgency + 1.5*blocking + neglect per
      convergence.yaml -> minimax_convergence_strategy. Ranking by p0 alone is precisely the
      anti-pattern that file names ("raising average convergence by improving low-risk
      obligations while a high-risk maximum residual remains unresolved"), because p0
      asserts urgency, not residual, and a p0-first agent keeps finding p0s.

      ENTROPY, score-weighted over the top-3 from a printed seed. A first cut used UNIFORM
      choice over the top-K and was wrong: with scores 22.8/19.7/8.5 it took the 8.5 a third
      of the time, reintroducing the very trap minimax forbids. Weighted selection measured
      9/12 runs to the largest residual while leaving smaller ones reachable, so nothing
      starves and two concurrent hosts do not collide on one epic.

      Reproducibility is preserved where it matters: predictable drain is a property of
      batch SIZE (fixed by the budget), not of always choosing the same work. Same seed +
      same ledger -> same batch, so a cycle can be replayed; the seed and the whole
      considered frontier print with every batch, because an unexplained selection is
      unauditable.

      UNGROUPED is demoted whenever a real epic is eligible — it scores highest purely on
      size whenever coverage is poor, and letting it win would return the scattered batch
      the script exists to prevent while hiding the gap behind a plausible selection. The
      residual coverage deficit is tracked separately as 625-jd5f.

      Wired into methodology/distributed-work.yaml -> cycle_batch_triage (new) and
      worker_agent_protocol.select_shaped_work, and into both
      skills/advance-work-from-plan and skills/meta-orchestration.
    verifiable_closure: >
      litmus:cycle-batch-triage-shape — 10 steps, all executing the selector rather than
      grepping it, including two negative controls (bad role, bad budget), a
      minimax-dominates-entropy step, a reproducibility step, and a read-only step.
    events:
      - ts: "2026-08-09T08:00:00Z"
        event: completed
        summary: >
          Selector, litmus (10 steps green), methodology section, and both skill wirings
          landed. Writing the litmus caught a false pass in its own budget step: the
