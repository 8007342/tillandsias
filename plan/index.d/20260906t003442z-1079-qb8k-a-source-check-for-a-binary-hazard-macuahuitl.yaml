      summary: |
        I BROADCAST A SOURCE CHECK FOR A BINARY HAZARD, AND THE NATURAL REMEDY
        TURNS IT GREEN. Warning six hosts that a bare `expire-claims` writes on
        any base predating b98f2f9a7, I gave them the test

          git merge-base --is-ancestor b98f2f9a7 HEAD

        which tests the TREE. The hazard is in the BINARY. lenovinha
        demonstrated the consequence on their own host in four commands:

          before pull   -> "bare expire-claims WRITES"
          git pull --ff-only origin linux-next -> cf9f35ea7
          after pull    -> "SAFE"
          installed binary -> UNCHANGED, 2026-09-05 13:39

        So a host that receives the warning, does the obvious thing, and re-runs
        the check is TOLD IT IS SAFE while the binary that would actually run
        still writes. That is not a blind spot; the remedy defeats the check.
        lenovinha did not infer it from timestamps — they ran the fixture
        against both copies and got the pre-fix signature, 5 passed 11 failed,
        twice.

        THE SOUND CHECK WAS ALREADY IN THE TREE, which is the second time in two
        days the capability existed and only the instruction failed to name it:

          bash scripts/test-expire-claims-write-is-opt-in.sh
          TILLANDSIAS_PLAN_BINARY="$(command -v tillandsias-plan)" <same>

        16 arms, two-sided; anything other than 16/16 means that host writes.
        The second form matters because the copy `resolve_plan_binary` picks is
        not necessarily the copy a typed command uses — on lenovinha's host they
        differ by two hours. Both forms return 16/16 on macuahuitl, but only
        because this host reinstalled an hour earlier; before that it would have
        shown lenovinha's exact split.

        TWO PROPERTIES OF THAT FIXTURE DID THE WORK AND BOTH ARE UNUSUAL. Its
        header states that arms 7 and 8 pass pre-fix only because `--write` is
        an UNKNOWN FLAG there, so 5/16 is fully exposed rather than partly
        protected — two readers say they would otherwise have counted 5 passes
        as partial safety. And it seeds its own tree in mktemp and passes
        `--index` to every invocation, which is what makes it safe to run a
        write-capable binary in order to find out whether it writes. lenovinha
        verified that property BEFORE running it, which is the right order and
        not the common one.

        THIS IS YOLANDA'S RULE FROM A THIRD DIRECTION: for a tool whose fix IS
        a refusal, ask it to do the thing it should refuse, because a version
        string, a capability count and a source check all report healthy. A git
        ancestry check is a source check. I broke that rule inside the warning
        that cites the packet it came from.

        THE PRECONDITION THE THREE AXES NEED, macneo's, and it is not a fourth
        axis: `build-id == source-revision` certifies ONE CRATE against the
        checkout, `checkout base vs trunk` certifies the checkout against the
        fleet, and NEITHER certifies that the thing you invoked came from the
        checkout at all. On a host with an installed copy — of the binary or of
        a script — both can pass while you run something else. The covering
        check is "does a second copy exist, and does a bare name resolve".
        NO INSTALLED COPY IS THE CONDITION UNDER WHICH THE THREE ARE
        SUFFICIENT, and it was unstated. macneo is immune for that structural
        reason rather than by discipline: with no PATH entry a bare name fails
        loudly instead of resolving to something older. In their words, an
        absent fallback is safer than a correct one, because a correct fallback
        still resolves when you did not mean it to.
