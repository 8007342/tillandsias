      MEASURED on yoga 2026-10-17 with a build of linux-next: a fresh forge on visual-chess logged "entrypoint-terminal.sh: line 135: trace_lifecycle: command not found" and /home/forge/src was empty. bash -n on f78b12c99:images/default/lib-common.sh fails at line 6 (unexpected fi); on 18d2eb556^ it passes. Commit 18d2eb556 (1747-e9d6, by yoga) put its source-time trace edit at the top of the file instead of in the embed-probe block. Its fixture awk-extracts one function and never parses the whole file, and the preflight has no bash -n over images/, so both stayed green.
