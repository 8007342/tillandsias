    title: |
      WSL2 guest hot-install: the headless unit gets KillMode=process, the ELF is installed by atomic rename (no stop, no ETXTBSY), reconcile_adopted_guest re-execs the daemon with podman ps unchanged, and a tray exiting as the old side of --upgrade-handoff does not wsl --terminate
    context: |
      reconcile_adopted_guest (crates/tillandsias-windows-tray/src/wsl_lifecycle.rs:999)
      compares the adopted guest's headless version with the workspace version
      and on mismatch inject_stale_guest_wiring (:1083) runs systemctl stop
      tillandsias-headless.service (:1124, comment: overwriting a running ELF
      is ETXTBSY), overwrites via cat > path (:2115, :2154), then restarts
      (:1133). Every vsock/PTY session drops. The unit file ([Service] at
      :1813/:1875) has no KillMode=, so the default control-group kill may
      take conmon and the containers with it — UNMEASURED; the first
      deliverable is the measurement. Quit runs WslLifecycle::graceful_shutdown
      (:665) -> WslRuntime::stop (crates/tillandsias-vm-layer/src/wsl.rs:1120)
      -> wsl --terminate. Design D1, D5; spec deltas vm-provisioning-lifecycle
      MODIFIED "Tray exit triggers graceful drain" and ADDED "Guest headless
      binary can be hot-installed into a running guest".
    exit_criteria:
      - 'MEASUREMENT recorded in the closing event: podman ps -q inside the distro before and after systemctl restart tillandsias-headless.service with KillMode=process (pre-fix: unmeasured)'
      - 'with three containers running, a guest binary upgrade leaves the running container id set unchanged and the host reconnects within 10 s (pre-fix: unit stopped before overwrite; sessions dropped)'
      - 'a tray exiting as the old side of --upgrade-handoff leaves the distro in wsl --list --running and the headless unit active (pre-fix: wsl --terminate on every quit)'
      - 'when the handoff cannot be honoured the tray reports deferred with a reason and offers the ordinary drain; it never terminates silently'
