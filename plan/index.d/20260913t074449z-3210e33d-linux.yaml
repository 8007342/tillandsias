      summary: |
        PARTIALLY ALREADY FIXED, AND THE REMAINING HALF WAS THE SUBTLER ONE. Criterion 1
        was closed by 686-7qcm before I arrived; criteria 2 and 4 were live and are
        closed here. Verified each criterion by measurement rather than by reading the
        diff.

        CRITERION 1 — ALREADY MET. commit 7c83653ec ("a lone fragment could drop a
        closure rung, permanently", 686-7qcm) taught compaction the same
        `status_entry_wins` ladder the runtime fold uses. Measured at HEAD on a scratch
        ledger: base `completed` + fragment `ready` (newer, no falsified event) ->
        compaction keeps `completed`, and the re-fold agrees. The row's recorded pre-fix
        failure no longer reproduces.

        CRITERION 3 — NEGATIVE CONTROL, STILL HOLDS. Both of the row's decisive
        measurements reproduce at HEAD: older `verified` beats newer `completed`, and
        older `completed` beats newer `in_progress`. The ladder is intact and timestamps
        still do not order `status`.

        CRITERION 2 — WAS LIVE, AND IS ARGUABLY WORSE THAN THE ORIGINAL DEFECT. Once
        compaction started refusing the lowering write, it dropped that write AND
        DELETED THE FRAGMENT CARRYING IT, in silence. Measured at HEAD before my change:

            base=completed, fragment=ready(coordinator, newer)
            $ tillandsias-plan compact
            ok: compacted 1 fragment(s) into plan/index.yaml (1 removed)
            (zero lines mentioning the discarded value)

        So a coordinator releasing an expired claim got `ok:` from set-field, `ok:` from
        compact, a ledger still reading `completed`, and no record anywhere — the
        fragment that held their intent was gone. The ORIGINAL defect at least left the
        wrong value visible in the base; this left nothing. Keeping the rung is correct;
        keeping it silently is what let two maintainers read one ledger, disagree, and
        both be right.

        FIXED: `CompactionText` now carries `discarded_status`, and the compact
        dispatch prints, per refused write, the packet, the refused value, the value that
        beat it, the host that wrote it, and the exact `set-field ... --reopen-evidence`
        command to do it deliberately.

        CRITERION 4 IS SERVED BY THAT SAME MESSAGE, which is the point of putting it
        there: the rule ("`status` folds as a MONOTONE JOIN over the closure ladder,
        implemented < completed < verified < done, not last-write-wins, so a newer value
        that sits LOWER is refused and its timestamp is never consulted") is stated at
        the one moment it costs somebody something — when their write is refused. The row
        asked for the rule to be stated "where a reader meets it", and two maintainers
        having read this field as last-write-wins on the same day is the measurement
        saying the code did not say what it does.

        WHAT I DID NOT DO: make `status` last-write-wins. The row names it as the fix
        that satisfies criterion 1 by breaking 650-dq6u, and it would let any returning
        host with a stale high-water fragment silently reopen finished work.

        PINNED by three tests under the row's own closure (`cargo test -p
        tillandsias-plan compact`), 23/23:
          * compaction_refuses_a_rung_lowering_status_write_and_says_so
          * compaction_keeps_the_ladder_teeth_an_older_higher_rung_still_wins  (the
            load-bearing negative control; also asserts a legitimate ASCENT still
            applies, so the fix cannot pass by freezing the field)
          * compaction_does_not_report_a_status_write_that_changes_nothing  (a
            re-assertion of the rung a packet already holds is a no-op, and reporting it
            would train readers to skip the warning that matters)

        TEETH, MUTATION-SCORED rather than assumed: disabling the recorder — restoring
        the exact silent-drop behaviour — fails
        compaction_refuses_a_rung_lowering_status_write_and_says_so and leaves the other
        two green, which is correct: they pin behaviour this change did not alter. Only
        one of the three is evidence for this fix, and it is named.

