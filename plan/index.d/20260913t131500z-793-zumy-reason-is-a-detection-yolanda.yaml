      note: >
        THE CONSTANT WAS WRONG EVERYWHERE AND COINCIDENTALLY MATCHED THE HOSTS
        NOBODY HAD CHECKED. wsl2_paravirtual_gpu_reason returned
        `engine-missing:no-vulkan-icd` unconditionally, assigned by enumerate_gpus
        to every dxg device, while nothing in the probe read icd.d, libvulkan, or
        an enumeration result. esme's measurement is what exposed it: esmeraldinha
        carries a Vulkan loader and the stock mesa-vulkan-drivers ICD set,
        unprovisioned, and enumerates an INTEGRATED_GPU via DRIVER_ID_MESA_DOZEN
        over /dev/dxg — so the probe was naming a missing component that is
        installed.

        THE VERDICT IS DELIBERATELY UNCHANGED: usable stays false, the class
        stays cpu-only, lanes stay empty. Promoting the device needs enumeration
        and the software-rasterizer rejection, which is criterion 2's other half.
        This change stops the probe asserting a false CAUSE; it does not claim
        the GPU is reachable.

        ONE JUDGEMENT CALL THE OWNER SHOULD OVERRULE IF IT IS WRONG. Criterion 2
        requires the word `engine-missing` verbatim, and both missing arms keep
        it. When loader AND ICD are present the engine is not missing, so that
        arm returns `engine-unverified:vulkan-present-not-enumerated` instead.
        Saying `engine-missing` there would be the original false statement in a
        new spelling. If criterion 2 was meant to cover the present-but-
        unenumerated case too, this arm is wrong and should be renamed rather
        than the detection removed.

        A TEST HAD TO BE RETARGETED, and the reason is worth recording. The
        existing shape test asserted the production entry point, which was a
        constant and is now a detection reading the live filesystem. Left alone
        it would have passed on this host — Windows, no loader — and gone RED on
        esmeraldinha, the only host that can verify this packet. A test that
        greens everywhere except the verification host is worse than no test. It
        now drives the pure half with supplied facts, so its verdict is a
        property of the code rather than of whoever ran it.

        ALSO: the new functions needed `#[cfg(any(target_os = "linux", test))]`,
        the same gate the original carried. The first build failed E0425 because
        the gate landed on only one of the three new items and an ungated caller
        referenced a gated callee. 935-6fzk's comment explains why that gate has
        both arms — without `test` the macOS gate fails on dead code, without
        `linux` the Linux build loses the production value — and it still holds.
