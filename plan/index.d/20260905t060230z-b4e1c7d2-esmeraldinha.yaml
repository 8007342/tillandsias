      - "skills/build-windows-tray/SKILL.md names the staging step for tillandsias-headless-<arch>-unknown-linux-musl, so the documented path produces a tray that can inject; pre-fix result: FAILS — the skill does not mention the asset, musl, or embedding at all"
      - "a fixture builds with a placeholder asset present and asserts the refusal or warning fires, and builds with a real asset and asserts it does not; pre-fix result: FAILS — no such fixture exists"
