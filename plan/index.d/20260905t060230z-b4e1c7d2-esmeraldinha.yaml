        summary: |
          Filed from the floor while building a tray to verify 1052-984i.
          METHOD NOTE for anyone verifying a guest-side fix on Windows without
          fixing this first: build the musl headless directly in the builder
          distro (`cargo build --release -p tillandsias-headless --bin
          tillandsias --target x86_64-unknown-linux-musl`, 4m16s here), then
          transfer it into the runtime guest OVER STDIN — the appliance guest
          has /mnt/c present but unpopulated (automount off), so a drvfs copy
          fails with "No such file or directory". Byte counts matched exactly
          (14,152,888), which is the check that makes the transfer trustworthy.
