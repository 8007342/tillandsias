        MY OWN DIAGNOSIS WAS WRONG IN ITS DETAIL, and only measuring found it.
        This packet said the three fixtures "commit without setting
        user.name/user.email" and prescribed exporting
        GIT_AUTHOR_*/GIT_COMMITTER_*. But all three ALREADY exported:

          export GIT_AUTHOR_NAME=f GIT_COMMITTER_NAME=f GIT_CONFIG_NOSYSTEM=1 HOME="$ENTRY"

        The NAME halves were there; the EMAIL halves were not. With only the
        names set, git AUTO-DETECTS an address from user@host — which succeeds
        on a Linux host whose hostname resolves, and fails on a Windows/MSYS
        host whose hostname has no domain:

          fatal: unable to auto-detect email address (got 'bullo@Yolanda.(none)')

        Every commit in the fixture then fails, and the cascade surfaces as
        `error: src refspec HEAD does not match any` — which is why the failure
        reads as a refspec problem and not an identity one. The remedy POINTER
        in the packet was right (test-git-mirror-relay-verified-ack.sh exports
        both halves, which is exactly why that fixture passes on this host); the
        statement of what was missing was inferred from the error text rather
        than read from the source. Recorded because "I filed it, therefore it is
        right" is the failure mode this milestone keeps collecting.

        FIXED: all three now export GIT_AUTHOR_EMAIL and GIT_COMMITTER_EMAIL,
        with a comment naming why the EMAIL halves are load-bearing and why the
        symptom appears as a refspec error. Each fixture verified individually
        (3/3 PASS) and in the suite.

        THE REMAINING THREE are unchanged and are the ones this packet already
        attributed to different causes:
          litmus:forge-packed-refs-shared      CRLF normalisation, case 2
          litmus:forge-gitdir-staging-chown    blocked by the native-windows
                                               E0425 (enforce_ca_key_mode is
                                               cfg(unix), called ungated)
          litmus:forge-upstream-auth-gate #6   guard fixture under
                                               `env PATH=/usr/bin:/bin` against
                                               an MSYS temp path
        Plus the seventh recorded later:
          litmus:harness-crash-supervision-shape   MSYS has no pgrep

        Left `ready`: four of seven still red, and the deliverable asks for each
        to be fixed or explicitly marked not-executable-on-windows.

        NOTE FOR WHOEVER TAKES THE REST: two of the four (gitdir-staging-chown,
        harness-crash-supervision) are blocked on decisions rather than typing —
        whether tillandsias-headless should compile natively on Windows at all
