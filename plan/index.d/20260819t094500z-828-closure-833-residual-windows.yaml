    context: |
      THE ARITHMETIC, from the constants themselves:

        APPROLE_TOKEN_TTL_SECS      = 3_600   (1h client token)
        APPROLE_TOKEN_MAX_TTL_SECS  = 86_400  (24h hard renewal ceiling)
        APPROLE_AGENT_SECRET_ID_TTL = "48h"   (server-side SecretID lifetime)

      A mirror authenticates at T0 and renews until T0+24h. At max_ttl the
      Agent must re-LOGIN, which consumes the SecretID's validity window but
      not the SecretID itself (num_uses=0). That login succeeds while the
      SecretID lives — so the mirror gets a second 24h window, ending T0+48h.
      At T0+48h the SecretID has expired server-side and there is no path to a
      third window. The mirror keeps serving clones and stops being able to
      push, which is exactly the 2026-08-18 outage on a longer clock.

      828-k3mq REMOVED THE PREMATURE CAUSE, not this one. Before it, a lane
      exiting into a live sibling destroyed the SecretID immediately, so the
      fuse was lit at lane exit and fired at T0+24h. Now the SecretID survives
      to its natural TTL, and the fuse fires at T0+48h instead. That is a real
      improvement — 48h of headroom, and the operator-facing verdict now says
      `agent-unauthenticated` with the right remedy — but a mirror is a
      long-running service under order 443 ("already running; reusing") with no
      upper bound on reuse, so 48h is a deadline it can and will cross.

      WHY THE OBVIOUS KNOBS ARE WRONG:
        - Lengthening APPROLE_AGENT_SECRET_ID_TTL just moves the deadline. The
          role's own doc explains the 48h is there to bound credentials
          orphaned by an uncatchable crash; raising it widens that window for
          every orphan to buy time for one non-orphan.
        - Raising APPROLE_TOKEN_MAX_TTL_SECS defeats the point of a max_ttl.
        - Restarting mirrors on a timer trades a credential outage for a
          service interruption, and order 443 exists precisely because
          destroying a mirror out from under a sibling lane is harmful.

      THE SHAPE THAT PROBABLY WORKS: re-mint on demand. The host already knows
      how (mint_approle_auto_auth_for_container) and already knows the owning
      container (828-k3mq added that field). A periodic or on-attach check
      could notice "this mirror's SecretID is approaching its TTL and its
      container is still running" and issue fresh material into the running
      container the same way the launch path does. The hard part is delivery:
      the material currently crosses the boundary as a Podman secret read at
      container START, so a running container has no channel to receive a new
      one — that is the real design question this packet has to answer.

      DETECTION EXISTS ALREADY, which makes this safe to leave open for now:
      the probe publishes `agent-unauthenticated` (828-k3mq) and the forge
      credential guard refuses worker drain on it with the correct remedy. The
      failure is loud and diagnosable in one step; it is simply not prevented.
    verifiable_closure: "a mirror container kept running past 48h from its first authentication still reports a valid Vault client token (vault-cli lookup-self exit 0) and its probe publishes authorized/<epoch> — observed, since the clock is the point; plus a unit-level assertion that the re-mint path targets a container that is still running"
