      summary: |
        BOTH DELIVERABLES LANDED AND GATED, and the closure's drain-level test
        now exists.

        DELIVERABLE 1 (cycle 1): revoke_pending_container_tokens refcounts the
        container its AppRole material belongs to — Running keeps, Unknown
        keeps loudly (leak-not-destroy), only Gone destroys.
        DELIVERABLE 2 (cycle 2): the probe splits `agent-unauthenticated` from
        `no-credential`, so a dead Agent token and an absent GitHub token stop
        sharing one word when their operator remedies are opposite.

        THIS CYCLE closed the closure gap I named when declining to complete it
        earlier. The keep/destroy decision was inline in the drain's loop, so
        the only way to exercise it was with a live Vault and a live podman —
        a rule testable only against live infrastructure is a rule nothing
        gates. Extracted `partition_auto_auth_entries(entries, probe)` with the
        owner probe injected, and the drain now consumes its result. Five
        drain-level tests, all green:

          drain_keeps_material_whose_container_is_still_running   (the closure)
          drain_destroys_material_whose_container_has_exited      (the control)
          drain_keeps_material_when_owner_state_is_unreadable
          drain_destroys_material_with_no_owning_container        (pre-828 parity)
          drain_resolves_a_mixed_batch_per_entry

        ONE DOCUMENTED EQUIVALENCE, not a quiet substitution. The closure's
        words are "assert the SecretID accessor still authenticates". That
        needs a live Vault. The assertion is made one step earlier and
        equivalently: the drain must not SELECT that material for destruction.
        Everything downstream of the selection — the vault destroy call and the
        `podman secret rm` — is unchanged by this order, so selection is where
        the behaviour under test actually lives.

        The pre-828-parity case is deliberate and asserts the probe is not even
        consulted for unowned material: silently starting to keep it would be a
        credential leak wearing this fix's clothes.

