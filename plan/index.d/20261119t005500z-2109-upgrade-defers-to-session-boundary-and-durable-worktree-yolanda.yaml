packets:
  - packet_id: a-tray-or-guest-upgrade-or-service-restart-waits-for-the-session-boundary-and-the-install-script-refuses-while-a-session-is-live
    order: 2109-ar8g
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: windows
    capability_tags: [tray, upgrade, enclave, forge, install]
    estimated_hours: 6
    owned_files:
      - scripts/build-and-install-windows-local.ps1
    title: "Any tray or guest upgrade, guest re-injection or headless service restart while a forge or studio session is live is deferred to the session boundary with one tray line and an operator 'install now'; the install script refuses by name while a session is live and waits for the tray to exit instead of killing it"
    context: |
      MEASURED 2026-11-19 00:37 UTC on yolanda: scripts/build-and-install-windows-local.ps1 ran
      Get-Process tillandsias-tray | Stop-Process -Force, then Copy-Item failed on the still-locked exe. The relaunched
      56.11.18.2 tray logged "adopted guest wiring is stale — re-injecting bootstrap logic" and
      tillandsias-headless.service restarted twice (16:38:34, 16:38:42 PST). Every --rm container went: the
      operator's tlatoani.net-forge-claude (its WT terminal too), the forge-2 studio, router, web, git mirror and
      browsers; proxy and inference exited. The forge's uncommitted .gitignore and openspec/ edits were lost
      (2109-94ix). Vault came back unsealed; the CA did not churn.
      Standing rule: never stop a forge with live agents unless asked. Generalises 2104-7t7p (enclave replacement
      at the boundary) to version changes and restarts.
    exit_criteria:
      - "With a forge or studio container running, a tray whose version differs from the guest does NOT re-inject or restart tillandsias-headless; it shows one line (e.g. 'Update waits for tlatoani.net to finish') and a tray action 'Install now'. Pre-fix: FAILS (re-injects at once and the containers are removed)."
      - "build-and-install-windows-local.ps1 refuses while a forge or studio container is live, naming each, unless -StopLiveSessions is passed. Pre-fix: FAILS (it proceeds)."
      - "The script asks the tray to exit and waits for the process to end (bounded timeout, then a named refusal), never Stop-Process -Force, and the copy never fails on a locked exe. Pre-fix: FAILS (force kill, then 'being used by another process')."
