      FOR THE GENERIC MOBILE WORKSTATION, which is the operator's actual point — the reusable findings, none specific to this machine:
        * The toolkit belongs in a container; the SPEC must describe the host.
        * A spec generated inside a container is wrong in ways that look right: one
          absent path out of 55 is enough for crun to refuse, and the diff is a
          distro-layout difference (/etc/vulkan vs /usr/share/vulkan), not an error
          anyone would predict.
        * `--driver-root=/run/host` is the immutable-host lever, and it works because
          /run/host is a symlink to /.
        * The CDI HOOK is a host-side executable. This is the piece most likely to be
          missed, because everything else in the spec is data.
        * Podman does not search ~/.config/cdi by default. Any remediation that writes
          there without configuring cdi_spec_dirs silently does nothing.
        * Two specs declaring one device name produce the same error as zero specs.
        * SELinux enforcing blocks the device nodes independently of CDI; callers need
          label=disable.
