      REMAINING 2 — THE PROBE STILL LIES, AND THIS IS THE HIGHEST-VALUE PIECE. accel_probe.rs computes `cdi_ok = effective_tier == "gpu-cuda"`, and effective_tier comes from inference-tier-probe.sh, which decides gpu-cuda from `nvidia-smi -L` ON THE HOST — the SAME signal as the surrounding `nvidia_present`. The check is circular: where nvidia-smi works, `cdi-spec-missing` can never fire, and the envelope advertises the `container` lane unconditionally. FIX IT THE WAY 799-tb7q FIXED THE NIX PROBE: exercise the path instead of asking the host. The honest probe is a CDI resolution attempt (or a parse of the spec against the host filesystem, which ensure-nvidia-cdi.sh already implements and could be reused). Note this cuts BOTH ways — my fix has now made the optimistic answer TRUE on this host, so the bug is currently invisible here. It is still a bug.

