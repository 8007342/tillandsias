    title: |
      While the first Apple-preset browser.open builds the WebKit image (~90 s, 1.5 GB, on demand), the user and the agent see "Preparing the WebKit engine (first use)…" DURING the wait, not only in the result afterwards.
    context: |
      Coordinator ruling (2026-10-13): keep the WebKit image on demand, so it does not land on floor-tier hosts that never open an Apple preset, but no silent wait.
      #405 does the small part:
      - browser.open's result carries a notice ("Prepared the WebKit (approximates Safari) engine on first use (84 s)", measured);
      - the image build pushes the label "Preparing the WebKit engine (first use)…" through build_image_with_logging.
      DURING the wait, though, the MCP tool call is a blocked line on the lane socket, and the Linux tray shows no build label. The UDP status events land only in the guest/VM status path.
      Options: MCP progress notifications (notifications/progress) on the lane transport, or a tray status line on Linux fed by the same build label.
    exit_criteria:
      - 'during a first-use WebKit build, the tray (Linux) shows "Preparing the WebKit engine (first use)…" within 2 s of the build starting, and clears it when the window opens; red today'
      - 'an MCP client that sent a progressToken receives at least one notifications/progress naming the WebKit engine before the browser.open result; red today'
      - 'a second WebKit open (image present) shows no such message'
    unscoreable: "unpinnable-until-the-guard-exists: the progress channel and its arms are written together; the build-label wiring is pinned by its own test"
