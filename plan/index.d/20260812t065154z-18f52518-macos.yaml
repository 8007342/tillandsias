        status 'implemented' (not terminal) with evidence_refs: CLI --github-login now captures its own vault handover into the macOS Keychain before stopping the VM (capture_vault_handover split out of deliver_credentials_and_check_handover; capture-only by design, since the process that CAUSED the new epoch holds only older values by construction and delivering there would recreate the bug). Root cause confirmed in code, not inferred: deliver_credentials_and_check_handover is called ONLY from action_host.rs (the GUI tray paths), never from the diagnose.rs one-shots, and it delivers BEFORE capturing. macos-tray suite green (79 unit + 6 integration); the credential still resolves after the change (--list-cloud-projects listed repos, exit 0). DELIBERATELY NOT 'verified' — the as-wired proof is INCONCLUSIVE and saying otherwise would be the failure this packet is about. Live run showed the plumbing works (connect, handshake, GetVaultHandover, clean return) but the Keychain fingerprints were UNCHANGED, because PENDING_HANDOVER is set only on a FRESH Vault init and this login reused an already-initialized Vault. The scenario that matters was therefore never exercised. THAT RUN ALSO EXPOSED A DEFECT IN THIS VERY FIX: it printed 'host Keychain updated' when nothing had been written, because capture returned Ok(()) identically for 'wrote both' and 'wrote nothing' — a success claim with no evidence, the exact class this codebase keeps being bitten by. Now returns Ok(bool) and reports the two cases distinctly, with the empty case warning that the Keychain may still be older than the guest. RESIDUAL, now sharper than when filed: capture-at-fresh-init is NECESSARY BUT NOT SUFFICIENT. It cannot repair a host that has ALREADY diverged, and THIS HOST IS CURRENTLY DIVERGED (Keychain holds a pre-05:09Z epoch; the guest Vault was fresh-initialized at 05:09Z), so the hazard remains live here. Closing it needs either the guest able to report its CURRENT share/token on demand rather than only a pending one, or the tray refusing to deliver an epoch the guest did not ask for.
