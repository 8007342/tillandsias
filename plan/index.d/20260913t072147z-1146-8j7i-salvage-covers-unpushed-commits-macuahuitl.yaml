    title: |
      The salvage net answers ok:salvage-not-needed on a clean tree with an unpushed commit, which on a red-gate host is exactly the "finished work sitting where nothing protects it" state 872-c9nd was written for; and it fails outright on a dangling symlink the filesystem cannot stage, on the drvfs substrate where salvage matters most.
    context: |
      MEASURED (yolanda, 2026-09-13): 823-u5zf finished and gated green at
      1d7b29bcc, then a trunk merge brought the 1141-vf9w fixture's chmod-000
      arm, which reds under the WSL gate's uid 0, so every push is refused
      (the tree changed since the gate last passed). The coordinator's
      instruction had two halves and neither reached the state: a first push
      of a new work/<order> ref has no base to diff against and needs the
      full gate (red), and `scripts/salvage-dirty-worktree.sh` tests only
      `git status --porcelain` — on a clean tree it prints
      ok:salvage-not-needed, exit 0, having preserved nothing. Its own header
      says the refusal path must be a place work passes THROUGH on its way to
      origin; a finished commit that cannot be pushed is that state with the
      dirt already committed. yolanda read the hook and used the sanctioned
      grammar directly: `git push origin HEAD:refs/heads/salvage/<host>/<yyyymmdd>-<order>`
      is exempt from pre-push-local-gate.sh when every ref is a salvage ref,
      verified by ancestry and content. That is the recipe the script should
      execute for the caller.

      SECOND PROPERTY, same session: a dangling symlink left in the worktree
      by a probe made the script FAIL at the staging step —
      `fail:salvage:add:error: open("dangling"): Function not implemented` —
      rather than skip the path. On drvfs (the substrate where a salvage is
      most needed, since a gate there costs 40+ minutes) an unstageable path
      currently turns "preserve everything else" into "preserve nothing".

      WHAT TO BUILD. (1) After the clean-tree test, check whether HEAD is
      reachable from any origin ref (`git branch -r --contains HEAD` empty, or
      `git rev-list --count origin/<branch>..HEAD` > 0 for the tracked
      branch); if not, push HEAD to the salvage ref by the same plumbing path
      and answer ok:salvaged-commits:<ref>:<sha>; ok:salvage-not-needed only
      when clean AND reachable. (2) In the staging loop, a path the substrate
      cannot open (the ENOSYS/EOPNOTSUPP family, dangling symlinks) is
      skipped with skip:salvage:unstageable:<path> on stdout and the salvage
      proceeds; the final verdict stays ok:salvaged with the skipped count
      appended, never fail. (3) skills/meta-orchestration/SKILL.md's SALVAGE
      BEFORE YOU REFUSE section names the unpushed-commit case and the new
      verdict so a host with a red gate reaches for the script, not for a
      work ref that will refuse.

      NOT IN SCOPE: changing the hook's exemption, sweeping salvage refs, or
      making the script gate anything. The salvage ref remains a copy; the
      landing still goes through the gate when it is green again.
