      time. That binary is destroyed by any reprovision — including the
      `--reset-guest` path, which is destructive by design and which the
      Windows e2e smoke exercises routinely. It also does not exist on
      esmeraldinha, on macuahuitl, or on any Linux host. So the fix is real,
      is verified live, and is one `wsl --unregister` away from being gone
      from the fleet entirely, with no record in any artifact anyone could
      reinstall from.

      ALSO IN THIS WINDOW, from this host today (2026-08-17), all on
      windows-next and none in a release:
        * WSL_UTF8=1 applied at every wsl.exe construction site, with the
          hand-rolled NUL scrubs on wsl.exe output deleted. Affects the
          Windows provisioning, diagnosis and lifecycle paths.
        * `launch_spec` now REFUSES a project name that would break out of the
          single-quoted guest shell word, instead of interpolating it
          unvalidated (the E3 injection leak).
        * The Windows tray now REFUSES an unknown flag instead of falling
          through to the GUI tray (E4). This one matters to the coordinator
          directly: it is why the 2026-08-16 build-install smoke produced a
          phantom finding and burned 10 minutes plus one kill on a misread.
          Until a release carries it, every release smoke on a Windows host
          can still generate that false verdict.

      WHAT THIS REQUEST DOES NOT ASK FOR. It does not ask for v0.4.260815.1 to
      be promoted. See the gate below.
