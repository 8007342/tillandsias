      WHY THIS IS A DURABILITY PROBLEM AND NOT A CONVENIENCE ONE. The fix is
      currently running on this host's guest as a HOT-SWAPPED binary:
        /usr/local/bin/tillandsias-headless        (14091608 bytes, Aug 16 16:38)
