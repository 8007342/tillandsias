    title: "freshness-regime-budget.sh answers fs=unknown on macOS, so a native APFS checkout gets the remote budget"
    context: |
      The probe uses findmnt, which macOS lacks; the fallback tries pwd -W (MSYS) and then fstype=unknown, which maps to the remote budget.
      The classifier lists apfs as native but nothing ever answers it. Measured by macbookair 2026-11-25 (relayed by macuahuitl):
      "note: the live-selection arm was not exercised — unclassified fs 'unknown' on this host". The looser budget can hide a regression there.
    exit_criteria:
      - "on macOS the selector prints fs=apfs regime=native (stat -f, or diskutil/mount output), and the fixture's live-selection arm runs there"
      - "Linux and MSYS answers are unchanged"
    unscoreable: "unpinnable-until-the-guard-exists: needs a macOS run."
    next_action: "read the filesystem from mount(8) or stat -f when findmnt is absent."
