        C1's 3360ms is the two fixes composing: memo-check says stale:worktree-mode-drift, the gate runs, and 1009-gccx's fast-refusal phase catches the exec bit at 92ms instead of at line 3269.

        THE MECHANISM, and why it is not either candidate I named when filing. The packet offered (a) run the exec-bit guard outside the memo, or (b) compare index and worktree modes with a stat. yolanda proposed the third and it is the right one: read the modes through git, not through the filesystem. A stat asks the FILESYSTEM, and on drvfs the filesystem lies — that is the whole of 889-8tcb. git's answer is governed by core.fileMode, which 889-8tcb itself calls 'a DECLARATION both sides read identically, not an inference the broken filesystem gets to answer'.

        THE SAFETY MEASUREMENT MY PREVIOUS ATTEMPT NEVER TOOK, one tree, one moment, toggling only that setting:
          core.fileMode=true   -> mode changes seen: 1   POSIX: memo refuses, guard runs
          core.fileMode=false  -> mode changes seen: 0   drvfs/Windows: NO behaviour change, no deadlock
        That is the property 1034-ihxw lacked, and it is why this one is safe to land where that one was not.

        COST, since the packet asked for the mechanism to be stated with it: one 'git diff --summary' on the memo path, ~20ms, against the ~2s memoised gate it protects. Scoped to mode changes only — a content edit already moves the digest and is caught above. A STAGED mode change moves the index, therefore the digest, therefore stale:tree-changed-since-gate; this covers worktree-vs-index only.

        TWO DEFECTS INSIDE THIS CHANGE, both caught and both mine:
          1. The first version was 'git diff --summary | grep -q'. grep -q exits on first match and SIGPIPEs the producer, so the pipeline's status depends on a race — A MEMO VERDICT DECIDED BY A SIGNAL, which is precisely the class this block exists to close. The 792-ksr8 guard refused it in the same change that introduced it. Now capture-then-case, no pipeline.
          2. The first closure arm demanded stale:worktree-mode-drift unconditionally. Any tree edit — including editing the litmus file itself — makes memo-check answer stale:tree-changed-since-gate for an unrelated reason, so the arm went RED during ordinary development. That is the intermittent-red shape esme argued about on 1038-d7vw: it gets a check ignored rather than fixed. It is now self-gating, asking the clean question first and skipping honestly, while the digest-invariance half stays UNCONDITIONAL — if a future edit 'fixes' this by moving the digest, that arm fails with the 889-8tcb reason named.

        THE CLOSURE ARM IS PROVEN IN BOTH DIRECTIONS, because a skip that never exercises is the orphan-fixture problem I filed hours earlier as 1041-up99:
          with a warm stamp   -> 'ok: memo refuses on worktree mode drift, digest unchanged'; control 'ok:gate-fresh 2026-09-05T03:24:43Z'
