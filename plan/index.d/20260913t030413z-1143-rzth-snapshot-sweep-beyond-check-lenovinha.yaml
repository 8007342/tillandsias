    context: |
      1083-gzqj named this limit in its own words and it was never worked:

        "NINE IS A FLOOR, NOT A TOTAL, and both methods share the same blind
         spot: neither read anything outside `--check`. Nothing here says
         anything about --test, --ci-full, the litmus corpus, or the hooks."

      Its next_action item 6 offered the claimer a choice — extend the sweep, or
      split it into its own packet and say so. This is that split, filed by the
      host that closed items 1-5 so the choice is recorded rather than implied by
      a closed row.

      STATE AT FILING. 1083-gzqj is completed: three confirmed instances fixed
      (test-check-credential-channel.sh's zero-margin probe count,
      test-selector-drops-cross-branch-claims.sh's live-ledger baseline,
      test-forge-project-guard-hooks.sh's transcribed hook list), the class has a
      guard (scripts/test-gate-thresholds-are-chosen.sh, gate step
      235-1083-gzqj), and the six remaining --check leads were re-checked with
      FIVE OF FIVE REFUTED. Nothing outside --check was read by anyone.

      WHY p3 AND NOT p1. The known-armed instance is fixed. This is the unread
      remainder of a surface, not a live defect — nobody has measured a snapshot
      outside --check, and it is entirely possible there are none. Filing it p1
      on the strength of "we did not look" would misrepresent an absence of
      evidence as evidence.
    deliverable: |
      The four unexamined surfaces are swept with the SAME METHOD, and the
      result — including a nil result — is recorded.

        * SURFACES: --test, --ci-full, the litmus corpus
          (openspec/litmus-tests/), and the hooks (scripts/hooks/).
        * METHOD, and this is the part that must not be simplified away: sweep
          each FILE for numeric comparisons and classify every hit. Do NOT work
          from cited line numbers. Measured while discharging 1083-gzqj item 5:
          three of six cited lines carried no numeric comparison at all, so
          trusting the citations would have produced three confident refutations
          for the wrong reason — the right verdict on worthless evidence.
        * CLASSIFY EACH HIT by the four-kind test (1083-gzqj's 2026-09-05T22:43Z
          note), which is the class's method and supersedes the prohibition it
          was filed with:
            THRESHOLD       — chosen by someone, written down. Legitimate; its
                              failure message must name the policy.
            CONTRACT PIN    — from the code under test (a documented exit code, a
                              default, an output shape). Legitimate, and not a
                              live-tree comparison even when it looks like one.
            CORRECTNESS CHECK — a relation the fixture evaluates on the spot
                              (this count equals that count). Legitimate and the
                              STRONGEST, because it has no number to go stale.
            SNAPSHOT        — whatever the tree measured when the arm was
                              written. The defect.
        * FOR EACH CONFIRMED SNAPSHOT: replace it with the property the arm
          already claims, mutation-score the replacement (the old arm reds where
          the new one should pass, and vice versa), and add an arm to
          test-gate-thresholds-are-chosen.sh.
        * A DECLARED FLOOR IS KEPT, NOT DELETED. Its only remedy is that its
          failure message name the real cause. Two of the six --check leads were
          exactly this shape.

      THE FAILURE MODE TO AVOID IS OVER-FIXING, and it is not hypothetical: five
      of the six --check leads were LEGITIMATE arms — contract pins, correctness
      checks, a declared floor — that a claimer reading only "no numbers nobody
      chose" would have stripped. 1083-gzqj's note exists because its own finder
      nearly did this. Removing a correctness check to satisfy this packet makes
      the tree worse.
    next_action: >
      Start with scripts/hooks/ — it is the smallest surface, it is where a
      false red costs the most (a hook reds a push rather than a gate), and it
      shares no code with the --check fixtures already swept, so it is the
      cleanest test of whether the class generalises at all. If hooks come back
      clean, that is evidence about the other three surfaces worth recording
      before spending time on them.
