  title: A provider 429 "Free usage limit reached" surfaced as "TLS handshake failed" and the lane kept going; report it, stop cleanly, and record Retry-After so no host retries early
  context: 'On 2026-11-01 02:55:15Z opencode 1.19.5 got `< 429 Too Many Requests`, `Retry-After: 78443`, body `Free usage limit reached`; earlier the same night the agent died four times on `EPROTO: The TLS handshake failed`, which a packet capture showed was the edge ending the session with a TLS alert. The lane reported neither as a usage limit, and later lanes kept retrying the same provider.'
  exit_criteria:
  - 'The forge or lane wrapper recognises a provider 429 (and the usage-limit body) and prints `provider usage limit reached, retry after <UTC time>`, then stops the lane cleanly with a distinct verdict.'
  - 'The retry-after deadline is written as a plan event (or the fleet message store) so every host can read it.'
  - 'A launch before the deadline refuses with the same message instead of calling the provider.'
  verifiable_closure: 'A fixture that feeds the wrapper a recorded 429 response with `Retry-After` (no network) and asserts the `provider usage limit reached, retry after <time>` line, the clean stop verdict, the recorded deadline, and that a second launch before the deadline refuses without a request. It fails on today''s tree (the wrapper has no such handling) and passes after.'
  unscoreable: 'unpinnable-until-the-guard-exists: the fixture is written with the fix and named by a litmus in the same commit (1136-n8sh).'
  next_action: 'Find where the lane wrapper reads the agent''s exit (images/default/entrypoint-forge-opencode.sh via harness-supervisor, and the host lane in tillandsias-headless); add the 429 detection with a recorded-response fixture first.'
