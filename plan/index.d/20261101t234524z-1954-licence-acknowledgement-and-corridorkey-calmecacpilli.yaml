  blocked_by: [1954-dvz9]
  title: "CorridorKey 2.0 as a studio tool: wrap infer.py (video or frames in; alpha, fg and cutout out, with provenance); user-fetched only, behind the licence acknowledgement flow"
  context: |
    The operator names it the current reference ML green- and blue-screen keyer: github.com/nikopueringer/CorridorKey2.0.
    How it runs:
      - CLI: infer.py --input <video|frame dir> --outputs alpha,fg,checker,cutout [--output_format exr] [--low_vram]
      - NVIDIA CUDA only: RTX 30 series or newer, 4-6 GB VRAM, torch 2.9.1 cu128.
      - About 5 GB of weights from huggingface.co/nikopueringer/CorridorKey2.0, plus three foundation models: C-RADIOv4 (NVIDIA Open Model License), MoGe (MIT), RVM (CC-BY-4.0).
    Licence: "CORRIDOR KEY LICENCE v2.0", a CC BY-NC-SA 4.0 variant.
      - Allowed: commercial PROJECT use; the outputs belong to the user.
      - Forbidden: redistribution or repackaging as a product; a paid inference API.
      - Integration into commercial software needs Corridor's written agreement.
      - Conditions: share-alike on modifications; the attribution "CorridorKey"; organisations with over $20M revenue need seats.
    There is no upstream ComfyUI node.
  exit_criteria:
  - a studio job wraps infer.py and records provenance (input hashes, weight hashes, licence ids, CLI arguments)
  - the weights and the three foundation models are fetched on the user's machine only after the 1954-dvz9 acknowledgement, and are never bundled
  - OPERATOR RULING recorded on whether Tillandsias wrapping it counts as "integration into commercial software" (clause 2d), and if so, Corridor's written agreement is on file before any automatic wiring ships
  unscoreable: design-packet — blocked on 1954-dvz9 and on an operator ruling about clause 2d; the implementation row it files carries its own closure.
  next_action: OPERATOR rules on clause 2d (likely to need Corridor's written OK). After that and 1954-dvz9, design the studio job.
