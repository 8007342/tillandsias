- packet_id: corridorkey-2-studio-tool-ml-green-blue-screen-keyer-user-fetched-behind-the-licence-acknowledgement-flow
  order: 1954-xy5m
  status: blocked
  kind: design
  priority: p3
  desired_release: v0.5
  pickup_role: any
  capability_tags: [studio, image-generation, video, licences, cuda]
  estimated_hours: 6
