- packet_id: licence-acknowledgement-flow-user-accepts-quoted-restrictions-durably-before-any-non-permissive-model-or-tool-is-fetched
  order: 1954-dvz9
  status: ready
  kind: design
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [licences, image-generation, consent, ux]
  estimated_hours: 8
  related: [1954-gdi6, 1935-k2ib, 1921-h4gv, 1874-p8w7, 1954-xy5m]
  title: "Licence acknowledgement: before fetching a model or tool whose licence is outside the permissive allowlist, the user reads the licence id and its restrictions quoted verbatim and accepts; the acceptance is stored durably and the licence-register gate checks it"
  context: |
    OPERATOR DIRECTION, verbatim, relayed by the coordinator on 2026-11-01: "As per the licenses we'll have you review how those align with our user approval process, we can prompt the user to approve the usage of certain licenses, and their restrictions. Users might be ok with them, we just need to make sure they're acknowledged durably."
    Today images/models/licence-register.tsv admits only PERMISSIVE_LICENCES, and NEVER_SHIPPABLE refuses outright. Under this design a restricted licence is not refused. The user acknowledges it, and the user's own machine fetches the weights. Tillandsias never bundles or redistributes restricted weights.
  exit_criteria:
  - before any fetch of a non-permissive artefact, the user sees the licence id and its restrictions quoted verbatim, and accepts or declines
  - the acceptance is stored durably with the licence id, the licence version or hash, the artefact (repo, revision, file, sha256), who accepted, when, the scope, and the expiry under the standing-approvals ruling (session or TTL; held until expiry is enforced)
  - the licence-register gate (imagegen_models::register_admits and check-model-licence-register.lua) admits a non-permissive row only when a matching acknowledgement exists
  - NEVER_SHIPPABLE becomes "needs acknowledgement", except where the terms forbid the use outright
  - FIXTURE red on today's tree: a row under a non-commercial licence is fetchable after a recorded acknowledgement and refused without one
  unscoreable: unpinnable-until-the-guard-exists — the deliverable includes a cargo test in tillandsias-headless (name it register_admits_nc_row_only_with_recorded_acknowledgement) written red first, in the same commit as the gate change.
  next_action: Design the acknowledgement record and its store, then reconcile it with the standing-approvals ruling on 1935-k2ib. The first record is the operator's standing approval noted on this row.
  provenance: operator direction relayed by the coordinator, 2026-11-01.
