      host: macuahuitl
      summary: >
        METHOD CAPTURED FROM macuahuitl-tillandsias-forge BEFORE ITS CONTAINER DIES — not yet run, and the host is paused for an unrelated disk condition. TWO CORRECTIONS TO MY OWN MEASUREMENT FIRST. (1) I measured the ~200ms load constant as an aggregate and framed this packet as 'parse the ledger ONCE'. The forge decomposed it on the same host: ~2ms process startup, ~47ms raw YAML parse of the 3.9MB base, ~150ms FOLDING FRAGMENTS (110 of them). The fold is 75 percent; the base parse my framing points at is under a quarter. (2) That favours a pre-folded SNAPSHOT over a resident server, and more strongly than it appears: a snapshot is parsed but not folded, so a reader pays ~47ms instead of ~200ms — about 61 remaining loads x 153ms = 9.3s per gate here and proportionally more on the N150 — and it needs NO new machinery, since every subcommand already accepts --index and 42 gate calls already use it against fixtures. A serialized fold cache would recover the remaining 47ms at the cost of a new on-disk format: the smaller half for the larger commitment, so not the first move. THE CORRECTNESS OBJECTION IS THE PACKET'S REAL PROBLEM, NOT A CAVEAT: THE GATE WRITES TO THE LEDGER DURING ITSELF. My instrumented count recorded 3 append-event, 1 set-field and 1 compact in a single --check, and compact rewrites the base AND deletes fragments — so a snapshot taken at gate start describes a ledger that no longer exists by the end. The failure is a DECOY: a stale snapshot makes a BROKEN tree PASS, which is strictly worse than a slow gate. Criterion 3's mutation control is therefore amended: it must be run with the snapshot DELIBERATELY STALE as well as fresh, or it proves only the happy path. THE CHEAPER LEVER, and it may retire the architecture question entirely: if fold cost is linear in uncompacted fragment count (~1.4ms each at 110 fragments), then compaction CADENCE is a fleet-wide performance control on every ledger read, with no new code — 'compact' already exists and is already sanctioned as routine GC that is 'slower, never wrong'. The forge labelled the linearity an INFERENCE from one host at one fragment count, not a measurement. EXPERIMENT, verbatim, to be run when the host is healthy: build 5 ledger copies at fragment counts 0/25/50/75/110 (base plus a SUBSET of plan/index.d/*.yaml), time '--index <copy>/index.yaml status <id>' 3 reps each, DISCARD the first rep per config so page-cache warmth is not the variable. Two details decide whether the result means anything: use a BASE-RESIDENT packet id, because subsetting fragments changes what the fold contains and an id living only in a dropped fragment would fail for the wrong reason; and copy the base with 'cp -a --reflink=auto' so the experiment's own disk cost is near zero (the 964-js34 technique, applied to its sibling). FALSIFIABLE PREDICTION: load(N) ~= 47ms + 1.4ms*N, with the 0-fragment case as the control landing near the raw base parse of ~47ms. If a zero-fragment load is NOT ~47-50ms the linear model is WRONG and the fold does something other than per-fragment work — that outcome is worth as much as confirmation, because it would mean compaction is not the lever. Capture the cost of one 'compact' in the same run: cheap compaction can be frequent and this becomes a cadence question; expensive compaction is a cost to weigh against the saving.
