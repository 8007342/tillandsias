      summary: |
        THE BUNDLE IS OFF /tmp. ca-path.txt now declares
        `${HOME}/.local/state/tillandsias/ca` and both readers expand it.

        THE DECISION WAS FORCED BY MEASUREMENT, not chosen. Guest
        (macbook-macos, real Mac VM): /var/lib/tillandsias-ca works — key
        present, 600, owner root, survives reboot — BECAUSE the guest runs as
        root. Host (yoga): uid 1000, rootless, /var/lib not writable at all;
        $HOME/.local/state is. /var/lib fails on a rootless host for exactly the
        reason it succeeds in the guest, and /tmp works everywhere and is the
        bug. HOME-relative was the only candidate either lane permitted, and it
        is why the manifest had to become a TEMPLATE rather than take a new
        literal.

        TWO EXPANDERS IS A NEW WAY FOR ONE DECLARATION TO MEAN TWO THINGS, which
        is the defect 998-qrwu removed — so the agreement is PINNED rather than
        assumed. `rust_and_shell_expand_to_the_same_path` runs the real
        scripts/lib-ca-path.sh in a subprocess and compares its answer with
        ca_path::ca_dir(), rather than reimplementing either side: a second
        implementation of the comparison would have the same failure mode as a
        second declaration.

        BOTH EXPANDERS WERE BROKEN AND MY OWN TESTS CAUGHT THEM BEFORE THE GATE.
        The Rust `.replace()` had lost its pattern to a bad edit and became
        `replace("", &home)`, which substitutes at EVERY position — the test
        printed a path with HOME interpolated between every character. The shell
        reader did not expand at all and returned the literal `${HOME}/...`,
        which would have created a directory named `${HOME}` — silently, and
        durably, since the whole point of the change is that this location
        persists. Neither would have failed to compile.

        VERIFIED: core ca_path 4/4 including the cross-runtime agreement,
        macos-tray 44/44, workspace compiles, gate green. The shell readers
        answer correctly against the new path, and check-ca-bind-migration.sh
        reports ok:ca-bind-current:0 — this host has no container binding the
        old path, so nothing needs recreating here.

        ALSO FIXED, because it went stale the moment the value moved: the
        consistency checker's own prose said "/tmp is volatile by design" while
        naming the new path. Rewritten to describe the actual condition, with
        the /tmp history kept as history.

        NOT CLAIMED, AND IT IS THE OPEN ITEM: macbook verified the interpolation
        against /tmp and /var/lib, NOT against this value. They offered a
        five-minute re-run now the harness exists, and it should happen before
        this row closes — the guest expands ${HOME} to /root, which I have no
        way to exercise. And no host has yet done the closure as written: remove
        the old directory, restart, and observe the proxy reach Running without
        hand-repair. This host cannot: its proxy container is absent entirely
        and cannot be recreated from this checkout (--github-login needs a
        terminal, --list-cloud-projects is feature-gated out).
