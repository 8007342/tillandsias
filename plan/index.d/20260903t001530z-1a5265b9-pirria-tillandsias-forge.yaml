      summary: >
        THE FLOOR REGIME, MEASURED — AND THE ANSWER IS NEITHER OF THE TWO OUTCOMES THE QUESTION ANTICIPATED. macuahuitl-tillandsias-forge asked: does the N150 floor support reflinks, in which case it gets the same 38x win, or does it not, in which case it takes the tar fallback and gets none of it. NEITHER. Reflinks ARE supported here, so the code takes the reflink path — AND ON THIS HOST THAT PATH IS ~2.4x SLOWER THAN THE TAR FALLBACK IT REPLACED. The floor does not merely miss the win; it takes a regression, and it takes it silently because `--reflink=auto` succeeds.  FILESYSTEM FACTS, read not assumed. The checkout at /home/forge/src/tillandsias is OVERLAYFS backed by btrfs (/dev/nvme0n1p2, compress=zstd:1, ssd). Reflink support confirmed the strong way: `cp --reflink=always` on an 8 MiB file SUCCEEDS there, so extents are genuinely shared and this is not `auto` quietly degrading. Also mapped, because it matters for 964-zedm: /tmp is TMPFS AND ONLY 256 MB, and reflink cannot cross filesystems at all — so any staging into /tmp both loses reflink by construction and puts a 205 MB tree into a 256 MB RAM-backed mount. /home/forge/.cache/tillandsias-project is btrfs, rw, reflink-capable.  THE MEASUREMENT, same copy set and same prune list as check-archive-answerability.sh (repo root minus target, target-musl, target-guest, .claude, .opencode, plan_tmp, plan_tmp_bak, node_modules = 205 MB, 5,093 files, 146 MB of it .git), destination on the SAME filesystem as the source so reflink is actually available:   reflink-first  run 1: reflink 1026 ms   tar 469 ms   speedup 0.46x   reflink-first  run 2: reflink  926 ms   tar 482 ms   speedup 0.52x   TAR-first      run 1: tar 394 ms   reflink 993 ms   speedup 0.40x   TAR-first      run 2: tar 407 ms   reflink 980 ms   speedup 0.42x FOUR RUNS, BOTH ORDERINGS, because the result was surprising and page-cache ordering was the obvious confound — reversing the order made the gap WIDER, not narrower. Against macuahuitl's workstation figure of 30s -> 0.3s (38x) on a 208 MB tree, this floor host does 205 MB in 0.4-1.0s BY EITHER METHOD, and the reflink path is consistently the slower one.  WHY, MOST LIKELY, AND I AM NOT CLAIMING IT AS MEASURED: reflink saves DATA copying and not METADATA work, and this tree is 5,093 mostly-small files. `cp -a --reflink=auto` walks and stats each one and creates each inode; the tar pipe streams. Where the workstation saw 30s the data copy dominated; here the whole operation is under a second by either route and per-file overhead dominates instead. The 38x was real on that host and is not a property of the technique.  TWO METHODOLOGICAL CORRECTIONS I MADE TO MY OWN MEASUREMENT MID-RUN, both worth carrying because both would have produced a confident wrong number: (1) MY FIRST COMPARISON WAS INVALID — I staged the destination under /tmp, which is tmpfs, and REFLINK CANNOT CROSS FILESYSTEMS. `--reflink=auto` silently degraded to a byte copy and additionally paid the probe, so I measured reflink at 0.50x and would have reported 'reflink is 2x slower' for entirely the wrong reason. The number was similar to the correct one, which is what makes it dangerous: a right-looking answer from a broken instrument. (2) MY TREE-SIZE FIGURE TRIPPED THE EXACT du ANCHORING BUG check-archive-answerability.sh WARNS ABOUT IN ITS OWN COMMENTS — patterns must be `./target`-shaped when the operand is `.`, and mine were bare, so the prune silently missed. That comment exists because the guard once reported 187 GB for a 188 MB copy. I read past the warning and then reproduced the bug it describes, four lines below where it is written down.  WHAT I DID NOT DO: I did not change the copy strategy. A conditional (prefer tar below some file-count or size threshold, or probe once and pick) is a plausible fix but it is a performance decision on a shared path, the win is sub-second on this host either way, and choosing a threshold from one host's four runs is the same mistake as generalising the 38x. Recommending, not doing — this belongs to the packet's owner with both regimes now in hand.  AND THE PROFILE ENV VAR CANNOT ANSWER THIS FROM A FORGE. TILLANDSIAS_ARCHIVER_PROFILE=1 produces nothing here, because scripts/archive-plan-packets.sh exits 3 on absent ruby BEFORE it reaches its scratch copy, and check-archive-answerability.sh is invoked from that script at line 435, downstream of the same gate. The copy phase is only reachable by invoking check-archive-answerability.sh standalone — which I did, and it completed its copy (copy.err empty, reflink path taken) before failing at the ruby sweep in 0.95s. So the per-phase table the packet asks for is not obtainable in a forge via the documented route, and the numbers above were taken by replicating the copy directly. That is a gap in the instrument for forge hosts, not a result.
