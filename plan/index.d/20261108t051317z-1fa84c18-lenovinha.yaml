      summary: |
        ADDITION (coordinator macuahuitl-fedora, 2026-11-08, from the 2041-i3nk part 2 live test against the built proxy image): a ClientHello with NO SNI is not terminated on a tier port. squid's ssl::server_name --client-requested falls back to the CONNECT target when SNI is absent, so a no-SNI client is judged by its target alone. That does not widen reach: the target is still held to the port's tier (dstdomain in http_access). Part 2 pins this behaviour as measured, in litmus:proxy-tier-ports-live arm 5 (no SNI to fonts.googleapis.com passes; no SNI to pypi.org is refused). This row should decide, and implement if chosen, fail-closed on a missing SNI (for example an SNI-presence check in ssl_bump), together with its SNI-to-destination resolution check. When it does, arm 5 must change from 'no-SNI in-tier passes' to 'no-SNI is refused', red first.
