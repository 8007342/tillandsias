    value: "THE OUTPUT, on a host with NO setsid: `./build.sh --preflight` RUNS the\ndeciders and reports a verdict about the tree. Not ran=0.\n\nEither shape is acceptable and the row does not prejudge which:\n  * the guard runs without session isolation and the verdict SAYS SO, so\n    no reader mistakes a degraded run for the isolated one; or\n  * each guard that genuinely needs isolation refuses BY NAME, and the\n    rest run.\nWhat is NOT acceptable is 108 identical launch failures reported as one\nrefusal, which says nothing about the tree and cannot be told apart from a\ntree that is actually broken.\n\nNEGATIVE CONTROL: on a host WITH setsid the run is unchanged — same guards,\nsame isolation, same verdicts. A fix that degrades the Linux path to make\nthe macOS path work would trade a loud refusal for a quiet weakening of the\nproperty the comment at build.sh:295-306 was written to protect.\n\n\n[2026-09-22T05:40:31Z macos] \nDELIVERED ON work/1352-vmbc, PR #150. THE OUTPUT, same command both sides:\n\n  BEFORE  refused:preflight:ran=0  skipped=3  failed=108 wall=26s\n  AFTER   refused:preflight:ran=94 skipped=16 failed=1  isolation=none-no-setsid\n\nran=0 -> ran=94. The step now answers something about the tree, and names the\nmode it ran in. Both summary lines carry `isolation=`, because pinning only the\nrefusal line would let a green run hide a degraded one.\n\nTHE LINUX NEGATIVE CONTROL IS A SOURCE-READ, NOT A MEASUREMENT, and this row\ndoes not claim otherwise. With setsid present the probe yields the identical\nexec, so the isolated path is unchanged by inspection — but this host cannot run\nthe Linux regime, and the closure asks for both. A Linux run must confirm\n`isolation=session` with unchanged ran/skipped counts before this is proven both\nways.\n\nscripts/test-preflight-setsid-probe.sh, ok:preflight-setsid-probe:4, wired as\ngate step 420-1352-vmbc because check-added-test-is-referenced named it — a test\nnothing can fail because of is not done (1325-ygq5). Four mutations, each redding\nits own arm.\n\nARM 1's FIRST DRAFT COULD NOT HAVE FAILED FOR THE RIGHT REASON, and that is\nrecorded in the fixture rather than quietly fixed: it grepped for\n`command -v setsid`, which this same change had just added to the SUMMARY line,\nso deleting the probe left it green. It now keys on the assignment only the probe\nproduces. Second instance on this host of a guard whose needle matched the wrong\noccurrence.\n\nA SECOND DEFECT FOUND AND DELIBERATELY NOT FIXED HERE: the remaining failed=1 on\nmacOS is check-gate-memory-floor, which prints\n`could-not-run:gate-memory:no-meminfo:... (nothing is asserted about its memory)`\nand is scored a REFUSAL. The preflight runner already carries the rule — a named\nskip is not a failure, whatever it exits with (1273-4mak, citing 1309-fhxb) — but\nthat decider spells its could-not-run with a word the scorer does not recognise.\nThe same shape as 1330-i4hu, on a third instrument. Reported to the coordinator\nrather than folded in: changing scoring vocabulary is a fleet-wide call, and this\nrow is about setsid."
