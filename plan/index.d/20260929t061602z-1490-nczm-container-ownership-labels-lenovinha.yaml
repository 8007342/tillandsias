    title: |
      Containers, volumes and networks carry io.tillandsias.owner / version / role labels, and is_stack_managed_name, reset_guest_scope, shutdown_escalation_targets and the shutdown sweep decide by label with the name prefix as a logged fallback; a toolbox-labelled object is never owned
    context: |
      Today only IMAGES are labelled (io.tillandsias.image.* in
      crates/tillandsias-core/src/image_builder.rs:27-28,154,162, applied at
      main.rs:9807-9809). The one container label in the tree is the proxy's
      tillandsias.ca-generation (main.rs:3712-3713, order 472) — a CA name,
      not an owner. Every container/volume/network decision is a name test:
      is_stack_managed_name (main.rs:7497; narrowed by 936-kdev after the
      builder toolbox was killed at install-validation), shutdown_escalation_targets
      (:7478), the list_containers("tillandsias-") sweeps in
      graceful_shutdown_async (:19692), and reset_guest_scope (:10029 — the
      bare "tillandsias-" prefix, which STILL matches tillandsias-builder and
      tillandsias-nix). MEASURED 2026-09-29 on lenovinha: the Linux SOFT
      reset's podman system reset destroyed both toolboxes and every forge.
      Adoption after a hot upgrade (1490-52m5) and a safe stale cleanup
      (1490-pguh) both need a label to key on, so this is the first slice.
      Labels: io.tillandsias.owner=<installation-uuid-v1>,
      io.tillandsias.version=<VERSION>, io.tillandsias.role=<forge|git|vault|
      proxy|router|nix-cache|inference|browser|ssh-sidecar|observatorium|
      status-check|web>. Run-arg builders to touch: forge main.rs:7986, proxy
      :3678, git :4816, inference :5780, router :6073, nix-cache :6354, catalog
      :3632, ssh sidecar :12751, web :19873, vault_bootstrap.rs, mirror
      remote_projects.rs:291,761. An object carrying
      com.github.containers.toolbox is never owned even with our label.
      Design D2 in openspec/changes/hot-upgrade-live-stack/design.md.
