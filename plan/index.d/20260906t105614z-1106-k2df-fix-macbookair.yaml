        THE SIGNAL WAS REPLACED, NOT REINTERPRETED. .permissions.push from
        GET /repos/{owner}/{repo} reports the AUTHENTICATED USER'S ROLE on the
        repository. It is not a property of the token. A repo owner holding a
        fine-grained PAT with no Contents:write is still an admin of their own
        repository, so the field answers true and the lane seeds a credential
        that is denied at push time. The value is TRUE about the artefact (this
        user may push) and FALSE about the property it was read as (this token
        may push), which is why no reinterpretation of it helps.

