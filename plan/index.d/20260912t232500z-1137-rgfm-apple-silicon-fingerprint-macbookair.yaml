    title: |
      every Apple silicon Mac in the fleet produces byte-identical cpu and gpu fingerprint strings, so hardware_fingerprint cannot tell an M1 from an M5 and capability-matrix --by-hardware can merge two machines it never measured
    context: |
      MEASURED on tlatoanis-macbook-air (Apple M5, macOS 25.6.0) 2026-09-12,
      while closing 803-r8u4 and 803-rbqf in the same file. Not a defect either
      of those packets covers, so it is filed rather than folded into them.

      `enumerate_cpu`'s macOS arm hard-codes a FAMILY name:
          cpu_name = "Apple Silicon CPU".to_string();
      and the macOS arm of `enumerate_gpus` hard-codes "Apple Metal GPU". So
      `hardware_fingerprint` — which builds
          cpu:{vendor}/{name}/{physical}c{logical}t
          gpu:{vendor}/{name}
      — receives `cpu:apple/Apple Silicon CPU/10c10t` and
      `gpu:apple/Apple Metal GPU` on THIS machine and the byte-identical pair
      on every other Apple silicon Mac with the same core count. The whole
      fingerprint then reduces to core count plus RAM class.

      LIVE on this host: fingerprint `hw2-d1ec0bba772d4bda`, cpu name
      'Apple Silicon CPU'. `sysctl -n machdep.cpu.brand_string` answers
      `Apple M5` on the same machine, in the same process's reach. The real
      part number is one syscall away and is being discarded.

      WHY THE EXISTING GUARD DOES NOT CATCH IT, which is the part worth
      knowing. `hardware_fingerprint` already refuses placeholders:
          d.name != "Host CPU" && d.name != "unknown"
      That list was written from the WINDOWS defect (805-r98w), where the arm
      fell through and emitted "Host CPU". "Apple Silicon CPU" is a different
      placeholder, so it passes a check whose whole purpose is to catch
      placeholders. A deny-list of the placeholders someone already found
      inherits every placeholder they had not yet found — the guard is not
      weak, it is scoped to one host's history.

      THE CONSEQUENCE IS NOT COSMETIC. `capability-matrix --by-hardware`
      (805-r98w) re-keys the fleet matrix on (fingerprint, substrate) and
      reports control=yes|no per hardware GROUP. Two different Macs that share
      a core count and a RAM class land in ONE group, and a measurement taken
      on one is then read as covering the other. This is precisely the failure
      808-43mw names for `kernel_release` — "two WSL2 guests share
      6.18.33.2-microsoft-standard-WSL2 exactly; keying on it would silently
      merge two machines' rows" — recurring on a different field. The fleet has
      at least two Apple silicon hosts today (macbookair, macneo), so the
      collision is reachable now, not hypothetically.

      ONE THING GOT BETTER BY ACCIDENT and should not be mistaken for a fix:
      803-r8u4 added `system_ram_gb` to the macOS arm, so `ram_class` now
      contributes a discriminator that was absent before (it was None, and the
      RAM component was dropped). That narrows the collision; it does not close
      it. Two 16 GiB 10-core Macs of different generations still collide.
    deliverable: |
      The macOS arm reports the real part. `machdep.cpu.brand_string` for the
      CPU name; for the GPU, a real device name rather than the "Apple Metal
      GPU" literal (Metal's device name, or the brand string as the honest
      proxy on a unified part). A query that FAILS must leave the existing
      literal rather than invent one — the current string is useless for
      identity but is not a lie about capability, and the absent case must stay
      distinguishable.

      Extend `hardware_fingerprint`'s placeholder check from a deny-list of
      known-bad names to something that cannot silently acquire a third
      placeholder. State the rule in the comment either way, because the next
      platform arm will face the same choice.
    next_action: >
      Read machdep.cpu.brand_string in enumerate_cpu's macOS arm and assert the
      reported name against it in a cfg(macos) test, with a mutation arm
      proving the test reds on the reverted literal. Then decide the GPU name
      separately — it is the harder half, because Metal device naming needs a
      framework call rather than a sysctl, and a sysctl-derived proxy may be
      the right trade. Say which was chosen and why.
