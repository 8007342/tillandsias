    title: |
      A Codex forge lane gets no host-browser MCP tools (no publish_local, service_status or browser.open) while Claude lanes do; every agent harness (Claude, Codex, OpenCode, Antigravity) must expose them
    context: |
      Found by a Codex forge on work/1661-vckd. Its notes are in plan/issues/observatorium-forge-web-stack-gaps-2026-10-13.md on that branch. The startup context prescribes publish_local, but the Codex tool catalog had none of the host-browser tools.
      Where registration lives today (images/default/config-overlay):
      - claude/mcp.json and opencode/config.json declare host-browser -> mcp/host-browser.sh.
      - codex/register-experts.sh LISTS host-browser alongside forge-plan and project-info, registering through the codex CLI, yet the lane saw none of them. So the defect is in the registration reaching the lane (when it runs, which CODEX_HOME it writes, or a failed add), not a missing line.
      - Antigravity's registration was not located while filing.
    exit_criteria:
