  - packet_id: cloud-only-tray-ux-ephemeral-checkouts
    order: 687-wrsa
    status: ready
    desired_release: v0.5
    priority: p1
    title: "OPERATOR UX RULING: the tray offers ONLY cloud projects — host-local checkouts are removed entirely; every project open is a fresh ephemeral checkout from the git-mirror"
    kind: ux+infra
    deliverable: rewritten simplified-tray-ux spec + rebound litmus + shared launcher contract; local-home menu and tray-managed host checkout path deleted
    depends_on: []
    pickup_role: linux
    capability_tags: [tray, ux, git-mirror, ephemeral, spec, cross-platform]
    context: >
      OPERATOR DIRECTIVE (The Tlatoani, interactive, 2026-08-11). The
      tray-managed host checkout (formerly ~/src/<project>) kept biting the
      fleet — host credential collisions, stale projects (the 12-day-stale
      expert clone this morning was one), and painful host/guest checkout
      handling on Windows and macOS. It is REMOVED ENTIRELY. Two checkout
      classes now exist and must never be conflated: DEVELOPMENT CHECKOUTS
      (bare metal, e.g. the loop hosts' working copies — sacred, not touched
      by this work) and TILLANDSIAS-UX-INITIATED CHECKOUTS, which go straight
      into the containers of the ephemeral idempotent stack and never touch
      the host filesystem. Menu becomes exactly five items: status,
      "<cloud emoji>/src/", separator, version+attribution, exit. CONTRACT
      (operator's words distilled): clicking a project under cloud /src/
      ensures the project's git-mirror, then a FRESH checkout from the
      mirror's read path into an ephemeral lane plus the selected harness
      (or a Terminal via the project's Maintenance entry); agents run, commit,
      push to the mirror, exit, and everything is gone for real. Prior lane
      state is discarded ONLY when detectably dead or corrupted — otherwise
      lanes COEXIST: multiple harnesses per project and multiple instances of
      the SAME harness concurrently are valid, common scenarios. Cache
      overlay: project checkouts move to the VOLATILE bucket (fresh checkout
      every launch, same volatility window as harnesses); the overlay saves
      bandwidth only for stable/heavy assets — ephemerality and idempotency
      outrank bandwidth. Clone source ruled: the git-mirror (enclave
      anonymous read path), NEVER direct-from-GitHub (which would re-plant a
      host credential, the collision class being deleted); the mirror remains
      the sole vault-brokered sync point to GitHub. ARCHITECTURE VALIDATION
      (operator asked): the mirror stack was built for this — one mirror per
      project (order 443 decision), the SSH-CA design (order 322 doc)
      assumes concurrent lanes per project (per-lane signing sidecars,
      lane-keyed attribution ledger, negative-matrix row M0 exercises two
      projects' lanes concurrently), and the known concurrency gap is
      already filed as p0 610-txvr (pre-receive relay ref-lock races) — the
      scenario is intended and supported, with 610-txvr the one open hole.
      This ruling OBSOLETES 613-uy82 (NanoClawV2 spec-runtime drift): the
      leaf set is redefined wholesale under UX curation governance by this
      packet's spec rewrite. Platform parity is mandatory 1:1 — children
      687-ipv4 (linux), 687-uvy2 (windows), 687-b3yy (macos).
    exit_criteria:
      - openspec simplified-tray-ux spec is rewritten to the five-item menu (status, cloud /src/, separator, version+attribution, exit) with the local-home menu and every tray-managed host-checkout requirement REMOVED; bound litmus re-pinned to the new leaf set; 613-uy82 recorded obsoleted-by-successor
      - the shared launcher path implements ensure-mirror -> fresh clone from the mirror read path -> ephemeral lane + selected harness (or Maintenance Terminal), with NO write to the host filesystem for project content on any platform lane
      - concurrent-lane contract landed and tested - N lanes per project coexist including N instances of the same harness; lane teardown discards only lanes detected dead or corrupted, and the detection predicate is stated and script-checkable, never a guess
      - project checkouts are classified VOLATILE in the cache overlay policy (fresh every launch; documented beside the harness volatility window), and no code path can resurrect a prior checkout into a new lane
      - the tray-managed host checkout code path (formerly materializing ~/src/<project>) is deleted, not gated off - grep-level absence proven, and a litmus asserts no tray flow writes project content under $HOME
