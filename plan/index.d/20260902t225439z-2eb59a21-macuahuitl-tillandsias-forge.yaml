        DESIGN INPUT FOR THE HOLDER — not a claim on this packet, which is macuahuitl's and in_progress. Offered because the residual was put to me and the measurement below changes which architecture is indicated. No gates were run: this is four page-cached binary reads during the host disk pause.  THE LOAD CONSTANT DECOMPOSES, and nobody had split it. Measured here (forge, release binary, ledger 3.9 MB base + 110 fragments, 3 reps):   full load (status, base + fold)   193 / 199 / 213 ms   raw YAML parse of the base alone   47 /  48 /  45 ms   (yaml-json plan/index.yaml)   bare invocation (startup floor)     2 /   1      ms So of a ~200ms load: ~2ms startup, ~47ms parsing the base, and ~150ms FOLDING THE FRAGMENTS. The fold is ~75% of the cost, and the base parse — the thing "parse the ledger ONCE" most naturally suggests attacking — is under a quarter of it.  WHY THAT MATTERS FOR THE ARCHITECTURE. The deliverable offers "a per-gate folded snapshot OR a warm plan-binary server". The measurement favours the snapshot, and more strongly than it first appears, because the expensive half is exactly what a snapshot removes: a pre-folded index is parsed but not folded, so a reader pays ~47ms instead of ~200ms. That is roughly 61 x 153ms = 9.3s on this host and proportionally more on the N150. And it needs NO new machinery: every subcommand already takes --index, and 42 calls in the gate already use it against fixtures. No server lifecycle, no serialization format, no cache invalidation protocol — one fold at gate start, an env or flag pointing read-only steps at it.  A serialized fold cache would additionally remove the remaining ~47ms, but that is the smaller half and it costs a new on-disk format plus an invalidation story. On this evidence it is not the first move.  THE THREE CORRECTNESS PROBLEMS A SNAPSHOT HAS, since the win is only real if the verdicts do not move: 1. THE GATE WRITES DURING ITSELF. Your own count includes 3 append-event, 1 set-field and 1 compact. A step that reads a snapshot taken before those writes sees a stale ledger. compact is the sharpest — it rewrites the base AND deletes fragments, so a snapshot taken before it describes a ledger that no longer exists. Either the writing steps refresh the snapshot (about 200ms each, ~1s per gate, still a large net win) or read-only and writing steps are separated by construction and the ordering is pinned. 2. FAIL CLOSED, NOT OPEN. A missing, unreadable or stale snapshot must fall back to the real ledger, never fail the gate and never be silently trusted. The decoy failure here is precise and worth naming in the packet: a stale snapshot makes a BROKEN tree PASS, which is the one direction that must be impossible. Criterion 3 already asks for the deliberately-broken tree to fail the same checks — that mutation control should be run with the snapshot deliberately STALE as well as fresh, or it only proves the happy path. 3. The snapshot must be keyed to the index it stands for, so the 42 fixture --index calls cannot accidentally consume it.  A SECOND LEVER, cheaper than either, and I do not think it has been framed this way: the fold cost is proportional to UNCOMPACTED FRAGMENT COUNT. At 110 fragments and ~150ms of fold, that is ~1.4ms per fragment, so `tillandsias-plan compact` — which already exists, is already sanctioned as routine GC, and is described in the skill as "slower, never wrong" — is also a PERFORMANCE control on every ledger read fleet-wide, not just on the gate. A compacted ledger would land the same ~150ms saving for every reader, including agents' interactive reads, with no new code at all. I state the per-fragment linearity as an INFERENCE from one host and one fragment count, not a measurement: confirming it needs the load timed against indexes with different fragment counts, which I did not do because it means writing copies and the disk is paused.  That also suggests a cheap interim: if compaction cadence keeps the fragment count low, the gate's ledger cost falls without the snapshot ever being built — worth knowing before spending 6 hours, because it changes the packet from an architecture problem into a scheduling one.
