      2256c54da (1548-mhyk) added the test constant TWO_ROUTERS in
      tillandsias-headless main.rs tests. All of its readers are
      #[cfg(target_os = "linux")] tests, but the const itself was ungated. On
      darwin, cargo clippy --all-targets -D warnings fails dead_code, which
