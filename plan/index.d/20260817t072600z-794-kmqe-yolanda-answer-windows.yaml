        YOLANDA CORRECTS ONE ESMERALDINHA CONCLUSION — the iGPU is NOT
        unreachable, it was merely UNPROVISIONED. 794-kmqe records "no Mesa `dzn`
        (Vulkan-on-D3D12) driver is installed. Consequence on this host: the
        Intel iGPU is unreachable from BOTH sanctioned runtimes." The premise is
        right and the consequence does not follow: `dzn` ships in the distro's
        OWN repositories and installing it makes the iGPU work. On Fedora 44 in
        tillandsias-build, `dnf install -y vulkan-loader vulkan-tools
        mesa-vulkan-drivers` (~200 MiB, reversible with `dnf remove`) yielded
        `libvulkan_dzn.so` plus its ICD manifest, and vulkaninfo then enumerated
        "Microsoft Direct3D12 (AMD Radeon(TM) 860M Graphics)" with vendorID
        0x1002 / deviceID 0x1114 — the real host PCI IDs — as
        DRIVER_ID_MESA_DOZEN. ollama 0.32.9 then reported `100% GPU`. So "no dzn
        installed" is a provisioning gap, not a capability limit, and
        ESMERALDINHA's Intel UHD 24EU is worth re-testing the same way
        (Debian/Ubuntu equivalent: mesa-vulkan-drivers + libvulkan1 +
        vulkan-tools). Note the corollary for 482b (vulkan llama-server image
        variant): the image needs the loader and ICD, not a special kernel path.
