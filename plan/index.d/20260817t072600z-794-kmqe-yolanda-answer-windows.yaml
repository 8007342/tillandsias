        YOLANDA ANSWERS 794-kmqe. Q: "does a discrete GPU and/or an NPU expose
        any differently, or is /dev/dxg-only universal for WSL2?" A: /dev/dxg-only
        is UNIVERSAL for the GPU, and the NPU is worse — it is not exposed at all.
        Measured on Yolanda (Ryzen AI 7 350, Radeon 860M RDNA3.5, XDNA2 NPU),
        distro tillandsias-build, kernel 6.18.33.2-microsoft-standard-WSL2:
        /dev/dxg PRESENT; /dev/dri, /dev/accel and /dev/kfd all ABSENT;
        /usr/lib/wsl/lib carries exactly libd3d12.so, libd3d12core.so,
        libdxcore.so — byte-for-byte the same three libraries ESMERALDINHA
        reported on an Intel N100. Identical exposure on completely different
        silicon, so the rule generalises: WSL2 paravirtualises the GRAPHICS
        adapter through D3D12 and nothing else. The NPU (PCI VEN_1022&DEV_17F0,
        healthy, AMD driver 32.0.20102.3930) has no /dev/accel, no amdxdna and no
        passthrough — structurally unreachable from any WSL2 guest, so an NPU
        changes nothing about guest exposure. ROCm is out for the same reason
        (no /dev/kfd, no HIP/HSA runtime in /usr/lib/wsl/lib) — relevant to 520.
