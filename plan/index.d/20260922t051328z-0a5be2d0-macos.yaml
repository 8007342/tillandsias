    value: "scripts/test-salvage-preserves-exec-bits.sh prints\n`ok:salvage-exec-bits:3/3` and exits 0: (1) a scaffold worktree holding\na new scripts/test-x.sh with mode 100644 (the state a Git Bash/MSYS\ncheckout produces) salvaged by scripts/salvage-dirty-worktree.sh reaches\nthe ref with mode 100755 when the file carries a `#!` shebang, and the\nsalvage prints one `note:exec-bit-restored:<path>` per file; (2) a file\nwithout a shebang keeps 100644; (3) scripts/check-script-exec-bits.sh\ncovers scripts/test-*.sh and openspec-bound fixtures (today it reports\n26 checked of ~700 scripts) and refuses\n`violation:script-exec-bits:<path>` for a shebang script at 100644.\nPRE-FIX RESULT: FAILS — measured 2026-09-20: scripts/test-windows-host-\nlane-refusal.sh and its controls were 100644 in git since yolanda's\nsalvage relay (land 27), every --check gate passed, and the v56.9.20.1\nrelease gate refused litmus:windows-host-lane-refusal step 1\n(`test -x`) on the first run of the tier that checks it.\n\n\n[2026-09-22T05:13:28Z macos] \nITEM (1) DELIVERED ON work/1321-2ixp, PR #147. ITEMS (2) AND (3) REMAIN OPEN —\nsalvage restoring the bit at snapshot time, and\nscripts/test-salvage-preserves-exec-bits.sh. This row does not close on #147.\n\nTHE OUTPUT: a `test -x <path>` or `[ -x <path> ]` assertion in a caller is now a\nREQUIREMENT for the bit, outranking both the positive-pattern gate and the\ninterpreter exclusion. Controlled pair, same decider and run, each fixture set to\n100644 and restored to 100755 afterwards:\n\n  test-macos-vz-orphan-diagnosis.sh  (litmus invokes BARE)\n      refused before, refused after\n  test-windows-host-lane-refusal.sh  (litmus invokes via `bash`, asserts test -x)\n      CLEARED before, REFUSED after — naming the caller and the fix\n\nClean tree unchanged at ok:script-exec-bits:26 checked.\n\nTHE SWEEP HAD TO WIDEN TOO, and the decider's own comment warned about it in\nadvance: \"a form it cannot see never reaches the awk, so a widened filter behind\na narrow sweep reports a clean tree it never examined\". The awk pattern was added\nalone first and the pair still read ok. Recorded because the shape generalises —\nthis guard has a pre-filter, and any widening that stops at the filter is\ninvisible.\n\nTHREE SCENARIOS AND THREE MUTATIONS, each redding its own arms:\n  exclusion precedence removed    -> bracket-dash-x-refused\n  positive gate's requires_x gone -> both new refusal arms\n  sweep widening reverted         -> both new refusal arms\nThe narrowness control — an interpreter-prefixed caller with NO assertion must\nstay silent — never reds under any of them. Without it the requirement form\nwould be free to swallow the exclusion whole.\n\nA SECOND DEFECT FOUND WHILE FIXING THE FIRST: the fixture printed its count as a\nLITERAL \"14/14\" while seventeen scenarios ran — the three added here ran, passed,\nand were reported as 14. litmus-script-exec-bit-shape.yaml pins that count\ndeliberately to catch a rewrite that drops coverage, and against a hardcoded\nstring the pin could never have fired. The count is now derived from the\nscenarios that actually ran, verified against the PASS lines printed, and the pin\nmoves 14 -> 17.\n\nTHE GUARD CAUGHT ITS OWN AUTHOR MID-CHANGE, which is the best evidence it works:\na temp-file rewrite (`> tmp && mv`) dropped the exec bit on\nscripts/check-script-exec-bits.sh in the WORKTREE while the index kept 100755,\nand the very check being extended refused it by name — the pre-staging shape\n887-bz88 added. Third instance of that idiom dropping a mode on this host today."
