    title: |
      On Windows, "serve this project locally and open it as an iPhone 16" works end to end: publish_local in the guest plus browser.open{device:"iphone 16"} opens a container window through WSLg
    context: |
      Linux is finishing this lane. On Windows, publish_local and browser.open run in the guest's tillandsias-headless, so once 1656-yhjt resolves the WSLg socket the lane needs the device query, the webkit image built in the guest, and a live run. No test anywhere names iPhone 16 (devices.rs resolves "iphone" to apple-iphone-17).
    exit_criteria:
      - 'devices.rs resolves "iphone 16" to an iPhone 16 descriptor, pinned by a unit test'
      - 'on yolanda, publish_local plus browser.open{device:"iphone 16"} shows a WSLg window at the iPhone 16 viewport'
      - 'no Windows host browser process starts during the run'
    unscoreable: "live WSLg window on the Windows desktop; evidence is the window, the CDP-reported viewport and UA, and a host process list taken before and after"
    next_action: >
      After 1656-yhjt: add the iPhone 16 descriptor with a test, build the webkit image in the guest, run the lane live on yolanda.
    provenance: |
      Filed by yolanda-windows, 2026-10-14, operator direction; assigned to yolanda by macuahuitl-fedora.
