  - packet_id: macos-oneshot-boot-hangs-unbounded-after-interrupted-teardown
    order: 663-69kp
    status: ready
    desired_release: v0.5
    priority: p2
    title: "Tray one-shot VM boot hangs unboundedly (pre-breadcrumb) when the previous VM teardown was interrupted — no storage-lock bound"
    kind: bug
    deliverable: bounded/fail-loud boot acquisition in the one-shot paths (vz start or pre-start lock wait)
    depends_on: []
    pickup_role: macos
    capability_tags: [macos, vz, boot, locking, fail-loud]
    estimated_hours: 4
    outcome: |
      Repeated observation across this session: when a VM-owning process is
      killed (operator ^C, agent pkill, timeout), the NEXT one-shot boot can
      hang indefinitely — sometimes before printing even '[exec-guest]
      starting VM…' (nothing reaches stderr), sometimes at 'waiting for VM
      phase Ready…'. wait_phase_ready has a 300s bound but the hang precedes
      it (suspect: VZ storage/disk-lock acquisition inside vz.start(), or the
      singleton/socket acquisition before the first eprintln). Observed
      durations: 7-45+ minutes until externally killed; a 20-40s settle after
      the kill usually (not always) avoids it. Every occurrence costs a full
      diagnostic cycle and compounds other investigations (it delayed
      663-acdw's diagnosis twice tonight). Fix shape: a bounded, fail-loud
      acquisition with the crashloop-style operator guidance ('previous VM
      still tearing down — retry in N seconds'), never an unbounded silent
      wait.
    events:
      - type: filed
        ts: "2026-08-10T20:35:00Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260810t043031z
        host: macos
