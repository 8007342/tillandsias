      1. A check reports a fragment that asserts a LIVE state — a claim event,
         or a status transition to in_progress — which is untracked in git
         beyond a grace threshold. PRE-FIX RESULT MUST FAIL: reproduce by
         writing a claim fragment, leaving it untracked, and confirming the
