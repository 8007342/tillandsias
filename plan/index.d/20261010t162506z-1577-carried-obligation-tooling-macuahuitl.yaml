  - packet_id: the-land-queue-stamps-each-landing-with-a-carried-trailer-per-backlog-so-paid-waived-and-silent-integrations-are-counted-from-git-history
    order: 1577-568c
    status: ready
    kind: enhancement
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [land-queue, carried-obligation, ratchet, evidence]
    estimated_hours: 2
    owned_files:
      - scripts/land-queue.sh
      - scripts/test-land-queue.sh
    title: |
      A carried obligation escalates only on a measured stall, but no landing records whether it paid, waived or stayed silent: scripts/land-queue.sh reads only number, headRefName and isDraft and writes `land(<n>): work/<order> into linux-next` with no trailers. Make the queue run the carried-obligation guard on the gated tree and add one `Carried: <backlog> <paid|waived|not-due|silent> <item-or-reason>` trailer per backlog to the land commit
    context: |
      Rule: methodology/convergence.yaml carried_obligations.triggers (window of
      10 due integrations, counted by first parent like
      scripts/check-landing-provenance.sh). The waiver itself is a commit
      trailer on the work ref, not a PR-body line: the queue never reads a
      body and a forge cannot see one. Copying the guard's verdict onto the
      land commit makes the tally one `git log --first-parent
      --format=%(trailers:key=Carried,valueonly)` with no gh call. Measured
      2026-10-10: 23 integrations since the shell floor last moved on
      2026-10-02, 11 of them touching gate scripts, 0 ports; that number had
      to be reconstructed by diffing each merge.
    exit_criteria:
      - 'a test-land-queue arm with a fake gate and a work ref whose change is due and carries a Carried-Waiver trailer produces a land commit whose trailers include `Carried: shell-to-lua waived <reason>`; pre-fix: the land commit has no Carried trailer'
      - 'a not-due work ref lands with `Carried: shell-to-lua not-due`'
      - 'at the gentle stage a due, silent ref is evicted with evict:land-queue:<n>:carried-silent:shell-to-lua and the trailer line to add appears in the PR comment and on stdout'
    unscoreable: "unpinnable-until-the-guard-exists: the new scripts/test-land-queue.sh arms are the deliverable, written with the change; pre-fix result: land commits carry no Carried trailer."
