  - packet_id: a-lua-guard-prints-what-a-change-owes-each-carried-obligation-backlog-not-due-paid-waived-or-due-with-the-smallest-item-and-the-waiver-line-to-paste
    order: 1577-g96z
    status: ready
    kind: enhancement
    priority: p2
    desired_release: v0.5
    pickup_role: any
    capability_tags: [lua, ci-gate, carried-obligation, ratchet, preflight]
    estimated_hours: 4
    owned_files:
      - scripts/lua/check-carried-obligations.lua
      - methodology/convergence.yaml
      - build.sh
    title: |
      Nothing tells an agent what its change owes the shell-to-lua backlog: methodology carried_obligations defines due / paid / waived and the Carried-Waiver trailer, but no tool reads the backlog table, the change's diff or its trailers, so the obligation lives only in prose. Write scripts/lua/check-carried-obligations.lua and run it from ./build.sh --preflight, scripts/relay-preflight.sh and the work-ref pre-push warn lane
    context: |
      Rule: methodology/convergence.yaml carried_obligations (1570-k5yt), first
      instance openspec/specs/ci-release req-id ec267f02. The guard reads
      carried_obligations.backlogs with yaml.parse, computes the change's paths
      from `git diff --name-only BASE...HEAD` (BASE default origin/linux-next,
      as the -added deciders do) through proc.run argv, reads trailers with
      `git log --format=%(trailers:key=Carried-Waiver,valueonly) BASE..HEAD`
      (the Native-Lint precedent, scripts/check-native-lint-attested.sh), and
      for shell-to-lua compares the `sh=` value of check-shell-ratchet.lua at
      BASE and HEAD. Verdicts, one stdout line per backlog:
        carried:<backlog>:not-due
        carried:<backlog>:paid:<path>
        carried:<backlog>:waived:<reason>
        carried:<backlog>:due:<path> (<n> lines)      exit 0 on a work push
        violation:carried:<backlog>:silent            exit 1 at landing, gentle stage
      with up to five candidates (the five smallest existing items at or under
      item_ceiling_lines, the suggestion picked by the work ref's order modulo
      five) and the exact trailer line on stderr. Candidates on 2026-10-10:
      check-no-python-scripts.sh 17 lines, check-no-end-user-brew-instruction.sh
      27, check-macos-only-sources-verified.sh 32, check-vault-cli-gate-coverage.sh
      34, check-ripgrep-available.sh 40. This guard is itself a new Lua decider
      in the area, so its own change is due: it carries one of those ports or
      a waiver.
    exit_criteria:
      - 'on a scratch repo whose change edits scripts/check-x.sh with no port and no trailer, the guard prints carried:shell-to-lua:due:<path> (<n> lines) and on stderr the line `Carried-Waiver: shell-to-lua <reason>`; pre-fix: no such script, no line'
      - 'the same change plus a commit trailer `Carried-Waiver: shell-to-lua too-big:scripts/check-y.sh:200` prints carried:shell-to-lua:waived:too-big:scripts/check-y.sh:200'
      - 'a change that deletes one scripts/check-*.sh and adds its Lua port, floors lowered by --dump-floors, prints carried:shell-to-lua:paid:<path>; a change that only deletes a stale floor line (file already gone) does NOT print paid'
      - 'NEGATIVE CONTROL: a change touching only crates/ prints carried:shell-to-lua:not-due and exit 0'
      - './build.sh --preflight lists the guard; a work-ref push with a due, silent change prints one warn:pre-push line naming it and still pushes'
    unscoreable: "unpinnable-until-the-guard-exists: future scripts/lua/check-carried-obligations.lua and its Lua fixture, written in the same commit; pre-fix result: no tool prints a carried: line for any diff."
    depends_on: []
