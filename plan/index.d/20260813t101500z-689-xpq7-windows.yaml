      summary: >
        Criterion 1: `exec_over_stream_expect_dynamic` now has the
        `ControlMessage::Error` arm its two siblings in the same file have had
        since 2026-07-14, so the guest's own message reaches the operator
        instead of falling into the catch-all and being replaced ~300s later by
        "connection stale" — which is not merely unhelpful, it is a false
        statement about the failure. The wire was fine; the guest was refusing.
        The arm also names the PENDING EXPECT, because the reachable shape of
        this defect today is an early rejection (every Error emission site in
        the guest fires before a PTY session exists — e.g. an exec-allowlist
        refusal of PtyOpen), and an early rejection dies waiting for a prompt
        that will never arrive. "guest error while waiting for password prompt"
        locates the failure in the exchange; "guest error" alone does not.
        The packet's honest bound is preserved as written: this was never an
        unbounded hang — the idle timeout still fired — so the cost was
        diagnosability, and the fix is scoped to that. The unbounded wedge is
        689-y2my and stays there.
  - packet_id: vsock-exec-expect-driver-drops-guest-error-envelope
    event:
      type: verified
      ts: "2026-08-13T10:14:00Z"
      host: windows
      summary: >
        Criterion 2, and it is the part that matters most here. The 2026-07-14
        fix landed on two drivers of three and its regression pin covered ONE —
        which is exactly why the third could regress the same way and nothing
        noticed for a month. A per-driver pin cannot see that. The guest half is
        now lifted into a shared `reject_after_open` harness and
        `every_driver_surfaces_a_guest_error_envelope` runs all three drivers
        against it, so adding a fourth driver without the arm fails the suite
        rather than waiting for an operator to sit through the wrong error.
        The shared assertion also refuses the SYMPTOM, not just the absence of
        the fix: it fails if the message contains "connection stale", so a
        future regression that swallows the Error and lets the idle timeout
        answer cannot pass by producing some error.
        Criterion 3: `expect_driver_normal_close_is_unaffected_by_the_error_arm`
        drives a normal PtyData + PtyClose exchange and asserts Ok with the
        guest's output and exit — without it, the new arm could be satisfied by
        failing every exec.
        Evidence: cargo test -p tillandsias-vm-layer vsock_exec = 17 passed, 0
        failed, including both order-332 heartbeat pins and the pre-existing
        single-driver pin, all unchanged. Hand-falsification recorded: deleting
        the new arm makes `every_driver_surfaces_a_guest_error_envelope` FAIL on
        driver 3 while the negative control still passes.
