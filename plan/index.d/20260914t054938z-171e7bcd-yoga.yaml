        ESCAPE 1 — AN ABSOLUTE PATH IS STILL THE COMMAND. UNBOUNDED_PRODUCER_RE anchored on `(^|[;&|(]|[[:space:]])` immediately before the command name, so in `/usr/bin/grep` the preceding character is `/` and the producer never matched. Not a hypothetical spelling: validate-traces.sh calls /usr/bin/grep EIGHT times, deliberately, so macOS gets BSD grep regardless of Homebrew. The anchor now admits an optional absolute path prefix and still requires the delimiter before it, so `foogrep` and `mygit` stay unmatched.

        ESCAPE 2 — A PIPELINE SPLIT ACROSS CONTINUATIONS. The loop read one added line at a time while VERDICT_CONTEXT_RE anchors on a leading if/while/until/elif, so the verdict context sat on the first physical line and the early-exiting consumer on the last and no single line carried both.

        FOLDED FROM THE FILE, NOT FROM THE DIFF, and that is the half that keeps it honest. Joining the diff's added-line stream would splice lines that are not adjacent in the file whenever a hunk adds only part of a continuation, and fabricate a pipeline nobody wrote. The FILE is folded into logical lines and a logical line is in scope when ANY of its physical lines was added — which is also the more faithful reading of "added in this change".

        THE ROW'S CLOSURE ASKED FOR A REVERT IN scripts/validate-traces.sh; I REPRODUCED THE SHAPE INSTEAD, in a throwaway repo, and say so plainly: mutating a real instrument to test a guard leaves the tree one interrupted fixture away from a broken validate-traces.sh, and the assertion is identical either way. The reproduced line is the 1069-c9w6 fingerprint — `/usr/bin/grep -rl --include=... \` across two continuations into `| grep -q .` — carrying BOTH escapes at once.

