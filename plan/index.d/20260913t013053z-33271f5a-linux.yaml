      summary: |
        RESIDUAL CLOSED, and criterion 4 proven by EXECUTION rather than by reading the
        spec table.

        THE FIX. Both builders now take `host_checkout: Option<&Path>` (None in cloud
        mode) and `resolved_remote_url: Option<&str>`:
          * write_forge_gitconfig builds ONE `resolution` for both modes — resolved URL
            wins, else read the checkout, else a cloud-specific Unresolvable. The "why
            is there no redirect" block that writes the reason INTO the artifact keeps
            working unchanged, which is why it was done this way rather than with a
            separate cloud branch.
          * EVERY seed read is gated on the checkout, not only the branch read.
            report_seed_staleness runs its OWN `git -C`, so in cloud mode it was a
            SECOND live read against the bare name with the same CWD-capture hazard.
            That one was not in the assignment and would have survived a fix aimed only
            at read_host_project_current_branch.
          * the agent lane now resolves its remote the way the OpenCode lane does; the
            local-path wrapper passes Some(project_path) and says why a cloud tray
            launch does not come through it (it re-execs with --cloud).
          * the Unresolvable advice "Fix the checkout or install git on this host" is
            now suppressed when there is no checkout, and replaced with text naming the
            cloud resolver. Sending an operator to repair a working copy that is not
            supposed to exist was a real defect in the message, not a wording nit.

        TESTS: 536 passed, 0 failed (cargo test -p tillandsias-headless --bins); clippy
        and fmt clean.

        THE NEW ARM CARRIES ITS OWN CONTROL, which is the part worth reading.
        cloud_mode_gitconfig_ignores_a_stray_same_named_repo_in_the_cwd plants a decoy
        git repo named after the project in the process CWD with origin
        DECOY-WRONG-REPO, calls the writer the way cloud mode now calls it, and asserts
        the config carries REAL-CLOUD-REPO and never the decoy. Then it calls the writer
        the PRE-FIX way — the bare relative name as the checkout — and asserts the decoy
        DOES reach the config. Without that second half the test would pass just as
        happily against a resolver that never touches the filesystem at all, and would
        be pinning nothing.

        CWD_LOCK added alongside ENV_LOCK/PODMAN_SEAM_LOCK: set_current_dir is
        process-global and Rust runs tests as threads, so a cwd-moving test races every
        other test that touches a relative path. Flagged before writing it.

        CRITERION 4 — EXECUTED, with a control, against the real image:
          podman run --entrypoint /bin/sh --tmpfs /home/forge/src:size=64m,mode=<M> \
            localhost/tillandsias-forge:v56.9.12.1
          mode=0755 (the pre-440cde994 shape):
            uid=1000 user=forge · src dir: mode=755 owner=root
            MKDIR REFUSED: mkdir: cannot create directory
              '/home/forge/src/probeproj': Permission denied
          mode=0777 (the shipped spec, forge_src_tmpfs_spec):
            uid=1000 user=forge · src dir: mode=777 owner=root
            MKDIR OK · created: mode=755 owner=forge
        The refused case is the recorded trigger — git's "could not create work tree
        dir ... Permission denied" is its wrapper around exactly this mkdir. Both halves
        run, so the proof is not "0777 appears in a spec table".

        A DEFECT I INTRODUCED AND CAUGHT, recorded because it was nearly invisible:
        inserting the new tests placed my block BETWEEN an existing test's doc comment
        and its `#[test]`, which silently DISABLED
        cloud_mode_opencode_origin_and_branch_from_resolved_project — it became dead
        code and stopped running, while the suite still reported green. Found via a
        `duplicated attribute` warning and a test name appearing twice in the run list.
        Doc comment reunited with its function, stray attribute removed, 0 warnings, and
        the test is executing again. Adding tests can remove tests, and the suite's own
        pass count will not say so.
