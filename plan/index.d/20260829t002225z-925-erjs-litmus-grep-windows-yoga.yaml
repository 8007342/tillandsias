      WHY IT IS A DEFECT AND NOT A STYLE NOTE. A window pin measures
      FORMATTING. Insert a comment above the anchored code and the target
      slides out of the window, and the test fails on CORRECT code — the
      failure names the pinned behaviour, so the reader investigates working
      code. That is the same "truthful observation, false conclusion" class
      this milestone keeps repairing, and it has already fired: 748-tkjx
      records two such false failures in one hour on 2026-08-15, on
      litmus-startup-context-addendum-shape.

      THE PART WORTH NOTICING: that same test STILL carries two of them
      (`grep -A4` and `grep -A10` against images/default/lib-common.sh). The
      2026-08-15 cycle fixed the two windows that had fired and left the two
      that had not. Fixing instances is not enough — the 704-zcgi lesson,
      which is why this is filed as a corpus sweep rather than as another
      instance fix.

      NOT ALL 21 ARE WRONG. A window over a short, stable block can be the
      clearest available assertion, and `grep -A 200 'fn build_inference_run_args'`
      is plainly reaching for "the whole function" rather than 200 specific
      lines. The deliverable is therefore per-step disposition, not a blanket
      rewrite: convert, or record why the window is right.

      RELATED. 634-39ik raised the bar for NEWLY ADDED litmus steps
      (diff-scoped by construction, structurally incapable of flagging the
      existing corpus), and 624-cf9f is the lane that drains the accepted
      standing debt those decisions left behind. This packet is 624-cf9f-shaped
      work with a measured, enumerated scope. 921-vtf4 is the sibling symptom:
      three tests standing red for weeks behind a green `./build.sh --check`.

      NOT CLAIMED: that any of the 21 is red today. They are latent, not
      failing — which is exactly why nothing surfaces them.
