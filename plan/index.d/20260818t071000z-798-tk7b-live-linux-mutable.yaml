      summary: |
        FIRST PRODUCTION SIGHTING OF THE CASE THIS PACKET WAS FILED FOR, six
        hours after the reporter landed, and it was named on sight instead of
        being found by someone typing `podman ps -a` for another reason.

        A background e2e build was killed mid-run. The reporter, invoked
        immediately afterwards to check what state the kill left:

          degraded:enclave-service-health:services=6:up=3:down=3:dead=2:absent=0
          fail:enclave-service-dead:service=tillandsias-dev-inference:state=exited:
            rc=137:signal=SIGKILL:age=3h20m:restarts=0:health=stale-healthy:
            origin=product-inference:age_s=12053

        `health=stale-healthy` on a container that has been dead for three
        hours and twenty minutes. That is exactly the shape in the packet's
        OBSERVED block —

          tillandsias-vault  Exited (137)  5 hours ago (healthy)

        — a different container, the same signal (SIGKILL, rc=137), the same
        podman healthcheck record outliving the process it described. The
        fixture's scenario 4 had to script this because the host could not
        produce it on demand; it produces it on its own.

        THE OTHER TWO LINES EARNED THEIR DISTINCTION, which is the part I would
        have got wrong alone. `tillandsias-nix-cache` exited rc=0 three hours
        and twenty-one minutes ago and was reported as
        `note:enclave-service-stopped`, not as a fault — that is yoga's
        dead-vs-stopped split, adopted during the 814-iyu7 convergence. Under
        my original lumping it would have been a third `fail:` line, and three
        failures where there is one crash and two ordered stops is the kind of
        noise that gets a report ignored. The convergence was worth its cost on
        the first real incident.

        WHAT KILLED IT IS NOT ESTABLISHED and I am not asserting one. The e2e's
        lane teardown does say it cleans `lane-scoped: tillandsias-inference`,
        and the timing is consistent with tonight's runs, but `dev-inference`
        is the DEV endpoint that scripts/cycle-preflight.sh establishes, not a
        lane container, and a SIGKILL is not what an ordered teardown sends.
        Consistent-with is not caused-by. Left running down: the next
        cycle-preflight re-establishes it, which is the designed behaviour.
