packets:
  - packet_id: ci-full-receives-an-unattributed-sigterm-at-install-validation
    order: 936-kdev
    status: ready
    title: |
      ci-full exits 143 near install-validation with every check green — twice, and nothing in any log names the sender
    kind: bug
    pickup_role: linux
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - build-gate
      - ci
      - fail-loud
    estimated_hours: 3
    deliverable: |
      Either the sender is identified and stopped, or ./build.sh traps TERM
      and dies saying when it was hit and what phase was live — a green
      suite inside a killed run must never require forensic log reading to
      distinguish from a failure.
    context: |
      MEASURED on macuahuitl 2026-08-29 (evening), three ci-full runs after
      934-7jd4's toolbox shims made the litmus phase run inside ci-full:
        run 5: completed normally (rc=1 on a real red — pre-shim, litmus
               phase skipped for missing podman).
        run 6: rc=143. Litmus 314/314, local-ci 26/26, killed after checks.
               A concurrent ./build.sh --check was running — plausible
               mutual interference, cannot rule out.
        run 7: rc=143 with NOTHING concurrent. Log ends at
               "Launcher is musl-static (portable)"; the next expected
               line (headless smoke verdict) never printed. All checks
               green.
      RULED OUT with evidence: the singleton reaper logs
      "sending SIGTERM to existing instance" via tracing when it kills —
      zero matches in the run log; TILLANDSIAS_NO_SINGLETON=1 was exported
      throughout. NOT ruled out: PID-reuse against a stale lockfile in a
      child that swallowed the log line; a timeout wrapper in a phase
      TERMinating its process group; the harness's own background-task
      management; a litmus e2e step's cleanup.
      DIAGNOSIS SHAPE (the fail-loud fix is useful regardless of cause):
      trap TERM in build.sh's ci-full path, log the phase marker + wall
      time on receipt, and re-raise; optionally run one instrumented
      repro under `systemd-run --user --scope` so an external pkill of a
      pattern (everything here runs under a path CONTAINING the string
      "tillandsias") is distinguishable from in-tree kills. The evening's
      rule applies: one captured line beats an evening of guesses.
    exit_criteria:
      - a ci-full killed by SIGTERM prints which phase was live and when the signal arrived, before dying
      - one instrumented run either completes exit 0 solo or names the sender
