  title: Triage the 18 stale drafts and 64 PR-less unlanded refs, and reconcile 267 landed-but-open packets
  context: 'The table in plan/issues/abandoned-work-audit-2026-11-17.md lists every kept ref with its SHA, cause, size and packet status. Drafts are recoverable from refs/pull/N/head after their branch is deleted. The 2026-11-17 audit deleted only ancestry- or patch-id-proven refs and left these for a worth-it decision. Packet status on the 18 drafts: 11 ready (the work is unstarted on trunk, so it risks being redone), 2 in_progress (stale claims: 1903-sj5t, 1911-3gqy), 1 blocked (1829-guit), 5 with no packet (1940-lcns, 1558-ixih, 1553-3isv, 1553-q7f4, 1553-6b3a). Also, 202 ready and 65 in_progress packets have work refs that landed by ancestry.'
  exit_criteria:
  - 'gh pr list --draft --state open shows no PR older than 5 days without a hold-reason and hold-until comment. Today it shows 18.'
  - 'Every kept ref in the audit table is either re-implemented on a new work/<order> PR, closed with a tombstone, or deleted with its SHA recorded.'
  - 'work/437-forge-src-tmpfs-topology is checked for the forge memory ceiling on linux-next. If it is absent, a packet is filed.'
  unscoreable: 'triage outcome is a judgement per ref; closure is the empty draft list plus the table annotated per row.'
  next_action: 'Per draft, in PR-number order: read the packet next_action and the draft diff. If the packet still wants it and the diff is small, re-implement fresh off linux-next on a new work/<order> with a non-draft PR. Otherwise append a note to the packet citing refs/pull/N/head <sha> as prior art, and close the draft with a tombstone. For the salvage/* refs from September: delete unless the diff names a file absent from linux-next. Never rebase an old branch.'
