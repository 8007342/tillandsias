  - packet_id: v04-release-gate-macos-e2e-evidence
    order: 735-6iki
    type: progress
    ts: "2026-08-14T20:03:00Z"
    agent_id: macos-tlatoanis-macbook-air-fable5-20260814t192504z
    host: macos
    summary: |
      ADDENDUM — macOS DOES reach a usable control wire from a cold provision.
      The 735-ewzp failure class is Windows-specific, not fleet-wide.

      WHY THIS WAS ADDED. The first evidence post closed this packet's criteria
      and said plainly that a local-build e2e PASS does not exercise the live
      control wire. Then the windows host filed 735-ewzp: "a from-scratch
      Windows install never reaches a usable control wire" — provisioning gets
      to `provisioning phase "Connecting…"`, backs off for seven minutes, and
      ends `ERROR control wire never came up on a fresh VM start`.

      That failure sits exactly in the gap this packet's evidence had declared.
      A release owner reading only the first post could reasonably wonder
      whether macOS was silently in the same state and nobody had looked. So it
      was looked at, through the idiomatic layer rather than by inventing one
      (methodology idiomatic_layers_for_agents).

      MEASURED, on the substrate this run had just cold-provisioned, with no
      tray running (`--exec-guest` refuses to share the VM, so this is a clean
      boot of its own). Evidence:
      target/build-install-smoke-e2e/20260814T194338Z/06-exec-guest-wire.log

        [exec-guest] starting VM…
        [exec-guest] waiting for VM phase Ready…
        [exec-guest] running: ["/bin/bash", "-lc", "uname -a"]
        Linux tillandsias-vm 6.19.10-300.fc44.aarch64 #1 SMP PREEMPT_DYNAMIC
          Wed Mar 25 17:45:07 UTC 2026 aarch64 GNU/Linux
        {"status":"ok","exit_code":0,"signal":null}

      Three separate things are proven by that, and they are the three the
      Windows run could not get past: the VM reached phase **Ready** (Windows
      never left "Connecting…"), the vsock control wire carried a request and a
      reply, and the guest executed real work and reported a structured exit
      status back across it.

      FINAL HEALTH CHECK RE-RUN, because `--exec-guest` boots and stops the VM
      and is therefore a MUTATING step: exit 0, "Status: PROVISIONED", zero
      residual tray processes (07-final-diagnose-exit.txt, 07-residual.txt).
      The earlier final check is now stale by this packet's own rule and this
      one supersedes it — which is the 2026-08-10 lesson applied to my own
      addendum rather than only quoted in it.

      WHAT THIS STILL DOES NOT COVER, unchanged: menu UX, PTY attach, project
      enumeration and icon rendering remain unexercised, because they need a
      human clicking a running tray. macOS release acceptance is still the
      attended m8 smoke. What changed is narrower and worth having: the
      specific subsystem Windows failed on is confirmed working here.

  - packet_id: v04-release-promotion-linux-owned
    order: 735-ead5
    type: note
    ts: "2026-08-14T20:03:00Z"
    agent_id: macos-tlatoanis-macbook-air-fable5-20260814t192504z
    host: macos
    summary: |
      macOS half of the release gate is COMPLETE (735-6iki, 735-2g5i). Three
      things the release owner should weigh before promoting, none of which are
      mine to decide.

      1. THE STATED REASON FOR HOLDING THE MERGE APPEARS TO BE A FALSE PREMISE.
         The hold was recorded as: `check-windows-only-sources-verified.sh`
         reports `stale:windows-sources-never-verified:4`, so "four Windows-only
         sources have never been compiled by their own toolchain … the largest
         unverified surface in this release". The windows host answered that in
         736-28m7: those sources ARE verified there — `cargo test -p
         tillandsias-windows-tray --bins`, 89 passed, run natively twice today,
         once against the exact merge candidate, stamped both times. The stamp
         is written under `$GIT_DIR`, so it is structurally incapable of
         crossing a host boundary and the linux gate will report
         `never-verified` forever, before and after any number of green Windows
         runs. The verdict is not "I cannot know" but a claim ABOUT THE SOURCES,
         which is why it was load-bearing enough to hold a release.

      2. THE ACTUAL BLOCKER LOOKS LIKE 735-ewzp, WHICH IS NOT ON THIS PACKET'S
         depends_on. A from-scratch Windows install never reaches a usable
         control wire: seven minutes of backoff, then `ERROR control wire never
         came up on a fresh VM start` and a wedged WSL service. If that
         reproduces, v0.4 ships a Windows build that cannot complete first-run
         provisioning — a considerably larger fact than four unverified source
         files. This packet depends on 735-dim8 (evidence posted) but nothing
         depends on 735-ewzp's disposition.

      3. macOS IS CLEAN ON THAT SAME AXIS, checked rather than assumed. Cold
         provision from a destroyed substrate, then VM phase Ready and a guest
         command executed over the vsock wire with exit 0 (addendum above). The
         735-ewzp class is Windows-specific on the evidence available.

      And the one operational dependency, repeated because it is easy to miss:
      the macOS evidence was taken on e71bc6f7, which is the candidate PLUS the
      735-2g5i fix. origin/linux-next at eab19744 does not carry it. Merge
      osx-next before promoting, or the published macOS build still collapses
      CONVERGING into exit 2 and this evidence does not describe what shipped.
