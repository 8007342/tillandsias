    related: [1662-udb3, 1661-m9sr]
    title: |
      An MCP tool lets a forge agent register its own dev server ("route port N as <service>"), and the host routes <service>.<project>.localhost to that lane's port, for that lane only. This is the explicit, per-lane path to hot-reload previews, NOT a fixed port table that silently exposes whatever listens on 3000.
    context: |
      1662-udb3 takes option (c) for v0.5: the forge context states that only publish_local services are routed, and steers "serve/open it" to publish_local. The operator's hot-reload vision needs a running dev server (wrangler dev on 8787, vite on 5173) to be reachable. The coordinator chose an explicit register call over a fixed port table: the agent names the port and the service, so nothing is routed by accident.
    exit_criteria:
      - 'from a forge lane, a register call {port, service} makes https://<service>.<project>.localhost:<preview port>/ serve that lane''s dev server; a wrangler-dev-shaped server on 8787 is reachable after the call and not before; red today (no such tool)'
      - 'another lane, of the same or another project, cannot register or reach the route; an unregister (or the lane ending) removes it'
      - 'only the named port is routed: another port listening in the same lane stays unreachable'
      - 'the forge context documents the call where 1662 says only publish_local is routed'
    unscoreable: "unpinnable-until-the-guard-exists: the register tool and its live two-lane arm are written together"
    next_action: >
      After 1662-udb3: design the tool's shape with the router's route rendering (main.rs route.public, the sidecar), then write the two-lane live arm red first.
