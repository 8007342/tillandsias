packets:
  - packet_id: a-mode-only-regression-reached-the-trunk-past-the-only-gate
    order: 887-bz88
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      origin/linux-next was left RED for a violation its own gate detects — scripts/check-credential-channel.sh went 100755 -> 100644 in a pushed commit, and the exec-bits guard reports it on the very next checkout
    deliverable: |
      an account of how a mode-only regression crossed a pre-push gate that
      catches it, and whichever of the two candidate holes turns out to be real,
      closed
    pickup_role: linux
    owner_host: any
    depends_on: []
    capability_tags:
      - ci
      - build-gate
      - fail-loud
      - multi-host
      - trunk-protection
    estimated_hours: 2
    context: |
      MEASURED on macuahuitl 2026-08-25T20:35Z, while merging origin/linux-next
      into a cycle branch. Repaired in the same cycle (the trunk should not stay
      red while this is discussed) — but the REPAIR IS NOT THE FINDING.

      THE FACTS, each independently checkable:

        git ls-tree 68ad6e546 scripts/check-credential-channel.sh
          -> 100755                       (my cycle-start HEAD)

        git show --raw 1f51440c9 -- scripts/check-credential-channel.sh
          -> :100755 100644 a110db240 1d4dc6c0f M
             "fix(886-qmdz): a behind branch is not a missing credential"
             author: lenovinha

        # on a pristine checkout of origin/linux-next, no local edits:
        bash scripts/check-script-exec-bits.sh
          -> REFUSED: scripts/check-credential-channel.sh is invoked by path
             but tracked as mode 100644 ...
             caller: openspec/litmus-tests/litmus-opencode-prompt-e2e-shape.yaml:143
             violation:script-not-executable:1

      So the guard that exists for exactly this (731-d89b / 758-jw6v) reports the
      violation on a clean clone of the trunk. It did not have to be extended,
      taught, or re-scoped — it already sees it. The tree was pushed anyway.

      WHY THIS IS WORSE THAN AN ORDINARY RED: `check-credential-channel.sh` is
      the CREDENTIAL CHANNEL GUARD. Every meta-orchestration cycle on every host
      runs it before any committable work, by path, and a non-executable script
      invoked by path is a permission error rather than a verdict. The
      regression's blast radius is the guard that decides whether a cycle may
      commit at all. (This host survived only because it read the file before
      the merge landed.)

      TWO CANDIDATE HOLES, and this packet is to find out WHICH — not to assume:

        (a) THE PLAN-ONLY FAST LANE. The pre-push hook has a lane that accepts a
            push whose outgoing diff is only new plan fragments, without a build
            stamp ("plan-only lane: ... accepting without the build stamp",
            observed live this cycle). If a mode-only change can ride in a
            push the lane classifies as plan-only, the lane is the hole. A
            mode change carries no content diff, which is precisely the shape a
            content-based classifier is most likely to wave through.

        (b) A STAMP THAT PREDATED THE CHMOD. The gate stamps the tree it
            validated; if the mode changed after the stamp and the staleness
            comparison is content-hash-based, the stamp would still look fresh.
            The hook DOES detect tree drift (it refused this very cycle for
            exactly that reason), so the question is whether its drift detector
            sees st_mode at all.

      Both are testable in minutes on a scratch branch; neither should be
      guessed at. There is a third possibility — `--no-verify` — which is not
      investigable from here and is a conversation rather than a code fix.
    outcome: |
      A mode-only change cannot reach the trunk without passing the guard that
      already detects it, and whichever lane let this one through is named.
    exit_criteria:
      - 'Reproduce it: on a scratch branch, chmod -x a path-invoked script, commit, and attempt a push. Record which lane accepts it (plan-only classification, stale-stamp acceptance, or neither — in which case the answer is --no-verify and this packet closes as a coordination finding rather than a code fix).'
      - The identified hole is closed by an executable check, and a fixture proves the closure — a mode-only regression to a path-invoked script must turn the push red.
      - 'NEGATIVE CONTROL: an ordinary plan-only push (new fragments, no mode changes) still takes the fast lane. The lane exists because a full gate on every ledger append is the cost that gets gates bypassed; closing this hole must not close the lane.'
      - 'The specific regression is repaired and stays repaired: scripts/check-credential-channel.sh is 100755 on origin/linux-next, with a check that would catch the next one.'
    verifiable_closure: |
      A scratch-branch push carrying only `chmod -x` on a path-invoked script is
      REFUSED by the pre-push hook, and the same push with the mode intact is
      accepted.
    notes: |
      Do NOT close this by only restoring the exec bit — that was done on
      2026-08-25 within minutes of discovery and is not the deliverable. The
      question is why the guard's verdict did not reach a push, and a fix that
      leaves that unanswered guarantees a repeat with a different file.

      Adjacent but distinct from 754-kptj (cross-branch litmus skew, where each
      branch is genuinely green alone and only the union is red). This is NOT
      that shape: origin/linux-next is red BY ITSELF, on a pristine clone, with
      no merge involved.
    events:
      - type: filed
        ts: "2026-08-25T20:42:00Z"
        agent_id: linux-macuahuitl-fable5-20260825t195813z
        host: macuahuitl
        summary: |
          Found by the coordinator merging origin/linux-next: the merged tree
          failed ./build.sh --check on violation:script-not-executable:1, and a
          pristine checkout of origin/linux-next reproduced it without any merge.
          Exec bit restored on macuahuitl in the same cycle so the trunk is
          releasable again; filing the mechanism question separately because the
          repair tells us nothing about how it got there.
