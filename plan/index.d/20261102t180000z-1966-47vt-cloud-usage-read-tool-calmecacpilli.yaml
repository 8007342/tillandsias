# operator's new-billing-month direction (verbatim below, 2026-11-02).
#
# Facts checked before filing (coordinator + docs, 2026-11-02):
# - No MCP tool exposes billed minutes today. The read-only Cloudflare family lives in
#   crates/tillandsias-headless/src/cloudflare_mcp.rs (cloudflare.scope_probe,
#   accounts_list, zones_list, workers_scripts_list, workers_script_settings,
#   workers_deployments_list, builds_triggers_list, builds_list, build_get, build_logs,
#   pages_projects_list, pages_deployments_list; spec openspec/specs/mcp-tool-socket/spec.md
#   req 5a1fe1ad, order 1772-irs3). cloud.usage belongs beside them.
# - GitHub: the forge's `gh` token (gist, read:org, repo, workflow) cannot call
#   /users/<u>/settings/billing/actions (classic `user` scope); the tool reads with the
#   GitHub App token in Vault instead (operator: already granted). The enhanced
#   billing endpoint is GET /users/{username}/settings/billing/usage?year=&month= (docs:
#   docs.github.com/en/rest/billing/usage — "only available to users with access to the
#   enhanced billing platform"; fine-grained PAT permission: user permission "Plan", read —
#   docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens).
#   Both repos (8007342/tillandsias, 8007342/macron.dev) are PUBLIC, so standard
#   GitHub-hosted runner minutes are not billed; what the current token CAN read is
#   GET /repos/{owner}/{repo}/actions/cache/usage (active_caches_size_in_bytes vs the 10 GB
#   per-repo cap; read access suffices, `repo` scope only for private repos) and run timing
#   (GET /repos/{owner}/{repo}/actions/runs?created=>=YYYY-MM-01 then
#   /actions/runs/{run_id}/timing → run_duration_ms, billable per OS).
# - Cloudflare: the metered one. Workers Builds Free = 3,000 build minutes/month, 1 concurrent
#   build (developers.cloudflare.com/workers/ci-cd/builds/limits-and-pricing/, which names no
#   usage API). Used minutes are derived from cloudflare.builds_list per trigger (status,
#   created_on → completed_on, summed over the calendar month) under the already-held
#   `workers-ci.read` scope / the Cloudflare app token in Vault (permission names, if a 403
#   ever comes back: "Workers Builds Configuration: Read", "Account Settings: Read").
# - methodology/distributed-work.yaml deploy_budget already states the 3,000-minute cap and the
#   one-third rule for macron.dev; scripts/release-preflight.sh Gate 4 "GitHub Actions budget"
#   only checks that release.yml is the sole workflow — nothing reads a number.
