    next_action: >
      Take the 24 in small batches. For each, READ what the test asserts and
      decide which side is wrong -- the file's spec: line or the binding -- then
      fix that side. Do not re-bind to whatever spec currently schedules it just
      to make the numbers agree; that is laundering and this family refuses it.
      Expect some to be legitimately divergent, and give those the deliberate
      declaration rather than a silent pass. Run the instrument before and after
      each batch; it needs no build and finishes in about a second on the floor
      tier. Start with litmus-cross-target-cfg-gate-check, which is the specimen
      whose invisibility is already documented to have cost two hosts their
      mutation arms.
