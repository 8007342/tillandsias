packets:

  - packet_id: containers-conf-proxy-poisons-every-diagnostic-control
    order: 653-zzkb
    status: ready
    desired_release: v0.5
    release_target: socket-audit-master
    priority: p1
    title: "The global containers.conf proxy silently poisons every podman diagnostic, including a p0 security audit's control arm"
    kind: bug
    deliverable: scripts/podman-neutralize-proxy.sh + call sites
    depends_on: []
    pickup_role: any
    capability_tags: [podman, proxy, diagnostics, enclave-network, instrument-error]
    context: >
      `~/.config/containers/containers.conf` sets `http_proxy=http://proxy:3128`
      (and the three case/scheme variants) in a GLOBAL env list, so podman injects
      it into every container and every image pull on every network. The hostname
      `proxy` is an enclave-network alias; anywhere else it does not resolve and all
      egress fails.

      This is a KNOWN class — `crates/tillandsias-podman/src/client.rs:709` names it
      "Proxy-exemption class (orders 116/118/119; 4th instance 2026-07-11)" and
      `scripts/with-tillandsias-builder.sh:78` carries the documented per-site
      neutralization. Each instance has been fixed where it was found, one call site
      at a time, and the class keeps recurring because nothing prevents the NEXT
      caller from omitting it.

      The new instance is the expensive one. The runtime reproduction for 606-9wqd —
      a p0 security packet, and the sole dependency of the only release-blocker-v0.5
      packet — ran bare `podman run` without the neutralization. The proxy poisoned
      the test arm and the CONTROL arm identically, so the control read as "this host
      has no container egress at all" and the reproduction was recorded INCONCLUSIVE.

      With the neutralization applied the control passes and the result is decisive:
      enclave-only reaches nothing, enclave+egress reaches api.github.com,
      example.com AND pypi.org. The finding was reproducible the whole time.

      A per-site fix for a class that recurs at new sites is not a fix. It is a
      convention, and this project's own standard is that a guard only an attentive
      agent honors is a suggestion.
    exit_criteria:
      - >
        ONE executable neutralizer (e.g. `scripts/podman-neutralize-proxy.sh`, or a
        podman wrapper) that every diagnostic and host-side podman path sources,
        replacing the copy-pasted six-variable loop.
      - >
        Existing sites converted to it: with-tillandsias-builder.sh, build-image.sh
        (`--http-proxy=false`), the Rust build paths, run-forge-project.sh.
      - >
        A negative control in the litmus suite: a container on the DEFAULT podman
        network must reach an external destination. If that control ever fails, the
        instrument is broken and no egress measurement on the host is admissible.
    verifiable_closure: >
      The default-network control is asserted by a litmus test rather than remembered
      by a reader, and removing the neutralizer makes that litmus fail.
    notes: >
      The deeper point for whoever picks this up: an env var is not a security
      boundary, so the proxy injection was never containment to begin with — a
      compromised process unsets it. Its only real effect here was to make the
      project's own diagnostics lie in the safe-sounding direction ("nothing has
      egress"), which is how it nearly closed a p0 security packet as theoretical.
      See plan/issues/git-mirror-egress-spec-divergence-audit-2026-08-10.md.
    events:
      - ts: "2026-08-10T08:30:00Z"
        event: filed
        summary: >
          Filed on discovering the 606-9wqd reproduction control had been poisoned by
          our own containers.conf. Fifth instance of a known class.
