        reading is indistinguishable from a settled state.

        NOTE FOR FALLBACK B, from the arithmetic: the two epochs differ by 9411s
        (2h37m), which is the length of the FREEZE, not of the window. So the epoch is
        the declaration timestamp of each freeze, not of the clear — which is what makes
        successor comparison workable: a reader holding 1789775480 and seeing 1789784891
        can tell it is looking at a later declaration rather than at an absence. The
        fallback is sound on this evidence; it needs only that the successor exists
        before the predecessor is removed, which is fallback A.

        THE RETRY IS PART OF THE NUMBER AND SHOULD NOT BE READ AS OVERHEAD: the land
        took attempt 2, so the window is not "how long a gate takes" but "how long a
        gate takes plus however many times trunk moves under it". On a busy trunk that
        is unbounded upward. Sixteen minutes is this instance, not the ceiling.
