    related: [2080-3tzc]
    spec: openspec/changes/obligation-evidence-contract
    title: "The observed grader holds one state per (obligation, platform) cell, and an obligation's aggregate is the minimum over its required cells"
    context: "Point 4. The observe function keeps one latest record per (step, digest) across all hosts and promotes the obligation on any green one, so a Linux pass satisfies an obligation for macOS and Windows. Fix: latest is keyed by platform as well; the output carries a cells list; the aggregate is the minimum over required platforms; a required platform with no record has reason unmeasured; records without a platform are counted as unattributed. The host field stays out of the output. Task 4.3."
    exit_criteria:
      - "An all-platform obligation with a green linux record only: the linux cell is positively_tested, the macos and windows cells keep their state with reason unmeasured, and the aggregate is below the bar. Pre-fix: the obligation is positively_tested, so the fixture FAILS."
      - "Green on linux and macos and failed on windows: the aggregate is below the bar and its reason names windows."
      - "A macos-scoped obligation with a green macos record is satisfied; a green linux record for it earns nothing."
    verifiable_closure: "The three arms and an unattributed-record arm pass; arm one is red on today's observed grader."
    unscoreable: "unpinnable-until-the-guard-exists: the fix writes scripts/lua/test-centicolon-platform-cells.lua in the same commit and moves this closure onto it."
    next_action: "Write scripts/lua/test-centicolon-platform-cells.lua with arm one red, then key the latest table by platform in the observe function."
    provenance: "Filed 2026-11-11 on macuahuitl from task 4.3 of openspec/changes/obligation-evidence-contract/tasks.md."
    events:
