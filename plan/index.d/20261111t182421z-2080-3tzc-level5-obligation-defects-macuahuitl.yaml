  - packet_id: release-distance-d-v-is-defined-in-methodology-and-the-grade-names-its-policy
    order: 2080-46gg
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: any
    size: S
    implementer_tier: sonnet
    capability_tags: [lua, centicolon, methodology]
    estimated_hours: 2
    depends_on: [level-5-obligation-evidence-contract-release-distance-per-platform-cells-rungs-and-witnesses]
    related: [2080-3tzc]
    spec: openspec/changes/obligation-evidence-contract
    title: "The release distance d_v is defined in methodology/math-foundations.yaml, and the grade JSON and verdict line name the policy it was computed under"
    context: "Point 1. The release rule is non-increase of d_v and d_v is defined nowhere. The only live number is the unweighted count the observe function in centicolon-grade-observed.lua returns as R. Fix: d_v is the count of required cells below the bar under a named policy (first policy name unweighted-positive-test/1); the weighted table in methodology is labelled not-implemented. Task 1.1 of the change."
    exit_criteria:
      - "tillandsias-plan methodology release_distance.definition returns the definition, and grade.json carries policy, bar, d_v and denominator. Pre-fix: the methodology path has no match and grade.json has no policy key, so the fixture FAILS."
      - "The verdict line of centicolon-grade.sh ends with policy=<name>; a consumer that reads R still finds it."
    verifiable_closure: "The fixture runs the grade over a two-obligation corpus and asserts the four fields and the policy token on the verdict line; against today's observed grader it fails on the missing policy key."
    unscoreable: "unpinnable-until-the-guard-exists: the fix writes scripts/lua/test-centicolon-release-distance.lua in the same commit and moves this closure onto it."
    next_action: "Write scripts/lua/test-centicolon-release-distance.lua red against today's grade.json, then add the release_distance block to methodology/math-foundations.yaml and the fields to the observed grader."
    provenance: "Filed 2026-11-11 on macuahuitl from task 1.1 of openspec/changes/obligation-evidence-contract/tasks.md."
    events:
      - type: filed
        ts: "2026-11-11T18:24:21Z"
        host: macuahuitl
        summary: "filed ready behind 2080-3tzc from task 1.1"

