    title: "A litmus step binds one scenario with a scenario key, and a requirement key alone earns traced and nothing higher"
    context: "Point 2. In centicolon-grade-static.lua the refs table is keyed by req-id, so one requirement-keyed green step promotes every scenario under that requirement. Only 5 obligations are bound today and 0 are satisfied, so changing the granularity now loses no credit; after the population is bound it would cost a rewrite of every key. This row should land before the pilot 1395-64r7 writes its keys. Task 2.1."
    exit_criteria:
      - "A fixture corpus with one requirement, two scenarios and one enforced, reachable, green step keyed by requirement only grades both scenarios traced with reason requirement-level-only. Pre-fix: both are positively_tested, so the fixture FAILS."
      - "With a scenario key naming the first scenario, exactly that scenario is positively_tested; a scenario value that resolves to nothing is refused by name."
    verifiable_closure: "The three fixture arms (requirement-only, scenario-keyed, unresolved scenario value) pass; the first arm is red on today's static grader."
    unscoreable: "unpinnable-until-the-guard-exists: the fix writes scripts/lua/test-centicolon-scenario-binding.lua in the same commit and moves this closure onto it."
    next_action: "Write scripts/lua/test-centicolon-scenario-binding.lua with the requirement-only arm red, then key candidates by obligation id in the static grader's refs table."
    provenance: "Filed 2026-11-11 on macuahuitl from task 2.1 of openspec/changes/obligation-evidence-contract/tasks.md."
    events:
