    title: "Unbound obligations are counted per spec by one Lua check, and the count is proposed as a carried-obligation backlog at the advisory stage"
    context: "Point 2. 1569 of 1574 obligations have reason no-binding and nothing counts them where a change author sees it. The carried-obligations rule (methodology/convergence.yaml carried_obligations) already makes a change that touches a backlog's area carry one item; an unbound-obligations backlog whose area is openspec/specs and openspec/litmus-tests would move the population with ordinary work. Adding a backlog at the advisory stage is a report; moving it to gentle is the operator's stage change. Task 2.2."
    exit_criteria:
      - "The check prints ok:unbound-obligations:total=<n> specs=<m> and one line per spec with its unbound count, sorted by count, and its total equals the grade's no-binding count on the same tree. Pre-fix: no such check exists, so the fixture FAILS."
      - "check-carried-obligations.lua's ok line ends with a counter for the new backlog. Pre-fix: it reports no such counter."
    verifiable_closure: "A fixture corpus with three specs and known unbound counts yields those counts; a mutation that adds a scenario key lowers one count by one."
    unscoreable: "unpinnable-until-the-guard-exists: the fix writes scripts/lua/test-unbound-obligations.lua in the same commit and moves this closure onto it."
    next_action: "Write scripts/lua/test-unbound-obligations.lua red, then scripts/lua/check-unbound-obligations.lua reading target/centicolon/static.json, then add the advisory backlog entry."
