    spec: openspec/changes/obligation-evidence-contract
    title: "A litmus result record names the product platform (linux, macos, windows) in its own field, separate from the runner regime"
    context: "Point 4. The per-test record cycle-metrics.sh emits carries regime (linux, darwin, msys). On a Windows host the gate re-executes inside WSL, so its records say linux; regime therefore cannot attribute a pass to Windows. Fix: the runner writes platform from the bare-metal host family, passed into a WSL re-exec explicitly, and keeps regime as it is. A record with no platform earns no cell. Task 4.2."
    exit_criteria:
      - "A fixture run with the host family forced to windows and the regime linux emits a record with platform windows and regime linux. Pre-fix: the record has no platform field, so the fixture FAILS."
      - "One real record from a host that can run the gate on macOS and one from a host that can run it on Windows (through WSL) are pasted in the completion event, showing platform macos and platform windows."
    verifiable_closure: "The fixture passes on the three forced host families; the two real records are quoted with their producing command."
    unscoreable: "unpinnable-until-the-guard-exists: the fix writes scripts/lua/test-litmus-record-platform.lua in the same commit and moves this closure onto it."
    next_action: "Write scripts/lua/test-litmus-record-platform.lua red, then add the platform column where cycle-metrics.sh builds the timing-batch record. The record field is written by existing shell; port that emitter to Lua in this row if the edit exceeds one field."
