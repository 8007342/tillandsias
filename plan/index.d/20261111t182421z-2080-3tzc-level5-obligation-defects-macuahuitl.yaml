  - packet_id: the-observed-grader-holds-one-state-per-obligation-and-platform-and-the-aggregate-is-the-minimum
    order: 2080-87z2
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: any
    size: M
