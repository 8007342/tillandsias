        WHAT SHIPPED. The guard no longer derives "my locus" from whatever context it
        happens to run in and then asks that context to publish. A DECLARED locus
        (forge -> in-guest, kind windows -> windows-host) is still asked; a FALLBACK
        locus on a host that publishes elsewhere is told nothing is wanted of it, at
        rc 2, because the publish it would otherwise prompt mints a row for a machine
        nobody routes to.

        MY OWN EXIT CRITERION 1 WAS UNSAFE AND IS AMENDED ON THIS ROW. Implementing it
        literally — "does NOT answer due:" — would have regressed 850-bif2, whose entire
        purpose is that a forge IS asked to publish its first in-guest row. Arms 24 and
        25 exist to hold that, and the teeth check confirms: ignore the declaration and
        arms 12, 24 and 25 all go red.

        A FIXTURE DATA BUG SURFACED ON THE WAY, and it is the sharper half. Arm 12 went
        red on first run and the cause was not my change: `_row` hardcoded kind:linux
        for EVERY locus, emitting `locus:windows-host kind:linux` — a pairing no probe
        can produce. Both real Windows hosts carry windows-host/kind:windows; I read the
        fold rather than assuming. It stayed invisible because nothing had ever read
        `kind`. A FIXTURE'S DATA MAKER CAN ENCODE NOT ONLY A MISSING SHAPE BUT AN
        IMPOSSIBLE ONE, and the second surfaces only when some new code finally reads
        the field it got wrong.

