  title: Per-job GPU seconds are recorded across projects and readable from a forge, so cloud and local cost can be compared
  context: 'Coordinator 2026-11-06, generic. To decide whether a workload belongs on a cloud GPU or a local host, each GPU job (studio run_workflow, imagegen, inference) needs its measured GPU time recorded where every project can read it. Today a run returns provenance and outputs but no duration ledger across projects.'
  exit_criteria:
  - 'Each GPU job appends one record: project, lane, tool, workflow or model, host, device, wall seconds, and GPU-busy seconds where the device exposes them (stated as unavailable otherwise, never guessed). It is append-only and holds no prompts or secrets.'
  - 'A forge reads the records through an MCP verb, with filters by project, tool and time, and per-group totals; a forge reads every project only if the operator allows, otherwise its own.'
  - 'A test shows a recorded job read back from a second project lane, and a refused read when cross-project reading is off.'
  verifiable_closure: 'One real studio job on a GPU host read back from another project forge, with its GPU seconds.'
