packets:
  - packet_id: opencode-web-session-loses-its-lane-mcp-socket-when-the-launching-process-exits
    order: 1863-eckw
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [mcp, host-browser, tray, forge, flutter]
    size: M
    implementer_tier: sonnet
    title: "A web-mode forge keeps a lane MCP socket that refuses every connection once its launcher exits, so publish_local, browser.open and the Flutter toolchain are dead for the whole session"
    context: |
      Observed in forge-tillandsias on 2026-10-25 (~22:0xZ) while trying to
      serve observatorium/ to a dev browser.

      FACTS, all verified rather than inferred:
      - `ss -ltn` inside the forge shows only 0.0.0.0:4096 (the opencode SSE
        proxy), 127.0.0.1:4097 (opencode serve) and 127.0.0.1:11436
        (expert-serve). Nothing listens on the lane.
      - The lane socket path `/run/host/tillandsias-mcp/mcp.sock` EXISTS as an
        inode, but connect() returns `ConnectionRefusedError [Errno 111]`: a
        socket file with no listener behind it.
      - `publish_local` and `browser.open` (through
        images/default/config-overlay/mcp/host-browser.sh, an NDJSON passthrough
        to that socket) therefore cannot start a sibling preview container or a
        host browser.
      - Every Flutter command fails the same way: /usr/local/sbin/flutter
        resolves to /opt/agents/tillandsias-cli/bin/flutter, a shim that asks the
        host toolchain service over the same socket and exits 69 ("the host
        toolchain service is not reachable at ..."). So `npm run build` in
        observatorium/ reaches `flutter pub get` and dies.
      - The documented in-forge self-test cannot separate this from a router
        fault; see the sibling packet on .localhost forwarding.

      CANDIDATE CAUSES, read from the launch path but not yet instrumented:
      the listener is bound inside the process that launched the forge.
      `maybe_spawn_detached_tray_for_cli` spawns a detached tray companion and
      passes TILLANDSIAS_TRAY_RESERVED_LANE=tillandsias/default; the companion's
      `startup_lanes` binds only the ("default","default") lane, so it
      deliberately skips the reserved one. `run_opencode_web_mode` then returns
      and the launching CLI exits, orphaning the bound listener. A tray exit
      would do the same. Nothing adopts or rebinds an orphaned lane, and
      `lane_socket_foreign_owner` treats a socket that refuses connection as
      unowned, so a later launcher would not notice the stale inode either.

      OPERATOR IMPACT: package-preview and dev-browser work is impossible in
      such a session, and there is no in-session recovery — the only remedy is
      relaunching the forge from the tray, which destroys the ephemeral
      workspace the agent was told to build in. Any build produced before the
      relaunch is also thrown away (build/web is gitignored).
    exit_criteria:
      - "A web-mode forge's lane socket answers for the whole life of the session: after the launching CLI has exited, `publish_local` returns a URL, `browser.open` opens a window, and a Flutter command runs; the same holds after the launcher is SIGKILLed. Pre-fix: connect() on /run/host/tillandsias-mcp/mcp.sock is refused."
      - "A stale lane socket (file present, no listener) is named as the cause when publish_local or a toolchain call fails, instead of surfacing as an opaque ECONNREFUSED or exit 69."
    verifiable_closure: "A web-mode forge's lane socket answers for the whole life of the session, including after the launcher exits or is SIGKILLed, and a stale socket is reported by name; both are shown red on today's code first (litmus: scripts/test-lane-socket-survives-launcher-exit.sh)."
