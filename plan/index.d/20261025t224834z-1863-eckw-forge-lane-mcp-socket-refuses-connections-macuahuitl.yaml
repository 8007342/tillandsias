  - packet_id: in-forge-dot-localhost-name-resolution-goes-through-squid-to-proxy-port-80-which-refuses-while-the-router-listens-on-8080
    order: 1863-4knc
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [forge, networking, proxy, router, e2e]
    size: S
    implementer_tier: haiku
    title: "Inside a forge, fetching a .localhost service name goes through Squid to proxy port 80, which refuses, although the router answers on 8080"
    context: |
      Observed in forge-tillandsias on 2026-10-25.

      The router is healthy: `curl -H 'Host: opencode.tillandsias.localhost'
      http://10.0.42.38:8080/` returns the router's own 401 gate
      ("unauthorised — open this project from the Tillandsias tray"), and an
      unrouted name returns `tillandsias-router: no route for ...`.

      Every in-forge attempt at the documented form fails:
      - `curl http://opencode.tillandsias.localhost/` -> connection refused (no
        in-forge resolver for .localhost, expected without a proxy).
      - `curl -x http://proxy:3128 http://opencode.tillandsias.localhost/` ->
        502 from `Server: squid/6.12` with `X-Squid-Error: ERR_READ_ERROR`;
        the proxy host (10.0.42.32) refuses connections on port 80.

      So Squid's .localhost forwarding still points at port 80 of the proxy
      host rather than at the router on 8080, and the documented fallback in
      .forge-startup-context.md ("curl -fsS http://<service>.<project>.localhost/")
      cannot work inside a forge. The host-browser path is unaffected because it
      reaches the router over host loopback, which is why this hides: the only
      caller of the in-forge form is a diagnosing agent, and it is told a
      connection failure that looks like the router is down when the router is
      fine.
    exit_criteria:
      - "From inside a forge, `curl -fsS http://opencode.<project>.localhost/` reaches the router and returns the router's own response (its 401 gate for opencode), not a connection refusal and not a Squid 502; an unrouted name returns the router's `no route` body."
    verifiable_closure: "From inside a forge, the documented self-test reaches the router and returns the router's own response, shown red on today's image first (litmus: scripts/test-in-forge-dot-localhost-probe.sh)."
    unscoreable: |
      unpinnable-until-the-guard-exists: the fix adds the litmus named in the
      exit criterion — scripts/test-in-forge-dot-localhost-probe.sh — in the
      same commit (1136-n8sh); the probe needs a live forge network, which the
      suite has no fixture for today.
    next_action: >
      Add the one-curl in-forge probe to the e2e smoke and make it pass: point
      Squid's .localhost forwarding at the router's 8080 (or give the forge a
      resolver that reaches the router) and delete the stale proxy:80 path.
    provenance: |
      Filed by agent big-pickle in forge-tillandsias 2026-10-25 alongside
      1863-eckw, while that packet's symptom was being misattributed to the
      router.
    events:
