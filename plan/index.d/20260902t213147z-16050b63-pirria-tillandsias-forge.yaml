      summary: >
        GUARDED AND FIXTURED — closure criterion met: a fixture that invokes the shim recursively and asserts a bounded process count. 6 arms, 6 passed, hermetic.  THE MECHANISM, now read from the source rather than from the process table. images/default/brew-shim-exec.sh (byte-identical to the live /usr/local/bin/tillandsias-brew-shim-exec on this guest, verified by diff). BREW IS A RUBY PROGRAM AND `ruby` IS ONE OF THE TOOLS WE SHIM. brew_env() prepends $BREW_PREFIX/bin to PATH, but ruby is not there — the shim directory is — so when brew resolves an interpreter it finds the shim, and the shim runs `brew install ruby`. Each level then sits inside `timeout 150`, so nothing unwinds while the next level forks. That is why 716 levels were alive simultaneously rather than sequentially.  THE SHIM ALREADY KNEW ABOUT RE-ENTRY AND GUARDED THE WRONG PATH. Its last lines carry the comment 'Re-resolve strictly inside the brew prefix so we never re-enter the shim' — the hazard was understood and defended on the SUCCESS path. The unbounded case is the FAILING one, which is also the one that runs longest and, on this guest, the only one that can happen at all (attestation is off by design, HOMEBREW_NO_VERIFY_ATTESTATIONS=1, and `brew install ruby` fails).  THE FIX, five lines, placed deliberately. A single exported marker, TILLANDSIAS_BREW_SHIM_INSTALLING=<formula>, set immediately before the bootstrap-and-install block and checked on entry; a nested invocation hits hint_and_exit and exits 127. POSITION IS THE DESIGN, and both neighbours matter: it sits BELOW the already-installed exec (so a nested probe for a tool that IS present still execs normally — otherwise the guard would break every install that shells out to a real tool) and BELOW the AUTOINSTALL=0 short-circuit (so that off-switch keeps its existing meaning and ordering). Both are pinned by arms 5 and 6 rather than left to reading.  WHY REFUSE RATHER THAN SERIALISE OR COUNT DEPTH: during an install, a second install cannot help — brew holds its own locks and the nested probe's caller is brew itself. A depth limit would still permit N-1 useless installs and needs a number nobody can justify. Refusal degrades a nested probe to exactly the hint an absent tool already gives, which every caller in the tree already handles.  THE FIXTURE IS HERMETIC AND CANNOT BECOME THE BOMB IT TESTS, which was the design constraint. scripts/test-brew-shim-reentrancy.sh runs the REAL shim against a FAKE brew in a mktemp prefix with a fake allowlist — no network, no real brew, nothing installed. The fake brew resolves a tool through PATH (the actual re-entry) and carries its OWN hard depth stop at 25, so the ceiling lives in the test rather than in the code under test: the mutation arm, which deliberately reproduces the pre-fix behaviour, terminates at 25 instead of reproducing 3663. Arms: (1) guarded, brew is invoked EXACTLY ONCE; (2) the nested probe refuses with the re-entrancy reason and names the in-flight formula; (3) it degrades to the standard not-installed hint rather than aborting; (4) MUTATION — with the marker dropped (`env -u`) the SAME fixture re-enters and hits 25, which is what gives arm 1 teeth: without it, arm 1 would pass equally if the fixture simply could not re-enter; (5) an already-installed tool execs normally even with the marker set; (6) AUTOINSTALL=0 still hints without invoking brew at all. Wired into ./build.sh --check beside the empty-ref-list fixture.  TWO DEFECTS IN MY OWN FIXTURE, found and fixed, recorded because both are silent-pass shapes. (a) `env PATH=... -u VAR cmd` — env accepts options only BEFORE the first NAME=VALUE, so `-u` was being taken as the command name; every arm failed loudly, which is the lucky version. (b) The mutation arm tried to steer the fake brew through $1, but the shim invokes it as `brew install --formula X`, so $1 was 'install' and the marker was never dropped: the mutation arm reported ONE invocation and thereby claimed the guard worked when it had not been exercised at all. That is the dangerous version — a mutation arm that silently stops mutating turns the whole fixture into a tautology. Steered by a file flag instead. Same class as the core.hooksPath finding recorded on 863-iicc today: an instrument that stops observing reports success, not absence.  NOT CLOSED BY THIS, and it belongs to 960-tpop rather than here: the guard bounds the FORKING, not the failing. `brew install ruby` still fails on attestation, the Cellar stays empty, and every ruby probe still pays one bounded-but-real install attempt before hinting. And the deeper question this packet exposed — that a gate every host runs depends on an interpreter the forge image cannot obtain — is filed at plan/issues/forge-gate-blocked-on-absent-ruby-2026-09-02.md.  VERIFICATION HONESTY: the fixture proves the guard bounds re-entry against a fake brew. It does NOT re-run the real 3663-process reproduction — deliberately, since doing so would require re-triggering a fork bomb on a live guest to prove a fix whose mechanism is already established by the process table, the source, and a mutation arm. The live confirmation available cheaply is that no further recursion has occurred on this guest since the guard was written: pids.peak remains latched at 3663 from the original incident and pids.events reads `max 0`.
