status:
  - packet_id: linux-host-enrols-a-fido2-security-key-as-its-approval-key-with-an-honestly-labelled-polkit-software-fallback
    field: context
    value: |-
      Design D1 of openspec/changes/os-verified-approval-gates. Enrol `ssh-keygen -t ed25519-sk -O verify-required` (libfido2; touch plus PIN) from the tray and write the public key to the mirror's allowed-signers state. Without a FIDO2 key, a host ed25519 key sealed in Vault is released only after a polkit action org.tillandsias.approve with auth_self (password, or fprintd where a reader exists), and statements say strength: software-password. The operator's desktop has no fingerprint reader and will get a YubiKey.

      [2026-10-25T22:11:42Z macuahuitl] AMENDED by operator rulings 2026-10-25 (design R4): enrolment sets the host's mode to present, never enforced. macuahuitl has no approval hardware and stays in allow mode (actions run, journaled "not enforced: no approval hardware") until the operator explicitly switches it after a YubiKey arrives. The polkit software fallback is no longer a default path: allow mode replaces it until the operator decides.
    ts: "2026-10-25T22:11:42Z"
    host: macuahuitl

