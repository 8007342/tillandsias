# Ledger fragment — append-only, IMMUTABLE once written.
# Written by: linux-mutable-macuahuitl-opus5-20260801
# Read transparently by tillandsias-plan; folded into plan/index.yaml by compaction.
# Do not edit this file. To change something, write a NEW fragment.
packets:
  - packet_id: format-preserving-ledger-compaction
    order: 582-4wdi
    desired_release: v0.5
    title: "Compaction must preserve ledger format: a serde_yaml round-trip deletes 120 operator comments and breaks append-event"
    status: ready
    kind: fix
    deliverable: crates/tillandsias-plan/src/fragments.rs + edit-module-based text compaction + litmus
    depends_on: []
    pickup_role: linux
    capability_tags: [plan, ledger, crdt, rust, tooling]
    estimated_hours: 5
    outcome: >
      The CRDT fragment overlay landed 2026-08-01 with reading fully transparent
      and compaction FAIL-CLOSED. This packet makes compaction usable.
      VERIFIED, not assumed: the current compaction path serializes the merged
      document with serde_yaml, which is not format-preserving, and on the real
      ledger that is destructive in two specific ways. (1) serde_yaml DROPS
      COMMENTS, and plan/index.yaml carries ~120 comment lines including ratified
      operator decisions recorded inline. (2) serde_yaml re-indents list items to
      column 0, while edit::append_event locates packets by the literal prefix
      four-spaces-dash; a round-tripped ledger would silently stop accepting
      events on EVERY packet. Both were confirmed by round-tripping a fixture and
      reading the output.
      So compaction currently REFUSES when the base carries comments or indented
      items, naming both conditions. That is the right default — a tool that
      quietly destroys operator decisions to tidy a file is the worst possible
      trade — but it means the fragment directory grows without bound.
      THE FIX IS ALREADY HALF-BUILT: edit::append_event is format-preserving,
      text-level, and tested. Compaction should reuse it rather than round-trip
      YAML: append new packets as TEXT to the end of the base, route events
      through append_event, and do targeted line replacement for LWW status
      fields. Format preservation then holds by construction rather than by
      careful serialization.
    exit_criteria:
      - "compaction preserves every comment and the exact item indentation, proven by compacting a fixture copy of the REAL plan/index.yaml and diffing"
      - "append-event still resolves every packet after a compaction (the four-space prefix survives)"
      - "the fail-closed guard is removed only when the above two are proven, never relaxed to make the tool run"

  - packet_id: loop-status-crdt-fragments
    order: 582-nqw5
    desired_release: v0.5
    title: "Apply the fragment overlay to plan/loop_status.md, which has the same concurrent-write problem"
    status: ready
    kind: implementation
    deliverable: loop_status fragment overlay + reader + compaction
    depends_on: [format-preserving-ledger-compaction]
    pickup_role: linux
    capability_tags: [plan, crdt, concurrency, tooling]
    estimated_hours: 4
    outcome: >
      Operator 2026-08-01: "our ./plan/index.yaml and I would guess the
      loop_status probably suffer similar high concurrency issues". Correct —
      loop_status.md is a single narrative file every host rewrites, so it
      conflicts for exactly the reason index.yaml did.
      It differs in one way that matters: it is PROSE, not keyed records, so
      there is no packet_id to key a G-Set on. Do not force the index.yaml design
      onto it unexamined. Decide first what the CRDT actually is: probably an
      append-only log of dated host-scoped entries where the rendered file is a
      fold, with the operator-owned Direction section as an LWW-Register that
      only the operator writes. Getting this wrong would silently drop one host's
      status narrative, which is worse than a conflict a human resolves.
    exit_criteria:
      - "the CRDT type for each section of loop_status is chosen and justified, not assumed from index.yaml"
      - "two hosts writing status concurrently produce no git conflict and neither narrative is lost"
      - "the operator-owned Direction section cannot be clobbered by an agent write"

  - packet_id: mcp-and-expert-read-paths-use-the-fragment-overlay
    order: 582-26mm
    desired_release: v0.5
    title: "Every ledger read path must use the fragment overlay, or surfaces disagree about what the plan says"
    status: ready
    kind: fix
    deliverable: images/default/config-overlay/mcp/forge-plan.sh + project-info.sh + any direct YAML readers
    depends_on: []
    pickup_role: linux
    capability_tags: [plan, crdt, mcp, experts, retrieval]
    estimated_hours: 3
    outcome: >
      The tillandsias-plan CLI now reads base plus fragments transparently. Any
      OTHER reader that opens plan/index.yaml directly sees only the base and
      reports a stale ledger WITH TOTAL CONFIDENCE — the most dangerous failure
      shape for a retrieval surface, and the one the expert system exists to
      eliminate.
      Audit every reader. Known candidates: project-info.sh's plan_query (reads
      the YAML with yq+jq directly), any grep-based fallback, the Observatorium,
      and anything consuming plan/index.yaml outside the compiled crate. Each
      either routes through the CLI or is documented as base-only with a stated
      reason.
      The failure to prevent is DISAGREEMENT: if plan_answer says a packet exists
      and plan_query says it does not, an agent cannot tell which surface is
      lying, and both look authoritative.
    exit_criteria:
      - "every ledger reader is enumerated with its verdict (overlay-aware, or base-only-with-reason)"
      - "a fragment-only packet is visible through the MCP tools, proven by querying it — not by reading the code"
      - "a litmus fails if a new direct reader of plan/index.yaml appears without the overlay"
