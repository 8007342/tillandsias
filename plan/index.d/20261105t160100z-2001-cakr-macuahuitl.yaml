  title: A failed CA key refill reports unavailable instead of minting, and a missing Vault certificate is not called expiring
  context: 'Operator asked why a CA restart prompt appears when certificates last a year. The key path links into tmpfs and is refilled from the keyring; ensure_ca_bundle treats an unusable pair as broken and wipes and mints, so a locked or unreachable keyring may re-mint a healthy CA (hypothesis, not observed). expiring_enclave_certs counts a missing or unreadable certificate as expiring, so CERT_EXPIRY_MESSAGE can appear with months left. Related 2000-camv, which only marks --cloud-usage read-only.'
  exit_criteria:
  - 'With a valid certificate and an unreachable keyring, ensure_ca_bundle leaves the CA directory byte-identical and returns a named CA-unavailable refusal.'
  - 'Only a first start or real expiry mints; a key that is truly lost has its own named remedy.'
  - 'A missing or unreadable Vault certificate produces its own message or self-repair, not the expiry message.'
  verifiable_closure: 'Fixture with a scratch HOME and a failing key store; fails on the pre-fix code.'
