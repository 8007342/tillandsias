        expert-groundtruth-harness WAS NOT SKIPPED, AND THE DISAGREEMENT IS RECORDED. The routing asked for a named skip at "a locus with neither binary nor cargo". Measured: this locus had BOTH. The arm built its own candidate from cargo metadata's target_directory — a Windows path with backslashes concatenated with a forward-slash tail — judged it with test -x, and never considered the .exe. target/release/tillandsias-plan.exe existed and answered build-id throughout. A skip would have recorded a capability as ABSENT while the binary sat in the tree: a well-formed verdict about the wrong subject, 1260-2qgi's shape, hiding a small real defect. Fixed instead by sourcing scripts/plan-binary-probe.sh, which is run-don't-stat for non-override candidates and prefers the locus-native artefact. FIFTH INSTANCE of the re-derived-resolution class 704-zcgi centralised that file to end; cross-cited to 1267-uafx, whose "a fourth independent copy is how the first three went wrong" is now a measurement rather than a prediction.

        A CONTROL OF MINE FAILED AND WAS CORRECTED RATHER THAN QUIETLY DROPPED. The first mutation arm asserted that test -x ACCEPTS a chmod +x text file, so that running it would be the discriminator. It does not: Git Bash derives executability from the extension, so the arm could not fail the intended way — a control that proves nothing, written into a row about controls that prove nothing. The comment claiming "the bit lied in BOTH directions" overstated the measurement and was corrected to the one direction observed here: test -x is FALSE for an extensionless ELF that exists. The arm now asserts that, is gated to MSYS, and SKIPS LOUDLY elsewhere, because on Linux the ELF runs and the pre-fix test was correct there — which is exactly how this class survived.
