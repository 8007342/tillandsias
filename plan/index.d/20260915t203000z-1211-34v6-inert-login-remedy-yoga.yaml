          So the text now carries the remedy that was MEASURED to work rather
          than the one that sounded right. From a host-side checkout, `git
          config --get remote.origin.url` returns the repository; from a
          directory without one it returns nothing. The CLI lane run inside a
          checkout therefore resolves and reaches the probe.

          And it says plainly that THE TRAY LANE CANNOT SATISFY IT, because
          without that sentence an operator reads "run it from a checkout",
          looks at their tray, and retries the one lane that structurally
          cannot work. That sentence is what makes the row honest rather than
          merely shorter.

          The env var is still MENTIONED, marked inert, with the reason. Deleting
          the name would leave the next reader to rediscover why it does not
          work — the variable is real and reading about it elsewhere would make
          it look like an oversight rather than a decided non-remedy.

          PINNED: the refusal is lifted into github_login_no_upstream_refusal()
          so it can be tested without running a login, and
          tests::github_login_refusal_names_a_remedy_that_works asserts the
          working remedy is named, the tray's inability is stated, and the env
          var is never offered. FALSIFIED: restoring the old wording reds it.

