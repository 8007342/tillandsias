    title: |
      The GitHub-login push-authorization refusal ends "or set TILLANDSIAS_PROJECT_REMOTE_URL, then try again", and the resolver it guards never reads the environment — so the one remedy an operator can act on immediately returns them to the identical refusal
    context: |
      FOUND while helping yolanda-windows diagnose a login that succeeded and
      then failed to list remote projects (2026-09-15). Their root cause is a
      DIFFERENT defect — the push-authorization probe of order 759-vceg resolves
      the repository from the process CWD, and the tray's login runs inside the
      guest at /root where no checkout exists, so the refusal fires on every
      attempt regardless of the token. That is filed separately by yolanda and
      is the expensive half: where a login should resolve its repository from,
      when the lane it runs in has no checkout by construction, is a design
      decision. THIS ROW IS THE CHEAP HALF AND MUST NOT WAIT BEHIND IT.

      MEASURED, and macuahuitl verified it independently before ruling on the
      split: read_host_project_origin_url runs `git config --get
      remote.origin.url` and falls back to parse_gitdir_origin_url, which reads
      .git and gitdir-pointer files. sanitize_forge_origin_url has zero
      env::var references. Nothing in that chain consults the environment.

      TILLANDSIAS_PROJECT_REMOTE_URL IS REAL, which is exactly what made the
      wrong advice plausible: it is pushed as a container arg, set by the
      cloud-project resolver, and read by the cloud lanes and a post-receive
      hook. It simply is not read by the resolver this check uses.

      WHY IT IS WORTH A ROW RATHER THAN A QUIET EDIT: this is prose asserting
      what the code does not do, sitting in an error message's REMEDY. That is
      the worst location for the class, because it is read only by someone who
      is already stuck, and it costs them a cycle of trying the thing that
      cannot work before they doubt the message. yolanda lost time to it.
