    title: |
      Lua checkers that wrap fs.read in pcall inside a loop over a file listing drop an unreadable file silently, so they can report ok over files they never read
    context: |
      2416-pscn found check-podman-sync-budgets doing this (red: a real violation read ok:0). lines_matching
      was local to that checker, not shared, so the hazard is the pattern: git grep finds 180 pcall(fs.read)
      sites in 143 files, and about 27 scripts/lua/check-* files have one within three lines of a
      for-ipairs loop over files, list, paths, fs.walk or fs.list (a heuristic count). Many pcall reads are
      legitimate: optional files whose absence is a real state. The sweep must tell those from listing loops.
    exit_criteria:
      - Each check-* listing-loop site either blocks or refuses on an unreadable listed file (counted, named), or carries a one-line comment saying why skipping is correct.
      - A guard refuses a new pcall(fs.read) inside a listing loop without that comment.
      - Red first per converted site, where a fixture can make one file unreadable.
    verifiable_closure: |
      The guard reports 0 uncommented listing-loop sites, and each converted checker's fixture shows an unreadable listed file refused.
    unscoreable: "no litmus or fixture scores the sweep yet; the guard in exit_criteria becomes the pin"
    next_action: >
      Triage the ~27 check-* sites (listing loop vs optional file) before converting any.
