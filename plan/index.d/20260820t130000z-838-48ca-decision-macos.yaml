# 838-48ca resolved: KEEP the shell join, ADD a verbatim-argv branch, dispatch
# on the same discriminator the guest allowlist already uses. 795-zshi's exit
# criterion 2 is amended accordingly. Plus 842-nw95, a probe/session gap found
# while doing it.
packets:
  - packet_id: mcp-fix-does-not-reach-a-running-session-and-the-probe-cannot-tell
    order: 842-nw95
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "check-mcp-expert-health.sh spawns a FRESH server per probe, so it reports ok:experts-healthy while the agent session's own long-lived connection is still running pre-fix code and dies on first use"
    deliverable: "the surface check can distinguish a healthy fresh spawn from a healthy LIVE session connection, or says plainly that it cannot"
    pickup_role: any
    release_target: forge-local-experts-milestone
    capability_tags: [mcp, host-shell, telemetry, fail-loud]
    estimated_hours: 2
    context: |
      OBSERVED 2026-08-20, the cycle immediately after 841-ruh9 fixed the
      GNU-date crash that had been killing project-info on first tool call.

      Sequence, all within a few minutes:

        1. scripts/check-mcp-expert-health.sh  -> ok:experts-healthy
        2. scripts/check-mcp-surface.sh attest exposed -> ok:surface-exposed
        3. mcp__forge-plan__plan_next          -> worked, cited, correct
        4. mcp__project-info__grep_code        -> "Connection closed", and
           every mcp__project-info__* tool vanished from the session
        5. driving grep_code by hand against the SAME script -> works fine

      THE EXPLANATION IS MUNDANE AND THE CONSEQUENCE IS NOT. The session's
      project-info process was spawned when the session started — BEFORE
      841-ruh9 landed — so it was still running the buggy code and died on its
      first real tool call, exactly as 841-ruh9 describes. forge-plan survived
      because it never had the bug. The fix on disk was correct; the process in
      the session was stale.

      SO THE PROBE AND THE SESSION MEASURE DIFFERENT THINGS. The probe spawns a
      fresh server per run, which is the right way to test the SCRIPT and the
      only way it can be a cheap standalone check. But an agent does not talk to
      a fresh spawn; it talks to a process started once, at session start, that
      may be arbitrarily old. After ANY edit to a server script — a fix, a
      feature, a rollback — those two disagree until the session restarts, and
      the probe reports the state of the code rather than the state of the
      connection.

      THIS IS ORDER 801-m9tk'S SHAPE IN A NEW FORM, and the skill already warns
      about the general case: "the handshake is not the surface". 801-m9tk
      covers servers that are up but not exposed to the session. This is the
      inverse-in-time: a server whose CODE is healthy and whose SESSION
      INSTANCE is not. The attested-surface half exists precisely because no
      script can see the agent's tool surface — and this is a second thing no
      script can see, for the same reason.

      WHY IT MATTERS BEYOND ONE SESSION: the failure is silent and looks like a
      success. `ok:experts-healthy` plus a green surface attestation is exactly
      the state an agent uses to justify trusting MCP reads. If the live
      connection is stale, the first read either dies (visible, as here) or —
      worse — succeeds against old behaviour with no indication.

      SHAPE OF THE FIX, not prescribed. The honest minimum is that the probe
      SAY what it measured: `ok:experts-healthy(fresh-spawn)` rather than an
      unqualified verdict, so nobody reads it as a statement about their
      session. Beyond that, the surface attestation could carry the session
      start time against the server scripts' mtimes — a script newer than the
      session is a stale-connection warning any host can compute, without
      needing to see the tool surface. Note the operational rule this implies
      and which cost nothing to learn here: after editing an MCP server script,
      restart the session before trusting its tools.

      NOT FILED AS A REGRESSION OF 841-ruh9. That fix is correct and verified
      by the same probe, and by a hand-driven call in this cycle. The gap is in
      what "healthy" is allowed to mean.

