    event:
      type: completed
      ts: "2026-08-20T13:00:00Z"
      agent_id: macos-tlatoanis-macbook-air-opus5-20260820t122223z
      host: macos
      summary: |
        DECISION: KEEP the shell join, ADD a verbatim-argv branch, and dispatch
        on whether argv[0] is an absolute path — the SAME discriminator
        exec_argv_is_allowed already uses to pick its verbatim arm.
        795-zshi's exit criterion 2 must be amended: build_exec_guest_shell_cmd
        is KEPT (scoped to the shell branch), not deleted.

        This is option 2 from the packet, and the deciding evidence is that the
        code already disagrees with itself about which form --exec-guest takes:

          main.rs:106-109 (--help)
            "Words are JOINED and run via `/bin/bash -lc`; quote pipelines as
             ONE string (--exec-guest 'a | b') and never add your own bash/sh
             wrapper"

          diagnose.rs:736 (the empty-argv error)
            "--exec-guest requires a command, e.g. --exec-guest /bin/echo HELLO"

        One tells you to write a quoted shell string; the other's example is a
        verbatim argv vector with an absolute argv[0]. Both are in the same
        flag's user-facing text. Users have been given both stories.

        AND THE ARGV FORM IS THE ONE THE INTERNALS ALREADY SPEAK.
        `exec_guest_main(argv: Vec<String>)` takes a raw vector; main.rs is the
        only thing that flattens, and it flattens immediately before handing
        back a three-element `["/bin/bash", "-lc", joined]`. The vector path is
        not new machinery to build — it is machinery to STOP hiding.

        WHY THIS IS NOT THE TWO-CODE-PATHS TRAP 795-zshi WARNS ABOUT. That
        warning is about two paths for the SAME request. These are two
        different requests: `'head -c 100 /dev/zero | base64'` is a pipeline
        and needs a shell by definition, while `/bin/echo HELLO` is an exec and
        needs no parser at all. A verbatim vector CANNOT express a pipeline —
        that impossibility is exactly what makes the vector form safe, so
        deleting the join would remove a capability rather than simplify one.
        Option 3 (make callers write their own pipeline) just relocates the
        quoting problem to the caller, which is where the four field defects
        came from.

        THE DISCRIMINATOR IS THE LOAD-BEARING CHOICE. Dispatching on "argv[0]
        starts with /" means the host's branch selection and the guest's
        admission decision are the same test, written once on each side, rather
        than two rules that can drift. A caller who writes an absolute path
        gets exec semantics on both ends; a caller who writes a pipeline gets
        shell semantics on both ends. Nothing has to be guessed from quoting.

        FOLLOW-ON WORK, not done here (this packet's deliverable is the
        decision): implementing the branch, and fixing the contradictory help
        text so diagnose.rs's `/bin/echo HELLO` example becomes true rather
        than merely lucky — today it works only because bash happens to run
        `/bin/echo HELLO` correctly after the join. That belongs with 837-m47d
        or its own child, since both touch the same dispatch.
      evidence_refs:
        - "crates/tillandsias-macos-tray/src/main.rs:106-109 — help says JOINED, quote pipelines as one string"
        - "crates/tillandsias-macos-tray/src/diagnose.rs:736 — error example is `/bin/echo HELLO`, a verbatim argv"
        - "crates/tillandsias-macos-tray/src/diagnose.rs:732 — exec_guest_main(argv: Vec<String>) already takes a vector"
        - "crates/tillandsias-macos-tray/src/main.rs:205 — main.rs is the only flattener; builds [/bin/bash, -lc, joined]"
        - "crates/tillandsias-headless/src/exec_allowlist.rs — guest admits verbatim on `argv[0].starts_with('/')`, the proposed host discriminator"
  - packet_id: guest-exec-allowlist-forces-argv-flattening
    event:
      type: note
      ts: "2026-08-20T13:00:00Z"
      agent_id: macos-tlatoanis-macbook-air-opus5-20260820t122223z
      host: macos
      summary: |
        EXIT CRITERION 2 IS AMENDED by 838-48ca's decision.

        As written it requires "a grep for argv_survives_wt_reparse,
        wt_safe_title, and build_exec_guest_shell_cmd returns nothing". The
        first two stand. The third does NOT: build_exec_guest_shell_cmd is
        KEPT, scoped to the shell branch of --exec-guest.

        Reason, in short: `--exec-guest 'a | b'` is a shell PIPELINE, and a
        verbatim argv vector cannot express one — that impossibility is what
        makes the vector form safe. Deleting the join removes a documented
        capability of the diagnostic tool rather than simplifying it. The other
        four workarounds exist to survive a re-parse the vector form
        eliminates; this one exists because the caller genuinely asked for a
        shell. Different in kind, so a criterion that lumps them together is
        wrong about one of them.

        The replacement criterion should be: --exec-guest dispatches on whether
        argv[0] is an absolute path (the same discriminator
        exec_argv_is_allowed uses), the shell branch keeps the join, and the
        contradictory --help / diagnose.rs guidance is reconciled.

        Full reasoning and the evidence trail sit on 838-48ca.
