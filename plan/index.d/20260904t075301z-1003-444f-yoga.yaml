packets:
  - packet_id: the-gate-runs-two-crates-tests-and-names-none-of-the-rest
    order: 1003-444f
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    title: "./build.sh --check runs cargo test for two crates and is silently blind to every other workspace crate"
    status: ready
    kind: bug
    deliverable: the gate runs, or explicitly NAMES as not-run, every workspace crate's test suite — enumerated from the workspace, never hand-listed
    depends_on: []
    pickup_role: any
    capability_tags: [ci, build, testing, rust]
    estimated_hours: 3
    unscoreable: >
      The pin IS the deliverable, so at filing time there is no litmus to
      name. Naming the intended test up front produces a dangling reference,
      which the 885-92iu gate correctly refuses — I tried it and it refused,
      which is the gate working. Recording the intended shape here instead,
      so this is a stated reason rather than the silence 977-448j refuses:
      the deliverable creates litmus:gate-test-coverage-names-every-crate,
      pinning that a crate added to the workspace with a deliberately failing
      test either turns ./build.sh --check red, or appears BY NAME in the
      gate's not-run list with a reason. The fixture must prove it by ADDING
      a crate rather than by asserting against today's set — a check that
      enumerates by hand cannot detect the crate nobody remembered to add,
      which is the whole failure being closed. Its negative control is the
      pre-fix shape: a crate whose suite is neither run nor named must fail.
      Once that litmus exists this row should carry it as a normal
      verifiable_closure.
    outcome: >
      Found 2026-09-04 on yoga. `tillandsias-core`'s
      rust_and_shell_expand_to_the_same_path was RED at linux-next HEAD while
      ./build.sh --check reported green — measured on the same tree, twice,
      by the two land-on-platform-branch runs this host made that morning.
      The test fails because three ca_path tests each set the process-global
      HOME under `unsafe set_var` and cargo runs them concurrently in one
      process, so the assertion reads another test's value. macbookair found
      it from osx-next and fixed it there (6fe514a06, 1002-9xmb); the fix is
      not what this packet is about. THE GATE NOT SEEING IT IS.
      THE PRECEDENT IS IN-TREE AND CARRIES ITS OWN WARNING. build.sh has a
      dedicated `cargo test -p tillandsias-plan` step whose comment records
      that the ratchet's whole premise is that no gate ran cargo test. It
      also records a second, sharper miss: `--lib` rode that command until
      2026-08-22, which made the ratchet blind to the binary's own tests, and
      two of them sat RED for several cycles while --check reported green.
      Its own words: "scoping it to one target recreated that blind spot
      inside the fix."
      That is why the fix here must NOT be "add a tillandsias-core step".
      That is the identical move one crate over, and it would leave the third
      crate to be discovered the same way in a month — tillandsias-core is
      the instance, "any crate outside plan and headless" is the class. The
      enumeration has to be DERIVED from the workspace, so a newly added
      crate is covered on the day it lands rather than on the day someone
      remembers it.
      COST IS PRE-ANSWERED and should not be relitigated from scratch: the
      same comment records that dropping --lib cost ~0.0s, and
      tillandsias-core is 201 tests (0.33s measured on macbookair; the
      197-filtered count corroborates the total here). Whatever the objection
      to widening --check turns out to be, it is unlikely to be time for the
      pure-assertion suites. Crates with genuinely slow or
      environment-dependent suites are the real design question, which is
      why "names as not-run" is an acceptable outcome and silence is not.
    exit_criteria:
      - "every workspace crate's test suite is either run by the gate or named by the gate as not-run, with the reason"
      - "the crate list is derived from the workspace (cargo metadata or equivalent), never hand-maintained, and a fixture proves it by adding a crate rather than by asserting today's set"
      - "a crate whose suite is skipped for cost or environment says so by name, so silence never stands in for a pass (965-sxec)"
      - "the tillandsias-core instance is covered: a red test in that crate turns ./build.sh --check red"
    events:
      - type: progress
        ts: "2026-09-04T07:53:01Z"
        agent_id: "linux-yoga-claude-20260904t072938z"
        host: yoga
        summary: >
          Filed from a red test that coexisted with two green gate stamps on
          the same tree, measured at HEAD with none of macbookair's changes
          present. Coordinator struck this from their own filing list so it
          is not filed twice. The precedent's own comment supplies both the
          pattern and the warning against applying it per-crate.
