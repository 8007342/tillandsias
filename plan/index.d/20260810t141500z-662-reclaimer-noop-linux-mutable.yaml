    title: "reclaim-stranded-claims.sh reports candidates=7 reclaimed=0 in --apply mode; the sweep is a no-op"
    kind: bug
    deliverable: scripts/reclaim-stranded-claims.sh
    depends_on: []
    pickup_role: linux
    capability_tags: [plan-ledger, stranded-claims, coordination, no-op]
    context: >
      Run at the end of the overnight coordinator loop as a handoff sweep:

        $ scripts/reclaim-stranded-claims.sh --apply
        summary: candidates=7 reclaimed=0 mode=apply

        $ scripts/check-stranded-in-progress.sh
        summary: in_progress=7 stranded=7 threshold_events=0

      Identical before and after. The detector and the reclaimer agree there are seven
      stranded claims; the reclaimer then releases none of them, and says so in a line
      that reads like a successful run. `mode=apply` with `reclaimed=0` is not an error
      and does not exit non-zero.

      The seven have been stranded across this entire session (they were 21 earlier
      today, brought to 9 and then 7 by hosts closing them by hand):

        184   linux       secure-channel-maturity-ladder
        394e  linux       plan-methodology-experts-rung1/expert-launch-state-and-ephemerality
        437   linux       forge-src-tmpfs-topology
        448   linux       cheatsheet-image-copy-drift-prevention
        456   unassigned  forge-plan-metadata-mcp-server
        463   linux       vault-host-endpoint-soak-fragility
        568   linux       claude-mcp-config-registration

      Every one is a packet marked in_progress that no host is working. They are
      invisible to `next` (leased) and to the batch selector, so they are removed from
      circulation by a claim nobody holds — which is 641-e2qa's subject, except that
      here the REMEDY exists and does nothing.

      A tool that reports finding the problem and then silently declines to fix it is
      worse than an absent tool: two hosts this session read `candidates=N` as evidence
      the sweep was working.
    exit_criteria:
      - >
        `--apply` either reclaims the candidates it names, or refuses with a typed
        reason per candidate saying why it will not (age, owner, missing lease record).
        Silence with reclaimed=0 is not an acceptable outcome of an apply run.
      - >
        `candidates>0 && reclaimed==0 && mode==apply` exits non-zero, so a no-op sweep
        cannot read as success in a cycle log.
      - >
        NEGATIVE CONTROL: a genuinely fresh claim (inside the TTL) must be listed as a
        candidate=0 case rather than reclaimed, proving the tool can still decline
        correctly.
    verifiable_closure: >
      After an --apply run, check-stranded-in-progress.sh reports a strictly lower
      stranded count, or the run exits non-zero naming each packet it would not touch.
    notes: >
      Related to 641-e2qa (stranded packets invisible both ways), which Windows has been
      draining by hand. This is the automated path that should have made that unnecessary.
      Worth pairing them when either is picked up.
