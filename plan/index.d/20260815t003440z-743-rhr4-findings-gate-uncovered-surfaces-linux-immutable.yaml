    kind: bug
    title: "The persistence gate covers four paths, but documented finding surfaces sit outside them — a committed+unpushed finding in plan/diagnostics/ or plan/forge-improvements/proposals/ reports ok:no-findings"
    deliverable: "FINDING_PATHS in scripts/check-forge-findings-persisted.sh widened to every surface skills instruct agents to file findings into (or an explicit, audited exclusion list)"
    pickup_role: linux
    capability_tags: [forge, plan, fail-loud, ephemerality, adversarial-review]
    estimated_hours: 2
    context: |
      Attack on scripts/check-forge-findings-persisted.sh (order 741-3y48),
      found in the end-to-end verification of that fix. The gate hard-codes:

          FINDING_PATHS="plan/index.d plan/loop_status.d plan/issues plan/mo-full-attestations.d"

      but two other locations are DOCUMENTED finding surfaces that in-forge
      agents are told to write to:

        * skills/build-windows-tray/SKILL.md step 2 — "Capture findings into a
          per-day file in plan/diagnostics/" (a third of the way down: "Capture
          findings into a per-day file in plan/diagnostics/").
        * skills/forge-continuous-enhancement/SKILL.md — "File findings, bugs,
          and enhancement proposals under ./plan/issues/ or
          plan/forge-improvements/proposals/".

      plan/issues/ is covered; the other three are not. A finding committed to
      an uncovered path and never pushed is invisible to both halves of the
      gate: `git status` shows it as a clean tracked commit, and
      `git rev-list origin/linux-next..HEAD -- <covered paths>` counts zero
      commits. The gate prints `ok:no-findings` rc=0 while the finding exists
      only on a filesystem about to be destroyed.

      EMPIRICAL (throwaway repo, real bare remote, gate at HEAD):
          mkdir -p plan/diagnostics
          printf '# diag finding\n' > plan/diagnostics/2026-08-15.md
          git add plan/diagnostics/2026-08-15.md && git commit -qm diag
          scripts/check-forge-findings-persisted.sh   # -> ok:no-findings rc=0
          git ls-tree origin/linux-next plan/diagnostics/  # -> nothing
          git rev-list --count origin/linux-next..HEAD     # -> 1 (ahead, unpushed)

      Same result for plan/forge-improvements/proposals/. This defeats exit
      criterion 2 of 741-3y48 ("a forge cycle that produces fragments and
      CANNOT persist them fails loud") for every agent whose skill routes its
      findings into an uncovered directory.
    exit_criteria:
      - "Every directory that a shipped skill tells an agent to file findings into is covered by FINDING_PATHS (or is explicitly named and argued as safe to exclude)."
      - "A committed+unpushed finding in plan/diagnostics/ and one in plan/forge-improvements/proposals/ each fail the gate with unpersisted:unpushed."
      - "The negative control still holds: a clean cycle prints ok:no-findings."
    notes: |
      Consider deriving the path set by scanning skills for 'plan/<dir>' writes
      rather than maintaining a second list, or pin a litmus asserting the set
      of covered paths ⊇ the paths skills write to. Anything an agent is told
      to file into is a finding surface by definition.
