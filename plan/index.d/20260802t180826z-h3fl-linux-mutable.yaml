packets:
  - packet_id: fleet-enrollment-one-tillandsia-per-node-research
    order: 595-6y8b
    desired_release: v0.7
    title: "Research: enroll a fleet of always-on nodes by launching a Tillandsias and logging in — no ansible, no manual setup"
    status: ready
    kind: research
    deliverable: plan/issues/ research doc + decision record
    depends_on: [mesh-identity-plane-research, node-discovery-and-uptime-affinity]
    pickup_role: any
    capability_tags: [research, mesh, fleet, provisioning, raspberry-pi, vision]
    estimated_hours: 8
    outcome: >
      OPERATOR CONTEXT 2026-08-02, and it is the sharpest product framing so far:
      "they're like one abstraction layer on top of docker containers and
      ansible. I don't want to deal with a fleet."
      THE CONCRETE SITUATION: the operator owns FIVE Raspberry Pi 5s, each with a
      1 TB NVMe drive, explicitly chosen to be ALWAYS ON rather than fast. One is
      currently running Ubuntu Server with NextCloud, DNS and assorted docker
      containers, "handled manually", which they hate. The target flow is: boot a
      Pi 5 on the Fedora 44 cloud image, launch a Tillandsias, log in, and it
      joins the mesh as a 24/7 node ready to carry always-on production
      containers.
      THE COMPETITOR IS NOT A CLOUD PROVIDER — it is manual homelab
      administration plus ansible. That sets the bar precisely: not "it works"
      but "it stops being manual", and enrolling the fifth node must cost the
      same as enrolling the first. Any design where per-node effort grows with
      fleet size has failed on its own terms, however elegant.
      WHAT THIS PACKET MUST ANSWER, none of which is settled:
      What exactly does "log in" enroll? A node presumably authenticates as the
      OPERATOR, but thereafter acts as a NODE — those are different principals
      and the mesh identity work (mesh-identity-plane-research) has to express
      both. A design where every node holds the operator's own credential is the
      failure this project has already made once with a GitHub token.
      What is the trust-on-first-use story? A brand-new headless Pi with no
      screen must join without the user performing a security ritual they do not
      understand — that open question is already recorded in the vision doc and
      lands here concretely.
      What happens when a node is re-imaged, replaced, or stolen? Enrollment
      without revocation is half a system, and a stolen always-on node is a
      credible threat for hardware sitting in a house.
      Does enrollment need a fleet-wide view at all? The operator does NOT want
      to manage a fleet, which argues against any dashboard-of-nodes model and in
      favour of nodes announcing capability and the mesh routing to them —
      consistent with node-discovery-and-uptime-affinity measuring uptime rather
      than asking.
      RELATIONSHIP TO EXISTING WORK, so this does not grow a parallel mechanism:
      identity comes from mesh-identity-plane-research, discovery and affinity
      from node-discovery-and-uptime-affinity, the arm64 artifact from
      arm64-native-build-for-fedora-on-raspberry-pi-5, and the production posture
      from production-posture-no-network-tunnel-only. This packet owns only the
      ENROLLMENT experience and what it implies for those.
    exit_criteria:
      - "enrolling the fifth node costs the same as the first, demonstrated rather than asserted"
      - "the distinction between the operator's identity and a node's identity is explicit, and no node holds the operator's own long-lived credential"
      - "first-join requires no security ritual a non-technical user cannot perform, or the required interaction is specified and justified"
      - "revocation is designed alongside enrollment, including the stolen-node case"
      - "no fleet dashboard is required for normal operation; nodes announce, the mesh routes"

  - packet_id: nextcloud-as-a-tillandsias-service-research
    order: 595-ic3d
    desired_release: v0.7
    title: "Research: NextCloud as a managed Tillandsias service on always-on nodes, replacing the operator's hand-run instance"
    status: ready
    kind: research
    deliverable: plan/issues/ research doc + decision record
    depends_on: [mesh-persistent-storage-substrate-research, enclave-service-catalog-milestone]
    pickup_role: any
    capability_tags: [research, nextcloud, storage, service-catalog, mesh, vision]
    estimated_hours: 6
    outcome: >
      OPERATOR DIRECTION 2026-08-02: "we'll still want NextCloud in a tillandsia
      at some point, in the 24/7 affinity hosts." This is a real migration
      target, not a hypothetical — the operator runs NextCloud by hand on a Pi
      today and wants it managed instead.
      WHY THIS IS A GOOD FIRST STATEFUL SERVICE, and worth doing before the
      database work: NextCloud is exactly the workload a shared or replicated
      FILE layer serves, because unlike Cassandra and PostgreSQL it has no
      application-level replication of its own. It therefore exercises the file
      half of the storage substrate honestly, while databases exercise the
      local-NVMe half. Getting NextCloud right teaches us the file layer without
      risking transactional data.
      IT ALSO CARRIES ITS OWN DATABASE, which is the trap. NextCloud needs
      PostgreSQL or MariaDB underneath, so "add NextCloud" implicitly provisions
      a database — meaning this packet cannot be designed independently of
      add-a-database-one-prompt-capability-research, and the database it creates
      must follow the same broker-pattern credential rules rather than a
      NextCloud-specific shortcut.
      MIGRATION IS THE DELIVERABLE, NOT A FRESH INSTALL. The operator has
      existing data on a hand-run instance. A design that only handles green-field
      installs leaves them doing the hard part manually, which is the exact thing
      they are trying to stop doing.
    exit_criteria:
      - "the file-storage layer NextCloud sits on is chosen against the substrate research, not invented here"
      - "the database NextCloud requires is provisioned through the same mechanism as any other, with the same credential discipline"
      - "migration from an existing hand-run instance is designed, with the data path stated"
      - "the service survives the loss of any single node, or its single-node limitation is stated explicitly"
