packets:
  - packet_id: pickup-role-goes-stale-as-slices-land-and-routing-cannot-see-it
    order: 884-hfsj
    status: ready
    kind: bug
    priority: p2
    pickup_role: linux
    desired_release: v0.5
    depends_on: []
    estimated_hours: 4
    capability_tags:
      - plan
      - coordination
      - fleet
      - convergence
    tags:
      - work-selection
      - routing
      - v0.5
    title: |
      `pickup_role` records who could claim a packet WHEN FILED and never narrows as slices land, so a host is offered the same un-advanceable batch every cycle — measured five cycles running, four of five items un-advanceable.
    deliverable: |
      Routing can see which lane a packet's REMAINING work needs, not only which
      lane could have claimed it at filing time — either by honouring the
      already-defined `owner_host` field, by decaying `pickup_role` as slices
      land, or by a recorded decision that this is the operator's to steer.
    context: |
      MEASURED on yoga (linux_immutable) across FIVE consecutive cycles,
      2026-08-25 from 09:43Z through 17:43Z. Every one selected the same batch:

        batch: epic=architecture-audit-epic role=linux size=5 seed=yoga
               pick=2/7 route=rank:6/7:width=7

      Four of its five items cannot be advanced by a Linux host, and every one
      of them says `pickup_role: any`:

        * 795-zshi   — its Linux item (the vsock-exec-authz spec reconciliation)
                       was discharged 2026-08-25T00:47Z. Every remaining
                       next_action item is macOS-lane: feature-detect
                       CAP_EXEC_ARGV_VECTOR in a bridge that compiles to a
                       cfg-gated stub on Linux, and the --exec-guest
                       discriminator 838-48ca decided on.
        * 795-5itp   — the two remaining framing sites are pty_vsock_bridge
                       (macOS) and hvsocket (Windows), both dispositioned on the
                       record with their hazards named.
        * 245        — the Linux revision slice landed; what remains is the
                       macOS items and three named verification agents.
        * 251        — what remains is three named verification agents, none of
                       which is a Linux builder.

      THE FACT THAT WOULD FIX THE ROUTING IS ALREADY WRITTEN DOWN — IN PROSE.
      Each of those packets carries a progress event saying exactly which lane
      the remainder needs, because the hosts that did the earlier slices were
      careful. The selector cannot read prose, so the careful handoff is
      invisible to the only mechanism that acts on it.

      AND THE SCHEMA ALREADY HAS THE FIELD. `owner_host` is defined in
      methodology/distributed-work.yaml and carried by 45 packets in the
      ledger. Nothing reads it: no hit in scripts/select-work-batch.sh, none in
      crates/tillandsias-plan/src/. It is an inert field that looks like
      routing metadata, which is worse than an absent one — a host writing it
      believes it has steered something.

      WHY THIS IS NOT THE CAPABILITY GAP THE SELECTOR ALREADY KNOWS ABOUT. Its
      own comment (near TOOL_CAP_TAGS) says "pickup_role answers 'which LANE
      may claim this'; it says nothing about what the HOST can actually run",
      and closes that hole by intersecting capability_tags with probed tools.
      That is a different axis. Here the lane itself is wrong: `any` was TRUE
      when the packet was filed and stopped being true as slices landed. Nobody
      lied; the field simply has no decay.

      COST, and why it is not merely untidy: a cycle's batch selection is its
      orientation step. On this host it has produced no actionable head packet
      for five cycles, and each cycle paid the selection cost, read the same
      four packets' events, and re-derived the same conclusion before finding
      work elsewhere in the batch. That is the arrival-control concern of
      831-ezea seen from the SERVICE side — velocity spent on re-orientation
      rather than on drain.
    exit_criteria:
      - |
          Work selection accounts for the lane a packet's REMAINING work needs.
          Any of three outcomes is acceptable and one must be chosen on the
          record: honour `owner_host` in the selector; narrow `pickup_role`
          when a slice lands (with the narrowing recorded as an event, since it
          is a claim about the world); or a recorded operator decision that
          lane-steering stays manual — in which case `owner_host` is deleted or
          documented as advisory, because an inert routing field is a trap.
      - |
          NEGATIVE CONTROL: a fixture packet whose remaining work is macOS-only
          is proven NOT to be offered to a linux selection, and the same packet
          IS offered to a macos selection. Both halves, or the change is
          untested in the direction that matters.
      - |
          POSITIVE CONTROL: a genuinely any-lane packet is still offered to
          every lane, so the fix cannot be "narrow everything and starve the
          pool".
      - |
          The five-cycle repeat measured above does not recur: a linux
          selection on this ledger state yields a batch whose head packet this
          host can actually advance, or the selector says plainly that it
          cannot and why (`refused:` already has that shape).
    verifiable_closure: |
      A fixture ledger with one macOS-remaining packet and one any-lane packet,
      run through the selector for both lanes, asserting the four-way outcome
      (macOS-remaining offered to macos and withheld from linux; any-lane
      offered to both). The withholding half is load-bearing — a selector that
      offers everything to everyone passes any test that only checks presence.
    notes: |
      Do NOT "fix" this by editing the four packets' pickup_role by hand. That
      treats the instance and leaves the mechanism, and the same drift will be
      back within a week as the next round of slices lands — the same trade
      that made plan/long-running.md drift twice (order 251 LM-04).

      Sibling context: 847-wgy4 routes by ordinal rank in the capability matrix,
      which is what pins this host to one epic; that is working as designed and
      is not the defect. The defect is that the epic it pins to can be empty for
      this lane and nothing notices.
