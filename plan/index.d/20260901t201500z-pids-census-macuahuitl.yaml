packets:
  - packet_id: forge-pids-ceiling-512
    order: 959-fpc5
    status: ready
    kind: fix
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    depends_on: []
    capability_tags: [forge, images, podman]
    title: >
      The forge container's pids.max=512 is reachable in NORMAL operation on
      floor hardware — two hosts, two kernels, two virtualization stacks,
      same ceiling; fork denials kill MCP servers as collateral.
    context: |
      TWO-HOST, kernel-counter evidence (2026-09-01): pirria (N150/CachyOS/
      native podman) hit live fork failures mid-evaluation and read
      /sys/fs/cgroup/pids.events = 'max 140' once recovered — the kernel
      counted 140 fork denials in one container lifetime; during exhaustion
      even reading pids.current was impossible (instrumentation from inside
      dies with the patient). esmeraldinha (N100/WSL2) independently hit
      the identical symptom ('git status' failing with 'unable to create
      threaded lstat: Resource temporarily unavailable' at 6.6GiB free) and
      initially misattributed it to WSL2 — the pair proves it is not
      host-level. CORRECTED SOURCE (esmeraldinha): pids.max is a RUNTIME
      flag (--pids-limit at podman run), no image can carry a cgroup value
      — it travels with the LAUNCHER. Flag sites at ad4a84773:
      crates/tillandsias-headless/src/main.rs:3236 and :6510 = 4096 (raised
      by 65fe4e766, order 667-se87, after clone() EAGAIN killed workspace
      builds); scripts/orchestrate-enclave.sh:322 and :404 = 512;
      run-forge-standalone.sh passes none. Both floor guests' hostnames
      match orchestrate-enclave's forge-$PROJECT convention, so the live
      512 is MOST LIKELY the shell launcher — meaning 667-se87's fix was
      PARTIAL (raised the Rust sites, left both shell sites) and this
      packet is its continuation. That attribution is held PENDING
      esmeraldinha's three-lens adversarial verification (alternatives in
      test: containers.conf, inherited parent slice) plus pirria's
      /proc/1/cmdline discriminator — record facts now, act after the
      verdict. Second counter banked: esmeraldinha pids.events 'max 100',
      pids.peak=512 EXACTLY, pids.current=30 at read time — live sampling
      structurally misses this; the persistent counters are the only
      honest instrument. Sharpener: memory.max/high and
      cpu.max are all unbounded — PIDs are the ONLY capped resource in a
      forge guest, so the triage rule is 'every resource incident in a
      forge is a PID incident until proven otherwise'. COLLATERAL: pirria's
      project-info MCP server died with CONNECTION_CLOSED during the
      exhaustion window and did not return — 'MCP server died' can be a
      pids symptom, which reframes part of 956-llei's precondition-hole
      arm (a leaked-gate FAIL may be downstream of pid exhaustion, not an
      independent absence). Contributors on floor hardware include the
      boot-time cargo -j4 expert build + 199MiB vendor extract + agent
      harness fan-out (capped at cores-2 but each agent forks freely).
      Attribution between contributors is honestly unknown (the counter is
      cumulative); what is certain is 512 is reachable twice on two hosts.
    verifiable_closure: |
      Either pids.max is raised to a value with measured headroom on the
      4-core class (with the new value justified against the same
      pids.events counter reading 0 denials over a full evaluation +
      litmus cycle on a floor host), or the heavy boot-time contributors
      are serialized (953-fflt's scheduling fix) such that pids.events
      shows zero denials under the same load, or both.

