    title: |
      1118-bscs pinned the credential helper to github.com so it stops answering any caller with a live token; litmus:git-mirror-vault-agent-auto-auth relays to https://github.example.invalid/org/repo.git and the helper now refuses it, so the release tier (ci-full) has been red on this fixture since the fix landed and nothing in ./build.sh --check runs it. The security fix is right; the fixture needs an explicit test-only host seam, and the fixture must keep proving the helper refuses everyone else.
    context: |
      MEASURED on macuahuitl 2026-09-13, release-tier exercise
      local-ci-20260913T161117Z (rc 1, 7 litmus reds) and then standalone:
      case 1 ok (AppRole material reaches tmpfs files, never Agent argv), then
      "FAIL: initial relay transaction failed"; the relay log, surfaced by a
      temporary patch: "[relay] Atomic push to https://github.example.invalid/
      org/repo.git FAILED: git-credential-tillandsias: refusing to supply the
      GitHub token to host 'github.example.invalid' (1118-bscs)". Deterministic,
      not environmental. The fix landed as a security correction (the helper
      answered any caller); the fixture's fake upstream is exactly the caller
      the pin exists to refuse.

      WHAT TO BUILD. A test-only seam the fixture sets explicitly (for
      example TILLANDSIAS_GIT_CREDENTIAL_ALLOW_HOST=github.example.invalid)
      that the helper honours only when set and logs when honoured, so the
      production default stays github.com; the fixture sets it beside its
      fake upstream. The 1118-bscs fixture keeps its refusal arm for an
      arbitrary host with the seam unset, and gains an arm that the seam
      does not leak: set for host A, a request for host B is still refused.

      WHY p1: the release tier is the only gate that runs this fixture, so
      every daily cut from here is red on it until fixed, and the 890-27mv
      exercise exists to surface exactly this. NOT IN SCOPE: widening the
      production pin.
    exit_criteria:
