    title: |
      A container browser window's enumerateDevices still lists an audioinput, because the output-only Pulse server lets a client list source names; a device label can carry a host device name (minor fingerprinting)
    context: |
      MEASURED on yoga 2026-10-17 with 1767-5q4b's image (managed policy denies capture): getUserMedia rejects NotAllowedError with no prompt, yet enumerateDevices() still returns ["audioinput","audiooutput"]. Chromium's --disable-audio-input did not remove the entry (tried and dropped in 1767-5q4b). The source of the entry is the output-only server's documented residual in crates/tillandsias-headless/src/host_audio_pulse.conf: "a client can LIST source and sink names (metadata only, no audio). Device names can fingerprint a host." Capture itself is refused at two layers (managed policy, block-record-stream), so this is metadata only.
    exit_criteria:
      - "in a container browser window, enumerateDevices lists no audioinput (red today), and a client of the output-only server cannot list host source names"
      - "NEGATIVE CONTROL: a 440 Hz tone from the window still reaches the host's default sink"
    verifiable_closure: "cargo test -p tillandsias-headless host_audio"
    next_action: >
      Find the PipeWire/pulse-server rule that hides sources from a restricted client (a permission or object filter on the restricted address), measure enumerateDevices and `pactl -s <socket> list sources short` before and after, red first.
