  - packet_id: per-model-groundtruth-query-vectors-so-a-second-embedding-model-can-be-graded-validly-with-each-vector-set-carrying-the-model-identity-that-produced-it
    order: "1259-dgaq"
    status: ready
    kind: enhancement
    priority: p2
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    pickup_role: any
    capability_tags: [experts, rag, groundtruth, embeddings, provenance]
    estimated_hours: 6
    owned_files:
