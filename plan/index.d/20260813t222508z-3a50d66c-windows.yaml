      summary: >
        Exit criteria extended (2026-08-13): the check must assert the TIMESTAMP countersignature, not only the Authenticode signature. Artifact Signing certificates are valid three days, so a signed-but-untimestamped artifact verifies green on the release run and is untrusted for users the same week — a defect no release-time check catches unless it looks for the countersignature specifically. The negative controls grow accordingly: unsigned, tampered, AND signed-without-timestamp must all fail.
