      summary: |
        THE ONE TRUE GARBAGE COLLECTOR IS UNSAFE TO RUN, which is very likely
        why it has not run since 2026-07-05 and why the ledger has grown 91x.
        Found by dry-running it rather than trusting its own --check.

        WHAT IT WOULD DO, measured on a copy: archive 543 packets, cut
        plan/index.yaml from 60,241 to 25,462 lines — a 58% reduction, the
        single largest lever available against the queue growth the operator is
        standing the fleet down over.

        WHAT IT WOULD ALSO DO: silently remove TWO READY ROWS. Live ready = 410;
        after archiving = 408. The missing two are 424
        (git-mirror-credential-lifecycle) and 437 (forge-src-tmpfs-topology),
        and in the archived copy both answer `no packet matches`. Live,
        schedulable work would have vanished from selection with no verdict
        naming it.

        ROOT CAUSE, and it is structural rather than a slip:
        `grep -cE 'index\.d|fragment' scripts/archive-plan-packets.rb` -> 0.
        THE ARCHIVER NEVER READS plan/index.d AT ALL. It decides from the base
        index alone. But status is an LWW register over base PLUS fragments, so
        a packet closed in the base and later REOPENED by a fragment reads
        terminal to the archiver and ready to everything else. 424 and 437 are
        exactly that shape.

        A SECOND DEFECT IN THE SAME LINE OF SIGHT:
        archive-plan-packets.rb:53 decides closure with
        `line.match?(/^[ \t]*status: (completed|done|obsoleted)/)` — a LINE GREP
        over raw YAML, which cannot distinguish a packet's own status from one
        nested inside an event. That is the 752-pst5 class this project already
        fixed elsewhere by switching to a YAML parse, for exactly this reason.

        WHY --check DID NOT CATCH IT, which is the lesson worth keeping.
        `--check` copies plan/ and runs the archiver TWICE, then diffs the two
        outputs. That proves IDEMPOTENCY and nothing else. An archiver that
        deterministically archives the wrong rows is perfectly idempotent, and
        --check prints "Check passed: script is idempotent." A self-check that
        verifies the wrong property is worse than none, because it is quoted as
        assurance — the freshness stamp in the script header cites --check as
        evidence the tool is sound.

        BEFORE ANY CADENCE, THE FIX: read the FOLD, not the base index. The
        binary already exposes it — `tillandsias-plan query --status` answers
        which packets are terminal under LWW, and Ledger::collect_archived_ids
        (lib.rs:295) already keeps plan/archive referentially sound. The
        acceptance test writes itself: ready count MUST be identical before and
        after, and that assertion is what --check should have been.
