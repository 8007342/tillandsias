packets:

  - packet_id: in-forge-delegate-disposition-unobservable
    order: 690-2kwd
    status: ready
    desired_release: v0.5
    priority: p2
    title: "Stage-0 in-forge delegate ends with no recoverable disposition — the host cannot tell finished-cleanly from silent-death"
    kind: infra+observability
    deliverable: a delegate-outcome channel the host loop can read at cycle end (finished-with-evidence | still-running | died-silently), plus a forge-churn note
    depends_on: [forge-delegation-concurrency-ramp]
    pickup_role: linux
    capability_tags: [orchestration, forge, delegation, observability]
    context: >
      First stage-0 cycle (2026-08-11 night). BigPickle was launched in a
      ptyxis window with a surgical 682-z5h8 verify prompt. At cycle end the
      opencode process was gone, the forge containers (git/inference/forge)
      were torn down, vault/router/proxy remained, and NO ledger evidence
      (no 682-z5h8 progress event, no filed packet) was recovered — exactly
      the "session that ends without a recorded outcome is itself a finding"
      case the methodology names. The host cannot currently distinguish
      (a) delegate finished and recorded nothing, (b) delegate still working
      elsewhere, (c) silent mid-task death (the known in-forge failure mode).
      The ptyxis launcher's exit 0 signals only that the WINDOW opened, not
      that the agent completed. Compounding: the forge stack churned under
      the host loop's own 579 live-verification (mirror container disappeared
      mid-config-read), making host-side live checks against a delegate-shared
      stack unreliable. Stage-0's cycle_protocol ("if finished, harvest its
      ledger evidence") assumes a readable disposition that does not yet exist.
    exit_criteria:
      - the host loop can read a delegate's terminal disposition at cycle end from a durable channel (a marker file under the boundary tmp dir, a forge-side status the tray exposes, or a required ledger event), distinguishing finished-with-evidence / still-running / died-without-outcome
      - a delegate that dies silently is detectable as such within one cycle and filed automatically, never mistaken for a clean finish
      - the host loop's own live verification is isolated from delegate-driven forge teardown, or the protocol schedules host live-checks against a host-owned stack the delegate does not recycle
    events:
