      Design D3/D4 of openspec/changes/os-verified-approval-gates. Adds an approval broker module to tillandsias-headless and a `tillandsias approval request|verify` subcommand. The statement is canonical text (action, project, target, from, to, detail, host, strength, nonce, issued, expires) signed as SSHSIG with namespace tillandsias-approval@v1. Git actions are recorded as a note under refs/notes/tillandsias/approvals with a hash-free first-line sentence; merges made by host tools also get an Approved-by: trailer. Non-git actions go to a host approvals journal.

      [2026-10-25T22:11:42Z macuahuitl] AMENDED by operator rulings 2026-10-25 (design R1-R3): the broker mints GRANTS (tillandsias-grant v1: action, target, scope once|10m|2h|session|standing, issued, expires) signed by the device key; grants are stored in Vault by 1890-yc53; the journal under refs/notes/tillandsias/approvals is hash-chained and append-only (authoritative trail). Exit criterion additionally: a once grant is consumed by its use, and a 10m grant covers only its action class and target.
    ts: "2026-10-25T22:11:42Z"
    host: macuahuitl

