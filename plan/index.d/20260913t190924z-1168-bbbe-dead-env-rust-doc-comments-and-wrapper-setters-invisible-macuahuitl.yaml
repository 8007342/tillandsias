    context: |
      Two regex families must grow, plus self-test arms; no deletion or doc line closes it. Verified in source: the comment pass matches '^[[:space:]]*#.*TILLANDSIAS_...', so every Rust '///' and '//!' doc comment in the corpus is unreadable to it; the assigns pass matches only literal 'set_var("VAR"'/'.env("VAR"', so a test helper that wraps std::env::set_var under any other method name is unreadable too. Together they can mark a variable dead that is documented at its read site AND assigned by five passing tests.

