    owned_files:
      - scripts/check-long-running-view.sh
    title: |
      check-long-running-view.sh runs in the land gate, so a stale row costs the NEXT HOST TO LAND a full gate — the author of the staleness is never the one who is told about it.
    context: |
      MEASURED 2026-09-15, and the author is the filer. I completed order 330 on
      the operator's ratification. 330 is multi_cycle with NO verification gate,
      so self-completion was legitimate and the closure stands. What I did not do
      was remove its row from plan/long-running.md, which the view declares to be
      a filtered view of ACTIVE multi_cycle packets — so a terminal packet must
      leave it.
        violation:long-running-view:missing=0:stale=1
          stale: 330
      THE COST LANDED ON SOMEONE ELSE. The check runs at build.sh:3954, inside the
      gate, so the refusal fires for whoever lands NEXT — tonight yoga, who had to
      verify the refusal was not theirs (they moved their own fragment out of the
      tree and re-counted references to prove it), locate the owner, and decide
      whether to edit another host's lane. The person with the least context pays,
      and the person who could have fixed it in the same keystroke never sees it.
      THE CHECKER ITSELF NAMES THE RIGHT MOMENT and cannot enforce it: its message
      says the removal belongs "in the same commit as the change that moved it".
      That is a completion-time instruction delivered at land time, to a different
      person. Everything needed to refuse earlier is present at the flip —
      set-field knows the packet, knows the new status is terminal, and can read
      whether multi_cycle is true and whether a row exists.
      WHY NOT JUST GENERATE THE VIEW: the checker explains that too, and it is
      right — "the prose columns are editorial and cannot be generated — that is
      why this checks membership, not rendering". The fix is not to auto-write the
      file; it is to refuse the FLIP that would strand it, naming the row.
      CLASS. This is the shape the fleet has been finding all day from other
      angles: a correct guard whose verdict reaches the wrong reader. 1196-5hva
      was a classifier whose bucket names prescribe an action to someone who
      cannot act; 1204-3s2s was a refusal that emitted nothing so the arms driving
      it read zeros. Here the guard is correct, its message is correct, and its
      TIMING sends it to a host that did not cause the condition and may not know
      the lane.
