      - 'the refusal text is the checker''s own instruction, so the two cannot drift: the removal belongs in the same commit as the change that moved it'
      - 'NEGATIVE CONTROL: a terminal flip on a non-multi_cycle packet, or one whose row is already gone, is not refused — this must not become a tax on every closure'
      - 'NEGATIVE CONTROL: the land-time check REMAINS. Moving the refusal earlier must not remove the backstop, or a flip made by a tool that bypasses set-field would strand the view silently again'
