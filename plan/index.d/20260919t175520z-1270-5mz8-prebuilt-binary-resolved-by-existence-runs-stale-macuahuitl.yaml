      shim and logs that it did; the refusal text on the plan binary's stale
      path names scripts/check-plan-binary-current.sh. Add the rule to
      methodology/convergence.yaml as a MUST. Instances 1 and 2 close on their
      own rows if they have them; this row closes on the fixture and the rule.
