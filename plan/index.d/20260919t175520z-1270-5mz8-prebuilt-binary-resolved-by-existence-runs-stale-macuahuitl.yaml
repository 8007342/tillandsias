    title: |
      a prebuilt binary resolved by existence runs stale until something refuses it — three instances in two days, and the podman shim ran the release gate's forge lane on four-day-old code
    context: |
      THREE INSTANCES, 2026-09-18/19, ONE SHAPE: a resolver prefers a prebuilt
      binary because it EXISTS, and nothing compares it to what it was built
      from.
        1. The plan binary on lenovinha: its validator-surface stamp went stale
           after an incremental rebuild and every plan write was refused; the
           remedy (scripts/check-plan-binary-current.sh) existed and nothing in
           the refusal named it (1152-y3bv class).
        2. The plan binary on esme: built 2026-09-14, five days stale for the
           whole session, so the plan-only lane — whose own header says a
           checkout that never gated can push its claim — refused on exactly
           the host it exists to spare, composing with 1259-kn83 and 1258-tpkz.
        3. tillandsias-podman-cli on macuahuitl: the litmus runtime shim
           routes EVERY podman call through scripts/tillandsias-podman, which
           picked the four-day-old debug build; the release gate measured the
           forge lane on code the tree no longer contained (the closure above).
      Mirror row: 1154-6big (esme) is a probe that cannot SEE a debug binary;
      this is a resolver that cannot see a STALE one. The shared remedy, stated
      once: every resolver that prefers a prebuilt compares it to its sources
      (mtime or a validator-surface hash, as the plan binary already does) and
      REFUSES with the rebuild command, never runs stale silently; and a floor
      host's binary must be refreshable by a documented, toolchain-free path,
      or the refusal strands the host (instance 2).
    next_action: >
      Write the two-arm fixture first and watch arm 1 execute the stale marker
      script on the unfixed tree. Then: the shim compares the resolved binary's
      mtime against the newest file under the two crates (a hash is better if a
      validator surface exists for it) and refuses with the rebuild command;
