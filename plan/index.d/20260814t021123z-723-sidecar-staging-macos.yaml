packets:
  - packet_id: build-entrypoints-do-not-stage-router-sidecar
    order: 723-wd8i
    status: implemented
    desired_release: v0.5
    priority: p0
    kind: defect
    title: "Un-committing the router sidecar broke every build entrypoint that was not taught to produce it"
    deliverable: "scripts/build-macos-tray.sh + scripts/local-ci.sh + crates/tillandsias-headless/build.rs"
    pickup_role: any
    release_target: stable-milestone-v1
    capability_tags:
      - build
      - macos
      - release
    estimated_hours: 2
    context: |
      The DESIGN is not in question and is not the defect. The sidecar is a
      build artifact: at development runtime the host builds and injects it, at
      user runtime the matching release ships it as a version-matched, signed
      asset. That is correct and order 710-w9kc was right to un-commit it.

      What actually happened is narrower and duller: removing the blob deleted
      the file from git, and only SOME of the entrypoints that compile
      tillandsias-headless learned to produce it.

        LEARNED IT   build.sh (_stage_router_sidecar_if_compiling, :639-656)
                     scripts/build-image.sh:174
        DID NOT      scripts/build-macos-tray.sh   <- the macOS product build
                     scripts/local-ci.sh           <- the clippy/test gate
                     .github/workflows/release.yml <- see 723-sazx

      crates/tillandsias-headless/build.rs:93 lists the file among its REQUIRED
      runtime assets and panics at :104 without it, so each of those dies on a
      fresh clone.

      WHY IT SURVIVED, and the part worth remembering: removing a file from git
      does not remove it from any working tree that already had it. Every host
      that had ever built kept its copy on disk, so the break is invisible
      locally and certain on a fresh clone or in CI. This host reproduced it by
      moving the artifact aside — the macOS build died at build.rs:104 — and
      then confirmed the fix by deleting the artifact and running
      scripts/build-macos-tray.sh to completion.

      STRUCTURAL NOTE (operator observation, 2026-08-13). build.rs DEMANDS the
      asset but nothing PRODUCES it, so the obligation is spread across every
      caller and each can forget independently. The invariant sits at the wrong
      layer. Making build.rs stage it itself is the obvious answer and was
      deliberately NOT taken here: a nested cargo inside build.rs contends on
      the global package-cache lock, which is the class of deadlock
      scripts/build-sidecar.sh:18-21 already records. The compromise is that
      the demand now explains how to satisfy itself. See 723-ydmk for the
      durable guard.
    exit_criteria:
      - "scripts/build-macos-tray.sh stages the sidecar before its first cargo invocation. DONE."
      - "scripts/local-ci.sh stages it before the Rust gate. DONE."
      - "build.rs names the remedy for this one artifact instead of emitting a bare path. DONE."
      - "OPEN: a falsifiable guard that a new entrypoint cannot omit the staging call — filed as 723-ydmk."
    events:
      - type: progress
        ts: "2026-08-14T02:11:23Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260813t223103z
        host: macos
        summary: |
          REPRODUCED then FIXED then RE-VERIFIED on hardware.

          Reproduction: moved images/router/tillandsias-router-sidecar aside,
          touched build.rs, ran cargo check -p tillandsias-headless ->
          "thread 'main' panicked at crates/tillandsias-headless/build.rs:104:13:
          required runtime asset missing: .../images/router/tillandsias-router-sidecar".

          Fix: added `bash "$ROOT/scripts/build-sidecar.sh"` to
          scripts/build-macos-tray.sh before the first cargo invocation, and the
          equivalent to scripts/local-ci.sh before the Rust gate. Both are cheap
          no-ops when the staged binary is current (build-sidecar.sh:47-67).

          Re-verification, the load-bearing one: DELETED the staged artifact and
          ran scripts/build-macos-tray.sh end to end. Exit 0. Log line 2 is
          "staging router sidecar (build artifact — not committed)", the sidecar
          is produced, and the run completes through both guest zigbuilds, ad-hoc
          codesign ("valid on disk", "satisfies its Designated Requirement") and
          tarball: dist/tillandsias-tray-0.4.260812.1-macos-arm64.tar.gz,
          12.85 MiB, sha256 0191082230b27aef04a47348c7691822e68d0ba987715da208f2e1353bf96458.

          This restores 598-kibt's M2 criterion, whose PASS evidence (2026-08-03
          and 08-09) predates the blob removal and was therefore recorded against
          a tree where the file still existed.

          Cold-build evidence for the artifact itself: removed target-musl/ and
          the staged binary, then ran scripts/build-sidecar.sh from nothing —
          13.35s, produced a correct "ELF 64-bit LSB executable, x86-64,
          statically linked, stripped". The musl cross-compile path on macOS is
          healthy; the 702-griq rust-lld pin for darwin is doing its job.

  - packet_id: release-nix-builds-headless-without-staging-the-sidecar
    order: 723-sazx
    status: implemented
    desired_release: v0.5
    priority: p0
    kind: defect
    title: "Release workflow builds tillandsias-headless before the sidecar exists — the published-binary path has never been exercised since 710-w9kc"
    deliverable: ".github/workflows/release.yml"
    pickup_role: linux
    release_target: stable-milestone-v1
    capability_tags:
      - release
      - ci
      - nix
    estimated_hours: 2
    context: |
      Same root cause as 723-wd8i, on the path that produces what users install.

      .github/workflows/release.yml built in this order:

        nix build .#tillandsias-x86_64-musl            (line 105)
        nix build .#tillandsias-headless-x86_64-musl   (line 106)
        nix build .#tillandsias-headless-aarch64-musl  (line 107)
        nix build .#tillandsias-router-sidecar-x86_64-musl  (line 109)

      The headless derivations build from craneSrc — the checked-out tree — and
      their build.rs requires images/router/tillandsias-router-sidecar, which is
      no longer in git. The sidecar derivation that could supply it ran AFTER
      them and its output was never installed into the source tree.

      The step's own comment asserted the opposite: "The router sidecar +
      runtime assets are git-tracked, so nix embeds them from the checked-out
      tree." True when written, false since 710-w9kc, and nothing re-read it.
      The last release predates the removal, so this has never run.

      FIXED HERE by building the sidecar FIRST and installing it into
      images/router/ before the headless builds, and by correcting the comment.
      This also makes the shipped bytes and the separately published cosign-signed
      asset the SAME binary rather than two independent builds sharing a name.

      The macOS release job needed no separate change: it runs
      scripts/build-macos-tray.sh, fixed under 723-wd8i.
    exit_criteria:
      - "Sidecar derivation builds and stages into images/router/ before the headless nix builds. DONE (untested in CI)."
      - "The false 'git-tracked' comment is corrected. DONE."
      - |
          OPEN, and the reason this packet is not `done`: NO CI RUN HAS PROVEN IT.
          This was authored on the macOS host, which cannot execute the workflow or
          evaluate flake.nix. A linux host must dispatch the release workflow (or
          `nix build .#tillandsias-headless-x86_64-musl` on a clean checkout) and
          confirm the headless derivations succeed.
      - |
          OPEN, deeper fix: the ordering fix makes the WORKFLOW correct but leaves
          the DERIVATION unsound — `nix build .#tillandsias-headless-x86_64-musl`
          on a clean tree still fails outside CI. The proper form is a preBuild in
          flake.nix that installs the sidecar derivation's output into the unpacked
          source, so the requirement is satisfied by the build graph rather than by
          step ordering in one caller.
    events:
      - type: progress
        ts: "2026-08-14T02:11:23Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260813t223103z
        host: macos
        summary: |
          Found during the post-blob-removal build-stack audit and fixed at the
          workflow level; explicitly NOT verified, because this host cannot run
          GitHub Actions or nix. Filed with the deeper flake.nix fix stated so the
          linux host does not have to re-derive it.

  - packet_id: main-still-tracks-the-committed-sidecar-elf
    order: 723-qeju
    status: ready
    desired_release: v0.5
    priority: p1
    kind: defect
    title: "origin/main still tracks the sidecar ELF, so a release cut from main ships bytes that are not the signed asset"
    deliverable: "origin/main (via PR) + flake.nix craneSrc"
    pickup_role: linux
    release_target: stable-milestone-v1
    capability_tags:
      - release
      - security
      - nix
    estimated_hours: 2
    context: |
      Commit 9879f7f4 removed images/router/tillandsias-router-sidecar, but it
      never landed on main. origin/main still tracks the identical 1,955,952-byte
      ELF (blob 3be4d56b).

      Releases are cut from main, and flake.nix deliberately keeps the whole tree
      in craneSrc, so a release cut from main today embeds the STALE COMMITTED ELF
      in the shipped binary while separately publishing a freshly built,
      cosign-signed sidecar asset. The signature would then attest bytes that are
      not the bytes users run. That is the precise failure 710-w9kc set out to
      prevent, surviving on the one branch that matters for releases.

      Note the interaction with 723-sazx: once main carries the removal, the
      release workflow REQUIRES the staging fix, because nothing will supply the
      file any more. Land them together or land 723-sazx first.
    exit_criteria:
      - "The removal reaches main through a PR (main is PR-only)."
      - "`git ls-tree -r origin/main --name-only | grep router-sidecar` returns nothing."
      - "A release built from main embeds the same bytes it publishes as the signed asset — verified by comparing the embedded asset's sha256 to the published tillandsias-router-sidecar-x86_64-unknown-linux-musl."

  - packet_id: sidecar-arch-hardcoded-x86-64-vs-aarch64-guest
    order: 723-ji4v
    status: ready
    desired_release: v0.5
    priority: p1
    kind: defect
    title: "Router sidecar is always built x86_64 while the macOS guest is aarch64 Linux — it cannot exec, and the failure degrades to a silent 502"
    deliverable: "scripts/build-sidecar.sh + images/router/entrypoint.sh"
    pickup_role: macos
    release_target: stable-milestone-v1
    capability_tags:
      - macos
      - build
      - router
    estimated_hours: 3
    context: |
      scripts/build-sidecar.sh:35 pins TARGET="x86_64-unknown-linux-musl"
      unconditionally. On Apple Silicon the VZ guest is aarch64 Linux —
      scripts/build-macos-tray.sh itself builds BOTH guest binaries, aarch64
      first — so the router image inside that guest receives an x86_64 sidecar
      it cannot execute.

      The consequence is not a loud failure. images/router/entrypoint.sh gives
      up after roughly five seconds and Caddy's forward_auth then 502s, so
      web-session OTP gating is non-functional while the tray reports a healthy
      router. A capability that fails OPEN-looking rather than closed.

      NOT YET MEASURED ON HARDWARE, and it must be before the fix is designed:
      the sidecar may be consumed only on the x86_64 lane, in which case this is
      a latent trap rather than a live break. The one-command falsification is to
      exec the staged sidecar inside the aarch64 guest's router container and
      look for ENOEXEC.
    exit_criteria:
      - "MEASURE FIRST: run the staged sidecar inside the router container in the aarch64 VZ guest and record whether it execs."
      - "If it does not: derive TARGET from the guest architecture, and make the CARGO_TARGET_<TRIPLE>_LINKER / RUSTFLAGS exports at build-sidecar.sh:103-104 target-derived rather than literally X86_64."
      - "images/router/entrypoint.sh fails loud on an unexecutable sidecar instead of degrading to a 502 after ~5s."

  - packet_id: no-guard-against-recommitting-a-binary
    order: 723-ydmk
    status: ready
    desired_release: v0.5
    priority: p2
    kind: enhancement
    title: "Nothing prevents a build artifact from being committed again, and the .gitignore block added for that class misses the extensions actually in the history"
    deliverable: "scripts/check-no-tracked-binaries.sh + .gitignore + a litmus"
    pickup_role: any
    release_target: stable-milestone-v1
    capability_tags:
      - guards
      - hygiene
    estimated_hours: 3
    context: |
      710-w9kc removed one instance of a class. The mechanism that allowed it —
      a build artifact matching a .gitignore rule but ALREADY TRACKED, so the
      ignore is inert — is unchanged, and this repo's history contains at least
      three separate binary leaks (target-musl/**, images/default/
      tillandsias-mcp-browser, images/router/tillandsias-router-sidecar). Three
      occurrences is a pattern, not an accident.

      The .gitignore defense-in-depth block added for exactly this class covers
      *.o and *.rlib but not *.so, *.dylib, *.dll, *.exe, *.a or *.wasm —
      including the .so files that are in the leaked history. A guard that reads
      as protective and is not is worse than none, because it stops the next
      person looking.

      This is also the durable answer to 723-wd8i's structural note: a check that
      fails loud on its own, rather than N callers each remembering.
    exit_criteria:
      - |
          scripts/check-no-tracked-binaries.sh fails on any tracked path git
          itself classifies as binary, outside a small documented allowlist (the
          five icon/image assets). Base it on `git diff --numstat` against the
          empty tree (binary files report `-` / `-`), NOT on file(1): a tracked
          markdown file in plan/archive/ contains a stray NUL and file(1) calls
          it data, which would be a permanent false positive.
      - "Wired into scripts/local-ci.sh beside the other check-*.sh gates."
      - "Pinned by a litmus with a NEGATIVE CONTROL: a repo with only text files must pass, or 'refuse everything' would satisfy the positive case."
      - "The .gitignore block is extended to the extensions actually seen; verify `git ls-files | grep -iE '\\.(so|dylib|dll|exe|a|wasm|pdb)$'` is empty first so the change is safe."

  - packet_id: e2e-preflight-false-live-runtime-on-macos
    order: 723-fndi
    status: ready
    desired_release: v0.5
    priority: p1
    kind: defect
    title: "e2e-preflight reports skip:live-runtime-present on macOS whenever podman is installed but its machine is stopped, so the local-build e2e gate never runs here"
    deliverable: "scripts/e2e-preflight.sh"
    pickup_role: macos
    release_target: stable-milestone-v1
    capability_tags:
      - macos
      - e2e
      - guards
    estimated_hours: 2
    context: |
      scripts/e2e-preflight.sh:64-65 treats an ERRORED `podman ps` listing as
      evidence that a live runtime is PRESENT. On macOS with podman installed
      but no machine running, the listing errors, so the probe concludes a live
      runtime exists and the eligibility verdict becomes
      skip:live-runtime-present.

      The effect is that the one gate which would actually prove the from-scratch
      build produces a WORKING product on macOS is skipped for a reason that is
      false, and it presents as a tidy "host not eligible" rather than as a
      broken probe. It also reproduces the exact class the file says it already
      fixed for skip:no-podman-user-session.
    exit_criteria:
      - "`podman info` (or an equivalent reachability probe) must succeed before the ps-based inference runs; unreachable means ABSENT, not present."
      - "On Darwin the probe consults the Virtualization.framework guest, which is the actual macOS runtime substrate, rather than podman."
      - "Verified on this host: with the podman machine stopped, `scripts/e2e-preflight.sh eligibility` no longer prints skip:live-runtime-present."

  - packet_id: build-sh-install-and-init-broken-on-macos
    order: 723-whrx
    status: ready
    desired_release: v0.5
    priority: p2
    kind: defect
    title: "build.sh --install / --ci-full --install / --init are silently unsupported or broken on macOS while the host guard says the host is ready"
    deliverable: "build.sh"
    pickup_role: macos
    capability_tags:
      - macos
      - build
    estimated_hours: 2
    context: |
      build.sh has no host branch at all: `grep -niE 'darwin|uname|OSTYPE|macos'`
      over the whole file returns only two comment lines.

      --install (build.sh:901ff) builds and then EXECUTES an x86_64 Linux musl
      launcher, which cannot run on macOS, while the readiness guard at :469-480
      reports the host as ready. --ci-full --install is the phased gate the
      release and meta-orchestration skills treat as the strong evidence path,
      so on macOS that path is not merely unsupported, it is unsupported
      silently.

      Separately, --init executes target/debug/tillandsias without building it,
      so it fails from a clean tree on any platform — after validating podman and
      bumping VERSION, which also leaves a dirty tree that build.sh:573-577 then
      tells the operator not to commit.

      Consequence for how this project reports itself: any "builds from scratch
      on macOS" claim must be scoped to --check / --test /
      scripts/build-macos-tray.sh, and must not cite the install or ci-full
      ladder.
    exit_criteria:
      - "--install refuses on Darwin with a message naming scripts/build-macos-tray.sh as the macOS path, instead of building a Linux binary and trying to run it."
      - "--init builds the binary it then executes (or refuses when it is absent) rather than failing after the podman gate and the VERSION bump."

events:
  - packet_id: version-guard-fails-open-via-sigpipe-under-pipefail
    order: 702-pwhc
    type: progress
    ts: "2026-08-14T02:11:23Z"
    agent_id: macos-tlatoanis-macbook-air-fable5-20260813t223103z
    host: macos
    summary: |
      CORRECTING FRAGMENT — this packet's `deliverable` now names a file that
      holds a DIFFERENT fixture, and that matters because the substitute passes
      against the broken guard.

      Merging origin/linux-next into osx-next produced an add/add conflict on
      scripts/test-pre-push-version-guard.sh: this host had written a fixture
      there for the SIGPIPE fail-open (702-pwhc), and windows/linux had
      independently written one for the three-tier catch-up policy (643-64bx).
      They test different properties of the same guard, so both were kept:

        scripts/test-pre-push-version-guard.sh          <- linux/windows policy
        scripts/test-pre-push-version-guard-sigpipe.sh  <- THIS packet's fixture

      The linux/windows fixture keeps the canonical path because
      openspec/litmus-tests/litmus-versioning-shape.yaml:99 pins that path and
      its exact "PASS: pre-push VERSION guard (4/4)" string.

      Why this needed a correcting fragment rather than nothing: an auditor
      verifying 702-pwhc from the ledger would run the file the packet names,
      see 4/4 green, and conclude the SIGPIPE fix is proven. It is not — that
      fixture's ranges are small enough to pass against the broken guard. That
      is a false-confirmation path, of exactly the class this packet exists to
      document.

      Both fixtures were run against the merged guard on this host: 4/4 and 4/4.

      CLOSING the criterion recorded as OPEN in
      plan/index.d/20260813t030027z-6d2c84f1-macos.yaml:79 ("wire
      scripts/test-pre-push-version-guard.sh into a CI phase so the guard cannot
      silently regress; it is currently runnable but not scheduled"): the sigpipe
      fixture is now pinned by litmus-versioning-shape.yaml as its own step,
      alongside the policy fixture. Both are scheduled; neither can regress
      silently.

