        REVERSIBLE, and deliberately the cheaper direction first: if a marked row is missed AFTER this reports it, that is new evidence and the strength should be revisited. Advisory-to-blocking is a one-line change; the reverse costs a release.

        HOW A ROW IS MARKED: tillandsias-plan set-field <order> must_ship next. THREE MECHANISMS WERE MEASURED AND TWO ARE BLOCKED, so this was not a free choice:
          - capability_tags IS projected and IS exactly filterable, but set-field REFUSES list-valued fields (1184-tj2q) — writing one reads the existing list as unset and replaces it with a string, after which the row matches NO tag query at all. An existing row therefore cannot be tagged, and declarations are immutable. I tried this first and the refusal is what redirected me.
          - an EVENT of a distinctive type is appendable by any host, but plan-events prints type and timestamp per packet with no bulk reader by type, so finding marked rows would mean one invocation per packet.
          - a novel top-level SCALAR validates under check --strict-fragments and set-field can write it, but query --json is an explicit key ALLOWLIST, so until this commit it was writable and UNREADABLE. must_ship is now in that allowlist, for the reason 627-cx24 records twenty lines above it in the same file: a projection that silently drops a field a consumer reads fails in a direction nothing observes.

        HOW "IS THE FIX IN THE CUT" IS DECIDED, and the discriminator is load-bearing: a commit IS a row's fix when its SUBJECT carries the order in the project's type(order) convention. MEASURED: git log --grep=1211-34v6 on trunk returns FIVE commits, three of which merely MENTION the order in their body — including my own correction commits from earlier tonight. Subject-anchored returns TWO, the fix and its closure. Counting mentions would report a row as shipped because someone discussed it.

        VALIDATED AGAINST THE ROW'S OWN MEASURED INSTANCE, which is the strongest evidence available and is real history rather than a synthetic case:
