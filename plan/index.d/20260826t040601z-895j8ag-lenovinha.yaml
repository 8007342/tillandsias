events:
  - packet_id: the-daily-maintenance-gate-uses-a-local-day-boundary-in-a-utc-fleet
    event:
      type: implemented
      ts: "2026-08-26T04:10:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t034812z
      host: lenovinha
      summary: |
        THIRD LIVE REPRODUCTION, on this host, at Start-Of-Cycle — I did not have
        to construct it:
          UTC   2026-08-26T03:48:12Z
          local 2026-08-25T20:48:12-0700
          marker date=2026-08-25 utc=2026-08-25T20:14:30Z
          verdict ok:daily-maintenance-current:2026-08-25
        The UTC day had already rolled and the gate said current. pirria and
        macuahuitl are the other two; all three are UTC-7.

        UTC IS CHOSEN, and the reason is not aesthetic. Every other timestamp
        this fleet coordinates on is UTC — ledger event `ts`,
        `loop-status-append --ts` (validated against the UTC clock and which
        refused two of my own writes tonight for drifting from it), the mo-full
        attestations, and the marker's own `utc=` field. A LOCAL boundary means
        hosts in different zones roll over at different instants, so "did today's
        maintenance run" has NO FLEET-WIDE ANSWER. Local is defensible for one
        operator on one machine; this is a fleet.

        One line changes (`date +%Y-%m-%d` -> `date -u +%Y-%m-%d`), and the
        choice is now STATED in the file with the three measurements and both
        directional shapes, per exit criterion 1.

        LIVE BEFORE/AFTER, same host, same instant:
          before  ok:daily-maintenance-current:2026-08-25
          after   due:stale:2026-08-25
        The gate now correctly wants a run for the new UTC day.

        The marker keeps BOTH `date=` and `utc=` (criterion 4) — that pair is
        what made the defect findable, and it is how a host reading an OLD
        marker can tell which boundary produced it, which matters exactly once:
        across this change.
  - packet_id: the-daily-maintenance-gate-uses-a-local-day-boundary-in-a-utc-fleet
    event:
      type: verified
      ts: "2026-08-26T04:15:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t034812z
      host: lenovinha
      summary: |
        scripts/test-daily-maintenance-day-boundary.sh, all arms green, pinned by
        litmus:daily-maintenance-day-boundary (bound in openspec/litmus-bindings.yaml;
        the unbound-litmus ratchet checked). ci-release pre-build litmus green.

        BOTH SIGNS OF UTC OFFSET ARE TESTED, and that is the arm the packet most
        needed. Every observed reproduction is UTC-NEGATIVE, so pirria's
        directional warning was that a one-sign fixture passes on half the fleet
        and leaves the mirror case to production. I could not observe the
        UTC-positive case — this host is UTC-7 — so the fixture SIMULATES it with
        TZ, which is sound here because of the property being asserted:

          WITH THE BOUNDARY ON UTC, TZ MUST NOT MOVE THE VERDICT AT ALL.
          `date -u` ignores TZ; `date` does not. A verdict that moves when only
          TZ moves is, by construction, reading the local date.

        Arms: exactly ONE day in a five-day window reads current and it is the
        marker's day; UTC == UTC-7 == UTC+9 on one marker; a marker from the
        previous UTC day reads stale from UTC, UTC-7, UTC+9 and UTC+14
        (Kiritimati, the extreme); the grammar is unchanged including
        due:no-marker and due:unreadable-marker (criterion 3); the stamp records
        both fields AND they now agree, since a divergence would mean the stamp
        and the comparison had drifted apart again — the original defect.

        MUTATION CONTROL, and it is the one that makes the TZ simulation
        trustworthy: reconstruct the pre-fix local-date guard and run it on ONE
        identical input from two zones. It returns
        `ok:daily-maintenance-current:2026-08-25` at UTC-7 and
        `due:stale:2026-08-25` at UTC+9. That is the defect and its mirror,
        exhibited side by side, and it proves arm 2 is not passing merely
        because the test machine sits at UTC.

        A FIXTURE BUG OF MY OWN, recorded because it is the fourth of the night
        and the same shape: my first flip assertion compared the verdict at
        2026-08-24 against 2026-08-26 and demanded they differ. Both correctly
        read `due:stale:2026-08-25` — a marker is stale on EITHER side of its own
        day — so the test was red for describing the wrong property, not for
        finding a defect. "Flips exactly once" means exactly one day in a window
        reads current, which is what it now asserts.

        NOT CLAIMED: no UTC-positive HOST has been observed. The mirror case is
        proven by simulation and by the mutation control, not by a real host at a
        positive offset. If one joins the fleet it is worth re-running there.
