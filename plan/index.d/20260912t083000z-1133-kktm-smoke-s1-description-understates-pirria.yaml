    title: |
      MEASURED on pirria: §1 is described as "curl-install the latest release" and "test the download", but install.sh runs a full init — Vault bootstrap, twelve policies and AppRole roles, and a container left running on https://127.0.0.1:8201
    context: |
      FOUND by pirria 2026-09-12 running the floor-tier §1 for v56.9.12.2 at the
      coordinator's request.

      WHAT §1 SAYS IT IS (SKILL.md:224-236): "Curl-install the latest release …
      Install the published artifact the canonical way an operator would … the
      whole point is to test the *download*." Nothing in that prose mentions
      init, Vault, podman or a listening service — measured: 0 occurrences of
      vault|container|podman|init|8201 in the section's description.

      WHAT IT ACTUALLY DID, on this host:
          install_time 175s
          131 log lines mentioning podman/container/vault
          Vault bootstrap provisioning twelve policies and AppRole roles
          (GitMirror, Forge, Tray, Inference, GithubLogin, ClaudeLogin,
          CodexLogin, CodexForge, ClaudeForge, AntigravityForge,
          AntigravityLogin, OpenCodeForge)
          container `tillandsias-vault` left RUNNING, healthy, serving
          https://127.0.0.1:8201
          the installer's own banner ends "Init complete."
      Reversible, and not destructive — but not "a download test" either.

      WHY IT MATTERS, and it is a CONSENT defect rather than a docs nicety. The
      runbook's §1/§2 split is the basis on which operators are asked for
      permission: §2 is destructive and needs explicit consent, §1 is the safe
      half that does not. That split is sound in kind — §1 does not destroy
      anything — but an operator agreeing to "curl-install and check the
      version" is not thereby agreeing to stand up a credentials service on
      their machine. The description is what they consent to, so the
      description has to be true.

      NOT A DEFECT, CHECKED BEFORE FILING: the runbook's own §1 block ALREADY
      carries the bash guard, at SKILL.md:238 —
          [ -n "${BASH_VERSION:-}" ] || { echo 'FAIL: run this block under bash
          — PIPESTATUS is a bash array and zsh expands it empty'; exit 2; }
      so the runbook is correct on that point and needs no change. The blank
      install_exit in this host's report came from running an inline recipe
      relayed in a message, which had been transcribed without the guard. The
      runbook was not at fault; the out-of-band copy was.
    next_action: |
      1. Amend §1's prose to say what install.sh does: full init, Vault
         bootstrap with policies and AppRole roles, and a container left running
         on 127.0.0.1:8201. One or two sentences, placed before the code block
         where an operator reads it.
      2. Say plainly that §1 MUTATES host container state and is therefore not
         a read-only or no-op step, while keeping the true distinction from §2
         (reversible vs destructive) rather than blurring it.
      3. Consider whether the §1 heading should stop calling it a curl-install.
         NOT decided here: renaming may break references elsewhere in the fleet
         that say "§1", so the prose fix is the safe minimum and the rename is a
         separate call.
