      - 'NEGATIVE CONTROLS under the same profile, each asserted to FAIL: an outbound TCP connect to a public address, a loopback TCP bind, a read of a file outside the allowed subpaths (e.g. ~/.ssh), and a connect to any Unix socket other than its own'
      - 'a process inside the VM (the guest-side terminus, not a forge) completes a request to the helper over vsock through the tray, and `podman network inspect tillandsias-enclave` still reports internal, with no published host port (the SLOT-6 scenario)'
      - 'lease: after the tray quits, or after the helper is killed, no listening inference.sock remains and the vsock port is deregistered (a connect from the guest is refused); a test asserts both'
      - 'the helper process environment and argv carry no credential: a test reads the spawned environment and argv and finds only the allowlist; and SLOT-6 clause 4 admits a single named Unix socket as the upstream (spec text changed, or the row records why loopback TCP was chosen instead)'
