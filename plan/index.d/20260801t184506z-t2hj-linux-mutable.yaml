      summary: >
        THIRD INSTANCE, and it sharpens the diagnosis considerably.
        litmus:e2e-eligibility-probe-shape step 4 ("the probe emits exactly one
        well-formed verdict line", 5s budget) TIMED OUT during
        ./build.sh --ci-full --install, failing the gate and blocking an install.
        It then timed out AGAIN on an immediate standalone re-run at load 3.19,
        and PASSED on the next run with no change to any file.
        THE MARGIN IS THE FINDING. The step was measured directly at 95ms across
        six consecutive runs (podman ps alone: ~20ms), and the litmus's exact
        command line completes in 95ms with rc=0. So a 5s budget is a FIFTY-FOLD
        margin, and it still times out. That rules out "the budget is slightly
        too tight" — the machine is stalling for multiple seconds on a step that
        normally costs a twentieth of a second.
        RULED OUT, so nobody repeats the work: it is not an assertion failure
        (the command returns the expected single well-formed line), not the FD
        leak in step 3 (which does `exec 9>` and never closes it — running steps
        3 and 4 back to back in one shell completes in 101ms), and not a slow
        podman.
        WHAT THIS CHANGES ABOUT THE FIX. Widening timeouts is now clearly the
        wrong repair — there is no width that survives a multi-second stall on a
        95ms operation, and each widening only lengthens the eventual failure.
        The two earlier instances were container-LAUNCHING steps, where a tight
        budget was at least arguable; this one is a plain shell probe, which
        means the problem is host saturation during the build, not the steps.
        Candidate directions: serialize the litmus phase against the build's own
        cargo/podman work rather than running them concurrently; or detect
        saturation and SKIP with a named reason. A skip that says why is honest;
        a timeout reported as a failure is not, and it has now cost three
        investigations.
        HONESTY NOTE: on the two earlier instances I attributed the failure to
        contention and moved on. This time I checked standalone first and it
        failed, which briefly looked like a real defect — the right instinct, and
        worth keeping. Only repeated timing showed the true shape.
