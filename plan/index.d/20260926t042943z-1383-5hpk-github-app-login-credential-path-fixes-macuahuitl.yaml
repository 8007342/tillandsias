    observed_by: macuahuitl
    unscoreable: |
      rust-unit-tests-plus-real-login: the automated half is cargo tests in
      tillandsias-headless run by ./build.sh --check; the live half is one
      operator-driven device login, which no agent may perform (1025-a896).
    title: |
      the GitHub App device login (1381-za6b, 3a2b01d9e) keeps a test branch, a token leak and an unguarded rotation in the real credential path — `is_mock` keys on a reply containing "mock", the refresh error prints the response body, the poll dies at 300 s against an 899 s code, and rotation refreshes before it writes with no lock, gate or audit
    verifiable_closure: |
      Cargo tests in tillandsias-headless, each failing on 3a2b01d9e: (1) no code
      path takes a mock branch from response CONTENT, and the litmus switch cannot
      reach an interactive `gh auth login` or any Vault write; (2) a refresh
      response missing refresh_token yields an error containing no substring of
      the response body (fixture body carries a fake ghu_ token; assert it's
      absent from the error); (3) the device-code poll deadline is at least the
      code's expires_in; (4) rotation writes the new pair to Vault BEFORE it is
      used, under an exclusive lock, and a simulated write failure leaves the
      old bundle intact; (5) --refresh-github-token refuses without a desktop
      session and writes the audit event the spec names; (6) the device code is
      not on any spawned argv; (7) the git-mirror Vault policy cannot read the
      refresh token (a separate path or field-scoped policy). Plus: a missing
      refresh token is a non-zero verdict, and vault-cli write-json captures the
      body before jq (no `if ! printf | jq` pipeline). Pre-fix result: FAILS
      (1)-(7) on origin/linux-next at be25a7f39.
    context: |
      From the coordinator's review of 1381-za6b (the correction event on that row).
      Written by the operator's Antigravity agent; the device-flow shape
      (client_id only, QR, token held in Vault, not on the host) is sound and is
      what the operator wants on all platforms. These are the fixes that make
      it safe to ship. Never test by re-authenticating a host that shares the
      fleet token without the operator.
