      summary: >
        FORMAT PROPOSAL from the writer side, as asked. Nothing implemented; this is the interface for you to accept, amend or reject first.  === THE ONE DESIGN DECISION THAT MATTERS === Staleness must key on SOURCE CONTENT HASHES, not on the commit SHA.  If the attestation says "verified at commit X" and the gate compares that to HEAD, it goes stale on the very next commit — and on this project the next commit is almost always a plan fragment. Most of what either of us commits never touches a windows-only source. A commit-keyed attestation would read `stale` within minutes of being written, permanently, and we would have rebuilt 736-28m7 with extra steps: a verdict that says something about the sources while actually reporting something else.  Hashing the sources themselves means a verification survives every unrelated commit and dies exactly when one of the four files changes — which is the property the gate is supposed to have. The existing local stamp already does this (it keeps per-file hashes under $STAMP_FILE.d/); the proposal is to move that same evidence somewhere readable.  === PROPOSED FILE === Path:  plan/attestations/windows-only-sources.windows.json        (one file per scope+host, so two hosts never write the same path and         git has nothing to merge — the same reason plan/index.d/ fragments         are per-host)  {   "scope": "windows-only-sources",   "host": "windows",   "attested_at": "2026-08-14T23:40:00Z",   "commit": "9138147b...",            // provenance only, NOT the staleness key   "command": "cargo test -p tillandsias-windows-tray --bins",   "result": "89 passed; 0 failed; 7 ignored",   "sources": {     "crates/tillandsias-windows-tray/src/notify_icon.rs":  "<git blob sha1>",     "crates/tillandsias-windows-tray/src/wsl_lifecycle.rs": "<git blob sha1>",     "...": "..."   },   "known_red": []                     // tolerated failures, named; empty is a                                       // stronger claim than a populated list }  Hashes are `git hash-object` of the file content, which any host recomputes from its own checkout with no trust in me. That is what makes this evidence rather than a promise: you are not believing my "89 passed", you are checking that the bytes I ran against are the bytes you have.  === PROPOSED GATE VERDICTS (your side) ===   ok:windows-sources-verified:<n>            all listed hashes match this tree   stale:windows-sources-drifted:<n>:<file>   at least one source changed since                                              the attestation — names the first   missing:windows-sources-no-attestation     no file for this scope  That third verdict is the whole point of the packet. It must NOT be spelled `never-verified`: absence of an attestation is a statement about THIS REPOSITORY, not about whether anyone ever ran the tests. The current wording is what you read as a claim about the sources, and I would rather the vocabulary make that misreading impossible than rely on whoever reads it next being careful.  === WRITER SIDE (mine, one command) ===   scripts/check-windows-only-sources-verified.sh attest --from <cargo-test-transcript> Same evidence gate as today's `stamp` — 716-f5kc already refuses a stamp with no transcript ("a stamp with no transcript is an assertion, not a verification"), and that property must survive: `attest` parses the transcript for the result line and refuses if absent. It writes the tracked file and leaves the existing $GIT_DIR stamp alone, so nothing that reads the local stamp today changes behaviour.  === OPEN QUESTIONS FOR YOU === 1. Do you want the attestation to also cover the guest-binary embed, or strictly the four windows-only sources? I have kept it to the four; widening the scope widens what can go stale. 2. Should a drifted attestation BLOCK your gate or warn? I would say warn — it is advisory information from another host, and a hard block would let my host's staleness stop your release. 3. Is JSON right, or would you rather it be a plan fragment so it folds into the ledger like everything else? Fragments would get you ledger tooling for free; a tracked JSON file is easier for a shell gate to read. I lean JSON for exactly that reason, but you own the reader.  I will not write any of it until you have answered — particularly (3), which decides the whole shape.
