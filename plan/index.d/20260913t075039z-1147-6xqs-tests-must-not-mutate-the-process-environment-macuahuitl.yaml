    title: |
      Every test that plants a value in the process environment races every other test in the same binary; 1146-z8ux fixed two such tests and its own closure run surfaced a third (XDG_RUNTIME_DIR, behind a helper documented "serialised" that serialised nothing). The class is about a hundred sites across seven files of tillandsias-headless; the durable fix is the rule (resolvers take their input; tests pass values) plus a ratchet that refuses new mutations.
    context: |
      MEASURED on macuahuitl 2026-09-13 while closing 1146-z8ux: with the two
      HOST_ID_ENV tests fixed by parameterising `resolve_host_id`, the accel
      probe module passed 30/30 at 16 threads — and the first FULL-suite run
      failed `xdg_runtime_dir_tests::creates_a_missing_runtime_dir_at_0700`
      with left `/run/user/1000`, right `<tmp>/run-user-0`: another test's
      restore of XDG_RUNTIME_DIR landed inside this test's window. The module's
      helper `with_env` carried the doc comment "Serialised: these mutate the
      process-wide XDG_RUNTIME_DIR" and contained no lock. Fixed the same way
      in the same landing (`ensure_xdg_runtime_dir_from(raw)`; the tests pass
      the value). This is exactly what 1146-z8ux's deliverable warned
      `--test-threads=1` would hide: the next instance of the class.

      THE CLASS. Counted by position after the first `#[cfg(test)]` in each
      file (an upper bound, since main.rs interleaves test modules with
      production code): main.rs ~61, remote_projects.rs 35, tray/mod.rs 14,
      local_projects.rs 4, vault_bootstrap.rs 4, runtime_assets.rs 3,
      accel_probe.rs 3 (the PODMAN_BIN test). Every one of them is a thread
      writing a process global that every other thread in the binary reads.
      Most are guarded by save-and-restore, which is careful and does not
      help: the race is inside the window, not after it. They fail rarely
      because the windows are short, and rarely is the expensive rate — a
      1-in-N red unrelated to the diff teaches every host to re-run until
      green, which is how a real intermittent regression is dismissed too.

      WHAT TO BUILD. (1) The rule, in the crate's test conventions (a comment
      block at the top of the largest test module and a line in
      methodology/testing.yaml if one exists): a resolver that reads the
      environment gets a `_from(input)` twin that the tests call; tests never
      call set_var/remove_var. (2) scripts/check-test-env-mutation.sh: counts
      set_var/remove_var inside #[cfg(test)] modules per file (a small Rust
      or awk pass is fine; the count is per file, not per module, to stay
      cheap), compares against scripts/test-env-mutation-baseline.txt, refuses
      a rise with the file and the delta, and prints `ok:test-env-mutation:
      <total>` otherwise. Wire it into ./build.sh --check. (3) Migrate the
      three worst files (main.rs, remote_projects.rs, tray/mod.rs) as far as
      a cycle allows, lowering the baseline with each; the rest ratchets
      down over later cycles. A migrated resolver keeps its production
      signature; only the body moves.

      NOT IN SCOPE: --test-threads=1 (rejected in 1146-z8ux for hiding the
      class), a global mutex in tests (schedules around the hazard rather
      than deleting it; acceptable only for a test that genuinely exercises
      environment reading, and then named as such).
