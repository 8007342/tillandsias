    context: |
      WHY NOT BUILT IN THE 1804-sccl SLICE. sccache's shared backends are
      S3/WebDAV/Redis/memcached with a token or key; design §8 trusts a
      peer only after the Cloudflare-login identity proof (1800-54yy, not
      built), and the standing rule is no plaintext credentials at rest. A
      LAN endpoint today would need either an unauthenticated share or a
      token in a file. So this is the next slice, not a quick win.
      THE PARTITIONING FINDING THAT SHAPES IT (1804-sccl, macuahuitl
      2026-10-20): sccache's Rust key includes the absolute target
      directory — the same commit built into a different CARGO_TARGET_DIR
      got 0 of 244 hits; into the same path, 276 of 276. So cross-host
      reuse requires the SAME absolute target path on both hosts (the
      checkout's target/ at /home/tlatoani/claudia/tillandsias/target on
      both, or one canonical path) and the same toolchain and RUSTFLAGS;
      1287-w9s4 step 3 must compare the target path first, before the
      toolchain. Workspace crates in the dev/test profile are incremental
      and never cached, so the win is the dependency build and the release
      profile only; report it as a fraction of gate time.
