packets:
  - order: 864-p2rk
    packet_id: index-cache-key-ignored-the-document-prefix-so-prefixed-builds-were-fake
    desired_release: v0.5
    title: "content_hash is the text alone, so a prefixed build reused unprefixed vectors and the identity assertion agreed"
    status: completed
    kind: defect
    pickup_role: any
    priority: p0
    capability_tags: [rag, inference, cache, correctness]
    deliverable: scripts/spec-index-ensure.sh
    depends_on: []
    estimated_hours: 3
    discovered_by: "the first prefixed index build ever attempted here finishing in five seconds"
    context: >
      A FULL nomic INDEX TAKES ~8 MINUTES. The first prefixed build finished in
      FIVE SECONDS and declared itself verified:

        spec-index:delta reused=21123 embed=3 of 21126
        spec-index:delta identity-verified=5 reused samples

      content_hash is hash_hex(span) — the TEXT AND NOTHING ELSE — so a chunk
      keeps the same hash whether or not a prefix will be prepended to it before
      embedding. The fingerprint covered corpus + model but not the prefix, so
      the delta served UNPREFIXED vectors to a build that had asked for
      prefixed ones, and published them under a name that claimed otherwise.

      THE SAFETY NET CONFIRMED IT, which is the part worth dwelling on. The
      identity assertion exists precisely to catch a mis-joined reuse: it
      re-embeds a deterministic sample and compares bytes. It passed, because
      it re-embeds through the same code path that does not apply the prefix.
      It compared wrong against wrong and got agreement. A checker that shares
      the defect it is checking for will always agree, and it reports that
      agreement as verification.

      Had this not been caught by the clock, the next measurement would have
      been an UNPREFIXED index reported as the prefix result — and the prefix
      caveat, which is currently the last open question in the 824-6qxh
      campaign, would have been "answered" with the very number it was meant to
      test against.

      THIS IS ORDER 552's MODEL-KEY DEFECT IN A SECOND DIMENSION. That one was
      fixed by adding the model to the key. The lesson it should have taught
      was not "add the model" but "ANYTHING THAT CHANGES THE EMBEDDED BYTES
      BELONGS IN THE KEY" — otherwise the key gets extended one incident at a
      time, and each extension looks complete until the next input appears.

      WHY PREFIXES MATTER AT ALL, and why this was being attempted: several
      embedders are trained with an asymmetric query/passage convention and
      document it as REQUIRED. nomic-embed-text wants "search_document: " on
      passages and "search_query: " on queries. This harness applied neither,
      to any model, in every comparison filed. nomic's own template is a bare
      `{{ .Prompt }}`, so nothing supplied it downstream either. Every filed
      "a bigger embedder separates worse" result therefore carries the caveat —
      and nomic, which has the strictest documented requirement, is the model
      that looked BEST.
    exit_criteria: >
      (1) The document prefix is part of the fingerprint, so a prefixed build
      cannot collide with an unprefixed one.
      (2) A generation records its prefix in a `.prefix` marker and a generation
      whose marker disagrees is never reused — the same rule `.model` already
      gets.
      (3) Verified in BOTH directions, since a fix that simply disables the
      delta would also pass a one-sided test:
          prefixed   -> reused=0     embed=21126 of 21126
          unprefixed -> reused=21120 embed=6
      (4) The empty prefix produces a byte-identical payload to the old form, so
      every historical measurement reproduces exactly.

