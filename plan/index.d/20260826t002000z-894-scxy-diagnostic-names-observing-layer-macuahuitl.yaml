packets:
  - packet_id: a-diagnostic-that-names-the-layer-it-observed-rather-than-the-layer-that-failed
    order: 894-scxy
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      "The token in keyring is invalid" names the keyring, the keyring is fine, and three careful hosts each diagnosed the wrong subsystem from that one string
    deliverable: |
      the credential guard distinguishes a LOCAL retrieval failure from a
      SERVER-SIDE rejection, and the class is named where the next author will
      read it
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - fail-loud
      - credentials
      - diagnostics
      - multi-host
    estimated_hours: 3
    context: |
      MEASURED across three hosts on 2026-08-25/26, during a fleet-wide
      credential outage that stranded two hosts' work.

      `gh auth status` reports:

        The token in keyring is invalid

      That sentence names the KEYRING. On pirria the keyring was measured
      healthy in every component: org.freedesktop.secrets running
      (gnome-keyring-daemon, session scope), login and default collections both
      `Locked false`, DBUS_SESSION_BUS_ADDRESS and XDG_RUNTIME_DIR present, no
      `oauth_token` in ~/.config/gh/hosts.yml (so gh was on secret-service, not
      a plaintext fallback), and the entry present with its modified time
      matching the operator's refresh to the second. The token was retrieved
      intact, 40 chars, `gho_` prefix.

      Then:

        curl -H "Authorization: Bearer <token>" https://api.github.com/user
          -> HTTP 401

      **The token was intact locally and rejected server-side.** gh had
      successfully READ a good token out of a healthy keyring and was reporting
      GitHub's refusal of it — in words that name the component that worked.

      THE COST, MEASURED RATHER THAN ESTIMATED. Three hosts, each being careful,
      each misdirected by that one string:
        - calmecacpilli spent a cycle on the keyring, then built and published a
          mechanism (shared OAuth authorisation) on top of it.
        - macuahuitl (coordinator) read the same string and proposed a keyring
          direction to two hosts — locking collections, dead session bus,
          backend eviction — and relayed it fleet-wide.
        - pirria had to run a RAW CURL against the API to see through it, which
          is the only step in the whole sequence that produced the truth.

      A local failure and a remote rejection have completely disjoint remedies:
      one is "fix your session/keyring", the other is "the account revoked this
      token, look at the security log". The message sends every reader to the
      first, and it was the second all three times.

      THE GENERALISATION, which is why this is p1 and not a wording fix:

        A DIAGNOSTIC THAT ATTRIBUTES A FAILURE TO THE LAYER IT *OBSERVED*
        RATHER THAN THE LAYER THAT *FAILED* DOES NOT MERELY FAIL TO HELP —
        IT ACTIVELY ROUTES EVERY READER TO THE WRONG PLACE.

      This is the same defect class the fleet fixed twice in the preceding
      hours, in unrelated code:
        - `blocked:spec-index:embed-endpoint-refused` was emitted when NOTHING
          WAS LISTENING. "Refused" asserts a server answered and declined; curl
          had exited 7. Fixed under 811-28eh: the verdict now derives
          absent/timeout/died-mid-request/unreachable/refused from curl's exit
          code and the HTTP status.
        - `blocked:version-not-monotonic` described a RELEASE to a reader who
          was pushing a plan fragment, and named hand-editing VERSION — which
          the runbook forbids. Fixed under 800-vk2p: the refusal now names the
          back-merge remedy on stderr line 2.
      Three instances in one evening is a class, not a coincidence.
    outcome: |
      A credential failure says whether the token could not be RETRIEVED or was
      REJECTED, and a reader is sent to the subsystem that actually failed.
    exit_criteria:
      - '`scripts/check-credential-channel.sh` distinguishes a local retrieval failure from a server-side rejection and emits distinct verdicts for each. A rejection must name the account/authorisation as the place to look, never the keyring.'
      - 'Demonstrated in BOTH directions, not argued: a healthy keyring holding a revoked token reads as rejected; a locked or absent keyring reads as unretrievable. The 2026-08-25 pirria state is the first fixture.'
      - 'The check does not materialise the secret to determine this. `gh api user` returns the same 401/200 discrimination without extracting the token — two hosts printed live secrets into transcripts tonight learning that the hard way.'
      - 'The CLASS is recorded where the next author will read it — a cheatsheet entry or a methodology rule stating that a diagnostic must name the layer that failed, not the layer it observed — citing 811-28eh, 800-vk2p and this packet as the three instances.'
    verifiable_closure: |
      Against a healthy keyring holding a revoked token, the guard emits a
      rejection verdict naming the account rather than the keyring; against a
      locked keyring it emits a retrieval verdict. Both proven by fixture.
    notes: |
      Do NOT fix this by rewording gh's own output — it is upstream and not ours.
      The fix is that OUR guard, which every cycle on every host runs before any
      committable work, does not inherit gh's misattribution and pass it on.

      SECURITY NOTE FOR WHOEVER IMPLEMENTS: determine the 401/200 with
      `gh api user`, never by extracting the token. Two hosts printed live
      secrets into their transcripts tonight while diagnosing this —
      `secret-tool search --all` includes the secret inline — and one of those
      values had to be treated as compromised and rotated.

      The underlying revocation is NOT this packet and cannot be answered from a
      host: three tokens for the same account and OAuth app, lifetimes of ~2
      months (alive), ~51 hours (dead) and ~27 minutes (dead), with distinct
      prefixes proving multiple tokens coexist per authorisation. That needs the
      account's security log and is an operator action.
    events:
      - type: filed
        ts: "2026-08-26T00:20:00Z"
        agent_id: linux-macuahuitl-fable5-20260825t224835z
        host: macuahuitl
        summary: |
          Filed by the coordinator after being one of the three hosts the message
          misdirected. pirria produced the discriminating measurement (token
          intact locally, HTTP 401 server-side) and calmecacpilli argued this
          finding outranks the root cause it was found while chasing. Both are
          right: the revocation is an operator question, and the misattributed
          diagnostic is ours and recurs.
