    value: "THE OUTPUT: a bindings entry whose spec_id names a spec that is not in the\nlive tree is REFUSED BY NAME, and the verdict says how many spec_ids were\nresolved so a reader can see the population rather than infer it.\n\nTHE NEGATIVE CONTROLS ARE THE ROW, and both are demanded by the family this\nbelongs to (1255-rvr7):\n  * a bindings file naming a spec that does not exist must RED. Pre-fix it\n    is green — measured, see context.\n  * an EMPTY OR SHRUNKEN population must NOT read ok:. A checker that finds\n    zero spec_ids and prints ok: has the same defect one level up, and this\n    row must not ship it. Ask the one question of the new code: what does it\n    print when it finds NOTHING?\n  * a bindings file whose spec_ids ALL resolve must still pass, or the\n    ratchet turns one silent problem into an undiagnosed red suite — the\n    warning 660-ryhn's own triage carries.\n\n\n[2026-09-22T11:03:43Z macos] \nDELIVERED ON work/1356-vv5m, PR #158.\n\nTHE OUTPUT: a binding whose spec_id names a spec not in the live tree is REFUSED\nBY NAME, and the verdict carries spec_ids/resolved/spec-grandfathered so the\npopulation is visible rather than implied. On trunk today that refusal fires on\nthe real instance:\n  violation:binding-names-absent-spec:expert-serve-grounded-pipeline —\n  openspec/specs/.../spec.md does not exist, so every litmus bound under it\n  points at nothing\n\nRESOLVES TO spec.md, NOT THE DIRECTORY. A directory left by a deletion satisfies\na -d test while holding nothing a reader could open — the same shape-not-\nsubstance mistake one level down, and the one a careless fix would make. Case 7\npins it and the mutation confirms it: switching to -d reds that arm alone.\n\nTHE POPULATION OF THIS CHECK IS ITSELF ASSERTED — zero parsed spec_ids REFUSES\nrather than printing ok:0. This row is the second instrument of a family about\nexactly that defect, so shipping it inside its own fix was the thing to avoid.\nCASE 8 NEARLY PASSED FOR THE WRONG REASON: the first draft emptied a normal\nscaffold's bindings, which made its bound litmus unbound, so the EARLIER check\nfired and the arm went green without ever reaching the population assertion. The\nscaffold now has no bound file, so only this arm can speak.\n\nTHE RATCHET SURVIVES: unresolved-grandfathered.txt declares a known exception,\ncounted separately and named in the verdict, per 660-ryhn's warning that binding\nevery stray at once turns one silent problem into an undiagnosed red suite.\n\nFixture 5/5 -> 9/9, count DERIVED — it printed (5/5) while nine cases ran. THIRD\ninstrument on this host today with a literal self-reported count, after\ntest-script-exec-bits.sh (14/14 of seventeen) and test-skills-single-source.sh\n(7/7 of thirteen). That is a pattern rather than three accidents: a fixture that\nreports its own total as a constant cannot tell a reader it measured less.\n\nSEQUENCING, AND IT IS LOAD-BEARING: this change REFUSES trunk as it stands,\nbecause the one unresolved spec_id is real. PR #156 (920-pxg6) adds that spec.\nVerified by applying #156's spec to the worktree — ok:litmus-bindings:...\nspec_ids=141 resolved=141 spec-grandfathered=0, rc=0. #156 MUST LAND FIRST or\ntrunk goes red for every host. I deliberately did NOT grandfather the entry to\npaper over the order: the declaration would be stale the moment #156 landed, and\na stale exemption is how that list stops being read.\n\n[2026-09-22T12:15:02Z macos] \nA POPULATION GUARD'S FIRST CUSTOMERS ARE THE FAKE TREES, NOT THE REAL ONE — and\nthis row proved it on itself within an hour of being written.\n\nThe relay refused this change with\n  violation:bound-litmus-runnable:gate-refused-a-runnable-newly-bound-file\n  inner cause: violation:binding-names-absent-spec:ci-release,\n               openspec/specs/ci-release/spec.md does not exist\nand it was a TRUE POSITIVE pointed somewhere nobody was looking. That spec\nEXISTS on trunk and in the merged tree; no queued ref deletes, renames, or\nre-binds it. The missing file was in the SCAFFOLD that\nscripts/test-bound-litmus-is-runnable.sh (958-b36m) builds to prove a newly\nbound litmus is runnable: it writes bindings naming `spec_id: ci-release` and\nnever created the spec, because until this checker resolved spec_ids NOTHING\nASKED.\n\nWHY THAT IS STRUCTURAL RATHER THAN SLOPPY. A fake tree is built to satisfy the\ncheckers that existed when it was written. It is complete with respect to the\nquestions of its day and silently incomplete with respect to every question\nadded later. So the first thing a new population assertion finds is not a defect\nin the repository — it is every scaffold that was allowed to be partial, and\nthose are its FIRST CUSTOMERS. Tonight's agent-identity scratch trees\n(1354-dw8x) are the same shape from the other side: a scaffold that could not\nanswer a question nobody had asked it yet, and the tool refusing correctly.\n\nTHE COROLLARY FOR ANYONE ADDING A POPULATION GUARD: expect the initial red to\nland on fixtures and scaffolds, expect it to look like a false positive, and\ncheck which tree is missing the artifact before touching the guard. Here the\nright fix was the scaffold — it now creates the spec it names — and the checker\nwas not weakened by a character.\n\nMUTATION-VERIFIED, because a change that merely stops a red is not a fix:\nremoving the two scaffold lines reproduces the relay's exact verdict, restoring\nthem gives ok:bound-litmus-runnable:7 passed rc=0. That guard is NOT in the\npreflight set, so it was run directly rather than assumed — the preflight would\nnot have caught this."
