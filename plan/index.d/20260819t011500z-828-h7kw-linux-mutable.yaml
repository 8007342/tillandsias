packets:
  - packet_id: forge-window-closes-on-clean-exit-and-five-exit-pause-copies-cannot-fire
    order: 828-h7kw
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "a forge session's window vanishes on a CLEAN agent exit because ptyxis's profile exit-action is 'close' — a configuration surface the repo never sets — while all five in-container exit_pause traps written to prevent exactly this are destroyed by their own exec"
    deliverable: "the window survives a clean lane exit on Linux, by SETTING the terminal's exit behaviour rather than by patching entrypoints; the five inert exit_pause copies are then deleted"
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [forge, tty, fail-loud, deslop]
    estimated_hours: 3
    context: |
      OBSERVED 2026-08-18/19. The operator installed the unstable daily on a
      Silverblue host, launched Agy (antigravity), asked for a meta-orchestration
      cycle, and reported it "crashed mid cycle".

      IT DID NOT CRASH. The cycle completed and self-attested: commit 5b8da3dbe
      drained 803-825k, and plan/mo-full-attestations.d/forge.md carries
      `MO-FULL: COMPLETE 5b8da3dbe... linux-next 5b8da3dbe...` at 2026-08-18T22:18:10Z.
      What died was the WINDOW, after a clean logical exit.

      THE OPERATOR'S HYPOTHESIS WAS RIGHT ABOUT THE REMEDY AND WRONG ABOUT THE
      CAUSE, and the distinction matters because acting on the stated cause would
      have changed the wrong platform. They proposed the tty/io wrappers "need a
      lil configuration rather than defaults, instead of patches". Configuration
      is exactly right. The tty/io wrappers are not involved AT ALL on Linux:

        * crates/tillandsias-headless/Cargo.toml declares no dependency on
          tillandsias-host-shell or tillandsias-vm-layer — only macos-tray and
          windows-tray do.
        * build.sh:1237 ships the Linux binary with `--features tray`, so
          pty_handler.rs (`#[cfg(all(feature="listen-vsock", unix))]`) and
          vsock_server.rs (`#[cfg(feature="listen-vsock")]`) are NOT COMPILED.
        * every one of the +1,616 lines added to host-shell/pty, pty_handler,
          pty_input_probe and vsock_server in the 14-day window runs only inside
          the macOS/Windows VM.

      The Linux lane is ptyxis -> `tillandsias --antigravity` -> podman run ->
      entrypoint -> agy, and touches none of it.

      THE ACTUAL MECHANISM, traced end to end:
        agy exits 0 -> the container exits -> cleanup_shared_stack_if_no_running_forge
        prints its deliberately ungated teardown line (main.rs:13206, :5723) ->
        the podman success event is debug-gated and prints NOTHING
        (crates/tillandsias-podman/src/client.rs:2001-2010, `if !enabled { return; }`)
        -> the CLI returns Ok and exits 0 -> ptyxis destroys the window and its
        scrollback.
      So the last thing on screen before it vanishes is "cleaning shared stack",
      which reads exactly like a crash.

      MEASURED ON THIS HOST:
        gsettings get org.gnome.Ptyxis.Profile:/.../37b35cd13aa82534cc65bb726a082451/ exit-action
        -> 'close'
      and `ptyxis --help` exposes no --hold/--keep-alive. The surface is the
      profile GSetting, and `grep -rn 'exit-action'` over *.rs *.sh *.yaml *.md
      returns ZERO HITS. The product has never touched the one knob that governs
      this.

      THE FIVE PATCHES THAT CANNOT WORK, which is why this is a deslop packet and
      not just a config change. `exit_pause` traps exist byte-identically in
      images/default/entrypoint-forge-antigravity.sh:29, -claude.sh:32,
      -codex.sh:33, -opencode.sh:33, -opencode-web.sh:37 and
      entrypoint-terminal.sh:20 — six copies of one idea, and every one is
      DESTROYED BY ITS OWN `exec` before the agent ever runs. Six divergent
      duplicates compensating for an unset default, none of which can fire.

      Fix the configuration; then the six become deletable, which is the point.

      ALSO WORTH KNOWING for whoever takes this: `--prompt` is HARD-REFUSED for
      the antigravity lane (main.rs:13097-13102, "Codex-only today"), so the
      operator's session was necessarily an interactive TUI lane — the one shape
      nothing supervises, and the reason the cycle was 4 minutes rather than the
      30-60 a full cycle takes.

      TWO ROUTES, operator's call: set the profile key at install time, or point
      $TERMINAL (already honoured first at main.rs:11970) at a holding wrapper.
      The second avoids mutating the operator's desktop settings, which is
      probably the better manners.
