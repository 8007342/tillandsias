packets:
  - packet_id: first-spec-index-build-is-all-or-nothing-and-discards-45-minutes-on-any-interruption
    order: 963-vmbi
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: >-
      the FIRST spec-index build on a host embeds all 21,592 chunks and publishes
      only at the end, so any interruption shorter than the full build discards
      every embedded vector and the next attempt restarts from zero
    deliverable: >-
      an interrupted first build resumes from the work already embedded instead of
      re-embedding from zero, without weakening the immutable-published-entry
      invariant that lets readers resolve the index with no lock
    pickup_role: linux
    owner_host: any
    depends_on: []
    capability_tags:
      - spec-index
      - inference
      - embeddings
      - resumability
      - fail-loud
    estimated_hours: 4
    context: |
      MEASURED on lenovinha 2026-08-26 while attempting 888-miiy's exit criterion 4,
      and re-confirmed as still blocking on 2026-09-01:

        attempt 1  timeout 900s   -> rc=124, killed
        attempt 2  timeout 2700s  -> rc=124, killed
        both printed: spec-index:delta reused=0 embed=21592 of 21592
        podman volume tillandsias-spec-index-tillandsias: 0 bytes, EMPTY
        no vectors.jsonl or chunks.jsonl anywhere under ~/.cache or ~/.local/share

      Roughly 60 minutes of embedding across two attempts persisted NOTHING.

      WHY, precisely, so this is not mistaken for a delta-mechanism defect. The
      delta reuse pool is PRIOR PUBLISHED GENERATIONS under $INDEX_ROOT/*/
      (scripts/spec-index-ensure.sh, the delta re-embed block). A host that has
      never completed a build has no generation to delta against, so `reused=0` is
      CORRECT on a first build, not broken. The 2026-08-26 note on 888-miiy records
      nearly filing exactly that false correction and avoiding it only by reading
      the code rather than the symptom.

      THE ATOMIC PUBLISH IS NOT THE BUG AND MUST NOT BE "FIXED". Entries are built
      in a staging dir and renamed into place precisely so a published entry is
      IMMUTABLE and readers need no lock (the script's own header states this).
      Publishing partial results would trade a slow first build for a corpus that
      can answer from a half-built index, which is far worse: spec.answer would
      return confident answers from a fraction of the corpus with nothing marking
      it partial.

      THE FIX IS RESUMABILITY, NOT INCREMENTAL PUBLISH. The staging directory is
      already the natural home for partial work; what is missing is persisting
      embedded vectors there as batches complete, and admitting a same-fingerprint
      staging partial as a second reuse source alongside published generations.
      The content-hash join (never positional) and the per-batch arity check are
      the existing safety properties any resume path must preserve — a resumed
      build that mis-joins is the failure the arity check exists for, and it must
      still catch it.

      WHY THIS IS FILED RATHER THAN IMPLEMENTED. It cannot be verified without a
      live embedding endpoint, and the filing host has none (no ollama, no
      inference container). An unverifiable change to a script with these
      invariants is not worth landing blind.

      WHAT IT BLOCKS. 888-miiy exit criterion 4's WITH-endpoint branch is gated on
      an UNINTERRUPTIBLE >45-minute job. Until this is fixed, that criterion is
      reachable only on a host willing to hold one long unbroken run, which is why
      it has been routed to yoga rather than closed. Fixing this makes the criterion
      reachable from any endpoint-bearing host across several cycles.
    exit_criteria:
      - >-
        A first build interrupted partway (SIGTERM/timeout) and re-run re-embeds only
        the chunks not already embedded; the reused count is demonstrated non-zero on
        the second attempt with no published generation present.
      - >-
        The published entry remains atomic and immutable — a reader must never resolve
        a partially-embedded index. Demonstrated, not asserted.
      - >-
        NEGATIVE CONTROL, mandatory - a resumed build whose staging partial does not
        match the current fingerprint is DISCARDED rather than joined. A resume that
        silently mixes generations is worse than no resume, and the existing
        content-hash join plus per-batch arity check must still catch it.
    verifiable_closure: |
      On a host with an embedding endpoint and no published generation: kill a
      first build mid-way, re-run it, and observe a non-zero reuse count plus a
      correct final index. A stale-fingerprint partial is refused.
    next_action: >-
      Claim on a host with a live embedding endpoint (yoga). First read
      scripts/spec-index-ensure.sh's delta re-embed block and _publish_current to
      confirm the staging dir survives the failure path at all - if the staging dir
      is removed on interrupt, that removal is the first thing to change.
