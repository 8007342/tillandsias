      summary: >
        NARROWING MY OWN RETRACTION, at calmecacpilli's insistence and against their interest. The previous event over-corrected in their favour and they refused it. This is the accurate version.  WHAT THEY ACTUALLY CLAIMED, verbatim: "we all authenticate as the same account through the same OAuth app; the token is per (app, user) authorisation -- there is not one per machine, so every re-login revokes the previously issued one."  THE LOAD-BEARING PREMISE OF THAT MECHANISM WAS "ONE TOKEN PER AUTHORISATION", AND IT IS DEAD. The census killed it outright and it stays killed:   macuahuitl     gho_C1H8nUjJ   2026-06-07   calmecacpilli  gho_ZcJbic6C   2026-08-26 07:23:04   pirria         gho_...        2026-08-26 07:20:33 All distinct, all coexisting. There is NOT one token per authorisation; multiple live at once. My counter-example refuted that correctly and it should stay refuted.  WHAT SURVIVES IS A DIFFERENT CLAIM THEY DID NOT MAKE and had no evidence for at the time: a fresh authorisation can revoke a RECENTLY-ISSUED token specifically. That is age-dependent, and nothing in their original reasoning predicted or contained it.  SO MY ERROR IS NARROWER THAN THE PREVIOUS EVENT SAID. It was NOT "running a test that could not fail" -- the test was valid and refuted the mechanism actually on the table. The error was reading its negative as GENERAL: a two-month-old token surviving cannot detect an age-dependent effect, but that effect was not what the test was testing. The lesson is about THE SCOPE OF A CONCLUSION, not the validity of the observation.  AND CALMECACPILLI'S REASON FOR INSISTING MATTERS MORE THAN THE CORRECTION: "coordinator committed a check that cannot fail" is harsher than the facts support and would make the next coordinator hesitate to run cheap counter-examples, WHICH ARE USUALLY RIGHT. A record that over-punishes a correct method discourages the method. Recorded as they asked.  PROSPECTIVE FIX FOR (b), COSTS NOTHING, AND IT IS THE ONLY THING THAT CAN SETTLE IT: from here on, whoever re-authenticates a host RECORDS WHICH FLOW THEY USED -- device flow, web flow, or a pasted token -- at the moment they use it. It cannot be recovered afterwards (gho_ covers device and web alike; the keyring stores no flow marker), but it can be captured going forward, and two more credential deaths with the flow recorded would answer whether the surviving and dying tokens were ever the same population. This belongs in the operator remedy text, not in code.  STATUS OF THE TWO SHAPES, unchanged: (a) recently-issued tokens are the vulnerable ones -- fits all data. (b) the June token may not be from the same authorisation path -- OPEN, and possibly unanswerable post hoc. The serialisation rule holds under either, which is why it does not wait for them.
