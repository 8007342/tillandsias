  - packet_id: unified-model-runtime-flag-across-harnesses
    order: 689-jxb2
    status: ready
    desired_release: v0.6
    priority: p2
    title: "Unified --model runtime param mapped per harness — one caller-side model flag, delegated to each harness's native runtime flag"
    kind: enhancement+dx
    deliverable: tillandsias launch accepts --model <name> plus a harness selector and translates to the harness-appropriate runtime flag; registry maps model names to harness/flag pairs
    depends_on: []
    pickup_role: linux
    capability_tags: [harness, ux, launcher, dx]
    context: >
      OPERATOR SCOPING (The Tlatoani, 2026-08-11): keep a unified runtime
      flag model while supporting multiple underlying harnesses — e.g.
      `--model opus-6-5 --claude`, `--model gpt-sol --codex`,
      `--model big-pickle --opencode`. The launcher does NOT interpret the
      model value; it delegates the runtime arg to the selected harness's
      native flag and ensures the caller used a param valid for that
      harness. Until this lands, delegation uses each harness's configured
      default (stage-0 protocol in methodology/in-forge-delegation.yaml).
      Design notes: a small registry (model name -> harness -> native flag
      spelling) so new models are data, not code; unknown model/harness
      pairs refuse loudly at launch, never inside the forge; --prompt
      passthrough discipline unchanged (no escaped quotes).
    exit_criteria:
