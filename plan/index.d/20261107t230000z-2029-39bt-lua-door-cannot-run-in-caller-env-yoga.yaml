    title: "DESIGN FIRST - a Lua door child cannot inherit the caller's environment, so a shell script whose job is to run the caller's own podman cannot be ported byte-identically"
    context: |
      Measured 2026-11-07 on PR #996 (work/2025-e6mi): scripts/verify-image-usable.sh was ported to scripts/lua/verify-image-usable.lua and was byte-identical on four side-by-side arms, but the land gate evicted it on 747-knbp (test-build-image-installed-version-alias.sh). That fixture's fake podman reads FAKE_PODMAN_STORE, and the Lua child got `FAKE_PODMAN_STORE: unbound variable`. Cause, by symbol: lua_predicate::base_env_command starts EVERY Lua door child (proc.run, proc.spawn, proc.chain, sh.run) from env_clear plus PROC_RUN_BASE_ENV_PASSTHROUGH (PATH, HOME, TMPDIR, XDG_RUNTIME_DIR, DBUS_SESSION_BUS_ADDRESS, CARGO_TARGET_DIR, Windows basics) plus TILLANDSIAS_*, deliberately (1551-nyzb: sh.run used to leak a secret into a child's printenv). The only way in is proc.run's explicit `env` table, and a script reads only the variables it declares with @env. So a Lua port cannot hand podman the caller's environment; it also drops real podman inputs, e.g. CONTAINER_HOST (scripts/common.sh drives podman-remote with it), CONTAINERS_CONF and CONTAINERS_STORAGE_CONF. The same blocks porting any shell script whose contract is "run this tool as my caller would". A local run of the build-image fixtures passed only because the fixture's fake tree had no runnable plan binary, so build-image.sh took its shell fallback; the Lua path was never exercised there.
    exit_criteria:
      - "A written decision in methodology (or openspec) says which of these holds, with its security reasoning against 1551-nyzb: (a) a declared, per-script inherited-environment allowlist (e.g. an @env-inherit header listing names or prefixes such as CONTAINER_HOST, CONTAINERS_*) that base_env_command honours for that script only, with a fixture showing an undeclared variable still does not reach the child; or (b) scripts that run a caller's tool in the caller's environment are out of scope for the shell-to-lua backlog, and the carried-obligation counter excludes them by a named rule. Pre-fix result: FAILS, neither exists and verify-image-usable.sh cannot be ported."
    verifiable_closure: "A written decision in methodology (or openspec) says which of these holds, with its security reasoning against 1551-nyzb: (a) a declared, per-script inherited-environment allowlist (e.g. an @env-inherit header listing names or prefixes such as CONTAINER_HOST, CONTAINERS_*) that base_env_command honours for that script only, with a fixture showing an undeclared variable still does not reach the child; or (b) scripts that run a caller's tool in the caller's environment are out of scope for the shell-to-lua backlog, and the carried-obligation counter excludes them by a named rule. Pre-fix result: FAILS, neither exists and verify-image-usable.sh cannot be ported."
