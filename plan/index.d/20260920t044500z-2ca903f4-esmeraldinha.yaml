        THE BOUNDARY, MEASURED: /usr/lib/wsl IS TWO MOUNTS WITH DIFFERENT SAFETY PROPERTIES, AND THE ONE THE CODE SETS LD_LIBRARY_PATH INTO IS WRITABLE IN THE GUEST. Measured on esmeraldinha 2026-09-20 against the mount as it stands in trunk at b2a3e0ab8. This answers questions 1 and 3 of the closure in full FROM THE GUEST SIDE, and does NOT answer question 2 or the in-container half of 1 and 3 — the reason and what would close them are stated at the end. Measurement only; nothing was changed.

        WHAT THE MOUNT IS, from crates/tillandsias-headless/src/main.rs:5007 (wsl2_dxg_container_args): --device /dev/dxg, -v /usr/lib/wsl:/usr/lib/wsl:ro, and --env LD_LIBRARY_PATH=/usr/lib/wsl/lib. The third element is not mentioned in this row's context and it matters; see FINDING 3.

        === 1. WHAT IS THERE ===

        /usr/lib/wsl has exactly TWO top-level entries, and they are different kinds of object:

          drivers/  2,353,628,107 bytes (2.35 GB) — mount: 9p, ro,nosuid,nodev,noatime, aname=drivers, fmask=222, dmask=222
          lib/          8,624,232 bytes (8.6 MB) — mount: OVERLAY, rw,nosuid,nodev,noatime, lowerdir=/gpu_lib_packaged:/gpu_lib_inbox, upperdir=/gpu_lib/rw/upper

        lib/ IN FULL — three files, all mode -r-xr-xr-x, nothing else:
          libd3d12.so        801,840   (Oct 20 2023)
          libd3d12core.so  6,880,344   (Oct 20 2023)
          libdxcore.so       942,048   (Mar 31 2024)

        drivers/ TOP LEVEL — 795 entries, and the parts sum to the total (verified: dirs 759 + files 36 + links 0 + other 0 = 795):
          759 directories: 757 matching <name>.inf_amd64_<16 hex>, 2 matching <name>.inf_x86_<16 hex>
          36 regular files: ALL are .ini, all mode -r-xr-xr-x, 291 to 19,527 bytes
           0 symlinks, 0 sockets, 0 fifos, 0 device nodes

        THE THIRD CATEGORY — the row asked for anything that is neither a driver-store directory nor a shared library to be listed individually. It is those 36 .ini files, plus the 2 x86 directories. Named in full: the .ini set is alderlakepch-ndmasecextension, alderlakepch-nsystem, alderlakesystem, "benq pd3200u", bertreader, cui_dch (x2), dal, hdbusext, heci, hideventfilter, ialpss2_gpio2_adl_n, ialpss2_i2c_adl_n, ialpss2_spi_adl_n, ialpss2_uart2_adl_n, iclsclient, igs, iigd_dch, intcdaud, ipf_acpi, ipf_cpu, ipf_smbus, ish, ishheci, ishheciextensiontemplate, ishhidbus, ishhidmini, ishoed, mewmiprov, mshdadac, mxc6655angle, prnms009, rtkfilter, rtucx22x64, rtux64w10, voiceclarityep_audio_component. The two x86 directories are ntprint.inf_x86_3f3acf80221b4fbb and prnms003.inf_x86_075066381e43ab43 — print drivers.

