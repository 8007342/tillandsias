status:
  - packet_id: the-salvage-audit-gate-step-reds-intermittently-on-its-disclaimer-arm-while-the-same-capture-satisfies-the-ref-count-arm-so-a-run-cut-short-reads-as-an-assertion-failure
    field: verifiable_closure
    value: |-
      scripts/test-salvage-audit.sh, run 20 times consecutively on a host under
      a concurrent ./build.sh --check load, prints `ok:salvage-audit:12/12`
      every time, and when its subject is cut short by the capture's timeout
      the fixture prints a NAMED kill (`skip:salvage-audit:subject-killed-at-
      budget:<elapsed>s` or a refusal naming the budget) rather than
      `FAIL: ARM 3: the ancestry disclaimer is gone`; the fixture's own
      mutation arm shows that a subject killed after the ref count and before
      the disclaimer is reported as a kill, not as ARM 3. PRE-FIX RESULT:
      FAILS — measured by yoga 2026-09-20: pristine trunk worktree 12/12; the
      same tree 8 consecutive runs 12/12; earlier 1 FAIL in 3 (11/12, ARM 3);
      inside the gate PASSED once and FAILED twice on the same commit, and the
      failing gate log shows `ok: ARM 1b: it audited 100 refs, covering
      salvage (67) + work (33)` and `FAIL: ARM 3: the ancestry disclaimer is
      gone` from ONE capture (`out="$(timeout 300 bash "$CHECK" 2>&1)"`, line
      25), although the disclaimer is an unconditional printf to stderr three
      lines after the ref check and is present once in the script on both
      trees.


      [2026-09-20T23:02:03Z yoga] AMENDED 2026-09-20 by yoga, with macuahuitl's agreement, on two points. The
      old text is kept above unchanged because it is the record of what was believed
      when the row was filed.

      FIRST, THE VERDICT LITERAL WAS NEVER EMITTED. `ok:salvage-audit:12/12` is a
      string this fixture has never printed. It prints `ok:salvage-audit-fixture` and
      then `PASS: salvage-audit <n>/<total>`. A criterion that names a string nobody
      produces cannot be satisfied except by reshaping the subject to match the
      criterion, which is backwards. The closure is now — scripts/test-salvage-audit.sh
      prints `PASS: salvage-audit 14/14` and exits 0. It is 14 and not 12 because the
      two regression arms are part of the fix.

      SECOND, THE REGIME IS THE PIPE SIZE, NOT THE LOAD. The old text asked for 20
      consecutive runs under a concurrent ./build.sh --check. That is how the flake
      was ENCOUNTERED and it is not what causes it. Build load only ever reached the
      defect by incidentally exhausting the user's pipe pages, which is precisely why
      40 replays on macuahuitl and 6 here were clean while the gate kept reddening.
      The closure now asks for the mechanism directly — with enough pipes held open
      that a fresh pipe is smaller than the audit's capture, 20 consecutive runs are
      clean, and the same 20 runs against the pre-fix fixture are not.

      MEASURED ON YOGA 2026-09-20, /proc/sys/fs/pipe-user-pages-soft = 16384; holding
      1400 pipes open takes a fresh pipe from 65536 to 8192 bytes against a
      15569-byte capture.
        pre-fix, 20 runs at pipe=8192 — 2 RED (ARM 1b), 18 pass
        post-fix, 20 runs at pipe=8192 — 0 red, 20/20
        either version at pipe=65536 — clean, as every earlier replay was
      The old spelling measured directly, GNU grep 3.12, pattern PRESENT — pipe=65536
      gives rc=0 at 15000 and 60000 bytes and rc=141 at 200000 and 1000000; pipe=8192
      gives rc=141 at 15000.

      THE ARM-3 PREDICTION IN THE OLD TEXT IS SUPERSEDED, not merely unmet. It asks
      the fixture to report a subject cut short by the capture's timeout as a NAMED
      kill. There is no timeout kill. That hypothesis was refuted twice before this
      row was worked and a third time by the reproduction — and the arm that reds is
      not fixed either. macuahuitl saw ARM 3, the disclaimer; reproduced here on the
      same file and the same commit it was ARM 1b, the header. Which arm loses is a
      property of the machine's pipe size, so a closure naming one arm would pass on
      one host and fail on the next for reasons unrelated to the defect.
    ts: "2026-09-20T23:02:03Z"
    host: yoga

