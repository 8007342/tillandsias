    title: |
      the tray pushes the vsock forwarder's target over the control wire after Ready and headless reads it at container start — and the capability-negotiation question dissolves, because the secure channel's PSK binds the build version, so no mixed-version session can exist
    context: |
      830-xsk2 proved the transport end to end and shipped everything except the
      writer: the seccomp derivation, the forwarder run-args, and the lane wired
      at all four production inference sites are on trunk. What is missing is the
      host→guest delivery of `(cid, port)`. Today `vsock_forward_target()` reads
      /run/tillandsias/vsock-forward and NOTHING WRITES IT, so the lane is
      reachable only through TILLANDSIAS_GUEST_VSOCK_FORWARD_TO, which is a test
      seam rather than the product path.

      ORDERING — SETTLED (READ). The host vsock listener binds INSIDE
      VzRuntime::start(), where the guest is not yet Ready and the control wire
      is unusable, so the push cannot ride the bind. The usable point is after
      `wait_phase_ready`, which is where every tray path already opens its
      stream (diagnose.rs exec_guest_main; action_host.rs poll_vm_status_once,
      poll_cloud_projects_once, poll_github_login_once). headless starts
      inference containers from FORGE-LAUNCH paths rather than at boot, and
      `vsock_forward_target()` reads at CONTAINER START rather than caching at
      process start, so the window holds BY CONSTRUCTION rather than by luck.

      THE CHANNEL IS A TYPED MESSAGE, NOT A FILE WRITE (READ). ControlMessage's
      ~32 variants are each a named, typed operation — Hello/HelloAck,
      IssueWebSession, Error, EvictProject, McpFrame, VmStatus*, VmShutdown*,
      CloudRefresh*, Pty*, DeliverCredentials*, GetVaultHandover,
      GithubLoginStatus*, Subscribe, MetricsSnapshot*. There is no generic exec
      and no file write. So this is a wire-protocol change: a new variant, a
      guest-side handler, and tests on both halves.

      AND THE CAPABILITY BIT IS NOT ONE OF THEM (READ, and this is the finding).
      crates/tillandsias-secure-channel/src/lib.rs:136 derives the channel PSK as

          info = "v={build_version};wire={wire_version};hop={hop}"
          HKDF-SHA256(salt=CONTROL_CHANNEL_SALT, ikm=root_secret, info)

      so THE BUILD VERSION IS AN INPUT TO THE KEY, pinned by its own test
      (`psk_differs_across_build_version`: "different build_version MUST yield a
      different PSK"). Two peers at different versions derive different keys and
      NNpsk0 fails closed. NO MIXED-VERSION SESSION CAN EXIST. Therefore an
      unknown variant can never arrive from a peer that does not share the
      sender's build — and a new variant needs no negotiation bit, only the same
      version on both ends, which a tray and its embedded guest share by
      construction.

      It is stricter still for this hop: `channel_psk_for_guest` derives from the
      GUEST BINARY's SHA-256, which the guest self-hashes and the host must
      supply from build time (1084-x8ya). A guest that was never re-staged keeps
      its old self-hash, mismatches, and is refused with a named cause — the
      doc calls that "the design working, not a regression".

      MEASURED (RUN), tlatoanis-macbook-air 2026-09-20, guest headless
      v56.9.13.1, probing the guest's own listener over vsock loopback (CID 1
      port 42420 — vsock_loopback is loaded, so this needs no tray and no
      CFRunLoop):

        sent  0000000b 0401000570726f62650000   Hello{from:"probe",caps:[],build:None}
        got   140 bytes, envelope wire_version=4 seq=0 DISCRIMINANT 4 (Error):
              "secure control wire required: the version-bound secure-channel
               handshake failed; plaintext or mismatched-version peers are not served"
        then  stream CLOSED (recv -> b''), second send -> BrokenPipe [Errno 32]
        guest log: "[tillandsias] secure control wire REFUSED:
                    [peer-sent-no-usable-frame] noise: input error … (psk inputs:
                    v=56.9.13.1, wire=4, hop=host-guest)"

      So a plaintext peer ERRORS with a typed envelope naming the cause and the
      stream CLOSES: no silent drop, no wedge. The unknown-variant discriminant
      I sent (100) was never reached.

      THE FACT EVERYONE WHO ASSUMED Hello IS THE NEGOTIATION POINT NEEDS:
      Hello is never read from a peer that cannot complete the handshake. The
      secure channel gates the stream BEFORE any variant dispatch, so
      Hello/HelloAck cannot carry a compatibility bit for peers that differ in
      the way that matters — those peers never exchange a Hello at all.

      WHAT REMAINS UNMEASURED AND WHY IT NO LONGER BLOCKS: in-session
      unknown-variant behaviour. Reaching it needs a full Noise handshake with
      the version-bound PSK. It is not on the path to this row's deliverable,
      because the version binding means such a frame cannot arise between real
      peers.
    deliverable: |
      A new ControlMessage variant carrying the forwarder target, sent by the
      tray after Ready and handled by headless, with the file at
      /run/tillandsias/vsock-forward remaining the read-side contract
      `vsock_forward_target()` already implements.

      THE VARIANT APPENDS AT THE END. ControlMessage's doc is explicit:
      "Existing variants MUST stay in their current positions; new variants
      append at the end." The discriminant is positional in postcard, so
      inserting anywhere else silently re-numbers every later variant — a peer
      built before the change would read frame N as whatever variant IT has at
      index N. There is a test that pins every discriminant by literal; update
      it in the same commit.

      NO CAPABILITY BIT, and the row's own context is the reason. If a future
      reader wants one anyway, they must first explain how two peers with
      different builds exchange any frame at all given the PSK derivation.

      NOT IN SCOPE: changing the PSK derivation, the handshake, or the version
      binding. This row consumes that property; it must not weaken it.
