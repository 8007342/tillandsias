    title: |
      Lua checkers and fixtures pass quoted glob patterns (-name '*.sh', '*.rs', ...) to spawned msys tools, which expand them against the cwd on Windows, so the tool errors or searches the wrong set
    context: |
      Measured in 2415-zwjm: an msys program started by the native runner globs its own argv. At least 16 sites
      in scripts/lua and lib/lua pass such patterns (git grep '"-name", *"[^"]*\*'), including production
      checkers: check-order-citations-resolve (find . -name '*.sh'), and check-podman-sync-budgets
      (find -H root -name '*.rs'). Where a match exists in the cwd, the pattern is replaced silently and the
      checker can report ok over the wrong set; where none exists, the pattern survives, so the bug is
      cwd-dependent.
    exit_criteria:
      - RED FIRST, per site or in a shared fixture, a cwd holding a matching file changes what the spawned tool sees on msys.
      - Each site lists through fs.list or fs.walk, or passes MSYS_NO_GLOB-equivalent quoting, and Linux behaviour is unchanged.
      - A guard (or a widened check-lua-posix-only-absolute sibling) refuses a new quoted glob in a proc.run argv.
    verifiable_closure: |
      The guard reports 0 sites, and on msys check-podman-sync-budgets and check-order-citations-resolve
      read the same file set as on Linux.
    unscoreable: "no litmus or fixture scores this yet; the guard named in exit_criteria becomes the pin"
