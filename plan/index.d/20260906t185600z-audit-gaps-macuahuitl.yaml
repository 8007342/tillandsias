  - packet_id: vault-unseal-share-ephemerality-and-reset-hygiene
    order: 1118-fqfk
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: rust
    release_target: stable-milestone-v1
    capability_tags:
      - vault
      - secrets
      - ephemerality
      - rust
    verifiable_closure: cargo test -p tillandsias-headless vault_bootstrap
    title: |
      Confine fallback Vault unseal share to tmpfs and wipe on --reset-guest
    deliverable: |
      Store fallback unseal shares under $XDG_RUNTIME_DIR on tmpfs, add fallback paths
      to reset_guest_wipe_paths in crates/tillandsias-headless/src/main.rs, and ensure
      --reset-guest clears all persistent credential artifacts.
    context: |
      vault_bootstrap.rs writes plaintext Shamir shares and root tokens to durable disk
      in ~/.cache/tillandsias/, and --reset-guest fails to wipe them, allowing unseal
      recovery across supposedly clean resets.
    exit_criteria:
      - 'Unseal shares are never persisted to non-tmpfs disk paths'
      - '--reset-guest removes all fallback credential cache files'
    events:
      - ts: "2026-09-06T18:56:00Z"
        type: filed
        agent: linux-macuahuitl-gemini-20260906t184820z
        host: macuahuitl
