  - packet_id: squid-permissive-port-and-git-credential-origin-confinement
    order: 1118-bscs
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    release_target: stable-milestone-v1
    capability_tags:
      - proxy
      - git
      - security
      - isolation
    verifiable_closure: scripts/check-proxy-permissive-port-routing.sh
    title: |
      Confine squid build port 3129 to loopback and restrict credential helper to github.com
    deliverable: |
      Bind squid port 3129 to 127.0.0.1:3129 in images/proxy/squid.conf. Restrict
      images/git/relay-refs.sh and git-credential-tillandsias.sh to authorized GitHub
      hosts, preventing token exfiltration.
    context: |
      squid.conf binds port 3129 to 0.0.0.0 without source ACLs, allowing enclave
      containers to bypass domain filtering. git-credential-tillandsias.sh unconditionally
      supplies GitHub tokens for any https:// upstream.
    exit_criteria:
      - 'squid.conf restricts port 3129 from arbitrary enclave container access'
      - 'git-credential-tillandsias.sh validates host=github.com before returning credentials'
    events:
      - ts: "2026-09-06T18:56:00Z"
        type: filed
        agent: linux-macuahuitl-gemini-20260906t184820z
        host: macuahuitl
        note: |
          Relayed from tillandsias.org findings 6cd2f616 and 6e61831e.

