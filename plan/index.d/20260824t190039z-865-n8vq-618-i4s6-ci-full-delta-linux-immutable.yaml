        Mechanism verified on pirria today: local-ci.sh sources
        with-tillandsias-builder.sh (line 32), which on Silverblue re-execs the
        whole run inside the tillandsias-builder toolbox. `podman ps` succeeds
        on the host and fails inside that toolbox.

        THE REASON IS ARCHITECTURAL AND NOT FIXABLE BY PROVISIONING. A toolbox
        IS a podman container, and podman cannot run inside podman — every
        podman container lives at the same layer and they do not nest. So the
        check is not asking a container for a runtime someone forgot to
        install; it is asking for one that cannot exist there. Any fix phrased
        as "add podman to the builder toolbox" is a dead end.

        The re-exec's own comment says it is "sourced first so the ci-full
        container/runtime toolchain resolves inside the toolbox". The Rust
        toolchain does resolve there; the CONTAINER runtime provably cannot,
        which makes that sentence promise something the layer model forbids.

        THE SHAPE THAT WORKS IS ALREADY IN USE: other Silverblue hosts build
        and run the whole architecture by orchestrating the two layers —
        podman work on the host, toolchain work in the toolbox, never nested.
        So the scoping this packet wants is not only about which litmuses
        declare a podman precondition; it is about which STEPS must stay
        outside the toolbox re-exec entirely.

        WHY IT MATTERS BEYOND THIS CHECK: 865-n8vq is a p0 whose likeliest
        remedy is running --ci-full on a cadence. Every immutable host asked to
        do that will fail this check for an environmental reason and report a
        red gate it cannot clear — the "ENV-FAIL on immutable/toolbox hosts"
