        SO THE ONE-LINE ANSWER A HOST NEEDS: A GREEN PUSH HAS RUN NO LITMUS AT
        ALL. --check never reaches local-ci.sh, and litmus is exactly where this
        packet's 8-of-324 failures live. That is the whole structural gap — not
        a subtle difference in coverage but an entire suite that the enforced
        gate does not touch.

        MEASURED HERE: `scripts/local-ci.sh --phase pre-build` costs 207 s on
        4 Alder Lake-N cores. Cheap enough to run on a cadence, which matters
        for criterion 1's FIRST branch.

        BUT THE PHASE CANNOT PASS UNDER A BLANKET TOOLBOX RE-EXEC, and the
        reason is architectural rather than a provisioning gap. It exits 1 here
        with `podman-path-availability` — not because podman is broken, but
        because local-ci.sh re-execs the WHOLE run inside the
        tillandsias-builder toolbox on Silverblue (it sources
        with-tillandsias-builder.sh at line 32), and PODMAN CANNOT RUN INSIDE
        PODMAN. A toolbox IS a podman container; all podman containers live at
        the same layer and cannot be nested. So this is not "the toolbox is
        missing podman" — no amount of provisioning fixes it. Verified both
        directions: `podman ps` succeeds on the host and fails inside the
        toolbox.

        THE REMEDY IS ORCHESTRATION, NOT INSTALLATION, and it is already proven:
        other Silverblue hosts build and run the whole architecture by keeping
        podman work on the HOST layer and toolbox work inside the toolbox,
        never nesting the two. (The orchestrator is mutable Linux for this same
        reason.) What local-ci.sh does instead is move its entire check list
        inside the toolbox, which strands every podman-dependent check on the
        wrong side of a boundary that cannot be crossed.

        So if criterion 1's answer is "run --ci-full on a cadence", an immutable
        host can host it — but only once the podman-dependent steps run outside
        the re-exec. Recorded on 618-i4s6, which owns this class.

