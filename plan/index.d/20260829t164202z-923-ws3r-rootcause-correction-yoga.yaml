      summary: |
        ROOT-CAUSE CORRECTION — I filed this packet and I got the cause wrong.

        WHAT I WROTE (2026-08-29, on filing): "the sweep resolves its OWN binary
        inside that copy and hands the .rb the RELATIVE path
        target/release/tillandsias-plan", and the sharper half, "the freshness
        probe RETURNED SUCCESS for a path it never ran".

        WHAT IS ACTUALLY TRUE, measured today:

        1. THE SWEEP RESOLVES CORRECTLY. Both check-archive-answerability.sh
           (:136) and archive-plan-packets.sh (:100) export
           TILLANDSIAS_PLAN_BIN as an ABSOLUTE path, before the sweep runs.
        2. THE ENV DIES AT A TOOLBOX BOUNDARY. This host has no `ruby`, so the
           script's `_ruby()` helper took its fallback arm — a RAW
           `toolbox run --container tillandsias-builder ruby ...`. Measured:
           `toolbox run` does not forward the caller's environment
           (TILLANDSIAS_PLAN_BIN=/tmp/sentinel -> UNSET inside).
        3. SO THE .rb TOOK ITS DEFAULT. archive-plan-packets.rb:34 reads
           `ENV['TILLANDSIAS_PLAN_BIN'] || 'target/release/tillandsias-plan'`.
           The relative default is what appeared in the abort message — not a
           path the sweep chose, a path the .rb fell back to. Inside the
           answerability check's hermetic tree, which excludes ./target by
           design, it does not exist.

        THE FRESHNESS PROBE WAS NEVER AT FAULT, and exit criterion 3 as I wrote
        it would have BROKEN something deliberate. resolve_plan_binary honours
        an explicit TILLANDSIAS_PLAN_BIN on EXISTENCE ALONE, and its comment
        says why: probing the override with `capabilities` collapses
        `stale-plan-binary` into `no-plan-binary`, a distinction the litmus
        depends on and which 704-zcgi's first run caught immediately. My
        criterion ("must not return a path it has not successfully RUN") would
        have re-introduced exactly that. It is WITHDRAWN, and the reason is
        recorded here rather than quietly dropped.

        HOW I NEARLY GOT IT WRONG A SECOND TIME. My first measurement was a raw
        `toolbox run`, which drops the env — and I nearly reported the toolbox
        boundary as the cause outright. But scripts/with-tillandsias-builder.sh
        ALREADY forwards TILLANDSIAS_* (its comment names this exact trap), so I
        re-tested THROUGH the project's wrapper: the var survives. The wrapper
        is fine; the defect is a SECOND, hand-rolled toolbox call site that
        never learned what the shared one knows. Testing the real path instead
        of the plausible one is the only reason the fix landed at the right
        line.

        THE CLASS IS 704-zcgi, third boundary. with-tillandsias-builder.sh
        forwards for the toolbox, with-wsl2-builder.sh forwards for WSL
        (889-8tcb), and this ad-hoc dispatch forwarded for neither. Fixed by the
        same shape both precedents use.

        WORSE THAN THE RED IT CAUSED, and worth keeping: in the ORDINARY
        (non-hermetic) case the relative default HAPPENS TO EXIST, so the .rb
        silently ran a DIFFERENT binary than the caller resolved — the freshness
        probe's answer discarded, and a possibly stale ./target artifact
        deciding which packets are terminal. The clean-tree red was the visible
        symptom of a fail-open that had no symptom at all.
