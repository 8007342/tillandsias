    outcome: |
      The batch selector's documented epic score is
      2*urgency + 1.5*blocking + neglect, but `.priority // "p3"` in
      select-work-batch.sh always yields "p3" because tillandsias-plan's
      JSON projection (main.rs query_json_projection) has no `priority`
      field at all — while ~35 ledger packets carry priority:. Urgency is
      therefore constant 0 everywhere and epics rank on blocking+neglect
      only. Add "priority" to the projection (null-safe), keep the script
      expression verbatim, and re-verify the minimax-dominates-entropy
      litmus still holds with real urgency in play. NOT fixed in the
      627-53gu portability patch on purpose: changing the projection
      changes batch selection on ALL platforms and needs its own review.
