    estimated_hours: 1
    outcome: |
      Every macOS advance-work-from-plan cycle can run the batch selector.
      Three defects, found live when this cycle's selector call crashed:
      (1) "${REL_ARG[@]}" on an empty array under set -u is an unbound-
      variable error on bash < 4.4 (stock macOS 3.2), and REL_ARG is empty
      on every skill-driven call — the crash path was the default path;
      (2) yq (absent on macOS hosts; jq present) parsed the tillandsias-plan
      --json output, with stderr discarded, so even past (1) the script
      falsely refused no-eligible-work; (3) BSD awk rejects -v values
      containing literal newlines ("newline in string") — depcounts now
      rides the input stream behind a ==ROWS== marker line. Linux behavior
      is result-identical: the guard idiom is the build-image.sh
      NO_CACHE_ARGS precedent, Fedora's yq is the jq wrapper, and the dep[]
      map is the same either way. Bonus: litmus-cycle-batch-triage-shape
      step 6 used GNU-only grep -P; now a literal-tab grep. ci-release
      litmus suite 7/7 PASS on this host (was failing since filing).
