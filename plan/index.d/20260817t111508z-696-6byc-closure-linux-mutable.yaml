        THE FALSIFIED CLAIM, recorded because it was mine and it was in a code
        comment as fact. I wrote the class tests with builtin `case` instead of
        `printf | grep -q` and justified it in-line by asserting that the grep
        form would break here: grep -q exits on first match, the producer takes
        SIGPIPE, pipefail promotes 141, so the condition reads FALSE exactly
        when it MATCHED (the 795-imz3 class, and this script does set -uo
        pipefail at line 33). Then I measured it instead of trusting it:

          short string  -> printf | grep -qF ... : condition TRUE  (no SIGPIPE)
          yes(1) stream -> yes ... | grep -qF ... : condition FALSE, rc=141

        So the grep form works fine at today's sizes. printf finishes writing
        before grep exits; there is nothing left to receive the signal. The
        honest statement — now what the comment says — is that this is a
        SIZE-DEPENDENT failure that would arrive silently on the first run with
        enough violations to outrun the pipe buffer, inside the code path whose
        only job is explaining a failure. `case` is still the right choice, for
        a weaker and true reason rather than a strong and false one.

        Worth generalizing: "this is an instance of a known bad pattern" is
        itself an inference. The pattern's precondition (a producer still
        writing when the consumer exits) has to hold, and here it did not.
