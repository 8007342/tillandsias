      summary: |
        FILED AND FIXED IN ONE CYCLE. set-field now REFUSES a list-valued field instead of scalarising it.

        THE MEASUREMENT, control first so the silence afterwards means something (throwaway ledger, no live row touched):
          control, no fragment:  select-rows --tag testing -> the row
          write:                 set-field <row> capability_tags "testing, low-end"
                                 -> ok: r.capability_tags <unset> -> testing, low-end
          after:                 select-rows --tag testing -> nothing
                                 select-rows --tag low-end -> nothing
        One `ok:` write and the row matches NO tag query at all — the tags it carried stop matching and the tag being added never matches. The fold holds a scalar where the schema has a sequence.

        WHY p1: capability_tags is load-bearing in the SELECTOR. 847-wgy4's tier gate reserves `low-end` work for the floor hosts and SUBTRACTS it from everyone else's pool, so a scalarised row is in nobody's pool under any tag. The damage is silent and durable — the fragment is immutable, so repair needs another correction fragment written by someone who noticed.

        MY OWN 1151-td46 GUARD CANNOT SEE IT, and that is the sharp edge. That order refuses a write that DROPS LINES from long-form prose. Here the old value reads as `<unset>`, so there are no lines to drop and the write passes straight through. A guard that protects prose cannot protect a list it cannot see — I landed that guard this morning and it has a hole exactly where the damage is worst.

        THE FIX REFUSES RATHER THAN LEARNING TO WRITE LISTS. Writing one correctly means rendering a sequence into the LWW channel and teaching every consumer to read it — a change to the channel's contract, and a much larger claim than this row. Scalarising silently is the failure; stopping it is the fix. The refusal NAMES the field and the paths that can edit a list, so the caller is redirected rather than merely blocked, and it exits 2 writing nothing.

        VERIFIED, three ways plus two negative controls:
          the clobber          -> refused:set-field:list-valued-field, rc 2, zero fragments written, the tag still matches
          a scalar field       -> still writes (priority p2 -> p1)
          long-form prose      -> 1151-td46's drop guard still fires

        MUTATION-TESTED BOTH DIRECTIONS, each diff proven non-empty first: a guard that accepts everything reds set_field_refuses_a_list_valued_field (the pre-fix behaviour); a guard that refuses everything reds BOTH negative controls — scalar fields and an absent field — which is the failure that would stop the fleet rather than protect it.

        HOW IT WAS FOUND, and it is worth the record: this is the THIRD consecutive cycle the selector offered yoga a batch it cannot work (1109-t8kw needs an at-risk floor host, packet 405 needs provider budget authorisation). Rather than route around it a third time, I went to make the ledger express the routing — tier-tag 1109-t8kw so the floor gets it — and the tagging path turned out to be the defect. The row was NOT written to; that route stays closed until this lands, and then it is one tag away.
