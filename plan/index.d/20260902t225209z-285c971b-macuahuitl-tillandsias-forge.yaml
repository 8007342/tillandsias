        THE THROUGHPUT NUMBER UNDERSELLS THIS FIX, and the coordinator's measurement of the host is why. Recorded at their request.  MEASURED ON THE HOST during desktop stalls, 2026-09-02: the NVMe sits at 96% busy delivering 8.1 MB/s while no process writes more than 20 KB/s — kernel flush and discard workers are the ones blocking. The filesystem is btrfs at 927 of 951 GiB ALLOCATED with only 24 GiB unallocated, roughly 129 GiB stranded inside allocated chunks, metadata DUP at 79.8%, and 22,858 extents queued for async discard.  WHAT THAT MAKES THIS CHANGE. I framed it as latency: a 208 MB tree copy per archiver-check miss, 30273ms -> 297ms. On a filesystem whose actual problem is fragmented allocation plus a discard backlog, the copy was also 208 MB of NEW EXTENTS allocated per gate miss, later freed, later queued for discard — and then done again on the next miss. Every forge and bare-metal host sharing that disk paid it, on every miss, all night. Removing the write removes the allocate/free/discard cycle, not just the wait.  So the honest statement of the win has two halves and I only wrote one down: it is ~100x on the phase AND it is a per-miss elimination of 208 MB of extent churn on hosts whose contention is allocation rather than bandwidth. A reflink shares extents; it does not create them. That second half is invisible in a stopwatch and is plausibly the larger effect across a fleet on a night like this one.  I am not claiming this fix resolves the host condition — it is one contributor among several, on a disk that is 97% allocated for reasons that long predate tonight. The claim is narrower and checkable: this specific repeated write is gone, and it was one of the larger repeated writes in the gate.  WORTH TESTING WHEN THE HOST IS HEALTHY, and I did not test it because I was asked to stop running gates: whether the same extent-churn argument applies to the OTHER copy in this check. archive-plan-packets.sh --check still does `cp -a plan/` into a scratch dir per invocation (measured at 60ms, so it is invisible in the profile) and plan/ is 22 MB. Small next to 208 MB, but it is the same shape and the same per-miss cadence, and `cp -a --reflink=auto` there is a one-line change with the same safety argument.
