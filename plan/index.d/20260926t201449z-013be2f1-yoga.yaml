      [2026-09-26T20:14:49Z yoga] 2026-09-26 yoga, SIBLING SWEEP (class 1254-fdsu, printf/awk numeric output under a comma locale), BY SOURCE READING — no script was executed, because running every script a grep names is how packet 278 got claimed (never-execute-scripts-found-by-grep). Pattern: printf with %[.N]f/g/e in scripts/*.sh, images/*/*.sh, images/*/*/*.sh, comment lines excluded; plus `sort -g`. A regex census is an UPPER bound on shape and says nothing about files outside those globs.
      RESULT: 9 real float-formatting sites in 6 scripts (+1 false positive: images/inference/entrypoint.sh:542 is `find -printf '%f'`, a filename; +1 is scripts/test-awk-float-lc-numeric.sh, a test of this class).
