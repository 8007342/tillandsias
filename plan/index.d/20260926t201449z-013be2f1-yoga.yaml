        freshness-inventory.sh:477  pinned per call: `LC_ALL=C awk`
        bench-hot-path-placement.sh:90  awk %.1f%% — UNPINNED, NAMED NOT FIXED: it formats a `#   total=…MB … is N.N% of available` line that reads as human commentary. On Linux gawk prints a dot regardless of locale (no --use-lc-numeric); under macOS awk with a comma locale it would print a comma. If anything parses that line, it is the next one to fire.
