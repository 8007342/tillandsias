        THE SAMPLE WENT FROM 12 TO 579 AND THE RECOMMENDATION INVERTED.

        Operator directive: widen to 50 questions per corpus. Done — 579
        questions across methodology/cheatsheets/spec/plan/code, generated
        against real files and independently audited, 35 audited-mislabelled
        items excluded. Measured on the live 20,776-chunk index, nomic-embed-text.

                        n=12 (2026-08-22 am)      n=579 (this measurement)
          global        overlap 0.0072            overlap 0.3024
          methodology   SEPARATES by 0.0946       OVERLAPS by 0.2791
          cheatsheets   SEPARATES by 0.0209       OVERLAPS by 0.2818
          spec          -                         OVERLAPS by 0.1897
          plan          -                         OVERLAPS by 0.2591
          code          -                         OVERLAPS by 0.1746
          margin test   overlap 0.0154            overlap 0.1306

        I RECOMMENDED PER-CORPUS THRESHOLDS ON TWELVE QUESTIONS. At a realistic
        sample every corpus overlaps by 0.17 to 0.28. The cheatsheet margin I
        flagged as "thin and shrinking" did not shrink, it inverted by an order
        of magnitude. No threshold rule measured so far survives n=579.

        TWO DESIGN FAULTS IN MY OWN WIDENED SET, and both make the numbers
        PESSIMISTIC, so the true picture is better than 0.30 — but not good.

        (1) CROSS-CORPUS QUESTIONS ARE NOT OUT-OF-CORPUS. I instructed the
        generators that "a question belonging to a different corpus" counts as
        a near-miss. It does not: RETRIEVAL IS GLOBAL. "Which command archives
        an OpenSpec change", labelled a methodology near-miss, correctly
        retrieves docs/cheatsheets/openspec-install.md at 0.8643 — the system
        answered it right and my label called that a failure. 187 of 243
        near-miss questions (77%) retrieved a corpus kind other than their
        label, so the near-miss ceiling is largely made of correct answers.

        (2) THE CORPUS IS BROADER THAN "THIS PROJECT". cheatsheets/ carries
        general technical reference — CSS, PostgreSQL, languages — so my
        far-field band is contaminated too: "how do I vertically center a div
        with flexbox" scores 0.6797 on cheatsheets/languages/css.md, and
        "postgresql jsonb indexing" 0.6911 on a postgresql cheatsheet. Both are
        genuinely answerable. Only questions like LoRA training (0.6411 on
        convergence.yaml) and JVM GC tuning (0.6392) are truly far-field, and
        they still reach 0.64 against an in-corpus FLOOR of 0.5620.

        SO THE CLEAN COMPARISON I CAN MAKE — in-corpus floor 0.5620 vs
        far-field ceiling 0.6911 — STILL OVERLAPS, by 0.1292. Even the easy
        band does not separate at scale.

        WHAT THIS MEANS FOR THE DECISION. A score threshold is not a viable
        refusal mechanism for this corpus at any granularity tested. That
        strengthens the negative-case result recorded earlier today, which is
        scored by WHICH CHUNK WON rather than by how high it scored and is
        therefore untouched by every problem above.

        WHAT THE SET IS WORTH KEEPING FOR. Committed at
        scripts/refusal-calibration/questions-wide-579.jsonl with its results.
        It needs RELABELLING against the global corpus before the near-miss
        band can be trusted — that relabelling is the smallest next action on
        this packet, and it is cheap now that the questions exist.

        THE AUDIT EARNED ITS COST. Independent auditors found mislabel rates of
        2, 3, 12, 15 and 8 out of 40 checked per corpus. The plan corpus cases
        were mostly citations into plan/index.d/ fragments that lenovinha's
        fold commit e84f37b40 deleted four hours earlier — a fragment path is
        not a durable citation, because folding is designed to remove it.
