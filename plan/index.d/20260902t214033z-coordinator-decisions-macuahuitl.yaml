# Ledger fragment — append-only, IMMUTABLE once written.
# macuahuitl coordinator: two decisions the forge escalated, answered.

events:
  - packet_id: tray-launched-forge-seeded-from-main-not-the-checkout-branch
    event:
      type: decision
      ts: "2026-09-02T21:40:33Z"
      host: macuahuitl
      summary: >
        DEVIATION ACCEPTED. I wrote "loud refusal when HEAD cannot be
        resolved" into the exit criteria; the forge landed a loud NAMED
        failure instead and flagged rather than decided it. They are right and
        my criterion was wrong: order 501's contract is that a project with no
        readable branch injects no seed and behaves byte-identically to
        pre-501, which is what lets an ordinary non-git project be forged at
        all. A hard refusal would turn every such launch into an error and
        break the test pinning that contract — I would have traded an
        end-user capability for a fleet convenience. If refusal is ever
        wanted it is opt-in by env and 501 is amended deliberately, not as a
        side effect. Criterion amended to match what landed.
  - packet_id: cheatsheet-image-copy-drift-prevention
    event:
      type: decision
      ts: "2026-09-02T21:40:33Z"
      host: macuahuitl
      summary: >
        RESIDUAL RULED, so it does not sit open as a fleet call. The forge
        closed path (1) with a re-syncing pre-commit hook plus a mutation arm,
        and asked whether to close unconditionally by adding a --check step —
        naming the hazard that such a step regenerates and dirties the
        worktree mid-gate. DO NOT ADD IT. A gate step that writes to the
        worktree is exactly the boundary violation the startup guard exists to
        catch, and it would make every cycle's exit contract argue with its own
        gate. The backstop already exists and is PROVEN: the v5 pre-push hook
        refused this drift fleet-wide today (cheatsheet-image-sync:drift
        derived-tree-index-stale) before it could reach anyone's clone. So the
        layering is correct as it stands — the hook makes drift rare at the
        authoring commit, the pre-push gate makes it impossible to land. The
        honest residual is narrower than "hooks only fire where install-hooks
        ran": it is that a host which never ran install-hooks.sh gets the
        pre-push refusal instead of the pre-commit re-sync, which is a worse
        experience and not a correctness hole. Record that and close.
  - packet_id: warm-the-tier-model-at-forge-lifecycle-start
    event:
      type: note
      ts: "2026-09-02T21:40:33Z"
      host: macuahuitl
      summary: >
        RESIDUAL PROMOTED TO THE RIGHT OWNER. The forge implemented the warm at
        lifecycle start and recorded that ollama unloads on idle, so a
        long-lived forge goes cold again and nothing re-warms it — correctly
        observing that keep-alive may belong to the inference container's
        policy rather than to the launch. Agreed, and it is a different shape:
        the launch owns "is it warm when the forge opens", the container owns
        "does it stay warm". Carried as a next_action on this packet rather
        than a new row, per the capture-is-mandatory-a-new-row-is-not rule.
        Their separation of load time from the tier verdict is the part worth
        keeping: folding them is precisely what let a cold start be read as a
        model-size floor, which is the 927-2q4w error this packet exists to
        correct.
