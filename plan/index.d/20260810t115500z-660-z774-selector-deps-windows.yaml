packets:
  - packet_id: selector-pool-drops-deps-clear-and-unleased
    order: 660-z774
    status: ready
    desired_release: v0.5
    priority: p1
    title: "select-work-batch.sh builds its pool from `query`, so batches can contain dependency-blocked and leased packets"
    kind: bug
    deliverable: scripts/select-work-batch.sh
    depends_on: []
    pickup_role: linux
    capability_tags: [plan, orchestration, triage, tooling]
    context: >
      Found by taking a packet from this host's own batch and reading it.
      248 spec-cheatsheet-contradiction-audit declares
      depends_on: [245, 246, 247] — and all three are `ready` (unstarted) and
      ALL THREE WERE IN THE SAME BATCH. The selector offered a packet alongside
      the three packets blocking it. `tillandsias-plan next windows` does not
      list 248 at all; every entry it returns carries "deps clear, unleased".

      The cause is stated in the script's own header, which credits `next` with
      being "release-aware, role-compatible, DEPENDENCY-CLEAR, UNLEASED,
      priority-ranked" and then builds its candidate pool from
      `query --status ready --claimable-by`, which applies none of those last
      two. The layer meant to add cohesion ON TOP OF claimability instead
      REPLACED claimability with a weaker test.

      Two silent consequences: blocked work fills batch slots (worst case here —
      three of 248's blockers took the other slots), and leased work can be
      handed to a second host, routing around the very duplication the
      claim-ledger lease exists to prevent.

      Invisible until now because the selector only began producing batches on
      Windows a few hours ago (632-retq, 643-bnag); before that it refused on
      every invocation, so nothing downstream of the query had been exercised
      here. On linux the effect dilutes into "an odd pick" among 131
      role-matching packets.

      Full write-up:
      plan/issues/selector-hands-out-dependency-blocked-work-2026-08-10.md
    exit_criteria:
      - >
        The candidate pool is intersected with `next <role>`'s eligible set, or
        `query` gains the same deps-clear/unleased constraints and the selector
        passes them. Scoring, entropy and budget logic are unaffected.
      - >
        A litmus asserts, two-sided, that no packet in a batch has an unmet
        depends_on, and that a packet under a live lease held by another host
        never appears.
    verifiable_closure: >
      For every role, every packet in a produced batch also appears in
      `tillandsias-plan next <role>`'s eligible set.
    notes: >
      Assigned to linux because that lane is actively editing this script — it
      changed four times in six hours (--claimable-by, release scoping, entropy
      floor, order-645 urgent override). Landing a pool change from Windows in
      the same window invites a merge conflict or a double fix.
    events:
      - ts: "2026-08-10T11:55:00Z"
        event: filed
        summary: >
          Found by the windows lane claiming 248 from its own batch and
          discovering it was blocked on three packets in the same batch.

