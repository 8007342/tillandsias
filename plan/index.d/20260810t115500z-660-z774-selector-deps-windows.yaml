      summary: >
        PARTIAL — the "no flashing consoles" half now has structural evidence, so
        the human ask narrows from two questions to one.

        The published tillandsias-tray.exe alias is PE32+ with
        subsystem=2 (IMAGE_SUBSYSTEM_WINDOWS_GUI). Windows allocates no console
        for a subsystem-2 process, so the classic startup flash is structurally
        impossible for the tray itself; a console-subsystem binary (3,
        WINDOWS_CUI) is what produces it.

        Background children are spawned hidden: tillandsias-vm-layer applies
        CREATE_NO_WINDOW (0x0800_0000) on Windows, wsl_lifecycle.rs:119 builds
        background wsl.exe commands with it, and transport_windows.rs:131 records
        the regression that motivated it ("without CREATE_NO_WINDOW each retry
        flashed a console", 2026-07-12). The two CREATE_NEW_CONSOLE sites
        (notify_icon.rs:3644, :3729) are the interactive PTY launches — Attach
        and GitHub Login — where a visible terminal IS the intent.

        What remains is the one question with no structural proxy: DOES THE TRAY
        ICON APPEAR? A GUI process can start cleanly and still fail to register a
        notification-area icon, so this cannot be inferred and still needs a
        human at the desktop. Evidence appended to
