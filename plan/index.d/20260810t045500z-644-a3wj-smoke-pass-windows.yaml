packets:

  - packet_id: diagnose-degraded-transient-after-provisioning
    order: 647-i98k
    status: ready
    desired_release: v0.5
    priority: p3
    title: "`--diagnose` reports DEGRADED (exit 2) for ~8s after provisioning, so a scripted post-install check reads a converging VM as broken"
    kind: enhancement
    deliverable: crates/tillandsias-windows-tray/src
    depends_on: []
    pickup_role: windows
    capability_tags: [windows, tray, diagnostics, automation, e2e]
    context: >
      Found during the 644-a3wj curl smoke. The first `--diagnose` after the
      installer returned reported:

        Control wire: unreachable (hvsocket AF_HYPERV connect to WSL VM
                      (vsock 42420) failed: WSA_ERROR(10060))
        Status: DEGRADED (exit 2)

      The log explains it exactly: the check landed between
      `04:32:12 provisioning phase "Connecting…"` and
      `04:32:20 VM ready — control wire established` — an 8 second window. A
      re-run reported HEALTHY (exit 0).

      NOT a product defect. The tray was still converging and reported that
      accurately. The problem is that a converging state and a broken state share
      an exit code, so any scripted post-install check that runs --diagnose once
      and branches on the code will intermittently declare a healthy install
      broken. This smoke walked straight into it on the first try.

      Same shape as the counterfeit-completion defects this lane fixed in
      select-work-batch.sh (632-retq, 643-bnag): a transient or environmental
      condition wearing the exit code of a terminal verdict.
    exit_criteria:
      - >
        Either --diagnose waits briefly (bounded, a few seconds) for a control
        wire that is actively converging, or the converging state gets its own
        exit code distinct from a genuine failure.
      - >
        Whichever is chosen, the difference between "not ready yet" and "broken"
        is visible in the exit code, not only in the prose.
    verifiable_closure: >
      Running --diagnose immediately after a fresh provision does not report a
      terminal failure exit code while the log still shows the control wire
      converging.
    notes: >
      Low priority: the human-facing output is honest and a re-run is correct.
      This is about automation consuming the exit code.
    events:
      - ts: "2026-08-10T04:55:00Z"
        event: filed
        summary: Found during the 644-a3wj Windows curl smoke of v0.4.260810.1.

