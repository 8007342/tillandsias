  - packet_id: a-device-preset-window-hides-the-browser-chrome-so-the-viewport-is-the-device
    event:
      type: note
      ts: "2026-10-15T01:17:57Z"
      host: macuahuitl
      summary: |-
        Field detail (github.com/8007342/lakanoa commit e613839 (FORGE_DIAGNOSTICS.md, session 2026-10-15 on yoga), finding 10, iPhone SE 375x667 in Chromium). The window showed tabs, the address bar and launch-flag warning bars, so the content did not fit at the device aspect until the user stretched it. Chromium also enforces a minimum window width of about 500 px, so the window came out about 160% of the device width. Proposed launch: --app=<url> (no tabs or address bar), no warning-bar flags (else --test-type), --no-first-run --no-default-browser-check. Set the device size by CDP Emulation.setDeviceMetricsOverride inside a window at least as large as the minimum, with the page drawn at device size and empty margins, not by sizing the OS window to the device. Open the window without stealing focus. Device emulation itself worked (touch seen).
