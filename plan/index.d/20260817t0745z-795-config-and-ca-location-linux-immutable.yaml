# Filed by linux_immutable (yoga), 2026-08-17, from an operator-directed audit
# of this host's own recent work. The operator's framing: "chances are you need
# to remove things instead, and let frameworks do their thing instead of fixing
# the edge case that should have been a config."
packets:
  - packet_id: untrack-machine-local-claude-settings
    order: 795-x7ux
    status: ready
    desired_release: v0.5
    priority: p2
    kind: decision
    title: ".claude/settings.local.json is tracked; every host commits its own machine state into the file the framework named .local"
    deliverable: "a fleet decision, verified by each host kind, on untracking .claude/settings.local.json now that the shared keys live in .claude/settings.json"
    pickup_role: any
    capability_tags: [config, fleet, tooling]
    estimated_hours: 1
    context: |
      STATE AFTER THIS CYCLE. The genuinely shared keys were split out into a
      tracked `.claude/settings.json`: the five loopback TILLANDSIAS_*
      inference/embed endpoints, and enabledMcpjsonServers
      [forge-plan, project-info]. Those are fleet conventions and are
      host-independent. Nothing about the expert system depends on the
      machine-local file any more, which was the blocking objection.

      WHAT REMAINS TRACKED AND SHOULD NOT BE. `.claude/settings.local.json`
      carries a 58-entry permissions.allow accumulated from every machine in
      the fleet, including four Git-Bash entries naming one person's home
      (/c/Users/bullo/...). It is harness-generated — commit 66ec85e7f is
      literally "sync harness-generated settings (enabledMcpjsonServers + key
      order)" — so each host's agent rewrites it and the repo commits that
      machine's state back for everyone else to inherit.

      WHY THIS IS A DECISION AND NOT A UNILATERAL FIX. `git rm --cached`
      deletes the working copy on every host that pulls it. Those hosts run
      unattended hourly cycles; losing their allowlist mid-night could turn a
      drain into a permission prompt nobody is awake to answer. The Windows
      host set the precedent this cycle with 793-rb9u, filing a shared
      agent-config change as a decision gated on per-host-kind verified-by
      events rather than changing it unilaterally. Same class, same gate.

      ALREADY VERIFIED HERE (linux-immutable, Fedora Silverblue, yoga):
      experts stay healthy with the shared keys in .claude/settings.json;
      `command -v bash` is /usr/bin/bash with no second runtime.

      WHAT WAS DELETED RATHER THAN REPAIRED. 789-nc2s answered this class with
      scripts/check-tracked-config-host-paths.sh, a guard that scanned tracked
      agent config for one-machine paths. It has been removed. It reported
      `ok:tracked-config-host-paths:1 scanned` while /c/Users/bullo/... sat in
      the exact file that motivated it, because its severity split refused only
      the env block and excused the permissions allowlist. The guard was
      narrowed until the offending tree passed. A .gitignore line makes the
      defect unrepresentable instead; the `.local` in the filename is the
      framework already saying so.

      DELIBERATELY NOT DONE YET: adding the .gitignore entry. An ignore rule
      for a still-tracked file is inert and reads as intent nobody can date —
      which is the ambiguity the 2026-08-16 cheatsheet-ignore audit spent a
      cycle undoing. The rule lands with the untracking, in one commit, or not
      at all.

  - packet_id: proxy-ca-dir-lives-in-world-traversable-tmp
    order: 795-e5c7
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "the proxy CA directory is /tmp/tillandsias-ca, so its permissions must be repaired after the fact instead of never being wrong"
    deliverable: "CA material is created in a directory that is private by construction (XDG_RUNTIME_DIR, or DirBuilder::mode(0o700) before any key is written), and scripts/clamp-ca-material.sh gains a retirement condition or is deleted"
    pickup_role: linux
    capability_tags: [rust, security, podman]
    estimated_hours: 3
    context: |
      ROOT CAUSE, not the symptom: crates/tillandsias-headless/src/main.rs
      defines CA_DIR as "/tmp/tillandsias-ca" — world-traversable. The key is
      written by an `openssl req` subprocess at the ambient umask and chmod'd
      AFTERWARDS, so there is a real if narrow exposure window even on a fully
      patched binary.

      THREE FIXES SO FAR, ALL DOWNSTREAM OF THAT ONE CONSTANT: 755-qcxh moved
      delivery to a podman secret and chmod 600'd the file; 772-shi9 stopped
      the macOS tray re-widening it; 791-swxt added a checkout-side migration
      (scripts/clamp-ca-material.sh) wired into every cycle-preflight, because
      the heal in 755-qcxh lives in the binary and hosts run older releases.
      Each was correct about the host in front of it and none addressed the
      location.

      THE FRAMEWORK ANSWERS ARE ALREADY IN THIS REPO. $XDG_RUNTIME_DIR is
      systemd-created 0700 per user and is already used for the control socket
      (control-wire/src/transport.rs) and the config overlay
      (core/src/container_profile.rs). std::fs::DirBuilder::mode(0o700) makes
      the directory private before anything is written into it, which removes
      the chmod-after window entirely. Delivery to the proxy already goes
      through PROXY_CA_KEY_SECRET / ensure_proxy_ca_key_secret, so the
      host-side file may be a leftover worth deleting rather than relocating —
      check that first.

      AND RETIRE THE MIGRATION. clamp-ca-material.sh currently runs on every
      cycle on every host, forever, with no condition under which it stops. A
      one-shot repair for already-exposed hosts is justified; a permanent
      preflight step for a defect that can no longer occur is the workaround
      outliving its cause. Give it a version floor or delete it once the
      location is fixed and the fleet has installed a release carrying it.
