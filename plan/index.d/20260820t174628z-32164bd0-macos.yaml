        THIRD AND FOURTH MEASUREMENTS, 2026-08-20, both UNCONTENDED — I waited on the gate instead of backgrounding it, which is what this packet asked for.    gate after Rust source edits, uncontended    994s   (966s in clippy)   gate after Rust source edits, uncontended    938s   (903s in clippy)   gate on a PLAN-ONLY commit, warm artifacts    30s  So the picture resolves, and it is neither of the two stories filed so far:    * 835-kjuv said ~1050s was a cold `cargo run` debug build. Wrong — that     number came from a contended gate, and this packet corrected it.   * The correction could be read as "it is all contention". Also wrong. Two     uncontended runs agree at ~950-990s, with 90%+ of it in ONE step: clippy.  THE REAL COST MODEL is that `--check` is dominated by clippy RECOMPILATION, which is triggered by Rust source changes or cache eviction — not by a fixed per-gate cost. A cycle that touches only plan/*.yaml pays 30 seconds. A cycle that touches Rust pays ~16 minutes, essentially all of it clippy, and no amount of not-backgrounding changes that.  WHAT THIS MEANS FOR THE TWO OPEN PACKETS:   * 835-kjuv's `cargo run` -> probe-resolved-binary change is still worth doing     for CONSISTENCY with 721-nyev, but it should be re-scoped as a correctness     /consistency fix. Its performance rationale is gone: swapping that one step     cannot move a number that lives in clippy.   * This packet's tooling ask stands and is now better specified. Recording     CPU-vs-wall per phase would have separated all three of these readings on     the first run, without anyone having to reason about what else was running.  OPERATIONAL NOTE, measured rather than assumed: the "gate is expensive" instinct that shaped several decisions this week (batching commits, hesitating to push a claim before the work) is only true for Rust-touching cycles. Plan-only pushes are cheap, and a claim commit is plan-only by construction — so claims SHOULD be pushed before the work, always. The one cycle where I skipped that ordering did so on a cost that did not apply.
