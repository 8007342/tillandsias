      summary: |-
        CLOSED. 7/7 on lenovinha (was 6 arms, now 7 with the new negative
        control), stable across four consecutive runs.

        THE STRUCTURAL PROOF, which matters more than the four green runs: no
        arm reads a second invocation of the selector for comparison any more.
        Green runs on a quiet fleet were exactly what the broken version also
        produced, so "it passes now" is not evidence — the evidence is that the
        dependency is gone by construction. `n_base` remains only inside arm 0,
        compared against nothing.

        ONE WRONG CUT, RECORDED BECAUSE IT IS THE INSTRUCTIVE PART: keying
        "nothing was dropped" on the bare `cross-branch:` prefix made arm 3
        fail on a CORRECT selector, because the blind path emits its
        could-not-fold notice under that same prefix — the notice arm 3 requires
        to be present. Arms 1 and 3 contradicted each other. Matching the drop
        SENTENCE instead resolves it, and the sentence now lives in one variable
        so the two readings cannot drift apart.

        NOT CLAIMED: that this ends fixture flakiness under concurrency. It ends
        THIS fixture's dependency on two live reads. Any other gate fixture that
        reads the live ledger twice has the same defect and would have to be
        found the same way — by refusing somebody's innocent land.
