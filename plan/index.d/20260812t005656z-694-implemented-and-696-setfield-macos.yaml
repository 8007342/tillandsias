packets:

  - packet_id: setfield-evidence-emits-completed-event-for-any-status
    order: 696-6byc
    status: ready
    desired_release: v0.5
    priority: p1
    title: "`set-field --evidence` stamps a terminal completion event whatever status it writes, so every non-terminal ladder rung self-contradicts and fails the gate"
    kind: bug
    deliverable: the emitted event type follows the status being written, with a check that non-terminal rungs never emit a terminal event
    depends_on: []
    pickup_role: any
    capability_tags: [plan-tooling, ledger, ladder, fail-loud]
    estimated_hours: 2
    context: >
      Hit live on macOS 2026-08-12, the first cycle to use the 650-dq6u ladder's
      non-terminal rungs.
      `tillandsias-plan set-field <id> status implemented --evidence "..."`
      correctly wrote the LWW entry `field: status, value: implemented`, and then
      emitted the accompanying event HARDCODED to the terminal completion type, with
      a summary beginning "status 'implemented' with evidence_refs:". The fragment
      therefore claims completion in the event stream while the status channel
      says implemented.
      `scripts/check-fragment-status-loss.sh` caught it — SECOND CLASS, "a
      terminal EVENT with no matching status transition" — and failed
      `./build.sh --check`, so the ledger was protected. But the failure surfaces
      as a gate refusal AFTER the write and AFTER a commit, and its remedy text
      ("write a NEW fragment with a status: entry") describes the OTHER violation
      class, so it points the reader at a fix that does not apply here. The
      author must instead retract their own just-written fragment — an
      awkward exception to fragment immutability that the write path should never
      have forced.
      This is new-today breakage, not latent: before 650-dq6u every status worth
      attaching evidence to WAS terminal, so a hardcoded `completed` was
      harmless. The ladder added the implemented rung (and re-typed verified/done
      relationships) without updating the evidence write path, so the first host
      to record an honest non-terminal rung trips it. Every host will.
    outcome: >
      Recording a non-terminal rung with evidence produces a consistent fragment
      on the first try.
    exit_criteria:
      - "the event type emitted by set-field --evidence is derived from the status value being written; a terminal status keeps its terminal event, non-terminal rungs emit a non-terminal event type"
      - "the summary prefix stops asserting completion for non-terminal rungs"
      - "a test writes each ladder rung with --evidence and asserts check-fragment-status-loss.sh passes for every one; a NEGATIVE CONTROL asserts a genuinely terminal status still emits a terminal event, so the fix cannot degrade into never emitting completions"
      - "check-fragment-status-loss.sh's remedy text distinguishes the two violation classes, so the second class does not print a remedy that only fixes the first"
      - "check-fragment-status-loss.sh reads the fragment as YAML rather than grepping raw text for the terminal-event marker: while filing THIS packet the checker flagged it twice purely because its prose quoted the marker it searches for, so any packet that documents this defect is unfileable until reworded — a checker that cannot tell data from a description of data. A negative control must assert a packet whose free text contains the literal marker, but whose events are non-terminal, passes."
    events:
