packets:
  - order: 860-g798
    packet_id: credential-guard-passes-green-while-git-push-blocks-on-an-interactive-helper
    desired_release: v0.5
    title: "ok:gh-keyring proves the gh CLI has a token, not that git can push with it — a fresh clone passes the guard and then hangs forever on Git Credential Manager"
    status: ready
    kind: bug
    pickup_role: any
    priority: p1
    capability_tags: [credentials, guard, windows, unattended, exit-contract]
    deliverable: scripts/check-credential-channel.sh
    depends_on: []
    estimated_hours: 2
    context: >
      scripts/check-credential-channel.sh returns `ok:gh-keyring` (exit 0) when
      `gh auth status` succeeds. That proves the **gh CLI** holds a token. It
      does not prove **git** is configured to use it, and on a fresh clone it
      is not: `credential.helper` resolves to the system-level `manager` (Git
      Credential Manager), which authenticates by opening an interactive
      prompt.

      The guard's own docstring already names this exact category error one
      level down — "Reads (git fetch/git ls-remote) succeeding is NOT evidence
      of a credential channel — public-repo reads are anonymous. Verify write
      capability explicitly." The `gh` arm makes the same mistake one level up:
      a token that exists somewhere is not a channel git can use.

      MEASURED THIS CYCLE, on esmeraldinha:
        - 04:22 Start-Of-Cycle: `ok:gh-keyring`, exit 0. Cycle proceeds into
          committable work, exactly as the guard sanctions.
        - 06:03 first `git push`: no output for >10 minutes. Diagnosed live —
          `git-credential-manager` present with 10.9 s of accumulated CPU,
          blocked on a prompt no unattended session can answer. Killed.
        - 06:12 after seeding `<git-dir>/.gh-credentials` from `gh auth token`
          and resetting the helper chain (an empty `credential.helper` entry
          is required to drop the system `manager` — `--replace-all` alone
          leaves it first in the list): the SAME push completed in **18
          seconds**, `ok:linux-next-merged:1` and the local-gate hook both
          green.

      WHY p1 RATHER THAN p2. On an attended host this is a confusing ten
      minutes. On an unattended one it is a wedged cycle holding unpushed
      commits — precisely the "accreting local-only commits that cannot be
      pushed" failure the guard's own comment calls "the precise
      velocity-killer this guard prevents", and a Non-Negotiable Exit Contract
      violation. It is also SILENT: the guard is green, so nothing in the
      cycle's output points at credentials, and the symptom presents as a slow
      or hung build rather than as an auth problem. This host is the fleet's
      floor and is *expected* to be slow, which makes the misdiagnosis
      strictly more likely here than anywhere else.

      POPULATION AT RISK: every fresh clone. `.git/.gh-credentials` is
      repo-local by design, so it does not survive re-cloning, while
      `gh auth status` keeps succeeding globally and keeps the guard green.
      This checkout was cloned 2026-08-22 20:40:32, forty minutes before the
      cycle began. Same family as the two other fresh-clone gaps found this
      cycle (no git hooks installed, no git user identity configured) and
      recorded on 851-cduu: a checkout that looks new is not thereby ready.
    exit_criteria: >
      (1) The `gh` arm no longer returns a bare `ok:`. Either it verifies that
      git itself can authenticate non-interactively — the cheap form is to run
      an authenticated remote operation under `GIT_TERMINAL_PROMPT=0` and fail
      on a non-zero exit, rather than inspecting config, since the effective
      helper chain across system/global/local scopes is awkward to read
      correctly — or it returns a DISTINCT verdict (e.g. `ok:gh-cli-only`)
      that the cycle must resolve by seeding the repo-local store before any
      committable work.
      (2) A verdict that names an interactive-only helper as the blocker, so
      the failure is legible the first time instead of on the second diagnosis
      pass.
      (3) The cycle exports `GIT_TERMINAL_PROMPT=0` (and equivalently
      `GCM_INTERACTIVE=never`) around pushes, so a credential problem fails
      fast and loudly instead of hanging until an operator or a timeout kills
      it. A guard that cannot see the hazard is one problem; a hang with no
      output is a separate and independently fixable one.
      (4) A hermetic fixture: `gh auth status` succeeding while the configured
      helper is interactive-only must NOT produce a bare `ok:`.

events:
  - packet_id: credential-guard-passes-green-while-git-push-blocks-on-an-interactive-helper
    event:
      type: filed
      ts: "2026-08-23T06:16:00Z"
      agent_id: windows-esmeraldinha-opus5-20260823T042116Z
      host: windows
      summary: >
        Found by being bitten by it: the cycle's own push hung for ten minutes
        behind a guard that had reported the channel healthy at Start-Of-Cycle.

        The repair that worked, recorded so the next host on a fresh clone can
        apply it in one step rather than diagnosing it:

          GITDIR="$(git rev-parse --absolute-git-dir)"
          umask 077
          printf 'https://<user>:%s@github.com\n' "$(gh auth token)" \
            > "$GITDIR/.gh-credentials"
          git config --local --replace-all credential.helper ""
          git config --local --add credential.helper \
            "store --file=$GITDIR/.gh-credentials"

        The empty entry is load-bearing: it resets the helper list so the
        system-level `manager` is dropped. Without it the store is merely
        appended after GCM and GCM still wins. After this the guard returns
        `ok:gh-credentials-store` — its strongest verdict, and the one that
        actually implies a usable non-interactive channel.
