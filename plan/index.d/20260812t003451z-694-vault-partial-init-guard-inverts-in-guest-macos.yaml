packets:

  - packet_id: vault-partial-init-guard-inverts-inside-the-guest
    order: 694-mhz8
    status: ready
    desired_release: v0.5
    priority: p0
    title: "The guard written to STOP Vault wipes destroys the vault on every bootstrap: it looks for the Shamir share in a HOST keychain while running inside the guest"
    kind: bug
    deliverable: a partial-init predicate evaluated where the share actually lives, plus a litmus that a stored secret survives a VM restart
    depends_on: []
    pickup_role: any
    capability_tags: [vault, credentials, guest, security, p0, fleet-wide]
    estimated_hours: 6
    context: >
      THE OBSERVATION THAT STARTED IT: `tillandsias-tray --github-login`
      completed successfully on macOS 2026-08-11 — all prompts answered, gh
      authenticated as 8007342, exit_code 0, and the guest's OWN in-container
      vault write verification passed. On the very next VM boot,
      `secret/data/github/token` is 404 again. The credential is written,
      verified, and then destroyed.
      THE MECHANISM (crates/tillandsias-headless/src/vault_bootstrap.rs:2015):
        let is_partial_init = vault_data_volume_exists()
                              && !has_shamir_share_in_keyring();
        if is_partial_init { remove_dir_all(<cache>/vault-data) }
      - `vault_data_volume_exists()` (:1119-1124) is just
        `$HOME/.cache/tillandsias/vault-data` exists — true on every boot after
        the first.
      - `has_shamir_share_in_keyring()` (:1132) checks, in order, an OS KEYCHAIN
        entry (`Entry::new(KEYCHAIN_SERVICE, VAULT_SHAMIR_SHARE_V1)`) and then a
        fallback FILE. This code runs INSIDE THE LINUX GUEST, where there is no
        host keychain, and the fallback file does not exist — probed live
        2026-08-12: `/root/.cache/tillandsias/secrets/` contains only `git/`
        (dated Jul 27); the only shamir artifact anywhere under /root is
        `vault-data/core/_shamir-kek`, which is Vault's OWN internal file, not
        the captured share this predicate wants.
      - Therefore `has_shamir_share_in_keyring()` can only ever return FALSE in
        the guest, so `is_partial_init` is TRUE whenever the volume exists, and
        the "safe recovery" branch wipes a perfectly good initialized Vault —
        along with the GitHub token and every other stored secret — on every
        bootstrap that reaches this path.
      THE IRONY, IN THE CODE'S OWN WORDS (:2010-2014): "Wiping it would destroy
      the stored GitHub token and all other secrets, forcing the operator to
      re-authenticate — which is exactly the bug this guard fixes." The guard
      was written to PREVENT this and, because its predicate is evaluated in the
      wrong place, performs it unconditionally instead.
      CORROBORATION: probed live, every entry under
      /root/.cache/tillandsias/vault-data (audit/, auth/, core/) carries the
      timestamp of the most recent bootstrap, not of the login that wrote the
      token minutes earlier — i.e. the store is re-created, not preserved. This
      also explains the standing ledger note that the vault github token has
      been ABSENT since the 2026-07-27 re-provision despite repeated attended
      and unattended re-auth attempts (349, 663-acdw): every one of them
      succeeded and was then erased.
      RULED OUT while diagnosing: guest clock skew (guest reads correct UTC;
      the "Exited 292 years ago" podman timestamp is a display artifact, not a
      live clock problem) and the `#[cfg(not(feature = "vault"))]` stub of the
      same function at :1162 (the real implementation is the one compiled).
      NOT YET DETERMINED, for whoever claims this: WHERE the Shamir share is
      supposed to live for a guest-side caller. If the host tray captures it
      into the macOS keychain, the guest cannot see it and the predicate needs
      to move host-side or be delivered over the control wire; if the guest is
      meant to hold it in the fallback file, then the capture path that should
      write that file is also broken and is a second defect. Establish which
      before changing the branch — do NOT simply invert the condition, or a
      genuine partial-init will be preserved and Vault will fail to unseal.
    outcome: >
      A secret stored in the guest Vault survives VM restarts, and the
      partial-init recovery still triggers on a genuine crashed init.
    exit_criteria:
      - "the partial-init predicate is evaluated against the location where the Shamir share is actually captured, established by reading the capture path rather than assumed"
      - "a stored secret written in one VM session is readable in the next — proven by a litmus that writes, stops the VM, boots, and reads back"
      - "a NEGATIVE CONTROL proves the recovery still fires: simulate a genuine partial init (data volume present, share genuinely absent from the real location) and assert the wipe still happens"
      - "349's closing evidence pass is re-run once this lands; the credential half of that packet has never actually been testable"
