  title: The preflight-front-door fixture reports a stale plan binary as could-not-run, not as ten behaviour failures
  context: 'litmus:preflight-front-door went 10/20 on clean trunk on lenovinha. The cause was host-local: ~/.local/bin/tillandsias-plan was from 2026-10-27, so every arm that runs ./build.sh --preflight got refused:preflight:stale-plan-binary before any guard ran (No guard was run. A stale binary says nothing about the tree), and the fixture scored each as a broken door: a newly wired guard was invisible, no why/remedy, no wall clock, and so on. With a current binary the same trunk is 20/20. A red that names the door when the binary is at fault reads as a trunk regression and evicts PRs. Fix: the fixture asks the binary the door asks (validator-surface-hash --check through resolve_plan_binary) once, before the arms, and on stale:validator-surface prints one could-not-run line with the remedy and exits 2.'
  exit_criteria:
  - 'With a stale binary resolved, the fixture prints could-not-run:preflight-front-door:stale-plan-binary and exits 2, running no arm; with a current one it is 20/20 as before.'
  verifiable_closure: 'litmus:preflight-front-door'
