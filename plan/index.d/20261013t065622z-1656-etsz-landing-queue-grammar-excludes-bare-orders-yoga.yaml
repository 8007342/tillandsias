    next_action: >
      Coordinator picks the branch of criterion 1. If the grammar widens, land the regex change in scripts/land-queue.sh and methodology in one PR with the fixture arm; if it does not, write the legacy path into the queue's skip comment and join-the-fleet section 3. Until then a worker holding a bare-order row lands it by a direct gated land from its own checkout (what yoga did 2026-10-13), never by inventing a suffix.
