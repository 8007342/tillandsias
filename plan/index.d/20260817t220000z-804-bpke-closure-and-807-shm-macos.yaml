packets:
  - packet_id: fleet-bench-corpus-path-is-linux-only-so-macos-has-no-matrix-row
    order: 807-bjjv
    status: ready
    desired_release: v0.5
    priority: p1
    kind: fix
    title: "the shared accel benchmark defaults its corpus to /dev/shm, which does not exist on macOS — so the one host class the matrix most needs cannot produce a row"
    deliverable: "a portable default state/corpus dir (tmpfs where it exists, ${TMPDIR:-/tmp} otherwise) in spec-index-ensure.sh and bench-accel-lane.sh, so a macOS host can build the corpus and run the shared workload with no per-host env fiddling"
    depends_on: [npu-lane-has-no-engine-so-the-tier-can-never-be-chosen]
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags: [portability, macos, inference, benchmarking, fleet]
    estimated_hours: 2
    context: |
      MEASURED on macOS 2026-08-17, the same day scripts/bench-accel-lane.sh
      landed (order 802-2536).

        $ ls -d /dev/shm
        ls: /dev/shm: No such file or directory

        $ scripts/bench-accel-lane.sh --lane cpu
        bench-accel-lane: no chunk corpus at
        /dev/shm/tillandsias-experts/spec-index/chunks.jsonl
        (build it with scripts/spec-index-ensure.sh)          [exit 2]

      Two hardcoded Linux-only defaults, neither with a fallback:
        scripts/bench-accel-lane.sh:53
          CHUNKS="${TILLANDSIAS_BENCH_CHUNKS:-/dev/shm/tillandsias-experts/spec-index/chunks.jsonl}"
        scripts/spec-index-ensure.sh:47
          FORGE_EXPERTS_STATE_DIR="${FORGE_EXPERTS_STATE_DIR:-/dev/shm/tillandsias-experts}"

      /dev/shm is a Linux tmpfs convention. macOS has no such path and never
      has. So the corpus cannot be BUILT and the benchmark cannot be RUN on a
      Mac with a default environment.

      WHY THIS IS p1 RATHER THAN A PAPER CUT. bench-accel-lane.sh exists
      precisely to make the fleet matrix comparable — its own header says so:
      "a per-host benchmark with per-host methodology is three anecdotes. The
      numbers only mean anything as a matrix, so the workload, the warm-up, the
      sample and the reported statistic have to be identical on every host.
      That is a script, not a paragraph in a packet." A shared harness that
      silently excludes a platform produces a matrix with a hole in it, and the
      hole is in the row the fleet has the least data about — the operator's
      standing brief for this lane is that there is NO HIGH/MID/LOW matrix to
      route against, and macOS is the unmeasured corner. The unified-memory
      Apple-silicon class is also the one where 793-qr4t's prefill/decode
      crossover argument is least transferable from x86 measurements, so
      substituting a Linux number for it is not conservative, it is wrong.

      BOTH VALUES ARE ENV-OVERRIDABLE, so this is a DEFAULT problem, not a hard
      block — a macOS host can export its way past it. That is the reason it
      will not self-correct: it fails as a missing corpus, which reads as "you
      forgot to build the index", not as "this platform is unsupported". The
      first macOS host to try will conclude it did something wrong.

      THE PORTABLE IDIOM IS ALREADY IN BOTH FILES, ONE LINE AWAY — each uses
      mktemp -d "${TMPDIR:-/tmp}/..." for its scratch directory
      (bench-accel-lane.sh:82, spec-index-ensure.sh:106). The state/corpus dir
      simply did not get the same treatment.

      KEEP THE TMPFS INTENT: /dev/shm was chosen so the index lives in RAM. A
      fix should prefer a real tmpfs where one exists and fall back to
      ${TMPDIR:-/tmp} otherwise, rather than moving every host to disk. On
      macOS $TMPDIR is per-user and already the right home.

      RELATED, NOT DUPLICATED: the separate FORGE_SPEC_INDEX_DIR session-env
      leak (a stale /mnt/c WSL2 path exported into this macOS session) is
      already recorded and is NOT this packet — that guard fired correctly. See
      the note event filed alongside this packet.
