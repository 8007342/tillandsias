    event:
      type: completed
      ts: "2026-08-17T22:00:00Z"
      agent_id: macos-opus5-metal-20260817T210000Z
      host: macos
      summary: >
        FIXED AND PINNED. ROOT CAUSE, which the original filing had not yet
        isolated: on LINUX uninstall.sh's six directories are six distinct XDG
        paths and DATA_DIR really is bundled data (flake, scripts, images) —
        cheap to reinstall, correct to remove unconditionally. On macOS THREE
        COLLAPSE ONTO ONE PATH: LIB_DIR is a subdirectory of DATA_DIR,
        CONFIG_DIR is byte-identical to it, and that same directory is vz.rs's
        image_root holding rootfs.img. So one line, written for the Linux
        meaning, deleted the whole VM — and `rm -rf "$CONFIG_DIR"` two lines
        later was the SAME command a second time. FIX: the macOS non---wipe
        path now preserves DATA_DIR (and therefore the VM and settings);
        --wipe removes it. Linux is untouched. Every user-facing string was
        wrong in the same direction and all three were corrected: the preamble
        no longer lists the VM dir as "will be removed" on a run that preserves
        it (it is the ONLY notice — there is no confirmation prompt), the
        completion report names what the run actually did, and the closing line
        now reads "VM image, settings and cache preserved" on macOS instead of
        the old "Cache preserved" that had just deleted 11.83 GiB while naming
        an 8 KB directory. PINNED, not merely fixed: scripts/
        test-uninstall-preserves-vm.sh runs the REAL script against a sandboxed
        $HOME (6/6) and litmus:uninstall-preserves-vm-image is bound under
        spec:app-lifecycle (5 steps, PASS, 0 FAIL). Two seams were added for
        the fixture and default to the shipped values, because this script
        removes paths OUTSIDE $HOME (/usr/local/bin) and branches on uname — a
        test that could not redirect both would have to skip the macOS arm or
        delete a real installed binary to run. THE FIXTURE IS FALSIFIABLE, spot
        checked rather than assumed: reverting the guard turns it red on
        exactly macos-default-preserves-the-vm-image and green again on
        restore. It also carries a NEGATIVE CONTROL — Linux must still remove
        DATA_DIR — because a "fix" that preserved it on BOTH platforms would
        pass every other assertion while silently breaking the Linux uninstall.
      evidence_refs:
        - "scripts/uninstall.sh — macOS non---wipe preserves DATA_DIR; all three messages corrected"
        - "scripts/test-uninstall-preserves-vm.sh — 6/6, real script against a sandboxed HOME"
        - "openspec/litmus-tests/litmus-uninstall-preserves-vm-image.yaml — 5 steps, PASS 0 FAIL"
        - "openspec/litmus-bindings.yaml — bound under spec:app-lifecycle"
        - "falsifiability: guard reverted -> red on macos-default-preserves-the-vm-image; restored -> green"

