    depends_on: []
    estimated_hours: 5
    discovered_by: "operator smoketest 2026-08-24: three agents launched concurrently on yoga, unmonitored, picking random packets"
    context: >
      OPERATOR DESIGN, 2026-08-24, from a live smoketest at an AI gathering. The
      thing being tested was CONCURRENT LAUNCH — opencode, codex and antigravity
      started at the same time on yoga Silverblue against a locally installed
      build. That part worked: all three came up and ran for hours on slow wifi
      without crashing.

      BUT THE ONLY MODE THEY HAD WAS WORK DRAIN. Unmonitored, they "probably
      picked random packets", and whatever they did is lost. The operator's
      framing is the fix: such a run should "exercise the forge and run some
      form of orchestration in DIAGNOSTICS MODE rather than work drain".

      THE PRIMITIVE ALREADY EXISTS AND IS NOT REACHED. Smoke Mode is specified
      in the meta-orchestration skill — verify-only, no claims, no ledger
      writes, no releases, a few minutes of budget, and a machine-grepped
      `MO-SMOKE: PASS|FAIL` verdict. It is triggered by the word `smoke` in the
      invoking prompt. A human launching three agents by hand to see whether
      they start does not think to type it, and gets a full drain instead. The
      default is wrong for the commonest reason anyone launches several agents
      at once, which is to find out whether launching several agents at once
      works.

      WHAT MAKES THIS MORE THAN A DOCS FIX: the run that matters is
      MULTI-AGENT, and Smoke Mode is written for one agent. Three concurrent
      smokes need to not collide — on the smoke lock, on the forge, on the
      inference endpoint (849-tz8g residency is exactly this shape), and on the
      ledger. A diagnostics run that deadlocks three ways is not a diagnostic.

      PAIRS WITH THE CRASH THAT COST US ITS LOGS. The first antigravity session
      "ran for a few seconds before crashing" and no logs persist, so the one
      failure with real signal is unreproducible. The operator's proposed
      reproduction path is this packet's acceptance scenario: reintroduce daily
      builds, run smoke-e2e-curl installs, and have opencode/codex/antigravity
      each exercise the forge in diagnostics mode. A crash inside THAT lane
      leaves a log, because the lane owns the log.
    exit_criteria: >
      (1) A multi-agent diagnostics launch exists that CANNOT drain work: no
      claims, no packet selection, no ledger writes, terminating in the
      existing `MO-SMOKE:` grammar per agent.
      (2) Three agents launched concurrently on one host complete without
      colliding on the smoke lock, the forge, the inference endpoint, or the
      ledger — and the run reports which of those it actually exercised rather
      than asserting it.
      (3) The agent's FIRST SECONDS are logged to a durable path before any
      skill work begins. The failure that motivated this died in a few seconds
      and left nothing; a diagnostics lane whose own crash is undiagnosable is
      the defect it is meant to catch.
      (4) Wired to the daily-build / smoke-e2e-curl-install lane, so the check
      runs on a cadence rather than when someone remembers.
      (5) Reaching it must not require remembering a magic word. A launch that
      names several agents, or a launch flagged as a smoketest, defaults to
      diagnostics; work drain is the opt-in for that shape.

