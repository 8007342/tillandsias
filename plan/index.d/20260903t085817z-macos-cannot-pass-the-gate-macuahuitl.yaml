    title: |
      The credential-channel guard depends on timeout(1) and busctl(1), neither of which exists on macOS, so it returns a confident wrong verdict and the trunk gate refuses every macOS push.
    context: |
      FOUND by macneo-macos on a factory-fresh Mac, reproduced against PRISTINE
      origin/osx-next (486683e80) in a detached worktree containing none of
      their work. Capture at
      plan/issues/macos-cannot-pass-the-trunk-gate-2026-09-03.md.
      SYMPTOM: the fixture's accepted arm returns
      blocked:credential-unretrievable-no-keyring-service, the gate exits
      non-zero, and the pre-push hook - the trunk's only gate - refuses every
      macOS push that is not a NEW-issue plan-only commit.
      DIAGNOSIS, and it is more precise than the filing. macneo attributed it to
      the guard discriminating through a D-Bus secret-service VOCABULARY that
      macOS does not share. That is true of the busctl arm but is not the
      proximate cause. TWO MISSING TOOLS, in order:
        1. timeout(1) is GNU coreutils and does not exist on macOS. The
           discriminator ran `timeout 20 gh api user`, got 127, fell past the
           clean-401 case, and never returned `accepted` - even though the
           fixture's stub gh exits 0 for everything.
        2. It then reached `! busctl --user list`, and busctl is ALSO absent, so
           the negation was true and the guard answered "no secret-service on
           the bus" about a platform that has no such bus BY DESIGN.
      So a missing GNU binary produced a keyring-shaped diagnosis on a host with
      no keyring - which is 894-scxy's own misattribution failure, committed by
      the guard written to prevent it.
      LANDED WITH THIS PACKET, verified non-regressing on linux (fixture
      ok:credential-channel-fixture:all):
        - _ccc_timeout() prefers timeout(1), falls back to gtimeout(1) from
          Homebrew coreutils, and REFUSES with 127 when neither exists rather
          than running the probe unbounded - an unbounded probe is the 860-g798
          incident itself, a push that hung over ten minutes on an interactive
          prompt.
        - the busctl arm now reports `indeterminate` and says why when busctl is
          absent, instead of asserting a bus verdict.
      NOT VERIFIED ON macOS. This was written and tested on linux, where both
      tools exist, so the change is non-regressing here and UNPROVEN there -
      exactly the smaller-universe trap this fleet has hit five times today.
      macneo must confirm before this closes.
      FOURTH INSTANCE from one machine in one day of a tool answering about a
      smaller universe than the question assumed (987-p5x9 family one): the ps
      filter that could not match com.apple.Virtualization.VirtualMachine, the
      capability probe needing a binary the macOS release does not ship
      (979-xyub), this, and pkg-config without which the gate could not start.
      A FACTORY-FRESH HOST IS THE DETECTOR and no established host substitutes.
    exit_criteria:
      - macneo confirms ./build.sh --check passes on macOS against pristine origin, or reports what still fails
      - the guard never returns a credential-store verdict on a platform whose store it cannot inspect; indeterminate with a named reason is the floor
      - no probe runs unbounded as a consequence of this fix - verify the no-timeout path refuses rather than proceeding
      - the deeper question is answered or explicitly deferred with a reason: should this guard learn a Keychain branch, or is indeterminate the permanent correct answer on macOS
      - the gate's other phases are swept for the same two assumptions; timeout and busctl are unlikely to be the only GNU/systemd tools assumed present
