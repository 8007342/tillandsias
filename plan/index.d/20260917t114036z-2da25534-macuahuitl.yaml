        THE FIXTURE CARRIED THE LITERAL IT TESTS FOR AND ARM 1 CAUGHT IT. First run:
        arm 1 failed against a clean tree because the fixture's own probe string
        `order:1234-zzzz` was matched by the guard scanning scripts/. That is
        mention-versus-use inside the guard built to catch mention-versus-use, and
        "never sweep a literal your own command carries" written as a test. Fixed by
        splitting the literal (`"@tr""ace"`, `"1234-""zzzz"`) so the file cannot contain
        what it asserts about; the fixture now greps 0 occurrences of it. Arm 3 exists
        because of this — it re-runs after removing the probe and requires the tree to
        be clean again, so arm 2 is known to have measured the probe rather than a
        coincidence.
