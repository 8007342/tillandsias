      summary: >
        QUEUE ITEM 1 COMPLETE. The readiness check linux asked for is in: the guest now proves port 42420 ACCEPTS A CONNECTION, rather than trusting /dev/vsock or a unit's active state.  SHIPPED, both halves of the gap:   1. The binary REFUSES to run (exit 78) when --listen-vsock is passed to a build without the feature, so systemd reports FAILED rather than active (running). Landed last cycle.   2. headless-ready.sh + `ExecStartPost=/usr/local/lib/tillandsias/headless-ready.sh 42420` on the WSL unit. It connects to CID 1 (VMADDR_CID_LOCAL) port 42420 and retries for a bounded 15s, because ExecStartPost races a Type=exec ExecStart.  Restart bound added in the SAME change: StartLimitIntervalSec=120 / StartLimitBurst=3, in [Unit]. With Restart=on-failure a permanently-unbindable guest would otherwise restart every two seconds forever; now it fails loudly and stops. Those directives are [Unit] on modern systemd — under [Service], where they read more naturally, they are silently ignored, which would have been the same looks-configured-does-nothing shape this packet exists to remove. A test pins their position by index rather than by section split.  THE PROBE WAS WRONG TWICE, and only measurement caught it. This is the part worth reading:    * FIRST FORM, `socat -u /dev/null VSOCK-CONNECT:1:$PORT`, HANGS against a live listener — socat waits on the remote, so ExecStartPost would have blocked unit start indefinitely. Caught by running it: the test never returned and had to be killed.   * SECOND FORM returned exit 0 against BOTH a bound port and a dead one. With /dev/null first, socat reaches EOF and exits before the connection can fail. That is a readiness check that ALWAYS PASSES — strictly worse than the signal it replaces, and it would have shipped looking correct.   * THE DISCRIMINATING FORM puts the connect address FIRST: `socat -T1 VSOCK-CONNECT:1:$PORT /dev/null`. Measured in the live guest across a matrix of three candidate forms and two ports: exit 0 on bound 42420, exit 1 on unbound 42999, for all three. A test now pins the ordering, not just the presence of the address, because the presence was true of the broken form too.  Three of my measurements in this cycle were also void before I noticed: shell quoting through Git Bash into wsl.exe silently ate a loop variable, so a probe matrix "measured" an empty port twice and reported exit=0 for both. And /mnt/c is deliberately not automounted in the runtime distro (599-3b9h), so passing a script by path fails; piping over stdin is the way in.  VERIFIED: cargo test -p tillandsias-windows-tray --bins wsl_lifecycle -> 20 passed, 0 failed, including the new assertions that the unit calls the probe, that the script it names is actually installed, that the probe connects rather than stat-ing a device, that the failure names the false property, and that the start-limit directives sit in [Unit].  SCOPE, stated honestly: this lands on the WINDOWS provisioning path (wsl_lifecycle.rs), which is the one I can exercise. The Linux (vm-layer wsl.rs) and macOS (vz.rs) units carry the same ExecStartPre preflight and have the same blind spot. I have NOT edited them: the change is one line plus a script each, but I cannot run either unit, and this packet is about not trusting readiness signals nobody verified. Parity is worth a packet of its own rather than an unverified edit from here.
