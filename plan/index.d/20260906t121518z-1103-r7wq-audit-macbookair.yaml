packets:
  - packet_id: the-archiver-check-memo-cannot-hit-on-a-drain-gate-because-every-drain-writes-a-fragment-before-it-runs
    order: 1116-h99j
    status: ready
    kind: enhancement
    priority: p3
    desired_release: v0.5
    pickup_role: any
    capability_tags: [gate, performance, memoisation, plan-ledger]
    estimated_hours: 3
    owned_files:
      - scripts/archiver-check-memo.sh
    title: |
      The plan-archiver memo (911-m7js) hits 11.1% of the time where the terminology memo hits 98.0%, and the gap is structural: its digest covers plan/index.d/*.yaml, and a drain cycle writes a fragment BEFORE the gate that would consult it
    context: |
      MEASURED on tlatoanis-macbook-air 2026-09-06 from
      .cache/metrics/tillandsias-timing.jsonl, using the hit/miss records
      911-m7js and 1054-zvq4 already emit:

        memo                     hits  misses  hit_rate  avg_miss
        terminology  629-t6b       50       1     98.0%   30000 ms
        archiver     831-ezea       2      16     11.1%   66125 ms

      Both memos are correct. Neither is broken. The difference is WHAT THEY KEY
      ON relative to what a cycle touches: the terminology memo keys on
      locales/*.toml plus its checker, and a drain cycle touches none of those,
      so it hits nearly always. The archiver memo keys on the ledger, and the
      sanctioned cycle REQUIRES a fragment write — the claim before the work,
      then the evidence — before Finalization runs ./build.sh --check. So the
      one gate that every cycle runs is the one gate the archiver memo cannot
      hit, by construction.

      This is the same argument terminology-check-memo.sh makes in its own
      header against the whole-tree gate memo (765-tkq2): "that one keys on the
      whole tree, so it never hits during a drain — every cycle writes plan/."
      The archiver memo is narrower than the tree but still wider than the
      cycle's own writes, so it inherits a weaker form of the same problem.

      WHY THIS IS NOT "JUST MEMOISE HARDER", AND WHY IT IS p3. A miss is
      CORRECT: the check asks whether archiving completed packets preserves the
      ready set, a new fragment can add a ready row, so a changed ledger can
      genuinely change the verdict. Any narrowing needs a soundness argument
      that a particular class of fragment cannot affect the answer — and
      "cannot affect the ready set" is close to what the check itself computes,
      so the narrowing may cost what it saves. That is the actual question this
      packet is for, and the honest outcome may be that no sound narrowing
      exists, in which case say so and close it.

      CONFIRMED ON A SECOND HOST, and macuahuitl's cut is a better instrument
      than mine because it PREDICTS rather than describes. I said the averages
      are window artefacts that decay; they measured the decay directly, same
      host, same log, three windows:

        terminology   7d 19.9%   3d 46.4%   1d 100.0%   (67 hits, 0 misses)
        archiver      7d  1.5%   3d  3.9%   1d   8.6%

      A 7-day aggregate straddling the landing reads 19.9% where the last day
      reads 100%. Anyone reporting a memo's effectiveness from a window wider
      than the time since it landed is reporting the width of their window.

      The archiver number is the one that survives every cut and every host:
      11.1% here, 8.6% at one day there, 1.5% at seven. Low everywhere, which
      is why this packet is not a macOS artefact.

      A NEAR-MISS WORTH RECORDING, theirs: their first cut was the ALL-HISTORY
      rate (15.7% / 1.1%) and they nearly sent it as a CONTRADICTING locus
      before noticing the window was not mine. It would have read as a real
      cross-host disagreement and been nothing but an aggregation boundary.
      Same family as the field-name error above — a number that is honest about
      what it computed and silent about what it was asked.

      DO NOT re-derive the hit rate from `skippable:` or from step averages. The
      7-day window straddles the 09-02 and 09-05 memo landings, so those numbers
      mix pre-memo and post-memo runs and will decay on their own; the hit/miss
      records are the instrument.
    next_action: |
      Decide whether any sound narrowing of the archiver memo's key exists —
      e.g. whether a fragment that declares no new packet and changes no status
      can be excluded from the digest without weakening the verdict. Establish
      the answer before writing code. If no sound narrowing exists, THAT IS THE
      FINDING: record it and close, rather than trading a real check for a
      cheaper one. A second, cheaper option worth pricing first: the check
      itself costs 66 s average on a miss here — making the CHECK faster may
      beat making it skippable, and does not require any soundness argument.
    unscoreable: |
      No pin exists yet and one of the two valid outcomes never produces one.
      Outcome (a) — a narrowed digest — would create the fixture and convert
      this row. Outcome (b) is a recorded finding that no sound narrowing
      exists, which is a paragraph and not a test, and naming a litmus here
      would commit the packet to (a) before the soundness question is answered.
      That is the question the packet exists to ask, so it must not be
      pre-decided by its own obligation field. Whoever lands (a) writes the
      fixture and converts this; whoever establishes (b) closes it citing what
      was tried.
    verifiable_closure: |
      Either (a) a narrowed digest plus a fixture proving a fragment of the
      excluded class does not change the verdict — mutate such a fragment,
      assert the memo still hits AND the check's own negative control still
      reds; or (b) a recorded finding that no sound narrowing exists, citing
      what was tried. Measured hit rate BEFORE: 11.1% (2 hits / 16 misses,
      tlatoanis-macbook-air, 2026-09-06). Any claimed improvement must be
      stated as a hit rate from the same records, on at least two hosts.
