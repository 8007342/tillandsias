packets:
  - packet_id: tillandsias-trust-reports-trust-current-under-openssl-4
    order: 2074-mhtj
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [forge, tls, openssl]
    estimated_hours: 1
    owned_files:
      - images/default/cli/tillandsias-trust
    title: "tillandsias-trust never reports trust-current under OpenSSL 4.x: facts() takes the CA fingerprint in the same call as -ext basicConstraints, which OpenSSL 4 prints differently from the plain -fingerprint check() reads off the bundle"
    context: |
      MEASURED on yoga 2026-11-10: scripts/lua/test-tillandsias-trust.lua arm 1 CURRENT fails in all four passes of the 2031-4p5h run ("got: 0 ok:trust-refreshed:<serial>-><same serial>"), so a bundle that already trusts the mounted CA is needlessly re-composed. Cause, reproduced with one self-signed CA on host OpenSSL 4.1.0 and the builder toolbox's 4.0.3: `openssl x509 -noout -fingerprint -sha256` prints the DER sha256 (equals `openssl x509 -outform der | sha256sum`), but the same call with `-ext basicConstraints` added prints a DIFFERENT fingerprint. facts() uses the -ext form for the mounted CA and check() the plain form for the bundle's tail, so they never match. The forge image's Debian OpenSSL 3 is presumably unaffected today; the tool breaks the day the base moves to 4.x, and the fixture is red on any 4.x host now.
      Gate binding: litmus:forge-trust-refresh-cli (size small, phase pre-build). `./build.sh --check` does not run the litmus tiers, which is why lands stay green while the fixture is red on 4.x hosts.
    exit_criteria:
      - "test-tillandsias-trust.lua 7/7 on a host with OpenSSL 4.x, arm 1 reporting ok:trust-current. Pre-fix result: FAILS, 6 passed, arm 1 gets trust-refreshed A->A."
    verifiable_closure: "litmus:forge-trust-refresh-cli — tillandsias-plan script run scripts/lua/test-tillandsias-trust.lua reports ok:tillandsias-trust:7 arms on OpenSSL 4.x; pre-fix result: FAILS (6 passed, arm 1)."
    next_action: >
      yoga: fix is on work/2074-mhtj (facts() takes its fingerprint from a separate plain call); 7/7 with it, 6 passed without, on yoga's OpenSSL 4.1.0.
    provenance: |
      yoga 2031-4p5h fixture census at trunk e9841e243; openssl reproduction in the scratchpad 2026-11-10.
    events:
      - type: filed
        ts: "2026-11-10T08:30:00Z"
        host: yoga
        summary: "filed at the coordinator's direction; yoga takes it"
