  - packet_id: a-tree-sitter-bash-lint-for-the-four-measured-composition-hazards-vendored-so-it-travels-with-the-build-because-shellcheck-is-absent-on-this-host-and-inside-the-builder-toolbox
    order: 1252-r72q
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    pickup_role: any
    capability_tags: [rust, tree-sitter, static-analysis, guard, tests]
    estimated_hours: 8
    owned_files:
      - crates/tillandsias-litmus-rust
      - scripts
    title: |
      a tree-sitter-bash lint for the four MEASURED composition hazards — vendored so it travels with the build, because shellcheck is absent both on this host AND inside the builder toolbox
    context: |
      SHELLCHECK IS NOT AN OPTION HERE, AND THIS WAS CHECKED RATHER THAN
      ASSUMED. `command -v shellcheck` finds nothing on macuahuitl, and
      `toolbox run --container tillandsias-builder command -v shellcheck`
      finds nothing either. A shellcheck-based gate would pass where it happens
      to be installed and skip silently everywhere else — the green-on-one-
      regime shape that froze four lanes in one night. tree-sitter-bash vendors
      into a Rust crate, travels with the build, and needs nothing on the host.
      THIS IS NOT A NEW PARADIGM FOR THIS TREE, which is the main argument for
      it. crates/tillandsias-litmus-rust ALREADY depends on tree-sitter 0.25 and
      tree-sitter-rust 0.24, and already runs declarative `rust_queries:` out of
      litmus YAML with `processor: syn | tree_sitter`, `required:`, `usage:`,
      `score:` and `name_quality:`. Measured: of 427 litmus files, 1 carries
      rust_queries and 0 carry any bash equivalent. So the work is EXTENDING an
      existing declarative query layer to the bash surface, with a landing shape
      that already exists — not inventing one.
      THE FOUR SHAPES, all detectable on a bash AST, with file counts measured
      at 8dd482881 over 669 scripts (whole-file co-occurrence, an UPPER BOUND):
        195  a pipeline whose last command is `grep -q` in a file setting pipefail
         65  a pipeline ending in `tail -1`
         27  an `if` whose condition is a negated pipeline (795-imz3)
          7  a `pgrep`/`pkill` command with `-f` and a string literal argument
      AST GRANULARITY IS THE POINT AND IS WHY THE COUNTS ARE UPPER BOUNDS. The
      measurement above asks "does this FILE contain pipefail anywhere and a
      `grep -q` pipeline anywhere", which over-counts: the pipeline may run in a
      function where pipefail is not set. A parser can ask whether THIS pipeline
      is in scope of that option, which grep cannot. Reporting the true count is
      part of the deliverable — an upper bound is what we have today.
      ADVISORY BEFORE GATING, NOT AS CAUTION BUT BECAUSE OF THE ARITHMETIC: at
      up to 195 candidate sites, wiring this into ./build.sh --check on day one
      reds trunk for every host on a backlog nobody owns yet, and a guard that
      reds trunk gets disabled rather than obeyed. Same ordering 1251-54p3 is
      already following. Stage advisory, watch one in-situ run, then gate.
      RELATIONSHIP TO 1252-fg9e: independent and startable immediately. The
      executor makes NEW hazards unconstructible; this lint finds the EXISTING
      ones. Neither substitutes for the other, and this one delivers value
      without a single call site migrating.
    exit_criteria:
      - 'the lint reports the TRUE per-pipeline count for each of the four shapes, and states how it differs from the whole-file upper bounds recorded here (195/65/27/7) — a lint that merely reproduces the grep numbers has not used the parser it depends on'
      - 'run against check-seam-writers-canonical.sh at its pre-fix commit, the lint NAMES the `| grep -c` pipeline that inverted under pipefail (pre-fix result: the lint does not exist, and that defect was found by hand after it had shipped)'
      - 'NEGATIVE CONTROL: a file containing the word pipefail only inside a COMMENT, beside a `grep -q` pipeline, is NOT reported — comment-blind source scans are a repeat defect in this repo (881-29me, 885-92iu, and the comment arm of 1251-54p3)'
      - 'it runs in the ADVISORY tier and is promoted to ./build.sh --check only once the reported population is owned by a row, so it cannot red trunk on an unowned backlog'
      - 'the lint runs with nothing installed on the host beyond the built binary, proven by executing it inside the builder toolbox where shellcheck is absent'
    unscoreable: |
      whether-195-is-mostly-real-or-mostly-noise: the whole-file co-occurrence
      number cannot distinguish a genuine in-scope pipeline from a file that
      merely mentions pipefail elsewhere, and the true figure is unknown until
      the parser reports it. It could plausibly land anywhere from a handful to
      most of them. That uncertainty is the reason the first exit criterion asks
      for the true count rather than a remediation, and closing this row does
      not commit anyone to fixing whatever it finds.
    verifiable_closure: |
      a vendored tree-sitter-bash lint executing inside the builder toolbox with
      no host tooling, reporting per-pipeline counts for the four shapes beside
      the recorded upper bounds, naming the pre-fix check-seam-writers-canonical
      inversion, staying silent on a comment-only pipefail mention, and wired in
      the advisory tier.
