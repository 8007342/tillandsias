    owned_files:
      - scripts/run-litmus-test.sh
      - openspec/litmus-tests
    title: |
      replace the natural-language keyword interpreter that adjudicates litmus steps with a structured `assert:` — today rewording an English sentence silently changes the rule that decides the verdict
    context: |
      MEASURED ON macuahuitl AT 8dd482881 across all 427 litmus files, and the
      first cut of this measurement WAS WRONG in a way worth recording: an
      initial classifier reported 89.6% of steps as unenforced prose. It
      required values to contain no spaces, so it missed `ok: consumers-wired`
      — a perfectly enforceable literal. Corrected figures, of 2,541 steps
      carrying a `command:`:
        1,622  verdict-prefixed literal (ok:/PASS:/refused:/…)  ENFORCED
          580  other short literal (<=60 chars)                 ENFORCED
           85  success_pattern regex                            ENFORCED
          180  exit code only, no pattern declared              strict since 267
           64  expected_behavior CONTAINING THE WORD "succeeds" NOT ENFORCED
           10  long English sentence (>60 chars)                NOT ENFORCED
      So the prose-vs-enforceability gap is ~74 steps, NOT 2,276. The corpus
      self-selected toward verdict tokens because the fallback is strict
      (`grep -Fqi`, then return 1). Do not re-derive the larger number; it is
      wrong and this row exists partly so nobody has to rediscover that.
      THE MECHANISM IS THE FINDING, not the count. `behavior_matches_output` in
      scripts/run-litmus-test.sh is a NATURAL-LANGUAGE INTERPRETER WRITTEN IN
      BASH `case` ARMS. `*"multiple"*` and `*"several"*` mean "grep the first
      integer out of the output and require >= 2". `*"succeeds"*` means "ignore
      the output entirely, honour the exit code" — so 64 steps have a sentence
      whose content is decorative. `*"cargo"*` means "grep the output for
      cargo". Rewording a sentence changes the adjudication rule, with no diff
      anywhere saying the test now checks something else.
      IT HAS ALREADY DRAWN BLOOD: order 868-p8xi is the scar. An expectation
      written as an `(a|b)` alternation is searched for VERBATIM, so it can
      never match and the step fails on every one of its own legitimate
      outcomes — litmus:sidecar-arch-derivation printed exactly one of its three
      listed alternatives and still failed.
      FOUR OF THE TEN ENGLISH SENTENCES ASSERT TIMING ("~10 minutes", "slower
      than cached path"). Nothing can check those, and they should be deleted
      rather than translated — a timing claim belongs in a budget, not a
      predicate.
      MIGRATE THE 74 FIRST. They are the steps with no teeth today, so they are
      where translation BUYS something; the 2,287 enforceable ones are working
      and a sweep over them is churn with a chance of regression. This is the
      migrate-on-touch rule applied to the corpus.
      ORDERING NOTE: the structured form should be expressible as a 1252-hsrz
      predicate eventually, but this row does NOT depend on it. The keyword
      interpreter can be replaced by declarative assert fields in YAML with no
      Lua at all, and holding this behind the runtime would leave 64 toothless
      steps in the gate for another two packets' duration.
    exit_criteria:
      - 'a step declaring a structured assertion on exit status, stdout and stderr is adjudicated by those fields ONLY, and a test proves changing unrelated prose in the same step does not change the verdict (pre-fix result: FAILS — today a sentence gaining the word "succeeds" silently converts the step to an exit-code check)'
      - 'the 64 steps whose expected_behavior contains "succeeds" are migrated, and for each the migration states what the step now checks BEYOND exit status — or records that exit status was genuinely all it ever checked'
      - 'a step asserting an (a|b) alternation passes when the output matches either branch (pre-fix result: FAILS — 868-p8xi, matched verbatim as a literal, unpassable by construction)'
      - 'the four expected_behavior values asserting wall-clock timing are removed rather than translated, with any real budget expressed as timeout_ms'
      - 'NEGATIVE CONTROL: for at least one migrated step, a deliberately wrong output is fed in and the step goes RED — a translation that cannot fail has moved the prose, not the teeth'
      - 'the keyword case arms are deleted, not merely bypassed, and a grep for the interpreter''s distinctive arms returns nothing (pre-fix result: FAILS — the arms are live and reachable)'
    unscoreable: |
      whether-the-remaining-2287-should-follow: they are enforced today by
      literal substring match, which is crude but honest, and migrating them is
      churn against working tests. Whether a structured form is worth that churn
      is a judgement this row cannot settle and should not pre-empt; it closes
      on the interpreter being gone and the toothless 74 having teeth.
    verifiable_closure: |
      the keyword case arms absent from scripts/run-litmus-test.sh; a structured
      assertion adjudicating exit status, stdout and stderr independently of
      surrounding prose; the 64 "succeeds" steps migrated with a stated
      before/after for each; an alternation step passing on either branch; the
      four timing assertions removed; and at least one migrated step shown RED
      against a deliberately wrong output.
