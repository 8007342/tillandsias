    owned_files:
      - crates/tillandsias-plan/src/lua_runtime.rs
      - lua
    title: |
      a Lua predicate bridge whose CACHEABLE class cannot reach the shell — purity enforced by symbol ABSENCE, not by documentation — so a forge agent can validate uncommitted specs and litmus without recompiling the host binary
    context: |
      WHY LUA AND NOT MORE RUST, in the operator's words 2026-09-18: an agent
      inside the forge has "no place to recompile their own binary when adding
      specs or work implementation". If predicates are Rust, a forge agent
      cannot validate a spec it just wrote, and the runtime-verifiable-obligation
      vision is unreachable from where most of the work happens. That makes the
      dynamic layer a RUNTIME REQUIREMENT, not a convenience.
      THIS DOES NOT REOPEN 920-pxg6, and the distinction matters. That audit
      pinned Lua to deterministic data-in/data-out work and deleted a PHANTOM
      sandbox claim from lua_runtime.rs. The division of labour survives here
      intact: Lua DECLARES and DECIDES; Rust (1252-fg9e) SPAWNS, owns fds,
      enforces timeouts and reaps. Nothing in the forge argument argues for
      moving fork/exec into Lua.
      THE MODEL IS CAPABILITY-PASSING AND ALREADY EXISTS. lua_runtime.rs today
      exposes exactly `expert.log_info` and `expert.now_ms` and nils out
      os.execute, io.popen, io.open, require, dofile and debug. Adding verbs
      WIDENS an audited capability set; it does not invent a trust model.
      THE CACHE PURITY TRAP, which is the reason this packet exists in this
      shape. The performance case wants cached predicate results over read-only
      state. A cached result is sound only if the predicate is genuinely pure —
      and the moment a shell verb is in scope, predicates OBSERVE THE WORLD and
      are not. Cache those and you get stale verdicts indistinguishable from
      fresh ones: a green gate that ran nothing, which is the failure this whole
      programme exists to prevent.
      THE FIX IS STRUCTURAL, NOT DOCUMENTARY: two predicate classes, and the
      cacheable one simply DOES NOT HAVE the shell verb in its environment. A
      pure predicate that tries to shell out fails to resolve the symbol. That
      is what keeps the classification from drifting away from reality;
      a documented rule drifts the first time someone is in a hurry.
      SELINUX CANNOT BE CITED AS CONTAINMENT AND MUST NOT BE. ../tillandsias.org
      found the SELinux policies are PROSE — not enforced, not scoped, not
      required anywhere. Claiming SELinux containment here would recreate
      precisely the phantom that 920-pxg6 deleted from this very file. Note also
      that a spec requiring SELinux which nothing enforces is the same
      prose-versus-enforceability defect measured in the litmus corpus, one
      layer down. Containment today = a small audited verb set + the forge's
      existing container boundary. Nothing else may be asserted.
      PROVENANCE IS THE REAL COST AND IS NOT SOLVED HERE. Today `lua/` is
      trusted code in the checkout. A forge agent authoring a predicate for
      uncommitted work moves the boundary from "code we shipped" to "code an
      agent just wrote". That is a provenance question, not a sandbox question,
      and "we are the only ones manipulating it" stops being the safeguard the
      moment agents author predicates. Bounding blast radius by the verb set is
      the mitigation this packet delivers; signing/attesting predicate
      provenance is NOT in scope and needs its own row.
    exit_criteria:
      - 'a predicate registered in the cacheable class and calling the shell verb FAILS TO RESOLVE THE SYMBOL at call time, proven by a test asserting the failure (pre-fix result: FAILS — there is no predicate class distinction today, so nothing can be asserted about it)'
      - 'a predicate in the observing class IS able to call the shell verb, and its result is never served from cache — proven by mutating the observed state between two calls and asserting the verdict changes (pre-fix result: FAILS — no cache and no classes exist)'
      - 'a forge agent adds a NEW litmus predicate for an UNCOMMITTED spec and it executes, with no recompilation of the host binary anywhere in the transcript — this is the packet''s whole justification and an exit criterion that does not exercise it does not close this row'
      - 'the runtime exposes an enumerable verb list, and a test asserts the enumeration matches the audited set exactly — so widening the capability set is a visible diff rather than an accident'
      - 'lua_runtime.rs states what containment IS (verb set + container boundary) and explicitly that SELinux is NOT relied upon, so the next reader cannot infer a guarantee that does not exist'
    unscoreable: |
      whether-the-verb-set-is-the-right-size: it can only be learned by use.
      Too narrow and predicates get written in bash again, which is the status
      quo; too wide and the blast-radius argument weakens. This row closes on
      the MECHANISM being enforceable and enumerable, not on the set being
      final. Also unsettled: predicate provenance once agents author them — a
      real question, explicitly out of scope here, and needing its own row
      rather than being smuggled into this one's closure.
    verifiable_closure: |
      a committed test module proving: a cacheable-class predicate cannot
      resolve the shell verb; an observing-class predicate can, and is never
      served stale across a state mutation; the verb enumeration matches the
      audited list; plus a recorded transcript of a forge agent executing a new
      predicate against an uncommitted spec with no recompilation step in it.
