    title: |
      an idiomatic command executor in Rust — argv not shell strings, stdout and stderr captured SEPARATELY and drained CONCURRENTLY, exit status as a value, and a run identity on every Result so a stale artifact cannot read as a fresh one
    context: |
      OPERATOR DIRECTIVE 2026-09-18: "We're not trying to fix a problem, we're
      trying to fix the architecture so the problem doesn't exist." This is the
      foundation packet for that; 1252-hsrz, 1252-znbn and 1252-r72q sit on it.
      THE DEFECT SURFACE, MEASURED ON macuahuitl AT 8dd482881, not estimated.
      `find -L scripts -name '*.sh'` is 669 files. Whole-file co-occurrence of
      each hazard shape, an UPPER BOUND because co-occurrence is not proof the
      specific pipeline runs under that option:
        195  `pipefail` + `| grep -q`   verdict inverts on SIGPIPE
         65  `| tail -1`                discards the guard's reasoning
         27  `if ! <pipeline>`          795-imz3 guard inversion
          7  inline `pgrep|pkill -f`    self-match, exit 144
      THE INVERSION IS DETERMINISTIC, NOT INTERMITTENT, and that is the part
      that makes it dangerous. Over a 200,000-line input whose FIRST line
      matches, `sed … | grep -q` under pipefail returned rc=141 and reported
      NO-MATCH on 5 of 5 trials while the string was present 200,000 times;
      capture-then-match was correct 5/5. At small inputs the producer finishes
      before grep exits and the bug is invisible — so a guard is green for
      months and flips the day its corpus grows. That is exactly how
      check-seam-writers-canonical.sh behaved.
      WHAT THE LAYER FIXES BY CONSTRUCTION, of the ten defects that cost time in
      the 2026-09-17/18 session: SIGPIPE inversion (no OS pipe between stages),
      `set -e` assignment exit (status is a value), shell options not
      propagating into a child `bash -c` (the layer owns the invocation),
      `if ! <pipeline>`, `tail -1` discarding stderr (separate capture), and
      `pgrep -f` self-match (argv assembled callee-side).
      WHAT IT DOES NOT FIX, said plainly because the motivating incident is in
      this column: the litmus YAML indentation defect that actually reddened the
      release gate, command-vs-argument position when patching YAML, `head -8`
      over a 12-item list, and a regex that clipped an order token. Those are
      data-format and enumeration defects. Do not sell this packet as fixing
      them.
      ASYNC IS REQUIRED FOR CORRECTNESS, NOT ELEGANCE. A child writing past the
      pipe buffer (~64KB) on stdout while nobody drains stderr DEADLOCKS. Both
      fds must be drained concurrently. The bash shape prototype dodged this
      only by writing to files, which is why it is a shape prototype and not the
      implementation.
      RUN IDENTITY IS IN SCOPE AND IS NOT A NICETY. On 2026-09-18 a land was
      monitored with `until [ -f land.rc ]`; a 13-hour-old file of that name
      satisfied it instantly and the tool reported rc=0 for a land that had not
      started. Verifying against origin is what caught it. A Result that carries
      the identity of the run that produced it makes that unrepresentable, and
      the same shape is what lets a cached verdict be distinguished from a fresh
      one in 1252-hsrz.
      ARGV, NEVER SHELL STRINGS, is the single constraint doing the most work:
      it deletes quoting, word-splitting, globbing and injection as a CLASS, and
      it is precisely what bash cannot offer. `run{"git","status"}`, never
      `run("git status")`.
      PRECEDENT AND SCOPE: crates/tillandsias-podman is the shape to copy — an
      idiomatic Rust layer callers describe intent to. This packet does NOT
      migrate the 669 scripts. Migrate on touch, exactly as the operator ruled
      for redb; a sweep is how a second substrate appears that the gate does not
      run.
    exit_criteria:
      - 'a Result carries exit status, stdout and stderr as three SEPARATE values, and a test proves stderr survives when a caller reads only stdout (pre-fix result: FAILS — scripts/run-litmus-test.sh:1403 redirects every step with >"$step_capture" 2>&1, so no litmus step can distinguish them today)'
      - 'a command whose child writes 1 MiB to stdout AND 1 MiB to stderr completes and returns both in full (pre-fix result: FAILS — a sequential single-fd read deadlocks at the pipe buffer; this criterion is the reason the executor must drain concurrently)'
      - 'the SIGPIPE reproducer at poc/01-demonstrate-inversion.sh, which returns rc=141 and NO-MATCH 5/5 through a shell pipeline under pipefail, returns the correct verdict 5/5 through the executor on the same 200,000-line input'
      - 'the API accepts an argv sequence and there is NO entry point taking a shell string; a test asserts a literal containing a space, a quote and a glob reaches the child as ONE argument unaltered (pre-fix result: FAILS — no such API exists)'
      - 'every Result carries an identity distinct per invocation, and a test asserts two runs of the same command produce different identities, so a stale artifact cannot be mistaken for a fresh one'
      - 'a timeout fires on a child that ignores SIGTERM and the Result says the run was killed rather than reporting an exit status the child never produced'
    unscoreable: |
      whether-the-tree-converges-on-it: adoption is migrate-on-touch by operator
      ruling, so this row closing says the executor exists and is correct, NOT
      that any script uses it. How fast call sites move, and whether the
      ergonomics are good enough that they do, cannot be settled by this row and
      should not be read into its closure. A later finding that scripts are not
      adopting it is evidence about ergonomics, not a reopening of this packet.
    verifiable_closure: |
      a committed test module in which: stderr is readable when only stdout is
      consumed; a 1 MiB/1 MiB dual-stream child completes without deadlock; the
      200,000-line SIGPIPE reproducer returns the correct verdict 5/5 where the
      shell pipeline returns rc=141 5/5; an argument containing a space, a quote
      and a glob arrives at the child as one unaltered argv entry; two
      invocations carry distinct run identities; and a SIGTERM-ignoring child is
      reported as killed rather than as exited.
