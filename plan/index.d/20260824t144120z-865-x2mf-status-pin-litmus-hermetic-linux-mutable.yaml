    discovered_by: "865-n8vq — the release gate red, this the one failure reproducible at instant size"
    context: >
      680-zphp EXISTS TO STOP A GROUNDTRUTH CASE PINNING `status:` ON A PACKET
      WHOSE STATUS CAN STILL MOVE. Its own litmus did exactly that.

      The negative control pinned `status: ready` on packet 394 and required
      check-groundtruth-mutable-status-pins.sh to REFUSE it. 394 was obsoleted
      on 2026-08-23 (06d859499) — a TERMINAL status — so the pin became
      legitimate, the guard correctly admitted it, and the litmus went red
      hunting a refusal it could no longer earn. The header still asserted
      "394 is ready (non-terminal, a trap)".

      It stayed red for a day and helped block the release gate (865-n8vq).

      PICKING A LONGER-LIVED PACKET WOULD ONLY POSTPONE IT. Every live packet is
      mortal; that is the entire premise of the rule being enforced. The test
      had to stop consulting the live ledger, which it could not do because the
      guard `cd "$REPO_ROOT"` before resolving anything — a caller's CWD was
      silently discarded, and the comment described this as deliberate: "status
      is still resolved against the LIVE ledger, so the fixture cites real
      packet ids". That sentence is the defect.

      A SECOND BUG WAS SITTING UNDER THE FIRST, and it is the more dangerous
      shape. Once the ledger became overridable, the lookup ran inside
      `cd "$LEDGER_ROOT"` — and resolve_plan_binary returns a REPO-RELATIVE path
      (`./target/release/tillandsias-plan`). Relative, inside that subshell, the
      binary is simply absent: every status resolves empty, every pin is skipped
      as "unknown packet", and the guard prints `ok:...:0 live-checked` and
      exits 0. A guard that checks NOTHING is indistinguishable from a guard
      that checks everything and finds nothing. I introduced that in the same
      change, with a comment asserting the path was already absolute, which I
      had not checked.

      SO THE POSITIVE CONTROL NOW ASSERTS `1 live-checked`, NOT MERELY EXIT 0.
      That is the difference between "the guard approved this" and "the guard
      ran".
    exit_criteria: >
      (1) Both controls own their ledger via
      TILLANDSIAS_GROUNDTRUTH_LEDGER_ROOT and cite no live packet, so nothing in
      plan/ can move them again.
      (2) Production behaviour is byte-identical: the real corpus still reports
      `3 live-checked`, rc=0, with no env var set.
      (3) The positive control asserts the CHECKED COUNT, so a guard that has
      gone inert fails instead of passing.
      (4) Mutation-controlled in both directions — a weakened guard AND a
      disabled guard must both go red.

