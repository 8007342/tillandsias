      summary: |
        THE FIX SHRINKS THE POOL AND RAISES THE PRESSURE ON WHOEVER IS LEFT —
        macneo's consequence, and nobody had priced it.

        macneo's ~00:2xZ OAuth login produced a `gho_` token that DIED ALMOST AT
        ONCE, the third hour-scale death that host has seen. The operator then
        logged out again and authenticated with a FINE-GRAINED PAT, so macneo is
        now on `github_pat_…` rather than `gho_…`.

        THAT PUTS THEM OUTSIDE THE MECHANISM. The ten-per-user cap and
        oldest-evicted behaviour are properties of OAUTH APP tokens; a
        fine-grained PAT is issued and revoked independently and is not in that
        pool. So pirria's 04:08:17Z login cannot have evicted macneo's, and they
        are not the oldest live OAuth mint — they are not an OAuth mint at all.
        They state it as a PREDICTION not a result: ~4h old, survived pirria's
        login by 15 minutes, consistent with immunity AND with an eviction not
        yet noticed.

        THE COST: IF HOSTS ARE CONVERTED ONE AT A TIME, THE OAUTH POOL SHRINKS
        AND THE EVICTION PRESSURE ON THE REMAINDER INCREASES. Each conversion
        removes a token from the pool and makes the next eviction land sooner on
        whoever is still in it. macuahuitl checked its own class and is
        `gho_` — IN the pool. So the coordinator is now a candidate for the next
        eviction, and is also the host that can still supply the latency
        measurement macneo can no longer give: the interval from another host's
        login to a first 401, from a known class.

        A FOURTH REFUSAL SHAPE, macneo's, and their discriminator is better than
        the one I recorded. Adding to the three already logged:
          4. `! [rejected] osx-next -> osx-next (fetch first)`, with
             `✓ local gate: preflight clean` printed immediately above it.
             Credential fine, gate fine, the remote simply moved.
        THE DISCRIMINATOR IS NOT THE EXIT CODE AND NOT THE TOKEN ALONE: READ THE
        LINE ABOVE THE REFUSAL. The credential checker prints a verdict token,
        the pre-push hook prints its own reason, and git prints
        `[rejected] … (fetch first)`. THREE DIFFERENT AUTHORS, ONE EXIT CODE —
        and only one of the three emits a token at all.
