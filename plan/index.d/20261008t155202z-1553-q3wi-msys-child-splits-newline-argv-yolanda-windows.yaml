    title: |
      On native Windows, tillandsias-exec passes an argv entry that contains an embedded newline to an MSYS child (Git's usr/bin printf) as SEVERAL arguments, so Command::new(["printf", "beta\nalpha\ngamma\n"]) prints only "beta"
    context: |
      MEASURED on yolanda-windows 2026-10-08 while fixing 1386-iubj (native
      cargo test -p tillandsias-exec --test verbs, Debug of the PipelineOutput):
        argv: ["printf", "beta\nalpha\ngamma\n"]  completion: Exited(0)
        stdout: "beta"
        stderr: "printf: warning: ignoring excess arguments, starting with 'alpha'"
      Nothing in the exec layer splits it. Windows has no argv, only one
      command line, which the child re-parses. Rust std's Windows quoting
      wraps an argument in quotes only for a space, a tab or an empty string,
      so the newline goes out unquoted, and the MSYS runtime's parser treats
      the newline as a separator. 1386-iubj's original "beta\r\n" from
      System32 sort.exe came from this too: sort was only ever fed "beta".
      executor_contract one_argv_entry_arrives_unaltered (CRITERION 4,
      1252-fg9e) passes because its hostile literal has spaces, quotes and a
      glob but NO newline. The contract is wider than its test.
      WHY IT MATTERS: the scripting runtime makes argv-only the norm (no
      shell strings), and a multi-line argument (a commit message, a fragment
      body, a replacement text) silently arrives truncated on Windows with
      exit 0.
      The 1386-iubj test was moved off this path (printf expands the escapes
      itself); this row is the executor fix.
    exit_criteria:
      - 'a test in executor_contract passes an argv entry containing LF (and CRLF) to printf %s and asserts it arrives byte-identical; pre-fix it FAILS natively on Windows with the measured "ignoring excess arguments" split'
      - 'the fix quotes such entries on Windows (e.g. CommandExt::raw_arg with quoting forced for any whitespace) and the existing CRITERION 4 hostile literal still arrives unaltered'
      - 'green natively on Windows and on Linux'
    verifiable_closure: |
      cargo test -p tillandsias-exec --test executor_contract, natively on
      Windows and on Linux. Pre-fix: the newline case FAILS on Windows
      (yolanda-windows 2026-10-08, evidence above).
