      ts: "2026-08-17T10:00:00Z"
      agent_id: windows-yolanda-opus5-20260817T0930Z
      host: windows
      summary: |
        MECHANISM REFUTED BY MEASUREMENT. This packet asked for the guest daemon
        to bind its vsock listener BEFORE its long provisioning work. It already
        does, by a wide margin, and has for the whole period under investigation.

        SOURCE. `run_headless_async` (crates/tillandsias-headless/src/main.rs:
        13666-13750) reaches `maybe_spawn_vsock_listener` through non-blocking
        calls only — `load_config` is a stub returning Ok(()), the metrics
        sampler and HTTP server do their binds INSIDE their spawned blocks, and
        all five startup tasks are `tokio::spawn`. Inside the vsock task
        (main.rs:13209-13608) there is NO `.await` at all before
        `run_vsock_listener(...)` at main.rs:13581. The daemon never bootstraps
        Vault or builds an image on its own startup path: every
        `ensure_vault_running` call site is a CLI lane (--init 708,
        --reset-guest 7459, --opencode 10418, --opencode-web 11521) or a
        control-wire request handler (vsock_server.rs:1464, strictly after bind
        AND after a host connect). The proxy/vault build reached at
        container_deps.rs:309/318 comes from the liveness task, which is gated
        on VmPhase::Ready and dispatched via spawn_blocking, so it cannot
        precede the bind.

        FOUR COLD BOOTS, bind observed after daemon start, from systemd's own
        ExecMainStartTimestampMonotonic:

          2026-08-16 04:41:55  255 ms   vault image MISSING (truly cold)
          2026-08-17 02:38:43   90 ms
          2026-08-17 02:41:09   61 ms
          2026-08-17 02:41:29   78 ms

        All four: `vsock_listener=bound port=42420`, ready unit exit 0, daemon
        restarts 0. 4/4 IDENTICAL VERDICTS — the exit criterion asking for the
        same verdict across repeated provisions is met by the code as it stands.

        On the truly-cold boot the listener was bound at T+255ms, the first
        provisioning step (`[liveness] tillandsias-vault not running`) began at
        T+291ms, and provisioning ran to T+24.2s (vault image build T+12.1s,
        proxy image build T+24.2s). So the listener was answering 36 ms BEFORE
        provisioning began and 24 seconds before it finished. Exit criterion 1
        — "connects successfully at a point where provisioning is demonstrably
        still in flight" — is satisfied without any change.

        WHERE THE PREMISE CAME FROM. Not the code: a comment. wsl_lifecycle.rs
        carried 757-4hdt's FIRST diagnosis ("the daemon bootstraps Vault and
        builds the proxy image ... before it binds 42420"), which 757-4hdt
        ITSELF superseded two events later when it found the real cause —
        vsock_loopback not loaded, so a CID-1 probe cannot observe a listener
        that IS bound. The superseded text stayed, was read as current, and this
        p1 release-blocker was filed to implement it. The comment is corrected
        in the same commit.

        THE SIX EXCEPTIONS: FIVE ARE LOAD-BEARING, AND I AM REFUSING TO DELETE
        THEM. (1) the separate systemd unit — an ExecStartPost failure stops the
        subject regardless of WHY it failed; deleting it recreates the five
        measured kills. (4) the modprobe — still doing work: on the truly-cold
        boot the daemon logged `vsock_loopback missing` and the probe succeeded
        249 ms later, which can only be its own modprobe. (5) INDETERMINATE —
        the third state is real; folding it into PASS recreates 735-ewzp's
        always-passing probe, folding it into FAIL is a false alarm on a healthy
        system, and both have shipped once each. (6) ENETUNREACH — the
        discriminator that produces (5). (2) the 900s deadline is the ONE
        genuinely reducible item, and (3) `--no-block` retires with it — but
        only after the module race is deterministic, or a slow PASS becomes a
        fast INDETERMINATE.

        THE INTENT IS LIVE, THE MECHANISM IS DEAD (philosophy.
        obsolete_mechanism_live_intent -> mechanism_dead_intent_live: REWRITE,
        never close). Rewritten premise, split three ways:
          798-q4m9  the bind is first in program order but its TASK is spawned
                    LAST, behind two startup tasks that run blocking code on
                    tokio WORKER threads (run_disk_usage_check shells out to
                    bash and materializes embedded assets; run_trace_budget_
                    enforcement parses the whole log with no yield points). On a
                    1-vCPU guest that can delay the bind. Not observed firing —
                    this host has multiple vCPUs, which is the "verified where
                    it was written" shape, so it is filed rather than dismissed.
          798-emje  THE ACTUAL NONDETERMINISM: the probe needs vsock_loopback
                    and the module load races it. This is the one variable that
                    differed between 757-4hdt's FAIL (`preflight vsock_loopback
                    missing`) and PASS (`loaded`) on identical artifact+host.
          798-vxj5  the 900s deadline, blocked on 798-emje.

        RELEASE CONSEQUENCE. v0.4.260815.1's promotion-FAIL is real, but the
        remediation it is recorded as waiting on is the wrong one. A cut held
        for "bind ordering" is held for a change that would delete working
        defenses. The hold should be re-read against 798-emje.

        NOT CLOSED, deliberately. obsolete_mechanism_live_intent says rewrite
        rather than close, and verification_rule defaults to refuted under
