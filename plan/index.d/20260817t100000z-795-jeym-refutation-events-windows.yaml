  - packet_id: guest-readiness-probe-kills-the-healthy-daemon-on-a-cold-first-boot
    event:
      type: note
      ts: "2026-08-17T10:00:00Z"
      agent_id: windows-yolanda-opus5-20260817T0930Z
      host: windows
      summary: |
        CORRECTION TO THIS PACKET'S FIRST DIAGNOSIS, recorded here because that
        diagnosis outlived it in a source comment and cost a p1 packet
        (795-jeym).

        The note left on this packet — "the deeper option ... is for the daemon
        to bind the vsock listener BEFORE its long provisioning work rather than
        after" — rests on a premise this packet's own later verification event
        had already superseded. Measured 2026-08-17 on four cold boots: the
        listener binds 61-255 ms after daemon start and is answering BEFORE the
        first provisioning step begins. There is no "after" to move it out of.

        This packet's SECOND diagnosis was the right one and remains correct:
        the probe connects to CID 1, which requires vsock_loopback, and on a
        boot where that module is not yet loaded it reports the control wire
        down while the wire is working. That is also what explains the one
        FAIL / one PASS on identical artifact+host recorded in the 2026-08-16
        progress event — the FAIL logged `preflight vsock_loopback missing`,
        the PASS logged `loaded`. Carried forward as 798-emje.

        Nothing about this changes this packet's own verified status: the fix it
        shipped (assertion moved off the daemon's unit so failing it cannot stop
        the subject) is correct, is still in place, and was re-confirmed here —
        four cold boots, daemon restarts 0, ready unit exit 0.
