packets:
  - packet_id: direct-cargo-build-greens-rest-on-an-untracked-artifact
    order: 959-k3vb
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: '`cargo build -p tillandsias-headless` succeeds only in a tree that has already run build.sh — a fresh clone refuses, so every direct-cargo green is narrower than it reads'
    deliverable: a direct cargo build either works in a fresh clone or the crate's own greens are stated with the precondition they actually rest on
    pickup_role: windows
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - rust
      - ci
      - build
    context: |
      DISCOVERED BY yoga 2026-09-02, building tillandsias-headless off
      origin/windows-next 50026d58c in a fresh scratch worktree. Confirmed from
      the windows side the same day.

      Exact refusal (crates/tillandsias-headless/build.rs:139):

        required runtime asset missing: images/router/tillandsias-router-sidecar
          This is a BUILD ARTIFACT, not a tracked file - it is built from
          crates/tillandsias-router-sidecar, never committed (order 710-w9kc).
          A fresh clone will not have it.

      VERIFIED ON THE WINDOWS HOST:
        ls  images/router/tillandsias-router-sidecar -> present, dated Aug 31 17:01
        git check-ignore -v                          -> .gitignore:57
        git ls-files --error-unmatch                 -> UNTRACKED

      So the artifact sits in this working tree from a build.sh run two days
      ago. Every `cargo build -p tillandsias-headless` and `cargo test -p
      tillandsias-headless` reported green here today ran against it.

      WHAT IS AND IS NOT INVALIDATED, stated precisely because the tempting
      overcorrection is wrong. Those builds really did compile and those tests
      really did run; the results stand for this tree. What does NOT stand is
      the unstated generalisation - "the crate builds" - which is true only of
      a tree that has already run build.sh or build-image.sh. A fresh clone, a
      new worktree, or a CI lane that invokes cargo directly gets the refusal.
      The green named an artifact; it did not name its precondition.

      THE REFUSAL ITSELF IS EXEMPLARY and must not be softened. It names the
      missing file, says it is untracked, cites the order that un-committed it
      (710-w9kc), and states that a fresh clone will not have it. It is the
      723-wd8i message working exactly as designed - yoga hit it and needed one
      command, `bash scripts/build-sidecar.sh`, then built in 58s. The defect is
      not the message. The defect is that a routine developer command has an
      unadvertised precondition, and that agents on this fleet have been
      reporting its output as evidence without naming that precondition.

      SIBLING: 958-w4kq (the linux gate cannot see cfg(windows) code). Same
      family - a green whose scope is narrower than every reader takes it to
      be - but a different mechanism, so filed separately rather than folded in.
    verifiable_closure: a fresh clone of the repo can either run `cargo build -p tillandsias-headless` successfully, or the build.rs refusal is reached by a documented path that agents are instructed to name when reporting cargo greens - demonstrated by building in a clean worktree
    evidence:
      - 'yoga: fresh worktree off 50026d58c, build.rs:139 panic, resolved by scripts/build-sidecar.sh, 58s'
      - 'windows host: artifact present dated Aug 31 17:01, .gitignore:57, git ls-files reports untracked'
    events:
      - type: note
        ts: "2026-09-02T09:02:49Z"
        agent_id: windows-yolanda-opus5-20260902t0902z
        host: windows
        summary: |
          Filed against my own verification method rather than someone else's
          code. I reported cargo greens for this crate repeatedly today and none
          of them named this precondition, because my tree happened to satisfy
          it incidentally. yoga also corrected their own report of it - they
          paraphrased the panic as "a staging precondition" before reading it,
          turning a well-diagnosed failure into a vaguer complaint. Both halves
          of that exchange are the same error as the one the packet describes.
