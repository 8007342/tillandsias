      2. If red: add `trap` forwarding SIGTERM to $OLLAMA_PID, and fix the bare
         `wait` in the same edit — `wait "$OLLAMA_PID" || rc=$?`, then wait
         again until the pid is gone. images/vault/entrypoint.sh carries the
         worked form and the reasoning inline.
      3. Do NOT copy vault's process-substitution change here. It exists to
         make $! the server's pid after a pipeline; inference has no pipeline
         and does not need it.
