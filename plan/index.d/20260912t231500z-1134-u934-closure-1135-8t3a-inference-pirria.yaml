    title: |
      READ FROM THE SOURCE, NOT MEASURED: images/inference/entrypoint.sh ends in a bare `wait $OLLAMA_PID` with no trap anywhere in the file — the same PID-1-shell-that-forwards-nothing shape as 1134-u934, so `podman stop` on tillandsias-inference is expected to burn its full grace and exit 137
    context: |
      FOUND by pirria 2026-09-12 while closing 1134-u934, whose next_action
      step 4 says in as many words: "Check the sibling images. proxy exits 0 so
      it is likely fine, but git/inference/forge were not examined here and may
      share the shape." This is that check, and it is recorded as its own row
      rather than folded into the vault fix because it is a DIFFERENT image
      with a different owner and, unlike the vault finding, it is NOT MEASURED.

      THE SWEEP, so the negative results are on the record too:
        images/proxy/entrypoint.sh    exec squid-supervisor   — exec, fine
        images/router/entrypoint.sh   exec caddy              — exec, fine
        images/web/entrypoint.sh      exec httpd              — exec, fine
        images/default/entrypoint*.sh exec <agent>            — exec, fine
        images/git/entrypoint.sh      trap ... EXIT/SIGTERM/SIGINT at :405-406
                                                              — traps, fine
        images/inference/entrypoint.sh  `ollama serve &` :442,
                                        `wait $OLLAMA_PID` :728,
                                        `grep -c trap` = 0   — THIS ROW

      ONE DIFFERENCE FROM 1134-u934 THAT MATTERS, and it changes the fix.
      inference launches `ollama serve &` as a DIRECT background child, not as
      a backgrounded pipeline, so `$!` there really is ollama's pid. The second
      defect of 1134-u934 (a `$!` that held tee's pid) is ABSENT here. What is
      missing is only the trap — and `set -e` is active from line 2, so the
      third defect of 1134-u934 applies verbatim: a bare `wait` interrupted by
      a trapped signal returns 143 and `set -e` exits the shell at 143 before
      ollama has finished. A fix that adds the trap and leaves the bare `wait`
      swaps a 137 for a 143.

      WHY p2 AND NOT p1. Vault was p1 because it is a sealed secret store. The
      inference container serves models from a read-mostly store and holds no
      secret material of its own, so an unclean kill costs the grace period and
      an unclean model-file close, not a credential. It is the same defect at a
      lower blast radius.

      NOT ESTABLISHED: that the stop actually stalls. The container is not
      running on this host and was not started to find out — see the closure.
    next_action: |
      1. MEASURE FIRST on a host with a running tillandsias-inference:
         `TILLANDSIAS_VAULT_CONTAINER=tillandsias-inference bash
