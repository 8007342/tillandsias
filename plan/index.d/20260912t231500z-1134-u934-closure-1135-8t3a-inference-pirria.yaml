      summary: |
        FIXED in images/vault/entrypoint.sh, with the closure the packet named
        MEASURED RED then GREEN on pirria against real containers.

        EVIDENCE, both halves, same instrument
        (scripts/test-vault-shutdown-forwards-sigterm.sh):

          RED, pre-fix image (localhost/tillandsias-vault:sha256-be8031931d,
          the image the running enclave was on):
            measured: elapsed=30s exit_code=137 oom_killed=false grace=30s
            fixture_rc=1
          GREEN, post-fix image (localhost/tillandsias-vault:f9ab7f8d9d0d):
            measured: elapsed=1s exit_code=0 oom_killed=false grace=30s
            fixture_rc=0

        30s/137 -> 1s/0. The container's own log carries the forwarded signal
        and the seal, which is what distinguishes this from a container that
        merely died faster:
            [vault-entrypoint] received termination signal; forwarding to vault (pid 10)
            ==> Vault shutdown triggered
            core: marked as sealed
            core: vault is sealed
            [vault-entrypoint] vault exited after a forwarded termination signal (rc=0); reporting a clean shutdown
        `pid 10` is the assertion that the second defect is gone: the process
        tree is `1 bash / 10 vault / 11 tee`, so a trap forwarding to tee would
        have printed 11 and changed nothing.

        THREE DEFECTS, not the two that were filed. The third was found while
        fixing the first two and is invisible until a correct trap exists:
        `set -e` is active, a trapped signal INTERRUPTS `wait`, and a bare
        failing `wait` then exits the shell at 143 THAT INSTANT — before vault
        has sealed. A correct trap plus a bare `wait` still produces an unclean
        stop. Every wait is now guarded (`|| rc=$?`) and the handler reaps
        vault itself rather than returning into the provisioning curls, where
        `set -e` would have turned a stop into a non-zero container exit by a
        third route. The subsequent-boot early return had the same bare `wait`
        and an `exit 0` that reported clean regardless of what vault did; both
        paths now go through one function.

        THE FIXTURE IS THE INSTRUMENT, AND IT IS A LIVE-CONTAINER ONE ON
        PURPOSE. A text fixture grepping for `trap` would have passed the wrong
        fix — the one forwarding to tee — which the packet explicitly warned
        "looks fixed". It exits 3 (could-not-run, the 923-ws3r channel) on a
        host with no provisioned enclave rather than printing ok: over an
        assertion that never ran.

        HOW THE GREEN WAS OBTAINED, stated because it is not the obvious route
        and the difference matters to whoever reads this next. `tillandsias
        --init` did NOT pick the fix up: the installed tray embeds its own copy
        of the image sources (EMBEDDED_RUNTIME_ASSETS in runtime_assets.rs), so
        it rebuilt the same pre-fix digest from its own bytes and reported
        "container already running and unsealed". The measurement was taken
        against an ISOLATED probe container run directly from the newly built
        image on scratch volumes, with the host's real enclave left intact.
        CONSEQUENCE, not hidden: this host's live tillandsias-vault STILL RUNS
        THE PRE-FIX ENTRYPOINT, and every host will, until a tray is built and
        released from a checkout carrying this commit. The source is fixed; the
        fleet is not, until the next release.

        NOT ESTABLISHED, unchanged from the filing: that the SIGKILL ever
        corrupted anything.

        INCIDENTAL, recorded not filed: the probe's SECOND boot logged "FATAL:
        unseal request returned HTTP 400: wrong key". That is an artifact of
        the isolation, not a defect — a scratch store initializes with its own
        generated key and stashes it on a tmpfs nobody captured, so the host's
        HKDF secret is legitimately the wrong key for it. The real container's
        flow captures that key to the keychain. Named here so a later reader
        does not mistake it for a regression in the unseal path.

        RUNBOOK §3b ADDED, which is the other half of the packet: §3 asserts a
        clean init and cannot see a shutdown defect in principle — this run's
        §1/§2/§3 were all PASS while vault was being SIGKILLed on every stop.
        §3b stops the substrate after §3 and asserts elapsed AND exit code per
        container, and tells whoever files a finding there to read the process
        tree from the running container first.

        SIBLING SWEEP, next_action step 4: proxy/router/web/forge all `exec`,
        git traps at :405-406, inference does not — filed as 1135-8t3a,
        READ not MEASURED, and its closure says measure before claiming.
