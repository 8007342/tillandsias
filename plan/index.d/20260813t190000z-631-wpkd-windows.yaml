        Criterion 2: `skills/HARNESS-SCOPED.txt` declares the openspec-* set as
        harness-scoped WITH the reason — they are generated by the installed
        openspec CLI into each harness directory at launch, they shadow the
        `opsx:*` slash commands (a harness concept), and the CLI itself decides
