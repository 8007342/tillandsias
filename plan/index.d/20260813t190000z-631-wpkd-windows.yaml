        Criteria 3 + verifiable closure: `scripts/check-skills-single-source.sh`,
        wired into `./build.sh --check`. It reads GIT'S INDEX, not the
        filesystem — `git ls-files -s` reports mode 120000 regardless of what
        the working tree materialized, so a Windows checkout without symlink
        support does not report every entry as a violation on exactly the host
        most likely to be running it.
