      summary: >
        Both exit criteria implemented on the deliverable
        (crates/tillandsias-windows-tray/src/wsl_lifecycle.rs). Status is
        `implemented`, not `done`, because the packet's verifiable_closure is a
        LIVE downgrade-then-upgrade cycle and this cycle did not run one — see
        the verification event.
        Criterion 1 (recovery): the adopted-guest path ended in
        `return self.connect_with_backoff(CW_PORT).await`, so a failed handshake
        was terminal by construction — there was no call site at which anyone
        could notice recovery was missing. `reconcile_adopted_guest` now returns
        its `GuestWiringOutcome` instead of `()`, and the adopted path consults
        `handshake_failure_warrants_reprovision(wiring)`: on failure after THIS
        run rewrote the wiring, it unregisters the distro, clears the
        import-complete marker, and falls through to the existing full
        download+import path — the same treatment `ReprovisionDamaged` already
        gets, reached from a different piece of evidence.
        The predicate is a named function rather than an `if err` because the
        interesting half is what it REFUSES: `SkippedVersionMatch` does not
        qualify. A handshake failing against wiring this run did not touch is
        failing for some other reason, and discarding the guest on that evidence
        is a destructive guess with a rootfs re-download attached. Recovery is
        one-shot by construction — it lives on the adopted path and falls
        through to a fresh provision, which cannot re-enter it.
        Criterion 2 (operator visibility): the skew message now carries BOTH
        versions and whether the guest binary was absent, and the reprovision
        step announces itself. The 648-jv69 incident was reconstructed
        afterwards from a preserved diagnostics bundle; the person watching the
        tray at the time saw a generic "updating components" followed by a
        three-minute stall. Naming both versions is what lets "I just rolled
        back to stable" connect to what is on screen. The structured log line is
        unchanged — the bundle is still the durable record.
  - packet_id: tray-guest-version-skew-wedges-control-wire
    event:
      type: verified
      ts: "2026-08-13T10:59:00Z"
      host: windows
      summary: >
        Three tests, run NATIVELY on Windows — and that detail is load-bearing.
        `wsl_lifecycle.rs` is `#[cfg(target_os = "windows")]` with a Linux stub
        behind it, so the WSL builder distro this host normally uses compiles
        the STUB and reports success without ever seeing the changed file. The
        first check run was therefore worthless and is recorded here so the next
        agent does not repeat it: Windows-tray changes must be checked with the
        native `cargo` on the Windows side.
        `only_a_wiring_rewrite_authorizes_discarding_the_guest` pins the
        predicate in both directions, with `SkippedVersionMatch` as the negative
        control. `adopted_path_recovers_instead_of_exhausting_the_connect_budget`
        asserts the adopted arm no longer ends in a bare
        `return self.connect_with_backoff`, consults the predicate, unregisters
        the distro and clears the marker — a source-shape test because the
        defect WAS a missing call site, which no behavioural test of the
        existing functions could have caught.
        `version_skew_is_reported_to_the_operator_with_both_versions` pins
        criterion 2.
        Result: 85 passed, 1 failed, 7 ignored. The one failure is
        `embedded_guest_headless_matches_workspace_version`, which reproduces
        with this cycle's diff STASHED — pre-existing and unrelated. Filed as
        plan/issues/research-windows-tray-embedded-guest-binary-staleness-2026-08-13.md,
        and it is not merely adjacent: the tray's embedded guest binary carries a
        version string that nothing rebuilds when the build counter moves, and
        `reconcile_adopted_guest` compares exactly that string against
        WORKSPACE_VERSION. A tray built from a tree in that state would re-inject
        on every launch forever. That should be checked before assuming the
        shipped artifacts are clean.
        NOT DONE, and the reason it should stay open: the packet's
        verifiable_closure is "installing an older tray over a newer guest and
        then upgrading again ends with a REACHABLE control wire without manual
        intervention". That needs a live downgrade-restore cycle. The last such
        sequence on a sibling host wedged the control wire for ~25 minutes and
        needed the operator (recorded in the 690-7adz-era smoke notes), so it is
        an operator-authorized run, not something an unattended cycle should
        start at 02:00.
