    order: 654-7ur4
    status: ready
    desired_release: v0.5
    release_target: socket-audit-master
    priority: p0
    title: "Remove the five unsanctioned egress legs now that arbitrary outbound access is reproduced, not inferred"
    kind: security+implementation
    deliverable: crates/tillandsias-headless/src/{main.rs,remote_projects.rs} + bypass-negative litmus
    depends_on: [git-mirror-egress-network-spec-drift]
    pickup_role: linux
    capability_tags: [security, enclave-network, git-mirror, proxy, zero-trust]
    context: >
      606-9wqd's criterion 1 is now closed by OBSERVATION as well as by reading, on a
      host with a valid control (see 653-zzkb for why the first control was invalid):

        default podman network (CONTROL)          api.github.com  REACHED
        tillandsias-enclave only                  all three       blocked
        tillandsias-enclave,tillandsias-egress    api.github.com, example.com,
                                                  pypi.org        ALL REACHED

      Enclave isolation genuinely works. The egress leg genuinely grants arbitrary
      unscoped outbound access — example.com and pypi.org have nothing to do with a
      GitHub push. The gap between "needs api.github.com" and "has the internet" is
      no longer an inference.

      Measured with proxy env vars neutralized, deliberately: env vars are not a
      security boundary, and a compromised process in the mirror simply unsets
      http_proxy. What the spec constrains is the network path, so that is what was
      measured.

      Every `ENCLAVE_EGRESS_NETS` use now has a verdict — ONE sanctioned
      (`build_proxy_run_args`, which the spec mandates) and FIVE unsanctioned runtime
      sites: `build_git_run_args` (main.rs:2953), `run_provider_login` (main.rs:7486,
      :7522 — this one had no verdict before), `run_git_image_shell`
      (remote_projects.rs:320), `clone_project_from_github_with_debug` (:650).
    exit_criteria:
      - >
        606-9wqd criterion 2 attempted FIRST: route upstream Git through the proxy
        and drop the egress leg. The old note that a proxied attempt "failed on clean
        rootless" describes a DNS resolution failure, not proof that proxying push is
        impossible — re-test it now that the instrument is trustworthy.
      - >
        `run_provider_login` gets the same treatment or its own ratified,
        destination-scoped exception. It is the same shape and was only unresolved
        because nobody had looked.
      - >
        The sanctioned and unsanctioned dual-homings stop sharing one undifferentiated
        constant, so the next reader does not re-derive this audit.
      - >
        Bypass-negative litmus: a container in the post-fix mirror posture must FAIL
        to reach example.com directly. This is the test that would have caught the
        drift originally, and the reproduction above is its known-good fixture.
    verifiable_closure: >
      Clone/fetch/push parity preserved through the proxy, and the bypass-negative
      litmus fails if any egress leg is reattached.
    notes: >
      Fall back to a ratified exception (criterion 3) ONLY if proxied push provably
      cannot preserve parity. Ratifying an unscoped exception because scoping is work
      would invert the packet's intent — and today there is no scoping at all:
      tillandsias-egress is a plain NAT network with no destination allowlist.
