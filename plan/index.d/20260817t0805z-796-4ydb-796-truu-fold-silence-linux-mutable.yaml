# Filed by linux_mutable (macuahuitl), 2026-08-17: two wider instances of the
# same silence class, both surfaced by the 787-f7dh fork while fixing a third.
packets:
  - packet_id: the-fold-itself-skips-unparseable-fragments-with-only-a-warning
    order: 796-4ydb
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "The ledger FOLD prints 'fragment does not parse and was SKIPPED — its contents are not in the answers below' on stderr and exits 0, so every reader silently answers from an incomplete ledger"
    deliverable: "an unparseable fragment is a typed, gateable condition at the fold — a machine-readable verdict a caller can refuse on — rather than a stderr warning beside exit 0; with the existing 'tillandsias-plan check' as the natural enforcement point"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [plan-tooling, fail-loud, ledger, coverage]
    estimated_hours: 3
    context: |
      OBSERVED 2026-08-17, in the mutation output of the 787-f7dh fixture — a
      test written for a DIFFERENT defect printed the evidence for this one:

        warning: ledger fragment plan/index.d/a.yaml does not parse and was
        SKIPPED — its contents are not in the answers below

      exit 0. The sentence states plainly that answers are incomplete, and
      nothing gates on it. Every consumer of the fold — plan_answer,
      plan_next, the batch selector, burndown, every closure check — then
      answers from a ledger it has been told is partial, with full confidence.

      787-f7dh hardened ONE consumer (the closure-event pass in
      check-fragment-status-loss.sh, which now refuses when a fragment cannot
      be read). This is the same argument applied where it actually belongs:
      the fold is the shared reader, so fixing it once covers every caller
      instead of each guard re-deriving the refusal. The 698-7n6q parse gate
      does not cover this either — it is diff-scoped, so a malformed fragment
      arriving by merge, hand edit, or sibling branch never passes through it.
      Note the warning is not useless: it is how this was found. The defect is
      the exit code, not the prose.
  - packet_id: fragment-status-declaration-against-an-unknown-packet-id-vanishes
    order: 796-truu
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "A ledger fragment whose status: entry names an unknown packet_id parses cleanly, folds nothing, and reports nothing — the write is simply lost"
    deliverable: "the fold refuses (or loudly names) a status/event entry whose packet_id resolves to no packet, so a typo cannot silently discard a closure"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [plan-tooling, fail-loud, ledger]
    estimated_hours: 2
    context: |
      OBSERVED 2026-08-17 by the 787-f7dh fork, on itself: it hand-wrote a
      closure fragment using the ORDER TOKEN as the packet_id
      (packet_id: 787-f7dh). The file parsed, the fold accepted it, the status
      stayed ready, and NOTHING said a word. Fragments key on the packet_id
      slug; an order token there resolves to no packet and the declaration
      evaporates.

      This is the exact class check-fragment-status-loss.sh exists to catch —
      a closure declared and then discarded — arriving through a door that
      guard cannot see, because it compares declared-vs-folded for packets
      that EXIST. An entry naming a non-existent packet has nothing to
      compare against.

      Cheap and worth doing: the same resolution 790-u8x6 just added to
      claim-ledger-node.sh (refuse an id that resolves to no packet, accepting
      both slug and order token) is the shape wanted here. Hand-written
      fragments are common — worktree-isolated forks cannot always run the
      set-field CLI — so this trap is reachable by exactly the agents least
      able to notice it.
