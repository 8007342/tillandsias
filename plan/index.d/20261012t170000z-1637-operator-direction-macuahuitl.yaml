    context: |
      Operator, 2026-10-12: "on push to remote it actually goes to a real wrangler image, there's no 'it works on my machine but fails on remote' anymore." Cloudflare's own build environment lacks Flutter. Setting the token as a GitHub secret is a one-time user step, and the operator wants a future macron.dev comic about it.
    exit_criteria:
      - 'a workflow template deploys a static template project and a Flutter template project using the same images the forge used; the token is read only from a GitHub secret'
    unscoreable: "unpinnable-until-the-guard-exists: needs a real Cloudflare account and an operator-provided secret to verify"
    depends_on:
