    title: "TILLANDSIAS_COORD_CLIENT_SECRET and TILLANDSIAS_KEY_PASS reach every Lua door child through the TILLANDSIAS_* passthrough"
    context: |
      lua_predicate::base_env_command (proc.run, proc.spawn, proc.chain, sh.run, expert.shell) and run_verb::base_env (tillandsias-plan run) pass every TILLANDSIAS_* variable of the runner to the child. Two of those names are secrets: TILLANDSIAS_COORD_CLIENT_SECRET (coordinator_client: the Access service-token secret) and TILLANDSIAS_KEY_PASS (ca_key_store::PASS_ENV, the at-rest CA key passphrase). Whenever either is set in a runner's environment, every child a Lua script starts receives it, and any child that prints its environment (env, printenv, a crash dump) can put it in a log. Found by the 2029-39bt audit (openspec/changes/lua-door-environment-inheritance (design 2029-39bt, PR #1000)). Narrowest fix, independent of that spec: the passthrough drops a TILLANDSIAS_* name whose last underscore-separated segment is SECRET, PASS or PASSWORD. In the tree that matches exactly the two names above. TOKEN and KEY are deliberately left to the spec's rows (2031-z4rm renames TILLANDSIAS_WRAPPER_TOKEN, a reaper marker that MUST keep propagating, and TILLANDSIAS_NOTARY_KEY, a path).
    exit_criteria:
      - "A cargo test in crates/tillandsias-plan/tests plants TILLANDSIAS_COORD_CLIENT_SECRET and TILLANDSIAS_KEY_PASS with a unique dummy value in the runner's environment, runs a Lua script whose child is printenv of each name through proc.run, and through tillandsias-plan run, and asserts the child exit says absent for both; the planted value appears in no captured stdout or stderr. A negative control in the same test plants a non-secret TILLANDSIAS_* marker and asserts it IS present in the child. Pre-fix result: FAILS, both secrets reach the child."
    verifiable_closure: "A cargo test in crates/tillandsias-plan/tests plants TILLANDSIAS_COORD_CLIENT_SECRET and TILLANDSIAS_KEY_PASS with a unique dummy value in the runner's environment, runs a Lua script whose child is printenv of each name through proc.run, and through tillandsias-plan run, and asserts the child exit says absent for both; the planted value appears in no captured stdout or stderr. A negative control in the same test plants a non-secret TILLANDSIAS_* marker and asserts it IS present in the child. Pre-fix result: FAILS, both secrets reach the child."
    unscoreable: |
      unpinnable-until-the-guard-exists: the fix adds the test named in the exit criterion in the same commit (1136-n8sh).
