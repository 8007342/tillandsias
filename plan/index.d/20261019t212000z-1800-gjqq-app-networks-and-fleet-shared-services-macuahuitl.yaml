    title: |
      EPIC — every app a forge launches (local web preview, toolchain session, later app kinds) runs on its own throw-away `--internal` podman network `tillandsias-app-<app>` (label tillandsias.app-network=<app>), created before the app's run and removed on its stop or at reap, with a declared egress posture — none (no proxy leg, no proxy env), allowlist (proxy connected, per-app Squid ACL keyed on the app subnet), open (proxy connected, no destination ACL) — and the router connected as the app network's second leg so the browser window and the host reach the app; no posture ever gives an app a NAT leg
    context: |
      SOURCE READ (macuahuitl, 2026-10-19, trunk 4e4fd5925): one shared
      --internal enclave (`main.rs` `fn ensure_enclave_network`), one NAT
      bridge (`fn ensure_egress_network`), the proxy the only dual-homed
      member (`const ENCLAVE_EGRESS_NETS`), ONE global Squid allowlist
      (images/proxy/allowlist.txt) for every container. "No internet for
      this app" and "only these hosts" are not expressible. The
      throw-away-network pattern exists for browser windows
      (`browser_open.rs`: network create --internal --label, forwarder,
      network connect to the router's network, network rm -f on close).
      MEASURED here 2026-10-19 (podman 5.8.9, netavark, pasta 20261002):
      `podman network create --internal --subnet fd7a:1800:1::/64` makes an
      IPv6-ONLY internal network; members ping each other by name; no
      egress; create 15 ms; rm refuses while attached unless -f.
      DESIGN binding on every child: an app is on exactly one network and
      it is always --internal; the proxy is the only exit in any posture;
      the router never gains an egress leg; a guard refuses a network
      connect of tillandsias-egress into router or app. 1794-rf3a's
      in-guest forward is taken as given, not redesigned. Research
      findings, per-platform feasibility and the experiment table are in
      openspec/changes/app-networks/design.md.
    children:
