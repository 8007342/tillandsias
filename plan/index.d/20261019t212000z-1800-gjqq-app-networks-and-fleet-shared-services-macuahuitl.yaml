      3 vCPU / 1 GB — so Mesh is for the lease-holding router host, not
      floor hosts (esme, macneo). Tunnel CIDR routes "may be private or
      public"; ULA acceptance is unmeasured. The rung order (same host →
      LAN → Mesh → direct v6 WAN later) is already ruled in
