packets:
  - packet_id: macos-forge-origin-not-rewritten-to-enclave-mirror
    order: 760-w76k
    release_target: fail-loud-diagnosis-milestone
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: 'macOS forge lane has NO push channel: origin resolves to a raw git:// container name, never the authenticated enclave mirror'
    pickup_role: macos
    depends_on: []
    capability_tags:
      - macos
      - forge
      - git-mirror
      - credentials
      - fail-loud
    context: |
      Found by the first BigPickle validation run inside a freshly provisioned
      v0.4.260815.1 enclave on macOS (curl-install smoke, 739-dgk4 queue item 3,
      report plan/issues/smoke-e2e-findings-v0.4.260815.1-2026-08-16.md).

      The in-forge credential guard fail-closed BEFORE any work, exactly as
      designed post-756-2jnj:

        [check-credential-channel] TILLANDSIAS_HOST_KIND=forge but origin does
        not resolve to the enclave git mirror (effective origin:
        git://git-6no98mm4837ff0lpr5c0/tillandsias): no usable push channel.
        Fix the forge gitconfig injection or provide a forge credential
        channel; do NOT import host credentials.
        missing:no-credential-channel

      git:// is the anonymous read-only protocol and the hostname is the raw
      per-project mirror container name — so reads work (the forge cloned and
      ran) while every push is impossible. This is the macOS face of the
      fleet-wide push-wiring class: linux forges saw upstream 403s
      (756-2jnj live-403 evidence, 759-vceg/759-vsaj root-cause research:
      zero seed-time authorization validation); on macOS the gitconfig
      injection that should rewrite origin to the authenticated mirror
      transport apparently never runs or never matches, one layer before
      authorization is even consulted.

      The operator directive that surfaced it (2026-08-16): in-forge agent
      prompts must open with a push-capability short-circuit so agents stop
      before burning tokens on unrecoverable work. The short-circuit cost the
      validation run ~2 tool calls; the guard's verdict was the datum.
    exit_criteria:
      - inside a macOS-launched forge, `git remote get-url origin` resolves to the enclave mirror's authenticated transport, not a raw git:// container hostname
      - scripts/check-credential-channel.sh inside that forge returns an ok:* verdict (or the honest 756-2jnj blocked:upstream-push-unauthorized, never missing:no-credential-channel)
      - a non-mutating `timeout 30 git push --dry-run origin HEAD` reaches the mirror and reports an authorization verdict rather than failing on transport
    verifiable_closure: |
      A BigPickle smoke run on a freshly provisioned macOS enclave reports the
      credential-channel verdict ok:* in its transcript, and the run's
      MO-SMOKE line no longer carries the push-wiring FAIL.
    notes: |
      Do NOT close by importing host credentials into the guest — the guard's
      own message forbids it and 759-vsaj owns the fleet-wide seed-time
      validation design. The macOS fix is the gitconfig/remote injection step
      of forge bring-up. Coordinate with the 759 family so the two mechanisms
      (transport rewrite, authorization validation) land as one contract.

