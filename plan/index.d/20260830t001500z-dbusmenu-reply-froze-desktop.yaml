packets:
  - packet_id: dbusmenu-event-reply-type-froze-the-wayland-session
    order: 938-9yh4
    status: completed
    title: |
      Clicking the tray icon froze the whole GNOME Wayland session — our dbusmenu Event reply violated the spec and gnome-shell rejected it mid menu-grab
    kind: bug
    pickup_role: linux
    priority: p0
    desired_release: v0.5
    release_target: stable-milestone-v1
    capability_tags:
      - tray
      - linux
      - dbus
      - fail-loud
    estimated_hours: 2
    deliverable: |
      Tray menu replies are spec-exact; a click can never wedge the compositor.
    context: |
      LIVE INCIDENT, macuahuitl 2026-08-29 ~23:49Z: the operator clicked the
      Tillandsias tray icon and the entire desktop froze — input dead, session
      unrecoverable, eventually machine rebooted. Journal (the single line
      that named it): gnome-shell: 'Method "com.canonical.dbusmenu.Event"
      returned type "(ib)", but expected "()"'. Our zbus impl declared
      Event -> (i32, bool) and EventGroup -> Vec<(i32,i32,bool)>; the spec
      says Event returns NOTHING and EventGroup returns idErrors (ai).
      gnome-shell rejects a reply whose signature disagrees while holding
      the menu grab; on Wayland the shell IS the compositor, so the stuck
      grab froze all input while the system underneath ran normally
      (D-Bus Peer.Ping still answered — a false green, it is served by the
      library not the main loop; Extensions calls hung, proving the loop
      was wedged). Remediation attempted live: tray killed, all tillandsias
      containers stopped, extension teardown undeliverable, session
      terminate issued; the desktop died fully and the host was rebooted.
    exit_criteria:
      - Event replies () and EventGroup replies ai, proven by live busctl introspection, not source reading
      - the operator's next tray click opens the menu without incident (the live acceptance)
    events:
      - type: completed
        ts: "2026-08-30T00:15:00Z"
        agent_id: "linux-macuahuitl-claude-20260830t001500z"
        host: linux
        summary: |
          Fixed: event() -> fdo::Result<()> (side effects unchanged, three
          return sites), event_group() -> fdo::Result<Vec<i32>> always-empty
          idErrors with the dispatch loop preserved. Incident comment at the
          handler names the reply type as load-bearing. WIRE-VERIFIED on the
          session bus: busctl introspect shows '.Event isvu -' and
          '.EventGroup a(isvu) ai'. Residual question for a follow-up if it
          recurs: why gnome-shell's error path leaves the grab stuck (an
          upstream shell bug we can only avoid, not fix). Second criterion
          awaits the operator's next click.
