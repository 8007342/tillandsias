    context: |
      macuahuitl-fedora 2026-11-26: land run 93 evicted 19 PRs on false "conflicts"; /tmp was at 98% of 1,048,576
      inodes from ~99,000 leftover test dirs (tillandsias-test-cache-* 28.9k, tillandsias-test-msg-* 11.8k,
      tillandsias-locks-test* 9.6k, tilland-ctext-j5is* 6.2k, ...). MEASURED on yoga with a private TMPDIR outside the
      checkout (a TMPDIR under it fails 12 tests that assert the temp dir is not in the repo): one cargo test run of
      tillandsias-headless leaves 70 entries (58 tillandsias-test-cache-*, tillandsias-locks-test, tillandsias-test-msg,
      vsock-forward, pty/relay/wedge/keepalive scratch, ...); one of tillandsias-plan leaves 29 (the plan half,
      2407-aq7x). Under nextest every test is its own process, so the per-process dirs (msg, locks) leak once per test.
      This row: the headless half, and the gate check (a workspace test run under a fresh TMPDIR whose leftovers must
      be zero), which lands last.
    exit_criteria:
      - "Red first: a headless test run under a private TMPDIR leaves 70 entries; after, 0."
      - "A gate step runs the workspace tests under a fresh TMPDIR and refuses any entry left; red on trunk, green once both halves land."
