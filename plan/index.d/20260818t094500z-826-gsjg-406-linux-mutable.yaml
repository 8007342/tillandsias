      summary: |
        WHAT THIS CLOSURE DOES NOT SAY, since the packet's open question was
        phrased narrowly and the honest answer to it is "no".

        The prior progress event asked: "does `tillandsias --init` produce an
        inference container with tier=gpu-cuda and a CUDA runner? One stack
        launch answers it." Measured: `--init` produces NO inference container
        at all. It builds images and bootstraps Vault; the stack inference
        container is brought up later, by the orchestration or by a lane. So
        the literal question answers no, and the DELIVERABLE — which asks for a
        running container with passthrough and serving — is what is satisfied.

        I also did not catch the container during an orchestration run. That
        script spawns inference and tears the whole stack down thirteen seconds
        later by design, faster than a five-second poll. What I measured is the
        same image launched with the args the fixed script now produces, and
        the tier came from the script's own probe path run verbatim. That is a
        reconstruction, not an interception, and it is worth saying so.

        "A warm default model" is the one clause I am reading generously:
        models are present in the host-bind cache and served by the API. I did
        not verify that any model is resident in VRAM, which is what "warm"
        could be taken to mean.
