    order: 826-gsjg
    status: completed
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "scripts/orchestrate-enclave.sh passed no --device and no tier to the inference container, so a stack brought up by it ran CPU-only on the GPU host and said nothing"
    deliverable: "the orchestration attaches the CDI device and exports the tier exactly when the product would, and not on hosts that have no CDI"
    pickup_role: any
    release_target: forge-local-experts-milestone
    capability_tags: [inference, gpu, cuda, enclave-runtime]
    estimated_hours: 2
    context: |
      OBSERVED 2026-08-18, while finishing 406 after the destructive e2e. The
      fourth instance of the 825-uxzu pattern in the same script.

      The product's `build_inference_run_args` extends the args with
      `--device nvidia.com/gpu=all` (main.rs:4201), exports
      `TILLANDSIAS_INFERENCE_TIER={effective_tier}`, and pins the backend
      environment via engine_slots::pin_backend_environment. A source-window
      test at :15305-15308 asserts the function contains `nvidia.com/gpu=all`,
      so this is a pinned invariant and not an accident.

      scripts/orchestrate-enclave.sh passed NEITHER. Its `inference_env_args`
      array only ever received TILLANDSIAS_INFERENCE_SKIP_RUNTIME_PULLS in
      status-check mode. A stack brought up through this script on a host with
      an RTX A5000 therefore ran ollama on the CPU, with no error and no
      warning — the ordinary silent-degradation shape.

      FIXED by reusing the resolution the dev endpoint already uses
      (scripts/dev-inference-ensure.sh), rather than inventing a second one:
      run nvidia-cdi-ensure.sh (idempotent), ask the PRODUCT for the tier via
      `tillandsias --capabilities` -> legacy_tier, default cpu on an absent
      binary or any unreadable answer, export the tier always, and attach
      `--device=nvidia.com/gpu=all` only when the tier is gpu-cuda.

      THE CONDITIONAL IS THE POINT, not caution for its own sake. The fleet is
      about to gain two 4-core low-end hosts, an 8GB twelve-year-old laptop and
      a MacNeo; on a host with no CDI spec, an unconditional --device is a hard
      container-start failure, which is a worse bug than the one being fixed.

      VERIFIED on this host: the probe resolves `gpu-cuda`, and the STACK image
      launched with those exact args reports
        inference compute id=0 library=CUDA compute=8.6 name=CUDA0
        description="NVIDIA RTX A5000" libdirs=ollama,cuda_v13 driver=13.3
        type=discrete total="23.5 GiB" available="22.1 GiB"
      and serves /api/tags. Orchestration end to end: "Orchestration complete",
      exit 0.
