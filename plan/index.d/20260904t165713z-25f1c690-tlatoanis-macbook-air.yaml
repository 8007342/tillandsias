        with a warning that names the consequence rather than the error. READ-ONLY
        because the guest installs FROM the directory and never writes back — the share
        cannot be the path by which a guest corrupts the host's staged artifact.

        WHY NOT config::state_dir(): it resolves to ~/Library/Logs/tillandsias on
