      refs/tags/stable peels to 341ab0010 (v0.4.260826.1, 2026-08-25) while the latest non-prerelease release is v56.9.2.1 at d6d3e3ed9 (2026-09-02); promote-stable.sh's step 3 moves the annotated stable tag to the release commit, so either the step failed silently on that promotion or the promotion bypassed the script, and nothing checks that the tag and the release page agree
    context: |
      FOUND by the operator's tillandsias.org session (calmecacpilli) on 2026-09-05T06:3xZ while pinning
      the site's "stable" definition: the site derives stable from /releases/latest and only warns on the
      disagreement. VERIFIED by the coordinator over git: `git rev-parse 'stable^{}'` = 341ab0010, an
      ancestor of main and of v56.9.2.1, tagged v0.4.260826.1; `git rev-parse 'v56.9.2.1^{}'` =
      d6d3e3ed9; the stable tagger date is 2026-08-25 20:31 -0700. Consumers of the tag inside the tree:
      only scripts/promote-stable.sh and its evidence-gate test; the install scripts resolve releases by
      version or by /releases/latest, so no install path is broken by it. It is a public claim that
      disagrees with the release page, and the next promotion will inherit whichever mechanism skipped it.
      Fix shape: (a) promote-stable.sh verifies after step 3 that `stable^{}` equals the promoted
      release's commit and refuses to report success otherwise; (b) a cheap check (release-preflight or
      the daily) compares the tag to /releases/latest and names the disagreement; (c) the tag itself is
      moved to d6d3e3ed9 by the operator or on the operator's word (a public, force-pushed tag move is not
      the coordinator's to make unasked; it is in the operator queue).
