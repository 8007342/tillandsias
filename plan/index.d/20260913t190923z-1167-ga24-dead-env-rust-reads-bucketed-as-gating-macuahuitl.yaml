    title: |
      check-dead-env-branches: Rust env::var reads are bucketed as gating regardless of their default
    context: |
      Requires a Rust-side grammar, not a deletion or a comment. Verified in source: the gating pass runs 'grep -rhoE 'env::var\(&?"TILLANDSIAS_[A-Z0-9_]+'' unconditionally, with no counterpart to the shell '${VAR:-nonempty}' tunable exclusion the script's own comment block declares as policy ('TUNABLES ARE NOT DEAD BRANCHES'). Any Rust read followed by '.unwrap_or(...)'/'.unwrap_or_else(...)' carrying a nonempty default is therefore reported dead even when the shell twin with the same default is spared, producing three false positives in one bundle.

