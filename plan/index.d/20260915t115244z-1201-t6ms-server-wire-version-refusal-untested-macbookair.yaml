    verifiable_closure: |
      cargo test -p tillandsias-headless --lib passes a new test that drives
      serve_ready_stream with a Hello carrying WIRE_VERSION + 1 and asserts the
      server CLOSES without sending a HelloAck — with a MUTATION ARM proving the
