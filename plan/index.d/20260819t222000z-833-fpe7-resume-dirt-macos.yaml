    context: |
      ENCOUNTERED LIVE 2026-08-19 at the top of this cycle, on osx-next.

      The worktree was dirty in three tracked paths: build.sh,
      crates/tillandsias-headless/src/tray/mod.rs, scripts/local-ci.sh.
      Start Of Cycle step 3 says to treat every status-visible dirty path as
      immutable sibling/operator work and refuse. Applied literally that was
      the verdict, and it was wrong — the evidence saying so was already on
      disk:

        * HEAD was 7fde0770d, `claim(829-g4xf,831-wmn4): tlatoanis-macbook-air`,
          authored by THIS host at 17:46:01Z.
        * Its two fragments set exactly those two packets to in_progress.
        * The dirty files' mtimes (18:06:38Z, 19:47:46Z) fall AFTER the claim.
        * The diff hunks name their own orders in their comments.
        * check-stranded-in-progress.sh reported `in_progress=2 stranded=2`,
          naming the same two orders.

      So the dirt was this host's own claimed work, complete but uncommitted,
      left behind when the previous cycle was interrupted between implement
      and commit.

      WHY THE REFUSAL DEGRADES INTO A DEADLOCK. It is designed as a safety
      pause: stop, hand the condition to a human, lose nothing. That holds
      when a human is watching. In the unattended loop this skill actually
      runs in (./repeat --prompt "Use the /meta-orchestration skill") nothing
      clears the condition, so:

        1. every later cycle re-reads the same tree and refuses identically;
        2. the finished work never lands, surviving only as long as the
           worktree does;
        3. the packets stay in_progress — invisible to `ready` queries AND to
           burndown, the double-invisibility of 641-e2qa;
        4. expire-claims (672-bz7u) eventually releases the CLAIM after 24h
           and does nothing about the uncommitted DIFF, so the work is now
           unclaimed AND unlanded, and the next host reimplements it.

      Step 4 is 814-iyu7's duplicated-work shape arriving by a second route.
      A safety pause no cycle can discharge is not a pause; it is a permanent
      stall that also launders finished work into lost work.

      THE PRECEDENT THIS IS MISSING. Order 540 solved this shape once already.
      Launch-generated opsx artifacts dirtied every forge checkout, and the fix
      was not to relax the refusal — it was check-opsx-generated-dirt.sh, a
      deterministic detector that classifies one known dirt class as intended
      content, prints one line of falsifiable grammar, and lets the cycle
      commit and re-anchor with the guard's re-snapshot mode. Anything outside
      the class still refuses, unchanged. What is missing is the analogous
      detector for the second known dirt class: this host's own in-flight
      claimed work.

      SHAPE OF THE FIX, not prescribed beyond the grammar.
      scripts/check-resumable-claim-dirt.sh printing exactly one line matching

        ^(resumable:<order>(,<order>)*|ok:clean-tree|unattributable:.*)$

      exiting 0 only when ALL hold: every dirty path is TRACKED (an untracked
      file is not attributable to a claim and must still refuse); the folded
      ledger reports >=1 packet in_progress whose claim event's host is this
      host; every dirty path's mtime is after that claim event's ts; and the
      claim is younger than the expire-claims TTL.

      THE VERDICT MUST STOP AT `resumable:` — "safe for this cycle to review
      and land" — and must NOT be `auto-commit`. Proving that an edit
      IMPLEMENTS the packet it sits beside is an agent judgment, not a machine
      fact, and a detector claiming otherwise would be the order-531 shape: a
      truthful-sounding state attached to the wrong artifact. What the detector
      removes is the deadlock, not the review.

      VERIFIABLE CLOSURE: litmus:resumable-claim-dirt-shape pins the grammar
      and exit codes, over hermetic fixtures — clean tree; untracked file
      present (must refuse); dirty path older than the claim (must refuse); no
      live claim by this host (must refuse); claim past TTL (must refuse); and
      the resumable case (must pass, naming both orders). The negative controls
      are the point: a detector that only ever says `resumable:` is the
      deadlock with extra steps.

      DISPOSITION THIS CYCLE: resumed under the evidence above and landed as
      66a85ead6, then the boundary was re-anchored with re-snapshot — the same
      sequence order 540 sanctions for its own dirt class. Recorded in
      plan/issues/enhancement/dirty-start-refusal-has-no-resume-path-2026-08-19.md
      so the next reader sees the refusal was overridden deliberately, on named
      evidence, rather than skipped.
