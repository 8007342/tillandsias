      - 'the cost of the telemetry readers tracks the DELTA rather than the history, or the corpus is bounded, so the pass does not decay again as the fleet works — a raised number that re-fails later is not a closure'
      - 'every budget in the tree that reads a growing corpus is identified, and the ones left unchanged are NAMED with the reason — an unnamed sibling is the one that fires next'
      - 'NEGATIVE CONTROL: a genuinely hung or genuinely wrong producer is still killed and still reds; making room for a slow correct step must not make room for a broken one'
      - 'each recalibrated budget records the REGIME its number came from (corpus size, host, and whether the reading was taken under gate load), since a quiet-host reading of a step that only runs inside a gate is wrong twice over'
