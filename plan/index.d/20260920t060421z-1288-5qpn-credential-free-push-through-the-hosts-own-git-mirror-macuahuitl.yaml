    verifiable_closure: |
      litmus:credential-free-push-through-local-mirror passes on a Linux host
      with four arms: (1) with NO GitHub credential in the host's keyring or
      git credential store (`git credential fill` for github.com answers
      nothing; gnome-keyring holds no gh token), `git push` of a plan-only
      commit from the checkout lands on origin/linux-next within the relay
      window, and the host-to-mirror hop ran scripts/hooks/pre-push-local-gate.sh
      (its verdict line appears in the push output) whatever the remote is
      named; (2) the relay's credential is read from Vault ONCE at the mirror
      service's start (the Vault audit log shows one read per boot, the
      keyring journal shows zero secret-service property reads across 50
      pushes); (3) a relay that cannot reach GitHub, or that relays only part
      of a refspec, FAILS the host's push with a named `blocked:relay:<reason>`
      line and never falls back to a direct push (mutation arm: point the
      relay at an unreachable remote and require the host push to fail);
      (4) `tillandsias --github-status` prints what Vault holds (credential
      kind, scopes, expiry, last successful relay time),
      `tillandsias --github-logout` revokes then clears then proves cold, and
      `tillandsias --github-refresh` re-mints without a device flow (which
      implies a GitHub App installation token; a fine-grained PAT cannot be
      refreshed, and the row must say which it chose). PRE-FIX RESULT: FAILS
      on every arm — today every push shells out to gh (credential.https://github.com.helper
      = !gh auth git-credential after `gh auth setup-git`), gh reads the
      keyring, and gnome-keyring 50 aborts on a lazy-registration race
      (GNOME gnome-keyring #195; five aborts on lenovinha and one on macuahuitl
      on 2026-09-19); `--github-login` is the only lifecycle flag in the tree.
      NEGATIVE CONTROL: a host configured to hold its own token (no delegated
      mode declared) with no token still reads missing:no-credential-channel.
    title: |
      every host pushes credential-free through its own tillandsias git mirror, which relays to GitHub with a Vault-held credential read once per boot, and the binary gains --github-status, --github-logout and --github-refresh
    context: |
      Operator ruling 2026-09-20, discussed with lenovinha and the coordinator:
      "we could merely use our tillandsias git mirror ourselves, becoming our
      own dogfooders, and have our keyring be read only once at start (vs
      thousands of times throughout), and keep our pushes credential free …
      we should probably do all of this through tillandsias binary and command
      line arguments, to start --github-logout, --github-status,
      --github-refresh … most hosts can wire their own git mirror near
      trivially." lenovinha's design summary is the owned issue file: the
      vault container, git-credential-tillandsias.sh answering from it
      (1118-bscs), relay-refs.sh with its refspec-injection and staleness
      guards, and the Vault Agent auto-auth all exist; it is a wiring job.
      Rulings already made by the coordinator: the credential guard gains a
      DECLARED delegated mode (ok:mirror-reachable / blocked:mirror-unreachable;
      missing:no-credential-channel stays for a host configured to hold a token
      that does not; the mode comes from the host's config, never inferred from
      a missing token); the relay and hooks are transparent, atomic and fail
      hard. Costs the row must keep visible: a container on the push path
      (lenovinha's vault had been Exited (143) for three days unnoticed, which
      is the new failure shape and needs --github-status to make it visible),
      and this is not a keyring escape (Vault's unseal is keychain-anchored:
      one read per boot). The keyring path stays wired as the failsafe with its
      fixtures intact. A per-host SSH deploy key for the mirror-to-GitHub hop is
      the composable alternative to a shared token and may be chosen here.
      Related: 1025-a896 (device-flow ban), 1188-vixu (partial clear exits
      zero), 1189-2ra5 (the discriminator the probe removal nearly undid),
      1265-8qr6 (the crash row), 900-z3kv.
    next_action: >
      lenovinha first, on their own host: revive the dormant vault, wire the
      checkout's push remote to the local mirror with the relay to GitHub,
      declare the delegated mode, and prove arms 1-3 on real pushes before
      touching the lifecycle flags; then the flags in the headless binary with
      the App-versus-PAT choice written down; then the litmus. Every other
      Linux host repeats the wiring from the written recipe; macOS and Windows
      follow once the recipe is proven. The fleet-shared mirror on a
      Raspberry Pi 5 is a separate row and NOT a prerequisite.
