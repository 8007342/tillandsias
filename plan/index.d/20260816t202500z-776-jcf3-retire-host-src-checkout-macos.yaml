packets:
  - packet_id: retire-host-src-checkout-behind-proven-transparent-push
    order: 776-jcf3
    release_target: stable-milestone-v1
    status: ready
    desired_release: v0.5
    priority: p1
    kind: coordination+verification
    title: 'Retire ~/src/<project> fleet-wide: cloud<->ephemeral-mirror<->ephemeral-forge only — gated on PER-HOST proof that the mirror pushes transparently (all forge changes die with the container otherwise)'
    pickup_role: any
    depends_on: []
    capability_tags:
      - forge
      - git-mirror
      - coordination
      - all-platforms
    context: |
      OPERATOR DIRECTIVE (2026-08-16, in-session on macOS): the fleet is
      moving to a truly idempotent/ephemeral path — cloud <-> ephemeral
      git-mirror <-> ephemeral forge — and the host ~/src/<project> checkout
      is to be REMOVED and never touched again. The hard constraint the
      operator names: every forge change is LOST on container shutdown, so
      the mirror's transparent push must be PROVEN on each host before the
      historical recovery path (~/src, "from where we've been digging lost
      work") is deleted.

      PROOF STATE at filing:
        - macOS: **PROVEN** — 349's closing run (2026-08-16, evidence
          plan/issues/macos-forge-349-closing-run-2026-08-16.md): a real
          in-forge push relayed through the mirror to the actual GitHub
          repo, verified upstream host-side, then cleaned. Fetch + TLS
          parity green. Mirror pre-receive denies ref deletion (by design;
          cleanup is host-side).
        - linux: **BLOCKED-403** — their own e2e halted at gate 1 on a live
          upstream 403 (770-dyqr / 771-wwzi, 759 family: seed-time
          authorization validation). Push NOT proven.
        - windows: **UNPROVEN** — no recorded real-push evidence; their
          736-28m7/738-3pft attestation thread is adjacent but is about
          test attestations, not mirror push.

      Also inherited from 763-munc (obsoleted by the same ruling): auto-ff
      of ~/src is ruled OUT (never write it); the launch-time seed-staleness
      verdict stays as transitional observability until removal.
    exit_criteria:
      - a real, reversible in-forge push through the mirror reaches upstream and is verified from outside the enclave on EACH of linux and windows (macOS evidence stands)
      - the loss-on-shutdown window is stated and bounded in the runbook (what happens to committed-but-unpushed work when a lane dies — the mirror holds it? for how long? the answer is written down, not assumed)
      - the launcher path drops the ~/src dependency (seed branch, gitconfig origin resolution, forge project mount) in favor of the mirror-only path, behind a flag or cutover plan the operator approves
      - ~/src/<project> removal is an operator-executed final step, never automated
    verifiable_closure: |
      A forge launched on a host with NO ~/src/<project> present completes a
      full cycle (clone from mirror, commit, push, verified upstream) on all
      three platforms.
    notes: |
      Unit-level testing only where real accounts would be needed (operator:
      only one GitHub account exists, and it has repos — no zero-repo or
      scratch accounts will ever be available). Scratch BRANCHES on the real
      repo, verified-then-deleted host-side, are the sanctioned real-push
      proof shape (the 349 pattern).

