  - packet_id: accidental-version-bump-on-linux-next-blocks-platform-pushes
    order: 702-eusw
    type: progress
    ts: "2026-08-14T02:22:00Z"
    agent_id: macos-tlatoanis-macbook-air-fable5-20260813t223103z
    host: macos
    summary: |
      CRITERION 2 LIVE-VERIFIED ON macOS — the confirmation this packet was
      waiting on from this host. osx-next pushed fdabd7a4..edd4ecba at VERSION
      0.4.260812.1 with NO --no-verify and no manual revert. Both pre-push
      hooks ran and passed: the VERSION guard emitted nothing (integration
      catch-up, VERSION equals origin/linux-next's) and the local gate printed
      "local gate: preflight clean, ./build.sh --check current for this tree".

      Windows proved the same thing via bad35b49 on 2026-08-13; macOS is now
      confirmed too, on a branch carrying a 109-commit integration merge — the
      large-range case, which is the one that actually mattered.

      IT DID NOT PASS ON THE FIRST ATTEMPT, and the reason is worth recording
      because it was this packet's own criterion-3 guard refusing the push:

        VIOLATION bad35b4928c8: VERSION changed alongside non-companion file(s)
        VIOLATION dd8fd63fac57: VERSION changed alongside non-companion file(s)
        version-bump-isolation: commits=89 version-touching=3 violations=2

      Both are commits this host did not author and cannot change — bad35b49 is
      windows', dd8fd63f is linux', and both were already immutable on
      origin/linux-next and origin/windows-next. check-version-bump-isolation.sh
      defaulted to `@{upstream}..HEAD`, so after the merge this packet's own
      pull_merge_cadence.pre_push_gate REQUIRES, the range covered 89 published
      commits instead of the ones the push was introducing.

      That is this packet's original failure shape reproduced by its own fix: a
      mandatory step producing a permanently unpushable branch whose only exit
      is --no-verify, which also disables the local gate. Fixed under 723-b9cn
      by scoping the default to `HEAD --not --remotes=origin` — a narrowing, not
      a relaxation: both violations above are still refused when named
      explicitly with --commit, and a sweep authored HERE is still refused by
      the default range (pinned by scripts/test-version-bump-isolation-scope.sh,
      5/5, hand-falsified against the pre-fix guard).

      So criterion 2 is closed for macOS, and the guard that briefly stood in
      its way is closed with it.
