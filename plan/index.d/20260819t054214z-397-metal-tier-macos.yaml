      summary: |
        CLAIMED, ASSESSED, AND RELEASED BACK TO ready — not implemented, and
        the reason is structural rather than a matter of effort.

        THE PACKET'S DELIVERABLE IS "images/inference tier lanes + backend seam
        + tier litmus per host class". For cuda, rocm and cpu that is exactly
        right: three container variants, all running on the same side of the
        VM boundary as the workload. FOR THE APPLE-SILICON TIER IT IS NOT
        EXECUTABLE AS WRITTEN, because that tier's accelerator is structurally
        unavailable to any container, and this repo already says so in two
        places that were written before this assessment:

          accel_probe.rs:346 — "PROBE-7: macOS Metal is host-native ONLY,
          container MUST NOT appear", emitting lanes: ["host-native"] with the
          container lane deliberately absent, and pinned by
          test_macos_metal_lane_isolation at :1146.

        The inference container is started by tillandsias-headless, which is
        the IN-VM service (vz.rs:679). A Linux guest under
        Virtualization.framework has no Metal. So on this host the accelerator
        and the workload are on opposite sides of the VM boundary — and
        measured today, THERE IS NO TRANSPORT BETWEEN THEM: VZVirtioSocketListener
        and setSocketListener appear nowhere in the tree, and
        transport_macos.rs implements host->guest only (:357). The host never
        listens.

        WHAT IS ALREADY BUILT, so the re-slice is smaller than it sounds: the
        backend seam 397 asks for partly EXISTS. engine_slots.rs:8 defines
        `EngineKind::{Ollama, LlamaServer}` with SLOT-3 governance — "Ollama
        MUST remain the default engine until llama-server lane records smoke
        evidence" (:38) — plus validate_slot_registration and
        pin_backend_environment. The missing piece is not the ABSTRACTION over
        backends, it is the PLACEMENT of one: llama-server is modelled as an
        engine kind inside the enclave, and the Metal one cannot be there.

        Filed 830-xsk2 for the transport half (host vsock listener + the
        in-guest hop that keeps `inference:11434` answering while the process
        behind it lives on the host). 397's own transparency criterion —
        "tier switch requires zero agent-side config change" — is what forces
        both halves: agents address a stable enclave DNS name
        (container_profile.rs:392), so moving the process without moving the
        name is the entire requirement.

        WHY I RELEASED THE CLAIM RATHER THAN HOLDING IT: 397's first exit
        criterion needs the expert query set to pass on a non-GPU tier, and
        this host cannot reach that state until 830-xsk2 exists. Holding
        in_progress on it would park a p1 that another host can still advance
        on the cuda/rocm/cpu side, which is precisely the stranding
        `expire-claims` exists to prevent.

