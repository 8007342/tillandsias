# Filed by macos (osx-next), 2026-08-19T05:42:14Z.
#
# 397's Apple-silicon tier is not a container lane and cannot be one. Files the
# enabling plumbing that has to exist before "transparently" means anything,
# and returns 397 to ready rather than holding a claim on work this host
# cannot finish.
packets:
  - packet_id: macos-guest-cannot-reach-a-host-native-service
    order: 830-xsk2
    status: ready
    desired_release: v0.5
    priority: p1
    kind: enhancement
    title: "the macOS vsock transport is host->guest ONLY — the host never listens, so no in-guest workload can reach a host-native service, which is exactly what an Apple-silicon Metal inference lane requires"
    deliverable: "a host-side vsock listener plus the in-guest hop that lets `inference:11434` resolve to a process running on the macOS host"
    depends_on: []
    pickup_role: macos
    release_target: forge-local-experts-milestone
    capability_tags: [macos, vz, vsock, inference, metal, transport]
    estimated_hours: 8
    context: |
      MEASURED 2026-08-19 on osx-next while assessing order 397.

      `VZVirtioSocketListener` and `setSocketListener` appear NOWHERE in the
      tree. crates/tillandsias-vm-layer/src/transport_macos.rs implements one
      direction only — "connect into the running VM's vsock listener on
      `port`" (:357). The guest listens (tillandsias-headless
      --listen-vsock 42420, vz.rs:698); the host connects. There is no reverse
      path and nothing on the host is reachable from inside the VM.

      WHY THIS BLOCKS THE METAL TIER, and the chain is short and each link is
      pinned in the tree:
        1. Metal on macOS is HOST-NATIVE ONLY. accel_probe.rs:346 says so in
           as many words — "PROBE-7: macOS Metal is host-native ONLY, container
           MUST NOT appear" — and emits lanes: ["host-native"] with no
           "container" entry. Pinned by test_macos_metal_lane_isolation
           (:1146), which asserts the container lane is absent.
        2. The inference container runs INSIDE the Linux guest. It is started
           by tillandsias-headless (main.rs build_inference_run_args), and that
           binary is the in-VM service — vz.rs:679, "Tillandsias headless
           (in-VM vsock control wire)".
        3. A Linux guest under Virtualization.framework has no Metal.

      So the accelerator is on one side of the VM boundary and the workload is
      on the other, and there is no transport between them. That is the whole
      problem, and it is a TRANSPORT problem, not an inference one — which is
      why it is filed separately rather than inside 397.

      WHAT MAKES IT NON-TRIVIAL: agents address inference by a stable enclave
      DNS name, `http://inference:11434` (container_profile.rs:392,
      main.rs:4185), resolved inside the guest's podman network. "Transparent"
      in 397 means that name keeps working while the process behind it moves
      to the host. So this needs both halves — a host listener AND an in-guest
      endpoint that answers to `inference:11434` and forwards over vsock —
      or the transparency criterion is not met no matter what backend runs.

      NOT A BLOCKER FOR THE OTHER TIERS. cuda, rocm and cpu are all Linux
      containers on the same side of the boundary as the workload; 397 is
      executable for them today and this packet does not gate that.

