      summary: |
        IMPLEMENTED on macbookair (Apple M5, macOS 25.6.0), in crates/tillandsias-headless/src/accel_probe.rs. Cited by symbol.

        THE DENY-LIST WAS NOT EXTENDED, and that is the substance of this row. `hardware_fingerprint` refused placeholders by naming the ones someone had already tripped over — `d.name != "Host CPU" && d.name != "unknown"`, written from the Windows defect 805-r98w — so `Apple Silicon CPU`, a placeholder from a different arm, passed a check whose entire purpose is to catch placeholders. Adding a third literal would have inherited the same shape and the next platform arm would add a fourth.

        Instead the probe SAYS which it emitted. New `name_source: Option<String>` on DeviceRecord, "measured" | "placeholder", following `memory_bandwidth_source` two fields up and the same move as `is_battery_present: Option<bool>` from 803-r8u4: make the absent case expressible rather than inferring it from a value that cannot carry it. The fingerprint now asks the field, and falls back to the deny-list ONLY for `name_source: None` — a document filed before the field says nothing about provenance, and treating that silence as "placeholder" would make every stored document in the fleet unidentifiable the day this lands, which is a correctness change that reads as an outage.

        macOS now reads the real part: new `macos_cpu_brand()` reads `machdep.cpu.brand_string`. MEASURED here: `Apple M5`. A failed query KEEPS the family literal and leaves name_source at "placeholder", so the absent case stays distinguishable from a measured one.

        THE GPU IS DELIBERATELY NOT FIXED, and is labelled honestly. "Apple Metal GPU" is still a family literal — naming a real Metal device needs a framework call rather than a sysctl, which is a larger change than this row. What it now carries is `name_source: "placeholder"`, so the fingerprint's gpu component is known to discriminate nothing instead of silently appearing to.

        LIVE EFFECT, this host:
          before  cpu name 'Apple Silicon CPU'  fingerprint hw2-d1ec0bba772d4bda
          after   cpu name 'Apple M5' (measured), gpu 'Apple Metal GPU' (placeholder), fingerprint hw2-487ff08ecf112e9b
        The fingerprint MOVED, which is the whole point: it was previously byte-identical across every Apple silicon Mac with the same core count, so `capability-matrix --by-hardware` could merge two machines it never measured. Capability row republished; the fragment's fingerprint and this host's binary agree (hw2-487ff08ecf112e9b both), per the stale-artifact rule from 803-r8u4 — release built BEFORE publishing.

        GUARDS, both falsified, one test selected per run (519 filtered out):
          macos_cpu_name_is_the_real_part_not_a_family_placeholder (cfg macos) asserts the record equals an independently-read brand_string rather than a pinned "Apple M5" — pinning the string would red on every other Mac for being a different correct machine. Reverting the arm to the literal: FAILED, "the record must carry the measured part name, not a family literal".
          a_declared_placeholder_is_refused_however_plausible_the_name runs on EVERY host: a device named "Apple M5" but declared placeholder must be refused, the same document measured must be accepted, and a None-provenance "Host CPU" must still be refused by the old path. Making the fingerprint ignore provenance: FAILED, "a declared placeholder must be refused even when the string looks like a real part".
        The second falsification is the one that matters — it demonstrates the deny-list alone cannot do this job, which is this packet's thesis rather than my assertion.

        517 passed, 0 failed, 1 ignored under the default feature set. clippy --all-targets 0 warnings. cargo fmt --check clean.

        FOUND WHILE DOING THIS, NOT CAUSED BY IT: the suite has a pre-existing 1-in-15 flake, `the_input_overrides_the_derived_name_and_is_normalised`, from two tests mutating one process-global env var in parallel threads. It first appeared under my change and the obvious reading was that I had caused it; stashing the change and running the pristine suite 15 times reproduced it at 1/15. Filed as 1146-z8ux with the mechanism and the measured rate. My change perturbs the timing; the sample is too small to claim it worsens the rate, and I have said so on that row rather than quantifying a number I cannot support.
