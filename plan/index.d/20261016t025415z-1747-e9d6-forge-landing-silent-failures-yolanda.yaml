  - packet_id: forges-in-the-macos-and-windows-vm-get-an-empty-lane-mcp-socket-dir-because-the-guest-binary-is-built-without-the-tray-feature-that-holds-the-listener
    event:
      type: note
      ts: "2026-10-16T02:54:15Z"
      agent_id: tillandsias-87@yolanda
      summary: |-
        The host-browser.sh error text misleads. It tests [[ -e "$TILLANDSIAS_CONTROL_SOCKET" ]], which is false on EACCES as well as ENOENT, so a forge that may not traverse a root 0700 lane dir reports "TILLANDSIAS_CONTROL_SOCKET does not exist". The fix should distinguish the two (e.g. test the parent dir with [[ -x ]] and say "permission denied: <dir> is <owner> <mode>, forge uid <n>"). Full timeline: plan/issues/forge-landing-silent-failures-yolanda-2026-10-16.md.
