  - packet_id: every-forge-lane-installs-every-agent-harness-so-a-claude-lane-downloads-codex-and-antigravity-on-each-launch
    order: 1747-qc4d
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [harness, antigravity, codex, forge-launch, performance, disk]
    estimated_hours: 2
    related: [1747-nghx, 1678-62p7, 1496-x76p]
    title: |
      ensure_forge_harnesses (images/default/lib-common.sh) refreshes EVERY harness on EVERY lane: a Claude lane npm-installs @openai/codex (411 MB) and runs the Antigravity installer for agy (208 MB) on each launch. The operator expects a lane to install only its own harness. The extra work also held the npm update lock, and the Claude lane's foreground path waited 18 s on it for openspec.
    context: |
      MEASURED 2026-10-16, forge-tillandsias on yolanda (56.10.16.1), TILLANDSIAS_AGENT=claude:
      - lifecycle log: "tools | agy install attempt 1/3" ... "Antigravity CLI installed successfully at /home/forge/.local/bin/agy" ... "harness | agent harnesses up to date".
      - ~/.local/bin/agy (208 MB) mtime 02:40:17Z; $NPM_CONFIG_PREFIX/bin/codex -> @openai/codex (411 MB) at 02:40:10Z.
      - "harness | openspec not visible while updater lock held — waiting for sibling npm update" ... "openspec appeared after 18s (sibling updater)".
      - agy --version in this forge -> 1.3.6, rc=0 (the binary runs).
      HISTORY: this is the documented contract, not a recent regression. ef9520dc8 (2026-07-21, "fix(forge): refresh all harnesses on every launch", order 181) wrote "the launch contract is that every ephemeral forge launch attempts to refresh all harnesses", and added require_antigravity to that loop. The recent Antigravity changes (cbf2b396c, 2026-10-14) did not introduce it. The operator ruling it conflicts with (one harness per lane) needs confirming before the fix.
      The Antigravity installer is fetched from https://antigravity.google/cli/install.sh and run on every launch with no checksum or pin (order 307 chose download-then-run over curl|bash, but nothing verifies the script).
    exit_criteria:
      - 'operator ruling recorded: a lane installs only its own harness (plus openspec), or the all-harness contract stays'
      - 'if one-per-lane: a Claude lane launch neither runs the agy installer nor npm-installs @openai/codex; a test drives ensure_forge_harnesses with TILLANDSIAS_AGENT=claude and stub installers and fails if another harness installer runs (mutation shown); red on f25d7c610'
      - 'the --agy-login container (provider-device-auth.sh) still installs agy on demand'
    unscoreable: "unpinnable-until-the-guard-exists: the future litmus is scripts/test-forge-lane-installs-only-its-harness.sh, written in the same commit as the fix"
    next_action: >
      Ask the operator to rule (one harness per lane vs. all). Then gate the codex npm refresh and require_antigravity in ensure_forge_harnesses on TILLANDSIAS_AGENT.
    events:
      - type: filed
        ts: "2026-10-16T02:54:15Z"
        host: yolanda
        summary: |-
          A Claude lane installed Codex (411 MB) and Antigravity (208 MB) at launch; the all-harness refresh is the July contract, which the operator now expects to be one harness per lane.

