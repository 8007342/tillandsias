packets:
  - packet_id: forge-launch-embed-endpoint-probe-fails-silently-and-is-never-retried-so-spec-answer-is-dead-for-the-whole-session-while-inference-is-ready
    order: 1747-e9d6
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [experts, spec-index, embed, inference, forge-launch, silent-failure]
    estimated_hours: 2
    related: [712-r5x8, 919-vvyv, 964-fwvh, 967-xq5e, 1746-4q34]
    title: |
      A cold forge launch leaves TILLANDSIAS_EMBED_ENDPOINT unset even though the enclave inference service is ready, so the spec index is skipped ("[spec-index] skipped (no-embed-endpoint)") and spec_answer refuses for the whole session. lib-common.sh calls resolve_embed_endpoint with ">/dev/null 2>&1", so the probe's verdict (why it failed) is never logged, and nothing retries it when the spec-index step runs 3 minutes later.
    context: |
      MEASURED 2026-10-16, forge-tillandsias on yolanda (56.10.16.1, cpu-only):
      - startup context at 02:40Z: inference_state=ready, warm=nomic-embed-text:latest,qwen2.5:0.5b; capability line: spec_index=absent embed_endpoint=unset.
      - lifecycle log after the expert build (02:42:35Z): "[spec-index] skipped (no-embed-endpoint): TILLANDSIAS_EMBED_ENDPOINT is unset — spec_answer keeps its typed refusal (712-r5x8)".
      - spec_answer at ~02:51Z: "unsupported: the spec RAG index is not built at …/spec-index … publishes no 'current' pointer".
      - By hand at ~02:52Z: curl -m 3 http://inference:11434/v1/models -> 200 in 29 ms; resolve_embed_endpoint -> ok:embed-endpoint:derived:http://inference:11434/v1.
      Most likely the launch probe ran before inference answered (3 s ceiling). The verdict was discarded, so this cannot be confirmed. Either way, it is a race with no retry.
    exit_criteria:
      - 'the spec-index launch step re-runs resolve_embed_endpoint when TILLANDSIAS_EMBED_ENDPOINT is unset, and logs the verdict line (ok:/skip:) in /tmp/forge-lifecycle.log; red on f25d7c610'
      - 'a test with an inference stub that answers only after the first probe shows the index step still derives the endpoint (mutation: drop the re-probe and the test fails)'
      - 'the startup context names the embed verdict reason, not only embed_endpoint=unset'
    unscoreable: "unpinnable-until-the-guard-exists: the future litmus is scripts/test-spec-index-step-reprobes-embed-endpoint.sh, written in the same commit as the fix"
    next_action: >
      In images/default/lib-common.sh, stop discarding resolve_embed_endpoint's verdict, and call it again from the spec-index step before the no-embed-endpoint skip.
    events:
      - type: filed
        ts: "2026-10-16T02:54:15Z"
        host: yolanda
        summary: |-
          spec_answer is permanently dead in a cold forge whose inference service is ready: the launch embed probe fails silently and is never retried.

  - packet_id: forge-hot-paths-cheatsheet-copy-fails-on-preserving-times-and-only-the-lifecycle-log-knows
    order: 1747-we43
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [cheatsheets, forge-launch, silent-failure, startup-context]
    estimated_hours: 1
    related: [1747-e9d6]
    title: |
      At every forge launch on yolanda, the first lifecycle line after pull-cache is "hot-paths | FAILED: cp /opt/cheatsheets-image/. -> /opt/cheatsheets/ (cp=1): cp: preserving times for '/opt/cheatsheets/.': Operation not permitted". The failure appears nowhere the agent reads (.forge-startup-context.md has no line for it), so whether /opt/cheatsheets is complete is unknown to the agent.
    context: |
      MEASURED 2026-10-16, forge-tillandsias on yolanda (56.10.16.1), /tmp/forge-lifecycle.log line 3. The likely cause is cp -a (or -p) setting times on a directory the forge uid does not own. The file copies may have succeeded; the exit status is 1 regardless, and the log says FAILED.
      More generally: lifecycle FAILED lines are not projected into the startup context. This row is the first concrete instance; the general fix is the second exit criterion.
    exit_criteria:
      - 'the hot-paths copy does not fail on a root-owned /opt/cheatsheets (it stops preserving times on the target root, or the target is created owned by the forge uid); red on 56.10.16.1'
      - 'any "| FAILED:" line in the lifecycle log before agent launch appears as a typed line in .forge-startup-context.md (e.g. launch_failures=hot-paths)'
    unscoreable: "unpinnable-until-the-guard-exists: the future litmus is scripts/test-forge-lifecycle-failures-reach-startup-context.sh, written in the same commit as the fix"
    next_action: >
      Find the hot-paths cp in images/default (populate-hot-paths), reproduce as uid 1000 with a root-owned target, then fix and project FAILED lines into the startup context.
    events:
      - type: filed
        ts: "2026-10-16T02:54:15Z"
        host: yolanda
        summary: |-
          hot-paths cheatsheet copy reports FAILED on every launch, and only the lifecycle log knows.

