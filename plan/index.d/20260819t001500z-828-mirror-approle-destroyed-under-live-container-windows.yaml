# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by windows (yolanda), 2026-08-19T00:15:00Z, from a LIVE OPERATOR
# TROUBLESHOOTING SESSION on the installed published release v0.4.260817.1.
#
# THE FORGE-WRITE BLOCKER ON WINDOWS IS NOT 809-w2xy. It presents identically
# from the forge (every push rejected, reads fine) and it is a DIFFERENT defect
# with a different remedy. 809-w2xy is `denied` — a live credential upstream
# REFUSES. This is `no-credential` — the mirror cannot read ANY credential
# because its Vault client token died and its AppRole SecretID was destroyed
# by the host while the container was still running.
#
# The operator's report was "containers pull unauthenticated fine, work for a
# while, then every push is permission-denied/rejected". "For a while" is
# EXACTLY 24 HOURS and that is the tell: it is the AppRole token max_ttl.
packets:
  - packet_id: mirror-approle-secretid-destroyed-under-a-still-running-mirror
    order: 828-k3mq
    status: ready
    desired_release: v0.5
    priority: p0
    kind: bug
    title: "every interactive CLI lane destroys its git mirror's AppRole SecretID on exit while order 443 keeps that mirror RUNNING and REUSED — the mirror then renews its client token for exactly 24h and permanently loses Vault at max_ttl, after which the pre-receive relay gate rejects every forge push"
    deliverable: "a lane exit never destroys AppRole material belonging to a container that is still running (leak-not-destroy, the rule this codebase already applies to sibling mirrors), so a reused mirror can still re-authenticate at max_ttl; plus a probe/verdict that names a DEAD AGENT TOKEN distinctly from an absent GitHub credential, because today both publish `no-credential`"
    pickup_role: windows
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [git-mirror, vault, credentials, forge, windows, blocker]
    estimated_hours: 4
    context: |
      MEASURED, yolanda 2026-08-18T23:55Z→2026-08-19T00:05Z, live containers.

      SYMPTOM CHAIN, reproduced end-to-end inside the enclave:

        anonymous clone from git://127.0.0.1:9418/tillandsias   -> OK
        push  HEAD:refs/heads/probe/push-path-check             -> REJECTED

        remote: [relay] git-mirror Vault Agent token is expired or unavailable
                while auto-auth re-authenticates...
        remote: [pre-receive] Push rejected: configured upstream did not
                durably accept the ref transaction
         ! [remote rejected] HEAD -> probe/push-path-check (pre-receive hook declined)

      Reads survive because the daemon is anonymous (`--export-all`) and the
      reconciler's upstream FETCH needs no credential. Only writes traverse the
      relay, and the relay needs Vault. That asymmetry is the whole reason the
      operator experiences "pull works, push doesn't".

      THE 24-HOUR FUSE, from the mirror's own Agent log:

        2026-08-17T20:34:47.901Z  authentication successful, sending token to sinks
        2026-08-17T21:18:21.513Z  renewed auth token       (every ~43m, all green)
        ...
        2026-08-18T20:22:59.618Z  renewed auth token       <- LAST success
        2026-08-18T20:23:00.622Z  error authenticating     <- 1.4s later
                                  | * invalid role or secret ID

      20:34:47 -> 20:22:59 is 23h48m against APPROLE_TOKEN_MAX_TTL_SECS = 86_400.
      The token hit max_ttl, renewal ended, Agent fell back to AppRole re-login,
      and re-login failed ON THE FIRST ATTEMPT — 1.4 seconds after a healthy
      renewal, before any lockout could exist. The SecretID was ALREADY dead.

      WHY THE SecretID WAS DEAD — and this is the defect, not the symptom.
      `podman inspect tillandsias-git-tillandsias` still names its mounted
      secret:

        tillandsias-vault-approle-git-mirror-agent-tillandsias-202915-fd62d9be-...

      `podman secret ls` does NOT list it. It is gone. The ONLY code that
      removes an approle podman secret is `revoke_pending_container_tokens`
      (vault_bootstrap.rs:1468,1487) — and that same drain, in the same loop,
      calls `destroy_approle_secret_id_accessor`. Its having run is therefore
      proven by the missing secret, and it necessarily destroyed the accessor
      at the same moment. There is no periodic sweeper and no other remover.

      WHO RAN IT. `run_cli_with_vault_credential_cleanup` (main.rs:129) wraps
      EVERY interactive lane — `--opencode`, `--codex`, `--claude`,
      `--antigravity`, `--bash` (main.rs:882, 907) — and `--status-check`
      (:829, :855). Each is a short-lived process with its own in-process
      registry, so each destroys the AppRole material it minted when it exits.

      THE PREMISE THAT JUSTIFIES IT IS CONDITIONAL, AND THE DESTROY IS NOT.
      The comment at main.rs:120-128 reads verbatim:

        "Interactive CLI lanes and status-check are different: their project
         mirror is stopped before the lane returns"

      That is true ONLY when the lane is the last one standing. The teardown it
      refers to is `cleanup_shared_stack_if_no_running_forge` (main.rs:5796),
      which is REFCOUNTED and returns early WITHOUT stopping the mirror when
      any sibling lane is active:

        if !running_lanes.is_empty() { ...return; }          // main.rs:5824

      and which also returns early on a podman listing error, by design:
      "treating the stack as IN USE and skipping teardown (leak-not-destroy)".

      `run_cli_with_vault_credential_cleanup` has NO such check. It drains and
      destroys unconditionally. So the two halves of one teardown disagree:

        mirror container : conditional, refcounted, leak-not-destroy
        mirror credential: unconditional, always destroyed

      Every lane exit that finds a live sibling — or a hiccuping `podman ps` —
      therefore KEEPS the mirror on purpose and DESTROYS its credential anyway.
      Order 443's own rule ("never destroy a mirror out from under a sibling",
      main.rs:12489 reuses it) is honoured for the container and silently
      violated for the credential the container needs. The mirror outlives its
      own SecretID and nothing notices for 24h.

      THIS IS WHY IT NEEDS OVERLAPPING LANES TO REPRODUCE, and why a single
      clean lane looks fine. VERIFIED BOTH WAYS on this host 2026-08-19T00:18Z:
      one lane launched alone tore its mirror down correctly at exit
      (`event:container_exit container=tillandsias-git-tillandsias exit_code=0`,
      preceded by "no active lane containers; cleaning project + shared stack")
      and lit no fuse. The three stranded mirrors came from the operator's
      2026-08-17 session, which ran FOUR OVERLAPPING lanes at 20:19-20:34Z
      (tray.log: lakanoa/antigravity 20:19:14, visual-chess/opencode 20:28:20,
      tillandsias/claude 20:32:54 and 20:34:43) — each exiting into a live
      sibling, each keeping its mirror, each losing its credential.

      THE FAILURE IS SELF-SUSTAINING AFTER IT STARTS. Agent retries every
      ~3-5 min. Vault user-lockout (threshold 5 / 15m) then converts every
      subsequent attempt — including one with a VALID SecretID — into
      403 permission denied:

        [ERROR] core: login attempts exceeded, user is locked out: request_path=auth/approle/login

      Measured split over the container's life: 18 `invalid role or secret ID`
      followed by 42 `permission denied`, 60 failures total. A fix that only
      re-issues a SecretID without first quiescing the retry loop will appear
      not to work.

      WHY NO GATE CAUGHT IT. `litmus:git-mirror-vault-agent-auto-auth` is
      explicitly the max_ttl lifecycle fixture, and it passes — because it
      stubs "at only the official Vault Agent process seam" and rotates the
      tmpfs sink with the SecretID still valid server-side. It proves Agent can
      re-auth at max_ttl GIVEN a live SecretID. It cannot express a host that
      destroys the SecretID under a live container, which is the only thing
      that actually happens in the field. Same shape as 626-p4xd: the gate
      answered a narrower question than the one the user meets.

      RESIDUAL AFTER THE OBVIOUS FIX, stated so it is not rediscovered: making
      the drain skip live containers bounds the outage at the SecretID's 48h
      server TTL, not forever — a mirror reused past 48h still dies at its next
      max_ttl. `APPROLE_AGENT_SECRET_ID_TTL = "48h"` vs
      `APPROLE_TOKEN_MAX_TTL_SECS = 24h` means a mirror gets at most one
      successful re-auth. A durable answer needs re-mint-on-demand for a
      long-lived mirror, or a mirror lifetime bounded to its credential.
    verifiable_closure: >
      a test that mints AppRole auto-auth material for a container, leaves that
      container RUNNING, runs the CLI-lane credential drain, and asserts the
      SecretID accessor still authenticates — red today. Plus a second case
      asserting the drain DOES destroy material whose container has exited, so
      the fix does not become a blanket leak.
    evidence:
      - "mirror Agent log: last renew 2026-08-18T20:22:59.618Z, first re-auth failure 2026-08-18T20:23:00.622Z 'invalid role or secret ID' — 23h48m after first auth, against a 24h max_ttl"
      - "podman inspect names secret tillandsias-vault-approle-git-mirror-agent-tillandsias-202915-fd62d9be-...; podman secret ls does not list it"
      - "vault-cli lookup-self in the mirror: 'HTTP error on lookup-self (token expired or invalid): 403'"
      - "all three mirrors (tillandsias, lakanoa, visual-chess) publish refs/tillandsias/upstream-auth/no-credential/<epoch>, refreshed every 120s"
      - "live push probe rejected at pre-receive with 'configured upstream did not durably accept the ref transaction'; zero refs created (atomic, correct)"
      - "tillandsias-vault log: 'login attempts exceeded, user is locked out: request_path=auth/approle/login'"
      - "main.rs:5824 `if !running_lanes.is_empty() { return; }` — the mirror teardown is refcounted; run_cli_with_vault_credential_cleanup (main.rs:129) has no equivalent guard"
      - "tray.log 2026-08-17: four OVERLAPPING lanes 20:19:14 / 20:28:20 / 20:32:54 / 20:34:43 — the 20:34:43 claude lane's mirror shows Agent first-auth at 20:34:47.901Z, an exact match"
      - "RECOVERY VALIDATED 2026-08-19T00:18-00:20Z: mirrors stopped, Vault lockout allowed to lapse, one fresh lane relaunched. Fresh mirror authenticated at 00:18:54.871Z, vault-cli lookup-self VALID, secret/github/token readable, and an in-forge BigPickle/OpenCode agent pushed refs/heads/probe/push-check through the relay — 'Atomic push to https://github.com/8007342/tillandsias.git succeeded' + 'Relay verified: upstream durably accepted the ref transaction'. Out-of-band `git ls-remote` on github.com confirms probe/push-check = aeca9c9862997e7b9753a22fb7ca1ab9742d9fb2. The mechanism is sound; only the credential lifecycle is broken."
      - "THIS HOST IS NOT 809-w2xy: the Vault GitHub token here has real push rights, proven by the successful upstream push above. The two blockers present identically from the forge and must not be merged."
    repro: |
      OVERLAP IS REQUIRED — a single lane launched alone does NOT reproduce.
      1. Attach lane A to project P (creates mirror P, mints its AppRole material).
      2. While A is still running, attach lane B to any project.
      3. Exit lane A. Its shared-stack cleanup sees B active and KEEPS mirror P
         (main.rs:5824); its credential drain destroys P's SecretID anyway.
      4. `podman secret ls | grep approle` is now empty while mirror P is still
         Up — the fuse is lit at THAT moment, not at hour 24.
      5. Keep mirror P running for 24h. At max_ttl its Agent re-login fails
         ("invalid role or secret ID"), retries trip Vault user-lockout, and
         every forge push to P is rejected while clones still work.
    next_action: >
      Give the credential drain the SAME refcount the container teardown
      already has. Concretely: carry the owning container name into
      AppRoleAutoAuthRegistration and make revoke_pending_container_tokens skip
      any registration whose container is still running — destroying only
      material whose container has exited, and treating a listing error as
      "still running" (leak-not-destroy), exactly as
      cleanup_shared_stack_if_no_running_forge already does. The 48h server-side
      SecretID TTL is what bounds the resulting orphan, which is the job that
      TTL was documented for. Then correct the comment at main.rs:120-128: it
      states the teardown unconditionally when the teardown it names is
      refcounted, and that gap is the whole defect.
      Separately, split the mirror's `no-credential` verdict so a DEAD AGENT
      TOKEN is not reported with the same word as an absent GitHub token; today
      the operator-facing remedy for the two is opposite ("do NOT run GitHub
      Login" vs "restore the Vault GitHub token") and only the relay log
      distinguishes them.
