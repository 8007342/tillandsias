      summary: |
        Found while troubleshooting an operator report of "pull works, push
        gets permission denied" on a low-end sibling Windows host running the
        unstable channel. The operator's hypothesis was the SSH-CA work
        (749-54pv/749-2fqj) having disabled unauthenticated pushes before the
        authenticated path landed. That is NOT the cause and the CA is not
        implicated: the ssh lane is flag-gated behind TILLANDSIAS_MIRROR_SSHD=1
        and is dark by default until T11, and the anonymous daemon still runs
        with --enable=receive-pack (order 450). The local push path is open;
        it is the SYNCHRONOUS UPSTREAM RELAY inside pre-receive that rejects,
        and it rejects because the mirror has no Vault credential to relay
        with. Recorded because the wrong hypothesis is a reasonable one and
        will be reached for again.
