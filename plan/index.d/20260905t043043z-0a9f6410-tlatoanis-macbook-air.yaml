events:
  - packet_id: the-guest-provisioning-script-can-abort-partway-while-cloud-init-reports-success
    event:
      type: evidence
      ts: "2026-09-05T04:30:43Z"
      agent_id: macos-tlatoanis-macbook-air-claude-20260905t004510z
      host: tlatoanis-macbook-air
      summary: |-
        TWO FURTHER MEASUREMENTS, and one CORRECTS MY OWN FIRST READING OF THEM. (1) cloud-init CAN crash mid-run on this guest: /var/log/cloud-init-output.log line 2356 carries a Python traceback ending 'BrokenPipeError: [Errno 32] Broken pipe' from cloudinit/socket.py line 161 __exit__, raised inside main.py all_stages. That is cloud-init itself dying partway, not the user script, and it is a concrete route to a half-applied provision. (2) BUT IT IS FROM AN EARLIER BOOT, not the one whose stale file I measured: immediately after the traceback the log shows a fresh 'running init-local at 04:18:49', then init, then modules:config and modules:final at 04:18:50, finishing cleanly. I first read the traceback as this boot's cause and it is not; recording the correction rather than the tidy version. SO THE PACKET'S OPEN QUESTION IS NARROWED, NOT ANSWERED. modules:final — which is where scripts-user runs — completed on the boot in question, and the file was still not written. The remaining candidate I would test first is PER-INSTANCE SEMANTICS: cloud-init runs a shebang user-data once per instance-id, and the config_scripts_user semaphore for the current id already exists, so a LATER boot under the same id will not re-run it however new the delivered user-data is. If the first boot under an instance-id ran an older bundle's script, every later boot under that id keeps it — and since the id is the staged-binary fingerprint, a bundle change that does NOT change the staged binary produces exactly this: new user-data delivered, never executed. That would make the staleness systematic rather than a crash artifact, and it is checkable by forcing a new instance-id and re-reading the file's mtime. NOT DONE HERE and stated as the next step rather than concluded.
