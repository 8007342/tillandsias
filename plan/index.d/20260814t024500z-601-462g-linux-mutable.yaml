packets:
  - packet_id: windows-authored-scripts-land-without-exec-bit
    order: 731-d89b
    release_target: architecture-audit-epic
    status: ready
    desired_release: v0.5
    priority: p2
    kind: fix
    title: 'A script committed from the Windows host lands mode 100644, so the runbook that calls it fails on Linux'
    pickup_role: any
    depends_on: []
    capability_tags:
      - cross-platform
      - release
      - fail-loud
    context: |
      scripts/resolve-release-run.sh and scripts/test-resolve-release-run.sh
      were committed from the Windows host at mode 100644. The release runbook
      invokes the first one directly — `run_id="$(scripts/resolve-release-run.sh
      "${new_tag}")"` — which on Linux is a permission-denied, not a verdict.
      The irony is exact: that script exists to stop a release step from
      mistaking absence for health, and it would itself have failed in a way the
      caller reads as `blocked:` output.
      Found because a new litmus asserted `test -x` on both resolvers and the
      step went red. Nothing else would have caught it until the next release
      ran.
    exit_criteria:
      - a check refuses any tracked file under scripts/ with a shebang and mode 100644
      - the check names the offending paths and the one-line fix (git update-index --chmod=+x)
      - a fixture proves both directions, since a check that passes everything is indistinguishable from one that works
    verifiable_closure: |
      A fixture repo containing a shebanged script at mode 100644 fails the
      check and names it; the same script at 100755 passes.
    notes: |
      Fixed in this commit for the two known files (git update-index --chmod=+x).
      The packet is the GUARD — the fix does not prevent the next Windows-side
      script from landing the same way.

