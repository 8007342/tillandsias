  - packet_id: release-runbook-drift-audit
    event:
      type: progress
      ts: "2026-08-14T02:45:00Z"
      agent_id: "linux-mutable-20260814t0217z"
      host: linux_mutable
      summary: >
        AUDIT EXECUTED, three instances fixed. Full enumeration in
        plan/issues/runbook-external-precondition-audit-2026-08-14.md: every
        skill step gating on an external command, with what that command returns
        when the thing it asks about is ABSENT.
        The `gh` list subcommands are the dangerous family — they exit 0 on an
        empty result set and `--jq '.[0].x'` renders that emptiness as the
        literal string `null`, so a bare exit-status test AND a bare emptiness
        test both pass. skills/merge-to-main-and-release step 2 held the third
        instance in this one file: with no open PR the emptiness test was FALSE,
        `gh pr create` never ran, and the runbook announced `PR #null` before
        walking into step 3 to merge a pull request that does not exist. The
        re-query after creation had the same shape.
        Fixed: scripts/resolve-open-pr.sh (fixture 5/5, deliberately a twin of
        resolve-release-run.sh so the pair reads as one pattern), plus step 1's
        two `# MUST be ...` comments rewritten as assertions — a comment beside
        `git status --short` is not a gate; both commands exit 0 on the wrong
        branch and a dirty tree.
        The podman and wsl sites are all SOUND, for a structural reason worth
        naming: they assert a positive fact, or an emptiness that IS the
        requirement. The gh sites were unsound because they extracted a value
        and then trusted it. Extracting a value is where this class lives.
        Residual, deliberately not fixed: advance-work-from-plan's final
        worktree check is prose, and rewriting it needs a decision about whether
        that skill should share meta-orchestration's boundary guard rather than
        grow its own — a design choice, not a fix.
        Filed 731-d89b along the way: both Windows-authored resolvers landed at
        mode 100644, so the runbook's direct invocation was a permission error
        on Linux until this commit.
