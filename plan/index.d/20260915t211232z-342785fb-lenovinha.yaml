        TWO THINGS FROM THE ARTIFACT WORTH KEEPING BESIDE THE DECISION. Our implementation is STRONGER than GitLab's published bidirectional-mirroring sample, which relays one ref at a time and warns "it is possible for some refs to succeed, and others to fail"; ours relays the whole transaction with `git push --atomic`. And the recorded corollary: the mirror's reliability failures have never been architectural — they concentrate in the credential lifecycle and the serving layer. That held again tonight, twice, on this very host: a desktop autologin was starting the session without unlocking the keyring, so the credential was absent by construction rather than by any fault of the relay.
