packets:
  - packet_id: headless-accel-probe-no-fallback-target-arm
    order: 653-7rag
    status: ready
    desired_release: v0.5
    priority: p2
    title: "tillandsias-headless does not compile on Windows: enumerate_cpu has linux and macos arms but no fallback"
    kind: bug
    deliverable: crates/tillandsias-headless/src/accel_probe.rs
    depends_on: []
    pickup_role: linux
    capability_tags: [build, cross-platform, accel, workspace]
    context: >
      `enumerate_cpu()` declares `physical_cores` and `logical_cores`
      uninitialized and assigns them only inside #[cfg(target_os = "linux")] and
      a macOS arm. No arm exists for any other target, so on Windows both are
      read before assignment and the crate fails with E0381.

      Introduced by bd8a47d1 — "fix(accel): the 8 macOS-only lints linux could
      not enumerate". The commit message names the condition that produced it: a
      Linux host repairing platform-gated code it cannot itself compile. Invisible
      from both Linux and macOS.

      It also survives the gate: ./build.sh --check PASSES on this tree, because
      the check gate validates the plan ledger, traces and YAML and does not build
      the workspace. Nothing in the normal push path on any host reports it.

      SCOPE QUESTION, not presumed: tillandsias-headless runs in the GUEST and is
      injected as a prebuilt binary, so whether Windows must build it is a fair
      question. What is not in question is that the crate is a workspace member,
      so `cargo build --workspace` and `cargo test --workspace` both fail on a
      Windows checkout — the two most ordinary commands in a Rust repo, failing in
      a crate the contributor did not touch.

      Full write-up: plan/issues/headless-does-not-compile-on-windows-2026-08-10.md
    exit_criteria:
      - >
        Either enumerate_cpu gains a fallback arm for targets that are neither
        linux nor macos, or the crate is deliberately excluded from the Windows
        workspace build and that boundary is documented.
      - >
        `cargo build -p tillandsias-headless` succeeds on Windows, or fails with a
        message that names the exclusion rather than an E0381.
    verifiable_closure: >
      A Windows host runs `cargo build --workspace` to completion, or the
      documented exclusion is asserted by a check.
    notes: >
      Preferred is the fallback arm: it removes the failure mode rather than
      documenting it, and a capability probe that cannot describe an unknown
      platform is arguably wrong on its own terms. Assigned to linux because
      verifying the probe still reports CORRECT hardware on linux/macos matters
      more than making it compile — a probe that builds while reporting wrong
      hardware is worse than a build error.
    events:
      - ts: "2026-08-10T09:00:00Z"
        event: filed
        summary: >
          Found incidentally by the windows lane running cargo build --workspace
