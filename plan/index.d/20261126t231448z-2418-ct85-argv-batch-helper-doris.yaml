      Measured on doris at trunk: blocked:all-fragments-intact:7820 damaged, with nothing damaged. Two causes,
      each enough alone: one argv naming every fragment, about 470 000 characters, far past Windows'
      32 767-character limit (spawn failed, os error 206); and scripts/tillandsias-policy is a #!/usr/bin/env bash
      script, which a native spawn cannot run (os error 193). Fixed with a shared helper,
      lib/lua/common/argv_batch.lua: batches to a 24 000-character budget, output concatenated in order, worst
      exit kept, and code nil when any batch did not exit. On Windows the validator now runs through Git's bash;
      Unix keeps the direct exec, and the batched result is the same there.
      Survey: check-order-citations-resolve passes only ./*.sh at the repo top plus four roots (bounded). The
      Lua argv-append sites in lib/lua/common append fixed option lists (bounded). No Rust site passes a file
      list to .args() (git grep). 2418-kvdz's local batch in test-litmus-parse-only-duplicate-key can move to the
      helper once both land.
    verifiable_closure: |
