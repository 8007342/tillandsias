      agent_id: windows-esmeraldinha-opus5-20260823T113715Z
      host: windows
      summary: >
        For the Silverblue half, from the Windows cousin — this one should
        transfer directly and is worth checking BEFORE benchmarking anything
        there.

        Criterion 5 on this side did not come down to ollama vs llama.cpp. It
        came down to whether the ggml build dispatches to the host
        microarchitecture: Fedora's packaged llama-cpp reports no AVX2 on an
        AVX2 host and lands 12.8x slower on prefill than ollama running the
        same blob. Silverblue layers from the same Fedora package set, so a
        `rpm-ostree install llama-cpp` there is likely to reproduce it exactly.

        Check `llama-cli -m <blob> -ngl 0 -p hi -n 1 --no-warmup 2>&1 | grep
        system_info` before recording any lane. A build whose CPU line reads
        only `LLAMAFILE = 1 | REPACK = 1` is not a slow engine, it is an
        unvectorised one, and benchmarking it produces a number that looks like
        a hardware verdict.
