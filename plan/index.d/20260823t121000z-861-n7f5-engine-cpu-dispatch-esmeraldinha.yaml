packets:
  - order: 861-n7f5
    packet_id: engine-candidates-must-prove-cpu-dispatch-before-they-are-benchmarked
    desired_release: v0.6
    title: "a ggml build without AVX2 on an AVX2 host is a misconfiguration, not a candidate — and it benchmarks as a 13x regression nobody can explain"
    status: ready
    kind: enhancement
    pickup_role: any
    priority: p3
    capability_tags: [inference, low-end, cpu, benchmark, engines]
    deliverable: scripts/check-engine-cpu-dispatch.sh
    depends_on: []
    estimated_hours: 2
    context: >
      Measured on esmeraldinha 2026-08-23 while closing 855-wrr3 criterion 5.
      Fedora 44's packaged `llama-cpp` (b6153-3.fc44) is 12.8x slower on
      prefill and 4.0x slower on decode than ollama, running the IDENTICAL
      GGUF blob on the same four cores. Both are llama.cpp; the engine is not
      the variable.

      The variable is build-time CPU dispatch. Fedora's build reports
      `CPU : LLAMAFILE = 1 | REPACK = 1` and NO AVX, AVX2, FMA or AVX_VNNI, on
      a host whose published capability row lists all four. ollama ships 17
      microarchitecture-specific ggml objects and selects at runtime — verified
      by reading the live runner's memory map rather than inferring it, which
      showed exactly `libggml-cpu-alderlake.so`, this host's own
      microarchitecture.

      WHY THIS IS WORTH A PACKET RATHER THAN JUST THE RESEARCH NOTE. The wrong
      conclusion here is cheap to reach and expensive to hold: "ollama is a
      wrapper, so the bare engine must be leaner" is a reasonable-sounding
      simplification that would have cost a 12.8x prefill regression, and the
      benchmark that revealed it would have been read as "this host is slow"
      — which, on the fleet's designated floor host, is exactly the reading
      nobody would question. The project already has a rule for this shape
      (order 392: a GPU tier in name only is worse than no GPU tier); this is
      the CPU-lane sibling and it has no check.

      The distro package compounds it: it is a ROCm/HIP build, so it defaults
      to `ngl 99` and prints `failed to initialize ROCm: no ROCm-capable device
      is detected` before falling back. That line invites a GPU diagnosis when
      the defect is on the CPU path — forcing `-ngl 0` moves the number from
      9.71 to 9.77 t/s, which is the proof that offload was never involved.

      Full evidence, with reproduction commands:
      plan/issues/research/low-end-engine-choice-is-cpu-dispatch-not-runtime-2026-08-23.md
    exit_criteria: >
      (1) A script that, given an engine binary, emits one falsifiable line
      naming the CPU features its build actually dispatches, and refuses the
      candidate when the host advertises vector features the build does not
      use — grammar in the house style, e.g.
      `ok:engine-cpu-dispatch:<features>` / `refused:engine-cpu-dispatch-baseline:<missing>`.
      (2) scripts/bench-inference-floor.sh calls it (or refuses to publish a
      lane label) before recording a lane, so a baseline build cannot enter the
      ledger as an engine-lane measurement at all.
      (3) The host's advertised features come from the capability row
      (`cpu_flags`, already published by accel_probe) rather than a second
      inline probe — 859-b2zc is this cycle's reminder of what re-derivation
      costs.
      (4) A hermetic fixture with a stubbed engine reporting a baseline
      feature set.

