        Residual 1 CLOSED — 855-wrr3 exit criterion 5, the alternative-runtime
        evaluation, now has an answer for the Windows side.

        An alternative IS available without layering: llama-cpp b6153-3.fc44 is
        packaged in Fedora 44. Two candidates were measured against ollama on
        the same GGUF blob, same four threads, CPU-only, idle box:

          ollama HTTP API            prefill ~125 tok/s   decode 28.99
          ollama's llama-server bare prefill  59-91       decode 29.52
          Fedora stock llama-cpp     prefill   9.77       decode  7.22

        The headline is that "which runtime" is the wrong question. Fedora's
        build dispatches NO AVX/AVX2/FMA/VNNI on a host that has all four,
        while ollama ships 17 microarch ggml objects and loads
        libggml-cpu-alderlake.so — read out of the live runner's /proc maps,
        not inferred. 12.8x prefill and 4.0x decode, entirely from packaging.
        Filed as 861-n7f5 so the trap gets a check rather than a note.

        On the ollama LAYER itself, which is the question the criterion was
        really asking: decode is at parity (1.8%), and wall-clock
        time-to-first-token favours a bare llama-server by ~25% (844 vs 1131
        ms) — driven by ollama's chat template turning a 51-token prompt into
        80, i.e. token count rather than engine speed. Against the measured
        ~2.3 s per unfold-and-verify sub-query that is ~0.3 s: worth having for
        template-free workloads like 853-6gz3's, not transformative.

        Deliberately NOT claimed: ollama's per-token prefill reads as 2x the
        bare server's on the same ggml, and I could not attribute it. The bare
        server's prefill varied ±35% across runs where ollama's varied ±0.1%,
        the prompt lengths differ, and my one attempt to probe the cause
        changed two variables at once. The recommendation rests on the
        wall-clock column, which none of that touches.

        RESIDUAL 2 STILL OPEN: no true cold-bootstrap number (criterion 6). It
        needs an isolated CARGO_HOME + CARGO_TARGET_DIR so the working cache
        survives, and it is an hour-plus of uncontended wall clock. Not started
