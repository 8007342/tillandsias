packets:
  - packet_id: windows-sources-stamp-cannot-cross-a-host-boundary
    order: 736-28m7
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    kind: bug
    title: "The windows-only verification stamp lives in .git/, so no other host can ever see it — and the linux gate reads that as 'never verified'"
    deliverable: "a verification signal that survives a push, or a gate that stops claiming to know"
    pickup_role: any
    capability_tags: [multi-host, gates, fail-loud, release, evidence]
    estimated_hours: 3
    context: |
      FOUND while answering the linux host's release gate (735-dim8). They wrote,
      as the reason for holding the merge to main:

        "check-windows-only-sources-verified.sh reports
         stale:windows-sources-never-verified:4 on every gate run here. Four
         Windows-only sources have never been compiled by their own toolchain
         ... That's the largest unverified surface in this release, and only the
         Windows host can close it."

      The premise is false, and not by a little. Those four sources ARE verified
      on this host — `cargo test -p tillandsias-windows-tray --bins`, 89 passed
      0 failed, run natively twice today, once against the exact merge candidate
      — and the stamp was applied both times, returning
      `ok:windows-sources-verified:4` here.

      The evidence cannot travel. From the script itself:

        STAMP_FILE="${WINDOWS_ONLY_STAMP:-$GIT_DIR/tillandsias-windows-only-verified}"

      `$GIT_DIR` is `.git/`. Nothing under it is committed or pushed. So a
      Windows host's verification is structurally invisible to every other host,
      and the linux gate will report `never-verified` forever — before the
      release, after the release, and after any number of green Windows runs.

      WHY THIS IS WORSE THAN AN ABSENT CHECK. The verdict is not "I don't know";
      it is `never-verified`, which reads as a statement ABOUT THE SOURCES. A
      release decision was actually held on it. The check is answering a
      question it has no way to observe, in a vocabulary that sounds like it
      did — this project's own recurring shape, here at the fleet level rather
      than inside one host.

      It also silently rewards the wrong thing: a host that never runs the
      Windows tests and a host that runs them green produce the SAME verdict on
      every other host in the fleet.
    outcome: |
      A Windows verification either reaches the hosts that gate on it, or the
      gate says plainly that it cannot know rather than that nothing happened.
    exit_criteria:
      - "Decide and record which one this is: (a) the stamp becomes shareable — committed, or carried as a ledger event with the transcript, so a sibling host can read it; or (b) the check keeps host-local state but its OFF-HOST verdict changes from `never-verified` to something that names the limitation, e.g. `unknown:not-this-host`."
      - "Whichever is chosen, a linux gate run must no longer be able to report `never-verified` about sources a Windows host has verified — demonstrate before and after."
      - "NEGATIVE CONTROL: a genuinely unverified tree must STILL be reported as unverified on the host that can verify it. Fixing the cross-host lie must not blind the local check, which is the half that works."
      - "If (a): the shared evidence must carry the transcript, not just a boolean. 716-f5kc already refuses a stamp without one (`a stamp with no transcript is an assertion, not a verification`) and that property must survive crossing the boundary."
    notes: |
      Do not fold this into 735-dim8. That packet is the release gate and is
      answered by posting the evidence as a ledger event; this is the reason the
      gate could not see the evidence in the first place, and it will recur on
      every future release until the transport is fixed.

      The ledger is currently the only working transport, which is a hint at the
      cheapest fix: the stamp could record its transcript into a plan event
      rather than a file under .git/.
    events:
      - type: filed
        ts: "2026-08-14T19:40:00Z"
        host: windows
        summary: |
          Filed from a live cross-host misunderstanding: the linux host held a
          release citing four "never verified" sources that had in fact been
          verified here, twice, the same day.
