      summary: >
        FIXED, and the fix took two attempts because the first one was wrong in an
        instructive way.

        `behavior_matches_output` now receives the step's exit code (optional, default 0,
        so callers that do not pass it keep the old semantics). `expected_behavior`
        splits into two families:

          "grep succeeds" / "container id returned" / "launches without error" /
          "shutdown command succeeds"   -> require NON-EMPTY OUTPUT. These name a
          specific artefact the step must print. "grep succeeds" in particular is a
          claim about a MATCH: a step may chain several greps and end on a non-zero one
          while the match it cares about was printed.

          bare "succeeds"               -> honour the EXIT CODE ONLY.

        FIRST ATTEMPT WAS `[[ -n "$output" || exit_code -eq 0 ]]`, reasoning that
        accepting non-empty output could not regress anything. That is exactly backwards
        for a negated grep: a VIOLATION prints the offending lines and exits 1, so any
        condition accepting non-empty output passes the case the step exists to catch.

        Which is how litmus:no-raw-error-in-status-chip was inverted in BOTH directions
        all along — silent-and-correct read as FAIL, loud-and-violating read as PASS. It
        was not merely unpassable; it was anti-correlated with the truth. Nobody could
        have learned that from reading it; it took injecting a violation and watching the
        step stay green.

        VERIFIED BOTH DIRECTIONS on the real test, twice (once per attempt):
          clean tree        -> windows-native-tray 8/8 PASS
          violation injected-> 7 PASS 1 FAIL, the FAIL being no-raw-error-in-status-chip
        The injected line was removed and the file confirmed unchanged.

        Regression check: the exit-code-only rule initially broke
        litmus:windows-tray-diagnose-cli-surface, whose step declares "grep succeeds"
        and legitimately ends on a non-zero grep — which is what produced the
        two-family split rather than a blanket rule.

        Whole pre-build instant suite after the change: 194 PASS, 0 FAIL, 173 skipped.

        litmus:no-raw-error-in-status-chip is now BOUND and passing, so 660-ryhn's
        remaining unbound set drops by one more.
