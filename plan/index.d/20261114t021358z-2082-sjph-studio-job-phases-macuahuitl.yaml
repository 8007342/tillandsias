packets:
  - packet_id: studio-job-status-reports-typed-phases-with-progress-and-a-retry-after-hint-so-an-agent-waiting-on-a-first-use-model-fetch-backs-off-instead-of-polling-or-cancelling
    order: 2082-sjph
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [studio, imagegen, mcp]
    estimated_hours: 8
    title: "studio.job_status reports a typed phase (queued, fetching_weights, verifying, loading_model, running, saving, done, failed) with byte and step progress, a measured ETA, retry_after_s and one plain sentence, so a first-use fetch of tens of GB reads as progress and agents back off"
    context: |
      Incident 2026-11-13: a macron.dev forge queued a Wan 2.2 VACE workflow. The host fetched about 41 GB of weights at about 18 MB/s and hashed them before ComfyUI admission, and the whole time the ticket said only "running". The agent believed it had stalled, cancelled once after about 20 minutes (risking the download restart) and polled repeatedly. Operator direction: add download size and bandwidth to the messages so impatient agents back off polling, then poll later for real running metadata; "running" is not enough.
      Causes by symbol. In studio_jobs, queue_with sets status "running" when the worker thread starts and the Runner type takes no progress sink; live_runner passes a discarding closure to studio_tool::call, so every Progress event is thrown away. In studio_tool::call, StudioEngine::ensure_models (fetch plus sha256 verify, via imagegen_models::ensure_files), gpu_queue::wait_for_gpu (Progress::Queued) and StudioEngine::run (Progress::Step) all run under that one "running". imagegen_models::FetchEvent carries only Started with bytes, Percent and Verified; Transport::fetch reports a whole percent only, and the hash pass over a 17 GB file emits nothing.
      Shared path, checked by symbol: image.generate (imagegen_tool, Progress and FetchEvent mapped to MCP progress notifications) and studio_tool::call share Progress and FetchEvent, so one richer event set and one status-sentence builder serve both; image.generate is a blocking call with progress notifications, not a ticket, so it gains the same sentence in its progress message but no poll hint. The audio studio (audio_studio, audio_separate) is synchronous and has no ticket; audio_separate hands restricted_fetch::fetch_restricted a discarding FetchEvent sink, so its first-use fetches are invisible too and should feed the same sentence. There is no studio cancel tool today; cancel means the caller dropping the call or ticket, and imagegen_models::ensure_files already keeps a verified file and leaves a .part for the transport's resume (curl --continue-at), which the new text states and a test pins.
      Design. Typed phase on the ticket record: queued (position, and the GPU holder from gpu_queue::vram_holders if any), fetching_weights (per file and total bytes_done and bytes_total, measured bandwidth_bps, eta_s), verifying (hash bytes done and total), loading_model, running (ComfyUI node i/N, step k/M, current node class, elapsed, eta_s once known), saving, then done or failed with a reason. Every status response carries retry_after_s = clamp(remaining/10 .. remaining/2, floor 15 s, cap 600 s) (0 once done or failed, 15 when no ETA is known) and a message sentence such as "fetching 34.1/41.0 GB at 18 MB/s, about 6 min left; poll again in 3 min. Cancelling restarts nothing already verified; a partial file resumes." Tool descriptions for studio.queue_workflow, studio.job_status and studio.run_workflow tell agents to honour retry_after_s and that first-use model fetches can take tens of minutes. Ticket progress writes are throttled (at most one every few seconds) since tickets are atomic file rewrites.
      Links. Extends order 2002-stjb (studio-jobs-are-tickets-that-survive-a-lane-restart, implemented in #967: tickets, queued/running/done/failed). Same family as the image-build ruling (an-on-demand-image-build-shows-its-step-progress-in-the-tray-status-and-in-the-requesting-callers-reply, implemented, and the retry_after rule of the image build retry and tray feedback ruling): that is image builds, this is model fetches and runs. Note plan/issues/studio-job-phases-2026-11-14.md.
    exit_criteria:
      - "A studio_jobs test queues a job whose stub StudioEngine::ensure_models emits fetch events for a large model (bytes_total about 41 GB, bytes_done partway, a measured rate) and holds there; studio.job_status then reports phase=fetching_weights with bytes_done, bytes_total, bandwidth_bps, retry_after_s > 0 and a message naming both byte counts and the retry. Pre-fix result: FAILS, status reports only running and the progress sink is discarded."
      - "The same test drives the stub on through verifying, loading_model, running (node and step), saving and done, and a failing stub ends phase=failed with a reason; each transition is observed in the ticket."
      - "A unit test of the retry_after_s function: 600 s remaining gives 60 to 300 s clamped, 30 s remaining gives the 15 s floor, 10 hours remaining gives the 600 s cap, no ETA gives 15 s, a finished job gives 0."
      - "The descriptors of studio.queue_workflow, studio.job_status and studio.run_workflow contain retry_after_s, the tens-of-minutes first-use warning and the cancel sentence (verified files kept, partial downloads resume); a test asserts each substring. Pre-fix result: FAILS."
      - "A test of imagegen_models::ensure_files shows the cancel sentence is true: a file already verified is not fetched again, and a .part left by an interrupted fetch is handed back to the transport rather than deleted."
      - "image.generate's progress message for a first-use fetch carries the same byte and bandwidth sentence, and audio_separate's fetch sink is no longer discarding; each asserted by a stub-fetch test."
    verifiable_closure: "cargo test -p tillandsias-headless --all-features studio_jobs and imagegen_models and the image.generate fixtures in mcp_socket pass, the retry_after_s test is red on the pre-fix tree, and a real first-use fetch on hardware (a model not in the cache) is polled once and its status sentence matches the bytes on disk."
    unscoreable: "the real-hardware fetch cannot be scored by a litmus (it needs the multi-GB download and the GPU studio); the stub-fetch tests are the scored arm."
    next_action: "Write the failing studio_jobs test first (stub ensure_models emits fetch events; status must say fetching_weights with bytes and retry_after_s); then widen FetchEvent and the Runner signature to carry a progress sink, add the phase and retry_after_s fields to the ticket, and update the three descriptors."
