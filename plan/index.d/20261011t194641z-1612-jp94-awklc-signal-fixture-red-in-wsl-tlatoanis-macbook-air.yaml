    title: |
      scripts/lua/test-awk-float-lc-numeric-signal.lua (1587-qqzs, #322) is red 3/3 in Windows' WSL builder guest ("2 REAL the script reached its mutants — got: no pid file within 10 s"). The arm waited a FIXED 10 s for a pid file that the subject writes only after making its mutants, so a subject that ends early, or starts slowly, reads as a timeout with no cause.
    context: |
      REPORTED by the coordinator 2026-10-11: red 3/3 on untouched trunk 0c840e353, with a binary rebuilt from trunk, in yolanda-windows' WSL guest; green 3/3 on macuahuitl and on darwin.
      HYPOTHESIS, UNVERIFIED until the guest's output is seen: a minimal guest has no comma-decimal locale. test-awk-float-lc-numeric.sh then prints `unscoreable:awk-float-lc-numeric:no-comma-locale-on-host` and exits 0 BEFORE making mutants, so the pid file never appears.
      FIX on work/1612-jp94 (event-driven, not a longer wait):
      - the subject writes its pid at START and `<pidfile>.ready` once its mutants exist;
      - the fixture waits for ready OR the pid gone (capped at 120 s), and judges an early end by what the subject SAID;
      - the sed shim's 5 s hold now keys off `.ready`.
      MEASURED on darwin:
      - unmodified, 3/3 ok;
      - with the subject forced to find no comma locale: `skip:awk-float-lc-numeric-signal:no-comma-locale-on-host` (exit 0), the control arm still run;
      - with a planted early `exit 2`: FAIL "it ended first, saying: ... fail:planted-early-exit" (exit 1).
    exit_criteria:
      - 'in the Windows WSL builder guest the fixture is no longer red: it ends ok, or with a NAMED skip whose reason is the subject''s own line, and the guest run''s output is recorded on this row'
      - 'a subject that ends before its mutants for any other reason is a FAIL that quotes what it said (planted early exit shown red), never a timeout'
      - 'darwin and util-linux hosts stay ok:awk-float-lc-numeric-signal:3 arms'
