      summary: |
        THE FALSE-PASS QUESTION IS ANSWERED, AND THE ANSWER IS NO. A surviving gate
        cannot write a stamp the current tree did not earn. This is a refutation of the
        hypothesis that motivated asking, and it DOWNGRADES the lock from a
        gate-integrity fix to hygiene plus false-fail prevention.

        THE SHARED STATE IS REAL. Both artefacts are ONE path per checkout, not per
        run: gate-stamp.sh's STAMP_FILE is "$GIT_DIR/tillandsias-gate-stamp" and the
        pass token is "$GIT_DIR/tillandsias-gate-pass-token", the same path in
        build.sh's minting site and gate-stamp.sh's consuming site. Two concurrent
        gates in one checkout do share them. So the premise of the question was sound.

        WHY IT STILL CANNOT PRODUCE A FALSE PASS. The stamp's digest is NOT captured
        when the gate starts; `write` calls compute() at WRITE time, over the worktree
        as it is then. Taken alone that is exactly the false-PASS shape — a stray that
        validated tree T1, finishing late, would stamp whatever T2 happens to be. What
        closes it is that the token NAMES THE TREE IT COVERS. build.sh mints it only on
        a green run, recording digest = compute() at that moment; gate-stamp.sh write
        then recomputes compute() and compares. On a mismatch it deletes the token and
        exits `refused:gate-pass-token-is-for-another-tree` with "The tree changed
        after the gate ran, so its verdict does not cover these bytes."

        So the stray's two cases are both safe. If the tree is UNCHANGED since it
        validated, its stamp is earned — those bytes really were gated, and it does not
        matter which process says so. If the tree HAS changed, write is refused and no
        stamp appears. The 940-f77j comment claims exactly "unforgeable BY ACCIDENT,
        not by intent", and a stray gate is an accident, which is the case that claim
        covers.

        THE SHARED TOKEN PATH IS CROSS-TALK, NOT A HOLE. Gate A can consume a token
        minted by gate B, since there is one path. But a token exists only because some
        gate went green on the tree it names, and write proceeds only when that name
        equals the current tree — so the stamp that results is one some gate did earn
        for those bytes. The visible cost is that B is then refused
        `refused:no-gate-pass-token` and reports failure having passed: another FALSE
        FAIL, the same direction as everything else here.

        WHAT I DID NOT ESTABLISH, so nobody reads this wider than it is. This covers
        the accidental path with GATE_STAMP_REQUIRE_TOKEN at its default. The escape
        hatch GATE_STAMP_REQUIRE_TOKEN=0 skips the whole token check and I have not
        traced who sets it. And "by intent" remains explicitly out of scope by the
        mechanism's own admission: anyone who can write the stamp file can write the
        token file.

        CONSEQUENCE FOR THIS ROW: criterion 3 stays worth building, but as hygiene —
        it prevents wasted gates and confusing reds, not an unearned green. No "my gate
        was green" in this tree becomes conditional.

        CRITERION 3'S DISCRIMINATOR AS I FILED IT IS WRONG, corrected by pirria before
        I built on it. I wrote "a stray's ppid is conmon, a legitimate gate's is the
        podman exec that launched it". That is false: build.sh re-execs itself into the
        toolbox, so a LEGITIMATE gate also has a build.sh parented by conmon. A lock
        refusing on "a build.sh exists under conmon" refuses every normal gate. What
        actually separated the two on pirria's host was that the stray's conmon belonged
        to a DIFFERENT podman exec session than the live wrapper's — the parent CHAIN,
        not the immediate ppid. Their near-miss is the other half: pid 3392175's parent
        was the gate's own build.sh, a legitimate nested run, against pid 3047429 under
        conmon, the stray.

        Rebuilding the criterion on the parent chain is the remaining work, and it is
        not a one-line change to what is filed. I am not implementing a lock tonight on
        a discriminator that was wrong twelve hours after I wrote it.
