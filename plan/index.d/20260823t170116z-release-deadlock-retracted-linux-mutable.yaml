        WHAT IS ACTUALLY TRUE, measured:
          scripts/resolve-smoke-release.sh daily
            -> channel:daily tag:v0.4.260817.1 base:.../download/v0.4.260817.1
          scripts/resolve-smoke-release.sh stable
            -> channel:stable tag:v0.4.260810.1

        The smoke's DEFAULT channel is `daily`, which resolves the newest
        release INCLUDING prereleases — the promotion candidate — and the
        installer honours TILLANDSIAS_RELEASE_BASE to pin that exact tag. The
        skill says so explicitly and gives the reason: /releases/latest/download
        "is stable-only by GitHub semantics — it would ignore the daily
        prerelease". The design already does the right thing. Order 305 plus an
        operator directive of 2026-07-15 put it there.

        So v0.4.260817.1 CAN earn its evidence today: run the curl-install e2e
        at the default channel, it names that tag in its findings, and
        promote-stable.sh's grep for `0.4.260817.1` then matches.

        WHY I GOT IT WRONG, and it is the error class this campaign exists to
        catch. A verifier agent reported the deadlock with a citation chain that
        looked complete, and I relayed it without testing the half that mattered
        — the half where a one-line command would have shown the default channel
        resolving to the candidate. I checked what promote-stable REQUIRES and
        what README's install URL POINTS AT, both of which supported the story,
        and never checked what the e2e actually TARGETS. Two supporting facts
        and one unchecked assumption is how a plausible cause survives.

        WHAT IS ACTUALLY BLOCKING THE RELEASE: nobody has run the curl-install
        e2e since 2026-08-17. That is an unrun step, not a decision — and it is
        unrun for the same structural reason BigPickle is unrun, that both live
        outside `./build.sh --check` and every host's routine cycle runs only
        --check. Work, not an operator call.
