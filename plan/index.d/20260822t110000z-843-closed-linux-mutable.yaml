#
# 843-624y closes on its titular defect. Its one remaining addendum is split
# out, because a p0 held open for a bounded storage-shape concern misreports
# what is urgent.
packets:
  - order: 846-idhn
    packet_id: capabilities-channel-has-no-base-representation
    desired_release: v0.6
    title: "compaction never serialises the `capabilities:` channel, so its rows live only as fragments and can never be folded"
    status: ready
    kind: enhancement
    pickup_role: linux
    priority: p3
    capability_tags: [plan, ledger, crdt, capabilities, compaction, rust]
    deliverable: crates/tillandsias-plan/src/fragments.rs
    depends_on: []
    context: >
      SPLIT FROM 843-624y, which closed on the data-loss bug it was filed for.
      This is the residue, and it is deliberately p3 rather than inheriting p0.

      `fold_capabilities` (fragments.rs) READS the `capabilities:` channel;
      neither `compact` nor `compact_text` ever WRITES it. So the channel has no
      representation in plan/index.yaml and its rows exist only as fragments.

      WHY THIS IS NO LONGER URGENT, and the reason is 843-624y's fix rather than
      anything done here. Compaction used to CONSUME those fragments and delete
      them, destroying 100% of the channel — that is how yolanda's only two rows
      were lost (1d7ae93ef). The coverage check now REFUSES a fragment carrying
      `capabilities:`, so the rows persist indefinitely and the matrix reads
      them. Measured 2026-08-22: `capability-matrix` reports 3 rows, 2 of 6
      known hosts.

      SO THE COST IS NOW SIZE, NOT LOSS: capability fragments accumulate in
      plan/index.d and never fold. The bound is small — roughly one row per host
      per locus, three today for a six-host fleet — which is why this is p3 and
      not p0.

      THE SHAPE OF THE FIX, so it is not re-derived: `compact_text` is
      format-preserving TEXT manipulation, so this is not "serialise a struct".
      It means emitting a top-level `capabilities:` block into the base text and
      teaching `fold_capabilities` to read base ⊕ fragments the way every other
      channel is read. The general invariant it satisfies is already written
      down on 843-624y: FOR EVERY CHANNEL THE FOLD CAN READ, COMPACTION MUST BE
      ABLE TO WRITE IT BACK. A read path without a matching write path is a
      channel that silently empties itself — and today the only thing standing
      between this one and that outcome is a refusal.
    exit_criteria:
      - "A fragment carrying `capabilities:` is CONSUMED by compaction rather than refused, and `capability-matrix` reports the same rows afterwards as before. Same before/after shape the archive sweep uses."
      - "fold_capabilities reads the base as well as the fragments, so a folded row is indistinguishable from a fragment row to every caller."
      - "The generic round-trip assertion from 843-624y covers it: a fragment carrying each known top-level key survives fold -> compact -> fold byte-equivalently, so the NEXT channel added cannot repeat this."
      - "Negative control: remove the capabilities writer and the round-trip assertion goes red naming that channel."

