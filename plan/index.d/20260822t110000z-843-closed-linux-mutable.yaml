        the dominant mode cannot recur.

        WHAT I GOT WRONG ALONG THE WAY, both caught by running things:
          * The zero-terminal guard I added aborted --check, because "zero
            terminal packets is impossible" is false for an ALREADY-ARCHIVED
            ledger — which is exactly what the idempotency second run creates.
            A guard that fires on the correct steady state is an outage.
          * The addressed-fragment exclusion was HALF-APPLIED: terminal_ids is
            keyed by both order and packet_id, the exclusion rejected only the
            packet_id, and a row headed by `- order:` was archived out from
            under a live fragment. The original 424/437 asymmetry, third
            instance. Fixed with an alias map.

        THE ONE ADDENDUM NOT MET is split to 846-idhn: compaction still never
        serialises the `capabilities:` channel. That is now a SIZE concern
        rather than a LOSS one — the coverage check refuses those fragments
        instead of eating them, so the rows persist and the matrix reads them
        (3 rows, 2 of 6 hosts, measured today). Splitting rather than holding
        this p0 open, because a p0 kept alive for bounded fragment accumulation
        misreports what is urgent — and this ledger is read by agents choosing
        what to work on.
