        THAT IS THE SAME READING macneo MADE AND THE SAME ONE THIS ROW EXISTS FOR: `source=absent` means "nothing has been appended yet" and reads as "this host cannot measure". Two of the fleet's three macOS-family hosts have now drawn that conclusion within hours of each other, neither having seen the other's report.
        THE FIGURE MAKES IT WORSE, NOT BETTER. ~2.5M tokens is not a rounding error — it is the scale 1119-6wn6 was filed about, and it is being reported as an estimate by a host that could measure agents and subagent_tokens exactly. The zeros that WOULD be real are being withheld along with the ones that are not, because the instrument gave no way to say which is which.
        This is the three-state problem from the correction note above, arriving from a second direction: a host in state (1) never-appended cannot tell a reader which of its numbers would have been solid. Recorded so the row carries two witnesses rather than one.
