# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by windows (yolanda), 2026-08-18T11:35Z.
#
# Found while clearing a `stale:windows-sources-unverified` advisory this host
# had carried for three cycles. The advisory was not neglect: the verification
# FAILS, and the remedy the failure names cannot run on this host.
#
# No provisioning behaviour was changed. The obvious "fix" is verifiably wrong
# (see the context below), and choosing between the real remedies is a release-
# provenance decision, not a cycle-end judgement call.

packets:
  - packet_id: guest-binary-staleness-guard-names-a-remedy-its-own-host-cannot-run
    order: 827-h4tz
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "the Windows tray embeds a guest headless binary that only a Nix-capable host can refresh, but the tray is built on Windows where Nix is absent — so the staged artifact goes stale by construction and its own guard is unsatisfiable from the crate's owning host"
    deliverable: "the host that owns tillandsias-windows-tray can refresh the staged guest binary, so embedded_guest_headless_matches_workspace_version is satisfiable where the crate is built"
    pickup_role: windows
    release_target: forge-local-experts-milestone
    capability_tags: [windows, wsl2, release, build, provisioning]
    context: |
      MEASURED 2026-08-18 on yolanda.

      THE SYMPTOM. `cargo test -p tillandsias-windows-tray` fails 1 of 94:
        embedded x86_64 guest headless does not contain workspace version
        0.4.260817.1 — stale staged binary; re-run
        scripts/build-guest-binaries.sh then scripts/build-windows-tray.ps1
      The staged artifact
      crates/tillandsias-windows-tray/assets/tillandsias-headless-x86_64-unknown-linux-musl
      is dated Aug 15 00:49 and contains the literal `0.4.260815`; the workspace
      is `0.4.260817.1`. So the tray currently embeds, and provisions guests
      with, a headless binary two days and two version bumps behind itself.

      THE ACTUAL DEFECT IS NOT THE STALENESS. It is that the remedy the test
      prints cannot be run by the host that owns the crate.
      scripts/build-guest-binaries.sh builds via Nix ("since the flake is
      hermetic and release.yml uses it"). Measured on this host:
        nix              ABSENT on the Windows side
        nix              ABSENT in the tillandsias-build WSL2 distro
        musl rust target NOT installed
      windows_native_tray is owner_host windows per
      methodology/distributed-work.yaml, so the crate's owner cannot satisfy the
      crate's own staleness guard. That is why the advisory has been carried for
      three cycles rather than cleared — a structural gap, not an oversight.

      THE OBVIOUS FIX IS WRONG, AND THE CODE ALREADY SAYS SO. Zeroing the asset
      looks attractive because `inject_bootstrap_logic` treats an empty slice as
      "fetch instead", and the aarch64 slot is already zero-length. But the
      comment on that branch (wsl_lifecycle.rs, order 190 step 3 / order 282)
      states the fallback "fetches the LATEST RELEASE, which can be an OLDER
      wire revision than this tray (version skew)". Embedding is the PREFERRED
      path precisely to avoid skew; the test is its guard. Trading a
      known-two-days-stale binary for a possibly-older release download would
      make the failure less visible without making it less real. Not done.

      CANDIDATE REMEDIES, not chosen here:
        (a) A non-Nix build path for the guest binary, runnable in the
            tillandsias-build distro. Worth trying FIRST because the pieces are
            already installed there: musl-gcc-1.2.5-6.fc44 and
            musl-devel-1.2.5-6.fc44 are present and rustup is present, so this
            may be `rustup target add x86_64-unknown-linux-musl` plus a linker
            setting. RISK: the flake exists for hermeticity and release.yml uses
            it, so a cargo-built artifact may not be byte-comparable with the
            released one. Whether the staged artifact must match the release
            bit-for-bit, or merely the wire revision, is the real question.
        (b) CI stages the artifact and the tray build consumes it, so no
            developer host needs Nix.
        (c) Make the guard host-aware — explicitly the WEAKEST option, because
            it silences the signal on the only host that ships this crate.

      NOT ATTEMPTED THIS CYCLE, deliberately: a cold cross-build of
      tillandsias-headless for a new target would not have finished inside the
      remaining window, and a half-built artifact staged into assets/ is worse
      than a stale one. Deciding between (a), (b) and (c) changes where release
      artifacts come from, which is a provenance decision rather than a
      cycle-end judgement call.
    verifiable_closure: "on the Windows host, cargo test -p tillandsias-windows-tray passes including embedded_guest_headless_matches_workspace_version, using a refresh path that host can actually run"
    evidence:
      - "cargo test -p tillandsias-windows-tray: 93 passed, 1 failed (embedded_guest_headless_matches_workspace_version)"
      - "assets/tillandsias-headless-x86_64-unknown-linux-musl contains 0.4.260815; VERSION is 0.4.260817.1"
      - "nix absent on the Windows side and in tillandsias-build; musl rust target not installed"
      - "musl-gcc-1.2.5-6.fc44.x86_64 and musl-devel-1.2.5-6.fc44.x86_64 ARE installed in tillandsias-build"

