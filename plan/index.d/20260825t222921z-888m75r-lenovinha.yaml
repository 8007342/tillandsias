packets:
  - packet_id: promote-stable-evidence-gate-is-platform-aware
    order: 888-m75r
    release_target: fail-loud-diagnosis-milestone
    status: completed
    desired_release: v0.5
    role: tooling
    priority: p0
    kind: bug
    title: |
      scripts/promote-stable.sh accepted one platform's e2e PASS as evidence for all three, and was satisfied by incidental co-occurrence in ledger files.
    deliverable: scripts/promote-stable.sh
    depends_on: []
    pickup_role: linux
    owner_host: lenovinha
    capability_tags:
      - ci-release
      - build-gate
      - fail-loud
      - multi-host
    estimated_hours: 3
    problem: |
      Requested by the coordinator (macuahuitl) on 2026-08-25 as a blocker for an
      operator-directed stable promotion. Two defects, both measured.

      (1) PLATFORM-BLIND. The gate asked only whether SOME file under plan/
      asserted a PASS for the version. Tillandsias ships three platforms and the
      operator's acceptance criterion is that each one passed; one platform's
      PASS satisfied the gate for all three.

      (2) PASSING ON JUNK. For v0.4.260817.1 the two files that satisfied the
      gate's first branch were plan/index.yaml — whose packet body DESCRIBES
      this gate's own past defect, so "smoke", "PASS" and the version co-occur
      while describing a bug — and a freshness-audit line in a lenovinha
      loop_status entry. The genuine Windows report was reachable only via a
      filename fallback that never ran, because branch 1 had already matched.
      The verdict was accidentally right; the mechanism was not.

      The two defects were jointly CONCEALING a fact that mattered: measured
      against the live ledger, v0.4.260817.1 has evidence for exactly ONE
      platform (windows). No linux and no macos e2e report exists for it. The
      old gate promoted it regardless. That survey changed the coordinator's
      plan for the night from "promote 260817.1" to "cut a fresh daily".
    why_it_matters: |
      This is the gate that decides what reaches stable users. A release gate
      that is accidentally right is not a gate; the next version's accident can
      fall the other way, and nothing in the mechanism would notice.
    exit_criteria:
      - |
          Evidence is required PER PLATFORM (linux/macos/windows), and the refusal NAMES the missing platforms rather than reporting a bare absence.
      - |
          Incidental co-occurrence stops counting: ledger surfaces (plan/index.yaml, plan/index.d/, loop-status ledgers, attestation ledger, plan/archive/) are never evidence, and a file must NAME itself as an e2e/smoke/findings report.
      - |
          Platform detection is scoped to the filename and first heading, so a report's prose mentioning another platform does not award that platform coverage.
      - |
          --force still overrides, is not weakened, and its warning NAMES the platforms being overridden.
      - |
          Negative controls pin all of the above, including that a one-platform PASS does not satisfy a three-platform requirement and that the two real junk matches stop counting.
    verifiable_closure: |
      scripts/test-promote-stable-evidence-gate.sh, wired into ./build.sh --check,
      passes 23/23 including the pre-existing mutation control.
    events:
      - type: filed
        ts: "2026-08-25T22:40:00Z"
        agent_id: lenovinha-opus5-metaorch-20260825t213705z
        host: lenovinha
        summary: |
          Requested by macuahuitl as a promotion blocker. Both defects reproduced
          against the live ledger before any code changed.
      - type: implemented
        ts: "2026-08-25T23:05:00Z"
        agent_id: lenovinha-opus5-metaorch-20260825t213705z
        host: lenovinha
        summary: |
          THREE CHANGES, and the third is the one that was not in the request.

          1. Per-platform requirement. TILLANDSIAS_REQUIRED_PLATFORMS defaults to
             "linux macos windows"; the refusal is
             `refused:no-evidence:<tag>:missing=<csv>`, which keeps the pinned
             grammar `^refused:(no-evidence|...):.*$` intact while naming what is
             absent. Configurable so a fourth platform is a config change.

          2. Ledgers are not reports. plan/index.yaml, plan/index.d/, the
             loop-status ledgers, the attestation ledger and plan/archive/ are
             excluded outright — they are surfaces where a version string and the
             word PASS co-occur constantly and mean nothing about a test run.

          3. NOT REQUESTED, FOUND WHILE VERIFYING, AND THE SHARPEST OF THE THREE:
             the second (legacy) matching pass accepted ANY file under plan/ with
             e2e|smoke + PASS + version on one line. Measured on the real
             plan/issues/windows-next-work-queue-2026-07.md, it accepted a line
             reading "run PASS end-to-end ... but promotion verdict for the tag
             UNCHANGED (morning FAIL)". A line stating the promotion verdict is
             FAIL was counting as promotion evidence. Requiring report identity
             makes that pass a strict SUBSET of the first, so it was removed
             outright: there is now ONE rule rather than two.

          PLATFORM DETECTION IS SCOPED, and this is the subtle part. The genuine
          Windows report contains "that lane is Linux/Podman per the skill's
          §0.1". A whole-file grep for "linux" awards it linux coverage —
          reproducing defect (2) one level down, now deciding COVERAGE instead of
          existence. Platform is therefore read only from the filename and the
          first heading line, both authored as identity rather than prose.
          Verified against all four real reports in the ledger.

          Per coordinator ruling: a report asserting PASS while disclaiming
          promotion clearance ("run-scoped; does NOT clear promotion") still
          COUNTS — a matcher chasing unbounded prose rots, and eventually fails
          in the dangerous direction when new phrasing reads as clearance — but
          the gate now WARNS loudly and names the report, so the disclaimer is
          machine-visible without being machine-interpreted.
      - type: verified
        ts: "2026-08-25T23:15:00Z"
        agent_id: lenovinha-opus5-metaorch-20260825t213705z
        host: lenovinha
        summary: |
          scripts/test-promote-stable-evidence-gate.sh 23/23 (was 10 cases).
          New negative controls: each platform alone refused naming the other two
          (three cases); two-of-three refused naming the third; ledger
          co-occurrence (a reconstructed index.yaml packet body + loop_status
          line) not evidence; the work-queue log line not evidence; a windows
          report whose BODY mentions Linux does not award linux coverage; --force
          still overrides and its warning names the missing platforms; the
          disclaimer warning fires when disclaimed and stays SILENT on clean
          evidence (a warning that fires every run is one nobody reads);
          TILLANDSIAS_REQUIRED_PLATFORMS honoured.

          AGAINST THE LIVE LEDGER, both controls the coordinator specified:
            v0.4.260815.1 (all three platforms, 2026-08-16) -> complete, promotable
            v0.4.260817.1 (windows only)                    -> missing=linux,macos
          A gate with only one of those controls would be worthless: the first
          proves it is not too strict to clear a real release, the second that it
          is strict enough to catch the case that motivated it.

          The pre-existing MUTATION CONTROL needed its precondition updated — it
          seeded one unplatformed file, so the new gate refused before reaching
          the mutating code and the tripwire never fired. That reported as "the
          tripwire cannot see writes", which reads as a broken harness rather
          than a stale fixture; it now seeds all three platforms and fires.
          ./build.sh --check green.
