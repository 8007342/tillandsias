        measures whether the expert RESOLVES what it is asked; it says nothing
        about whether querying is cheaper than the alternative. Antigravity
        measured that directly (plan/issues/mcp-server-performance-and-discoverability-audit-2026-08-01.md
        and the order-557 validation event): the expert lane is roughly 80x
        cheaper and 5x faster than naive ledger browsing for a cloud agent, with
        the deterministic CLI at about 30ms and zero token cost, and per-tool
        latencies of 21-86ms across both MCP servers.
        That is a THIRD axis beyond used-and-useful, and it is the one that
        actually motivates adoption: an expert can be well-used and
        high-answer-rate and still not worth calling if it costs more than
        reading the file. Here it is three orders of magnitude the other way.
        NOT folded into answer_rate, deliberately. Cost is a property of the
        SURFACE, measured once per change, whereas answer_rate is a property of a
        CYCLE. Averaging them would let a cheap surface mask a useless one, which
        is the same conflation this packet refused when it excluded `degraded`
        from the answer-rate denominator.
