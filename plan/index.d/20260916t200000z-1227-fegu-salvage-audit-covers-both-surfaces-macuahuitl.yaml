    title: |
      The salvage audit defaulted to refs/heads/salvage/* alone — the smaller surface — and skipped refs/heads/work/*, which is the namespace the land tool tells a blocked host to use
    context: |
      1226-jb8y shipped the audit yesterday with PATTERN="refs/heads/salvage/*"
      as its default. MEASURED 2026-09-16: that is the SMALLER HALF — 12 salvage
      refs against 24 work refs — and work/ is where
      scripts/land-on-platform-branch.sh's OWN REFUSAL TEXT instructs a host to
      push a gated tree when its gate cannot win the race against trunk. So the
      namespace a stranded host is INSTRUCTED to use was precisely the one the
      audit built to find stranded work did not look at.
      IT COST SOMETHING BEFORE IT WAS FOUND. Pointing the audit at work/ for the
      first time, in coordination pass 48, surfaced
      plan/index.d/20260905t185305z-013bda76-lenovinha.yaml on work/1069-c9w6 —
      a note event ABSENT FROM TRUNK since 2026-09-05, eleven days. It was
      relayed that pass. Nobody had queried that namespace because the tool's
      default said it did not need querying.
      THIS IS THE AUDIT'S OWN FALSE NEGATIVE, ONE LEVEL UP, AND THE SECOND OF
      ITS KIND. 1226-jb8y also shipped with a for-each-ref prefix-versus-glob
      bug that matched ZERO refs and printed skipped:no-refs — indistinguishable
      from "nothing is stranded". Both were caught by RUNNING the instrument
      against the real fleet rather than by a green fixture, which is 970-7fqk's
      lesson from the same day.
    exit_criteria:
      - 'the default audits BOTH refs/heads/salvage/* and refs/heads/work/*, and the audited ref count accounts for both (pre-fix result: FAILS — default covered 12 of 36 refs and missed the eleven-day-old stranded event entirely)'
      - '--pattern still narrows to a single namespace, so the wider default costs no ability to scope'
      - 'the fixture asserts NAMING and AUDITING separately, because a header that names both surfaces over a one-surface sweep is decoration'
    unscoreable: |
      pinned-by-a-gate-fixture-not-a-litmus: the obligation IS verifiable and IS
      enforced — scripts/test-salvage-audit.sh ARM 1b asserts, in two halves,
