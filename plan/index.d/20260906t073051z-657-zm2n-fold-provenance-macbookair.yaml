        SO THE HONEST FORM IS: those were the states in this host's fold, on
        osx-next, at the time of the audit commit 0518312ac
        (2026-09-05T21:13:36-07:00), whose immediately preceding commit
        fe877d1ee (21:10:09-07:00) is a merge of origin/linux-next. I merged
        trunk about three minutes before the read, so the window is small — but
