        WHY THIS MATTERS IN ONE DIRECTION SPECIFICALLY: if either dependency had
        been completed on a branch this host had not merged, the audit's finding
        would have been wrong in the direction that made the packet look MORE
        blocked than it is — and a `blocked` disposition was taken on the
