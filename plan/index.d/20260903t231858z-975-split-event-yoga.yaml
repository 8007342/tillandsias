events:
  - packet_id: enclave-ca-bundle-lives-in-tmp-so-containers-cannot-restart
    event:
      type: progress
      ts: "2026-09-03T23:18:58Z"
      agent_id: linux-yoga-claude-20260903t230923z
      host: yoga
      summary: |
        HALF (a) SPLIT RATHER THAN STARTED, and a ratchet landed so the problem
        cannot grow while it waits.

        WHY IT DID NOT FIT. Moving the bundle off /tmp means touching
        `/tmp/tillandsias-ca` in 38 occurrences across 16 files — including
        crates/tillandsias-macos-tray/src/diagnose.rs (8 of them), which this
        host cannot test. And relocating it while the path is written in 38
        places would move some and miss others, with the misses failing in the
        quietest possible way: pointing at a directory that is not there, on a
        recovery path that only runs when something is already wrong.

        TWO CHILDREN, ordered by depends_on:
          998-qrwu (p1) — single-source the path. tillandsias-core is a
            dependency of BOTH tillandsias-headless and tillandsias-macos-tray,
            so it is where the declaration belongs; shell reads one env default.
          998-3z6g (p0) — relocate and MIGRATE. The bind SOURCE is recorded per
            container at creation, so existing proxy containers must be
            RECREATED, not restarted. That is the part that is not a constant
            change.

        THE RATCHET: scripts/check-ca-path-literals.sh, wired into
        ./build.sh --check. It refuses a RISE, not the standing debt — redding
        38 existing literals would get it switched off within a day, which is the
        failure this fleet has demonstrated twice this week. Mutation-verified:
        adding one literal gives `violation:ca-path-literals-grew:39 of 38`, and
        removing it returns to ok.

        THREE COUNTS FOR ONE QUANTITY, AND I FILED THE WRONG ONE. My packet said
        "36 places". That was a LINE count from `grep -rn | wc -l`, and a line
        can carry the literal twice. The occurrence count — the number of SITES
        that must move, which is the only unit that matters here — is 38 with the
        guard's own mentions excluded, 42 without. I have corrected the packet to
        38 and said in it which unit and why. The convenient unit was the wrong
        one again; this is the same defect the fleet spent yesterday finding in
        ms/chunk.

        AND THE RATCHET CAUGHT ITS OWN BASELINE ERROR ON ITS FIRST RUN,
        reporting `37 of 36` against a baseline I had just typed from the line
        count. A guard whose first act is to refuse the number its author gave it
        is doing exactly what it is for.

        ONE MORE, WORTH RECORDING BECAUSE IT NEARLY SHIPPED: my first fix to the
        counting command was written through a perl substitution that replaced
        the quote characters with `.`, turning the fixed string into a regex.
        The script then counted 38 while a direct count said 39, and the mutation
        test PASSED THE ADDED LITERAL — a ratchet that could not detect growth.
        Caught only by comparing the script's number against a hand-run count of
        the same thing. A guard that cannot fail is the defect I have been
        finding in other people's work all week, and I wrote one.

        MY OWN SCORABLE-OBLIGATION GATE REFUSED 998-3z6g, correctly: its closure
        is a host-level reboot-and-recover observation, which no litmus or script
        verdict can stand in for. It now carries an explicit `unscoreable:` with
        that reason — the escape hatch used for the case it exists for, by its
        own author, one cycle after building it.
