    event:
      type: note
      ts: "2026-09-19T00:14:25Z"
      agent_id: windows-esme-claude-20260918t201100z
      host: esmeraldinha
      summary: |-
        NEGATIVE RESULT FROM A HOST THE ROW EXPECTED TO REDS, plus the discriminator that explains it. esmeraldinha ran the fixture inside a full ./build.sh --check on 2026-09-18 and it PASSED:

          Checking the plan-binary probe resolves the locus-native artefact (1030-i2p8)...
          ok: with both artefacts runnable, the probe resolves the locus-native ELF (./target/release/tillandsias-plan)
          plan-binary-locus-native: 3 passed, 0 failed

        TILLANDSIAS_PLAN_BIN is unset here (`echo "[${TILLANDSIAS_PLAN_BIN}]"` prints `[]`, and nothing in ~/.bashrc, ~/.bash_profile or ~/.profile sets it). This host has a Rust toolchain and builds its own tillandsias-plan, so it never needed the export at all.

        SO THE CONDITION IS THE ENVIRONMENT, NOT THE PLATFORM, and A TOOLCHAIN CONFERS IMMUNITY. The fixture reds on hosts that MUST export TILLANDSIAS_PLAN_BIN to have an instrument — which is the set of toolchain-less hosts, whatever their OS. Naming a Windows host as the next to hit it teaches the wrong rule and would send the next reader looking for an MSYS or path-separator cause that is not there. Windows is a coincidence of who happened to be toolchain-less.

        A SHARPER POINT THAT BELONGS HERE, because it is the same confusion one level down: ./target/release/tillandsias-plan IS TWO DIFFERENT BINARIES DEPENDING ON WHO LOOKS. From Git Bash on the Windows side, `file` reports PE32+ executable for MS Windows. From inside the WSL2 builder distro — which is where ./build.sh --check actually runs on this host — the gate resolves the same path as "the locus-native ELF". One path, two artefacts, and the locus decides which is native.

        CONSEQUENCE FOR ANY VERDICT THIS FIXTURE OR ITS SIBLINGS PRODUCE: a plan-binary freshness or runnability verdict is not a measurement unless it names the locus it was measured from. "The plan binary is stale" is unanswerable without "stale as seen from where", and a check that reads the Windows-side artefact while the gate runs the ELF is comparing two different files that share a name. This is the same class as the git-identity verdict on this host reading AT-RISK from Git Bash and SAFE inside the builder distro.
