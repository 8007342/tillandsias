    title: "send_issue_web_session dials the tray's current control socket (control/control.sock, the legacy path only when that is absent), and resolve_cloud_project_checkout gives a --cloud value spelled with .git or a trailing / the bare project name"
    context: |
      REPORTED 2026-11-09 from the tlatoani.net forge (tray v56.11.9.1+c11b02b9), from ~/.local/state/tillandsias/studio-tlatoani.net-grapesjs.log:
      (1) "Failed to register web session with router: Failed to connect to control socket /run/user/1000/tillandsias/control.sock: Connection refused". That file was a stale real socket from Nov 5, while the running tray served /run/user/1000/tillandsias/control/. send_issue_web_session built the pre-2007 path itself, and link_legacy_control_socket never replaces a real file.
      (2) "refused:lane-tray-version-mismatch … Project 'tlatoani.net.git' is not a known project on this host". known-cloud-projects lists "tlatoani.net", but the lane, its git service (git-tlatoani.net.git) and MCP socket (tlatoani.net.git-default) carried ".git". resolve_cloud_project_checkout took the label as the last "/" segment as typed, and for owner/repo.git it also built https://github.com/owner/repo.git.git. validate_project_label is verbatim by design (order 505), so the fix is at the source.
    exit_criteria:
      - "With a stale real socket at <runtime>/tillandsias/control.sock and a tray serving control/control.sock, send_issue_web_session succeeds against the live tray. Pre-fix result: FAILS, Connection refused on the legacy path."
      - "resolve_cloud_project_checkout gives tlatoani.net for owner/tlatoani.net, owner/tlatoani.net.git, owner/tlatoani.net/, the https clone URL with and without .git, and the git@ form; no remote ends .git.git; owner/.git is refused. Pre-fix result: FAILS, Ok(\"tlatoani.net.git\")."
    verifiable_closure: "tray_notify_tests::issue_web_session_dials_the_trays_current_socket_not_a_stale_legacy_one and tray_notify_tests::a_cloud_value_spelled_with_dot_git_names_the_bare_project pass under --features tray,listen-vsock. Pre-fix result: both FAIL with the live forge's two errors."
