  - packet_id: webstudio-open-hands-back-a-window-url-browser-open-admits-by-serving-the-studio-route-over-the-preview-tls-listener
    order: 2067-uc3k
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [studio, router, tls, otp, browser]
    estimated_hours: 6
    owned_files:
      - crates/tillandsias-headless/src/studio.rs
      - crates/tillandsias-headless/src/local_web_preview.rs
    title: "webstudio.open's window_url is an https URL on the preview TLS port that browser.open admits, because the studio's route is served over the preview TLS listener with the same OTP session as its plain route"
    context: |
      REPORTED 2026-11-09 (bug 3 of the tlatoani.net report): webstudio.open answers window_url http://studio.tlatoani.net.localhost:8080/, and browser.open refuses it in container mode (server.rs, order 1651-5t7n: "browser windows load the project over https only", because the forwarder binds a project only by TLS name).
      open_from_lane builds the URL with project_service_url on LaneLauncher::router_port, the plain listener. The ComfyUI window (imagegen_studio::window_url) already uses https://<service>.<host_label>.localhost:<tls_port>/, but it routes with add_network_limited_route (preview_tls, allow_cidr) and `comfyui` is in DEV_SERVICES, so the leaf names it.
      The studio route is an OTP-protected route on the plain listener. Moving its window to https is a design decision, not a URL change: the leaf must name studio.<label> (DEV_SERVICES), the route must carry preview_tls, and the OTP cookie and /_auth/login must work on the TLS listener for the operator's window too. Deciding whether the agent co-edit window gets the OTP session, or a network-limited route like ComfyUI's, is part of this row.
    exit_criteria:
      - "webstudio.open answers a window_url of the form https://studio.<host_label>.localhost:<preview tls port>/, and browser.open {url: window_url, dev: true} in container mode admits it."
      - "The operator's window and the agent's window both reach the authenticated studio over that URL; an unauthenticated request is refused as today."
      - "The mcp_socket webstudio.open test pins the https form; pre-fix result: FAILS (it pins http://studio.<p>.localhost:8080)."
    verifiable_closure: "A live webstudio.open grapesjs opens a window, and browser.open of its window_url is admitted. Pre-fix result: FAILS (URL_NOT_ALLOWED: https only)."
    unscoreable: |
      unpinnable-until-the-guard-exists: the implementer adds the https pin and the live arm in the same commit (1136-n8sh).
    next_action: >
      Decide the auth shape (OTP session on the TLS listener vs a network-limited route), then add studio to DEV_SERVICES, route it with preview_tls, and build window_url from tls_port and host_label.
    provenance: |
      macuahuitl-fedora relay 2026-11-09; yoga source read of studio::open_from_lane, imagegen_studio::window_url, local_web_preview::{add_network_limited_route, DEV_SERVICES} and browser-mcp server.rs.
    events:
      - type: filed
        ts: "2026-11-09T05:00:00Z"
        host: yoga
        summary: "filed as its own row; the route and auth design needs deciding before code"
