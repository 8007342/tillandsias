      summary: |-
        THE STEP-LEVEL POPULATION, measured on esmeraldinha at trunk 3048e72dc, offered as an input to this row rather than as a claim on it. This row counts TESTS that cannot be reached under their own name. The same question at STEP level has a number, and it is larger than I expected: 53 of the 244 steps the enforcement census calls ENFORCED live in litmus files that NOTHING RUNS. That is 21.7 percent of the enforced population inert by construction. METHOD, so it can be re-run or refuted. For each openspec/litmus-tests/litmus-*.yaml I took its declared name field, tested membership in the set of names bound anywhere in litmus-bindings.yaml, and for the non-members counted step blocks and step blocks carrying any of assert_exit, assert_output_contains, assert_output_matches, assert_output_nonempty or success_pattern as a KEY. 446 files, 429 bound names, 16 files nothing runs, 107 steps in them, 53 of those enforced. THE SIXTEEN, with their reason and their enforced-of-total. ca-ephemeral 7 of 8 grandfathered. cross-platform-terminal-attach 7 of 7 grandfathered. macos-tray-menu-renders 8 of 8 grandfathered. windows-tray-menu-renders 6 of 6 grandfathered. vm-shutdown-drains-forges 6 of 6 grandfathered. mount-cleanup 6 of 8 grandfathered. vm-provisioning-idempotent 5 of 5 grandfathered. toolbox-isolation 3 of 8 retired. build-cache-transparent 2 of 7 retired. build-clean-from-scratch-works 2 of 7 retired. control-dispatch-shape 1 of 7 grandfathered. WHAT I AM NOT SAYING, because the reading matters. This is NOT laundering by whoever closed 1329-m8dk, and it would be unfair to read it that way. Most of these files are historical strays that were grandfathered with their assertions already in place years of commits ago; the enforcement is older than the census that counts it. What the number says is narrower and still worth having: the ENFORCED figure OVERSTATES real enforcement by about a fifth, so any closure expressed as a count of enforced steps inherits that overstatement. 1329-m8dk's own closure asked for an assert that FAILS WHEN THE BEHAVIOUR IS MUTATED, demonstrated rather than asserted, and for a step in an unbound or retired file that demonstration cannot be performed at all - not because anyone was careless, but because there is no runner path to the step. SUGGESTED SHAPE, offered not filed. The enforcement census could report two lines instead of one, ENFORCED-REACHABLE and ENFORCED-INERT, which costs one membership test it already has the data for, and then a closure figure means what a reader assumes it means. That is this row's question and the enforcement row's question joined at the only place they actually differ. CORRECTION TO MY OWN EARLIER DIAGNOSIS, which this row got right and I did not. I reported that litmus:cross-target-cfg-gate-check could not be run here because spec dev-build fail-fasts on a podman test. That is true of my SECOND attempt. My FIRST attempt asked for it by the spec the file itself declares, cross-platform-compilation, and got 'no litmus tests matched filter' - and I read that as my own mistake about runner arguments rather than as the corpus defect this row names. The spec-name mismatch is the better explanation for why those mutation arms sat owed across two hosts, and it was in front of me.
