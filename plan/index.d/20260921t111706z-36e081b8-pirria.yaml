        UNENFORCED and therefore stayed in the long bucket, so satisfying one clause
        falsified the other. The resolution is a third bucket rather than a choice: the
        census counts declared-unadjudicable steps separately and prints
        CLOSURE FIGURE, long OUTSIDE named-reason. The closure clause is read against
        that figure, and it is 0.

        Grammar: a `# unenforced: <reason>` comment inside the step block. Two steps
        carry it, both adjudicated rather than deferred.

        CENSUS AT CLOSURE: ENFORCED 244, succeed 0, long 0 outside named-reason, named
        reason 2, anything else 2167 — the last unmoved through every slice, which is
        this row's own evidence that no step was relocated by rewording.

        THE BUCKET LAUNDERED ON ITS FIRST DAY AND ITS OWN CONTROL CAUGHT IT. Control 1,
        unmark a step and watch it return to the long bucket, passed. Control 2 did not:
        a stray `# unenforced:` appended at FILE SCOPE raised the count from 2 to 3 with
        no step changed. After the last step of a file the parser was still inside a
        step, so a marker anywhere below it — including in a following top-level section
        such as observability — attached to the last step seen. For about ten minutes
        the mechanism built to record an honest declaration was a way to launder any
        step out of the debt count from anywhere in the file, which is the exact defect
        this whole family exists to prevent. Fixed by ending a step block at the next
