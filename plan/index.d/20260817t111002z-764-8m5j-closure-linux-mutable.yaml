      summary: |
        NEGATIVE CONTROLS, and one gap left open on purpose.

        The two new steps derive their inputs from the corpus instead of naming
        a test: STEP 3 takes the first litmus whose name does not itself begin
        with "litmus-", reads that file's own spec line, and requires the hint
        to name THAT spec. So a test rename or a spec rename cannot make it
        pass vacuously, and it pins no literal (634-39ik). STEP 4 is the
        negative control: a bare name-shaped typo must still fail loud with no
        hint at all.

        Mutation: reverting the bare-id candidate turns STEP 3 red and leaves
        STEP 4 green — which is the correct signature, since a typo resolves to
        nothing either way. A mutation that reddened BOTH would have meant the
        negative control was measuring the same thing as the positive one, and
        would have been a reason to distrust the pair.

        GAP LEFT OPEN, named so nobody thinks it was covered: an id typed as
        "litmus-foo-bar" — the FILE stem, hyphen rather than colon — still
        takes the old branch, probes for a test literally named
        "litmus-foo-bar", finds nothing, and gets no hint. Real declared names
        are "litmus:foo-bar". Closing it means probing the colon form of
        anything after a leading "litmus-" as a third candidate. It was left
        alone because the observed failure was the bare form, and because that
        branch is exactly what the pre-existing contract steps exercise —
        widening it deserves its own negative control rather than a drive-by
        edit made while the packet was already being closed.
