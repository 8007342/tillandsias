packets:
  - packet_id: forge-launch-disk-headroom-preflight
    order: 597-fmm2
    status: ready
    desired_release: v0.5
    role: runtime
    tags: [forge, launcher, preflight, diagnosability, cross-platform]
    title: >
      Preflight disk headroom before forge/enclave launch and name the cause,
      instead of surfacing a bare podman exit 125.
    problem: >
      VERIFIED 2026-08-03 on linux-mutable: `df /` reports 952G total, 905G used,
      44G free — 96%. VERIFIED by grep across crates/tillandsias-headless/src/*.rs
      and scripts/*.sh: there is NO disk-headroom check anywhere on the launch
      path — no statvfs, no available-space probe, no free-space guard.

      A forge image is 3.13GB and the enclave pulls several more. When the volume
      cannot absorb a layer, podman fails the build or the run, and the user is
      shown `FORGE_EXIT=125` with no cause. Exit 125 means podman failed BEFORE
      the container ever executed, so every runtime-side diagnostic an agent
      reaches for is looking at the wrong layer — the container it wants to
      inspect was never created.

      This is the project's named recurring failure in its native habitat:
      the condition is perfectly visible from the host and completely invisible
      at the point of use.
    why_it_matters: >
      An end user on a full disk currently gets an opaque number. Worse, the
      remedy an agent reaches for is the order-281 self-heal, which is
      destructive and does not fix a full disk (see
      overlay-self-heal-must-not-destroy-durable-volumes).
    exit_criteria:
      - >
        The launch path probes available bytes on the podman graphroot filesystem
        BEFORE attempting image build or container run, and refuses with a message
        naming the filesystem, the bytes free, the bytes required, and the
        shortfall.
      - >
        The threshold is derived from the actual image set to be materialised, not
        a hardcoded constant that ages badly.
      - >
        A litmus test asserts the refusal message shape on a simulated low-space
        condition — the check must be executable, not prose.
      - >
        The probe is cross-platform: Linux, the macOS VZ guest, and the Windows
        guest all run podman inside a guest whose virtual disk can fill
        independently of the host's. Verify what each platform can actually see.
    notes: >
      Deliberately NOT auto-pruning. Reclaiming space is the operator's decision:
      on this host the 905G is overwhelmingly operator data (Games 287G, Steam
      126G, tillandsias-bak 234G), and the project's own reclaimable footprint is
      14.55GB of stale podman images (507 images, 7 active). A launcher that
      silently deleted images to make room would be making that call for them.
      Diagnose and refuse; let the operator choose what goes.

  - packet_id: overlay-self-heal-must-not-destroy-durable-volumes
    order: 597-pr4x
    status: ready
    desired_release: v0.5
    role: runtime
    tags: [forge, podman, data-loss, self-heal, order-281, cross-platform]
    title: >
      The order-281 overlay self-heal runs `podman system reset --force`, which
      destroys the git mirror and the forge cache. Narrow it or protect them.
    problem: >
      VERIFIED at crates/tillandsias-headless/src/main.rs:1869 —
      `is_overlay_corruption_error` fires on an error containing BOTH "overlay"
      and "no such file". VERIFIED at :1902-1929 — `try_overlay_self_heal` then
      runs `podman system reset --force` once and retries the build once. The
      one-shot `healed` flag is correct and does prevent an infinite loop; that
      part of the design is sound.

      The problem is blast radius, not looping. `podman system reset --force`
      removes ALL images, containers, networks, AND VOLUMES. VERIFIED via
      `podman volume ls` on this host, two of those volumes are durable state:

        * `tillandsias-mirror-tillandsias` — the git mirror. Forge containers push
          through it as their credential channel (the meta-orchestration
          Credential Channel Guard names exactly this: "forge containers use a
          transparent git mirror service for authenticated pushes"). Any forge
          commit that has reached the mirror but not yet reached origin is
          destroyed with no signal.
        * `tillandsias-forge-cache-tillandsias` — the forge cache, including the
          brew cache the operator explicitly asked to stay warm so sequential
          forge launches perform only quick upgrades.

      `podman system df` on this host: 16.13GB of local volumes, 4 active.

      The trigger and the cause are not the same thing. Order 281's actual cause
      was a KILLED BUILD leaving a layer reference pointing at a missing diff dir.
      A build killed by a FULL DISK produces the same signature — and for that
      cause the reset is both maximally destructive and useless: it frees space,
      rebuilds, refills the disk, and fails again, having destroyed the mirror
      and the cache on the way.
    exit_criteria:
      - >
        Before any reset, check disk headroom (shares the probe from
        forge-launch-disk-headroom-preflight). If the real cause is space, refuse
        with that diagnosis and do NOT reset.
      - >
        Replace the blanket `system reset --force` with the narrowest action that
        clears corrupted overlay state, or explicitly back up / recreate the
        durable volumes around it. `podman system reset` is a sledgehammer for a
        layer-reference problem.
      - >
        Durable volumes are enumerated in ONE place and named as durable, so a
        future destructive path cannot silently include them.
      - >
        A litmus test asserts that the self-heal path does not destroy
        `tillandsias-mirror-*` or `tillandsias-forge-cache-*`.
      - >
        UNVERIFIED FROM HERE, and the packet must resolve it: whether the mirror
        can in fact hold commits not yet at origin at the moment a reset fires.
        If it cannot, the data-loss claim reduces to cache loss and this packet
        drops in severity — establish which before designing the fix.
    depends_on: [forge-launch-disk-headroom-preflight]

