packets:
  - packet_id: plan-issues-citations-rot-with-nothing-checking-them
    order: 881-29me
    status: ready
    kind: bug
    priority: p2
    pickup_role: any
    desired_release: v0.5
    release_target: architecture-audit-epic
    depends_on: []
    estimated_hours: 3
    capability_tags:
      - ci-gates
      - fail-loud
      - plan
      - audit
    tags:
      - citation-drift
      - evidence
      - v0.5
    title: |
      A `plan/issues/` audit cites evidence by `file:line`, nothing checks those citations still resolve, and they rot silently while the document keeps reading as verified.
    deliverable: |
      An executable check that a `file:line` citation in `plan/issues/` still
      points at something plausibly related — or a recorded decision that these
      documents cite by SYMBOL instead, with the audit template updated to match.
    context: |
      MEASURED on yoga 2026-08-25 at linux-next 23671a86e, taking the linux
      revision slice of order 245 (network-architecture-audit).

      Every factual claim in that document's CONTAINER network matrix
      re-verified TRUE. Every `file:line` citation supporting them pointed at
      unrelated code:

        * `main.rs:1136-1145`, cited for ENCLAVE_ONLY_NET -> a
          `format_age_secs` branch. The const is near 1597.
        * `main.rs:2973-2975`, cited for git_mirror_service_identity -> an
          "ensure tillandsias-egress network" refusal. The fn is near 3997.
        * `main.rs:2553-2554`, cited for `--hostname proxy` -> a bare
          `return Vec::new()`. `build_proxy_run_args` is near 3345.
        * three more browser-related spans, all similarly displaced.

      THE DRIFT IS TOTAL, NOT AN OFFSET. `main.rs` has grown past 22,000 lines
      and the citations are weeks old. That is the dangerous shape: a reader
      following one does not hit an obviously dead link, they land in
      plausible-looking neighbouring code and may "verify" a claim against
      something unrelated. A confidently wrong citation is worse than none.

      THE TREE ALREADY SOLVED THIS FOR TESTS AND NOT FOR PROSE.
      `scripts/check-source-slice-bounds.sh` (order 797-8dzt) exists because a
      test slicing its own source between two SYMBOL NAMES silently widens when
      one is renamed away; `scripts/check-litmus-pin-claims.sh` (721-77yu)
      exists because a script can claim a litmus pin that cannot execute. Both
      ask "can this assertion still fail?". Nothing asks it of an audit's
      evidence, even though `plan/issues/` is where this project puts the
      findings it most wants to survive.

      SCALE, measured on that one document: 90 line-number citations across 20
      distinct files. The §1/§1.1 subset was repaired by hand this cycle by
      anchoring on symbol names; 80 remain, and there are many other audits.

      A NOTE FOR WHOEVER TAKES THIS, because the naive gate is worse than
      nothing: a checker that merely confirms "the file has at least that many
      lines" would pass every single one of the drifted citations above. The
      check has to compare the cited span against what the citation CLAIMS —
      which is why the honest answer may be the second branch, converting the
      convention to `file:symbol` and updating the audit template, rather than
      trying to validate line numbers at all.
    exit_criteria:
      - |
          Either an executable check refuses a `plan/issues/` citation whose
          cited span cannot be related to the claim it supports, OR a recorded
          decision that these documents cite by SYMBOL, with the audit template
          and NA-05's "specific file:line references" wording updated to match.
      - |
          NEGATIVE CONTROL: a fixture citation that has drifted is proven to be
          refused (or, for the symbol branch, a fixture line-number citation is
          proven to be refused by the convention check). A gate that merely
          bounds-checks the line number would pass every drifted citation
          measured above and must not be accepted as satisfying this.
      - |
          POSITIVE CONTROL: a correct citation passes, so a check that refuses
          everything cannot satisfy the criterion.
      - |
          Whatever lands is INVOKED by ./build.sh --check or an existing gate
          phase, not merely written — an orphaned guard is the 865-n8vq shape.
    verifiable_closure: |
      The check runs in the gate with both controls, and its negative control
      is one of the six real drifted citations recorded in order 245's L1
      section (they are dated and reproducible at 23671a86e).
    notes: |
      Sibling gates to model on, not duplicate: check-source-slice-bounds.sh
      (797-8dzt), check-litmus-pin-claims.sh (721-77yu),
      check-mo-full-attestations.sh. All three verify that a claim can still be
      checked; this is the same question asked of prose evidence.
