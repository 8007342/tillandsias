# Ledger fragment — append-only, IMMUTABLE once written.
# Operator rulings on message semantics, 2026-09-29 (relayed by the
# coordinator, two messages, the second refining the first):
#  (1) the ACK is produced by the INFRASTRUCTURE and exchange layer (mailbox
#      daemon or mover), NEVER by an inference layer or an agent: "An agent
#      does 'send this to agent X' and near immediately gets an ACK meaning
#      the message was delivered, not read. And that's it." send returns a
#      receipt id at once; status answers acked or undelivered; no agent
#      writes an ACK and no agent writes a ledger event for delivery;
#  (2) EPHEMERAL QUEUE WITH TTL: default 86400 s (24 h), per-send --ttl
#      within 60 s .. 604800 s (7 d); an expired unread message is dropped
#      from the mailbox; expiry before any ACK is undelivered:expired; this
#      replaces the fixed 7/30-day retention;
#  (3) RECEIPT IDS: every send returns a stable id for status, logs and
#      in-reply-to on non-broadcast messages;
#  (4) BROADCAST: one send to a list or a named group (@all-hosts, @<host>/*,
#      committed plan/fleet/groups.yaml); each recipient mailbox ACKs
#      independently; status per recipient; a reply to a broadcast is
#      refused with a named verdict at the CLI AND at the exchange layer;
#  (5) at-least-once with idempotent ids, deduped at the mailbox.
# Applied as an AMENDMENT (fields + events) to 1506-3xu7, 1506-nvqt,
# 1506-q7ab, 1506-ssb5, 1506-7tq4 and 1506-b8du, whose first fragment
# (20260929t222518z) described two receipt levels, an ack verb and fixed
# retention. Design files updated in the same commit:
# openspec/changes/fleet-messaging-poc/ and
# plan/issues/fleet-messaging-poc-design-2026-09-29.md.
