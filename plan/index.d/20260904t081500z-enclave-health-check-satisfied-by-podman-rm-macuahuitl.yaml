packets:
  - packet_id: enclave-health-check-satisfied-by-podman-rm
    order: 1004-inkc
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [enclave, health, fail-loud, guard]
    estimated_hours: 3
    owned_files:
      - scripts/check-enclave-service-health.sh
      - scripts/test-enclave-service-health.sh
      - scripts/cycle-preflight.sh
    title: |
      The enclave health check enumerates the containers that exist instead of the set that is expected, so deleting a broken service turns degraded into ok — a health gate a podman rm can satisfy.
    context: |
      MEASURED by lenovinha-silverblue 2026-09-04, two readings of the same
      host minutes apart:
        proxy container DOWN     -> scripts/check-enclave-service-health.sh prints
                                    degraded:services=6:up=5:down=1
        proxy container REMOVED  -> ok:services=5:up=5:down=0:dead=0:absent=0
      Nothing was repaired between the two lines. The proxy went from stopped
      to nonexistent (orchestrate-enclave.sh ends in `podman rm -f` of
      proxy/git/inference, which is how lenovinha got there), and the verdict
      went from degraded to ok. It printed absent=0 while a required service
      was absent.

      WHY, in the script's own words: "the set is derived from what exists"
      (scripts/check-enclave-service-health.sh:68-72). The enumeration loop
      walks `podman ps -a` (line 160) and counts only what it finds; the
      absent-detection loop at lines 380-395 is correct but runs only when
      $EXPECTED is non-empty, and EXPECTED comes solely from `--expect` or
      TILLANDSIAS_ENCLAVE_EXPECTED_SERVICES. A required service that has been
      deleted is invisible to the first loop and, without a declaration, never
      reaches the second. The `ok:` line at line 422 then hard-codes absent=0.

      THIS IS THE RESIDUAL OF 994-8r3w, NOT A DUPLICATE OF IT. That order
      declared the expected set (images/default/enclave-services.txt: vault
      and proxy, with the exclusions reasoned out in its header) and it is
      real. But it wired the declaration into ONE caller: scripts/cycle-preflight.sh:230-247
      reads the file, and only when tillandsias-vault exists, and exports the
      variable before invoking the check. The check itself was not changed.
      Every other invocation — the script run by hand, as lenovinha ran it;
      the e2e preflight's `--strict`; any future caller — still gets the
      structural constant that 994-8r3w's own comment names. The expectation
      lives in the caller when it belongs in the check: a health check whose
      verdict depends on who invoked it is not a gate. 994-8r3w's own status
      note concedes the gap as its unmet criterion 3: "nothing yet fails if a
      future edit stops preflight exporting the variable". This packet is that
      criterion, done in the check rather than in the caller. 994-8r3w is
      related, not a dependency: it is implemented and this does not wait on it.

      Two things the implementer must settle first, because they change the
      fix: (1) which invocation produced lenovinha's lines — if it was
      cycle-preflight with vault present, 994-8r3w's wiring itself failed and
      that is a different defect from the one described here; if it was the
      bare script, the description above is exact. (2) The vault-anchor rule
      ("only expect services on a host that has an enclave at all",
      cycle-preflight.sh:232-240) has to move INTO the check along with the
      default, or a never-provisioned laptop cries wolf — which is how the
      original gap survived.

      The shape to fix: the script reads images/default/enclave-services.txt
      itself as its default expected set (path resolved from the script's own
      root, `--expect`/env still overriding), applies the anchor rule, and
      cycle-preflight consumes the resulting verdict instead of manufacturing
      its own. services= should count the expected set plus any extra enclave
      containers found, so the count cannot shrink when a member is deleted.

      Provenance: measured by lenovinha-silverblue on 2026-09-04 and relayed on
      the fleet board; filed by the coordinator (macuahuitl).
    next_action: |
      Reproduce first: on a provisioned host, `podman stop tillandsias-proxy`
      then `podman rm tillandsias-proxy`, running the bare script after each;
      confirm the second reading is ok:...:absent=0 and record which path
      lenovinha used. Then add the fixture to
      scripts/test-enclave-service-health.sh BEFORE touching the check: a fake
      podman with vault+proxy running yields ok; the same fake with the proxy
      row deleted and no --expect must yield degraded:...:absent=1 naming
      tillandsias-proxy. Make it red, then fix the script, then re-run
      cycle-preflight's services segment on the real host.
    exit_criteria:
      - with no --expect and no env, the check reads images/default/enclave-services.txt as its expected set
      - a removed required service reads absent=<n> with n>=1 and the verdict is degraded, never ok
      - the vault-anchor rule lives in the check, so a never-provisioned host with no vault still reads ok
      - test-enclave-service-health.sh gains a fixture - proxy row deleted, no --expect, verdict absent=1
      - the fixture reproduces lenovinha's two lines (degraded down=1; then ok absent=0) and refuses the second
      - cycle-preflight.sh's services segment consumes the check's verdict instead of exporting the set itself
      - the ok verdict line prints the computed absent value, not a hard-coded 0
    verifiable_closure: |
      scripts/test-enclave-service-health.sh exits 0 with a new arm proving removed != healthy:
      the same fake podman store with the proxy row deleted and no --expect passed yields
      degraded:enclave-service-health:...:absent=1 with a
      fail:enclave-service-absent:service=tillandsias-proxy detail on stderr. The script exists
      today; the arm does not yet and is this packet's first deliverable.
      litmus:enclave-service-health-shape (bound in openspec/litmus-bindings.yaml) stays green
      in the pre-build instant suite.
