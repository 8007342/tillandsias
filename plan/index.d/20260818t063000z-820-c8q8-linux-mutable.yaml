    order: 820-c8q8
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "a litmus [TIMEOUT] reads the same whether the step got genuinely slower or the host was merely loaded — measured tonight as a real 41s regression and a 0s fixture starved past 30s, indistinguishable on screen"
    deliverable: "a timed-out step reports its own measured duration against the budget and, where cheap, whether the box was saturated — so the reader can tell 'this got slower' from 'this was starved'"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [fail-loud, ci-gates, litmus]
    estimated_hours: 3
    context: |
      OBSERVED 2026-08-18, macuahuitl, across five consecutive
      `./build.sh --ci-full --install` runs for the destructive e2e.

      CASE A — a real regression. litmus:fragment-status-loss-attribution-shape
      step 5 timed out at 30s. The guard genuinely took 41s, because the three
      fragment-* subcommands each loaded the whole ledger they never read
      (816-kq2z). Fixing that took it to 1s. The TIMEOUT was pointing at
      something true.

      CASE B — a busy host. litmus:forge-standard-gitconfig-path step 1 timed
      out at 30s in the next full run. Run standalone immediately afterwards,
      the same fixture (scripts/test-forge-standard-gitconfig-path.sh) exits 0
      in ZERO seconds. It had passed in the previous full run. Nothing about it
      changed; the box was saturated — that run had containers up, a forge
      launched, a nix build and a cross-compile behind it.

      ON SCREEN THE TWO ARE IDENTICAL:

        [STEP n/m] <name> (timeout: 30s)... [TIMEOUT]
        Test timeout after 30s in step: <name>

      Nothing distinguishes a step that now costs 41s of real work from one
      that costs 0s and was starved. In case A the correct response was to fix
      the code; in case B it was to re-run. I spent the difference finding out,
      twice, and the second one cost a whole 18-minute build cycle.

      WHY THIS IS THE FAIL-LOUD FAMILY and not a nice-to-have: the verdict is
      not absent, it is under-determined in a way that names a suspect. A
      reader — human or agent — sees a named step and concludes the step is
      broken. That is the same defect shape as 797-5kqe, 798-tk7b's
      stale-healthy corpse and 817-8czp's dead-provider guess: a diagnosis
      confident beyond its evidence.

      CHEAPEST USEFUL FIX, in the order I would try it: report the step's own
      elapsed time and its budget on the timeout line (the runner already knows
      both), so `41s/30s` and `>30s (killed)` at least look different from a
      step that was making no progress. A load reading (loadavg or a
      concurrent-container count) at kill time is a second line and is where
      the actual discrimination lives, but it is worth measuring whether the
      duration alone already separates the two classes before adding it.

      NOT PROPOSED: raising the budgets. Case A's step would then have passed
      at 41s and the 40s-per-build waste would still be in the tree, undetected
      — the timeout did its job there and must keep doing it.
