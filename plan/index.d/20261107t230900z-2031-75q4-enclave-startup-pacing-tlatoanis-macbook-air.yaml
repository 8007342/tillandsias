packets:
- packet_id: heavy-enclave-startup-steps-share-one-lane-and-wait-for-pressure-to-settle
  order: 2031-75q4
  status: ready
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: linux
  capability_tags: [headless, podman, performance]
  estimated_hours: 8
  title: "Heavy enclave startup steps share one lane across projects and wait on PSI for I/O and memory pressure to settle"
  context: "ensure_enclave_for_project is already sequential, but nothing paces it: the next image build or container start begins while the previous step's GBs are still being written (page cache, QLC SLC cache, btrfs 30 s commit), and two projects' bringups have no shared lock."
  exit_criteria:
  - "One enclave-wide lane serialises image builds, pulls, volume seeds and model fetches across projects; a test opens two projects at once and sees the builds never overlap."
  - "Before each heavy step it waits on a PSI trigger (poll, no polling loop) for io some avg10<10%/full<2% and memory full<2%, with a per-step deadline and a logged settle-timeout; it falls back to a bounded settle without PSI."
  - "Each step logs bringup: step=<n> ms=<n> settle_ms=<n>."
  verifiable_closure: "A cold bringup on macuahuitl and on the macOS guest that completes with the step log, compared with a pre-change cold bringup."
  unscoreable: 'none.'
  next_action: "One enclave-wide lane serialises image builds, pulls, volume seeds and model fetches across projects; a test opens two projects at once and sees the builds never overlap."
  provenance: "Operator request 2026-11-07: \"We definitely need beter orchestration of the messy startup\" (and: \"Macuahuitl used to crash all the time on their cheap nvme because of this\"). Research: cheatsheets/runtime/container-startup-orchestration.md, cheatsheets/runtime/startup-io-memory-pressure.md. Spec: openspec/changes/enclave-startup-pacing."
  spec: openspec/changes/enclave-startup-pacing
  events:
  - type: filed
    ts: '2026-11-07T23:09:00Z'
    host: tlatoanis-macbook-air
    summary: filed ready from the 2026-11-07 startup-orchestration research
- packet_id: enclave-services-start-on-readiness-checks-not-sleeps
  order: 2031-wqbe
  status: ready
  kind: bug
  priority: p2
  desired_release: v0.5
  pickup_role: linux
  capability_tags: [headless, podman]
  estimated_hours: 4
  title: "Enclave services start on readiness checks, not fixed sleeps; shutdown reverses start order and failed starts back off"
  context: "container_deps waits a fixed 3 s after the proxy; the router's container start is never confirmed and has no status line (\"Routing Traffic\" missing)."
  exit_criteria:
  - "The proxy's 3 s sleep is replaced by a port-3128 readiness check with a deadline; the router start is confirmed and gets its own status line."
  - "Shutdown stops services in reverse start order; a failed start is retried with an increasing delay."
  verifiable_closure: "A fixture with a slow-listening proxy shim, plus a live bringup log showing each readiness step."
  unscoreable: 'none.'
  next_action: "The proxy's 3 s sleep is replaced by a port-3128 readiness check with a deadline; the router start is confirmed and gets its own status line."
  provenance: "Operator request 2026-11-07: \"We definitely need beter orchestration of the messy startup\" (and: \"Macuahuitl used to crash all the time on their cheap nvme because of this\"). Research: cheatsheets/runtime/container-startup-orchestration.md, cheatsheets/runtime/startup-io-memory-pressure.md. Spec: openspec/changes/enclave-startup-pacing."
