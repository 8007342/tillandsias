  title: 'The coordinator store drops AUTOINCREMENT, trims by indexed range and coalesces sweeps'
  context: 'Rows written per send are 3 to 6 today (table, messages_exp index, sqlite_sequence, trim deletes, setAlarm), and the trim reads about 1 000 rows per send. See the design, section 2. Row b of 2011-amqd; build only, no deploy and no cloud resource.'
  exit_criteria:
  - 'The fixture shows a send writes at most 2 rows and the trim reads no more rows than it deletes.'
  - 'At most one TTL sweep runs per namespace per 15 minutes, and a renewed claim does not fire a useless alarm.'
