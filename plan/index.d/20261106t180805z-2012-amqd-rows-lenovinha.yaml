- packet_id: the-coordinator-client-keeps-an-idle-floor-persisted-state-and-out-of-budget-handling
  order: 2012-rng2
  status: ready
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [cloudflare, fleet, forge]
  estimated_hours: 3
  depends_on: [the-coordinator-budget-fixture-measures-worker-requests-do-requests-alarms-and-rows-from-the-runtime]
  title: 'The coordinator client keeps a 300 s idle floor, persisted state and out-of-budget handling'
  context: 'The idle heartbeat is 20 x RTT clamped to 15-120 s, so a fast link idles at 15 s. classify maps an HTML body to Refused, so Error 1027 looks like a 400. See the design, sections 3b and 4. Row g of 2011-amqd; build only, no deploy and no cloud resource.'
  exit_criteria:
  - 'Idle never polls faster than 300 s, whatever the RTT.'
  - 'Cache, daily count and backoff persist per host across processes.'
  - 'An HTML or 1027 body stops calls until the server Date passes 00:00 UTC plus a jitter; 429 honours Retry-After; 5xx backs off with full jitter (base 2 s, cap 300 s); reads are cached for 5 s.'
  verifiable_closure: 'Fixture against wrangler dev with a fake clock; no cloud resource.'
  unscoreable: 'none.'
  next_action: 'Write the failing test first, against openspec/changes/fleet-durable-instructions/free-tier-queue.md.'
