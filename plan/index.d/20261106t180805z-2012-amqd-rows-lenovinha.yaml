  title: 'The coordinator budget fixture measures Worker requests, DO requests, alarms and rows from the runtime'
  context: 'First of the 2011-amqd rows: every later row is measured by it. Run the coordinator Worker and client under wrangler dev with a fake clock, and count Worker requests, DO requests, alarm invocations and cursor.rowsWritten/rowsRead per statement from the runtime, never by hand. Row a of 2011-amqd; build only, no deploy and no cloud resource.'
  exit_criteria:
  - 'An idle hour for 15 clients and a busy hour are run, and the counted numbers are printed per kind.'
  - 'It fails naming the kind exceeded when a run exceeds the stated budget (an idle hour over 200 Worker requests; a busy hour over 900 Worker requests or 1 200 rows written).'
  - 'A crash-loop client (coord started 1 000 times) is run, and its counted requests are reported.'
  verifiable_closure: 'Fixture against wrangler dev with a fake clock; no cloud resource.'
  unscoreable: 'none.'
  next_action: 'Write the failing test first, against openspec/changes/fleet-durable-instructions/free-tier-queue.md.'
