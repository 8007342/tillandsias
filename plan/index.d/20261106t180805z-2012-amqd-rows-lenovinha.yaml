- packet_id: the-coordinator-enforces-a-per-identity-daily-cap-and-an-account-guard-on-the-server
  order: 2012-ukic
  status: ready
  kind: feature
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags: [cloudflare, fleet, forge]
  estimated_hours: 3
