  title: 'The coordinator enforces a per-identity daily cap and an account guard on the server'
  context: 'Today the only server limit is 120/min per identity (172 800/day, 1.7x the account), and the client limiter is per process. Move the bucket into the namespace object in memory, add a per-identity daily cap persisted every 100 requests and a per-account guard. See the design, section 3c. Row c of 2011-amqd; build only, no deploy and no cloud resource.'
  exit_criteria:
  - 'A read writes 0 rows for rate limiting.'
  - 'The crash-loop client is held at its daily cap with 429 and Retry-After at the next 00:00 UTC.'
  - 'Past the account guard, only the operator identity is served.'
  verifiable_closure: 'Fixture against wrangler dev with a fake clock; no cloud resource.'
  unscoreable: 'none.'
