      summary: >
        Criterion 1 landed at the async transport seam. `OperationKind` now
        declares a wall-clock budget per class, and `PodmanBackend::execute`
        takes it as a REQUIRED parameter rather than an option with a default —
        deliberately, so that a new transport or a new caller has no way to
        spell "no deadline". `PodmanClient::execute` applies the class budget;
        `execute_with_budget` is the one-line escape hatch for callers whose
        work legitimately outlasts its class, which puts the claim at the call
        site instead of inheriting infinity. `RealBackend` wraps the spawn in
        `tokio::time::timeout`; with the pre-existing `kill_on_drop(true)` the
        deadline kills the process rather than abandoning the future, so a
        wedged call cannot outlive its budget still holding a storage lock.
        The budgets are deadlock detectors, not performance targets: 30s for
        local metadata reads up to 3600s for image builds, each well above
        healthy-substrate cost, because the only thing a budget must separate is
        working from wedged. Timeout failures classify Unknown, never Retryable —
        a deadline is no evidence the substrate will recover, and guessing turns
        one hang into a loop of them.
