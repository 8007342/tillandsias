      summary: >
        DESIGN SLICE — DECISION: option B, an explicit capability-gated wire message. Option A (in-band VEOF) is REJECTED, and it was rejected by running it, not by preferring the other one.  THREE TRIALS ON A REAL PTY (macOS, 2026-08-29). A 64-byte payload, a child that reads stdin, a 4-second bound:   1. BINARY STDIN IS DESTROYED. Payload legitimately containing 0x04 at offsets 4, 12, 20, ... delivered ZERO of 64 bytes; the child exited at the first embedded 0x04. Any non-text stdin is silently truncated at its first 0x04.   2. IT IS A NO-OP IN RAW MODE. Same payload, raw mode: the child never exited. 0x04 is just a byte there, so the "EOF" does nothing and the hang it was meant to fix persists — silently.   3. NEW, AND THE ONE THAT SETTLES IT: ONE 0x04 IS NOT ENOUGH, AND THE COUNT DEPENDS ON THE PAYLOAD. With unterminated text, one 0x04 only FLUSHED the pending line and the child kept running; it exited only on a SECOND. So the packet's own phrasing for option A — "send 0x04 as a final ToGuest frame" — is under-specified and wrong for input that does not end in a newline: a correct implementation would have to know whether its own payload ended in \n to choose between one 0x04 and two. Hazards 1 and 2 were already in the packet as reasoning; 3 was only visible by running it, and it turns the option from awkward into untenable.  THE SKEW FACT THAT SHAPES OPTION B, pinned by a test rather than by reading docs (unknown_future_variant_is_a_decode_error_not_a_silent_skip, in control-wire): ControlMessage is #[non_exhaustive], which buys forward compatibility for MATCH ARMS and NOTHING on the wire. postcard encodes a variant as a varint INDEX, and a decoder built before that variant exists returns an ERROR — it does not skip the frame. So an UNGATED new frame sent to an older guest does not degrade to today's hang: it fails the decode and takes the SESSION down, which is strictly worse than the defect. This is the whole reason the capability gate is mandatory rather than tidy.  THE GATE FOLLOWS THE FLEET'S OWN RULE. Read HelloAck.server_caps, never compare wire versions — the discipline CAP_EXEC_ARGV_VECTOR already states. And it is its OWN capability, not a rider on a neighbour, per the rule CAP_PROXY_CA_KEY_HEAL records after being bitten: a capability must name the BEHAVIOUR the caller depends on, because reusing a nearby token as a proxy for "built after roughly then" is version comparison wearing a capability's clothes, and it fails on exactly the builds a mixed-version fleet produces.  THE FALLBACK IS THE HALF MOST LIKELY TO BE SKIPPED, so it is written into the constant's doc: when the peer does NOT advertise the capability, the caller must NOT quietly send the input and hope. A silent wait that never returns is the exact shape this milestone exists to remove. The un-negotiated path should REFUSE a request whose semantics require EOF and name the reason — the guest is too old to be told when stdin ends.  LANDED, and deliberately no more than this per the design-slice scope: the CAP_PTY_STDIN_EOF constant carrying the full decision record where the implementer will actually look, plus the postcard skew test as durable evidence. The frame itself, the send path, and the refusal are NOT implemented — that is the follow-on, and it now starts from a decision rather than a preference.  WHAT I DID NOT DO: measure whether any current caller actually needs EOF semantics. exec_over_stream_with_input's callers may all be byte-exact today, in which case this is latent rather than live, and that would change the follow-on's priority. Worth one grep before anyone schedules it.
