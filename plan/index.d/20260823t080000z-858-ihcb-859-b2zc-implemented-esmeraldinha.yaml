      summary: >
        Implemented, with a correction to my own first fix recorded because it
        is the more useful half of this packet.

        THE FIX. bench_model now measures prefill in isolation: a unique prompt
        per repetition with the unique token FIRST, num_predict=1, the first
        post-load repetition discarded (the cold-dispatch trap 793-zumy
        documented pulls the opposite way from the cache trap, so both controls
        are needed), and the MEDIAN of the remainder reported alongside
        prefill_n and prefill_range so a reader sees the spread instead of
        trusting a point estimate. Decode is measured separately and was never
        affected.

        THE FIRST FIX WAS WRONG IN A WAY A UNIT TEST WOULD HAVE PASSED, and
        this is worth more than the fix. `unique_prompt` incremented a global
        nonce — but every call site invokes it inside `$( )`, which runs in a
        SUBSHELL, so the increment never reached the parent and every "unique"
        prompt was byte identical. The harness then reported prefill_tok_s=1528
        (range 1512-2195), i.e. it reproduced the exact defect it was written
        to remove while looking repaired. Caught only by disbelieving a
        suspicious number and running a three-arm control on the live endpoint:
        identical prompts 1338-1448 tok/s, nonce-prefixed 93-148, fully
        distinct 125-140. The tag is now an ARGUMENT the caller supplies.

        MEASURED CORRECTION, qwen2.5:0.5b and phi3.5:3.8b on cpu-wsl2:

          T0 prefill  1334.59 -> 138.68 tok/s (range 122.25-144.32)   9.6x
          T2 prefill   480.93 ->  17.67 tok/s (range  17.63-17.99)     27x
          T0 decode     29.64 ->  28.99   (unchanged, as predicted)
          T2 decode      6.53 ->   6.38   (unchanged)

        THE VALIDATION THAT MATTERS: this host's own 2026-08-16 BARE-METAL
        Windows figures for the same two models were prefill 108.9 (T0) and
        19.0 (T2), taken with a different harness on a different substrate. The
        corrected WSL2 numbers land within ~10% of those; the cached numbers
        were 12x and 25x away from them. An independent measurement the new
        code did not know about now agrees with it.

        SECOND HALF (the projection). `project:` no longer multiplies two
        superseded constants. CORPUS_CHUNKS lost its 1592 default and the line
        emits `full_rebuild=skipped:no-measured-corpus-chunk-count` when no
        measured count is supplied; the delta figures, which carry no corpus
        assumption, still print. The embed chunk size is now REPORTED
        (`chars=`, `chunk_chars=`) and defaults to the measured corpus p50 of
        ~236 rather than the undocumented 2000 — that mismatch is precisely how
        a per_chunk_ms got compared against numbers taken at a different size.
        With the real count supplied: full_rebuild_s=4291.6 (71.5 min), which
        matches the hand projection of ~72 min filed yesterday.

        FIXTURE: scripts/test-bench-prompt-uniqueness.sh, 6/6. It intercepts
        `curl` and inspects the payloads the REAL call sites put on the wire,
        because that is the only level at which the subshell defect is visible
        — a test calling unique_prompt directly in one shell sees three
        different strings and passes. Verified to FAIL (2/6) against the
        pre-fix form.

        NOT CLOSED: every prefill_tok_s recorded in the ledger before today, on
        every host, was measured against a warm cache and is superseded rather
        than comparable. Exit criterion 4 asks for those citations to be marked
        where they are used as engine-lane evidence; that sweep is not done and
        the packet stays open for it.

  - packet_id: capability-row-check-cannot-resolve-a-host-without-the-hostname-binary
    event:
      type: progress
      ts: "2026-08-23T08:00:01Z"
      agent_id: windows-esmeraldinha-opus5-20260823T073714Z
      host: windows
      summary: >
        Implemented, and the blast radius was four scripts wider than filed.

        check-capability-row.sh now sources scripts/agent-identity.sh and calls
        tillandsias_agent_workstation() + tillandsias_lower(). Verified live in
        the locus that was broken — the tillandsias-build WSL distro, where the
        gate executes and `hostname` does not exist — going from
        `unavailable:host-unresolvable` (exit 2) to
        `ok:capability-row-reported:esmeraldinha` (exit 0). Direct A/B of the
        two chains in one environment: old resolves empty, new resolves the
        host.

        FOUR MORE COPIES were found by grepping for the pattern rather than
        trusting the packet's own scope, and two of them matter more than the
        one filed against:

          - check-resumable-claim-dirt.sh — the 833-fpe7 dirty-start deadlock
            detector. With an unresolvable host it answered
            `unattributable:host-unresolvable`, which falls through to the
            dirty-start REFUSAL. The detector written to discharge that
            deadlock was inert inside a forge, silently, because
            `unattributable:` reads as caution rather than breakage. It now
            answers `unattributable:no-live-claim-by-this-host` here — a
            verdict about claims instead of about itself.
          - select-work-batch.sh — the batch selector. Its comment said
            "agent-identity precedence" directly above a private, weaker
            approximation of it. An empty HOST_NAME never matches a capability
            matrix row, so a forge routed as an unknown host without failing.
          - reclaim-stranded-claims.sh — wrote the host label INTO the ledger,
            as an event's `host:` field and as the fragment filename. In a
            Fedora image it recorded `host: unknown` and
            `...-reclaim-stranded-host.yaml`, durably, into append-only
            fragments. A wrong value that persists is worse than a refusal.
          - windows-host-capability-probe.sh — worked, because Git Bash ships
            `hostname`, under a comment claiming it was the "same chain as
            agent-identity.sh". That is how the copies get made. host_id
            verified unchanged (`esmeraldinha`) after consolidation.

        THE HALF THAT IS NOT A WIDER CHAIN. Repairing the fallback alone would
        have turned the forge from silent into NOISY: run-forge-project.sh
        passes no --hostname and no entrypoint exports TILLANDSIAS_WORKSTATION,
        so HOSTNAME, /etc/hostname and uname -n all report the container id
        (measured under podman: d872da8c03df). The forge would have begun
        answering `due:` under a name that changes every launch, adding a
        matrix row per container. check-capability-row.sh now detects that case
        via the canonical platform test and returns
        `unavailable:forge-identity-ephemeral` with the remedy named, instead
        of publishing.

        FIXTURE: scripts/test-capability-row-check.sh, 9/9, hermetic. `hostname`
        is made unusable via a failing stub on PATH — absence and failure are
        indistinguishable to every call site, and a stub is portable where
        emptying PATH would strip the coreutils the script needs. Covers both
        forge branches, the lowercase fold key, domain stripping, and the
        launch-provided override.

        LEFT ALONE DELIBERATELY: scripts/derive-host-identity.sh has its own
        host_token() with the COMPLETE chain (hostname -s, uname -n,
        /etc/hostname), so it is not broken, and it slugifies for a different
        purpose (a compound roster token, not a bare node name). Consolidating
        it would churn host seeds for no correctness gain. Noted as a
        consolidation candidate, not touched.
