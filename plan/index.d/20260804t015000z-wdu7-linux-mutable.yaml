    priority: p0
    tags: [hooks, gates, ci, cross-platform, windows, macos]
    title: >
      Install and exercise the pre-push gate on THIS checkout — hook installation
      is per-checkout, so Linux being fixed says nothing about yours.
    context: >
      Push CI was deleted on 2026-08-03. The pre-push hook is now the trunk's only
      automated protection, and the release path depends on it. On the Linux host
      .git/hooks/ was found EMPTY while six hook scripts sat in the repo — every
      guard inert for months. That is a per-checkout condition; yours is
      unmeasured.
    exit_criteria:
      - >
        Record what `.git/hooks/` contained BEFORE you touch anything. That
        finding is the deliverable of 599-4wzr for your platform; "it was empty"
        is a result, not a non-event.
      - >
        Run `./build.sh --check` and confirm it reports
        "Gate stamp recorded". build.sh installs the hooks itself now; if it does
        not on your platform, that is the finding.
      - >
        Confirm the pre-push gate REFUSES a stale tree: edit any tracked file,
        attempt a push, expect
        "the tree changed since ./build.sh --check last passed". Then re-gate and
        confirm the push is accepted. A gate that cannot refuse is not a gate.
      - >
        WINDOWS SPECIFICALLY: the hook runs under whatever shell git invokes. Note
        whether it works from Git Bash, PowerShell, and an IDE client, since a
        hook that silently no-ops in one of them is the empty-.git/hooks failure
        wearing a different hat. `scripts/gate-stamp.sh` uses sha256sum,
        readlink, and git plumbing — record which resolve.
      - >
        MACOS SPECIFICALLY: the stamp hashes 45 tracked DIRECTORY symlinks. The
        first implementation followed them and silently skipped all 45 because the
        error was suppressed. Confirm `bash scripts/gate-stamp.sh write` succeeds
        and that re-targeting a tracked symlink flips it to
        `stale:tree-changed-since-gate`. macOS already fixed this once; the
        surviving implementation is Linux's single-pass variant, so re-verify the
        one that actually shipped.
      - >
        Report whether `scripts/release-preflight.sh` returns
        `ok:release-preflight` on your host, and if not, which gate blocked and
        why. It shells out to `find -printf`, which is GNU-specific and is the
        most likely BSD/macOS divergence.

