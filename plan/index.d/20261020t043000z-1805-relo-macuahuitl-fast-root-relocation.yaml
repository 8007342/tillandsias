    title: |
      macuahuitl's local build work and caches (cargo registry/git, rustup, the sccache dir, the codex agent's cargo target, gate metrics, inference models, and the rootless podman graphroot) move onto /srv/fastbuild and are bind-mounted back at their original paths by one operator script, /home/tlatoani/claudia/agent-target/fastbuild-relocate.sh, which inspects every target first and refuses any not in its expected state
    context: |
      Operator direction 2026-10-19: move more work to the fast drive, but
      only the local work and the shared build and cache. After the 328 GB
      plan-cache leak (1803-pcap) was deleted the btrfs main disk is at 82%;
      the RAID0 has 828 GB free. The script moves, measured on 2026-10-20:
      ~/.cargo/registry 1.2G, ~/.rustup 3.4G, the sccache dir (new),
      ~/.cache/tillandsias/target-codex-1469-vhuk 23G, metrics 4.4G, models
      21G, ~/.local/share/containers 19G — about 72 GB off the main disk.
      BIND MOUNTS, NOT SYMLINKS: containers resolve real paths, the plan
      guards compare device numbers, and the builder toolbox's /home is a
      slave mount so a bind under /home propagates into it while /srv does
      not exist there at all (the host root is at /run/host). Each target:
      rsync -aAXHS --numeric-ids, a second itemising rsync that must move
      nothing, rename the original, one fstab bind line (nofail,
      x-systemd.requires-mounts-for=/srv/fastbuild, the same shape as the
      target/ line 1802-fbld documents), mount, findmnt must show
      /dev/md127, then the original is removed (--keep-originals keeps it).
      REFUSALS: not root; /srv/fastbuild not md127/xfs/ftype=1; a target
      that is a symlink, has a half-finished sibling, or is already named in
      fstab but not mounted; cargo/rustc/rustup/sccache alive for the build
      dirs; a container that mounts the dir for metrics/models; and for the
      podman graphroot ANY running container or podman/conmon/pasta process
      — the operator stops them when they choose. Never touched: ca,
      vault-data, vault-audit, secrets, the checkout, the org clones.
