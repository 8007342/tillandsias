    title: "gate keyring fixtures run on a private session bus, and the credential guard abandons a hung keyring client instead of killing it"
    context: |
      EVIDENCE. gnome-keyring-daemon aborted during full gates (./build.sh --check):
      macuahuitl 2026-10-25 20:36 and 20:51 PDT and 2026-10-26 02:01 PDT;
      lenovinha 2026-10-26 01:03 PDT. Signature: "Bail out! gdbusconnection.c:4765
      invoke_get_property_in_idle_cb (error != NULL)", the 1265-8qr6 shape. The
      daemon restarts LOCKED, so gh hangs and pushes and land-queue pushes fail
      until the operator unlocks.
      MEASURED CAUSE. The credential fixtures stub with PATH="$stub:$PATH" and
      inherited the operator's DBUS_SESSION_BUS_ADDRESS, so anything not stubbed
      fell through to the real busctl/gh/secret-tool. Against a sentinel
      dbus-daemon on origin/linux-next: test-check-credential-channel.sh,
      test-credential-channel-survives-a-killed-probe.sh,
      test-credential-cold-state-probe.sh and test-credential-channel-affordances.sh
      all produced NameOwnerChanged events on
      the bus they inherited (counts in the PR). The live guard also bounded
      gh auth status, gh api user and git credential fill with timeout(1),
      which SIGTERMs the client process group mid-call.
      Rust: the only keyring::Entry is vault_bootstrap::keyring_entry, which is
      the keyring mock under cfg(test); ca_key_store takes injected read/write
      closures; secrets::read_github_token (gh auth token) has no test caller.
    exit_criteria:
