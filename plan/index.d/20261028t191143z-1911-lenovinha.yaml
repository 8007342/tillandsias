  title: Forge agents keep local commits; make pushing every commit to a disposable work ref the first rule they read
  context: 'The permission exists (join-the-fleet SKILL.md:177, advance-work-from-plan SKILL.md:24, between-commits-work-discipline.yaml:103-110), but it is worded as optional, and forge-quick-intro SKILL.md:18 never names a work ref. Obstacles: advance-work-from-plan SKILL.md:1137 caps pushes at 2 commits per hour with a cooldown; the mirror pre-receive hook relays to GitHub synchronously before it accepts (images/git/pre-receive-hook.sh:6-8); the work/* pre-push deciders run in full (scripts/hooks/pre-push-local-gate.sh:152-170); and multi-host-development.yaml:1040 (merge trunk before every push) conflicts with join-the-fleet:177 (no trunk merge on a work ref). Related: the session-durability row 1911-3dqo.'
  exit_criteria:
  - 'forge-quick-intro and the forge opencode/codex instructions carry a concrete rule: after every commit, push HEAD to refs/heads/work/<order>.'
  - 'pull_merge_cadence gains a maximum-unpushed-window key, and the 2-per-hour cap exempts work/*.'
  - 'The merge-before-push conflict is resolved in one place; the cost of a work-ref push (mirror relay plus deciders) is measured, and an async-relay option is assessed.'
  unscoreable: 'research row: closure is the instruction diff plus the measured push cost.'
  next_action: 'Measure a work-ref push from a forge, then draft the instruction changes.'
