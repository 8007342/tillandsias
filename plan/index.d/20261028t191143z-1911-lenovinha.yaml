packets:
- packet_id: forge-is-killed-by-systemd-oomd-and-its-session-cannot-be-rejoined
  order: 1911-3dqo
  status: ready
  kind: bug
  priority: p0
  desired_release: v0.5
  pickup_role: any
  capability_tags:
  - headless
  - linux
  estimated_hours: 8
  title: systemd-oomd killed a 14-hour Codex forge for desktop-wide memory pressure, and nothing could rejoin or save the session
  context: 'Evidence (journal, lenovinha 2026-10-28): at 11:41:10 systemd-oomd killed /user.slice/.../libpod-914cf7ee....scope/container (tillandsias-kumbia-kombat-forge-codex, up 14h19m) because user.slice memory pressure was 80.47% above the 80% limit for more than 20s. The forge was using 447M, with pressure avg10 49%; it was chosen for the highest reclaim activity, not the most memory. Healthchecks had been timing out since 11:34:49. Fedora default: user.slice ManagedOOMMemoryPressure=kill. Same second: a Chrome GPU-process crash (a casualty, not the cause). It was not a socket failure: a Linux lane is a plain podman run --rm -it attach (crates/tillandsias-podman/src/client.rs:1160-1205, main.rs:16083) with no vsock or codec layer. The forge already gets a ForgeBudget --memory limit (main.rs:9461); there is no ManagedOOMPreference on the scope. The agent lives inside the attach: PID 1 is codex-oauth-session.sh, and an outside kill loses all unpushed work. There is no rejoin verb.'
  exit_criteria:
  - 'A forge scope carries ManagedOOMPreference=avoid (or the reason it cannot), proven by systemctl --user show on a launched forge.'
  - 'The browser and toolchain siblings of a forge carry memory budgets, so they come under pressure before the forge.'
  - 'A forge outlives its terminal attach (detached run plus podman attach, or tmux in the forge), and tillandsias can rejoin a live forge; a fixture that kills the attach client asserts the agent process still runs. It FAILS on today''s code.'
  unscoreable: 'unpinnable-until-the-guard-exists: the attach-survival fixture lands with the fix.'
  next_action: 'Decide the durable-session shape (podman detach+attach versus tmux in the forge) and the oomd posture; verify that ManagedOOMPreference is settable for a rootless libpod scope.'
  provenance: 'Fable research pass 2026-10-28, verified by lenovinha against journalctl (the systemd-oomd kill lines).'
  events:
  - type: filed
    ts: '2026-10-28T19:11:43Z'
    host: lenovinha-silverblue
    summary: filed urgent after the Codex forge was killed by systemd-oomd; no rejoin path exists
