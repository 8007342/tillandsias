- packet_id: browser-forwarders-and-networks-leak-and-pin-the-shared-stack
  order: 1911-3gqy
  status: ready
  kind: bug
  priority: p0
  desired_release: v0.5
  pickup_role: any
  capability_tags:
  - headless
  - browser
  estimated_hours: 6
  title: Browser forwarder containers and networks are never reaped, and leaked forwarders keep the shared stack up forever
  context: 'Live on lenovinha 2026-10-28: 11 tillandsias-browser-fwd-* running (up to 12h old), 12 tillandsias-browser-net-* networks, and zero window containers. Confirmed defects: (A) a window runs with --rm and removes itself when closed, but nothing watches it exit and LANE_WINDOWS (mcp_socket.rs:797) never evicts, so stop() (browser_open.rs:929-935) never removes the forwarder, network or profile dir. Forwarders carry no window label; networks do (browser_open.rs:876-885). (B) find_timed_out_windows (window_registry.rs:190, spec browser-window-timeout, 24h) has only test callers. (C) The forge-exit cleanup at main.rs:8981 removes tillandsias-browser-{project}, a name that no longer matches suffixed windows. (D) is_active_lane_container (main.rs:9119-9123) counts -fwd- as a live lane, so the last-lane teardown never runs. Tray Quit removes forwarders but never browser-net networks. Each network takes a /24 from the podman pool and its forwarder holds an enclave IP.'
  exit_criteria:
  - 'Forwarders carry the tillandsias.browser-window label; a window exit triggers close_window, removing the forwarder, network and profile dir; a fixture fails on today''s code.'
  - 'An idle sweeper calls find_timed_out_windows with an agent-scale idle limit (about 1h), and a per-project window cap evicts the oldest window.'
  - 'is_active_lane_container ignores -fwd-; tray start, Quit and reset sweep orphaned forwarders and networks by label.'
  verifiable_closure: 'cargo test -p tillandsias-headless browser_window_exit_reaps_forwarder_and_network'
  next_action: 'Label the forwarder, add the exit watcher, exclude -fwd- from the live-lane check, then the sweeper and cap.'
  provenance: 'Junior inventory plus Fable verification 2026-10-28 (lenovinha); all four claims confirmed with file:line.'
  events:
  - type: filed
    ts: '2026-10-28T19:11:43Z'
    host: lenovinha-silverblue
    summary: filed urgent; four confirmed reaping bugs and live leaked forwarders and networks
