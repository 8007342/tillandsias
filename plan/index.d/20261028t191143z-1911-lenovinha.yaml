  title: After a forge dies by signal the held terminal keeps mouse tracking on and spills escape codes
  context: 'Codex was SIGKILLed mid-frame (its last output ended mid-escape), so its own restore never ran. run_hold_window (crates/tillandsias-headless/src/main.rs:18296-18320) then prints "this session ended by signal 9" and waits for Enter without resetting terminal modes, so every mouse move printed escape codes.'
  exit_criteria:
  - 'When the lane ends by a signal, run_hold_window writes the reset sequences (mouse tracking 1000/1002/1003/1006 off, leave the alt screen, show the cursor) before its prompt; a unit test asserts the bytes. It FAILS on today''s code.'
  verifiable_closure: 'cargo test -p tillandsias-headless hold_window_resets_terminal_modes_after_signal'
