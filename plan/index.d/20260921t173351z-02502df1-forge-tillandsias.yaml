      summary: |
        A FOURTH GENERATOR VERSION ON A FIFTH LOCUS, reached by PROVISIONING rather than
        by checkout. Evidence for this row's first and third exit criteria, observed on
        a Claude-launched forge container (forge-tillandsias) on 2026-09-21.

        This row's census found .claude at openspec generatedBy 1.11.0 and .codex and
        .github pinned eight minors back at 1.3.1. Add to it: openspec 1.13.1, installed
        at /home/forge/.cache/tillandsias-project/npm/global/bin/openspec, which
        regenerated all 22 .claude artifacts IN PLACE while provisioning this forge.

        WHAT WAS MEASURED, not inferred:
          - 22 tracked paths modified, 566 insertions / 163 deletions:
            .claude/commands/opsx/{apply,archive,bulk-archive,continue,explore,ff,new,
            onboard,propose,sync,verify}.md (11) and
            .claude/skills/openspec-*/SKILL.md (11) — the same two groups of 11 that
            964-fwvh names.
          - Every one of the 22 shares mtime 2026-09-21T17:22:55Z. The agent session
            began at 17:25:28Z. The writes landed ~2.5 minutes BEFORE any agent existed,
            so provisioning did this, not a cycle and not an author.
          - scripts/check-opsx-generated-dirt.sh answered ok:opsx-only, rc=0. The
            detector 964-fwvh widened to the .claude locus classified it correctly.
          - Content is upstream drift, not corruption: apply.md gains a "Project check"
            block (read `root` from `openspec list --json`, handle "root": null, never
            create the root as a side effect) and a `missingArtifacts` branch; SKILL.md
            frontmatter gains trigger phrases. metadata.author: openspec throughout.

        DURABLE ARTIFACT — the regenerated bytes are preserved on origin at
        refs/heads/salvage/unknown/20260921-opsx-1.13.1-regen @ 2e392947c264322ccb86f7c19a013e2c08184fe1,
        confirmed by ls-remote and confirmed to contain all 22 at 566/163. The working
        tree was then restored to trunk, so the diff is recoverable without keeping a
        forge dirty.

        WHY THIS SHARPENS THE ROW RATHER THAN JUST ADDING A NUMBER. This row's census
        compared four CHECKED-IN alias trees. This observation is a fifth surface that
        is not a tree at all: a forge container regenerates .claude from whatever
        openspec version the harness installer resolved at provision time. So the
        divergence this row asks a gate to refuse can be reintroduced by PROVISIONING a
        host, with no checkout and no commit — and it will recur on every forge
        provision until the generator version is pinned or recorded. That is exactly the
        "a THIRD harness locus repeats this exactly" that 964-fwvh's Residual section
        anticipated, arriving by a path the census could not see.

        WHAT THIS IS NOT. Not a new question about whether these files belong in git:
        order 540's operator ruling (2026-07-31, quoted in
        plan/issues/enhancement/opsx-generated-dirt-claude-locus-2026-09-02.md) settles
        that — "the opsx/openspec skill update is INTENDED and committable; it is
        versioned project content, not scratch." The open part is this row's: ONE
        version across the trees, recorded where a gate can read it.

        AND A TRAP FOR WHOEVER FIXES THIS. The npm pins were removed DELIBERATELY —
        plan/archive/packets-2026-07.yaml:1733, 2026-07-05: "Removed npm pins
        (opencode-ai@1.16.2, openspec@1.4.1, claude-code@2.1.168, codex@0.137.0) from
        Containerfile.base", replaced by ensure_forge_harnesses in lib-common.sh
        (backgrounded, lock-guarded, fail-soft). So "add the pin back" re-litigates a
        decision someone already made for stated reasons. A gate that RECORDS and
        COMPARES the generator version satisfies this row's third criterion without
        reversing that, which is the shape the closure already asks for.

        Filed as an event, not a new row: I was directed to file a fresh row for the
