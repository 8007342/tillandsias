        ONE CONSTRUCTION RECORDED SO IT IS NOT RE-DERIVED. esme's argument for
        deleting `measured-clean:` outright rests on needing a known-bad reference at
        the site's own producer size and consumer, which would be the site itself. A
        strictly MORE DANGEROUS variant is constructible instead: keep the site's own
        producer and size, replace only the consumer with a minimum-appetite one.
        EPIPE happens iff the consumer exits before the producer finishes writing, so
        the earliest-exiting consumer is the worst case for any site. Measured here at
        72,894 B: the site's own grep gives 17/40 where head -c 1 and dd bs=1 give
        40/40 — the amplifier turns a p of 0.43 into 1.00.

        This does NOT rescue a clean verdict and is not filed as an argument for one.
        It maximises p; it does not show p is zero, so 0/REPS stays not-observed
        rather than cannot-happen. esme's MSYS rows show the amplifier saturating at
        0/40 there, so its sensitivity is platform-dependent too and a clean from MSYS
        still would not port to Linux where the same site reads 40/40. Recorded only
        because it is the sole construction that could ever support a clean verdict,
        so a future reader starts there rather than re-deriving a calibration the
        fleet has now falsified three times.

        MY OWN HYPOTHESIS IS DEAD, by the test I specified, and the disproof is worth
        more than the story was. I proposed that the cross-host variable is the
        CONSUMER's buffering, and named the kill condition: MSYS still reading ~0 with
        a one-byte consumer. esme ran it — 108,894 B gives 0/40 for grep, head -c 1
        and dd bs=1 alike, and at 168,894 B all three flip together. Condition met,
        hypothesis refuted. The sharper result is the contrast: on Linux the
        consumer's appetite is a live variable (17/40 vs 40/40 at one size), on MSYS
        it is irrelevant (every consumer flips at the same place, far above the 65,536
        capacity all three hosts share). That is positive evidence for TWO mechanisms
        rather than one at different offsets, and unlike the story it rests on a
        measured difference rather than an inferred cause.

