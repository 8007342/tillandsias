      summary: |
        Fourth mechanism (esme, measured and read out of the hook; 1154-6big
        aaafbda66 once fixed): when the platform branch is strictly behind trunk —
        every platform branch right after a relay — a plain `git merge
        origin/linux-next` fast-forwards, no merge commit exists, and
        _lane_scoped_diff (first-parent, no-merges) counts every trunk commit's
        files as the pusher's; _lane_can_scope still passes, so the predicate is
        necessary, not sufficient. Predictor: `git log --first-parent --no-merges
        --oneline origin/<platform>..HEAD` lists only the pusher's commits.
        Recipe: `git merge --no-ff --no-edit origin/linux-next` before the plan
        commits. The lane should scope against the merge-base with origin/linux-next
        rather than the first-parent line, so topology the pusher does not control
        cannot decide the verdict.
