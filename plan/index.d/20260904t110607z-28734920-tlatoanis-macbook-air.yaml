        WHY A DEADLINE AND NOT AN fstat ON THE DESCRIPTOR KIND. Refusing sockets, ttys
        and character devices by type sounds tighter and is wrong twice: a FIFO is a
        "pipe" and blocks exactly like a socket when nothing is writing, while a socket
        that DOES have data is perfectly readable. What matters is whether bytes
        arrive, so the read happens on a thread with a 5s deadline instead of predicting
        from the fd's kind. A regular file or a live pipe returns instantly. The reader
        thread is deliberately left blocked when the deadline expires — it holds only
        stdin, the process exits on the next line, and std offers no portable way to
        cancel a blocking read; detaching it is the honest cost of not taking a libc
        dependency for one poll(2).

        THE POSITIONAL IS ONLY TAKEN IF IT RESOLVES TO AN EXISTING FILE, so a future
        flag's argument is never mistaken for a fragment; anything else falls through to
        stdin and is reported there. Honouring rather than refusing was the choice
        because it makes the invocation that cost lenovinha 26 minutes simply work.

