      host: yolanda
      summary: >
        SECOND-HOST REPRODUCTION — the packet asked for exactly this and warned against generalising from n=1. It reproduces on yolanda (Windows, tillandsias-build WSL2 distro, nix 2.35.2 from the binary tarball, single-user root install). nix build .#tillandsias-x86_64-musl fails with 'unable to download https://github.com/numtide/flake-utils/archive/11707dc2f618dd54ca8739b309ec4fc024de578b.tar.gz: SSL peer certificate or SSH remote key was not OK (60) ... unable to get local issuer certificate (20)', while SYSTEM curl fetches that same URL at HTTP 302 on the same host in the same second. So the packet's symptom description holds on a second host and a second OS, with the same install method — the regime caveat should now read two hosts rather than one, and the bundled-vs-system split is the discriminator on both. A ONE-LINE FIX WORKS, AND IT IS NOT THE PREFETCH DANCE. Adding to /etc/nix/nix.conf: ssl-cert-file = /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem (the Fedora system bundle, 146 certs, the one system curl already trusts). TWO-ARM CONTROLLED TEST against the operation that actually fails: ARM A, no ssl-cert-file -> RC=1 with the SSL failure. ARM B, ssl-cert-file set -> RC=0, build completes, artifact verified as 'ELF 64-bit LSB executable, x86-64, statically linked, stripped', ldd reports 'not a dynamic executable', binary reports Tillandsias v0.4.260826.1. This is the direct consequence of the packet's OWN diagnosis — 'the trust store the proxy's CA was installed into is the system one; nix's bundled OpenSSL never consults it' — taken one step further: point the bundled stack at the system store rather than routing around it. If it holds on lenovinha it would retire ~100 lines of jq/curl prefetch in scripts/nix-build-container.sh whose only purpose is avoiding the bundled stack, and remove the --override-input coupling from the container lane. SCOPE, stated so nobody over-reads it: validated on ONE host, ONE install method (binary tarball, single-user), OUTSIDE the container lane. NOT tested on lenovinha, NOT tested inside nix/builder/Containerfile, NOT tested with distro-packaged nix. The container image may not carry a system CA bundle at all, in which case the fix there is mounting one rather than naming one — that is the next experiment and I have not run it. A METHOD NOTE THAT COST ME TWO REVERSALS, recorded because the failure mode is subtle. I first declared this fixed, then RETRACTED after a control appeared to pass without the fix, then found the control was running 'nix flake metadata' — which resolves from flake.lock and never fetches the failing input. It exercised a different code path than the defect. The arms above deliberately run 'nix build', the operation that actually fails. A control that does not traverse the failing path is not a control, and it will happily tell you a defect is gone.
