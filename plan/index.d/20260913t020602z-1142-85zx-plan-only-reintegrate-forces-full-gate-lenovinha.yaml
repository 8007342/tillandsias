    title: |
      the gate stamp hashes plan/issues/*.md, so a coordinator drill record forces every other host into a full ~8-minute re-gate — measured, four of five full-gate forcings in one evening were plan-only, and a code land exhausted all four attempts because of it
    context: |
      MEASURED on lenovinha 2026-09-12/13, after
      `scripts/land-on-platform-branch.sh linux-next` returned
      `refused:land:attempts-exhausted:4 — origin is moving faster than this
      host gates` with the 1119-w2rj fix finished, green, and unlandable.

      THE ARITHMETIC. A code land pays a full ./build.sh --check (~8 min here).
      origin/linux-next moved on a 5-10 minute cadence across four hosts. Each
      attempt re-integrates and re-gates from scratch, so an 8-minute gate
      racing a 5-10 minute cadence loses more often than it wins, and four
      attempts is not many draws.

      THE CAUSE IS NOT CADENCE, IT IS WHAT COUNTS AS A CHANGE. Classifying the
      last twelve commits on origin/linux-next against the digest's own skip
      list (gate-stamp.sh:343 — plan/index.d/*.yaml, plan/loop_status.d/*.md,
      plan/mo-full-attestations.d/*.md):

        MEMO-SAFE   7  (would resolve to ok:gate-fresh-except-plan, seconds)
        FORCES-GATE 5

      Of the five that force a full gate, FOUR ARE PLAN-ONLY and all four touch
      the same file: plan/issues/fleet-restart-2026-09-12.md, the coordinator's
      drill record. Only one (23c3dfce3, scripts/lib-dispatch-reap.sh) is
      genuinely code, where a full re-gate is correct and unavoidable.

      So four of five forced re-gates that evening were caused by one markdown
      file that is plan-class by gate_stamp_classify_path (plan/* -> plan-ledger)
      but is NOT in the digest's skip list. The fast lane 930-i6x4 built covers
      three globs; plan/issues/ was never added to it, and the coordinator's
      records land there.

      WHY IT COMPOUNDS: the cheap lane sets the cadence and the expensive lane
      pays it. The more plan traffic the fleet generates, the harder code becomes
      to land — and the starved host looks idle while holding finished work. The
      re-gates were run against commits that could not have affected their
      outcome: nothing in a drill record changes what ./build.sh --check proved
      about a tree of Rust.
    deliverable: |
      A plan/issues-only integrate costs what it proves: the two ledger guards
      plus the issue guard, not a full gate.

        * gate-stamp.sh `compute` — add plan/issues/*.md to the skip list at
          :343, extending 930-i6x4's fast lane by one glob.
        * gate_stamp_plan_digest — add plan/issues/*.md, so the change is still
          SEEN and yields ok:gate-fresh-except-plan. Excluding from one digest
          without adding to the other would make it invisible to both, return a
          full ok:gate-fresh, and silently stop the issue guard from ever
          running — the exact hole 1127-waxf was filed to close, re-opened one
          directory over.
        * build.sh's `ok:gate-fresh-except-plan` arm — run
          scripts/check-issue-citation-convention.sh, whose SUBJECT is
          plan/issues (ISSUE_DIR at :52) and which is already cheap enough to
          sit in the fast-refusal phase.
        * the litmus named in `unscoreable`.

      A DESIGN TENSION THE CLAIMER MUST RESOLVE FIRST, and it is why this row
      is filed rather than fixed in passing. The comment above
      gate_stamp_plan_digest states a rule: "THE FIX IS IN THE MEMO, NEVER IN
      THE DIGEST — 1036-e5w9's rule, learned when a digest-side attempt
      (1034-ihxw, reverted at 0a1419ffe) reintroduced the drvfs deadlock."
      The deliverable above is a DIGEST-side change and appears to violate it.

      THE READING THAT SAYS IT DOES NOT, which needs a second opinion before it
      is relied on: 1036-e5w9 forbids digest-side fixes for the GUARD-HOLE
      problem (a change that must still be validated being hashed away), and its
      stated harm is a worktree MODE read on drvfs (889-8tcb). This change is
      the 930-i6x4 KIND — extending the append-only fast lane — and hashes no
      modes, so the deadlock mechanism does not apply. Critically, it is paired
      with adding the same glob to plan_digest and running the guard, so it
      closes the guard hole rather than opening one.

      A MEMO-ONLY FIX WAS CHECKED AND IS NOT AVAILABLE: the stamp records a
      single aggregate `digest` (verified — the file has seven fields: version,
      digest, scope, dispatch, toolchain, plan_digest, stamped), so memo-check
      cannot determine WHICH paths moved and therefore cannot decide that only
      plan/ moved. Making the memo smarter requires recording more, which is
      itself a stamp-side change.

      NOT PROPOSED: excluding plan/index.yaml. 930-i6x4 deliberately keeps the
      compacted BASE hashing because a fold rewrites it, and that reasoning is
      untouched here.
