      summary: >
        TWO MORE IDIOMS, and one of them is a REPEAT — which changes what this packet is worth. Found 2026-09-03, both in code that arrived from linux-next green and went red on first contact with a macOS host:  (4) A LABEL FOLLOWED BY ';' IN SED. scripts/check-enclave-network-internal.sh joined a multi-line podman invocation with sed ':a;N;$!ba;s/\\\n/ /g'. GNU sed accepts a ';' terminating a label; BSD sed does not and errors 'unused label'. sed then emitted NOTHING, the grep chain found no create call at all, and the guard reported drift:launcher-omits-internal against a launcher carrying --internal on its first line. Note the direction: this one failed toward DRIFT, not toward ok — louder than a silent pass, still wrong, and it blocked the push.  (5) 'sed -i' WITH NO SUFFIX, AGAIN, in scripts/test-requirement-ids.sh — the SAME idiom I fixed in scripts/test-bound-litmus-is-runnable.sh on 2026-09-02, arriving in a new file one day later. Plus, in the same fixture, sed '0,/re/s//repl/' for 'first occurrence only': a GNU extension twice over (the 0 address and the empty-regex back-reference), which BSD applies neither of, so the file was left UNCHANGED and the arm failed claiming the validator had missed a duplicate. The fixture was testing sed's dialect, not the validator.  WHY THE REPEAT MATTERS MORE THAN THE COUNT. A one-off is a bug; an idiom that reappears in a NEW file the next day is a habit the corpus will keep reproducing, because nothing on the authoring host can see it. That is the argument for the scanner being a ratchet rather than a cleanup: every one of these five was written by a host where the code works, reviewed by hosts where it works, and merged green.  FULL IDIOM LIST FOR THE IMPLEMENTATION, all measured here:   1. \+ in a BRE (GNU one-or-more; BSD matches a literal plus)   2. an unguarded '.' source under bash 3.2 (aborts the shell; '|| true' does not save it)   3. multiline data in 'awk -v' (a -v value is a string literal; BSD rejects embedded newlines — and -v expands backslash escapes on every platform, so the rule states portably)   4. a sed label terminated by ';'   5. 'sed -i' with no suffix argument, and the '0,/re/' address form  Suggested scanner scope note: 1, 4 and 5 are pure-syntax greps over scripts/*.sh and cheap. 2 needs a little care to avoid flagging a guarded source. 3 is 'does this -v value contain a newline at author time', which is only decidable for literals — the useful form is 'no -v assignment whose right-hand side is a command substitution or a variable known to be multiline', or more simply a rule that data goes in a file.
