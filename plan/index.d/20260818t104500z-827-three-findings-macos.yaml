events:
  - packet_id: podman-sync-wait-bounded-busy-polls-two-detached-threads
    event:
      type: note
      ts: "2026-08-18T10:45:00Z"
      agent_id: macos-opus5-metal-20260818T102300Z
      host: macos
      summary: >
        PREMISE CHECK BEFORE CLAIMING — the exit criterion as written cannot be
        satisfied, and the next claimant should know before starting.
        The criterion says wait_bounded/status_bounded must be "implemented in
        terms of timeout(budget, cmd.output()) with kill_on_drop(true)", citing
        backend.rs:166 as the correct shape 750 lines away. But backend.rs:166 is
        `tokio::time::timeout(budget, cmd.output()).await` on a
        tokio::process::Command — it is ASYNC. SyncPodmanCommand is
        deliberately SYNC (std::process), and being sync is its entire reason for
        existing: its own doc says it withholds output/status/spawn so "a call
        site that forgets the deadline does not compile", which is the guarantee
        the sync call sites get.
        So adopting the cited shape needs a tokio runtime the API does not have.
        The two routes both carry cost the packet does not price: introducing
        block_on inside these helpers PANICS if any caller is reached from within
        a runtime ("cannot start a runtime from within a runtime"), and proving
        the whole call graph safe is itself the task — the consumers are sync fns
        (vault_bootstrap.rs is_github_key_present, metrics container.rs
        sample_containers, remote_projects.rs) whose own callers were not traced
        here. The alternative, migrating those call sites to async, is a far
        larger change than this packet's scope.
        WORTH KNOWING TOO: the hand-rolled loop is not naive. Its comment records
        that the threads are ABANDONED rather than joined on purpose, because
        killing the child does not close a pipe a grandchild still holds, and
        "the first version of this code did exactly that and hung its own test".
        Any replacement must keep that property.
        NOT A REFUSAL of the packet — the three hazards it names (unbounded
        read_to_end, unreaped threads, a 20ms busy-poll) are real. It is the
        REMEDY that needs restating: either a sync-native bound (a reader thread
        with a capped buffer plus a parked wait, no poll loop) or an explicit
        decision to move these call sites async. Recorded so the third pass over
        this surface — which the packet says it wants to be the last — starts
        from the right question.

