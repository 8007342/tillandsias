      [2026-09-26T19:42:04Z yoga] 2026-09-26 yoga-regime re-run AFTER land46 (03cc8fa7b), trunk 6f8d134dd, trunk-built binary, by spec (ci-release, meta-orchestration, methodology-accountability). sigpipe-verdict-pipeline-shape and join-the-fleet-idempotent now PASS (land46's repins). THREE remain red on yoga, output captured:
      (1) litmus:local-ci-self-clean-evidence STEP 4/5 — "scripts/update-convergence-dashboard.sh: ligne 158 : printf: 89.8989898989899: nombre non valable". CAUSE MEASURED: the caller's numeric locale (yoga is fr_FR); the same command under LC_ALL=C prints ok:dashboard-target-routed. This is 1191-vrjf (filed by yoga 09-14); fixed on work/1191-vrjf (bbd4d77b9, merged 95d33cabd) with a two-locale byte-identity guard. Green on every C-locale host, which is why the fleet never saw it.
