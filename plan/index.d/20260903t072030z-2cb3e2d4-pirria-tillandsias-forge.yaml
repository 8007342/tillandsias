      summary: >
        THE MEASUREMENT THAT DECIDES THE CEILING IS COUNTING THE WRONG THING — memory.current and memory.peak INCLUDE PAGE CACHE, and on this host 91% of the headline number is exactly that. This overturns a ruling built on it an hour ago, and it also refuses to replace it with a new certainty. BOTH CLAIMS — '586 MiB is 10x too small' AND '586 MiB is roughly right' — ARE UNSUPPORTED BY ANY MEASUREMENT ANYONE HAS TAKEN, INCLUDING THIS ONE. That sentence is the finding; everything below is why.  THE HEADLINE NUMBERS, pirria forge (N150, 4 cores, native podman, v56.9.2.1):   memory.current   5,846,564,864 B = 5577 MiB   memory.peak      6,724,464,640 B = 6413 MiB   MemTotal        16,100,220 kB    = 15.35 GiB ; SwapTotal 15.35 GiB   memory.max = max, memory.high = max  (still unbounded — the defect this packet is about, unchanged) Against the 586 MiB spec ceiling that reads as 9.5x steady and 10.9x peak — WORSE than lenovinha's 8.2x, and the point at which the obvious conclusion is that the ceiling is absurd.  THE DECOMPOSITION, /sys/fs/cgroup/memory.stat, same instant as the 5577:   anon                389 MiB   <- NOT reclaimable: the actual working set   shmem                20 MiB   <- tmpfs, not reclaimable   slab                111 MiB   file               5070 MiB   <- RECLAIMABLE page cache     inactive_file    4926 MiB   <- cold; trivially reclaimed under pressure     active_file       124 MiB   memory.swap.current  0.25 MiB <- essentially nothing swapped, with 15.35 GiB available anon + shmem = 413 MiB. Against 586 MiB that is not 10x too small; it is the same order with roughly 30% headroom. The 5577 is 91% COLD PAGE CACHE accumulated over a night of cargo builds, a 473-test litmus suite, six-plus gates and a 205 MB tree copied several times for the reflink measurement.  WHY THIS BREAKS THE INFERENCE, mechanically: `--memory` is a RECLAIM-THEN-OOM BOUNDARY, not a high-water mark on memory.current. A container does not die when its page cache reaches the limit — the kernel reclaims cache first and the container keeps running. Cold inactive_file is the cheapest thing the kernel has to drop. So 'emitting the flags would OOM-kill every forge' DOES NOT FOLLOW from memory.peak, and neither does any ceiling derived by multiplying memory.peak upward. The instrument reports a number that a hard cap would never have to hold.  AND NOW THE LIMIT ON MY OWN NUMBER, which is the most important paragraph here and is why I am not asserting the opposite conclusion. memory.stat IS INSTANTANEOUS. memory.peak is a peak OF THE COMPOSITE, so THE HISTORICAL PEAK CANNOT BE DECOMPOSED — I do not know what anon was when the composite reached 6413 MiB. My 389 MiB anon is a POINT READING TAKEN AFTER the heavy work, at load average 2.16, not during it. Through the workspace-adjacent builds and through the 3663-process brew fork bomb, anon could have been far higher and NOTHING RECORDED IT. So 389 MiB is A FLOOR ON PEAK ANON, NOT PEAK ANON. This is the same trap the coordinator warned me about for idle peaks, arriving on a different axis, and I caught it on myself only because the warning was fresh.  THEREFORE THE HONEST STATE: nobody has measured the quantity the decision needs. '586 is 10x too small' rests on a composite that is 91% reclaimable cache. '586 is roughly right' rests on a post-hoc point sample that cannot see the peak. Neither is supported. Do not let the 413 become the new false certainty — that is exactly how the 4801 became a fleet ruling.  NEXT ACTION, and it is cheap: a sampler that reads /sys/fs/cgroup/memory.stat on an interval THROUGH A REAL BUILD and records max(anon+shmem). There is no `anon.peak` in cgroup v2 — memory.peak is the only kernel-maintained high-water mark and it is the composite — so peak anon must be sampled or it does not exist. A few lines. It should live on a durable host, NOT in an ephemeral forge; I have deliberately not built it here for that reason, and because a sampler that dies with its container measures one container's night and teaches the fleet nothing.  WHAT THIS DOES NOT TOUCH: the defect this packet was filed for is unchanged. Nothing emits `--memory` or `--memory-swap`; the requirement is discharged by a test of a pure helper with no production callers; the live cgroup is unbounded. None of that depended on the size of the number, and none of it is affected by this correction. What changes is only the REMEDY — whether the fix is 'emit the specified value', 'emit a corrected value', or 'emit memory.high instead of memory.max' — and that choice is now explicitly blocked on a measurement rather than resolved by one.  A NOTE ON memory.high, both directions, because the decomposition cuts both ways and I saw only one of them first. With 91% of the footprint reclaimable, a soft throttle is the BETTER instrument: memory.high reclaims and throttles where --memory reclaims and then kills, and the two only diverge on genuinely anon-heavy workloads. But the same decomposition ARGUES AGAINST amending the spec at all — if the true anon working set is near 400 MiB, the specified 586 may need no change whatever, and an amendment written now would be changing a number that was never shown to be wrong.  REGIME, stated because a peak from an idle forge and a peak from a working one are different measurements wearing one name: NOT IDLE, and high-side rather than low-side. Uptime 11h57m; load average 2.16/1.55/0.83 at the reading; this container ran the full instant-tier litmus (473 tests), six or more ./build.sh --check runs of which four were forced full gates, several 205 MB tree copies, repeated ledger folds, and the brew recursion that reached 3663 live processes. pids.peak 3663 of 4096 is still latched from that incident; pids.current was 31 at the reading. n=1, this host, one night.
