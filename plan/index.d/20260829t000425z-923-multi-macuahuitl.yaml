        A run without the aarch64 toolchain produces either a red --ci-full
        or a named skip/fallback verdict — never ERROR-then-green
      - |
        NEGATIVE CONTROL: a genuinely corrupt staged binary still fails loud
  - packet_id: containers-conf-env-line-is-orphaned-and-never-converges
    order: 923-rmtw
    status: ready
    title: |
      ~/.config/containers/containers.conf [engine] env still carried the
      pre-801-kqme no_proxy list (git-service/tillandsias-git present,
      nix-cache ABSENT) — no current code writes that line, nothing
      converges it, and it poisoned every ad-hoc container: 883-ncrs's
      "cache RSTs" were this stale file all along
    kind: bug
    pickup_role: linux
    priority: p1
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - provisioning
      - proxy
      - podman
      - fail-loud
      - convergence
    estimated_hours: 3
    deliverable: |
      Provisioning (tillandsias --init path) CONVERGES the containers.conf
      [engine] env proxy block to the canonical ENCLAVE_NO_PROXY_BASE list
      (crates/tillandsias-headless/src/main.rs:1619) or REMOVES it in favor
      of the per-container proxy_env_args() injection — plus a check that
      the deployed list matches the compiled canonical list, so the next
      constant change cannot strand fleet hosts again.
    context: |
      OBSERVED on macuahuitl 2026-08-29: the deployed [engine] env no_proxy
      lacked nix-cache and still named git-service/tillandsias-git; the
      source constant (main.rs:1619, order 801-kqme, measured 2026-08-17)
