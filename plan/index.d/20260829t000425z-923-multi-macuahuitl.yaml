      line in current code — it is an orphaned artifact of an older
      version. Effect: every enclave sibling routed https://nix-cache:5000
      through squid (TCP_RESET when up, DNS failure when down) — the exact
      883-ncrs symptom set, reproduced and then cleared by a probe with
      proxy env stripped (valid nix-cache-info from harmonia). Host
      repaired in place this cycle (backup containers.conf.bak-20260829);
      every other fleet host provisioned before 801-kqme presumably still
      carries the stale list. tillandsias --debug --init (v0.4.260828
      binary) did NOT converge it — that is the reproducible gap.
    exit_criteria:
      - |
        A host with a pre-801-kqme containers.conf env line runs init and
        ends with the canonical list (or no env line), verified by a check
        that diffs deployed vs compiled
      - |
        NEGATIVE CONTROL: a deliberately corrupted no_proxy entry is
        DETECTED by the check, not silently accepted
    verifiable_closure: |
      On a fixture HOME with the stale conf: init converges it; the new
