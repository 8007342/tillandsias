      Either the ERROR path exits non-zero (and --ci-full names the failed
      stage), or the fallback-to-staged-binaries path is a named ok/skip
      verdict instead of ERROR lines — an ERROR that gates nothing and a
      fallback that alarms are both wrong.
    context: |
      OBSERVED on macuahuitl 2026-08-29 during the runtime pass:
      ./build.sh --ci-full --install exited 0 while its tail showed
      "[build-guest-binaries] ERROR: missing aarch64 musl linker" and
      "ERROR: failed to build guest binaries with Nix or local Cargo".
      Reproduced directly: bash scripts/build-guest-binaries.sh; echo $?
      -> 0. build.sh:1185 invokes it bare inside a function, so even a
      non-zero exit may not gate — verify both layers. The verify step
      elsewhere ("stale/absent staging skips cleanly — order 447") suggests
      staged binaries make the failure tolerable BY DESIGN; if so the
      message class is the defect, not the exit code.
    exit_criteria:
