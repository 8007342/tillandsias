    context: |
      Audit finding M1 (black-box M1 confirmed). write_runtime_secret and write_unseal_key_file chmod to 0444 and rely on the 0700 parent directory, which is not present inside the container. The Vault container reads as a different uid than the file owner, which is why 0444 was chosen; the fix must keep Vault reading its key and TLS files.
