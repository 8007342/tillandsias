      unpinnable-until-the-guard-exists: the fix changes the mode assertions in the same commit (1136-n8sh).
    next_action: 'Change the mode assertion first and watch it fail, then find the narrowest mode each consumer reads through keep-id. Left to do: everything.'
    provenance: sighted credential audit 2026-11-11, order 2080; black-box finding M1.
