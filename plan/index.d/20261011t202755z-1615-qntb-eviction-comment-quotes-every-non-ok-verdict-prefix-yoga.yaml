    title: |
      land-queue's gate-failed eviction comment quotes every non-ok verdict prefix the runner emits (could-not-run:, degraded:, down:) and shell deciders' lowercase fail:, not only FAIL, [FAIL], refused:, violation: and blocked:
    context: |
      SEEN by macuahuitl-fedora 2026-10-11, live on #333's eviction: the failing step's verdict was `could-not-run:worktree-add-cleanup-fixture`. 1602-3ave's FAIL-lines builder (scripts/land-queue.sh, BEGIN/END-FAIL-LINES) matches only ^FAIL, ^[FAIL], ^refused:, ^violation:, ^blocked:, so the line reached the comment only because it happened to sit in the `tail -5`.
      The runner's verdict grammar (crates/tillandsias-plan/src/script_run.rs, verdict.emit's kind_ok list) is ok: skip: refused: blocked: could-not-run: violation: degraded: down:. The non-ok ones the builder lacks: could-not-run:, degraded:, down:. A script-run timeout already prints `refused:timed-out:<name>`, so it is covered. The classifier's cannot-start / no-space are return tokens, never line prefixes.
      Also lowercase `fail:`, which shell deciders print (e.g. `fail:cloudflare-token-rotation:fake-binary-missing:`); the builder's ^FAIL is case-sensitive and misses it.
      Folded into 1613-bpd3's push at the coordinator's request, not a PR of its own.
    exit_criteria:
