# Ledger fragment — append-only, IMMUTABLE once written.
# Hand-written: `tillandsias-plan append-event` edits the BASE index.yaml and
# cannot reach a packet that exists only in plan/index.d/ (it reports
# "packet_id not found" even though `status` resolves it through the fold).
# The events channel below is the fragment-native equivalent.

events:
  - packet_id: windows-tray-staged-guest-asset-restage
    event:
      type: note
      ts: "2026-08-11T23:55:00Z"
      agent_id: "windows-claude-opus5-20260811t215500z"
      host: windows
      summary: >
        RE-FRAMED, and the exit criteria below replace the filed ones. The
        filing said "restage the asset and commit it"; both halves were wrong.
        crates/tillandsias-windows-tray/assets/tillandsias-headless-* is
        gitignored (.gitignore:94), as is target-guest/ (.gitignore:70) — the
        asset is per-host staging state with nothing to commit — and order 447
        already ruled that stale staging is HOST STATE, not a code regression,
        which is why build-guest-binaries.sh --verify skips cleanly on it.
        The real gap is upstream: build-windows-tray.ps1 decided whether to
        embed a staged guest by comparing CONTENT HASHES ("did the asset
        change") and never asked whether the staged binary was CURRENT, so a
        stale-but-non-empty staging directory was copied into assets/ silently
        — the WARN fires only when staging is ABSENT. That is the dangerous
        direction: a tray embeds a guest older than its own source and injects
        it into fresh provisions, the exact registered-distro version skew
        order 350's first exit criterion exists to catch. Nothing caught it at
        build time; the only guard was a test assertion that a build never
        runs.
        REPLACEMENT EXIT CRITERIA — (1) build-windows-tray.ps1 refuses to embed
        a staged guest that does not carry the workspace VERSION, verified in
        BOTH directions (a current binary still embeds; a stale one is refused
        and the asset left at the zero-byte placeholder, not the stale
        content); (2) a tray built from the checkout provisions a guest
        reporting the checkout's VERSION on a distro that had NO prior
        Tillandsias guest.
  - packet_id: windows-tray-staged-guest-asset-restage
    event:
      type: progress
      ts: "2026-08-11T23:56:00Z"
      agent_id: "windows-claude-opus5-20260811t215500z"
      host: windows
      summary: >
        Criterion 1 IMPLEMENTED and check-verified on this host.
        build-windows-tray.ps1 now scans the staged binary for the workspace
        VERSION (read from the repo-root VERSION — the same source build.rs
        stamps into WORKSPACE_VERSION, so the build-time refusal and the
        test-time assertion cannot disagree about what "current" means) before
        copying. Following order 447's posture it refuses the STALE COPY, not
        the build: the asset falls back to the zero-byte placeholder, which is
        the sanctioned absent-asset path, so a fresh guest fetches the
        published release instead of being handed a skewed binary.
        Evidence, both directions — POSITIVE: current staging (0.4.260810.1)
        still embeds, and cargo test -p tillandsias-windows-tray went 79
        passed/1 failed -> 80 passed/0 failed. NEGATIVE (the load-bearing
        half, since a check that never refuses would pass the positive case):
        staged file replaced with a payload stamped 0.4.260809.2, build printed
        the WARN, refused the copy, and left the asset at 0 bytes rather than
        the stale content. Guest binaries restaged here via
        scripts/build-guest-binaries.sh (local cargo fallback; Nix unavailable
        on this host).
        Criterion 2 NOT closed: this host's guest already reports 0.4.260810.1,
        so reconcile_adopted_guest returns early on the version match and the
        injection path is never exercised. Proving it needs a clean distro
        (--reset-guest), which wipes the vault and requires an attended
        re-login — left for an operator window rather than done unattended.
        Status therefore stays at `implemented`, not `completed`.

status:
  - packet_id: windows-tray-staged-guest-asset-restage
    field: status
    value: implemented
    ts: "2026-08-11T23:56:00Z"
    host: windows
