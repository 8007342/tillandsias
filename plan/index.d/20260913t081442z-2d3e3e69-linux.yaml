        parse logs other tools write; this log is written by --emit-tokens in the same
        file, one flat record per line. Parsing our own format with awk removes the
        jq-missing branch entirely, so this line cannot render `:unreadable` on a host
        that simply lacks jq — a token instrument going blind on the cheapest hosts would
        miss exactly the fleet the operator is protecting.

