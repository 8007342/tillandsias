    title: "The litmus podman shim's mode selector crosses the Lua door, so fake mode never reaches the real podman delegate"
    context: |
      RC attempt 2: image-build-convergence-shape step 1 failed with empty output. Captured by #1229's kept stderr on yoga:
      scripts/lua/verify-image-usable.lua (called by build-image.sh through `script run`) printed "podman image inspect
      exit 101" whose body was a cargo build of the podman delegate. The Lua door passes the `podman` env profile only,
      which carries no LITMUS_PODMAN_* name, so the runner's shim (target/litmus-runtime/bin/podman) sees no
      LITMUS_PODMAN_MODE, defaults to real, and delegates to the real podman path, compiling it on first use in a fresh
      tree. Run directly it passed: the fixture's own shim (mode-blind) came first on PATH.
    exit_criteria:
