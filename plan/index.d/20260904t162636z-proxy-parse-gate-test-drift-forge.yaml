    order: 1022-px54
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [test, proxy, release, low-end]
    estimated_hours: 1
    owned_files:
      - crates/tillandsias-headless/tests/proxy_cache_policy.rs
      - images/proxy/entrypoint.sh
    title: |
      headless proxy_cache_policy::bumped_origin_tls_and_signed_url_logs_fail_closed
      is a pre-existing trunk-red: it asserts literal 'exec squid -N' but the
      entrypoint has launched via squid-supervisor since 7292b097b (767-es4w)
    context: |
      MEASURED in an ephemeral forge on linux-next at a5d50109a (2026-09-04),
      ./build.sh --check: the test panics at
      crates/tillandsias-headless/tests/proxy_cache_policy.rs:112
      ("entrypoint.find(\"exec squid -N\").expect(\"Squid launch\")") because
      images/proxy/entrypoint.sh:97 is now
      'exec /usr/local/bin/squid-supervisor squid squid -N' — commit 7292b097b
      (fix 767-es4w: supervise squid) changed the launch line but the test was
      not updated. 'squid -k parse' (:84) does still precede the launch (:97),
      so the test's INTENT (parser gate runs before serving) is structurally
      preserved; the literal launch-string assertion is what drifted.
      This red exists at HEAD independent of any cycle's change: confirmed by
      running the test from a clean worktree of a5d50109a (the crate builds and
      the assertion fails identically). It blocks ./build.sh --check for every
      host while it stands.
      DECISION to make where the test lives: the assertion should follow the
      launch line (squid-supervisor still ends in 'squid -N') OR assert on the
      supervisor invocation; and confirm the parse-before-launch ordering is
      still what protects the gate. Not established here whether the supervisor
      preserves the parse-before-serve property end-to-end — the fixer should
      read images/proxy/entrypoint.sh and pin the ordering, not just the string.
    exit_criteria:
      - "./build.sh --check is green on the headless proxy_cache_policy suite at a clean linux-next"
      - "the test asserts the CURRENT launch mechanism and still requires the runtime 'squid -k parse' gate to precede it"
