      summary: >
        THE NIX CACHE IS IN THE TRAY'S CONTAINER GRAPH. Service::NixCache rides
        the ForgeLaunch dependency edge, so every forge bring-up ensures it —
        the operator's "transparent to the development runtime", 2026-08-24 —
        and SHARED_STACK_SCOPES lists it Core, so teardown/refcount finally
        know the container exists. The sequencing hold the packet filed itself
        under is gone: 801-x1nx (nix in the forge image) is completed, so the
        consumer exists.

        THE SPLIT, not a reimplementation: the script keeps everything only the
        host+nix can do (signing keypair, TLS leaf from the stack CA, harmonia
        resolution with GC pin, harmonia.toml) behind a new launch-free
        `prepare` subcommand; the tray launches the container itself from
        build_nix_cache_run_args. One prep implementation serves both the
        standalone script path and the graph path. The harmonia LOGICAL store
        path — the one launch input Rust cannot derive — travels in prepare's
        verdict line.

        SKIP IS SUCCESS, deliberately: no nix, no store, or no checkout script
        all return Ok, so the ForgeLaunch edge never turns nix into a launch
        requirement, and prep/start failures WARN rather than wedge — an
        accelerator that can hang the launch is a net brake.

        LEFT AS RESIDUE, honestly: (1) parity between the script's `_podman
        run` and build_nix_cache_run_args is enforced only by the Rust-side
        pinned test plus comments at both sites — a two-sided extraction check
        would be stronger; (2) end-to-end graph bring-up (ensure_forge_launch
        satisfying NixCache on a live forge launch) is untested until the next
        forge launch on this host; (3) no LivenessProbe entry yet — the packet's
        self-healing criterion — which is the natural next slice and needs the
        probe table's shape studied first. Status implemented, not completed,
        for exactly these.

        Held to the packet's own map throughout (router as template), and the
        gate contributed one catch of its own: my first draft used raw
        Command::new("podman") and 714-4r6w's guard refused the tree until the
        calls were bounded.
