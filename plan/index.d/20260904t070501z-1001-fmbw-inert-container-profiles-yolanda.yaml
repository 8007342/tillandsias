packets:
  - packet_id: container-profile-tmpfs-lists-are-inert-and-untypeable
    order: 1001-fmbw
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: any
    release_target: stable-milestone-v1
    capability_tags:
      - architecture
      - fail-loud
      - dead-mechanism
    estimated_hours: 3
    title: |
      The four forge container profiles list three of forge-hot-cold-split's four hot paths, have zero non-test callers, and their tmpfs_mounts type cannot express the fourth even if someone wired them.
    deliverable: |
      Either the profile constants become the real launch source of truth with a
      type that can carry a per-launch size, or they are deleted. What must NOT
      persist is the current state: a list that LOOKS like the launch profile,
      is cited as evidence about launch behaviour, and launches nothing.
    context: |
      MEASURED ON YOLANDA 2026-09-04 while wiring the tmpfs half of 997-e4v2.

      1. THE LISTS ARE INERT. forge_opencode_profile, forge_claude_profile,
         forge_opencode_web_profile and their sibling in
         crates/tillandsias-core/src/container_profile.rs have ZERO callers
         outside that file's own test module. Every reference is a test
         constructing the profile to assert something about it.

      2. THE LIVE LAUNCH PATH IS SOMEWHERE ELSE. The forge tmpfs mounts that
         actually reach podman are emitted by the ContainerSpec builder in
         crates/tillandsias-headless/src/main.rs (the `.tmpfs(...)` chain in the
         forge launch spec) and by crates/tillandsias-podman/src/launch.rs.
         Three copies of the same list, one of them inert.

      3. THE TYPE CANNOT EXPRESS THE FOURTH PATH. `tmpfs_mounts` is
         `Vec<&'static str>` (container_profile.rs:57). forge-hot-cold-split
         sizes /home/forge/src per launch from the project mirror's pack size,
         which is not a compile-time constant. So the list is not merely
         missing an entry — it is incapable of holding one. Completing it in
         place is impossible without changing the type at all 11 tmpfs_mounts
         sites in that file.

      WHY THIS IS FILED SEPARATELY. 997-e4v2 cited container_profile.rs:278 as
      its evidence that "three of the four hot paths ship". That citation is
      true about the constant and false about what launches, and the packet's
      real subject is the ~/src removal. Widening it into an 11-site type
      change on lists that launch nothing is how a packet stops closing
      (coordinator ruling, 2026-09-04). 997-e4v2 wired the LIVE emitter and
      annotated all four constants to point at it; this packet owns the
      constants themselves.

      THE SHAPE IS THE ONE 997-e4v2 IS ABOUT, one layer down. compute_hot_budget
      was built, unit-tested, @trace'd to the spec, archived as complete, and
      called by nothing. These lists are the same: they pass their own tests,
      they read as the launch profile to anyone grepping for tmpfs, and they
      are evidence about a launch they do not participate in. An inert
      mechanism with passing tests is exactly as green as a live one.
    exit_criteria:
      - |
          Either the profile constants are the source the launch path READS —
          with a tmpfs type that can carry a per-launch size, and the duplicate
          lists in headless main.rs and podman launch.rs deleted in favour of it
          — or the forge profile constructors are deleted outright along with
          the tests that only exist to assert about them.
      - |
          No list of forge tmpfs mounts exists in the tree that is not the one
          podman receives. Pinned by a test that fails if a second list appears.
      - |
          If the constants survive, /home/forge/src appears in them, sized by
          compute_hot_budget, and the launch path demonstrably reads it.
    verifiable_closure: |
      unscoreable: the pin's SHAPE depends on the disposition, and this packet
      is the choice between two. If the constants become the source of truth,
      the pin asserts the four HOT roots are present in the list that launches;
      if they are deleted, that pin has no subject and the assertion is instead
      that no second list exists. Naming a litmus now would name one for a fix
      that has not been chosen, which is the dishonest-pin shape this gate
      exists to stop. The obligation is stated here and the litmus lands with
      the fix.

      Intended pin either way — enumerate every forge tmpfs list in the
      workspace and assert there is exactly ONE, with a negative control that
      re-introduces a second list and shows the check goes red. Today it must
      be red against three copies (container_profile.rs's four profile
      constants, headless main.rs's launch chain, podman launch.rs), which is
      the pin's starting evidence rather than a prediction about it. Plus, if
      the constants survive, an assertion that the four HOT roots
      forge-hot-cold-split names are all present in the list that launches.
    notes: |
      Filed by yolanda from 997-e4v2's tmpfs slice, at the coordinator's
      direction to keep it out of that packet. The in-tree annotation added by
      997-e4v2 names the live emitter and says the type must change before the
      lists are trusted — that annotation is the current honest state, not the
      fix, and this packet is the fix.
