      - scripts/with-tillandsias-builder.sh
    title: |
      scripts/with-tillandsias-builder.sh `exec`s into `toolbox run`, so there is no host-side process left to signal and a cancelled gate keeps running in the same checkout — the cause behind 1132-r4mt's arm 4 and 1141-5pgh
    context: |
      ASSIGNED BY macuahuitl after yoga reproduced the mechanism pirria first
      traced. Filed under a minted order because no wrapper-propagation row was
      findable — not in the folded ledger, not on origin/work/1140-i6ct. If
      pirria's row surfaces, these are the same subject and one should be
      closed as a duplicate of the other.

      THE DEFECT. `exec toolbox run ...` REPLACES the wrapper, and `toolbox
      run` is a thin client of `podman exec`; the container-side process is
      parented by CONMON, not by the client. So a signal sent to the host side
      reaps a client that is no longer anybody's parent, and the work keeps
      running.

      MEASURED ON YOGA 2026-09-13, a real gate mid-run:
        3171292 ppid 1200     toolbox run --container tillandsias-builder
        3171549 ppid 3171292  podman ... exec ...
        3171571 ppid 3171568  bash .../build.sh --check   <- conmon, NOT the client
        3185549 ppid 3171571  bash .../build.sh --check
      SIGTERM to the host side reaped it; 3171571 stayed ALIVE with a live
      child writing a test transcript. SIGTERM to the STRAY did nothing 8s
      later; SIGKILL to it and its child reaped it. pirria measured one still
      running TWELVE MINUTES after its launcher was stopped, with
      test-archiver-ruby-could-not-run.sh as its live child, concurrent with a
      second gate. macuahuitl's own refusal followed a killed pre-gate by
      seconds.

      WHAT IT EXPLAINS. 1132-r4mt arm 4's positive control races a second
      archiver; 1141-5pgh's orphaned probe is a stray's debris. Both rows
      described a symptom of this. 1132-r4mt arm 5 stays PROPOSED, not
      demonstrated — one stray would explain it, but only arm 4's race has been
      exhibited.

      THE SAME LESSON AS 891-5shq, ONE AXIS OVER: that boundary did not carry
      FLAGS inward, this one did not carry TERMINATION inward. The remedy is
      shared for the same reason — scripts/with-wsl2-builder.sh dispatches
      identically, so the second instance already exists in the tree.
    exit_criteria:
      - "The host-side wrapper propagates termination into the container-side tree: SIGTERM, a bounded wait, then SIGKILL. The escalation is required, not defensive — SIGTERM to a stray was measured INERT on three hosts, so a TERM-only reaper reports success and leaves the gate running. Pre-fix result: FAILS (transcript above)."
      - "The kill set is identified by a MARKER, never by a command line: a stray and a legitimate concurrent gate run the same argv, so an argv matcher kills the wrong one. Killing a healthy gate is a worse failure than the orphan being fixed."
      - "NOT YET DONE — build.sh refuses to start while another build.sh from a DIFFERENT dispatch is alive in the same checkout, discriminated by ppid: a stray's parent is conmon, a legitimate gate's is the podman exec that launched it, and that is true before any kill. A nested build.sh whose parent is this gate's own build.sh is legitimate and must not trip the lock — pirria nearly reported one as a stray."
      - "The fixture forces the gate where it runs one. ./build.sh --check SHORT-CIRCUITS on its freshness stamp and exits in seconds without running a gate, so a stray check across such a run finds nothing — a true observation about a gate that never started. TILLANDSIAS_FORCE_CHECK=1 is required, and this cost a real measurement on yoga before it was understood."
      - "NEGATIVE CONTROL: the reaper must not be able to reap nothing and call it success, and must not widen. An empty or unset token must match NO process — a reaper treating '' as a wildcard would kill every process on the host the first time a token went unset."
