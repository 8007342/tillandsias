    verifiable_closure: |
      Killing a gate leaves no gate running: after SIGTERM to the host-side
      build.sh, no container-side build.sh from that dispatch survives, shown
      on a host that reproduced the stray.
    owned_files:
      - scripts/lib-dispatch-reap.sh
