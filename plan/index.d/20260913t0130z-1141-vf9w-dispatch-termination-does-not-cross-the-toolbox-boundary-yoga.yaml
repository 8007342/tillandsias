        summary: |
          Criteria 1, 2, 4 and 5 landed; criterion 3 (the lock) is NOT done and
          the row stays in_progress for it.

          scripts/lib-dispatch-reap.sh is the shared implementation, placed in
          a lib on the FIRST boundary rather than the second because
          with-wsl2-builder.sh has the same defect and 891-5shq's fourth
          criterion is that a second dispatch must not reimplement a fix this
          one already made.

          VERIFIED END TO END ON YOGA, same experiment as the pre-fix
          transcript: SIGTERM to the host-side build.sh now reaps the whole
          container-side tree, the reap message fires once, and no build.sh
          survives. Exit-code fidelity preserved through the new fork+wait
          dispatch (exit 7 -> 7, exit 0 -> 0), stdout and cwd still cross.

          TWO DEFECTS IN MY OWN FIRST VERSION, both measured rather than
          reviewed, and both in the handler that runs while a gate is being
          cancelled. It scanned /proc with `tr | grep` per pid: 819ms per scan
          over 438 pids, polled up to 20 times — ~16s and ~16000 processes
          spawned WHILE THE CALLER IS TRYING TO DIE, which is a reaper slow
          enough to be killed before it finishes. Rewritten with `mapfile -d ''`
          and a `[ -r ]` guard: 40ms. It also printed ~300 permission errors per
          scan down the caller's stderr, because an unreadable environ is
          reported by the SHELL performing the redirect and `2>/dev/null` on
          the inner command does not silence it; the group is redirected now.

          The fixture is hermetic (no podman, no toolbox, no gate) and
          MUTATION-VERIFIED against both wrong fixes, each caught by the arms
          written for it: dropping the SIGKILL escalation reds arm 7 (7/9), and
          matching any marked process rather than this token reds arms 3 and 5
          (7/9). Restored identical, 9/9.
