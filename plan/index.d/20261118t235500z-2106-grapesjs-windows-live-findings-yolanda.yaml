  - packet_id: webstudio-open-refuses-or-brings-up-the-tls-listener-instead-of-a-null-window-url-and-never-claims-a-window-that-is-not-open
    order: 2106-gj2w
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: windows
    capability_tags: [studio, router, tls, tray-status]
    estimated_hours: 3
    depends_on:
      - windows-tray-launches-a-web-studio-in-a-forge-and-opens-it-in-a-native-windows-browser-window
    title: "webstudio.open with no preview TLS listener refuses with router_not_ready (or starts it) instead of answering window_url null, and says the operator's window is open only when one is"
    context: |
      MEASURED 2026-11-18: webstudio.open grapesjs answered started:true, window_url:null, preview_url:null (no
      /run/user/0/tillandsias/router/preview-tls-port yet, so tls_port() was router_not_ready); a second call answered
      "already running: the operator's window is open" with url null while browser.list_windows was empty and no
      window existed on the desktop. The claim comes from the launcher's running map, not from a window.
      Also: preview.status tls.host_trust "untrusted" is misleading on the studio path; studios open in the
      containerised chromium dev-browser, which carries the enclave CA (operator ruling), so report the trust of the
      window that will actually open.
    exit_criteria:
      - "With no preview TLS port, webstudio.open answers a refusal naming router_not_ready (or brings the listener up and answers the https URL); never window_url null. Pre-fix: FAILS (null)."
      - "The window-is-open text appears only when a window for that studio exists (browser.list_windows or the tray registry); otherwise the reply says the window is pending or failed. Pre-fix: FAILS."
      - "On the studio path, the trust field names the dev-browser window's trust, not the host store."
    unscoreable: "unpinnable-until-the-guard-exists: the implementer adds the failing pin in the same commit as the fix (1136-n8sh)"
    provenance: "tlatoani.net-forge relay and yolanda guest reads 2026-11-18; macuahuitl-fedora direction."
    events:
