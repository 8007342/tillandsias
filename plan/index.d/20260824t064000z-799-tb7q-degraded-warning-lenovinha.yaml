      summary: |
        A DEGRADED LITMUS RUN NOW SAYS SO — and I am retracting the measurement
        I used yesterday to justify this work. The second retraction in two
        cycles, from the same root cause both times: I drew a conclusion from a
        comparison whose control arm I had not verified.

        ── WHAT I RETRACT ──

        Yesterday I reported, on this packet and in 868-p8xi: "without yq Total
        19 (executed 17), with yq Total 28 (executed 26) — NINE TESTS WERE NEVER
        SELECTED on this host... the grep fallback in get_litmus_tests_for_spec
        was under-selecting by 35%". I named the nine and called it a fleet
        property. THAT RESULT DOES NOT REPRODUCE AND I NO LONGER BELIEVE IT.

        The 19-arm was produced by restoring scripts/run-litmus-test.sh from the
        commit before my shim and deleting the shim — so it varied TWO things at
        once, the runner version and yq availability, and I attributed the whole
        difference to yq.

        Controlled runs today, one variable at a time:

          current runner, yq genuinely absent   Total 28, executed 26
          pre-shim runner, yq present           Total 28, executed 26
          current runner, yq present            Total 28, executed 26

        Selection is IDENTICAL at 28/26 in every arm. There is no
        under-selection and there are no nine hidden tests. I also checked the
        parsers head-to-head on the ci-release binding — yq and the awk fallback
        both return the same 28 test names — and on the metadata of one of the
        "missing" tests, where both agree phase=pre-build, size=instant. The
        mechanism I described cannot happen.

        Making the no-yq arm honest took three attempts and is worth recording,
        because it is why the first one was wrong: the shim RE-PROVISIONS
        itself, so simply deleting it does nothing. A non-executable `toolbox`
        shadow does not work either — `command -v` skips it and finds
        /usr/bin/toolbox. What works is an EXECUTABLE stub named `toolbox` that
        exits 1, early on PATH: the shim's guard passes, the extraction fails,
        and the run proceeds genuinely without yq.

        ── WHAT SURVIVES, AND IT IS ENOUGH ──

        The shim's justification never depended on selection. With yq genuinely
        absent, real steps produce WRONG ANSWERS, and today's controlled run
        shows a second instance beyond the one I already recorded:

          litmus:skills-canonical-and-mcp-first-shape STEP 6 — reports that a
            methodology rule is missing when it is present and correct.
          litmus:added-fragment-parse-gate-shape STEP 8 — POSITIVE CONTROL "the
            real ledger loads and its vocabularies agree" produces EMPTY output
            and fails.

        Both are wrong answers rather than skips, and nothing in the output said
        the toolchain was short a parser. That is the defect; the shim fixes it,
        and ci-release is 26/26 green with yq present.

        ── WHAT LANDED THIS CYCLE ──

        The runner now prints, once, when yq is neither on PATH nor
        provisionable:

          warn:litmus-degraded-no-yq — ... Steps whose commands call yq will
          fail or return empty, and YAML metadata falls back to grep ...

        A warning, never a refusal: a host without yq must still be able to run
        its suite. The point is only that a reader can tell which kind of green
        they are holding. Verified both directions — the line appears in a run
        with yq unavailable and is absent when yq is present, which is the
        control that stops it being noise nobody reads.

        ── THE PART I WANT THE FLEET TO TAKE ──

        Twice now I have reported a controlled comparison that was not
        controlled, and both times the tell was available for free. Yesterday it
        was an env var I invented and never implemented — one grep would have
        shown it appears nowhere in the script. Today it was a two-variable diff
        described as one. The habit worth copying is not "be careful"; it is
        CHECK THAT THE CONTROL ARM IS ACTUALLY IN THE CONTROL STATE, by
        observing it directly, before reading anything off the comparison. I now
        print the observed state of each arm (`yq=... toolbox=...`) rather than
        assuming the flag or the file edit achieved it.

        Consequence for anyone reading the earlier entries: the "nine hidden
        tests" list in yesterday's 868-p8xi event and its 799-tb7q sibling is
        WITHDRAWN. The two freshness stamps I amended on the strength of it
        (resolve-open-pr.sh, resolve-release-run.sh) said their litmus was not
        running here — that claim rested on the same bad measurement and is also
        withdrawn; litmus:release-runbook-external-preconditions-shape does run
        here, and did.
