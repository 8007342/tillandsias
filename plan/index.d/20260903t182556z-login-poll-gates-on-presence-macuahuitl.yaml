packets:
  - packet_id: the-login-poll-gates-on-token-presence-and-never-on-validity
    order: 995-srbf
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [tray, credentials, github, vault, fail-loud, spec-gap]
    estimated_hours: 5
    title: |
      A token that expires or is revoked in place keeps presence=true forever, so the validating probe never runs again and the tray holds LoggedIn indefinitely against a dead credential.
    context: |
      FOUND by esme-tillandsias-wsl2 from the forge side while the operator was
      looking at the same symptom from the tray side. Filed here because that
      host cannot push. EVERY CITATION BELOW RE-VERIFIED AGAINST
      origin/linux-next BEFORE FILING.
      THE MECHANISM, crates/tillandsias-headless/src/main.rs around 14946:
        let presence = spawn_blocking(vault_bootstrap::is_github_key_present)...
        if last_presence == Some(presence) { continue; }
        // Presence changed (or first observation): resolve the handle with the
        // containerized probe, then push (change-gated in set_login_state).
      The validating probe is only reached PAST that `continue`. So it runs on a
      presence TRANSITION - a token added or deleted - and never when a token
      goes bad while sitting there. `is_github_key_present` is presence-only and
      SAYS SO in its own doc comment in vault_bootstrap.rs: "Fast presence-only
      check ... For a definitive auth validation that proves the credential
      works, use `remote_projects::is_github_logged_in` instead." The code names
      its own remedy one line from the defect.
      `set_login_state` is change-gated, so with no fresh observation the tray
      holds LoggedIn forever.
      THE THREE-STATE MACHINE IS NOT THE BUG. menu_state.rs promises "an
      invalid/missing token falls back to the GitHub Login leaf, never a stale
      rendering". It is correct and is never fed a fresh observation, so it
      renders exactly the stale state it was built to prevent.
      FIELD EVIDENCE IS THIS ENTIRE SESSION: 22h uptime, a Vault token
      present-and-refused throughout, the tray never demoted, and the only
      reason anyone learned of it is that a forge agent reported a failed push.
      SPEC GAPPED IN BOTH HALVES, verified. openspec/specs/github-credential-health
      is `status: active` and requires exactly the gating expected - CredentialInvalid
      disables project lists, GitHub login becomes the primary CTA. But three of
      its five scenarios trigger on "WHEN the tray starts" and the other two are
      a probe hang and a post-login transition: THERE IS NO SCENARIO FOR A TOKEN
      THAT GOES BAD MID-SESSION. And its vocabulary is unimplemented - grep of
      crates/ for CredentialInvalid, CredentialMissing, GithubUnreachable and
      credential_health returns ZERO for all four. An active spec with no
      implementation behind its classifier.
      SAME FAMILY AS 982-sguu ONE LAYER UP: 982 is a guard the dispatch path
      never calls; this is a probe the steady-state loop calls in its CHEAP form
      and never in its TRUTHFUL one.
    exit_criteria:
      - a token that goes bad in place is observed as bad without a presence transition, and the tray demotes; verified by revoking a live token and watching the tray, not by unit test alone
      - the validating probe is what feeds set_login_state on that path, not the presence check
      - the mirror already publishes refs/tillandsias/upstream-auth/denied/... on every probe; decide explicitly whether to consume it as a second free trigger, or record why not
      - the spec gains a mid-session scenario, or states that startup-only is deliberate and says what covers the rest
      - the spec's four state names exist in crates/ or the spec is corrected to name what is actually implemented; an active spec whose vocabulary appears nowhere is worse than no spec
      - the fix must not add a per-tick podman exec on the hot path; the cheap presence check stays, the truthful one runs on a slow cadence or on a push refusal
