      summary: |
        RESIDUAL, named so it is not rediscovered as a surprise: the guest-binary
        refresh is not wired into anything that runs on its own.

        build-windows-tray.ps1 REFUSES a stale staged binary at build time
        (order 689-gipe), so the failure is loud and cannot ship silently. But
        the refresh itself — scripts/build-guest-binaries.sh — is a separate
        manual step, and both its output (gitignored) and the verification
        stamp (outside the repo) are host-local. So every host, after every
        VERSION bump, re-enters the state this packet described until someone
        runs it by hand.

        The cheap fix is for build-windows-tray.ps1 to RUN build-guest-binaries.sh
        when the staged binary is missing or predates the checkout, instead of
        only refusing — it already computes exactly that condition. Not done
        here: it changes the release lane's build script, which builds with Nix
        in CI, and deciding whether CI should be allowed to fall through to the
        cargo path is a release-integrity question rather than a Windows one.
