    order: 836-smm2
    status: ready
    kind: bug
    pickup_role: any
    priority: p1
    desired_release: v0.5
    release_target: architecture-audit-epic
    depends_on:
      - guest-exec-allowlist-forces-argv-flattening
    split_from: guest-exec-allowlist-forces-argv-flattening
    deliverable: |
      `argv_survives_wt_reparse` and `wt_safe_title` in
      crates/tillandsias-windows-tray/src/notify_icon.rs are deleted, and
      all Windows tray lanes route through wt.exe unconditionally (the argv
      is already safe for wt.exe re-parsing under order 823-u5zf).
    capability_tags:
      - rust
      - windows
      - security
      - architecture
    tags:
      - exec-wire
      - argv
      - escaping
      - v0.5
    title: |
      Delete the Windows argv-flattening workarounds now that launch_spec
      emits verbatim safe argv vectors.
    context: |
      Order 823-u5zf made launch_spec emit verbatim argv for project-scoped
      lanes — every token is alphanumeric/slash/dash, passing
      argv_survives_wt_reparse trivially. The workaround is now dead code:
      it still exists and is still called, but it always returns true for
      project lanes. GithubLogin is the only path that could return false,
      and it already bypasses wt.exe via the PtyIntent::GithubLogin check
      at line 3764. The workaround therefore has no live effect and can be
      deleted.
    exit_criteria:
      - |
        `argv_survives_wt_reparse` is deleted from notify_icon.rs. A grep
        for the function name returns nothing in the tree.
      - |
        `wt_safe_title` is deleted from notify_icon.rs. A grep for the
        function name returns nothing in the tree.
      - |
        The routing decision at line 3764 no longer references
        argv_survives_wt_reparse. GithubLogin still bypasses wt.exe;
        all other intents route through wt.exe unconditionally.
      - |
        Existing tests that referenced the deleted functions are updated
        or removed. `cargo test` passes. `cargo clippy` clean.
    verifiable_closure: |
      NAMED: source scan — grep for `argv_survives_wt_reparse` and
      `wt_safe_title` returns zero matches in the tree.
    events:
      - type: filed
        ts: "2026-08-19T18:57:00Z"
        agent_id: opencode-bigpickle
        host: forge
        summary: |
          Split from 795-zshi (guest-exec-allowlist-forces-argv-flattening).
          This is the Windows-specific workaround deletion slice. The guest-side
          verbatim argv arm and CAP_EXEC_ARGV_VECTOR are already landed.
          The host-side launch_spec already emits safe argv for project lanes.
          This packet deletes the now-dead workaround functions.
