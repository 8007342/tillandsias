          * run_disk_usage_check was `tokio::spawn(async move { f() })`. Wrapping
            a sync fn in an async block does not make it async; it parks a
            blocking `Command::output()` — plus, on first boot, materializing
            every embedded runtime asset — on a WORKER thread. That was the most
            expensive thing queued ahead of the bind.
          * run_trace_budget_enforcement was an `async fn` whose ONLY `.await`
            was the log read; everything after it serde_json-parses every line
            with no yield points. Converted to sync (`std::fs::read_to_string`)
            and spawn_blocking'd. Deliberately NOT fixed with `yield_now()`
            sprinkled through the loop: that would leave the same CPU-bound work
            on a worker, merely interruptible. A startup one-shot doing a
            blocking read on a blocking thread is what spawn_blocking is for.

        CRITERION 4 — readiness-clock origin, stated: the ordering fixed here
