  - packet_id: a-falsified-status-descent-forgets-its-falsification-once-compacted-so-an-older-higher-rung-fragment-arriving-later-reverts-it-and-one-fragment-set-folds-to-two-statuses
    order: 1550-8528
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.6
    release_target: the-convergence-models-theorems-are-machine-checked-on-builders-only-and-the-rust-scorer-and-lua-graders-are-tested-against-vectors-the-proved-model-emits
    pickup_role: any
    capability_tags: [rust, plan, ledger, crdt, coordination, multi-host, compaction]
    estimated_hours: 4
    owned_files:
      - crates/tillandsias-plan/src/fragments.rs
    title: |
      The status fold is not equivalent across a compaction boundary when a falsification is involved — base completed, fragment A (verified, older) and fragment B (ready, newer, carrying a falsified event) fold to ready when both are present, but to verified when B is compacted first and A arrives afterwards — because the fold honours a descent only while the falsified event rides in the same fragment and the base arm compares against a compacted row with no falsification and no clock, so a returning host with a stale high rung silently re-closes work that was explicitly falsified
    context: |
      MEASURED on yoga 2026-10-04, binary build-id 0.1.0+579b43ef754b46de
      (trunk 9dae9870b), scratch ledgers via the global --index flag
      (design note §5 F1 has the table):
        control, base alone                         -> completed
        A + B both present                          -> ready
        B alone                                     -> ready
        B compacted ("compacted 1 fragment(s)"),
          then A written, folded                    -> verified
      Fragment A: status verified, ts 2020-01-01T00:00:00Z, host h1.
      Fragment B: status ready, ts 2026-01-01T00:00:00Z, host h2, plus an
      events entry of type falsified for the same packet.
      MECHANISM, read from fold_with_sources, status_entry_wins and
      fragment_falsifies in fragments.rs: a descent is accepted only when
      the incoming fragment itself carries the falsified event; after
      compaction the base row holds status ready and the base arm calls
      status_entry_wins with empty timestamps and no falsification, where a
      rung beats a working state unconditionally.
      THE DATA TO DECIDE IS STILL THERE: the compacted base keeps the
      falsified event with its ts under the packet's events. It is not
      consulted.
      NOT A DUPLICATE OF 1123-k3mq (completed, archived): that row made
      compaction apply the ladder, and its load-bearing negative control —
      with NO falsification an older verified still beats a newer completed
      — is pinned by
      compaction_keeps_the_ladder_teeth_an_older_higher_rung_still_wins.
      This is the falsified case across a compaction boundary, which no
      test names. Returning hosts with stale fragments are the expected
      condition, which is what made 1123-k3mq p1.
      THE REFERENCE IS THE UNCOMPACTED FOLD. Compaction is meant to be
      invisible (fold's doc comment: any host can compact and get a result
      every other host agrees with), so the defect is the inequivalence,
      and ready is the answer the fold already gives. An implementer who
      concludes the reference should instead be verified is changing what
      a falsification means (650-dq6u) and must stop and ask the operator.
      RELATED OPEN ROW 1073-xays (same file, same root, different defect):
      compaction discards the winning status entry's host and ts because
      the base schema has nowhere to put them, which leaves old claims
      unattributable. That row is about WHO HOLDS A CLAIM; this one is
      about WHICH STATUS THE FOLD ANSWERS. They are independently
      schedulable — different exit criteria, and repair (a) below needs
      nothing from 1073-xays — but 1073-xays shape (a) (status_host /
      status_ts on the base row) would also supply the clock repair (b)
      here needs, so whoever takes either should read the other first.
      CANDIDATE REPAIRS (design note §5 F1): (a) the base arm consults the
      packet's own falsified events and refuses an incoming non-falsified
      rung whose ts is not later than the latest falsification — no new
      field; (b) compaction writes the falsification clock beside the
      status; (c) rule that an unseen older rung is new evidence and change
      the uncompacted fold to agree.
    exit_criteria:
      - 'a test in the plan crate builds base completed, fragment A (verified, older) and fragment B (ready, newer, falsified) and asserts that folding A and B together and compacting B then folding A give the SAME status; pre-fix result: FAILS, ready versus verified (measured 2026-10-04 at 0.1.0+579b43ef754b46de)'
      - 'the same equivalence is asserted with the order reversed (A compacted first, then B arrives) and for a falsified descent to a lower RUNG rather than to a working state; pre-fix result: not measured'
      - 'NEGATIVE CONTROL, load-bearing: compaction_keeps_the_ladder_teeth_an_older_higher_rung_still_wins and higher_rung_wins_regardless_of_timestamp_order still pass, so without a falsification an older higher rung still beats a newer lower one; pre-fix result: PASSES and must still pass'
      - 'a rung written LATER than the falsification still climbs (a re-verification after the falsification is not refused); pre-fix result: passes uncompacted, not measured across compaction'
      - 'the rule that survives is stated where a reader meets it, in the doc comments of status_entry_wins and of the base arm, including what a falsification does to rungs older than itself'
    verifiable_closure: |
      cargo test -p tillandsias-plan compaction_then_late_arrival passes on
      the fixed tree, and the first criterion's test fails on trunk
      9dae9870b with ready versus verified.
    depends_on: []
    next_action: >
      Write the failing test first from the measured fixture (design note
      §5 F1), then repair (a) unless reading the base arm shows a reason it
      cannot work. Keep 1123-k3mq's negative control green.
    notes: |
      size: S
      implementer_tier: opus
      Found by trying to STATE compaction equivalence as a theorem (S3 of
      the design note), not by a prover. 1550-5i2w proves it once this is
      fixed.
