  - packet_id: refiner-refine-reports-a-valid-monotone-dependency-chain-of-64-or-more-rules-as-unstable-because-its-iteration-bound-is-a-constant-not-derived-from-the-rule-set
    order: 1550-a5jc
    status: ready
    kind: bug
    priority: p3
    desired_release: v0.7
    release_target: the-convergence-models-theorems-are-machine-checked-on-builders-only-and-the-rust-scorer-and-lua-graders-are-tested-against-vectors-the-proved-model-emits
    pickup_role: any
    capability_tags: [rust, plan, obligation-lattice, convergence, methodology]
    estimated_hours: 2
    owned_files:
      - crates/tillandsias-plan/src/obligation.rs
      - crates/tillandsias-plan/src/obligation_props.rs
    title: |
      Refiner::refine iterates at most a hard-coded 64 times, while the finite-stabilisation theorem it implements bounds the strict steps by the lattice height (six per obligation) or the rule count and needs one further iteration to observe the fixed point, so a chain of 64 upward-closed rules reaches its fixed point and is reported Unstable, and longer chains are cut short — a closed failure, but one the existing test comment says cannot happen
    context: |
      MEASURED on yoga 2026-10-04 at trunk 9dae9870b with a temporary test
      appended to obligation_props.rs (restored afterwards): rule 0 is
      Rule::always(r000, Declared); rule i raises obligation i to Declared
      when obligation i-1 is at least Declared. Every predicate is upward
      closed, so the set is monotone and inflationary.
        n=10  Fixed steps=10          declared 10/10
        n=63  Fixed steps=63          declared 63/63
        n=64  Unstable bound=64       declared 64/64   <- IS the fixed point
        n=65  Unstable bound=64       declared 64/65
        n=70  Unstable bound=64       declared 64/70
      The doc comment on unstable_outcome_is_distinguishable_from_fixed
      says no rule set can reach the refusal ("rules only raise, the chain
      is finite") and so only constructs the value. The measurement shows
      it is reachable by a valid rule set.
      THE BOUND THE PROOF GIVES (design note §4.2 L5): each strict step
      makes at least one rule take effect for the last time, and each
      obligation can rise at most six times, so strict steps are at most
      min(6 x obligations, rules); one more iteration observes equality.
      Severity is low: Refiner has no production caller today (1550-sy27)
      and the failure never reports a false fixed point.
    exit_criteria:
      - 'a test builds the n-rule dependency chain for n in 63, 64, 65 and 70 and asserts Fixed with every obligation declared; pre-fix result: 63 Fixed, 64 Unstable with 64 of 64 declared, 65 Unstable 64 of 65, 70 Unstable 64 of 70 (measured 2026-10-04)'
      - 'the iteration bound is derived from the rule set and its derivation is stated in the doc comment of refine'
      - 'Unstable is either removed as unreachable, or kept for a case a test actually reaches; the comment claiming it is reachable only in principle is corrected either way'
      - 'the property tests in obligation_props.rs still pass, including the_suite_rejects_a_deliberately_wrong_model'
    verifiable_closure: |
      cargo test -p tillandsias-plan long_monotone_chain passes on the
      fixed tree and fails on trunk 9dae9870b at n=64.
    depends_on: []
    next_action: >
      Write the chain test from the measured shape, derive the bound, fix
      the comment.
    notes: |
      size: S
      implementer_tier: sonnet
      Rule.applies is a plain fn pointer, so a chain needs one
      non-capturing closure per rule; the measurement generated them as
      literals.
    events:
      - type: filed
        ts: "2026-10-04T18:06:32Z"
        agent_id: claude-fable-yoga-20261004t180632z
        host: yoga
        summary: |-
          Measured with a temporary test; the constant 64 where the theorem
          has a function of the input.

