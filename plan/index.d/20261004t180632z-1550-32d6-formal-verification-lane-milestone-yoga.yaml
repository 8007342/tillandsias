    title: |
      A Lean model of the seven-state evidence chain, componentwise spec states, rules and the simultaneous step of Refiner::step proves L1-L7 of the design note — the step is inflationary for every rule set, monotone when every predicate is upward closed, the committed wrong model is not monotone, a strict chain has at most six steps per obligation, iteration stabilises within min(6n, rules) strict steps, the limit is the least fixed point above the start, and refine is then monotone, inflationary and idempotent — replacing the prose proofs of Proposition 1 and Theorem 3 on the website's Level 5 page
    context: |
      Statements and the methodology checks they discharge: design note
      §4.2; statement shapes §4.3 (NOT compiled). The model must mirror the
      Rust exactly where it matters: every rule reads the OLD state in one
      step (Refiner::step evaluates applies on state, not on next), and a
      rule raises its obligation to max(current, to).
      L3 mirrors non_monotone_rules in obligation_props.rs (raise req-b to
      RuntimeObserved when req-a == Declared) so the Lean negative control
      and the Rust one are the same model.
      L5's bound is the one 1550-a5jc makes the code use; if the proof
      finds a different bound, that row's criterion follows the proof.
      STATEMENT REVIEW COMES FIRST (decision D5): the operator reads the
      statements before any proof is written. A vacuous or mis-modelled
      theorem is green and worthless.
