      - "whichever way it is decided, the reasoning is recorded: does `linux-mutable` on a packet mean REQUIRES mutable, or AUTHORED on mutable? The remedies differ and the ledger does not currently say"
      - "NEGATIVE CONTROL: a host must not lose access to work it can genuinely do. Narrowing to 172 rows on this host is only correct if the 130 excluded rows really do require a mutable host; sample and check some before shipping the narrowing"
