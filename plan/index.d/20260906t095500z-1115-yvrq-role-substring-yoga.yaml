    title: |
      pickup_role is matched as a case-insensitive SUBSTRING and the worker skill's host table tells every Linux host to pass `linux`, so `linux` matches `linux-mutable` and an immutable host is offered work that requires a mutable one
    context: |
      FOUND on yoga 2026-09-06 when the selector offered 1025-a896
      (`pickup_role: linux-mutable`, the operator's gh-token investigation
      assigned to macuahuitl) to yoga, which is Fedora Silverblue with a
      read-only /usr.

      MEASURED, same ledger, same moment:

        --claimable-by linux             rows=302   includes 1025-a896
        --claimable-by linux-mutable     rows=173   includes 1025-a896
        --claimable-by linux-immutable   rows=172   EXCLUDES it
        --claimable-by linux_immutable   rows=172   EXCLUDES it

      TWO THINGS COMBINE, and neither is wrong alone. `pickup_role` is matched
      as a case-insensitive SUBSTRING (main.rs:1386), so "linux" is inside
      "linux-mutable". And the worker skill's Host Detection Table maps every
      Linux host to the platform name `linux`, which is what a cycle passes to
      select-work-batch.sh. A coarse role plus substring matching means the
      immutable hosts see the mutable hosts' queue.

      A THIRD VOCABULARY MAKES IT HARDER TO FIX BY HAND: the host probe emits
      `linux_immutable` / `linux_mutable` with UNDERSCORES
      (scripts/host-capability-probe.sh:25,129) while packets use hyphens.
      Both spellings happen to exclude the mutable packet here, but a fix that
      threads the probe's value through without reconciling the separator is
      relying on a coincidence of substring matching.

      WHAT IT COSTS, and it is not only a wasted cycle: a host that claims a
      mutable-only packet may get some distance in before discovering it
      cannot do the work, and the claim removes the packet from the queue of
      the host that could. On this occasion the packet was also somebody's
      operator-assigned investigation, so the claim would have been a
      collision rather than merely a mistake.

      NOT FIXED HERE, DELIBERATELY. Narrowing the selector from 302 to 172
      eligible rows is a fleet-wide behaviour change and it may be wrong:
      `linux-mutable` on a packet might mean "requires a mutable host" or
      merely "authored on one", and those need different remedies. Deciding
      which is a coordinator call with the numbers in front of them, which is
      why this is filed with the measurement rather than patched.
    exit_criteria:
