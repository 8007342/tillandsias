      summary: |
        Consumer requirement from 1443-sb9b (coordinator-ratified 2026-09-27): the sandboxed `tillandsias-plan lua` CLI has no way to set its exit status. It withholds os.exit, and a chunk's return values are only printed. So a hook stub cannot exec a Lua script and let the script decide the hook's result. scripts/hooks/pre-push-main-branch-affordance.sh (work/1443-sb9b 86dfc6206) bridges this: it captures the script's single verdict line and exits 0 only on exactly ok:main-branch-affordance, which is fail-closed. A true exec needs a status channel in the lua CLI, either a sandbox-safe os.exit(n) or a returned {exit=n} the CLI maps to its process status. When that exists, the sb9b stub should switch to `exec "$PLAN" lua …` and drop the verdict comparison. That stub is the consumer that retires the bridge.
