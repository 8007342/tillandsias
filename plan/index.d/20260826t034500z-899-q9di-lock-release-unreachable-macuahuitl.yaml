packets:
  - packet_id: the-checkout-lock-release-step-is-unreachable-if-the-terminal-marker-rule-is-followed
    order: 899-q9di
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      Finalization step 9 says the MO-FULL marker MUST be the FINAL output line and step 9b says release the lock after it — so a cycle that obeys step 9 never releases, and the next cycle on that host refuses
    deliverable: |
      a cycle that completes correctly leaves the checkout unlocked
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - meta-orchestration
      - fail-loud
      - multi-host
    estimated_hours: 2
    context: |
      MEASURED on macuahuitl 2026-08-26T03:38Z, at Start Of Cycle, by being the
      cycle that got refused.

        TILLANDSIAS_CYCLE_HOLDER_PID=$PPID scripts/cycle-checkout-lock.sh acquire \
            --lane loop-cron --source "hourly /loop: ..."
        -> skip:overlap-lock-held:lane=loop-cron pid=2393229 since=1787707937
           source=hourly cron; release sequence in progress

        $PPID          = 2393229
        lock holder    = 2393229
        ps -p 2393229  = claude, ELAPSED 07:56:39

      **The holder was THIS SAME PROCESS.** The previous cycle on this host
      completed a full release (cut, tagged, published, promoted v0.4.260826.1
      to stable), emitted a valid `MO-FULL: COMPLETE`, and never released the
      lock. The next hourly fire then refused the checkout to its own agent.

      THE CONTRADICTION IS IN THE SKILL, NOT IN THE AGENT.

        Step 9:  "emit the terminal marker ... as your FINAL output line"
                 "Emit the FINAL `self` line verbatim as your final line"
        Step 9b: "Release the checkout lock — AFTER the terminal marker is
                  derived, as the cycle's last mutation"

      Step 9b says "derived", which is technically satisfiable: run `self`,
      hold its output, release the lock, then print the held line. But step 9
      is stated four times as an absolute about the FINAL OUTPUT LINE, and the
      natural — and, on this host, actual — reading is that the cycle ENDS at
      the marker. An agent that follows the more emphatic rule strands the lock
      every time.

      WHY IT MATTERS MORE THAN ONE SKIPPED CYCLE. The stale-reclaim bound is a
      dead holder or 3h. On a host driven by an hourly loop, a live-but-idle
      harness process holds the lock for the FULL three hours — the "dead
      holder" escape never fires, because the agent process legitimately spans
      many cycles. That is up to **three consecutive skipped fires**, and the
      skill's own step 9b names the cost: *"on a 30-minute cadence that is six
      skipped fires."*

      Worse, the refusal is indistinguishable from the healthy case it was
      built for. 873-zcim's whole purpose is that a refused-for-overlap cycle
      is recorded durably so it can be told apart from a cycle that ran and
      found nothing. It cannot be told apart from THIS — a cycle refused by its
      own predecessor's bookkeeping omission.

      SAME CLASS AS 898-zhf3, FOUND THE SAME NIGHT: a runbook prescribing an
      order its own guard forbids. There the release runbook said push-tag-then-
      back-merge while the hook refused the tag push until the back-merge
      existed. Here the exit contract says end-at-the-marker while the lock
      protocol says act-after-the-marker. **Both are steps that cannot both be
      obeyed, and in both cases the agent that obeys the more emphatic one
      produces the failure.**
    outcome: |
      A correctly-finished cycle cannot leave its own checkout locked.
    exit_criteria:
      - 'Step 9/9b are reconciled so both can be obeyed. Preferred: the release happens INSIDE the attestation path, so no agent ordering can strand it — e.g. `mo-full-attest.sh self` releases the lock as part of deriving the marker, or a trap/atexit in the lock script. A skill wording fix alone is the weakest option, because it relies on the next agent reading two rules and preferring the quieter one.'
      - 'FIXTURE: a simulated cycle that emits the marker and then exits without any further command leaves the lock RELEASED. This must fail before the fix and pass after — the current behaviour is the negative control and it is reproducible today.'
      - 'A stranded lock is DISTINGUISHABLE from a live one. `skip:overlap-lock-held` must not read identically when the holder is an idle process that already attested. Suggest the lock record carry the holder cycle''s terminal disposition: a holder that has emitted MO-FULL is done, whatever its pid is doing.'
      - 'NEGATIVE CONTROL: the 873-zcim property still holds — two genuinely concurrent agents in one checkout still get `skip:overlap-lock-held`, and the durable refusal record in ~/.cache/tillandsias/overlap-refusals.jsonl still distinguishes refused-for-overlap from ran-and-found-nothing.'
    verifiable_closure: |
      A cycle driven to completion by the documented step-9 reading exits with
      the lock free, proven by a fixture that fails against today's code.
    notes: |
      DO NOT fix this by shortening the stale-reclaim window. The 3h bound is
      protecting against a genuinely crashed holder; making it aggressive to
      paper over a protocol gap would start reclaiming locks from live cycles,
      which is the failure 873-zcim exists to prevent.

      DO NOT fix it by telling agents to "remember step 9b". The whole point of
      the marker rule is that the cycle's last act is machine-verifiable; a
      rule that requires an agent to do something after its own declared last
      act is the same shape as a comment claiming a check runs.

      WORKED AROUND IN THIS CYCLE, recorded so the workaround is not mistaken
      for the fix: the holder pid was verified to equal `$PPID` — the same live
      `claude` process — before releasing. Releasing a lock held by a DIFFERENT
      agent would be exactly the stacking 873-zcim forbids, so the identity
      check is not optional and any future agent hitting this must make it
      before touching the lock.
    events:
      - type: filed
        ts: "2026-08-26T03:45:00Z"
        agent_id: linux-macuahuitl-claude-20260826t034017z
        host: macuahuitl
        summary: |
          Filed by the cycle that was refused, against the lock its own
          predecessor stranded. 873-zcim shipped the lock and is completed; this
          is a defect in its release path rather than an event on it.
