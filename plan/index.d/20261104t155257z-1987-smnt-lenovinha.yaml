  title: The studio mounts the tray's model-folder map, and studio.restart applies a change without an image rebuild
  context: 'extra_model_paths.yaml was baked into the imagegen-studio image, so every folder-map change (a new pin folder) needed a multi-minute studio image rebuild. The tray now writes its compiled-in map to the host model cache at every start and bind-mounts it read-only over the baked copy; studio.restart recreates the container (not podman restart: a file bind keeps the old inode after an atomic rename), so the fresh mount is read.'
  exit_criteria:
  - 'The studio run argv mounts the tray map read-only at /opt/comfyui/extra_model_paths.yaml, written from the compiled-in table. Pre-fix result: FAILS, no such mount.'
  - 'Editing the map plus a recreate changes /object_info without an image rebuild. Measured live 2026-11-04 with the built studio image on CPU: map A listed alpha_model.safetensors; map B after the recreate listed beta_model.safetensors.'
  verifiable_closure: 'cargo test --bin tillandsias --features tray,listen-vsock -- imagegen_studio; the live two-map probe.'
