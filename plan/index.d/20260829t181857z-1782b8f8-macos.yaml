        DESIGN SLICE — DECISION: a PIPE FOR STDIN ONLY, opened by a new capability-gated variant. Landed as CAP_PTY_DATA_SESSION carrying the full record; the frame, the guest wiring and the fallback are the implementation follow-on.  THE MEASUREMENT THAT DECIDED THE ENCODING, and it inverted my own expectation. I assumed adding a session-kind FIELD to PtyOpen would break older decoders loudly, and wrote a test to confirm it. The test FAILED, so I rewrote it to assert what actually happens (postcard_field_skew_is_asymmetric_and_the_old_reader_fails_silently) and measured BOTH directions:   * OLD reader, NEW frame with an extra trailing field -> DECODES FINE, every understood field intact, surplus bytes simply not consumed.   * NEW reader, OLD frame missing a field -> DECODE ERROR. So widening PtyOpen is not a loud break. It is worse: an older guest would silently IGNORE the session kind and treat a data session as a terminal one — which is precisely the corruption this packet exists to fix, arriving with no error anywhere in the system. A new VARIANT is rejected by name instead (pinned separately), so the additive move must be a variant, gated on the capability, never a field. That is the second time on this wire that "the obvious additive change" and "the safe additive change" were different things, and both times only an experiment separated them.  WHY A PIPE FOR STDIN ONLY, rather than replacing the PTY. The guest's pre_exec currently dup2's the slave onto fds 0,1,2. Wiring ONLY fd 0 to a pipe:   * removes the line discipline from the data path, so all six measured bytes arrive by construction rather than by escaping — and escaping could not have worked for 0x13 anyway, since flow control acts on the terminal regardless of how the byte was encoded in transit;   * makes end-of-input a REAL pipe close, which drops the canonical-mode dependency entirely and reduces 925-eofi's VEOF injection to the older-peer fallback. That collapse is the tell that this is the structural answer rather than another horn;   * leaves fd 1/2 on the slave, so output streaming, combined stdout/stderr ordering and isatty(1) are unchanged;   * leaves the interactive attach path untouched, so Ctrl-C still raises SIGINT — the property the raw-toggle alternative would have silently destroyed.  WHAT I DID NOT DO, and why it is not laziness: implement the variant. The guest change is small, but it lands in the fork/exec path shared by attach and exec, and its correctness argument depends on a fallback that must stay loud for peers without the capability. Per this packet's own history — where deciding by patching was the thing to avoid — the decision is now recorded with its evidence and the implementation is a separate, claimable step that starts from a settled choice.  HONEST LIMIT: the pipe design is reasoned from the measured constraints and the existing fd wiring, not yet demonstrated. Nothing here proves a pipe-stdin child behaves as expected under this guest's spawn path; that is the implementation's first exit criterion, and scripts/measure-exec-wire-control-bytes.sh is the harness that will answer it — the same table, re-run, with all nine rows expected INTACT.
