    kind: bug
    title: "spec_answer answers a sourdough-bread question with confidence=retrieved and six spec citations — cosine top-k always returns k, and no relevance signal survives into the envelope"
    deliverable: "the fat expert can refuse: a relevance signal reaches the envelope (a score, a threshold, or both) so a question the corpus does not cover returns confidence=unsupported instead of six confident citations"
    pickup_role: linux
    release_target: forge-local-experts-milestone
    capability_tags: [experts, rag, fail-loud, soundness]
    estimated_hours: 4
    context: |
      MEASURED on yoga, 2026-08-18, against the live 19483-chunk index.

        question: "what is the best recipe for sourdough bread and how long
                   should it proof"
        spec_answer -> confidence=retrieved, citations=6
        top citation: openspec/specs/knowledge-source-of-truth/spec.md:152-155

      The citations are real, in-bounds, and verify() would accept every one of
      them. They are also about nothing the question asked.

      TWO INDEPENDENT CAUSES, and both have to be fixed for the expert to be
      able to refuse:

      1. `spec::top_k` is cosine top-k. It ALWAYS returns k results, because
         "the k nearest vectors" is defined for any query. There is no
         threshold anywhere in the path, so "no good match" and "six good
         matches" are the same code path with the same output shape.

      2. NO RELEVANCE SIGNAL SURVIVES. `spec-retrieve` emits records keyed
         content_hash,id,key,kind,line_end,line_start,path,text — the cosine
         score is computed and then dropped. The envelope's citations carry
         authority,commit,kind,line_end,line_start,path. So even a caller who
         WANTED to apply a threshold has nothing to apply it to.

      WHY THIS IS p1 RATHER THAN A QUALITY NIT. The deterministic experts
      already refuse: answer.rs:480-491 documents that an empty citation set
      DOWNGRADES to unsupported — "the expert refuses rather than guesses", and
      plan_answer returns confidence=unsupported in exactly that case. So the
      fleet has one expert family that refuses and one that cannot, behind a
      single envelope schema where `confidence: retrieved` reads identically
      from both. An agent cannot tell "the corpus covers this" from "the corpus
      was searched". That is the fail-loud milestone's own defect shape: not a
      missing answer, but a confidently wrong one wearing the same clothes as a
      right one.

      It also undercuts what 803-su4n bought. Code is now in the corpus
      precisely so agents ask instead of grepping — and an agent that asks
      about something the code does not do gets six citations rather than a
      refusal.

      HOW IT SURFACED, worth recording because it was invisible from the green
      side: writing 551's ground-truth set I went looking for a refusal case,
      since `Expect` treats `unsupported` as a first-class expected answer. I
      could not write one. Every question I could invent returned retrieved.

      DELIBERATELY NOT PINNED IN 551's SET: a case asserting
      confidence=retrieved for a nonsense question would make the current
      behaviour the contract and turn the fix red. Once a threshold exists,
      that case becomes the natural regression test and should be added then,
      expecting `unsupported`.

      NOT INVESTIGATED, so nobody assumes it was: what a sensible threshold IS.
      Cosine scores are not calibrated across corpora and the fleet has four
      kinds in one index (spec, cheatsheet, methodology, code) whose typical
      similarities may differ. Picking a number without measuring the score
      distribution would be folklore of exactly the kind 802-2536 exists to
      stop.
    exit_criteria:
      - |
          The cosine score reaches the envelope, so a consumer can see how well
          an answer matched rather than only that it matched.
      - |
          A question the corpus does not cover returns confidence=unsupported,
          with the threshold justified by a measured score distribution rather
          than chosen.
      - |
          A refusal case lands in openspec/litmus-tests/groundtruth/spec-rung1.yaml
          expecting `unsupported`, so the refusal cannot silently regress.
