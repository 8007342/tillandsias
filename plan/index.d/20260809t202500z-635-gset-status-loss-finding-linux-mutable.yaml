packets:

  - packet_id: fragment-status-transitions-silently-discarded
    order: 635-i6vm
    status: completed
    desired_release: v0.5
    priority: p0
    title: "52% of fragment-recorded completions were discarded by the fold, so finished work kept being re-offered"
    kind: bug
    deliverable: scripts/check-fragment-status-loss.sh
    depends_on: []
    pickup_role: linux
    capability_tags: [plan, crdt, ledger, triage, data-integrity]
    context: >
      Found by the batch selector handing this host three packets, TWO of which were
      already finished: 606-qh3f (project-info-jsonrpc-contract-parity) and 619-3y75
      (generic-project-harness-fixtures), the latter recorded complete on 2026-08-08 with
      its deliverable present on disk.

      MEASURED: 11 of 21 packets recorded `completed` in a fragment were still folding as
      `ready` — 52% of fragment-recorded completions silently discarded, some for two days.

      CAUSE. `packets:` is a G-SET keyed by packet_id: union, where re-adding an existing
      packet is a NO-OP. Status is a separate LWW-Register with its own `status:` channel
      keyed by (ts, host). Both facts are documented in plan/index.d/README.md and
      fragments.rs — and both were followed correctly by the CRDT implementation.

      The defect is that recording a transition the wrong way is INDISTINGUISHABLE from
      recording it the right way at every point a human or agent would look. It parses. It
      validates. `tillandsias-plan check` passes. The diff reads correctly in review. The
      fold throws it away and nothing anywhere reports that it did.

      This is the mechanical root of "agents pick obsolete work and go in circles" — not a
      ranking or heuristic problem. Completed work stays in the ready pool forever, and
      every reader inherits it because every reader asks the fold.
    outcome: >
      All 11 corrected through the proper LWW `status:` channel after spot-checking their
      evidence on disk (fixtures present, --layers flags present, nogpgcheck absent,
      rustls-tls in the manifests) — no new completion was declared, only already-recorded
      and already-evidenced ones re-applied. Linux eligible dropped 169 -> 158 and the
      selector immediately began offering genuinely open work.

      scripts/check-fragment-status-loss.sh now fails the gate on any fragment declaring a
      TERMINAL status (completed/done/retired/obsolete/blocked/failed) that the fold does
      not apply. It deliberately ignores the case where the fold is AHEAD of a declaration
      — a packet declared `ready` and later moved on via the LWW channel is correct, not a
      loss. Wired into ./build.sh next to the ledger integrity check, with a negative
      control proving it catches a planted discarded completion.
    verifiable_closure: >
      `scripts/check-fragment-status-loss.sh` exits 0 with `ok:no-fragment-status-loss:N
      checked`, and exits 1 listing the offender when a discarded terminal status is
      planted.
    notes: >
      GENERAL SHAPE, worth carrying: this is the same class as 627-cx24 (a projection that
      dropped `priority`, so a scoring term read a plausible default) and as the
      expression-pinned guards (634-39ik). In all three, the system was WRONG in a
      direction nothing observed. The CRDT was not at fault here — the write path simply
      had no way to say "that did nothing".
    events:
      - ts: "2026-08-09T20:25:00Z"
        event: completed
        summary: >
          Found by being handed two already-finished packets as next work. 11 discarded
          completions corrected via the LWW channel; guard added and wired into the gate.

  - packet_id: fragment-status-write-path-should-refuse-not-noop
    order: 636-9m79
    status: ready
    desired_release: v0.5
    priority: p1
    title: "Make the ledger write path refuse a no-op status re-declaration instead of accepting it"
    kind: enhancement
    deliverable: crates/tillandsias-plan/src/fragments.rs
    depends_on: [fragment-status-transitions-silently-discarded]
    pickup_role: linux
    capability_tags: [plan, crdt, ledger, tooling]
    context: >
      635-i6vm added a DETECTOR. A detector is the second-best answer: it catches the
      mistake after it is committed, and only on a host that runs the gate.

      The better answer is for the write path to make the mistake impossible or loud at the
      moment it happens. A `packets:` entry that re-declares an existing packet_id with a
      status differing from the current fold is, without exception, an attempted transition
      written to the wrong channel. Nothing legitimate has that shape.
    exit_criteria:
      - >
        Decide the enforcement point: `tillandsias-plan check` refuses it, the fold warns
        loudly, or a helper subcommand writes status transitions so the channel is never
        hand-authored. A helper is the strongest — it removes the choice.
      - >
        Whichever is chosen, `append-event`'s sibling limitation is addressed in the same
        pass: it cannot reach fragment-only packets at all (600-c266), which is why agents
        hand-author these fragments in the first place.
      - A negative control proving the refusal fires on the exact shape 635-i6vm found.
    notes: >
      Watch the interaction with compaction: once a fragment folds into the base, a later
      `packets:` re-declaration of the same id is a different situation. The check must not
      start failing on historical fragments after a compaction run.
