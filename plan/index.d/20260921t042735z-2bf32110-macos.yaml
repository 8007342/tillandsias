      THE ARM THAT MAKES IT EVIDENCE IS ARM 2, NOT ARM 1. "SIGKILL the tray, then a
      second start works" is green on any quiet host that never orphaned anything —
      it shows a VM starting twice, which is not the claim. Arm 2 leaves a live VM
