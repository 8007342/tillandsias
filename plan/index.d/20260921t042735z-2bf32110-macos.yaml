      requires that failure text to name the holding pid and to contain
      "DO NOT --reset-guest". Weaken arm 2 and this fixture measures nothing.

      Arm 0 is a source guard that runs on every host, macOS or not: the explainer
      exists, still steers away from --reset-guest, and the start-failure site is
      still wired to it. A helper nothing calls is not a diagnosis.

      The fixture refuses rather than guesses — off-platform, without the bundle,
      without a provisioned image, or with the image ALREADY held, it prints
      unsupported:* and exits 0, naming what was not tested. It kills the guest it
      started and any holder it finds on every exit path.
