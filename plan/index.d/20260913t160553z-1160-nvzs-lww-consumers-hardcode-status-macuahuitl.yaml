    title: |
      Four consumers iterate lww_entries and are correct after 1156-eif4; three more read `doc.get("status").and_then(as_sequence)` directly — carry_forward_gaps, and both scans in closure-evidence-check — so a correction spelled under the canonical `fields:` channel is invisible to each. Two of the three are guards and fail OPEN (an unscanned write is never an offender); the third fails LOUD (it scans for an omission, so an invisible next_action fires a false advisory that trains readers to ignore the guard). The canonical list exists and nothing forces a consumer to use it.
    context: |
      MEASURED (lenovinha, 2026-09-13, from yolanda's question "do other
      consumers hardcode one channel?"): consumers that iterate lww_entries —
      four, all in fragments.rs, all correct after 1156-eif4. Consumers that
      hardcode one spelling in the fragment-channel SHAPE, `doc.get("status")
      .and_then(as_sequence)`, which only makes sense for the LWW channel:
      carry_forward_gaps, and the two scans of "closure-evidence-check" (the
      LWW closure scan and the verifiable_closure reassignment scan), all in
      main.rs. The first site names the hazard on the line above the bug:
      "The LWW channel. `field:` is ANY field, not just status — the key is
      misnamed and plan/index.d/README.md says so." Live exposure: yolanda's
      two fields:-spelled fragments (997-e4v2, 793-zumy) are invisible to
      carry_forward_gaps now, so that guard fires a false "touched with no
      next_action" advisory on 997-e4v2 — recorded in the drill as known and
      temporary. Polarity (yolanda): an invisible input fails OPEN in a
      consumer scanning for offenders and LOUD in one scanning for
      omissions; the loud one is more dangerous per instance, because a
      reader who investigates finds a good next_action in the fragment and
      concludes the ADVISORY is broken.

      WHY 1157-ghmi DID NOT CLOSE THIS: making the coverage assertion read
      LWW_CHANNELS protects the guard in fragments.rs; it does nothing for
      consumers elsewhere, because nothing forces a consumer to use the list
      at all. The class closes scan-side.

      WHAT TO BUILD. (1) The three sites call lww_entries (make it
      pub(crate)). (2) A test in fragments.rs (or a small guard module)
      scans crates/tillandsias-plan/src/*.rs with comment lines stripped,
      assembles its needle at runtime from LWW_CHANNELS and the `.get(`
      shape so it can never match its own quoted history (980-ja2m), and
      refuses any literal LWW-channel read outside fn lww_entries. (3) One
      behavioural arm per consumer with a fields:-spelled fragment.

      NOT IN SCOPE: renaming the channel; changing set-field's spelling.
