      summary: >
        CORRECTION to this packet's own headline figures, measured n=3 clean with nothing else on the host. BOTH original bridge numbers were wrong and both were wrong in my favour's opposite direction. CLEAN BRIDGE n=3: 187.186 / 182.258 / 181.670 s per 20 iterations, mean 183.705s = 9185 ms per no-op check, wall spread 3.0%, CPU 15.07/15.10/14.97% (0.13 percentage-point spread). So the ratio against the ext4 leg (238.2 ms, n=3) is 38.6x, NOT the 45.6x/48.3x this packet was filed with, and the CPU figure is 15.0%, NOT 54.5%. WHY THE ORIGINAL WAS WRONG, and it is not the CPU-contention confound I first disclosed: the original trial used 4.4x more CPU per iteration than the clean runs (6.22s vs 1.41s), which is real compile work, not a scheduling artifact. It ran while this host was repeatedly merging origin/linux-next, so cargo was re-checking genuinely changed crates. IT WAS NEVER A NO-OP MEASUREMENT. The protocol's two warm-up discards warm the CACHE; they do not protect against the tree changing between warm-up and trial, which is exactly what a host merging trunk every few minutes does. Recommended for the measurement protocol (890-nkdz): require the tree to be QUIESCENT for the run's duration, not merely warm — record the commit before and after and discard the trial if it moved. THE CONCLUSION IS UNCHANGED AND BETTER SUPPORTED: the 9P bridge dominates at 38.6x, 85% of wall time is not CPU at all, and WSL2's own virtualization cost is ~1.4x (ext4 238.2ms vs yoga bare-metal 172.4ms) — small only by comparison, not absent. Also withdrawn: an earlier claim that the contaminated trials formed a natural experiment showing wall time insensitive to CPU availability. The clean runs show ~15% CPU with no competing load, so those trials were showing the normal value rather than a response to perturbation. There was no perturbation to interpret; the hypothesis needs a deliberate run.
