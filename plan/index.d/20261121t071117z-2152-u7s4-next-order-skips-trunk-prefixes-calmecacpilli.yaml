    title: "next-order mints above the highest prefix on origin/linux-next, not only above this checkout's fold"
    context: |
      next-order handed out 2149 after 2149-3zy5 had landed (yoga). Cause: the mint reads only the LOCAL fold
      (allocate::highest_prefix), so a checkout that has fetched but not merged trunk mints a prefix trunk already
      carries. With no explicit prefix, next-order now also reads trunk's fragment NAMES with one `git ls-tree`
      (TILLANDSIAS_NEXT_ORDER_TRUNK, default origin/linux-next) and mints above the higher of the two, noting it on
      stderr. Order segments longer than 6 digits are ignored: event fragments are `<ts>-<8-hex>-<host>`, and an
      all-digit hash with a 4-letter host (`-33163463-yoga-silverblue.yaml`) has an order's shape; the first draft
      minted 33163464 from it.
    exit_criteria:
      - "scripts/lua/test-next-order-skips-trunk.lua: a checkout behind trunk (local max 10, trunk 20) mints 21; on the trunk binary it mints 11 (2 of 4 arms red)."
