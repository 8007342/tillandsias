    context: |
      OBSERVED, macuahuitl (LINUX) 2026-08-17T11:3xZ, calling the live tool:

        spec_answer("how does the forge stay isolated ...")
        -> unsupported: the spec RAG index is not built at
           /mnt/c/Users/bullo/claudia/tillandsias/target/spec-index ...
           Build it: tillandsias-plan spec-index --root <repo> --out
           /mnt/c/Users/bullo/...

      A Windows path, on a Linux host, with instructions to create it there.
      The advice is not merely unhelpful, it is impossible, and it points the
      reader at the index when the fault is the location.

      SOURCE, once looked for: FORGE_SPEC_INDEX_DIR was exported into this
      session. The tracked .claude/settings.local.json used to carry that
      /mnt/c value; 2b1f8d188 removed it hours earlier and 789-nc2s added
      scripts/check-tracked-config-host-paths.sh so it cannot come back. Both
      of those are correct and neither helps here, because a fix in a file does
      not reach a process that already read it — this session and its MCP
      server have held the stale value since they started. 552 recorded the
      same thing happening to it; that is twice.

      SECOND DEFECT, and it is the more embarrassing one: the refusal RECITED
      the build as prose — chunk, then embed each chunk via /embeddings into
      vectors.jsonl. Order 552's own closure says the embedding step "existed
      on no host in any language -- only as English prose inside forge-plan.sh's
      refusal string". THIS string. A producer now exists
      (scripts/spec-index-ensure.sh) and the message still described the
      algorithm instead of naming it.
    notes: |
      The NOTE is deliberately conditional on the override being UNREACHABLE
      (its parent directory absent), not merely set. A host that legitimately
      points FORGE_SPEC_INDEX_DIR somewhere real must not be told its
      configuration is stale — a diagnostic that fires on correct setups is the
      class this milestone exists to remove, not add to.

