    title: |
      The capability-row guard tells a host to publish a row with host-capability-probe.sh --fragment, but on the locus where the expired verdict fires that command can exit 2 — so a correct, actionable verdict names a remedy that is unavailable exactly where it is read.
    context: |
      MEASURED ON ESMERALDINHA, 2026-09-13, after 1154-8ywc landed and made the
      Windows path report honestly for the first time:

        Git Bash / windows-host locus
          check-capability-row.sh check
            -> stale:capability-row-expired:esmeraldinha:age=1866506s  rc=1
          host-capability-probe.sh --fragment
            -> rc=2, "no runnable tillandsias binary (build or install one)"

        target/release/tillandsias.exe  absent
        target/debug/tillandsias.exe    absent
        target/debug/tillandsias        present, an ELF, exits 126 there

      The script header documents rc=1 as "actionable (publish a row: absent,
      drifted, or expired — all three are fixed by host-capability-probe.sh
      --fragment)". On that host and locus the named command cannot run.
      Verdict correct, exit code correct, remedy unreachable.

      A GUARD THAT NAMES AN UNAVAILABLE REMEDY TRAINS ITS READER TO IGNORE THE
      VERDICT. Same cost as the false carry-forward advisory in 1158-y3ad from
      the other side: there the guard fired about a packet that was fine, here
      it fires correctly and asks for something impossible. Both teach the
      reader the same thing.

      THIS IS NOT 1130-8zxn RETURNING — esme's distinction and it is the
      load-bearing one. 1130-8zxn was a WRONG verdict that could not be cleared
      by doing the right thing. This is a RIGHT verdict whose remedy is out of
      reach. Same felt experience for the host, opposite causes; conflating them
      would reopen a closed packet instead of filing this one.

      NOR IS IT 1154-6big. Adding the debug path to resolve_probe's candidates
      helps a Linux-native locus; on Windows that candidate is an ELF the probe
      would correctly refuse by running it. THE WINDOWS LOCUS HAS NO BINARY TO
      FIND, not a findable binary being missed.

      WHAT TO BUILD, scope deliberately narrow. The verdict TOKEN does not
      change: consumers parse that grammar and 1154-8ywc left it alone on
      purpose. The guard already knows, on one path, BOTH that the row is
      expired AND that the live fold could not run. When both hold it emits a
      STDERR line naming the constraint, leaving stdout byte-identical. The
      header exit-code paragraph is corrected to say the remedy is available
      only where a probe can run. One diagnostic, no new state, no grammar
      change.

      REJECTED, WITH REASONS, so nobody re-proposes them:

      (a) Publish the windows-host row FROM the in-guest side using the probe's
          locus-assertion flag. The flag exists at line 64, and that is what
          makes it dangerous. The probe measures THE RUNNING MACHINE — it wraps
          the real capability probe around whatever hardware it executes on — so
          this would stamp the DISTRO's hardware with the windows-host label.
          889-ewvt in one line: a missing row routes nothing; a false row routes
          confidently and wrongly, which is strictly worse. The matrix ROUTES on
          that row. The flag is for a probe that IS at a locus and cannot derive
          it, never for asserting a locus you are not at.
      (b) Publish from the distro and watch the Git Bash verdict. That mints a
          third locus for a node that already has two — 1159-g96c's problem —
          and would make the fleet's data worse in order to measure a claim.

      THE REAL FIX IS A FLEET CAPABILITY GAP, NOT THIS ROW: esme has no native
      Windows tillandsias at all, so the windows-host locus cannot publish from
      anywhere. That is a scheduled build for the operator or the coordinator to
      place, and this packet is the honest minimum that should land regardless.

      STILL UNMEASURED AND LABELLED AS SUCH: 1154-8ywc's closure claims the
      remedy now clears the verdict. It is untestable from the locus where the
      verdict fires, because the remedy cannot run there. Not disproved —
      unmeasured, which is a different and more useful thing to record.

      CREDIT: esme measured it, checked the 1128-4ffr precondition independently
      before attempting a publish, declined both unsound workarounds unasked,
      and drew the 1130-8zxn distinction that stopped this being filed as a
      regression.
