      - scripts/test-host-kind-evidence-not-from-checkout-marker.sh
    title: "A stale .forge-startup-context.md in a bare-metal checkout makes check-fleet-membership, agent-identity and check-capability-row call the host a forge"
    context: |
      Measured on yoga 2026-10-27 (bare-metal Silverblue, /run/ostree-booted
      present, no /run/.containerenv): scripts/check-fleet-membership.sh printed
      session-name yoga-tillandsias-forge with regime forge, and
      `scripts/agent-identity.sh id claude` answered forge-yoga-claude-…, so a
      ledger write would have carried a forge identity. Cause: a gitignored
      .forge-startup-context.md dated 2026-10-17 left in the checkout by a forge
      that bind-mounted it. All three scripts treat that file's presence as forge
      evidence. 1467-c8qg already fixed the same hole in the command policy
      (forge evidence = /run/.containerenv naming the forge image), pinned by
      scripts/test-host-kind-evidence-not-from-workspace.sh; these three
      scripts were not moved to that rule. Workaround used:
      TILLANDSIAS_FORGE_CONTEXT=/nonexistent for agent-identity.
      Independently schedulable (arrival routing): the open rows owning these
      three scripts are about a forge's session name from the container
      hostname, experts-down during first build, per-harness git identity,
      claim-host agreement, and capability-row freshness. None is about
      workspace-marker evidence on bare metal. The fix lives in a new shared
      helper (scripts/host-kind-evidence.sh) that the three scripts source, so
      it touches each of them in one place only.
    exit_criteria:
      - "A fixture plants .forge-startup-context.md in a checkout on a host with no forge /run/.containerenv and asserts check-fleet-membership.sh reports a non-forge regime, agent-identity.sh id claude does not begin forge-, and check-capability-row.sh does not take its forge branch. Pre-fix result: FAILS, all three answer forge."
    verifiable_closure: "A fixture planting .forge-startup-context.md on a non-forge host asserts none of the three scripts answers forge. Pre-fix result: FAILS, all three answer forge on yoga 2026-10-27."
    unscoreable: |
      unpinnable-until-the-guard-exists: the fix adds the fixture named in the exit criterion in the same commit (1136-n8sh).
    next_action: >
      Nothing is done. Reuse the 1467-c8qg forge-evidence rule rather than inventing a second one; write the fixture first.
    provenance: |
      Coordinator macuahuitl-fedora asked for it to be filed 2026-10-27.
