    title: "OPERATOR DECISION — is the FastFlowLM Proprietary Binary License v2.0 acceptable for NPU LLM, whisper and embedding workloads in fleet containers, or does the fleet stay on open stacks only"
    context: |
      FastFlowLM (via Lemonade 10+) is the only shipped Linux NPU stack found
      on 2026-10-27; it lists Krackan and needs kernel 7.0 or later. Its code
      and CLI are MIT but the NPU kernels are fetched separately under the
      FastFlowLM Proprietary Binary License v2.0
      (github.com/FastFlowLM/FastFlowLM LICENSE_BINARY.txt). As summarised by
      research and NOT yet read in full by an agent, the licence allows free use
      including commercial and unmodified redistribution, with attribution asked.
      The packaged installer `flm-fetch-kernels` asks for acceptance at an
      interactive prompt and needs root, so it cannot be used as shipped. An
      agent never accepts this licence (operator ruling 2026-10-27). The open
      alternative is 1904-2fze then 1904-pehj.
    exit_criteria:
      - "An event on this row records the operator's decision (accept, reject, or defer) with the reasoning, and the decision note names which NPU workload rows it unblocks or closes. Pre-fix result: FAILS, no decision recorded."
    unscoreable: "operator-gated decision: closes on the operator's recorded ruling, not on a fixture"
    next_action: >
      Put the licence text and this row in front of the operator as one plain ask; do not fetch the kernels.
    provenance: |
      Operator direction 2026-10-27 on yoga: "I won't accept any license without discussing".
    events:
      - type: filed
        ts: "2026-10-27T07:53:20Z"
        host: yoga
        summary: "filed ready as an operator decision from the 2026-10-27 NPU research"

