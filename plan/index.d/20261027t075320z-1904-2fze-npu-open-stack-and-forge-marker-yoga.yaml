    title: "A rootless podman image built only from open sources (XRT, xdna-driver userspace) runs xrt-smi validate against /dev/accel/accel0 on an XDNA2 host, with nothing installed on the host"
    context: |
      Measured on yoga 2026-10-27 (Krackan, PCI 1022:17F0, kernel
      7.2.12-200.fc44): the in-tree amdxdna module is loaded, dmesg shows
      "Initialized amdxdna_accel_driver 0.10.0" loading amdnpu/17f0_10/npu_7.sbin,
      /dev/accel/accel0 exists, ulimit -l is unlimited. Fedora 44 has no xrt
      package (dnf search in a fresh fedora-toolbox:44 returned nothing).
      accel_probe.rs `fn derive_npu_usability` already reports the NPU with
      usable=false; this row produces the evidence that would let it say true.
      Container shape from the FastFlowLM portable bundle and ZimaOS notes:
      --device /dev/accel/accel0 --ulimit memlock=-1:-1, SELinux label to be
      measured (the node is device_t). Build XRT and the xdna-driver shim from
      their Apache-2.0 sources in the image; firmware comes from the host
      kernel, nothing is layered. Open question to measure: the PCI revision
      reads 0x20 while the driver loads the 17f0_10 firmware.
    exit_criteria:
      - "scripts/probe-npu-container.sh on an XDNA2 Linux host prints ok:npu-container:xrt-smi-validate:<device-name> after building the image and running xrt-smi validate in rootless podman, and on a host without /dev/accel/accel0 prints skip:npu-container:no-accel-device with rc 0. Pre-fix result: FAILS, the script and image do not exist."
      - "The image build installs nothing whose licence is not OSI-approved; the script prints the licence of each built component. Pre-fix result: FAILS, no image exists."
    verifiable_closure: "scripts/probe-npu-container.sh prints ok:npu-container:xrt-smi-validate on yoga and skip:npu-container:no-accel-device on a host without the node. Pre-fix result: FAILS, the script does not exist."
    unscoreable: |
