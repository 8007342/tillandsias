      summary: |-
        WHAT THE CLEAN STATE LOOKS LIKE, so a later reader can tell "working" from
        "nothing to report". Requested by the coordinator, who noted this is the
        only piece of tonight's claim work with a single reader.

        The `claim-without-status` row type reports ready packets carrying a recent
        claim event — a claim that separated nobody, because only
        `status: in_progress` is read by the fold. A claim is now answered by a
        TYPE (release/released/completed/verified/implemented), never by prose.

        THE HEALTHY OUTPUT IS EMPTY, AND AN EMPTY REPORT IS AMBIGUOUS BY
        CONSTRUCTION: it looks identical whether the category is clear or the check
        silently stopped running. Two things distinguish them:

          - the check emits its scanned count, not just its violations. A zero over
            a zero-row scan is a broken check; a zero over a full scan is the
            outcome.
          - when yolanda writes their typed release, the last standing row clears
            ITSELF. Nobody acts, the row disappears, and the category goes quiet.
            That is success and it is indistinguishable from the check dying unless
            you read the count.

        So: verify the count, not the emptiness. If a future coordinator sees this
        category reporting nothing, the question to ask is "over how many rows?"
