      summary: |-
        S1 implemented by macbookair-macos on the coordinator-approved plan. Unit-level READY; the live arm comes from the RC smoke or the next VM run.
        MEASURED BEFORE CODE (tray.log, 2026-09-28..30): 10 quits, 0 clean. 8 force-stopped. On every timestamped quit, VmShutdownRequest got no reply for 10.0 s, then requestStop -> force-stop took 65.1-66.8 s (about 75 s per quit). 2 trays were killed mid-drain. ROOT CAUSE: the guest's VmShutdownRequest arm set Draining and closed the connection. It neither replied nor started the OS shutdown whose SIGTERM drains headless.
        FIX: (1) the guest answers IssueAck { seq_acked }, an existing variant with no wire bump, then starts the guarded poweroff. (2) guest_poweroff::request_poweroff has three fences: under cfg(test) it is a recorder; the real action compiles only on Linux; and at runtime it refuses unless TILLANDSIAS_GUEST_POWEROFF=1, which is set ONLY in the VZ guest unit (vz.rs, pinned by a unit-text assertion). (3) VzRuntime::stop treats an already-Stopped VM, or a requestStop failure on a VM that is now Stopped, as a clean stop. The tray's request_vm_shutdown already took any non-Error reply as OK, so the ack ends the 10 s wait.
        TEST-FIRST (darwin): vm_shutdown_request_is_acked_and_starts_the_guest_poweroff was red pre-fix ('got Err("no frame within 2s")') and is green post-fix (ack, phase Draining, exactly one poweroff call). The fence test covers non-Linux, no opt-in, and opt-in values other than "1". vsock_server 40/40, vm-layer 135/135, fmt clean, strict clippy 0 with and without listen-vsock (with #224's TWO_ROUTERS gate applied temporarily).
        Existing provisioned VMs: the unit is written by cloud-init on first boot, so a VM provisioned before this change has no opt-in, refuses, and falls back to today's path until it is reprovisioned. The smoke's fresh install is the live arm. S2 (the ACPI/requestStop path) waits on the smoke's console.log capture. S3 is filed as 1560-73zh.
