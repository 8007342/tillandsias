    order: 1560-73zh
    title: A guest-side watchdog powers the VM off cleanly when the tray's heartbeat stops (a tray killed mid-drain leaves no one to stop the guest)
    status: ready
    kind: defect
    priority: p2
    desired_release: v0.5
    pickup_role: macos
    capability_tags: [guest, shutdown, filesystem-safety, macos, vm-layer]
    estimated_hours: 4
    owned_files:
      - crates/tillandsias-headless/src/guest_poweroff.rs
      - crates/tillandsias-headless/src/vsock_server.rs
    context: >
      Stage S3 of the coordinator-approved 1430-rnpd plan, filed only. The mxc
      note on 1430-rnpd (relayed by the coordinator, 2026-10-08) suggests a
      guest-side shutdown watchdog keyed to the tray heartbeat. Evidence for
      the gap, from ~/Library/Logs/Tillandsias/tray.log on tlatoanis-macbook-air
      (2026-09-28..30): 10 tray quits. 8 were force-stopped after the 60 s
      drain. In 2 the tray itself was killed mid-drain: the next line is a new
      launch, or the log ends, with no drain outcome. S1 (the guest acks
      VmShutdownRequest and powers itself off) covers a quit that reaches the
      guest. It cannot cover a tray that dies first, because then nobody asks.
      The image root already holds heartbeat.state.
    depends_on: [every-tray-quit-ends-in-a-force-stop-because-the-guest-never-shuts-itself-down-cleanly]
    exit_criteria:
      - When the host heartbeat is silent past a stated threshold, the guest drains and powers off through the same guarded action as 1430-rnpd S1, and logs why.
      - A heartbeat that resumes before the threshold cancels it, and a live tray never triggers it.
    unscoreable: |
      unpinnable-until-the-guard-exists. Future test: a headless watchdog test
      with an injected clock and heartbeat source, and the poweroff recorder.
      Silence past the threshold must call poweroff exactly once, and a resumed
      heartbeat must call it zero times. PRE-FIX: no watchdog exists, so a
      killed tray leaves the guest running until the next launch force-stops it.
    next_action: Not before 1430-rnpd S1 lands; the coordinator schedules it.

