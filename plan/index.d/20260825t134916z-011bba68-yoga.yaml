      summary: >
        CLOSED via the packet's SECOND branch, and the packet's own warning is why the first branch was not built.  I filed this yesterday offering two routes: (a) a check that a cited span still relates to its claim, or (b) convert the convention to symbols. Having measured the corpus, (a) is unbuildable as stated and its cheap approximation is actively harmful. 1,282 line citations exist across 487 plan/issues documents, into files the size of main.rs (>22,000 lines). A checker that verifies "the cited file has at least that many lines" would have PASSED ALL SIX of the drifted citations that motivated this packet — every number was in range, every one pointed at unrelated code. Relating a span to the prose claim it supports needs semantics no shell script has. Building the cheap version would have produced a green gate over a corpus of wrong citations, which is strictly worse than the current honest absence.  WHAT LANDED: scripts/check-issue-citation-convention.sh, a CONVENTION RATCHET. New citations must name a SYMBOL (`main.rs` `build_git_run_args`) rather than a line. A symbol survives every edit that does not rename it, and a rename is a real event worth noticing; a line number dies to any insertion above it. Same conclusion order 797-8dzt reached for test source slices, applied to prose.  DIFF-SCOPED, and that is load-bearing rather than convenient. With 1,282 pre-existing citations, a fleet-wide refusal flips every host red at once and gets disabled the same day — the 699-dycj lesson, which this repo learned the expensive way. Only NEWLY ADDED lines are judged, against a base ref, the same shape as check-added-fragments-parse.sh. Existing citations burn down as documents are revised, which is precisely when someone is in a position to re-verify them rather than mechanically rewrite them.  THE ESCAPE HATCH IS NARROW AND REASONED. A line ending `<!-- cite-ok: <reason> -->` is permitted, because a line number is sometimes the point: quoting a citation that has DRIFTED, as evidence, is exactly how order 245 recorded this finding. A ratchet with no way to do that would forbid describing its own motivating defect. The reason is mandatory — an unexplained opt-out is how a ratchet becomes decoration.  SCOPE DECISION, recorded: prose-to-prose citations (`plan/issues/other.md:42`) are NOT judged. The rot this exists for is prose citing CODE, which moves under it; another document's line numbers are a different and much slower problem, and widening the gate to cover them would multiply the false-positive surface for no measured defect.  PINNED by litmus:issue-citation-convention, 6/6, bound to spec meta-orchestration: grammar; NEGATIVE control (a new line citation refused); POSITIVE control (the same claim by symbol accepted — without which the refusal could be satisfied by a gate that refuses every added line); the escape hatch honored; markdown citations left alone; and the DIFF-SCOPED property proven directly (a pre-existing citation on the base does not fail). meta-orchestration instant suite green.  WIRED into ./build.sh --check as its own phase and HAND-FALSIFIED THROUGH THE WIRING, not just the script: dropping one untracked document containing `main.rs:1136-1145` into plan/issues/ turns the gate red with the remedy printed and the offending citation named; removing it returns green. An orphaned guard is the 865-n8vq shape and the audit-guard-activation auditor greps for invocation, so wiring was checked by exercise rather than by grep.  WHAT THIS DOES NOT DO, said plainly: it does not repair the 1,282 existing citations, and it cannot tell whether any given one is still correct. It stops the corpus growing worse. The 80 remaining in order 245's document, and the rest, still need a human or an agent re-verifying claims as those documents are revised — and NA-05's exit criterion still literally demands "specific file:line references", which is the wording that generated this rot and should be changed to file:symbol by whoev