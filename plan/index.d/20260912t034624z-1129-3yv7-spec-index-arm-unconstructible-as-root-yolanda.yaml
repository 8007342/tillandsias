      - "the test exits 0 as a non-root user with those two arms RUN and PASSED; post-fix measured: ok:test-spec-index-durable-tier-demotion:7-passed as nobody"
      - "a Windows host can pass ./build.sh --check and land; pre-fix result: FAILS (no Windows host could land anything)"
      - "NEGATIVE CONTROL: the skip is scoped to euid 0 only — a non-root host that regressed to skipping would print the skipped token, which differs from the original; pre-fix result: N/A, post-fix pinned by the two measurements above"
