    title: |
      a .step numeric prefix is chosen by reading the directory and picking the next gap, so two hosts that add a step in the same window pick the SAME number, git merges both files silently, and the collision only surfaces as a refused land on whoever gates second
    context: |
      MEASURED TWICE ON ONE EVENING on linux-next.

        * 215 — lenovinha added 215-1139-ipqt.step; macuahuitl added
          215-890-27mv.step while lenovinha's gate was running. Attempt 1 gated
          GREEN and lost only the push race; attempt 2 integrated macuahuitl's
          commit and 1072-b7eq refused:
            FAIL: two .step files share a numeric prefix, so their order is
                  decided by the rest of the filename and no gap remains
                  between them: 215
          Renumbered to 225. Cost: one full gate attempt (~8 min) plus a
          diagnosis.
        * 205 — the same window, one step earlier in the sequence.

      WHY IT HAPPENS. Each author lists scripts/gate-steps.d/, sees the highest
      prefix, and picks the next gap. That is a READ-THEN-WRITE with no
      reservation between the two, so two hosts reading the same directory state
      choose the same number. There is no shared allocator.

      1072-b7eq MADE THIS CLASS OF FAILURE SILENT ON PURPOSE, and correctly:
      moving steps from inline build.sh blocks to one file each made file-level
      conflicts IMPOSSIBLE, so two hosts adding steps touch two different files
      and git merges them without complaint. The guard exists precisely because
      what used to be a loud conflict became an ordering decision neither author
      made. It works — it caught both instances. This row is not about the guard
      failing; it is about the guard being the ONLY thing standing between the
      fleet and a silent mis-ordering, and being positioned at the most
      expensive possible moment: after a full gate, on the host that gated
      second, for a collision it did not cause.

      THE PROJECT ALREADY SOLVED THIS EXACT PROBLEM ONE DIRECTORY OVER.
      `tillandsias-plan next-order` mints a COLLISION-FREE order token, and its
      help text says so in as many words. Order numbers and step prefixes have
      the same shape, the same concurrency, and the same failure; only one of
      them has an allocator.

      COST GROWS WITH THE FLEET. Two hosts collide rarely; four hosts draining
      on overlapping cadences collide often, and every collision costs a full
      gate attempt on an innocent host. Tonight it happened twice in one evening.
    deliverable: |
      A collision-free prefix mint, in the shape next-order already has.

        * `tillandsias-plan next-step-prefix` (name to be decided by the
          claimer) that reads scripts/gate-steps.d/ AND the uncommitted/unmerged
          state the way next-order does for orders, and returns a prefix no
          other host will return in the same window.
        * DECIDE AND RECORD what "the same window" means here. next-order's
          collision-freedom comes from its token shape, not from locking; a
          prefix must stay numerically ORDERED, so the same trick may not
          transfer. If a purely local mint cannot be made collision-free for an
          ordered key, say so on the row and choose the honest second-best —
          e.g. widening the spacing so a collision is improbable, or having the
          guard suggest the next free prefix in its refusal so the fix is one
          rename rather than a re-diagnosis.
        * KEEP 1072-b7eq's GUARD EITHER WAY. A mint reduces collisions; the
          guard is what makes a collision loud. Removing it because minting
          exists would restore the silent failure.
        * The litmus named in `unscoreable` above.

      EXPLICITLY NOT PROPOSED: returning to inline steps in build.sh. That would
      trade a rare ordering collision for the guaranteed merge conflicts
      1072-b7eq removed, on a file every host touches.
    next_action: >
      Start by deciding whether an ORDERED key can be minted collision-free
      locally at all — that answer decides whether this row delivers an
      allocator or a cheaper refusal, and it is the question the whole packet
      turns on. Read next-order's implementation first; if its collision-freedom
      relies on the token being unordered, say so on the row before writing
