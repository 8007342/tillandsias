packets:
  - packet_id: release-gates-moved-to-local-hardware
    order: 599-w5jd
    status: completed
    desired_release: v0.5
    role: ci
    tags: [ci, cloud-minutes, hooks, enforcement, git-mirror]
    title: >
      Move the cloud-independent release gates to local hardware and ENFORCE
      them, at the pre-push hook and at the git mirror.
    problem: >
      Operator directive 2026-08-03: "we do want those validations, we just
      don't want them in paid expensive cloud minutes, when we can run them in
      our local hardware for just the very low price of electricity."

      Two gates in .github/workflows/release.yml needed no runner:
      "Verify version monotonicity" (pure git + VERSION arithmetic) and "Assert
      retired setup/secrets flags are gone from the CLI" (runs --help on a built
      binary we already build locally). Worse than the cost: both fired AFTER
      the cloud build, so a failure spent the minutes and then reported the
      release was never valid.

      The deeper problem was enforcement, not location. scripts/install-hooks.sh
      has shipped for months and .git/hooks/ was EMPTY on this checkout — every
      hook the repo ships was inert. Shipping a gate uninstalled is
      indistinguishable from not having one.
    resolution: >
      scripts/release-preflight.sh — the four gates that run locally: version
      monotonicity, retired CLI flags, plan ledger integrity, and the actions
      budget. Falsifiable one-line verdict (ok:release-preflight | blocked:<reason>).

      scripts/gate-stamp.sh — ./build.sh --check now stamps the tree it
      validated (HEAD + full working diff + untracked), and the pre-push hook
      verifies the stamp. Running the whole gate inside the hook would be more
      direct but fails in practice: a multi-minute hook gets --no-verify'd on its
      second use and then enforces nothing. Hashing the diff costs milliseconds
      for the same guarantee, and is content-based, so reverting an edit restores
      freshness rather than requiring a re-run.

      scripts/hooks/pre-push-local-gate.sh + install-hooks.sh v2 — the pre-push
      hook is now GENERATED as one fail-fast composition. The v1 scheme appended
      `bash <script>` lines, and because each runs in a subshell, a guard exiting
      1 did NOT stop the hook: the hook's status was whatever the LAST guard
      returned, so a failing VERSION guard was masked by a passing one. That bug
      was latent and is now impossible.

      build.sh installs the hooks on every invocation. This is the piece that
      makes it not prompt-dependent.

      images/git/pre-receive-hook.sh — a CI workflow budget gate at the MIRROR,
      config-driven via TILLANDSIAS_CI_WORKFLOW_ALLOWLIST (default release.yml,
      set by images/git/entrypoint.sh). Rejecting here is uniquely effective: the
      mirror relays upstream only after accepting locally, so a workflow stopped
      at this point never reaches GitHub and can never trigger a paid run. A
      local hook can be --no-verify'd; this cannot. Convention-neutral by
      construction — absent or empty config means no gate, so an end-user project
      running its own CI is unaffected.
    evidence: >
      litmus:release-gates-run-locally — 11 steps, all green. Includes the
      negative controls that matter: the preflight must REFUSE a reintroduced
      workflow, and the stamp must detect a changed tree (executed against a
      throwaway repo, not grepped).

      scripts/test-pre-receive-yaml-gate.sh — 4 new cases, all green alongside
      the 11 pre-existing ones: allowed workflow accepted, unsanctioned workflow
      rejected, DELETING an unsanctioned workflow accepted, and the gate silent
      without config.

      Verified by hand end to end: no stamp -> pre-push refuses; ./build.sh
      --check -> stamp written; pre-push passes; edit a file -> refuses as stale;
      revert -> passes again.
    bugs_found_while_building_it:
      - >
        A deletion appears in `git diff --name-only`, so the first version of the
        mirror gate rejected the removal of a workflow — the gate blocked its own
        remedy, leaving bypass as the only way to comply. Fixed by gating only
        paths that still exist in the new tree (`git cat-file -e`), and pinned by
        test 7c.
      - >
        A shell `case` glob matches `/`, so `.github/workflows/*.yml` also caught
        `.github/workflows/nested/x.yml`. GitHub only executes top-level workflow
        files, so that was a false positive against legitimate content. Scoped to
        top-level explicitly.
      - >
        litmus:release-gates-run-locally failed on its first run because the
        relocation comment in release.yml names the steps it removed, and the
        check grepped for a mention rather than a step definition. FOURTH
        occurrence of a guard matching its own prose in this repo. Fixed by
        stripping comment lines and asserting on `- name:`, plus a negative
        control proving the detector still fires on a real step.

  - packet_id: hooks-shipped-but-never-installed-audit
    order: 599-4wzr
    status: ready
    desired_release: v0.5
    role: methodology
    pickup_role: any
    tags: [hooks, enforcement, cross-platform, audit]
    title: >
      Audit every other guard this repo ships but may never have activated.
    problem: >
      .git/hooks/ was EMPTY on the primary development host while
      scripts/install-hooks.sh, scripts/install-readme-pre-push-hook.sh,
      scripts/hooks/pre-commit-openspec.sh, pre-push-version-guard.sh,
      post-commit-expert-refresh.sh and post-commit-dashboard-refresh.sh all
      existed and were all inert. Nobody noticed because an uninstalled hook
      fails silently and looks exactly like a passing one.

      599-w5jd fixed the mechanism (build.sh installs hooks now) but did not
      establish how many OTHER shipped guards are in the same state. The class is
      "a control that exists in the repo but is not active anywhere it matters" —
      the same shape as the tray-parity rows marked done that were not, and the
      litmus that passed on linux-next while main was still scheduling cron.
    exit_criteria:
      - >
        Enumerate every guard, hook, and validator the repo ships, and for each
        record: where it must be active, how activation is verified, and whether
        it IS active on Linux, Windows, and macOS. Absence of evidence counts as
        not-active.
      - >
        Anything whose activation cannot be checked by an executable test gets
        one, or gets deleted. A guard nobody can prove is running is not a guard.
      - >
        The Windows and macOS cycles report their .git/hooks/ state — hook
        installation is per-checkout, so this host being fixed says nothing about
        theirs.
    depends_on: [release-gates-moved-to-local-hardware]

