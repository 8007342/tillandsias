  context: 'First of the revision-5 rows. A fake Queues and KV REST server that models the documented behaviour: an empty pull costs a read, a late ack is accepted, a lost ack response, an Expired message, a poison message. It counts every request type and queue operation against the budgets in the design, section 6. Row a of 2011-amqd revision 5; build only, no deploy, no cloud resource unless the row says so.'
  exit_criteria:
  - 'An idle day for 30 queues and a busy hour report counts per request type and per operation, and fail above the stated budgets.'
  - 'A crash-loop host is held by its persisted per-host budget in operations and requests.'
  verifiable_closure: 'Fixture or measurement recorded in the row.'
