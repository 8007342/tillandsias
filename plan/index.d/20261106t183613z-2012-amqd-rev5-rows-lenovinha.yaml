  title: 'The pull handler acks every final outcome, quarantines invalid messages, and keeps a dedupe window of a day'
  context: 'Ack on Accepted (after the fsync into the 1506 inbox), Duplicate, Expired, and invalid (quarantined); leave un-acked only on an inbox I/O error. Keep seen until the later of the envelope expiry and arrival + 24 h; reject a sent_at more than 5 min in the future. See the design, sections 4a and 4b. Row e of 2011-amqd revision 5; build only, no deploy, no cloud resource unless the row says so.'
  exit_criteria:
  - 'A host killed between the inbox write and the ack yields one copy after redelivery.'
  - 'An Expired or poison message is acked once and not pulled again.'
