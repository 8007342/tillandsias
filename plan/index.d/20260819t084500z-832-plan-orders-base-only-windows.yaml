      - "crates/tillandsias-policy/src/main.rs:4946 hardcodes plan/index.yaml; no reference to plan/index.d/ exists anywhere in the crate"
      - "plan-orders 1013 -> 1126 across cycle 7's compaction while check went 1128 -> 1133; the 113 delta is fragment-defined packets entering the base"
      - "2026-08-18/19: windows filed 828-k3mq/829-p7wq and linux filed 828-h7kw/829-dkuc independently, both hosts' gates green"
    next_action: >
      Give plan-orders the same folded view `tillandsias-plan check` already
