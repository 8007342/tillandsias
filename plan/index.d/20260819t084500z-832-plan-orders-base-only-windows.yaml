packets:
  - packet_id: order-uniqueness-gate-reads-the-base-not-the-folded-ledger
    order: 832-q4mn
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "the order-uniqueness gate wired into ./build.sh --check reads plan/index.yaml alone, so a duplicate order token introduced in plan/index.d/ is invisible until a compaction folds it — which can be days later and on another host"
    deliverable: "plan-orders checks the FOLDED ledger (base ⊕ plan/index.d/), so a colliding order is refused by the gate that runs on every push rather than surfacing whenever someone next compacts"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [rust, plan, gates, fail-loud, multi-host]
    estimated_hours: 2
    context: |
      MEASURED AND THEN READ, yolanda 2026-08-19.

      THE SOURCE. crates/tillandsias-policy/src/main.rs:4946:

        let mut index_path = PathBuf::from("plan/index.yaml");

      with an optional `--index <path>` override and no fragment handling
      anywhere in the verb. `plan_orders_check` walks that one document. Nothing
      in tillandsias-policy reads plan/index.d/ at all.

      THE COUNTS THAT PROMPTED IT, from cycle 7's compaction:
        before compaction:  plan-orders 1013 open   |  check 1128 total
        after  compaction:  plan-orders 1126 open   |  check 1133 total
      `check` grew by 5 (the five packets genuinely added that session). The
      113-packet jump in plan-orders is the fragment-defined packets becoming
      visible to it for the first time, by being written into the base.

      WHY IT MATTERS ON THIS FLEET SPECIFICALLY. Every host files new packets as
      FRAGMENTS — that is the whole point of the append-only index.d design
      (582-nqw5: a shared monolith conflicts between concurrent writers). So new
      orders, which are exactly where collisions happen, are precisely the ones
      the gate cannot see. The gate runs on every push and passes; the collision
      waits for a compaction that may be days away and is usually run by a
      different host than the one that introduced it.

      NEAR MISS THE SAME NIGHT, and it is why this is filed rather than shrugged
      at: windows filed 828-k3mq and 829-p7wq; linux independently filed
      828-h7kw and 829-dkuc within about an hour. Both hosts' gates were green
      throughout. The suffixes differ so these are DISTINCT tokens and nothing
      actually collided — but the numeric prefixes were chosen independently
      because each host read `next-order` against a ledger the other's fragments
      had not reached yet, and no gate on either side could have said so.

      NOT A DUPLICATE OF 275 / plan-index-order-uniqueness. That order
      established the invariant and the check. This packet is about the check's
      INPUT: it validates a document that, by design, is no longer where new
      packets live first.

      SCOPE NOTE: `tillandsias-plan check` DOES fold (it reported 1128/1133
      across the same boundary), so the ledger's structural integrity is
      validated over the folded view. It is specifically the ORDER-TOKEN
      uniqueness pass that is not.
    verifiable_closure: "a fixture that writes a fragment into plan/index.d/ carrying an order token already present in plan/index.yaml and asserts `tillandsias-policy plan-orders` exits non-zero naming both — red today, since the fragment is not read; plus a negative control proving a non-colliding fragment still passes"
    evidence:
