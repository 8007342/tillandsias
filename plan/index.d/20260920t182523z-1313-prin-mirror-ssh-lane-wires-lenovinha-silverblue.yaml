      work/<order> branch; (c) a push to at least one other side branch (a
      salvage/ ref, or osx-next/windows-next levelled from trunk).

      EACH VERIFIED, not inferred: `git ls-remote origin <ref>` showing the
      pushed SHA; the keyring daemon PID unchanged across the push; and NO
      credential-helper invocation in the push's GIT_TRACE — the host currently
      carries credential.https://github.com.helper=!gh auth git-credential, so
      "credential-free" means that helper demonstrably did not fire, not that no
      prompt appeared.

      ONE OF THE THREE FALLING BACK TO THE KEYRING PATH IS A REFUSAL OF THE
      EXPERIMENT, NOT A PARTIAL PASS. The relay and hooks fail hard with no
      direct-push fallback, as 1309-qc95 established.
    title: |
      the ssh push lane is wired END TO END — the mirror receives the flag and its own id, authenticates to the signer with a per-mirror identity, starts sshd, and a host push reaches GitHub through the mirror with no credential on the host side
    context: |
      FILED LATE AND THAT IS THE FIRST THING TO RECORD. This work was done under
      the name "1310-5e6g", an order minted by next-order on 2026-09-20 and then
      NEVER WRITTEN AS A FRAGMENT. It was cited in messages, in commit subjects,
      and in ten @trace/comment sites in code, and it resolved to nothing —
      `tillandsias-plan status 1310-5e6g` answers "no packet matches". Caught
      by macuahuitl-fedora checking the salvage ref, not by me. A fragment
      cannot claim an order the fold never allocated, so this row carries a
      FRESH order and the code is re-cited to it. Third reference-that-looks-
      sourced-and-is-not from this host today, after the "four Git Bash litmus
      arms" that were never filed and a bare "1310" that does not resolve.

      THE DEFECT CHAIN, three asymmetries each hiding the next, all measured on
      lenovinha 2026-09-20 while dogfooding 749-54pv's dark lane as 1288-5qpn's
      first authenticated client:

      LINK 1 (fixed, on the salvage ref) — TILLANDSIAS_MIRROR_SSHD never reached
      the mirror. The flag launched the sidecar half and wired the forge
      gitconfig; the mirror's entrypoint gates sshd on that same variable and was
      never given it. Wired at the launch site from mirror_ssh_push_lane_enabled(),
      the SAME predicate the sidecar calls, so the halves cannot disagree. NOT in
      container_profile.rs: that module declares the mirror's env and nothing
      consumes it — every .env_vars reference outside it is in its own tests.

      LINK 2 (fixed, on the salvage ref) — TILLANDSIAS_MIRROR_ID never reached
      the mirror either, while the SIDECAR had it. sshd-identity.sh died at
      require_mid. Wiring link 1 alone would have shipped a lane that stops one
      step later, which is why the unit test pins both.

      LINK 3 (provisioning half done, consumption half NOT) — the mirror's token
      is refused by the signer: POST ssh-host-signer/sign/host-<mid> answers
      http=403 permission denied. Diagnosed by READS only: auth/token/lookup-self
      from inside the mirror returns policies ["default","git-mirror-policy"],
      and grep shows mirror_host_signer_policy_name has ONE operative reference —
      the mint. The policy is MINTED AND BOUND TO NOTHING; the lane side has both
      halves, the host side had the mint only. Fixed by provision_host_signer_approle,
      a per-mirror AGENT role named identically to its policy and bound to exactly
      it. THE THREE-LINE FIX WAS REFUSED: attaching a per-mirror policy to the
      GLOBAL git-mirror-agent role grants project A's mirror authority to sign
      project B's host certificates — the authority D12 withdrew — past
      reject_sign_wildcard, which inspects policy BODIES and would find no
      wildcard. A guard watching the wrong door.

      WHAT REMAINS is the consumption half: mint the signer role's AppRole
      material bound to the MIRROR container, run a SECOND Vault Agent writing its
      own sink, and point sshd-identity.sh at it via TILLANDSIAS_VAULT_TOKEN_FILE,
      so one token never carries both authorities. The seam already exists —
      vault-agent-bootstrap.sh takes VAULT_APPROLE_DOCUMENT, VAULT_AGENT_CONFIG,
      VAULT_ROLE_ID_FILE and VAULT_SECRET_ID_FILE from the environment, so a
      second identity needs a second .hcl and no change to that script.
