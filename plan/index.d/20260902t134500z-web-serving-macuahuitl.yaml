      type: note
      ts: "2026-09-02T13:45:00Z"
      host: macuahuitl
      summary: >
        LANE-LISTENER LAUNCHER DEFECT found and FIXED (19057a9e3),
        reported by the tillandsias.org forge agent's own mountinfo
        forensics: the live launcher mounted the lane mcp.sock dir and
        set TILLANDSIAS_CONTROL_SOCKET but never called
        start_mcp_socket_server_for_lane — the legacy tray path does,
        and the tray-boot enumeration covers only projects existing at
        startup, so every post-boot project's forge got CONNECTION_CLOSED
        on the host-browser bridge forever. Third instance of the
        dual-source-of-truth launcher class this week (pids 959-fpc5,
        hook delivery, now this). Delivery note: existing lanes on a
        running tray need ONE tray relaunch to bind (enumeration then
        covers them); the tillandsias.org lane relaunch is deferred to
        an operator/agent-chosen moment since forge containers are
        stack-managed and die with the tray. INTERIM: the coordinator
        replicated publish_local host-side — sibling
        tillandsias-tillandsias.org-web up on the enclave network, route
        registered, Caddy reloaded, site LIVE at
        http://www.tillandsias.org.localhost:8080/var/html/index.html
        (200 verified) — and stands proxy for start/stop/status until
        the socket lands. Content loop documented for the agent:
        commit -> mirror push -> host-worktree pull -> live (ro mount).

packets:
  - packet_id: web-catalog-docroot-convention
    order: 962-wdrc
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    depends_on: []
    capability_tags: [web, catalog, forge]
    title: >
      The WEB catalog service serves the project ROOT — a site keeping its
      pages in var/html/ (the tillandsias.org convention) 404s at the root
      URL; serve a conventional docroot subdir when present.
    context: |
      Order 353's own ledger note predicted this rung ('a
      docroot-convention rung is needed first') and the first real
      consumer hit it today: tillandsias.org keeps content in var/html/
      (its openspec release contract zips exactly that dir), so
      publish_local's URL serves 404 at / and the real page lives at
      /var/html/index.html. Fix shape, honoring the frozen web-image spec
      (busybox, /var/www, :8080 — do NOT extend the image): the LAUNCHER
      picks the mount source — if <worktree>/var/html/ (or a
      catalog-declared docroot) exists, bind THAT to /var/www:ro instead
      of the worktree root. One conditional in publish_local_service;
      image untouched; spec:enclave-service-catalog gains the docroot
      convention sentence. HTTPS adjudication note filed here for
      discoverability: the 2026-07-24 operator directive
      (plan/issues/local-https-apache-enclave-ca-serving-2026-07-24.md)
      owns local TLS; the tillandsias.org agent's proposal — router
      (Caddy) terminates TLS on a loopback :443 publish with an
      enclave-CA (or caddy-internal) cert, origin stays plain HTTP,
      matching the Cloudflare-origin shape for the later public rung —
      is adjudication INPUT to that packet, alongside its
      apache-image design. Requirements from the consumer: real green
      padlock (no cert-error bypass), secure-context/CORS fidelity,
      https no-port URL from publish_local once terminated.
    verifiable_closure: |
      publish_local for a project with var/html/index.html returns a URL
      whose ROOT serves that page (200 at /), while a project without a
      docroot dir serves the worktree root exactly as today; the catalog
      spec names the convention.
