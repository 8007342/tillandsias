        WHY CRITERION 4 NEEDED A FUNCTION AND A PIN, NOT ONE MORE BRANCH. The discrimination
        is not observable on a forge: an index-bearing host and a no-index host produce result
        lines that differ only in the fields a forge never populates, and the one arm that
        could tell them apart was the one a no-index host never reaches. So the arm selection
        is factored out and pinned by 12 synthetic result lines (scenario 7b) that need no
        index, no embedding endpoint, and no plan binary — six of them the `unaccounted`
        negative controls, because the cheap way to pass the graded-red row is a classifier
        that accepts anything plausible, and that is the blanket-amnesty failure criterion 4
        exists to prevent. Two of the six caught a real defect: a `stale=2` row that omitted
        `skipped=0` classified unaccounted, which is correct behaviour on a truncated line
        and a wrong row.

        A stale-only run was the same conflation one arm over and nobody had named it: the
        old `graded rather than skipped` arm fired on a run with stale=2, which is true and
        silent about the two cases it certified nothing about. It now has its own arm, on
        1229-2862's own rule that STALE gets the same accounting treatment as a skip.

        VERDICT: four of five criteria verified here, the fifth is macuahuitl's to produce,
