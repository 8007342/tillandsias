             stale.is_empty(), failures non-empty, and that a failure says FABRICATED.
             `an_expectation_wrong_at_every_commit_is_still_a_failure` and
             `an_unresolvable_frame_is_not_an_acquittal` close the two ways a frame can
             quietly become amnesty. The fixture's own arms 3 and 9 also pass on this host.

          3. litmus:expert-groundtruth-harness green end to end against the index published
             2026-09-14, WITHOUT rebuilding it — NOT VERIFIABLE HERE, and the reason is worth
             more than the verdict. This forge has spec_index=absent, so the spec-rung1 cases
