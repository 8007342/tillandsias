        head is host-independent by construction (the batch note under Worker Drain says so
        by name), so a packet that was finished on day one was pre-empting the epic pick on
        every host every cycle. A cycle learns this by reading commits; the ledger is what
        makes it cost money.

        VERDICT PER EXIT CRITERION, 2026-09-27 on forge-tillandsias:

          1. a moved span grades STALE, not FABRICATED, and the finding names the commit
             it DOES hold at — VERIFIED. `groundtruth::tests::a_span_that_moved_grades_stale_and_not_fabricated`
             asserts failures empty, stale.len()==1, and that the text contains "VERIFIES at";
             `the_spec_engine_stamps_the_index_frame_not_the_readers_head` drives Harness::run
