    title: |
      The Windows-host and WSL-side toolchain lifecycles get disjoint tillandsias-plan artifact paths, so a sweep+rebuild on one side can no longer take the MCP experts down on the other.
    problem: |
      2026-08-16 cycles 1-2 (evidence:
      plan/issues/windows-host-tooling-hits-linux-elves-in-target-2026-08-16.md):
      the daily cache sweep deleted the Linux ELF at the shared
      ./target/release/tillandsias-plan that the WSL-hosted MCP wrappers exec;
      the Windows preflight rebuilt only the PE; every
      forge-plan/project-info TOOL CALL then failed at exec time
      ("line 417 ... No such file or directory") for a full cycle while the
      handshake-only health probe said ok:experts-healthy. The wrappers'
      resolve_plan_bin trusted `-x`, which passes on /mnt/c for an artifact
      the server cannot run.
    exit_criteria:
      - |
          resolve_plan_bin in images/default/config-overlay/mcp/forge-plan.sh and project-info.sh probes every candidate by EXECUTION (`capabilities`), never by `-x`, mirroring scripts/plan-binary-probe.sh (721-nyev); the TILLANDSIAS_PLAN_BIN override stays existence-checked (704-zcgi).
      - |
          A committed scripts/wsl-plan-expert-ensure.sh builds tillandsias-plan inside the tillandsias-build distro with a WSL-LOCAL CARGO_TARGET_DIR (~/.cache/tillandsias-wsl-target, never the shared /mnt/c target/) and installs to ~/.local/bin/tillandsias-plan (= PLAN_BIN_CANONICAL), one-line verdict grammar, always exit 0 (advisory).
      - |
          Live verification on the collision host: a FRESH forge-plan server launched via the harness's own launcher (WindowsApps bash.exe -> WSL default distro) serves a real tools/call, and the Git Bash lane still resolves the .exe.
    events:
