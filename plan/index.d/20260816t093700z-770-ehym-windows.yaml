        ts: "2026-08-16T09:37:00Z"
        agent_id: windows-yolanda-fable5-20260816t0921z
        host: windows
        summary: |
          All three criteria landed this cycle. plan_bin_runs() added to both wrappers (all four naive -x sites replaced); scripts/wsl-plan-expert-ensure.sh committed and run live (ok:wsl-plan-expert:/root/.local/bin/tillandsias-plan, 21.7s cold build in the distro); end-to-end proof: initialize + notifications/initialized + tools/call plan_status(758-jw6v) through AppData WindowsApps bash.exe returned the real status line, and the same frames through Git Bash returned the identical result. The outage class (post-sweep cycles start with broken experts) is closed at the root; probe visibility and staleness cadence are shaped as 770-f6u4.

  - packet_id: mcp-health-probe-tool-call-depth
    order: 770-f6u4
    status: ready
    desired_release: v0.5
    role: tooling
    pickup_role: any
    priority: p2
    tags:
      - mcp-experts
      - observability
      - fail-loud
    title: |
      check-mcp-expert-health.sh gains a tool-call-depth probe stage with launcher fidelity, so a server that handshakes but cannot exec its binary reads down, not healthy.
    problem: |
      The probe speaks only `initialize`. On 2026-08-16 every forge-plan tool
      call on windows failed at exec time while the probe said
      ok:experts-healthy — so no mcp_outage record was even POSSIBLE
      (order-531 shape: a health signal that cannot see the failure class it
      exists for). Second gap, discovered while fixing 770-ehym: the probe
      launches the registration command through the CURRENT shell's PATH, but
      on windows the harness resolves `bash` to the WindowsApps WSL launcher
      while Git Bash resolves its own bash — the probe tests a DIFFERENT
      environment than the one the session's servers actually run in, so even
      a tool-call-depth probe from Git Bash would have called this outage
      healthy.
    exit_criteria:
      - |
          After a valid InitializeResult, the probe sends notifications/initialized plus one cheap tools/call per expert and requires a structurally valid non-error result frame; a handshake-only server records down, with a distinct state token so the log separates handshake-dead from tool-call-dead.
      - |
          Launcher fidelity on windows hosts: when the registration command is `bash`, the probe resolves it the way the harness does (WindowsApps/System32 WSL launcher when present), not the probing shell's own bash; the chosen launcher is recorded in the JSONL record.
      - |
          litmus:mcp-expert-health-probe-shape gains fixtures for both: a stand-in that handshakes then errors every tools/call must read down; the existing healthy/adversarial scenarios stay green.
      - |
          Cadence decision recorded: whether scripts/cycle-preflight.sh invokes wsl-plan-expert-ensure.sh on windows (instrument-rebuild principle applied to the WSL lifecycle) and how its verdict fits the pinned one-line grammar — implemented or explicitly declined with the grammar reason.
    events: []

