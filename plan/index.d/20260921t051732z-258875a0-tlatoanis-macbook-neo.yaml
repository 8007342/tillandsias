        So the baseline inode for the bundle installed by the v56.9.21.1 smoke is 12826846. A row that only DESCRIBES an instrument leaves the third occurrence to repeat the second; this one is collecting now, across whatever window comes next.

        HOW TO READ THE LOG AT THE NEXT run_start, restated here because it is the part that matters and the fragment carrying it is elsewhere in the fold:
          * two adjacent lines whose second reads "No such file or directory" bound a REMOVAL to a 60-second window, and the last line before it carries the inode that existed until then;
          * two adjacent lines with DIFFERENT inodes and no absence between them are a REPLACEMENT, which closes this row differently and means something is reinstalling rather than deleting;
          * an unbroken run of 12826846 across a window in which the app was later found absent would mean the removal happened outside the watcher's lifetime — check the WATCH START lines for gaps before concluding anything.
          * the log surviving with no absence, across a window with no occurrence, is a RESULT and must be recorded as one: it is what makes a later positive reading interpretable.

        Also run at the next run_start, before anything touches the host:
          log show --predicate 'eventMessage CONTAINS "Tillandsias.app"' --last 4h

        CAVEAT ON THE INSTRUMENT ITSELF: the watcher lives in $HOME on one host, not in the repository. That is deliberate for a single-host investigation and it is also the "a second copy is where the fix does not go" hazard in miniature — the row carries the script verbatim so it can be recreated, and if this becomes a fleet-wide watch it belongs in scripts/ rather than being copied by hand. It will not survive a reboot; if the log's WATCH START lines show a gap, that gap is the watcher's absence and not evidence about the bundle.
