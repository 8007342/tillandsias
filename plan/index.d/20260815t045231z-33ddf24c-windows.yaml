      agent_id: unknown
      host: windows
      summary: >
        SWEPT AND MEASURED. Windows litmus health across the four affected specs, run before and after, same command each time (scripts/run-litmus-test.sh <spec> --phase pre-build --size instant):    methodology-accountability        12/15 -> 15/15   ci-release                        11/18 -> 14/18   forge-environment-discoverability 11/15 -> 12/15   meta-orchestration                 9/15 -> 11/15   TOTAL                             43/63 -> 52/63  THE FIX. scripts/litmus-stdlib.sh gains mf_plan_binary, which DELEGATES to scripts/plan-binary-probe.sh rather than reimplementing the search — a fourth copy of the probe, even a correct one, would be 704-zcgi's defect repeating itself one directory over. The stdlib is the right home because the runner already sources it into every step's bash -c, and it exists precisely to absorb host-dialect differences so an author need not know the Windows/WSL target/ layout any more than GNU-vs-BSD touch.  24 command lines across 8 files converted. The sweep script's DRY RUN earned its keep: the first pass injected `P=` as the resolved-binary variable, and terminal-status-vocabulary-shape already uses `P=` for a packet id it captures from a query. That would have produced tests that ran the wrong thing and still looked plausible. Renamed to MFPLAN.  forge-expert-base-guard-shape was NOT swept — the packet's negative control asked for this. Its hand-rolled chain searches forge install locations ($HOME/.local/bin, /usr/local/bin) the shared probe does not, coverage won by a real in-forge failure on 2026-07-31. mf_plan_binary was added in FRONT of that chain, so it finds the .exe on windows and falls through to the original list unchanged when it finds nothing.  THE GATE now scans both surfaces and NAMES them:    ok:plan-binary-probe-usage:11 eligible of 591 scanned [scripts=1/244 litmus=10/347]  Falsified in four directions before being trusted: a litmus command naming the checkout path with no probe reference -> violation, exit 1, file named; the same file using mf_plan_binary -> ok; `$F/target/release/tillandsias-plan` from a step that CARGO_TARGET_DIR-built its own binary -> not flagged (it must run the artifact it just built, and that is a distinction in the rule, not an allow-list); the path named only in a precondition -> not flagged.  The count deliberately includes COMPLIANT files, not just broken ones. Counting eligibility as "still hardcoded" would make the surface total FALL as the sweep fixed files, so a fully-converted directory would report the same `litmus=0/347` as a directory nobody had ever scanned — which is exactly the ambiguity that hid this surface for weeks.  RESIDUE, measured and NOT of this class — 11 tests still red on windows, listed so the next host does not rediscover them:   ci-release: cycle-batch-triage-shape, added-fragment-parse-gate-shape, script-exec-bit-shape, selector-urgency-not-inert-shape   forge-environment-discoverability: expert-refresh-cargo-target-shape, project-answer-synthesis-refusal-typed, generic-index-deterministic-subset   meta-orchestration: 4 including e2e-eligibility-probe-shape, credential-channel-check-shape, mcp-expert-health-probe-shape  Two things worth saying about that residue. credential-channel-check-shape fails inside the litmus runner while scripts/check-credential-channel.sh returns ok:gh-keyring when this cycle's guards run it directly — so the runner's environment differs from the cycle's in a way nobody has characterised. And litmus-capability-manifest-guard still does `cp $F/target/release/tillandsias-plan` on a binary IT built, which on windows is a .exe; deliberately left alone because it is size:quick, outside the instant runs I could verify by execution, and blind-fixing what I cannot run is what this packet is about.  THE LARGER FINDING. The windows host has never had a green litmus baseline and nothing was watching: build.sh --check does not run litmus, so 20 red tests sat here indefinitely. Every one of them is invisible to linux, where they pass. That is the same defect one level up from this packet's own — a gate reporting healthy over a surface it does not observe.
