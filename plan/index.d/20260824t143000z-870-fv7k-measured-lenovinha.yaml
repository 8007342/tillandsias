      summary: |
        MEASURED, AND THE ANSWER CHANGES THE PACKET'S RECOMMENDATION. I filed
        this yesterday with "197 steps share the shape" and two candidate fixes.
        197 was a STRUCTURAL count — commands chaining a non-quiet grep with `&&`
        and no sentinel. It says how many steps COULD lie, not how many DO.

        The live exposure is ONE.

        HOW I MEASURED IT, without mutating anything. A step lies right now when
        its command exits non-zero AND the expectation still matches the output
        the command printed on its way to failing. That is directly observable:
        run the command, keep the exit code and the output, and ask whether the
        matcher would accept it. No mutation, no guessing which property to
        break.

          total steps carrying an expectation      2026
          safe to execute read-only                 887
          exit 0                                    856
          exit non-zero, correctly reported FAIL     28
          exit non-zero, WOULD REPORT OK              1   <- the whole exposure

        THE ONE: litmus:methodology-accountability-shape step 4. It grepped
        `methodology openspec docs cheatsheets scripts src-tauri crates images`
        — and `src-tauri` DOES NOT EXIST in this tree, so grep exited 2 (an
        ERROR, not "no matches") on every run since. It reported OK anyway,
        because the grep had no `-q`, printed the 69 matches it found in the
        directories that do exist, and the expectation was the bare string
        `methodology-accountability`, which appears in every one of those lines.
        The step matched its own output while erroring.

        Two silent consequences: a directory could vanish from that list and
        nothing would notice (one already had), and the trace surface could
        collapse to a single file while the step stayed green.

        FIXED in this commit. The nonexistent path is gone, the assertion is a
        FLOOR on the file count (currently 44, floor 10) rather than the text
        being echoed, and a sentinel is the only thing that can satisfy the
        expectation. A negative control runs the same floor test over an empty
        temp tree and requires the refusal — 634-39ik demanded it, and it is the
        assertion this step most needed, since what it lacked was never a better
        grep but any evidence it could fail. Both steps green through the real
        runner; the command now exits 0.

        TWO SCAN HITS WERE MY OWN HARNESS, and I checked rather than reporting
        them. The stdlib portability steps 6 and 8 call `mf_literal_count` /
        `mf_regex_count`, functions the real runner provides by sourcing
        LITMUS_STDLIB; my scanner does not source it, so they errored under the
        scan and pass legitimately in the runner. Confirmed by running them
        through `run-litmus-test.sh`. Reporting "3 mis-passes" would have been
        the same mistake I made twice earlier this week — reading a number off a
        harness I had not verified.

        WHAT THIS MEANS FOR THE FIX, and I now think the packet's own framing was
        wrong. With 1 of 886 actually lying, a RUNNER-SIDE exit-code rule is a
        bad trade: it touches every step in the corpus and risks the inversion
        661-nm73 already recorded, to catch a population of one. A 197-step
        SWEEP is also poor value — it is 197 edits against one live defect, and
        the shape is not itself a bug, it is a fragility. The proportionate
        answer is the third option neither of us listed yesterday: KEEP THE
        DETECTOR AND FIX INSTANCES AS THEY APPEAR.

        So the scanner is committed as `scripts/scan-litmus-false-pass.sh`,
        read-only, advisory, gating nothing, with both of its limits stated in
        its own header: it sees fewer than half the steps (1141 skipped as not
        provably read-only — a refusal to run podman resets and installers to
        find out, not a claim they are clean), and it approximates only the
        matcher's final fallback, so every hit needs confirming against the real
        runner. A number that says what it did not look at is worth more than a
        bigger number that does not.

        RESIDUAL, honestly: the 1141 unscanned steps could hide more. Making
        them scannable means sandboxing, which is a real piece of work and a
        different packet's shape if anyone wants it.
