    release_target: forge-local-experts-milestone
    priority: p2
    title: "Ground-truth expert cases still pin mutable `status:` on in-flight packets — audit and de-pin so ledger churn stops turning the harness red"
    kind: bugfix
    deliverable: openspec/litmus-tests/groundtruth/*.yaml audited for mutable-status pins + a guard
    depends_on: []
    pickup_role: linux
    capability_tags: [experts, groundtruth, litmus, robustness]
    estimated_hours: 2
    context: >
      Cycle-10 freshness audit (2026-08-11) ran the expert-groundtruth harness
      at quick tier and found it RED at HEAD (18/19): the
      plan-active-release-experts-milestone case pinned citation 394e with
      `status: in_progress`, but 394e had legitimately gone in_progress ->
      ready via the 672-bz7u expire-claims automation. NOT an expert
      regression — the expert correctly read the live ledger; the frozen
      ground truth pinned a MUTABLE field. The case's OWN comment (on sibling
      394a) documents exactly this trap — "A query set that pins the MUTABLE
      status of an in-flight packet goes red on every legitimate ledger
      update — this case did exactly that the first time 394d was closed" —
      and 394a/394d were de-statused accordingly, but 394e was missed.
      Removed 394e's status pin this cycle (harness back to 19/19). The
      residual: this is the THIRD time this trap has fired (394d twice, now
      394e), and every remaining `status:` on an in-flight (non-terminal)
      packet across the groundtruth sets is a latent red-at-next-churn. The
      harness is a ratification gate (4 verifiers) and a false red costs a
      diagnosis round-trip each time.
    exit_criteria:
      - every groundtruth citation that pins `status:` on a NON-terminal packet is either de-pinned or justified in a same-line comment; terminal (completed/archived) statuses may stay since they don't churn
      - a guard (litmus or check) fails loud if a groundtruth case pins `status:` on a packet whose live status is non-terminal, so the trap cannot be reintroduced silently
    events:
