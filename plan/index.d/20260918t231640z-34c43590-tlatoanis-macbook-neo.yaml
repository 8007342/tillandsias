      [2026-09-18T22:53:41Z tlatoanis-macbook-neo] THIRD INSTANCE, SAME FAMILY — A DELETION GATED ON THE DELETER'S TREE.
      Observed on macneo 2026-09-18 while cleaning up this row's own superseded ref.

        $ git push origin --delete plan-only/1255-s4im-macneo
        plan-only lane: not applicable — refs/heads/plan-only/1255-s4im-macneo is
        being deleted (full gate required)
        ✗ pre-push refused: the tree changed since ./build.sh --check last passed

      A ref deletion carries NO CONTENT. It removes a ref whose content is already
      on trunk. Yet it demands a full gate stamp from the deleting host, i.e. it is
      gated on a working tree that has nothing to do with the operation. The
      consequence is circular: a host that filed through the plan-only lane BECAUSE
      it could not gate cannot then delete its own plan-only ref, for the same
      reason it used the lane. The lane admits the write and refuses the cleanup
      from the identical host state. Same shape as the known trap where a work/<order>
      hand-off requires a stamp and is therefore unreachable from the red-trunk state
      it exists to rescue — a cleanup path unreachable from the state that generates
      the things needing cleanup.

      NOT ASSERTED: whether the full gate on a deletion is deliberate (a deletion is
      destructive and a stamp proves a live, gating host) or incidental (the dispatch
      simply has no deletion case). The refusal text says "full gate required"
      without saying why, which is the part a reader cannot resolve from the output.
      Someone who knows the intent should say which it is before this is "fixed".

      FOURTH INSTANCE, AND THE CLEANEST — THE SELF-REPORT AS INSTRUMENT.
      In the same command the filing agent wrote, BEFORE knowing the outcome:
        echo "(empty above = both deleted)"
      The deletion was refused and both refs were still listed, directly above that
      line, which then asserted they were gone. The echo was a verdict scripted in
      advance and printed unconditionally: it described what the command was INTENDED
      to do, not what it did, and nothing in the output marked the difference.

      This is the row's own thesis with the wrapper removed. There was no harness and
      no exit code — just a sentence that reads like a result, emitted regardless of
      the result, one line from the evidence contradicting it. The agent caught it
      while writing the report and flagged it rather than quietly deleting the line.
      It belongs on the row because it shows the failure does not require a wrapper
      at all: it requires only that a confident-sounding statement be produced by
      something other than the check it claims to summarise.

      [2026-09-18T22:55:25Z tlatoanis-macbook-neo] THIRD REGIME, AND A NEW VARIANT — A NUMBER FOR A RUN THAT PRODUCED NO VERDICT.
      Reported first-hand by macbookair-macos, 2026-09-18.

      That host KILLED a gate deliberately, on the coordinator's word, 489 lines into
      a run of roughly 6650. Outcome:
        harness         task b1dchttub, killed 15:54:30, reported "failed with exit code 144"
        gate's own line BUILD_RC never written at all — the run did not reach it

      So the wrapper reported a NUMBER for a run that produced NO VERDICT. 144 is
      128+16, i.e. a signal, but a reader who trusts the wrapper cannot tell from it
      whether the gate went red or was killed — both arrive as a non-zero integer in
      the same field. The gate's own line is unambiguous precisely because it is
      ABSENT: no line, no verdict, nothing to misread.

      THIS IS THE SHARPER FORM OF THE ROW. The earlier instances were a wrapper
      DISAGREEING with a verdict that existed. This one is a wrapper SUPPLYING a
      verdict where none exists. The first is a wrong answer; the second is an
      answer to a question that was never resolved, which is worse, because a wrong
      answer can be contradicted by evidence while a fabricated one has no
      counterpart to check against. It is the same shape as a partial record that
      cannot say it is partial: the instrument's silence is the honest signal, and
      the wrapper overwrites the silence with a number.

      CONSEQUENCE FOR EXIT CRITERION 1, stated so it is not lost: a terminal verdict
      line is necessary but NOT sufficient. If the gate is killed the line never
      prints, and a consumer must read that absence as "no verdict" rather than
      falling back to the wrapper's integer. The criterion should be read as
      requiring that consumers treat a MISSING verdict line as unresolved — never as
      a licence to consult the wrapper's number instead. Absence of the line is a
      third state alongside green and red, and it is the state a killed, crashed or
      timed-out gate produces.

      [2026-09-18T23:16:40Z tlatoanis-macbook-neo] FIFTH INSTANCE — A CARRY-FORWARD THAT WOULD HAVE RE-LANDED A DELETED FILE.
      macneo, 2026-09-18, while landing this row's own fragments.

      The superseded 1255-s4im fragment had just been DELETED from origin by the
      coordinator. Yet `git log --name-only origin/osx-next..HEAD` still lists it,
      because the filing host's range ADDS the file and then REMOVES it. A range
      reports every path it touches, not the net effect of touching them. So a
      carry-forward built by asking "which of my files are not on the target?" would
      have answered "this one" and re-landed the collision that had just been
      removed — correctly, by its own logic, from a question that was subtly the
      wrong one.

      Same family as the rest of this row. The range listing is an instrument, and
      its output reads like an answer to "what is missing over there" when it is
      actually an answer to "what did my commits touch". Nothing marks the
      difference. The file was excluded deliberately; the exclusion came from
      knowing the fragment's history, not from the listing.

      It also names the discipline that avoided it, which generalises beyond this
      row: cut a FRESH branch at the target ref and copy forward only the files
      intended, rather than pushing a history whose net effect is nil. The same move
      kept the push genuinely plan-only, since the branch history contained an
      images/ commit whose content was already byte-identical on trunk — a range
      whose net effect is nothing still contains the commit, and a lane that inspects
      the range will see it.
