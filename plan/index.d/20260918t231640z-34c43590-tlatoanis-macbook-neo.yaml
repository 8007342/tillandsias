        CONTROL — THE WRAPPER IS NOT ALWAYS WRONG. check5.log mtime 15:30:13,
        BUILD_RC=0, and the harness ALSO reported exit code 0. This is the load-
        bearing observation, not the disagreements: a wrapper that were always wrong
        would be harmless, because the first surprise would train the reader off it.
        One that agrees on every green and diverges only on red is the hazard —
        it earns trust on the majority case and spends it on the minority case,
        which is the one that matters.

        TIMING, which explains why nothing invites the comparison: the notification
        and the gate's own line are at most one minute apart and describe the SAME
        run. Two numbers about one event, presented as if they were about different
        things.

        STALE STAMP — exit criterion 2, primary. At 15:32, with the merged tree
        checked out and a later gate running against it, .git/tillandsias-gate-stamp
        read 15:02: run 5's green, for the PRE-MERGE tree. Nothing on disk
        distinguished it from a fresh stamp.

      PROVENANCE, stated so the row does not overclaim: the harness texts are quoted
