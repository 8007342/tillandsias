      summary: >
        MECHANISM CONFIRMED FROM THE UPSTREAM INSTALLER'S OWN SOURCE, not inferred. Fetched https://opencode.ai/install (460 lines) and read check_version(): it runs 'command -v opencode' against PATH, compares that binary's --version to the version it intends to install, and on a match prints 'Version <v> already installed' and calls exit 0. It never consults OPENCODE_INSTALL_DIR when deciding. Two consequences for curl_install_opencode (images/default/lib-common.sh:2520). First, the installer's idempotence is keyed on a DIFFERENT installation than the one it was asked to create: lib-common.sh:1550 puts $NPM_CONFIG_PREFIX/bin first on PATH, npm has already placed opencode-ai 1.18.18 there, and upstream latest is also 1.18.18, so the check matches something the harness never asked about. Second, because it exits ZERO, the guard at :2538-2542 passes its 'bash $tmp' clause and is saved only by the trailing '[ -x $bin ]' -- the install reports success while installing nothing, and refresh_ok correctly stays 0. Then opencode_validate_or_rollback runs against a path that does not exist and reports 'rolling back to last-good' where no curl-side last-good was ever recorded. So this is STRUCTURAL, not a flake: while npm provides opencode on PATH at the same version, curl_install_opencode can never succeed. THE CHOICE IS NOW EVIDENCED. Retiring it is the removal the operator's 2026-08-17 direction favours, and the capability is NOT lost: harness_probe (:2096) applies the opencode auth and render contracts to the npm binary by default, and harness_record_last_good/harness_last_good_file keep a last-good in the npm prefix, so rollback for a bad @latest survives. Alternatively it can be made to work by running the installer with a PATH that contains no other opencode, so check_version finds nothing and honours OPENCODE_INSTALL_DIR. DELIBERATELY NOT DONE HERE, and this is a judgement not an omission: either change alters WHICH binary the forge executes -- today it runs npm's -- and switching a fleet's harness provisioning unattended at 04:30 local, on the night before an operator review, is a wider blast radius than the defect. It wants the same per-host-kind treatment .mcp.json got in 793-rb9u.
