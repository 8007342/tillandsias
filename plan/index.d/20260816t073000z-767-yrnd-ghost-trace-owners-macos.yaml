packets:
  - packet_id: seven-ghost-trace-specs-need-owners
    order: 767-yrnd
    release_target: fail-loud-diagnosis-milestone
    status: ready
    desired_release: v0.5
    priority: p2
    kind: coordination
    title: 'Seven @trace annotations reference specs that never existed — surfaced by the first union-tree ghost gate run; baselined for burndown, owners assigned here'
    pickup_role: any
    depends_on: []
    capability_tags:
      - openspec
      - cross-platform
      - coordination
    context: |
      First ./build.sh --check on the merged union (macOS, 2026-08-16T07:2x)
      tripped ghost-trace-gate on seven specs absent from openspec/specs/.
      origin/linux-next fails identically at the same baseline — each
      branch's diff-scoped runs missed them (the 658-kcd5 scoping
      limitation, union-gate edition, same story as 754-kptj).

      Baselined with provenance in openspec/ghost-trace-baseline.txt so the
      union gate is green fleet-wide again; the baseline is a burndown list
      and the gate's stale-baseline direction enforces removal as each is
      resolved (create the spec, archive the defining change, or delete the
      annotation).

      OWNERS by referencing file:
        - error-message-localization, shell-prompt-localization-fr/-ja
          (scripts/test-locale-coverage.sh) and help-system-localization
          (scripts/help-fr.sh, help-es.sh): the tray string/locale family —
          natural home is the 628-c7qd shared-string-layer owner; likely
          resolution is ONE localization spec covering the corpus, not four.
        - macos-tray-build-and-release (scripts/install-macos.sh,
          build-macos-dmg.sh): macOS host — this loop can draft the spec
          from the existing build/install runbooks in a later cycle.
        - mcp-tool-socket (tillandsias-headless main.rs, tray/mod.rs):
          linux/headless owner.
        - windows-wsl-runtime (tillandsias-podman client.rs, lib.rs):
          windows owner.
    exit_criteria:
      - each of the seven is resolved (spec created, defining change archived, or annotation deleted) by its owner above
      - openspec/ghost-trace-baseline.txt shrinks back to its 9 pre-2026-08-16 entries or fewer, enforced by the gate's stale-baseline direction
    verifiable_closure: |
      scripts/trace-coverage.sh ghosts reports none of the seven, and the
      baseline no longer lists them.

