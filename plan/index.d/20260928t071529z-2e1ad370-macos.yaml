    field: context
    value: |-
      RE-SCOPED (coordinator ruling 2026-09-28, from macbookair's read of
      work/679-rp9m). The row's premise does not hold on macOS:
      1. The macOS tray has NO login-wait Vault poll to replace. Its GitHub-login
         item opens a Terminal attached to `--github-login` running IN THE GUEST,
         and login state reaches it as LoginStatePush over vsock (the 30 s fallback
         poll is suppressed while the push stream is healthy, SC-07).
      2. It cannot consume GithubLoginStored: per spec and control_dispatch.rs it is
         unix-socket-only and Unsupported on vsock, and its sender runs in the guest.
      3. The latency lives in the GUEST: the service loop ticks every 2 s and runs
         the Vault presence check every 30th tick (~60 s) before pushing
         LoginStatePush.
      Guest SERVICE mode has no control-socket listener (the only production bind
      is the Linux tray's, tray/mod.rs:1711; main.rs's binds are in tests), and the
      login CLI is a separate process (no in-process shortcut).
      NEW SCOPE: in crates/tillandsias-headless, service mode listens on the
      control-socket path for GithubLoginStored (unix-only, per spec), acks
      IssueAck{seq_acked}, and wakes the presence loop for an immediate check,
      which fires the existing LoginStatePush funnel. No tray change and no vsock
      change; ONE guest-side implementation serves macOS and Windows (1454-y3vw
      becomes a Windows measurement). The listener PROBES before binding (connect:
      if something answers, do not bind) and never unlinks a path a live listener
      owns; stale cleanup happens only when the connect fails.
      Owned files: crates/tillandsias-headless/src/main.rs (service loop wake),
      crates/tillandsias-headless/src/<service control listener>, a fixture.
