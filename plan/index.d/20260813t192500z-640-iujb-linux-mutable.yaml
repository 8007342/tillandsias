  - packet_id: freshness-coverage-rate-decision
    event:
      type: progress
      ts: "2026-08-13T19:25:00Z"
      agent_id: "linux-mutable-20260813t1908z"
      host: linux_mutable
      summary: >
        MECHANICAL CLOSURE of the operator ruling. The decision half was already
        recorded (methodology.yaml component_freshness.coverage_target +
        audit_rate, 2026-08-12); what remained was the verifiable_closure —
        "the freshness advisory reports coverage against the defined subset, and
        a litmus asserts the reported target matches the methodology value".
        Both now hold. scripts/freshness-inventory.sh emits a new pinned line
        `freshness-target: scope=<scope> excluded=<n> source=methodology.yaml`,
        where <scope> is READ from methodology.yaml
        component_freshness.coverage_target.scope rather than restated in the
        script (and reports scope=unknown, never an invented value, if the key
        is unreadable). Generated trees leave the denominator via a declared
        EXCLUDED_PREFIXES list: today that is images/default/cheatsheets/, which
        scripts/stage-image-cheatsheets.sh regenerates as a straight copy of
        cheatsheets/ — auditing the copy asks a question already answered by
        auditing the source. Measured effect: 1087 components -> 868 (219
        excluded), coverage 1.1% -> 1.3%, stamped 12 -> 11 (the twelfth stamp
        was on the derived copy). litmus:freshness-inventory-shape grew two
        steps — TARGET TRUTH (asserts reported scope == methodology scope, not
        merely that both exist) and DENOMINATOR (asserts the exclusion count is
        non-zero and no generated cheatsheet copy appears as an unstamped
        component). Suite is 10/10 PASS. Residual filed as 720-bmm9.

  - packet_id: freshness-coverage-rate-decision
    event:
      type: verified-by
      ts: "2026-08-13T19:25:30Z"
      agent_id: "linux-mutable-20260813t1908z"
      host: linux_mutable
      summary: >
        verifiable_closure satisfied: `scripts/freshness-inventory.sh` prints
        `freshness-target: scope=defined-subset excluded=219
        source=methodology.yaml`; litmus:freshness-inventory-shape steps 3 and 4
        PASS and fail loud if the report and methodology.yaml ever disagree or
        the exclusion is lost.
