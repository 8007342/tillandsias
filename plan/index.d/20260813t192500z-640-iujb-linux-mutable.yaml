packets:
  - packet_id: freshness-inventory-subset-source-and-specs
    order: 720-bmm9
    release_target: architecture-audit-epic
    status: ready
    desired_release: v0.5
    priority: p2
    kind: enhancement
    title: 'FRESHNESS denominator is narrower than the ruled subset: source code and openspec/specs are not enumerated'
    pickup_role: linux
    depends_on: []
    capability_tags:
      - freshness
      - methodology
      - convergence
    context: |
      methodology.yaml component_freshness.coverage_target names the in-scope
      subset as "executable/source code, scripts, litmus tests, specs
      (openspec/specs), and methodology docs". scripts/freshness-inventory.sh
      currently enumerates scripts/, images/default/, cheatsheets/,
      openspec/litmus-tests/, and methodology/ — so source code (206 .rs files
      under crates/) and openspec/specs/ are absent from the denominator.
      Closing 640-iujb narrowed the denominator correctly (generated trees out);
      this packet widens it correctly (ruled-in components in). It was
      deliberately NOT bundled into that closure: adding ~200+ components to the
      denominator moves the reported coverage number, and doing that silently
      inside a packet about honest reporting would be the exact failure mode the
      ruling was about.
    exit_criteria:
      - inventory enumerates openspec/specs and the crate source tree per the methodology subset
      - the coverage delta from the widening is reported once, explicitly, rather than appearing as an unexplained drop
      - litmus:freshness-inventory-shape asserts a ruled-in tree is present in the denominator, so a future narrowing fails loud
    verifiable_closure: |
      scripts/freshness-inventory.sh counts at least one component from
      openspec/specs and one from crates/, and a litmus step fails if either
      tree disappears from the inventory.

