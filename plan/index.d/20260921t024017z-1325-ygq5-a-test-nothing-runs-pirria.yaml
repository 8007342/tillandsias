    context: "ONE RULE, TWO ORGANS, AND THE SAME HOST PRODUCED A SPECIMEN IN EACH ON THE SAME\nDAY. 2026-09-20/21,\
      \ pirria:\n\n  SPECIMEN 1 (litmus organ). litmus:installer-reprovisions-on-install was written\n\
      \  into openspec/litmus-tests/ and never added to openspec/litmus-bindings.yaml.\n  The suite ran\
      \ ci-release to completion reporting 37 PASS / 3 FAIL with that\n  test in NEITHER number, and it\
      \ was reported to the coordinator as verified.\n  Bound later, it did not even parse. (1304-wbb2\
      \ owns the reconciliation guard;\n  esme's audit found sixteen unbound files at the time.)\n\n \
      \ SPECIMEN 2 (shell organ). scripts/test-reset-flags-are-accepted.sh — written\n  the same night,\
      \ to replace an arm that counted MENTIONS of a flag instead of\n  running the binary — was committed\
      \ with NO gate-steps.d step, NO build.sh line\n  and NO litmus binding. `grep -rl test-reset-flags-are-accepted\n\
      \  scripts/gate-steps.d/ build.sh openspec/` finds nothing. Its 7/7 could not fail\n  a gate. It\
      \ replaced a test that could not fail FOR THE REASON IT NAMED with one\n  that could not fail AT\
      \ ALL.\n\nWHY THE AUTHOR IS THE ONE PERSON WHO CANNOT SEE IT. Both artifacts run green when\ninvoked\
      \ by hand, which is how an author checks. The file states its own spec and\nphase in its frontmatter\
      \ (litmus) or prints its own ok: line (shell), so\neverything the author looks at says the test\
      \ is real. Only the thing that never\nran — the suite, the gate — knows, and it reports its absence\
      \ as a smaller total\nrather than as an error.\n\nTHE LESSON WAS ALREADY WRITTEN DOWN AND STILL\
      \ DID NOT FIRE. The same host wrote\nup specimen 1, sent esme the authoring-side cause for 1304-wbb2\
      \ (\"nothing in the\nauthoring path asks for the binding, and writing the file feels like finishing\"\
      ),\nand then produced specimen 2 hours later. The lesson had been filed against the\nORGAN (a litmus\
      \ YAML needs a bindings entry) rather than against the SHAPE (a\ntest is not done until something\
      \ that runs on its own can fail because of it), so\nit did not fire when the artifact was a shell\
      \ script.\n\nMEASURED POPULATION on trunk, 2026-09-21:\n\n  scripts/test-*.sh                  \
      \       352\n    referenced by no step, build.sh, local-ci.sh or litmus   35\n  litmus tests declaring\
      \ a name             445\n    absent from openspec/litmus-bindings.yaml                20\n\nFifty-five\
      \ artifacts that no gate reaches. Some are deliberate (unbound-\ngrandfathered.txt is a real list\
      \ with a ratchet, 660-ryhn); the defect is that\nDELIBERATE and FORGOTTEN are the same state, and\
      \ nothing at push time tells them\napart.\n\nWHY A CHECKLIST IS THE WEAK FORM, and the coordinator's\
      \ words are the right ones:\na checklist at the point of authoring is read by the same person who\
      \ has just\nfinished the file and believes it is done. The strong form is a decider that\nfires\
      \ at push time on the diff, like yoga's, and names the artifact.\n"
