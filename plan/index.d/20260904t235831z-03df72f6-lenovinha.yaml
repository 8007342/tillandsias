        MY FIRST PATCH WAS WRONG AND THE GATE CAUGHT IT — this is the part worth keeping. I used `declare -A`: 0.83s, output identical, and REFUSED with blocked:bash4-unguarded (761-g36m). macOS ships bash 3.2, and check-bash-dialect.sh's own header records that these string sets were introduced AS the 3.2-clean replacement for two `declare -A` maps. So the quadratic was never sloppiness — it was the cost of a correct portability fix, and the obvious repair would have reopened the bash-4 defect on macbookair and macneo to make my host faster. I would have shipped it.

        WHAT LANDED is neither: one awk pass precomputes membership into a positional 0/1 marker array. awk supplies the hash table bash 3.2 lacks; indexed arrays are 3.2-clean. 0.68s — faster than the associative-array version it replaces.

        A HAZARD I INTRODUCED, pinned rather than hoped about. Positional markers desynchronise silently if anyone adds a `continue` to the loop: a short array reads as 'unstamped' through its :-0 default, so files past the truncation are misreported and coverage falls with nothing to say why. Both sites refuse on a length mismatch. Mutated each to prove the refusal fires: rc=1, marker-desync:5/1654 and tracked-marker-desync:5/1901. The index also advances BEFORE the loop's `[ -f "$f" ] || continue`, which is the one path that would desynchronise it.

