      summary: |
        EXIT CRITERION 2: THE API PATH IS MAPPED END TO END, and I am NOT claiming EC2 fully met -- see the boundary at the end. Written to plan/issues/store-submission-api-map-2026-09-05.md with every claim linked to the Microsoft Learn page it came from and the date it was read.

        THE FIRST FINDING IS A TRAP THAT WOULD HAVE COST A DAY. There are TWO Microsoft APIs called "the Store submission API" and both rank highly for the same searches. The MSI/EXE one takes a token scoped https://api.store.microsoft.com/.default against https://api.store.microsoft.com. The MSIX/UWP one -- OURS, since the operator deleted the EXE/MSI draft and created an MSIX listing -- takes resource=https://manage.devcenter.microsoft.com against https://manage.devcenter.microsoft.com/v1.0/my. The wrong resource value mints a token that AUTHENTICATES FINE and then fails every call. The .default-scoped one is what a search surfaces first.

        THE SEQUENCE, all relative to /v1.0/my: POST /applications/{id}/submissions creates and returns the submission plus a fileUploadUrl; PUT /applications/{id}/submissions/{sid} updates it; the packages and listing images go up as a SINGLE ZIP written to that fileUploadUrl, which is an AZURE BLOB SAS URI and not a multipart POST to the API -- that is the step most likely to be guessed wrong; POST .../commit; then poll GET .../status.

        PUBLISHED IS THE ONLY SUCCESS STATE. The chain is PendingCommit -> CommitStarted -> PreProcessing -> Certification -> Release -> Published, with CommitFailed, PreProcessingFailed, CertificationFailed, PublishFailed and Canceled as terminal failures. A CI job that treats "not failed" as success reports green while a submission sits in Certification for days.

        THE PREREQUISITE THAT SETTLES THE SEQUENCING, and it corroborates the previous agent rather than merely agreeing with them: the API CANNOT create the app, and one submission must have been completed MANUALLY in Partner Center first, including the age-ratings questionnaire, before the API can create any submission for that app. Their recommendation of a manual first submission was not just prudent -- it is required by the API's own prerequisites, and no amount of automation removes it.

        COSTS AND LEAD TIMES. API cost is $0 and no certificate is needed; creating an Azure AD directory in Partner Center is free; both registration fees were already waived. Certification is typically a few hours and up to THREE BUSINESS DAYS, then about 15 minutes to become visible. The practical consequence for the release lane: a Store release is not same-hour reliable, so anything blocking on Published must tolerate a three-business-day worst case or be decoupled from the release it accompanies.

        FOUR TRAPS RECORDED, the sharpest being that an API-created submission MUST NOT be edited in Partner Center -- doing so makes it uncommittable via the API and can strand it in a state recoverable only by delete-and-recreate. That forbids the obvious debugging move of fixing it in the UI. Also: Pricing Version 2 blocks the pricing module; mandatory app updates and Store-managed consumables return 409; LOB and volume-purchase are out of scope.

        STOREBROKER SHOULD BE EVALUATED BEFORE WE WRITE A CLIENT. Microsoft ships an open-source PowerShell module over this exact API and says it is how many first-party apps are submitted. Our Windows build path is already PowerShell. I did NOT assess its dependency weight or maintenance status and I am not recommending it on that basis -- naming it as unmeasured rather than dressing a guess as a recommendation.

        THE BOUNDARY, STATED RATHER THAN DISCOVERED LATE. Nothing was executed: no token minted, no submission created, no ZIP uploaded, no status polled. Every value is quoted from docs, not observed. Five operator account actions gate any execution -- Azure AD directory with Global administrator, associate Partner Center, create the AAD application with the Manager role, generate the key (one-time visibility), and complete one manual submission. All are $0 except time. So if EC2's "mapped end to end" means DOCUMENTED, it is met; if it means EXERCISED, it cannot be met by an agent at all and the remaining half is operator work. That reading is the coordinator's call and I am not making it by declaring the criterion met.
