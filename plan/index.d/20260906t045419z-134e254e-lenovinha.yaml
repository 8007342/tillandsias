      summary: |
        LOCUS-AWARE ROUTING LANDED — the blocker named in next_action (b) is closed.

        THE DEFECT, restated from the code rather than the packet: phase_device_usable
        hard-coded d.lanes contains "container", so route_phase could only ever answer
        for one lane. On macOS that reading is ACCURATE and the answer is still wrong:
        Metal genuinely does not cross into a forge container, the document says so
        correctly, and routing believed it — sending both phases to the CPU on a host
        whose GPU wins decode 1.27-1.64x and prefill 3.2-3.8x. The device state was
        never the bug. The question was under-specified.

        WHAT CHANGED (crates/tillandsias-headless/src/accel_probe.rs):

        1. RoutingLocus{Container,HostNative} is now a required parameter of
           route_phase and phase_device_usable. No default: a caller that does not
           know its own side is asking a question with no answer. The tokens are the
           ones DeviceRecord.lanes and EngineRecord.lanes are already spelled with, so
           this selects among existing evidence rather than adding a vocabulary.

        2. THE ENGINE IS LANE-CHECKED TOO. Previously only supported_device_classes
           was consulted, so a container-only ollama would have qualified a device for
           the host-native lane — the same defect one field further in. EngineRecord
           lanes None still means every lane (850-bif2 semantics preserved literally,
           pinned by a test).

        3. EXIT CRITERION 3 SHARPENED: every Placement reason now names the lane it
           was decided in. "no-usable-gpu-for-decode" was true and unactionable — it
           could not distinguish a host with no GPU from a host whose GPU merely does
           not cross a boundary, which is precisely how this defect stayed invisible.
           It now reads no-usable-gpu-for-decode-in-container.

        4. SEPARATE SOUNDNESS BUG FOUND AND FIXED IN decode_crossover_b: it paired a
           CPU row with a GPU row regardless of MeasurementRecord.locus. A crossover
           is a subtraction between two curves, and the locus field exists precisely
           because this fleet measured one suite at two loci and the 5-10% hop
           INVERTED a conclusion, two errors having cancelled. That inversion was
           reachable inside a routing threshold where nothing downstream could see it.
           Rows are now grouped by locus and paired only within a group; an
           unattributed row (locus None) forms its own group rather than joining one.
           Disagreeing loci resolve to the most conservative verdict (CpuWins beats
           any threshold; a higher threshold beats a lower one), which is 620-ca7g's
           floor as the standing tie-break, not a new rule.

        5. accel_envelope is UNCHANGED in behaviour and grammar: it passes
           RoutingLocus::Container explicitly, which is right for its audience (an
           agent inside a forge, as its own doc comment states) and makes the choice a
           decision rather than an inherited default.

