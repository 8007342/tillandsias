    field: next_action
    value: "STATE 2026-08-29 (lenovinha). 52 SITES CONVERTED, VERDICTS INVARIANT AT EVERY STEP. THE COMPOUND CLASS IS NOT AUTO-CONVERTIBLE — PROVEN, NOT SUSPECTED.\n\nDONE: 46 direct (batches 1-2) + 6 in batch 3 after the -qF hold was discharged by macbook's BSD grep 2.6.0 run. All four regimes now measure every consumer variant.\n\nDO NOT TRY TO AUTOMATE THE 22 COMPOUND PRODUCERS. I tried, with a rule that only embedded producers containing no `$` and no `\"`, and it converted 17 sites cleanly, parsed, and turned THREE litmus tests red. Two distinct causes, both fatal to a regex approach:\n\n  1. A DROPPED NEGATION. litmus:git-mirror-no-anonymous-daemon-write reads\n       grep -Fq 'X' F && ! grep -vE '^#' F | grep -qiE 'PAT' && echo ok\n     `|` binds tighter than `!`, so the shell parses `! ( … | grep -qiE … )`.\n     Splitting at the last pipe swallowed the `!` into the producer and emitted\n     a POSITIVE consumer. THE ASSERTION WAS INVERTED. It went red here; a\n     different pattern would have gone GREEN while asserting the opposite of\n     what the author wrote.\n  2. AN INTENTIONAL NON-ZERO. litmus:build-cache-sweep-trigger is\n     `test -x F && F | grep -qE '^(ok:…|due:…)'`. Staged with an asserted 0 it\n     fails whenever the script reports \"due\" non-zero — the exact case\n     mf_stage exists to let a step DECLARE, and which no rule can infer.\n\nA regex cannot see `!`, operator precedence, or which stage's status the author\nmeant. Convert these 22 BY HAND, one at a time, each with a deliberate decision\nabout the expected exit code. mf_stage_sh is the right tool; automation around\nit is not.\n\nEVERY CONVERSION MUST BE VERDICT-INVARIANT **AND** GATE-NEUTRAL. ./build.sh --check\nrefused one otherwise-correct redo under 634-39ik (expression-pinning): the gate\nis diff-scoped and reads a REWORDED step as a NEW one. I reverted that site\nrather than adding a negative control — growing an unrelated test to make a\nmigration pass is scope creep, and a conversion that changes MEANING has stopped\nbeing a conversion. Expect this on any step that pins a source expression; skip\nthe site, do not modify the test.\n\nTHE PROCEDURE, which has now caught something at every layer:\n  1. snapshot the tree           (made all three recoveries free)\n  2. convert                      \n  3. validate EVERY file with `tillandsias-plan validate-yaml`, revert individually\n     — caught an unescaped quote that broke 16 files\n  4. re-run the suite, require verdicts UNCHANGED\n     — caught the inverted assertion the validator could not see\n  5. ./build.sh --check\n     — caught the expression-pinning rule the suite could not see\n\nREMAINING: 22 compound (hand, reading pace), ~282 multi-pipe or declined (hand),\n1 site in litmus-observability-convergence-script-shape.yaml deferred to whoever\nowns that test. Plus the packet's untouched inventory: 212 shell scripts, 57\nSKILL.md snippets, 39 PIPESTATUS sites (highest value — each is a hand-rolled\nworkaround for this defect and each is empty under zsh)."
