packets:
  - packet_id: litmus-mutates-tracked-version-without-kill-safety
    order: 677-33be
    status: ready
    desired_release: v0.5
    priority: p2
    title: "test-image-build-convergence writes 0.0.0-test-retag into the TRACKED VERSION file — a killed run leaves the tree poisoned and blocks every push"
    kind: bug
    deliverable: scripts/test-image-build-convergence.sh
    depends_on: []
    pickup_role: any
    capability_tags: [litmus, ci, hygiene, versioning]
    context: >
      Hit live 2026-08-11: an instant pre-build litmus sweep was killed
      mid-run (it had exceeded 15 minutes on a Windows host — the same
      per-process-spawn cost class as 675-dkif) and left VERSION containing
      "0.0.0-test-retag" (test-image-build-convergence.sh:104 writes the
      REAL tracked file and restores it only on a clean exit path). The
      poisoned VERSION then failed release-preflight monotonicity inside the
      pre-push hook, blocking every push with
      "blocked:version-not-monotonic" until a human connected the dots and
      restored the file. A test that mutates tracked project files owns
      their restoration under EVERY exit, including SIGTERM/SIGKILL of the
      runner.
    exit_criteria:
      - >
        The test either stops mutating the tracked VERSION (copy the tree
        into its tmpdir and mutate there), or installs a trap-based restore
        covering EXIT/INT/TERM plus a stale-sentinel check at test START
        that restores a leftover 0.0.0-test-retag before running.
      - >
        A grep over scripts/ and openspec/litmus-tests/ finds no other test
        writing to tracked worktree paths without the same protection;
        offenders found are listed or fixed in the closing event.
    events:
      - ts: "2026-08-11T03:45:00Z"
        event: filed
        summary: >
          Filed from live damage during the overnight drain (cycle 5): a
