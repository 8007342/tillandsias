      - "NEGATIVE CONTROL: a real .rs under crates/ naming 3129 still flips the guard to its routed branch, and the NOT ROUTED caveat still violates in that case — the fix narrows WHICH FILES are searched, not WHAT is asserted; pre-fix result: PASSES, must keep passing"
      - "the guard keeps searching crates/ only and does not start searching build.sh (the dev proxy is a different proxy, per the scope comment at :47-55); pre-fix result: PASSES, must not regress"
