packets:

  - packet_id: skills-second-source-of-truth
    order: 631-wpkd
    status: ready
    desired_release: v0.5
    priority: p1
    title: "13 skills exist only under .claude/skills/, so other harnesses cannot see them"
    kind: bug
    deliverable: skills/
    depends_on: []
    pickup_role: any
    capability_tags: [skills, harness, distribution, consistency]
    context: >
      The documented layout says every runtime reaches skills through a symlink to
      canonical `skills/`, "so there is exactly one source of truth". Verified false
      2026-08-09 while auditing for 630-vpmq:

        .claude/skills/  10 symlinks + 14 REAL directories
        canonical skills/  12 entries
        13 skills exist ONLY in .claude/skills/: build-macos-tray, haiku-delegate,
        and the 11 openspec-* skills
        other harnesses: .opencode 21, .codex 19, .github 19, .gemini 9

      The consequential one is `build-macos-tray` — a macOS BUILD skill visible only to
      Claude-harness agents. A macOS agent running under opencode, codex or gemini simply
      does not have it, which silently changes what that host can do based on which
      harness launched it. `haiku-delegate` is likewise Claude-only, and it happens to
      contain the delegation doctrine 630-vpmq generalizes.

      The divergent per-harness counts (21/19/19/9) suggest this drifted gradually rather
      than by decision.
    exit_criteria:
      - >
        Every skill intended to be cross-harness lives in canonical `skills/` and is
        reached by symlink from each runtime, as the layout section already claims.
      - >
        Skills deliberately scoped to ONE harness are documented as such, with the reason.
        Harness-specific is a legitimate choice; undocumented divergence is not.
      - A check that fails when a real directory appears where a symlink is expected.
    verifiable_closure: >
      A script enumerates each runtime's skills/ and reports any entry that is a real
      directory rather than a symlink into canonical skills/, exiting non-zero on an
      undeclared one.
    notes: >
      Do NOT bulk-move the openspec-* skills without checking whether they are intentionally
      Claude-scoped — they shadow the opsx:* slash commands and may be harness-coupled by design.

