        (2) The dominant epic (forge-local-experts, 48 packets = 62% of all grouped work)
        has tag cohesion 0.110 against a 0.041 random baseline — 2.7x — so selecting it
        buys almost no cohesion and the selector has been emitting the very scatter it was
        written to prevent, wearing an epic label. Anchor-tag buckets score far better
        (credentials 0.261, experts 0.180, mcp 0.176).
        (3) `kind` carries real urgency by REVEALED preference: bugs/fixes are 39.4% of
        completed but 20.1% of backlog while implementation is 8.7%/22.1% — drained 2-3x
        faster than accrued. Only 6 of 312 completed packets ever carried a priority.
        Proposes anchor-tag grouping with a five-term score, priority demoted to the
        SMALLEST term and never defaulted. Also found: replay evaluation is possible (1005
        ledger commits, 100 claim+completed pairs) but precision@K would measure agreement
        with the incumbent scorer, so cohesion and starvation are the honest metrics.
        Data defects: 17 empty titles, 12 empty deliverables, mixed-type `order`, 6 prose
        `pickup_role` values, two incompatible event schemas.
        NOT IMPLEMENTED BY DESIGN — the incumbent was shipped on the intuition this
