    title: |
      Four tillandsias-headless unit tests fail on a native Windows host on bare trunk (path separators, a launch-marker probe, a token-rotation count), so `cargo test -p tillandsias-headless --bin tillandsias` on Windows is never green
    context: |
      Measured on yolanda-windows 2026-10-12, natively (cargo test -j 2 -p tillandsias-headless --bin tillandsias), on bare trunk 1e3d977ba. Found while running the suite for 776-drwr (PR #369): 721 passed, 4 failed, and the same four fail one at a time on bare trunk, so they predate that change.
        1. msg_serve::tests::forge_lane_labels_and_mount_args (msg_serve.rs:1423): the expected mount string joins the temp dir with '/' ("...\.tmpX/lanes/alpha-w1"); the code builds it with the platform separator ("...\.tmpX\lanes\alpha-w1").
        2. tests::opencode_web_browser_spec_is_built_with_typed_podman_flags (main.rs:31398 on trunk): expects source=/tmp/tillandsias/ca/intermediate.crt; on Windows the CA path is built with '\'.
        3. tests::shared_stack_launch_marker_lifecycle_and_own_exclusion (main.rs:26991): "sibling probe must see the held marker launch-marker-test-<pid>, got []". The marker the test holds is invisible to the probe on Windows (locking/visibility differs).
        4. vault_bootstrap::tests::github_token_auto_rotation_concurrent_checks_exchange_once (vault_bootstrap.rs:6797): "exactly one exchange", got 2. The concurrency guard does not serialise on Windows, or the test's harness does not.
      None of these is known to be a product defect on Linux, where the gate runs them. Items 3 and 4 may hide real Windows behaviour (marker visibility, token-exchange dedup), which is worth deciding before any of them is cfg-skipped.
    exit_criteria:
      - 'on a native Windows host, cargo test -p tillandsias-headless --bin tillandsias reports 0 failures, with each of the four either fixed (separator-agnostic assertion or code) or skipped by name off Linux with the reason in the skip'
      - 'items 3 and 4 each record whether the Windows behaviour is a product defect (and file it if so) before any skip'
