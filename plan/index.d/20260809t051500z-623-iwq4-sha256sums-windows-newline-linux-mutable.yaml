packets:
  - packet_id: sha256sums-windows-missing-trailing-newline
    order: 623-iwq4
    status: completed
    desired_release: v0.5
    priority: p1
    title: "SHA256SUMS-windows append corrupted two entries (no trailing newline)"
    kind: bug
    deliverable: .github/workflows/release.yml
    depends_on: [unstable-release-channel-and-landing-simplification]
    pickup_role: linux
    capability_tags: [release, checksums, windows, ci]
    context: >
      Found by VERIFYING the published v0.4.260809.1 artifacts rather than by reading the
      workflow. scripts/build-windows-tray.ps1 writes release-artifacts/SHA256SUMS-windows
      with NO trailing newline. The 621-2re2 alias step appended the two portable-alias
      checksums with `>>`, which concatenated the first appended entry onto the last
      existing one:

        <hash>  tillandsias-tray-0.4.260809.1-windows-x64.zip<hash> *tillandsias-windows-x64.zip

      `sha256sum -c SHA256SUMS-windows` cannot read that line. The damage is not limited to
      the new alias: it destroyed a PRE-EXISTING entry for the versioned zip that had
      verified correctly in every prior release, and the file is Cosign-signed, so the
      corruption is signed and published. README's documented verification step
      (`sha256sum -c`) fails on it.

      Nothing in the pipeline noticed, because nothing verified the checksum file it was
      about to sign. That is the actual gap — the newline is just the trigger.
    outcome: >
      Normalize the trailing newline before appending, then run `sha256sum -c
      SHA256SUMS-windows` in the same step so the job FAILS rather than publishing a
      checksum file that cannot verify. Pinned by a new step in
      litmus:smoke-release-channel-shape.

      v0.4.260809.1 keeps the corrupt file — a signed asset cannot be repaired in place
      without invalidating its Cosign bundle. Superseded by the next daily, which carries
      the fix.
    verifiable_closure: >
      For the next release: `curl -sL <base>/SHA256SUMS-windows | sha256sum -c -` passes
      against the downloaded Windows artifacts, and every line of the file parses.
    events:
      - ts: "2026-08-09T05:15:00Z"
        event: completed
        summary: >
          Newline normalization + pre-publish `sha256sum -c` verification added to the
          alias staging step; litmus step added. Found by downloading and verifying the
          published artifacts, not by code reading.
