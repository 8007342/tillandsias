packets:
  - packet_id: a-forge-agent-waits-once-for-the-event-it-cares-about-instead-of-polling-tools
    order: 2080-g7gw
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    story: forge-events-v05
    capability_tags: [mcp, diagnostics, events, rust]
    estimated_hours: 5
    title: |
      Forge agents cannot ask what happened or wait for it; the lane MCP socket offers a blocking wait(correlation or event types, timeout) that returns the completion event with no intermediate calls, and a forge never receives an event whose source is a sibling forge.
    context: |
      Judge 1 packet 4 (operator request 2026-10-18), blind events design. host_tools.rs has no events, state or wait tool. Event viewing must not disturb services (2026-11-11 idle ruling): wait is served from the host's existing event bus, never by polling the services. Sibling isolation per forge-log-visibility-ruling.
    exit_criteria:
      - 'the three ignored 1779-sq9g fixtures in mcp_socket.rs run un-ignored and pass'
      - 'a fixture starts an image ensure, calls wait once and receives the completion event with zero intermediate tool calls'
      - 'a forge cannot obtain an event whose source is a sibling forge'
    verifiable_closure: 'cargo test -p tillandsias-headless mcp_socket with the 1779-sq9g fixtures un-ignored; red today'
    next_action: 'Nothing is done. Remove the ignore attributes, watch them fail, implement wait on the existing event bus.'
    provenance: blind-design judge 1; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
    related: [1779-sq9g, 1799-dav6]
    events:
      - {type: filed, ts: '2026-11-11T18:58:30Z', host: macuahuitl-fedora, summary: filed p1 from the 2026-11-11 blind-design triage}
  - packet_id: forge-event-reads-carry-a-cursor-that-reports-a-gap-and-a-snapshot-call
    order: 2080-gqc4
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    story: forge-events-v05
    capability_tags: [mcp, events, rust]
    estimated_hours: 3
    title: |
      An agent that reads events cannot tell it missed some; every read returns a cursor, a read from an expired cursor returns an explicit gap with the count lost, and a snapshot call returns current state so the agent can resynchronise.
    context: |
      Blind events design, judge 1 packet 4.
    exit_criteria:
      - 'a fixture overflowing the buffer between two reads gets gap with a non-zero count, then a snapshot; today no cursor exists'
    unscoreable: 'unpinnable-until-the-guard-exists: the overflow fixture is the deliverable.'
    next_action: 'Nothing is done. After 2080-g7gw defines the event read.'
    provenance: blind-design judge 1; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: [a-forge-agent-waits-once-for-the-event-it-cares-about-instead-of-polling-tools]
