  - packet_id: language-models-are-pulled-by-digest-from-a-register-onto-a-read-only-mount
    order: 2080-i5qu
    status: ready
    kind: enhancement
    priority: p2
    desired_release: v0.6
    pickup_role: linux
    story: forge-events-v05
    capability_tags: [supply-chain, models, inference, licence]
    estimated_hours: 5
    title: |
      images/inference/entrypoint.sh runs ollama pull by tag with no register row or licence record, and the model cache is mounted read-write into the engine; models come from a shipped register by digest, the mount is read-only except during a pull, and an unregistered model is refused with model_refused. Security Low to Medium.
    context: |
      Merges judge 1 packet 15 and judge 2 G9. Studio weights already go through restricted_fetch (register row, sha256, licence gate). Register is Lua data; the gate is Rust.
    exit_criteria:
      - 'the entrypoint refuses a model absent from the register; after a pull the stored manifest digest equals the register''s; podman inspect shows the cache mount read-only outside a pull; today any tag is pulled read-write'
    unscoreable: 'unpinnable-until-the-guard-exists: the refusal fixture is the deliverable.'
    next_action: 'Nothing is done.'
    provenance: blind-design judges 1 and 2; filed by macuahuitl-fedora, triage 2080-294s.
