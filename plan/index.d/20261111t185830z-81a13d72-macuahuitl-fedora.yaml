  - packet_id: a-forge-agent-asks-one-status-tool-what-is-happening-and-when-to-retry
    order: 2080-hrvi
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.6
    pickup_role: linux
    story: forge-events-v05
    capability_tags: [mcp, forge, observability, rust]
    estimated_hours: 4
    title: |
      Each lane tool invents its own retry_after; one status tool on the lane socket returns own-forge state, the containers the forge started and curated states of shared services with retry_after_s, using only enums, bounded numbers, registered names and the caller's own ids.
    context: |
      Judge 2 G12. Fits the existing socket; no new process. Shared services may be on another fleet host (multi-machine ruling 2026-11-11); the state names the service, not a local container id.
    exit_criteria:
      - 'tools/list on a lane socket includes the status tool and a second forge''s ids never appear in its result; today no such tool is listed'
    unscoreable: 'unpinnable-until-the-guard-exists: the tool fixture is the deliverable.'
    next_action: 'Nothing is done.'
    provenance: blind-design judge 2; filed by macuahuitl-fedora, triage 2080-294s.
