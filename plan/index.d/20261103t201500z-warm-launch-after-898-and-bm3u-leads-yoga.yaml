  - packet_id: a-ca-key-that-no-longer-matches-its-certificate-is-reissued-not-served-to-the-proxy
    event:
      type: note
      ts: '2026-11-03T20:15:00Z'
      host: yoga
      summary: |-
        Root-cause leads, read and measured on yoga after the reboot; not yet a cause:
        (1) ca_key_store.rs is unchanged between v56.11.3.1 and trunk, and Store::refill only returns an entry sealed against the exact certificate bytes on disk (unseal_entry). So a refill alone cannot have produced the pair.
        (2) The CA dir and key changed at 11:26-11:27, before any tray this session started (~11:29): the journal shows a `tillandsias` process (pid 143641) connecting to oo7-daemon at 11:26:50, and a localhost tillandsias-git container started at 11:26:44. The boot-time launcher is not identified yet.
        (3) Fedora 45 serves the Secret Service through oo7-daemon, replacing the backend the 09:01 seal wrote to. A keyring that did not take the seal leaves an older entry behind (see memory two-credential-channels-on-yoga: the yoga keyring was dead before the upgrade).
        (4) In the CA mint, seal() publishes the key BEFORE `rename(tmp_crt, crt)`. A mint that dies between the two leaves exactly a new key under the old certificate. That fits the 11:27 key with the 09:01 cert and is the next thing to prove red-first.
