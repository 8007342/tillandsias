          ramp and the 687 cloud-only UX (same clone-from-mirror path).

  - packet_id: forge-image-slow-layer-plus-container-step-telemetry
    order: 691-raj8
    status: ready
    desired_release: v0.6
    priority: p2
    title: "Add a fourth 'slow' image layer and per-step container-creation telemetry, so aggressive ephemeral create/destroy stops paying for slow components"
    kind: infra+telemetry
    deliverable: a slow-components image layer split out of the rolling/semi-stable/volatile stack + per-step container creation timing telemetry surfaced like the 682 set
    depends_on: []
    pickup_role: linux
    capability_tags: [forge, image-layers, telemetry, ephemeral, performance]
    context: >
      OPERATOR DIRECTIVE 2026-08-11: as the loop adds container create/destroy
      to every cycle (ephemeral contract), the slow parts of image build must
      leave the per-cycle critical path. Current layering: a slow-rolling
      STABLE layer (dnf-installed), a SEMI-STABLE cached-contents layer, and a
      VOLATILE always-fresh layer (which now includes project checkouts, per
      687). Add a distinct SLOW-COMPONENTS layer so those heavy/rarely-changing
      pieces are built once and excluded from rebuilds, making liberal
      create/destroy cheap. Pair it with TELEMETRY: track container-creation
      time at INDIVIDUAL STEPS to see which steps are slow (candidates for the
      slow layer or for async-at-launch), surfaced in the handoff like the 682
      timing: line. Consider doing slow steps ASYNCHRONOUSLY at container launch
      where correctness allows. FUTURE (scope note, not this packet): if the
      host's own bandwidth becomes the bottleneck, add a local caching proxy on
      this host via an IDEMPOTENT toolbox script so other hosts discover it
      immediately — file as a follow-on when bandwidth telemetry shows it.
      This is the measurement half the operator asked to have first: instrument,
      identify the slow steps, THEN restructure — measure before you optimize.
    exit_criteria:
      - per-step container-creation timing is captured and surfaced (rolling view like cycle-metrics timing:), naming the slowest creation step, best-effort so instrumentation never fails a launch
      - a fourth 'slow' image layer exists, built independently of the rolling/semi-stable/volatile layers, containing the heavy rarely-changing components the timing data identifies; rebuilds of the volatile layer do not rebuild it
      - a create/destroy cycle measurably drops in wall-clock after the slow layer is split out, shown by the new telemetry across before/after
      - async-at-launch is applied to any slow step where it is proven safe, or a reasoned note records why each remaining slow step must stay synchronous
    events:
