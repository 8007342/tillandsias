packets:

  - packet_id: forge-clone-fails-git-alias-unresolvable-at-start
    order: 691-ssw9
    status: ready
    desired_release: v0.5
    priority: p1
    title: "Forge git clone dies fatal when the tillandsias-git mirror alias is not yet DNS-resolvable — no clone, no delegate, no cloud-only checkout"
    kind: fix
    deliverable: forge waits for the mirror alias to be resolvable + serving before cloning, with bounded retries and a loud non-fatal timeout, not a one-shot fatal
    depends_on: []
    pickup_role: linux
    capability_tags: [forge, git-mirror, enclave-dns, startup-race, ephemeral]
    context: >
      OPERATOR-WITNESSED 2026-08-11 night (first stage-0 delegate launch): the
      OpenCode window was DOA — "went through cloning retries, something failed
      and died, git mirror unreachable." journald root cause (local 15:48 PDT =
      22:48Z): tillandsias-tillandsias-forge ran
      `git clone git://tillandsias-git/tillandsias` and got repeatedly
      `fatal: unable to look up tillandsias-git (port 9418) (Name or service
      not known)`, then `[forge] FATAL: git clone failed ... The git mirror
      service is unreachable or has not finished initialising`; meanwhile the
      MIRROR CONTAINER WAS ALIVE, mid startup retry-push seeding upstream, and
      only after the forge gave up did git-service log "shutting down". So this
      is NOT the mirror being down — it is a STARTUP-ORDER / DNS-ALIAS RACE: the
      forge clones before the `tillandsias-git` network alias (port 9418) is
      resolvable/serving on tillandsias-enclave, and treats an unresolvable
      alias as FATAL instead of waiting. This blocks EVERYTHING downstream:
      stage-0 in-forge delegation (689-zwzm) cannot run — a delegate that can't
      clone validates nothing (proximate cause of 690-2kwd) — and it will bite
      the 687 cloud-only tray UX identically, since that clones from the mirror
      on EVERY project open. Likely interacts with the shared-alias retirement
      (659-8faj) and opaque per-project hostnames (606-bvnp D13): the fix must
      wait on whatever alias the launcher actually assigns, not a hardcoded name.
      Note the ephemeral contract makes this HOTTER: create/destroy every cycle
      means the mirror-ready-before-forge-clone ordering is paid every launch,
      so it must be robust, bounded, and loud — never a silent one-shot fatal.
    exit_criteria:
      - the forge clone waits for the mirror alias to be BOTH DNS-resolvable AND serving git (a real ls-remote/reachability probe, not sleep) before cloning, with bounded retries
      - on genuine mirror-absence after the bound, the failure names the cause and the elapsed wait, and does not tear down a still-initialising stack prematurely
      - a fixture reproduces the race (forge started against a not-yet-resolvable mirror alias) and proves the forge now converges instead of fatal-exiting
      - verified live: a fresh stack launch clones successfully on first try across N consecutive create/destroy cycles (ephemeral-contract stress), zero DOA windows
    events:
      - type: filed
        ts: "2026-08-11T23:00:00Z"
        agent_id: linux-mutable-session-20260811
        host: linux_mutable
        summary: >
