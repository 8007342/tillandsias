    title: "CorridorKey's 33-file weight set becomes admissible to the restricted fetch only after three operator rulings: the NVIDIA licence text pinned, which file kinds are admitted, and whether storage.googleapis.com joins an egress tier"
    context: |
      Needs the operator; do not build any part until the operator rules on it (coordinator macuahuitl-fedora 2026-11-10). FOUND by yoga taking 2068-ypgq: no fetcher can admit the shipped set (licence-register-restricted.tsv and images/imagegen-corridorkey/weights.tsv at aebc92e31).
      (1) LICENCE TEXT. 29 of 33 rows are nvidia/C-RADIOv4-SO400M under nvidia-open-model-license with licence_sha256 pending:<developer.download.nvidia.com PDF>; admit_restricted_row never admits a pending row, so studio_key::call refuses consent_required for every project. Someone must fetch and read the NVIDIA Open Model License, pin its hash, and class its obligations (NVIDIA_UNREAD in licence_consent.rs says they are classed from memory).
      (2) FILE KINDS. ALLOWED_SUFFIXES is .safetensors and .gguf (ruling 2026-11-10). The set also has 27 .py/.json files (C-RADIO trust_remote_code modules and configs), vfms/moge/model.pt (a pickle), and the RVM .npz (numpy, which can hold pickled objects). Coordinator default: .json data may be admitted; .py code and .pt/.npz pickles are converted or refused, as Demucs is (2068-eeti). The operator decides.
      (3) EGRESS. RVM is the GCS object storage.googleapis.com/representations4d/...npz, and storage.googleapis.com is in no tier (images/proxy/tiers/model-hubs.txt). Adding it widens egress for every image that declares the tier.
    exit_criteria:
