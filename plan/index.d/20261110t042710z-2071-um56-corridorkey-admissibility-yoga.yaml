      - "With the rulings applied, admits_restricted admits the CorridorKey set for a project holding a matching acknowledgement, and the 2068-ypgq fetch writes every admitted file where studio_key's missing_weights looks, so studio_key::call reaches the job. Pre-fix result: FAILS, consent_required on the pending C-RADIO rows."
