    order: 1004-5f7p
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: windows
    capability_tags: [rust, windows, wsl, runtime, testing, fail-loud, diagnostics]
    estimated_hours: 4
    depends_on:
      - diagnose-reports-healthy-during-a-total-outage
    title: |
      On Windows, `--provision-once` reports Ready and exits 0, then WSL2 idles the guest out within a minute and `--diagnose` reports it exactly like a provision that never came up.
    context: |
      FOUND by esme-windows during the v56.9.2.1 floor smoke
      (plan/issues/smoke-e2e-findings-v56.9.2.1-2026-09-04.md, packet
      smoke-finding/windows-ready-not-durable-after-provision-once,
      discovered 2026-09-04T06:55:00Z by /smoke-curl-install-and-test-e2e).

      EVIDENCE, kept as measured:
        - target/smoke-e2e/03-provision-exit.txt — provision_exit=0, VM Ready, wire up
        - poll at 10 s interval immediately after a clean --provision-once:
          t+8s reachable=true exit=0  ->  t+48s reachable=false exit=1
        - target/smoke-e2e/05-final-diagnose.json — distro_running:false,
          wire.error: hvsocket open: AF_HYPERV connect to WSL VM (vsock 42420)
          failed: WSA_ERROR(10060), exit_code: 2

      REPRO:
        - tillandsias-tray.exe --provision-once (exits 0, "VM Ready — control wire up")
        - wait ~60 s with no tray resident, then
          tillandsias-tray.exe --status-once --json -> exit 1

      ANALYSIS (esme's, adopted): --provision-once is documented to provision and
      exit, so nothing holds the guest open; WSL2's idle timeout then shuts the
      distro down and the vsock control wire dies with it. Reproduced three
      times. The consequence for THIS runbook is sharp: the skill mandates the
      health check as the last step after the last mutating step, and on
      Windows that check reads DEGRADED for a release that provisioned
      perfectly — the health check as written cannot express "Ready, then
      correctly idle". Two things need deciding and they are different:
      (a) whether a headless --provision-once should leave the guest resident
      or say plainly that Ready is momentary, and (b) whether --diagnose should
      distinguish "never came up" from "came up, then idled out" — today both
      are exit 2 with distro_running:false, and only the log tail tells them
      apart.

      SAME CLASS AS 980-ja2m ON macOS
      (packet diagnose-reports-healthy-during-a-total-outage). Measured the
      same night on tlatoanis-macbook-neo: a dead VM (clean SIGTERM, and again
      after SIGKILL of the tray) is byte-identical in --diagnose --json to a
      live one except vm_owner_live, and both exit 0 — twenty keys identical,
      one bit differs, the exit status cannot tell a running forge from a
      corpse. Windows fails the same way in the other direction: the idled-out
      guest is byte-identical to a FAILED provision. On both platforms the
      support tool has two states where the substrate has three. The fix here
      SHOULD SHARE THE EXIT-CODE GRAMMAR with 980-ja2m: one distinct code for
      came-up-then-idled-or-died, distinct from both healthy and
      never-provisioned, so a smoke on any lane can assert the third state
      with the same check. The macOS packet owns the grammar; this one applies
      it to the Windows lane and adds the WSL-specific idle-out evidence.

      Provenance: measured by esme-windows on the floor host during the
      v56.9.2.1 smoke; the macOS twin measured by tlatoanis-macbook-neo;
      relayed by and filed by the coordinator (macuahuitl).
    next_action: |
      Decide (b) first, it is cheap and it unblocks every future Windows smoke:
      give --diagnose a third state (or a last_ready_ts key) so an idled-out
      guest is not reported identically to one that failed to provision, using
      the exit code 980-ja2m assigns to provisioned-but-not-live. Then revisit
      (a): decide and document whether headless --provision-once leaves the
      guest resident, and if it does not, make the smoke's final health check
      accept Ready-then-correctly-idle as green.
    exit_criteria:
      - --diagnose on Windows reports a third state, or a last_ready_ts key, so an idled-out guest is not reported identically to a failed provision
      - the third state uses the same exit code 980-ja2m assigns to provisioned-but-not-live, and the exit status alone tells never-came-up from came-up-then-idled
      - the smoke's final health check on the Windows lane can express Ready-then-correctly-idle and reads green for a release that provisioned cleanly
      - whether headless --provision-once should leave the guest resident is decided and documented in the CLI help and the smoke skill, with the reason
      - verified by the repro above on a Windows host, pasting the --diagnose --json output and exit code at t+8s and after idle-out
    unscoreable: >
      No litmus drives a Windows guest through idle-out today, and the two bound
      diagnose litmi (litmus:windows-tray-diagnose-cli-surface,
      litmus:macos-tray-diagnose-cli-surface) pin the CLI surface, not the
      guest's lifecycle. The intended pin is a fixture on the Windows lane that
      provisions once, waits past the WSL2 idle timeout, and asserts --diagnose
      reports the third state with its distinct exit code; whoever takes this
      should write it as the closing arm and bind it under the windows-tray
      diagnose spec.
