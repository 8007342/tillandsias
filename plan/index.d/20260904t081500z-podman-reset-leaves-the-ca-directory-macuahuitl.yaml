packets:
  - packet_id: podman-reset-leaves-the-ca-directory
    order: 1004-qdys
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [testing, smoke, ca, enclave, clean-room]
    estimated_hours: 3
    owned_files:
      - skills/smoke-curl-install-and-test-e2e/SKILL.md
      - skills/build-install-and-smoke-test-e2e/SKILL.md
      - scripts/test-smoke-reset-clears-ca-dir.sh
    title: |
      `podman system reset --force` does not make a clean room: the CA directory lives outside the
      podman store, survives the reset, and the "fresh" init re-uses it instead of generating.
    context: |
      MEASURED by pirria-cachyos on 2026-09-04 during the v56.9.2.1 floor smoke
      (skills/smoke-curl-install-and-test-e2e, Steps 2 and 3). The reset PASSED
      and the store-is-empty assertion PASSED, and the room was not clean:
        - /tmp/tillandsias-ca/ survived `podman system reset --force` with
          intermediate.crt/key and vault.crt/key dated 2026-09-03 23:40 —
          mtimes that PREDATE the 06:42 `--init` by seven hours.
        - the fresh `tillandsias --debug --init` then REFRESHED its podman TLS
          secrets (tillandsias-vault-tls-cert, tillandsias-vault-tls-key,
          tillandsias-vault-tls-ca) FROM that pre-existing material rather
          than generating it: 03-init.log carries the refresh lines, not
          generation lines.
      So the enclave that the smoke certified as "from a pristine state" was
      wired with a CA minted the previous evening by a different install.

      WHY THE RUNBOOK DID NOT CATCH IT. §2 of the smoke runbook
      (skills/smoke-curl-install-and-test-e2e/SKILL.md, "Confirm afterward
      that the store is empty", the block after the reset at ~line 262)
      asserts `podman ps -aq`, `podman volume ls -q` and `podman images -q`
      are all empty and calls that pristine. The CA directory is not a podman
      object; it is a plain directory on the host filesystem, so the reset
      never touches it and the assertion never looks at it. The clean-room
      claim is therefore NARROWER than the runbook states: it is "the podman
      store is empty", not "the runtime has no prior state". Any --init defect
      that only appears with a genuinely fresh CA (first-generation paths,
      secret creation rather than refresh, trust-install on first run) is
      invisible to this smoke on every host that has run an init before —
      which is every smoke host.

      WHY A HARDCODED /tmp WOULD REOPEN THE HOLE. 998-3z6g
      (ca-bundle-moves-to-a-durable-directory) moved the declaration in
      images/default/ca-path.txt to `${HOME}/.local/state/tillandsias/ca`;
      the fix (44a33f328) is in tree and UNRELEASED — v56.9.2.1 still ships
      the /tmp CA, which is why pirria saw /tmp/tillandsias-ca. The next
      release moves it. A destruction step written as `rm -rf
      /tmp/tillandsias-ca` would go green on that release while the surviving
      CA sat at the new location, and nothing would say so. The destruction
      step must resolve the directory through scripts/lib-ca-path.sh — the
      single declaration 998-qrwu / 975-rsgm built so that no script carries
      a literal — and remove whatever that resolves to. Note the lib's
      surface: it exports TILLANDSIAS_CA_DIR when sourced (there is no
      ca_dir() function today, the finder's shorthand names the resolution,
      not a symbol), and it FAILS LOUD when the manifest is unreadable
      rather than falling back to a literal; the destroy step must inherit
      that refusal, not swallow it. scripts/check-ca-path-literals.sh already
      polices literals in scripts; the runbook prose is where this one would
      hide.

      The same asymmetry exists in the sibling runbook
      (skills/build-install-and-smoke-test-e2e §2, line 16 names the same
      `podman system reset --force` as the Linux reset), so both destruction
      steps are in scope; the fixture below is what keeps them equal.

      Provenance: measured by pirria-cachyos on 2026-09-04 (v56.9.2.1 smoke,
      02-reset.log / 03-init.log), relayed by the coordinator, who filed it.
    next_action: |
      Whoever takes this: write the fixture FIRST. It sources
      scripts/lib-ca-path.sh under a scratch HOME (and, in a second case, an
      explicit TILLANDSIAS_CA_DIR), seeds a fake intermediate.crt/key and
      vault.crt/key there, runs the runbook's destruction step, and asserts
      the resolved directory is gone — and that with the manifest unreadable
      the step refuses rather than deleting nothing and passing. Then add the
      CA removal plus a `test ! -e "$TILLANDSIAS_CA_DIR"` assertion to §2 of
      both runbooks, next to the store-is-empty assertions, and add to §3 a
      grep of 03-init.log that FAILS on the refresh-from-existing lines. Ask
      pirria to re-run Steps 2-3 as the second regime once it lands; the
      first regime is a host at/after 44a33f328 where the path is under
      ${HOME}/.local/state.
    exit_criteria:
      - |
        the smoke runbooks' destructive reset removes the directory scripts/lib-ca-path.sh resolves,
        never a hardcoded /tmp or ${HOME} path
      - |
        the post-reset --init generates fresh CA material and 03-init.log proves it, with no
        refresh-from-existing lines for the three tillandsias-vault-tls-* secrets
      - |
        a fixture asserts the destroy step removes whatever the lib resolves TILLANDSIAS_CA_DIR to,
        under both the manifest default and an explicit override, and refuses when the manifest is
        unreadable
      - |
        the §2 store-is-empty check also asserts the CA directory is absent, so the "pristine" claim
        covers what the reset does not
    unscoreable: >
      The runbook's destruction step is prose today: no existing litmus or scripts/ arm runs the
      smoke's reset against a seeded CA directory (litmus:proxy-ca-key-not-world-readable and
      litmus:forge-runtime-ca-trust inspect the material, not its removal, and
      scripts/check-ca-path-literals.sh polices scripts, not skill bodies). Naming an arm that does
      not exist would be the dead-reference failure recorded three times on 2026-09-03. The intended
      pin is the fixture in the third exit criterion — scripts/test-smoke-reset-clears-ca-dir.sh,
      bound as a pre-build instant litmus — and it is the first thing the taker should write; once
      it exists a later fragment can declare it as this order's verifiable closure.
