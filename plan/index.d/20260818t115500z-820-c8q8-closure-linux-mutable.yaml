# Closes 820-c8q8 and files a latent budget bug found while testing it.
packets:
  - packet_id: sub-second-litmus-budgets-become-no-timeout-at-all
    order: 827-uh6t
    status: ready
    desired_release: v0.5
    priority: p3
    kind: bug
    title: "a litmus step declaring timeout_ms below 1000 gets NO timeout at all — integer division floors it to 0, and GNU timeout treats 0 as 'disabled'"
    deliverable: "a sub-second budget either works or is refused; it must not silently become unbounded"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [litmus, ci-gates, fail-loud]
    estimated_hours: 1
    context: |
      OBSERVED 2026-08-18 while trying to force a real timeout to verify
      820-c8q8. I set a step to `timeout_ms: 1` expecting an instant kill; the
      step ran to completion instead.

      scripts/run-litmus-test.sh computes
        local timeout_sec=$(( step_timeout_ms / 1000 ))
      so any budget under 1000ms floors to 0, and GNU coreutils documents
      "a duration of 0 disables the associated timeout". A step declaring
      `timeout_ms: 500` therefore runs UNBOUNDED — the opposite of what its
      author asked for, and the failure mode is a wedged gate rather than a
      fast red.

      NOT LIVE TODAY: I checked the corpus and no litmus step declares a
      sub-second budget, so nothing is currently unbounded. This is filed as
      the latent case, at p3, because the next person who writes a genuinely
      fast assertion will reach for `timeout_ms: 250` and get silence.

      The honest fix is probably to keep sub-second precision (`timeout` accepts
      fractional seconds like `0.25s`) rather than to refuse the value.
