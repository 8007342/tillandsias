      summary: >
        status 'completed'. A timed-out step now reports the host's runqueue against its
        core count at kill time and classifies the cause. THE PACKET'S OWN PROPOSAL WAS
        PARTLY WRONG AND SAYING SO IS THE POINT: it suggested reporting "the step's own
        elapsed time and its budget" first, and asked whether duration alone already
        separates the two classes. It cannot, by construction — a killed step always
        elapses its budget, so 41s/30s and 0s-starved both print as ~30s/30s. The
        discriminating signal is the one the packet listed second: load. Implemented as
        three outcomes — SATURATED (runqueue > cores; "re-run before treating this as a
        regression"), NOT saturated ("this step is genuinely too slow for its Ns budget"),
        and UNCLASSIFIED when neither loadavg nor a cpu count is readable, which is named
        rather than guessed. The verdict is unchanged in every case: the step still FAILS,
        because a step that cannot finish inside its budget on this host has not passed.
        Reading is portable — /proc/loadavg then sysctl vm.loadavg, nproc then hw.ncpu — and
        the comparison is scaled-integer because bash 3.2 has no floats and bc is not
        guaranteed.
      evidence_refs:
        - "scripts/run-litmus-test.sh: exit_code 124 branch gains a load classification"
        - "all three branches exercised against the script's OWN extracted case block: load 40.5/20 -> SATURATED, 0.40/20 -> NOT saturated, unknown -> UNCLASSIFIED"
