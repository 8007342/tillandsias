# Ledger fragment — append-only, IMMUTABLE once written.
# Written by: macos-tlatoanis-macbook-air-fable5-20260812t043302z
#
# 625-jd5f criterion 2 ("new milestones are filed where a coherent theme exists
# but no milestone does"), plus the release_target assignments for the children.
# The assignments use the LWW field channel (642-fedr) — re-declaring the
# packets under `packets:` would be a G-Set no-op and silently do nothing.
packets:

  - packet_id: fail-loud-diagnosis-milestone
    order: 700-nz4n
    status: ready
    desired_release: v0.5
    priority: p1
    title: "MILESTONE: every correct diagnosis the system already makes must actually STOP something"
    kind: milestone
    deliverable: plan/index.yaml (criteria holder; children carry the work)
    depends_on: []
    pickup_role: any
    capability_tags: [fail-loud, ledger, gate, observability, methodology]
    context: >
      FILED FROM EVIDENCE, NOT FROM A THEORY. Over one night on macOS
      (2026-08-11/12) eight defects were found across three unrelated
      subsystems — the credential path, the exec wire, and the plan ledger's own
      write path — and every one had the same shape:
      THE SYSTEM DIAGNOSED THE PROBLEM CORRECTLY AND THEN DID NOTHING THAT
      STOPPED ANYONE.
      - `tillandsias-plan check` prints "fragment does not parse and was SKIPPED
        — its contents are not in the answers below" and exits 0, so a packet
        reached origin existing in git and in no answer (698-7n6q).
      - `build.sh --check` passes every check and then warns it could not record
        the stamp, so the whole gate silently runs twice (695-nvnd).
      - `set-field --evidence` writes an accurate status and an event that
        contradicts it, caught only by a later checker, after the commit
        (696-6byc).
      - The guest emits a liveness heartbeat every 30s that proves the wire
        while the work is dead, and the host's only wait-report fired on a
        needle match — so a deadlocked login was externally identical to a
        healthy slow one for 70 minutes (689-y2my, 690-eug2).
      - Timing telemetry exists, is wired, and produces no record; the metric
        that names the cycle's slowest step reads `absent` forever (697-s3by).
      - The Vault partial-init guard's own comment says it exists to prevent
        destroying the stored GitHub token, and — because its predicate is
        evaluated where the evidence cannot exist — it destroyed it on every
        bootstrap for two weeks while every login reported success (694-mhz8).
      THE COMMON FAILURE IS NOT DETECTION. It is that a correct detection was
      wired to a warning, a log line, a heartbeat, or nothing at all, instead of
      to something that refuses. Each fix this night was the same edit in
      different clothes: make the existing, already-correct diagnosis stop
      something.
      WHY A MILESTONE AND NOT A CHECKLIST. These packets are individually small
      and land in unrelated crates, so flat priority order scatters them across
      cycles and none of them ever looks urgent alone. Grouped, they are one
      property with one acceptance test, which is exactly what `release_target`
      is for (625-jd5f: the tier already exists and is 34% populated; do not add
      a third object).
      SCOPE DISCIPLINE FOR CLAIMANTS. A fix belongs here only if the system
      ALREADY detects the condition correctly. Adding a new detector is a
      different packet. And a fix must not convert a local mistake into a fleet
      outage — see 698-7n6q's diff-scoping rationale and its residual 699-dycj:
      "stop the author" and "tell everyone" are different mechanisms and both
      have a place.
    outcome: >
      No correct diagnosis in the loop's own machinery or the guest exec path
      terminates in a warning nobody is required to act on.
    exit_criteria:
      - "each child either fails loud at the point of detection or records, in its own events, why a warning is the right disposition for that case"
      - "no child's fix red-gates a host for a condition that host did not author (the 698/699-dycj split is the pattern)"
      - "every child carries a NEGATIVE CONTROL proving the new refusal can still distinguish the healthy case, so 'fail loud' cannot degrade into 'refuse everything' (bar-raise 634-39ik)"
      - "a cheatsheet or methodology entry records the class itself, so the next detector added anywhere is wired to a refusal by default rather than to a log line"
    events:
      - type: filed
        ts: "2026-08-12T04:33:02Z"
        agent_id: macos-tlatoanis-macbook-air-fable5-20260812t043302z
        host: macos
        summary: >
          Filed under 625-jd5f criterion 2 after confirming no existing v0.5
          milestone covers it: convergence-velocity and local-telemetry are both
          v0.6 (a cross-release release_target would make an incoherent batch
          look cohesive), architecture-audit-epic is scoped to four named
          audits, and credential-lifecycle-audit is about credentials LEAKING
          into lanes — the opposite direction from 694-mhz8, where one was
          destroyed. Assigning to any of them would have been the "wrong epic is
          worse than none" error 625-jd5f warns about.

