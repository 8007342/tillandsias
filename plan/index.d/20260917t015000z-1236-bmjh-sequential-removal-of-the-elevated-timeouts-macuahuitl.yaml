      - 'each restoration is a SEPARATE change that names which part of the fold cost it depended on, so a fix that returns four of five is visible as such rather than as a failed sweep'
      - 'every ELEVATED banner is removed with its timeout — a restored budget carrying a warning about an elevation that no longer exists is worse than no warning, because the next reader cannot tell which are live'
      - 'NEGATIVE CONTROL: a genuinely hung or genuinely wrong producer still reds at the restored budget, so returning the numbers does not trade one blind spot for another'
      - 'no step added between the raise and the removal inherits 300000 by copying these — the banners forbid it, and the check is that any NEW step at 300000 carries its own measured justification'
