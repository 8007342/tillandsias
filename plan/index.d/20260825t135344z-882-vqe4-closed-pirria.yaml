      summary: |
        THE GUARD AGAINST INVISIBLE WORK WAS MADE BLIND BY ROUTINE GARBAGE
        COLLECTION. The detector counted a packet's activity with a grep over
        plan/index.d/*.yaml. Compaction folds fragments into plan/index.yaml,
        so its window was "since the last fold" — and the longer a packet is
        worked, the more likely its evidence has been folded and the more
        confidently it was called abandoned.

        Measured on the live ledger at 7247c2a94:

          packet     events the detector saw   events that existed
          865-n8vq            0                       35
          831-ezea            0                        1

        865-n8vq is a p0 the COORDINATOR had pushed progress into four times
        that day, most recently 106 minutes before the detector called it
        stranded. 641-e2qa built this check because an in_progress packet is
        invisible in BOTH directions; reporting the best-tended packet in the
        ledger as neglected inverts it and dilutes the genuine strandings in
        the same list. The skill's instruction to watch whether "the count is
        rising cycle over cycle" was unusable while the count tracked
        compaction age rather than neglect.

        IT HAD ALREADY COST A FALSE ALARM — this host's own 07:43Z loop-status
        entry escalated 865-n8vq on this evidence, about work in flight that
        morning. That is why it was worth a packet rather than a note: a wrong
        signal that reads as authoritative gets acted on.

        FIXED BY ASKING THE THING THAT ALREADY FOLDS. A second grep against
        plan/index.yaml would have been the same defect one storage location
        later, so the fold moved into the binary as `plan-events` — the
        704-zcgi rule that the copy has to go, not just the instance. That the
        subcommand did not exist was itself the finding the skill's
        "if the loop needs it repeatedly, that is a missing tool" predicts.

        THE TRUE POSITIVE IS PINNED, NOT JUST THE FALSE ONE. Arm 3 asserts that
        a claim with no events anywhere still reports stranded; without it this
        fix could have "succeeded" by deleting the feature. Arm 5 pins the
        property that was actually violated — run, compact, run again, verdicts
        identical. Arm 6 reproduces the pre-fix blindness so arm 1 cannot pass
        by luck.

        A GUARD IN THE GATE CAUGHT ME MID-FIX, and it is worth recording as a
        win for the gate rather than a stumble of mine: adding a dispatch arm
        without a usage entry failed `every_dispatch_arm_is_documented_in_usage`
        with "a subcommand nobody can discover might as well not exist". That is
        exactly the orphaned-capability shape 865-n8vq's guard-activation
