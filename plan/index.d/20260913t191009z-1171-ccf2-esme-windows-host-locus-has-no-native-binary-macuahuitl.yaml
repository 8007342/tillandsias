    title: |
      esmeraldinha's windows-host locus has never had a native Windows tillandsias binary (the release installs only the tray; the checkout carries only an ELF that exits 126 there), so host-capability-probe.sh --fragment exits 2 from Git Bash and the locus cannot publish; after 1154-8ywc the guard correctly reports the row expired and names a remedy that cannot run where the verdict fires. Closing it needs either a Windows-native headless build produced by the capable Windows host and installed on esme, or the probe accepting the installed tray binary if it exposes the capability surface. yolanda decides which is cheaper.
    context: |
      MEASURED on esme 2026-09-13 (compile-free lane): the probe's rc 2, both
      .exe paths absent, the ELF's 126, the guard's stale verdict with age
      1866506 s, and the remedy's impossibility at that locus. lenovinha is
      landing the honest minimum meanwhile (a stderr line naming the
      constraint, stdout grammar untouched), which documents the gap rather
      than closing it. Two substitutes declined by esme and recorded so
      nobody tries them: publishing from the distro derives bare-metal and
      mints a third locus; `--locus windows-host` from inside the distro
      stamps the guest's hardware with the host's label, and the capability
      matrix ROUTES on these rows. Declining the row is defensible; it leaves
      that locus permanently unpublishable and its row permanently expired.

      WHAT TO BUILD, yolanda's choice: (a) a Windows-native release build of
      tillandsias-headless on yolanda, installed on esme at the path the
      probe resolves (the debug ELF is 249 MB, so a release build), with the
      installed-binary path added to the probe's resolver if it is not
      target/; or (b) if the installed tray (tillandsias-tray.exe) exposes
      the capability probe surface, the probe resolves it as a candidate on
      Windows. Either way the closure is esme's own measured
      `ok:capability-row-current:esmeraldinha`.
