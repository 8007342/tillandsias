  - packet_id: greedier-batch-selection-larger-sequential-batches
    order: 682-yiz7
    status: ready
    desired_release: v0.5
    priority: p2
    title: "Let non-forge cycles drain LARGER sequential batches to amortize meta-orchestration overhead — decide + implement the budget"
    kind: research+implementation
    deliverable: methodology/distributed-work.yaml cycle_batch_triage budget policy + select-work-batch --budget default + evidence
    depends_on: [packets-consumed-per-cycle-telemetry]
    pickup_role: linux
    capability_tags: [batch, orchestration, throughput, methodology, overhead]
    estimated_hours: 3
    context: >
      Operator hypothesis (2026-08-11): meta-orchestration per-cycle overhead
      (fetch, guards, boundary, merges, handoff, gate, push, attest) is a
      relatively fixed cost, so draining LARGER batches per cycle would make
      that overhead relatively smaller. CURRENT STATE: packets ARE grouped in
      stories (release_target milestones = epics; 171 packets carry one) and
      consumed in batches — select-work-batch picks ONE cohesive epic and up
      to `budget` packets (budget=3 non-forge, 1 forge per order 264). The
      operator wants greedier: raise the non-forge budget and/or drain
      MULTIPLE sequential batches per cycle. IMPORTANT design tension to
      resolve, not ignore: the batch selector deliberately picks ONE epic to
      stop scatter (the anti-pattern in its own header) and forge is
      deliberately budget=1 (order 264, Tlatoāni ruling "OPPOSITE of greedy",
      to fit the 600s litmus envelope). So "greedier" should mean LARGER
      budget WITHIN one cohesive epic (or drain-until-envelope), NOT more
      unrelated epics — preserving cohesion while amortizing overhead. Gate
      the decision on the 682-epud packet-flow evidence (measure overhead
      ratio first). Forge stays budget=1 unless the operator re-rules 264.
    exit_criteria:
      - a measured overhead-ratio (682-epud) justifies a specific non-forge budget; select-work-batch default budget updated; methodology records the new policy and that forge budget=1 stands (or is re-ruled by the operator)
      - a cycle drains the larger batch within one epic without the scatter the selector guards against
    events:
      - ts: "2026-08-11T07:15:00Z"
        event: filed
        summary: >
          Filed from the operator's greedier-batching directive; scoped to
          larger-within-epic to preserve the anti-scatter design, evidence-gated
          on 682-epud.

