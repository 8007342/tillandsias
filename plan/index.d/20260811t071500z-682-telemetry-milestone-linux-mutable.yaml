    status: ready
    release_target: local-telemetry-for-bottleneck-finding-milestone
    desired_release: v0.6
    priority: p2
    title: "Multihost-orchestration semantically distills + buckets the per-host append-logs into a committed summary"
    kind: implementation
    deliverable: a distillation step in /multihost-orchestration that folds per-host telemetry into bucketed, committed metrics
    depends_on: [all-mcp-servers-emit-usage-telemetry, build-and-test-duration-telemetry]
    pickup_role: linux
    capability_tags: [telemetry, crdt, distillation, coordination, multihost]
    estimated_hours: 4
    context: >
      The append-logs are per-host ephemeral /tmp — non-aggregatable by
      design (operator: "anonymous non-aggregateable telemetry"). A host doing
      /multihost-orchestration during its cycle collapses them: read each
      host's log, bucket by tool/server/phase/day, distill into a committed
      summary (like the plan-fold but for metrics), then the raw logs can
      rotate. CRDT property: bucketing is commutative/idempotent so concurrent
      hosts converge. This is the "collapsing of metrics into buckets" the
      operator described.
    exit_criteria:
      - a distillation step produces a committed bucketed metrics summary from per-host logs; running it twice or on two hosts converges to the same buckets; a litmus pins idempotence
