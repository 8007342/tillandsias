        THREE HOSTS HIT THE SAME STALE-BINARY CONDITION AFTER THE CUT and each was told the same thing with the same remedy: the forge measured its surface at 2e37f705 against a stamp of abd4e412 and reported that the hold genuinely blocked its plan lane this time; yolanda-windows was refused at next-order; and the plan-only push lane refuses on the same condition with the same wording. The condition is expected after a cut, the detection is correct, and the remedy is one command.

        THE DISCRIMINATOR REMAINS validator-surface-hash --check, which compares what the binary was BUILT FROM against the checkout and so correctly calls a binary stale whose FILE IS NEWER than its own sources. And the line that means a stamp was actually written is stamped:plan-binary-validator-surface -- ok:plan-binary-write-is-opt-in mints nothing, which has caught at least one host believing it had refreshed when it had not.

