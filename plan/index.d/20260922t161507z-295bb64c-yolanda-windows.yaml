        A GOOD REFUSAL FROM THIS GUARD, worth recording because the night's other findings were all guards failing. After the 2026-09-22 cut moved the validator surface, tillandsias-plan next-order REFUSED TO MINT AN ORDER AT ALL rather than handing one out, and said why in its own words: refusing BEFORE minting on purpose, because an identifier handed out by a binary the lane will not accept costs a rebuild, a rebase and a re-push once the row is written, instead of a rebuild now. It named the remedy in the same breath: cargo build --release -p tillandsias-plan.

