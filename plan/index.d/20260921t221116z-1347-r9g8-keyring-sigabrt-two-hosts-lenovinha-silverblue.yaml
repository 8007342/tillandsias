    title: |
      gnome-keyring-daemon SIGABRTs on a Secret Service GetProperty whose D-Bus client vanished, on TWO fleet hosts, taking the credential channel down mid-gate
    context: |
      TWO HOSTS, THREE CRASHES, ONE STACK. Not a local accident and no longer
      explainable as one, which is why this is filed now rather than after a
      third host.

      MACUAHUITL (coordinator's report): SIGABRT 2026-09-20 17:37:30 PDT and
      2026-09-21 14:48:03 PDT, both mid-gate.
      LENOVINHA (measured here from coredumpctl and the journal): SIGABRT
      2026-09-21 14:42:03 PDT, pid 3600, exactly six minutes before the
      coordinator's second. The journal at that instant, verbatim:
        gnome-keyring-daemon[3600]: gkd_secret_service_get_pkcs11_session: assertion 'client' failed
        gnome-keyring-daemon[3600]: secret_objects_lookup_gck_object_for_path: assertion 'session' failed
        audit[3600]: ANOM_ABEND ... comm="gnome-keyring-d" sig=6 res=1
        GLib-GIO:ERROR:../gio/gdbusconnection.c:4765:invoke_get_property_in_idle_cb: assertion failed: (error != NULL)
      Frames: g_assertion_message_expr <- invoke_get_property_in_idle_cb
      (libgio-2.0.so.0). Module gnome-keyring-daemon from rpm
      gnome-keyring-50.0-1.fc44.x86_64. The two hosts' text matches line for
      line.

      WHAT IT MEANS. A Secret Service GetProperty is answered in an idle
      callback; by the time it runs, the D-Bus client is gone, so the session
      lookup asserts and GLib's property path then asserts on a NULL error and
      calls abort(). The trigger is a client that disappears mid-read.

      THE SUSPECT ON OUR SIDE, because the kill is ours even if the assert is
      not. scripts/check-credential-channel.sh bounds two probes with
      `timeout`, which sends SIGTERM: `_ccc_timeout 15 gh auth status` and
      `_ccc_timeout 20 gh api user`. Under a gate's load a cap can expire and
      TERM `gh` while it is mid-keyring-read. On macuahuitl the analogous
      client was their own PR watch (`timeout 30 gh pr list` every 120 s), now
      unauthenticated curl.

      A NEGATIVE RESULT, MEASURED, THAT THE NEXT PERSON MUST NOT MISREAD. I
      tried to reproduce it here: four `gh` calls killed by `timeout 1`
      (`gh api user` x3, `gh auth status` x1), each returning rc=124, and the
      daemon's pid was UNCHANGED across all four with no new coredump. So the
      kill ALONE is not sufficient. BUT THIS HOST'S COLLECTION WAS ALREADY
      LOCKED when I ran it: `gh` was hanging on a locked collection rather than
      reading a serving one, which is very likely why nothing asserted — the
      code path that aborts needs a live client session to lose. The honest
      reading is that the mechanism is UNREFUTED and untested, not that it is
      disproven, and that the reproduction needs an unlocked host. It does,
      however, argue against the self-perpetuating loop that was proposed
      (locked collection -> gh hangs -> cap kills it -> daemon aborts again):
      four attempts in exactly that state produced no abort.

      THE COST, so the priority is not mistaken for alarm. When it fires, the
      host's credential channel drops to missing:no-credential-channel mid-gate,
      `git push` to the https remote fails outright and `gh` returns HTTP 401,
      and the fleet loses a lander. The rule that makes it expensive rather than
      merely annoying is 1025-a896: no agent may re-auth, because a re-auth on
      one host evicts the operator's token on every other host. So a crashed
      keyring is unrecoverable by any agent and waits for the operator.

      WHAT KEPT THIS HOST WORKING, and why this is p0 rather than p0-blocking:
      the mirror push lane (1313-prin) carried a work ref to GitHub during the
      outage, credential-free. Pushes survive; the GitHub API does not, so a
      host in this state can push refs but cannot open or land pull requests.
