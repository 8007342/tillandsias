events:
  - packet_id: spec-index-builder-stages-into-256mb-tmpfs
    event:
      type: progress
      ts: "2026-09-03T01:19:05Z"
      agent_id: linux-yoga-claude-20260903t010911z
      host: yoga
      summary: |
        FIXED. The builder now stages beside the INDEX ROOT rather than in the
        ambient TMPDIR, and the ENOSPC verdict names the directory that ran out.

        THE REASONING THAT PICKS THE DESTINATION, because "somewhere bigger" is
        not a rule: the staged payload and the published index GROW TOGETHER —
        this host stages ~92 MB of vectors for a 22.7k-chunk corpus — so the
        filesystem that can hold the RESULT is the one that can hold the WORKING
        SET. Anchoring to $INDEX_ROOT makes capacity a property of the code
        instead of a property of the ambient environment, which is what let a
        forge inherit a 256 MB tmpfs it never chose.

        DELIBERATELY NOT native_scratch_dir(), and this is the part worth
        keeping. That helper looks like the obvious reuse and would have
        REPRODUCED the bug: it answers "is this worktree on a SLOW filesystem,
        and where should scratch live for speed", and by design it returns the
        caller's fallback on fast native Linux — which is exactly the forge case
        here, so it would have handed back /tmp. Speed and capacity are
        different properties and a helper that answers one must not be
        conscripted to answer the other. Reuse is right when the QUESTION
        matches, not when the shape does.

        TILLANDSIAS_SPEC_INDEX_TMPDIR overrides, honoured on existence and never
        probed for size — the same rule 967-xq5e's endpoint derivation applies
        to an explicit endpoint: probing an override collapses "you named the
        wrong one" into "there is none".

        FALLBACK KEPT ON PURPOSE: if the index root cannot be written, staging
        degrades to the old TMPDIR path with a named warning rather than
        refusing. A host whose index root is momentarily unwritable is worse off
        with no build at all than with the pre-964-zedm behaviour, and arm 5 of
        the test is the negative control against a "fix" that simply deleted the
        old path.

        CRITERION 3 — the verdict now NAMES the cause. It printed
        `blocked:spec-index:payload-failed` and nothing else, while jq's own
        "No space left on device" went to stderr with no path attached, so the
        reader learned that a payload failed rather than that a 256 MB tmpfs they
        never chose was full while the index root had 1.2 TB free. It now prints
        both directories with `df -Ph` free space and names
        TILLANDSIAS_SPEC_INDEX_TMPDIR as the remedy. Same lesson as 965-sxec's
        refusal this cycle: a diagnosis that cannot be acted on is one nobody
        acts on.

        VERIFIED. scripts/test-spec-index-staging-capacity.sh 6/6, wired into
        ./build.sh --check because the defect is invisible on any host with a
        roomy /tmp — which is every host that runs the gate. Arms: staging
        anchored to the index root; a REGRESSION arm asserting the ambient-TMPDIR
        form is not reachable before the index-root form (it survives only inside
        the fallback); the override exists; the verdict names both directories,
        their free space, and the remedy; the fallback still exists and is not
        silent; and a live run through the real script with the override set.

        THE DECISIVE LIVE CHECK, on this host: with TMPDIR pointed at a
        NONEXISTENT directory the build completed —
        `spec-index:delta reused=22860 embed=7 of 22867`,
        `ok:spec-index:built:22867`, rc=0. Under the old code that is exactly the
        condition that produced `blocked:spec-index:no-tmpdir`. Staging no longer
        consults TMPDIR at all, which is a stronger property than "TMPDIR is big
        enough here".

        SCOPE NOT CLAIMED, and criterion 2 is the honest gap: I did not run this
        on a host whose /tmp is a real 256 MB tmpfs, because creating one needs
        root and this host has a roomy /tmp. The unusable-TMPDIR run above
        demonstrates the mechanism — the builder does not use TMPDIR — but a
        forge should still confirm the closure as written: a cold build from
        first launch publishing vectors.jsonl, with `experts-probe` moving to
        l1=ready. Pairs with 965-sxec, also closed this cycle: both were ways the
        forge lane silently failed a step that passes everywhere else, and both
        needed a forge to notice and a non-forge to fix.
