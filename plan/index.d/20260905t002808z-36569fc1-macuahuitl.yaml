        OPERATOR DECISION (2026-09-05T00:3xZ, verbatim in substance): "We had some credential issues around before, we'll keep the host count under 10 for now." Recorded as the operating constraint. Coordinator's note for whoever reads it: the documented cap is ten TOKENS per user per OAuth app (per scope set), and what mints a token is a LOGIN, not a host: every `gh auth login` or `gh auth refresh` on a bare host, inside a forge, a toolbox, a WSL distro or a guest VM counts, so keeping named hosts under ten holds only if each host logs in once and keeps its token, and forges and guests use the repo-local store helper rather than minting. Nothing measured today contradicts a count-based cap once the survivors' true mint dates are unknown (hosts.yml mtime is not a mint date; refresh re-mints without touching it), and the three casualties were the three hosts that re-minted most; the standing rule stays: no login anywhere a token works, one login per host, the security log as the instrument for the mechanism. Eight named hosts today (macuahuitl, lenovinha, yoga, yolanda, esmeraldinha, macbookair, macneo, pirria).
