  title: The ci-full stale plan-binary refusal prints a remedy that rebuilds the binary it checks, not one in build.sh's shared target dir
  context: 'macuahuitl 2026-11-01, ./build.sh --ci-full for 56.11.1.2: ci-full-plan-binary refused stale-after-rebuild and printed cargo build --release -p tillandsias-plan. Run as printed, that command builds into the shared CARGO_TARGET_DIR build.sh exports, while the copy the check reads is the worktree''s own target/release/tillandsias-plan, so following the remedy can never clear the refusal. A refusal whose remedy cannot make it pass is a dead end (1247-amcu).'
  exit_criteria:
  - 'A fixture runs the check with a stale binary at the path it reads, runs the printed remedy verbatim in the same environment, and re-runs the check; it must pass. Pre-fix result: FAILS, the second check refuses again.'
  verifiable_closure: 'Fixture transcript before and after. Pre-fix result: FAILS.'
  unscoreable: 'unpinnable-until-the-guard-exists: the fixture lands with the fix (1136-n8sh).'
  next_action: 'Make the check and its remedy name one path: print CARGO_TARGET_DIR=<the dir the check reads> with the build command, or check the binary the shared build produces.'
