        WHAT SHIPPED. A bounded busctl probe before the guard's final fall-through answers blocked:gh-keyring-locked when a collection reports Locked=true, with a remedy that names UNLOCK and says explicitly not to re-auth, citing 1025-a896. This is the guard's own documented distinction — blocked:* means the channel EXISTS but cannot be used, missing:* means it is absent — applied to the one state that had no arm.

        A SECOND DEFECT FOUND WHILE READING THE PATH, and fixed in the same commit: gh auth status was the ONE unbounded call left in this guard. Against a locked keyring it does not fail, it BLOCKS, waiting on an unlock no unattended session can answer — measured past 120s on lenovinha 2026-09-14, which is why the credential check itself had to be killed during that cycle. Order 988 already required every probe here to be bounded and explained why; this call was simply missed. It now runs under _ccc_timeout 15 with GH_PROMPT_DISABLED=1, matching the gh api user arm below it.

        NEGATIVE CONTROLS KEPT, and they are the arms that matter: a host with no busctl (macOS, the forge), a host whose secret service does not answer, and a host with an unlocked collection all still read missing:no-credential-channel. Absence of the probe is never evidence of a lock, and the probe never fires on a healthy host.

        FIXTURE scripts/test-credential-channel-names-a-locked-keyring.sh, 8/8, hermetic — stub busctl and stub gh on PATH inside a scratch repo, so the fixture's verdict is identical on a locked host, an unlocked host and a service-less one, and no arm consults this host's real keyring. FALSIFIED rather than assumed: reverting the new arm to the old echo drops it to 7/8 and reproduces the pre-fix missing:no-credential-channel exactly.

