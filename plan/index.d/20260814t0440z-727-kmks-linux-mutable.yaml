      host: linux_mutable
      summary: |
        AUDIT COMPLETE across the remaining runbooks, with the packet's own
        measured scope corrected first. The filed count of 87 candidate sites
        came from a grep whose `which ` term matched the ENGLISH WORD. Measured
        three ways: 87 loose, 49 in command position, 21 inside ```bash blocks.
        meta-orchestration — the runbook every host runs every cycle, and the
        file the count made look second-worst at 22 — has ZERO external-command
        gates in executable position. All 22 were prose. That is not
        bookkeeping: a 6h estimate built on 87 sites, most of them English, is
        what makes an audit keep getting deferred for being large.

        Round 1 (601-462g) found defects that extracted a VALUE and trusted it
        (`gh … --jq '.[0].x'` renders an empty set as the string `null`). Round 2
        found the same failure one layer down: steps that extract an EXIT STATUS
        and lose it, because a pipeline exits with its LAST command's status and
        this repo's house style pipes every step through `| tee` for evidence.
        The habit that makes the runbooks auditable is the habit that discards
        their exit codes.

        Five fixes: build-install-e2e's `command -v tillandsias | tee` and
        `tillandsias --version | tee` (a missing binary wrote two empty evidence
        files and passed, three lines below a build step that already captured
        PIPESTATUS); its macOS `codesign --verify --deep --strict | tee` (a
        signature failure written to the log and discarded); smoke-curl's
        destruction gate (reset failure exited 0, and "All three should be
        empty" was an instruction while its sibling runbook asserted the same
        thing executably — on the path that tests PUBLISHED releases); and
        smoke-curl's `tillandsias --version | tee # must equal $SMOKE_TAG`,
        where the comment is now a grep. That last one means the clean-room test
        of a published release had never once confirmed it was running the
        release it claimed to test — a stale binary already on PATH would answer
        --version and pass.

        Remaining unguarded `| tee` lines are evidence capture with no gate
        (git rev-parse, du -sh, container listings). Gate versus evidence IS the
        classification, which is why a blanket "capture PIPESTATUS everywhere"
        rule would be wrong.

        NO executable guard for this class, deliberately, and recorded as a
        known gap: a checker for "a `| tee` whose left side is a gate" needs a
        list of which commands are gates, and every version of that list is a
        guess — two of these three were gates only because of what the runbook
        does NEXT with them. A checker whose false positives train people to
        ignore it is the failure 731-d89b's narrowing was written to avoid.

