# Recovery fragment, linux_mutable 2026-08-15: a fresh-Windows-install forge
# (codex lane) lost two local commits to an upstream 403 the credential guard
# could not see. The forge serialized its state before teardown; this fragment
# recreates the lost packet EXACTLY (order token 756-hn3a was minted by the
# forge and is permanent — recreated, not re-minted) and files the fixes.
# Evidence event appended to order 424 in the same commit. Operator smoke
# narrative: plan/issues/windows-fresh-install-smoke-2026-08-15.md.
packets:
  - packet_id: canonical-agent-identity-source-without-hostname-utility
    order: 756-hn3a
    status: ready
    desired_release: v0.5
    priority: p2
    kind: enhancement
    title: "Agent lease IDs depend on an optional hostname executable even though the forge already exposes stable identity sources"
    deliverable: "A canonical agent-identity helper or launch-provided TILLANDSIAS_AGENT_ID consumed by every worker/claim workflow"
    pickup_role: linux
    owner_host: linux
    release_target: forge-local-experts-milestone
    capability_tags: [forge, agents, plan, leases, fail-loud, shell]
    estimated_hours: 2
    context: |
      Recreated from the 2026-08-15 failed-forge handoff (its commits never
      reached the remote). Evidence: the forge image did not contain the
      hostname executable; an ad-hoc claim recipe therefore wrote the lease id
      "forge--codex-20260815t162555z" (empty workstation component). In the
      same process HOSTNAME=forge-tillandsias, /etc/hostname=forge-tillandsias,
      and scripts/mo-full-attest.sh host -> forge — the component was derivable
      without installing anything. There is no canonical full agent-ID helper;
      advance-work-from-plan gives only a prose shape, while platform skills
      independently use HOSTNAME or ask the agent to invent an ID.
      Related: 570 (TILLANDSIAS_AGENT is the harness TYPE, not a unique lease
      identity), 743-mgf3 (robust host-label derivation, reusable), 412 (adding
      hostname to the image is possible but a canonical fallback contract is
      still needed across minimal environments), scripts/mo-full-attest.sh host.
      Preferred fix: inject a complete TILLANDSIAS_AGENT_ID at launch, or one
      canonical repository helper used by every claiming workflow. Precedence:
      (1) explicit TILLANDSIAS_AGENT_ID, (2) stable launch-provided
      host/workstation identity, (3) HOSTNAME, (4) /etc/hostname, (5) portable
      node-name probe. Sanitize once. Refuse before append-event if platform,
      workstation, backend, or timestamp is empty.
    exit_criteria:
      - "A fixture with hostname absent from PATH but HOSTNAME or /etc/hostname present produces a complete stable ID."
      - "A negative fixture with all identity sources absent fails before writing a claim."
      - "The contract is documented in methodology/distributed-work.yaml."
      - "An instant pre-build litmus pins both positive and negative paths."

  - packet_id: forge-upstream-write-readiness-guard
    order: 756-2jnj
    status: ready
    desired_release: v0.5
    priority: p1
    kind: fix
    title: "check-credential-channel.sh 'ok' proves reachability, not authorization — a forge can do a full cycle of work before learning its pushes 403"
    deliverable: "an 'ok' credential verdict in a forge cycle means BOTH forge->mirror reachable AND mirror->upstream currently write-authorized, proven non-mutatingly before worker drain"
    pickup_role: linux
    owner_host: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [forge, git-mirror, credentials, fail-loud, vault]
    estimated_hours: 4
    depends_on: []
    context: |
      Child of order 424 (evidence event appended there, 2026-08-15): a fresh
      Windows-install forge got ok:forge-git-mirror, drained work, and lost two
      commits when the mirror's pre-receive relay hit GitHub 403 ('Permission
      to 8007342/tillandsias.git denied to 8007342'). The verified-ack refusal
      worked as designed; the detection was simply hours too late. The
      operator's words: no shortcircuits, bits of work lost.
      Fix shape (from the handoff, refined): a non-mutating upstream
      write-authorization probe on the mirror side (the mirror holds the
      upstream credential; gh + curl exist in images/git) whose verdict is
      published where the forge can read it; a companion guard consumed at
      forge cycle start alongside check-credential-channel.sh; preserve
      verified-ack (the mirror must keep refusing forge pushes when upstream
      durability is unproven); prefer a permissions/status probe over a
      destructive canary branch.
    exit_criteria:
      - "A mirror-side probe determines current upstream push authorization without mutating any upstream ref, and publishes a falsifiable verdict the forge can read."
      - "A forge-cycle-start guard consumes it: 'ok' is emitted only when reachability AND authorization both hold; the 2026-08-15 403 state yields a loud 'blocked' verdict BEFORE worker drain."
      - "Negative control: with a deliberately unauthorized/absent upstream credential, the guard goes red — pinned by an instant or quick pre-build litmus."
      - "Live closure on a real forge: lease-only commit pushed through the mirror, local HEAD == mirror-exported HEAD == GitHub branch head, check-forge-findings-persisted.sh passes."

  - packet_id: windows-wsl2-remediation-detect-only
    order: 756-dwkm
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "WSL2 preflight detects the missing feature but does not remediate: portable tray failed on launch until a manual install + restart"
    deliverable: "a fresh Windows host without WSL2 is either remediated (consented install + guided restart) at install/first-run time, or fails with the exact actionable command — never a bare launch failure"
    pickup_role: windows
    owner_host: windows
    release_target: stable-milestone-v1
    capability_tags: [windows, wsl2, installer, first-run, fail-loud]
    estimated_hours: 3
    context: |
      Operator smoke 2026-08-15 on a fresh Windows host with no dev tools
      (plan/issues/windows-fresh-install-smoke-2026-08-15.md): the portable
      tray correctly DETECTED that WSL2 was needed but did not install it and
      failed on launch until the operator installed WSL2 and restarted. The
      detection exists; the remediation path does not. Adjacent to the 738-yw6p
      queue's provisioning work and 735-ewzp (control-wire readiness), but this
      is the INSTALL-time UX slice, not the wire probe.
    exit_criteria:
      - "On a WSL2-less host the installer/first-run either performs the consented 'wsl --install' path with a guided restart, or exits before launch with the exact remediation steps; the tray never reaches its generic launch-failure path for this cause."
      - "A fixture (or recorded transcript on the windows host) demonstrates the failing-and-guided path; a WSL2-present host is unaffected."

  - packet_id: windows-installer-restart-claim-accuracy
    order: 756-s8s8
    status: ready
    desired_release: v0.5
    priority: p3
    kind: bug
    title: "curl installer says 'restart required' after adding the account to the hypervisor group, but the tray then launches and provisions fine without one"
    deliverable: "the restart-required message is emitted only when a restart is actually required, and names what breaks without it"
    pickup_role: windows
    owner_host: windows
    release_target: stable-milestone-v1
    capability_tags: [windows, installer, hyperv, ux]
    estimated_hours: 2
    context: |
      Operator smoke 2026-08-15 (same session as 756-dwkm): the Windows curl
      installer reported adding the account to the Hyper-V administrators
      group and demanded a restart; the operator continued without restarting
      and the full flow (launch, token login, git attribution, codex lane via
      device flow) worked. Either the membership was already effective (token
      refresh not needed for this path), the group is not needed for the WSL2
      backend at all, or the requirement is real but latent (breaks some later
      operation) — in which case the message should say WHICH operation.
      Determine which, then make the message conditional and specific.
    exit_criteria:
      - "The installer probes whether the group membership is (a) needed for the selected backend and (b) already effective; the restart message appears only when both needed and not effective, and names the operation that would fail."
      - "The determination (needed-for-what, effective-when) is recorded in the packet outcome with the probe commands."
