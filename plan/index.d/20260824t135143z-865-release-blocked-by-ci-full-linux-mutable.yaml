    packet_id: the-trunk-has-been-unreleasable-for-a-week-behind-a-gate-no-push-runs
    desired_release: v0.5
    title: "833 commits accumulated unreleased because --check runs on every push and --ci-full only at release time"
    status: ready
    kind: defect
    pickup_role: any
    priority: p0
    capability_tags: [ci, release, gates, fleet]
    deliverable: build.sh
    depends_on: []
    estimated_hours: 6
    discovered_by: "attempting the release the operator authorised and finding the gate red"
    context: >
      NO RELEASE IN SEVEN DAYS. The last daily is v0.4.260817.1 (2026-08-17),
      `/releases/latest` still serves v0.4.260810.1 — two weeks old — and
      origin/linux-next is 833 COMMITS AHEAD OF MAIN.

      Every precondition the release skill checks is green: clean linux-next,
      no local-only commits, tray-parity gaps 0, `ok:release-preflight`, and the
      repaired evidence gate now answers `would-promote:v0.4.260817.1`. The
      release stops at `./build.sh --ci-full`, which exits 1 with three failing
      checks.

      THE STRUCTURAL POINT, WHICH IS BIGGER THAN THE THREE FAILURES.
      `--check` runs on EVERY push and is what the pre-push hook enforces.
      `--ci-full` runs at RELEASE TIME and nowhere else. They are different
      gates, so the trunk can accumulate --ci-full failures indefinitely while
      every individual push is honestly green. Nobody is at fault for any one
      commit; the fleet has been pushing correctly into a branch that has not
      been releasable for a week, and nothing said so. A gate that only runs
      when you try to ship tells you it is broken at the worst possible moment.

      THE THREE FAILURES, each checked for whether this host caused it:

      (1) guard-activation — orphans `check-cycle-scheduler.sh` and
          `check-dead-env-branches.sh`: shipped but invoked by nothing.
          population=67 active=65 orphan=2. NOT this host's; neither is a guard
          macuahuitl added.

      (2) markdown-distillation — five noncanonical files outside the
          inventory: AGENTS.md, GEMINI.md, .github/copilot-instructions.md,
          images/default/startup-context-addendum.md, and
          scripts/refusal-calibration/README.md. The last is one macuahuitl has
          edited heavily, but it has been outside the inventory since it was
          created in 85dc1649b — noncanonical from birth, not made so by the
          edits.

      (3) litmus-pre-build — 8 of 324 executed fail (97% pass). Reproduced at
          instant size: litmus:groundtruth-no-mutable-status-pin-shape, and its
          failure is worth the whole packet.

      THE STATUS-PIN LITMUS PINS A STATUS. Its negative control builds a fixture
      pinning `status: ready` on packet 394 and requires
      check-groundtruth-mutable-status-pins.sh to REFUSE it. 394 is now
      `obsoleted` — terminal — so pinning its status is legitimate, the guard
      correctly admits it, and the litmus fails looking for a refusal it can no
      longer earn. Its own header still asserts "394 is ready (non-terminal, a
      trap)". It went terminal in 06d859499.

      So the test written to enforce 680-zphp — never pin status on a live
      packet — pins status on a live packet, and broke exactly as 680-zphp
      predicts. That is not irony worth enjoying; it is the strongest possible
      evidence that the rule needs a mechanism rather than a convention.

      I did NOT attempt the release. The gate is the trunk's only verification
      since push CI was removed (2026-08-03), and forcing past it to ship 833
      unreviewed-by-CI commits would be the worst possible use of the operator's
      standing "a couple of releases a day without my approval".
    exit_criteria: >
      (1) A release-blocking condition is visible BEFORE release time. Either
      --ci-full runs on a cadence with its verdict recorded where the fleet
      reads it, or the delta between --check and --ci-full is named so a host
      knows what its green push did not cover.
      (2) The three current failures are cleared or explicitly waived with a
      recorded reason, and `./build.sh --ci-full` exits 0 on linux-next.
      (3) litmus:groundtruth-no-mutable-status-pin-shape stops depending on a
      live packet's status — the trap it exists to prevent.
      (4) Measured afterwards: a release actually cuts.

