        THE FIX. All three `security` keychain spawns now route through a bounded spawn:
        10s budget, sized against the 30s status path it sits on, so a keychain call
        fails well inside it and leaves room for the work that follows. The SYNC
        signatures are preserved deliberately — those three fns have 34 callers
        (19/13/2), so bounding inside them costs no caller a change where converting to
        async would touch every one. Scope decided by counting, not instinct.

        THE BOUND KILLS AND REAPS, AND THAT IS WHAT THE TEST ASSERTS. macneo measured
        the failure this guards against on a macOS host this week: a timeout killed the
        PARENT, the `security` grandchild survived at PPID 1 still holding an
        undismissable GUI prompt, one accumulated per call, and a SecurityAgent stayed
        alive 21h45m ignoring SIGTERM until the host was restarted. A test that checked
        only "the call returned inside its budget" PASSES ON EXACTLY THAT — the caller
        is unblocked and the host is left worse than if it had stalled. So
        a_bound_that_fires_leaves_no_surviving_child counts live children by
        `ps -Ao pid,ppid,command` filtered on our OWN pid (never a bare grep for the
        name: macneo's count of that shape was wrong because the grep matched its own
        command line).

        FALSIFIED SURGICALLY: removing ONLY `child.kill()`, keeping the timeout, the
        error and the reap, turns it red. That makes the assertion sensitive to the kill
        SPECIFICALLY rather than to the harness working.

        AND IT FIXED A DEFECT I SHIPPED LAST CYCLE. Criterion 4's zombie test used
        `waitpid(-1)`, which reaps ANY child of the process — in a parallel test binary,
        every other test's children too. It stole the `security` child of
        keychain_persists_credentials_across_calls, whose own wait then failed ECHILD
        "No child processes". Both tests passed ALONE and the suite failed, with the
        failure pointing at the innocent test. Now reaps by captured pid. I found it
        only because I ran the FULL suite this time; last cycle I ran my own test before
        and after and treated that as the selftest rule satisfied. It was not.

        WHY IT IS UNLANDED, and it is NOT a defect in this change: two integration tests
