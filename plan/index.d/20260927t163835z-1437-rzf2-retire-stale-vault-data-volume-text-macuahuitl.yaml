      Replace every remaining `tillandsias-vault-data` named-volume claim (two vault_bootstrap.rs comments and one error message, one main.rs comment, two cheatsheets) with the truth: the store is the host directory `<cache>/vault-data` bound at `/vault/data`; the error's remedy names the directory, not `podman volume rm`
    context: |
      Spec: tillandsias-vault, CORRECTED 2026-09-27 under the storage requirement. The audit for
      1437-8c6p found no such volume has ever existed: launch_vault_container binds
      init_cache_dir()/vault-data, and vault_data_volume_exists checks the directory. The stale
      name matters because a named volume dies in `podman system reset` and a host directory does
      not — the wrong noun produced a wrong survival analysis in the spec itself. The error
      message that tells the operator to run `podman volume rm tillandsias-vault-data` sends them
      to a no-op.

