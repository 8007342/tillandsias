        THE REGIME, made concrete. Same query, this host, both regimes:

          inference LIVE -> "The current Direction is: **forge agents local
                             EXPERTS.**"
          inference DEAD -> "## Direction — what are we all doing today\n\n
                             <!-- Operator-owned thematic direction …"
                             (the raw section, pasted verbatim)

        So `answer_contains: "## Direction"` PASSED on retrieval-only hosts and
        FAILED on synthesising ones. That is the three-round story exactly, and
        it also explains the direction of each host's result rather than just
        that they differed.

        THE SWEEP ITSELF. 18 prose-asserting cases across the four sets. I
        compared each one's ANSWER TEXT under inference-live and
        inference-dead — the regime variable itself, rather than reasoning from
        engine names, which would have misclassified: `plan.answer` serves BOTH
        synthesised answers and deterministic projections.

          EXACTLY ONE case differs: plan-current-direction-bootstrap-question,
          whose answer_contains is already removed (yolanda, d03a58850).
          The other SEVENTEEN are byte-identical across regimes.

        Those seventeen assert deterministic renderer output — `plan next`'s
        tabular projection with its tab-separated rows, typed `unsupported:`
        refusals, fragment-provenance ids and statuses, methodology path
        echoes. Removing them "in favor of substance assertions" would delete
        seventeen real, falsifiable assertions to fix one that was already
        fixed. The property worth enforcing is not NO PROSE, it is INVARIANCE.

        SO THE DELIVERABLE IS A CHECK, NOT A DELETION.
        scripts/check-groundtruth-regime-invariance.sh grades every set twice —
        once normally, once with every inference/embedding endpoint pointed at a
        closed port — and names any case whose VERDICT moves. Verdicts rather
        than answer text on purpose: an answer is allowed to be worded
        differently; what must not change is whether the case passes. 33 cases
        in 3.8s, because the deterministic engines never touch the network.

        Endpoints are pointed at a dead port rather than UNSET, because an unset
        endpoint can fall back to a reachable default — which would make both
        runs the same regime and the check vacuous.

        NEGATIVE CONTROL: reintroducing the EXACT pre-fix assertion
        (`answer_contains: "## Direction"`) is caught by name —
        `violation:groundtruth-regime-dependent:plan-current-direction-bootstrap-question`,
        exit 1 under --strict. This check run locally would have ended all three
        rounds in under four seconds.

        EXIT CRITERION 2 (the 764-p9w7 protection) VERIFIED, and it is the one
        that mattered most: with answer_contains gone, a stale-binary
        `unsupported` envelope still grades the case RED on THREE independent
        substance grounds — confidence expected Retrieved got Unsupported,
        citations expected at least 1 got 0, and no citation satisfying the
