# Filed by linux_mutable (macuahuitl), 2026-08-17: live host-state security
# finding surfaced by the 782-9jfg fork, contained immediately on this host.
packets:
  - packet_id: pre-fix-ca-private-keys-were-never-re-clamped-on-existing-hosts
    order: 791-swxt
    status: ready
    desired_release: v0.5
    priority: p1
    kind: security
    title: "755-qcxh fixed the CODE but left every already-generated /tmp/tillandsias-ca/intermediate.key at 0644 — a world-readable CA private key survives the fix on any host provisioned before it"
    deliverable: "a migration that re-clamps (or regenerates) pre-fix CA material wherever it already exists, so closing the code defect actually removes the exposure from live hosts; plus the same audit for any other artifact 755-qcxh's spec moved to podman secrets"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [security, vault, proxy, migration, host-state]
    estimated_hours: 2
    context: |
      OBSERVED on macuahuitl 2026-08-17 (found by the 782-9jfg fork while
      building the squid bump; not inferred):

        -rw-r--r--  intermediate.key   Aug 14 11:55   <- CA PRIVATE KEY, 0644
        -rw-------  vault.key          Aug 16 03:17   <- post-fix, correct

      The contrast is the proof: the code fix WORKS (material generated after
      it is 0600), and the defect is purely that nothing re-clamped what
      already existed. Any local uid could read a CA private key the enclave
      trusts — the exact capability 755-qcxh was filed to remove — for three
      days AFTER that packet closed. litmus:proxy-ca-key-not-world-readable
      STEP 5 was failing against live host state the whole time while the
      packet read closed.

      Also observed: the RUNNING tillandsias-proxy still bind-mounts the key
      (`/tmp/tillandsias-ca/intermediate.key -> /etc/squid/certs/intermediate.key`)
      and no `tillandsias-ca-key` podman secret exists on this host, so the
      live container predates the secrets path entirely. The next stack
      recreation adopts the fixed shape; nothing migrates the interim.

      CONTAINED ON THIS HOST 2026-08-17 (not the fix, a stop-gap): directory
      clamped to 0700 first (removes traversal for other uids without
      touching the running container's established bind mount), then the key
      and cert to 0600. Proxy verified healthy after both steps and
      litmus:proxy-ca-key-not-world-readable now PASSES live. That is ONE
      host repaired by hand; the packet is the fleet-wide migration, since
      yoga/windows/macOS were provisioned in the same window.
      GENERAL SHAPE worth naming in the fix: a security packet that changes
      how material is CREATED is only half done — the material already
      created is the other half, and it is the half that is currently
      exploitable.
