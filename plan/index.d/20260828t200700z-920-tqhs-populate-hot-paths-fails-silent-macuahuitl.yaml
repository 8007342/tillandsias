packets:
  - packet_id: populate-hot-paths-fails-silent-and-traces-success
    order: 920-tqhs
    status: ready
    desired_release: v0.5
    priority: p1
    kind: fix
    title: |
      populate_hot_paths swallows cp failure then unconditionally traces 'cheatsheets copied', and tellme has no image-bundle fallback — an empty hot mount broke tellme in-lane with a success trace in the log
    deliverable: |
      Verify INDEX.md exists post-copy in populate_hot_paths, trace the
      failure LOUDLY when it does not, and give tellme a fallback to the
      /opt/cheatsheets-image bundle so an empty hot mount degrades to the
      shipped copy instead of a broken CLI.
    pickup_role: linux
    depends_on: []
    capability_tags:
      - linux
      - forge
      - cheatsheets
      - observability
    estimated_hours: 2
    context: |
      OBSERVED in-lane 2026-08-28: an empty /opt/cheatsheets hot mount broke
      tellme while the lifecycle trace claimed success.

      - images/default/lib-common.sh:3152-3159 populate_hot_paths runs
        `cp -a /opt/cheatsheets-image/. /opt/cheatsheets/ 2>/dev/null || true`
        and then UNCONDITIONALLY traces "cheatsheets copied to tmpfs
        (/opt/cheatsheets)" — the copy can fail wholesale and the trace still
        reports success.
      - images/default/cli/tellme:14-24 resolves the cheatsheets dir to
        /opt/cheatsheets (or script-relative fallbacks) but has NO
        /opt/cheatsheets-image fallback, so when the hot copy silently failed
        there was nothing behind it.

      PRIME SUSPECT for the failed copy: root-owned tmpfs mounted under
      --userns=keep-id, leaving the mount unwritable by the lane user — the
      2>/dev/null discards exactly the EPERM/EACCES evidence that would have
      named it. Unverified; the loud trace is what makes the next occurrence
      diagnosable.
    exit_criteria:
      - 'populate_hot_paths verifies $cheatsheets_dir/INDEX.md after the copy and emits a LOUD failure trace (source, destination, cp exit status) when absent — no unconditional success line.'
      - 'tellme falls back to /opt/cheatsheets-image when the resolved dir lacks INDEX.md, and says which copy it is serving.'
      - 'NEGATIVE CONTROL: with a deliberately unwritable /opt/cheatsheets, the entrypoint log names the failure and tellme still answers from the image bundle.'
    events:
      - type: filed
        ts: "2026-08-28T20:07:00Z"
        agent_id: linux-macuahuitl-claude-20260828t195711z
        host: macuahuitl
        summary: |
          Filed during the 2026-08-28 audit-drain: observed empty hot mount
          broke tellme in-lane while trace_lifecycle reported the copy
          succeeded; the 2>/dev/null || true discarded the evidence.
