    title: Should a release freeze be enforced by GitHub itself (a branch ruleset toggled by release-freeze.sh set/clear)? It is real prevention, but it has two named costs
    context: >
      S3 of the coordinator-ruled 1255-s4im shape, filed as a decision and NOT
      implemented. After 1255-s4im S1 (hooks armed without a toolchain) and S2
      (a server-visible freeze audit that refuses the cut), a breach is still
      possible: `git push --no-verify`, `-c core.hooksPath=`, or a host whose
      hook was never armed can still MOVE a frozen branch. S2 detects it and
      stops the cut, but does not prevent it. GitHub can prevent it: a
      ruleset restricting updates to the branch, created by
      `release-freeze.sh set` and removed by `clear`.
      COST 1: the freeze host needs an ADMIN-scoped GitHub credential to
      create/delete rulesets. Today the freeze needs only push access (it is a
      ref under refs/tillandsias/freeze/).
      COST 2: a branch ruleset cannot filter by path on this repository's plan,
      so it would ALSO block the plan-only lane. The freeze design deliberately
      admits that lane ("Plan-only pushes are exempt and still work — that is
      how coordination keeps moving during a cut"). The alternative is a
      bypass list naming every host's identity, which is a second
      administrative surface to keep current.
    exit_criteria:
      - The operator decides whether GitHub-side freeze enforcement is wanted, given both costs. If yes, the decision names who holds the admin credential and whether plan-only pushes may pause during a cut or go through a bypass list.
    unscoreable: |
      decision-pending: needs-operator. The costs are an admin credential on the freeze host, and blocking the plan-only lane during a cut. Both are policy, not implementation.
    next_action: The operator rules. Until then, S2's audit (release-preflight refuses a breached cut) is the server-visible signal.
