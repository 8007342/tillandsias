      summary: |-
        S1 of the coordinator-ruled shape (work/1255-s4im-b). S2, a server-visible freeze audit, follows as its own PR. S3 is filed below as a decision row.
        RED, measured 2026-10-09 on darwin with scratch remotes only (the coordinator confirmed origin holds 0 freeze refs): a fresh clone had core.hooksPath unset and 0 non-sample hooks. `release-freeze.sh set linux-next` gave ok:freeze-set, and a CODE push to linux-next was ACCEPTED (0953ee672..80145ac21). After install-hooks.sh with PATH=/usr/bin:/bin (no cargo), the same push was REFUSED.
        S1:
        - scripts/ensure-hooks.sh is bash-only. It reads the hook git RUNS (--git-path hooks), and takes the current marker from install-hooks.sh. Absent means it installs; our older marker means it upgrades. It REFUSES a foreign pre-push (one with no tillandsias-pre-push marker) and never overwrites it. It refuses a global/system hooksPath. It re-reads the hook after installing, so "installed" means the marker is on disk.
        - --prelude in push-plan-fragments-to-trunk.sh, claim-ledger-node.sh, salvage-dirty-worktree.sh and drain-queue.sh: silent on ok, verdicts on stderr only, always exit 0. It acts only when origin is the GitHub repo, so fixtures stay hookless. TILLANDSIAS_ENSURE_HOOKS=0 disables it and =1 forces it.
        - join-the-fleet step 2 names ensure-hooks. The no-plan-binary refusal in pre-push-main-branch-affordance.sh now names the container route on a host with no cargo (toolbox run --container tillandsias-builder cargo build --release -p tillandsias-plan, or the salvage hand-off). The stub is still 14 lines.
        FIXTURE scripts/test-ensure-hooks.sh, wired into build.sh: 13/13. It covers red->green with no cargo on PATH, idempotent byte-identical, v7->v8 upgrade, foreign refused and byte-identical, local hooksPath honoured with no false gap, global hooksPath refused, and prelude silent/inert/stderr-only/exit-0/disable. A mutation that removed the foreign-hook refusal reds arms 4 and 7d. The existing fixtures of every touched script are green (16 suites).

