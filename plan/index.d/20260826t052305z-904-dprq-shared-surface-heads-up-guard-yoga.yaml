packets:
  - packet_id: shared-surface-change-without-a-recorded-heads-up
    order: 904-dprq
    status: ready
    kind: enhancement
    pickup_role: any
    priority: p2
    desired_release: v0.5
    depends_on: []
    multi_cycle: false
    next_action: Build the diff-level check first and keep it ADVISORY — it must name the touched shared-surface paths and say no heads-up was recorded, never fail the gate. Decide the shared-surface set explicitly (guards wired into build.sh --check, litmus definitions, wire types, shared structs, scripts another lane runs, schemas) and commit it as data rather than a regex. Then a negative control that adds a shared-surface path and requires the advisory to fire, because a guard that cannot fire is the defect this packet is about.
    deliverable: |
      An advisory check that says "this diff touches a shared surface and no
      heads-up was recorded this cycle", so the sibling_heads_up_protocol
      becomes something an agent must DISMISS rather than something it must
      REMEMBER.
    capability_tags:
      - methodology
      - fail-loud
      - all-platforms
    tags:
      - shared-surface
      - prose-not-mechanism
      - v0.5
    title: |
      The sibling heads-up protocol is prose depending on an attentive agent, and its author walked into it four times within an hour of reading it.
    context: |
      FOUND BY AUDITING MYSELF AGAINST THE RULE, not by reasoning about it.
      `sibling_heads_up_protocol` landed at fd18881ed on 2026-08-25 requiring a
      short HEADS UP before changing a shared surface. I read it, audited my own
      night, and found FOUR shared-surface changes landed with zero heads-ups:

        scripts/check-litmus-pin-claims.sh   guard in --check, 4 referencing files
        scripts/check-declared-closures-added.sh  A NEW GATE I WIRED INTO --check
        scripts/check-framing-raw-decodes.sh + baseline  new litmus, bound fleet-wide
        scripts/test-pre-push-empty-ref-list.sh   another host's fixture, in --check

      THE GATE-WIRING ONE IS THE WORST AND I DID NOT THINK OF IT AS A SHARED
      SURFACE AT THE TIME. It runs on every host on every `--check`. Had it been
      wrong, the whole fleet goes red simultaneously and the author is the only
      one who cannot see it, because it is green on their tree. The canonical
      example this protocol was written from (a wire-type skew breaking a
      union) has a smaller blast radius than that.

      NONE OF THE FOUR BROKE A SIBLING, AND THAT IS NOT EVIDENCE OF CARE. I
      verified the call sites AFTER landing them. The union was green because
      the changes happened to be self-contained, not because I established that
      beforehand. Luck presented as diligence is the outcome this packet exists
      to stop being mistaken for compliance.

      WHY A CHECK AND NOT MORE ATTENTION. A heads-up is a falsifiable act and
      care is not: "I considered the siblings" cannot be checked by anyone,
      including its author an hour later, while "I sent a message naming the
      surface and it was ACKed" exists in transcripts and the ledger. The same
      move as the relay-provenance rule — replacing a disposition with an
      artifact. The methodology section itself carries the caveat (903-8wsa)
      that a prose rule depending on an attentive agent is a suggestion, and
      this fleet now has several measured instances of documented traps walked
      into hours after being read. Mine are four of them, in one session.

      NOT THE SAME PACKET AS 903-8wsa. That one joins live CLAIMS to batch
      surfaces at Start Of Cycle — a coordination heuristic carrying
      false-positive risk. This is a diff-level fact requiring no overlap
      inference: these paths were touched, no heads-up was recorded.
    exit_criteria:
      - |
          An ADVISORY check reports when a diff touches a path in the
          shared-surface set and no heads-up was recorded this cycle. It names
          the paths. It never fails the gate — a blocking version would be
          dismissed by disabling it, which is how the prose failed.
      - |
          The shared-surface set is committed DATA, not a regex buried in the
          check, so adding a surface is a reviewable one-line change.
      - |
          NEGATIVE CONTROL: a diff that adds a shared-surface path with no
          recorded heads-up makes the advisory fire; one touching only
          lane-local paths does not. Without both halves this is a check that
          cannot fail, which is the exact class it is being built to police.
      - |
          The recorded heads-up is an artifact the check can read — not a
          judgement it infers.
    verifiable_closure: |
      The negative control above, run in both directions. This packet
      deliberately declares NO `litmus:` name: under 885-92iu a declared
      closure must resolve to a bound, file-backed test, and naming one that
      does not yet exist is the defect that packet closed. Whoever implements
      this creates the test and cites it then.
    events:
      - type: filed
        ts: "2026-08-26T05:23:05Z"
        agent_id: "linux-yoga-opus5-20260826t052305z"
        host: yoga
        summary: |
          Filed at the coordinator's direction after they declined to fold it
          into 903-8wsa. Provenance is a self-audit rather than a proposal: I
          found the failure mode by discovering I had committed it four times,
          within an hour of reading the rule that forbids it.
