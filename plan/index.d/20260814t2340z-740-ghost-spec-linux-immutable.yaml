packets:
  - packet_id: meta-orchestration-spec-is-a-ghost-with-a-100-percent-coverage-claim
    order: 740-k8ef
    status: ready
    desired_release: v0.5
    priority: p1
    release_target: fail-loud-diagnosis-milestone
    kind: bug
    title: "29 artifacts trace to spec:meta-orchestration, litmus-bindings claims coverage_ratio 100 for it, and the spec does not exist"
    deliverable: "either the spec, or a corrected coverage claim — but not a 100% claim over nothing"
    pickup_role: any
    capability_tags: [openspec, traceability, coverage, fail-loud, meta-orchestration]
    estimated_hours: 3
    context: |
      SURFACED 2026-08-14 by the pre-commit OpenSpec hook on tlatoani, which
      refused to stay quiet about a newly added file:

        ✗ OpenSpec: ghost trace 'spec:meta-orchestration' in
          scripts/check-mcp-expert-health.sh:4 — no spec exists

      The hook was right, and the new file was not the problem — it was the
      thing that made an existing fleet-wide condition visible. Measured on the
      same tree:

        29  artifacts carrying `@trace spec:meta-orchestration`
            15  scripts/          (check-credential-channel.sh,
                                   check-committable-branch.sh,
                                   check-forge-expert-base.sh, and 12 more)
            13  openspec/litmus-tests/
             1  plan/
         0  directories named openspec/specs/meta-orchestration
         0  spec files declaring the id anywhere under openspec/specs/

      And openspec/litmus-bindings.yaml says, for that same id:

        - spec_id: meta-orchestration
          status: active
          litmus_tests: [13 entries]
          coverage_ratio: 100
          last_verified: '2026-07-14'

      A 100% coverage ratio is being reported over a spec with no text. The
      thirteen litmus tests are real and they pass — but "coverage" is a claim
      about a spec's requirements being exercised, and there are no requirements
      to exercise. This is the project's own philosophy.yaml objection in its
      purest form: a verification claim that cannot be falsified because it has
      no referent.

      WHY THIS MATTERS BEYOND TIDINESS. The meta-orchestration SKILL.md is
      52,423 bytes and is where the loop's actual contract lives — the exit
      contract, the guards, the attestation grammar, the reduction engine. Every
      guard script traces to a spec id for that contract, and `spec_answer` has
      nothing to return for any of it. An agent asking the expert what
      meta-orchestration REQUIRES gets nothing, then reads the 52KB skill, which
      is precisely the whole-file haul `mcp_first_read_path` exists to stop.

      NOT A NEW REGRESSION, and not caused by the cycle that found it: the same
      ghost trace sits in guards committed long before, and the hook only checks
      newly-added files, so it has been reporting nothing for months.
    outcome: |
      The meta-orchestration contract is either a real spec the traces and the
      coverage number refer to, or the coverage number stops claiming what it
      cannot support. Agents can ask the expert what the loop requires.
    exit_criteria:
      - "Either openspec/specs/meta-orchestration/spec.md exists and carries the loop's normative requirements (distilled from skills/meta-orchestration/SKILL.md, not copied wholesale), or litmus-bindings.yaml no longer claims spec_id meta-orchestration with coverage_ratio 100."
      - "The pre-commit ghost-trace check passes for a NEWLY ADDED file carrying `@trace spec:meta-orchestration` — verify by adding a scratch file, not by inspection."
      - "`tillandsias-plan spec-answer` (or the spec expert equivalent) returns a cited answer for at least one normative meta-orchestration requirement — e.g. the Non-Negotiable Exit Contract or the MO-FULL attestation invariants."
      - "NEGATIVE CONTROL: the ghost-trace check must still FAIL for a genuinely nonexistent spec id (e.g. `@trace spec:not-a-real-spec`). A fix that makes the checker permissive is a regression, not a closure."
      - "Whatever coverage_ratio ends up in litmus-bindings for this id is derived from the spec's requirement count, not asserted."
    notes: |
      Prefer distillation over transcription. The skill is a runbook written for
      an agent mid-cycle; a spec is a set of falsifiable requirements. Copying
      52KB of runbook into openspec/specs/ would satisfy the letter of the first
      exit criterion and make the corpus worse — and it would put the loop's
      contract in two places that then drift, which is the condition
      scripts/check-skills-single-source.sh exists to prevent for skills.

      Check whether other spec ids in litmus-bindings.yaml have the same shape
      before fixing only this one; the audit is probably the cheaper half of
      this packet, and a second ghost would change the fix from "write a spec"
      to "make the binding derive its ids from what exists".
    events:
      - type: filed
        ts: "2026-08-14T23:40:00Z"
        host: linux_immutable
        agent_id: tlatoani-linux-immutable-20260814
        summary: |
          Surfaced by the pre-commit OpenSpec hook while landing 737-zcj5. The
          hook flagged the new file; the measurement showed 29 artifacts and a
          100% coverage claim standing on a spec that was never written.
