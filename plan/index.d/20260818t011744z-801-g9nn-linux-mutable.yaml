      summary: |
        CORRECTION TO THIS PACKET'S OWN PREMISE, and it is the reason no epoch
        was carried. Do not re-file the epoch on the stated grounds.

        THE PACKET SAYS: "a mirror-maintained monotonic EPOCH ... is not a new
        invention here: the mirror already publishes
        refs/tillandsias/upstream-auth/<state>/<epoch> (756-2jnj), so a
        monotonic counter over ref updates is established practice in this
        codebase."

        OBSERVED, by reading the producer: that is wrong on both counts.
          * The <epoch> is a WALL CLOCK, not a counter. Its single producer is
            images/git/probe-upstream-auth.sh:78 — `EPOCH="$(date -u +%s)"` —
            assigned once at process start and never incremented.
          * It counts NOTHING about refs. It is a credential-authorization
            verdict stamp, scoped to <state> ∈ authorized | denied |
            no-credential | local-only | error. publish() at :83-98 writes the
            new ref and then DELETES every older one, so exactly one exists at a
            time and there is no sequence to count over even by accident. Its
            only consumer, scripts/check-credential-channel.sh:139-141, uses it
            purely as an age bound (now - best_epoch > 900s -> stale).

        AND THERE IS NO OTHER ONE. Swept scripts/, images/ and crates/ for a
        monotonic counter describing the repo corpus or mirror ref generation:
        relay-refs.sh's "generation" is a Vault token generation;
        post-receive-hook.sh counts refs per push and discards the number;
        control-wire's `seq` is per-connection request correlation;
        spec-index-ensure.sh's fingerprint is content-addressed and explicitly
        NOT monotonic. The git daemon advertises refs/heads/*, refs/tags/* and
        the single verdict ref — a client can only ls-remote and compare shas
        itself. The observability surface that would carry an ordering position
        is documented as unbuilt in
        cheatsheets/concurrent-git/git-mirror-managed-alternatives.md:37,101-106.

        SO THE EPOCH WAS DELIBERATELY NOT CARRIED. Reading a ref no producer
        writes is a dead mechanism with a live intent, and reusing the
        credential verdict's timestamp as a corpus version would put a number in
        the envelope that means something else entirely. The honest substitute
        is already in this change and is strictly stronger: the exact commit,
        plus a relationship derived from the graph. A human-readable monotonic
        version still wants a WRITER in the mirror; that is a separate packet
        with a real deliverable, not a field this one could have filled.
      evidence_refs:
        - "images/git/probe-upstream-auth.sh:78 EPOCH=$(date -u +%s); :83-98 publish() writes then prunes every older ref"
        - "images/git/probe-upstream-auth.sh:25-27 — <epoch> documented as the probe's unix time for staleness bounding"
        - "scripts/check-credential-channel.sh:139-141 — the only consumer, uses it as an age bound"
        - "cheatsheets/concurrent-git/git-mirror-managed-alternatives.md:37,101-106 — per-ref ordering observability is proposed, not implemented"
