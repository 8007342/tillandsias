        A PRE-EXISTING BUG FOUND BY RUNNING IT RATHER THAN READING IT.
        Freshness::for_source() took .parent() unconditionally, so a CHECKOUT
        ROOT resolved one directory above itself. For spec::build_envelope, which
        passes the root, that meant `unknown` in the ordinary case — and, here,
