        THE DESTRUCTIVE INSTANCE. This packet's evidence was a near-miss until tonight.
        Here is the same defect destroying a real field on trunk.

        WHAT I RAN, three times:
          tillandsias-plan set-field 1248-j6vd title --replace --host lenovinha-silverblue \
              --reason "<why>" "<the corrected title>"
        The value is POSITIONAL and third. Written after the flags, the parser took
        --host's argument as the value. Result, pushed to origin in 96bdbf5a7:
          1248-j6vd title  -> "lenovinha-silverblue"   DESTRUCTIVE: a real title lost
          1248-j6vd notes  -> "lenovinha-silverblue"
          1252-r72q notes  -> "lenovinha-silverblue"
        1248-j6vd's headline was the string "lenovinha-silverblue" on trunk for roughly
        nine minutes. It is the row whose title I had just argued needed correcting
        BECAUSE a wrong headline makes a reader close a row as stale.

        IT IS NOT SILENT, AND THAT IS THE SHARPER FINDING. The tool printed
          ok: <packet>.title <the old title> -> lenovinha-silverblue
        which is a correct report of the transition it was asked to make. Exit status 0.
        Nothing refused. I scanned for "ok:" and stopped reading. So the defect does not
        need a silent write to cause data loss -- an accurate message about a wrong
        intention is enough, because the caller who made the mistake is exactly the
        caller disposed to read the confirmation as agreement. A refusal is what is
        missing, not a louder message.

        TWO --append CALLS THEN LANDED HOLLOW, same cause: the fragment recorded only the
        dated attribution line with the body absent (20260918t212512z-05f3f8b3 and
        20260918t212526z-099e1d95, both retained in the ledger as evidence rather than
        erased). Again exit 0. I found it by grepping the written fragment for a phrase I
        expected; nothing else would have shown it.

        WHAT LIMITED THE DAMAGE, AND IT IS AN ARGUMENT FOR A DEFAULT. --append preserved
        every prior line on every mis-invocation, so the only content lost was my own
        addition. The ONE field where something real was destroyed is the one where I
        passed --replace. That asymmetry suggests --append should be the DEFAULT for the
        long-form fields (next_action, context, notes, title, deliverable,
        verifiable_closure, unscoreable, provenance, progress_summary) and --replace the
        explicit opt-in, rather than the current arrangement where the destructive mode
        is one flag away and reads as a peer of the safe one.

        RECOVERY, for whoever hits this next: the channel is LWW, so a later correct
        set-field repairs the field. The hollow fragments stay -- they are append-only
        and they are the record that it happened. Verify the repair by GREPPING THE
