          20260918t212556z  1248-j6vd title    1562 B  carries "compliant-silence"
          20260918t212603z  1248-j6vd notes    4360 B  carries "REPRODUCED ON LENOVINHA"
          20260918t212610z  1252-r72q notes    4294 B  carries "CRITERION 2 IS MISDESCRIBED"

