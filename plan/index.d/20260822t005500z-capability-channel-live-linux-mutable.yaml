      summary: |
        FIRST REAL LINUX CAPABILITY ROW CONFIRMS THIS PACKET, with a
        counterexample sharper than the packet's own statement.

        macuahuitl's row, from a HEAD-built probe:
          devices: cpu/Intel Core Ultra 7 265KF  usable=true  lanes=container,host-native
                   gpu/NVIDIA RTX A5000          usable=true  lanes=container,host-native
                   npu/Intel NPU                 usable=false reason=engine-missing
          engines: []
          -> capability-matrix prints `schedulable: none`

        A HOST WITH A USABLE RTX A5000 REPORTS NOTHING SCHEDULABLE. And it is
        not a quiet host: this same cycle's preflight returned
        `ok:dev-inference-ready:qwen2.5:0.5b:nomic-embed-text`, so ollama is
        running and serving models on this machine right now. The engine exists
        in reality and `engines: []` in the document.

        This is the packet's first half — "5b8da3dbe added enumerate_engines()
        but accel_envelope() never reads doc.engines" — observed from the
        consumer side rather than the source side. schedulable_triples needs a
        (device, lane, ENGINE) triple, so an empty engines list makes every
        device unschedulable no matter how usable it is, and the matrix
        under-reports the fleet's best GPU as nothing.

        Worth noting for whoever claims this: the NPU row is CORRECT — it says
        usable=false with unusable_reason=engine-missing, which is exactly the
        present-unusable distinction 806-2r4s built. So the document can express
        "hardware present, no engine". The gap is that a device with a
        WORKING engine cannot express it, because engines are never enumerated
        into the document at all.
