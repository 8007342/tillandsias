        RESTORING THE TWO DESTROYED ROWS IS SAFE NOW, and the reason is the
        earlier fix rather than the write path. I had recorded "do not restore
        until compaction can serialise the channel, or the next compaction eats
        them again". That is no longer the constraint: compaction now REFUSES a
        fragment carrying `capabilities:` instead of consuming it, so the rows
        persist as fragments indefinitely and fold_capabilities reads fragments.
        The channel works today. Restored yolanda's two rows verbatim from
        1d7ae93ef^ — in-guest and windows-host, the pair that proves why locus
