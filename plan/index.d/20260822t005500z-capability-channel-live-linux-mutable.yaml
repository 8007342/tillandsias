        EMPTY IS NOW DISTINGUISHABLE FROM UNREPORTED, which was the outstanding
        addendum criterion. The arm printed "0 rows" and exited 0 — identical to
        a healthy fleet that has not probed. It now reports coverage against the
        known-host set, taken from the per-host attestation ledgers. Three
        states, all exercised:
          populated  "3 row(s), 2 of 6 known host(s) reporting — SILENT: ..."
          empty+hosts "0 rows — UNREPORTED by all 3 known host(s): ... This is a
                       GAP, not an empty fleet"
          no hosts    "0 rows, and NO KNOWN HOSTS — nothing has completed a
                       full-mode cycle here"
        The known-host set is a PROXY and says so in the code: a host appears
        once it has completed a full-mode cycle, so it answers "which hosts are
        real and working", not "which hosts owe a capability row". A host that
        never ran a cycle is invisible, which is the right failure direction.

        AND THE COVERAGE LINE EARNED ITS KEEP ON ITS FIRST RUN by naming THIS
        host as silent. Acting on the report rather than filing a packet about
        it: macuahuitl now contributes a row, verbatim probe output.

        WHY macuahuitl HAD NEVER CONTRIBUTED — VERSION SKEW, not neglect, and
        the first attempt at the row FAILED on it. The INSTALLED binary is
        v0.4.260818.1 and emits `schema_version: 1` with a host block of only
        {is_battery_present, kernel_release} — NO host_id. fold_capabilities
        requires document.host.host_id and skips such a row with the
        exactly-right message "document has no `host.host_id` (predates
        808-43mw?)". It does predate it: 808-43mw landed on windows-next and
        reached linux-next only in the 2026-08-21 merge. So every probe run
        from the installed binary on this host produces an UNFILEABLE document,
        silently. Rebuilding from HEAD gives schema_version 2 with
        host_id=macuahuitl, host_id_source=node-name, host_kind=linux.

        That generalises to the rejoin plan: a host whose installed binary
        predates the merge that reached it cannot contribute to this channel,
        and nothing tells it so — the row is simply skipped. Any rejoining host
        should rebuild before its first capability probe.

        LOCUS `bare-metal` IS A NEW VALUE. The vocabulary held only `in-guest`
        and `windows-host`, which exist because a WSL2 guest and its Windows
        host see different hardware — the guest cannot see the NPU. Locus
        records which execution context observed. This host has no
        virtualization boundary between observer and hardware, so neither value
        is honest; `bare-metal` names the condition rather than the platform, so
        a bare-metal macOS or Windows host can reuse it.

        WHAT IS STILL OWED on this packet: the capabilities WRITE path.
        compact/compact_text still never serialise the channel into the base, so
        these rows live only as fragments. That is now a SIZE concern rather
        than a LOSS one — bounded at roughly one row per host per locus — which
        is why it is no longer blocking anything.
