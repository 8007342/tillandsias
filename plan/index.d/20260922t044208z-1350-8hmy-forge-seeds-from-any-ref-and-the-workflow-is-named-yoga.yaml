      WHY THE SAME HOST TAKES BOTH. Whoever removes the mount should write the
      workflow that replaces it: a workflow written by someone who will never
      use it reads as complete and cannot be followed, which is the prose form
      of an arm that cannot fail. This host will do T5.

      WHAT IS ALREADY MEASURED AND SHOULD NOT BE RE-DERIVED. The removal surface
      for T5 is 28 files — two Rust (headless main.rs, podman client.rs),
      images/default/lib-common.sh, and the rest cheatsheets and docs INCLUDING
      the staged image copies, which must move in the same commit or the
      derived-tree check refuses the push (that shape cost a land on 2026-09-20).
      And `TILLANDSIAS_PROJECT_HOST_MOUNT` and `TILLANDSIAS_FORGE_HOST_MOUNT`
      are DIFFERENT VARIABLES: the second is the opt-in, loudly-warned solo
      live-edit path, and the proposal retires both.

      ONE LIVE PATTERN THE DOCUMENTATION MUST NOT CONTRADICT: this host ran five
      rows and nine gates on 2026-09-20 testing uncommitted edits ON THE HOST —
      edit, ./build.sh --check, push — and never needed a project mount into a
      forge at all. That pattern is unaffected by T5 and the sequence documented
      here must say so, or a reader concludes the only supported workflow is the
      one being removed.
