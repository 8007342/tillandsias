    title: |
      the salvage-or-work-ref → sync → seed sequence is documented where a worker looks, and a litmus seeds a forge from a salvage/* ref, so the uncommitted-edit workflow exists BEFORE the host mount is removed
    context: |
      T4 OF cloud-only-project-lifecycle, AND THE PRECONDITION FOR T5/591-x7ws
      RATHER THAN A PARALLEL TASK. The operator ruled the local checkouts go and
      every checkout dies on container close; the coordinator is holding T5
