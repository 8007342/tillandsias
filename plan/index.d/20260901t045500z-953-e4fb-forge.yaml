packets:
  - packet_id: forge-global-hookspath-breaks-hermetic-local-hook-fixtures
    order: 953-e4fb
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    pickup_role: any
    depends_on: []
    capability_tags:
      - forge
      - litmus
      - fail-loud
      - shell
    title: >
      The forge's global core.hooksPath (~/.cache/tillandsias/git-hooks, set by
      lib-common.sh install_agent_hooks) replaces per-repo hooks, so hermetic
      fixtures that install a local pre-push spy — e.g. test-pre-push-empty-ref-list.sh —
      never run it and report five phantom FAIL lines; ./build.sh --check goes red
      on an otherwise-clean forge tree
    deliverable: plan/issues/forge-global-hookspath-breaks-hermetic-local-hook-fixtures-2026-09-01.md
    context: |
      REPRODUCED 2026-09-01 on linux-next @ ddb7a9e81 AND on pristine base
      983d0b3b7: test-pre-push-empty-ref-list reports 6 passed / 5 failed with
      refbytes() returning '<none>'. Control (isolated HOME, no global
      hooksPath) passes 11/11. The forge sets git config --global
      core.hooksPath to ~/.cache/tillandsias/git-hooks (lib-common.sh:367),
      which REPLACES per-repo .git/hooks pre-push spies. Full record:
      plan/issues/forge-global-hookspath-breaks-hermetic-local-hook-fixtures-2026-09-01.md
