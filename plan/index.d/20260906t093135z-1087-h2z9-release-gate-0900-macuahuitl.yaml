        So the release gate is not accumulating an ever-growing backlog: named
        defects get fixed fast once the list exists, and the population turns
        over. What does not change is that ./build.sh --check calls ALL of these
        green, so no individual land can see any of them and only a once-a-day
        run makes them visible at all.

        THE FIVE, WITH THEIR ACTUAL FAILURE TEXT rather than their names:

        1. cycle-batch-triage-shape step 23/26 "selection writes nothing to the
           worktree" -> FAIL: selector mutated the worktree. A read-only
           assertion, red. The selector writes to the tree it is asked to
           report on.
        2. capability-routing-shape step 1/5 TIMEOUT at 120s, adjudicator says
           cpu.pressure 80,998us over 120s, NOT contended, genuinely too slow
           for its budget. Same class as 1105-h8vr: a budget outgrown by its
           input, presenting as a timeout that reads like a slow machine.
        3. capability-manifest-guard step 4/4 NEGATIVE CONTROL "the SAME source
           restored clean warns about NOTHING" expected ok:clean-tree-silent,
           got empty. The guard does not stay silent on a clean tree, so its
           negative control cannot distinguish a real warning from noise.
        4. committable-branch-guard-shape step 3/6: a scratch linux-next
           checkout should pass, and instead the guard correctly refuses it —
           "This host cannot author a commit ... Set an identity for this
           checkout (repo-local, not --global)". The FIXTURE builds a scratch
           repo without a repo-local identity and then asserts the guard passes
           on it. The guard is right; the fixture asserts a property of an
           environment it did not finish constructing.
        5. cycle-metrics-answer-rate-shape: 1105-h8vr, held by pirria, cause
           established (the ledger check is O(fragments)), remedy aimed.

        TWO OF THE FIVE ARE FIXTURES ASSERTING PROPERTIES OF THEIR ENVIRONMENT
        (3 and 4), which is the same class esmeraldinha found in
        test-selector-drops-cross-branch-claims.sh the same hour, where a
        low-end host's correct tier refusal was read as an empty batch. Three
        instances in one night suggests the class is worth a rung of its own
        rather than three separate repairs.

