      summary: |
        POST-FIX MEASURED, and it meets this row's closure on the closure's own terms.

        A trunk push through scripts/push-plan-fragments-to-trunk.sh RETURNED in 50
        SECONDS, rc=1, with a named refusal:
          pre-push refused: the tree changed since ./build.sh --check last passed
        against the same 7073-file tree that never returned under bounds of 120, 150,
        180, 200, 240, 575 or 1800 seconds. The refusal is CORRECT and is the hook
        working: the working tree carried code changes the last gate had not covered,
        so the stamp was legitimately stale.

        THREE COSTS, ALL MEASURED, in the order they were found and fixed:
          1. the hook's mover enumeration, a shell PER FILE at
             pre-push-local-gate.sh:1620   ~18 min  -> 2.3 s
          2. gate-stamp.sh movers, TWO spawns per path (sha256sum then cut) at 675 ms
             per path                      ~4774 s  -> 7 s
             with the batched digest proved BYTE-IDENTICAL to the per-file one before
             it was trusted; the equivalence fixture caught a real bug in that change
             on its first run (MSYS sha256sum prints binary-mode "digest *path", and a
             separator match for two spaces left an asterisk glued to every path,
             which would have made every path read as modified and refused every
             host's push)
          3. check-fragment-status-loss.sh, three plan-binary calls per fragment,
             3 x 134 ms x 1302 = ~523 s     -> 9 s

        EACH OF THE FIRST TWO FIXES WAS REAL AND INSUFFICIENT, and the closure is what
        caught that. After (1) the push still did not return. After (2) it still did
        not. Only after (3) did it. A closure naming the OUTPUT rather than a mechanism
        is the only reason none of the three could be mistaken for the answer -- and a
        fix that removed a genuine per-file spawn while leaving the push unusable is
        exactly what a mechanism-shaped closure would have accepted.

        AND THE THIRD FIX CONTAINED A FOURTH COST OF THE SAME CLASS. My frame reader
        set IFS from a command substitution inside the while header, which is evaluated
        ONCE PER ITERATION: roughly 3900 forked subshells, leaving 250 s after the
        batching had already removed 3906 plan-binary calls. The timestamped trace
        counted 3941 printf spawns against 25 plan-binary invocations. Having removed
        the obvious per-item spawn, I had introduced a second one inside its own
        remedy. Hoisting the assignment took it to 9 s.

