      - v0.5
    title: |
      MO Smoke Mode cannot finish inside its 600s hard cap on the Windows forge: the in-forge plan expert rebuilds from scratch EVERY lane (nothing persists it in the forge cache volume), so the smoke runbook's plan_check alone outlives the budget.
    context: |
      Two consecutive live runs of the sanctioned harness
      (scripts/litmus-opencode-e2e-launch.sh, litmus:opencode-prompt-e2e-shape
      STEP 3 shape) on windows/Yolanda 2026-08-16, both in SMOKE mode with the
      rate limiter honored (recorded:full-meta first; harness printed
      "limited:full-meta:14400s — running smoke mode"):

      - Run 1 (~21:47Z, cold): lane healthy end to end — tillandsias mirror
        seeded, 4316-file clone, agent executed the Smoke runbook
        (ok:experts-healthy, dirty-tree classification, in-forge litmus
        suites) — FORGE_EXIT=124 (hard cap 600s, mode=smoke). Cold bring-up
        consumed ~2.5 min of the budget.
      - Run 2 (~21:58Z, warm stack, fresh forge): bring-up ~1 min, agent at
        the runbook within the first minute — STILL FORGE_EXIT=124. The
        budget went to `forge-plan plan_check`: the agent's own log says
        "Plan expert is still building (transient). Retrying both checks
        with proper timeouts." ~7 minutes into the lane, and a 120s shell
        tool timeout fired inside a single check.

      Root shape: the in-forge plan expert (tillandsias-plan backing the
      forge-plan MCP) builds inside the forge container's EPHEMERAL
      filesystem. The persistent forge cache volume
      (tillandsias-forge-cache-<project>) carries only src/ — no cargo
      target for the expert — so every lane pays the full build, and on
      this host that build alone exceeds what the 600s smoke cap leaves
      after bring-up. Linux hosts fit the cap; the same runbook here
      structurally cannot. Same platform-tax family as the litmus step
      budgets (windows-red-meta-orchestration-litmus-2026-08-16.md), but
      this one is inside the forge (Linux userland), so it is build-cost,
      not MSYS spawn-tax.

      NOT a mirror/credential problem: both lanes cloned non-empty
      checkouts through the freshly fixed mirror (777-i7hf) and the same
      session's push lane landed two verified-ack pushes upstream.
    exit_criteria:
      - |
          The in-forge plan expert build is persisted across lanes (cache volume or prebuilt into the forge image) OR the smoke runbook's plan_check degrades gracefully (bounded skip with a named reason) when the expert is not yet built.
      - |
          A smoke-mode harness run on a warm windows stack finishes inside the cap with `MO-SMOKE: PASS`, recorded with FORGE_EXIT=0 evidence on this packet.
      - |
          If the cap itself is resized for slow-inference/first-build hosts, the resize is justified against the operator's token-budget directive (2026-07-11), not silently inflated.
