    title: |
      the worker skill carries the REFUSAL half of the dirty-start rule and not the SALVAGE half, so every worker host is told not to touch uncommitted work and never told to copy it first — which is how four hours of finished work left no trace on any branch
    context: |
      MEASURED on yoga 2026-09-06:

        grep -c salvage-dirty-worktree skills/meta-orchestration/SKILL.md      -> 3
        grep -c salvage               skills/advance-work-from-plan/SKILL.md   -> 1

      and that single worker hit is line 421, "it is the only salvage
      available", an aside in an unrelated context. The instruction is absent.

      THE WORKER SKILL HAS EXACTLY HALF THE RULE, which is worse than having
      none of it. Line 847 says: "When the worktree is dirty, only stage plan/
      files explicitly by path. Implementation code from a previous
      (uncommitted) iteration is NOT yours to touch." So a worker host is told
      to leave the dirt alone — and never told to make a copy of it.

      The coordinator skill states why that is not enough, at :751:
      "Refusing protects the work from YOU; it does not protect it from a fresh
      clone, and on 2026-08-24 a fresh clone is exactly what took it."

      WHAT IT COST, from 872-c9nd: three consecutive cycles refused a dirty
      tree, each writing more detailed prose about the diff than the last, and
      then the checkout was replaced by a fresh clone. Four hours of finished
      work was unrecoverable; the untracked file's name appears in no commit on
      any branch. Every cycle behaved correctly under the half-rule it had.

      WHY THE SALVAGE IS SAFE TO RUN UNDER THE REFUSAL, which is the point that
      makes the two halves compatible rather than contradictory:
      scripts/salvage-dirty-worktree.sh uses a temporary index and plumbing
      only. It cannot touch the worktree, so it is safe on dirt you have just
      been forbidden to alter. Refuse AND copy is not a conflict; it is the
      whole instruction.

      THIRD INSTANCE OF THE SAME SPLIT, and the reason to sweep rather than
      wait: 943-7dn5 (--emit-flow in the coordinator skill, absent from the
      worker skill, telemetry fed only when a session happened to run the
      coordinator) and 1091-zh6d (the checkout lock, same two files, same
      direction). Coordinator-only instructions that the worker loop must also
      follow are a class. check-credential-channel is a fourth, taken by
      macuahuitl.
    exit_criteria:
