      - "the section is written as an action at the moment of refusal, not as background — a host reading the refusal rule must reach the salvage without leaving that paragraph; pre-fix result: FAILS (the refusal at line 847 stands alone)"
      - "the salvage verdict is named so a host knows what success looks like (ok:salvaged:<ref>:<sha>) and can cite it; pre-fix result: FAILS"
      - "NEGATIVE CONTROL: the refusal itself is NOT weakened — the section must not read as permission to commit, discard, restore, reset or clean unknown dirt, which is the failure mode that would trade one data-loss shape for a worse one"
