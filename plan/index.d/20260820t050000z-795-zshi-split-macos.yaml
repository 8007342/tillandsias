    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    parent: guest-exec-allowlist-forces-argv-flattening
    title: "delete `argv_survives_wt_reparse`, `wt_safe_title` and the `wsl_root_sh` re-parse hazard once launch_spec emits a vector — they exist only to survive a flattening that will no longer happen"
    deliverable: "a grep for argv_survives_wt_reparse and wt_safe_title returns nothing; wsl_root_sh no longer re-parses a flattened string"
    pickup_role: windows
    release_target: architecture-audit-epic
    depends_on: [launch-spec-emits-verbatim-argv-for-project-launches]
    capability_tags: [rust, windows, wsl, architecture]
    estimated_hours: 3
    context: |
      SPLIT OUT BY LANE, deliberately, 2026-08-20. The parent's exit criterion
      2 requires all five workarounds deleted in ONE change. Two of them live
      in crates/tillandsias-windows-tray/src/notify_icon.rs and one spans
      crates/tillandsias-vm-layer/src/wsl.rs +
      crates/tillandsias-windows-tray/src/wsl_lifecycle.rs — none of which
      COMPILE on a macOS or Linux host, so no other lane can verify a deletion
      there. 828-r2ek reached the same conclusion about hvsocket.rs on the same
      grounds; this follows that precedent rather than inventing one.

      BLOCKED ON 837-m47d BY CONSTRUCTION, and the order matters: deleting the
      workarounds before launch_spec emits a vector removes the only thing
      making the current flattened form survive wt.exe's argv re-parse. The
      dependency is recorded so the Windows lane does not pick this up early.

      WHAT EACH ONE IS FOR (do not re-derive):
        * argv_survives_wt_reparse / wt_safe_title — wt.exe re-parses its argv
          and treats `;` as its OWN command separator, splitting a bash `-lc`
          script and trying the last fragment as a Windows executable
          (ERROR_FILE_NOT_FOUND 0x80070002). See
          plan/issues/wt-github-login-semicolons-2026-06-30.md.
        * the `;` -> `&&` rule at pty/mod.rs:325-332 is the SAME defect's
          mitigation and lives in shared code — it should be re-examined with
          this packet, but its deletion belongs to whichever lane can prove the
          GithubLogin script no longer transits wt.exe as a string.
        * wsl_root_sh's re-parse hazard — same class, WSL's argv handling.

  - packet_id: guest-exec-argv-vector-litmus-and-source-scan
    order: 837-et6t
    status: ready
    desired_release: v0.5
    priority: p2
    kind: enhancement
    parent: guest-exec-allowlist-forces-argv-flattening
    title: "the parent's named verifiable closure `litmus:guest-exec-argv-vector-no-shell` does not exist — without its source-scan leg the deleted workarounds can silently come back"
    deliverable: "the litmus exists, drives the trays' launch specs for a project named `a'b`, and fails if any deleted workaround reappears"
    pickup_role: any
    release_target: architecture-audit-epic
    depends_on: [launch-spec-emits-verbatim-argv-for-project-launches]
    capability_tags: [litmus, ci-gates, fail-loud]
    estimated_hours: 3
    context: |
      The parent names `litmus:guest-exec-argv-vector-no-shell` as its
      verifiable closure. It has never been written — the only related litmus
      in the tree is litmus-pty-open-argv-allowlisted.yaml, which pins the
      allowlist decision, not the end-to-end argv shape.

      THE SOURCE-SCAN LEG IS THE POINT, in the parent's own words: it is what
      makes this a REDUCTION rather than an addition, because the litmus goes
      red if `argv_survives_wt_reparse`, `wt_safe_title` or
      `build_exec_guest_shell_cmd` come back. A deletion with no guard against
      re-introduction is a deletion that gets undone by whoever next hits the
      quoting problem and does not know why the workaround went away — which is
      how this subsystem accumulated five of them.

      CAUTION, 634-39ik: a source-scan leg is exactly the shape the
      expression-pinning enforcement refuses when it pins how source is
      currently written with no negative control. Assert the ABSENCE of named
      symbols (a property that stays true however the code is rewritten), and
      carry a negative control proving the scan actually fails when a symbol is
      reintroduced. Otherwise this gate will be refused at the pre-push gate,
      as one was on this host 2026-08-19.

  - packet_id: exec-guest-shell-join-disposition
    order: 838-48ca
    status: ready
    desired_release: v0.5
    priority: p3
    kind: research
    parent: guest-exec-allowlist-forces-argv-flattening
    title: "decide whether `build_exec_guest_shell_cmd` should be DELETED or KEPT — the parent lists it among five deletable workarounds, but `--exec-guest 'a | b'` is a documented shell-pipeline use case that a verbatim vector cannot express"
    deliverable: "a recorded decision, and the parent's exit criterion 2 amended to match it"
    pickup_role: macos
    release_target: architecture-audit-epic
    capability_tags: [macos, architecture, decision]
    estimated_hours: 1
    context: |
      RAISED 2026-08-20 while splitting the parent, because the parent's exit
      criterion 2 ("a grep for build_exec_guest_shell_cmd returns nothing")
      may be wrong, and discovering that DURING the implementation would be
      expensive.

      crates/tillandsias-macos-tray/src/main.rs:304 exists so
      `--exec-guest head -c 100 /dev/zero | base64` works: the words are joined
      and run through `/bin/bash -lc`. That is a SHELL PIPELINE. A verbatim
      argv vector cannot express a pipeline — that is precisely what makes the
      vector form safe — so deleting the join would REMOVE a documented
      capability of the diagnostic tool rather than simplify it.

      The other four workarounds are different in kind: they exist to survive
      a re-parse that the vector form eliminates. This one exists because the
      caller genuinely asked for a shell.

      THREE HONEST OPTIONS, and the packet should pick one on the record:
        1. KEEP the join for --exec-guest and amend the parent's criterion,
           acknowledging it is a shell tool by design.
        2. SPLIT the flag: --exec-guest for the shell form, a new
           --exec-guest-argv for the vector form. Two paths, but they express
           two genuinely different requests.
        3. DELETE the join and require callers to write the pipeline
           themselves — which just moves the quoting problem to the caller.

      Note the parent's own warning cuts BOTH ways here: "widening without
      deleting leaves two code paths for the same thing". Option 2 is two paths
      for two DIFFERENT things, which is the distinction worth making
      explicitly rather than resolving by reflex.

