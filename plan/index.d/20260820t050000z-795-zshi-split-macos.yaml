packets:
  - packet_id: launch-spec-emits-verbatim-argv-for-project-launches
    order: 837-m47d
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    parent: guest-exec-allowlist-forces-argv-flattening
    title: "host-shell `launch_spec` still interpolates the project name into a single-quoted shell word for every project launch, on both the macOS and Windows trays — the verbatim-argv arm it needs now exists and is unused"
    deliverable: "launch_spec emits ['/usr/local/bin/tillandsias-headless', '--cloud', <project>, '--bash'] as a vector; the project reaches the guest as ONE argv element"
    pickup_role: any
    release_target: architecture-audit-epic
    capability_tags: [rust, vsock, security, architecture]
    estimated_hours: 4
    context: |
      THE SITE, shared by both GUI trays and therefore the highest-leverage
      one: crates/tillandsias-host-shell/src/pty/mod.rs:358-366.

        Some(p) => vm_login_shell_argv(&format!(
            "exec tillandsias-headless --cloud '{p}' --bash"))

      The project name is interpolated into a SINGLE-QUOTED shell word, so a
      name containing `'` closes the quote. `validate_project_name` refuses
      such names at the top of launch_spec — but that is the guard 773-fx3u
      landed, not the fix, and the parent packet says so explicitly.

      TWO DESIGN UNKNOWNS, BOTH RESOLVED 2026-08-20 so the implementer does not
      pay for them again:

        1. IS THE TARGET ADMISSIBLE? Yes. The guest binary installs at
           /usr/local/bin/tillandsias-headless (tillandsias-vm-layer/src/vz.rs),
           which is under VERBATIM_ARGV_PREFIXES (`/usr/local/bin/`), and
           `tillandsias-headless` is not in VERBATIM_ARGV_FORBIDDEN. So
           exec_argv_is_allowed already accepts the vector form — no allowlist
           change is needed, and none should be made.

        2. DOES DROPPING THE LOGIN SHELL BREAK THE CHILD'S ENVIRONMENT? Mostly
           no, and the residue is narrow. The current form uses `/bin/bash -l`
           specifically because pty_handler.rs:243 `env_clear()`s the child;
           the comment at pty/mod.rs:313-315 says `-l` rebuilds PATH from the
           login profile so a bare-name argv[0] resolves. But pty_handler.rs:
           488-508 ALREADY seeds DEFAULT_CHILD_PATH
           (/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin) when
           the caller supplies no PATH, and a verbatim argv[0] is an absolute
           path that needs no lookup at all. So PATH is covered twice over.
           WHAT IS NOT YET CONFIRMED, and is the one thing this packet must
           verify in-guest: whether `tillandsias-headless --cloud <p> --bash`
           depends on anything else the login profile sets (HOME, XDG_*,
           locale) once the shell is gone. Verify with `tillandsias-tray
           --exec-guest` against a live VM before deleting the shell form.

      NOT A WIDENING: everything reachable through the new vector was already
      reachable through `/bin/bash -lc <string>`, which never inspects the
      script. What changes is only HOW the request is expressed. The
      exec_allowlist module documents this at length; do not re-litigate it.

      NEGATIVE CONTROL REQUIRED: a project named `a'b` must reach the guest as
      one argv element byte-identical to `a'b`, or be refused. Silently
      splitting is the failure. Note that with the vector form the refusal in
      validate_project_name may become unnecessary for THIS path — decide that
      deliberately and say which, rather than leaving both.

  - packet_id: windows-tray-argv-reparse-workarounds-deletable
