    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [plan-tooling, ci-gates, performance]
    estimated_hours: 2
    context: |
      OBSERVED 2026-08-18 on macuahuitl, while running the destructive e2e's
      Step 1 (`./build.sh --ci-full --install`), which exited 1.

      MEASURED, not reasoned about:
        tillandsias-plan capabilities                 1ms   (returns before the load)
        tillandsias-plan fragment-terminal-events X   133ms (arm sits after it)

      `Ledger::load_with_fragments` reads plan/index.yaml (60,192 lines) plus
      all 102 fragments, at main.rs:2163. The three `fragment-*` arms were at
      2676-2927 and none of them touches `ledger` — each reads `args.get(1)`
      and parses that one file. check-fragment-status-loss.sh calls all three
      once per fragment, so the cost was 3 x 102 x 132ms of pure waste on
      EVERY `./build.sh --check`, on every host in the fleet.

      WHY IT SURFACED NOW rather than at 752-pst5. With one channel the phase
      took ~14s. 797-qm4t added a second and 812-d45t a third — both mine,
      earlier tonight — taking it to 41s and past
      litmus:fragment-status-loss-attribution-shape's 30s step budget. So the
      symptom was a TIMEOUT, not a wrong answer, and `./build.sh --check` (no
      per-phase budget) reported the phase at "41.0s" and stayed green while
      `--ci-full` went red. I read that 41s twice tonight without registering
      it as a number that had changed.

      FIXED by dispatching the three before the load, on the precedent already
      in the file: `capabilities` (order 569) returns first and touches
      nothing. 133ms -> 1ms, guard wall time 41s -> 1s, verdict byte-identical
      (121 checked, all three advisories still named).

      A CONTRACT DETAIL THAT MATTERED: the arms fall off their own end rather
      than exiting, so moving them into a function would have returned into the
      main dispatch and hit the unknown-subcommand arm. The extracted function
      returns bool and main returns on true. `std::process::exit` would have
      been the obvious alternative and is wrong here — it skips the stdout
      flush and can truncate piped output, which is exactly how these are
      consumed.
