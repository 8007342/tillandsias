packets:
  - packet_id: modular-semantic-explanation-expert-fallback
    order: 706-f7mq
    status: ready
    desired_release: v0.5
    release_target: forge-local-experts-milestone
    priority: p1
    title: "Modular semantic explanation and fallback in plan_answer using local inference endpoint"
    kind: enhancement
    deliverable: "crates/tillandsias-plan/src/{semantic_expert.rs, answer.rs}"
    pickup_role: any
    capability_tags:
      - experts
      - inference
      - plan
      - semantic
      - modularity
    estimated_hours: 4
    context: |
      Currently, `tillandsias-plan answer` and the `plan_answer` MCP tool evaluate queries strictly through deterministic token and packet ID matching. When an agent asks free-form semantic questions (e.g. "what is the current Direction?", "summarize v0.5 goals", "explain the socket audit theme"), the tool returns `confidence: unsupported`.
      
      The Tillandsias forge runs a warm local Ollama inference service (`http://inference:11434`, Qwen2.5:0.5b / tier models). Building a modular semantic explanation layer allows `plan_answer` to fall back to structured extraction over markdown sections (such as `## Direction` in plan.yaml/loop_status.md or epic context blocks) when deterministic grammar is exhausted. This component should be designed as a generic, modular SemanticExplainer abstraction that other Tillandsias subsystems (methodology, spec search, cheatsheets, diagnostics) can cleanly consume.
    outcome: |
      `plan_answer` gracefully falls back to local semantic extraction over relevant markdown headers when exact token matching yields no hits, returning cited and structured semantic summaries. The semantic explanation engine is exposed as a modular trait/struct usable by other expert components.
    exit_criteria:
      - "A modular `SemanticExplainer` interface in `tillandsias-plan` handles prompt framing, local inference dispatch (`http://inference:11434`), and structured response parsing with bounded latency."
      - "`plan_answer` falls back to `SemanticExplainer` when exact token matching is unsupported and inference is reachable, providing cited extraction from relevant plan markdown sections."
      - "Deterministic mode remains primary with zero regression on exact token/ID queries."
      - "Negative control: when inference endpoint is unreachable or disabled, queries cleanly return typed unsupported envelopes without hanging."
      - "Unit tests verify prompt assembly, graceful offline fallback, and mock inference response decoding."
    events:
      - type: filed
        ts: "2026-08-12T17:20:00Z"
        host: forge
        agent_id: "forge-antigravity-gemini-20260812t172000z"
        summary: |
          Filed per operator authorization. Implements modular semantic explanation fallback in plan_answer backed by local inference with cross-component reusability.

  - packet_id: plan-query-active-lease-projection
    order: 706-ddw6
    status: ready
    desired_release: v0.5
    release_target: forge-local-experts-milestone
    priority: p1
    title: "Surface active lease state in tillandsias-plan query --json projection"
    kind: enhancement
    deliverable: "crates/tillandsias-plan/src/{query.rs, lease.rs}"
    pickup_role: any
    capability_tags:
      - plan
      - coordination
      - leases
      - experts
    estimated_hours: 3
    context: |
      `scripts/select-work-batch.sh` and multi-host orchestrators construct candidate batches using `tillandsias-plan query --json`. However, `query` currently only projects core packet metadata and does not inspect the active claim lease state from `claim-ledger-node.sh` (`/tmp/tillandsias-claims/` or lease fragments).
      
      This forces downstream tools to perform secondary checks to avoid selecting packets that a concurrent agent on another host is already actively working.
    outcome: |
      `tillandsias-plan query --json` natively includes an optional `lease` object (`{ "holder": "...", "expires_at": "...", "is_active": bool }`) for each packet in its projection, enabling instant single-pass lease-aware batch selection.
    exit_criteria:
      - "`tillandsias-plan query --json` includes lease status directly in packet projection envelopes."
      - "`scripts/select-work-batch.sh` consumes native lease state, eliminating redundant secondary checks."
      - "Unit and CLI integration tests assert correct lease attribution for active, expired, and unleased packets."
    events:
      - type: filed
        ts: "2026-08-12T17:20:00Z"
        host: forge
        agent_id: "forge-antigravity-gemini-20260812t172000z"
        summary: |
          Filed per operator authorization. Adds active claim lease introspection to the plan query JSON projection.

  - packet_id: expert-cli-telemetry-attribution-channel
    order: 706-jmi7
    status: ready
    desired_release: v0.5
    release_target: forge-local-experts-milestone
    priority: p2
    title: "Record direct tillandsias-plan binary invocations to timing telemetry channel"
    kind: enhancement
    deliverable: "crates/tillandsias-plan/src/main.rs + scripts/cycle-metrics.sh"
    pickup_role: any
    capability_tags:
      - experts
      - telemetry
      - metrics
      - observability
    estimated_hours: 2
    context: |
      `scripts/cycle-metrics.sh` tracks expert usage by inspecting MCP server JSON-RPC log files. When worker agents invoke the high-performance native compiled binary (`tillandsias-plan`) directly from bash or scripts rather than via stdio JSON-RPC, `cycle-metrics.sh` reports `verdict: attention:experts-never-called`.
      
      Direct CLI invocations are the fastest and lowest-overhead access pattern in the forge. They should be recorded into `/tmp/tillandsias-timing.jsonl` so telemetry accurately measures expert utilization.
    outcome: |
      `tillandsias-plan` binary executions emit lightweight execution records to the shared timing log (`/tmp/tillandsias-timing.jsonl`), and `scripts/cycle-metrics.sh` aggregates both MCP and native CLI invocations into its expert adoption metrics.
    exit_criteria:
      - "`tillandsias-plan` CLI commands append lightweight timing entries to `/tmp/tillandsias-timing.jsonl` under an opt-out flag/env."
      - "`scripts/cycle-metrics.sh` counts direct binary invocations alongside MCP calls in its expert utilization summary."
      - "Logging overhead remains negligible (<1ms per command)."
    events:
      - type: filed
        ts: "2026-08-12T17:20:00Z"
        host: forge
        agent_id: "forge-antigravity-gemini-20260812t172000z"
        summary: |
          Filed per operator authorization. Captures direct tillandsias-plan binary CLI invocations in timing telemetry.
