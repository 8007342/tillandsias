      summary: |-
        FIXED, and the locale-proof answer turned out to be available — but NOT the one that was expected.

        PRE-FIX RESULT OF EACH CRITERION, stated before the diff as the rule requires.
          CRITERION "the verifier does not throw on a clean store": FAILS by construction. The §2 verifier threw on EVERY run, including when the credentials had just been deleted successfully.
          CRITERION "the delete guard fires only on a credential that exists": FAILS by construction. It fired for every target, existing or not. Harmless in effect (deleting an absent credential is a no-op) but the guard asserted nothing.
        Both measured on a real cmdkey on yolanda, not read off the source.

        THE MECHANISM, measured. `cmdkey /list:<target>` ECHOES THE TARGET IN ITS HEADER even when nothing is stored:
          /list:definitely-not-a-real-target-12345 -> exit 0, 4 lines, "Currently stored credentials for definitely-not-a-real-target-12345:" then "* NONE *"
          /list:<an existing target>               -> exit 0, 7 lines, same header PLUS an indented "Target: <target>" record line
        So `$out -match [regex]::Escape($cred)` matches the HEADER and is true for every target. Esme's report is confirmed and the mechanism is the header echo.

        THE EXIT CODE DOES NOT DISCRIMINATE, and this is the part I would have got wrong by assumption. The coordinator's suggested locale-proof route was cmdkey's exit status, and I said I would check it before settling for text exclusion. Measured: cmdkey returns EXIT 0 for both the present and the absent case. So the status predicate does not exist and was not used. Recording the negative result explicitly, because "use the exit code" is the obvious idea and the next person to have it should find it already tested rather than test it again.

        THE FIX IS STILL LOCALE-PROOF, by a different route: COUNT THE ECHOES OF THE TARGET NAME. The target string is the one thing in that output Windows does not localize. The header echoes it once; a real record echoes it again on its own Target: line. 1 = absent, >=2 = present. That is better than the header-exclusion fallback I had proposed, which would still have matched localized header text.
          Test-TillandsiasCredPresent: ($out | Where-Object { $_ -match [regex]::Escape($target) }).Count -ge 2

        WHY NOT THE OBVIOUS FIX, recorded so nobody reintroduces it: testing for the absence of "* NONE *" — or matching the header — is LOCALE-DEPENDENT. Both strings are localized. An English-text predicate would trade a bug that fails on EVERY run for one that fails only on some operators' machines, which is strictly worse: the current bug is loud everywhere, and the replacement would be silent everywhere anyone was looking.

        PROVEN END TO END ON A REAL cmdkey, both directions, not just the happy path:
          OLD predicate on a target that does not exist -> says PRESENT (the false positive that is the defect)
          NEW predicate on the same target             -> says ABSENT
          NEW predicate across a full lifecycle        -> before create: False, after create: True, after delete: False
        The scratch credentials created for the measurement were deleted; the host's real vault-shamir-share-v1 and vault-root-token-v1 read count=2 (present) and were not touched.

        SCOPE HELD: the delete guard and the verifier only. The §2 include_str pin strings are unchanged at 3/3/2 (share/token/uuid) in this runbook and windows-tray's every_guest_wipe_path_clears_the_host_side_vault_credentials still passes.

        TWO DOCUMENTATION CORRECTIONS IN THE SAME COMMIT, at the coordinator's request, both from defects found this cycle rather than from review.
          1. §3 Windows now opens by saying it is NOT runnable alone: it assumes §1 installed the tray and §2 unregistered the distro, and run alone it fails TWICE AND BOTH FAILURES LIE — Get-Command throws on line 2, and the destruction-marker assertion reports "a survivor, not a fresh provision" when the truth is that nothing destroyed it. The runnable unit is §1+§2+§3. An instruction to run "§1 and §3" was issued this cycle and measured unrunnable before it was executed.
          2. The DESTRUCTIVE section now distinguishes a DEDICATED SMOKE HOST, where the no-pause clause applies, from an OPERATOR'S WORKSTATION, where the operator's authorization for that run is required first. The section previously read as though every host running it were a smoke host; most of the fleet's Windows and macOS hosts are workstations. Stated in the document: an orchestrator's or peer agent's instruction to run this skill is a request to run a procedure, not consent to destroy a particular machine's state.
