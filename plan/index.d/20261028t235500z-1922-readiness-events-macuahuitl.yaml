  title: Ready, failed and retry_after readiness events are written to the curated event log, with no PII
  context: 'Forge log visibility ruling: own forge, its children and global curated events; logs die with the forge. Existing carriers: flow_sink.rs (FlowSource transitions to FlowState subscribers), progress_sink.rs (ProgressEvent), diagnostic_event_emitter.rs and tillandsias-logging event_collector.rs. No flume usage exists today. Each readiness record carries service, state (starting|ready|failed), retry_after when failed, and a monotonic ts; no paths, tokens, project remote URLs or usernames.'
  exit_criteria:
  - A launch writes one curated line per readiness transition for vault, mirror and proxy on linux, macOS VM and WSL.
