  title: An acceptance fixture fails on today's code when the forge starts before the mirror is ready or any sibling poll is counted
  context: 'Land this first, red. The fixture drives the launch chain against a fake event source and a fake podman: the mirror stays unready until the fixture emits its ready event. It fails if the forge container is created before that event, or if any readiness probe of a sibling (probe_git_mirror_seeded, wait_healthy, vault API probe) is invoked more than zero times. On today''s code both arms are red: wait_for_git_mirror_ready calls probe_git_mirror_seeded once per second, and the forge is created after the wait regardless of an event. Platform runs: linux natively; macOS VM and WSL via the headless inside the guest.'
  exit_criteria:
  - The fixture is red on linux-next as of 2026-10-28 with both arms named in its output (forge-before-ready, polls=N>0).
  - It is green once 1922-gate and 1922-unwt land.
