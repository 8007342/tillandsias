    context: |
      Parent1538 integration verification on2026-10-03 reproduced exited1
      from test-if-not-pipeline-guard.sh with 'failed to refuse pipeline'.
      Its known-violating file lives under target/plan-scratch, an external
      worktree cache symlink. The Lua decider catches fs.read failure and
      continues, then emits ok:no-spawn-in-if-not instead of a non-green
      unreadable-population outcome. This is not a filesystem capability gap:
      repository-bound read refusal is correct. The old Bash port deliberately
      preserved silent read/git-population failure, so tightening the decider
      changes its documented contract and must be separately reviewed.
      Moving the fixture into the repository restores its positive control
      but does not fix this production false-green behavior.
    outcome: "A decider cannot claim a clean selected population it failed to read, without widening filesystem authority or laundering inability into success."
