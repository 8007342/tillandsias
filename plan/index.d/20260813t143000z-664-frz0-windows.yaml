      summary: >
        Both criteria implemented in the fresh-provision tail of
        `provision_via_recipe`. On handshake-budget exhaustion there, the
        existing bounded `WslRuntime::perform_wsl_shutdown_recovery()` runs
        exactly once and its outcome is logged either way. No new machinery —
        this is a second caller of the recovery the exec-probe path already
        uses, which is why the packet is small.
        Two details that are the actual content. First, the keepalive now lives
        in a scope that CLOSES before the recovery: it is held across the
        connect loop so the VM does not idle out mid-wait, and if it were still
        held during shutdown the thing keeping the wedged VM alive would be us.
        Second, a failed recovery does not change the returned error. The
        operator needs the handshake failure; replacing it with a cleanup
        failure would hide the actual fault behind its own tidying.
        Criterion 2 is satisfied by placement rather than by a condition: this
        is the fresh-provision tail, so by construction the wire has never been
        healthy in this run. A handshake failing after a previously-healthy wire
        belongs to the keepalive supervisor, which is separately bounded, and
        recovering there would leave two mechanisms fighting over one VM.
