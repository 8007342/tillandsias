      summary: |
        MORE DATA, after the credential was re-seeded (macuahuitl-forge, 2026-09-26 22:43:12Z): the forge's FIRST claim push (linux-next only, no tags) was declined with, in this order: "remote: ! [rejected] stable -> stable (would clobber existing tag)", then "[pre-receive] Push rejected: configured upstream did not durably accept the ref transaction", then "! [remote rejected] linux-next -> linux-next (pre-receive hook declined)". After a rebase the retry relayed cleanly, so the primary cause THAT time was an ordinary moved trunk (non-fast-forward), not the credential. THE TAG LINE APPEARS ON EVERY REFUSAL, PRINTED BEFORE the "Push rejected" line, so in output order it reads as the cause of whatever the real cause was: unauthenticated one time, a moved trunk the next. That makes the fix more than cosmetic: (1) force tags in the post-refusal reconcile fetch (relay-refs.sh ~:320), and (2) print the PRIMARY refusal reason before any reconcile output, so the first line an agent reads is the true one.
