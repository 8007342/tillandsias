      summary: |
        OPEN ITEM (1), THE CHILD-PROCESS BRIDGE: unassigned, with the analysis for the next taker. WHY IT IS HARD: (a) On macOS the guest --github-login / --init runs as an EXEC SESSION over vsock (vm-layer vsock_exec.rs exec_over_stream_expect_dynamic_with_output). That is a different connection from the tray's push-subscription stream, and a separate process from the vsock server, so progress_sink (per-process, installed by the server) cannot see its events. (b) That session's output is the product for login: on_output passes it RAW (1383-dkxi) because the QR and device code must reach the user byte-exact, and on_event is an escaped, rate-limited log that must not be forgeable by the guest. Any in-band event framing must therefore be stripped from the raw sink without corrupting QR bytes, and must not let guest output forge host log lines. (c) Login runs on a PTY (interactive), so a sentinel line the host fails to strip is DISPLAYED to the user. CANDIDATE SHAPES, not chosen here: (i) the child connects back to the server's local control socket and publishes there, so events travel on the existing Progress topic, and the host correlates exec session to task; (ii) in-band framed lines (for example an ASCII RS-prefixed JSON ProgressEvent) that vsock_exec parses out of the stream before on_output, with a strict prefix and length cap; (iii) an out-of-band fd or file tailed by the server. (i) reuses the opt-in rule and the tested push path; (ii) touches the one byte path the QR depends on. The Windows HvSocket half is split to 1439-p853.
