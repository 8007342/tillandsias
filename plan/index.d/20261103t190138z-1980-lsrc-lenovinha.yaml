  title: Socket fixtures wait out a listener a parallel fork still holds before asserting it refuses
  context: 'After 1969-scp2, two tests still flaked on lenovinha (recurrences on 1969-scp2, 2026-11-03): lane_socket_owner a_cli_lane_refuses_by_name_when_another_process_owns_its_socket ("a departed owner''s socket") and lane_adoption a_rejoin_serves_a_lane_whose_launcher_was_killed ("the fixture must reproduce the refusing socket"). The live-tray lead was falsified: both already use private socket roots. Cause: both drop a listener and assert the next connect is refused, but a parallel test that spawns a process holds a copy of every fd between fork and exec, so the socket still accepts. Demonstrated with a forked child: CONNECTED while it lives, refused after. PRODUCT PATH: not dependent on an immediate refusal. The only refusal decision is the lane socket stale check on a socket another, departed, process left, whose fds are closed. A transient fork window would read as a live owner, which refuses the launch and never unlinks: fail-closed. The only other non-test listener drop is the OAuth loopback close, which nothing checks for refusal.'
  exit_criteria:
