    order: 627-m3vp
    status: ready
    desired_release: v0.5
    role: host-shell
    priority: p2
    kind: bug
    title: |
      The Linux native tray has 626-r7kq's defect too, via a bool: is_authenticated=false means both "not asked yet" and "asked, answer was no", so it offers an actionable sign-in during its own background probe.
    deliverable: plan/issues/windows-first-launch-cold-start-findings-2026-08-09.md
    depends_on:
      - tray-sign-in-state-unknown-until-observed
    pickup_role: linux
    owner_host: linux
    capability_tags:
      - linux
      - tray-ux
      - host-shell
      - parity
    estimated_hours: 2
    blocked_on: |
      Not blocked technically. The approved string from 626-r7kq ("🔄 Checking your account…", operator 2026-08-09T08:33Z) covers this defect class, but the claiming agent should confirm with the operator that the approval extends to the Linux surface before changing it — the Linux row copy already DIVERGES from the other two trays ("🔑 GitHubLogin", no space, vs "🔑 GitHub Login"), so this is not a byte-identical surface.
    problem: |
      VERIFIED by reading crates/tillandsias-headless/src/tray/mod.rs at windows-next 55bc277d.

      The Linux native tray does NOT consume `GithubLoginState` — it builds its own menu from `state.is_authenticated: bool` (:375). The 626-r7kq shared-layer fix in host-shell `menu_state.rs` therefore does not reach it.

      A bool cannot distinguish "not observed yet" from "observed, signed out", which is exactly the 626-r7kq defect:
        * :1353  `let is_authenticated = false;` — the launch default.
        * :3223  `if state.is_authenticated { <project body> } else if login_in_progress { … } else { <ENABLED "🔑 GitHubLogin" row> }`
        * :3942  the code's own comment: "default is_authenticated=false and confirm in background", chosen because `is_github_logged_in` "can trigger a 60s Vault health timeout".
        * :3963  the background task flips the flag only after `is_github_logged_in` returns — which is `probe_github_username`, the SAME container run that makes the window long on Windows.

      So for the whole duration of that background probe the Linux menu offers an actionable sign-in to users who may already be signed in. Same defect, same root cause, same slow probe — different mechanism, hence untouched by the shared fix.
    why_it_matters: |
      This is the "idiomatic layers hygiene" problem the operator named on 2026-08-09: there are TWO menu builders (host-shell `menu_state::build` for Windows+macOS, and the Linux tray's own `build_menu`), and a fix to the shared one silently leaves the other defective. A parity claim made from the shared layer alone would have been wrong — this packet exists because that claim was checked instead of asserted.
    exit_criteria:
      - |
          The Linux tray distinguishes unobserved from confirmed-signed-out and never renders an enabled sign-in row for an unobserved state; unit test on its `build_menu`.
      - |
          Operator confirmation that the 626-r7kq approved copy applies to the Linux surface, recorded on this packet, BEFORE the label changes (the Linux row copy already diverges from the other trays).
      - |
          The divergent Linux label ("🔑 GitHubLogin") is either reconciled with the other trays or the divergence is recorded as deliberate with a reason.
      - |
          A note in whichever layer survives records that two menu builders exist, so the next login-state change is not assumed to be shared.
    events:
      - type: filed
        ts: "2026-08-09T08:42:26Z"
        agent_id: windows-claude-fable-metaorch-20260809t063000z
        host: windows
        summary: |
          Filed while closing 626-r7kq exit criterion 3, which required the Linux native tray to be READ and either share the fix or be recorded out of scope with a reason. Reading it showed it is not merely out of scope — it carries the same defect independently. Recording that rather than claiming Linux was unaffected.

