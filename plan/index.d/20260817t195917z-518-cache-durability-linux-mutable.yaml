        STILL LIVE AT THIS HEAD, AND ABOUT TO GET MUCH MORE EXPENSIVE. Filed
        2026-07-29, status ready, unfixed. Re-confirmed today with the exact
        selection chain, and with one CORRECTION to how widely it fires.

        THE MECHANISM, verified statically end to end:
          build.sh:1212-1215  --ci-full runs the post-build phase at --size e2e
          run-litmus-test.sh:618-621  size `long` is matched by the `e2e` filter
          litmus-inference-deferred-model-pulls.yaml  declares size: long,
            phase: post-build, and its FIRST critical_path step is
              CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/tillandsias/models"
              rm -rf "$CACHE_DIR/.tools" "$CACHE_DIR/manifests" "$CACHE_DIR/blobs"
          openspec/litmus-bindings.yaml:508  the binding is live
        No gate spares it: the file carries no host_kind (defaults to `any`),
        the runner evaluates no preconditions, and diff-scoping is inert
        because build.sh never passes --diff-scope.

        THE CORRECTION, and it is worth having: this does NOT fire on every
        `--ci-full`. The post-build block sits inside the --install branch, so
        `./build.sh --ci-full` alone never reaches it. MEASURED: six --ci-full
        runs on this host tonight, and the cache blobs still carry their
        original mtimes of 2026-08-16 03:20-03:37, 1.5 GB intact. The command
        that DOES fire it is `./build.sh --ci-full --install` — which is listed
        in CLAUDE.md under Common Commands and is Step 1 of the
        build-install-and-smoke-test-e2e skill.

        WHY IT MATTERS MORE FROM TODAY. Order 408 landed this session and the
        inference container now runs on the GPU tier (24 GiB A5000, CUDA runner
        confirmed). The whole point of that lane is to stop serving a 0.5B
        model. The moment a real synthesis model is resident, this step stops
        costing 1.5 GB and starts costing tens of GB per e2e run — over the
        proxy, on every host that runs the skill. The packet's own body already
        records 9.2 GB lost on the host that filed it.

        DIRECT INTERACTION WITH THIS WEEK'S WORK: the destructive e2e has been
        deferred three cycles running for unrelated reasons (forks holding
        podman). When it finally runs, its Step 1 is exactly the command that
        wipes the cache — so the first thing the long-awaited e2e will do is
        re-download every model. Worth fixing BEFORE that cycle, not after.

        SHAPE OF THE FIX, since the packet does not state one: the litmus wants
        a COLD cache to exercise the deferred-pull path, which is legitimate.
        What it must not do is achieve that by emptying the operator's real
        one. Point CACHE_DIR at a scratch directory and run the container
        against that for the duration, or gate the step behind an explicit
        opt-in the e2e skill sets deliberately. Note also a latent divergence
        the fix should resolve: the litmus resolves
        ${XDG_CACHE_HOME:-$HOME/.cache} while the Rust launcher hardcodes
        `.cache` (main.rs:4014), so on a host with XDG_CACHE_HOME set they are
        different directories — the litmus would wipe one the container never
        uses, and the cold path it thinks it is testing would not be cold.
