    title: |
      scripts/check-claims-across-branches.sh in PER-PACKET mode answers "ok:cross-branch-claims:0 sibling branch(es) checked" (exit 0) when no sibling branch resolved, the exact false negative its --batch mode refuses as blocked:no-siblings-folded ("saying none claimed here is the false negative this file exists to prevent")
    context: |
      FOUND by macuahuitl-forge while writing the 1247-omqr affordance fixture
      (2026-09-27): in a scratch checkout with no refs/remotes/origin/<sibling>,
      `check-claims-across-branches.sh SOME-PKT --no-fetch` (per-packet mode,
      local fold knows the packet) printed ok:cross-branch-claims:0 sibling
      branch(es) checked and exited 0. The --batch path in the same file guards
      checked==0 with blocked:no-siblings-folded; the per-packet path has no such
      guard, so a stale or sibling-less checkout gets an ok it cannot back, and
      a host proceeds to claim a packet a sibling may hold (the 814-iyu7 class).
    exit_criteria:
      - 'per-packet mode with zero folded siblings refuses or names the gap (as --batch does), with a why/remedy affordance (pre-fix: FAILS — ok:cross-branch-claims:0 …, exit 0)'
