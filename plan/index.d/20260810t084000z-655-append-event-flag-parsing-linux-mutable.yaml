packets:

  - packet_id: append-event-accepts-a-flag-as-a-positional-and-writes-it
    order: 655-be89
    status: ready
    desired_release: v0.5
    release_target: convergence-velocity-milestone
    priority: p2
    title: "append-event silently accepts `--event` as the event TYPE and drops the real summary"
    kind: bug
    deliverable: crates/tillandsias-plan/src/main.rs
    depends_on: []
    pickup_role: any
    capability_tags: [plan-cli, argument-parsing, ledger-integrity]
    context: >
      The real grammar is positional — `append-event <id|order> <type> <summary>
      --ts <ISO>` — but the neighbouring `set-field` and `loop-status-append`
      subcommands are flag-driven, so reaching for `--event verified --summary "…"`
      is the natural mistake. This host made it.

      The CLI did not refuse it. It bound `--event` as the event TYPE and `verified`
      as the summary, then silently discarded `--summary` and its entire payload, and
      wrote this into the committed base:

        - type: --event
          summary: verified

      `tillandsias-plan check` then reported `ok: 657 packets, ids unique, live
      references sound` — schema validation has nothing to say about an event type
      that begins with two dashes.

      Caught only because the diff was read before committing. It writes to
      plan/index.yaml (the base, not a fragment), so an unreviewed run corrupts the
      compacted ledger with a plausible-looking event while every reader reports OK,
      and the real summary — the actual evidence being recorded — is gone with no
      indication it was ever passed.
    exit_criteria:
      - "A positional beginning with `--` is refused, not bound. Fail loud."
      - >
        Unrecognized trailing flags are refused rather than ignored, so a
        `--summary "…"` that the grammar does not accept cannot be silently dropped.
      - >
        Optionally accept the flag forms as aliases — the confusion is caused by
        sibling subcommands using flags, so making the grammar uniform removes the
        trap rather than only reporting it.
    verifiable_closure: >
      `append-event <id> --event verified --summary X` exits non-zero and writes
      nothing; a negative-control test pins it.
    notes: >
      Same class as the rest of this cycle: the wrong value was accepted, looked
      right, passed the integrity gate, and lost the payload in the direction nothing
      checks. The malformed event was reverted before commit — but only because a
      human-shaped review step happened to be in the loop, which is exactly the kind
      of guarantee this project refuses to rely on.
    events:
      - ts: "2026-08-10T08:40:00Z"
        event: filed
        summary: >
          Filed immediately after hitting it while recording the 606-9wqd verification.
