        - "fixture 4/4; falsified against hard-wired-absent and podman-probe-restored"

  - packet_id: guest-fetch-unit-and-build-flag-latent-wipe-traps
    event:
      type: progress
      ts: "2026-08-18T01:00:00Z"
      agent_id: macos-opus5-metal-20260818T002300Z
      host: macos
      host_note: TRAP 1 confirmed from inside systemd; race did NOT fire this boot; margin measured
      summary: |
        TRAP 1 CONFIRMED FROM SYSTEMD'S OWN RESOLVED VIEW, not from reading the
        cloud-init string. Captured in the guest during a live --exec-guest boot:

          Requires=sysinit.target system.slice
          After=sysinit.target systemd-journald.socket basic.target system.slice
                network-online.target
          RequiresMountsFor=

        `RequiresMountsFor=` is EMPTY and `After=` does NOT contain
        home-forge-src.mount. The ordering dependency genuinely does not exist —
        the packet's static claim is now a measured fact.

        BUT THE RACE DID NOT FIRE ON THIS BOOT, and saying so is the point of
        measuring rather than asserting. Monotonic timestamps from the guest
        journal:

          [ 2.998] Mounting home-forge-src.mount ...
          [ 3.005] Mounted  home-forge-src.mount        <- ActiveEnter 3005324
          [ 4.461] Starting tillandsias-headless-fetch  <- InactiveExit 4461400
          [ 4.480] Finished tillandsias-headless-fetch

        THE MOUNT WON BY 1.456 SECONDS. So TRAP 1 is exactly what the packet
        called it — LATENT — and this boot is one sample of a race, not a
        refutation of it. The margin is the useful new datum: 1.456s is small
        enough that a slower virtiofs mount (larger share, cold cache, a
        contended host, a bigger guest) closes it, and the failure mode when it
        closes is silent (fetch-headless.sh hits `if [[ -x "$DEST" ]]; then exit
        0; fi` and keeps the OLD binary). The fix — `After=home-forge-src.mount`
        plus a loud diagnostic on the silent fall-through — is still warranted
        and now has a number behind it.

        CONFIRMED CORROBORATING: `findmnt` reports `virtiofs home-src
        /home/forge/src`, so the share itself is healthy.

        NOT FIXED THIS CYCLE, and the reason is structural rather than
        scheduling: cloud-init user-data runs FIRST BOOT ONLY, so an edited unit
        reaches only a freshly provisioned guest. The existing VM keeps the old
        unit baked in, and the only way to make an edit take effect is
        --reset-guest, which wipes the 11.83 GiB VM dir and the in-VM Vault
        (804-bpke/804-deux). So the fix is shippable statically with a shape
        test but is NOT live-verifiable without a destructive reprovision; that
        trade belongs to a cycle that owns the reprovision, not to this one.

  - packet_id: guest-binary-staging-is-last-writer-wins-and-invisible
    event:
      type: progress
      ts: "2026-08-18T01:00:00Z"
      agent_id: macos-opus5-metal-20260818T002300Z
      host: macos
      host_note: end-to-end staging identity proven in the running guest
      summary: >
        THE ONE LINK HOST-SIDE FILES CANNOT ESTABLISH IS NOW ESTABLISHED. The
        2026-08-12 slice discharged criterion 2 on a host-side PROXY — the
        staged file matches the bundle. This boot closes the loop from inside
        the guest: `sha256sum /usr/local/bin/tillandsias-headless` reports
        87013bc60690c86897edb73c84edc0df58ce91d9590ab0bac8ba2f5859bae29b, byte
        identical to the staged copy at
        /home/forge/src/.tillandsias/guest-bin/tillandsias-headless AND to the
        aarch64 guest binary embedded in dist/Tillandsias.app. So the staged
        copy is demonstrably what the guest actually installs and runs.
        A DOWNGRADE WAS ARMED AND AVOIDED. /Applications/Tillandsias.app carries
        an OLDER embedded guest binary (701c2a011ea4380c31bfa93160d87979f4ec9a
        560a76594a59e8bd8f4c72706b, Aug 14) than the staged one (Aug 16).
        Running ANY staging entry point from the installed bundle would have
        silently overwritten the staged binary with the older one and the guest
        would have installed it on its next boot — which is precisely the
        last-writer-wins invisibility this packet is about, sitting live on this
        host right now. The boot was deliberately driven from dist/, whose
        embedded binary is byte-identical to the staged one, and the staged sha
        was re-verified UNCHANGED after the boot.
        Criteria 1 and 3 remain open (the refusal and the cannot-stage
        announcement); this event only upgrades criterion 2's evidence.

packets:
  - packet_id: unsigned-tray-build-cannot-boot-a-vm-and-does-not-say-why
    order: 811-j9fc
    status: ready
    desired_release: v0.5
    priority: p2
    kind: enhancement
    title: "the plain cargo-build tray cannot start a VM — it lacks the virtualization entitlement — and the failure is a JSON blob that names neither the cause nor the signed bundle that works"
    deliverable: "a fail-loud message on the entitlement path naming scripts/build-macos-tray.sh and the dist bundle, or a preflight that detects the missing entitlement before attempting the boot"
    pickup_role: macos
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [macos, vz, fail-loud, developer-experience, entitlements]
    estimated_hours: 2
    context: |
      HIT THIS CYCLE, first boot attempt, and it cost a boot. Running

        ./target/release/tillandsias-tray --exec-guest '...' < /dev/null

      printed:

        [exec-guest] starting VM…
        {"error":"start: validate: Invalid virtual machine configuration.
         The process doesn't have the "com.apple.security.virtualization"
         entitlement."}

      CONFIRMED: `codesign -d --entitlements -` shows
      com.apple.security.virtualization present on
      dist/Tillandsias.app/Contents/MacOS/tillandsias-tray and ABSENT on
      target/release/tillandsias-tray. scripts/build-macos-tray.sh does the
      Info.plist substitution + ad-hoc codesign + entitlement; a bare
      `cargo build` cannot and does not.

      WHY THIS IS WORTH A PACKET RATHER THAN A NOTE. `target/release/<binary>`
      is the reflexive path for anyone who just built — every other binary in
      this workspace is used that way, and the cross-platform habit is to avoid
      the installed .app precisely because it may be stale. Here that instinct
      is inverted and the diagnostic does not say so: it names an Apple API
      constraint, not the project's own build step, and offers no next action.
      The signed artifact is one directory away.

      MADE WORSE BY AN ADJACENT HAZARD (see the 701-kgvk event in this
      fragment): the OTHER obvious candidate, /Applications/Tillandsias.app,
      currently carries an OLDER embedded guest binary than dist/, so reaching
      for it instead SILENTLY DOWNGRADES the staged guest binary. So of the
      three plausible tray paths on this host, one cannot boot, one downgrades
      the guest, and only dist/ is correct — and nothing tells you which is
      which at the point of failure.

      SMALLEST FIX: match the entitlement error and print the working
      invocation. A preflight that checks the entitlement before attempting the
      boot is the fuller version, but the message alone converts a wasted boot
      into a redirect.
