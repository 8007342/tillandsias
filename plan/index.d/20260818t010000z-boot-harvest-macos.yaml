  - packet_id: e2e-preflight-false-live-runtime-on-macos
    event:
      type: completed
      ts: "2026-08-18T01:00:00Z"
      agent_id: macos-opus5-metal-20260818T002300Z
      host: macos
      summary: >
        ALL THREE CRITERIA MET, and the boot made the defect far worse than
        filed. The packet said the probe reports skip:live-runtime-present when
        podman is installed but its machine is stopped. MEASURED THIS CYCLE
        AGAINST BOTH STATES: it printed skip:live-runtime-present with NOTHING
        running AND, during a real --exec-guest boot, with a LIVE VM. THE
        VERDICT WAS A CONSTANT — it carried no information at all, so it could
        never distinguish the two states it exists to distinguish. That is a
        stronger claim than the filing and it changes what "fixed" has to mean:
        criterion 3 alone ("no longer prints skip when the machine is stopped")
        is satisfiable by a probe that is constant the OTHER way, which would
        silently disarm the guard that stops an e2e wiping a live stack.
        CRITERION 1 — reachability before inference. `podman ps` erroring meant
        PRESENT, which is only sound when the error means "the daemon is there
        and unhappy". On macOS podman is a client for a machine VM this project
        does not use (`podman-machine-default` LAST UP Never here), so it errors
        on a host with no containers at all. An unreachable runtime is ABSENT —
        there is nothing to leak. A `podman info` gate now runs first; the
        leak-not-destroy convention is preserved for the case it was written
        for, once the runtime ANSWERS.
        CRITERION 2 — Darwin consults the VZ guest. The signal is an open file
        handle on the VM's backing disk, chosen because it was MEASURED: during
        the live boot, `lsof rootfs.img` showed `com.apple ... rootfs.img`, and
        nothing held it before or after. NOT `pgrep -f tillandsias-tray`, which
        is the obvious choice and is WRONG — `-f` matches the whole command
        line, so it fires on any process merely MENTIONING the string. That is
        not hypothetical: the first draft of this probe reported PRESENT against
        its own invoking shell during this very boot. The lsof arm is what saved
        it, and the pgrep arm was removed.
        CRITERION 3 — verified on this host: with the podman machine stopped and
        no VM running, `eligibility` now prints `eligible`.
        PINNED WITH A FIXTURE ASSERTING ALL THREE TRANSITIONS, not just the one
        criterion 3 names: unheld image -> eligible; HELD image -> refuses (the
        safety property); released -> eligible again (a probe that latched
        PRESENT once would pass the first two); absent image -> eligible. 4/4.
        FALSIFIED: hard-wiring the probe to "not live" — the shape that
        disarms the guard — fails on `held-image-refuses`, and so does reverting
        the Darwin branch to the podman probe. Restore returns 4/4.
      evidence_refs:
        - "scripts/e2e-preflight.sh — podman info reachability gate; vz_guest_is_live() lsof probe; fixture mode"
        - "measured: skip:live-runtime-present with NO VM and with a LIVE VM (constant verdict)"
        - "live boot: lsof rootfs.img -> com.apple PID 87511; nothing before/after"
