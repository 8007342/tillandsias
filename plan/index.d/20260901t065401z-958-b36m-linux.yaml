packets:
  - packet_id: bound-litmus-must-be-runnable-not-merely-parseable
    order: 958-b36m
    status: ready
    kind: fix
    priority: p1
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    pickup_role: linux
    depends_on: []
    capability_tags:
      - litmus
      - ci
      - fail-loud
      - testing
    title: >
      Three gates stand over every litmus file and none asks the RUNNER whether
      it can run one — a file can be valid YAML, correctly bound, and still
      unparseable by the only thing that executes it.
    context: |
      MEASURED, by causing it. litmus:codex-e2e-launch-parity landed
      2026-09-01 with a top-level `steps:` key; scripts/run-litmus-test.sh
      reads `critical_path:`. It extracted ZERO steps and failed the whole
      file with "no parseable critical_path steps", reddening every full
      pre-build litmus run fleet-wide for about four hours until macuahuitl
      caught it on clean trunk with a worktree control.

      THE FILE PASSED EVERY EXISTING GATE ON THE WAY IN:

        check-litmus-yaml-parses.sh   valid YAML under the sanctioned reader —
                                      a DIFFERENT question, and it answered its
                                      own question correctly
        check-litmus-bindings.sh      bound in openspec/litmus-bindings.yaml,
                                      so 660-ryhn's "nothing will ever run
                                      this" was satisfied
        expression-pinning (634-39ik) the steps assert behaviour, not source

      Three green checks over a file no runner could enter. The author had
      also executed all nine step commands BY HAND and watched them pass, and
      reported that as evidence — behavioural verification of the CONTENT
      standing in for verification of the DELIVERY MECHANISM.

      THE CLASS IS 944-vim8, ONE FILE FORMAT OVER, and the same key name:
      plan fragments keyed `steps:` when the fold reads `packets:` parse,
      validate, pass `tillandsias-plan check`, read correctly to a human, and
      are silently discarded because the READER never enters the block. The
      author of check-fragment-keys-are-read.sh reproduced it in YAML the
      litmus runner consumes. That is recorded deliberately: the class
      survives expertise, which is the argument for mechanical coverage
      rather than for being more careful.

      WHY THE RUNNER'S OWN PARSER AND NOTHING ELSE. The parser lives inline
      in run_litmus_test_file() and there is no parse-only entry point today,
      so the gate must either gain one or reimplement the parse. A
      reimplementation would assert the gate's OWN idea of the format and can
      go green while the runner refuses the file — strictly worse than no
      gate. Two parsers agree on the day they are written; this corpus has
      two instances THIS WEEK of a rule copied to one lane and left on
      others (702-6jza D3 and D4). Coordinator ruling 2026-09-01: option (a),
      the runner's parser is the only authority on what the runner can parse,
      and the gate's job is to ASK it.
    exit_criteria:
      - run-litmus-test.sh gains a parse-only mode that returns the same PARSE FAIL / PARSE ERROR verdicts and exit status as a real run WITHOUT executing any step, and executes nothing when invoked
      - the 660-ryhn binding gate calls that mode for each NEWLY-BOUND file and refuses a bound-but-unparseable one, diff-scoped so the existing corpus cannot flip the fleet red at once (699-dycj)
      - a fixture proves BOTH directions under mutation - a file whose steps the runner cannot extract is refused, and a well-formed newly-bound file passes; the arms must fail when the check is reverted
      - a one-shot parse of the WHOLE bound corpus is run at landing and its count recorded in the closure evidence; any unparseable file found is listed there and becomes ordinary packet work on its own merits, with no gate flip
    notes: |
      Order minted with next-order. Scope and both rulings are the
      coordinator's (2026-09-01): option (a), diff-scoped gating plus a
      non-gating advisory count, plus the one-shot corpus scan at landing.
      Filed by the host that caused the defect.
