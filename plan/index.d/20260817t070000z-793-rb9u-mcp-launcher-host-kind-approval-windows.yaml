# host and every agent harness; ESMERALDINHA has evidence about ONE host kind
# and explicitly does not know whether any option below is compatible with the
# other four. The completion gate is per-host-kind approval, and a single
# refusal is a valid terminal outcome.
packets:
  - packet_id: mcp-json-launcher-host-kind-compatibility
    order: 793-rb9u
    status: ready
    kind: decision
    pickup_role: any
    priority: p2
    desired_release: v0.5
    multi_cycle: true
    release_target: forge-local-experts-milestone
    capability_tags:
      - experts
      - mcp
      - windows
      - wsl2
      - cross-platform
      - forge
    tags:
      - experts
      - mcp
      - cross-platform
      - decision
      - v0.5
    title: |
      Decide whether `.mcp.json`'s expert launcher should name its interpreter explicitly, with per-host-kind compatibility approval before anything changes.
    context: |
      `.mcp.json` launches both expert servers as:

          {"command": "bash", "args": ["images/default/config-overlay/mcp/forge-plan.sh"]}

      `bash` is resolved from PATH by the agent harness. THAT RESOLUTION IS NOT
      THE SAME ON EVERY HOST, and the difference decides which runtime the
      expert servers execute in.

      MEASURED ON windows/ESMERALDINHA (2026-08-17):
        * `bash` resolves to Git Bash (C:\Program Files\Git\usr\bin\bash.exe),
          so the MCP servers run WINDOWS-side.
        * `with-wsl2-builder.sh` builds `tillandsias-plan` into a distro-native
          CARGO_TARGET_DIR (deliberately: "9p-backed target/ makes cargo
          crawl"), so the only binary that exists is a Linux ELF.
        * A Windows-side server cannot exec a Linux ELF, so
          `check-mcp-expert-health.sh` reports `down:forge-plan,project-info`
          on every cycle of this host's first week.
        * From inside `tillandsias-build` the SAME expert answers correctly
          with citations (verified: `plan_answer "what is the current
          Direction?"` returns the operator's Direction text citing
          plan/loop_status.md:6731).

      REPORTED FOR windows/Yolanda (ledger, order 718-rtnh): `bash` resolves to
      WSL's bash there, the servers run inside WSL2, and the experts work —
      evidenced by 1766 expert calls carrying `citation_root:
      /mnt/c/Users/bullo/claudia/tillandsias` and an ELF
      `target/release/tillandsias-plan`.

      So one committed `.mcp.json` yields a DIFFERENT expert runtime per host,
      determined by PATH order alone, and neither host declares which it got.
      On one Windows host the experts work; on the other they have never worked.

      WHY THIS IS WORTH A DECISION PACKET RATHER THAN A FIX. The cost is not
      latency. On 2026-08-17 this host, running with the experts down all week,
      fell back to the filesystem for every read — and read the files it thought
      to look for. `scripts/dev-inference-ensure.sh` had already settled the
      question it spent two cycles measuring, and it never opened that file; it
      then shipped a `networkingMode=mirrored` change that the operator reverted
      on security grounds. A degraded expert path does not merely slow retrieval
      down: it silently narrows what an agent thinks to ask. That is the damage
      this packet exists to stop, and it is why "just leave it degraded on one
      host" is not an acceptable resting state.

      WHAT IS NOT KNOWN, AND IS THE WHOLE REASON FOR THE GATE: whether ANY of
      the options below is compatible with linux_mutable, linux_immutable,
      macos, or forge. This host has evidence about exactly one host kind. The
      forge in particular mounts the checkout and runs its own `bash`, and its
      `lib-common.sh` exports CARGO_TARGET_DIR so `./target` does not exist in
      the mounted checkout at all (order 783-jdeh) — an option that assumes a
      Windows/WSL split may be meaningless or harmful there.

      CONSTRAINT FROM THE OPERATOR (2026-08-17): the enclave network stays
      ISOLATED. `networkingMode=mirrored` was assessed by the sibling windows
      host as a lower security boundary and is withdrawn. Any option here must
      work under default WSL2 NAT.
    options: |
      A. LEAVE `.mcp.json` UNCHANGED; fix per-host instead.
         Each host makes `bash` resolve to the interpreter whose runtime owns
         the built binary (PATH order, or a per-host wrapper). Zero shared-file
         risk; the inconsistency stays implicit and undeclared, and the next
         new host rediscovers it.

      B. NAME THE INTERPRETER EXPLICITLY in `.mcp.json`.
         e.g. a launcher that resolves the correct interpreter per platform
         rather than trusting PATH. Makes the runtime declared instead of
         emergent. RISK: `.mcp.json` is consumed by several harnesses (claude,
         opencode, codex, gemini) whose command/arg handling may differ, and by
         the forge, where the Windows/WSL distinction does not exist.

      C. MAKE THE SERVER SELF-LOCATING.
         Leave `command: bash`, and have `forge-plan.sh` / `project-info.sh`
         detect that the binary they need is not executable in their current
         runtime and re-exec into the one where it is. Keeps `.mcp.json`
         untouched (no shared-schema risk at all) and puts the platform logic
         in scripts this project already owns. RISK: a re-exec inside an MCP
         stdio server must not disturb the JSON-RPC stream on stdin/stdout.

      D. BUILD A NATIVE ARTIFACT per runtime so the question disappears —
         on Windows, a PE `tillandsias-plan.exe` beside the ELF. RISK: two
         artifacts in one tree is exactly the mixed-platform pollution
         704-zcgi / 770-ifeg exist to survive, and it doubles build time on the
         host that can least afford it (21 min cold on ESMERALDINHA).

      No option is recommended here. Each verifying host should report which
      options are compatible with ITS runtime and which are not.
    exit_criteria:
      - |
          Every host kind has emitted a verified-by event recording, for its own
          runtime: what `bash` in `.mcp.json` resolves to there; whether the
          experts currently answer; and which of options A-D are compatible,
          incompatible, or not-applicable on that host kind — with a reason.
      - |
          A single option is selected, or the packet closes as
          `leave-unchanged` with the incompatibility that ruled the others out
          named explicitly. Both are valid terminal outcomes; a refusal by any
          host kind is a result, not a failure.
      - |
          The selected option (if any) is implemented and re-verified by at
          least the two Windows hosts, since they are the pair that currently
          DISAGREE — ESMERALDINHA's experts are down and Yolanda's work, from
          the same committed file.
      - |
          `.mcp.json` is not modified before the completion_gate is satisfied.
          This criterion is the point of the packet: the file is shared, and
          the filing host does not know whether a change is compatible.
    verification_required:
      agents:
        - id: host-kind-windows
          note: two hosts, currently disagreeing — both should report
          criteria: [HK-RESOLVE, HK-EXPERTS, HK-OPTIONS]
        - id: host-kind-linux-mutable
          criteria: [HK-RESOLVE, HK-EXPERTS, HK-OPTIONS]
        - id: host-kind-linux-immutable
          criteria: [HK-RESOLVE, HK-EXPERTS, HK-OPTIONS]
        - id: host-kind-macos
          criteria: [HK-RESOLVE, HK-EXPERTS, HK-OPTIONS]
        - id: host-kind-forge
          note: mounted checkout, own bash, CARGO_TARGET_DIR exported (783-jdeh)
          criteria: [HK-RESOLVE, HK-EXPERTS, HK-OPTIONS]
      completion_gate: >
        ALL FIVE host kinds must emit a verified-by event covering HK-RESOLVE,
        HK-EXPERTS and HK-OPTIONS before `.mcp.json` may be modified. Any host
        kind reporting an option INCOMPATIBLE removes that option from
        consideration — a single refusal is decisive and does not need
        overriding. If every option is refused by some host kind, the packet
        closes as `leave-unchanged` (option A) with the refusals recorded, which
        is a successful outcome. Approval is per HOST KIND, not per host: one
        report per kind suffices, except windows where BOTH hosts should report
        because they currently disagree.
    criteria_definitions: |
      HK-RESOLVE — On this host kind, what does the `bash` in `.mcp.json`
        actually resolve to? Report the resolved path (e.g. `command -v bash`,
        or `where.exe bash` on Windows) and which runtime the MCP servers
        therefore execute in.
      HK-EXPERTS — Do the experts currently answer on this host kind? Report
        `scripts/check-mcp-expert-health.sh` verbatim, and whether a
        `plan_answer` returns a cited envelope or `confidence=unsupported`.
      HK-OPTIONS — For each of options A-D: compatible / incompatible /
        not-applicable on this host kind, with a one-line reason. Name any
        harness-specific constraint (claude, opencode, codex, gemini) known to
        apply.
