        IMPLEMENTED AND CLOSED at 386bc9ea6. All four exit criteria met, and criterion 3 — prove it on a real launch, not a unit test — is the one that earned its keep by failing informatively on the first try.

        THE DECISION CRITERION 2 ASKED FOR, made explicitly: REFUSE, not log. The worry I filed this packet with is real — run_agent_container_attached is the choke point for every attached agent launch, so a false positive stops every forge on the host. Three things settle it. There are exactly TWO production call sites and both are forge launches already carrying the whole envelope; the apparent third at main.rs:22155 is inside `mod tests` (which opens at 16351), which I checked rather than counted. The function already returns Result<(), String> and both callers already handle the error, so refusing costs no new plumbing and cannot surprise a caller. And the test below asserts the REAL builders produce a validating argv, so a false positive fails the GATE rather than someone's launch. Given all three, the only way to reach this refusal is for someone to remove a hardening flag — the exact regression the check exists to stop — and letting that through with a log would be the fail-safe-looking outcome this fleet keeps paying for.

        A DETAIL THAT WOULD HAVE BROKEN EVERY LAUNCH IF I HAD MISSED IT: "run" is PREPENDED downstream. client.rs's run_container_attached_observed starts `let mut full_args = vec!["run".to_string()]` and then extends with what it was given, so the `args` this function receives is NOT what podman gets. validate_launch_argv requires the run subcommand, so validating `args` directly would have returned MissingRunSubcommand for every correct launch — a check that refuses everything looks exactly like a check that works until you run it. I validate the argv podman actually receives.

        CRITERION 3, AND THE FIRST ATTEMPT WAS INCONCLUSIVE IN THE MOST USEFUL WAY. I removed --cap-drop=ALL from build_stack_common_args, rebuilt, and ran a real `tillandsias . --opencode`. IT LAUNCHED. No refusal. For about a minute that read as my check being dead — and it was the check being RIGHT: --cap-drop=ALL appears TWICE in the forge argv, and the second occurrence in build_opencode_forge_args still carried it, so the argv was still compliant and there was nothing to refuse. I confirmed it on the container that started: podman reported the full expanded CapDrop set. If I had stopped at "removed a flag, launched anyway, therefore the guard is broken" I would have filed a false defect against my own working code; if I had stopped at the unit test I would never have learned the flag is duplicated.

        WITH BOTH OCCURRENCES REMOVED, a real launch refused:
          [security] refusing to launch tillandsias-tillandsias-forge: launch argv is missing mandatory hardening flags: --cap-drop=ALL
          Error: [OpenCode] forge session exited: ... hardening envelope violation
        rc=1, refused BEFORE podman was spawned, no container created, and the missing flag named. That is the criterion satisfied on the real path rather than reasoned about.

        RESTORATION VERIFIED RATHER THAN ASSUMED, because I had deliberately damaged a security path: the diff against HEAD is 101 additions and ZERO removals, and a grep for removed lines matching cap-drop/userns/no-new-privileges/label=disable is empty. No flag was lost putting the tree back.

        CRITERION 4: no second copy of the flag list. The check calls policy::validate_launch_argv, which reads MANDATORY_HARDENING_FLAGS. One definition, now two consumers — the ContainerSpec path from 972-6vaj and this one.

        WHAT I DID NOT DO: touch 981-n5vx's memory ceiling, which is the same choke point from the other side. That packet is blocked on a fleet policy decision about the ceiling VALUE and is not mine to settle; this change is orthogonal to it and neither blocks the other. Whoever takes 981-n5vx will find run_agent_container_attached already validating argv, which is the natural place to add --memory/--memory-swap enforcement once the number exists.
