# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by linux_mutable (macuahuitl), 2026-08-17T11:05Z.
#
# The 2026-08-15/16 operator directive opens with "UNBLOCK LANE first — rebuild
# the tillandsias-git image at the installed VERSION (stale image predating
# 756-2jnj is why upstream-auth verdict refs never publish)". That instruction
# was correct when written. It is no longer the state of this host, and doing
# it would have been a no-op dressed as progress. What is actually blocking the
# lane is below, measured.
packets:
  - packet_id: upstream-auth-refs-blocked-by-absent-mirror-not-stale-image
    order: 798-c4mq
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "the upstream-auth verdict refs do not publish on macuahuitl because the git-mirror service container does not exist — the image is current and carries the probe, so rebuilding it changes nothing"
    deliverable: "the lane names its own precondition: something states, in a machine-checkable way, that publishing refs/tillandsias/upstream-auth/<state>/<epoch> requires a RUNNING mirror service, and reports which of image / container / service is missing rather than leaving a reader to infer staleness"
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [git-mirror, forge, upstream-auth, fail-loud]
    estimated_hours: 3
    context: |
      OBSERVED on macuahuitl, 2026-08-17T11:00Z. Measurements only.

        * localhost/tillandsias-git:v0.4.260815.1 was built 2026-08-17
          05:54:19 UTC. Order 756-2jnj (b7850fadc, which introduced
          probe-upstream-auth.sh) landed 2026-08-15 10:12 PDT. The image is
          two days NEWER than the change it was said to predate.
        * The probe is IN the image at the path the Containerfile installs it
          to, /usr/local/share/git-service/probe-upstream-auth, and its size
          matches the source byte-for-byte: 8807 in-image, 8807 on disk.
          (The first check looked for /usr/local/bin/probe-upstream-auth.sh and
          found nothing — Containerfile line 92 renames it on COPY. A "missing"
          answer from the wrong path is how a current image reads as stale.)
        * `podman ps -a` for tillandsias-*: dev-inference Up, proxy Up,
          vault Exited(137) 5 hours ago, nix Exited(143) 2 days ago. There is
          NO tillandsias-git container, running or exited. It has not been
          created in this stack.
        * `git ls-remote origin 'refs/tillandsias/upstream-auth/*'` is empty,
          which is expected — the refs live in the enclave mirror, and there is
          no enclave mirror.

      SO THE CAUSAL CHAIN IS: no mirror container -> no service -> no probe run
      -> no refs. Rebuilding the image cannot affect any link in it. Anyone who
      "unblocks the lane" by rebuilding will get a clean build, no refs, and no
      information about why.

      WHY IT IS WORTH A PACKET RATHER THAN A SHRUG: the directive's inference
      was reasonable — a missing verdict ref and a known bake-timing class
      (743-y5wh) do point at image staleness, and on the host where it was
      written it may well have been true. The lane simply has no way to say
      which of its three preconditions (image built / container created /
      service healthy) is unmet, so every absence looks like the last one
      somebody debugged. That is the fail-loud defect here, and it is cheap:
      the probe's own caller can report which precondition failed.

      NOT CLAIMED: that the lane works once the mirror runs. That needs the
      stack up, which needs the destructive e2e — see the deferral note below.
  - packet_id: enclave-services-die-and-nothing-notices-beyond-squid
    order: 798-tk7b
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "vault sat Exited(137) for 5 hours and the nix container Exited(143) for 2 days with zero alarms — 767-es4w scoped this to squid, but the blind spot is every enclave service"
    deliverable: "a single place that reports the health of the whole enclave service set with its last exit code and age, so a dead service is visible without anyone running `podman ps -a` by hand; squid's supervision (767-es4w) becomes one instance of it rather than a special case"
    pickup_role: linux
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [forge, supervision, fail-loud, diagnostics]
    estimated_hours: 4
    context: |
      OBSERVED, macuahuitl 2026-08-17T11:02Z, incidentally while checking why
      the git mirror was absent:

        tillandsias-nix              Exited (143)  2 days ago
        tillandsias-vault            Exited (137)  5 hours ago (healthy)
        tillandsias-proxy            Up 31 minutes (healthy)
        tillandsias-dev-inference    Up 5 minutes  (healthy)

      143 is SIGTERM, 137 is SIGKILL. Neither produced an alarm anywhere a
      cycle would see it, and neither was noticed by any of the several cycles
      that ran on this host in those five hours — including ones that used
      podman heavily.

      Note the second line especially: podman prints `Exited (137) ... (healthy)`
      because the recorded healthcheck state outlives the container. A dead
      service advertising "healthy" is worse than one advertising nothing, and
      it is the same shape as 797-5kqe (a preflight asserting a cause it never
      measured) and as the ENV-FAIL class generally: the status line is not
      merely absent, it is confidently wrong.

      RELATION TO 767-es4w, which is being worked in parallel this cycle: that
      packet says squid "has 263 recorded SIGSEGVs since 2026-06-30 and nothing
      watches it". This fragment is the evidence that the unwatched set is not
      squid-shaped. Whoever takes this should build on whatever supervision
      767-es4w lands rather than starting a second mechanism — and 767-nkkq's
      harness-supervisor.sh (2026-08-16) is the third instance of the same
      pattern, so there are now three and they should converge on one
      vocabulary before there are four.
events:
  - packet_id: unit-tests-reach-the-real-image-layer-and-race-each-other
    event:
      type: note
      ts: "2026-08-17T11:05:00Z"
      agent_id: linux-macuahuitl-opus5-20260817T105735Z
      host: linux_mutable
      summary: |
        DESTRUCTIVE E2E DEFERRED THIS CYCLE, with the reason, because "eligible
        but not run" is otherwise indistinguishable from "forgotten".

        `scripts/forge-e2e-rate-limit.sh status full` answers `allow:full`, so
        the rate limiter permits it and the directive asks for it. It was not
        run because three fork agents were working this host concurrently and
        the e2e's first act is `podman system reset --force`, which deletes
        every container, volume, secret and image for this user. Two of those
        forks run `./build.sh --ci-full` as their closing gate. Wiping the
        image store underneath them would not merely slow them down, it would
        invalidate whatever verdict they then reported — and a fork reporting
        a green gate it did not actually get is precisely the false-green class
        this milestone exists to remove.

        So the correct sequencing is: e2e in a cycle with NO forks in flight,
        or e2e first and forks after. Recorded here rather than left implicit
        so the next cycle can just do it instead of rediscovering the conflict.
