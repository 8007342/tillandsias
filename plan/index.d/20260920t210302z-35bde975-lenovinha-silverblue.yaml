--components=secrets'. Secret Service is the SECOND. My earlier 'keyring PID unchanged' claims were measured with 'ps -C gnome-keyring-d | head -1', which can return either, so the claim was looser than I presented it. All future evidence on this row names --components=secrets explicitly. NOTED ODDITY, not a row until it costs something: 'ssh-keygen -L' on the host cert file reports 'line 2: invalid key: invalid format' while the certificate itself parses and validates — something extra is being written to that file.
