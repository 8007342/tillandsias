  - packet_id: windows-host-lemonade-relay
    order: 2456-lrly
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: windows
    capability_tags: [windows-tray, hvsocket, security, local-inference]
    estimated_hours: 8
    owned_files: []
    related: [2454-lhar, 2455-lomp]
    title: |
      The Windows tray relays an allowlisted subset of host Lemonade to forges over hvsocket
    context: |
      Measured in a doris forge (2026-11-28): no default route, host.containers.internal:13305 refused (rc=56), only
      inference:11434 (enclave Ollama) and the lane MCP socket reach out. Reuse ControlMessage::SetVsockForwardTarget
      and the guest vsock forwarder (macos-host-native-inference) under a separate enclave alias "lemonade", so Ollama
      keeps inference:11434 and lemonade is added to NO_PROXY. Allowlist: chat and completions, embeddings, audio,
      images, and GET models; approved models only; no pull, delete or load. Per-VM credential and caps. Needs the
      coordinator's security review before build.
    verifiable_closure: |
      A fixture where the relay forwards an allowlisted request to a stub upstream and refuses /api/v1/pull and an
      unapproved model by name.
    unscoreable: "unpinnable-until-the-guard-exists: the relay ships its own fixture"
    next_action: Coordinator reviews the allowlist, then build.
