      summary: >
        CRITERION 1 MET, and chasing criterion 2 turned up a CORRECTNESS defect that matters more than the speed.  THE GATE NOW MEASURES ITSELF. `_step` is instrumented once — 45 call sites, none touched — so every phase is timed, and the run ends with the total plus any phase over 5s (TILLANDSIAS_GATE_PROFILE=1 for all). Quiet by default, because 45 timing lines per commit is how a signal gets ignored (734-sjb3).  The previously-silent tail is now two NAMED phases. Three consecutive runs, tight:    40.7 / 40.4 / 40.9 s   Ratcheting ghost traces for the gate stamp (584-2qq2)   29.9 / 29.9 / 29.8 s   Checking scripts invoked by path are executable   25.7 / 25.5 / 25.7 s   Writing the gate stamp   131 / 127 / 127 s      total  So the ~40s I recorded as unattributed IS trace-coverage --gate, called from _write_gate_stamp, which had no _step and therefore no name. My previous conclusion ("the attribution was wrong") was itself half wrong: the phase was right, the magnitude was not. In-gate it costs 40s where standalone it costs 20s, and the stamp write costs 25s where standalone it costs 4.5s — both roughly double-to-sixfold under the gate, which is a cache-state effect nobody had measured because nothing reported it. The first run after any edit is also much slower (type-check 2.7s -> 23.6s cold), which is exactly the noise that made single-run profiling mislead me.  CRITERION 2 (exec-bits, 30s) NOT DONE, deliberately, and here is what happened.  I inverted it — one sweep instead of 26 over 612 caller files, and one awk pass instead of a four-process filter chain per candidate. Measured 16.3s -> 1.3s standalone, with stdout and stderr BYTE-IDENTICAL on the real tree. I nearly shipped it on that evidence. It is worthless evidence: the tree has zero violations, so both versions were agreeing on an empty answer. An optimisation verified only against a passing tree is verified against the one case that cannot detect a broken checker.  So I wrote scripts/test-script-exec-bits.sh — six scenarios, both directions, in a throwaway git repo. (A first attempt built them in the real checkout with `git add -N` + `git update-index --chmod`; that mutates shared index state and produced a misleading comparison. Do not do that.)  The fixture failed my rewrite immediately: the awk re-applied the POSITIVE pattern to grep's `file:lineno:content` output line, where `^` anchors at the FILENAME, so a bare invocation at the start of a line stopped matching. `echo hi | scripts/x.sh` kept passing by accident because its pipe satisfied the alternation anyway. Two more attempts to fix the quoting broke the awk program outright (apostrophes in my own comments closed the single-quoted string). At that point I reverted the rewrite rather than keep editing a checker at 5am, which is the right trade and is why criterion 2 is still open.  THE FIND, from running the fixture against the UNTOUCHED original: it fails `command-substitution-refused`. The pattern ends `([[:space:]"]|$)` and therefore cannot match `$(scripts/x.sh)` — the next character is `)`. This checker could not see the invocation form named in its OWN header as the defect it exists for:    run_id="$(scripts/resolve-release-run.sh "${new_tag}")"  FIXED, and not the obvious way. Adding `)` to the trailing class fixes the substitution case and breaks three others, because `(` is already in the LEADING class — so `(path)` anywhere in PROSE starts matching. Measured: it flagged three comments, one naming scripts/plan-binary-probe.sh, a SOURCED library that must stay non-executable. That is 601-462g's own shape. The pattern is now two alternatives and `)` is permitted only after `$(`. Fixture 6/6, real tree back to `ok:script-exec-bits:26 checked`.  The fixture is wired into litmus:script-exec-bit-shape. That litmus remains RED on windows for a PRE-EXISTING inline step whose expected `checked` counts are off by one — already listed in 751-vega's residue, not touched here.
