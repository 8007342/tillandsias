  - packet_id: ghost-trace-gate-is-blind-to-yaml-and-markdown-annotations
    order: 867-vd4z
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: the ghost-trace gate scans six file types and misses two — more than half of all @trace annotations (yaml 979, md 1347) are outside it, hiding at least seven real ghosts
    deliverable: the ghost-trace gate's scanned file set covers where traces actually live, or the exclusions are declared and justified in the script rather than being an accident of a grep glob; either way the ~7 real ghosts currently hidden in yaml are surfaced and dispositioned
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags:
      - openspec
      - traces
      - ghost-trace-ratchet
      - ci
    estimated_hours: 4
    context: |
      MEASURED (lenovinha, 2026-08-23), while working 658-kcd5. Counting
      `@trace spec:` annotations by file type across the tree:

        rs   1270      yaml           979   <- NOT SCANNED
        sh    515      md            1347   <- NOT SCANNED
        toml   25      Containerfile   56
        nix     4      ps1              6

      `scripts/trace-coverage.sh` — the authoritative gate, wired into
      `./build.sh --check` via the 584-2qq2 ratchet — greps
      `*.rs *.sh *.toml *.nix *.ps1 Containerfile*`. So roughly 1,876
      annotations are gated and roughly 2,326 are not. THE MAJORITY OF THIS
      REPOSITORY'S TRACE ANNOTATIONS ARE OUTSIDE THE CHECK THAT VALIDATES
      THEM, and the coverage number the gate reports is computed over the
      minority.

      THERE ARE REAL GHOSTS IN THERE. Of 127 distinct specs referenced from
      yaml, these have no spec directory and are NOT in the ratchet baseline:

        browser-isolation-telemetry   control-socket
        cross-platform-compilation    enclave-network-isolation
        ephemeral-guarantee           forge-launch
        service-startup

      Seven, invisible to every gate, for as long as the glob has been what it
      is. `openspec/litmus-tests/*.yaml` is where litmus tests bind themselves
      to specs, so these are exactly the bindings the convergence argument
      leans on.

      WHY A ONE-WORD GLOB FIX IS WRONG, and this is the part worth reading
      before taking the packet. The same yaml scan also turns up `foo`, `a`,
      `does-not-exist`, `not-a-real-spec`, `zzz-definitely-no-such-spec-xyz`,
      and several truncated ids (`chromium-`, `podman-secrets-`, `project-`).
      Those are NEGATIVE-CONTROL FIXTURES — litmus tests that assert the ghost
      checker rejects a fabricated trace — plus partial matches from the
      `[a-zA-Z0-9_-]+` pattern meeting an interpolated id. Adding `*.yaml` to
      the glob would make the gate fail on its own test fixtures, on every
      host, immediately. Whoever takes this needs a fixture-exclusion rule
      (a marker, a path convention, or an allowlist) BEFORE widening the glob.
      Markdown needs its own answer for the same reason: 219 distinct specs are
      referenced from md, some of it prose and examples rather than annotation.

      THERE ARE ALSO THREE DIFFERENT GHOST CHECKERS WITH THREE DIFFERENT FILE
      SETS, which is how this stayed invisible:

        scripts/hooks/pre-commit-openspec.sh   rs sh toml            (author-facing)
        scripts/validate-traces.sh             rs sh toml nix
        scripts/trace-coverage.sh              rs sh toml nix ps1 Containerfile*  (the gate)

      They disagree on live data today, not hypothetically: `trace-coverage.sh`
      counts 9 ghosts and `validate-traces.sh` reports 8. The missing one is
      `spec:forge-skills-mapping`, whose only reference is
      `images/default/Containerfile:195` — a file type only the gate scans. And
      a Windows contributor adding a ghost trace to a `.ps1` gets NO feedback
      from the commit hook at all; it surfaces later, on someone else's build.
      Three checkers answering one question differently is the defect under the
      defect.
