      summary: |
        TWO OF THE FOUR EXIT CRITERIA ARE ALREADY MET, AND THE PACKET'S PREMISE
        IS STALE — verified rather than assumed, because the packet is worded as
        if neither existed.

        CRITERION 1 ("the ghost check runs REPO-WIDE, not only over a commit's
        changed files"): MET. `scripts/trace-coverage.sh --gate` is a repo-wide
        ratchet against `openspec/ghost-trace-baseline.txt`, wired into
        `./build.sh --check` under order 584-2qq2. It fails in BOTH directions —
        a ghost not in the baseline, and a baseline entry that is no longer a
        ghost — so the baseline may only shrink. That is a stronger property
        than the criterion asked for.

        CRITERION 4 (the negative control): MET, and I ran it rather than
        reading it. Appending `@trace spec:zzz-fabricated-negative-control-658kcd5`
        to crates/tillandsias-plan/src/spec.rs makes the gate exit 1 and name the
        fabricated id; reverting restores exit 0 at `baseline=9 current=9`. Both
        exit codes captured directly, not inferred from a pipeline.

        THE COUNT IN THE TITLE IS ALSO STALE. It says fourteen. Today:
        `trace-coverage.sh` reports 9 ghosts, all 9 in the baseline;
        `validate-traces.sh` reports 8 hard ghosts plus 6 covered by in-flight
        changes. The 12-true/2-pending split the context describes has moved.

        WHAT ACTUALLY REMAINS is criteria 2 and 3: dispositioning the 9. I did
        NOT do that this cycle, and the reason is a judgement rather than a
        budget. The exit criteria say "Prefer removal", on the argument that a
        trace nobody wrote a spec for in months is evidence the spec was not
        needed. That argument is sound for the low-fanout ids and I think WRONG
        for the two largest:

          * `spec:meta-orchestration` is traced from ~15 litmus tests plus
            methodology/mo-full-attestation.yaml. It is the loop this whole
            fleet runs on. The absence of a spec reads as a spec that was never
            written for something central, not as a concept nobody needed —
            deleting 15 traces would remove the only machine-readable evidence
            that those litmus tests are about anything.
          * `spec:enclave-service-catalog` is traced from six or more sites in
            crates/tillandsias-headless/src/main.rs, all of them real
            service-catalog code.

        Bulk-deleting those unattended is a large, hard-to-reverse change made
        on an argument that does not fit them, so I am leaving the disposition
        to an explicit decision. The low-fanout six (fat-spec-corpus-index,
        forge-git-ergonomics, forge-git-identity-anonymization,
        forge-push-credential-channel, forge-skills-mapping,
        guest-crashloop-detection, litmus-runner) are the safe end and can go
        first.

        FILED 867-vd4z ALONG THE WAY, and it is bigger than this packet: the
        gate scans six file types and misses `*.yaml` (979 annotations) and
        `*.md` (1347). More than half of all @trace annotations in the repo are
        outside the check that validates them, and at least seven REAL ghosts
        are hiding in yaml — browser-isolation-telemetry, control-socket,
        cross-platform-compilation, enclave-network-isolation,
        ephemeral-guarantee, forge-launch, service-startup. The naive glob fix
        breaks the build on the litmus fixtures that deliberately carry
        fabricated traces, so it needs a fixture-exclusion rule first. That
        packet also records the three-checkers-three-file-sets divergence,
        which is why none of this was visible.
