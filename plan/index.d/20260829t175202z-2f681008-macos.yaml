        RUNTIME-VERIFIED ON A LIVE GUEST, macOS 2026-08-29, guest v0.4.260826.1 (8 vCPU / 8 GiB), tray+guest rebuilt from this change.  THE PACKET'S DEFINING SYMPTOM IS GONE. 924-eof7 recorded "a piped cat > file blocks forever; byte-exact head -c N works" as the discriminating pair. Measured now:   printf 'EOF-TEST-PAYLOAD\n' | tillandsias-tray --exec-guest 'cat > /tmp/eoftest; ...'   -> CAT_RETURNED bytes=17, HOST_RC=0 That command hung indefinitely before this change (measured twice today at a 300s bound, HOST_RC=124).  CONTROLS:   1. byte-exact reader still works (it worked BEFORE the fix, so a regression here would mean trading one bug for another): head -c 4 -> HEAD_OK bytes=4, RC=0.   2. empty stdin: no EOF frame is sent and the command still runs -> NO_STDIN_OK, RC=0.   3. binary stdin containing 0x04 — FAILED, and the failure is NOT mine. See the separate note; it is a pre-existing data-path defect, now filed as its own packet.  IT TOOK THREE LIVE ATTEMPTS, and the two failures are worth more than the pass:   ATTEMPT 1 hung with NO warning line. That silence was the diagnosis: my un-negotiated path prints a named warning, so its absence meant the code had not run at all. Cause: there are TWO input-sending entry points in vsock_exec.rs and I had patched only exec_over_stream_with_input. --exec-guest goes through exec_over_stream_with_input_streaming_timeout. My three unit tests passed because each scanned the function I had just edited; a per-function assertion cannot see a sibling that forgot. The gate was green and the feature did nothing. Fixed by patching the second path AND replacing the per-function checks with every_input_entry_point_sends_stdin_eof, which ENUMERATES every function chunking `input` onto the wire and requires each to send the EOF. I watched it fail against the unpatched function before fixing it — an assertion never seen red is not known to be able to catch anything.   ATTEMPT 2 failed LOUDLY and precisely: "variant PtyStdinEof not sup