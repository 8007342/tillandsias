      summary: |
        A FIFTH INSTANCE OF THE PATTERN, from the operator, and the cleanest one
        yet because the mechanism is not merely present — it is executable,
        pinned by a litmus, and carries its own breach record.

        Operator, 2026-08-19: "looks like the Windows host figured out the
        git-mirror credentials issue, agents were landing on main branch which
        is protected, after being instructed to use windows-next they were able
        to push."

        scripts/check-committable-branch.sh EXISTS, is +x, prints a falsifiable
        one-line grammar, fails closed on detached HEAD and non-repos, is
        pinned by litmus:committable-branch-guard-shape, and the skill documents
        the exact prior breach it was written for — 34e60965, an antigravity
        forge cycle running ON main that pushed a ~42k-line plan/index.yaml
        reserialization straight to origin/main, reverted via PR #81.

        Windows agents landed on main anyway. THE GUARD DID NOT FAIL; IT WAS
        NOT RUN. That is the same shape as every other finding in this packet:

          707-3x9d lifted the 1-packet limit -> the skill kept the old number
                   -> agents took the smallest of three
          next_action has a reader in the cold-start path
                   -> absent from plan/schema.yaml -> 4.6% adoption
          the lease has a 24h reaper (672-bz7u)
                   -> nothing claims -> in_progress = 0
          archive-plan-packets.sh cut the ledger 92% once
                   -> zero call sites -> 57.7% of the index archivable
          check-committable-branch.sh is executable AND litmus-pinned
                   -> not a precondition -> agents push to protected main

        Five correct mechanisms; five cases of nothing making them run. The
        methodology's defect is not missing rules — it has 137 normative
        imperatives — it is that a rule without an enforced exit condition is a
        suggestion, and suggestions lose to whatever the agent read last.

        WHAT THIS DOES *NOT* SHOW, checked rather than assumed. I hypothesised
        the Windows result might retire 809-w2xy — same surface symptom, "cannot
        push" — and it does not. images/git/probe-upstream-auth.sh:164 pushes
        "$PROBE_SHA:$PROBE_REF" into a namespace deliberately OUTSIDE refs/heads
        and refs/tags (:28), and the 403 it reads is on the receive-pack
        ADVERTISEMENT, which GitHub authorizes at repo scope (:16-17). Branch
        protection applies at ref-update time, not advertisement time, so a
        protected main cannot produce that 403. Two distinct failures wearing
        one symptom: repo-scope credential denial (809-w2xy, still genuine, still
        the operator's) and branch misrouting (Windows, now fixed by routing to
        windows-next). Conflating them would have retired a live blocker on a
        false premise.
