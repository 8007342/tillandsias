        THE RULE, measured with od -c on the VALUE because MSYS grep folds the CR into the line ending and hides it: jq.exe writes CRLF, command substitution strips only the FINAL line ending, so a capture that can yield more than one line arrives with a carriage return on every line but the last. Exposure is a property of MULTI-LINE capture, not of using jq -- which is why the litmus runner broke while 62 sibling call sites reading a single scalar were fine.

