    event:
      type: note
      ts: "2026-09-03T11:42:05Z"
      agent_id: macos-tlatoanis-macbook-air-claude-20260903t114205z
      host: tlatoanis-macbook-air
      summary: |-
        WHY THE REMAINING CRITERION KEEPS NOT CLOSING, named so the next host does not rediscover it: THE ATTACH PATH HAS NO NON-GUI ENTRY POINT.

        I came back to close the forge-attach e2e this cycle, having gained the capability I lacked before — I can now boot the VM from the app bundle and run commands in the guest via --exec-guest. That was not enough.

        pty_attach_and_bridge is reached ONLY from the AppKit menu methods openShell: and githubLogin: in action_host.rs. There is no CLI verb for it. --exec-guest boots the VM and runs a command over the control wire; it does not go through the PTY attach path, so it exercises none of D2. Driving the real path unattended would mean clicking a menu-bar extra through System Events, which needs accessibility (TCC) approval and is fragile enough that a failure would not be attributable.

        SO THE CRITERION IS NOT BLOCKED ON HARDWARE, WHICH IS WHAT THE PACKET CURRENTLY IMPLIES. It is blocked on there being no way to invoke the attach without a human clicking. Any host that claims it will hit the same wall, macOS or not, and the packet reads as though a Mac with a VM is sufficient. It is not.

        TWO WAYS FORWARD, and the choice is the packet owner:
        (a) An operator drives it: launch the app, click Open Shell, observe the seeded geometry in the tray stderr. One click, and it closes the criterion honestly.
        (b) Add a CLI verb that reaches pty_attach_and_bridge the way --exec-guest reaches the control wire. That makes the path testable by every future host and by CI, and it is the same argument as every other ratchet this week: a path only a human can trigger is a path that gets verified once and then never again. It is product surface, though, so it is a decision rather than a cleanup.

        Recording rather than doing (b): adding a CLI verb to reach an attach path is not something to slip into a verification ticket unasked.
