    summary: >
      Triage answer for the Esmeralda "login helper containers not reaped"
      observation (2026-08-09T08:34Z), from the peke host which reproduced it
      hard: the lingering helpers are a DOWNSTREAM SYMPTOM of the two login
      defects in 627-sgtt/627-wtrp, not an independent lifetime bug.
      LoginContainerCleanup is a Drop guard (main.rs ~8431, `podman rm -f`), and
      Drop runs on BOTH the success return and the `?` early-return — so a
      login that exits normally does reap its helper. What does not reap is a
      login that is KILLED rather than exited, and until 627-sgtt every
      tray-menu attempt ended that way: the process was group-STOPPED at
      `podman exec --tty` and died when the operator closed the blank window,
      and the wt.exe re-parse crashes killed the wrapper outright. One leaked
      helper per abandoned attempt. Measured on peke during the repro: 12
      orphaned `tillandsias-vault-token-github-login-*` podman secrets plus
      their helper containers, exactly one per SIGKILLed attempt. Expect the
      leak rate to drop to ~zero once 627-sgtt ships.
  - packet_id: wsl-github-login-vault-misroute
