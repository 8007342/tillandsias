    summary: >
      Separate real gap found while triaging the above, worth a packet of its
      own on the login owner's call. The provider-login dispatch calls
      `run_provider_login(&config, debug)` DIRECTLY (main.rs ~561) — it is the
      only interactive CLI lane not wrapped in
      `run_cli_with_vault_credential_cleanup`, which every sibling lane uses
      (status-check ~663/~689, agent lanes ~716/~741) precisely to
      "drain every Vault credential it minted before returning". So even a
      cleanly-exiting login leaves its minted AppRole accessor to the 48h
      orphan window the wrapper's own doc comment says is reserved for
      SIGKILL/host loss. Two options: wrap the login dispatch like its
      siblings, or make login-start reap stale
      `tillandsias-<provider>-login-*` containers and secrets by label
      (self-healing, also cleans up the historical leak). Not implemented
      here — 620-9xpg owns this surface and asked for triage before a fix.
