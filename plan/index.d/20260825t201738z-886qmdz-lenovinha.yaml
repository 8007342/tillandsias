packets:
  - packet_id: credential-guard-conflates-behind-branch-with-missing-credential
    order: 886-qmdz
    release_target: fail-loud-diagnosis-milestone
    status: completed
    desired_release: v0.5
    role: tooling
    priority: p1
    kind: bug
    title: |
      check-credential-channel.sh reports blocked:gh-cli-only when the local branch is merely behind origin, hard-stopping a cycle whose credential is fine.
    deliverable: scripts/check-credential-channel.sh
    depends_on: []
    pickup_role: linux
    owner_host: lenovinha
    capability_tags:
      - tooling
      - fail-loud
      - cross-platform
    estimated_hours: 1
    problem: |
      The push probe is `git push --dry-run origin HEAD`, which names a CONCRETE
      branch. A local branch behind its remote counterpart is therefore refused as
      a non-fast-forward — a refusal the remote can only issue AFTER the credential
      has authenticated. The guard reads that refusal as an absent credential
      channel and prints `blocked:gh-cli-only`, on which the meta-orchestration
      skill hard-stops the cycle before any worker drain.

      This is the most normal state a cycle can enter the guard in: Start-Of-Cycle
      runs `git fetch origin --prune` (skill step 2) and this guard immediately
      after it, while the fast-forward is step 5. Any host whose siblings pushed
      since its last cycle enters this arm by construction.

      Order 876-exg2 removed the SAME conflation one layer up (the local pre-push
      hook) on exactly this principle — the guard asks one question and must not
      fail the cycle for any other. Its `--no-verify` retry cannot rescue this
      case: it removes the hook, not the non-fast-forward, so both probes fail and
      the printed remedy ("seed the repo-local store") is inert.
    why_it_matters: |
      A guard that hard-stops the cycle for a non-credential reason, and names a
      remedy that cannot help, costs a whole cycle and sends the next agent to
      diagnose the wrong subsystem. The fleet's other hosts hit this arm on any
      cycle that follows a sibling push.
    exit_criteria:
      - |
          A checkout whose branch is strictly behind origin, with a clean tree and a working credential, returns an ok:* verdict and exit 0 — never blocked:*.
      - |
          The verdict is a distinct single token naming the real cause, matching the pinned grammar of litmus:credential-channel-check-shape.
      - |
          The stderr note names the fast-forward remedy and does NOT print the credential-seeding remedy.
      - |
          The true positive 860-g798 caught survives: a genuinely unauthenticable push is still blocked:* with a non-zero exit.
      - |
          A mutation control reconstructs the pre-fix guard and asserts it fails the new arm, so the test cannot pass by luck.
    events:
      - type: filed
        ts: "2026-08-25T20:14:00Z"
        agent_id: lenovinha-opus5-metaorch-20260825t201248z
        host: lenovinha
        summary: |
          Found live at Start-Of-Cycle this cycle, not by inspection. The guard
          printed `blocked:gh-cli-only` on a clean tree with a green keyring; the
          remote's own answer was "Updates were rejected because the tip of your
          current branch is behind its remote counterpart" — which only a remote
          that had already authenticated us could say. `git merge --ff-only
          origin/linux-next` and a re-run of the same guard returned
          `ok:gh-keyring-push-verified`, with nothing about the credential changed.
      - type: implemented
        ts: "2026-08-25T20:40:00Z"
        agent_id: lenovinha-opus5-metaorch-20260825t201248z
        host: lenovinha
        summary: |
          Fix takes the ref state out of the question rather than pattern-matching
          the remote's rejection text: on the failure path only, probe a unique ref
          under refs/tillandsias/cred-probe/<host>-<pid>. A CREATE is always
          fast-forwardable, so authentication is the only thing left that can fail
          it — which is exactly what this guard asks. `--dry-run` means the ref is
          never created; verified on lenovinha that `git ls-remote origin
          'refs/tillandsias/cred-probe/*'` stays empty after the probe returns 0.
          New verdict `ok:gh-keyring-push-verified-refstate-refused` (exit 0).
          Runs only after both existing probes fail, so the healthy path costs
          nothing and 860-g798's true positive is untouched.
      - type: verified
        ts: "2026-08-25T20:45:00Z"
        agent_id: lenovinha-opus5-metaorch-20260825t201248z
        host: lenovinha
        summary: |
          scripts/test-check-credential-channel.sh extended with arm 8b (a fixture
          whose branch is strictly behind origin with a no-op pre-push hook, so ref
          state is the ONLY possible cause) and arm 8c (a mutation control that
          strips the 886-qmdz block and asserts the reconstructed pre-fix guard
          returns blocked:gh-cli-only on that same fixture). Arm 8b also asserts its
          own precondition — that the plain probe really is refused — so it cannot
          pass vacuously. Full suite green: ok:credential-channel-fixture:all,
          including both pre-existing mutation controls and the unreachable-remote
          negative control.
