        THE PACKET'S PREMISE IS FALSIFIED, and that is the main finding. It was
        filed believing a concurrent fork's `snapshot` had retired the PARENT
        cycle's boundary. That cannot happen. Stamps are written under
        `git rev-parse --git-dir`, which for a LINKED WORKTREE resolves to
        .git/worktrees/<name>, not the common dir — measured here:
        `/home/tlatoani/claudia/tillandsias/.git/worktrees/agent-a5f3a18b700a0ec96`.
        The retire-previous step only ever removes a path THIS worktree's own
        stamp names, so two worktrees snapshotting concurrently leave both
        boundaries intact. Demonstrated end to end in a throwaway repo with a
        real linked worktree: after the linked worktree snapshots, the main
        worktree's boundary survives AND still verifies `ok`.

        WHAT ACTUALLY HAPPENED on 2026-08-16 is the same-worktree path: the
        cycle ran `snapshot` a SECOND time (re-baselining after unexpected
        dirt), which retired the first boundary exactly as 725-bu54 intends,
        while the caller still held the first path in a pointer file. `verify`
        then answered `blocked:boundary-state-missing:<the NEW dir>` — naming a
        path the caller had never seen — and the cycle reasonably concluded
        another agent had destroyed its boundary. The defect is real but it is
        DIAGNOSTIC, not concurrency.

        FIX: `superseded` is now distinguished from `missing`, and PROVABLY so
        rather than by inference. `snapshot` appends each retired directory to
        a `boundary-retired` stamp (bounded to the last 20 — a diagnostic tail,
        not an audit log, and an unbounded file in the git dir is a slow leak).
        `verify` against a path on that list answers
        `blocked:boundary-superseded:<current>` and names BOTH paths plus the
        cause on stderr. A path that was never a boundary keeps the original
        `blocked:boundary-state-missing` verdict — that distinction is why the
        retired-list exists instead of a simple "not the current one" test, and
        scenario 2 of the fixture is its negative control.

        Everything 725-bu54 established is preserved: the NEXT cycle's snapshot
        retires the previous one, Finalization still must not, and the
        not-a-boundary bystander is still never rm -rf'd (scenarios 8 and 9
        unchanged and green).

        FIXTURE 9 -> 12 scenarios (scripts/test-worktree-boundary-guard.sh):
        cross-worktree-isolated (pins the isolation so the falsified belief
        cannot re-form, and so a future change moving the stamp to the COMMON
        dir — which would make the reported bug real — fails here instead of at
        3am), cross-worktree-main-still-verifies, boundary-superseded (+ a
        second assertion that both paths are named). 12/12 PASS.

        MUTATION CONTROL: with the guard reverted and the fixture intact, the
        two superseded scenarios FAIL, reproducing verbatim the message that
        misled the cycle: `blocked:boundary-state-missing:<state-super-new>`
        when the caller asked about state-super-old. The cross-worktree
        scenarios pass in BOTH directions, correctly — they pin behavior that
        was already right, so they are regression pins rather than fix proof,
        and this is stated so nobody reads them as evidence of a repair.

        litmus:opencode-prompt-e2e-shape pins only the
        "PASS: worktree-boundary-guard fixture" prefix, so the count change
        needs no litmus edit. `./build.sh --check` rc=0 (verified unmasked).
