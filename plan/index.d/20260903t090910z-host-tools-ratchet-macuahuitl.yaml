    order: 989-ykks
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [onboarding, macos, gate, portability, fail-loud, ratchet]
    estimated_hours: 4
    title: |
      The macOS host-tool list is prose in a skill, it was wrong in two ways this week, and a host missing a tool discovers it as an unrelated failure hours later.
    context: |
      PROPOSED by macbook-macos, who deferred filing it to avoid duplicating a
      packet. Filing it here so it is not lost; it is neither theirs nor
      macneo's to have to claim.
      THE SKILL'S macOS section lists host build tools as PROSE a human
      maintains - Xcode CLT, pkg-config, rustup with rustfmt and clippy. It was
      already wrong in two ways this week: coreutils is missing from it and is a
      HARD REQUIREMENT of the credential gate (988-7kxf), and macneo hit a
      pkg-config gap without which build.sh --check could not START.
      THE COST, MEASURED: macneo spent most of a day discovering by unrelated
      failures what one command could have told them. Six assumed-present tools
      surfaced from one factory-fresh machine in one day - qemu-img,
      /usr/bin/xz, pkg-config, timeout, busctl, and a PATH assumption inside
      check-cheatsheet-tiers.sh:57 that reports cargo not found WITH cargo
      installed.
      THE FIX macbook PROPOSES, and it is the same ratchet move as every other
      one this week: scripts/check-macos-host-tools.sh probes the ACTUAL set and
      refuses with a brew install line. That makes the requirement EXECUTABLE
      INSTEAD OF REMEMBERED. A list a human maintains drifts silently; a probe
      that runs cannot.
      WHY THIS IS p1 AND NOT HYGIENE. 988-7kxf converted a wrong answer into a
      correct refusal. It did NOT remove the dependency: a coreutils-free Mac
      still returns blocked:gh-cli-only, and per the skill a blocked verdict
      fails the cycle. So macOS STILL CANNOT LAND without an undocumented brew
      install, and "the fix landed" reads as "macOS can land now" when it
      cannot.
    exit_criteria:
      - one command reports every missing host tool with its remedy, and is named in the skill where the prose list is today
      - it is verified on a host that is actually missing something, not only on a host where everything is present - the whole defect is that a complete host cannot detect this
      - the check covers what the GATE needs, derived from the gate rather than from the prose list, or it will drift the same way
      - the prose list is either removed or reduced to a pointer, so there is one source of truth and not two
      - linux and windows are considered; the class is not macOS-specific even though every instance so far is
