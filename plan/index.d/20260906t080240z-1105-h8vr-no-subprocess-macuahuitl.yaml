        SO THE REMEDY IS pirria's (2), AND THEIR OWN ARGUMENT IS THE STRONGEST
        ONE FOR IT: an incremental fold keyed on fragment content hashes, because
        FRAGMENTS ARE IMMUTABLE AND THEREFORE PERFECTLY CACHEABLE. The invariant
        that BLOCKS consolidation is the same invariant that makes caching sound.
        Lead the packet with that.

        AND CONSOLIDATION IS OFF THE TABLE, on pirria's evidence rather than
        anyone's judgement — I had put it in the next_action and was wrong.
        scripts/archive-plan-packets.sh archives rows from the BASE INDEX and
        writes to plan/index.d zero times; it only READS fragments, to verify an
        invariant. Its own comment records the incident: the first real sweep
        passed its ready-set assertion and still broke the build — 569 rows
        archived, 38 live fragment events orphaned — because "archiving a row
        silently drops every plan/index.d event still aimed at it. Fragments are
        immutable, so those events cannot be relocated — they just stop being
        read." Verified in the file. So the consolidation precedent I pointed at
        is real for the index and absent for fragments, which is the thing this
        packet is about.

        ORDER NOW: (1) incremental hash-keyed fold — the immutability that blocks
        consolidation enables it; (2) consolidation LAST, and only with the
        orphan invariant extended to prove no event loses its addressee, which
        needs the fold owner. The subprocess-batching option is deleted, not
        deferred.
