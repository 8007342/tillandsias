        proving it.

        THE PER-FRAGMENT CONSTANT REPLICATES INDEPENDENTLY, which confirms
        pirria's shape on 2.8x hardware:

          macuahuitl  100 frags   682 ms   6.82 ms/frag
                      300 frags  1667 ms   5.55 ms/frag
                      740 frags  4700 ms   6.35 ms/frag
