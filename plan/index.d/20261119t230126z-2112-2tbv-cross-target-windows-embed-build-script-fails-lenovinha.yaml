    verifiable_closure: |
      ./build.sh --check runs check-cross-target-build to completion and prints ok:cross-target:x86_64-pc-windows-gnu; before the fix the same gate printed refused:cross-target with the tillandsias-embed build-script panic.
    next_action: Run cargo check --target x86_64-pc-windows-gnu -p tillandsias-embed -vv in the builder to capture the build-script stderr; fix the build script or the toolbox's mingw toolchain accordingly.
