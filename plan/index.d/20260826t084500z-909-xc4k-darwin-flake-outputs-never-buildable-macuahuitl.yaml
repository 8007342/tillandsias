packets:
  - packet_id: the-flake-generates-darwin-outputs-that-have-never-been-buildable-and-nothing-checks-them
    order: 909-xc4k
    status: ready
    desired_release: v0.5
    priority: p3
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      eachDefaultSystem emits x86_64-darwin and aarch64-darwin package sets that cannot evaluate, and the default `nix flake check` silently omits exactly those systems
    deliverable: |
      the flake stops advertising outputs it cannot build, or the gate stops
      omitting the systems that fail
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - nix
      - fail-loud
      - build
    estimated_hours: 3
    context: |
      MEASURED on macuahuitl 2026-08-26 while closing 606-um5s.

      `flake-utils.lib.eachDefaultSystem` generates the full package set for
      every default system, which includes x86_64-darwin and aarch64-darwin.
      Those outputs cannot evaluate:

        nix flake check --all-systems
        checking derivation packages.x86_64-darwin.forge-image...
        error: Refusing to evaluate package 'glibc-nolibgcc-2.42-67' ...
               because it is not available on the requested hostPlatform

      `forge-image` references `pkgs.glibc` for an FHS `ld-linux` symlink in
      its `fakeRootCommands`. glibc is a Linux package; on darwin the whole
      output is unevaluatable.

      **VERIFIED PRE-EXISTING, NOT INTRODUCED BY THE 26.05 MIGRATION.** The old
      lock fails `--all-systems` too — checked by restoring flake.nix and
      flake.lock from git and re-running. So this has been true for as long as
      the FHS symlink has been there.

      WHY IT SURVIVED: the DEFAULT `nix flake check` does not check them. It
      prints, as its last line:

        warning: The check omitted these incompatible systems: aarch64-darwin,
        aarch64-linux, x86_64-darwin. Use '--all-systems' to check all.

      So the gate that would catch it announces that it is not looking, in a
      warning after a PASS verdict. Nothing in `./build.sh` runs
      `--all-systems`, and nothing in `./build.sh` evaluates the flake at all.

      THE CLASS, and it is the milestone's: an output that cannot work, in a
      configuration nothing exercises, behind a check that reports success and
      names its own blind spot in a line nobody reads. The same cycle turned up
      a sibling instance — `.#forge-image` on x86_64-LINUX could not evaluate
      either, for months, because `buildLayeredImage` had stopped accepting
      `copyToRoot` and nothing evaluated the flake to notice.

      SCOPE NOTE: this is p3, not p1. Nobody builds Tillandsias on darwin via
      nix — macOS uses `scripts/build-macos-tray.sh` and `./build.sh --install`
      is refused on Darwin by design (723-whrx). The cost is a flake that
      advertises six packages per darwin system that have never existed, which
      misleads anyone reading `flake show --all-systems` and makes
      `--all-systems` unusable as a gate.
    outcome: |
      The flake's advertised outputs are the outputs it can build, or the
      difference is stated where a reader will see it.
    exit_criteria:
      - 'DECIDE and record which: (a) restrict the Linux-only outputs to Linux systems (eachSystem over linux systems, or a per-output guard), so darwin advertises only what exists; or (b) keep them and mark them meta.platforms/broken so the failure is declared rather than discovered. Either is defensible; advertising an output that cannot evaluate is not.'
      - '`nix flake check --all-systems` passes, OR its remaining failures are declared-broken outputs rather than evaluation errors. This is the falsifiable closure — today it exits 1.'
      - 'NEGATIVE CONTROL: every output that builds today still builds. The six x86_64-linux packages and the devShell are the working set (all six realized 2026-08-26, closures within 0.75% of the published artifacts); none may regress.'
      - 'Whatever lands, something RUNS `--all-systems` on a schedule, or the fix is invisible to the next regression. A default `nix flake check` will keep omitting these systems and keep printing the warning after a PASS.'
    verifiable_closure: |
      `nix flake check --all-systems` exits 0, or fails only on outputs
      explicitly marked broken/unsupported, on a host that today sees it exit 1.
    notes: |
      DO NOT fix this by adding `--all-systems` to the gate without first
      making it pass. That would take a green trunk red for a pre-existing
      condition nobody is blocked on.

      The warning line is worth preserving as evidence when this is fixed: a
      check that announces its own omission AFTER declaring success is the
      shape, and this one is unusually explicit about it.
    events:
      - type: filed
        ts: "2026-08-26T08:45:00Z"
        agent_id: linux-macuahuitl-claude-20260826t084421z
        host: macuahuitl
        summary: |
          Found while closing 606-um5s, by running `flake check --all-systems`
          because the default run's warning named aarch64-linux — a system that
          packet's criterion 2 asks about. Chasing the warning surfaced the
          darwin breakage instead.
