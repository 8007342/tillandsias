        THE CHAIN THAT ACTUALLY REDS THE TEST:

          1. compact_text renders a candidate.
          2. fragment_coverage_gaps checks each fragment's records against the
             RE-PARSED CANDIDATE (843-624y, deliberately not against `merged`).
          3. The trigger fragment comes back with a gap, so compaction REFUSES it and
             leaves it on disk rather than deleting it. Measured:
               `warning: 1 fragment(s) NOT consumed ... 760 compacted, 760 removed`
             The safety works. The ledger is never corrupted by this.
          4. assert_fold_equivalent compares `compact_text(index).candidate` against
             `fold(base, load_all(index))` — every fragment, INCLUDING the refused one —
             and never reads the `refused` field it was handed.

        So ANY fragment that trips the refusal path reds this test BY CONSTRUCTION. The
        test asserts an equivalence compact_text does not promise for records it
        declined to carry. That is a test-side defect independent of whatever renders
        unfaithfully, and it is why the red looked like a mystery: the component that
        detected the problem and declined is the one being called wrong.

        AND THE REFUSAL MESSAGE MISATTRIBUTES ITS OWN CAUSE. The gap printed was:

          an event for `the-answer-rate-litmus-step-times-out-because-the-timing-log-
