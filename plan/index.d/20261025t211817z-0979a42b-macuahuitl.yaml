    value: 'Swap policy D3 of openspec/changes/forge-storage-single-root-and-disk-discipline, operator ruling 2026-10-25: swap is MANDATORY. tmpfs (source workspace, /tmp) needs a disk swap to overflow into; zram is compressed RAM and does not count. macuahuitl today has only 8 GiB zram. On Linux the tray refuses to start when disk swap is below max(8 GiB, sum of running forge L0 caps) and shows plain instructions naming ''tillandsias --swap on'' (swap_cmd). On macOS VMs and Windows WSL, Tillandsias forces the swap configuration known to work (guest swap file, .wslconfig swap=), floor-tier hosts included.'
