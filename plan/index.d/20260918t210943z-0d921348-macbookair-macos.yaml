ctive: it stamped a per-container MCS category (s0:c911,c996) onto the shared directory, the category OUTLIVED the container, and every later container was then denied — including the single-level case that had been working. Anyone reaching for :Z 'for tidiness' while retiring a label=disable will convert a working host into a broken one with no error naming the cause.
