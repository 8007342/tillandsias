packets:

  - packet_id: ci-full-flake-destroys-its-own-evidence
    order: 637-df4z
    status: ready
    desired_release: v0.5
    priority: p1
    title: "`--ci-full` fails intermittently and the re-run overwrites the only log that could explain it"
    kind: bug
    deliverable: scripts/local-ci.sh
    depends_on: []
    pickup_role: linux
    capability_tags: [ci, litmus, observability, flake]
    context: >
      Observed TWICE on 2026-08-09, cycles 3 and 4 of the coordinator loop:

        run 1: ./build.sh --ci-full  ->  15/17, "2 failed checks"
        run 2: ./build.sh --ci-full  ->  17/17, no intervening change

      Both times the failure could not be named, and for the same structural reason: the
      failing run's detail lives in `/tmp/litmus-pre-build.log`, and the PASSING re-run
      overwrites it before anyone reads it. On the second occurrence this host tried
      explicitly to capture the named checks first and still lost them — the capture
      command re-runs the gate, which passes, which destroys the evidence.

      Ruled out: worktree dirt (git status was clean between runs), the known
      convergence-dashboard churn (no dashboard modification present), and any edit of
      this host's own (nothing changed between the two runs).

      A gate that fails ~1 run in 2 and cannot say why is worse than a gate that fails
      loudly: it trains every agent to re-run rather than read, which is exactly how the
      four expression-pinning false reds (634-39ik) became cheap to ignore. With push CI
      removed (599-w5jd) this is the trunk's only verification.
    exit_criteria:
      - >
        Per-run log retention: the litmus log is written to a run-scoped path (or rotated),
        so a failing run's evidence survives the next invocation. This is the prerequisite —
        without it the flake cannot be diagnosed at all.
      - >
        The failing check names are surfaced in the summary block itself, not only in a log
        that may be gone. "2 failed checks" without names is not a diagnosis.
      - Root cause identified and either fixed or documented with a reproduction.
    verifiable_closure: >
      Two consecutive `--ci-full` runs leave two distinct, readable logs, and a failing run's
      named checks appear in its own terminal summary.
    notes: >
      Suspect ordering/parallelism inside the litmus phase rather than any individual test,
      since the same tree passes and fails. Do NOT "fix" this by retrying the phase
      automatically — an auto-retry converts an intermittent failure into an invisible one,
      which is the same silent-direction defect as 627-cx24 and 635-i6vm.

