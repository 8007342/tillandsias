      summary: |
        CLOSED. THE POPULATION IS ZERO — and the one hit my own detector still returns is
        the false positive this row already names, which is the point rather than an
        exception.

        VERIFIED BY CONTENT on origin/linux-next 95f48988d, property beside sha so a
        reader whose remote cannot resolve it can check the claim:

          litmus-added-test-is-referenced-shape.yaml   tail-pipes 0, adjudicating assertion present
          litmus-reset-flags-accepted.yaml             tail-pipes 0, adjudicating assertion present
          litmus-scorable-obligation-splitter.yaml     tail-pipes 0, adjudicating assertion present

        Re-derived per step across all litmus files: 120 steps end in a tail/head pipe,
        and of those, exactly ONE declares a structured assertion with none that
        discriminates — `litmus-forge-as-only-runtime.yaml`. That is the documented false
        positive: its `| head -1` sits INSIDE a command substitution
        (`FORGE_IMG=$(podman images … | head -1) && … && podman run …`), so the pipeline's
        exit status is the final `podman run` and its `assert_exit: 0` IS load-bearing.
        It remains the closure's negative control and must keep passing.

        WHAT THIS ROW TURNED OUT TO BE. Filed as "one of two assertions is decoration".
        It was worse: scripts/run-litmus-test.sh:1018-1023 and
        `structured_assert_matches()` are explicit that declaring ANY structured
        assertion adjudicates the step BY THOSE FIELDS ONLY, and `expected_behavior`
        becomes documentation that cannot change the verdict. Two steps therefore
        declared `assert_exit` on a pipeline (tail's status, always 0) and
        `assert_output_nonempty` (tail always prints) — BOTH UNCONDITIONALLY TRUE. Not
        weak checks: ACCEPTS THAT COULD NOT REFUSE, in the release gate, each with an
        expected_behavior line beside it naming the output it was not comparing.

        THREE INSTANCES, THREE PEOPLE, ONE ERROR:
          litmus-added-test-is-referenced-shape   could not fail          fixed d051a120c
          litmus-reset-flags-accepted             could not fail          fixed d051a120c
          litmus-scorable-obligation-splitter     could fail on rc, but
                                                  never compared the
                                                  verdict string          fixed f64b1a442
        The third is macuahuitl's own finding against their own binding, recorded as
        theirs at their request: fixing this row in land67 they wrote that
        expected_behavior "matches the verdict line in the full output", having read the
        runner's fallback grep without the branch it sits in. The same misreading that
        produced the defect was made again while fixing it, by a different host, in the
        same evening.

        I MADE IT TOO, TWICE. First filing the row, I concluded "the gate catches it" by
        running the command in a SHELL and seeing the strings differ — I never checked
        whether the RUNNER compares that field. I measured what a shell could show me
        instead of what adjudicates. Second, my detector matched "the command TEXT ends
        in a pipe to tail" when the property is "the PIPELINE'S exit status is tail's",
        which is what produced the false positive above. Near the property, not on it —
        in the instrument written to measure exactly that failure.

        THE FIXES ARE PER STEP BECAUSE A UNIFORM ONE WOULD HAVE REDDED THE GATE.
        `reset-flags-accepted` legitimately SKIPS where no tillandsias binary is built
        (measured on this forge: rc 0 printing
        skip:reset-flags-accepted:no-runnable-tillandsias-binary), so it got
        `assert_output_matches "^(ok:…|skip:…)"`. A bare contains-assertion on the ok:
        form would have failed that step on every host without a built binary, including
        every forge. On added-test the count is computed from the arms, so only the
        marker `ok:added-test-guard-proven:` is pinned and not the number. On the
        splitter the verdict is a STATIC literal identical in STRICT and RELAXED modes,
        so the full string is pinned and a deleted arm is caught.

        THE GUARD IN next_action SHOULD STILL LAND. The population is zero and nothing
        prevents a fourth instance — the third was made by someone who had just read this
        row. Whoever writes it must not repeat my detector's error: a pipe inside a
        command substitution is not a piped step, and litmus-forge-as-only-runtime.yaml
        is the negative control that proves the difference.
