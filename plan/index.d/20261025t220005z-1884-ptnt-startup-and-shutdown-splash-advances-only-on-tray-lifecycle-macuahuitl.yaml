  title: A startup and shutdown splash on Linux whose Mācron animation follows the tray's real progress and visibly stalls when stuck
  context: Design D7 of openspec/changes/os-verified-approval-gates. Map each TrayStatusStage (PreLaunch through AllReady, ShuttingDown, Failed) to one scene step; animation advances only on stage events; a per-stage expected duration stops the idle loop and shows a calm 'taking longer than usual' line naming the step. Normal window level, never always-on-top, closable without affecting the tray. Replaces the operator's habit of clicking the tray icon while waiting.
  exit_criteria:
  - 'A test drives the splash state machine with a scripted stage sequence and asserts: the step equals the last stage received regardless of elapsed time; with no event for longer than the stage budget the state becomes Stalled naming that stage; a Failed stage holds the window open; the window''s type hint is not above/keep-above. Pre-fix result: FAILS, no splash state machine exists and stages reach only the menu label via status_label.'
