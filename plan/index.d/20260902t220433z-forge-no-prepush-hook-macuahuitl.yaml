packets:
  - packet_id: a-forge-can-push-to-the-trunk-with-no-gate-at-all
    order: 969-nhh7
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    release_target: convergence-velocity-milestone
    capability_tags:
      - forge
      - build-gate
      - trunk-integrity
      - fail-loud
    estimated_hours: 3
    title: |
      A forge installs neither the pre-push gate nor the pre-commit guards, and push CI no longer exists — so inside a forge, trunk protection is convention rather than enforcement, and a red gate does not stop a push.
    context: |
      REPORTED by macuahuitl-tillandsias-forge and VERIFIED INDEPENDENTLY from
      the host, 2026-09-02T22:0xZ. In both live forges on this machine,
      core.hooksPath is /home/forge/.cache/tillandsias/git-hooks and that
      directory contains exactly TWO hooks: post-commit and
      prepare-commit-msg. No pre-push, no pre-commit. Setting core.hooksPath
      globally (lib-common.sh) also redirects every repo away from
      .git/hooks, so the checkout's own hooks cannot stand in. Nothing in the
      forge launch path invokes scripts/install-hooks.sh — a grep over
      images/default/*.sh and the headless launcher finds no call at all.
      WHY THIS IS p1 AND NOT HYGIENE. Push CI is gone
      (litmus:github-actions-budget leaves only the manually-dispatched
      release workflow), which the meta-orchestration skill states plainly:
      the local gate "is the ONLY trunk protection". Inside a forge that gate
      is not wired to anything. The Non-Negotiable Exit Contract says do not
      push past a red gate; in a forge, nothing enforces it.
      IT HAS ALREADY HAPPENED, and the agent reported it rather than burying
      it: the same forge pushed past a red `./build.sh --check` (rc=1, a
      plan/issues citation naming a source line, 881-29me) because its
      command block chained commit and push unconditionally. Two failures
      stacked — their unconditional chaining, and the absent hook that would
      have caught it. They fixed the citation in 6067b31d0 and the trunk is
      green. The first failure is an agent mistake that will recur across
      thousands of cycles; the second is why it reached the trunk.
      SECOND CONSEQUENCE, and it retroactively qualifies a closure: order
      448's cheatsheet re-sync guard is a PRE-COMMIT hook, so it is inert in
      exactly the class of host that caused all three measured cheatsheet
      drift incidents. The forge qualified 448 on its own packet rather than
      letting it read as closed — correctly.
      THE FIX LOOKS SMALL AND THE VERIFICATION IS THE WORK.
      scripts/install-hooks.sh resolves its target via
      `git rev-parse --git-path hooks`, which RESPECTS core.hooksPath, so
      invoking it in the forge lifecycle composes correctly with the existing
      redirect. The gap is that nothing invokes it. What needs proving is that
      the installed pre-push hook actually FIRES in a forge — and note that
      the fleet has already been fooled here: four fixtures this same day
      reported success while their spy hooks were never invoked, for this
      exact core.hooksPath reason.
    exit_criteria:
      - a freshly launched forge has pre-push and pre-commit hooks at the path core.hooksPath names, verified by listing that directory in a running container
      - a push from a forge with a deliberately red gate is REFUSED, demonstrated live and not only by fixture — the negative control is the whole point
      - the hook install is idempotent across relaunches and does not disturb the post-commit expert refresh already installed there
      - order 448's closure is re-qualified once the pre-commit guard actually runs in a forge, since that is the host class its three incidents came from
