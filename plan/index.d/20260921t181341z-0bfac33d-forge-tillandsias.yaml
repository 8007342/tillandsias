        SIX refs carry no host, and every slug is forge-shaped:

          salvage/unknown/20260902-opsx-claude-lane-dirt
          salvage/unknown/20260902-opsx-claude-locus-generated
          salvage/unknown/20260910-1080-4deb-arm1
          salvage/unknown/20260916-920-cluster-forge-20260916
          salvage/unknown/20260916-920-cluster-forge-20260916-232039
          salvage/unknown/20260921-opsx-1.13.1-regen            (this row's instance)

        Against roughly a hundred host-attributed refs from bare-metal hosts — esme,
        esmeraldinha, lenovinha, lenovinha-silverblue, macuahuitl, pirria, yoga,
        yolanda, yolanda-windows, tlatoanis-macbook-air, tlatoanis-macbook-neo, mac.
        Not one of those is `unknown`, and not one of the `unknown` ones is from a
        bare-metal host. The split is clean along the substrate boundary, which is the
        same discriminator the six-ref table gave, now with 19 days of history behind
        it rather than one afternoon.

        SO THE DEFECT HAS BEEN SILENT SINCE AT LEAST 2026-09-02. Every forge that
        salvaged in that window pushed work it could not sign. Nobody noticed, because
        salvage refs are written by hosts in trouble and read by someone else later, so
        the person who could see the wrong name is never the person who needed it.

        ONE REF COMPLICATES IT AND IS WORTH THE CLAIMER'S ATTENTION RATHER THAN BEING
        SMOOTHED OVER: `salvage/forge/20260916-920-cluster-committed` resolves to the
        host `forge`. Same day as two `unknown` cluster refs with almost the same slug.
        So on 2026-09-16 something in a forge context DID resolve a name — meaning the
        `hostname` binary is present in some forge images or some entry paths and absent
        in others, and the failure is conditional on the image rather than universal to
        the regime. Do not assume all forges fail; measure which do. The fix in
        next_action (a resolver chain ending in a refusal) is correct either way and
        does not depend on answering that.

        FOR THE CLAIMER, so this is not re-derived: on forge-tillandsias today
        `hostname` is absent from PATH entirely — `hostname -s` answers `command not
        found`, which 2>/dev/null discards — while $HOSTNAME, `uname -n` and
        /etc/hostname all answer `forge-tillandsias`. That is the shape to look for in
        the images that produced the six refs above.
