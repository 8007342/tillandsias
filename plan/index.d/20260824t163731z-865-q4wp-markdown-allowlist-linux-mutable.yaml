    desired_release: v0.5
    title: "five noncanonical markdown paths blocked the release, and the refusal named a remedy that cannot work"
    status: completed
    kind: defect
    pickup_role: any
    priority: p1
    capability_tags: [ci, release, gates, docs, affordances]
    deliverable: scripts/check-markdown-distillation.sh
    depends_on: []
    estimated_hours: 2
    discovered_by: "865-n8vq — the third of three checks failing ./build.sh --ci-full"
    context: >
      FIVE FILES OUTSIDE THE ALLOWLIST, AND FOUR OF THEM ARE ONE DOCUMENT.

        AGENTS.md                                   the agent-runtime instruction entrypoint
        GEMINI.md                                   -> symlink to AGENTS.md
        .github/copilot-instructions.md             -> symlink to ../AGENTS.md
        images/default/startup-context-addendum.md  injected verbatim into every forge launch
        scripts/refusal-calibration/README.md       docs beside the harness they document

      The first three are ONE FILE with two aliases — verified: identical sha
      44d7c24f2ea6, and `ls -l` shows the links. They are the same class as
      CLAUDE.md, which sits on the allowlist one line above where they now do.
      Each agent runtime looks for its own filename; that is the entire reason
      the aliases exist.

      The addendum is a runtime surface in the strictest sense:
      inject_startup_context() appends it VERBATIM to .forge-startup-context.md
      at launch, read from the mounted checkout (743-y5wh), and it carries its
      own litmus. It is executable context, not prose about the project.

      THE POLICY ALREADY ALLOWED ALL OF THEM. markdown-distillation.yaml's
      validation_rule reads "New Markdown outside canonical roots is allowed
      only for runtime command or skill surfaces." Every one of these is exactly
      that. The rule was right; the allowlist had simply never learned them, and
      a week of releases died on the difference.

      THE FINDING THAT OUTLIVES THE FIX: THE REFUSAL NAMED A REMEDY THAT CANNOT
      WORK. It said "Add an inventory row to
      methodology/markdown-distillation.yaml and move/distill the file." This
      script NEVER READS THAT FILE — the allowlist is hardcoded in bash. A
      reader who follows the instruction edits a YAML, re-runs, and is refused
      identically with no clue why. The two lists have already drifted: the
      YAML's canonical_markdown_roots lacks .claude/commands, the SKILL.md
      surfaces, and images/default/cheatsheets, all of which the script allows.

      That is the same shape as promote-stable.sh's demotion comment (864-mk2p),
      which documented a one-liner that left the channel wrong. An error naming
      a remedy it cannot honour is worse than one naming none: it spends the
      reader's trust as well as their time, and it is read at the moment someone
      is already blocked.
    exit_criteria: >
      (1) The four runtime surfaces are allowed, each with the reason recorded
      at the line that allows it — not silently widened.
      (2) The scripts README is admitted by a rule NARROWER than the existing
      `crates/*` entry, which already admits all markdown under crates.
      (3) The refusal names the real remedy: the allowlist in this script, and
      distillation-plus-archive as the alternative, with the YAML described as
      the archive record it is.
      (4) Mutation control: a genuinely noncanonical TRACKED file is still
      refused. `git ls-files` means an untracked probe proves nothing.

