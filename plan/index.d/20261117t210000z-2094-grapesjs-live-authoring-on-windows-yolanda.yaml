    owned_files:
      - crates/tillandsias-windows-tray/src/main.rs
      - crates/tillandsias-windows-tray/src/notify_icon.rs
    title: "The Windows tray launches a registered web studio (grapesjs first) for a project in a WSL2 forge and opens its window_url in a native Windows browser window"
    context: |
      Today the Windows tray can only start an agent lane (`--forge <project> --opencode` etc.). The headless
      side already takes `--cloud owner/repo --studio grapesjs` and webstudio.open returns a window_url, but the
      Windows tray neither passes `--studio` through nor opens a guest-served URL on the host. The URL must reach
      the Windows browser across the WSL2 boundary (the guest router's preview TLS port, 2067-uc3k), and the
      browser must trust the enclave CA for that origin without the CA being installed host-wide
      (check-enclave-ca-not-host-trusted).
    exit_criteria:
      - "`tillandsias-tray.exe --forge <owner/repo> --studio grapesjs` (and a Studios submenu entry) starts the lane and, within the bounded studio launch time (1945-sthg), opens a Windows browser window on the studio's window_url showing the GrapesJS editor. Pre-fix result: FAILS, the tray rejects --studio as an unknown flag."
      - "An unauthenticated request to the same URL from another Windows process is refused, as on Linux."
      - "The enclave CA is not added to the Windows user or machine root store (check-enclave-ca-not-host-trusted stays green)."
    verifiable_closure: "A windows-tray unit test pins the --studio argv passthrough, and the 2094-7ssf smoke's step 1 records the window opening on yolanda."
