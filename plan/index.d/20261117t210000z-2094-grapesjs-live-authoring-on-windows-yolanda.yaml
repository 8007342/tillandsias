  - packet_id: studio-edits-on-windows-commit-and-push-through-the-forges-work-ref-and-pr-flow-with-no-token-in-the-forge
    order: 2094-s6xc
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    pickup_role: windows
    capability_tags: [studio, git-service, pr-flow, credentials]
    estimated_hours: 4
    size: M
    implementer_tier: sonnet
    depends_on:
      - grapesjs-edits-on-windows-save-into-the-forge-checkout-and-the-preview-reloads-live
    title: "Studio edits made on Windows are committed on a work ref and pushed through the host git service, which opens or updates a PR, with no GitHub token ever in the forge"
    context: |
      Saving into the checkout is not publishing. The operator's flow is the forge's normal one: commit on a
      work/<ref>, push through the host-side git service (which holds the credential), and land via PR. On
      Windows the credential sits in the Windows vault behind the tray's GitHub sign-in (the same sign-in the
      v56.11.17.2 smoke is blocked on), so this packet cannot be proved until that sign-in exists.
    exit_criteria:
      - "From the studio session, one action commits the saved pages on work/studio-<project>-<stamp> and pushes it; the remote branch exists and a PR is open against the repo's default branch. Pre-fix result: FAILS, no studio publish path on Windows."
      - "During the push, no GitHub token is readable inside the forge (env, git config, credential helpers, files); the push is performed by the host git service."
      - "With the tray signed out, the action refuses by name (needs the operator's GitHub sign-in) and pushes nothing; it never starts a login itself."
    verifiable_closure: "The 2094-7ssf smoke's step 4 (requires the operator's tray sign-in)."
    unscoreable: "unpinnable-until-the-guard-exists: openspec/litmus-tests/litmus-studio-publish-pushes-with-no-token-in-forge.yaml lands in the same commit as the implementation (1136-n8sh)"
