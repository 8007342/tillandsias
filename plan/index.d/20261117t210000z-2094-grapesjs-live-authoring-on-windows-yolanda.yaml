    title: "A GrapesJS save from the Windows browser writes the page into the project checkout inside the forge, and an open preview of that page reloads on its own"
    context: |
      1861-nmpp's fixture proves the save endpoint writes index.html on Linux. On Windows the editor runs in a
      host browser and the checkout lives in the WSL2 guest, so the save crosses the router; nothing proves it
      lands, respects write_allowlist (*.html, **/*.html), or that a second (preview) window reloads.
    exit_criteria:
      - "On yolanda, editing a heading in GrapesJS and saving changes index.html in the forge checkout (git -C <checkout> diff shows the edit) within 5s. Pre-fix result: FAILS, no Windows path reaches the studio."
      - "A preview window open on the same page reloads and shows the edit without a manual refresh."
      - "A save that targets a path outside write_allowlist is refused by name and changes nothing."
    verifiable_closure: "The 2094-7ssf smoke's step 2, plus a server.mjs fixture for the reload event."
