    context: |
      The studio needs a project. On Windows the tray has no way to name an existing repo for a studio, and
      the forge must clone through the host git service (the forge holds no GitHub token). 2067-774h fixes the
      label for owner/tlatoani.net.git on the headless side; the Windows tray must use it.
    exit_criteria:
