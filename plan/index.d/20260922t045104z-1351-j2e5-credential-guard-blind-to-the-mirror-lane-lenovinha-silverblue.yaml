    title: |
      the credential guard answers "is there a gh credential" while its name and its consumers read it as "can this host push", so a host whose mirror lane pushed all night reads as having no channel
    context: |
      MEASURED ON lenovinha 2026-09-22, and filed on the coordinator's
      instruction to FILE IT RATHER THAN WEAKEN THE GUARD.
      THE GUARD'S OWN DEFINITION, at scripts/check-credential-channel.sh:50-53:
      "A usable git push credential channel is present when ANY of these holds:
      <git-dir>/.gh-credentials exists and is non-empty, or GH_TOKEN/GITHUB_TOKEN
      is set, or `gh auth status` succeeds." All three are gh. The mirror push
      lane is not among them.
      THE STATE OF THIS HOST WHILE THAT VERDICT WAS RED: the keyring crashed at
      21:42Z (1347-r9g8), gh returns HTTP 401, and the guard reports
      missing:no-credential-channel / unknown:secret-service-unprobed. In the
      SAME window this host pushed to GitHub roughly fifteen times through the
      mirror lane, every one relayed and verified
      ("[relay] Atomic push ... succeeded", "[pre-receive] Relay verified"), and
      landed 1312-i6da, 1346-cdwt, 1342-r4pv and 1347-r9g8 on trunk.
      THE GUARD ALREADY HOLDS THE EVIDENCE IT DOES NOT USE. It knows about the
      mirror — 55 references — but for a DIFFERENT question: whether the mirror
      publishes an upstream write-authorization verdict under
      refs/tillandsias/upstream-auth/* (756-2jnj), which gates worker drain.
      This host publishes exactly that: refs/tillandsias/upstream-auth/
      authorized/1790052562. So the guard can already see that this mirror is
      authorized to write upstream, and still reports no credential channel,
      because the channel question is asked only of gh.
      WHY THIS IS THE NIGHT'S PATTERN AND NOT A FEATURE REQUEST: the guard is
      CORRECT about what it asks. "Is there a gh credential" is answered
      accurately. The name and every consumer read it as "can this host push",
      and the worker loop halts committable work on it. On this host those two
      questions had OPPOSITE answers for six hours.
      WHAT MUST NOT HAPPEN, stated because it is the tempting fix: the guard
      must not be loosened to pass when a mirror merely EXISTS. The mirror lane
      is a real channel only when it is wired and authorized, and 756-2jnj's
      worker-drain gate depends on the distinction. A new verdict that NAMES the
      mirror lane is the shape; a weakened one is not.
    next_action: |
      Unclaimed. Add a verdict that distinguishes "no push channel at all" from
      "no gh channel, mirror lane available and authorized", using the
      upstream-auth ref the guard already reads rather than a new probe. Keep
      every existing blocked:* and missing:* path intact: this adds a case, it
      does not relax one. Write the litmus named above in the same commit.
      Check while there whether join-the-fleet and the worker loop should treat
      the new verdict as a stop-and-report or not — on this host the honest
      answer was "you can land, the gh API is what you have lost", and the loop
      halted anyway.
