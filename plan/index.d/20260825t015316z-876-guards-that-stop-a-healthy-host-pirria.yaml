        - "the unset-CARGO_HOME guard: \"${CARGO_HOME:-}/bin\" expands to /bin, which is skipped explicitly rather than silently accepted as a CARGO_HOME hit"
        - "scripts/test-cycle-preflight-cargo-resolution.sh — 6/6 hermetic, no compilation: shipped-code arm, rustup arm, CARGO_HOME arm, TRUE-POSITIVE arm, /bin arm, MUTATION arm"
        - "LIVE on this host: PATH=/usr/bin:/bin, CARGO_HOME unset -> ok:cycle-preflight:rebuilt+expert-refreshed+services-down3 (it answered blocked:preflight:plan:cargo-absent before)"
      summary: |
        A RUSTUP TOOLCHAIN THAT IS NOT ON THE NON-INTERACTIVE PATH IS NOT AN
        ABSENT TOOLCHAIN. rustup writes its PATH edit into ~/.bashrc, which a
        non-login non-interactive bash never sources — and every agent tool call
        is exactly that kind of shell. pirria carried cargo 1.98.0 and rustc
        1.98.0 and the first tool call of its first cycle answered
        `blocked:preflight:plan:cargo-absent`.

        THIS IS THE TERMINAL VERDICT, WHICH IS THE WHOLE REASON IT WAS WORTH
        FIXING RATHER THAN WORKING AROUND. The skill's rule for it is that the
        cycle must not start at all — "the one failure the loop cannot reason
        its way out of, because the tool it would reason WITH is the stale
        thing." A false positive there does not degrade a cycle, it deletes it:
        an unattended host answers blocked on every fire forever while a human
        reading the transcript goes looking for a toolchain already installed.

        THE TRUE POSITIVE KEEPS ITS VERDICT AND ITS FORCE. A genuinely missing
        cargo still emits the same line and still exits 1; the fixture's third
        arm asserts exactly that, and the mutation arm reproduces the pre-fix
        behaviour to prove the first arm is not passing by luck. Scope, said
        plainly: ./build.sh is untouched, because on immutable Linux it re-execs
        into the tillandsias-builder toolbox and never reads the host PATH — the
        surface this changes is the host-side callers, per criterion 3.
