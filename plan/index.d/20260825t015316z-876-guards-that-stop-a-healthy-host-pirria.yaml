      summary: |
        THE GUARD NOW ASKS THE QUESTION IT IS ACTUALLY ASKING. `git push`, even
        `--dry-run`, runs the local pre-push chain before it contacts anything,
        and pre-push-local-gate.sh refuses whenever the worktree changed since
        `./build.sh --check` last stamped it. So this guard was answering "would
        this tree pass the gate" while reporting the answer as "is there a
        credential", and the skill hard-stops the cycle on any `blocked:*`.

        EVERY PATH INTO THAT STATE IS NORMAL, WHICH IS WHY IT WAS NOT RARE:
        a fetch/fast-forward — which Start-Of-Cycle performs IMMEDIATELY BEFORE
        running this guard, skill step 2; the previous cycle's own Finalization
        step 9, which commits plan/mo-full-attestations.d/<host>.md through the
        plan-only lane and therefore never refreshes the stamp; and minting a
        claim fragment, which the skill mandates before any work. Measured here
        on two consecutive cycles — the second on a CLEAN tree at HEAD ==
        origin, where the single stale path was the attestation file the
        previous cycle was REQUIRED to write. That is a closed loop: the exit
        contract of cycle N guarantees the false block of cycle N+1, on every
        host, forever. yoga hit the identical verdict ten minutes before the
        first observation.

        The remedy the guard printed — seed .git/.gh-credentials — could not
        have helped in any of these cases, which is the part that costs a human
        their afternoon rather than merely a cycle.

        WHAT WAS DELIBERATELY NOT WEAKENED. 860-g798's true positive is the
        reason this probe exists: on a fresh clone git's helper resolves to the
        interactive Git Credential Manager and the first push hangs >10 minutes
        on a prompt no unattended session can answer. That failure fails BOTH
        probes and still reaches blocked:interactive-credential-helper with its
        remedy intact. The retry runs only on the failure path, so the healthy
        case costs nothing, and it is skipped entirely when
        TILLANDSIAS_CRED_PROBE_CMD is set so the existing fixture seam keeps
        exercising the blocked arms. The negative-control arm (unreachable
        remote -> still blocked:*) exists to keep that honest, and the mutation
        arm proves the new arm has teeth rather than passing by luck.
