packets:
  - order: 877-mynm
    packet_id: the-plan-only-lane-cannot-see-its-own-stdin-under-the-composed-hook
    desired_release: v0.6
    title: git hands the composed pre-push hook a 125-byte ref list and pre-push-local-gate.sh reports "no ref list on stdin" — the one lever 863-iicc criterion 7 asks for is intermittently dead
    status: ready
    kind: research
    pickup_role: linux
    priority: p2
    capability_tags:
      - hooks
      - git
      - low-end
      - multi-host
    deliverable: scripts/hooks/pre-push-local-gate.sh
    depends_on: []
    estimated_hours: 3
    context: |
      MEASURED ON pirria 2026-08-25T01:50Z. The pre-push chain has a plan-only
      lane that accepts a push without the build stamp when every outgoing path
      is a new plan fragment. It needs git's ref list to scope the outgoing
      diff, and it reports this when it cannot get one:

        plan-only lane: not applicable — no ref list on stdin to scope the
          outgoing diff (full gate required)

      THREE FACTS, EACH MEASURED RATHER THAN INFERRED.

      (1) GIT SUPPLIES THE REF LIST. The installed hook was temporarily replaced
      with a script that does nothing but read stdin and print what it got, on a
      real `git push origin linux-next`:

        SPY: stdin-is-tty=no
        SPY: refs=[refs/heads/linux-next 4fd5d9dbc2e53afc1e98b9c5726181d3e6dabb63
                   refs/heads/linux-next 48ed3fc0f37d667130328e42833d6dddb75df485]
        SPY: bytes=125

      Well-formed, non-empty, exactly the four fields the guards parse. The real
      hook was restored immediately and verified byte-identical by md5sum.

      (2) PIPED DIRECTLY, THE GUARD READS IT. Same repo, same commit, the same
      ref line fed by hand:

        printf '%s\n' "$R" | bash scripts/hooks/pre-push-local-gate.sh origin <url>
        -> plan-only lane: not applicable — 'crates/tillandsias-plan/src/main.rs'
           is outside plan/index.d/, plan/loop_status.d/, and
           plan/mo-full-attestations.d/ (full gate required)

      A path-scoped answer, which is only reachable after the ref list was read
      and the diff computed.

      (3) UNDER THE COMPOSED HOOK, ON THE SAME PUSH, IT REPORTS NO REFS. The
      installed `.git/hooks/pre-push` is tillandsias-pre-push-v6, whose own
      docstring says stdin "IS CAPTURED ONCE AND REPLAYED" and which does
      exactly that — `REFS="$(cat)"` then `printf '%s\n' "$REFS" | bash <guard>`
      four times. The composition looks correct on inspection, which is why this
      is filed as research rather than as a one-line fix.

      WHY IT MATTERS BEYOND THE COSMETICS. 863-iicc criterion 7 concludes that
      the cheapest intervention for a host whose gate outruns the fleet's
      inter-push gap is a SHORTER GATE, especially for plan-only cycles, and it
      asks whoever picks it up to evaluate that lever before widening any branch
      policy. The lever is already written — and it does not reliably fire. On
      pirria in cycle 1 it fired twice and failed to fire twice; in cycle 2 it
      failed on every real push while working when piped by hand. Each miss
      costs a full gate (~90s here) for a push whose entire content is one
      append-only fragment, and the claim-before-work discipline makes that cost
      recur by construction. A conclusion drawn about criterion 7 while this is
      unresolved would be measuring the wrong thing.

      CANDIDATES, NAMED AS CANDIDATES AND NOT AS A DIAGNOSIS. The `[[ ! -t 0 ]]`
      test in pre-push-local-gate.sh:70 gating its `REFS="$(cat)"`; the
      interaction between the composed hook's four separate `printf | bash`
      pipelines and a guard that exits before draining its own pipe;
      `pre-push-main-branch-affordance.sh:39` and the other guards that consume
      stdin in a `while read` loop. Whoever takes this should instrument the
      guard itself rather than the hook — the spy above already proves the hook
      is not where the refs are lost.

      DO NOT "FIX" THIS BY WIDENING THE LANE. If the lane cannot prove which
      paths are outgoing, refusing to the full gate is the CORRECT failure and
      must stay the failure. The defect is that it cannot see a ref list git
      demonstrably handed it, not that it is too strict about the consequence.
    exit_criteria: |
      (1) A reproduction that shows, from inside pre-push-local-gate.sh under
      the REAL composed hook, whether REFS is empty and at what point it became
      empty — instrumented in the guard, not the hook, since the hook's input is
      already proven non-empty.
      (2) The cause named, and either fixed or recorded as a constraint of the
      composition with the guard adapted to it. If the answer is that a guard
      may not rely on stdin, the plan-only lane must obtain the outgoing range
      another way (e.g. `git rev-list @{upstream}..HEAD`) rather than being left
      to fail open into the full gate.
      (3) The lane's refusal-to-full-gate behaviour is UNCHANGED when the range
      genuinely cannot be determined. This packet must not become a licence to
      accept an unscoped push without the build stamp.
      (4) A hermetic fixture: a scratch repo with a local bare remote, the real
      composed hook installed, a fragment-only outgoing diff, and an assertion
      that the lane FIRES. Today that fixture would fail on this host.
      (5) Measured on a host that reproduces it. pirria does, on every real push
      observed in two consecutive cycles.
