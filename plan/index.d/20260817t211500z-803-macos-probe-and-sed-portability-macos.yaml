  - packet_id: accel-probe-host-facts-are-linux-only
    order: 803-r8u4
    status: ready
    desired_release: v0.5
    priority: p2
    kind: implementation
    title: "system_ram_gb and is_battery_present are read only under cfg(target_os=linux), so a 16 GiB MacBook reports accel_ram_gb=- and asserts it has no battery"
    deliverable: "macOS/Windows arms for RAM and battery; is_battery_present typed so 'unmeasured' is expressible rather than serialised as a confident false; accel_mem_model=unified for Apple silicon"
    depends_on: [accel-capability-probe]
    pickup_role: any
    release_target: forge-local-experts-milestone
    capability_tags: [inference, accel, macos, probe]
    estimated_hours: 3
    context: |
      MEASURED on macOS 2026-08-17 (MacBook Air Mac17,3, 16 GB, battery charged
      and present per `pmset -g batt`).

      RAM: system_ram_gb is populated solely inside cfg(target_os="linux") from
      /proc/meminfo (accel_probe.rs:205-211). The macOS arm (:216-223) sets
      vendor, name, cores and neon and never touches ram_gb, which stays at its
      None initializer (:166). Envelope prints accel_ram_gb=-. 522
      (expert-slots-vram-aware) sizes slots off this number, so it sizes them
      wrong. `sysctl -n hw.memsize` is one call away.

      BATTERY: accel_probe.rs:435-437 —
        // Only the Linux power-supply scan can flip this; other hosts keep false.
        let mut battery = false;
      The comment is accurate; the TYPE is the defect. `is_battery_present: bool`
      cannot express "not measured", so an unmeasured value serialises as a
      confident negative, and on a laptop that is a false negative. Battery
      presence is exactly the signal a routing policy would use to decline
      sustained accelerator load. THE STRUCT ALREADY HAS THE RIGHT IDIOM ONE
      FIELD AWAY: memory_bandwidth_source:"unknown" (:252-253) solves this
      precisely, for bandwidth. Battery should follow it.

      UNIFIED MEMORY: Apple silicon is the canonical unified-memory node — GPU
      and CPU draw on ONE 16 GiB budget and must never be summed (793-qr4t §A.4
      argues this from the WSL2 double-count). The envelope carries neither the
      budget nor the model.

      LOWER-SEVERITY, RECORDED SO THE NUMBER IS NOT OVER-TRUSTED:
      accel_cpu_cores=10 hides a 4-performance + 6-efficiency split.
      physical_cores = logical_cores on macOS (:219) is CORRECT — Apple silicon
      has no SMT — but anything sizing a thread pool off 10 over-commits by
      2.5x on the only cores that matter for prefill.

  - packet_id: accel-probe-engines-field-is-a-hardcoded-literal
    order: 803-825k
    status: ready
    desired_release: v0.5
    priority: p1
    kind: implementation
    title: "enumerate_engines() takes no arguments, inspects nothing, and returns the same ollama/llama-server record on every host in the fleet"
    deliverable: "real engine enumeration that reports an absent engine as absent; unit test asserting a host with no engine does not advertise one"
    depends_on: [accel-capability-probe]
    pickup_role: any
    release_target: forge-local-experts-milestone
    capability_tags: [inference, accel, probe, cross-host]
    estimated_hours: 3
    context: |
      accel_probe.rs:468-474 in full:

        fn enumerate_engines() -> Vec<EngineRecord> {
            vec![EngineRecord {
                name: "ollama".to_string(),
                backend: "llama-server".to_string(),
                supported_device_classes: vec!["cpu".to_string(), "gpu".to_string()],
            }]
        }

      No arguments, no inspection, same value on every host. capabilities.json
      therefore asserts ollama-with-llama-server is available here — an
      assertion no code checked and which on this host is unverified.

      This INVERTS the lesson 793-qr4t drew from the WSL2 experiment, where
      installing vulkan-loader + mesa-vulkan-drivers is what turned an unusable
      GPU into a usable one with the hardware unchanged: "Enumeration, not file
      existence, is the test", and "a probe that reports hardware without
      reporting engine readiness reports a capability we cannot exercise". The
      engine half here does not even reach file existence.

      WHY THIS IS THE p1 OF THE THREE: it is the field most likely to be
      believed and least likely to be true, and it is what makes "the fleet has
      no matrix to route against" concretely correct — the engine column is a
      constant, so no two hosts can be told apart by it.

  - packet_id: macos-uninstall-destroys-the-vm-outside-its-own-wipe-guard
    order: 804-bpke
    status: ready
    desired_release: v0.5
    priority: p0
    kind: bug
    title: "shipped uninstall.sh deletes the 11.83 GiB VM directory with no --wipe, no root and no prompt, then prints 'Cache preserved. Use --wipe to remove everything.'"
    deliverable: "either rm -rf \"$DATA_DIR\" moves behind --wipe, or the closing message stops claiming preservation; plus a test pinning that the non---wipe path does not remove the VM image"
    pickup_role: macos
    release_target: stable-milestone-v1
    capability_tags: [macos, data-loss, uninstall, release-artifact, vz]
    estimated_hours: 2
    context: |
      MEASURED on this host 2026-08-17. scripts/uninstall.sh on Darwin sets
      (:5-12) DATA_DIR="$HOME/Library/Application Support/tillandsias" and
      CACHE_DIR="$HOME/Library/Caches/tillandsias". Then:

        :73   rm -rf "$DATA_DIR"          # UNCONDITIONAL
        :119  if [[ "$WIPE" == true ]]; then
        :121      rm -rf "$CACHE_DIR"
        :144  [[ "$WIPE" != true ]] && echo "  Cache preserved. Use --wipe to remove everything."

      Line 73 is outside BOTH guards in :66-129 (IS_ROOT at :82/:94/:112, WIPE
      at :119). No root required. No confirmation prompt — :36-64 is a
      print-only preamble.

      DATA_DIR IS THE VM DIRECTORY. rootfs_image_path() = image_root.join(
      "rootfs.img") (vz.rs:133-135), top level, no subdir. Measured with du -sk:

        VM_DIR      12,407,656 KB = 11.83 GiB   <- what the DEFAULT path deletes
        rootfs.img  11,881,200 KB = 11.33 GiB   (apparent 250 GiB, SPARSE)
        CACHE_DIR            8 KB               <- what --wipe ADDS

      THE MESSAGE IS EXACTLY INVERTED. The reassuring path destroys the VM, the
      model cache, the ollama engine payload, every guest-built container image
      and the vault, and reports that it preserved the cache; opting in to
      "remove everything" adds 8 KB. Ratio roughly 1.5 million to one.

      THIS SHIPS. .github/workflows/release.yml:233 installs uninstall.sh into
      release-artifacts/ and :286 asserts it is present. Operator-reachable in
      the current release, which is why this is p0 rather than p1.

      CONTRAST WITH THE LINUX TWIN 804-wfcu, filed the same day: linux scoped
      theirs honestly as POSSIBLY PACKAGING-ONLY, because the analogous
      rm -rf "$SERVICE_HOME" needs a tillandsias service account no installer
      provisions. The macOS path has NO such mitigation — $HOME/Library/
      Application Support/tillandsias is where the VM actually lives today.

      SPARSENESS HIDES IT: `ls -la` reads 250 GiB (which nobody believes is
      real) and post-delete `df` moves 11.33 GiB (which nobody attributes).

