        cycle-metrics.sh silently dropped the surface claim from its mcp: line.
        Net effect: the macOS daily gate was PERMANENTLY due with a write-only
        marker, and the one fact only the agent can report (801-m9tk — whether
        MCP tools reached this session) was discarded on every macOS cycle,
        i.e. the read path most likely to be degraded was the one whose
        degradation could not be recorded. BOTH SELF-TESTS WERE HONEST AND BOTH
        FAILED HERE — 2 FAIL and 4 FAIL, correct non-zero exits — so the gap was
        never the test, it was that no BSD-userland host had ever executed it;
        these scripts landed 2026-08-17 and became gates the same day, validated
        on Linux, and ./build.sh --check does not run their fixtures on macOS.
        FIX: split on spaces and anchor the field name (tr ' ' '\n' | sed -n
        's/^field=\(...\)$/\1/p') instead of approximating a field boundary.
        Portable to both seds and strictly MORE precise than \b was, since the
