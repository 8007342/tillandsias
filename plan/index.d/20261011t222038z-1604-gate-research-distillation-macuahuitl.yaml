      - build.sh
    title: |
      litmus:release-gates-run-locally step 7 runs scripts/test-gate-stamp-memoization.sh, whose cases 12 and 13 start a REAL `build.sh --check` and `--check --install` on the gating checkout and accept `timeout 90` / `timeout 40` killing them (rc 124) as proof of real work, so the fixture spends about 130 s of its MEASURED 142-144 s waiting on wall clocks; each forced child also runs the 1599-egzz tracked-file touch over the parent's checkout mid-gate, so every cargo step after it recompiles
    context: |
      Measured: litmus:release-gates-run-locally 144,434 / 142,682 / 143,350 /
      143,377 ms on macuahuitl 2026-10-08/09 (timing log). The fixture's own
      comments explain the 124 acceptance ("the forced run re-execs into the
      builder toolbox, and that entry alone can eat the whole bound"). On trunk
      ed7a73185 build.sh dispatches `_touch_gating_checkout` whenever
      FLAG_CHECK/TEST/CI/CI_FULL/RELEASE/INSTALL is set, with no nesting guard,
      so cases 12, 13 and 14's children each touch every tracked file of the
      real root while the parent gate still has cargo-using data steps ahead
      of it (375-1201-hsf9, check-no-python's cargo build, 590's release
      helper). The research (research-gate-costs, "real nested gates in
      release litmus") named the children and their ceilings; it did not
      notice the touch re-entry, which postdates its frame.
      Shape of a fix, to be measured: (1) case 12/13 poll the child's log and
      kill it at the FIRST banner that proves the memo was not taken and real
      work started, keeping the timeout as the ceiling only; (2) a nested
      child (parent gate pid or an explicit env the fixture sets) skips the
      touch or the parent re-establishes it, with a negative control showing
      a non-nested forced gate still touches. Keep the real nested gate; it
      is what the fixture is for (1442-22d2's lesson stands: never mint a stamp
      to shortcut it).
    exit_criteria:
      - 'litmus:release-gates-run-locally timing record on macuahuitl under 60,000 ms (pre-fix 142,682-144,434 ms across four runs, 2026-10-08/09)'
      - 'cases 12 and 13 report ok as soon as the child prints its first post-memo real-work banner, shown by the fixture log naming the banner it matched and the child exiting by signal before its timeout; a child that takes the memo still fails case 12 (negative control, run with TILLANDSIAS_FORCE_CHECK unset in the child)'
      - 'the mtime of a sampled tracked file in the gating checkout (stat before and after the fixture) is unchanged by the fixture; pre-fix it advances during each forced child (1599-egzz touch re-entry)'
      - 'NEGATIVE CONTROL: a non-nested TILLANDSIAS_FORCE_CHECK=1 ./build.sh --check still prints note:gate-touch and advances the sampled mtime'
    verifiable_closure: 'bash scripts/test-gate-stamp-memoization.sh passes, and the next macuahuitl release-gates litmus record is under 60 s'
    depends_on: []
    related: [1442-22d2, 1599-egzz, 599-4wzr, 1604-runj]
