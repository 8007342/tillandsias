  - packet_id: the-release-gates-litmus-fixture-waits-out-90-s-and-40-s-wall-clock-timeouts-on-real-nested-build-sh-check-children-that-also-re-touch-every-tracked-file-of-the-gating-checkout-mid-gate
    order: 1604-8uae
    status: ready
    kind: defect
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    size: M
    implementer_tier: sonnet
