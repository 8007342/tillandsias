      container's death.
    problem: >
      OBSERVED 2026-08-04T02:40Z during the second consecutive forge lane of the
      v0.4.260804.1 curl-install smoke. The lane exited with status 139
      (128+11 = SIGSEGV). The FIRST lane, ~20 minutes earlier, completed
      normally — so this reproduces on a repeat session, not on cold start.

      WHAT IS NEW HERE. BigPickie's trail
      (plan/issues/forge-opencode-container-crash-trail-2026-08-02.md) recorded
      "core_pattern -> systemd-coredump (verify capture)" as an OPEN question,
      because opencode is PID 1 and the container dies with it, taking the
      evidence. Capture is now VERIFIED, and better than hoped: the dump lands on
      the HOST and survives the container.

        coredumpctl 3450686
        PID 3450686 (opencode), signal 11 (SEGV)
        cmdline: opencode run --auto 'Use the /meta-orchestration skill in smoke mode (verify-only)'
        exe: /home/forge/.cache/tillandsias-project/npm/global/lib/node_modules/opencode-ai/bin/opencode.exe
        cgroup: libpod-cc549176...scope/container      <- inside the forge
        hostname: forge-tillandsias
        storage: /var/lib/systemd/coredump/core.opencode.1000.*.3450686.*.zst  (91.3M, present)

      STACK, thread 1 — frame #0 is `abort` in libc, NOT a raw faulting
      dereference:
        #0 abort (libc.so.6 + 0x1818)
        #1..#6 opencode.exe + 0x37ca5d0, 0x44a5425, 0x4dfadda, 0x4f820fc,
               0x47894c6, 0x4efcbb4
        #7 (anonymous, no build-id — JIT region)
      Also loaded: /tmp/.bcd9fd9ef4f5b6ff-00000000.so without build-id.

      That shape — abort at the top, an unnamed JIT frame at the bottom — matches
      the arm64 incident of 2026-07-27 ("panic: Segmentation fault at address
      0xD0"): Bun faults, its panic handler runs, and the handler aborts. Two
      architectures, same runtime (Bun v1.3.14), same shape.

      NOT disk pressure. The host was at 59% used / 393G free, having been GC'd
      earlier the same cycle. The 96%-full hypothesis from 597-fmm2 does not
      explain THIS crash, and that packet should not claim it does.

      Contemporaneous, and possibly related: the litmus run inside the lane
      emitted four `[ENV-FAIL] podman unresponsive (>5s): stalled storage lock`
      lines just before the segfault
      (plan/issues/podman-sqlite-lock-zombie-cascade-2026-07-15.md).
