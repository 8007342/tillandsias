        LANDED 303a16611 (verified an ancestor of origin/linux-next before this event was written). The gate's sub-second deciders now run before its first compile.

        THE MEASUREMENT, one planted exec-bit defect, TILLANDSIAS_FORCE_CHECK=1 on both runs, identical verdict (violation:script-not-executable:1) and identical rc=1:
            before the reorder   222 seconds to refusal
