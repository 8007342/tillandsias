      summary: >
        LIVE NEGATIVE CONTROL PASSED, from inside a forge, exactly as the exit criteria demand. Landed 8b08a0305.  METHOD, and it is the point: I applied install_project_guard_hooks to THIS running forge, committed a tree with a stale gate stamp, and pushed to a scratch ref. RESULT: rc=1; the pre-push hook refused, printing its own "Push CI no longer exists. This hook is the trunk's only gate."; and the remote ref DID NOT MOVE (before=none, after=none — the branch was never created). The pre-commit hook fired in the same commit ("OpenSpec: 11 notice(s) — not blocking commit"), so both guards are live, not just installed.  Before: `ls ~/.cache/tillandsias/git-hooks/` -> post-commit, prepare-commit-msg. After: hooks: pre_push=present pre_commit=present dir=/home/forge/src/tillandsias/.git/hooks.  THE GUARD THEN ENFORCED ON ME, TWICE, WHICH IS THE BEST EVIDENCE THERE IS. Pushing this very commit was refused because a rebase moved the tree and staled the stamp; I re-ran ./build.sh --check and it passed. That is the loop the fleet is supposed to have, running for the first time in a forge.  DESIGN: repo-local, not global. Installing into the global dir is the obvious move and is known-bad — a global guard fires in every repo on the box including each /tmp fixture repo, which on 2026-09-01 made `git commit` impossible outside the checkout, failed six litmus suites as collateral, and killed build.sh --check at the 877-mynm fixture (6/5 -> 11/0 on removing the global hook alone). A repo-local core.hooksPath is set for the project checkout ONLY. The trailer hook is copied across because the repo-local path shadows the global dir entirely; install-hooks.sh's own post-commit supersedes the forge's.  SYNCHRONOUS in the lifecycle, before the background lane: installing in the lane would leave a race in which a fast agent commits and pushes through a checkout that has no gate yet — the exact condition being fixed.  OBSERVABILITY (candidate 2 from the issue): the startup context now carries `hooks: pre_push= pre_commit= dir=`. The gap was found BY ACCIDENT, while checking whether a push had taken the plan-only lane; an unobservable guard is indistinguishable from a missing one, which is the 801-qasc lesson.  FIXTURE, pinning only what a fixture honestly can (11/11, wired into --check): that the guards go repo-local, that the GLOBAL dir is untouched and no global pre-push is ever installed, that the trailer survives the shadowing, that a non-Tillandsias repo and a missing checkout are silent no-ops, and that the state line reports absent as readily as present. It deliberately does NOT assert that a hook fires — four fixtures on 2026-09-02 reported success while their spy hooks were never invoked for this same core.hooksPath reason, so that assertion belongs to the live control above and not to CI.
