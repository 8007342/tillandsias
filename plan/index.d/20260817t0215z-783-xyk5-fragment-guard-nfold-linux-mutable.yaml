    priority: p1
    kind: optimization
    title: "check-fragment-status-loss.sh is 60% of every --check: it spawns `tillandsias-plan status` once per declared packet, re-folding the whole ledger each time"
    deliverable: "one batched fold (`tillandsias-plan query --json --limit 0` -> packet_id/status pairs, joined in a single awk pass) replacing both per-packet spawn loops, with the guard's detection semantics UNCHANGED and proven so by a mutation control"
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags: [velocity, guards, plan-tooling, gates]
    estimated_hours: 2
    context: |
      MEASURED 2026-08-17 by the 765-dfry telemetry landed the same night — the
      substrate did its job on the first run. Per-step records on this host:

        step:checking-for-fragment-status-transitions-the-fold-discards  10470ms  (warm, main checkout)
                                                                          40538ms  (cold, agent worktree)
        step:checking-groundtruth-cases-for-mutable-status-pins-680-zphp  1224-5343ms
        build-check TOTAL                                                17363ms

      So ONE guard is ~60% of the pre-push gate, and the gate runs 2-5x per
      cycle on every host, every cycle, all night. Root cause is structural,
      not accidental: the script's two passes each call
      `"$PLAN" status "$pid"` inside a `while read` loop (lines ~64 and
      ~124), and every one of those invocations re-reads and re-folds the
      entire base ledger plus all fragments. Measured today: 24 declared pairs
      -> ~436ms per spawn.

      The batch primitive already exists and is exact: `tillandsias-plan
      query --json --limit 0` returns ALL 974 packets with
      {packet_id, status, order} in 129ms, through the same folded reader
      (582-26mm) the per-packet `status` call uses — so this is a
      spawn-count fix, not a semantics change. jq is an established gate
      dependency (check-mcp-expert-health.sh uses it 22x).

      CONSTRAINTS THE FIX MUST HONOR:
        * bash 3.2 (macOS system bash) — NO associative arrays; the
          761-g36m bash-dialect gate refuses new bash-4-isms. Join with a
          single awk pass over a TSV map instead.
        * The guard is fail-loud infrastructure that exists because
          fragments were silently discarded for two days (752/598-kibt).
          A faster guard that catches less is a REGRESSION, so the closure
          bar is a MUTATION CONTROL: seed a fragment declaring a terminal
          status the fold does not carry, prove the new implementation still
          refuses, and prove the clean tree still passes.
        * Keep the 598-kibt per-file boundary isolation of the
          fragment-terminal-events pass (that pass is per-FILE by design;
          batching its `status` lookups is in scope, merging its file loop
          is NOT unless isolation is preserved).
        * Preserve the 702-68zj loud SKIP when the binary predates
          fragment-terminal-events.
      Expected result: the gate's dominant cost falls from ~10s to well under
      1s, on every host, every cycle — a compounding win, which is the whole
      argument of the 2026-08-15 velocity audit.
