    title: |
      Fixtures that write scratch files INTO the checkout (scripts/.<name>.$$.sh beside the code they exercise) instead of $TMPDIR leave them behind when the preflight door's TERM, 1 s, KILL lands. Untracked files under scripts/ are what diff-scoped guards read as added code. 1587-qqzs fixed one such fixture; this is the population.
    context: |
      OBSERVED on tlatoanis-macbook-air 2026-10-11 (darwin, taskpolicy -b ./build.sh --preflight on work/1600-nn5b): test-litmus-step-pipefail was deadline-skipped at 12 s and left `scripts/.wka4-prefix-runner.43858.sh` untracked in the checkout. Its only cleanup is `trap 'rm -rf "$TMP" "$PREFIX_RUNNER"' EXIT`, and PREFIX_RUNNER="$ROOT/scripts/.wka4-prefix-runner.$$.sh" (line 34).
      HEURISTIC SCAN (grep, not the deliverable) for paths built under $ROOT/scripts/. or beside a script, on trunk 2026-10-11:
      - test-litmus-step-pipefail.sh:34, .wka4-prefix-runner.$$.sh (observed leaking);
      - test-litmus-structured-assert.sh:27, .znbn-prefix-runner.$$.sh;
      - test-litmus-parse-instruments-agree.sh:148, .run-litmus-test.mutant-1303.$$.sh;
      - test-order-citations-resolve.sh:29 and :62, .order-citation-probe{,2}-$$.sh;
      - test-awk-float-lc-numeric.sh:99, .mutant-lcnum-* (already signal-safe since 1587-qqzs, 6c62b0e5e; it must stay beside the producers it copies, since they derive REPO_ROOT from BASH_SOURCE).
      WHY $TMPDIR IS THE PREFERRED FIX (coordinator): since 1600-nn5b (#333), the preflight door gives each guard its own TMPDIR and deletes it after the guard, killed or not. A writer moved to ${TMPDIR:-/tmp} is cleaned up for free, and no trap has to survive a KILL, which none can. A file that must sit beside a script, because it resolves siblings or ROOT from its own path, keeps the 1587 shape: TERM/INT/HUP traps that exit, and long steps under `cmd & wait $!`.
    exit_criteria:
      - 'a population scan (a Lua guard in --check) of fixtures that create files inside the checkout (scripts/, or any tracked directory) rather than $TMPDIR prints scanned/writers/unsafe and ends at unsafe=0. "Safe" means the file is under ${TMPDIR:-/tmp}, or its cleanup survives a door KILL (the 1587 shape). Each writer is listed with which of the two applies, and a writer that must stay in the checkout carries a reason line.'
      - 'test-litmus-step-pipefail.sh is shown, in ONE run, leaving its prefix runner in the checkout pre-fix and nothing post-fix, under the door kill sequence (TERM, 1 s grace, KILL)'
    unscoreable: "unpinnable-until-the-guard-exists: the scan and the per-fixture moves are written together"
    depends_on: []
