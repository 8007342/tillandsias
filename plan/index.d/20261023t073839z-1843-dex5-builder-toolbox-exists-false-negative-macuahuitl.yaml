    title: |
      with-tillandsias-builder.sh treats a failed `toolbox list` as "no builder" and runs `toolbox create`, which dies "container tillandsias-builder already exists" and fails the gate
    context: |
      MEASURED macuahuitl 2026-10-23, land-queue run 4: #612 was evicted with
        [tillandsias-builder] Creating 'tillandsias-builder' toolbox (first run)...
        Error: container tillandsias-builder already exists
      while `podman ps -a` showed the builder Up 43 hours. _toolbox_exists piped
      `toolbox list --containers 2>/dev/null` through awk and grep, so any
      transient list failure read as absence. Fix: ask `podman container
      exists` first, keep the toolbox-list path as the fallback.
    exit_criteria:
