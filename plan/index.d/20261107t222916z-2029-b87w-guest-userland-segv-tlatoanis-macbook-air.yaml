  title: After the forge image build every new process in the macOS VZ guest segfaults, so the forge never starts and the VM cannot shut down cleanly
  context: 'v56.11.7.1 macOS smoke on tlatoanis-macbook-air (Apple M5, 16 GiB, macOS 27.0.1; guest 8 vCPU / 8 GiB, Fedora 44, kernel 7.2.15, podman 5.8.9, btrfs root; tillandsias.slice MemoryLow per 1913-fh6l), after a clean reset and provision and the operator''s own GitHub and Cloudflare sign-ins. Twice in a row the forge build ended and the guest broke. Current boot console: "crun-buildah-buildah… .scope: Consumed 22.409s CPU time over 55.555s wall clock time, 4.2G memory peak, 2.4G written to disk" at 262 s, then from 278 s EVERY new process segfaults: podman healthcheck transient units "Main process exited, code=dumped, status=11/SEGV" every ~30 s, `--exec-guest ''echo hello; uname -r''` exit 139 signal 11, `podman ps` and `rpm -q` likewise, and the tray''s GitHub-login terminal opens and closes at once. Long-running daemons (tillandsias-headless, vault, proxy) keep answering. On the first occurrence (22:11:12Z) the guest service then stopped answering vsock ("Connection reset by peer"), the drain failed and the VM was force-stopped (twice), which triggered 1642-cc54''s rebuild and lost the sign-ins. ROOT CAUSE UNPROVEN: kernel segfault lines are not on the serial console and nothing can be exec''d to read the journal. Suspects: the 7.2.15 guest kernel (or VZ memory/balloon) corrupting file-backed pages under the 4.2 GiB build peak, a damaged shared library, or swap. Host-side evidence saved at target/smoke-e2e/evidence-segv-20261107t222652z (console.log, tray.log, unclean-rebuilds.log, VM dir listing, diagnose.json).'
  exit_criteria:
