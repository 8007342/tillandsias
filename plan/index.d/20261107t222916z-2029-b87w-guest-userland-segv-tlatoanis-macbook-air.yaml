  verifiable_closure: 'A published-release macOS smoke whose forge turn returns its token after a cold forge build.'
  unscoreable: 'none.'
  next_action: 'Make the guest log kernel messages to the serial console, then reproduce with one cold forge build on a fresh guest and read the faulting library.'
