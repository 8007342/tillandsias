      summary: >
        --dry-run added, and the test rebuilt around TRIPWIRES rather than
        stubs — which is the part that makes the rest worth anything.

        THE SCRIPT. Flags now parse in any order (the old form took --force
        positionally as $2, so `<tag> --dry-run` bound --dry-run to FORCE and was
        silently ignored — the pre-fix script does exactly that in the mutation
