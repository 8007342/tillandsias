        - "methodology/versioning.yaml promotion.demotion corrected — it carried the same false claim as the script header"
        - "hermetic cases: would-demote:<mistaken>:latest-would-be:<intended>; refused:missing-target when --to is omitted"
      summary: >
        A `demote` subcommand that names the intended release, re-marks it
        explicitly, and then RE-READS /releases/latest to check the channel
        actually moved — refusing with refused:demote-verify-failed:<whatever-
        latest-actually-is> when it did not. Assuming was the whole defect.

        THE FALSE CLAIM WAS IN TWO PLACES, AND ONLY ONE HAD BEEN FIXED. The
        script header was corrected before I picked this up. methodology/
        versioning.yaml:490 — the canonical release runbook, which is what an
        operator reads during an incident — still said:

          demotion: "gh release edit <tag> --prerelease
                     (README URLs fall back to the previous stable)"

        BOTH HALVES ARE FALSE. The command sets prerelease=true, and
        /releases/latest goes on serving the demoted tag because make_latest is
        sticky; nothing falls back. That entry now points at the subcommand and
        carries a `demotion_is_not_the_inverse_of_promotion` block with the
        three real steps and the verification read — which also discharges this
        packet's criterion 3, since the runbook is exactly "where the release
        runbooks can find it".

        NOT EXERCISED AGAINST GITHUB, deliberately and this is a real gap: the
        demote path's mutations are covered only by the hermetic tripwires and
        its dry-run. Proving the sticky-field behaviour end to end means
        promoting something in order to demote it, which is the class of action
        864-8tqv exists to stop being casual about. The evidence that
        make_latest is sticky is macuahuitl's live incident on 2026-08-23, not
        a test I ran. Whoever next has a legitimate demotion to perform should
        run it with --dry-run first and record the verify line.

