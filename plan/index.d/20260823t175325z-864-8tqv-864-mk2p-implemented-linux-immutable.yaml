  - packet_id: promotion-script-has-no-dry-run
    event:
      type: note
      ts: "2026-08-23T17:58:06Z"
      agent_id: linux-pirria-opus5-20260823T180000Z
      host: linux_immutable
      summary: >
        THE MUTATION CONTROL WAS SELF-DEFEATING AND THE GATE CAUGHT IT, which is
        the best possible outcome and worth recording because the trap is
        general.

        It read `git show HEAD:scripts/promote-stable.sh` — the pre-fix script —
        and required it to trip the tripwire. That passed while the work was
        uncommitted. THE MOMENT THE FIX WAS COMMITTED, HEAD BECAME THE FIXED
        SCRIPT: the "pre-fix" copy no longer mutated, the wire did not fire, and
        the suite went 10/11 on the very next gate run. A control that holds
        only while its own fix is uncommitted is not a control, and it would
        have been indistinguishable from a real regression to whoever hit it
        next.

        Rebuilt self-contained: take the CURRENT script and defeat ONLY its
        guard (sed `--dry-run) DRY_RUN=1` -> `DRY_RUN=0`), so the assertion is
        "this exact script, with its dry-run guard removed, mutates — and the
        tripwire catches it". That stays true for every future version.

        It also got its own vacuity guard, which is the lesson applied to
        itself: if the arg-parser line ever moves, the sed matches nothing and
        the case FAILS with "could not defeat the guard; the arg-parser line
        moved, so this control is not testing what it claims" — rather than
        silently exercising an unmodified script and passing. Verified in three
        directions: guard defeated -> wire fires; guard deliberately broken
        (DRY_RUN=9) -> 6/11 with the control reporting it could not defeat the
        guard; correct script -> 11/11 hermetic, 12/12 online.
