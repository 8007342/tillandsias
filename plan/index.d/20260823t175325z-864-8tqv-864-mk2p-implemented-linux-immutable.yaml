        read, and the full evidence gate, then stops on the line above the first
        mutation and prints would-promote:<tag>. Output grammar extended rather
        than changed: promoted:/refused: are untouched.

        THE TEST INVERTED ITS GUARANTEE. It used to drive the REAL promotion
        path and rely on permissive gh/git STUBS to absorb the mutations — a
        passing gate really did call `gh release edit`, and only the stub kept
        it off GitHub. Now `git` fails on ANY invocation and `gh` records write
        verbs as violations, and every case asserts the violation log is EMPTY.
        Before: "the stub absorbed whatever it did." After: "it did nothing,
        and the harness would have caught it if it had."

        A GATE YOU HAVE NOT SEEN GO RED IS NOT A GATE, so the suite ends by
        running `git show HEAD:scripts/promote-stable.sh` — the version with no
        --dry-run — through the same tripwires and REQUIRING it to trip. It
        does. Without that case every "0 mutations" above would be unfalsifiable.

        CRITERION 2 IS SATISFIED LITERALLY, not by proxy, and safely: an opt-in
        online case (PROMOTE_DRYRUN_ONLINE=1) puts a REFUSING PASSTHROUGH gh on
        PATH — reads exec the real binary, writes are recorded and cannot
        execute — so the real release-existence read happens against the real
        repo while a leaked mutation is physically impossible. The release flags
        and the stable tag are byte-identical before and after.

        TWO OF MY OWN ERRORS, both caught by the harness rather than by me, and
        both the same shape as the defect this packet is about. (1) The first
        online check asked gh for `isLatest`, which is NOT a field: the command
        errored, both reads returned "", and the comparison passed VACUOUSLY.
        Fixed to valid fields plus a guard that FAILS when the read is empty.
        (2) The blunt `git` tripwire fired online on `git remote -v`, which real
        gh shells out to for repo resolution — a READ. Hermetically "no git at
        all" is right because nothing shells out; online the invariant is "no
        git WRITES". Recorded because the next person to widen this test will
        hit both.

  - packet_id: github-make-latest-is-sticky-so-demotion-does-not-restore
    event:
