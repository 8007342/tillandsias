        cargo test -p tillandsias-headless the_sync_verdict:
          test tests::the_sync_verdict_parse_never_reads_a_stale_mirror_as_current ... ok
          test result: ok. 1 passed; 0 failed

        THE SHIPPED PUBLISHER PROVED INSIDE THE REBUILT IMAGE, on a scratch
