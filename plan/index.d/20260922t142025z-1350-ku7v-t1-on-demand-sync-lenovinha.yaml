      summary: |
        T1 ON-DEMAND HALF — `tillandsias --sync <project>`.

        The cadence half publishes the state at startup, on every reconciler
        tick and around every relay push, with staleness bounded by
        MIRROR_RECONCILE_INTERVAL. This is the other half: the answer NOW, for
        a host or a tray action about to spend a push.

        IT FETCHES BEFORE IT REPORTS, and that is the design decision worth
        recording. Reading the published ref alone would answer a question
        about the last tick, and the caller asking on demand is exactly the
        caller for whom a tick-old answer is not good enough — this row's
        motivating measurement is a host that fetched, rebased, and still lost
        the race three times running. So the command runs the SAME reconcile
        pass the periodic loop runs, republishes through the SAME publisher,
        and reports. Nothing re-implements the verdict, so the on-demand and
        cadence answers cannot drift apart.

        IT FAILS CLOSED. Exit is non-zero unless the answer is heads-current:
        heads-behind and heads-unknown both mean "do not spend a push yet",
        and an unreadable verdict is never a pass. A mirror that has never
        fetched upstream is not a current mirror — collapsing "behind" and
        "absent" into one answer is 1338-tkfh itself.

        TWO FAILURES FOUND BY RUNNING IT, NOT BY READING IT:

        1. THE FLAG WAS REFUSED AT RUNTIME WHILE BEING FULLY WIRED. Parsed,
           dispatched, helped and documented, and the binary still answered
           `Unsupported option: --sync` with rc=2, because known_flags is a
           separate allow-list. This is precisely the shape the --reset-state
           comment at the head of that list records: "a binary that mentions
           the flag everywhere a reader or a source scan would look while
           refusing it at runtime". The comment was right and the list still
           caught me. Arm 11 now RUNS the binary.

        2. AN OLD MIRROR IMAGE REPORTED AS A BROKEN CONTAINER RUNTIME. The
           first live run against this host's mirror answered
           `crun: executable file /usr/local/share/git-service/publish-sync-state
           not found`, which sends a reader to debug podman. The condition is
           an image built before the publisher shipped and the remedy is a
           rebuild, so the command now names that state:
           `blocked:sync:mirror-image-predates-publisher:<container>` with the
           rebuild as the remedy. A failure naming the wrong cause is this
           fleet's recurring expense, and this row was filed about an instance
           of it.

        The verdict parse is extracted as sync_state_of() and unit-tested over
        every way the answer could be misread as current: the three states,
        trailing whitespace from a command substitution, an empty string, a
        bare state with no prefix, and the publisher's own stderr shape.
      evidence: |
        ok:mirror-sync-state:12/12 arms (was 10/10; arms 11-12 are the
        on-demand half).

        Arm 11 runs the built binary and fails if it answers
        `Unsupported option: --sync`. Arm 12 pins the contract between the
        command and the image — the two absolute paths run_sync_project execs
