    title: |
      The Windows smoke runbook's cmdkey credential verifier is true for every target, so §2 throws on every run — including a clean one — and the delete guard it shares never guards.
    context: |
      FOUND by esme-windows running /smoke-curl-install-and-test-e2e on release
      v56.9.2.1 (plan/issues/smoke-e2e-findings-v56.9.2.1-2026-09-04.md, packet
      smoke-finding/804-ckst-credential-verifier-always-true, finding F2).
      THE PREDICATE. Runbook §2 (skills/smoke-curl-install-and-test-e2e/SKILL.md:330-334)
      clears the two guest-vault entries and then verifies with
        (& cmdkey.exe /list:$_ 2>$null) -match [regex]::Escape($_)
      The same shape gates the delete at :330-331 ($listed -match [regex]::Escape($cred)).
      MEASURED, for a target just deleted AND for one that never existed:
      `cmdkey /list:<target>` prints `Currently stored credentials for <target>:` and
      then `* NONE *`. The header echoes the queried name, so the -match is true
      unconditionally. Repro on any Windows host:
        cmdkey.exe /list:definitely-not-a-real-target-xyz   -> output contains the target name
      GROUND TRUTH from the whole store (`cmdkey /list`, no target) after the delete: only
      `Target: LegacyGeneric:target=tillandsias-vm-uuid` remains — the delete DID work, and
      the preserved anchor is exactly the one the runbook says to keep.
      TWO FAILURES FROM ONE BAD PREDICATE, IN OPPOSITE DIRECTIONS. The post-delete
      assertion `if ($stillThere) { throw "host vault credentials survived the reset" }`
      fires on EVERY run, including a perfectly clean one — so §2 as written aborts the
      Windows smoke every time and the lane cannot complete without a hand override. And
      the same predicate gates the delete itself, so the guard never guards: it always
      deletes, whether or not the entry is there (harmless today, blind by construction).
      WHY p1. Order 804-ckst (windows-e2e-reset-must-clear-host-side-vault-credentials,
      done) exists precisely because a stale share silently survived a reset and broke the
      operator forty minutes later; the step that closes it currently cannot report its own
      success. This is the THIRD INSTANCE that night of a check whose green and whose red are
      both unearned: `ok:gh-credentials-store` from check-credential-channel.sh (green while
      `gh auth status` says the keyring token is invalid, same report) and
      check-enclave-service-health.sh reporting absent=0 after a `podman rm` of the proxy
      (lenovinha, fleet board 2026-09-04). Name the shape when picking this up: a predicate
      that cannot be false is not a check.
      THE FIX, esme's, verified against the ground truth above: replace both predicates with
      a whole-store read that matches the stored target line,
        ((& cmdkey.exe /list | Out-String) -match "target=$name")
      then re-run §2 on a Windows host and confirm it completes without throwing.
      Provenance: measured by esme-windows on ESMERALDINHA (Win11 Home 26200, WSL 2.7.12.0)
      2026-09-04T06:55Z, unable to push (dead host credential); relayed and filed by the
      coordinator on macuahuitl.
    next_action: |
      LEFT: edit SKILL.md:330-334 so both the delete guard and the post-delete verifier read
      the whole store (`cmdkey.exe /list | Out-String`) and match `target=<name>`; keep
      `tillandsias-vm-uuid` preserved. Then, on a Windows host, run §2 twice from the same
      state (first run deletes, second run finds nothing) and paste both outcomes; run the
      negative control `definitely-not-a-real-target-xyz` through the new predicate and paste
