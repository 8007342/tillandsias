      text also looked right.
    exit_criteria:
      - both §2 predicates (delete guard and verifier) read the whole store and match `target=<name>`
      - §2 completes on a clean Windows host without throwing; `tillandsias-vm-uuid` survives in `cmdkey /list`
      - a negative control shows the new predicate is $false for a never-existing target; output pasted
      - the closing event names the unearned-green shape and its two sibling instances from that night
