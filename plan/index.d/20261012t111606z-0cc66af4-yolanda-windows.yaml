      summary: |
        Diagnosis recorded 2026-10-12 (PR #372). Items 3 and 4 are test-side on Windows. resource_lock::try_lock is a documented no-op off unix, and the paths it guards run only in the Linux guest: launch markers guard podman lanes, and on a Windows host VaultGitHubTokenStore::read_bundle returns None (no Vault container) before any token exchange. Both tests are ignored off unix by name. resource_lock::tests::try_lock_is_a_no_op_off_unix fails if Windows ever gets a real lock, and its message says to un-ignore them.
        RESIDUAL, for the record (not a defect today): resource_lock is per-host. The guest's lock dir and any Windows host process never share a lock file, so it never excluded a host process against a guest process, and was never designed to. If a Windows host binary ever gains a path that reaches the guest's Vault (and so a token exchange), host-vs-guest exclusion needs its own mechanism; a Windows try_lock would not provide it.
