    owned_files:
      - scripts/test-hook-phase-instrumentation.sh
    title: |
      test-hook-phase-instrumentation arm 4 ("the 1x-to-4x blind band is still open") fails every darwin ./build.sh --check run under `taskpolicy -b`: the injected `sleep 0.05` takes ~243ms at background QoS, past the fixed 120ms (4x of a 30ms budget) ceiling, so the phase warns
    context: |
      MEASURED on tlatoanis-macbook-air 2026-10-10/11, trunk 9aa15e028:
      - Two consecutive darwin gates (taskpolicy -b ./build.sh --check, 1h40m and 1h18m) both ended GATE_RC=1 on this arm alone: "FAIL: a phase between 1x and 4x now warns".
      - Plain `bash scripts/test-hook-phase-instrumentation.sh`: 6/6 pass (3 of 3 earlier, 5 of 5 now).
      - Beside a CPU hog (20 x `yes` on 10 cores): 5 of 5 pass. NOT load.
      - `taskpolicy -b bash scripts/test-hook-phase-instrumentation.sh`: 5 of 5 FAIL. Deterministic.
      - Wall time of `sleep 0.05`: 64ms normal, 243ms under taskpolicy -b (timer coalescing at background QoS).
      - No sleep/wake in the gate windows (pmset log); no parallel build of mine.
      The arm (scripts/test-hook-phase-instrumentation.sh:94-110) widens the injected phase's budget from 1ms to 30ms and assumes sleep 0.05 lands in 30-120ms. The margin is 70ms of scheduler slack. Fleet builds on macOS run under taskpolicy -b by standing instruction, so no Mac gate can go green and earn a stamp (blocks 1276-mugq's live verify).
    exit_criteria:
      - '`taskpolicy -b bash scripts/test-hook-phase-instrumentation.sh` passes on darwin (pre-fix: 5 of 5 FAIL on arm 4)'
      - 'plain runs still pass, and arm 4 still FAILS if the hook warning threshold is lowered to 1x (the band-closed mutation it exists to catch)'
    unscoreable: "unpinnable-until-the-guard-exists: the arm is itself the pin and build.sh --check runs it on every host"
    depends_on: []
    next_action: >
      Calibrate arm 4 against the phase's MEASURED duration instead of a fixed budget: read the elapsed ms from arm 3's warning (or a baseline run), then set the budget to about half of it so the phase sits at ~2x, mid-band, whatever the scheduler does. Keep the band-closed mutation red.
