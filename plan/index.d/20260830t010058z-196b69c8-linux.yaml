        FALSIFICATION RUN on yoga, prediction written before the run. Setup: fresh container with OLLAMA_NUM_PARALLEL=2 confirmed in its own startup log, fresh expert-serve, qwen2.5:7b verified resident, four sequential identical requests at default budget. RESULT: 67454 / 124266 / 12957 / 88161 ms, against the num_parallel=1 baseline for the same query and cell of 13879 / 14397 / 124292 ms. SCORED: (a) 'the ~123s leak remains' HELD — 124266 vs 124292, 26 ms apart on a two-minute wall, so the detached blocking task runs to the 120s socket timeout at pipeline.rs:87 REGARDLESS of runner concurrency; the leak is a property of the dispatch, not of the inference server's queueing. (b) 'the alternation disappears' held in form but the predicted consequence was WRONG — I expected the next request to go fast once unqueued; instead the bimodal shape dissolved into a continuous spread. At num_parallel=1 wall times are binary (free, or wait out the whole leak); at 2 they are 13/67/88/124. CORRECTED MECHANISM: the second slot does not free the next request, it lets it run CONCURRENTLY WITH the abandoned generation, so both compete for the same 12 cores — the queue became contention because nothing stops the leaked work. The runner slot explains the SHAPE at parallelism 1; the leaked generation explains the COST at any parallelism. CONSEQUENCE FOR THE FIX: raising OLLAMA_NUM_PARALLEL is NOT a mitigation, which matters because it is the cheap one-env-var change someone reaches for on seeing requests queue. RECOMMENDED EXIT CRITERION: the post-fix verification must include a num_parallel=2 arm — a cancellation fix that works at 1 and leaves abandoned work running at 2 would pass a single-slot re-run and still be broken. NOT CLAIMED: four rows is four rows; the runner and the tokio blocking pool were not instrumented, and the pool stays unexcluded though 512 default threads makes it an unlikely binding constraint. Container restored to the fleet default (num_parallel=1, passthrough