      summary: |
        OPERATOR RULING — TIER 2 IS OUT OF SCOPE, permanently, not deferred.

        Verbatim: "only rename user facing, not code. Code doesn't need to adhere to dictionary, as long as its consistent within itself."

        Effect on this packet:
          * The dictionary governs USER-VISIBLE TEXT ONLY. Rust identifiers (GithubLoginState, GithubLoginStatusRequest, GithubLoginStatusReply) and the kind() diagnostic strings they produce are EXEMPT and stay as they are. No wire-adjacent rename.
          * The tier-2 exit criterion ("present the rename cost and let the operator decide") is CLOSED by this ruling — the decision is made. Do not re-raise it.
          * Code identifiers carry a WEAKER obligation the ruling does state: internal self-consistency. `Github*` spelled one way across the codebase is compliant; a codebase mixing `Github*` and `GitHub*` identifiers is not. If enforcing that is cheap it belongs here; if it needs its own machinery it should be filed separately rather than inflating this packet.
          * The gate MUST therefore distinguish user-visible strings from identifiers and from log/diagnostic text. A dictionary check that fires on `GithubLoginState` is wrong by this ruling and will be disabled by whoever it annoys first.
  - packet_id: tray-shared-string-resource-layer
