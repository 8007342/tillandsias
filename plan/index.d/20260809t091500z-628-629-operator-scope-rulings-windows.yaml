        OPERATOR SCOPE CORRECTION — the purpose is PARITY, not translation. This significantly de-scopes the packet.

        Verbatim: "we added i18n at first, but the UX is quite minimalistic, and we meant to keep it as minimalistic as possible, so i18n fell out of maintenance quickly. We might not need i18n as such, but the strings mechanism will ensure 1:1 parity amongst platforms."

        Effect:
          * The 14 stale locales (143 keys vs en's 168) are NOT a gap to close. Do not treat filling them as work. The corpus fell out of maintenance deliberately-ish, because the UX is intentionally minimal.
          * Whether the 17 locale files survive at all is now an open design question this packet should answer, not assume. A single `en` table is sufficient for the parity mechanism the operator actually wants. Keeping 17 unmaintained files that nothing validates is arguably worse than keeping one — but deleting translated work (es/de are genuinely translated) is a call to surface, not to make silently.
          * The exit criterion about language selection being "wired or explicitly deferred" resolves to DEFERRED by this ruling; i18n is not the goal.
          * The missing-key fallback criterion SURVIVES and matters more, not less: if the corpus shrinks to en, fallback behaviour and a loud build-time failure on an absent key are the whole safety net.
          * MINIMALISM IS A CONSTRAINT ON THIS PACKET, not just context. A string layer that makes adding a UX string more ceremonious pushes against the operator's stated intent. Keep the mechanism small.
  - packet_id: tray-string-parity-gate
    event:
      type: note
      ts: "2026-08-09T09:15:00Z"
      agent_id: windows-claude-fable-metaorch-20260809t063000z
      host: windows
      summary: |
        OPERATOR REQUIREMENT — a sharper, falsifiable gate than this packet was filed with. Adopt it as the packet's core criterion.

        Verbatim: "introducing a feature with a string on any platform will require all others to consume it as well :) and we should be able to make sure each string is used the same number of times on each platform, at compile/build time."

        This is stronger and cheaper to check than "no divergent per-platform text", and it is the mechanism that makes 1:1 parity STRUCTURAL rather than reviewed:
          * For every string key, count its USE SITES per platform.
          * The counts must be EQUAL across linux / macos / windows.
          * A key introduced on one platform therefore fails the build until every other platform consumes it — parity by construction, no matrix row to remember to add.
          * Enforced at COMPILE/BUILD time, not by a separate audit that can be skipped.

        Note what this subsumes: it makes the parity question independent of the capability matrix, because a NEW string cannot land alone. It substantially overlaps 628-r2vk (new-surface gate) — whoever claims either should read both and consider whether the usage-count gate replaces the matrix-row gate outright for string-bearing surfaces.

        Design cautions to resolve rather than discover:
          * Equal COUNTS is not equal SEMANTICS — two platforms can each use a key twice in different places. Counts are a strong, cheap invariant, not a proof; say so rather than overclaiming.
          * Legitimate asymmetries exist and need an explicit, reviewable escape hatch: platform-only surfaces (a Windows balloon with no macOS analogue), or one platform rendering a string in two places by necessity. An escape hatch that is easy to abuse defeats the gate; one that does not exist gets the gate deleted. Design it deliberately.
          * The count must be computed from the SOURCE, at build time, on every host (ruby-free, order 261) — including hosts that cannot compile the other platforms' cfg-gated code. That is the hard part: crates/tillandsias-windows-tray is cfg(target_os="windows") and is NOT compiled on Linux (see packet cfg-gated-tray-code-never-typechecked-2026-07-21), so a compile-time count on one host cannot see the others' real code paths. Solve that explicitly — a source-scan rather than a type-level count is the likely answer.
