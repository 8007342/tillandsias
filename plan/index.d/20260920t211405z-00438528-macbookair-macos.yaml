      THE MECHANISM, because the packet's original one is wrong and the wrong one is seductive: it is SELINUX LABELLING, not ownership. A container running as ROOT is denied one level into the share while guest-root succeeds at any depth; chmod 0777 does not help; chown returns 0 and does not apply. A uid that IS 0 cannot be denied by DAC. Do not chase ownership, and do not reach for :z/:Z — both were measured and both FAIL, and :Z stamps an MCS category onto the SHARED directory that outlives the container and denies every later one.

