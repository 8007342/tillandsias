      WHAT IS LEFT IS ONE CODE CHANGE AND ITS GUARD.
        1. headless must LAUNCH the forwarder for the host-native tier. Today nothing does; the demonstration used a hand-run container. Shape that worked, verbatim:
             podman run -d --name tillandsias-vsock-forwarder \
               --network tillandsias-enclave --network-alias inference \
               --cap-drop=ALL --security-opt=no-new-privileges --security-opt seccomp=<derived> \
