      THE FIXTURE, and what it must not be. An --exec-guest test CANNOT reach a passing state here: --exec-guest pumps no CFRunLoop, so guest connects sit queued past the kernel's 2s timeout and are delivered in a burst after the command returns. A fixture built that way would red forever against working code and be "fixed" by widening a timeout, which cannot work because the timeout is the kernel's. The shape that DOES work, used for both proofs on this row: a boot-triggered systemd oneshot in the guest, enabled beforehand through --exec-guest, reporting through the MODEL-CACHE VIRTIOFS SHARE — a side channel the tray does not own — while the tray runs normally and pumps. ASSERT THE CLIENT CONTAINER SEES THE HOST'S BODY, not that the forwarder started: a forwarder that starts and answers nothing is exactly the silent-success shape this milestone exists to remove. And do not report through the model cache in a permanent fixture — a dotfile there trips test-macos-model-share-writable.sh's empty-cache precondition, which is how I found that caveat.

