      summary: |
        SECOND INSTANCE OF THE SAME ROW MIS-ROUTING, and it is the same row as INSTANCE
        ONE. Measured on macneo 2026-09-23, during a scheduled slot.

        The batch selector's top pick for macos was 1084-x8ya, exactly as on 2026-09-22.
        Its next_action still advertised part (b) / criterion 4 — "Zero tests exercise
        `activating` today (grep count 0 in diagnose.rs)" — as work remaining.

        THAT WORK LANDED ON 2026-09-15, eight days before the first mis-route and nine
        before this one:
          crates/tillandsias-macos-tray/src/diagnose.rs:2618-2637
          42ce602a4  fix(1084-x8ya): pin criterion 4 — a guest still coming up is not a failure
          an ancestor of origin/linux-next; the test passes today
          (cargo test -p tillandsias-macos-tray --bins a_guest_still_coming_up ->
           1 passed, 138 filtered out)
        The measurement the stale text quotes is refuted by the very commit that fixed
        it: `activating` now appears 8 times in that file, all inside the test.

        WHY THE FIRST CORRECTION DID NOT PREVENT THE SECOND. On 2026-09-22 I DECLINED
        the row and recorded WHY on this packet — but I did not rewrite 1084-x8ya's
        next_action. A decline recorded on the row ABOUT the defect leaves the defective
        field in place, so the router reads the same stale text and hands out the same
        dead work to the next host. The observation and the remedy are different writes,
        and only the second one stops the bleeding. I have now rewritten it.

        THE GENERAL SHAPE, sharper than instance one could state it: a next_action is
        the ONLY field the router reads as an instruction, and nothing verifies it
        against the tree. A closure has a gate (650-dq6u demands a SHA and a named
        check); a status has a ladder; next_action has neither. So it is the one field
        that can assert a false thing about the repository indefinitely, and the cost
        falls on whoever the selector sends next — which is why both instances landed on
        the same host, the one whose role matches.

        CHEAP MITIGATION, offered rather than claimed: when a next_action names a
        MEASURABLE precondition — "zero tests exercise X", "no call site exists", "the
        file is absent" — that sentence is checkable by grep, and a checker could
        re-evaluate it and flag rows whose stated premise no longer holds. Not written;
        I have not measured how many rows carry a checkable premise, and a guard that
        fires on prose would be worse than none.
