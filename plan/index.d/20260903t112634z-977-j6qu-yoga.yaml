      summary: |
        RUNG 3 LANDED. There is now ONE ranking function: local-ci.sh calls
        `tillandsias-plan score-checks`, which runs
        obligation::centicolon_function over a SpecState. The shell no longer
        computes a score of its own.

        A CORRECTION TO THE PACKET'S OWN FRAMING, which I could only make by
        reading the code rather than the filing. It says local-ci.sh computes "a
        weighted checklist" against the methodology's "bounded ranking function
        with a separately reported denominator and residual". But local-ci.sh
        ALREADY reported earned / total / residual separately — that half it got
        right, and the packet undersold it. What was genuinely missing was the
        LATTICE: each check was binary, so there was nowhere for an obligation
        state to live and nowhere for the methodology's monotone-regime
        qualifier to be expressed.

        THE NUMBERS ARE UNCHANGED TODAY, DELIBERATELY, and that is the evidence
        the wiring is faithful rather than a redefinition. A passing check
        establishes PositivelyTested; each weight is earned at exactly that bar;
        the model reproduces what the loop computed. Verified end to end —
        `scripts/local-ci.sh --phase runtime` wrote
        expected_total_cc=140 actual_earned_cc=140 residual_cc=0 percent_closed=100
        through the model path.

        AND THE HONEST PART OF THAT CHOICE: a green check witnesses that a test
        passed. It says nothing about RuntimeObserved or EvidenceBundled, and
        scoring it as though it did would be the model agreeing with whatever the
        shell already believed. `Weights` therefore carries an `earned_at` bar
        per obligation instead of assuming the top of the chain, so a richer
        evidence source can be added later without silently redefining what
        percent_closed means.

        THE REGIME IS REPORTED, NOT IMPLIED. math-foundations.yaml:37-42
        qualifies centicolon_function as monotone ONLY for transitions that
        preserve obligation IDs and change no denominator scope. A bare integer
        cannot say which side of that line it is on, so `Score` carries a
        `Regime` — and a tombstone, which removes an obligation from BOTH the
        numerator and the denominator, returns Broken with the reason named.
        local-ci prints `note:local-ci:centicolon-regime:…` when the score is not
        comparable with the previous run.

        TOMBSTONES LEAVE BOTH HALVES, which is the decision rung 1 forced.
        Dropping one from the numerator alone would make an identity change look
        like lost ground (the 977-56fd defect one layer up); leaving it in the
        denominator would make the project permanently unable to reach its own
        total.

        A MALFORMED INPUT LINE REFUSES rather than being skipped. Skipping would
        shrink the denominator and RAISE the percentage — the direction nobody
        audits.

        FAIL LOUD, NEVER FALL BACK — VERIFIED BY MUTATION, not asserted. Shadowed
        the binary with a stub whose score-checks exits 2, and local-ci printed
        `blocked:local-ci:scorer-refused (rc=2)` and stopped. A silent fallback to
        the local arithmetic would have restored two scorers with the second one
        invisible and reachable only on the unhappy path.

        THREE GATE FAILURES I CAUSED AND THE GATE CAUGHT, all correct: the
        capability manifest must be BYTE-sorted (my insert was locale-sorted and
        wrong); every declared capability must appear in USAGE; every dispatch
        arm must too. Worth recording because the first is invisible to `sort`
        under a non-C locale.

        AND ONE I CAUSED THAT NO GATE WOULD HAVE CAUGHT: I first placed the
        dispatch arm inside the `if args[0].starts_with("spec-")` block, so
        `score-checks` was declared, compiled, documented — and unreachable. The
        binary's own error said "unknown subcommand", which was true and pointed
        nowhere near the cause. Found by running it, which is the only thing that
        would have.

        SCOPE NOT CLAIMED: the obligation states here come from CI check results
        only. Nothing yet writes RuntimeObserved or EvidenceBundled, so those
        rungs of the chain are unexercised in production. That is rung 4/5
        territory and is not a gap in this wiring.
