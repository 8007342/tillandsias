    priority: p1
    kind: bug
    pickup_role: linux
    capability_tags:
      - podman
      - enclave
      - ci-gates
      - test-hermeticity
    estimated_hours: 3
    title: >
      Running ./build.sh --ci-full on a host with a live enclave stops the
      whole stack — vault SIGKILLed, proxy SIGTERMed, inference and nix-cache
      down — repeatedly and reproducibly within the run's first minutes.
    context: |
      MEASURED on macuahuitl 2026-08-25, twice, correlated to the minute:
        * 08:41:47Z — every enclave container receives SIGTERM (harmonia's own
          log shows the graceful shutdown), ~30-60s after a --ci-full launch.
        * 09:36:21-49Z — one to two minutes after the 878-79b5 acting arm had
          restarted the stack (healthy, 4/4 up at 09:35), proxy stops cleanly
          at 09:36:21, vault is SIGKILLed at 09:36:49, inference and
          nix-cache go down — again ~90s into a fresh --ci-full run.
      The kill signature matches the tray's SHARED-STACK TEARDOWN shape
      (lane-scoped inference removed; Core rows stopped), which in test code
      is exercised by remove_shared_stack_containers /
      cleanup_shared_stack_if_no_running_forge through a FakeBackend. The
      prime suspect is a cargo test (or a litmus in the quick tier) whose
      podman client escapes the fake and issues REAL stops — with a warm
      target/, rust-tests start early enough to match the timing. Attribution
      was time-boxed; podman events confirm the deaths but the actor needs
      the test-run correlation done properly.
      WHY IT MATTERS BEYOND ANNOYANCE: the 878-79b5 acting arm and the
      release gate now FIGHT each other — the arm restarts services, the next
      --ci-full kills them, and each restart burns the service's windowed
      restart cap (vault and proxy are at 2/3 on this host), after which the
      arm goes quiet with a flapping verdict and the stack stays down. A
      release-acceptance gate that de-provisions the machine it certifies is
      also certifying the wrong machine state.
    exit_criteria: |
      (1) The actor is identified with evidence (podman events correlated to
      the test/litmus timeline), not inferred. (2) The escape is closed so a
      full --ci-full on a host with a live stack leaves every enclave
      container untouched — proven by running it with the stack up and
      diffing podman ps before/after. (3) A guard makes the class
      structural: no test may reach a real podman backend unless it opts in
      by name (the FakeBackend seam becomes deny-by-default for the teardown
      family), with a mutation control. (4) The restart caps burned by this
      defect on affected hosts are noted so the flapping verdicts are not
      misread as service crashes.

