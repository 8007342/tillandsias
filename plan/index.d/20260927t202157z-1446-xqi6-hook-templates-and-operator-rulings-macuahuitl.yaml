    title: |
      HOOK TEMPLATES, INSTALLED ON DEMAND PER PROJECT (operator 2026-09-27): the plan binary embeds one Lua template per client event (pre-commit, post-commit, pre-push, post-merge, post-checkout) and per mirror event (pre-receive, post-receive); `tillandsias-plan discipline install-hooks` writes the ones the project's LEVEL needs into a repo-LOCAL hooksPath (never global, 1442-wyf9), each a bash-3.2 stub that execs the sandboxed lua CLI; a level-0 project gets ADVISORY hooks only and nothing refuses its push to main; `discipline raise --to <n>` bumps the seed forward-only and installs that level's hooks; every refusal any template emits carries `why:` and `remedy: this project at level <n> (<rule> <enforcement>) needs <requirement>; use /<skill> for instructions`, the skill name read from the seed's `skills:` map; a forge runs install-hooks for every checked-out project so the wiring is the desired state there
    context: |
      OPERATOR RULING 7 (2026-09-27), verbatim: "Fresh new projects opened
      in a tillandsias forge should be allowed to push to main by default.
      As projects grow and their own gates rise they should be able to
      install the hooks on demand, per project, these hooks should then
      trigger on the push through the git-mirror, at their relevant events
      (pre/post - commit/push/pull/etc) and return not only the ERRORS but
      the AFFORDANCES: 'this project at this state needs work in X format,
      use /<skill> for instructions'. This automatic wiring should be the
      desired state on any project checked out on a forge. Our CURRENT
      STATE is already requiring certain enforcements but what our skills
      and HOOK TEMPLATES should provide is the affordances on how to work
      with them ONCE ENABLED."
      EVENTS SPLIT BY WHERE THEY HAPPEN: commit and pull events are
      client-side (pre-commit, post-commit, post-merge, post-checkout); push
      events are the mirror's (pre-receive, post-receive — 1446-87cy runs
      the mirror half). The client pre-push is the EARLY copy of the
      mirror's pre-receive so a refusal costs seconds, not a relay.
      LEVEL → HOOK SET (the seed's level chooses, forward-only): level 0
      installs post-commit and post-merge ADVISORY hooks that only ever
      print an affordance when a qualifier appears ("two committer
      identities seen; use /project-discipline for how to raise to level
      1"), and a pre-push that never refuses; level 1 adds a pre-push that
      refuses the default branch at the seed's enforcement and names the
      integration branch; level 2 adds the work-ref grammar and the plan-only
      lane checks. Tillandsias's own scripts/hooks/* are its level-2 project
      hooks and stay; this row does not rewrite them, it makes the SHAPE
      installable elsewhere.
      TEMPLATES ARE EMBEDDED IN THE BINARY (include_str!) so a forge with the
      plan binary can install them for a project that has no checkout of
      Tillandsias; the project's own overrides live in .tillandsias/hooks/
      <event>.lua and win over the embedded default.
      THE AFFORDANCE FORMAT is the operator's sentence, with the skill from
      the seed's `skills:` map (defaults: project-discipline for level
      questions, join-the-fleet for landing, advance-work-from-plan for
      work refs) — 1446-qkx4 ships the generic skill.
    exit_criteria:
      - 'in a scratch project with NO seed, `tillandsias-plan discipline install-hooks` prints ok:discipline:hooks-installed:level=0:<n> hooks, sets a repo-LOCAL core.hooksPath (refuses with the 1442-wyf9 token when a global one is set), and a subsequent push to refs/heads/main through those hooks is NOT refused and prints no warning (pre-fix: FAILS — no verb; scripts/install-hooks.sh installs the Tillandsias gate and pre-push-main-branch-affordance blocks main)'
