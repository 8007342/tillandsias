  - packet_id: the-enclave-git-mirror-dispatches-the-projects-own-mirror-side-hook-templates-per-event-at-pre-receive-and-post-receive-through-the-plan-binary-in-the-git-image-and-relays-their-refusal-with-its-affordance-to-the-pushing-client
