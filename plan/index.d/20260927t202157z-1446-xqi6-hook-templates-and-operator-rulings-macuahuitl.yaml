    owned_files:
      - crates/tillandsias-plan/src/branch_discipline.rs
      - crates/tillandsias-plan/src/main.rs
      - scripts/test-discipline-derive.sh
    title: |
      DERIVE THE DISCIPLINE, CHECK IT AGAINST REALITY (operator 2026-09-27: "We should try to derive the discipline but check against reality"): `tillandsias-plan discipline derive [--json]` observes the project — the remote's HEAD branch, which `*-next`/integration branches exist on origin, how many distinct committer hosts the last N commits carry (agent trailers, then author), whether work/<id> refs exist on origin, whether pull-request merges appear on the default branch, which hooks are installed locally — and prints derived=<level> beside seed=<level>; `check-ref` and every consumer then REFUSE only where the seed says enforced AND the observed qualifier is present, degrade to warn with a drift affordance otherwise, and never refuse a project whose observed facts are level 0
    context: |
      NEITHER SIDE IS BLINDLY AUTHORITATIVE. A seed higher than reality is a
      project opting in early: allowed, but its enforced rules run at WARN
      until the qualifier is observed, and the warning says which qualifier
      is missing. A seed lower than reality is a project that has outgrown
      its declaration: nothing is refused on the seed's behalf, and the
      affordance names `discipline raise --to <derived>` with /project-
      discipline. This is the operator's 2026-09-22 constraint made
      checkable: anyone with enough work to have triggered a level already
      has the environment to work under it, because the qualifier IS the
      environment.
      QUALIFIERS (all observable from the checkout plus one ls-remote):
      level 1 — an integration branch exists on origin that is not the
      default branch, OR merges of pull requests appear on the default
      branch; level 2 — two or more distinct committer hosts in the last
      N=50 commits AND at least one work/<id> ref on origin. The published
      discipline ref (1443-uit6) carries derived beside seed so the mirror
      and the forge agree on both numbers.
    exit_criteria:
      - 'in a scratch project with one committer, no integration branch and no seed, `discipline derive` prints derived=0 seed=none effective=0 and `check-ref refs/heads/main` prints ok:discipline:default-branch:level=0 (pre-fix: FAILS — no derive verb; the seed alone decides)'
      - 'in a scratch project whose seed says level 2 (default_branch enforced) but whose origin has no integration branch and one committer, `check-ref refs/heads/main` prints warn:discipline:default-branch-protected:seed-ahead-of-reality with a remedy naming the missing qualifier, and does NOT refuse (pre-fix: FAILS — the seed refuses)'
      - 'in a scratch project with no seed whose origin carries linux-next, work/1446-664f and commits from two hosts, `derive` prints derived=2 seed=none and the affordance `discipline raise --to 2; use /project-discipline for instructions`, and nothing is refused (pre-fix: FAILS)'
      - 'in this repository, `derive` prints derived=2 seed=2 effective=2 and `check-ref refs/heads/main` stays refused:discipline:default-branch-protected:enforced — Tillandsias is the high-enforcement example and its behaviour does not change (pre-fix: FAILS — no derive output)'
      - '`derive --json` names each qualifier with its observed value and the command that observed it, so a reader can re-run the observation (pre-fix: FAILS)'
    verifiable_closure: |
      bash scripts/test-discipline-derive.sh
      exits 0 with the five arms against scratch projects with scratch
      origins. Pre-fix: FAILS at arm 1.
    next_action: >
      Add derive (observations + qualifier table) to branch_discipline.rs,
      thread the effective level into check_ref, add the seed-ahead-of-
      reality degradation, write the fixture.
    notes: |
      size: M
      implementer_tier: opus
      It decides when a refusal is allowed to fire; a wrong qualifier
