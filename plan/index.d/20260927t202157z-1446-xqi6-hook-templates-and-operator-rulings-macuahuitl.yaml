      - 'a level-0 project whose last twenty commits carry two distinct committer identities prints, from the post-commit template, advised:hook:post-commit:multiple-committers with the raise affordance, and refuses nothing (pre-fix: FAILS)'
      - 'a project override .tillandsias/hooks/pre-push.lua is executed instead of the embedded template, proven by a marker line it prints (pre-fix: FAILS)'
      - 'every installed stub is under sixty lines, passes scripts/check-bash-dialect.sh, and with TILLANDSIAS_PLAN_BIN pointing at a non-runnable file prints blocked:hook:<event>:no-plan-binary and exits 1 — never falls back to shell logic (pre-fix: FAILS)'
      - 'images/default/lib-common.sh runs `discipline install-hooks` for a checked-out project that is NOT a Tillandsias checkout (today ensure_forge_project_guard_hooks skips it: "guards skipped (no scripts/install-hooks.sh — not a Tillandsias checkout)"), and the lifecycle trace records the level installed (pre-fix: FAILS)'
      - 'NEGATIVE CONTROL: running install-hooks twice is a no-op the second time (idempotent) and Tillandsias''s own checkout keeps its scripts/hooks/* gate untouched'
    verifiable_closure: |
      bash scripts/test-discipline-install-hooks.sh
      exits 0 with the seven arms against scratch projects. Pre-fix: FAILS
      at arm 1 (`tillandsias-plan capabilities` lists no install-hooks).
