  - packet_id: tillandsias-plan-discipline-derive-observes-the-projects-real-branching-facts-remote-head-integration-branches-committer-hosts-work-refs-installed-hooks-and-compares-them-to-the-seed-so-a-rule-refuses-only-where-seed-and-reality-agree-and-drift-is-reported-with-an-affordance
    order: 1446-664f
    status: ready
    kind: enhancement
    priority: p1
