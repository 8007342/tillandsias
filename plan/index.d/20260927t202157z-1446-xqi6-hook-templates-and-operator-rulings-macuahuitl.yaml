      - images/git/pre-receive-hook.sh
      - images/git/post-receive-hook.sh
      - images/git/dispatch-project-hooks.sh
      - scripts/test-mirror-hook-dispatch.sh
    title: |
      THE MIRROR TRIGGERS THE PROJECT'S HOOKS AT PUSH EVENTS: images/git/pre-receive-hook.sh and post-receive-hook.sh call dispatch-project-hooks.sh, which reads .tillandsias/hooks/mirror-pre-receive.lua and mirror-post-receive.lua from the tree of the ref being updated (the embedded template for the project's level when absent), runs each through the plan binary now shipped in the git image, sandboxed (Observing, fs rooted at a scratch export of that tree, deadline 60 s, no network), and relays a refusal to the client as the rejection message WITH its `why:` and `remedy: … use /<skill> for instructions` lines — so the affordance arrives on the push, where the operator asked for it
    context: |
      Ruling 7: hooks "should then trigger on the push through the
      git-mirror, at their relevant events". Today the mirror's hooks are
      two static scripts copied into every /srv/git/<project>/hooks at
      startup (entrypoint.sh) and carry no project logic. This row makes
      the mirror a DISPATCHER: the project's own mirror-side templates run
      in the git container, which therefore gains the plan binary (the
      static musl build already exists; the Containerfile copies it).
      What runs at pre-receive must be bounded and read-only over the
      pushed tree: the sandbox is the Observing environment with fs rooted
      at a `git archive` export of the ref in a scratch dir, proc.run
      restricted by the command policy to git read-only verbs, and a 60 s
      deadline whose expiry REJECTS the push naming the hook (a hook that
      hangs must not hold the relay). Post-receive hooks run after the
      relay has succeeded and can only log or publish under refs/
      tillandsias/<project-hook>/*.
      The upstream relay ORDER is unchanged: dispatch pre-receive hooks,
      then the seed-level refusals (1443-uit6), then tillandsias-relay-refs.
    exit_criteria:
      - 'a push whose tree holds a .tillandsias/hooks/mirror-pre-receive.lua that returns refused with a remedy is rejected, and the client sees the verdict, the why: line and the remedy line naming /<skill> in the push output (pre-fix: FAILS — no dispatcher; the hook is not run)'
      - 'a push to a level-0 project with no templates is accepted and relayed, with nothing extra printed (the absolute floor at the mirror) (pre-fix: FAILS — no dispatcher; identical acceptance but nothing proves the dispatcher did not run)'
      - 'a mirror-pre-receive.lua that sleeps past 60 s causes the push to be rejected with refused:mirror-hook:timed_out:<hook> and the relay is not invoked (pre-fix: FAILS)'
      - 'a mirror-pre-receive.lua that attempts fs.write outside its scratch export or proc.run of `git push` is refused by the policy engine and the push is rejected naming the rule (pre-fix: FAILS)'
      - 'the git image carries a runnable tillandsias-plan (`podman run --rm <image> tillandsias-plan capabilities` lists `lua`), and a filed event shows a forge push exercising a project template end to end (pre-fix: FAILS — the image has no plan binary)'
      - 'NEGATIVE CONTROL: the existing relay fixture and the 1443-uit6 discipline fixture stay green through the dispatcher'
    verifiable_closure: |
      bash scripts/test-mirror-hook-dispatch.sh
      exits 0 against a scratch bare mirror with the hook scripts and a
      plan binary installed. Pre-fix: FAILS at arm 1.
    next_action: >
      Ship the plan binary in images/git/Containerfile, write the
      dispatcher with its sandbox and deadline, call it from both receive
      hooks, write the fixture.
    notes: |
      size: L
      implementer_tier: opus
      Project-authored code runs inside the enclave's git container on
      every push; the sandbox, the policy and the deadline are the whole
      safety argument.
