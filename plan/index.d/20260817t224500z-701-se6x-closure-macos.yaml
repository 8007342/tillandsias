      summary: >
        CRITERION 2 DISCHARGED — the last one open — so the packet is complete.
        Criteria 1, 3 and 4 landed 2026-08-12; the residual was "a failed
        fallback write is surfaced rather than discarded". Both writes in
        write_vm_credential_fallbacks were `let _ = fs::write(...)`, which is a
        CREDENTIAL-DESTROYING silence rather than a cosmetic one: the share file
        is the only evidence inside the guest that operator init completed (the
        predicate consults an OS keychain the guest does not have, then this
        file), so one failed 30-byte write — ENOSPC, a non-writable cache dir, a
        write lost to an unclean VM stop — leaves the predicate false with a
        healthy Vault on disk and the NEXT launch wipes it, taking the stored
        GitHub token with it. 694-mhz8 removed the PERMANENT failure; it did not
        make the remaining single point of evidence robust or loud.
        CHANGED: the helper now returns io::Result<()> naming every artifact
        that failed, and BOTH writes are always ATTEMPTED — a token failure must
        never skip the share, because the share is the half that arms the wipe.
        Both call sites report through one shared reporter
        (report_fallback_write_failure) so they cannot drift into reporting it
        differently, which is exactly how the original asymmetry between these
        two sites arose. FOUND AND FIXED WHILE THERE: the `Err` arm of
        init_cache_dir() was silent at both sites too — same consequence, since
        no cache dir means no share file either — so that arm now reports as
        well. The message names the consequence and the remedy, not just the
        errno, because the operator's decision (free space / fix permissions
        BEFORE relaunching) is time-critical: relaunching is what triggers the
        wipe.
        THREE TESTS, AND THE THIRD EARNED ITS PLACE UNDER FALSIFICATION.
        (a) a_failed_share_fallback_write_is_reported_not_discarded — induces
        the failure portably by occupying the destination with a DIRECTORY
        (fs::write cannot clobber one on any platform) rather than by chmod,
        which root ignores and which differs across the fleet's three host
        kinds. (b) a_successful_fallback_write_reports_success — the NEGATIVE
        CONTROL: without it, a helper returning Err unconditionally would
        satisfy (a) while firing the alarm on every healthy boot, and an alarm
        that is always on is one nobody reads. (c)
        a_failed_token_write_still_attempts_the_share — the ordering property.
        FALSIFIABILITY VERIFIED AGAINST TWO DISTINCT BREACH SHAPES, not one:
        restoring the swallow (`let _ = failures; Ok(())`) fails (a) and (c)
        while (b) correctly still passes; and the OBVIOUS refactor — early
        return on the token write with `?` — PASSES (a) and (b) and fails only
        (c). That second shape is the one a future reader would most plausibly
        introduce, and without test (c) it would silently reintroduce the bug
        for exactly the host whose disk is already misbehaving. 50 vault
        _bootstrap tests green after restore, 0 failed.
