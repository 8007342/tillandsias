      summary: |
        MY FIXTURE RED A SIBLING HOST'S GATE, and the lesson it repeated was already in
        this tree, filed the previous day, by the host it blocked.

        WHAT HAPPENED. yolanda's windows-next gate failed 10/11 on
        test-no-competing-gate.sh arm 9 ("an unreadable process suspends the
        accusation"): wanted rc=3 and a suspension, got rc=0 and an accusation naming
        two pids. They attributed it before reporting — `git diff --name-only
        origin/linux-next...HEAD` over the relevant paths returned nothing, so it
        arrived on their trunk merge — and they declined to route around it or take a
        skip, which was the right call.

        THE CAUSE IS MINE AND IT IS NOT A WSL FINDING. Arm 9 built its "unreadable"
        process with `chmod 000`, which assumes chmod denies the READER. Root has
        DAC_OVERRIDE and a WSL distro runs as root by default. Measured here under
        `podman unshare`:
            uid 0     [ -r <chmod-000> ]  -> TRUE
            uid 1000  [ -r <chmod-000> ]  -> FALSE
        So the file was readable there, its token was read, its group looked headless,
        and the classifier accused — correctly, for the tree the fixture actually built.
        The fixture did not build the tree it claimed to.

        FIXED BY STRUCTURE RATHER THAN BY UID. The entry is now a DANGLING SYMLINK:
        nothing to read rather than permission to deny, so `[ -r ]` is FALSE for uid 0
        and uid 1000 alike. Verified 11/11 as uid 1000 AND under `podman unshare` as
        uid 0 — the configuration that failed. Mutation-verified with the diff proven
        non-empty first: removing the opaque suspension still reds arm 9 (10/11), so the
        arm kept its teeth rather than being made to pass.

        THE PART WORTH MORE THAN THE FIX. This tree ALREADY KNEW. 
        scripts/test-spec-index-durable-tier-demotion.sh carries the same lesson under
        order 1129-3yv7, in its own words — "chmod 000 does not constrain euid 0: root
        traverses the denied parent" — measured on yolanda 2026-09-12, the day before I
        wrote arm 9, and reported by the same host my arm then blocked. I wrote a
        chmod-based unreadability arm without asking whether the tree had a precedent
        for that construct. The lesson was one grep away and I did not run it.

        AND A SMALL IMPROVEMENT TO OFFER BACK to 1129-3yv7 rather than only take from
        it: that fixture's remedy is to SKIP as root, so its two arms assert nothing on
        every root host — which on this fleet means every WSL host, permanently. The
        dangling-symlink construction needs no skip and keeps the teeth everywhere. Not
        my file; offered as a note on that row.

        REGIME, TWICE. This is the second time this fixture claimed a regime it did not
        have — the first was inheriting TOOLBOX_PATH from the gate's own container, which
        red my own land. Both times the header said "hermetic" and the arms depended on
        something about the host: an env var, then a uid.
