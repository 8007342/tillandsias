      summary: |
        Axis corrected before landing (yolanda, measured full matrix on one drvfs
        path): Git for Windows cannot index a dangling symlink anywhere — MSYS
        emulates symlinks by copying the target, and a missing target leaves nothing
        to copy (rc 128, open("dangling"): Function not implemented) — and cannot
        create one either; WSL git on the same drvfs path creates and stages it
        (rc 0). The skip is therefore a Git-for-Windows property, reachable on a
        Windows checkout only when a non-MSYS tool created the path (yolanda's real
        state: a WSL probe whose cd failed). Written as a drvfs property the row
        would have sent a reproducer to WSL, where it does not occur, to conclude
        the skip is dead code. The test-only seam is the only portable construction.
