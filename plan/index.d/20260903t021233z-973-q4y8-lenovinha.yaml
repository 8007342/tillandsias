        summary: |
          Filed and closed in one cycle because macuahuitl diagnosed it with
          measured evidence and deliberately stopped at the design call,
          handing it back rather than guessing. The diagnosis was the expensive
          half; the decision took one measurement.

          Their reason for stopping is worth keeping: steps 4, 5 and 6 already
          verify the BEHAVIOUR, and the declaration step was the only one
          asserting the LABEL — so whether to re-express it or drop it as
          redundant is the same boundary question as declining to turn this
          fixture into a call-site audit, not a mechanical repair.
