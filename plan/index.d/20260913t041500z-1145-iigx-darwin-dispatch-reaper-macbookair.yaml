    title: |
      the dispatch reaper is unsupported on macOS and cannot be ported as written — /proc/<pid>/environ has no darwin equivalent because macOS refuses to expose another process's environment without entitlements, so the token must stop being an environment marker
    context: |
      SPLIT FROM 1141-vf9w by macbookair 2026-09-13, at the coordinator's
      instruction, after the parent's fixture reddened trunk on every macOS
      host. The land that accompanies this row makes the failure HONEST (a
      named skip, a named `unsupported:` return, a trap that says termination
      did not propagate). IT DOES NOT MAKE DARWIN WORK. This packet is that
      work, and it is left unclaimed for yoga as the parent's author.

      WHY THE OBVIOUS PORT DOES NOT EXIST. `tillandsias_marked_pids` reads
      `/proc/<pid>/environ` to find processes carrying
      `TILLANDSIAS_WRAPPER_TOKEN`. macOS has no /proc at all, and — this is the
      part that matters — it has no substitute either: darwin deliberately
      refuses to expose another process's environment block to an unprivileged
      caller, so there is no `ps`-flag or sysctl port of this design. The
      environment marker is not a portable mechanism that happens to be spelled
      in Linux; it is a mechanism only Linux has. A token FILE (the dispatch
      writes its pid under a per-token path) or a PROCESS GROUP (dispatch in
      its own pgid, signal the group) are the two shapes that can work on both,
      and choosing between them is this packet's first decision.

      THE PARENT'S OWN FRAMING, recorded verbatim at the author's request
      because it is the sharpest statement of the class and should not be
      paraphrased into something softer: the header stated the requirement —
      "a no-op that says so" — and the code four lines below returned 0 on an
      empty list. That is the same class yoga had corrected in
      check-cheatsheet-tiers.sh two hours earlier. A file can state its own
      invariant correctly in prose and violate it immediately underneath,
      because the prose is written while thinking about the requirement and the
      code while thinking about the happy path.

      THREE STATES, NOT TWO, and this is a requirement on the design rather
      than a nicety. Measured by yoga on their own host: ONE live dispatch,
      SEVEN idle conmon-only processes, and ONE FALSE STRAY. A reaper that
      sorts the world into "mine" and "not mine" mislabels the middle class,
      and the false stray is the expensive direction — killing a legitimate
      concurrent gate is strictly worse than leaving an orphan, which is the
      argument arm 3 of the existing fixture already makes about argv matching.
      The darwin mechanism must distinguish:
        live               — a dispatch of THIS token, still doing work
        idle conmon-only   — container plumbing with no live payload behind it
        stray              — a survivor of a cancelled dispatch, the only class
                             that should be signalled
      and the fixture must gain an arm per class, each red on a mechanism that
      collapses them.

      ONE DARWIN TERMINATION-PROPAGATION FAMILY, noted by macneo, who confirmed
      the trunk red independently on the second macOS host. The keychain orphan
      they traced has the same shape: `_ccc_timeout` kills `gh`, and the
      `security` child survives it and goes on holding a GUI dialog with PPID 1.
      Both are "a bounded parent dies and its descendants do not", on a platform
      whose process-group and signal behaviour the fleet's Linux-authored
      wrappers assume rather than check. Whoever takes this should read that
      trace first; a mechanism that fixes one may fix both, and a mechanism that
      fixes only the dispatch case should say why.

      MEASURED, so the next reader does not re-derive it (tlatoanis-macbook-air,
      Apple M5, macOS 25.6.0, trunk c6d191d39 in a pristine worktree):
        /proc     absent; `ls -d /proc` -> No such file or directory, and the
                  glob does not expand. Breaks the LIBRARY, not just the test.
        setsid    absent; `spawn_marked`'s `setsid sleep 300 &` dies at once, so
                  `$!` is already dead. This is a SECOND, independent cause —
                  proven by shimming setsid onto PATH, after which arm 5 passes
                  while the /proc arms still fail 6/9.
    deliverable: |
      A darwin mechanism for marking and reaping a dispatch tree, replacing the
      environment marker with something both platforms can read — a token file
      or a process group — and keeping the Linux behaviour identical (the nine
      existing arms must stay green there, not merely still exist).

      Then delete the `skip:dispatch-reap:no-proc-no-setsid` arm from
      scripts/test-dispatch-reap.sh and the STEP_SKIP_EXIT field from
      scripts/gate-steps.d/230-1141-vf9w.step in the SAME commit as the fix.
      Leaving the skip behind a working implementation is how a platform
      silently stops being tested after it starts working.

      `setsid` needs its own answer and it is separate from the marking design:
      the fixture needs a detached child on darwin, and the portable form is a
      subshell with its own process group rather than the `setsid` binary.
    next_action: >
      Choose token-file or process-group FIRST and write down why, because the
      three-state discrimination and the fixture arms both follow from it and
      neither can be written against an undecided mechanism. Read macneo's
      keychain-orphan trace before choosing — if one mechanism covers both, that
      is worth more than the cheaper one. Keep the Linux path byte-identical
      until the darwin path is proven, so a regression there is unambiguous.
