    title: "lib/lua/common gains a repo_root() helper built on git rev-parse --show-toplevel, and Lua fixtures stop deriving the root from pwd -P or handing a relative path to a bash -c string"
    context: |
      Measured on yolanda (msys, native tillandsias-plan.exe runner) 2026-11-14 while writing
      test-cheatsheet-hook-phases-scoped.lua (2083-6k44). Two idioms mis-resolve there, both
      SILENTLY:
      (1) proc.run({argv={"bash","-c","cd 'target/...' && bash hook"}}): the runner's PATH can reach a
          bash that resolves the relative path elsewhere; the hook never ran, so every arm counted
          0 calls and a positive control was the only thing that noticed.
      (2) ROOT from proc.run({argv={"pwd","-P"}}): under MSYS this prints /c/Users/..., which the
          native runner then refuses as a RELATIVE cwd ("proc.run: cwd '/c/...' is relative").
      git rev-parse --show-toplevel prints C:/... on Windows and /... on Linux: absolute to the
      runner on both. On linux-next 2026-11-14: 12 scripts/lua/test-*.lua take ROOT from pwd -P
      (test-agy-install-cached, test-configure-ollama-affordances, test-dev-inference-ensure-
      affordances, test-gate-podman-mode-configuration, test-git-mirror-ready-before-retry-push,
      test-git-mirror-vault-sink-wait-is-an-event, test-git-mirror-warm-start-keeps-tracking-refs,
      test-harness-refresh-lock-owner, test-openspec-pin-affordances, test-promote-stable-
      affordances, test-skills-single-source-affordances, test-spec-index-ensure-affordances).
      Whether each one is actually wrong on Windows depends on whether ROOT reaches a cwd or a
      native argv; audit each, do not assume. The shell-to-lua migration (lenovinha, 2080-zcur
      family) should port onto this helper rather than copy either idiom.
