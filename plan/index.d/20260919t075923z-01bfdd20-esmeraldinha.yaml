      host: esmeraldinha
      summary: |-
        THE PLAN-ONLY LANE IS ITSELF GATED ON A FRESH PLAN BINARY, WHICH MAKES IT LEAST AVAILABLE WHERE IT IS MOST NEEDED. Measured on esmeraldinha 2026-09-19, and recorded here rather than on a new row because it is a precondition of this lane that its refusal does not put in front of the reader.

        WHAT THE LANE PROMISES, in its own header: the plan-only push takes no build stamp, so "a checkout that has never run ./build.sh --check can push its claim". That is the whole reason the lane exists — a host that cannot gate can still separate itself from other hosts by landing a status flip.

        WHAT IT ALSO REQUIRES, undocumented there:

          plan-only lane: REFUSED — the resolved plan binary is STALE (full gate required)

        Three consecutive refusals on this host carried that line, and the FALLBACK is the full gate — about 94 minutes here. So a host with no toolchain, or with a binary nobody has refreshed, cannot use the lane at all; it is sent to the exact gate the lane exists to spare it.

        THE MEASUREMENT. target/release/tillandsias-plan on this host was built 2026-09-14 against a checkout whose newest commit was 2026-09-18: five days stale, and stale for the WHOLE session without anything saying so. Rebuilding it cleared the refusal.

        A DETAIL THAT MAKES THIS HARD TO SEE, and the reason the wrong cause is easy to believe. Two EARLIER plan-only pushes from this same checkout SUCCEEDED and printed no lane line at all — because the build stamp happened to be current, the full-gate path passed, and the lane was never consulted. The lane only gets asked once the stamp goes stale. So the same stale binary is invisible on a good day and decisive on a bad one, and the bad day is precisely the day the stamp is stale, i.e. the day you needed the lane.

        HOW I MISDIAGNOSED IT, recorded because the next reader will be tempted the same way. The refusal the SCRIPT surfaces is refused:fragments-to-trunk:push: followed by the pre-push stamp verdict — "the tree changed since ./build.sh --check last passed". That is true and it is not the cause. The lane's own verdict sits two lines above it in the hook's stderr and names the binary. I read the propagated line, inferred that a concurrent edit to a non-plan file had revoked the exemption, and said so out loud; re-running with nothing outside plan/ touched produced the identical refusal and falsified it. NAME WHAT THE INSTRUMENT READS before theorising about the cause.

        THE COMPOSITION, which is the part worth acting on:
          With 1259-kn83 — a host whose gate cannot converge against a moving trunk is refused on the stamp; it reaches for the plan-only lane, which is the documented way to land a claim without a stamp; and the lane refuses because its binary is stale, sending it back to the gate that could not converge. Both doors shut on the same host for unrelated reasons.
          With 1258-tpkz — "the resolved plan binary" is locus-dependent here: ./target/release/tillandsias-plan is a PE32+ from the Windows side and an ELF from inside the WSL builder distro, and the gate runs in the distro. So "the binary is stale" is not answerable without naming WHICH binary was resolved, and a freshness verdict that does not name its locus is not a measurement.

        REMEDY BELONGS WITH THE FAMILY, not here: a resolver that prefers a prebuilt binary should compare it against its sources and REFUSE WITH THE REBUILD COMMAND rather than run stale or fail obliquely, and a floor host needs a toolchain-free way to refresh it. The coordinator is filing the family parent; this note is the instance.
