      summary: >
        THE DISPATCH CHECK THIS PACKET ASKS FOR, run on the native-Fedora floor
        host so the trap has a second data point on a different OS.

        861-n7f5 says prove dispatch before benchmarking. Read out of the LIVE
        runner's process maps inside the inference container rather than
        inferred from flags:

          /proc/<llama-server pid>/maps  ->  libggml-cpu-alderlake.so

        Exactly this host's microarchitecture, so every number this host has
        published is on the dispatched path and none of them is a
        wrong-backend artefact. Method note for whoever repeats it: the host
        cannot read the runner's maps (container user namespace), and the image
        has no pgrep, so the check is a /proc/[0-9]* cmdline scan run via
        podman exec.

        CORROBORATING THIS PACKET'S CONCLUSION FROM THE OTHER SIDE. 855-wrr3
        criterion 5 on this host compared ollama against ollama's OWN
        llama-server on the identical GGUF: decode 42.6 vs 40.0 tok/s, ~6.5%,
        which agrees with the 29.52 vs 28.99 measured on the Windows cousin.
        Two hosts, two OSes, same verdict — swapping the server binary while
        keeping the ggml build changes nothing. This packet's finding is the
        complement: swapping the GGML BUILD (Fedora's llama-cpp, no AVX2/FMA/
        AVX_VNNI) changes everything, 12.8x on prefill. The variable is CPU
        dispatch, not the runtime, and the two experiments bracket it.

        NOT ATTEMPTED HERE: Fedora's stock llama-cpp package. On Silverblue that
        means rpm-ostree layering and a reboot, which is not a thing to do to a
        measurement host mid-cycle; it could be tested inside the builder toolbox
        if someone wants the native-Fedora datapoint.
