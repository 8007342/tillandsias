      summary: >
        THIRD-HOST CONFIRMATION THAT THE FIX WORKS, and one defect found by
        actually running the harness rather than reading it.

        Ran the corrected harness on the native-Fedora floor host:
          gen   prefill_tok_s=123.27 (n=3, 115.43-126.76, 116 prompt tok)
                gen_tok_s=37.03  eval_tok=200  engine=cpu offload_pct=0
          embed n=10 chars=250 per_chunk_ms=339.8 chunks_per_s=2.94
          project full_rebuild=skipped:no-measured-corpus-chunk-count
        THE `skipped:` IS THE FIX WORKING. The old project: line multiplied two
        superseded constants and was right only by cancellation; here it
        correctly REFUSES to project rather than emitting a plausible number.
        Confirmed on a host that was not involved in writing the fix.

        THE HARNESS WAS NOT EXECUTABLE, and its own usage block says to run it
        by path. `scripts/bench-inference-floor.sh` was git mode 100644, so a
        host following the documented invocation gets rc=126 "Permission denied"
        — which reads as a broken host rather than a broken mode. The same held
        for scripts/bench-semantic-budget.sh, whose usage block also documents
        path invocation. Both moved to 100755 here.

        WHY 731-d89b's GATE DID NOT CATCH IT, which is the part worth keeping.
        That gate refuses "a script that callers RUN by path but git tracks as
        non-executable" — it finds CALL SITES in the tree. The only in-tree
        caller of this harness is scripts/test-bench-prompt-uniqueness.sh:85,
        which invokes `bash "$SUT"` and therefore needs no exec bit. The only
        path-invocation is inside the script's OWN usage comment, which no call
        site scan can see. So a script can document an invocation that has never
        worked, and every gate stays green. The irony 731-d89b was written about
        — a permission error read as a verdict — reproduces one layer up, in the
        gate meant to prevent it. Peer evidence that 100755 is the intended
        shape: host-capability-probe.sh and check-capability-row.sh are both
        already executable.

  - packet_id: engine-candidates-must-prove-cpu-dispatch-before-they-are-benchmarked
    event:
