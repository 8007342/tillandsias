    title: |
      build.sh is 5,029 lines of orchestration in the dialect this design retires (51 pipe sites, `_now_ms` on GNU date, `_run` with an OOM postmortem, the gate-steps.d loop, the stamp digest, the preflight door) — phase by phase each moves behind `tillandsias-plan gate <phase>` until build.sh is a launcher that detects cargo, builds the plan binary, and execs it with its argv
