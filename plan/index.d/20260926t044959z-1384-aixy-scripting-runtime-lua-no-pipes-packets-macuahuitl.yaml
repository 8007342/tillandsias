    priority: p1
    desired_release: v0.6
    pickup_role: linux
    capability_tags: [lua, rust, exec, async, portability, plan-binary]
    estimated_hours: 12
    depends_on: [an-idiomatic-command-executor-in-rust-argv-not-shell-strings-with-separately-captured-fds-concurrent-draining-and-a-run-identity-so-a-stale-marker-cannot-read-as-a-fresh-result, one-lua-std-module-registers-json-yaml-hash-time-path-into-every-lua-environment-the-plan-binary-hosts-by-class-and-the-lua-cli-stops-handing-scripts-an-unsandboxed-vm]
    owned_files: [crates/tillandsias-exec/src/lib.rs, crates/tillandsias-plan/src/lua_std.rs, crates/tillandsias-plan/src/lua_predicate.rs, crates/tillandsias-plan/Cargo.toml, crates/tillandsias-plan/tests/lua_proc.rs]
    observed_by: macuahuitl
    title: |
      `proc.run{argv=…}` and `proc.spawn{argv=…}:on_line(fn)` on tillandsias_exec with mlua's async feature — a process is a typed result (`status` in exited|signaled|timed_out|spawn_failed, `code`, two captured fds, run_id), a long-running one is an observable stream with per-fd line callbacks driven by the host on one thread, composition passes bytes (`stdin=a.stdout`, `proc.chain`), the group is killed on deadline, and no OS pipe exists between stages
    verifiable_closure: |
      cargo test -p tillandsias-plan --test lua_proc, each arm failing on the
      base below: (1) proc.run{argv={"false"}} returns status "exited", code 1,
      ok false, and raises NO Lua error; proc.run{argv={"printf","a b*c"}}
      delivers one token with the `*` unexpanded; (2) a child writing 1 MiB to
      stdout AND 1 MiB to stderr returns both in full; (3) proc.run{argv=
      {"bash","scripts/fixtures/spawn-grandchild.sh"}, timeout_ms=500} returns
      status "timed_out" with code nil in under 2 s and the grandchild sleeper
      is gone (group kill; on Windows the job object); (4) proc.spawn on a
      10,000-line producer invokes the stdout callback exactly 10,000 times in
      order and the stderr callback separately, and p:wait() returns after the
      last callback; (5) proc.run{argv={"bash","-c","true | false"}} is REFUSED
      with an error naming allow_shell_strings; (6) a consumer given
      stdin=a.stdout that exits after one line (`head -1`) leaves a.status ==
      "exited" and a.code == 0 — the SIGPIPE inversion has no pipe to act on;
      (7) `tillandsias-plan lua --class cacheable -e 'expert.log_info(type(proc))'`
      prints nil (Cacheable never gains a process). Pre-fix result: FAILS on
      origin/linux-next 9594a4303 — no test target lua_proc, and in the
      Observing class type(proc) is nil (only sh.run exists, synchronous, no
      spawn, no group kill: Running::kill signals the child alone).
    context: |
      DESIGN: plan/issues/scripting-runtime-lua-no-pipes-design-2026-09-26.md
      §4 (the API tables are the contract; do not redesign them here).
      OPERATOR DIRECTION 2026-09-26: control every execution and every
      success/error state transfer; non-blocking observable streams and
      callbacks; no pipes. MEASURED on the base: scripts carry 2,985 pipe
      sites outside quotes (4,940 raw), litmus command: fields 911, and the
      ledger records the pipe verdict inverting twice TODAY (792-ksr8 on
      1370-tjme's fixture, 1359-qf3p instance 1).
      WHAT EXISTS: tillandsias_exec::Command::run (argv, tokio::join! on three
      fds, timeout), Command::spawn -> Running (inherit stdio; kill = SIGKILL
      of the child only), Pipeline (in-memory chain, every stage's Output
      kept). lua_predicate.rs exposes sh.run{argv} synchronously.
      WHAT THIS ROW ADDS: Command::group(true) (setsid + killpg on Unix, a job
      object on Windows) so a deadline kills what the child started
      (1132-r4mt, 1305-udgs); Running::lines (a line-streaming reader per fd,
      LF split, CR preserved); Completion::Signaled surfaced to Lua; a run
      trace (run_id, argv, wall_ms, status) per script; and the Lua tables
      proc.run / proc.spawn / proc.chain / proc.select / proc.all in the
      Observing class through mlua `async` (Lua::create_async_function;
      the script is a coroutine on a current-thread tokio runtime; callbacks
      are Lua functions run by the host only while the script is suspended in
      wait/select, so no callback is concurrent with script code).
      RULES: argv is a table or the call raises; a non-zero exit is DATA;
      raise only for programmer errors (empty argv, relative cwd, an unknown
      field — `timeout` misspelt must not mean "no deadline"); `bash -c`/`sh -c`
      with one string argument is refused unless script{allow_shell_strings=true}
      is declared (the ratchet, 1384-bxhk, counts those declarations); stdin is
      null unless given; children get the BASE env (PATH, HOME, TMPDIR,
      TILLANDSIAS_*, LC_ALL=C, LANG=C, TZ=UTC, GIT_TERMINAL_PROMPT=0) plus the
      call's additions — one Rust constant. Green on one regime is not green:
      the fixture runs on Linux; 1384-ddua's macOS arm and a yolanda native
      run of arm (3) are the other two regimes and must be recorded as events
      before 902-5bf9 relies on this.
  - packet_id: the-lua-runtime-encodes-keys-in-a-different-order-every-process-and-exposes-os-setlocale-so-a-sorted-encoder-a-sorted-pairs-and-a-withheld-setlocale-make-one-script-one-byte-stream
    order: 1384-bp6t
    status: ready
    kind: defect
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [lua, determinism, portability, plan-binary, locale]
    estimated_hours: 4
    owned_files: [crates/tillandsias-plan/src/lua_std.rs, crates/tillandsias-plan/src/lua_predicate.rs, crates/tillandsias-plan/tests/lua_std.rs, scripts/test-lua-determinism.sh]
    observed_by: macuahuitl
    title: |
      the Lua runtime prints `json.encode` keys in a DIFFERENT order every process (Lua 5.4.7 `luai_makeseed` seeds string hashing from ASLR and the clock, and `pairs` walks the hash) and exposes `os.setlocale`, which flips `string.format("%.2f", 3.5)` to `3,50` in one call — so a sorted encoder, a sorted `pairs`, and a withheld `setlocale` make one script one byte-stream on every host
    verifiable_closure: |
      bash scripts/test-lua-determinism.sh, wired as a build.sh --check step
      in the same commit (1325-ygq5): (1) runs `tillandsias-plan lua --class
      cacheable scripts/fixtures/determinism.lua` (encodes a 12-key table,
      iterates pairs over it, prints both) THREE times in three processes and
      asserts the sha256 of stdout is identical across them; (2) asserts
      `type(os.setlocale)` is nil in BOTH classes; (3) under LC_ALL set to any
      installed comma-radix locale (fr_FR.UTF-8, or br_FR on hosts that carry
      it; a named skip if none is installed) `string.format("%.2f", 3.5)` is
      `3.50` and `tonumber("3,5")` is nil; (4) `next` is nil in both classes
      and `table.keys(t)` returns sorted keys. Pre-fix result: FAILS on
      origin/linux-next 9594a4303, build 0.1.0+4312ec2ceb0c33ae — three
      consecutive runs printed `{"gamma":3,"eps":5,…}`, `{"delta":4,"alpha":1,
      …}`, `{"eps":5,"zeta":6,…}` for the same six-key table, and in the
      Observing class type(os.setlocale) is "function"; after
      os.setlocale("") under br_FR the same format printed `3,50`.
    context: |
      MEASURED 2026-09-26 on macuahuitl (design:
      plan/issues/scripting-runtime-lua-no-pipes-design-2026-09-26.md §3.2).
      WHY IT MATTERS NOW: 1375-btuf made lua_std the one registrar and
      1367-q9yc made the Cacheable memo content-addressed on the bytes READ —
      but the bytes WRITTEN by a predicate are not stable across processes,
      so any verdict, fragment or fixture that json.encodes a table differs
      per run on the same host. That breaks "same script, same verdict" before
      a single decider is ported. The locale half is 1254-fdsu's class (awk
      %.2f under LC_NUMERIC) reachable from Lua: a Rust binary never calls
      setlocale(LC_ALL, ""), so the C library stays in "C" and
      lua_getlocaledecpoint reads `.` — the property to KEEP is that no
      script can change it, which withholding os.setlocale does.
      FIX SHAPE: json.encode/yaml.encode emit keys in byte order unless the
      value came from json.parse with preserve_order (1375-rn9b); the std
      environment registers a `pairs` that iterates integer keys ascending
      then string keys sorted (an O(n log n) wrapper over next) and withholds
      `next`; `table.keys` sorted; os.setlocale removed from both allow-lists
      (1367-upz6: add to the allow-list, never widen by deny — this REMOVES).
      The expert-serve environment (collect.lua, tier.lua) may keep raw next
      under its own table if the sorted wrapper measures as a cost there;
      record the measurement either way. Do NOT patch lua-src's seed: a
      fixed seed would hide the property instead of removing the dependency
      on it, and lua-src exposes no define for it.
  - packet_id: tillandsias-plan-script-run-is-the-one-runner-for-a-lua-decider-with-a-verdict-module-a-no-verdict-exit-that-cannot-be-green-typed-classification-shared-by-gate-and-door-and-step-lua-in-gate-steps-d
    order: 1384-bqhy
    status: ready
