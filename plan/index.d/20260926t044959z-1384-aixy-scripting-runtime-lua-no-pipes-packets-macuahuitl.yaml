    owned_files: [scripts/check-shell-ratchet.sh, scripts/test-shell-ratchet.sh, scripts/portability/shell-decider-floor.txt, scripts/portability/pipe-site-floor.txt, scripts/gate-steps.d]
    observed_by: macuahuitl
    title: |
      nothing counts shell deciders or pipe sites, so a Lua door cannot become adoption (rust_queries: 1 adopter in 458 files after four months) — `check-shell-ratchet.sh` prints `ok:shell-ratchet:sh=<n>:floor:<f> pipes=<p>:floor:<pf> litmus-form:command=<c>:steps=<s>:rust_queries=<r> gate-steps:sh=<a>:lua=<b>` on every --check, refuses a NEW `.sh` decider under scripts/ once scripts/lua exists and a NEW piped litmus `command:` once `steps:` exists, and its floors only descend
    verifiable_closure: |
      bash scripts/test-shell-ratchet.sh, wired as a --check step in the same
      commit: (1) on this tree the guard prints the one-line grammar above
      with every count ≥ 1 and `sh=` equal to an independent
      `find scripts -maxdepth 1 \( -name 'check-*.sh' -o -name 'test-*.sh' -o
      -name 'verify-*.sh' -o -name 'guard-*.sh' \) | wc -l`; (2) in a scratch
      clone with scripts/lua present, adding scripts/check-zzz.sh prints
      `violation:shell-ratchet:new-decider:scripts/check-zzz.sh` and exits 1,
      naming `tillandsias-plan script run` as the remedy; (3) adding a litmus
      file whose command: contains `a | b` outside quotes prints
      `violation:shell-ratchet:new-piped-command:<file>` and exits 1, while
      the same pipe inside a single-quoted literal is accepted; (4) raising
      either floor file is refused, lowering is accepted; (5) an empty scan
      population prints `could-not-run:shell-ratchet:empty-population` and
      exits 3, never ok (1374-4u6i, 1174-jd8n); (6) a `script{allow_shell_
      strings=true}` declaration in scripts/lua is counted in the line as
      `shell-strings=<k>`. Pre-fix result: FAILS on origin/linux-next
      9594a4303 — no such guard exists and `./build.sh --check` prints no
      `shell-ratchet` line.
    context: |
      DESIGN: plan/issues/scripting-runtime-lua-no-pipes-design-2026-09-26.md
      §6.3. THE LESSON is 902-5bf9's: an available seam with no forcing
      function stays at one adopter (rust_queries, landed 2026-05-22, 1 of
      458 files today). The jq ratchet (1375-tsfu) is the shape: a count
      pinned to a published grep pattern, a per-file floor, refusal of NEW
      sites only, standing debt never reddened (1130-i6xj), the floor as the
      migration's own score.
      THE POPULATION on the base (§2 of the design, commands in the doc):
      762 P1 scripts, 2,985 pipe sites outside quotes (4,940 raw), 146
      deciders of which 140 carry a pipe, 394 test- fixtures, 911 piped
      litmus command: steps of 2,921. The counts in the header of the script
      are the register of record; the doc's numbers are the day-one floors.
      WHAT IT REFUSES: a NEW file matching the decider prefixes under
      scripts/ (not scripts/lua) once scripts/lua exists; a NEW litmus
      command: with a pipe once the runner accepts steps:; a floor that rises.
      WHAT IT NEVER REFUSES: an existing file that gained lines (that is
      1375-tsfu's per-file rule, applied only to NEW pipes in files whose
      pipe count rose), the installers and bootstrap listed in §6.5 (excluded
      by path and named in the header), and images/ until the image ships the
      binary. Run the pre-fix arm (5) first: a ratchet whose empty population
      prints ok is decoration.
