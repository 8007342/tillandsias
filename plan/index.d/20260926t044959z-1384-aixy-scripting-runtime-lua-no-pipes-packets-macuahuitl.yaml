    owned_files: [crates/tillandsias-plan/src/main.rs, crates/tillandsias-plan/src/script_run.rs, crates/tillandsias-plan/src/lua_std.rs, crates/tillandsias-plan/capabilities.txt, build.sh, scripts/test-script-run-verb.sh]
    observed_by: macuahuitl
    title: |
      `tillandsias-plan script run <file.lua> [--timeout <dur>] [--trace]` is the ONE runner for a Lua decider — a `verdict` module with the house grammar (ok/refused/skip/could-not-run/blocked → 0/1/0/3/2), a script that ends without a verdict exits `refused:no-verdict:<name>` so silent green is unconstructible, `verdict.classify` is the one Rust function the gate loop AND the preflight door read, host-side timing and check-logs records, and `STEP_LUA=` beside `STEP_SCRIPT=` in scripts/gate-steps.d — so a gate step can be Lua without a second loop
    verifiable_closure: |
      bash scripts/test-script-run-verb.sh, wired as a --check step in the
      same commit: (1) a .lua calling verdict.ok("x", 3) prints exactly
      `ok:x:3` on stdout and exits 0; (2) verdict.refused("x", detail) exits 1
      with `refused:x` on stdout and the detail on stderr; (3) a script that
      returns without a verdict exits 1 printing `refused:no-verdict:<name>`;
      (4) a script that sleeps past --timeout exits 124 and prints
      `status=timed_out`; (5) a scratch copy of gate-steps.d holding a .step
      with STEP_LUA and no STEP_SCRIPT is run by build.sh's loop and its
      verdict line appears in the loop's output, while a .step naming a
      missing .lua is refused, not skipped; (6) the timing record lands in
      TILLANDSIAS_TIMING_LOG and /tmp/tillandsias-timing.jsonl does not grow
      (1204-3s2s); (7) verdict.classify over a captured `skip:…` line, a
      `could-not-run:…` line, a timed_out status and a plain refusal yields
      the four kinds the door prints, and `git grep -n 'fn classify'` finds
      ONE definition that both build.sh call sites reach through the binary.
      Pre-fix result: FAILS on origin/linux-next 9594a4303 —
      `tillandsias-plan capabilities` lists no `script`, and the gate loop
      refuses a .step without STEP_SCRIPT as "declares no STEP_DESC/STEP_SCRIPT".
    context: |
      DESIGN: plan/issues/scripting-runtime-lua-no-pipes-design-2026-09-26.md
      §4.4 (verdicts), §6.2 (coexistence), §6.4 (build.sh as a launcher).
      TODAY the gate loop (build.sh, the `for _step_file in gate-steps.d`
      loop) runs `_run bash "$STEP_SCRIPT" 2>&1` and the preflight door
      (`_pf_run_guard` and the classifier below it) greps the MERGED capture
      for `^skip:`, `^could-not-run:`, `not found` and `No space left` to
      decide the class of an outcome — 1359-qf3p is the door passing what the
      gate refuses, twice today. Two classifiers over text drift; one typed
      classifier cannot.
      THE VERB: `script run` builds the Observing environment (Cacheable when
      the script header says class="cacheable", memoised through 1367-q9yc),
      registers `verdict`, `log`, `out`, `text`, `fs`, `env` (declared names
      only — no os.getenv), runs the file as a coroutine, and exits with the
      verdict's status. Exit vocabulary is the one build.sh already branches
      on (0 ok, 1 refused, 2 blocked, 3 could-not-run, 124 timed out) so no
      consumer changes. The verdict LINE stays on stdout in the house grammar
      so check-logs.jsonl, the freshness auditor and cycle-metrics.sh read
      exactly what they read today.
      GATE STEPS: STEP_LUA="scripts/lua/<name>.lua" is a LITERAL string
      (1063-nraf) and the bound-or-retired guard learns the new key; a step
      names one of STEP_SCRIPT or STEP_LUA, never both. The loop's OOM
      postmortem and metrics-isolation arms apply to both.
      NOT IN SCOPE: porting any decider (1384-ddua), the ratchet
      (1384-bxhk), moving the loop itself into the binary (1384-j3cv).
