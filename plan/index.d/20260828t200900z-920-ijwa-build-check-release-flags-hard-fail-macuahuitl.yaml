    context: |
      OBSERVED 2026-08-28 (code audit while closing 765-evbt): the --check
      path exports TILLANDSIAS_GIT_SHA_OVERRIDE and BUILD_COMMIT_SHA_OVERRIDE
      as 'non-artifact' (build.sh:~1505), and the --release guard from
      ee1201c29 (build.sh:~2440) exits 1 whenever either is set. A combined
      invocation therefore always dies at the guard with "Fingerprint
      overrides must not be set during --release" — the script tripping over
