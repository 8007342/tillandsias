      The guard itself is correct in isolation (a staged artifact must carry
      real provenance, 765-evbt); the regression is the interaction: the
      self-export is indistinguishable from an operator-provided override, so
      the guard cannot tell 'the script set this two phases ago' from 'the
      caller is trying to fake provenance'.
