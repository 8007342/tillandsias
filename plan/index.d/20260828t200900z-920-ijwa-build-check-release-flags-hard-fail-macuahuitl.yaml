      ./build.sh --check --release (a previously-valid combination — the
      usage header says 'Flags combine') works again: either the --check lane
      unsets/withholds the overrides when a staged-artifact flag is present,
      or the guard distinguishes self-exported overrides from
      caller-provided ones. The provenance guarantee of ee1201c29 stays
      intact: a staged artifact never carries override provenance.
    pickup_role: any
    depends_on: []
