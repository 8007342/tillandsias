    context: |
      Operator, 2026-11-22 (relayed by macuahuitl-fedora): "I approve the small gates piggybacking into a
      daily run for proof." `land-queue.sh --daily-full` gates the trunk tip with the class selector OFF and
      publishes refs/attest/daily-full/<epoch> (green) or refs/attest/daily-red/<epoch> (red). A land gate
      exports TILLANDSIAS_CLASS_BASE=<proved commit> and a marker holding the proof's epoch, so the selector
      (STEP_INPUTS only) diffs against the proved tree and reads the proof's age as the last full gate. No
      proof, a proof over 24 h old, a red newer than it, a proof not on the trunk, or a main/release trunk:
      the marker points at nothing and every step runs. Each land's not-run: line names every skipped step.
