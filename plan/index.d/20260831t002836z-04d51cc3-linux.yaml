        F10 WAS WRONG AT ITS CENTRE, and the meta-orchestration skill contains the answer I filed this packet as an open decision about. Correcting both.  WHAT I CLAIMED: "claiming does not claim -- a claim event changes no status, so the claim step separates nobody", and I filed 943-unii as a DECISION between "make claiming exclusive" and "declare claiming an audit record".  WHAT THE COORDINATOR SKILL ACTUALLY SAYS (skills/meta-orchestration/SKILL.md, "Cycle batch triage"), verbatim recipe:      tillandsias-plan set-field <order> status in_progress \         --host "$(hostname -s)" --reason "claimed for cycle <UTC ts>"     git add plan/index.d && git commit -m "claim(<order>): <host>" && git push  and the sentence that settles it: "SEPARATION COMES FROM CLAIMING, which is the mechanism that already exists and is sitting at zero. `next`/`select-work-batch` filter to `unleased`, and 'leased' means `status: in_progress`."  So claiming DOES hide work from the pool -- through the selector's unleased filter, not through anything I was looking at. The methodology rule I called unimplementable ("a claim event changes status from ready to in_progress") is implemented, by the coordinator's recipe, exactly as written.  MY MEASUREMENT WAS RIGHT AND MY INFERENCE WAS WRONG. 245 really does carry 43 claim events and really is still `ready` and still offered. But that is because `append-event <id> claim` -- the WORKER skill's section 3 recipe, which I have followed for nineteen cycles -- is not the claim step. It is an audit event. I never claimed anything. The separation mechanism was not broken; I was not using it.  SO 943-unii IS NOT A DECISION. It is a two-skill divergence with a known correct target:   * meta-orchestration (coordinator): claim = `set-field status in_progress`,     pushed BEFORE the work, because "an unpushed claim separates nobody".   * advance-work-from-plan (worker) section 3: claim = `append-event ... claim`,     committed and pushed WITH the cycle's work.   * methodology `rules`: "a claim event changes status from ready to     in_progress" -- which matches the coordinator, not the worker. Two of the three agree. The worker recipe is the odd one out, and it is the one every worker host runs every cycle.  TWO MORE THINGS THE COORDINATOR SKILL SETTLES THAT I GOT WRONG:   1. COLLISION HANDLING. I had no model for it beyond the worker skill's      push-rejection recovery. The real rule is CRDT timestamp arbitration:      "two hosts can claim in the same window. On your next fetch, if another      host's claim event for that order carries an EARLIER timestamp (ties broken      by lexicographically smaller hostname), you lost: release yours back to      `ready`." Losing the race is "normal and cheap". The worker skill's      "Collision Recovery" keys on the PUSH being rejected, which is a different      and weaker signal -- a push can succeed and still have lost.   2. RELEASE IS UNCONDITIONAL. "Work you did NOT finish goes back to `ready` in      the same cycle you abandon it... Claiming is only safe because releasing is      unconditional." That is the missing half of my last cycle's reasoning about      the reaper: reclamation is not the return path, RELEASE is. The reaper is      the backstop for a dead host, not the mechanism.  AND A CORRECTION TO LAST CYCLE'S REAPER FINDING. I said the exclusive branch "needs a discriminating invoker built first". The coordinator's per-cycle stranded sweep is `check-stranded-in-progress.sh` + `archive-plan-packets.sh` -- a REPORT -- and the skill says explicitly: "Advisory, never a gate... Do not bulk-close what it reports. Closing a packet requires checking its exit criteria against the tree; guessing marks unfinished work done, which is strictly worse than leaving it stranded." So automatic reclamation is not a missing invoker, it is a DELIBERATE refusal: the project decided the discrimination is human judgement. reclaim-stranded-claims.sh having no automated caller is the design, not the gap. What I measured (3 of 5 stranded) is then a symptom of hosts not RELEASING on exit -- the thing the coordinator skill makes unconditional -- not of a reaper that fails to run.  WHAT I OWE BEHAVIOURALLY, once pushes are possible: claim with `set-field status in_progress` pushed BEFORE the work, and release back to `ready` on exit, unconditionally. I have done neither for nineteen cycles.
