      host: macuahuitl
      summary: |
        A SECOND HOST, AND IT FALSIFIES THE MEMORY-FLOOR READING THIS PACKET'S RUNBOOK
        INVITES. Measured on macuahuitl 2026-09-06, twice in succession.

        The agent harness killed two background waiter processes, both reporting
        "stopped because the system is running low on memory". Host state at the second
        kill, taken immediately:

            Mem: 62 GB total · 7 used · 55 AVAILABLE · 54 buff/cache
            swap in use: 504 MB
            loadavg: 0.97 0.81 0.97

        55 GB available and a loadavg under 1. The kill is the HARNESS's accounting,
        not the kernel's and not the host's.

        WHY THIS MATTERS TO THE PACKET RATHER THAN BEING A CURIOSITY. §4a of the smoke
        runbook states the memory position as a boundary observation and is careful not
        to invent a threshold: "at 15 GiB the wrapper is collateral; the number at which
        it stops being is unmeasured. Do not invent one. If a host with 8 or 32 GiB runs
        this step, record which side of the line it lands on." That caution was right,
        and this is the requested measurement from the other side — except it does not
        land on a side, it shows there is no line of that kind. A 62 GB host with 55 GB
        free loses its supervisor exactly as a 15 GiB host does. So the natural reading
        of pirria's incident — that the host was short of memory and a bigger host would
        not be — is false, and a reader provisioning a fatter smoke host to fix this
        would spend money on a non-cause.

        WHAT SURVIVES UNCHANGED, and it is most of the packet: the DETACHED work lives.
        Both kills took only the supervising waiter; the `setsid nohup` finalize-cycle
        run underneath continued through its gate and completed
        (`ok:land:3fb8d108f:attempt-1`, MO-FULL derived). That is the runbook's own
        remedy working — "setsid nohup survived here where a plain backgrounded run did
        not, because the kill takes the process group" — now confirmed on a second host
        and against a harness kill rather than a memory event.

        REPRODUCIBLE, NOT ANECDOTAL: two kills in succession, same host, same reason
        string, minutes apart, with the memory reading taken at the second one. Not one
        observation.

        WHAT I AM NOT CLAIMING. I have not identified what the harness is accounting
        when it says "low memory" — whether it is the session's own footprint, a
        container limit, a cgroup, or a count of background tasks. That is unmeasured
        and I am not guessing at it. Nor am I claiming pirria's original incident had
        the same cause; 15 GiB is a regime where genuine pressure is plausible and this
        one is not, which is precisely why the two data points together are worth more
        than either alone.

        SUGGESTED NEXT MEASUREMENT for whoever holds this: capture the harness's own
        accounting at the moment of a kill rather than the host's, since those are now
        known to disagree. Until then §4a should say that the kill is not reliably a
        host-memory event, so the floor discussion does not read as the remedy.
