    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    release_target: efficiency-trims-2026-09-27
    pickup_role: linux
    capability_tags: [litmus, release-gate, budget, fixture, bash, linux]
    estimated_hours: 4
    depends_on: []
    owned_files: [scripts/test-preflight-front-door.sh, openspec/litmus-tests/litmus-preflight-front-door.yaml, build.sh]
    verifiable_closure: |
      scripts/run-litmus-test.sh ci-release --phase pre-build --size quick
      --compact reports litmus:preflight-front-door OK on the linux regime,
      and the timing record it writes carries status=pass; AND
      bash scripts/test-preflight-front-door.sh --plant-check exits 0 having
      verified that no scripts/check-zz-1305-planted.sh and no
      scripts/gate-steps.d/999-zz-1305-planted.step exists in the checkout
      at any point (it runs in a scratch clone; a concurrent ls of the
      checkout during the run finds neither); AND a NEGATIVE CONTROL: with
      TILLANDSIAS_PREFLIGHT_BUDGET_FACTOR=0 (a fixture-only seam that forces
      the derived budget to zero) ARM 6 goes red with its "exceeded the
      budget" line. PRE-FIX RESULT: FAILS — the coordinator's timing log
      holds four status=fail records for this litmus on 2026-09-27
      (243,134 / 243,023 / 242,970 / 243,027 ms, identical digest and
      spec_digest), the fixture asserts wall <= TILLANDSIAS_PREFLIGHT_BUDGET_S
      with a 150 s constant against a real ./build.sh --preflight over a
      roster that only grows, and it plants two files into the checkout it
      runs in.
    title: |
      `litmus:preflight-front-door` is a standing red in every covering run (243 s, ARM 6's 150 s constant against a growing roster) and its fixture plants files into the live checkout; derive the budget from the roster and run in a scratch clone
    context: |
      T6 of the 2026-09-27 trims, the standing red. The front door
      (_preflight_roster in build.sh) enumerates every scripts/check-*.sh
      named by the gate, the step files and the hooks and runs each under a
      5 s deadline; a corpus that only grows cannot be pinned to a constant
      (the 1233-jqp4 class). The budget becomes guards x per-guard-deadline
      / parallelism plus a fixed setup allowance, computed by the fixture
      from the roster the door itself prints, so the assertion stays a
      contract ("no guard exceeds its deadline, the door runs them at the
      declared parallelism") rather than a number. The fixture also writes
      scripts/check-zz-1305-planted.sh and
      scripts/gate-steps.d/999-zz-1305-planted.step into the checkout, so a
      gate running at the same time in the same tree picks up the planted
      step: run in a scratch clone (git worktree add under mktemp, removed
      on exit). A standing red masks every new red under the ci-release
      spec.
    next_action: >
      Move the fixture into a scratch worktree; replace BUDGET_S with the
      roster-derived formula (keep TILLANDSIAS_PREFLIGHT_BUDGET_S as an
      explicit override); add the --plant-check and budget-factor seams;
      run the closure on a Linux builder and paste the pass record's
      duration_ms; record which arm was red before the change in the
      completion event.
    notes: |
      size: M
      implementer_tier: sonnet
      Changes what the release tier refuses, so sonnet at least; the
      formula and the clone are specified, the judgment is done here.
    provenance: |
      Filed 2026-09-27 on macuahuitl by the trims designer session from the
      coordinator's timing log (four identical fails that day).
