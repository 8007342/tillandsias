  - packet_id: tray-tests-share-one-env-lock-so-the-mcp-browser-family-test-survives-a-parallel-run
    order: 1437-5czv
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    release_target: efficiency-trims-2026-09-27
    pickup_role: linux
    capability_tags: [flake, rust, tray, tests, linux]
    estimated_hours: 3
    depends_on: []
    owned_files: [crates/tillandsias-headless/src/tray/mod.rs, crates/tillandsias-headless/src/local_projects.rs, crates/tillandsias-headless/src/remote_projects.rs, crates/tillandsias-headless/src/vault_bootstrap.rs, crates/tillandsias-headless/src/test_support.rs, scripts/test-headless-env-lock-is-single.sh]
    verifiable_closure: |
      bash scripts/test-headless-env-lock-is-single.sh prints
      ok:headless-env-lock:1 and exits 0, where the script counts static
      mutex definitions named ENV_LOCK or ENV_LOCK2 under
      crates/tillandsias-headless/src and requires exactly one, in
      test_support.rs; AND, as the second arm,
      for i in 1..10: cargo test -p tillandsias-headless --features tray,listen-vsock
      mcp_connection_serves_browser_family_over_the_socket -- --test-threads=8
      passes 10/10. PRE-FIX RESULT: FAILS — the count today is 5 (ENV_LOCK
      in local_projects.rs, remote_projects.rs, vault_bootstrap.rs and
      tray/mod.rs, plus ENV_LOCK2 in tray/mod.rs), so the first arm prints
      violation:headless-env-lock:5; the second arm failed in the full
      parallel run on 2026-09-27 and passed 3/3 alone (events on 1242-4x53).
    title: |
      `mcp_connection_serves_browser_family_over_the_socket` races other tests on the process env because five independent mutexes guard the same two variables; one crate-wide env lock makes the parallel run deterministic
    context: |
      T6 of the 2026-09-27 trims. The test uses UnixStream::pair (no path
      or port to collide on). Its shared state is the process environment:
      with_known_demo_project sets TILLANDSIAS_HOST_PROJECT_ROOT and
      TILLANDSIAS_CLOUD_PROJECT_CACHE under its own ENV_LOCK, while
      with_no_known_projects uses ENV_LOCK2 and local_projects::tests,
      remote_projects and vault_bootstrap each keep their own. Five locks on
      one resource is no lock. The gate's feature pass is serial
      (--test-threads=1) which is why it is only seen in ./build.sh --test's
      parallel feature pass and in the workspace run; the structural arm
      makes the criterion deterministic, the stress arm shows the symptom.
    next_action: >
      Introduce test_support::env_lock() returning a guard over one static
      mutex; replace the five definitions with calls to it; write the
      counting fixture; run the 10-round stress arm on a Linux builder and
      paste the count.
    notes: |
      size: M
      implementer_tier: sonnet
      A mechanical refactor with a structural fixture; the judgment (which
      lock) is made here.
    provenance: |
      Filed 2026-09-27 on macuahuitl by the trims designer session; the five
      lock sites were enumerated on this checkout.

