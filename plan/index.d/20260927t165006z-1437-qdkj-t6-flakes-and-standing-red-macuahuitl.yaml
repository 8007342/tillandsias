packets:
  - packet_id: credential-cold-state-determinism-arm-treats-could-not-run-as-a-regime-not-a-verdict
    order: 1437-qdkj
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    release_target: efficiency-trims-2026-09-27
    pickup_role: linux
    capability_tags: [flake, fixture, credential-probe, bash, linux]
    estimated_hours: 2
    depends_on: []
    owned_files: [scripts/test-credential-cold-state-probe.sh]
    verifiable_closure: |
      bash scripts/test-credential-cold-state-probe.sh --inject-slow-bus
      prints its arm 3 line as skip:credential-cold-state-probe:determinism:could-not-run-under-load:<n>/5
      with n between 1 and 4, and the fixture's summary exits 0; and the
      plain run keeps its current ok lines; and a NEGATIVE CONTROL injection
      (--inject-flip, two definite verdicts warm and credential-cold across
      the five runs) still prints the "consecutive runs disagreed" red and
      exits 1. --inject-slow-bus places a PATH shim busctl ahead of the real
      one that answers normally except that its second list call prints
      nothing, which makes scripts/probe-credential-cold-state.sh answer
      could-not-run:no-secret-service on that run. PRE-FIX RESULT: FAILS —
      today's arm 3 compares the verdict word across all five runs, so the
      injected run yields "consecutive runs disagreed: could-not-run vs
      warm" and a red fixture; measured live in the 2026-09-27 land gates
      under load and green alone (events on 900-z3kv).
    title: |
      The credential cold-state determinism arm reads a `could-not-run` (slow busctl under load) as a disagreement; it is a regime and must be reported as a skip, red only when two definite verdicts differ
    context: |
      T6 of the 2026-09-27 trims. probe-credential-cold-state.sh answers
      could-not-run:no-secret-service when busctl --user list returns
      without org.freedesktop.secrets, which a loaded host does. The
      fixture's arm 3 (five runs, sort -u on the verdict word) treats that
      as non-determinism of the probe. It is not: could-not-run says the
      instrument did not run, and the probe's own text says so ("this is
      NOT a cold verdict"). The arm must partition the five results into
      definite (warm, credential-cold) and could-not-run, go red only when
      the definite set has two members, and print the skip line with the
      loadavg when could-not-run occurred at all.
    next_action: >
      Rewrite arm 3 as described; add --inject-slow-bus and --inject-flip
      to the fixture (PATH shims under a mktemp dir, removed on exit);
      keep every other arm byte-identical. Record the second regime on the
      step file 240-900-z3kv.step if its verdict changes.
    notes: |
      size: M
      implementer_tier: sonnet
      A fixture change with a negative control; the injection makes the
      pre-fix red reproducible on a quiet host.
    provenance: |
      Filed 2026-09-27 on macuahuitl by the trims designer session from the
      day's land-gate reds (arm 3 "could-not-run vs warm", green on re-run).

