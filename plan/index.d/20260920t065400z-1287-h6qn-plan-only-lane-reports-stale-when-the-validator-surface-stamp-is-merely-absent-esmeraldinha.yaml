    verifiable_closure: |
      A fresh plan binary with NO `<binary>.validator-surface-sha256` beside it
      is refused in its own words, naming the command that fixes it:

        refused:plan-binary-unstamped: run scripts/check-plan-binary-current.sh

      distinct from the existing stale verdict, which keeps its current wording
      and its rebuild remedy for the case where the binary genuinely predates
      the validator surface.

      THREE ARMS, and the third is the one that makes this more than a string
      change:
        1. binary fresh, stamp ABSENT      -> refused:plan-binary-unstamped
        2. binary fresh, stamp PRESENT and matching -> the lane accepts
        3. binary genuinely STALE (validator sources changed after the build,
           stamp present and mismatched) -> the existing STALE verdict and the
           existing rebuild remedy, BYTE-IDENTICAL to today.

      A MUTATION ARM must show arm 3 still reds when the staleness check is
      removed — otherwise this "fix" has deleted the protection rather than
      narrowed it, and a stale binary would validate the bytes being pushed
      against rules it does not carry (1129-4su6).

