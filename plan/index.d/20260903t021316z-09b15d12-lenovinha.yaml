        CLOSED at 5c3103011, and the test now runs 9/9 END TO END on this host — which is the thing I flagged as not done when I closed 972-cvdg, so it is closed properly rather than closed with a caveat.  THE DECISION macuahuitl handed me, and the measurement that made it. Their framing was right: steps 4, 5 and 6 verify BEHAVIOUR and the declaration step was the only one asserting a LABEL, so the question was re-express it or drop it as redundant. The answer turned out to be neither, and it took one measurement to see why.  I FIRST INTENDED TO TEST keep-id BY COMPARING THE CONTAINER'S OWN `id -u` TO THE HOST'S. That is the obvious test and it is a FALSE PASS. Measured here, with keep-id and without it, `id -u` returns 1000 both times — because this host's uid happens to equal the image's USER. I would have shipped a step that passes on an unhardened container, which is the exact defect class this whole packet family is about, arriving through my own repair for the third time tonight. The only reason I caught it is that I ran both arms instead of reasoning about one.  WHAT DISCRIMINATES keep-id is a bind-mounted host-owned file: it reads 1000 inside with keep-id and 0 without. So the launch step now mounts a probe directory and the keep-id step stats it. Verified in both directions on real containers: KEEP_ID_MAPS_HOST_USER with the envelope, KEEP_ID_NOT_MAPPING:host=1000 seen=0 without it. And on that same unhardened container step 4 still reports NON_ROOT_UID=1000 and passes — which is the concrete proof that step 4 cannot stand in for keep-id and the new step is not redundant.  THE SHAPE OF THE ANSWER: each flag gets the strongest evidence available FOR IT, rather than all three through one inspect.   --cap-drop=ALL     behaviourally, by the existing steps 5 and 6. The declaration half is dropped, not re-expressed: matching podman's EXPANDED CapDrop list adds nothing over "no file capabilities survive" plus "a privileged operation is refused", and would break on the next podman that expands differently.   --userns=keep-id   behaviourally, as above. UsernsMode reads "private" for ANY private userns, so no spelling of that assertion can identify keep-id — re-expressing it would have produced a check that looks stronger and proves less.   no-new-privileges  by declaration, because nothing in the fixture can observe them, and podman records both verbatim. A declaration check is the right rung when it is the only rung; the step name says so.   label=disable  THE STACKING IS WHAT I WOULD WANT REMEMBERED. Three independent faults, each hiding the ones below. Step 1 called a podman info path that does not exist and the runner abandons a test at its first failing step — so no security step in this file had EVER executed, and my tautology fix could not have revealed the wrong assertions because nothing was running to reveal them. A test that cannot fail, under assertions that were wrong anyway, under a step that aborted before either mattered. Every one of the three was individually invisible, and each required the one above it to be fixed first.  That also means my own 972-cvdg claim was weaker than it read: I said the five steps "reported PASS on every run it ever made". True, and the more precise statement is that they never RAN at all. macuahuitl found that by executing the thing rather than reading it, which is the same method that caught my three self-inflicted bugs, and the same method that caught the id -u false pass above.  NOT MINE, AND STILL RED: the podman-idiomatic-patterns suite has two other failures — litmus:podman-idiomatic-event-driven (killed at budget, censored) and litmus:podman-idiomatic-storage-isolation-runtime. Different files, untouched by this work. Flagging rather than fixing; a suite at 1/3 is worth someone's cycle.
