        IMPLEMENTED AND RUNTIME-VERIFIED. The acceptance test is the same nine-row harness that FOUND the defect, re-run against the fix on a live guest — every row now INTACT, negative control included, harness exit 0.    byte  name         sent recv host_md5 guest_md5 rc  verdict   0x03  VINTR        5    5    dd43705b dd43705b  0   INTACT   (was: CHILD KILLED, rc=130)   0x04  VEOF         5    5    94ba28f2 94ba28f2  0   INTACT   (was: 1 byte eaten)   0x08  VERASE-BS    5    5    f4c7cab3 f4c7cab3  0   INTACT   (unchanged, no regression)   0x11  VSTART       5    5    354f1cb1 354f1cb1  0   INTACT   (was: 1 byte eaten)   0x13  VSTOP        5    5    d4561d71 d4561d71  0   INTACT   (was: SESSION WEDGED, rc=124)   0x15  VKILL        5    5    1bdf299f 1bdf299f  0   INTACT   (was: everything buffered discarded)   0x1a  VSUSP        5    5    95d16845 95d16845  0   INTACT   (was: same)   0x7f  VERASE-DEL   5    5    1538b254 1538b254  0   INTACT   (was: erased its predecessor too)   0x41  plain-A      5    5    e1cce0b7 e1cce0b7  0   INTACT   (negative control)   ok:exec-wire-control-bytes:measured  REGRESSION CHECK on the sibling packet: a piped `cat` over a TERMINAL session still returns (TERM_EOF_OK bytes=12), so 925-eofi's VEOF path is intact for peers that never negotiate a data session.  WHAT SHIPPED: PtyOpenData (new variant, capability-gated on CAP_PTY_DATA_SESSION), guest wires the child's fd 0 to a pipe while fd 1/2 stay on the PTY slave, StdinSink models where bytes land so EOF is a pipe CLOSE on data sessions and the VEOF injection only on terminal ones, host chooses the frame via exec_open_frame at BOTH exec entry points, and an un-negotiated peer gets a named warning listing the exact bytes that will be altered — conditioned on the payload actually containing one, so it does not cry wolf on text.  THREE FAILURES ON THE WAY, each a different lesson:  1. MY LEDGER-EDIT SCRIPT REPORTED SUCCESS WHILE DOING NOTHING. The control_dispatch route-matrix edit used a bare replace() with no assertion, the anchor did not match, and my script printed "route matrix updated" regardless. Every later build compiled a guest that ADVERTISED the capability while its matrix REFUSED the variant. Caught on the first clean probe by the matrix's own refusal — "variant PtyOpenData not supported on the in-VM vsock transport" — which is the second time today that design saved me. The comment there now records both catches. Every edit in this change now asserts its anchor before replacing.  2. THE PIPE DELIVERED BUT COULD NOT SIGNAL EOF, and the symptom named the cause: 0x03 moved from rc=130 (SIGINT) to rc=124 (timeout). The byte had stopped being interpreted — delivery already worked — while `cat` hung forever. A pipe reports EOF only when the LAST writer closes, and a plain pipe() leaves both ends inheritable across exec, so the child kept its own copy of the write end and was holding open the very thing whose closure was supposed to tell it input had ended. Fixed with FD_CLOEXEC on both ends; dup2 clears it on the new descriptor, so the read end still arrives as fd 0 and only the stray duplicates vanish. Note pipe2(O_CLOEXEC) does NOT compile here — nix gates it away on macOS because Darwin has no pipe2(2), and this file builds on the macOS dev host for its unit tests though it runs on Linux in the guest. fcntl(F_SETFD) is portable to both.  3. MEASUREMENT CONTAMINATION I CAUSED MYSELF. An early run showed every row NO-RESULT; the cause was a manual probe I launched while the harness was booting its own VMs, hitting the storage-attachment race. Reading that table as "the fix does not work" would have been wrong. The raw error, not the table, is what said so.  TESTS: every_exec_entry_point_chooses_its_open_frame ENUMERATES the input-delivering entry points and requires each to route through exec_open_frame — watched RED against a deliberately reverted streaming path, where it named that exact function, before being made green. That is the 925-eofi lesson applied prospectively rather than after another live hang. Plus the specials list pinned to what was MEASURED (0x08 excluded because it arrives intact — warning about unbroken bytes dulls the warning about broken ones).
