    title: |
      check-credential-channel.sh's first three arms report existence and prefix it `ok:`, so a dead credential reads green to every consumer — none of which requires the one arm that actually probes
    context: |
      FOUND by esmeraldinha, whose dead token this check never once caught;
      reframed and fixed here 2026-09-06.

      THE CHECK WAS NOT LYING. Its four arms emit four distinct verdicts, and
      each says exactly what it did:
        :325  ok:gh-credentials-store       a store file exists. Probes nothing.
        :330  ok:gh-token-env               a variable is set. Probes nothing.
        :334  ok:github-token-env           a variable is set. Probes nothing.
        :361  ok:gh-keyring-push-verified   bounded push probe. Verifies.
      The nouns are narrow and truthful. THE PREFIX WAS NOT, because every
      consumer pattern-matches the prefix and not the noun.

      NOTHING READS THE DIFFERENCE. `gh-keyring-push-verified` appears in three
      files — this check, its fixture, and one comment in check-host-tools.sh —
      and NONE requires it. The dispatch preflight every host runs triggers on
      `blocked:*` (advance-work-from-plan/SKILL.md:247), so an unverified arm
      passes it silently. esmeraldinha's host had a non-empty store file, so arm
      4 had never run there at all.

      WHY THIS IS THE ASYMMETRY RULE AGAIN, third instance tonight: git's
      credential-store ERASES the entry on a rejected push, so `ok:` is the
      reading you get BEFORE you try and `missing:` only AFTER the failure has
      already told you. A host that has not pushed since its token died reads
      CLEAN — the host that looks better is the one that has not yet generated
      the evidence.

      THE FIX IS A RENAME AND DELIBERATELY NOTHING ELSE. Arms 1-3 now emit
      `unverified:`. No control flow changes, so it cannot false-red any host.
      That matters because the obvious fix is WRONG: yoga measured a host whose
      git config lists
        credential.https://github.com.helper = store --file=.git/.gh-credentials
                                               !/usr/bin/gh auth git-credential
      with the store helper FIRST, so git authenticates from the store file
      while `gh auth status` reads the keyring — and on that host the keyring
      token is invalid while the store token pushed successfully at 04:21Z.
      Making arm 1 fall through to arm 4 would block every cycle there over a
      channel git is not using.

      THE AGREED SEQUENCE, so the next claimer does not reorder it:
        1. THIS: rename arms 1-3 to `unverified:`. Safe by construction.
        2. Arm 1 gets a bounded probe of ITS OWN channel — a store-credential
           probe, not a fall-through.
        3. ONLY THEN tighten the dispatch rule from "absence of blocked:" to
           requiring a verified verdict. Before step 2 that strands store-file
           hosts with no verifying arm to satisfy.

      TWO SELF-INFLICTED FAULTS IN THIS ONE CHANGE, both caught by sabotage:
        - The new assertion called `fail "..."`. `fail` is the suite's FLAG
          VARIABLE, not its failure function (`bad` is). So the line was
          command-not-found and registered nothing: an assertion that looked
          like an assertion and was a no-op. Found by sabotaging the rename and
          watching the suite pass anyway.
        - Before finding that, I misread the passing sabotage as the fixture not
          constructing arm 1. It does, at section 4, in a scratch repo. The
          fixture was right and my assertion was broken.
    exit_criteria:
      - "arms that probe nothing do not emit an `ok:` prefix, so a consumer pattern-matching the prefix cannot read existence as verification"
      - "the arm that probes keeps `ok:` and its verdict is unchanged, so nothing that already required it breaks"
      - "the fixture FAILS when arm 1 reverts to `ok:` — verified by sabotage, not by inspection"
