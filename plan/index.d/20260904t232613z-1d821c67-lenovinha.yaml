        OBSOLETED, PREMISE VOID. This packet asked for the gate stamp to see a worktree chmod. That is not a defect to fix — it is a deliberate, Windows-critical design (889-8tcb), and my attempt to "fix" it reintroduced a deadlock that once left yolanda unable to push at all. Reverted in 0a1419ffe.

        WHY OBSOLETED RATHER THAN REOPENED. I first set it back to `ready`, and check-fragment-status-loss refused the tree: the landed `completed` EVENT and a `ready` fold are the two channels disagreeing, and that guard is a set-membership join, so no later event can clear an already-landed terminal one. `set-field --reopen-evidence` and check-fragment-status-loss therefore disagree about whether a completed packet may return to ready — the tool offers the move and the gate refuses its result. I am not resolving that tension by faking a status: the packet's PREMISE is void, obsoleted is terminal, and both channels agree on it. The disagreement itself is worth someone's attention and is recorded here rather than worked around silently.

        THE REAL DEFECT SURVIVES AND IS FILED SEPARATELY as 1035-* (memo scope): an unforced `./build.sh --check` returned rc=0 on a tree whose exec-bit guard refuses it. The guard reads the worktree and works (887-bz88 arm 3 passes); the stamp deliberately does not; so the MEMO skipped a guard inspecting state the stamp does not cover. Anyone taking it up must NOT touch the digest — the candidate shapes are excluding that guard from memoisation, or refusing to memoise when index and worktree modes disagree on a POSIX host.

        THE LESSON, which is the part worth keeping: `./build.sh --check` RUNS NO LITMUS (748-tkjx). litmus:mode-only-regression-gate exists, pins exactly the property I broke, and states the Windows reason in its own arm text. I ran the gate FOUR times on that change and every run was green. A guard can be perfectly written, correctly bound, and still absent from the lane the author is standing in — so "my gate was green" is evidence about the gate's lane, not about the change.
