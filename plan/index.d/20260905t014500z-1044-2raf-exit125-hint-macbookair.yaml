packets:
  - packet_id: the-exit-125-hint-asserts-the-container-launched-when-podman-never-launched-it
    order: 1044-2raf
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: any
    release_target: stable-milestone-v1
    capability_tags:
      - fail-loud
      - diagnostics
      - podman
    estimated_hours: 2
    verifiable_closure: |
      cargo test -p tillandsias-podman exit_125 passes a case asserting that a
      125 status does NOT emit "the container launched" or "not podman launch
      failures", and a non-125 agent failure still emits the agent-runtime hint.
    title: |
      On exit 125 the forge-session error says the container launched and steers the reader away from podman, three lines below podman's own refusal to launch it.
    deliverable: |
      A 125 is reported as what it is. What must not persist is a diagnostic
      that tells the reader to stop looking exactly where the cause is printed.
    context: |
      REPRODUCED BY pirria-cachyos on v56.9.4.1, 2026-09-05, during the 873-vgyg
      live reproduction. Kill-to-relaunch gap 62 ms; relaunch_exit=1 after
      19,626 ms. Transcript verbatim, in emission order:

        [tillandsias] REFUSING to remove forge container
        tillandsias-tillandsias-forge: it is RUNNING — a concurrent sibling lane
        likely owns it, and its clone-only workspace holds unpushed in-forge
        work. Leaving it and its per-project dependencies (git, browser) alone
        (leak-not-destroy, order 494). Detail: Container command failed (status
        Some(2), retry Unknown): podman rm tillandsias-tillandsias-forge /
        stderr: Error: cannot remove container 1f36c3ef… as it is running -
        running or paused containers cannot be removed without force: container
        state improper

        Error: creating container storage: the container name
        "tillandsias-tillandsias-forge" is already in use by 1f36c3ef…. You have
        to remove that container to be able to reuse that name: that name is
        already in use, or use --replace to instruct Podman to do so.

        Error: [OpenCode] forge session exited: stage 'opencode' attached
        command exited with status 125 / container:
        tillandsias-tillandsias-forge / cause: the container launched and the
        foreground tool exited non-zero / next: read the agent output
        immediately above; auth, upstream service, or model availability errors
        are agent/runtime issues, not podman launch failures

      THE SECOND LINE IS PODMAN REFUSING TO CREATE THE CONTAINER. The third says
      the container launched and that this is not a podman launch failure. Both
      halves are false, and they are printed directly beneath the evidence.

      THE MECHANISM, read in source rather than inferred:
      `format_attached_command_failure` (crates/tillandsias-podman/src/client.rs:2492)
      takes `status_code` and NEVER INSPECTS IT. It unconditionally emits
        "cause: the container launched and the foreground tool exited non-zero"
      and, for stage in {claude, codex, opencode}, the "not podman launch
      failures" hint. So the two lines are not a wrong guess about this failure
      — they are constants that happen to be right for the common case.

      WHY 125 IS SPECIFICALLY DECIDABLE, which is what makes this fixable rather
      than merely wrong: 125 is podman's OWN exit code for "the container was
      not started" (an error before or during creation). A foreground tool CAN
      also exit 125, so the code alone is ambiguous in principle — but the
      direction of the current text is exactly backwards: it resolves the
      ambiguity toward the case it cannot check and away from the one podman
      just printed.

      IT IS WORSE THAN AN UNHELPFUL HINT. A reader who trusts it stops reading
      podman's stderr, which is where the cause and the remedy both are. The
      line does not merely fail to help; it spends the reader's attention
      steering them away from the answer.
    exit_criteria:
      - 'a 125 status does not assert "the container launched"; it says the container may not have started and that podman''s own error is immediately above'
      - 'a 125 status does not emit the "not podman launch failures" steer for any stage'
      - 'a non-125 agent failure still emits the agent-runtime hint, so the fix narrows the claim rather than deleting a useful one'
      - 'the two sources of 125 (podman refusing to create; the foreground tool exiting 125) are named where the hint is chosen, so the next reader of that function sees the ambiguity rather than rediscovering it'
    notes: |
      Found during 873-vgyg's live reproduction and filed separately at the
      coordinator's ruling rather than bolted onto that commit, because the fix
      belongs where the hint is chosen and would have been invisible inside a
      forge-launcher change.

      Related: 873-vgyg (the collision that produced this 125). Note that after
      873-vgyg the launcher waits a running holder out rather than colliding, so
      THIS EXACT PATH IS RARER NOW — which makes the message more misleading,
      not less: it will fire on the residual cases nobody is expecting.
    events:
      - ts: 2026-09-05T01:45:00Z
        type: filed
        agent: macos-tlatoanis-macbook-air-claude-20260905t004510z
        host: tlatoanis-macbook-air
        note: |
          Measurement is pirria's; the source read and the mechanism are mine.
          The `cause:` line is included as well as the `next:` line the
          coordinator named — both are unconditional constants from the same
          function, and fixing only the hint would leave the false cause.
