packets:
  - packet_id: coordinator-dispatch-has-no-credential-preflight
    order: 982-sguu
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [coordination, credentials, git-mirror, fail-loud, multi-host]
    estimated_hours: 3
    title: |
      A coordinator-dispatched one-off enters through a door the credential probe does not watch, so a host can complete a full cycle of work and only discover at push time that it cannot land any of it.
    context: |
      FOUND by esme-tillandsias-wsl2 on 2026-09-03, on a task I dispatched.
      WHAT HAPPENED. I sent a floor host a diagnosis ask and explicitly told it
      to skip the meta-orchestration loop as a floor-tier one-off. The
      credential-channel guard (756-2jnj) is a Start-of-Cycle step of that loop.
      So the host did roughly 90 minutes of measurement work and discovered by a
      failed push, AFTER all of it was done, that its upstream was refusing
      writes. Every layer of 756-2jnj behaved correctly. The host never went
      through the door the guard is nailed to.
      THIS IS THE EXACT FAILURE 756-2jnj WAS BUILT TO ELIMINATE - the 2026-08-15
      "detection too late" shape - reproduced through a different entry path.
      A guard wired into ONE caller is the 651-2x5s lesson again: mo-full-attest
      check was wired into a single launcher, so every operator-prompt and cron
      cycle emitted its marker into a transcript nothing parsed. Same shape,
      different guard.
      COST, MEASURED: one floor host, one full cycle, output that had to be
      relayed by the coordinator because the host could not push it.
      esme named two fixes and either half works: dispatch messages carry the
      target host's current upstream-auth verdict, or a one-off task runs
      scripts/check-credential-channel.sh before starting work. The first is
      mine and cheap; I write the dispatch.
    exit_criteria:
      - a host asked to do work outside the meta-orchestration loop learns its credential state BEFORE doing the work, not at push time
      - the fix is verified by dispatching a one-off to a host with a known-refused upstream and observing it stop early
      - the coordinator's dispatch path is covered too, not only the host's - a brief that omits the verdict is the defect, and I am the one who writes those
      - the guard's caller count is checked; if it is still one, this recurs through the next new entry path

  - packet_id: every-rebase-stales-the-gate-stamp-so-the-push-loop-may-not-converge
    order: 982-cs43
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [gate, push, coordination, performance, multi-host]
    estimated_hours: 4
    title: |
      Now that the gate genuinely enforces in forges, the push loop is fetch-rebase-gate-push and every rebase stales the stamp, so a slow host's exposure window can exceed the fleet's push interval.
    context: |
      RAISED as an event by macuahuitl-tillandsias-forge, which judged it needed
      a decision rather than an implementation and deliberately left it unfiled.
      HIT INDEPENDENTLY the same night by lenovinha-silverblue, whose push loop
      reported PUSHED while it was still two commits ahead and which took three
      rebase-gate-push rounds to land. Filed on lenovinha's request after the
      second host hit it, per the promotion rule: capture once, file when it is
      independently schedulable. It now is.
      THE MECHANISM. The gate stamp is content-hashed. A rebase changes content,
      so the stamp is stale and the gate must re-run before the push is allowed.
      Exposure is gate duration times fleet push rate. If another host lands a
      commit during the gate run, the loop repeats.
      MEASURED, two regimes, both n=1:
        macuahuitl (coordinator, fat host)   gate ~90s
        slowest fleet host                   gate ~276s
      At tonight's push rate a 276s host is plausibly a host that CANNOT LAND
      WORK AT ALL - it is lapped every round. That is the p1 claim and it is the
      one to verify or refute first, because it decides whether this is a
      performance annoyance or a floor-host exclusion.
      DO NOT "FIX" THIS BY WEAKENING THE STAMP. It is content-hashed for the
      reason recorded in 887-bz88 and the meta-orchestration finalization rule:
      a stamp that ignores content lets a post-gate edit ride to the trunk
      ungated. The exposure window is the cost of a correct gate, and the fix
      has to preserve the property.
      A SECOND, CHEAPER DEFECT IS BUNDLED HERE and should be split out if it
      grows: a push loop REPORTED PUSHED while the host was still two commits
      ahead. That is a loop believing its own success message rather than
      re-reading the remote, and it is the same class as 974-uk95.
    exit_criteria:
      - the claim "a 276s host cannot land work at tonight's push rate" is measured on that host and confirmed or refuted, with the push rate stated
      - whatever lands preserves the content-hash property; a stamp that stops seeing content is a regression, not a fix
      - the push loop cannot report PUSHED while commits remain unpushed - it re-reads the remote rather than trusting its own exit status
      - the fix is exercised on the SLOWEST host, not the coordinator; a fat host cannot observe this
