  - packet_id: mirror-vault-github-credential-is-denied-by-upstream
    event:
      type: progress
      ts: "2026-08-19T02:15:00Z"
      agent_id: linux-macuahuitl-opus5-20260819T021500Z
      host: linux_mutable
      summary: |
        CREDENTIAL RE-SEEDED at the operator's instruction, by the route they
        named:

          gh auth token | tillandsias --github-login --with-token

        Result: `Git identity saved: ~/.cache/tillandsias/secrets/git/.gitconfig`
        and `GitHub authentication complete for 8007342`, rc=0. The token was
        piped, never placed in a variable, an argument or a log line; the command
        output was passed through a redactor on the way to the transcript.

        NOT YET PROVEN RESOLVED, and this packet stays open until a real lane
        says so. The only mirror running at the time was one I had hand-started
        hours earlier to close 798-c4mq: an EMPTY bare repo with no remote
        (`git remote -v` empty, zero refs under refs/heads/). Its published
        verdict `refs/tillandsias/upstream-auth/local-only/1787164355` — 79s old,
        so the probe loop is alive and republishing — is therefore CORRECT and
        uninformative: `local-only` is what a mirror with nothing to authorize
        against should say. It cannot distinguish a good credential from a bad
        one.

        What closes this: the next forge lane provisions a mirror WITH the
        project and its upstream, the probe authenticates, and the published
        state becomes `authorized` (or `denied`, which would mean the token
        lacks push and the operator must widen its scope). Any host whose next
        cycle launches a forge will produce that evidence as a side effect.

        HOUSEKEEPING: the hand-started mirror has been removed. It was not
        lane-managed, and a container publishing `local-only` under the lane's
        own name would have misled the next cycle's credential guard into
        reading a stale-but-fresh-looking verdict. Enclave now
        `ok:enclave-service-health:services=3:up=3:down=0:dead=0:absent=0`.
  - packet_id: periodic-deslopification-sweep
    event:
      type: note
      ts: "2026-08-19T02:15:00Z"
      agent_id: linux-macuahuitl-opus5-20260819T021500Z
      host: linux_mutable
      summary: |
        OPERATOR DECISION D1 — TRIGGER CLOCK. Settled: whichever comes FIRST of a
        7-day ceiling or an order-count burst. Their words: "the first one to
        happen between, say, 7 days, and ... a reasonable number of work orders
        that couldn't wait 'till end of the week for cleanup."

          DUE when (current_order - order_at_last_sweep) >= 200
                OR  days_since_last_sweep >= 7
          FLOOR    never more than once per 48h

        WHY 200, which is the number they delegated. Orders are minted at roughly
        45/day at the measured filing rate, so a full week is ~315 orders. 200 is
        ~4.4 days: it fires mid-week when the fleet is genuinely churning and
        yields to the 7-day ceiling when it is quiet. Below ~150 the sweep starts
        competing with the hourly loop for the same days; above ~250 it never
        beats the ceiling and the order clock becomes decorative. 200 sits in the
        middle of that band with room either side.

        IT IS A SEED, NOT A DERIVED CONSTANT, and must not be defended as one.
        The whole cadence rests on n=1: one 5-day window produced 8 findings of
        which 5 survived refutation, and the agent-hour cost was never measured.
        The stamp records findings/confirmed/net-lines every sweep; re-derive the
        threshold from the first four stamps. If sweeps 1-4 average under 2
        confirmed findings, double the interval rather than defending 200.

        D4 (class token names) remains open. Any prefix but `S`, which collides
        with methodology/verification.yaml s_levels.
  - packet_id: forge-window-closes-on-clean-exit-and-five-exit-pause-copies-cannot-fire
    event:
      type: note
      ts: "2026-08-19T02:15:00Z"
      agent_id: linux-macuahuitl-opus5-20260819T021500Z
      host: linux_mutable
      summary: |
        OPERATOR DECISION — ROUTE. Settled: the $TERMINAL WRAPPER, not the
        gsettings key. Their reasoning, which is the better statement of it than
        mine: "this follows ephemeral and idempotent principles: always behaves
        correctly and leaves no traces."

        That rules out `gsettings set org.gnome.Ptyxis.Profile:... exit-action`
        outright — it mutates the operator's desktop profile, persists after
        uninstall, and is neither ephemeral nor idempotent in the sense the
        project means. It also silently changes behaviour for every terminal the
        operator opens by hand, which is not ours to change.

        The wrapper goes through the surface main.rs:11970 already honours FIRST:
        `$TERMINAL`. The implementation must hold the window open only on the
        lane it launched, restore nothing, and leave no file behind after the
        window closes. The acceptance test is the packet's own principle — run a
        lane, let it exit cleanly, confirm the window survives with the scrollback
        readable, close it, and confirm the host has no residue: no gsettings
        delta, no dotfile, no leftover process.

        The six byte-identical `exit_pause` traps become deletable once this
        lands, and deleting them is part of the packet rather than a follow-up:
        they are the patch this replaces.
