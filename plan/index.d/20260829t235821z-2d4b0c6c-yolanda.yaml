        WINDOWS REGIME (a) BASELINE, MEASURED — AND THE ENDPOINT HALF ALREADY EXISTS. Read the second part first, because it changes what the endpoint owner should do. THE OPENAI FACADE IS BUILT AND WORKS ON WINDOWS. The packet's 'what does NOT exist' names an OpenAI-compliant facade over the grounded pipeline with refusals mapped to well-formed responses. It exists at crates/tillandsias-plan/src/expert_serve.rs and it is not a stub: route() serves GET /v1/models and POST /v1/chat/completions; answer_query() calls pipeline::run_grounded directly (no fork); refusals become Envelope::unsupported rendered as an HTTP 200 chat.completion with finish_reason=stop whose content carries the typed 'unsupported: ' marker; SSE streaming is implemented; and integration_refusal_models_404_and_shutdown already asserts that exact contract end to end on port 0. VERIFIED LIVE ON THIS HOST, not read: /v1/models returns all five domains, and POST /v1/chat/completions returns a well-formed completion carrying rag_source_commit and the full envelope. So the endpoint half is largely VERIFICATION AND OPENCODE WIRING, not construction — this is the second packet today whose 'does not exist' was already satisfied on trunk (793-zumy was the first), and the endpoint owner should start from what is there. ONE OPERATIONAL NOTE THAT COST ME A FALSE BUG: expert-serve exits code 0 immediately when stdin is EOF — documented and deliberate (run_blocking wires stdin EOF to shutdown), but it means a backgrounded launch with no stdin dies the instant it prints 'listening'. Hold stdin open. I nearly filed 'the server will not stay up on Windows'. BASELINE NUMBERS, regime (a) as-shipped: WSL2 default 50% RAM split (host 15.2 GB -> distro 7 GB, ~6 GB available), CPU-only (/dev/dxg present, no Vulkan ICD, accel_reason=engine-missing:no-vulkan-icd), qwen2.5:0.5b, nomic-embed-text, spec index at <checkout>/target/tillandsias-spec-index. Query: 'what is the pre-push gate rule for non-linux-next branches?' against model=methodology. Five requests: 4 landed RETRIEVAL-ONLY at 6271 / 9599 / 15241 / 15996 ms, confidence=retrieved, and EVERY ONE cited methodology/multi-host-development.yaml:458-509 as top hit at score 0.837 — which is the exactly-correct span, verified independently against the rule at :459-468. THE FINDING THAT SHOULD SHAPE THE 7B WORK, and it is not the one I expected. RETRIEVAL IS NOT THE WEAK LINK — it is stable and exactly right, same top span every run. SYNTHESIS IS, and its safer failure mode is the timeout. The retrieval-only path is honest and useful: it names the cause ('synthesis timed out inside the tier budget - the model is slower than the budget allows, not missing (927-2q4w)') and hands back the correct sections. But the FIFTH request COMPLETED synthesis and produced confident nonsense — an answer about methodology_provenance claim_strength, opening 'The opposite claim about the same topic is:', with a duplicated 'Final line: Final line:', for a question about the pre-push gate. It carried real citations to a real file. So at this tier the dangerous outcome is not the timeout, it is synthesis SUCCEEDING. citations-only-if-used is satisfied by an answer that is still wrong, because the property constrains which sources are cited, not whether the prose follows from them. WHAT THAT IMPLIES FOR THE BUDGET SWEEP (macuahuitl's added dimension): raising TILLANDSIAS_SYNTH_BUDGET_MS at a weak model tier does not monotonically improve quality — it converts honest retrieval-only refusals into confabulations. So the sweep must grade OUTPUT, not just measure whether synthesis fit the budget; a row that reports 'synthesis completed within budget' is not a better row than one that timed out unless the grade says so. Recommend every sweep row carry both the mode (synthesized|retrieval-only) and the grade, and that we watch for the band where completion rate rises while grade falls.
