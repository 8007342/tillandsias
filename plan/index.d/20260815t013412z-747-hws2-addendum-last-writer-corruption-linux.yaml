packets:
  - packet_id: startup-context-addendum-last-writer-can-corrupt-markdown-and-state
    order: 747-hws2
    release_target: forge-local-experts-milestone
    status: ready
    desired_release: v0.5
    priority: p3
    kind: bug
    title: "The addendum is appended VERBATIM and LAST — a poisoned addendum can corrupt the generated Markdown (backticks / ``` fences) and append machine-looking state lines that tail-grep readers prefer over the generator's real values"
    deliverable: "delimit the appended addendum with an explicit header (e.g. '## Checkout addendum — NOT authoritative for machine-readable lines above'), so the boundary is obvious and tail-grep consumers stop at it"
    pickup_role: linux
    capability_tags: [forge, startup-context, adversarial-review]
    estimated_hours: 1
    context: |
      The append is raw `cat` (lib-common.sh:3887). Verified with the verbatim
      block: an addendum containing ``` fences and backticks lands unescaped in
      .forge-startup-context.md, corrupting its Markdown for every agent that
      reads it as instructions. And because the addendum is appended AFTER all
      generator-emitted machine-readable lines (base_state, inference_state,
      expert_capability), an addendum containing e.g. `base_state=ok
      base_actual=IMPOSTOR` or `inference_state=ready inference_models=999`
      wins any `grep <token> | tail -1` read of the file.

      No consumer parses the file programmatically today (verified: consumers
      are existence/untracked checks only — check-launch-artifacts-untracked.sh,
      mo-full-attest.sh), so this is latent, not active; agents DO read the file
      as authoritative. The cheap fix is a clear boundary marker so the file
      self-documents which part the checkout controls.
    exit_criteria:
      - "The generated context marks the addendum boundary with an explicit header."
      - "The header states the generator's machine-readable lines above it are authoritative."
    notes: |
      No structural fix needed beyond the delimiter: the checkout is the repo
      under test, so a hostile addendum is out of scope of the mechanism itself;
      the point is that a reader must be able to tell generator content from
      checkout content at a glance.
