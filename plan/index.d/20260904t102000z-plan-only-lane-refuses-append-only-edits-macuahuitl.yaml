    owned_files:
      - scripts/hooks/pre-push-plan-only-lane.sh
    title: |
      The plan-only push lane accepts NEW issue captures but refuses a MODIFIED file, and the worker skill's mandated work-queue ledger line is a modification by construction, so a cargo-less host can work and report but cannot comply.
    context: |
      MEASURED by pirria 2026-09-04 (no toolchain, read-only cycle): it wrote the
      §6.3 work-queue line into plan/issues/linux-next-work-queue-2026-05-25.md,
      committed, and the push was refused: "plan-only lane: not applicable —
      '...work-queue-2026-05-25.md' has status 'M' in the outgoing diff; only
      NEW issue captures qualify (full gate required)" followed by "pre-push
      refused: ./build.sh --check has never run in this checkout". The lane's
      fallback is the full gate, which needs cargo; --no-verify is forbidden by
      the skill's own guardrails and pirria did not use it. The host complied by
      filing a NEW capture (plan/issues/pirria-read-only-cycle-2026-09-04.md,
      landed 39ebf5edb) instead of the ledger line the skill asks for — a
      workaround that fragments that host's history away from the queue a
      reader actually consults. The lane already validates new captures
      (parse, citation convention, scorable obligations); an append-only edit
      to a work-queue ledger is the same content under the same validation.
      Provenance: pirria measured; filed by the coordinator.
    exit_criteria:
      - the plan-only lane accepts a modification to a plan/issues work-queue ledger when the diff is append-only (no deleted or changed lines), under the validation it applies to new captures
      - a modification that deletes or rewrites existing lines is still refused to the full gate, with the refusal naming the non-append hunk
      - a fixture proves both sides on a checkout with no gate stamp
    verifiable_closure: |
      scripts/test-pre-push-empty-ref-list.sh and the plan-only lane's own
      fixture are bound and invoked by ./build.sh --check; the append-only arm
      does not exist yet and is this packet's deliverable there.
