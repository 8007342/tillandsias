packets:

  - packet_id: tray-control-wire-has-no-launch-verb
    order: 664-7qzz
    status: ready
    priority: p2
    title: "A running tray cannot be asked to launch a forge session — no launch verb on any IPC surface"
    kind: enhancement
    deliverable: new ControlMessage variant + control_dispatch row + CLI flag that delegates to a running tray
    depends_on: []
    pickup_role: linux
    capability_tags: [tray, control-wire, ipc, ux]
    estimated_hours: 4
    context: >
      Operator directive 2026-08-10: forge agents should be launched "from a
      running tray" with visible terminals. Verified today: the control socket
      ($XDG_RUNTIME_DIR/tillandsias/control.sock) speaks ControlEnvelope with
      verbs Hello/IssueWebSession/EvictProject/McpFrame/VmStatus*/Pty*/
      DeliverCredentials/GetVaultHandover/... (control-wire/src/lib.rs:107-230)
      — no LaunchForge/StartSession variant. The MCP socket's tool surface is
      browser-only plus publish_local. The only externally reachable lever on a
      running tray is replaying com.canonical.dbusmenu.Event with menu ids
      reverse-engineered from GetLayout — undocumented and unsupported. Today a
      CLI launch (tillandsias <path> --opencode ...) does the work in-process
      and merely auto-spawns a tray if none is listening (main.rs:8515-8550),
      so "tray-hosted" launches from automation are an accident of that
      fallback, not a designed surface.
    exit_criteria:
      - >
        A ControlMessage launch verb exists with a row in
        control_dispatch.rs' unix-transport routing matrix, honoring the
        deliberate constraint at tray/mod.rs:505-515: control.sock stays
        unexposed to forge containers — the verb lands on control.sock only,
        never mcp.sock.
      - >
        A CLI entry (e.g. tillandsias <path> --opencode --via-tray, exact
        surface at implementer's discretion) delegates the launch to the
        running tray, which opens its normal visible terminal
        (launch_forge_agent path), and falls back loud when no tray listens.
      - >
        A litmus pins the verb's wire shape and the forbidden-on-mcp.sock
        property.
    events:
      - ts: "2026-08-10T19:30:00Z"
        event: filed
        summary: >
          Filed from the 2026-08-10 coordinator cycle's tray exploration while
          executing the operator's tray-hosted launch directive.

  - packet_id: linux-terminal-emulator-not-overridable
    order: 664-yw8r
    status: ready
    priority: p3
    title: "Terminal emulator candidate list is hardcoded; TILLANDSIAS_WINDOW_TITLE is dead code on Linux"
    kind: enhancement
    deliverable: TERMINAL/x-terminal-emulator override in detect_host_terminal + dead-env cleanup or wiring
    depends_on: []
    pickup_role: linux
    capability_tags: [tray, ux, linux]
    estimated_hours: 1
    context: >
      detect_host_terminal (tray/mod.rs:1883-1946) hardcodes ptyxis,
      gnome-terminal, kgx, konsole, xterm. A host whose terminal is foot,
      wezterm, or alacritty gets "no supported terminal emulator found" with no
      escape hatch — no $TERMINAL respect, no x-terminal-emulator fallback.
      main.rs:11970 sets TILLANDSIAS_WINDOW_TITLE specifically for foot, which
      can never be selected, so that env is currently dead code on Linux.
    exit_criteria:
      - >
        $TERMINAL (when set to an executable) is tried first, then the existing
        candidate list, then x-terminal-emulator; failure message names all
        three tiers.
      - >
        TILLANDSIAS_WINDOW_TITLE is either consumed by a reachable emulator arm
        or removed on Linux.
    events:
      - ts: "2026-08-10T19:30:00Z"
        event: filed
        summary: >
          Filed from the same 2026-08-10 tray exploration; smallest-next-action
          companion to 664-7qzz.
