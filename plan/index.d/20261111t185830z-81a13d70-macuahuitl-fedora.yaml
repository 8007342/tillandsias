packets:
  - packet_id: each-projects-forge-and-mirror-share-a-network-no-other-project-is-on
    order: 2080-2wwn
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    story: blind-sec-v05
    capability_tags: [podman, network, git-mirror, rust]
    estimated_hours: 5
    title: |
      Every forge, mirror, login container, inference engine and router sits on the one shared enclave network, so project A's forge can reach project B's mirror; each project's forge and mirror get a network of their own. Security High.
    context: |
      Both judges (judge 1 packet 2, judge 2 G1). ENCLAVE_NET is the only network in the run arguments; enclave_network_name exists with no caller; spec:podman-idiomatic-patterns already names a per-project network. The unauthenticated receive-pack itself belongs to the credential auditor and to 451; this row only shrinks who can reach a mirror. Multi-machine ruling 2026-11-11: name and address the network so it can later take a /64 from the host's ULA /56 (1800-zk9i, 1800-pj2x) and so a Pi-fleet mirror (1548-7onc) can replace the local one; no single-host-only naming. Narrow slice of 1800-gjqq and 1684-tx37; does not wait for them. Holds separately in the macOS and Windows guests.
    exit_criteria:
      - 'a unit test building run arguments for two projects asserts the two forges share no network and neither forge network contains the other project''s mirror; today both are exactly tillandsias-enclave'
      - 'live arm on each platform: from forge A, git ls-remote against project B''s mirror fails to connect (record the pre-fix result first)'
      - 'project A clone and push still work'
    verifiable_closure: 'cargo test -p tillandsias-headless — per-project network run-args test; red on today''s ENCLAVE_NET-only arguments'
    next_action: 'Nothing is done. Run the live cross-project ls-remote once on today''s build and record refused/read/write/unreachable; then write the run-args test.'
    provenance: blind-design judges 1 and 2; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
    related: [451, 1800-gjqq, 1684-tx37, 1800-zk9i, 1800-pj2x, 1548-7onc]
    events:
      - {type: filed, ts: '2026-11-11T18:58:30Z', host: macuahuitl-fedora, summary: filed p1 from the 2026-11-11 blind-design triage}
  - packet_id: the-podman-secrets-migration-change-is-rewritten-against-the-no-plaintext-at-rest-ruling
    order: 2080-4m4j
    status: ready
    kind: docs
    priority: p2
    desired_release: v0.5
    pickup_role: any
    story: blind-sec-v05
    capability_tags: [openspec, credentials, podman]
    estimated_hours: 1
    title: |
      The open OpenSpec change podman-secrets-migration still proposes podman secret create for tokens and certificates, and podman's default file driver stores secret bytes in plaintext on disk, against the no-plaintext-credentials-at-rest ruling; close it or rewrite it with the ruling cited.
    context: |
      Judge 1 packet 5. 1808-k54d covers the two main specs that describe podman secrets; this row is the open change under openspec/changes/podman-secrets-migration. The 0444 mode of runtime secret files is the credential auditor's.
    exit_criteria:
      - 'openspec/changes/podman-secrets-migration is archived as rejected, or its proposal names an encrypted-at-rest store and cites no-plaintext-credentials-at-rest; today the proposal says podman secret create tillandsias-github-token'
    verifiable_closure: 'bash — grep -c "podman secret create tillandsias-github-token" over openspec/changes/podman-secrets-migration returns 0'
    unscoreable: 'no litmus exists for this one-line check; the claimer runs the command in verifiable_closure and records its output as evidence.'
    next_action: 'Nothing is done. Decide close vs rewrite; close is expected because 1118-fqfk already chose the store.'
    provenance: blind-design judge 1; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
    related: [1808-k54d, 1118-fqfk, 2080-naqg]
    events:
