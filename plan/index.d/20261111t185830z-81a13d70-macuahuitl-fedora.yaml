  - packet_id: images-that-sit-next-to-credentials-build-from-digest-pinned-bases
    order: 2080-73qx
    status: ready
    kind: enhancement
    priority: p2
    desired_release: v0.5
    pickup_role: any
    story: blind-sec-v05
    capability_tags: [supply-chain, containers, lua]
    estimated_hours: 2
    title: |
      The vault, mirror, proxy, router, inference and forge images build FROM tags (hashicorp/vault:1.18, alpine, caddy:2-alpine, fedora-minimal:44) resolved on each user's machine; only four digests are pinned. Security Medium.
    context: |
      Judge 2 G8. images/image-pins.yaml holds four digests and the pin check only validates pins that exist. Mind 1716-t2gi: a single-platform digest builds the wrong architecture, so pins must be manifest-list digests (aarch64 macOS guest, x86_64 Linux and Windows).
    exit_criteria:
      - 'the Lua pin check fails when any FROM in images/{vault,git,proxy,router,inference,default}/Containerfile lacks @sha256:; today it passes with tags'
      - 'each pinned image still builds on Linux x86_64, in the macOS aarch64 guest and in the Windows distro'
    verifiable_closure: 'the extended Lua pin check exits non-zero on today''s Containerfiles and zero after pinning'
    unscoreable: 'unpinnable-until-the-guard-exists: the extended pin check is part of the deliverable; move this into a litmus in the same commit.'
    next_action: 'Nothing is done. Extend the pin check to require a digest on every FROM in the six image directories, watch it fail, then pin manifest-list digests.'
    provenance: blind-design judge 2; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
    related: [1716-t2gi]
    events:
      - {type: filed, ts: '2026-11-11T18:58:30Z', host: macuahuitl-fedora, summary: filed p2 from the 2026-11-11 blind-design triage}
  - packet_id: nothing-the-launcher-wrote-about-a-forge-is-left-after-the-forge-is-removed
    order: 2080-7pa3
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    story: blind-sec-v05
    capability_tags: [logging, privacy, podman, rust]
    estimated_hours: 2
    title: |
      terminal_handoff appends each forge's diverted launcher output to attached-sessions/<container>.log under the state directory, mode 0644, and keeps it after the forge is gone, against the ruling that forge logs die with the forge. Security Low (privacy).
    context: |
      Both judges (judge 1 packet 9 transcript arm, judge 2 G13); symbol terminal_handoff::attached_session_log_path. The debug flags in the same finding are the credential auditor's. The Vault audit file (527 MB, unrotated) depends on open operator question OQ-6 and is not decided here.
    exit_criteria:
      - 'while a forge runs its attached-session file is 0600; after it exits and is removed no file for that container remains (checked over a counted, non-zero set); today the file stays at 0644'
      - 'the same holds in the macOS guest and the Windows distro'
    verifiable_closure: 'cargo test -p tillandsias-headless — a terminal_handoff removal test; red on today''s keep-forever path'
    next_action: 'Nothing is done. Write the removal test against attached_session_log_path, then delete on forge removal and open the file 0600.'
    provenance: blind-design judges 1 and 2; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: []
    related: []
    events:
      - {type: filed, ts: '2026-11-11T18:58:30Z', host: macuahuitl-fedora, summary: filed p2 from the 2026-11-11 blind-design triage}
  - packet_id: the-linux-and-macos-installers-verify-the-cosign-bundle-with-a-pinned-identity
    order: 2080-8mc8
    status: ready
    kind: enhancement
    priority: p2
    desired_release: v0.5
    pickup_role: any
    story: blind-sec-v05
    capability_tags: [installer, release, supply-chain]
    estimated_hours: 3
    title: |
      No installer verifies the cosign bundle the release publishes; after the checksum refusals of 1068-phrh, install.sh and the macOS installer verify the signature with the pinned workflow identity and refuse with one plain sentence when they cannot. Security Medium.
    context: |
      Judge 1 packet 7, slice 2. 1068-phrh owns the three checksum skips (including installing when SHA256SUMS is missing); 1562-hsa8 owns the Windows installer; 1490-aqc7 owns --update. Per installer-is-for-end-users-no-prompts: no prompt, one sentence. The verifier must not need cosign on the user's host (1324-ujvb): verify in the binary (Rust) or in a container.
    exit_criteria:
      - 'a fixture serving a release whose bundle does not verify makes install.sh and the macOS installer exit non-zero with one sentence and leave no binary; today both install'
    unscoreable: 'unpinnable-until-the-guard-exists: the tampered-bundle fixture is the deliverable; write it in the same commit and move this text into verifiable_closure.'
    next_action: 'Nothing is done. Land after 1068-phrh; write the tampered-bundle fixture first.'
    provenance: blind-design judge 1; filed by macuahuitl-fedora, triage 2080-294s.
    depends_on: [the-default-install-path-skips-verification-three-ways-and-never-consumes-the-published-signature]
    related: [1562-hsa8, 1490-aqc7, 1324-ujvb]
    events:
      - {type: filed, ts: '2026-11-11T18:58:30Z', host: macuahuitl-fedora, summary: filed p2 from the 2026-11-11 blind-design triage}
