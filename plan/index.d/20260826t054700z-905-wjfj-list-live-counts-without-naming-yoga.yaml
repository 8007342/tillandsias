packets:
  - packet_id: expire-claims-list-live-counts-without-naming
    order: 905-wjfj
    status: ready
    kind: bug
    pickup_role: any
    priority: p3
    desired_release: v0.5
    depends_on: []
    multi_cycle: false
    next_action: Make `--list-live` print one row per live claim (order, packet_id, host, claimed-at) above its summary, matching what `query --status in_progress` already returns. Then a negative control with zero live claims must print the summary and no rows, so "prints nothing" stays distinguishable from "found nothing".
    deliverable: |
      `tillandsias-plan expire-claims --list-live` names the claims it counts,
      so Start-Of-Cycle step 2a can answer "who is holding what" without a
      second tool.
    capability_tags:
      - plan
      - ledger
      - developer-experience
    tags:
      - claims
      - fail-loud
      - v0.5
    title: |
      `expire-claims --list-live` reports `in_progress=1` and prints no rows, so the step that exists to find sibling overlap cannot see who the sibling is.
    context: |
      FOUND WHILE DOING THE THING THE STEP ASKS FOR. Start Of Cycle 2a
      (`sibling_heads_up_protocol`, landed 2026-08-26) tells a host to run
      `expire-claims --list-live` to see whether a live claim touches the same
      surface as its batch. Run on yoga at 2026-08-26T05:26Z it printed:

        summary: in_progress=1 expired=0 held=0 unknown_age=0 ttl_hours=24 mode=write

      and nothing else. The count is there; the row is not. So the question the
      step exists to answer — WHOSE claim, and does it touch my surface — cannot
      be answered from the tool the step names.

      REPRODUCED ON A SECOND HOST IN THE SAME HOUR. The coordinator ran it
      against the same ledger and also got a count with no rows, then found the
      row immediately with `tillandsias-plan query --status in_progress`
      (it was 831-ezea, methodology/convergence tooling — no overlap with the
      fragments.rs work I was about to start). So the data is present in the
      fold and the summary simply does not surface it.

      WHY THIS IS MORE THAN AN INCONVENIENCE. The heads-up protocol's whole
      argument is that a heads-up is a falsifiable act where care is not. A host
      that cannot enumerate live claims must either broadcast to everyone —
      which the protocol explicitly forbids, because a channel carrying
      everything is one nobody reads — or infer overlap from git log, which is
      what I fell back to. My evidence that the surface was quiet was
      `git log --since=6h` over two paths; the coordinator's answer was
      better, and I only got it by asking a human-equivalent rather than a tool.

      A SUMMARY THAT COUNTS SOMETHING IT WILL NOT NAME is the same shape this
      fleet spent 2026-08-25 cataloguing: a report that reads as information and
      withholds the part that would let you act. It is cheap to fix precisely
      because the fold already has the rows.
    exit_criteria:
      - |
          `expire-claims --list-live` prints one row per live claim — order,
          packet_id, host, claimed-at — above the existing summary line, and the
          summary count equals the number of rows printed.
      - |
          NEGATIVE CONTROL: with zero live claims it prints the summary and no
          rows, so "printed nothing because there is nothing" stays
          distinguishable from "printed nothing because it does not print".
      - |
          The existing summary grammar is unchanged, so any caller parsing it
          keeps working.
    verifiable_closure: |
      A fixture over a scratch ledger with a known number of live claims,
      asserting rows==count in both the non-zero and zero cases. No `litmus:`
      name is declared here: under 885-92iu a declared closure must resolve to a
      bound, file-backed test, and naming one that does not exist yet is the
      defect that packet closed.
    events:
      - type: filed
        ts: "2026-08-26T05:47:00Z"
        agent_id: "linux-yoga-opus5-20260826t054700z"
        host: yoga
        summary: |
          Filed from the first cycle to run Start Of Cycle 2a in earnest. The
          gap was found by using the step rather than by reading it, and
          confirmed on a second host within the hour.
