    criteria_definitions: |
      WL-EXPOSURE — On a GPU/NPU Windows host: does `/dev/dri` exist in the WSL2
        guest? What is in `/usr/lib/wsl/lib`? Is any Vulkan ICD or NPU device
        visible in-guest? Report the commands and their raw output.
      WL-BASELINE — Run `scripts/bench-inference-floor.sh` on a model both hosts
        have, and paste the emitted lines verbatim. The harness derives the
        engine label itself; do not hand-label a run.
      WL-TRAPS — Confirm the three shared traps reproduce (or do not) on your
        host, so each is known to be substrate-wide rather than host-specific.
