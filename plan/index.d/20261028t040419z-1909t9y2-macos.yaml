  estimated_hours: 6
  title: The guest stores the Vault root token and its unseal share as plaintext 0644 files on the persistent identity disk
  context: 'Verified read-only on macOS 2026-10-28 (local build 9140aae47, fresh VM provisioned 2026-10-27 22:57). No file content was printed or copied; the shape was tested with a match that reports only yes or no. /var/lib/tillandsias/identity/fallback_vault-root-token-v1: owner root:root, mode 644, 28 bytes, matches the plaintext `hvs.` Vault token shape. /var/lib/tillandsias/identity/fallback_vault-shamir-share-v1: root:root, mode 644, 44 bytes, beside it. Both were written 2026-10-27 22:57:22. Both live on /dev/vdc, mounted at /var/lib/tillandsias/identity, the disk that survives VM stop and a rootfs rebuild by design (1642-cc54). Writers in vault_bootstrap.rs: write_vm_credential_fallbacks (~3190) does a raw fs::write with NO chmod, which explains the 644; the heal path (~5637) writes and then sets 0600. Every Vault call reads them ("recovered root token from VM fallback file"). This breaks the standing operator rule of no plaintext credentials at rest ("a lost credential beats an unencrypted one"). The token and the share together open the whole store.'
  exit_criteria:
  - 'The operator rules on the fix shape (relayed by macuahuitl-fedora) before any change.'
  - 'Afterwards, no guest file holds the Vault root token or the unseal share in plaintext, and a fixture fails on today''s code.'
  verifiable_closure: 'A guest probe reports no plaintext hvs. token and no plaintext share file on any guest disk.'
  unscoreable: 'unpinnable-until-the-guard-exists: the fix shape awaits an operator ruling, and the fixture lands with the fix (1136-n8sh).

    '
  next_action: 'Hold for the operator ruling via macuahuitl-fedora. Do not change it yet.'
