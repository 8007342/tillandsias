- packet_id: provider-device-sign-in-is-budgeted-by-the-provider-window-not-the-container-default
  order: 1909-t9y2
  status: claimed
  kind: bug
  priority: p1
  desired_release: v0.5
  pickup_role: any
  capability_tags:
  - auth
  - headless
  estimated_hours: 4
  title: A Codex device sign-in is killed at 300 s although its code is valid for 15 minutes
  context: 'Measured on macOS 2026-10-28 with the guest headless run as `--codex-login --debug` and the device flow left unfinished. At 03:58:07 the login container started, at 03:58:08 Codex printed "Enter this one-time code (expires in 15 minutes)", at 04:03:07 `podman rm -f tillandsias-codex-login-1415` ran (exactly 300 s), and at 04:03:08 the error was "Codex sign-in did not finish (it may have timed out)". The cause is that run_codex_device_login_with_qr passes OperationKind::Container.default_budget() (300 s) to a step that waits on a PERSON. The fix: budget the device step from the provider''s own window (Codex 15 min; Claude 300 s), make the message say honestly that the sign-in code expired, and show the remaining time while it waits. The operator''s 14.7 min tray case (23:06 to 23:20:53 on 2026-10-27) does not fit a 300 s kill, so it is traced as a separate item.'
  exit_criteria:
  - 'The Codex device step''s budget comes from the provider''s window, not OperationKind::Container.default_budget(); a fixture asserts the Codex budget is at least 15 min and FAILS on today''s code.'
  - 'When the window expires the terminal line and the tray status say that the sign-in code expired and how to retry.'
  - 'While waiting, the terminal shows the time left on the code.'
  verifiable_closure: 'cargo test -p tillandsias-headless --features tray,listen-vsock codex_device_sign_in_budget_covers_the_code_window'
  next_action: 'Implement after the running darwin gate ends, then open a PR into linux-next.'
  provenance: 'Live measurement by macbookair-macos 2026-10-28; scope set by macuahuitl-fedora.'
  events:
