packets:
  - packet_id: credential-guard-store-and-env-arms-prove-presence-not-push
    order: 1004-8p76
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [credentials, guard, fail-loud, multi-host]
    estimated_hours: 3
    depends_on:
      - credential-guard-passes-green-while-git-push-blocks-on-an-interactive-helper
    owned_files:
      - scripts/check-credential-channel.sh
      - scripts/test-check-credential-channel.sh
    title: |
      check-credential-channel.sh says ok:gh-credentials-store on the PRESENCE of a store file and ok:gh-token-env on the presence of an env var; only the keyring arm reaches the dry-run push probe, so a dead token behind a present store file reads green.
    context: |
      MEASURED on ESMERALDINHA 2026-09-04 by esme-windows, during the v56.9.2.1
      smoke: `scripts/check-credential-channel.sh` printed `ok:gh-credentials-store`
      and exited 0, while `gh auth status` said "The token in keyring is invalid"
      and `git push --dry-run origin windows-next` answered
      `remote: Invalid username or token`. The stored credential is a 40-char
      `gho_` OAuth token, not a PAT; `GET /user` returns 401. The host could not
      push all session and the guard never said so.

      WHY THE GUARD LIES. credential_channel_verdict() in
      scripts/check-credential-channel.sh emits ok:gh-credentials-store (line 325)
      on `[ -s <git-dir>/.gh-credentials ]` — a non-empty file — and
      ok:gh-token-env / ok:github-token-env (lines 330 / 334) on `[ -n "$GH_TOKEN" ]`
      / `[ -n "$GITHUB_TOKEN" ]`. Each returns 0 immediately. The bounded
      `git push --dry-run` probe that 860-g798 added (GIT_TERMINAL_PROMPT=0,
      GCM_INTERACTIVE=never, 45 s bound; line 352 onward) runs ONLY inside the
      keyring arm, after `gh auth status`. So three of the four ok: arms prove
      PRESENCE and one proves PUSH AUTHORIZATION, and all four spell their
      verdict `ok:` — a reader (or the skill that stops on blocked:* and works on
      ok:*) cannot tell them apart.

      SAME SHAPE, DIFFERENT ARM. 860-g798 fixed exactly this defect on the keyring
      arm on 2026-08-23 ("a token that exists somewhere is not a channel git can
      use"); the 2026-08-15 incident was the same class. On 2026-09-04 macneo-macos
      had the same rotted keyring token the same night — its keyring arm reported
      it correctly, which is the control: the probe works where it runs.

      THE TEST ENSHRINES THE DEFECT. scripts/test-check-credential-channel.sh
      scenario 4 (line ~100-106) writes `x` into .gh-credentials with gh stubbed
      to `false` and asserts the verdict IS ok:gh-credentials-store ("repo-local
      store arm unchanged, checked first"). That assertion must flip. The suite
      also pins the hot path to `probes -le 3` invocation sites (line ~333-337),
      so the fix should route every arm through ONE probe function rather than
      copy the `_probe_cmd` block into each arm.

      Provenance: measured by esme-windows on esmeraldinha 2026-09-04 (report
      plan/issues, esme-smoke-e2e-findings-v56.9.2.1); relayed and filed by the
      coordinator on macuahuitl because esme cannot push.
    next_action: |
      LEFT, in order. (1) Factor the 860-g798 dry-run probe out of the keyring
      arm into a function every ok: arm calls before returning 0; keep the single
      TILLANDSIAS_CRED_PROBE_CMD override and the 45 s bound. (2) Decide the
      vocabulary: a store or env arm that reaches the probe and passes reads
      ok:<arm>-push-verified (parallel to ok:gh-keyring-push-verified); one that
      cannot probe (no origin, TILLANDSIAS_CRED_SKIP_GH=1) reads
      ok:<arm>-unverified; a present store file whose probe is REFUSED reads
      blocked:<arm>-push-refused, never ok:. (3) `reverify` calls the same
      credential_channel_verdict(), so it inherits the fix — assert that in the
      test rather than assuming it. (4) Flip scenario 4 and add the fixture arm
      from the exit criteria; keep the probe-count assertion honest (raise the
      ceiling only if the count really rose, and say why).
    exit_criteria:
      - every ok: arm of credential_channel_verdict() reaches the push probe or reads ok:<arm>-unverified
      - a present non-empty .gh-credentials file whose dry-run push is refused yields no ok: verdict
      - GH_TOKEN / GITHUB_TOKEN presence alone does not produce a bare ok:gh-token-env / ok:github-token-env
      - the reverify subcommand covers the same arms and the test asserts it, not the docstring
      - test-check-credential-channel.sh scenario 4 no longer asserts ok:gh-credentials-store on file presence
      - a fixture arm in the test script proves a present store file with a dead token is NOT green
      - callers that grep the literal ok:gh-credentials-store or ok:gh-token-env are updated or shown absent
    verifiable_closure: |
      scripts/test-check-credential-channel.sh exits 0 (it exists today, 25,862 bytes, dated
      2026-09-02). The fixture arm this order needs — a present .gh-credentials file plus a dry-run
      probe stubbed to refuse, asserting no ok: verdict — DOES NOT EXIST YET; it is this packet's
      first deliverable and goes into that script. litmus:credential-channel-check-shape (bound under
      meta-orchestration in openspec/litmus-bindings.yaml) must stay green in the pre-build instant
      suite.
