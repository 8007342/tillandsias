  - packet_id: install-windows-ps1-verifies-only-the-sha256-manifest-and-never-checks-the-cosign-bundles-the-release-ships
    order: 1562-hsa8
    status: ready
    kind: defect
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    pickup_role: windows
    capability_tags: [windows, installer, supply-chain, cosign, signing]
    estimated_hours: 3
    owned_files:
      - scripts/install-windows.ps1
    title: |
      install-windows.ps1 checks the downloaded zip against SHA256SUMS-windows but never verifies a cosign signature, although the release ships a .cosign.bundle for the zip, the exe, the installer and the manifest; the SHA-256 manifest comes from the same place as the zip, so it only proves the download was not truncated
    context: |
      Measured in the v56.10.8.1 Windows smoke (yolanda-windows 2026-10-08):
      the installer printed "Fetching SHA256SUMS-windows...", "Verifying
      SHA-256..." and "sha256: ok (54836fc8...)" and NO cosign or signature line
      at all. The release assets include install-windows.ps1.cosign.bundle,
      SHA256SUMS-windows.cosign.bundle, tillandsias-tray.exe.cosign.bundle and a
      bundle per zip. Distinct from 1273-4mak, which is about the release SMOKE
      verifying signatures; this row is the END-USER installer. Constraint:
      operator ruling 2026-10-08, the installer is for end users and prints no
      power-user text, so a verification is silent on success and a failure is
      one plain line plus the log path (1561-9f4x). Where cosign itself comes
      from on an end user's Windows host (bundled verifier vs a pinned
      download) is part of the design and an operator question if it adds a
      download.
    exit_criteria:
      - 'the installer verifies SHA256SUMS-windows (and through it the zip) against its cosign bundle before trusting the manifest, and refuses to install on a bad signature, with one end-user line and the log path (pre-fix: no attempt at all)'
      - 'a fixture tampers the manifest or the bundle and the installer refuses; an untampered release passes silently'
    verifiable_closure: |
      The tamper fixture plus one recorded curl install of a signed tag showing
      the verification in the install log.
      unscoreable: unpinnable-until-the-guard-exists — the fixture is the deliverable.
