packets:
  - packet_id: three-more-scripts-infer-remote-podman-from-a-socket-file
    order: 798-rvqb
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "build-forge.sh, run-forge-standalone.sh and scripts/run-safe-browser.sh still infer remote-podman mode from ${XDG_RUNTIME_DIR}/podman/podman.sock existing — the same defect 797-r6tc removed from build.sh, in three launchers that are not on the gate path"
    deliverable: "each of the three either drops the inference (a caller that wants remote mode exports TILLANDSIAS_PODMAN_REMOTE_URL, as the systemd unit does) or keeps it with a stated, tested rationale; run-safe-browser.sh's hardcoded uid 1000 goes either way"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [podman, fail-loud, forge]
    estimated_hours: 3
    context: |
      OBSERVED, macuahuitl 2026-08-17, while establishing who wanted remote
      mode for 797-r6tc. Four scripts in this tree synthesize
      TILLANDSIAS_PODMAN_REMOTE_URL from a socket file's existence. build.sh
      was one and is fixed. The other three are:

        build-forge.sh:82-93          — with a `podman --remote --url ... info`
                                        reachability probe and a _step/_warn
                                        pair, i.e. somebody thought about this
                                        one; it is the least likely to be
                                        accidental.
        run-forge-standalone.sh:10-16 — bare, no probe, no comment.
        scripts/run-safe-browser.sh:37-39
                                      — bare, no probe, and it hardcodes
                                        /run/user/1000 instead of $(id -u), so
                                        on any other uid it silently does
                                        nothing while reading as if it does
                                        something.

      WHY THIS WAS FILED RATHER THAN FIXED WITH 797-r6tc. Neither build.sh nor
      scripts/local-ci.sh invokes any of the three (verified by grep), so none
      of them is on the gate path and none was blocking the release. Deleting
      the inference in build-forge.sh in the release hour would have been the
      same move the 797-r6tc packet forbade: removing something because it is
      convenient, without checking who wanted it. build-forge.sh's probe in
      particular is evidence that ITS author had a reason, and finding that
      reason is the work.

      INFERRED, and the first thing to test: that these three are the same
      accident rather than three deliberate decisions. The provenance check
      that settled build.sh (4650c8f9f, no rationale, no packet) has not been
      run for these three.

      NEGATIVE CONTROL THE FIX SHOULD CARRY: the fixture already exists.
      scripts/test-gate-podman-mode-configuration.sh sandboxes a script with a
      real AF_UNIX socket where the inference looks and asserts the caller's
      choice survives; extend it per script rather than writing a new one.
  - packet_id: remote-podman-is-a-mode-the-gate-cannot-validate
    order: 798-9xpq
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "an operator who legitimately sets TILLANDSIAS_PODMAN_REMOTE_URL cannot run a valid litmus gate — common.sh's remote branch exports TILLANDSIAS_PODMAN_BIN, which beats PATH in the Rust resolver and defeats every `backend: fake` fixture"
    deliverable: "a litmus run under an explicitly-configured remote podman either produces the same verdicts as a local one, or refuses up front and says the gate cannot validate this mode; a fake-backend fixture must not be able to silently exercise real podman"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [podman, litmus, gate, fail-loud]
    estimated_hours: 5
    context: |
      OBSERVED, macuahuitl 2026-08-17, as a side finding of 797-r6tc.

      797-r6tc removed the gate's habit of PUTTING ITSELF into remote mode. It
      did not make remote mode testable. A host that is supposed to be there —
      the dedicated service account of
      cheatsheets/runtime/dedicated-service-account-podman.md, whose systemd
      unit sets TILLANDSIAS_PODMAN_REMOTE_URL on purpose — still gets the 3
      failures the packet measured, for the same mechanism:

        scripts/common.sh, remote branch: `export TILLANDSIAS_PODMAN_BIN="$PODMAN"`
        resolve_podman_bin() in crates/tillandsias-podman/src/lib.rs:
          TILLANDSIAS_PODMAN_BIN is read BEFORE PATH is walked
        the generated remote wrapper additionally unsets LITMUS_PODMAN_MODE,
          LITMUS_PODMAN_STATE_DIR and LITMUS_PODMAN_CALLS_FILE

      So the harness's two injection channels — PATH and the LITMUS_* env — are
      both overridden by the mode, and a `backend: fake` fixture cannot tell.
      That is a fail-open test double at the environment level, the same class
      as 797-p2xa one layer up.

      WHY IT IS p2 AND NOT p0: nothing currently runs the gate in that mode.
      The one production consumer runs `tillandsias --headless`, not litmus.
      The severity is that the mode is unvalidated, not that it is broken for
      anyone today.

      NOT INFERRED: the pin and the unset are both read straight from the
      source. INFERRED: that fixing it is best done by having the litmus runner
      neutralize an inherited TILLANDSIAS_PODMAN_BIN for `backend: fake` tests
      rather than by changing common.sh — that is a proposal, not a finding,
      and the alternative (refuse up front) may be the better answer since a
      gate that quietly adapts is how this whole packet family started.
