    verifiable_closure: |
      On a host whose vault image predates the 1134-u934 fix, the fixture says
      SO — it names the image vintage as the reason — instead of printing
      "vault's shutdown path is the 1134-u934 defect".
    owned_files:
      - scripts/test-vault-shutdown-forwards-sigterm.sh
    title: |
      scripts/test-vault-shutdown-forwards-sigterm.sh asserts against the RUNNING container, so on any host whose enclave predates the fix it reports the fix as absent — which after 1134-u934 landed is every installed host until it rebuilds
    context: |
      MEASURED ON YOGA 2026-09-13, minutes after merging work/1134-u934 and
      BEFORE any rebuild, with the fix present in the source tree:

        bash scripts/test-vault-shutdown-forwards-sigterm.sh
        measured: elapsed=30s exit_code=137 oom_killed=false grace=30s
        bad: stop took 30s of a 30s grace — SIGTERM is not reaching vault (1134-u934)
        bad: ExitCode 137 — the container was SIGKILLed at the end of the grace (1134-u934)
        FAIL: vault's shutdown path is the 1134-u934 defect
        rc=1

      The verdict is FALSE ABOUT THE SOURCE and TRUE ABOUT THE HOST. yoga's
      vault image was built 2026-09-11T19:09 local, 23 hours before the fix
      existed, and the running container is that image. The entrypoint on disk
      already carries the trap. The fixture measured what is INSTALLED and
      reported it as a statement about what is COMMITTED.

      WHY THIS IS NOT COSMETIC. The relay describing this fix said the fixture
      "routes to exit 3 could-not-run elsewhere". It does not, and the
      difference matters: could-not-run is reachable only for no-podman,
      no-container, container-would-not-start, and never-became-healthy
      (:44-:67). A host with a live but STALE enclave takes none of those — it
      takes the measurement path and returns 1. So the honest trichotomy
      (passes / cannot run / is broken) is missing its fourth case, and the
      fourth case is the COMMON one immediately after this fix lands: the same
      relay notes the tray embeds the image sources, so no installed host gets
      the fix until the next daily is cut. Between now and then, every host
      that runs this fixture by hand is told its source is broken when its
      image is merely old.

      THE CLASS, which is why it is worth a row rather than a comment: this is
      host-dependent red before code defect. A fixture that measures a
      deployed artifact while living in the repo that defines it will disagree
      with its own tree for the whole interval between a fix landing and that
      host rebuilding, and the disagreement is indistinguishable from the
      defect it was written to catch. 965-sxec's rule applies unchanged — a
      check that could not evaluate the thing it names must not report a
      verdict about it.

      NOT GATE-WIRED, and that is the only reason this is p2 rather than p1:
      no build.sh step, no gate-steps.d entry, no local-ci check references it
      (searched all three). It reds a human running it by hand, not the fleet's
      landings. If anyone wires it into a gate before this row is fixed, it
      reds every host whose image is behind trunk and the priority changes.
    exit_criteria:
      - "On a host with a live enclave whose image predates the fix, the fixture reports the VINTAGE as the reason and does not claim the 1134-u934 defect is present. Pre-fix result: FAILS, measured on yoga 2026-09-13 (rc=1, the transcript above) with the fix in the source tree."
      - "The image-vintage check is evidence, not inference: compare something the IMAGE carries against something the TREE carries (image build timestamp vs the commit that last touched images/vault/entrypoint.sh, or a label baked at build time). Deciding from the host's git HEAD alone would pass on a host that never rebuilt, which is the exact case this row is about."
      - "The four outcomes stay DISTINGUISHABLE in the exit code, not only in the prose: passes, could-not-run (no podman/container), stale-image, and genuinely-defective must not share an exit code. A stale image collapsing into either 0 or 1 recreates the defect in the other direction."
      - "NEGATIVE CONTROL: on a host whose image DOES carry the fix, the fixture still detects a real regression — reverting the trap in the image must still produce the FAIL verdict. A vintage check that short-circuits the measurement would make the fixture unable to fail at all, which is worse than the defect it fixes."
