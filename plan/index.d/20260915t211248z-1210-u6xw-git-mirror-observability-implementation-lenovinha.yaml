    title: |
      The git mirror is a critical backbone with no runtime monitoring: the six observability requirements 330 enumerated are still unimplemented, so relay health is only knowable by reading logs.
    context: |
      SPLIT OUT OF 330 WHEN IT CLOSED. Order 330 had two halves: a build-vs-adopt
      evaluation (ratified KEEP by The Tlatoāni 2026-09-15) and observability. Its
      criterion 3 asked for the observability requirements to be ENUMERATED as
      litmus-pinnable statements, and they are — six of them, in
      cheatsheets/concurrent-git/git-mirror-managed-alternatives.md. Enumeration
      is not implementation, and closing 330 on a met criterion would have buried
      the open work inside a completed row. This is that work.
      THE SIX, restated here so this row does not depend on a cheatsheet read:
        1. RELAY QUEUE DEPTH — ref transactions accepted by the mirror but not yet
           acknowledged upstream, observable at any instant. With a synchronous
           relay this is normally 0 or 1; a persistently non-zero depth means the
           relay has begun buffering, which the design says cannot happen.
        2. LAST SUCCESSFUL RELAY PER REF — per exported ref, not per repo. A
           repo-level "last push" hides one branch that stopped advancing.
        3. PER-REF DIVERGENCE — whether the mirror's OID equals upstream's, and
           since when if not. Transient divergence is expected; sustained is
           pathological.
        4. ACK LATENCY AS A DISTRIBUTION, not a mean. The TAIL is what an agent
           experiences as a hang, and a mean hides it.
        5. PRE-RECEIVE REJECTS COUNTED BY REASON (non-fast-forward, deletion
           refused, fsck failure, policy gate). "Rejects went up" is only
           actionable with the reason attached.
        6. CREDENTIAL-REFRESH FAILURES distinguished from network failures — the
           two have different operators and different fixes. 756-2jnj is the live
           example: a 403 on the mirror's credential was indistinguishable from
           unreachability until the verdict ref was published.
      TRANSPORT IS DECIDED, not open: these ride the CONTROL WIRE per order 323,
      not a new TCP endpoint — the same reasoning that put guest container metrics
      on the wire in order 333, since a host that cannot reach a guest TCP port
      cannot read guest-only facts.
      THE ANTI-REQUIREMENT IS THE LOAD-BEARING PART. None of these may be
      satisfied by a fabricated healthy value when collection fails. A collection
      failure reports the error with the value ABSENT (spec:observability-metrics).
      A metric that reads healthy when it cannot be measured is worse than a
      missing one, and this fleet has spent the last day finding instances of
      exactly that shape.
      WHY IT IS WORTH DOING, from 330's own corollary: the mirror's reliability
      failures have never been architectural. They concentrate in the credential
      lifecycle and the serving layer — signals 6 and 1-4 respectively. That held
      again on 2026-09-15 when a desktop autologin left this host's keyring locked
      and the credential was absent by construction.
    exit_criteria:
