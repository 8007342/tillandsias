# Filed by linux_mutable (macuahuitl), 2026-08-17: both observations the
# 783-xyk5 fork recorded rather than folding into its own scope.
packets:
  - packet_id: fragment-status-guard-skips-events-only-fragments
    order: 785-sqe6
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "check-fragment-status-loss.sh exits early when NO fragment declares a status, so a fragment carrying only a terminal EVENT is never examined — the exact class its second pass exists to catch"
    deliverable: "the closure-event pass runs independently of the status-declaration pass; a fragment with events and no packets: block is still examined, with a fixture pinning it"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [guards, plan-tooling, fail-loud, coverage]
    estimated_hours: 1
    context: |
      Found 2026-08-17 by the 783-xyk5 batching fork, which preserved the
      behavior rather than silently changing it (correct call — an
      optimization must not smuggle a semantics change).

      The guard's line ~57 reads: if no fragment declares a (packet_id,
      status) pair under a `packets:` list, print
      `ok:no-fragment-status-loss:0 checked` and EXIT 0. But the second
      pass — terminal `type: completed` EVENT with no matching status
      transition — needs no status declaration at all to be meaningful. A
      cycle whose fragments are pure `events:` appends (the common shape
      for set-field/append-event output) therefore gets the event pass
      skipped entirely while the verdict says ok.
      This is the guard's OWN failure class: the second pass was added
      (752-pst5, three hosts independently) precisely because a completion
      recorded only as an event leaves the packet claimable forever, and the
      early exit makes that pass unreachable on exactly the fragment shape
      most likely to carry it. Verified live 2026-08-17: this checkout's
      compacted state reports `2 checked`, so the pass is running here —
      the hole opens whenever the declaration count reaches zero.
  - packet_id: build-step-timing-is-banner-to-banner-not-per-step
    order: 785-ibu9
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "765-dfry step records span banner-to-banner, so a step's duration can bundle work that is not that step's — a single step number is not safe to attribute"
    deliverable: "either the emitted record measures the named step's own work (close the phase when its work returns, not when the next banner prints), or the grammar/field name says 'span' and the cycle-metrics slowest= line is documented as coarse"
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags: [telemetry, velocity, accuracy]
    estimated_hours: 2
    context: |
      Recorded 2026-08-17 by the 783-xyk5 fork, and it CORRECTS A CLAIM THIS
      HOST MADE the cycle before: reading
      `step:checking-for-fragment-status-transitions-the-fold-discards =
      10470ms` I filed 783-xyk5 saying "one guard is ~60% of every --check".
      The optimization was real and worth doing (the fork measured the guard
      itself at 3.340s -> 0.383s, 8.7x, same workload same binary), but the
      60% attribution was inflated: build.sh's `_step` closes the previous
      phase when the NEXT banner prints, so a record can include work between
      the two banners that the named step did not do. The fork saw the extreme
      case — a guard costing 5ms directly appearing as ~1.5s as a step record.

      Measured consequence of the fix on this host, stated honestly because
      the confounders are real: gate 17363ms -> 7762ms, with BOTH the batching
      fix and a shrunken fragment workload (24 declared pairs -> 2 after
      compaction) contributing; the clean controlled number is the fork's
      8.7x on identical input. The telemetry is still a large win — it is the
      reason the guard was found at all — but `slowest=` should not be read
      as "this step costs this much" until this packet closes.
      Do NOT weaken the signal to fix the precision: the 682-emvg contract
      (best-effort, never alters exit codes) and the finest-grain `slowest=`
      preference both stay.
