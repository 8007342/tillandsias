packets:
  - packet_id: mo-full-attestation-ledger-accepts-only-one-entry-per-host
    order: 742-ye7w
    status: implemented
    desired_release: v0.5
    priority: p0
    release_target: fail-loud-diagnosis-milestone
    kind: bug
    title: "The durable MO-FULL attestation ledger refused any host file with a SECOND attestation — every host's second full-mode cycle could not push"
    deliverable: "a ledger that accumulates, pinned by a litmus that nothing had"
    pickup_role: any
    capability_tags: [attestation, fail-loud, meta-orchestration, fleet-blocker]
    estimated_hours: 1
    context: |
      FOUND 2026-08-15 on tlatoani, on the SECOND full-mode cycle of the night —
      the first cycle a host could possibly hit it.

      `scripts/check-mo-full-attestations.sh` (landed hours earlier with 651-2x5s)
      paired each `## <ts> <host>` heading with its marker line. The heading
      branch read:

        '## '*)
            if [ "$heading_marker" -ne 0 ]; then
                refuse "$f" "heading at line $ln has no following marker line"

      `heading_marker` is set to 1 when a marker IS seen. So the condition fires
      exactly when the previous heading was correctly paired — the opposite of
      its own error message. The EOF check twenty lines below uses the correct
      sense (`-eq 0` → refuse), which is what makes the inversion visible on
      reading.

      OBSERVED, not theorised. The ledger held two well-formed, remote-reachable
      attestations:

        ## 2026-08-15T00:14:14Z yoga
        MO-FULL: COMPLETE a174e3cc… linux-next a174e3cc…
        ## 2026-08-15T00:22:15Z yoga
        MO-FULL: COMPLETE f7d82adc… linux-next f7d82adc…

      Both SHAs verified reachable from origin/linux-next. `./build.sh --check`
      still returned `violation:mo-full-attestations:1`, and since that gate is
      the trunk's only protection, the push was refused. `mo-full-attest.sh self`
      then correctly declined to emit a marker for an unpushed HEAD. The cycle
      was wedged with green work it could not land.

      BLAST RADIUS: fleet-wide and imminent. The ledger is per-host and
      append-once-per-cycle, so EVERY host — linux, windows, macOS — hits this on
      its second full-mode cycle after adopting 651-2x5s. A host that adopted it
      today and ran overnight would wedge on cycle 2 and stay wedged.

      ROOT CAUSE OF THE ROOT CAUSE: no litmus pinned this checker. It is wired
      into `./build.sh --check` as trunk protection, and nothing tested it. The
      inversion could not have survived a single multi-entry fixture.
    outcome: |
      A per-host ledger accumulates attestations across cycles, and the pairing
      rule that keeps it parseable is pinned by a test that would have caught
      this before it shipped.
    exit_criteria:
      - "A ledger file with two or more correctly-paired attestations is ACCEPTED (regression fixture)."
      - "NEGATIVE CONTROLS retained: trailing heading with no marker, heading immediately followed by another heading, two markers under one heading, marker before any heading, and LOCAL_SHA != REMOTE_SHA are each still refused."
      - "A litmus pins the checker, and the fixture demonstrably FAILS when the inverted condition is reintroduced — verified by mutation, not by inspection."
      - "The fixture is isolated: it must exercise a throwaway ledger, not the repo's real one."
    notes: |
      The fixture's own first draft `cd`-ed into a temp repo, but the checker
      resolves ROOT from its own `BASH_SOURCE` and `cd`s there — so every
      scenario silently validated the REAL ledger and all five negative controls
      "passed" while testing nothing. The fixture now copies the script into the
      throwaway repo's `scripts/` dir. Worth remembering for any other checker
      fixture in this repo: these scripts relocate themselves to the repo root.
    events:
      - type: filed
        ts: "2026-08-15T00:35:00Z"
        host: linux_immutable
        agent_id: tlatoani-linux-immutable-20260814
        summary: |
          Found when this host's second full-mode cycle could not push. Two
          valid, reachable attestations in the ledger; gate returned
          violation:1.
      - type: implemented
        ts: "2026-08-15T00:35:00Z"
        host: linux_immutable
        agent_id: tlatoani-linux-immutable-20260814
        summary: |
          Heading branch now refuses only when the PREVIOUS heading got no
          marker (seen_heading -ne 0 && heading_marker -eq 0). Added a fixture
          mode with the multi-entry regression plus five negative controls, and
          litmus:mo-full-attestation-ledger-shape to pin it — the checker had no
          test at all, which is how an inverted condition reached trunk
          protection. Reintroducing the inversion flips the multi-entry and
          three-entry scenarios to FAIL. Real ledger now verifies:
          ok:mo-full-attestations:2 files 2 markers.
