        INDEPENDENT VERIFICATION OF THIS PACKET'S NUMBERS, by the coordinator,
        on the merged tree rather than in the fork's worktree.

          warm hit, three consecutive runs : 0.14s, 0.14s, 0.14s
            verdict ok:spec-index:fresh:18345
          after `rm -rf /dev/shm/tillandsias-experts/spec-index` : 0.14s,
            verdict ok:spec-index:fresh:18345

        That second line is the packet. The old location was tmpfs; deleting it
        used to mean a full rebuild, and now it means nothing at all, because
        the index lives in the podman volume
        tillandsias-spec-index-tillandsias. The durable tier is real and the
        ephemeral tier can be destroyed without touching it.

        `--where` also earns its place immediately: run in this session it
        prints serving=/mnt/c/Users/bullo/... — surfacing the stale
        FORGE_SPEC_INDEX_DIR of 789-nc2s in one command, where previously it
        took reading a refusal message and grepping the environment. Run with
        the variable unset it resolves to the volume correctly. Worth a small
        follow-up: with the override set it still reports `entries=3` while
        omitting the `root=` line, so it counts entries the overridden path
        does not have. Reporting a count for a location that does not exist is
        the shape this milestone keeps removing; it is a nit here only because
        the line above it already names the real problem.

        HELD AT `implemented` CORRECTLY: no forge image is baked, so the
        read-only mount into a forge is unexercised. The bare-metal half is
        verified above.
