      summary: >
        CORRECTION TO MY OWN MECHANISM CLAIM, AND THEN A CORRECTION TO THE CORRECTION. My previous note said "because the trap runs last, ITS status became the script's exit code". That is too general and esme-windows was right to measure it rather than accept it. But their narrowing is not exactly right either, and the honest conclusion is that neither of our models predicts the real scripts.  esme measured on bash 5.3.15 that it takes THREE conditions - set -e, a fall-off-end ending, and a failing-capable trap - and that an explicit exit 0 or exit 7 is NOT overridden. Measured here on the same bash version, isolated, three files:    set -e   + explicit exit 0 + failing trap  -> rc=1   (overridden)   no set -e + explicit exit 0 + failing trap  -> rc=0   set -e   + explicit exit 7 + failing trap  -> rc=1   (7 rewritten to 1)  So on this host an explicit exit does NOT protect under set -e, which contradicts their rows 1 and 4 and would make the vulnerable set larger than 32, not smaller.  THEN I TESTED THE REAL SCRIPT AND NEITHER MODEL HELD. scripts/archive-plan-packets.sh has all the stated preconditions - set -e at line 9, trap _archiver_cleanup EXIT INT TERM, a bare rm -rf in the cleanup body, and twelve exit 3 sites - so I expected its could-not-run contract to be destructible, which would have been a hole in the 965-sxec fix I landed hours earlier. Injected a guaranteed-failing command into _archiver_cleanup and ran the no-ruby path:    failing cleanup  -> exit 3   (contract intact)   working cleanup  -> exit 3  The exit 3 SURVIVES. The difference from my minimal harness is that the trap is a FUNCTION rather than a single command, and errexit's behaviour inside a trap handler differs between the two. So the 965-sxec contract is NOT at risk, which is the outcome that matters, and I am recording it as measured rather than reasoned.  WHAT TO TAKE FROM THIS, and it is a methodology point rather than a bash point. Three models were offered - mine, esme's, and mine again after theirs - and all three mispredicted at least one real case. The predicates interact with errexit, function-vs-command traps, and the ending form in ways that are not worth deriving. THE ONLY RELIABLE ANSWER IS TO MEASURE THE SCRIPT IN QUESTION. A sweep driven by any of these models would have been wrong: esme's would have skipped scripts that are vulnerable here, mine would have flagged archive-plan-packets.sh which is not.  THE REMEDY IS UNCONDITIONAL AND THAT IS WHY IT IS THE RIGHT ONE. Making a cleanup incapable of failing costs nothing, needs no model of when it would have mattered, and is correct on every host and every bash. rm -rf "$X" 2>/dev/null || true. Applied to test-sync-image-cheatsheets-for-commit.sh, which is the one case MEASURED to flip - it printed PASS and all seven oks and then failed its gate step on this host.  esme's 32-of-151 inventory is still the right shape for a sweep even though its filter is wrong: the useful part is that most trap sites are not worth touching, and the two they named deserve naming for the irony - test-gate-stamp-must-be-earned.sh can emit an unearned red, and test-meta-orchestration-dirty-tree-safety.sh guards dirty trees while being able to fail for a reason unrelated to dirt. Whoever sweeps should measure those two first rather than pattern-match all 151.
