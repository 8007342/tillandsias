        summary: |
          Found while re-measuring order 552's re-embed budget on the sanctioned
          dev-inference endpoint. Not a performance defect — a silent data-loss
          defect in the RAG index, caught before 552 ships. Performance cost of
          fixing it is negligible: splitting the 11 offenders adds ~17 chunks to
          a 9,909-chunk corpus, about 12s of one-time full-rebuild cost out of
          ~115 min, and nothing measurable on the delta path (re-embed is free
          on 96% of commits). The only real cost is the retrieval-unit change,
          which is why that is an explicit exit criterion rather than an
          implementation detail.
