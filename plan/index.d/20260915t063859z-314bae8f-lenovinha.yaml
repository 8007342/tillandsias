        BOTH TOKEN KINDS, ADDITIVELY, on the operator's direct instruction in this lane: first that a durable blocker must name a CAPABILITY rather than a host, because the fleet is an implementation detail — hosts, hardware, agents and harnesses all ephemeral and converging on forge; then, asked to choose between capability and host keying, "use both: CRDT style". So a colon-bearing token (kind:macos, schedulable:npu, tier:gpu-rocm) matches whatever host answers to it, drawn from the vocabulary the capability matrix already publishes, and a bare token matches that host by name. Union, not choice: two writers can name the same block differently without knowing about each other, and the fleet-wide `status blocked --host` convention is read through the bare-token path, so the two decisions compose rather than competing. Capability is derived at READ time, so nothing goes stale when a host is renamed.

        NOT OVER-APPLIED (macuahuitl's distinction, built into the code comment): a CLAIM is transient and legitimately host-keyed — the selector needs it to separate concurrent hosts — while a BLOCKER is durable. Same field family, opposite lifetimes. Stripping host keying from claims would break claiming.

        DEFECT 2 IS THE FINDING OF THE NIGHT and was not in the row as filed: the WEDGED branch was evaluated BEFORE the blocked branch and returned first, so a host that keeps COMMITTING never reached the blocker lookup — and filing what blocked you IS a commit. macbookair filed three packets during the window. Proven by falsification, not argument: against the pre-fix script the arm covering the ORIGINAL plan/issues markdown source ALSO fails. So 864-w7rc's blocked detection has only ever worked for SILENT hosts, on top of macneo's measurement that its trigger value was written twice in project history. Doubly dead, and the second half is not something a history search could have found.

        MY OWN FIRST DRAFT HAD THE SAME CLASS OF BUG THE ROW IS ABOUT, caught by the fixture: the parser listed plan/index.yaml unconditionally, and awk aborts on a missing operand WITHOUT running its END block, so a tree without that file (a fresh clone, a scratch tree, a forge mounting only fragments) reported "no blockers" rather than "could not look" — silently, because 2>/dev/null hid the reason.

