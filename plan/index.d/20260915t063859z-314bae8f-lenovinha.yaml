        THE EXIT CRITERIA THIS ROW WAS FILED WITH WERE WRONG, and the correction event above records the measurement that showed it. What shipped is not what the criteria described, so state plainly what IS true now:
          - criterion 1 as written (a host whose only blocker record is a ledger packet reads blocked, not wedged) IS met, for the signal that now exists: a packet whose folded status is blocked and whose blocked_by names a token this host answers to.
