      summary: |
        CORRECTION TO THIS PACKET, ARRIVING ~40 MINUTES AFTER IT CLOSED. The
        story-bundling change raises SERVICE, and service is exactly the wrong
        lever: measured lambda = 2.2 + 1.80*mu means every additional closure
        buys 1.8 new rows. dL/dt = 2.2 + 0.80*mu is strictly increasing in
        throughput, so bundling makes the ready queue diverge FASTER, not
        slower (831-ezea).

        THE CHANGE IS STILL RIGHT AND SHOULD NOT BE REVERTED. It is correct on
        the axis it was made for — orchestration overhead, where 155
        attestation-only commits in three days against single-digit product work
        is a real and separate defect, and amortising a fixed exit cost over a
        story is the only lever that does not weaken the exit contract.

        But it does NOT fix convergence, and I presented it in a context where
        the operator could reasonably have read it as if it did. Bundling and
        arrival-routing are complements: raise throughput WITHOUT 831-ezea and
        the queue grows faster; land 831-ezea first and throughput becomes safe
        to raise. If only one ships, it should be 831-ezea.
