# From a 6-lens research workflow (14 agents) with adversarial refutation.
# ZERO of seven empirical claims survived that pass — including one about this
# host. The design below rests on the refuters' numbers, not the finders'.
#
# ONE packet, deliberately. The design's own arrival rule says a finding becomes
# a ROW only if it is independently schedulable; wave 1 is, the rest are
# next_action clauses on it.
packets:
  - packet_id: three-horizon-cycle-model-arrival-control-by-routing
    order: 831-ezea
    status: ready
    desired_release: v0.5
    priority: p0
    kind: enhancement
    multi_cycle: true
    title: "the ready queue cannot drain at ANY service rate — arrival is a function of service with slope 1.80 — because the only carry-forward act the loop enforces is filing a new row"
    deliverable: "carry-forward becomes a set field with a gate, so a finding becomes a ROW only when it is independently schedulable; b falls from 1.80 toward 1.0"
    pickup_role: any
    release_target: convergence-velocity-milestone
    capability_tags: [methodology, convergence, plan-tooling, velocity]
    estimated_hours: 10
    context: |
      THE MEASUREMENT THAT CHANGES THE PROBLEM. Ready L = 411 (289 eligible),
      arrivals 31.4/day, drains 10.5/day, dL/dt = +20.9/day. Regressing daily
      arrivals on daily closures:

          lambda = 2.2 + 1.80 * mu      (r = 0.868)
          dL/dt  = lambda(mu) - mu = 2.2 + 0.80 * mu

      That is STRICTLY INCREASING IN THROUGHPUT. It is zero at mu = -2.75. There
      is no non-negative service rate at which the ready queue drains, and
      ADDING HOSTS DIVERGES FASTER. Every budget written in the methodology caps
      SERVICE; the only rule governing ARRIVAL is "file every finding".

      WHY b = 1.80, and this is the root cause of everything else here. The
      NEXT-RUNS horizon the operator asked for is NOT missing: it is fully
      specified at methodology/distributed-work.yaml:478-540 with THREE
      sanctioned carry-forward outcomes — next_action, split_into, obsoleted —
      and it has ZERO adoption across all 130 recent fragments. None of the
      three exists in plan/schema.yaml, while FILING A NEW ROW is the only
      blocking exit condition the loop enforces. So the loop does not fail to
      think about the next run; it is structurally channelled into the one
      carry-forward act that makes the next run worse.

      THE PICK — ARRIVAL CONTROL BY ROUTING, NOT REFUSAL:

        A finding becomes a ROW only if it is INDEPENDENTLY SCHEDULABLE.
        Otherwise it is a next_action clause, or an event on an existing row.

      Independently schedulable = it names owned_files no open row already owns,
      OR it is claimable by a different pickup_role than every open row covering
      that scope. Both predicates are ALREADY COMPUTED — answer.rs:1570-1584
      builds claimed_files from owned_files, and main.rs:3195 does the same in
      the batch selector. Nothing new is measured. Stability needs b < 1; b=1.80
      needs a 44% cut in new ROWS per closure with ZERO cut in findings captured.

      THE CARRY-FORWARD ARTIFACT IS next_action, ON PACKETS THE CYCLE TOUCHED
      AND LEFT OPEN — never on ones it closed. Load-bearing test: a field is
      load-bearing iff a reader in the cold-start path already prints it AND its
      population can be non-empty today. next_action passes both —
      answer.rs:1511 next_action_snippet, printed at answer.rs:1664 as the
      `next:` line of every plan_next row, with 350 rows currently falling
      through to `title`. A "what would have made this cheaper" field at CLOSURE
      fails the first test: it lands on a terminal row no selector reads again.
      Required shape, three clauses: the first move (a command or file:line, not
      a goal); the refuted move (what was tried and what it produced — this is
      where horizon -1's "what has been tried" lives, on the row the next agent
      reads rather than in prose it will not); optionally the substrate
      prerequisite.

      REJECTED, WITH REASONS, so they are not re-proposed:
        * service-rate increase — arithmetically impossible, see above;
        * WIP limit — in_progress is 0-3, the constraint cannot bind;
        * filing cap as the PRIMARY lever — simulated against 25 live flow
          records it is already satisfied in aggregate (30 filed <= 35 closed),
          only 5/25 cycles violate, and enforcing it blocks 12 filings against
          +187 total / +62 open growth: 6.4% and 19%. It shaves a heavy tail and
          leaves the mean. The one filing cap that DOES exist (829-dkuc) is
          scoped to the de-slop sweep for a stated reason and generalising it
          deletes its own premise;
        * a new `affordance` packet kind — a third object with no reader;
        * a standing next-run queue — a second queue over a queue at rho~3;
        * broadening order 264's split rule to "would be cheaper next run" —
          ACTIVELY HARMFUL. Split already fires on budget overrun, and with
          b=1.80 split is a machine for manufacturing arrival at exactly the
          moment service saturates.

      THE 100-ROW BLACK HOLE, which rewrites the operator's staleness question.
      257 of 367 ready packets (70%) have NEVER been worked — zero progress /
      claim / completed / verified / blocked / falsified events, ever. 100 of
      those 257 carry NO priority at all, which puts them in priority_rank's
      rank-9 bucket (answer.rs:1470-1478), BELOW p3, in a TOTAL order with no
      tiebreaker that can ever promote them. The ready queue is not a stale
      queue; it is a warm, never-touched queue with a structurally unreachable
      floor. An age-based TTL would not have touched it. The fix is a
      packet-level neglect term in select-work-batch.sh, not randomness.

      WAVE 1 (one cycle): `tillandsias-plan carry-forward-check <fragment.yaml>`
      wired into build.sh beside check-fragment-status-loss.sh; +5 lines inside
      distributed-work.yaml:478-540 against -13 budget-restatement lines at
      :1404-1417 and -3 split-on-timeout lines at :1409-1411. Plus three pure
      soundness repairs costing zero methodology lines: PIPESTATUS[0] at
      local-ci.sh:1258 (it masks check-markdown-distillation's exit 1 then
      hardcodes "pass" — and the same file already does it correctly at :449-455
      and :1376); `unavailable:no-rust-checker` in check-convergence-velocity.sh
      instead of a 16-line always-pass no-op; and `population=<n>` in EVERY
      check verdict.

      THAT LAST ONE IS THE GENERAL RULE AND MAY BE THE BEST LINE IN THE DESIGN:
      every verdict prints the size of the population it examined. A verdict
      that names its own denominator can never be misread as health over
      nothing. It kills the whole green-over-an-empty-set class — in_progress=0,
      stranded=0, threshold_events=0 are all TRUE today and all tell you nothing
      — without adding a single gate.

      WAVE 2: hostname -s seed default; packet-level neglect term; ONE call site
      for archive-plan-packets.sh in the coordinator step. WAVE 3, last: sweep
      31 imperatives to a 106 ceiling, after the gate has proven which rules can
      fire.

      NET METHODOLOGY DELTA: -181 lines.

      HOW WE KNOW IN TWO WEEKS. PRIMARY: b, the arrivals-on-closures slope,
      ledger-derived and regressed daily over 14d — target b <= 1.30 from 1.80;
      b >= 1.60 means routing failed, revert it and take the explicit
      "let the queue grow, bound it by T" decision instead. SECONDARY:
      next_action present on >= 40% of ready rows (from 4.6%) — the direct read
      on whether the gate produces content or ceremony. SECONDARY: expire-claims
      in_progress > 0 on every host every cycle; it is 0 today, and if it is
      still 0 in two weeks horizon 0 has no write side and 814-iyu7 recurs
      regardless of everything else. GUARD: read 10 sampled next_action values;
      >= 7 must name a command or file:line AND a refuted move.
