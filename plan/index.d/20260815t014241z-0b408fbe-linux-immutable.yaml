        Gate changed from [[ -r ]] to [[ -f && -r ]] and the unbounded cat replaced with a byte-bounded head -c (TILLANDSIAS_STARTUP_ADDENDUM_MAX_BYTES, default 65536). -f is false for FIFOs, character devices and directories, true for the legitimate regular file, and follows symlinks so a link onto a device is rejected by what it points AT. Verified against every reported vector with a harness built from the real block: FIFO, symlink to /dev/zero, directory and dangling symlink all skip in milliseconds with zero bytes written (previously: hang forever / 259MB in 3s); a 1MB regular file is capped at 65538 bytes; a legitimate addendum still appends; an ABSENT addendum stays silent. Pinned by litmus:startup-context-addendum-shape STEP 6/7/9, including a functional predicate test that rejects all four hang vectors.
