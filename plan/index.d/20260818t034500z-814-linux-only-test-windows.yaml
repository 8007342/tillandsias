packets:
  - packet_id: unit-tests-can-encode-linux-only-assumptions-that-only-the-gate-lane-satisfies
    order: 814-75yf
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "a workspace unit test could only pass where /proc exists, so it was green in the WSL2 build distro — the one lane ./build.sh --check runs — and red natively on Windows and macOS, with nothing reporting the difference"
    deliverable: "a way to notice host-conditional test outcomes: either the cross-platform crates are test-run natively on at least one non-Linux host per cycle, or tests that touch host-specific paths are required to inject them (with_proc_paths-style) rather than reading the real filesystem"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [testing, cross-platform, windows, macos, fail-loud]
    context: |
      FOUND 2026-08-18 by the standing freshness audit, on its first run from
      this host. `cargo test -p tillandsias-metrics --lib` natively on Windows:
      72 passed, 1 FAILED —
      `sampler::tests::sample_disk_io_returns_empty_on_first_call`, at
      `assert!(s.previous_diskstats.is_some())`.

      THE CODE WAS RIGHT AND THE TEST WAS WRONG, which is why nothing else
      caught it. `sample_disk_io()` returns early when `/proc/diskstats` cannot
      be read, storing no baseline — correct, there is nothing to baseline. The
      test built its sampler with `MetricsSampler::new()`, which reads the REAL
      `/proc/diskstats`, so its second assertion silently required a host with
      `/proc`. Its first assertion (`v.is_empty()`) passes everywhere, so the
      failure was one line inside an otherwise portable-looking test.

      WHY IT SURVIVED. `./build.sh --check` re-execs into the WSL2 Linux build
      distro (`with-wsl2-builder.sh`), so the workspace test suite runs on Linux
      no matter which host drives the gate. That is the ONLY lane the gate
      exercises. A test that passes only on Linux is therefore indistinguishable
      from a portable one, on every host, forever. This crate is a dependency of
      `tillandsias-macos-tray`, so macOS would fail identically — it has no
      `/proc` either — and nobody would learn that from a green gate.

      THE SPECIFIC TEST IS FIXED (this cycle, in the same commit): rewritten
      onto the `with_proc_paths` + tempdir fixture pattern the file already uses
      for its siblings, so it asserts the platform-independent claim — the first
      call returns empty but MUST record a baseline, or every later call is
      empty too — on every platform. 73/73 green natively on Windows.

      THE CLASS IS NOT FIXED, and that is this packet. Nothing prevents the next
      test from reading `/proc`, `/sys`, `/dev`, or a POSIX-only path directly.
      Two candidate remedies, deliberately not chosen here because the trade is
      a fleet decision: (a) run the cross-platform crates' tests natively on at
      least one non-Linux host per cycle and report the delta — cheap, catches
      everything, but needs a place to put the result; (b) require tests that
      touch host-specific paths to inject them, enforced by a check that flags
      `MetricsSampler::new()`-style constructors inside `#[cfg(test)]` — cheaper
      to run, but only as good as the pattern list.

      NOT CLAIMED: that this is the only instance. One crate was audited. The
      honest scope is "found in the first cross-platform crate a non-Linux host
      test-ran", which is a reason to look further, not a census.
    verifiable_closure: "a host-conditional test outcome is reported by something other than a human running cargo test on the right machine"
    evidence:
      - "cargo test -p tillandsias-metrics --lib on Windows: 72 passed / 1 failed before, 73 passed / 0 failed after"
      - "crates/tillandsias-metrics/src/sampler.rs freshness stamp records the audit and the fix"
