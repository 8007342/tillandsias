        NOT A FLAKE. Deterministic, and the axis is ENVIRONMENT, not load or timing:

            on the host              11/11, every time
            inside tillandsias-builder toolbox   10/11, every time

        The gate runs inside that toolbox, which is why it refused lands and why every
        re-run afterwards was green.

        THE CAUSE, measured decisively inside the toolbox with the same token, same
        process and same library, varying only the pipe:

            PIPED    (`tillandsias_marked_pids ... | grep -qxF ...`)  5/5 FAILURE
            CAPTURED (same question, no pipe)                         0/5 FAILURE

        scripts/test-dispatch-reap.sh:25 sets `set -uo pipefail`, and line 127 piped a
        producer that walks every /proc entry into `grep -q`, which exits at the first
        hit and SIGPIPEs it. Under pipefail the pipeline then reports FAILURE ON A
        SUCCESSFUL MATCH. This is exactly 1076-kft9's stated condition — EPIPE happens
        iff the producer still has bytes to write when the consumer exits — and its
        measured environment dependence (they found drvfs 10/10 vs ext4 0/10; this is
        host vs container, same shape).

        FIXED both pipelines by capture-then-match. Line 137 had the same construct with
        the OPPOSITE assertion, where a SIGPIPE failure would have made the arm PASS for
        the wrong reason — worse than the false red, and it would have survived
        indefinitely.

        HYPOTHESES I RULED OUT, so nobody re-walks them: CPU load (8 spinners, still
        11/11 on the host); /proc absent or environ unreadable in the container (both
        fine); and setsid forking so `$!` is not the surviving process (checked directly
        — `$!` equals the token holder in BOTH environments). The coordinator's relayed
        shape (spawn-then-scan before the child has exec'd) is also ruled out by that
        last measurement: a bounded poll would not have helped.

