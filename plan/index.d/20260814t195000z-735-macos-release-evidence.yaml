  - packet_id: macos-tray-diagnose-converging-exit-three
    order: 735-2g5i
    type: progress
    ts: "2026-08-14T19:50:00Z"
    agent_id: macos-tlatoanis-macbook-air-fable5-20260814t192504z
    host: macos
    status: implemented
    summary: |
      DONE — macOS --diagnose now separates CONVERGING (exit 3) from degraded.
      Commit e71bc6f7.

      All three exit criteria met:

      1. "macOS --diagnose returns 3 for a converging VM and 2 only for a
         genuinely degraded one." exit_code_from is now
         0 provisioned / 3 unmaterialized-with-a-live-owner / 2 otherwise.

         macOS reaches the verdict from a DIFFERENT fact than Windows because
         it cannot reach the same one: windows asks the guest over the control
         wire and believes the phase it names, while macOS has no AF_VSOCK —
         the live phase is readable only from inside the tray process, which
         --diagnose is not. It establishes instead whether a live tray owns the
         VM singleton, the probe require_no_live_tray already uses. Both are
         observations of a live owner rather than inferences from timing, which
         is the property the Windows reasoning actually rests on.

         Exit 2 with NO live owner is deliberate, mirroring windows' choice for
         an unreachable wire. Staging residue (rootfs.qcow2,
         rootfs.img.xz.partial, *.part) survives a crashed provision, so its
         presence is not evidence anything is running; inferring "converging"
         from it would trade a false "broken" for a false "converging" — worse,
         because it tells automation to wait for something that will never
         arrive.

      2. "the macos-tray exit-code pin test covers the converging case."
         exit_code_separates_healthy_converging_and_degraded (renamed to match
         windows; the old two-state name had become a lie). Four legs, two of
         them negative controls: no live owner stays 2 — without it "always
         converging when unprovisioned" would pass — and provisioned stays 0
         even while the tray owns the VM, which is the steady state.

      3. "the symmetry litmus's ASYMMETRY REPORT step flips to `ok: exit-3
         converging parity reached`." It does, and the step was PROMOTED FROM
         REPORT TO ENFORCEMENT: its stated reason for only reporting — that
         enforcing would make one host's pending work every host's red gate —
         is spent now that both halves exist. It also stopped counting the WORD
         "converging", which a comment satisfies and which therefore could not
         distinguish an implementation from a mention of one; it now asserts
         the exit-3 constant each tray branches on and the test covering the
         case, on both sides.

      LIVE VERIFICATION on hardware during the 735-6iki e2e, not just unit
      tests: a destroyed substrate with no tray returned exit 2, and the
      singleton probe read false with no tray and true with the tray running
      (pid 41092). The exit-3 leg itself is unit-tested rather than staged
      live, because reproducing it would mean destroying the substrate a second
      time and leaving the host unprovisioned.

