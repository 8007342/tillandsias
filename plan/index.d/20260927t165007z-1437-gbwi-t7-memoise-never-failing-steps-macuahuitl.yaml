  - packet_id: per-step-memo-for-the-workspace-cargo-test-step-keyed-on-its-derived-inputs-with-a-daily-forced-run
    order: 1437-jm2d
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    release_target: efficiency-trims-2026-09-27
    pickup_role: linux
    capability_tags: [gate-time, memo, build-gate, rust, bash, linux]
    estimated_hours: 8
    depends_on: []
    owned_files: [scripts/step-memo.sh, scripts/workspace-test-inputs.sh, build.sh, scripts/test-step-memo.sh, openspec/litmus-tests/litmus-step-memo-shape.yaml]
    verifiable_closure: |
      bash scripts/test-step-memo.sh prints ok:step-memo:7/7 and exits 0,
      where, over a scratch repo: arm 1: after a recorded green run,
      step-memo.sh check workspace-tests prints hit:<key12> and exits 0 when
      no enumerated input changed; arm 2: touching each path
      scripts/workspace-test-inputs.sh enumerates (a crate source,
      Cargo.lock, an include_bytes target under assets/, a runtime literal
      such as plan/schema.yaml, scripts/test-known-red.txt) flips the key
      and check prints miss; arm 3 NEGATIVE CONTROL: touching a ledger
      fragment under plan/index.d does not flip the key; arm 4: a run that
      exits non-zero leaves no record (check still prints miss); arm 5: when
      the marker $GIT_DIR/tillandsias-last-full-gate is older than
      TILLANDSIAS_FULL_GATE_MAX_AGE_S every step memo answers forced and the
      run records; arm 6: TILLANDSIAS_FORCE_CHECK=1 bypasses; arm 7: a
      toolchain change (rustc -V differs) flips the key. AND in build.sh a
      memo hit on the workspace test step prints
      skip:workspace-tests:memo-hit:<key12> and emits a timing record named
      workspace-tests-memo-hit. PRE-FIX RESULT: FAILS — scripts/step-memo.sh
      does not exist; the workspace test step ran 128 times in 7 days at
      164 s average with 0 pct fail and no per-step memo (only the
      all-or-nothing gate memo, 765-tkq2, which was forced on 1,098 of 1,402
      runs).
    title: |
      A per-step memo (`scripts/step-memo.sh`) keyed on a step's DERIVED inputs, applied to the workspace `cargo test` step with a daily forced run so never-fails stays measured
    context: |
      T7 of the 2026-09-27 trims. Workspace cargo test is the project's core
      test and is never dropped; it is memoised by an input digest. The key
      is sha256 over git ls-files -s blob ids and modes of the input set,
      the working-tree diff of that set, a toolchain digest (rustc -V, cargo
      -V) and scripts/test-known-red.txt. The input set is DERIVED by
      scripts/workspace-test-inputs.sh, never hand-listed: crates/,
      Cargo.toml, Cargo.lock, .cargo/, every path an include_str! or
      include_bytes! in crates/ reaches through ../ (today assets/icons and
      images/default/ca-path.txt), and every repo-relative literal a crate
      source opens at runtime (the enumerator greps the literal and takes
      the file or directory it names, never the whole root). The memo
      generalises archiver-check-memo.sh's _digest and reuses the existing
      daily marker tillandsias-last-full-gate so the forced run needs no new
      clock. A red run never records. Hits are emitted to the timing log so
      skippable: keeps measuring the step.
    next_action: >
      Write step-memo.sh (check|record <step-id>, input list on stdin) and
      workspace-test-inputs.sh; wrap the workspace test _step in build.sh
      with the check and the record-on-green; fixture with the seven arms;
      bind the litmus under ci-release; measure the hit rate over the first
      week and record it on this packet.
    notes: |
      size: L
      implementer_tier: opus
      Changes what the land gate runs; a wrong key lets a red workspace land.
      The mutation arms are the contract.
    provenance: |
      Filed 2026-09-27 on macuahuitl by the trims designer session from the
      skippable: and timing: lines of the same day.

