  context: 'MEASURED on lenovinha 2026-11-06, trunk 9b8cd3f98 with no change applied, and the same with 2013-rlcd (PR 976): three arms fail. NOVAULT bin expects refused:cloudflare-login:vault:vault-start-failed and gets rc=143. NOVAULT remedy check sees "remedy: unlock the OS keyring (the login keyring), then relaunch tillandsias" instead of the light step (start the tray). DEVICE bin, after /.well-known/openid-configuration and /oauth2/device/auth, also ends rc=143. The host login keyring was unlocked at the time (Secret.Collection Locked=false), so the run inside the arm reaches the keyring-locked branch of vault_bootstrap.rs (unseal_key_source, remedy at :4190 and :5667) and then waits until the arm timeout kills it. Also seen: RELAY CONTROL fetch never reached on trunk, because its anchor show("ok") is gone from the page since ae5c28e3f; 2013-rlcd re-anchors it.'
  exit_criteria:
