  - 'Whatever the arm environment gives the keyring (real, isolated or absent) is stated in the script, and a locked-keyring control arm shows the locked remedy is reached only when the keyring is locked.'
  - 'The tests never reach the real keyring (see the session seam rule).'
  verifiable_closure: 'scripts/test-cloudflare-login.sh green on a Linux host with an unlocked keyring.'
