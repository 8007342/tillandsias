  - packet_id: forges-in-the-macos-and-windows-vm-get-an-empty-lane-mcp-socket-dir-because-the-guest-binary-is-built-without-the-tray-feature-that-holds-the-listener
    event:
      type: note
      ts: "2026-10-16T02:46:47Z"
      agent_id: tillandsias-87@yolanda
      summary: |-
        WINDOWS (WSL2) LIVE ARM, 56.10.16.1, forge-tillandsias on yolanda: STILL RED, with a different symptom from the macOS one.
        - id: uid=1000(forge) gid=1000(forge) groups=1000(forge),0(root)
        - /run/host/tillandsias-mcp is root:root 700 (macOS: root:root 755, empty). ls -> "Permission denied", so its contents are unknown. The dir's tmpfs size is 60 (an empty tmpfs dir is 40), which suggests one entry, possibly mcp.sock, that uid 1000 cannot reach. Unconfirmed.
        - mountinfo: "986 992 0:90 /tillandsias/mcp/tillandsias-default /run/host/tillandsias-mcp ro,nosuid,nodev,relatime - tmpfs tmpfs rw,size=813020k,nr_inodes=203255,mode=700". The source is a guest tmpfs mounted mode=700; the creating process is not visible from inside the forge.
        - host-browser.sh by hand -> {"error":{"code":-32000,"message":"TILLANDSIAS_CONTROL_SOCKET does not exist"}} ([[ -e ]] fails on EACCES); Claude reports host-browser CONNECTION_CLOSED.
        - ALSO NEW: the lane mailbox is unusable. /run/host/tillandsias-msg is 755, but dead, inbox, outbox and receipts are root:root 700 (a bind of /root/.local/state/tillandsias/msg/lanes/tillandsias-default on ext4), so `tillandsias-plan msg send|recv` -> "refused:msg:io:lane ... Permission denied (os error 13)". Fleet messaging from Windows forges is down (the MCP msg tools fail earlier still, see 1746-4q34).
        So on Windows, adding the listener (tray feature) is not enough: the lane mcp and msg dirs must also be reachable by the forge uid (owner 1000, or a group the forge user is in). Per yolanda-windows, no in-forge workaround (chmod or a hand-made socket) was attempted.
        Skills probe (1743-h9rz live arm): ~/.claude/skills has start-a-new-project -> /opt/skills/start-a-new-project, and the Claude harness lists it: PASS for Claude. ~/.config/opencode/skills does not exist (this forge does not cover the OpenCode arm).
