    title: |
      test-provider-limit-relay.lua is a script error on native Windows: fs.write into a plan/ dir it never made, because its relay ran under a bare "bash" (WSL's)
    context: |
      Measured on doris (native Windows) 2026-11-26, on origin/linux-next:
        refused:script-error:test-provider-limit-relay
        runtime error: fs.write: the directory for 'target/plan-scratch/provider-limit-relay-<ms>/plan/...' does not exist
      (line ~144). The missing dir was a symptom: the relay and the forge check ran as argv "bash", which on native
      Windows is WSL's bash.exe (another filesystem), so the relay never created plan/ and every arm
      before it saw nothing. Fixed on work/2392-gmqe: both spawns use common.fixture's posix_shell()
      (the 2246-fkea rule), plus an fs.mkdir of plan/ before the write so the arm never depends on
      an earlier one having run (as macuahuitl asked).
