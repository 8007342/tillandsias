      host_note: slice 4 — the correct capability for the preamble gate; host adoption is slice 5
      summary: |
        SLICE 4. Slice 3 named the next step as "host-side deletion must be
        gated on CAP_EXEC_ARGV_VECTOR (or an equivalent capability)". CHECKING
        THAT BEFORE BUILDING ON IT SHOWED THE FIRST OPTION IS WRONG, and the
        parenthetical was carrying the whole load.

        THE DEFECT IN THE PROPOSED GATE, established from git rather than
        argued: CAP_EXEC_ARGV_VECTOR shipped in cc4bee155 (slice 2) and the CA
        key heal in d4e12b425 (slice 3) — TWO DISTINCT COMMITS. A guest binary
        built from anything between them advertises ExecArgvVector and does NOT
        have the heal. So gating the preamble's `chmod 600` on the argv
        capability would silently drop the clamp for exactly that build window,
        reintroducing 772-shi9 — a 0644 ephemeral CA key surviving the VM's
        whole lifetime — on precisely the guests the clamp exists to protect.
        That is not a hypothetical window: this fleet stages a guest binary from
        whatever bundle last ran, so mid-window builds are the normal case, not
        an edge one.

        LANDED: CAP_PROXY_CA_KEY_HEAL ("ProxyCaKeyHeal"), advertised by the
        guest in HelloAck server_caps beside the others. It names the BEHAVIOUR
        a host depends on — this guest heals a widened key on
        ensure_proxy_running's already-running EARLY-RETURN path, not only on
        the cold path that reaches ensure_ca_bundle.

        THE GENERAL RULE, recorded because it will recur: a capability must name
        the behaviour the caller depends on, never a neighbouring behaviour that
        happened to land nearby. Reusing one as a proxy for "built after roughly
        then" is VERSION COMPARISON WEARING A CAPABILITY'S CLOTHES — and it
        fails on exactly the builds a mixed-version fleet actually produces,
        which is the failure capabilities were adopted to avoid. The control-wire
        doc comment already says "a version says what a peer IS while a
        capability says what it can DO"; aliasing two capabilities quietly
        converts the second back into the first.

        PINNED, and the pin is the anti-simplification: the advertisement test
        asserts the guest offers ProxyCaKeyHeal AND asserts the two constants are
        NOT EQUAL. If someone later collapses them into one string to tidy up,
        that assertion fails and the mixed-version argument must be re-made
        rather than silently lost. FALSIFIED: aliasing CAP_PROXY_CA_KEY_HEAL to
        "ExecArgvVector" fails with the intended message; restoring returns
        green.

        NOT DONE, and the reason is a signature this slice must not widen. Host
        adoption needs the argv to be chosen AFTER server_caps are known, but
        exec_over_stream_expect_dynamic takes `argv: &[&str]` and performs its
        Hello INTERNALLY, so caps arrive after the argv is already fixed.
        Surfacing them means either a second connection or restructuring a
        function shared with the Linux and Windows callers — and slice 2 already
        recorded why that shared signature must not be widened to reach one
        macOS field ("would break two other platforms for no reason"). SLICE 5
        is therefore: give the exec path a way to build argv from caps WITHOUT
        widening the shared signature (an argv-builder closure, or a
        caps-first variant beside it), then delete the preamble's `podman rm`
        and `chmod 600` behind CAP_PROXY_CA_KEY_HEAL.

        Note for slice 5 on scope: the preamble is NOT purely a flattening
        workaround. It also exports three env vars, creates XDG_RUNTIME_DIR, and
        generates the CA on first use — none of which the argv arm removes. Only
        the `podman rm` (redundant with ensure_proxy_running's own `rm --ignore`)
        and the `chmod 600` (redundant given this capability) come out. The
        preamble stays a shell script until that remaining work moves guest-side
        or into the structured env field, exactly as slice 2 warned.
