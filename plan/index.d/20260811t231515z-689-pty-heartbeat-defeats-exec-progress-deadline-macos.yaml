  - packet_id: pty-heartbeat-defeats-exec-progress-deadline
    order: 689-y2my
    status: ready
    desired_release: v0.5
    priority: p1
    title: "The PTY liveness heartbeat silently defeats the vsock-exec inactivity deadline — every control-wire exec can wedge forever"
    kind: bug
    deliverable: a progress deadline that heartbeats cannot reset, failing loud with the stage it was waiting on
    depends_on: []
    pickup_role: any
    capability_tags: [control-wire, vsock, exec, fail-loud, timeout, fleet-wide]
    estimated_hours: 4
    context: >
      ROOT CAUSE, read live 2026-08-11 while an actual wedge was in progress on
      macOS (this is the mechanism behind 663-acdw's unbounded --github-login
      wedge, and it is NOT macOS-specific — it is in shared crates and applies
      to every host that drives a guest over the control wire).
      THE PROTECTION: crates/tillandsias-vm-layer/src/vsock_exec.rs:107-124
      wraps every envelope read in `read_exec_envelope(stream, idle_timeout)`
      with IDLE_TIMEOUT_SECS = 300 (line 32), whose error text says "no data
      from guest for 300s — connection stale".
      THE DEFEAT: the exec clients advertise CAP_PTY_HEARTBEAT_V1
      (vsock_exec.rs:175, 321, 566), so the guest builds its PTY store via
      `PtySessionStore::new_with_heartbeat`
      (crates/tillandsias-headless/src/vsock_server.rs:676-677), which arms a
      30-second interval (PTY_HEARTBEAT_INTERVAL,
      crates/tillandsias-headless/src/pty_handler.rs:57). The pump's select
      arm at pty_handler.rs:816-826 then sends
      `pty_heartbeat_envelope(session_id)` — an EMPTY PtyData{ToHost} frame on
      the SAME session_id — every 30s UNCONDITIONALLY, with no reference to
      whether the child process has produced output, made progress, or is even
      alive beyond being un-reaped.
      THE COLLISION: on the host, that empty frame lands in the ordinary
      PtyData arm (vsock_exec.rs:613-646), appends zero bytes to `stdout`, fails
      the needle search, breaks the inner while, and loops back into
      `read_exec_envelope` WITH A FRESH 300s DEADLINE. 30s < 300s, so the
      inactivity deadline can never expire while a session is open. The frames
      would reset the deadline even via the catch-all `_ => {}` arm, so this is
      not fixable by matching on frame type alone.
      OBSERVED: two --github-login runs on this host, 70 minutes and 6 minutes,
      both parked after "driving guest login" with the host thread in kevent,
      guest vCPUs idle in psynch_cvwait, the VM's NAT bridge moving ~18 bytes/s,
      and the guest kernel answering ping the whole time. The operator sees
      nothing, forever. Host-side `sample` captures of both the tray and the
      Virtualization XPC process, taken DURING the wedge, are the new diagnostic
      that 663-acdw asked for.
      THE CLASS: this is the same defect shape as the Windows tray's 32K
      buffered-download silent killer — a mechanism that looks correct in
      isolation (liveness) silently disabling the protection that was supposed
      to bound the failure (progress). LIVENESS IS NOT PROGRESS. Every
      control-wire exec on every host inherits this: --github-login,
      --exec-guest, --list-cloud-projects, --opencode, transport conformance.
    outcome: >
      A guest that stops making progress fails the exec loudly within a bounded
      time, naming the stage it was waiting on, even though the wire is alive
      and heartbeating.
    exit_criteria:
      - "the exec loop tracks a progress deadline distinct from wire liveness: heartbeat frames (empty PtyData) prove the wire and MUST NOT extend the progress deadline; only non-empty output or a satisfied expect does"
      - "on progress-deadline expiry the error names the pending expect label and the bytes seen so far, not just 'connection stale'"
      - "the expect-driven variant reports which needle it was waiting for; a wedged guest is distinguishable from a dead wire in the operator-visible message"
      - "regression test drives a fake guest that heartbeats forever while producing no output and asserts the client gives up within the progress bound — a negative control asserts a slow-but-progressing guest is NOT killed"
