packets:

  - packet_id: litmus-suite-de-ripgrep-for-portability
    order: 715-k5vs
    status: implemented
    desired_release: v0.5
    priority: p2
    title: "Litmus steps invoked ripgrep (rg), producing false FAILs on rg-less hosts (WSL builder) — de-ripgrep to portable grep"
    kind: fix
    deliverable: "the litmus suite depends only on grep (universal), not ripgrep"
    pickup_role: any
    capability_tags: [litmus, portability, cross-platform, tooling]
    context: >
      From the Windows research note plan/issues/research-windows-methodology-
      accountability-litmus-red-2026-08-13.md: litmus:methodology-accountability-
      shape FAILed on Windows because step 4 shells out to rg (ripgrep), absent
      in the WSL builder distro — a host-tooling gap, not a product defect. A red
      that only means "this host lacks a tool" trains agents to read red as noise
      (which is how genuinely-red ones survive). 8 litmus used rg as a command:
      methodology-accountability-shape (x2), git-mirror-safe-refspec-push,
      git-mirror-fetch-reconcile, external-logs-producer-manifests-shape,
      tray-icon-initialization, init-command-shape, user-runtime-checkout-free-
      install, vsock-exec-heartbeat. All translated to portable grep, preserving
      rg's regex semantics: rg -n -> grep -rnIE (-r recursive, -I skip binaries
      like rg, -E so escaped parens/? and | alternation match identically),
      rg -c -> grep -cE, rg -q -> grep -qE, bare rg 'P' file -> grep -E 'P' file.
      Equivalence verified on linux (rg vs grep produced identical match sets:
      @trace 57==57, init-command same line, user-runtime 9==9, alternation
      0==0). methodology-accountability-shape step 4 now green with grep;
      git-mirror-service 18/18 green post-change.
    exit_criteria:
      - "no litmus step invokes rg; the suite runs on a host with only grep (verified: the translated steps pass on linux, and grep is universal)"
      - "the Windows/macOS cycles confirm methodology-accountability-shape is no longer red for the rg-absent reason on their hosts"
    events:
      - type: filed
        ts: "2026-08-13T06:58:39Z"
        agent_id: linux-mutable-session-20260812
        host: linux_mutable
        summary: "De-ripgrep'd 8 litmus to portable grep -rnIE/-cE/-qE/-E, semantics verified equal on linux. Credits the Windows research note. Separate remaining item: the intermittent timing-telemetry-implausible-guard-shape (/tmp race) is NOT this — it is the note's item 2."
