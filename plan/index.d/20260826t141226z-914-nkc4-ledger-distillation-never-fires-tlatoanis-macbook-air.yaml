packets:
  - packet_id: readme-ledger-distillation-policy-has-never-fired
    order: 914-nkc4
    status: ready
    kind: bug
    pickup_role: any
    priority: p3
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    depends_on: []
    deliverable: |
      Either the README release-ledger distillation policy is enforced by
      something, or the ~10-row trigger is restated as the advisory it
      currently is.
    capability_tags:
      - documentation
      - release
      - methodology
    tags:
      - policy-not-enforced
      - ledger
      - v0.5
    title: |
      The README release-ledger distillation policy says "distil the oldest rows once the table exceeds ~10 rows". The table has 19 rows and nothing has ever distilled one.
    context: |
      MEASURED on 2026-08-26: `README.md` carries 19 release rows. The policy
      is documented in two places —
      `skills/merge-to-main-and-release/SKILL.md` ("when the table exceeds ~10
      rows, distil the oldest rows into the `*Older releases*` line per the
      semantic-distillation policy") and README.md's own preamble ("detail
      lives with the most recent releases"), with the target line already
      present at README.md:111.

      So the mechanism is fully described and has a destination waiting for it.
      NOTHING RUNS IT. It is a sentence in a runbook step that a human or agent
      is expected to notice while doing something else, at nearly double the
      threshold, and it has not been noticed yet.

      This is the shape this project has now recorded several times — a rule
      that reads as active because it is written down (801-qasc's daily marker
      that lived only as prose; 709-in2f's methodology claiming an
      implementation that did not exist; 660-ryhn's unbound litmus). It is
      milder than those: the consequence is a long README rather than a false
      verdict. It is filed p3 for that reason, and filed at all because the
      alternative is that the number stays in the text getting further from
      the truth until someone quotes it as if it were enforced.

      NOT A CRITICISM OF THE ROWS. They are unusually good — the
      v0.4.260826.1 row states what the release does NOT claim, per-platform,
      which is exactly the discipline this fleet has been building. The rows
      being worth reading is part of why nobody wants to distil them, and that
      tension is the real content of the decision below.
    exit_criteria:
      - |
          Either a check reports when the table exceeds the threshold (it need
          not distil automatically — naming the condition is enough, and
          distillation is a judgment call about which detail survives), or the
          "~10 rows" figure is restated as advisory with the reason.
      - |
          Whichever is chosen, the ~10 number and the actual row count stop
          disagreeing silently. A documented threshold that nothing measures is
          indistinguishable from no threshold.
      - |
          NEGATIVE CONTROL if a check lands: a table UNDER the threshold reports
          clean, so the check cannot be satisfied by always firing (or by never
          firing, which is the current state).
    verifiable_closure: |
      NAMED: if a check lands, pin it in `litmus:release-runbook-external-preconditions-shape` (bound)
      with two legs — a fixture README over the threshold reports the condition,
      one under it reports clean. The under-threshold leg is the load-bearing
      one; without it "always report" passes.
    notes: |
      Found while wiring 380's smoke-curl half: the packet's third exit
      criterion is "distillation policy documented; oldest rows distilled once
      >10 rows". The first clause is satisfied and the second is not, which is
      why 380 should not close on the strength of the documentation alone.
