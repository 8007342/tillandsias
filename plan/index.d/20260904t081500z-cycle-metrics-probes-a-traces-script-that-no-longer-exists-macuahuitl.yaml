    title: |
      scripts/cycle-metrics.sh probes scripts/generate-traces.sh --check, retired on 2026-08-08, so the repo: line reads traces=unknown on every host every cycle — and no fixture notices a probe whose target is gone.
    context: |
      FOUND by the 1001-q3zf adversarial review, 2026-09-04. The repo: block of
      scripts/cycle-metrics.sh (scripts/cycle-metrics.sh:1078-1089) initialises
      traces="unknown" and only changes it when
      `$REPO_ROOT/scripts/generate-traces.sh` is executable. That script was
      retired in commit 7c352c409 (2026-08-08, "retire the rendered trace
      index; compute coverage + gate ghosts"), so the `-x` test is false on
      every checkout, the probe never runs, and the line has printed
      traces=unknown on every host every cycle for almost four weeks. The
      grammar comment at scripts/cycle-metrics.sh:51 still promises
      `traces=<current|stale|unknown>`, and the --experts-only rationale at
      scripts/cycle-metrics.sh:460 still names the dead script as the
      expensive scan it skips. Nothing else in scripts/, methodology/ or
      openspec/ calls generate-traces.sh; the only other mentions are a
      history comment in scripts/trace-coverage.sh:8, a build.sh assertion in
      scripts/test-build-sh-ci-full-install-prep.sh:88, and the archived
      2026-03-30 clickable-trace-index change.

      THE LIVE EQUIVALENTS EXIST AND BOTH EXIT 0 ON THIS TREE:
      scripts/validate-traces.sh (rc=0 on macuahuitl 2026-09-04) and
      scripts/trace-coverage.sh --gate (rc=0; usage `[--json|--ghosts|--gate]`,
      the ratchet that fails only on NEW or stale ghosts). The repo: field
      should be derived from one of those, mapping a green gate to
      traces=current, a red gate to traces=stale, and a missing or
      non-executable checker to traces=unavailable:<reason> — never to a
      silent unknown that is indistinguishable from "did not look".

      WHY A FIXTURE, NOT JUST THE FIX. This is the dead-reference shape the
      fleet recorded three times on 2026-09-03: a probe whose target moved
      keeps reporting a well-formed nothing, and every reader assumes
      someone else is looking. litmus:cycle-metrics-answer-rate-shape already
      executes scripts/cycle-metrics.sh against seeded logs, so it is the
      right place for one more step: every script path the reporter probes
      must exist in the tree, so the next retirement turns the litmus red
      instead of turning a field to unknown.

      SECOND ITEM, NOTED FOR HYGIENE AND PARTLY DISSOLVED BY THE FILING
      READ. The review noted that eleven litmus specs cite 'order 765-mza8'
      for the named-inputs convention and that the order has no ledger row.
