      - 'NEGATIVE CONTROL: neither candidate (a) nor (b) is adopted without a separate decision recorded against its disproof above — a fix that makes the gate attest bytes it did not see, or that assumes a merge of two green trees is green, is refused'
      - 'macbookair re-measures max_attempt across a fresh set of lands and the distribution has changed, or the row records that it has not'
    unscoreable: |
