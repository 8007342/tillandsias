    title: |
      A platform host's land exits at attempt 1, so 1174-u5wp's stamp adoption never runs and each lost race costs a whole gate
    context: |
      MEASURED BY macbookair ACROSS ALL NINE OF THEIR LAND LOGS, with a control:
      max_attempt = 1 on EVERY one of the nine, and `land-adopts-valid-stamp`
      appears in 0 of 9, while a control search confirms `attempt 1` appears in
      9 of 9. So the retry loop does not run on their refusals at all.
      TWO CAUSES THAT COMPOUND, and fixing either alone is insufficient.
      (1) CLASSIFICATION EXITS THE LOOP. A mandated-merge refusal is classified
      "not a lost race, so retrying cannot help" and the script EXITS at attempt
      1. macuahuitl's refusal was classified a lost race, looped to attempt 2,
      and adopted the stamp — `ok:land-adopts-valid-stamp` — reaching the push
      in seconds. So the classification is not a message: IT DECIDES WHETHER
      THE LOOP CONTAINING THE ADOPTION EVER RUNS.
      (2) THE MANDATED MERGE STALES THE STAMP ANYWAY. The merge of trunk is
      mandated before every push of a NON-linux-next branch. macuahuitl is ON
      linux-next, never merges, and its tree is therefore byte-identical across
      attempts, which is exactly the condition 1174-u5wp's adoption requires.
      Every platform host must merge, which changes tracked bytes and
      legitimately invalidates the stamp. macbookair's manual re-runs confirm
      it: each re-gated, ~900-1100s apiece.
      THE COST, in their numbers: 3 of 9 lands refused on push-failed, each
      costing a full gate, against a median land of 915s. On macuahuitl a lost
      race costs ONE gate total however many attempts it takes.
      TWO CANDIDATE FIXES ARE RECORDED HERE WITH THEIR DISPROOFS, so the next
      reader does not rediscover them expensively. macbookair proposed both and
      declined to choose, correctly.
      (a) GATE ONCE, THEN MERGE-AND-PUSH IN THE LOOP. This makes the gate
      attest a tree that no longer exists at push time — the pushed bytes would
      be ungated, which is the single thing the stamp exists to prevent, and it
      is worst on a platform host because the post-gate merge is the one
      carrying everyone else's changes.
      (b) SCOPE THE STAMP SO A PURE TRUNK MERGE DOES NOT INVALIDATE IT. This is
      the union-is-green assumption and it is FALSE HERE WITH EVIDENCE: on
      2026-08-15 both sibling branches were green on their own --check gates,
      the coordinator merged them, and THE UNION FAILED NINE LITMUS STEPS. A
      stamp surviving a trunk merge asserts precisely what that incident
      disproved, and would be most wrong when trunk moved most.
      WHAT LOOKS TRUE INSTEAD, and wants ratifying rather than implementing:
      THE RELAY LANE IS THE DESIGNED ANSWER, NOT AN ESCAPE HATCH. macbookair's
      own corroborating detail is the proof — their work/<order> push reported
      `ok:linux-next-merged:0`, because a work/ ref matches no platform pattern,
      so no mandated merge, so the tree stays stable and the gate attests
      exactly the bytes that land. That is the one shape in which a platform
      host gets what a trunk host gets for free.
      SO THE DEFECT MAY BE ORDERING AND DOCUMENTATION RATHER THAN CODE: the
      refusal text (corrected earlier the same day) still frames re-running as
      the primary path and the relay as the fallback, which is backwards for
      every non-linux-next host, since for them the loop never runs and the
      merge would stale the stamp if it did.
    exit_criteria:
      - 'a platform host that loses a race is told the relay lane FIRST, before any suggestion to re-run, and the message says why re-running re-gates on a branch that must merge (pre-fix result: FAILS — current text names re-running first)'
