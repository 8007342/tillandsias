packets:
  - packet_id: mirror-identity-vault-roles-exact
    order: 722-hthz
    release_target: forge-local-experts-milestone
    status: ready
    desired_release: v0.5
    priority: p0
    kind: security+implementation
    title: 'Mint the exact per-project Vault signer roles and policies (no sign/* wildcard) for mirror push'
    pickup_role: linux
    depends_on: []
    blocks:
      - mirror-identity-negative-matrix-litmus
    capability_tags:
      - security
      - vault
      - ssh
      - identity
    estimated_hours: 2
    context: |
      Slice a of 606-bvnp. Design is SIGNED (2026-08-11):
      plan/issues/ssh-ca-forge-mirror-push-design-2026-07-31.md D1, D12, D13 and
      section 2.3 specify exactly what to create — two mounts
      (ssh-client-signer, ssh-host-signer), a client role named <mirror-id> and
      a host role host-<mirror-id> with allowed_domains git-<mirror-id>, and
      policies minted AT PROVISION naming one exact sign path each. The shared
      roles and the sign/* policy sample were withdrawn from the design; nothing
      static ships.
      This slice is the authority half of the packet's criterion 2 and is what
      makes M2 (cross-signing 403) testable at all.
    exit_criteria:
      - provisioning creates ssh-client-signer/sign/<mirror-id> and ssh-host-signer/sign/host-<mirror-id> per project, minted at provision time
      - no policy anywhere grants a sign/* capability, and a grep for it in generated policy is empty
      - a lane token for project A receives 403 on project B's sign path
    verifiable_closure: |
      Against a throwaway Vault (design V1-V7 methodology): A's lane-signer
      token gets 200 on sign/<id-A> and 403 on sign/<id-B>, symmetric for B, and
      the generated policy set contains no sign/* capability.

  - packet_id: mirror-identity-per-project-dns
    order: 722-ft6g
    release_target: forge-local-experts-milestone
    status: ready
    desired_release: v0.5
    priority: p0
    kind: security+implementation
    title: 'Swap mirror DNS to the opaque per-project hostname and retire the shared aliases'
    pickup_role: linux
    depends_on: []
    blocks:
      - mirror-identity-negative-matrix-litmus
    capability_tags:
      - security
      - git-mirror
      - dns
      - identity
    estimated_hours: 1
    context: |
      Slice b of 606-bvnp, and the one swap point 659-8faj (done) deliberately
      left unswapped: git_mirror_service_identity still resolves the shared
      alias. D13 mints the opaque 12-byte CSPRNG mirror-id — never derived from
      the guessable project name — and D9 certifies exactly one hostname
      git-<mirror-id> per project.
      DNS opacity is defense-in-depth; the certificates are the control. This
      slice must not be mistaken for the security boundary on its own.
    exit_criteria:
      - the mirror answers on git-<mirror-id> and the shared aliases resolve to nothing
      - identity is provisioned at all three non-forge-launch mirror-create sites (status-check, opencode CLI, opencode web), not only on forge launch
      - resolution is checked with getent ahostsv4, never a probe image's nslookup
    verifiable_closure: |
      §4a row M1: getent ahostsv4 git-<id-A> returns exactly one A record, same
      for B, and tillandsias-git / git-service resolve to nothing.
    notes: |
      The nslookup caveat is not pedantry — the 659-8faj audit had a probe
      image's nslookup invert a finding.

  - packet_id: mirror-identity-lane-sidecar-and-sshd
    order: 722-ecne
    release_target: forge-local-experts-milestone
    status: ready
    desired_release: v0.5
    priority: p0
    kind: security+implementation
    title: 'Per-lane ssh-agent sidecar, sshd principals and the audit fields for mirror push'
    pickup_role: linux
    depends_on: []
    blocks:
      - mirror-identity-negative-matrix-litmus
    capability_tags:
      - security
      - ssh
      - git-mirror
      - audit
    estimated_hours: 3
    context: |
      Slice c of 606-bvnp — design rungs T3-T13: sshd in the git image, host
      cert at mirror start, sshd_config plus the receive wrapper, repo
      hardening, the per-lane sidecar and its AppRole ssh-lane-signer-<mirror-id>
      (D6, deliberately not minted yet), and forge wiring. D5 is the invariant
      the whole design rests on: the forge holds no private key and receives
      only an agent socket and public CA trust — already VERIFIED live in-forge
      for the current state (606-bvnp criterion 5) and must survive this slice.
    exit_criteria:
      - a correct per-lane certificate clones, fetches and pushes its own mirror
      - the audit record carries project, lane, principal, fingerprint, serial and refs
      - the forge still contains no private key, Vault token, SecretID or upstream credential after wiring
    verifiable_closure: |
      §4a rows M0 (positive control, both lanes concurrent), M3 (A's cert
      presented to B's sshd is denied and sshd logs the refusal) and M5 (a cert
      whose SSH_ORIGINAL_COMMAND names B's repo path still lands in A's fixed
      repository).
    notes: |
      Row M6 (audit survives container recreation) is BLOCKED on T9: /vault/audit
      is a container-layer directory today (V12) and dies on recreate. Land the
      audit volume or M6 cannot pass — do not report M6 green without it.

  - packet_id: mirror-identity-negative-matrix-litmus
    order: 722-uern
    release_target: forge-local-experts-milestone
    status: ready
    desired_release: v0.5
    priority: p0
    kind: litmus
    title: 'The §4a negative two-project matrix as executable fixtures — the gate before 451 flips any lane'
    pickup_role: linux
    depends_on:
      - mirror-identity-vault-roles-exact
      - mirror-identity-per-project-dns
      - mirror-identity-lane-sidecar-and-sshd
    capability_tags:
      - security
      - litmus
      - multi-project
    estimated_hours: 2
    context: |
      Slice d of 606-bvnp: §4a M0-M7 made executable. Two REAL simultaneous
      projects in product-shaped containers — not hand-built stand-ins, for the
      reason recorded in 659-8faj. Every row is a fixture with a pass/fail exit
      code, and ALL rows must be green before T11 flips any lane to production
      sshd.
      M0 is the row that keeps the matrix honest: a broken stack passes every
      negative test. Without a positive control this suite could be green while
      nothing works at all.
    exit_criteria:
      - M0-M5 and M7 are executable fixtures with pass/fail exit codes, bound in openspec/litmus-bindings.yaml so they actually run
      - the positive control M0 fails if either lane cannot clone/fetch/push its own mirror
      - M6 is either green or explicitly reported blocked on T9, never silently omitted
    verifiable_closure: |
      One litmus suite runs the matrix against a throwaway Vault and two live
      projects; every row reports its own verdict; the suite is bound to a spec
      so it executes in a phase rather than only on demand.

events:
