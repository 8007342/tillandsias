    event:
      type: progress
      ts: "2026-08-13T22:30:00Z"
      agent_id: "linux-mutable-20260813t2217z"
      host: linux_mutable
      summary: >
        SPLIT (shaping, no implementation). This p0 has been ready and unclaimed
        for days as a single ~6h security implementation that no hourly cycle
        can start, let alone finish — and it blocks
        authenticated-forge-write-transport-impl and order 451. Splitting it is
        the reduction step available: the design is SIGNED and already
        enumerates the rungs, so the shaping is a transcription of D1/D9/D12/D13,
        T3-T13 and §4a rather than a new decision.
        Children: 722-hthz exact Vault signer roles and policies with no sign/*
        (criterion 2, makes M2 testable); 722-ft6g the opaque per-project mirror
        DNS swap plus provisioning at the three non-forge-launch mirror-create
        sites (criterion 3, the one swap point 659-8faj left deliberately
        unswapped); 722-ecne the per-lane sidecar, sshd principals and audit
        fields (criterion 4, rungs T3-T13); 722-uern the §4a M0-M7 negative
        matrix as bound executable fixtures (criterion 1, the gate before 451
        flips a lane). The first three are independent and can run concurrently
        on separate hosts; only the matrix depends on all of them.
        Two constraints carried into the children rather than left in prose:
        M6 stays BLOCKED on T9 because /vault/audit is a container-layer
        directory that dies on recreate, and M0 is mandatory because a broken
        stack passes every negative test. Criterion 5 (no forge secrets) was
        verified live in-forge on 2026-08-13 and is now a survival condition on
        722-ecne rather than an open item.
        Parent stays open as the criteria holder until the four children close.
