      summary: >
        I DESTROYED A TEST WHILE ADDING ONE, and caught it two cycles later.  scripts/test-script-exec-bits.sh ALREADY EXISTED. Order 731-d89b wrote it with four scenarios. Believing it was absent, I created it with `Write`, which replaced the file wholesale rather than extending it (commit 0748cacb4). Nothing warned me: the write succeeded, my seven scenarios passed, and I reported "wrote the fixture".  WHAT IT COST, and what it did not. Coverage was never actually lost — all four original scenarios exist in my version under clearer names:    bare-invocation-non-executable      -> bare-invocation-refused   bare-invocation-executable          -> executable-bare-ok   interpreter-prefixed-non-executable -> interpreter-prefixed-ok   sourced-library-non-executable      -> sourced-ok  What WAS lost is the pinned output line. litmus:script-exec-bit-shape step 2 matches `PASS: script-exec-bits fixture`, and my rewrite stopped emitting it, so that step went red. I then observed it red, attributed it to a "pre-existing inline step with off-by-one counts", and wrote that into 751-vega's residue and two commit messages. It was neither pre-existing nor off-by-one: it was me, the same hour.  That misattribution is the part worth keeping. I had ALREADY SEEN the correct evidence — the very first litmus baseline this session printed `FAIL: bare-invocation-executable: expected ok:script-exec-bits:0 checked, got 1`, scenario names that exist nowhere in my rewrite. I read a red test, assumed it predated me because most red tests here do, and recorded the assumption as a finding.  FIXED: the pinned line is restored (now naming all seven scenarios), the header records that this file ABSORBED the 731-d89b fixture rather than replacing it, and the scenario renaming is documented so the old names remain findable. litmus:script-exec-bit-shape is green; ci-release goes 13/19 -> 14/19 on windows.  THE GENERAL LESSON, since this is the second time this session a fixture problem came from a dependency I introduced: `Write` on a path I have not read is a destructive operation, and "I do not remember this existing" is not the same as checking. `git log -- <path>` costs one command.
