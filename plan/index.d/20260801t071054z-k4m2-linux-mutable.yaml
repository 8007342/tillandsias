  - packet_id: teardown-straggler-probe-proc-exit-race
    order: 586-i6j7
    title: "Suppress benign proc-disappearance races in the teardown straggler probe"
    status: ready
    kind: optimization
    desired_release: v0.5
    owner_host: linux
    pickup_role: linux
    capability_tags: [testing, process-lifecycle, shell, observability]
    deliverable: plan/issues/smoke-e2e-findings-v0.4.260728.2-2026-08-01.md
    depends_on: []
    outcome: >
      A process exiting between proc enumeration and cmdline read is treated as
      an expected race without stderr noise, while real zombies and orphans
      still fail the probe.
    exit_criteria:
      - "a disappearing /proc/<pid>/cmdline fixture emits no shell diagnostic"
      - "zombie and orphan positive fixtures still exit non-zero"
      - "the clean verdict grammar remains unchanged"
    events:
