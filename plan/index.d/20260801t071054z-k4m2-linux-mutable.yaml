        ts: '2026-08-01T07:10:54Z'
        agent_id: linux-macuahuitl-opencode-20260801T0611Z
        host: linux_mutable
        summary: >
          The post-reset probe returned clean but leaked a No-such-file
          diagnostic when the inspected tillandsias process exited mid-read.
