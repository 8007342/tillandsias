    title: |
      scripts/finalize-cycle.sh lands the mo-full attestation record — an append under plan/mo-full-attestations.d/ that the pre-push hook's plan-only lane admits without a gate — through scripts/land-on-platform-branch.sh, so on a busy trunk a three-line record pays up to four full gates and then refuses, and the host reads as wedged
    context: |
      MEASURED on yoga 2026-10-12, cycle-3 exit (loop-status
      20261012t112433z-283b275c-yoga.md): the cycle's work was already on
      trunk, the stamp was stale for the tree, and finalize's "land the
      ledger record" step — `scripts/land-on-platform-branch.sh "$BRANCH" 4`
      right after `git add plan/mo-full-attestations.d && git commit` —
      exhausted its four attempts between 09:59Z and 11:21Z on a commit whose
      diff was one appended record, sibling plan-lane pushes moving origin
      during each gate. It ended `refused:finalize:ledger-land-failed`:
      record committed, marker withheld. The remedy that worked took
      seconds: `git rebase origin/linux-next && git push origin linux-next`
      — the plan-only lane (record landed as e3be61ce5) — then
      `scripts/meta-orchestration-worktree-guard.sh verify <boundary>` and
      `scripts/mo-full-attest.sh self` derived the marker.
      THE LANE ALREADY ADMITS THIS SHAPE. The pre-push hook's plan-only lane
      lists plan/mo-full-attestations.d/?*.md as an append-only ledger
      validated by scripts/check-mo-full-attestations.sh (its own refusal
      text names the directory, quoted in 1228-xc6c). The record carries no
      code by construction. The gate the lander runs is for the TREE; the
      outgoing DIFF is one record the hook would accept ungated.
      COUNTER-MEASUREMENT, same host, cycle 6 (b626494f0, 15:45Z): with a
      valid full-scope stamp in the tree the lander adopted it
      (ok:land-adopts-valid-stamp) and the whole finalize took 14 s. So the
      cost appears exactly when code landed on trunk during the cycle — the
      normal state of a busy day — and 1335-2nzf (adopt on plan-only
      movement) does not reach it, because the stamp is then legitimately
      stale for the tree.
      CONSEQUENCE: the fleet heartbeat reads a host that commits without
      attesting as wedged; a transport choice turns an obedient cycle into a
      wedged-looking host, and the worker then hand-pushes with no guard
      asserting the remote proof the lander would have given.
      WHY NOT 1422-8wzb: that row is the WORK-land step pushing an
      integration product a cut freeze reads as code; this row is the
      RECORD-land step on any trunk, freeze or not. Both own
      scripts/finalize-cycle.sh and both resolve to "classify by the
      outgoing diff", so one change may close both; they are independently
      schedulable because the record step has its own fixture
      (scripts/test-mo-full-record-precedes-marker.sh) and its own measured
      failure, and either may land first. A note event on 1422-8wzb in this
      fragment says so.
      NOT ARGUING FOR A LOOSER LANE: the hook is unchanged; the change is
      finalize's choice of transport for a diff the hook already admits.
