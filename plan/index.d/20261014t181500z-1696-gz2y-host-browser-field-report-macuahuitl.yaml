packets:
  - packet_id: host-browser-mcp-success-results-carry-no-content-so-every-successful-tool-call-reads-empty
    order: 1696-gz2y
    status: in_progress
    kind: bug
    priority: p0
    desired_release: v0.5
    size: S
    pickup_role: linux
    capability_tags: [host-browser, mcp, forge]
    related: [1667-jna9, 1656-iktu]
    depends_on: []
    title: |
      Every successful host-browser tool call (publish_local, service_status, service_reload, browser_open, browser_list_windows) reaches the agent empty, because success results are a bare JSON object with no MCP content array; only errors are wrapped
    context: |
      Field report 2026-10-14 (calmecacpilli, tlatoani.net): publish_local served the site and browser_open opened windows, but every success reply arrived with no content, so the agent never got a window_id and could not screenshot, click, eval or read the console. Error replies (ENGINE_UNSUPPORTED, WINDOW_NOT_FOUND) arrived intact.
      Root cause, read in crates/tillandsias-browser-mcp/src/server.rs: tool_error() wraps its text as result.content[{type:text}] with isError=true, but the success arms return RpcResponse::Success with result set to the bare payload (for example the browser_open arm's {window_id, device, dev, engine, notice}). MCP clients render a tools/call result's content array, plus structuredContent when declared, so a bare object reads as empty. The unit tests assert on the bare fields, which is why they stayed green.
      Fix: wrap every tools/call success centrally in handle_tools_call as {content:[{type:text, text:<the payload as JSON>}], structuredContent:<the payload>}. Change the tests to read the content, as a client does.
    exit_criteria:
      - "a tools/call success for browser_open, browser_list_windows and service_status returns result.content[0].text that parses back to the payload (red today: no content key)"
      - "a live forge lane's agent receives a window_id from browser_open and uses it for a screenshot"
    unscoreable: "unpinnable-until-the-guard-exists: the content-shape assertion over every success arm is the deliverable"
    next_action: >
      macuahuitl is writing the central wrap in handle_tools_call plus a test that iterates every tool's success arm. Before the fix, run that test against today's server and record it red.
    provenance: |
      Filed by macuahuitl-fedora from the calmecacpilli forge field report, 2026-10-14; root cause read in code while filing.
    events:
      - type: filed
        ts: "2026-10-14T18:15:00Z"
        host: macuahuitl
        summary: |-
          Successful host-browser MCP replies have no content array; agents see them as empty.

