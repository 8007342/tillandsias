    desired_release: v0.5
    size: S
    pickup_role: linux
    capability_tags: [host-browser, webkit, browser, device-emulation]
    related: [1656-tjv4, 1643-q3at]
    depends_on: []
    title: |
      A WebKit MiniBrowser window opened for a device preset shows its own URL and menu bars; in device mode the window must be the device viewport only
    context: |
      Same field report: the operator expected no toolbars for device emulation. Toolbars change the effective viewport and break the "this is the phone" illusion. MiniBrowser and the Chromium framework window each need their kiosk or app-mode equivalent in device mode. The window's content size must equal the device's CSS viewport times the scale actually applied.
    exit_criteria:
      - "a browser_open with a device preset opens a window without a URL bar or menu, and the page's window.innerWidth/innerHeight equal the preset's CSS viewport, on WebKit and on Chromium"
    unscoreable: "unpinnable-until-the-guard-exists: the viewport arm is the deliverable"
    next_action: >
      Find MiniBrowser's flags for hiding the toolbar and menus in the pinned WebKit build. Then add an innerWidth/innerHeight assertion read back over the window's own channel.
    provenance: |
      Filed by macuahuitl-fedora from the calmecacpilli forge field report, 2026-10-14.
    events:
