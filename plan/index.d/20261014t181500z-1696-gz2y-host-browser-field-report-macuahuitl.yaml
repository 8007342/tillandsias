  - packet_id: a-dev-mode-chromium-window-with-a-device-preset-opens-desktop-sized-and-warns-of-unknown-flags
    order: 1700-dn8g
    status: ready
    kind: bug
    priority: p1
    desired_release: v0.5
    size: M
    pickup_role: linux
    capability_tags: [host-browser, chromium, device-emulation, cdp]
    related: [1655-urz9, 1656-iktu, 1696-gz2y]
    depends_on: []
    title: |
      browser_open {dev: true, engine: chromium, device: "iphone se"} opened a normal desktop-sized Chrome window with an "unknown runtime flags" warning; the device emulation did not apply
    context: |
      Same field report. 1655-urz9 emulates devices over a CDP pipe relay, and 1656-iktu gives dev mode raw CDP. In dev mode, either the emulation step is skipped, or the launch flags do not match the Chromium build in the chromium-framework image. The warning suggests a flag the build no longer knows. Two questions: does the dev-mode path call the same emulate-before-run sequence as the non-dev path (the window_cdp test every_page_is_emulated_before_it_runs covers the non-dev path), and which flag does the build reject?
    exit_criteria:
      - "a dev-mode Chromium window opened with a device preset reports the preset's innerWidth, devicePixelRatio and touch support, and the Chromium launch shows no unknown-flag warning (red today)"
    unscoreable: "unpinnable-until-the-guard-exists: the dev-mode emulation arm is the deliverable"
    next_action: >
      Diff the dev and non-dev launch paths in crates/tillandsias-headless/src/browser_open.rs and window_cdp. Run the pinned Chromium with the exact argv and read which flag it warns about.
    provenance: |
      Filed by macuahuitl-fedora from the calmecacpilli forge field report, 2026-10-14.
    events:
