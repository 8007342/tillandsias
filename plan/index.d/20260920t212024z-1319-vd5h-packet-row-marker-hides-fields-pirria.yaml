        to splitting on `- packet_id:` reintroduces the miscount that row removed.'
      - scripts/check-fragment-status-loss.sh is checked for the same defect and the finding is recorded
        either way — it shares the idiom at 3 sites; the other three scanners grepped in the same pass
        do not use it
