    title: 'check-scorable-obligation-added.sh starts a new packet row at ANY two-space list item (`/^  -
      |^    - /`), so a fragment written by a YAML dumper — whose sequences are indentless — flushes the
      row at its first exit_criterion and every field below it, including `unscoreable:`, is never evaluated

      '
    context: "MEASURED ON PIRRIA 2026-09-20. The checker refused a fragment whose\n`unscoreable:` field\
      \ was plainly present in the file:\n\n  violation:scorable-obligation-missing:1\n    ... packet\
      \ '...' carries no scorable obligation — add a verifiable_closure\n    naming a litmus:<test>, or\
      \ an explicit 'unscoreable: <reason>' (977-448j)\n\nI chased four wrong hypotheses (a missing tag\
      \ prefix, the row indentation, the\ndiff scope, a stale read) before running the checker's OWN awk\
      \ against the file,\nwhich answered UNSCOREABLE=no. That is the only step that found it, and it\
      \ is the\nmethod this row asks its claimer to use rather than reading the regex.\n\nTHE MECHANISM.\
      \ The row splitter is deliberately anchored to the list marker\nrather than to `packet_id:` — correctly,\
      \ and for a reason its own comment gives:\nrows in plan/index.yaml are written `- order: ...` with\
      \ packet_id a line below,\nso splitting on `- packet_id:` made them invisible (1093-hzhi). But it\
      \ anchors on\nINDENT: `/^  - |^    - /`, \"packet rows sit at 2 spaces (fragments) or 4 (the\nbase\
      \ index)\". A fragment written by yaml.safe_dump puts SEQUENCE ITEMS at the\nparent key's indent,\
      \ so `exit_criteria` items also sit at exactly two spaces.\nEach one therefore matches the row marker,\
      \ flushes the row, clears `pid`, and the\nnext rule — `pid == \"\" { next }` — discards every remaining\
      \ line of that packet.\nThe `unscoreable:` field twelve lines below is never evaluated.\n\nThe field\
      \ is in the file. The gate cannot see it. Both statements are true and\nthe author is the only person\
      \ positioned to notice, because the author is looking\nat the file.\n\nTWO LANDED FRAGMENTS HAD\
      \ IT, and are the evidence: 1313-w78k and 1314-2mdv, both\ngenerated with yaml.safe_dump, both carrying\
      \ an `unscoreable:` the checker's own\nawk reports as absent. Three hand-written heredoc fragments\
      \ from the same session\n(1309-q4kr, 1309-fhxb, 1310-7apk) report it correctly. The difference is\
      \ the\nwriter, not the content. Both have since been restated through\n`tillandsias-plan set-field`,\
      \ which writes into the LWW channel at the indent the\nfold reads (1071-adhj), so neither row is\
      \ invisible today — but the next\npython-written fragment will be.\n\nSIBLINGS, grepped in the same\
      \ pass and named rather than assumed:\n  scripts/check-fragment-status-loss.sh   SHARES the two-space\
      \ marker idiom (3 sites) — check it\n  scripts/check-added-fragments-parse.sh  does NOT use it (0\
      \ sites)\n  scripts/check-base-ledger-status-loss.sh   does NOT (0)\n  scripts/check-fragment-events-land.sh\
      \      does NOT (0)\n\nWHY IT IS THE NIGHT'S FAMILY: a structure-aware writer and a text-aware reader\n\
      agree about nothing except the parse. The same day produced a YAML round-trip\nthat silently dropped\
      \ eight comments from a litmus file, and a derived cheatsheet\ntree that only a command keeps true.\
      \ In all three the authored content was\ncorrect, the SERIALISATION was not what the next reader\
      \ expected, and the failure\nwas invisible to the author.\n"
    exit_criteria:
