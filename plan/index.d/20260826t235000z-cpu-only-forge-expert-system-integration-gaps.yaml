packets:
  - packet_id: cpu-only-forge-expert-system-integration-gaps
    order: 919-vvyv
    status: ready
    title: |
      CPU-only forge expert system gaps: embed model not pulled, index not built, no model tier strategy
    kind: bug
    pickup_role: any
    priority: p1
    desired_release: v0.5
    release_target: forge-local-experts-milestone
    capability_tags:
      - forge
      - experts
      - inference
      - integration
      - container-image
    estimated_hours: 4
    deliverable: |
      Three fixes: (1) pull nomic-embed-text during forge image build or first launch,
      (2) build spec RAG index on cold forge start or provide it as a pre-built artifact,
      (3) define a CPU-only model tier strategy distinct from GPU hosts.
    context: |
      OBSERVED on forge-tillandsias (freshly installed v0.4.260826.1 binary):

      DEFECT 1: EMBEDDING MODEL NOT AVAILABLE
      - nomic-embed-text is not pulled by default in the forge image
      - spec_answer_envelope() in forge-plan.sh:777 defaults to nomic-embed-text-v1-GGUF
      - On cold forge start, the model is absent: curl returns "model not found, try pulling"
      - This makes the ENTIRE RAG pipeline non-functional until someone manually pulls it
      - Measured: `curl http://inference:11434/api/embeddings -d '{"model":"nomic-embed-text","prompt":"test"}'`
        returns `{"error":"model \"nomic-embed-text\" not found, try pulling it first"}`

      DEFECT 2: SPEC RAG INDEX NOT BUILT ON COLD START
      - scripts/spec-index-ensure.sh must run to build chunks.jsonl + vectors.jsonl
      - On cold forge, spec_answer returns: "the spec RAG index is not built at <path>"
      - Index build takes ~60 minutes on CPU (21799 chunks at ~6 vectors/sec)
      - On GPU hosts this takes ~2 minutes — CPU hosts are 30x slower
      - The index should be either pre-built into the image or provided as a downloadable artifact

      DEFECT 3: NO CPU-ONLY MODEL TIER STRATEGY
      - The inference engine selection (images/inference/engine-tuning.sh) assumes GPU availability
      - CPU-only tier falls through to "core" backend (~30 MB) with no model recommendations
      - The expert system needs a model tier ladder that matches CPU constraints:
        * <4 GB RAM: 0.5b only (current state, hallucinates without RAG)
        * 4-8 GB RAM: 1.5b-3b (viable with RAG, slow but functional)
        * 8-16 GB RAM: 3b-7b (sweet spot for accuracy)
        * 16+ GB RAM + GPU: 7b+ (optimal, as reported by sibling hosts)
      - No guidance exists for operators or automation to select the right model

      EVIDENCE:
      - forge-startup-context.md: inference_state=ready, but only qwen2.5:0.5b cached
      - forge-startup-context.md: accel_class=unknown, accel_reason=envelope-not-exported
      - bench-inference-floor.sh: 0.5b prefill=435 tok/s, gen=128 tok/s (CPU)
      - Direct API test: 0.5b hallucinates 6/6 queries, 1.5b hallucinates 6/6 queries
      - Spec index build: 21799 chunks, ~60 min on CPU, ~2 min on GPU
    exit_criteria:
      - |
        nomic-embed-text is pulled automatically during forge image build or first-launch setup
      - |
        Spec RAG index is available as a pre-built artifact or built during first-launch
      - |
        CPU-only model tier documentation exists with RAM-based model selection guidance
      - |
        forge-startup-context.md reports embed model and index status accurately
    verifiable_closure: |
      Launch a fresh forge from the updated image, verify spec_answer returns a valid
      cited envelope (not unsupported) for a test query within 5 minutes of launch.
    evidence:
      - 'forge-plan.sh:777 — embed_model defaults to nomic-embed-text-v1-GGUF'
      - 'forge-plan.sh:797 — spec_answer refuses when index not built'
      - 'spec-index-ensure.sh — 21799 chunks, ~60 min on CPU'
      - 'Direct API test: both 0.5b and 1.5b hallucinate 100% without RAG'
      - 'bench-inference-floor.sh — CPU-only, no GPU offload'
    notes: |
      The expert system's architecture is sound (orders 547/548) — the L0 deterministic
      experts work perfectly, and the L1 RAG pipeline's design (embed -> retrieve -> synthesize)
      is correct. The problem is OPERATIONAL: the prerequisites (embed model, index) are not
      met on a cold forge, and no model tier guidance exists for CPU-only hosts.

      This is the same class of defect as order 552 (the embedding step that "existed only as
      English prose inside forge-plan.sh's refusal message"): the system knows what it needs
      but doesn't provision it automatically.

      Sibling hosts with GPUs report 7b as the sweet spot. This host (3.8 GiB, CPU-only)
      cannot run 7b. The resource request (919-jii2) and this finding together address
      the full gap: more resources + automatic provisioning.
