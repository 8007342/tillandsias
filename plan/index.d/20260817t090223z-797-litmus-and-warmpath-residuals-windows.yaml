# Filed by windows (Yolanda), 2026-08-17, during the 781-6gys criterion-2
# verification cycle. Three findings the criterion-2 run surfaced: one litmus
# step that dirties the checkout it validates, and two residuals that bound how
# much the 781-6gys warm path actually buys.
packets:
  - packet_id: litmus-ledger-node-claim-step5-writes-out-txt-into-the-checkout
    order: 797-295s
    status: ready
    desired_release: v0.5
    priority: p2
    kind: bug
    title: "litmus:ledger-node-claim-shape STEP 5 redirects into a relative out.txt at the repo root and only removes it on the success path, so any timeout strands untracked dirt in the working tree"
    deliverable: "the step writes its artifact under a mktemp -d (never a relative path in the checkout), plus a greppable constraint that no litmus step redirects to a relative path — the budget resize is a separate, cosmetic concern"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [litmus, meta-orchestration, hygiene, windows]
    estimated_hours: 1
    context: |
      OBSERVED 2026-08-17 on windows/Yolanda at 5e1905781, running
      `scripts/run-litmus-test.sh meta-orchestration --phase pre-build
      --size instant`. STEP 5 of litmus:ledger-node-claim-shape ("every
      verdict line is well-formed against the grammar") TIMEOUT at its
      5000ms budget, and left `out.txt` untracked in the repository root.

      The step's LOGIC is correct — the stranded artifact contains exactly
      the five well-formed verdicts it asserts (claimed / in-flight /
      in-flight / released / free → tot=5 good=5, a PASS). Only the budget
      expired, mid-step, before the trailing `rm -f out.txt`.

      The defect worth fixing is the redirect target, not the budget. The
      command does `{ ... } > out.txt 2>/dev/null` with the harness cwd at
      the repo root, then `rm -f out.txt` at the very end — cleanup on the
      SUCCESS PATH ONLY. Any timeout or non-zero exit therefore leaves a
      status-visible untracked file behind.

      That is a cross-host hazard, not a windows one. The meta-orchestration
      startup boundary treats a status-visible untracked path as
      sibling/operator work that must remain byte-identical, so a litmus run
      before a cycle's `snapshot` can hand that cycle a dirty-start refusal,
      and a run after it can fail the Finalization `verify`. This cycle hit
      exactly that and had to remove the file by hand before it could satisfy
      the exit contract. On linux the step finishes fast, self-cleans, and the
      latent defect is never observable — high spawn cost is what exposed it,
      not what caused it.

      Sibling context (already recorded, different owners): the two other reds
      in that suite are item 4 (credential-channel STEP 8 — root cause now
      named: the fixture pins `env PATH=/usr/bin:/bin` and `git` is on neither
      on this host) and item 2 (dirty-tree STEP 5, hash-image-sources
      portability). Detail for all three:
      plan/issues/windows-red-meta-orchestration-litmus-2026-08-16.md

  - packet_id: forge-warm-path-evidence-is-debug-gated-in-the-lifecycle-log
    order: 797-thbw
    status: ready
    desired_release: v0.5
    priority: p2
    kind: enhancement
    title: "The forge lifecycle log the startup context points agents at is written only when TILLANDSIAS_DEBUG is set, so the expert warm-path verdict (ready (cache-volume) / building / degraded) is invisible in every normal lane"
    deliverable: "the expert-readiness verdict is observable in a default lane — either trace_lifecycle's file sink is ungated (stderr stays debug-gated) or the forge-experts state file is surfaced where an agent is already told to look"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [forge, observability, meta-orchestration, fail-loud]
    estimated_hours: 2
    context: |
      FOUND 2026-08-17 while producing 781-6gys criterion-2 evidence. The
      operator's expected evidence for the warm path was the literal line
      `ready (cache-volume): restored ... — no cargo` in
      /tmp/forge-lifecycle.log. In a live, passing lane that file contained
      no `experts` line at all.

      Cause: images/default/lib-common.sh trace_lifecycle() returns early
      unless TILLANDSIAS_DEBUG is set —

        [ -n "${TILLANDSIAS_DEBUG:-}" ] || return 0

      — and the early return precedes BOTH sinks (stderr and the append to
      /tmp/forge-lifecycle.log). The comment above it justifies gating only
      the terminal ("in production, these clutter the terminal (stderr shares
      the display)"), which is a sound reason to gate stderr and no reason at
      all to gate the FILE. TILLANDSIAS_DEBUG reaches the container only via
      the `--debug`/`--diagnostics` CLI flags
      (tillandsias-headless main.rs: `if debug { args.extend(["--env",
      "TILLANDSIAS_DEBUG=1"]) }`), and the sanctioned harness
      (scripts/litmus-opencode-e2e-launch.sh) passes neither.

      Why it matters beyond this packet: the forge startup context tells
      in-forge agents outright that expert build details live in
      `/tmp/forge-lifecycle.log` (lib-common.sh ~line 3969). An agent that
      follows that instruction in a normal lane finds an empty file and
      cannot tell `ready (cache-volume)` from `ready (cached)` from
      `building` from `degraded (no-plan-crate)` — the exact four-way
      distinction 781-6gys and order 531 both turn on. So the one diagnostic
      the docs name is absent precisely when nobody passed a debug flag,
      which is every automated lane.

      Evidence had to be reconstructed indirectly instead: cache-volume
      mtimes plus wall-clock (an 80s lane cannot contain a cargo build) plus
      the absence of a `Finished release profile` line. That reconstruction is
      exactly the work the log exists to make unnecessary.

  - packet_id: prebuilt-plan-cache-key-invalidated-by-any-plan-crate-or-lockfile-commit
    order: 797-5sqs
    status: ready
    desired_release: v0.5
    priority: p2
    kind: research
    title: "The 781-6gys prebuilt-plan warm path is keyed on plan-crate+Cargo.lock content, so it misses on any lane whose clone moved past the last publish — measured missing between two lanes three minutes apart"
    deliverable: "a named, measured answer to 'what fraction of real lanes hit the warm path, and what is the worst-case lane cost when they miss with a COLD cargo target', with the 600s cap as the pass/fail line"
    pickup_role: any
    release_target: stable-milestone-v1
    capability_tags: [forge, performance, meta-orchestration, e2e]
    estimated_hours: 3
    context: |
      MEASURED 2026-08-17 on windows/Yolanda across two consecutive
      smoke-mode lanes, both green, three minutes apart:

      - Lane 1 (08:55:53Z→08:57:13Z, 80s): warm RESTORE. The cache volume's
        cargo/prebuilt-plan/{tillandsias-plan,source-hash} was still stamped
        2026-08-16T23:50Z DURING the lane while the installed expert appeared
        at 08:56 — a restore publishes nothing, so an unchanged cache dir
        alongside a fresh install is the restore signature.
      - Lane 2 (08:58:26Z→…): cache MISS on key. It rebuilt
        (`Finished release profile [optimized] target(s) in 28.68s`) and
        republished, moving the key from ccc55a83… to 59cdba15…

      The key is a content hash over the plan crate's *.rs/Cargo.toml/
      capabilities.txt plus the project Cargo.lock
      (_forge_experts_source_hash). Between the two lanes the enclave mirror
      refreshed to a clone containing a9037ac28 ("fix(guard): an unparseable
      fragment refuses…", 2026-08-17T07:55Z), which touches
      crates/tillandsias-plan — so lane 1 was warm only because its clone was
      BEHIND, and lane 2 paid the rebuild the moment the mirror caught up.

      This is correct cache behaviour, not a defect, and the residual it
      leaves is the point: on this repo the plan crate and Cargo.lock move
      several times a day (four commits touched them in the ~8h before this
      cycle), so the steady state for a lane launched after any such commit is
      a MISS, and 781-6gys's headline win does not apply to it.

      What actually kept lane 2 inside the cap was the OTHER persistent
      surface — the warm cargo target dir in the same volume — which reduced
      the miss to a 28.68s incremental build. That is the load-bearing
      assumption now, and it is the one 781-6gys's own filing context recorded
      as absent during the two FORGE_EXIT=124 runs (the volume was created
      mid-run on 2026-08-16, so both capped runs paid a COLD build). So the
      cliff has not been removed, only moved behind a second cache: a lane
      that misses the key with a cold-or-pruned target dir should be expected
      to return to the 600s cap.

      Worth measuring rather than guessing, and cheap to measure: prune the
      target dir, force a key miss, and time one lane.
