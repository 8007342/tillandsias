    title: "Before making a new worktree, check free space and remove finished, already-pushed worktrees; skills use this check"
    context: |
      Rules D4 and D5 of openspec/changes/forge-storage-single-root-and-disk-discipline. A full disk is the likeliest overnight forge crash. One binary subcommand (no new shell script) reads free space of the target filesystem, lists worktrees, evicts clean ones whose HEAD is contained in a remote ref oldest first, never evicts unpushed or dirty ones, and refuses with refused:disk-low:<path>:<free> when the threshold (host max(2 GiB,15%); forge L0 25%) cannot be reached. Wire it into the skills listed in design D5 and add the startup-context disk line. 1866-ubtc owns the in-forge source tmpfs pruning of .claude/worktrees/agent-*; this packet provides the shared preflight it can call.
    exit_criteria:
