  - packet_id: fat-spec-expert-cannot-refuse-an-out-of-corpus-question
    event:
      type: progress
      ts: "2026-09-02T21:54:55Z"
      agent_id: linux-yoga-claude-20260902t202842z
      host: yoga
      summary: |
        RE-MEASURED THE CONVERSION AGAINST THE LANDED FILES AS next_action ASKED,
        AND THE ANSWER IS THAT THE LANDED CONTENT WAS NOT WORKING: 1 of 4, down
        from the 2 of 5 measured on the JSONL. The cause is not the content and
        not the wording. It is CHUNK GRANULARITY, and it is now fixed and
        re-measured at n=579.

        THE MEASUREMENT next_action ORDERED. Built the index on this host from
        linux-next 2acb4f9ca (generation 77f8611, 22,682 chunks,
        nomic-embed-text, no prefix), then asked the four anticipated near
        misses. Top-1 against the LANDED methodology/declined-alternatives.yaml:

          Helm rollback        0.6309  declined-alternatives.yaml   CONVERTED
          docker-compose.yml   0.6512  cheatsheets/runtime/container-gpu.md
          Ansible playbook     0.6279  openspec/specs/host-shell-architecture
          Terraform modules    0.6303  methodology/bootstrap/router.yaml

        So the corpus content lenovinha landed on 2026-08-31 was correct, was
        indexed, and still lost three of its four questions. Reporting 2/5
        forward without re-measuring would have recorded a working mechanism
        that was not working.

        THE CAUSE, found by looking at the chunks rather than the text. All
        three records were nested under one column-0 key, and `chunk_yaml` cuts
        at COLUMN-0 keys, subdividing only above MAX_YAML_CHUNK_CHARS (4000):

          key=declined_alternatives  lines 23-65  2625 bytes  -> ONE chunk

        One chunk gets ONE embedding, and cosine similarity is TOPICAL, so that
        embedding was dominated by its first and longest entry. Helm won because
        Helm was the topic the chunk was mostly about. The other three were
        present as text and absent as retrievable content.

        This is the harness README's own Ansible lesson generalised — "one
        sentence inside a chunk about five other tools does not move the chunk's
        embedding enough" — and it survived being written down because nothing
        made the FILE SHAPE enforce it.

        THE FIX AND ITS VERIFICATION. Restructured the file so every declined
        technology is its own column-0 key, which is where the chunker cuts.
        Verified against the real chunker, not assumed:

          trace                          1-47   2997b
          declined_helm_and_kubernetes  48-57    582b
          declined_docker_compose       58-65    464b
          declined_ansible              66-73    415b
          declined_terraform            74-93   1182b
          systemd_is_used_not_declined  94-104   753b

        Six topical chunks where there was one. Then injected the EXACT landed
        chunk texts into a clone of the live index (inject-negatives.sh,
        alignment and join verified, 22682 + 4 = 22686) and re-asked:

          question              nested-one-chunk              one-chunk-each
          Helm rollback         0.6309 declined-alts          0.7522 declined-alts
          docker-compose.yml    0.6512 container-gpu.md       0.8484 declined-alts
          Ansible playbook      0.6279 host-shell spec        0.7852 declined-alts
          Terraform modules     0.6303 bootstrap/router       0.6930 declined-alts
          (control) systemd     0.7945 vz-framework           0.7945 vz-framework
          (control) sourdough   0.5824 a spec                 0.5824 a spec

        1 of 4 -> 4 of 4, with no word of the content changed. Helm improved too
        (0.6309 -> 0.7522) once it stopped sharing an embedding with three other
        technologies.

        ZERO IN-CORPUS REGRESSION, MEASURED AT n=579 RATHER THAN ASSERTED. Ran
        the full questions-wide-579 set against both indexes and diffed row by
        row. Exactly 8 rows changed top-1, all 8 in the NEAR band, 5 distinct
        questions; ZERO in-corpus rows and ZERO far rows changed, and the
        in-corpus floor is identical to six decimals (0.561872 both runs). Six
        near rows now retrieve declined-alternatives.yaml. The far controls are
        byte-identical, so the retrieval floor's behaviour is untouched.

        WHAT THIS DOES AND DOES NOT CLOSE. Criterion 2's near band is still
        routed to 853-6gz3's validation layer and this does not change that: a
        declined-alternatives chunk converts ANTICIPATED near misses, one topic
        at a time, and "what is the flibber flobber" is untouched by it (0.5467,
        refused by the floor, correctly). What changed is that the anticipation
        mechanism now actually fires for every topic it names instead of only
        the first.

        THE STANDING CAUTION IN next_action EARNS A SECOND CLAUSE. It said the
        harness measures whether a record CONVERTS a question, never whether it
        is TRUE — both properties, only one tested. Add: it also never measures
        whether the record will be CHUNKED so it can convert anything. A record
        can be true, landed, indexed and inert. Verify the chunk, not just the
        file.

        Also corrected in passing: negatives-declined-alternatives.jsonl still
        carried the false "systemd unit files are NOT used" sentence that
        lenovinha caught and fixed only in the landed YAML. inject-negatives.sh
        re-injects from that JSONL, so the next host to run an injection would
        have written the falsehood back into an index as authority.

        Evidence committed:
          scripts/refusal-calibration/results-wide-579-nomic-20260902-yoga.tsv
          scripts/refusal-calibration/results-wide-579-nomic-20260902-yoga-split-chunks.tsv
          methodology/declined-alternatives.yaml (restructured, rationale + table inline)
