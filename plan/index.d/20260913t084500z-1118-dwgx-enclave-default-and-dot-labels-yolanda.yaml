      summary: >
        TWO DEFECTS, BOTH LIVE, BOTH SMALL.

        THE SECURITY HALF. scripts/launch-chromium.sh built its podman argv with
        `--network=${TILLANDSIAS_BROWSER_NETWORK:-host}`. Every other flag in
        that same array is a confinement — cap-drop=ALL, no-new-privileges,
        read-only, userns=keep-id, tmpfs for /tmp and the chromium caches — and
        the network line handed Chromium the host network with no proxy
        filtering, undoing them by default. It now falls back through
        TILLANDSIAS_ENCLAVE_NET to tillandsias-enclave, which is the spelling
        check-enclave-network-internal.sh already uses, so an operator who
        renames the enclave renames it once. TILLANDSIAS_BROWSER_NETWORK still
        wins for a deliberate override.

        THE ROUTING HALF. validate() in the browser-mcp allowlist required
        exactly three host labels, so `web.tillandsias.org.localhost` — four
        labels — was denied as a malformed host, and browser.open failed for
        every project directory named after a domain. The shape is still
        <service>.<project>.localhost: first label the service, LAST label
        `localhost`, everything between rejoined as the project.

        WIDENING THE COUNT IS SAFE AND THE TEST SAYS SO RATHER THAN THE COMMENT.
        The rejoined project is compared for exact equality against the caller's
        project_label immediately below, so `evil.com.acme.localhost` yields
        project `com.acme` and matches nothing unless the caller really is that
        project. That is pinned as a negative control
        (dotted_project_still_refuses_a_mismatched_project asserts
        ProjectMismatch with actual="tillandsias.org"), and the three-label
        minimum is pinned separately so the widening cannot lower the floor.
