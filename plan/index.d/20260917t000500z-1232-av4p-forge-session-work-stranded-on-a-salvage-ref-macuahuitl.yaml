    title: |
      an OpenCode forge session that cannot be messaged completed EIGHT packets and 441 lines of code onto a salvage ref — all eight read `ready` on trunk, and one of them claims the release gate has a false green
    context: |
      FOUND BY THE COORDINATION PASS 2026-09-16T23:55Z, by running
      scripts/salvage-audit.sh rather than by anyone reporting it. The operator
      had said a BigPickle/OpenCode session was running inside a Tillandsias
      Forge on Yolanda's hardware, that it could not be controlled or messaged
      from the fleet, and that "I think it just claimed some packets and will
      hopefully complete them". It did complete them.
      THE REF: salvage/unknown/20260916-920-cluster-forge-20260916, tip
      6db5aa8b8, pushed 2026-09-16T22:33:38Z, two commits ahead of 5a7cdee07,
      subject "salvage(unknown): dirty worktree preserved before a cycle
      refusal". So 872-c9nd's net did exactly its job: the cycle refused on a
      dirty tree and the work went to origin instead of sitting in a directory.
      This row exists because the net is where the story is SUPPOSED to
      continue, and nothing continues it automatically.
      WHAT IS ON IT: 22 plan fragments and 441 lines of code across 11 files —
      build.sh, crates/tillandsias-headless/src/{main.rs,pty_handler.rs,
      tray/mod.rs}, crates/tillandsias-plan/src/{fragments.rs,main.rs},
      images/default/cli/tellme, images/default/lib-common.sh,
      openspec/litmus-tests/litmus-mcp-discoverability-shape.yaml,
      scripts/check-capability-row.sh, and a new
      scripts/test-populate-hot-paths-negative-control.sh.
      The fragments are in three waves by timestamp: eight `in_progress` claims
      at 21:36, eight event-only notes at 21:55:0x, eight `implemented` status
      writes at 21:55:3x, plus two later events on two further packets. The
      agent id is forge-tillandsias-opencode-20260916t214000z.
      THE COORDINATION DEFECT, MEASURED. All eight packets read `ready` on
      trunk. Verified directly for four of them
      (build-guest-binaries-prints-error-and-exits-zero-inside-a-green-ci-full,
      build-check-and-release-flag-combination-hard-fails,
      populate-hot-paths-fails-silent-and-traces-success,
      ledger-fold-silently-ignores-inert-fragments) with
      `tillandsias-plan status`. So `plan_next` would offer another host work
      that is already finished, by a host nobody can ask. This is 1034-whsp's
      relay gap with the relay horizon at INFINITY rather than at two hours: a
      platform host's claim reaches trunk when a coordinator relays the branch,
      but a forge session's claim reaches trunk only if someone runs the salvage
      audit and chooses to act on it.
      ONE OF THE EIGHT IS A RELEASE-GATE INTEGRITY CLAIM AND IT IS WHY THIS IS
      p1: `build-guest-binaries-prints-error-and-exits-zero-inside-a-green-ci-
      full`. If that is accurate, the gate this fleet uses to decide whether to
      ship prints an error and exits zero — a false green inside the release
      decision itself. It is a CLAIM, not an established fact, and it is
      unverified here.
      DO NOT RELAY THE CODE ON THE STRENGTH OF THIS ROW. A forge session's
      landings have narrated mechanisms that were never invoked and cited orders
      that did not apply; the standing rule is audit before trust. 441 lines
      touching the headless crate, build.sh and the guest images, arriving
      during a release window, is the worst possible thing to sweep in
      unexamined. The claims are relayed because they are TRUE AS WRITTEN — the
      forge did claim these at 21:36 — and the `implemented` writes are NOT
      relayed, because `implemented` on trunk with the implementation on a
      salvage ref is a statement the ledger would carry and nothing would
      support.
      WHY THIS IS NOT SIMPLY "RELAY IT LATER". The forge cannot be told anything.
      It cannot be asked whether it is still working, whether the salvage ref is
      its final state, or whether it will push again. Every other host in this
      fleet can be sent a message and answer. This one produced eight closures
      and a refusal, and the only channel it has is a ref name.
