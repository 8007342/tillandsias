        THE COLLECTOR NO LONGER DESTROYS. Exit criteria 1 and 2 are closed;
        3 and 4 remain.

        THE FIX, and it is the port the packet described. Both compaction paths
        computed `consumed = fragments.iter().map(|f| f.path.clone())` — every
        fragment that LOADED — while the doc comment two lines above said "the
        fragments it FOLDED" and explained exactly why that distinction is the
        whole safety property. `fragment_coverage_gaps(result, frag)` now walks
        each fragment's records and asks whether each reached the result; only
        a fragment with zero gaps is consumed. The rest are REFUSED and left on
        disk, with the reason printed.

        WHAT COUNTS AS A GAP, and one deliberate exclusion:
          * a `packets:` entry whose packet_id is absent from the result
          * an `events:` list item with NO `event:` block — a packet DEFINITION
            under the wrong key (812-d45t), which the fold `continue`s past in
            silence. This is the shape that lost order 801-kqme's three
            follow-up packets.
          * an event whose packet is not in the fold, so it was discarded
          * a `status:` write whose packet does not exist at all
          * ANY `capabilities:` block, because no writer serialises that channel
          * NOT FLAGGED: a `status:` write that merely lost LWW. Losing a
            last-writer race is the designed semantics, not loss — the packet
            is present and the write is simply not the winner. Flagging it
            would refuse nearly every real compaction, and a guard that refuses
            everything is switched off within a day.

        THE SUBTLETY ON THE TEXT PATH, which is the actual capabilities fix:
        compact_text checks coverage against the RE-PARSED CANDIDATE, not
        against `merged`. The failure there is not that the fold missed
        something — it is that the RENDERER dropped what the fold held.
        `capabilities:` is precisely that: fold_capabilities reads it, no writer
        emits it, so it exists in `merged` and never in the text that replaces
        the base. Checking against `merged` would have called it covered and
        deleted the only copy.

        NON-VACUITY, and the mutant reproduced the data loss rather than merely
        failing an assertion. scripts/test-compaction-coverage.sh, hermetic
        under mktemp because the thing under test deletes files, 10 assertions,
        wired into ./build.sh --check.
          clean:  exit 0, 10 passed 0 failed
          mutant: replace the coverage call with an always-empty gap list —
                  exit 1, 7 of 10 failed, and the decisive one reads
                  "the misplaced-definition fragment SURVIVED (expected
                  present, got ABSENT)". The old behaviour DELETED it, in the
                  fixture, on demand.
          restored: exit 0, source byte-identical.

        THE BLOCKER IS LIFTED. `tillandsias-plan compact` is safe to run again:
        it now refuses anything it cannot round-trip rather than eating it. The
        standing DO-NOT-RUN on periodic-deslopification-sweep is withdrawn.
        Note the practical consequence — compaction will now shrink the base by
        LESS than before, and the difference is exactly the data the old
        implementation was destroying.

