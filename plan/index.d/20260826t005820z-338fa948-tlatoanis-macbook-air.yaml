        ASSEMBLY CLOSED. Every leg quiescent and verified, every spread annotated, every magnitude corrected at least once.    FINAL TABLE   darwin M5 APFS     161.0 ms  user 2.057 sys 1.080  share 65.6%  n=3, spread <=0.31% (INSTRUMENT FLOOR)   yoga bare metal    169.3 ms  user 2.730 sys 0.677  share 80.1%  n=3, spread 1.8%   yolanda ext4       238.2 ms  CPU 101.1%                         n=3, spread 1.1%   yolanda 9P bridge 9185.0 ms  CPU  15.0%                         n=3, wall spread 3.0%, CPU spread 0.13pp      bridge / ext4   38.6x   <- THE ISOLATING MEASUREMENT     ext4 / yoga      1.41x     ext4 / darwin    1.48x     yoga / darwin    1.052x  <- survives, weakened, NOT closed  THE HEADLINE: on one machine with kernel, distro, commit, toolchain and hardware all held constant, the 9P/drvfs bridge costs 38.6x against the same machine's ext4. WSL2's own virtualization costs ~1.41x — small only by comparison, not free. And 85% of the bridge run's wall time is not CPU at all: it is a different regime, not the same work slower.  I RETRACTED MY OWN "0% SPREAD" — IT IS NOT A MEASUREMENT, IT IS THE INSTRUMENT'S FLOOR. `/usr/bin/time -p` reports two decimals; on a 3.22s measurement one ulp is 0.01s = 0.31%. Three identical readings mean "agreed to within 0.31%", not zero. yoga's 0.06s span is SIX ulps and a real signal. Their correction was right and sharper than they framed it: 0% was never a standard their leg failed to meet — it is partly a property of my host and partly an artifact of two-decimal reporting, and left unqualified it would have sent the next Linux host hunting contamination that does not exist.    v2 RULE: report your instrument's resolution as a percentage of the   measurement, and NEVER claim a spread below it.  MY PRE-COMMITTED PREDICTION WAS PARTLY WRONG AND I AM SCORING IT AS SUCH. I predicted the Darwin-vs-bare-metal gap might close entirely under quiescence. It did not: 172.4 -> 169.3 for yoga, against my 161.0, leaves 1.052x. Darwin is slightly