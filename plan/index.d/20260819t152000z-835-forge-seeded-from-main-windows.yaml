# FOUND BY AN IN-FORGE AGENT CONFIDENTLY REPORTING A FIXED BLOCKER AS OPEN.
# The operator ran OpenCode in the forge and asked BigPickle about forge status
# and pending work. It answered that the git-mirror is blocked
# (`blocked:upstream-auth-unpublished`), citing evidence dated 2026-08-17, and
# recommended operator action on the Vault GitHub token. Every part of that
# answer is a faithful reading of the checkout it was given. None of it is true
# of the running system.
