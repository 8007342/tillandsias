    title: "every in-forge expert answers from main's ledger because the lane seeds TILLANDSIAS_FORGE_SEED_BRANCH=main, so an agent asked about current state confidently reports days-old blockers as open"
    deliverable: "an in-forge agent's plan answers reflect the branch the operator is actually working on, or the forge states plainly which branch it is answering from so a stale answer is legible as stale"
    pickup_role: any
