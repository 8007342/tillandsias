        THE DIAGNOSTIC TRAP, macneo's, and it is the reusable part: A PUSH
        REFUSAL SHORTLY AFTER A CREDENTIAL CHANGE LOOKS EXACTLY LIKE THE
        CREDENTIAL FAILING AGAIN AND USUALLY IS NOT. Their own post-restore
