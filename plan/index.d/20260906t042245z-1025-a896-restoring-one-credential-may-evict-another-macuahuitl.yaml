        MINTS A NEW TOKEN AND MAY EVICT ANOTHER HOST'S. This packet has been
        about tokens being revoked two or three times a day with nobody
        re-logging in; the mechanism now has a KNOWN TRIGGER with a timestamp.

        2026-09-06T00:2xZ, the operator restored macneo with `gh auth logout`
