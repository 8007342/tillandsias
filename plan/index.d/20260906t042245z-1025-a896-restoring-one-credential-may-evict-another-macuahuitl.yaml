      summary: |
        A SERIAL RESTORATION CAN END WITH EXACTLY ONE HOST AUTHENTICATED NO
        MATTER HOW MANY TIMES IT IS RUN. pirria's observation, and it retires
        the remedy I proposed two events ago.

        I asked the operator for "a token strategy that does not evict, or a
        known ORDER of restoration". The second half does not work: if a
        fleet-wide fix is logout+login on each host in turn, and each login
        evicts an earlier one, then ordering changes WHICH host ends up
        authenticated and not HOW MANY. Sequencing cannot solve a pool with an
        eviction bound below the fleet size. The ask needs the eviction bounded,
        or a token type that does not participate in the pool at all.

        TIMELINE, now with two known mints:
          ~00:2xZ  macneo restored   (logout + login)
          04:08:17Z pirria restored  (logout + login), fingerprint
                    d8a51d78c65eb5bf — new, distinct from both of that host's
                    prior fingerprints. Token never printed.
        So macneo became the oldest live mint at 04:08:17Z and is the host most
        likely to have just lost one. Warned directly, mid-gate, before their
        first push in a day.

        pirria's T0 IS THE DATAPOINT THIS PACKET NEVER HAD. Every prior
        observation was a login ON TOP OF an already-stale token, so
        time-to-revocation could not be measured from a known-clean start.
        04:08:17Z with a captured fingerprint is such a start. If another
        restoration kills it, the interval between that login and pirria's first
        401 is the eviction LATENCY, measured rather than inferred.

        CORRECTION — PIRRIA IS NOT PUSH-CAPABLE AND MUST NOT BE RECORDED AS
        RESTORED. `gh` works; `credential.helper` is UNSET in all three scopes
        (system, global, local). `gh auth login` populated gh's own keyring and
        never ran `gh auth setup-git`, so GIT still has no credential channel.
        That is a DIFFERENT fault from token revocation and is why that host
        reported `missing:no-credential-channel` rather than a 401. They have
        NOT run `setup-git` — it mutates host git config, which is outside what
        the smoke authorisation covers — and surfaced it to the operator
        instead. Correct call: the authorisation named a smoke, not a config
        change.

        TWO NON-EVIDENCE ITEMS, named by pirria so they do not enter the record
        as proof, which is the discipline this fleet keeps relearning:
          `git push --dry-run` reached the pre-push hook — but the hook fires
            BEFORE network auth, so it is not an auth signal at all.
          `git ls-remote` succeeded — but this repo is PUBLIC, so anonymous read
            fully explains it.
        Both look like evidence of a working credential and neither is.
