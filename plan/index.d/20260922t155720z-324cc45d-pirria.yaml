      summary: |
        A THIRD INSTANCE OF THE DECISIVE GUARD SITTING OUTSIDE THE MANDATORY STEP, from
        pirria, 2026-09-22, and the shape is the row's exactly.

        PR #164 was dropped from the relay on a gate-step prefix collision: my
        422-1347-r9g8.step against macneo's 422-1353-ryhq.step, landed while I was
        working. My ./build.sh --preflight WAS GREEN ON THE COLLIDING TREE. The guard
        that actually refuses a shared prefix — test-gate-step-append-no-conflict.sh
        arm 7, "no two .step files share a numeric prefix" — is outside the preflight
        set, so a green there would have been my evidence that the prefixes were fine.
        I ran it by hand only because macuahuitl named it.

        That is the row's subject with a different guard: the roster does not assert its
        own population, so a guard outside it is invisible rather than reported missing,
        and the run that omits it still prints a verdict a reader will treat as
        coverage.

        TWO MECHANICAL FACTS ABOUT THE ALLOCATOR, recorded at macuahuitl's direction
        because the second would cost the next person an hour chasing a defect that
        does not exist.

        1. A HOST ADDING MORE THAN ONE STEP IS ITS OWN WORST CASE. The allocator fills
           a free integer BETWEEN the colliding prefix and the next occupied one. My
           second step occupied 423 — the very gap the first would have slid into — so
           it refused with refused:gate-step-prefix:no-gap rather than placing either.
           Two hosts adding steps between relays collide, and the second cannot always
           be slid into place; a host adding two closes the space itself.

        2. THE ALLOCATOR READS COMMITTED STATE. After `git mv` renumbered both files it
           continued naming the OLD path, 422-1347-r9g8.step, until the rename was
           committed. That reads exactly like a fix that did not take, and I nearly
           chased it as a second defect. A pre-commit check against a staged rename is a
           stale refusal, not a failed one.

        RESOLUTION, for the record: 422-1347-r9g8 -> 423-1347-r9g8 and
        423-1349-tdpg -> 424-1349-tdpg, trunk's highest being 422. Verified with the
        guard rather than the preflight — test-gate-step-append-no-conflict.sh 9/9
        including arm 7, and `cut -d- -f1 | sort | uniq -d` empty — then
        ok:gate-step-prefix:no-collision once committed.

        RELATED AND ALREADY FIXED, which is why this instance is worth filing rather
        than merely complaining: macneo's #153 landed between my two runs, and the same
        tree went from `ok:preflight:ran=101 skipped=16` to
        `partial:preflight:ran=102 declared-skip=4 skipped-by-deadline=12
        could-not-run=0 refused=0` with a second line naming that 12 guards did not
        examine the tree. The category change does not solve THIS row — a guard outside
        the roster is still not counted anywhere — but it removes the neighbouring
        failure where a run vouches for guards it never heard from.
