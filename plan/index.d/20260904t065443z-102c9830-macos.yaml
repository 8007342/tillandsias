      summary: |-
        GUEST RE-RUN DONE AGAINST THE CHOSEN VALUE — and it found a defect in the change
        it was confirming, so read the second half before treating this as a clean pass.

        WHAT WAS ASKED, ANSWERED. `${HOME}/.local/state/tillandsias/ca` with HOME=/root,
        run in a live Mac guest via --exec-guest through the preamble's actual CA block:

          ca_dir=/root/.local/state/tillandsias/ca
            rc=0  key=present  crt=present  perms=600  owner=root
            resolved=/root/.local/state/tillandsias/ca
          HOME in guest is /root

        So the value works in the guest: creatable, key written, 600, root-owned, and it
        resolves to itself with no symlink indirection. That is the confirmation
        requested, and it holds. This is the third value this harness has now carried
        (/tmp, /var/lib, and this one), which is the part that actually de-risks the
        manifest: the interpolation is robust to the MOVE, not merely correct at one
        value.

        AND THE CONTROL IS THE FINDING. I ran the HOST-expanded path in the same command
        as a negative control, expecting it to fail:

          ca_dir=/Users/tlatoani/.local/state/tillandsias/ca
            rc=0  key=present  crt=present  perms=600  owner=root

        IDENTICAL. It does not fail. The guest runs as root, so mkdir -p creates a
        /Users/tlatoani tree INSIDE the guest and openssl writes the key into it with
        correct permissions. There is no error anywhere.

        That matters here because the macOS tray was emitting exactly that path.
        ca_path::ca_dir() expands ${HOME} from the CALLING process, and
        proxy_exec_preamble composes its string on the Mac for the GUEST to execute —
        the string's own first statement being `export HOME=/root`. Measured on this
        host: ca_dir() = /Users/tlatoani/.local/state/tillandsias/ca (and with HOME
        unset, /.local/state/tillandsias/ca).

        So the macOS lane was writing the enclave CA to a per-developer path inside the
        guest, silently, with every gate green. Filed and fixed as 1002-9xmb:
        ca_dir_template() is a distinct accessor for the unexpanded template, the
        preamble uses it, and the guest shell — the only expander standing in the
        filesystem the path names — does the substitution. A test now reads the emitted
        string for the host's own HOME, because the two existing preamble tests compared
        ca_dir() against ca_dir() in one process and agreed with themselves regardless.

        NOT A DEFECT IN THIS PACKET'S DECISION, and I want to be exact about that. A
        HOME-relative path is still the only candidate measured to serve both a rootless
        Linux host and the guest; both of your measurements stand. What the
        single-expander contract did not anticipate is a reader that emits a command
        across a filesystem boundary and therefore must NOT expand. Your manifest header
        is the right place to say so, which is why I am recording it here rather than
        editing it from this lane.

        WHAT I DID NOT DO, so nobody reads more into this than it says: not criterion
        (b). I did not remove the old directory, restart a host, and watch the proxy
        reach Running unaided. This was the CA block, exercised directly, exactly as the
        previous two runs were — not a full-preamble e2e, and not the closure.

        SEPARATELY, and it is in your file: ca_path's three tests each set the
        process-global HOME with unsafe set_var, and cargo runs them concurrently in one
        process. rust_and_shell_expand_to_the_same_path FAILS on every full-suite run at
        osx-next 724691251 — before any change of mine; verified by stashing, 3/3 red at
        HEAD and 3/3 green after. Fixed by splitting the substitution into a pure
        expand_home(template, home) the tests call directly, which removes the shared
        mutable state instead of serialising access to it and drops three unsafe blocks.
        Worth noting beyond the fix: ./build.sh --check is GREEN on that tree, so the
        gate does not run cargo test -p tillandsias-core, and a red test sat on the trunk
        where the gate could not see it.
