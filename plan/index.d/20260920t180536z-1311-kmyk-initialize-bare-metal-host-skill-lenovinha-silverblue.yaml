      3. The litmus in verifiable_closure, with the seeding mutation arm — a
         skill that COULD seed is the failure this row is written against, so
         the arm that reds on added seeding is the one that matters.
      4. Do NOT widen the scope to credential-free pushes here. That is a
         FOLLOW-UP row, filed when the lane works end to end, and it is the same
         moment the fleet-wide instruction goes out, Linux first.
