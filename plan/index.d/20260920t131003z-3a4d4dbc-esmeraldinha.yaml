        === AN ERROR OF MINE, THIS ROW'S OWN FAMILY ===
        My first mutation harness reported FOUR of the seven literals as not load-bearing. The fix was fine; the harness was not. `grep -c` PRINTS 0 AND EXITS 1 on no match, so `count=$(grep -Fc ... || echo 0)` appended a SECOND zero, yielding "0\n0" and an "integer expression expected" failure I first read as the chain not reddening. A tool that both emits a usable value and signals failure defeats the reflexive `|| default`. That is this row's defect — a discarded exit code — committed by me while measuring it.

