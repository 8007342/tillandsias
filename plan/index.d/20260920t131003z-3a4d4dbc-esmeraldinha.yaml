        === THE CLOSURE WAS CORRECTED BEFORE IT WAS IMPLEMENTED ===

        The instruction reaching this host said "a non-ready diagnose fails the install with its exit". THAT WOULD HAVE FAILED EVERY FIRST INSTALL ON EVERY WINDOWS HOST. `exit_code_from()` (notify_icon.rs:3130) returns 2 whenever the distro is not registered, which is the state at the end of every clean install; 3 is CONVERGING; 0 needs phase Ready. The removed code documented exactly this and guarded its throw with `-eq 1`:
            #   2 = first install: binary works but distro not provisioned yet (expected, ok).
            #   1 = hard failure: binary missing or won't run -> installer fails.
        Exit 1 is not reachable from exit_code_from at all, so it means the binary produced no verdict. THE CHECK VERIFIES THE INSTALL BITS, NOT THE PROVISIONING. The coordinator accepted the correction; the implemented closure is the corrected one.

        INDEPENDENTLY CONFIRMED BY yolanda from a RUN rather than a read: the installer ends with a fire-and-forget `Start-Process` and their two cold provisions took 91s and 79s, so a readiness assertion there would be a race — pass on a fast host, fail on a slow one. On this host it is stronger: the check sits at :454, BEFORE the `Start-Process` at :504, so the tray has not launched at all and the distro is unregistered. READY is not a race sometimes lost; it is lost every time on a clean machine.

