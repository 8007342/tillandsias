# Ledger fragment — append-only, IMMUTABLE once written.
# Operator ruling 2026-10-08, verbatim: "we do not ask end users to do power
# user stuff. That's our guideline. An install prompt asking for destructive
# cases should not be an acceptable case. End user is NOT a power user. No
# prompts like those, we make all the decisions for them, on their behalf, for
# their best interests. So SOFT reset is the default only and forever. A power
# user wanting to do a hard reset should be capable of figuring out where to
# place a flag and which flag, we do not need to print any power user messages
# during install, at all. Install should be for END USER (NOT POWER USER) and be
# a pretty installer, rather than an informational/debugging installer. As
# frictionless as possible for end users."
packets:
  - packet_id: the-end-user-installers-print-only-end-user-lines-and-send-diagnostics-to-a-log-file-shown-by-path-only-on-failure
    order: 1561-9f4x
    status: ready
    kind: feature
    priority: p2
    desired_release: v0.5
    release_target: fail-loud-diagnosis-milestone
    pickup_role: any
    capability_tags: [installer, end-user, ux, guard]
    estimated_hours: 2
    split_into:
      - the-windows-installer-prints-only-end-user-lines
      - the-macos-installer-prints-only-end-user-lines
      - the-linux-installer-prints-only-end-user-lines
    title: |
      The end-user installers (install-windows.ps1, install-macos.sh, install.sh) print only end-user lines: nothing in the normal path names a channel, a base URL, a flag or an environment variable; diagnostics go to a log file shown by path only on failure (as #247 does for the reset log)
    context: |
      Coordinator request 2026-10-08 under the operator ruling quoted at the top
      of this fragment: the `resolved-channel: <ch> (<source>) base: <url>` line
      (install-windows.ps1:98, install.sh:71, install-macos.sh:96-98) is
      diagnostic text in end-user output, in scope of the ruling. Measured on
      trunk 2026-10-08 (output statements naming TILLANDSIAS_*, a --flag, a URL,
      a channel or a base): install-windows.ps1 25, install.sh 28,
      install-macos.sh 23 candidate lines. The contract is held by one guard,
      scripts/check-installer-end-user-output.sh, with a per-installer floor so
      each platform slice drops its own installer to 0. Lines reachable ONLY when
      a power user passes a bad flag (usage and argument errors) may be marked
      `# power-user-only`; the two prompt blocks left "for now" are tracked by
      1560-uam3. Parent of three platform slices; it closes when all three do.
    exit_criteria:
      - 'every split_into slice is completed and the guard''s floor is 0 for all three installers'
    verifiable_closure: |
      bash scripts/check-installer-end-user-output.sh at floor 0 for every
      installer.
      unscoreable: parent-of-slices — each slice carries the fixture arm for its installer.
    events:
      - type: filed
        ts: "2026-10-08T21:21:41Z"
        agent_id: windows-yolanda-claude-20261008t155217z
        host: yolanda-windows
        summary: |-
          Filed at the coordinator's request (2026-10-08); Windows slice taken by yolanda, macOS slice for macbookair, Linux slice for a Linux host.
