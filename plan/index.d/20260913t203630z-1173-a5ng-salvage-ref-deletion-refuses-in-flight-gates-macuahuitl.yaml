    owned_files:
      - scripts/check-salvage-refs-ledger.sh
      - scripts/test-salvage-refs-ledger.sh
      - scripts/sweep-salvage-refs.sh
    title: |
      The salvage-ref bookkeeping is mark, land, then delete, and that protects a gate that merges trunk AFTER the marker lands; it does nothing for a gate already running on an older snapshot. check-salvage-refs-ledger.sh compares the LOCAL ledger against origin's refs, so the moment the ref is gone every in-flight gate in the fleet whose tree predates the marker refuses with violation:salvage-refs-ledger:1, and the checker is wired into ./build.sh --check. Measured on yolanda 2026-09-13: the coordinator marked line 19 at 6857ce7f6 (20:29Z), deleted the ref at 20:31Z, and yolanda's 1172-dyvd land, gating a tree merged before 6857ce7f6, refused at ~20:35Z. The line was marked on trunk the whole time.
    context: |
      Attribution, in yolanda's words: the ref was theirs, the ledger line
      was the coordinator's sweep, and the gap is between the sweep and its
      own checker (both 1148-3439). The deletion itself was correct by the
      four-branch ancestry check and used the hook's named override
      TILLANDSIAS_SALVAGE_DELETE_OK=1 (874-w2gc), never --no-verify.

      Two fixes, both needed. The mechanical one: the checker already pays a
      network round trip (git ls-remote); reading trunk's copy of the ledger
      file is one more `git show origin/linux-next:<path>` and turns a behind
      tree's refusal into "merge trunk", which every landing path does anyway
      (the land tool's fetch-and-integrate step; the plan-only lane's
      trunk-contained condition). The protocol one: no timing rule fully
      closes the race (a floor host's gate can run an hour), so the grace
      period is a reduction, not a guarantee; state it where the delete is
      performed. Do NOT weaken the negative arm: a vanished ref with no marker
      anywhere is exactly the outstanding rescue the file exists to surface.
    exit_criteria:
