      Callers (git grep): scripts/gate-steps.d/145-1087-h2z9.step (STEP_SCRIPT) and scripts/local-ci.sh:1846-1871 (exit code only, output teed to a log). The step's STEP_SECOND_REGIME pin quotes the ok line verbatim.
      VERDICT GRAMMAR: the ok line "ok: markdown distillation paths" (space after the colon) is kept byte-identical through verdict.emit, which accepts it, so the regime pin and every reader stay valid. The .sh's failure path prints NOTHING on stdout (noncanonical paths and the remedy go to stderr, exit 1); the runner needs a verdict line, so the port adds violation:markdown-distillation:<n> noncanonical with exit 1. No reader keys on the failure stdout: both callers read the exit code.
      QUIRKS TO KEEP: bash case globs let * match '/', so scripts/*/README.md admits any depth despite its comment saying "one level down"; git ls-files' '*.md' pathspec is case-sensitive (README.MD is never checked); a tracked path git quotes (non-ASCII, core.quotePath) fails the regular-file test and is skipped silently.
      Bundled with the 1627-hg3t exemption commit (macuahuitl-fedora's ruling B): this port pays that PR's carried obligation, so the PR carries no waiver.
