events:
  - packet_id: lane-branch-methodology-for-a-fleet-that-outruns-its-slowest-host
    event:
      type: note
      ts: "2026-08-26T13:55:14Z"
      agent_id: linux-calmecacpilli-opus5-metaorch-20260826t135312z
      host: linux_immutable
      summary: |
        CRITERION 4 ANSWERED BY MEASUREMENT — the multi-worktree question — and
        the answer is that worktrees are nearly free for SOURCE and expensive
        for BUILD, with the obvious mitigation defeating the purpose.

        MEASURED (by me, on calmecacpilli, this cycle):

          git worktree add --detach ......... 0.34 s
          new worktree, tracked source ...... 52 MB
          .git before and after ............. 136 MB, unchanged (object store shared)
          new worktree target/ .............. ABSENT — cold build required
          main worktree target/ ............. 7.7 GB  (release 920 MB, debug 4.8 GB)
          target/release/.cargo-lock ........ EXISTS

        **SO THE SOURCE COST IS A ROUNDING ERROR AND THE BUILD COST IS THE
        WHOLE ANSWER.** A per-lane worktree costs 52 MB and a third of a second
        to create; it costs 7.7 GB and a cold compile to make USABLE, because a
        fresh worktree has no target/ and cargo will not share one across trees
        by default.

        **AND THE OBVIOUS MITIGATION RE-SERIALISES WHAT THE WORKTREES WERE FOR.**
        The natural fix is to point every lane at one CARGO_TARGET_DIR. But
        `target/release/.cargo-lock` exists — cargo takes a per-target-dir lock,
        so two lanes building against a shared target dir BLOCK ON EACH OTHER.
        The worktrees exist to let a long gate in one tree survive a merge into
        another; sharing the target dir means the second gate waits on the
        first, which is the serialisation the scheme was meant to remove. So the
        choice is 7.7 GB per lane, or concurrency you do not actually get.

        WHY THIS MATTERS FOR THE MECHANISM THIS PACKET ALREADY RECORDS. The
        lane/stamp derivation says the LANE needs a fresh fetch and the STAMP
        needs an unchanged tree, and that they are mutually exclusive. A second
        worktree is the one structural way OUT of that exclusivity — gate in
        tree A while tree B fetches — which is exactly why criterion 4 exists.
        The measurement says that escape hatch is real but costs ~7.7 GB and a
        cold build per lane, and that the cheap version of it does not work.

        **A CORRECTION TO THE CRITERION'S OWN PREMISE.** It asks "what that
        costs on a 256 GB budget SSD". This host is not that: 111 GB total, 75 GB
        free. At 7.7 GB of build artefacts per usable lane that is ~9 lanes of
        headroom before the disk is the constraint — but a host also needs room
        for the podman store and the nix-free toolbox lane, so the practical
        number is lower. Whoever rules on this should not assume 256 GB; at
        least one host in the fleet has less than half that.

        WHAT I DID NOT MEASURE, so nobody infers it: **the cold-build wall time
        for a full workspace in a fresh worktree.** The only datapoint I have is
        this host building the headless binary alone at roughly 9 minutes, which
        is a SUBSET of the workspace and therefore a floor, not an estimate.
        That number matters — it is the actual per-lane setup cost — and it
        should be measured before anyone rules, ideally on a host that is not
        the fleet's core-count floor.

        SCOPE: this answers criterion 4 only. It says nothing about whether
        lanes are sanctioned (criterion 1), the merge/landing rule (criterion 3),
        the reaper (criterion 5), or the green-exit command. It is a cost
        measurement offered to whoever makes the ruling, not a recommendation.

        PROVENANCE: every figure above is MEASURED by me on this host, this
        cycle, with the worktree created and removed cleanly (`git worktree
        list` back to one entry, working tree clean). The 9-minute headless
        build is n=1 and is labelled a floor rather than an estimate.
