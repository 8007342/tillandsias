  # ---------------------------------------------------------------- design
  - packet_id: the-provider-gateway-openspec-change-states-the-standalone-forge-only-gateway-as-normative
    order: 2081-4rer
    status: ready
    kind: spec
    priority: p1
    desired_release: v0.5
    pickup_role: any
    capability_tags: [openspec, security, design]
    estimated_hours: 2
    title: |
      The provider-gateway OpenSpec change states the operator's gateway requirements as normative, with a threat model and a one-page readme plan
    context: |
      A first draft of openspec/changes/provider-gateway (proposal, design, tasks, specs/provider-gateway/spec.md) is filed with this order. This row reviews and completes it: one small standalone binary per host or per forge network, one upstream per provider, listening only on the forge network, peer identity = the network or socket a request arrives on, no admin API, no header or body logging, token cached in memory with a TTL, serialized refresh with Vault write-back, a documented threat model, and a one-page "how it works" readme. It also folds in the spike results as they arrive. Rust or Go only; no bash, python or jq.
    exit_criteria:
      - 'openspec validate provider-gateway --strict passes (or, where the CLI is absent, every requirement in specs/provider-gateway/spec.md has at least one "#### Scenario:"). Pre-fix: FAILS, the change does not exist on linux-next.'
      - 'specs/provider-gateway/spec.md has a requirement for each of: standalone binary, one upstream per provider, forge-only reachability, placeholder in the forge, cached Vault reads with serialized refresh, no header or body logging. design.md has a "## Threat model" section.'
    verifiable_closure: 'grep -c "^### Requirement:" openspec/changes/provider-gateway/specs/provider-gateway/spec.md prints at least 6, and grep -c "^## Threat model" openspec/changes/provider-gateway/design.md prints 1. Pre-fix on linux-next: FAILS, no such file.'
    unscoreable: |
      spec-text: the deliverable is a specification document; its checks are textual and recorded in verifiable_closure.
    next_action: 'Draft filed with this order. Left to do: review it against the operator direction of 2026-11-11, run openspec validate if the CLI is present, and add each spike result as it lands.'
    provenance: operator direction 2026-11-11 (provider gateways), order 2081.
    depends_on: []
    related: [2081-qymn, 2081-f8qf, 2081-xufm, 2081-fuae, 2080-7euu]
    events:
      - {type: filed, ts: '2026-11-11T20:07:49Z', host: macuahuitl, summary: filed ready with the first draft of the change}

