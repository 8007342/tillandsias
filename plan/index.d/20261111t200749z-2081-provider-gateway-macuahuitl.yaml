# Ledger fragment — append-only, IMMUTABLE once written.
# Order 2081: provider gateways. Forges stop holding provider sign-in files.
# Design: openspec/changes/provider-gateway/. Operator direction 2026-11-11:
# simple standalone gateways in Rust or Go, reachable only from the forges they
# serve, small cached Vault reads plus refresh write-back, no plaintext at rest,
# and agents never start a sign-in.
packets:
  # ---------------------------------------------------------------- spikes
  - packet_id: spike-claude-code-works-in-subscription-mode-through-a-local-forwarding-gateway-holding-the-real-token
    order: 2081-qymn
    status: ready
    kind: research
    priority: p1
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [research, claude-code, provider-sign-in, networking, security]
    estimated_hours: 2
    title: |
      SPIKE - Does Claude Code work in subscription sign-in mode with ANTHROPIC_BASE_URL pointed at a local forwarding gateway that holds the real token, with only a placeholder in the forge?
    context: |
      Today the forge gets the full Claude sign-in file, refresh token included. A gateway outside the forge would swap a placeholder for the real token and forward upstream (openspec/changes/provider-gateway). This spike answers only whether the CLI allows it. Use a throwaway probe forwarder (Rust or Go, no bash or python) on a scratch network, outside the checkout. Use an existing operator sign-in. Never start a sign-in; if none exists, record that and stop.
    exit_criteria:
      - 'openspec/changes/provider-gateway/design.md has a "Spike result: Claude" section recording yes or no, the claude CLI version, the exact env and config used (placeholder value, base URL), and on "no" the observed failure verbatim with no token bytes. Pre-fix: FAILS, the section does not exist.'
      - 'No code beyond the throwaway probe is committed; the probe source is not in the checkout.'
    verifiable_closure: 'grep -c "^## Spike result: Claude" openspec/changes/provider-gateway/design.md prints 1. Pre-fix: prints 0.'
    unscoreable: |
      research-spike: the deliverable is a recorded verdict on third-party CLI behaviour, not a code property; there is no repository test to pin.
    next_action: 'Nothing is done. Write a throwaway forwarder, start claude in a scratch forge with ANTHROPIC_BASE_URL set and a placeholder credential, run one prompt, and record the verdict section in design.md.'
    provenance: operator direction 2026-11-11 (provider gateways), order 2081.
    depends_on: []
    related: [2080-7euu, high-forge-vault-policies-cannot-write-a-provider-sign-in, 2080-cdvm]
    events:
      - {type: filed, ts: '2026-11-11T20:07:49Z', host: macuahuitl, summary: filed ready as the first provider-gateway spike}

