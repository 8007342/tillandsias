    title: |
      The provider gateway exists (core plus the Claude upstream): a Claude forge request carrying a placeholder reaches upstream with the real token, and the gateway is reachable only from that forge's network
    context: |
      First build packet; it builds the gateway core (openspec/changes/provider-gateway tasks 2.x) and the Claude upstream (3.1). Pending until the Claude spike records "yes". Follow the spec: listen only on the forge network, no admin API, no header or body logging, in-memory TTL cache, serialized refresh with Vault write-back, README.md and THREAT-MODEL.md beside the source.
    exit_criteria:
      - 'A test sends a request with a placeholder through the gateway to a mock upstream; the upstream sees the real token and the response holds no token bytes. Pre-fix: FAILS, no gateway exists.'
      - 'A test configures a listener on 0.0.0.0 and on 127.0.0.1; the gateway refuses to start for both with a named error.'
      - 'A test sends ten concurrent requests after expiry; the mock provider sees exactly one refresh and the mock Vault one write.'
      - 'A test captures the log; neither the placeholder nor the real token appears in it.'
    verifiable_closure: 'cargo test for the gateway crate names the four tests above, added with the fix. Pre-fix: FAILS, the crate does not exist.'
    unscoreable: |
      unpinnable-until-the-guard-exists: the fix adds the tests named in the exit criteria in the same commit (1136-n8sh).
    next_action: 'WAIT for the Claude spike verdict. On yes: write the four tests first, watch them fail, then build the core and the Claude upstream. On no: close this row as not-feasible with the recorded failure.'
    provenance: operator direction 2026-11-11 (provider gateways), order 2081.
    depends_on: [spike-claude-code-works-in-subscription-mode-through-a-local-forwarding-gateway-holding-the-real-token, the-provider-gateway-openspec-change-states-the-standalone-forge-only-gateway-as-normative]
