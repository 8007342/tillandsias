packets:
  - packet_id: freshness-counts-untracked-staging-copies
    order: 730-j26z
    release_target: architecture-audit-epic
    status: ready
    desired_release: v0.5
    priority: p2
    kind: fix
    title: 'The freshness audit queue offered a gitignored staging copy as its next target'
    pickup_role: linux
    depends_on: []
    capability_tags:
      - freshness
      - convergence
    context: |
      Found by actually RUNNING the standing FRESHNESS audit rather than
      deferring it. `freshness-next:` named
      images/default/skills/multihost-orchestration/SKILL.md — one of 13 files
      in images/default/skills/, a gitignored staging tree a script copies from
      the canonical skills/, and several of whose files already DIFFER from
      their source. Auditing a stale copy for "is this still meaningful, sound,
      complete?" answers a question about the copier, not about a component.
      640-iujb had excluded the sibling generated tree
      (images/default/cheatsheets/) by PATH. A prefix list only catches the
      derived trees someone remembered to name — and nobody had named this one.
      The general property is trackedness: a file git does not track cannot
      encode design intent the audit can act on, because re-materializing the
      build context changes it without a commit.
    exit_criteria:
      - the inventory drops untracked files from the denominator, stated as a property rather than another path prefix
      - the exclusion degrades safely where git cannot answer, rather than silently emptying the inventory
      - a litmus asserts every reported component is git-tracked
    verifiable_closure: |
      litmus:freshness-inventory-shape asserts `git ls-files --error-unmatch`
      succeeds for every path the report names as a component.
    notes: |
      13 components left the denominator (1253 -> 1240), reported honestly as
      denominator_delta=-13 by the 720-bmm9 field rather than appearing as an
      unexplained coverage move.

