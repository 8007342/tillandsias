    title: The git mirror waits for the Vault Agent token sink without a one-second poll, and publishes its discipline ref after READY
    context: |-
      Follow-up to 1977-xpus (coordinator macuahuitl-fedora, 2026-11-03). After #892, a warm mirror-seed is 1685-2091 ms on yoga, and about 1 s of it is the Vault Agent readiness wait.
      SOURCE: start_vault_agent in images/git/entrypoint.sh loops `while [ "$waited" -lt "$VAULT_AGENT_START_TIMEOUT" ]`, testing `[ -s "$VAULT_TOKEN_FILE" ]` and then `sleep 1`.
      MEASURED (mirror log, a warm start on yoga): "agent.sink.file: token written" at 15:11:54.391; "[git-service] Vault Agent auto-auth ready" at 15:11:55.273. So ~0.9 s of every start is the sleep, not the agent.
      The git image's busybox has `inotifyd`, checked by `podman run --rm --entrypoint sh localhost/tillandsias-git:latest -c 'busybox --list'`. So the wait can be an event on the sink file appearing, not a poll; no new poll cadence (operator ruling polling-cadence-needs-operator-approval).
      DISCIPLINE PUBLISH (0.3 s ahead of READY), read in source on 2026-11-03: nothing a forge does at start reads the MIRROR's refs/tillandsias/discipline/*. At start the forge runs `tillandsias-plan discipline install-hooks` (images/default/lib-common.sh:485, install_project_discipline_hooks); its published_level (crates/tillandsias-plan/src/branch_discipline.rs:395) reads the LOCAL clone's git dir, and a clone does not fetch refs/tillandsias/*. The forge's startup reads of mirror state refs are upstream-auth (images/default/lib-push-capability.sh:44; lib-common.sh:1185, the empty-project check) and relay-state (lib-common.sh:743), both by ls-remote. No forge-start ls-remote or fetch of refs/tillandsias/discipline/* was found. So the discipline publish may move after READY; upstream-auth must stay before it (49 ms).
    exit_criteria:
      - 'The Vault Agent wait returns when the sink file appears, with no sleep-and-poll: a fixture with a stub agent that writes its sink after 100 ms sees the wait end within 300 ms of that write. Red today: the 1 s sleep makes it at least ~900 ms.'
      - 'The discipline publish runs after READY, and upstream-auth stays before it. MEASURED on a host: warm mirror-seed before and after, 3 runs each.'
    verifiable_closure: 'The fixture red before and green after, plus three warm mirror-seed times on one host.'
    unscoreable: 'unpinnable-until-the-guard-exists: the claimer writes the fixture and names its litmus in the same commit (1136-n8sh).'
    next_action: 'Replace the sleep loop in start_vault_agent with a wait on the sink file appearing (busybox inotifyd on its dir, bounded by VAULT_AGENT_START_TIMEOUT), keeping the timeout message; then move run_publish_discipline after notify_ready; measure.'
