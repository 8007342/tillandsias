    title: |
      scripts/relay-preflight.sh reads its decider list and its _run_decider body from the copy that STARTED the run (trunk's), then merges the refs; relaying 1384-ddua, which deletes check-bash-dialect.sh and repoints the tool to the .lua, was refused with "bash: scripts/check-bash-dialect.sh: No such file or directory" although the merged tree is green
    context: |
      MEASURED 2026-10-01 on macuahuitl: relay-preflight origin/work/1384-ddua
      from a checkout on linux-next refused at decider check-bash-dialect,
      exit 2, "No such file or directory". lenovinha's run of the same ref
      passed the deciders because it started from the ddua checkout, whose
      copy of the tool is the merged one. The coordinator's workaround: put
      the checkout on a branch that already contains the merge, then run.
      That relies on bash having read the function bodies before the tool's
      own checkout swaps the file on disk, which is luck, not design. Every
      Lua-migration rung that ports or retires a decider (1384-bxhk next,
      then the 1384 and 1520-z95v rungs) meets this.
    outcome: |
      A relay that changes the decider set or the tool itself is judged by
      the merged tree's tool, every time, from any starting checkout.
    exit_criteria:
      - "A fixture arm whose work ref deletes a decider script and repoints the tool's decider list: relay-preflight run from a checkout on the BASE branch reaches an ok: verdict (pre-fix: refused at that decider, 'No such file or directory' — FAILS)."
      - "The existing seven arms stay green."
    verifiable_closure: |
      bash scripts/test-relay-preflight.sh prints ok:relay-preflight:8/8 in
      the plain, env -u and toolbox regimes; the new arm is red on the
