events:
  - packet_id: a-dispatch-wrapper-that-execs-into-a-container-cannot-be-killed-so-a-cancelled-gate-keeps-running-in-the-same-checkout
    event:
      type: investigated
      ts: "2026-09-13T05:51:05Z"
      agent_id: linux-yoga-claude-20260913t055105z
      host: yoga
      summary: |
        THE DETECTOR WAS WRONG IN PRODUCTION AND THE HERMETIC FIXTURE COULD NOT SEE IT.
        Found by running a forced gate purely to observe the advisory's output — a check
        I nearly skipped, having already verified the binding existed.

        WHAT IT PRINTED, inside the gate that had just landed it:
          competing-gate: a build.sh is running in this checkout with NO live wrapper
            pid=810227 token=tb-809887-1789278257-94569133
        Both pids were that gate's OWN. Every gate reported ITSELF as a competing gate.

        THE MECHANISM, measured rather than inferred. build.sh re-execs into the
        toolbox BEFORE its fast refusals, so the detector ran INSIDE the container.
        From there the host-side `toolbox run` wrapper is VISIBLE — the PID namespace
        is shared — but its environ is not READABLE, and environ is the field this
        classifier keys on. Measured on yoga against a host process from inside the
        builder:
            [ -r /proc/<host-pid>/environ ]  -> TRUE
            head -c 1 /proc/<host-pid>/environ -> DENIED
        access(2) LIES here. My `[ -r ]` guard passed, the read failed, and the
        `2>/dev/null || continue` swallowed it — so every wrapper vanished and every
        token group looked headless.

        I HAD WRITTEN THAT EXACT WARNING MYSELF, in lib-dispatch-reap.sh: "a process
        that changed credentials can pass access(2) and still deny the read". I wrote
        the sentence and then built a classifier whose correctness depends on those
        reads succeeding, and guarded it with the very test I had documented as
        unreliable. That is the second time in two cycles I have written a caution in a
        comment and then violated it in the code below.

        THE ADVISORY STAGING IS WHAT KEPT THIS CHEAP, and it is the whole argument for
        it. Advisory, this was noise in a log. REFUSING, it would have made every Linux
        gate on every Linux host refuse itself — the fleet-stopping outcome the staging
        was chosen against, arriving on the first in-situ run. The staging was not
        caution for its own sake; it was the difference between a log line and an
        outage.

        WHY 8/8 DID NOT CATCH IT, which is the transferable lesson. The fixture builds a
        procfs-shaped tree of PLAIN FILES, and plain files are always readable. The
        property that broke — a readable-looking, unreadable-in-fact environ across a
        privilege boundary — cannot exist in a fixture made of ordinary files. A
        hermetic fixture pins the LOGIC and is silent about the SUBSTRATE, and I read
        its green as coverage of both.

        FIXED, three ways, each pinned by a new arm and mutation-verified:
          1. From inside a container the check REFUSES to answer
             (could-not-run:competing-gate:inside-container). It cannot see wrappers
             there by construction, so any answer it gives is a guess.
          2. A DENIED READ is counted, not skipped. If any process could not be read,
             an otherwise-headless group suspends the accusation
             (could-not-run:competing-gate:unreadable-processes:N) — one of the
             unreadable ones may be its live wrapper.
          3. The question is now ASKED ON THE HOST, in with-tillandsias-builder.sh
             before the dispatch, which on a Silverblue host is the only place it can be
             answered at all.

        Mutation-verified with the diff proven non-empty first: answering from inside a
        container anyway reproduces the production false positive (9/11), and treating a
        denied read as an absent token reproduces it one layer down (10/11). 11/11
        restored.
