    notes: |
      size: M
      implementer_tier: sonnet
      The design is specified; the judgment (acceptance) lives in 1443-qwpj.
    provenance: |
      Filed 2026-09-27 on macuahuitl by the trims designer session from the
      coordinator's relay of the operator's rulings.

  - packet_id: integration-layer-test-classification-what-runs-on-a-work-ref-push-a-relay-land-and-the-daily-cut
    order: 1443-b85g
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    release_target: efficiency-trims-2026-09-27
    pickup_role: linux
    capability_tags: [ci, litmus, gate, classification, bash, linux, gate-integrity]
    estimated_hours: 8
    depends_on: [litmus-covering-specs-relay-scope-partition]
    owned_files: [scripts/integration-layer-tests.sh, scripts/run-litmus-test.sh, scripts/local-ci.sh, scripts/test-integration-layer-tests.sh, openspec/litmus-tests/litmus-integration-layer-classification-shape.yaml, methodology/ci.yaml]
    verifiable_closure: |
      bash scripts/test-integration-layer-tests.sh prints
      ok:integration-layers:7/7 and exits 0, where, over a scratch litmus
      corpus, bindings and a diff against a base: arm 1:
      scripts/integration-layer-tests.sh work-ref --diff <base> prints the
      decider set and the touched fixtures and NO litmus and NO cargo
      line; arm 2: integration-layer-tests.sh relay --diff <base> prints
      the change-class tier (light|scoped|full, from change-class.sh), the
      workspace test line, and exactly the run set that
      litmus-covering-specs.sh --relay-scope <base> prints (byte-equal on
      the litmus lines) — pre-build, instant and quick, declared or
      command matches; arm 3: integration-layer-tests.sh cut prints every
      bound pre-build spec of every size, then post-build and runtime
      phases, with memo=off on every line; arm 4: a spec of phase
      post-build, runtime or integration, or of size e2e, never appears in
      the work-ref or relay output (deferred:layer:cut is printed instead
      with the spec name); arm 5: scripts/run-litmus-test.sh --layer relay
      runs exactly the specs the classifier prints for relay and skips the
      rest with a "Layer-scoped: deferred to cut" line, and --layer cut
      with the memo env set still runs everything; arm 6 NEGATIVE CONTROL:
      an unknown layer name is refused with exit 2 and a spec with no size
      or phase field is classified to cut (fails closed, never dropped);
      arm 7: two runs on the same diff and corpus print byte-identical
      output. PRE-FIX RESULT: FAILS — no classifier exists; the relay lane
      runs every covering spec of every size and phase, the work-ref hook
      runs no fixtures, and the cut runs the same suites with whatever
      memo state the host holds.
    title: |
      Integration-layer test classification: `scripts/integration-layer-tests.sh <work-ref|relay|cut>` decides which test class runs at which branch layer (work-ref push, linux-next relay land, daily cut to main), and `run-litmus-test.sh --layer` honours it
    context: |
      Operator ruling 3 of 2026-09-27: "let's defer e2e and other
      integration tests to their corresponding integration layers", with
      the classification of which integration tests run for each layer to
      be REVISITED. The layers are the branch layers: a work/<order> ref
      (the pre-push hook, seconds), a relay land on linux-next (the land
      gate, minutes), the daily cut to main (--ci-full, an hour), and the
      stable promotion (per-platform smokes, unchanged here). The test
      classes are: deciders (whole-tree check-*.sh), fixtures
      (scripts/test-*.sh), crate unit tests (cargo test --workspace and the
      feature-gated pass), pre-build litmus by size (instant, quick versus
      long, large), and post-build/runtime/integration litmus (e2e, needs a
      forge or a guest). THE TABLE (canonical in methodology/ci.yaml ->
      integration_layers): work-ref = deciders + touched fixtures, no
      cargo, no litmus (the worker runs relay-preflight.sh on its own ref
      before the PR, which is the relay layer applied early); relay =
      change-class tier of ./build.sh --check (deciders, fixtures,
      workspace cargo test memoised per 1437-jm2d, feature-gated pass) +
      the scoped covering litmus of 1437-yfuh (declared and instant/quick
      command matches, pre-build only); cut = every bound pre-build spec
      of every size, post-build, runtime, integration and e2e, install,
      all with memo off (ruling 4: a cut runs everything fresh). This row
      ALIGNS with 1437-yfuh (yoga, in progress): the relay layer's litmus
      set IS --relay-scope's run set, consumed not re-derived; this row
      adds the other two layers, the deferred:layer:cut line so a deferred
      spec is named where it was deferred, and the --layer switch on the
      runner. The classification is data the runner reads (size, phase,
      binding), not a second taxonomy: an unclassifiable spec goes to the
      cut (fails closed).
    next_action: >
      Write the classifier (reads change-class.sh for the tier,
      litmus-covering-specs.sh --relay-scope for the relay set, the corpus
      size and phase fields for the cut set); add --layer to
      run-litmus-test.sh; make local-ci.sh's check:litmus-pre-build call
      --layer cut with the memo env cleared; amend methodology/ci.yaml
      integration_layers if the implementation changes the table (say
      which cell and why); fixture with seven arms; bind the litmus under
      ci-release.
    notes: |
      size: L
      implementer_tier: opus
      Decides what each layer runs; a wrong cell lets a red spec reach the
      cut or main unseen.
    provenance: |
      Filed 2026-09-27 on macuahuitl by the trims designer session from the
      coordinator's relay of the operator's rulings; the phase and size
      vocabulary was counted on this checkout (406 pre-build, 16
      post-build, 337 instant, 79 quick, 27 e2e, 9 long).

