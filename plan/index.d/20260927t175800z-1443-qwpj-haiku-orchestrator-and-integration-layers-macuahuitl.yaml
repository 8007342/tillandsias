packets:
  - packet_id: verify-closure-runs-a-packets-verifiable-closure-and-compares-the-printed-output-to-the-criterion
    order: 1443-qwpj
    status: ready
    kind: enhancement
    priority: p1
    desired_release: v0.5
    release_target: efficiency-trims-2026-09-27
    pickup_role: any
    capability_tags: [verification, delegation, plan-cli, bash, gate-integrity]
    estimated_hours: 5
    depends_on: []
    owned_files: [scripts/verify-closure.sh, scripts/test-verify-closure.sh, openspec/litmus-tests/litmus-verify-closure-shape.yaml]
    verifiable_closure: |
      bash scripts/test-verify-closure.sh prints ok:verify-closure:6/6 and
      exits 0, where, over a scratch ledger: arm 1: for a packet whose
      verifiable_closure reads "bash scripts/x.sh prints ok:x:3/3 and exits
      0, where ...", scripts/verify-closure.sh <order> runs exactly that
      command, and when its stdout carries a line matching ok:x:3/3 and its
      rc is 0 prints ok:closure:<order>:ok:x:3/3 and exits 0; arm 2: when
      the command's stdout carries ok:x:2/3 instead, prints
      unmet:closure:<order>:expected=ok:x:3/3 measured=ok:x:2/3 and exits 1;
      arm 3: when the rc is non-zero with the expected line present, prints
      unmet:closure:<order>:rc=<n> and exits 1; arm 4: a placeholder in the
      expected line (<n>, <key12>, <sha>) matches any non-empty token; arm
      5 NEGATIVE CONTROL: a closure with no leading command of the
      scorable grammar (litmus:<test>, bash scripts/<name>.sh, cargo test
      ...) prints unscoreable:closure:<order>:no-command-grammar and exits
      2, never ok; arm 6 NEGATIVE CONTROL: a "verified" claim passed on
      stdin or in any argument is ignored — the verdict depends only on the
      command's output (the fixture passes --claim met with an unmet
      measurement and gets unmet). PRE-FIX RESULT: FAILS — the script does
      not exist; on 2026-09-27 a Haiku implementer reported the 1437-gbwi
      criterion "met" while its own measurement read 76 s then 70 s against
      a "under 20 s" criterion, and nothing between the report and the
      acceptance ran the closure.
    title: |
      `scripts/verify-closure.sh <order>`: run the packet's own verifiable_closure command and compare the PRINTED output to the criterion — the acceptance check an orchestrator runs instead of reading a delegate's "met"
    context: |
      Operator ruling 2 of 2026-09-27: Haiku sessions may orchestrate all
      day and delegate to larger agents, and the check that a delegate's
      result is MEASURED must be built in. The scorable-obligation guard
      (977-448j) already restricts a closure to a litmus name, a scripts/
      command or a cargo test invocation, so every open packet carries a
      runnable command by construction; this script extracts it (the text
      up to " prints " or " passes"), runs it under a timeout, and compares
      the output line the closure names, with <placeholders> matching any
      token. A delegate's report is never an input. The verdict grammar is
      one line so an orchestrator at the haiku tier can branch on it
      without judgment. Self-report is an instrument: an unverified
      "verified" is a green gate that ran no tests.
    next_action: >
      Write the extractor (closure text from the folded packet via the plan
      binary's --json projection; command = leading token run of the
      scorable grammar; expected = the token after "prints "), the runner
      (timeout from TILLANDSIAS_CLOSURE_TIMEOUT_S, default 1800; cwd repo
      root), the comparator and the three-verdict grammar; fixture with
      six arms over a scratch ledger; bind the litmus under ci-release.
    notes: |
      size: L
      implementer_tier: opus
      Gate-integrity: this is the acceptance check for delegated work; a
      comparator that matches too loosely accepts an unmet criterion.
    provenance: |
      Filed 2026-09-27 on macuahuitl by the trims designer session from the
      coordinator's relay of the operator's rulings and the 1437-gbwi
      misreport (76 s then 70 s reported as meeting a <20 s criterion).

  - packet_id: haiku-orchestrate-skill-an-all-day-haiku-session-that-triages-delegates-by-tier-and-accepts-only-measured-closures
    order: 1443-hbgt
    status: ready
    kind: feature
    priority: p1
    desired_release: v0.5
    release_target: efficiency-trims-2026-09-27
    pickup_role: any
    capability_tags: [orchestration, delegation, tier-routing, skills, bash]
    estimated_hours: 6
    depends_on: [verify-closure-runs-a-packets-verifiable-closure-and-compares-the-printed-output-to-the-criterion, repeat-claude-arm-passes-the-model-and-effort-flags]
    owned_files: [skills/haiku-orchestrate/SKILL.md, scripts/haiku-orchestrate-cycle.sh, scripts/test-haiku-orchestrate-cycle.sh, methodology/distributed-work.yaml]
    verifiable_closure: |
      bash scripts/test-haiku-orchestrate-cycle.sh prints
      ok:haiku-orchestrate:6/6 and exits 0, where, with CLAUDE_BIN pointing
      at an argv-recording stub delegate and a scratch ledger of one sonnet
      row and one opus row claimable by role any: arm 1:
      scripts/haiku-orchestrate-cycle.sh any launches one delegate per row
      with --model equal to the row's implementer_tier (sonnet for the
      sonnet row, opus for the opus row; an untagged row gets opus) and
      never --model haiku for an implementer; arm 2: after the stub
      delegate returns, the cycle runs scripts/verify-closure.sh <order>
      and accepts (writes the completion through set-field with the
      verify line as evidence) ONLY on ok:closure; arm 3: on
      unmet:closure the cycle re-delegates once with the measured line in
      the prompt, and on a second unmet writes a blocked event carrying
      both measured lines and moves on — it never writes completed; arm 4
      NEGATIVE CONTROL: a stub delegate that prints "criterion met" while
      the closure measures unmet is not accepted (the ledger status stays
      in_progress/blocked, never completed); arm 5: the cycle's own argv
      to git contains no push to linux-next, windows-next, osx-next or
      main (work/<order> pushes only) and no edit under methodology/,
      openspec/specs/, scripts/hooks/ or scripts/gate-steps.d/ is made by
      the orchestrator process itself (a diff of those paths against the
      pre-cycle tree is empty); arm 6: the cycle ends with a tokens:
      record written through --emit-tokens --from-transcript, or
      source=absent. PRE-FIX RESULT: FAILS — neither the skill nor the
      cycle script exists; the only Haiku delegate today is read-only
      (audit, patch-draft, json) and no session verifies a delegate's
      closure by running it.
    title: |
      `/haiku-orchestrate`: an all-day Haiku orchestrator session that drains plan_next, triages, delegates each packet to a Sonnet or Opus sub-agent by its tier, and accepts only a closure it measured itself
    context: |
      Operator ruling 2 of 2026-09-27: "We can try hosts running Haiku
      sessions all day and then have them delegate work to larger agents.
      Haikus for simple orchestration." LAUNCH: a host runs
      ./repeat --model haiku --prompt "Use the /haiku-orchestrate skill"
      (needs 1437-m5yx, the claude arm passing --model), on the same
      stagger slot as its worker session; in a forge the same prompt
      through the harness default until 689-jxb2. THE LOOP per cycle:
      cycle-preflight; select-work-batch.sh <role> --tier-any (the
      orchestrator picks for its delegates, not for itself); for each row,
      claim through set-field, launch ONE delegate (Agent tool with
      model = the row's implementer_tier, or scripts/claude-delegate.sh
      implement <order> with CLAUDE_DELEGATE_MODEL set to that tier) with
      the packet's title, context, next_action, verifiable_closure and
      owned_files; when it returns, run scripts/verify-closure.sh <order>
      (1443-qwpj) and branch on its one line: ok -> completion with the
      verify line as evidence and a work/<order> push; unmet -> one
      re-delegation with the measured line pasted, then a blocked event;
      unscoreable -> a note event and no acceptance. Sub-agent budget as
      the meta-orchestration rule (at most 8 per cycle, 3 concurrent),
      recorded through --emit-tokens --from-transcript. WHAT IT MUST
      NEVER DO ITSELF: implement or edit code under a packet; judge a
      closure by reading a delegate's report (the 1437-gbwi misreport:
      76 s then 70 s reported as meeting a <20 s criterion); push to any
      platform branch or main (work/<order> refs only; the relay lane
      lands); edit methodology/, openspec/specs/, scripts/hooks/,
      scripts/gate-steps.d/ or any file that decides what a gate runs;
      re-tier a packet (a disagreement is a set-field --reason for the
      coordinator to read, not a routing change); run ./build.sh --check
      as its own gate (the delegate and the relay lane own gates); send a
      peer message longer than the budget; or accept work whose closure it
      could not run (no-command-grammar is a refusal, not a pass). The
      canonical rule is methodology/distributed-work.yaml ->
      cycle_batch_triage.model_tier_routing.orchestrator_session.
    next_action: >
      Write the skill (orientation, the loop above, the never-list
      verbatim, the launch line, the handoff shape) and the cycle script
