      - 'the arm asserts against a log it alone controls, so no concurrent writer can move its baseline'
      - 'NEGATIVE CONTROL: with the writer reverted to a hardcoded /tmp path, arm 1c still FAILS — the hermetic rework must not turn it into a resolver comparison'
