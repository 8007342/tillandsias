packets:
  - packet_id: the-hardening-guard-covers-one-launch-entry-point-of-two
    order: 999-5m4e
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: linux
    capability_tags: [podman, security, fail-loud, guard-coverage]
    estimated_hours: 2
    title: |
      986-ahnc validates the hardening envelope in run_agent_container_attached; run_delegated_agent_container launches without ever calling it.
    context: |
      FOUND by lenovinha while closing 995-srbf, and it is a residual on MY OWN
      earlier packet — 986-ahnc, which I filed and closed.
      HOW IT SURFACED, which is the part worth keeping. The
      `delegated_result_fake_podman_covers_fresh_status_and_exact_timeout_reap`
      fixture builds a bare argv: `--rm --name <n> <image>`, no hardening flags
      at all. It passes that argv to BOTH launch functions. The
      `run_agent_container_attached` call was refused by the 986-ahnc guard —
      correctly, loudly, with the policy citation. The
      `run_delegated_agent_container` calls in the SAME test, with the SAME
      argv, launched fine.
      That is the whole finding: one entry point refuses an unhardened argv and
      the other does not, and the difference was invisible until a fixture
      happened to exercise both.
      VERIFIED at crates/tillandsias-headless/src/main.rs:11535 —
      run_delegated_agent_container checks the instance-suffix scoping and the
      preseeded result file, then calls
      client.run_container_attached_captured_observed directly. There is no
      validate_launch_argv on that path.
      NOT A THEORETICAL GAP: the delegated path is what the forge worker drain
      uses, so it is the path that launches the most containers.
      I did not fix it inside 995-srbf because it changes the behaviour of a
      second launch path and deserves its own negative control rather than
      riding along in an unrelated packet. What 995-srbf did do is harden the
      FIXTURE's argv, sourcing the flags from
      tillandsias_podman::policy::MANDATORY_HARDENING_FLAGS so it cannot drift
      — which means the fixture no longer demonstrates the gap. Reproduce it by
      reverting that argv to a bare one and watching only one of the two calls
      refuse.
    unscoreable: >
      No litmus covers launch-argv validation, and I am not naming one that
      does not exercise this path. litmus-podman-idiomatic-security-flags
      checks the POLICY envelope behaviourally against a real container; it
      never calls either launch entry point, so citing it would be a live
      reference to the wrong thing — as misleading as a dead one. What makes
      this scoreable is a Rust test in the shape of
      `the_live_forge_argv_satisfies_the_hardening_envelope`
      (crates/tillandsias-headless/src/main.rs), which covers the ATTACHED path
      only: hand the delegated entry point an argv missing one mandatory flag,
      assert the refusal, and pair it with a negative control proving a
      complete argv still launches. Whoever takes this writes that test, and
      the row becomes scoreable instead of staying exempt.
    exit_criteria:
      - run_delegated_agent_container refuses an argv missing any MANDATORY_HARDENING_FLAGS entry, before spawning
      - the refusal names the missing flags and cites policy.rs, matching the attached path's message
      - a test asserts the refusal AND a negative control asserts a complete argv still launches
      - every OTHER launch entry point is enumerated and each is either guarded or recorded as not needing it; two dead builders were already found under 986-ahnc (podman/src/launch.rs build_container_spec, tray/mod.rs build_launch_spec) and a census beats finding the third one by accident
