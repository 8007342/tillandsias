    title: |
      scripts/check-plan-binary-probe-usage.sh:64 defaults SCAN_DIR to `scripts` and :117 walks only that tree plus the litmus corpus, so build.sh — the gate that invokes the plan binary, and the one file every host runs every land — is never scanned, and a hardcoded target/release path with an `-x` claim sits there reporting ok
    context: |
      FOUND BY lenovinha 2026-09-12, in my own patch, during 1127-waxf.

      MY FIRST CUT of the 1127-waxf memo arm in build.sh gated the ledger
      check behind

          [[ -x "$SCRIPT_DIR/target/release/tillandsias-plan" ]] || command -v tillandsias-plan ...

      with a `|| exit 0` inside the resolution. Both are defects this repo
      already has rules for: an exec bit is a CLAIM and running the binary is
      EVIDENCE (721-nyev), and a `|| exit 0` on a failed resolution is a skip
      that reads as a pass. The guard written to refuse the first of those ran
      green in the same gate.

      DEMONSTRATED, not inferred. A hardcoded `target/release/tillandsias-plan`
      path with an `-x` test was planted in build.sh and the guard was re-run:

          ok:plan-binary-probe-usage:21 eligible of 990 scanned [scripts=8/568 litmus=13/422]
          rc=0

      990 files scanned, and the one the defect was in is not among them.
      SCAN_DIR defaults to `scripts` (:64) and the walk is
      `find "$SCAN_DIR" -name '*.sh'` (:117); build.sh sits at the repo root.

      THE GUARD'S OWN HEADER RECORDS THE PRECEDENT, which is why this is a
      narrowing rather than a novelty: it was once scoped to scripts/ by a
      `find scripts -name '*.sh'` and "had been reporting ok on every windows
      cycle ... and its verdict said so nowhere". The scope was widened to
      include the litmus corpus and the entry point was not added. Same defect,
      one population smaller.

      NOT A SCOPE WIDENING TO BE DONE BLIND. build.sh may have legitimate
      reasons to name that path — the gate is the thing that BUILDS the binary,
      so a build-time reference is not automatically the defect the guard is
      about. Whoever takes this should decide whether the entry point joins the
      scanned population, or gets a narrower rule of its own, and say which.
      Adding it to SCAN_DIR without reading build.sh's existing references
      would trade a blind spot for a false red.

      FAMILY. This is the third population gap found in one night, and the three
      together are the finding:
        * audit-guard-activation.sh enumerates check-*.sh ONLY (its line 59), so
          a test-*.sh or verify-*.sh that nothing invokes is invisible to it;
        * an orphaned test-*.sh is detectable today only via
          scripts/gate-divergence-declared.txt, which exists for a different
          purpose (1087-h2z9) and makes "in neither gate" a one-grep question;
        * and this one: the gate's own entry point is outside the population of
          the guard that polices how the gate resolves its binary.
      Each guard is correct about everything it examines. What none of them can
      see is the edge of its own population, and nothing enumerates the
      populations.
    exit_criteria:
      - "the population includes the gate entry points — repo-root *.sh AND scripts/gate-steps.d/*.step, the latter being a surface no `-name '*.sh'` walk can ever match; pre-fix result: FAILS (build.sh unscanned, ok:21 eligible of 990 scanned)"
      - "NOT SATISFIABLE BY THIS ROW, and re-scoped rather than left to fail silently: refusing a hardcoded site inside build.sh needs SITE-level compliance, which this row does not deliver. Measured by yoga: with the population widened, build.sh becomes eligible (entry=1/50) and STILL passes with the hardcoded construct planted, because compliance is a FILE-level test — build.sh sources the probe once, legitimately, at :2915, and that single correct use excuses every hardcoded claim elsewhere in the file. Split to the follow-on row below."
      - "the decision is NAMED: either build.sh joins the scanned population, or it gets a narrower rule, with build.sh's existing legitimate references read first rather than assumed away"
      - "NEGATIVE CONTROL: build.sh's pre-existing references still pass, so the fix does not trade a blind spot for a false red that gets the guard switched off"
      - "the verdict line states its population, so a future reader can tell what was scanned without reading the script — the omission the guard's own header says went unnoticed on every windows cycle"
      - "FOLLOW-ON, not this row: site-level compliance with a STATED legitimate-construct theory. Blast radius measured by yoga before proposing it — all 8 currently-eligible scripts/ files carry BOTH a hardcoded path and a probe call, so a site-level rule with no legitimate-construct theory reds every one of them, including scripts/test-plan-binary-probe.sh, which constructs hardcoded paths BECAUSE IT TESTS THE PROBE (hardcoded=4, probe=4; spot-confirmed independently on lenovinha alongside test-fragment-status-loss.sh 2/2 and test-pre-push-issue-capture-lane.sh 4/9). Same false-red shape as the MCP servers, different surface."
