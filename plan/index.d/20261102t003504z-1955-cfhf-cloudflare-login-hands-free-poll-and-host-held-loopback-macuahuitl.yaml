      OPERATOR (one-time): in 8007342/cloudflare.tillandsias.org after merging PR #1: `npx wrangler kv namespace create RELAY` (paste the id into wrangler.jsonc, commit), `npm test`, `npx wrangler deploy`. Then a Linux agent flips RELAY_POLL_DEFAULT_ON to true and inverts its arm; until then hosts may set TILLANDSIAS_CLOUDFLARE_RELAY_POLL_URL=https://cloudflare.tillandsias.org/cloudflare/poll. macOS host: build the tray from this ref (build-macos-tray), then Cloudflare Login → open the printed URL in Safari → the host page says "You're signed in" and the tray reads stored.
