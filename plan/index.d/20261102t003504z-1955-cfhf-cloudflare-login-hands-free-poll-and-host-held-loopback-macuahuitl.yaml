    title: |
      Cloudflare sign-in completes hands-free from any Android or iOS phone (the relay Worker keeps the code by its state for at most 120 s and one host poll reads and deletes it), and on a VM tray the local-browser callback lands on a live page because the HOST holds the 127.0.0.1 listener and forwards code+state to the guest over the control wire; both landing pages carry an inline Mācron artwork slot
    context: |
      Stacked on work/1954-cfqr (PR #812), which turned the registered relay on by default; that left a paste step (phone shows code=…&state=…) the operator ruled unacceptable (Universal Clipboard is Apple-only).
      (A) HANDS-FREE. Sibling repo 8007342/cloudflare.tillandsias.org PR #1 (branch poll-endpoint, every commit [skip ci], NOT deployed): src/worker.mjs runs first on /cloudflare/callback and /cloudflare/poll; the callback stores code under state in Workers KV (expirationTtl 120), strips the code and 303s to ?done=1; the poll returns 204 until present, then deletes and answers 200 {state, code} exactly once; no console output; Workers Logs stay off; README privacy text amended to say exactly that. The Tillandsias host already polls (poll_relay); DEFAULT_RELAY_POLL_URL is added GATED OFF (RELAY_POLL_DEFAULT_ON=false, pinned arm) because the undeployed path answers 404, which poll_relay reads as "not yet" and would wait the whole window. assets/cloudflare-relay/index.html is synced from the sibling page (done screen, paste line only as a collapsed fallback, no xmlns URL so the relay-page litmus still passes).
      (B) LOCAL BROWSER ON A VM TRAY. New tillandsias_host_shell::cloudflare_callback: HostCallbackListener binds 127.0.0.1 on the first free registered port ON THE HOST, hands TILLANDSIAS_CLOUDFLARE_HOST_CALLBACK_PORT to the guest through the PTY launch environment (the guest child's env is exactly opts.env), serves ONE shape-checked callback with a live page (no script, code never echoed), and the macOS tray forwards Callback::as_line over the control wire as the new trailing variant ControlMessage::CloudflareCallbackForward {seq, line} (index 40, acked with IssueAck, sent only when the guest advertises it). vsock_server writes the line to $XDG_RUNTIME_DIR/tillandsias-cloudflare-callback.sock; the guest login (LoginDeps.host_callback, default_via third argument) binds that socket BEFORE the URL is shown, redirects to the HOST port, and judges the forwarded line state-first through the same judge_callback as every receiver. The host never has the state expectation or the PKCE verifier; the line is a single-use code, never a token, never logged on either side.
      (C) ART. No local image pipeline is reachable from this host (no sd.cpp/ComfyUI service running; imagegen_placement.rs is code, not a service), so both pages ship an inline <svg id="macron-art"> placeholder with a MACRON ART SLOT comment pointing at the canon (macron.dev assets/Tlatoāni + Mācron cannon guidelines.md). The art itself is the follow-up packet below; no model licence was added.
      MEASURED ON LINUX ONLY: the macOS tray wiring (action_host.rs: bind before launch, extra_env into run_pty_attach, forward task) is cfg-gated off this host and compiles only on macOS; the macOS host's build (build-macos-tray) is the first compile of it.
    exit_criteria:
      - "host-shell: the host listener serves one shape-valid callback with a 200 page containing id=\"macron-art\" and no script, never echoes the code, 404s a stray path first, and closes the port after the one callback; a denial is forwarded by name; repeated, missing or non-URL-safe parameters are not forwarded; apply_to puts TILLANDSIAS_CLOUDFLARE_HOST_CALLBACK_PORT=<port> in the launch env (arms in cloudflare_callback.rs, all RED pre-fix: the module does not exist)"
      - "guest: with host_callback set and no relay, login(None) redirects to http://127.0.0.1:<host port>/tillandsias/cloudflare/callback and the forward socket exists before the URL is shown; receive_forwarded returns the code for a line with the expected state and refuses state-mismatch before reading the code, removing the socket file (arm cloudflare_login_with_a_host_held_loopback_…, RED pre-fix); default_via(false,false,true) is Loopback and default_via(false,true,true) is Qr"
      - "control-wire: CloudflareCallbackForward is pinned at index 40, sampled, and DECLARED_VARIANTS is 41 (the contiguity arm fails on a missing sample)"
      - "RELAY_POLL_DEFAULT_ON is false and resolve_relay(None,None,true).1 is None; with the poll default on, the default relay brings DEFAULT_RELAY_POLL_URL and a custom relay or an empty poll env does not (arm relay_poll_default_is_gated_off_until_the_worker_is_deployed)"
      - "sibling PR #1: npm test 14/14 (callback stores and strips, poll 204→200 once→204, 400/405, no console); not deployed"
      - "./build.sh --preflight refused=0; scripts/test-cloudflare-login.sh relay-page arms stay green on the synced page"
