    title: |
      Forge git identity from the GitHub App login (operator 2026-09-28): name and email from the authenticated user, plus the host and a Tillandsia-species name, written as guest git CONFIG — not the host's gitconfig, not exported GIT_AUTHOR_* env
    context: |
      OPERATOR, verbatim (relayed by macuahuitl-forge): "Ask Macuahuitl to
      redesign how the git identity get derived, now that we login with a
      GitHub app we should have access to the user's name and email. We just
      need to juggle host names, and append some tillandsias names for
      randomness".
      TODAY: read_git_identity_defaults (crates/tillandsias-headless) reads the
      HOST's global gitconfig and passes it as exported GIT_AUTHOR_*/
      GIT_COMMITTER_* env; configure_git_identity (images/default/
      lib-common.sh) re-exports it. That contradicts the live requirement
      "The guest never inherits the host's git identity" (spec
      forge-git-identity-anonymization), makes identity shape depend on each
      host's setup (Tlatoani <bulloncito@gmail.com> in macuahuitl-forge,
      tlatoani@macuahuitl.<domain> elsewhere), and — because it is EXPORTED —
      overrides -c user.name in every scratch-repo fixture inside a forge
      (test-discipline-derive 4/5 red in every forge; 1446-xqi6's fixture).
      Spec delta and consumer list: openspec/changes/
      forge-git-identity-from-github-app/.
      DEFAULTS (coordinator; the operator may override any of them in the
      change's open questions): display name `<GitHub name> (<host> ·
      tillandsia-<species>)`; email `<id>+<login>@users.noreply.github.com`;
      host ALSO in a `Tillandsias-Host: <host>` trailer written by the
      existing prepare-commit-msg hook, which fleet-activity.sh and discipline
      derive read before falling back to the email domain; species name
      chosen once per forge (stable for its life). No App login: a
      project-scoped identity, never the host gitconfig.
      CHECK FIRST: whether the stored App token can read /user name and the
      noreply id without a new scope; if the email needs /user/emails, the
      noreply form avoids the scope.
    verifiable_closure: |
      A fixture (scripts/test-forge-git-identity-source.sh) against a scratch
      HOME: (1) with a planted host ~/.gitconfig naming "Host Person
      <host@example.test>" and a stubbed App user {name: "App User", id: 7,
      login: "appuser"}, the forge env/args the binary builds carry NO
      GIT_AUTHOR_*/GIT_COMMITTER_* and no "Host Person"; (2) configure_git_identity
      run in a scratch repo writes user.name "App User (<host> · tillandsia-*)"
      and user.email 7+appuser@users.noreply.github.com; (3) in that shell,
      `git -c user.name=fixture -c user.email=f@x commit` authors as fixture
      <f@x>; (4) a commit made through the trailer hook carries
      Tillandsias-Host: <host>, and scripts/fleet-activity.sh attributes it to
      that host; (5) NEGATIVE CONTROL: with no App user stubbed, the identity
      is project-scoped and still contains nothing from the host gitconfig.
      PRE-FIX RESULT: FAILS at (1) — the binary exports the host gitconfig.
