  estimated_hours: 5
  title: "Split images/proxy/allowlist.txt into per-tier files and serve each declared tier set on its own Squid port"
  context: "Every proxied runtime container shares one 119-domain list on port 3128."
  exit_criteria:
  - "allowlist.txt is split into images/proxy/tiers/<tier>.txt along its sections; a litmus check pins union == previous list."
  - "Squid ports per tier set are generated at start from the tier files and matched with myportname + ssl::server_name; 3128 keeps serving the union."
  verifiable_closure: "A proxy fixture: an assets-port client reaches fonts.googleapis.com and is refused pypi.org."
  unscoreable: 'none.'
  next_action: "allowlist.txt is split into images/proxy/tiers/<tier>.txt along its sections; a litmus check pins union == previous list."
