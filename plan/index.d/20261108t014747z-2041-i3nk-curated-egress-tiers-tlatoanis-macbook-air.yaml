- packet_id: the-proxy-refuses-a-connect-whose-target-does-not-match-its-sni
  order: 2041-8azp
  status: ready
  kind: bug
  priority: p2
  desired_release: v0.5
  pickup_role: linux
  capability_tags: [proxy, squid, security]
  estimated_hours: 3
  title: "The proxy refuses a spliced CONNECT whose target does not resolve from the SNI (SNI spoofing)"
  context: "Splice decisions use the client-supplied SNI, which can be forged (Squid SslPeekAndSplice docs); host_verify_strict covers Host, not SNI, and is gone in Squid v8."
  exit_criteria:
  - "A CONNECT to an IP that is not in the SNI's resolution is refused with refused:egress:sni-mismatch; a forged-SNI fixture is red before the fix and green after."
  verifiable_closure: "The fixture against the built proxy image."
  unscoreable: 'none.'
