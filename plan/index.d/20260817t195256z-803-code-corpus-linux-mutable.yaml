# Ledger fragment — append-only, IMMUTABLE once written.
# Filed by linux_mutable (macuahuitl), 2026-08-17T19:52:56Z.
#
# From an operator question worth repeating: "would the local expert system have
# known that? Try asking a bunch of questions that you just had to answer by
# querying code and see if the expert system would have saved you time."
# So I measured it instead of guessing. The scorecard is below and it is not
# flattering to the agent.
packets:
  - packet_id: expert-rag-corpus-excludes-the-code-it-is-most-often-asked-about
    order: 803-su4n
    status: ready
    desired_release: v0.5
    priority: p1
    kind: enhancement
    title: "the spec RAG index covers specs, cheatsheets and methodology but NOT code — and code is what agents actually grep, so the expert is absent for the majority of real questions"
    deliverable: "a code corpus in the RAG index (crates/**/*.rs, scripts/**/*.sh, images/**) with the same cited-envelope contract, so a question like 'how is the inference tier chosen' returns a verifiable file:line instead of confidence=unsupported; chunking must respect function/section boundaries so a citation lands on something a reader can act on"
    pickup_role: linux
    release_target: forge-local-experts-milestone
    capability_tags: [experts, rag, velocity, citations]
    estimated_hours: 10
    context: |
      MEASURED, macuahuitl 2026-08-17, by re-asking the experts the questions I
      had actually answered by grepping code earlier the same session.

      WHAT THE CORPUS IS. crates/tillandsias-plan/src/spec.rs:64 —
        CORPUS_ROOTS = [("openspec/specs","spec"), ("cheatsheets","cheatsheet"),
                        ("docs/cheatsheets","cheatsheet"), ("methodology","methodology")]
      Four roots, .md and .yaml. No crates/, no scripts/, no images/. So the L1
      expert structurally cannot answer a question about code, and answers
      confidence=unsupported or retrieves something adjacent.

      THE SCORECARD, three spec-expert questions plus one plan-expert question:

        Q1 "does the inference container keep models in a host dir or a podman
            volume, and does the cache survive podman system reset?"
            -> retrieved, 6 citations, and citation #2 is
               openspec/specs/inference-container/spec.md:32-35, which says
               "Models SHALL be stored in a persistent volume at
               ~/.cache/tillandsias/models/ ON THE HOST, mounted into the
               inference container at /home/ollama/.ollama/models/", followed by
               "Scenario: Model persists across restarts".
            VERDICT: HIT. The expert had the exact answer. I went to the code
            anyway, and then asserted the OPPOSITE to the operator — that the
            runtime cache was a podman volume wiped by system reset. One query
            would have prevented a wrong statement, not merely saved a grep.

        Q2 "how is the inference accelerator tier selected, and what makes it
            fall back to CPU?"
            -> retrieved, 6 citations, all in inference-container/spec.md
               (tier-S is the always-available terminal, fallback chains
               terminate there).
            VERDICT: PARTIAL. Correct ARCHITECTURE, and it would have oriented
            me. It cannot say the MECHANISM — that entrypoint.sh:165 reads
            TILLANDSIAS_INFERENCE_TIER and that effective_inference_tier()
            downgrades on a missing CDI file. That is code, so it is invisible.

        Q3 "what does podman system reset delete, and what survives it?"
            -> retrieved, 6 citations, top hit cheatsheets/runtime/podman.md:65-67
               which is a Troubleshooting block about `podman system info` and
               `podman logs`. It also cited podman-logging.md:21-26.
            VERDICT: MISS. The corpus contains exactly ONE authoritative line —
               podman-logging.md:48, "Destructive host reset | podman system
               reset | Operator-only recovery that wipes Podman state" — and
               retrieval got the right FILE with the WRONG SPAN. A reader
               following that citation learns nothing and has no signal that
               they were sent to the wrong place. Note this is the failure mode
               801-g9nn is about, arriving from a different direction:
               confidence=retrieved with six citations reads as authority.

        Q4 "what is the packet_id for order 406" (plan expert, deterministic)
            -> confidence=EXACT, inference-cuda-bringup-fat-host, cited to
               plan/index.yaml:19341-19420, source_commit matching HEAD.
            VERDICT: HIT, and the sharpest one. I hand-wrote a plausible
            packet_id TWICE this session (696-6byc and 408) and both were
            silently discarded by the fold. The deterministic tier would have
            answered both instantly. The failure was not the tool; it was not
            asking it.

      THE PATTERN. Of the questions that consumed this session — the tier
      mechanism, nvidia_cdi_available's search paths, build.sh exporting
      TILLANDSIAS_PODMAN_REMOTE_URL, the podman mock's fall-through exit 0, the
      litmus preflight conflating timeout with exec failure — every single one
      is CODE. The expert system was structurally absent for exactly the class
      of question that cost the most hours.

      WHY A CODE CORPUS AND NOT "JUST USE grep_code". project-info already
      offers search_code/grep_code, and they are lexical: they find a string if
      you already know the string. Every finding above came from NOT knowing
      the string — "what decides the tier" is a semantic question whose answer
      contains neither "tier" as I phrased it nor the file I needed. The RAG
      tier's value is answering the question you can only ask in prose, and
      returning a citation that verify-answer can check.

      DESIGN NOTES for whoever takes it:
        * Chunk on syntactic boundaries (fn / impl for Rust, function / section
          for shell), not fixed windows. A citation that lands mid-function is
          the Q3 failure again.
        * The corpus is large; measure the embed cost before committing. The
          spec corpus alone is 9910 chunks and ~12 minutes cold on this host,
          and crates/ is far bigger. This is an argument for the GPU embedding
          lane (now live, 408) and for the durable index (801-a2by), not
          against the corpus.
        * Code moves far faster than specs, so per-citation commits (801-g9nn)
          matter MORE here: a stale line number in a spec is annoying, a stale
          line number in a function someone is about to edit is a wrong edit.
    notes: |
      SECONDARY FINDING, cheap and worth doing regardless. The spec sentence
      that answers Q1 says "stored in a persistent VOLUME at
      ~/.cache/tillandsias/models/ on the host". It is a host bind mount, not a
      podman volume; "volume" there is loose usage. That wording is a plausible
      seed for the exact error I made, so it is worth tightening to "host
      directory (bind mount)" — the distinction is the entire answer to whether
      `podman system reset` destroys it.
