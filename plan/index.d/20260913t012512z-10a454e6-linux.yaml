          * read_host_project_current_branch(project_path)   (7302, 14891)
          * write_forge_gitconfig(.., project_path) -> resolve_host_project_origin  (7330, 15027)

        MEASURED CONSEQUENCES, both on this host, recorded on 776-jcf3:
          rc=128 (no ./tillandsias in cwd)  -> "launch WITHOUT a mirror redirect"
          rc=0   (a stray ./tillandsias)    -> origin read from an UNRELATED repository
        The second is the one that matters: it is silent, it succeeds, and nothing
        distinguishes it from the real project.

        PLANNED FIX: give both builders `host_checkout: Option<&Path>` (None in cloud
        mode) for the two git reads, and pass the already-resolved remote URL into
        write_forge_gitconfig so cloud mode gets its redirect from the resolved project
        rather than from the filesystem. project_path stays as-is for the MOUNT
        arguments, which legitimately need a path; widening that is not this row.

        FLAGGED BEFORE DOING IT, because it adds a shared test primitive rather than a
