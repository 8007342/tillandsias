    title: |
      build.sh points every worktree at the main checkout's target/ (the RAID bind mount) under an flock, and re-touches the tree when another checkout built last, so sccache's absolute-target-dir key is identical across worktrees without a gate running another checkout's binaries
    context: |
      Operator ruling 2026-10-20. 1804-sccl measured 0 of 244 cross-worktree
      sccache hits with per-worktree targets and 276 of 276 at one path.
      The known hazard of a shared target (mtime-only freshness; baked
      env!(CARGO_MANIFEST_DIR)) is guarded by scripts/shared-target.sh:
      flock on the dir for the life of build.sh, an owner record of
      checkout plus index digest, and a touch of every tracked file when the
      owner differs.
