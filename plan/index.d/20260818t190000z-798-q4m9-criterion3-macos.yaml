      summary: |
        CRITERION 3 MEASURED — 1 vCPU, cold boot, before and after, two samples
        each. The packet refused a multi-vCPU pass as evidence; this is the real
        thing.

            arm      ExecMainStart -> "vsock listener bound"
            BEFORE   81.286 ms  /  74.376 ms      (mean ~77.8)
            AFTER     5.868 ms  /   5.802 ms      (mean ~5.8)

        ~13x faster, ~72 ms removed, and the AFTER arm varies by 66 us across
        samples while BEFORE varies by ~7 ms — consistent with BEFORE depending
        on how much background work happened to get scheduled first.

        THE SHAPE IS THE PROOF, not just the totals. In the BEFORE arm the vsock
        spawn is ISSUED at 9.3 ms but the listener does not BIND until 81.3 ms:
        72 ms of the task sitting in the injection queue behind five background
        spawns on a single worker. In the AFTER arm the spawn-issue and the bind
        carry the SAME journal timestamp — nothing is queued ahead of it, so it
        binds immediately. That is precisely the mechanism the packet described,
        now observed rather than argued.

        FIRST I HAD TO MAKE IT OBSERVABLE, AND THAT IS THE FINDING WORTH
        CARRYING. The bind moment left NO trace: `info!(spec="vsock-transport",
        …)` after `bind()` has no subscriber in the guest — measured, not
        assumed, by searching the whole guest filesystem for `tillandsias.log`
        (absent) and grepping the unit's journal (no such line). So criterion 3
        was UNSATISFIABLE BY ANYONE as the code stood.
        My first attempt measured the vsock PREFLIGHT line instead, as a proxy
        for the spawn. It produced BEFORE 6.624 ms vs AFTER 6.605 ms — a 19 us
        difference — and I nearly recorded that as "the reordering does not
        help". It was the WRONG QUANTITY: `tokio::spawn` only enqueues, so
        issuing five spawns costs microseconds, and the proxy timed the issue
        rather than the bind. A near-null result from a proxy is exactly the
        shape that gets believed, because it looks like a careful negative.
        Fixed by one `eprintln!` at the instant `bind()` returns — stderr from
        this unit demonstrably reaches the journal with a monotonic timestamp
        (the preflight line proves the path), so it is the smallest change that
        makes the criterion measurable, and it is now a permanent observable for
        anyone re-measuring this seam.

        BOTH ARMS WERE BUILT WITH THE OBSERVABLE so the comparison is like for
        like: the 798 change is confined to main.rs's spawn ordering and
        vsock_server.rs is untouched by it, so reverting only main.rs to
        beb7a68de~1 and rebuilding gives a BEFORE binary that differs from AFTER
        in exactly the thing under test. Each run's `sha256sum
        /usr/local/bin/tillandsias-headless` was captured in-guest to prove
        which binary actually ran (f45b8380… BEFORE, a4884f1a… AFTER) rather
        than trusting that staging did what was asked.

        MEASUREMENT SEAM ADDED, scoped so it cannot become a scaling knob:
        TILLANDSIAS_VZ_CPU_COUNT_FOR_MEASUREMENT. The sizing decision recorded
        in 689-eux9 stays PINNED — this only ever CONSTRAINS the guest (a value
        outside 1..=the pinned count is ignored, so it can never grow it or make
        the default host-dependent), announces itself loudly on stderr when
        used, and is unset in every normal launch. Without it, producing this
        number required a full signed-bundle rebuild per measurement, which is
        enough friction that the honest answer becomes "not measured" — which is
        what it had been.

        CRITERION 4 (clock origin) was already stated and holds here: every
        number above is from DAEMON START (ExecMainStartTimestampMonotonic), not
        from `systemctl enable --now`, and therefore excludes the fetch unit's
        Requires=/After= gate entirely.
      evidence_refs:
        - "1 vCPU cold boots: BEFORE 81.286/74.376 ms, AFTER 5.868/5.802 ms (ExecMainStart -> vsock listener bound)"
        - "BEFORE: spawn issued 9.3 ms but bind 81.3 ms — 72 ms queued behind five spawns; AFTER: issue and bind share a timestamp"
        - "crates/tillandsias-headless/src/vsock_server.rs — eprintln! at the instant bind() returns (the info! had no subscriber; no tillandsias.log exists in the guest)"
        - "crates/tillandsias-vm-layer/src/vz.rs — TILLANDSIAS_VZ_CPU_COUNT_FOR_MEASUREMENT, constrain-only, loud, unset by default"
        - "both arms built with the observable; in-guest sha256 captured per run (f45b8380 BEFORE / a4884f1a AFTER)"
        - "discarded proxy: preflight-line timing gave 6.624 vs 6.605 ms — wrong quantity, nearly recorded as a null result"
