      summary: |
        SECOND REGRESSION FROM THIS ROW, FROM THE SAME CAUSE, recorded beside the
        salvage one because a COMPLETED row with two regressions from one change is a
        signal about the change and not about either bug.

          FIRST  (fixed in 6080e8365, arm at 0672b2ff6): a salvage-only push was
                 classified as the work lane, so 874-w2gc's deletion protection
                 DOWNGRADED FROM A REFUSAL TO A WARNING with its refusal text intact.
          SECOND (1326-w9t9, filed by lenovinha, my instance appended there): on the
                 work lane the hook's terminal line
                 (scripts/hooks/pre-push-local-gate.sh:2030) prints
                 "✓ ./build.sh --check current for this tree" over a STALE stamp —
                 verified stale by scripts/gate-stamp.sh at the same moment.

        ONE CAUSE: CODE AFTER A RETURNED refuse() RUNS IN A STATE IT WAS NEVER WRITTEN
        FOR. This row changed refuse() to warn-and-RETURN on the work lane instead of
        exiting. Every line after every decider was written on the assumption that
        reaching it means the decider passed. Two of those lines have now been found
        asserting the opposite — one a refusal that stopped refusing, one a success that
        was never true. Neither is a typo; both are the same structural consequence, and
        there is no reason to believe two is the total.

        THE DEFERRED BINDING IS OWED, NOT WAIVED, AND THIS IS THE EVIDENCE. This row's
        commit deferred wiring scripts/test-pre-push-work-ref-lane.sh into --check
        pending a recorded SECOND-REGIME run, and stated what that run must confirm:
        "that nothing after a returned refuse() misbehaves on that platform". Something
        after a returned refuse() misbehaves on THIS platform, twice, and both were
        found by accident rather than by the check that was deferred. macneo and
        yolanda run the same code path.

        WHAT A READER SHOULD TAKE FROM THE PAIR rather than from either alone: when a
        guard is changed from EXIT to RETURN, the reviewable unit is not the guard, it
        is everything downstream of it. The diff that makes the change is small and
        local; its blast radius is the whole remainder of the file.
