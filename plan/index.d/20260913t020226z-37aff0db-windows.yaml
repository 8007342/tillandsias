events:
  - packet_id: the-cheatsheet-tier-check-protects-neither-windows-host-by-two-independent-routes
    event:
      type: note
      ts: "2026-09-13T02:02:26Z"
      agent_id: windows-esmeraldinha-claude-20260913t020225z
      host: windows
      summary: |
        REACHABILITY CORRECTION, and it shrinks this row's blast radius substantially. The ordering defect in resolve_target_binary is real and the reorder is still the right fix, but it is only REACHABLE when CARGO_TARGET_DIR points at a directory holding both a native and a non-native artefact. The sanctioned launch path avoids that by construction, so no host following the documented path has been exposed.

        THE MECHANISM, established after yolanda eliminated the WSL-boundary hypothesis. build.sh sources scripts/with-wsl2-builder.sh, which on a Git-Bash host re-execs the WHOLE script into the tillandsias-build distro AND exports CARGO_TARGET_DIR=/root/.cache/tillandsias-wsl2-target/<repo>. That directory is distro-local and holds only Linux artefacts. resolve_target_binary then has no .exe to prefer, and the ELF is the only candidate.

        The esme run that produced this row did NOT take that path. To survive repeated harness memory-reaps, build.sh --check was launched from INSIDE the distro under setsid, so with-wsl2-builder saw an already-Linux shell, did not re-exec, and never set CARGO_TARGET_DIR. That gate therefore used ./target/debug on the /mnt/c drvfs mount, which on a shared Windows/WSL checkout holds BOTH tillandsias-policy (ELF) and tillandsias-policy.exe (PE32+). Evidence, from the two hosts' gate logs: esme has 62 occurrences of target/debug and ZERO of tillandsias-wsl2-target; yolanda's has every cargo and rustc path under /root/.cache/tillandsias-wsl2-target.

        SAME CAUSE EXPLAINS THE WALL TIME. The 4050s recorded in this row's provenance against roughly 600s on yolanda is not a floor-tier-versus-other-tier measurement. It is a drvfs target directory versus an ext4 one, on the same defect this fleet already knows about: the host is not slow, its filesystem is. That number should NOT be cited as the cost of a sanctioned gate on this tier, and the 6.75x should not be cited as a tier ratio.

        WHAT THIS DOES NOT CHANGE. The reorder remains correct: trying the .exe before the extensionless path is wrong on its own terms, and a run-don't-stat probe that accepts a stale non-native artefact whenever one happens to be adjacent is a latent trap rather than an acceptable default. It simply is not currently firing for anyone on the documented path.

        A SECOND CORRECTION, to this row's own scope note. Deleting the stale artefact does not persist: target/debug/tillandsias-policy.exe reappeared with its original mtime and a link count of 2, because cargo re-creates the hardlink from target/debug/deps/. The name was deleted, not the artefact. The existing scope note against fixing this by deleting stale artefacts is therefore stronger than when written — that remediation does not merely leave the defect live elsewhere, it does not hold on the host that performs it.

        HOW THE ORIGINAL ERROR HAPPENED. A sanctioned wrapper was bypassed to solve a real problem — harness reaps were killing the gate, and setsid inside the distro genuinely fixed that — without checking what else the wrapper did. It set the target directory. A 68-minute gate and an inflated blast radius both followed from one unexamined substitution. The correct combination is to let the wrapper re-exec while still surviving the harness, and no launch pattern achieving both has yet been established on a Windows host.
