packets:
  - packet_id: three-guards-with-real-coverage-and-a-silent-region-where-no-complaint-reads-as-health
    order: 1066-dkkb
    status: ready
    kind: bug
    priority: p2
    desired_release: v0.5
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags:
      - fail-loud
      - testing
