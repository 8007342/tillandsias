    context: |
      OPERATOR (2026-09-29, verbatim): "a CODING EXPERT. An MCP server gives
      the agent harness ONE method, write_function_for_file(contents), whose
      signature and affordances are generated dynamically per call: the MCP
      receives a request for a code change, mints a ONE-TIME MCP signature +
      affordances (leverage the project's embedded Lua runtime for this
      dynamic surface), and issues it to the Coding Expert. The Coding
      Expert is RAG-enhanced with embeddings from the project's git mirror
      AND from EAGERLY LOADED cheatsheets for the project's technologies
      (Rust, Lua, Tokio, ...), refreshed as fresh RAG. It can be served
      locally and as a fleet expert." Research only, for the milestone after
      v0.6.
