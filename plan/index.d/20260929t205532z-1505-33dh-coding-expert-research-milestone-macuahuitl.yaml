      pipeline CLI; spec expert-serve-grounded-pipeline R1/R2); spec-index,
      experts-probe, corpus-coverage; mlua 0.10 with lua_predicate, lua_std,
      the sandboxed tillandsias-plan lua CLI and hooks/*.lua; the
      command-runtime / command-policies capabilities (1443-6r3q);
      tillandsias-browser-mcp framing/server (protocol 2025-06-18); the tray
