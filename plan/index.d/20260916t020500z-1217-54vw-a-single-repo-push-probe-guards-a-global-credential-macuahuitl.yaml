    title: |
      The push-permission probe verifies ONE repository and seeds a credential used for ALL of them — the CWD dependency is a symptom of a guard with no principled subject
    context: |
      FOUND WHILE RULING ON 1215-xazj's REMEDY SHAPE, not while looking for it.
      yoga-silverblue claimed a bounded part of that row and refused to choose
      among its three candidate remedies without a ruling. Going to read which
      source is authoritative — so the invariant could be named rather than
      guessed — turned up the following, and it makes the remedy question
      unanswerable as posed.
      THREE FACTS FROM THE CODE, each checkable:
        1. read_host_project_origin_url is PARAMETERIZED by a path and has five
           call sites. FOUR pass a real project path. Exactly one passes
           Path::new(".") — the 759-vceg probe in run_provider_login. So the
           convention already exists and the probe is the single place ignoring it.
        2. ProviderLoginConfig carries { provider, auth_model, image_name,
           token_script, input_mode } and NO PROJECT IDENTITY AT ALL. The login
           flow is project-agnostic by construction. The probe did not lose its
           subject; it never had one, and Path::new(".") is where it invented one.
        3. The credential lands at secret/github/token — ONE GLOBAL PATH, not
           per-project. Confirmed on yolanda 2026-09-15 by a direct Vault listing
           with the root token: `vault kv list secret/` returned only
           mirror-identity/, and the successful login created secret/github/token.
      WHAT FOLLOWS. The guard verifies push permission against ONE repository and
      then seeds a credential used for ALL of them. Even on the CLI lane, where
      the probe reaches its check and passes, what it proves is "this token can
      push to whatever repository your shell happened to be standing in" — not
      "this token can push where it will be used". Those differ whenever the
      operator logs in from one checkout and the mirror relays for another.
      THIS IS NOT A RESTATEMENT OF 1215-xazj. That row is "the tray lane cannot
      satisfy the precondition". This row is "the precondition is not the right
      one, and satisfying it in any lane still under-delivers what 759-vceg's own
      refusal text promises the operator". 1215-xazj can be closed without
      touching this, which is precisely the risk: a CWD fix would make the guard
      reachable everywhere while leaving its guarantee narrower than its wording.
      THE GUARD IS STILL WORTH HAVING AND THIS IS NOT AN ARGUMENT TO REMOVE IT.
      759-vceg was vindicated twice on 2026-09-15: it refused three times when it
      could not verify, and the one time it verified, the approved credential
      genuinely pushed. The scope mismatch does not make it useless — it makes its
      TEXT wider than its EVIDENCE, which is this fleet's recurring shape arriving
      in a security guard.
      TWO COHERENT RESOLUTIONS, stated so this is a decision rather than an open
      question, and deliberately not chosen here:
        A. The credential becomes PER-PROJECT, so the repository verified is the
           repository it serves. Blast radius: the Vault path layout, every
           consumer that reads secret/github/token, and the login UX.
        B. The check stops being a ONE-SHOT AT LOGIN and moves to USE TIME, where
           the consumer already knows its own repository. Blast radius: the relay
           path and the failure mode an operator sees (a refusal at push rather
           than at login).
      WHY THE FILER DOES NOT CHOOSE. 1161-42pc is precedent from this same host:
      an env-honoured host allow on the credential helper was specified here and
      had to be WITHDRAWN as a token-redirection path. A coordinator's preference
      is not the right instrument for a credential-scope decision, and naming both
      resolutions with their blast radii is the part that can be done without one.
    exit_criteria:
      - 'the repository a login verifies push permission against is the repository the seeded credential is used for, OR the refusal and success text state the narrower guarantee explicitly so no reader infers the wider one (pre-fix result: FAILS — the text says "push permission cannot be verified against a repository" and the check resolves whatever repo the process CWD names, which for a global credential is arbitrary)'
      - 'NEGATIVE CONTROL: the guard still REFUSES a token that cannot push — narrowing the claim must not widen the admission, and 759-vceg s three measured refusals must still refuse'
      - 'a test demonstrates the mismatch concretely: log in from checkout A, use the credential for repository B, and show what the guard did and did not prove'
      - 'whichever resolution is chosen, the decision and its blast radius are recorded on this row before the code lands, so the next reader can tell a chosen design from an emergent one'
    unscoreable: |
      credential-scope-decision-not-yet-made: resolutions A (per-project
      credential) and B (check at use time) differ in where the operator meets a
      failure and in which components change. Both are coherent; neither is
