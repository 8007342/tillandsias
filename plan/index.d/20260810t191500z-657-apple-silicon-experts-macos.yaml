- packet_id: aarch64-guest-cpu-inference-tuning
  order: 657-3mq5
  status: ready
  desired_release: v0.5
  release_target: forge-local-experts-milestone
  priority: p1
  title: 'Research+measure: unlock i8mm on the VZ guest — native llama.cpp build,
    Q4_0 online repack, thread policy'
  kind: research
  depends_on:
  - macos-inference-tier-verification
  pickup_role: macos
  capability_tags:
  - macos
  - apple-silicon
  - inference
  - experts
  estimated_hours: 10
  outcome: 'In-guest CPU is the only inference lane that exists today on macOS, and
    it is structurally leaving 2-5x on the table (pickup_role: macos). Root cause
    found in llama.cpp''s GGML_CPU_ALL_VARIANTS list for linux-arm64 (ggml/src/CMakeLists.txt):
    every prebuilt variant containing MATMUL_INT8 (i8mm) also demands SVE, which Apple
    cores have never shipped, so runtime variant scoring lands on the armv8.2 dotprod+fp16
    path — and ollama''s linux-arm64 binary vendors the same build system (ollama/ollama
    #17340), so the current guest engine has the same ceiling despite the M5 host
    exposing FEAT_I8MM=1 (host sysctl confirmed; Virtualization.framework passes real
    feature flags through per docker/for-mac #5681). The fix is a native in-guest
    llama.cpp build with -DGGML_NATIVE=ON (optionally -DGGML_CPU_KLEIDIAI=ON) plus
    plain Q4_0 GGUFs relying on online repacking (PRs #9921/#10446; the Q4_0_4_4/4_8/8_8
    file types were removed in b4282): repack benchmarks show ~2.9x pp / ~2.3x tg
    on Graviton 3 and ~5x pp advantage over Q4_K_M on Snapdragon X Elite. Quant defaults
    per the research: Q8_0 or Q6_K for 0.5-1B experts (quality-per-bit dominates,
    still fast at ~0.6-1.3 GB weights), Q4_0-with-repack (speed) or Q4_K_M (quality)
    for 1.5-3B, A/B both. Decode is memory-bandwidth-bound and saturates around 4
    threads at these sizes; the M5 has exactly 4 P-cores, so threads=4 and the current
    4-vCPU clamp is already the decode sweet spot — more vCPUs only help prompt processing
    and invite E-core jitter. Expected in-guest ballparks (estimates, to be measured
    here): 0.5B Q4 ~60-110 tok/s vs the 52 tok/s ollama baseline from order 401. Also
    pins the ollama version if ollama stays: there is an open ~10x arm64 CPU eval
    regression report between 0.12.1 (10.42 tok/s) and 0.14.3 (0.93 tok/s) in arm64
    Docker (ollama #13860). This packet closes 401''s explicitly recorded obligation
    to re-measure the llama.cpp-vs-ollama comparison (experts-construction-decision-2026-07-17.md:78-85)
    and feeds its recipe to the aarch64 image-variant packet.'
  exit_criteria:
  - 'Guest CPU features verified and recorded: /proc/cpuinfo inside the VZ guest shows
    asimddp and i8mm (SME treated as absent unless proven present).'
  - 'Native in-guest llama.cpp build (GGML_NATIVE=ON) shows the ''repack: ... q4_0_4x8''
    log line at model load (retry with --no-mmap if absent per issue #12701) and beats
    the pinned-ollama baseline on llama-bench pp512/tg128 for a 0.5B model by >= 1.5x
    pp and >= 1.2x tg.'
  - 'Quant A/B matrix recorded for 0.5B and 1.5-3B experts (Q4_0-repack vs Q4_K_M
    vs Q8_0/Q6_K): decode, pp, and a quality spot-check on the 393 ground-truth query
    set.'
  - 'Ollama version pinned with benchmark evidence ruling regression #13860 in or
