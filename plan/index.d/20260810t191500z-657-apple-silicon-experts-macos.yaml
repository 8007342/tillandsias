- packet_id: vz-guest-inference-resource-policy
  order: 657-u4un
  status: ready
  desired_release: v0.6
  release_target: forge-local-experts-milestone
  priority: p2
  title: 'Derive the VZ guest clamp from host resources: unlock expert slots and T2
    without breaking the 4-vCPU decode sweet spot'
  kind: implementation
  depends_on:
  - macos-inference-tier-verification
  pickup_role: macos
  capability_tags:
  - macos
  - apple-silicon
  - inference
  - experts
  estimated_hours: 6
  outcome: 'Replaces the hard-coded VZ guest clamp with an inference-aware derived
    policy (pickup_role: macos). Today VzRuntime::start builds the boot spec inline
    with cpu_count = available_parallelism().min(4) and a literal 4 GiB memory (crates/tillandsias-vm-layer/src/vz.rs:1378-1382),
    and the pinned source-scan guard test live_boot_spec_caps_cpu_at_4_and_carries_4gib_memory
    (vz.rs:1966-1986) asserts those literals — so the construction site and the guard
    must change together; nothing else pins the values. The 4 GiB cascades directly
    into inference capability: preload-policy.sh:37-45 gives 0 expert slots below
    8 GB (max_loaded=1) and the T-tier ladder (entrypoint.sh:467-477) pins T1, so
    raising guest RAM to >= 8 GiB unlocks one expert slot and >= 16 GiB unlocks two
    slots plus T2. The vCPU side should NOT be raised by default: decode is memory-bandwidth-bound
    and saturates around 4 threads for 0.5-3B models, the M5 host has exactly 4 P-cores,
    and macOS freely schedules vCPU threads onto E-cores with no pinning API — extra
    vCPUs are a prompt-processing-only lever with jitter cost. Policy shape: derive
    memory from host RAM with explicit headroom for the host-native Metal sidecar''s
    model footprint (the flagship packet shares the same unified memory), keep 4 vCPU
    default with an opt-in pp escape hatch, and convert the guard test to pin the
    policy function''s behavior rather than raw constants. Evidence anchor: order
    401 measured 1.4/3.9 GB guest RAM during serve at the current clamp; re-run that
    measurement set at the new clamp to quantify what the unlocked expert slot buys
    (against the 19.5 s expert-first-answer baseline).'
  exit_criteria:
  - vz.rs construction site and the pinned guard test updated together; the new guard
    pins the derivation policy (inputs -> boot spec) instead of bare literals, and
    the full vm-layer test suite passes.
  - On the 10-core M5 host, the guest boots with derived memory >= 8 GiB and preload-policy
    reports >= 1 expert slot (max_loaded=2) from inside the guest.
  - 'Order 401''s measurement set repeated at the new clamp with deltas recorded:
    cold load, expert first answer, warm tok/s, and guest RAM headroom during serve.'
  - 'Host-memory pressure verified compatible with the Metal sidecar lane: with the
    VM at derived memory plus a loaded sidecar model, no swap-storm on the host; the
    headroom rule is documented in the policy.'
