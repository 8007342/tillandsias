  outcome: 'Makes the accel probe and tier reporting truthful for the macOS product
    once the sidecar lane exists (pickup_role: macos). Two structural fictions today:
    (1) detect_inference_tier()''s ''metal'' arm (crates/tillandsias-headless/src/main.rs:3041-3069)
    never executes in production because headless is cross-compiled to linux-aarch64
    and runs inside the VZ guest (guest_binary.rs:23), reporting ''cpu''; (2) enumerate_engines()
    hardcodes exactly one ollama/llama-server EngineRecord (accel_probe.rs:468-474),
    so no sidecar engine can ever appear in the capability document. The Apple Metal
    GPU DeviceRecord is already correctly host-native-lane-only per PROBE-7 (accel_probe.rs:272-291,
    test :915-936), and accel_envelope() (:544-603) correctly renders it present-unusable
    to forges — correct exactly until 483''s proxied route exists, at which point
    the document must flip to a usable host-native lane or the policy router will
    keep routing around real acceleration. Deliverable: a tray-side (native macOS)
    Metal probe feeding sidecar registration state into the capability document; EngineRecord
    entries for the sidecar engine (e.g. name ''llama-server-metal'', backend ''metal'',
    supported_device_classes [''gpu'']) that appear and disappear with the leased
    registration; and MeasurementRecords (prefill/decode tps per accel_probe.rs:60-70)
    populated from the flagship packet''s real benchmarks (~99 tok/s-class decode
    on 0.5B, 5-10x pp) so routing decisions rest on measured evidence. PROBE-8''s
    ephemeral self-invalidating cache semantics must survive: a stale document must
    never advertise a dead sidecar.'
  exit_criteria:
  - Capability document on the macOS product shows the Apple GPU DeviceRecord with
