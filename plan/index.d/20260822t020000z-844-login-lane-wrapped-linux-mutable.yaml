      summary: |
        THE LOGIN LANE IS WRAPPED. All three exit criteria met, and the test
        found a site the packet did not know about.

        CRITERION 1 — the dispatch at main.rs:763 now goes through
        `run_cli_with_vault_credential_cleanup` like its four siblings
        (:865/:891 status-check, :918/:943 the agent lanes). The `exit(1)` stays
        OUTSIDE the wrapper deliberately: `std::process::exit` runs no
        destructors, so the drain has to have already happened by the time it is
        reached — the shape every sibling uses.

        AND IT IS ONLY SAFE BECAUSE 828-k3mq LANDED FIRST, which I checked
        before touching it rather than after. The naive version of this change
        was a p0 in the OPPOSITE direction: the drain used to be unconditional
        while the mirror teardown it assumes is REFCOUNTED, so a lane exiting
        into a live sibling destroyed a SecretID that sibling still needed —
        renewing a client token it could never replace until max_ttl killed
        every push 24 hours later. `revoke_pending_container_tokens` now applies
        the same refcount, and its doc comment says "do not simplify it back
        into an unconditional drain". So wrapping one more lane adds a drain
        that respects the owning container rather than one that races it.

        CRITERION 3 — the pre-existing mentions describe a DIFFERENT defect,
        re-verified. They belong to 828-k3mq
        (mirror-approle-secretid-destroyed-under-a-still-running-mirror,
        `completed`), which is about the wrapper being too AGGRESSIVE. This
        packet is about one lane not having it at all. The two are in tension,
        which is exactly why the check mattered: had 828-k3mq still been open,
        the right move would have been to leave the lane unwrapped and say so.
        Note those mentions are now in plan/archive/packets-2026-08.yaml rather
        than the live base — the sweep moved them, and they were still findable,
        which is the archive-answerability fix earning its keep.

        CRITERION 2 — a test that pins it, and the packet required that a
        source-scan count ONLY if it fails when the wrapper is removed.
        `every_interactive_cli_lane_drains_its_vault_credentials`. Mutation
        control, unmasked: delete the wrapper from the login dispatch -> exit
        101, restore -> exit 0, source byte-identical.

        THE TEST FOUND A SECOND UNWRAPPED SITE ON ITS FIRST RUN, which the
        packet did not mention: `run_provider_login(&config, debug)?;` at
        main.rs:13463, inside `ensure_provider_auth`. That one is CORRECT as
        written — the function is called by the agent lanes, which are already
        wrapped at their own dispatch sites, so wrapping it again would nest one
        drain inside another. Recorded as a named exception with its reason
        rather than by loosening the rule until it passed. The packet claimed
        one unwrapped dispatch; there were two, and the second was fine.

        TWO THINGS THE TEST GOT WRONG BEFORE IT GOT THEM RIGHT, kept because
        both are general:
          * It matched ITS OWN DATA. The scan reads the file it lives in, so the
            array of call signatures was itself a hit and the first run failed
            on its own literal. A dispatch site is never preceded by a quote; a
            table entry always is.
          * Proximity alone cannot express "wrapped by my caller". That needed
            an explicit list with reasons, which is the same discipline
            windows-only-known-red.txt states: an unexplained entry is how a
