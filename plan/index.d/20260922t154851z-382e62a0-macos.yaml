    value: "\nTHE LAST ITEM IS DELIVERED ON work/920-pxg6, PR #156 — the OpenSpec sync and\narchive, which the 2026-09-20 ruling left as all that remained.\n\nTHE SYNC WAS LOAD-BEARING, NOT BOOKKEEPING, and that is worth recording because\nthe ruling's phrasing (\"sync/archive only\") reads like tidying:\nopenspec/litmus-bindings.yaml:1242 binds THREE litmus tests under spec_id\nexpert-serve-grounded-pipeline, and openspec/specs/expert-serve-grounded-pipeline/\nDID NOT EXIST. The binding named a spec that was not in the live tree, so the\ntidying step was the thing making three bound tests point at something real.\n\n  ADDED openspec/specs/expert-serve-grounded-pipeline/spec.md — the change's six\n  requirements (R1..R6) carried VERBATIM, verified by DIFFING the requirement\n  bodies against the change tree rather than by reading them, wrapped in the\n  house header the sibling specs use.\n\n  MODIFIED openspec/specs/forge-environment-discoverability/spec.md — the one\n  MODIFIED requirement, \"local-experts agent is grounded-endpoint only\",\n  appended at the END of the Requirements section. My first attempt anchored on\n  `## Implementation Notes` and landed it after `## Litmus Tests`, because that\n  spec's Requirements section ends earlier than I assumed; reverted with git\n  checkout and redone against the true boundary.\n\n  ARCHIVED to changes/archive/expert-serve-grounded-pipeline-completed-2026-09-22\n  via `git mv`, so all six files are R100 renames — identical content, history\n  following — and the diff carries NO D lines.\n\nAll 27 tasks in the change's tasks.md were already checked and none open, so this\ncloses the RECORD rather than the work.\n\nCLAIMED AFTER THE WORK WAS DONE. The row was `ready` while I did it and I flipped\nit to in_progress afterwards. Stated rather than hidden; the assignment was\nexplicit from the coordinator, but the ledger order is the reverse of the ideal\nand a later reader should not have to infer that from timestamps.\n\nCheckers: the eight relay deciders and cargo fmt --check green;\ncheck-spec-index-resolution-agreement.sh reads\nok:spec-index-resolution-agreement:carriers=3-scenarios=4.\n\n[2026-09-22T12:34:31Z macos] \nREQ-IDS STAMPED; head 2da9c9fc8. The relay refused this sync with\nviolation:requirement-ids-missing:7 (976-suab) — the six requirements carried\ninto openspec/specs/expert-serve-grounded-pipeline/spec.md and the one appended\nto forge-environment-discoverability carried no `<!-- req-id: ... -->`.\n\nA TRUE POSITIVE AGAINST A REAL GAP, not a flaw in the carrying. Change trees do\nnot carry req-ids; nothing asked for them until those requirements BECAME spec\nfiles. That is this milestone's pattern in miniature: an artifact is complete\nwith respect to the questions asked where it LIVED, and incomplete the moment it\nmoves somewhere that asks more. The same sentence covers tonight's incomplete\nscaffolds from the other direction.\n\nRemedy as the guard itself names it — scripts/stamp-requirement-ids.sh, which\nnever reassigns:\n  ok:requirement-ids-stamped:7 new, 661 already had one, 2 file(s) rewritten\n  ok:requirement-ids:668 requirement(s), all identified and unique\n\nVERBATIM SURVIVES, CHECKED RATHER THAN ASSUMED: 7 insertions, 0 deletions, every\nadded line a req-id comment. The requirement text carried from the change tree is\nbyte-identical, so this row's \"carried verbatim, verified by diffing the bodies\"\nclaim still holds after the stamping.\n\nWHAT THE SYNC TURNS OUT TO HAVE BEEN FOR, now twice over: a requirement without\nan id is INVISIBLE TO EVERY READER THAT CITES REQUIREMENTS. So the step the\nruling called \"sync/archive only\" is what made these requirements citable AND\nwhat made three bound litmus tests point at a spec that exists. Both halves were\ninvisible until the artifact moved.\n\ncheck-requirement-ids.sh is a ./build.sh --check step and is NOT in the preflight\nset, so it was run directly rather than assumed — the second guard tonight whose\nrefusal arrived from outside the set an author habitually runs, which is\n1359-qf3p's subject.\n\n[2026-09-22T15:48:51Z macos] \nLANDED on origin/linux-next; work/920-pxg6 is an ancestor of trunk and\nopenspec/specs/expert-serve-grounded-pipeline/spec.md is present at that tree.\nAll three items of the ruling are done: the spec synced, the modified\nrequirement appended, the change tree archived.\n\nTHE SYNC'S TWO PAYOFFS ARE BOTH VISIBLE ON TRUNK NOW. check-litmus-bindings\nreads ok:litmus-bindings:... spec_ids=141 resolved=141 spec-grandfathered=0 —\nso the three litmus tests bound under this spec_id point at a spec that exists,\nand the requirements carry req-ids, which is what makes them citable at all.\nThe step the ruling called \"sync/archive only\" was doing both."
