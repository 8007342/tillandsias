    value: "THE OUTPUT: when a step is killed at its budget and cpu.pressure shows LOW\nstall, the runner never says the step was \"NOT contended\" and never says it\nis \"genuinely too slow for its budget\". It reports what it measured — CPU\nstall was low, which rules out CPU STARVATION and nothing else — and leaves\nthe cause UNCLASSIFIED for every form of contention it did not measure.\n\nTHE MODEL TO COPY IS ALREADY IN THE FILE. The unavailable path says \"cause\nUNCLASSIFIED (slow step vs starved step); no fallback instrument, because\nnone measures this step's contention\". The low-stall path must be at least\nthat honest. Closure is the wording a reader sees, not the branch shape.\n\nARMS, in the existing hermetic fixture, which already injects counters\nthrough LITMUS_PSI_FILE:\n  * LOW stall -> the verdict must NOT contain \"NOT contended\" and must NOT\n    contain \"genuinely too slow\"; it must name CPU starvation as the only\n    thing excluded.\n  * HIGH stall -> unchanged; that branch was right and stays right.\n  * UNAVAILABLE -> unchanged; it is the model.\nThe low arm must fail against today's wording, or it is not testing this.\n\n\n[2026-09-22T11:43:42Z macos] \nDELIVERED ON work/1358-9wzz, PR #159.\n\nTHE OUTPUT: a low cpu.pressure reading at kill time now reports \"CPU starvation\nEXCLUDED; cause otherwise UNCLASSIFIED\", names what the counter cannot see (I/O,\nlocks, process-table pressure, pattern-kill effects from concurrent steps), and\ntells the reader to RE-RUN THE STEP ALONE — which is the measurement that\nexposed the false verdict in the first place. It no longer says \"NOT contended\"\nand no longer says \"genuinely too slow for its budget\".\n\nVERIFIED END TO END, not only in the fixture: run-litmus-test.sh proxy-container\n--phase pre-build is PASS with the step at 5.1s, matching macbookair's 4.98s\nbare and macuahuitl's 5s bare.\n\nARMS 5 -> 7, and the shape of the new ones matters. Arm 2 PINNED THE FALSE\nSTRING, so it moved with the fix rather than being left to pass against a\nsentence the row calls wrong. The two added arms assert the ABSENCES SEPARATELY\n— no \"NOT contended\", no \"genuinely too slow\" — because a reworded but still\nover-claiming verdict would satisfy the positive match on its own. Mutation:\nrestoring the old wording reds all three, each for its own reason.\n\nTHE HIGH-STALL BRANCH IS UNTOUCHED and the row said so before the work started:\nit claims contention on evidence of contention and already tells the reader to\nre-run before treating it as a regression. Widening into it would have been\nscope this defect does not support.\n\nBUDGET AND FIXTURE UNTOUCHED. The standing rule and 1353-ryhq agree, and this\nrow is the case they exist for: a 60s budget that a 5-second step misses is\nevidence about the host or the harness, never about the budget.\n\nNOTED FOR 1357-trtz: this fixture's total is ALREADY DERIVED (${pass}/${total}),\nso it is a confirmed-good example for that row's survey rather than a candidate.\nRecorded there too, because a sweep that only collects defects leaves the next\nreader to re-derive which files were fine.\n\n[2026-09-22T15:49:21Z macos] \nLANDED; work/1358-9wzz is an ancestor of origin/linux-next and the low-stall\nbranch at that tree carries \"CPU starvation EXCLUDED\".\n\nThe runner no longer converts a CPU-only reading into a claim about contention\nit never measured. What made the defect findable was a CONTROL from a host that\ncould not reproduce the red: 4.98s on darwin against a 60s budget, which is what\nshowed the verdict false rather than merely unhelpful."
