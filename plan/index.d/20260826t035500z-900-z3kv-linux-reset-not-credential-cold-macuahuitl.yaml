packets:
  - packet_id: the-linux-clean-room-reset-does-not-reach-the-host-keychain
    order: 900-z3kv
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    release_target: fail-loud-diagnosis-milestone
    title: |
      podman system reset --force does not touch the host keychain, so every Linux "clean room" e2e since at least 2026-06 reused a months-old Shamir share while the runbook asserted the reset re-initializes Vault
    deliverable: |
      the Linux reset is credential-cold, or the runbook stops claiming it is
    pickup_role: any
    owner_host: any
    depends_on: []
    capability_tags:
      - fail-loud
      - credentials
      - e2e
      - linux
    estimated_hours: 4
    context: |
      MEASURED ON TWO HOSTS, INDEPENDENTLY, during the v0.4.260826.1
      three-platform release validation on 2026-08-26. The second measurement
      exists because the first host argued its own result might be host-specific
      and asked for an independent leg even though the promotion gate was
      already satisfied.

        host        vault-shamir-share-v1        reset result
        yoga        created 2026-06-15
                    modified 2026-07-16          `preserving existing data volume
                                                  (Shamir share present in keychain)`
        lenovinha   created 2026-07-08
                    modified 2026-08-14          same log line, same behaviour

      Both hosts asserted the podman store was genuinely emptied — containers,
      volumes AND images all zero after `podman system reset --force` — and Vault
      then recovered the pre-existing share from the HOST KEYCHAIN, which the
      reset does not reach.

      **Different share ages, different machines, identical behaviour. That
      makes it a PLATFORM property of the Linux lane, not one host's dirty
      state.** One data point could not have separated those two readings, which
      is precisely why the second leg was worth running against an
      already-satisfied gate.

      WHAT THE RUNBOOK CLAIMS, and it is the defect:

        skills/smoke-curl-install-and-test-e2e/SKILL.md:52-53
        "A fresh --init re-initializes Vault and re-captures the keychain-held
         unseal share, so the keychain-volume resync brick is part of what this
         smoke exercises."

      Measured: it recovers and preserves. **The resync path the smoke claims to
      exercise has never been exercised on Linux**, for at least the ~2.5 months
      the older share has existed, and every Linux e2e PASS in that window
      silently carried that gap.

      WHY THIS IS THE WORSE HALF OF THE RELEASE'S THREE NAMED GAPS. All three
      legs volunteered a limit on their own pass, but they are not equivalent,
      and the Windows host put the distinction better than I can:

        "Mine is a test I could not run and said so; theirs is a test that RAN
         and reported a property it was not measuring. The second is the shape
         that survives by looking like data, and it has been surviving since
         June."

      A skipped test is visibly absent. A test that runs green while measuring
      something other than what it claims is indistinguishable from coverage,
      and it accumulates trust with every repetition.

      THE WINDOWS LANE ALREADY SOLVED THIS AND LINUX HAS NO EQUIVALENT.
      804-ckst made every Windows guest-wipe path clear the host's copy of the
      guest vault identity, after exactly this class of defect broke GitHub login
      after a wipe. That packet is Windows-only by construction — written against
      Credential Manager — and its author states plainly that the Linux
      equivalent is not theirs to write.
    outcome: |
      A Linux clean-room e2e either starts credential-cold, or says that it does
      not.
    exit_criteria:
      - 'DECIDE, and record which: either (a) the reset clears the host-held Shamir share so `--init` genuinely re-initializes — the Linux analogue of 804-ckst — or (b) preservation is correct and SKILL.md:52-53 is rewritten to say the share is PRESERVED and the resync path is NOT exercised. Do not do both, and do not leave the runbook asserting (a) while shipping (b).'
      - 'Whichever is chosen, a Linux e2e can DEMONSTRATE which state it ran in. Today a report cannot distinguish credential-cold from credential-warm, which is why four legs all had to volunteer the gap in prose. Record the share''s presence/absence (metadata only) in the findings file, the way the Windows leg records its hashes.'
      - 'If (a): prove it in BOTH directions by fixture — after a reset the keychain entry is absent, and a wipe path that does NOT clear it is caught. A one-direction assertion is what got us here.'
      - 'NEVER MATERIALISE THE SECRET. Both measuring hosts read Created/Modified metadata via `busctl` only. `secret-tool search --all` prints the secret inline and put live tokens into two transcripts on 2026-08-25. Metadata answers this question completely.'
      - 'NEGATIVE CONTROL for (a): clearing the share must not break the legitimate warm-restart path, where a host reboots and Vault SHOULD recover its share. The defect is that a RESET behaves like a restart, not that recovery is wrong.'
    verifiable_closure: |
      On a Linux host holding a pre-existing vault-shamir-share-v1, the
      documented clean-room reset produces the state the runbook claims, and a
      fixture fails if it stops doing so.
    notes: |
      DO NOT close this by making the two Linux legs re-run. Both hosts already
      volunteered that NEITHER of their runs was credential-cold, so a third and
      fourth report cannot close it — the path is unexercised by construction
      until someone changes the reset or the claim. That is the whole reason
      this is a packet rather than a re-test.

      CREDIT: yoga found it during a run it was being asked to pass, and
      reported it as a limit on its own PASS. lenovinha ran the second leg
      specifically to separate platform from host, with the gate already
      satisfied and nothing riding on the answer. yolanda supplied the severity
      framing and identified that 804-ckst does not generalise off Windows.

      Related in shape: 894-scxy (a diagnostic naming the layer it observed
      rather than the one that failed) and 897-5m9y. This is the same class one
      level up — not a message that misdescribes an event, but a TEST that
      misdescribes what it covers.
    events:
      - type: filed
        ts: "2026-08-26T03:55:00Z"
        agent_id: linux-macuahuitl-claude-20260826t034017z
        host: macuahuitl
        summary: |
          Filed by the coordinator after two independent Linux legs measured the
          same behaviour on shares of different ages. Written here because the
          Windows author of the equivalent fix stated the Linux version was not
          theirs to write, and no open row owned it.
