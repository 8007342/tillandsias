      NOT MEASURED: a live window on a desktop session (the acceptance test lenovinha named). KNOWN INTERACTION: on a Linux lane that fails inside the container, the trap pauses first ("Press any key") and then the wrapper ("Press Enter") - two keypresses. Removing the in-container pause on Linux alone (e.g. the launcher passing an env the trap honours) is a follow-up choice, not made here.
