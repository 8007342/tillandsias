    event:
      type: note
      ts: "2026-08-13T20:00:00Z"
      host: windows
      summary: >
        SCOPE CORRECTION from an audit, not a fix — this host cannot compile
        either tray tonight (Smart App Control is blocking the native toolchain,
        `os error 4551`, and the macOS tray does not build here at all), so it
        would have been a change nothing could verify. What it can do is make
        the packet accurate for whoever claims it next.
        THE WINDOWS HALF IS ALREADY DONE. Every version surface in
        crates/tillandsias-windows-tray reads `WORKSPACE_VERSION` — `version_line`
        (notify_icon.rs:761), the tooltip composer (:253), the help text (:822)
        and the hvsocket Hello (hvsocket.rs:31) — with a build.rs that reads the
        workspace VERSION file. `CARGO_PKG_VERSION` survives there only inside a
        COMMENT. The packet's title says "on any platform tray"; that is no
        longer true, and the remaining work is macOS-only.
        THE MACOS HALF IS OPEN, at five sites: main.rs:88 and :122 (the
        `--version` line the packet was filed from), diagnose.rs:293 and :1640
        (the `version` field of the diagnose JSON, which support tooling reads),
        and pty_vsock_bridge.rs:192.
        THAT LAST ONE IS NOT COSMETIC, and it is the reason this note exists.
        The packet frames the defect as an untruthful CLI answer. But
        pty_vsock_bridge.rs:192 COMPARES the guest's reported build_version
        against `env!("CARGO_PKG_VERSION")` and warns on mismatch — so on macOS
        that comparison is against the literal "0.1.0" and can never match a
        real guest version. The skew warning therefore fires on EVERY connection
        to a healthy guest, which is worse than silence: a warning that is
        always true is one an operator learns to scroll past, and build-version
        skew is exactly the signal order 648-772y needed to be legible when an
        older tray downgraded a newer guest's wiring and wedged the control wire.
        Recommended shape for the claiming host, mirroring what the Windows tray
        already does rather than inventing a second mechanism: give the macOS
        crate a build.rs that reads the workspace VERSION into a
        `WORKSPACE_VERSION` env, replace the five `CARGO_PKG_VERSION` uses, and
        pin it with a test named the same as the Windows one
        (`version_line_uses_workspace_version_and_commit`) so
        litmus:wire-unreachable-chip-text-symmetric's cross-tray pattern of
        identically-named pins extends to versioning too.
        Not reprioritised and not reclassified: that is the claiming host's call
        with the code in front of it. The measurement is offered so the call is
        made on facts rather than on a title written before the Windows half
        landed.
