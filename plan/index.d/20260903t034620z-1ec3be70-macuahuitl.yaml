        CORRECTING MY OWN CORRECTION, and this is the version an implementer should build to. I said vz.rs was a fifth AGREEING parser. It is not. Verified by reading it rather than grepping it:     let secure_control_wire = match std::env::var("TILLANDSIAS_SECURE_CONTROL_WIRE") {         Ok(value) if value.eq_ignore_ascii_case("on") => "on",         _ => "off",     }; `_ => "off"` is a CATCH-ALL, not a loud arm. It swallows `1`, `true`, a leading space and a VarError alike, silently — the same behaviour as the Windows copy, differing only in case handling. THE CORRECT TALLY IS FOUR AND TWO, not five and one:   LOUD, refuse an unrecognised value: headless/vsock_server.rs, host-shell/vsock_client.rs, macos-tray/action_host.rs, macos-tray/diagnose.rs   SILENT, default to plaintext:       vm-layer/vz.rs (case-insensitive), windows-tray/hvsocket.rs (case-SENSITIVE) So the divergent copy is LESS isolated than my correction concluded, not more. Two of six readers silently choose plaintext for an accident-shaped value; they merely disagree about which accidents. AND vz.rs IS THE WORSE OF THE TWO, which is why it must not ride as "already correct". It makes no per-process decision: the result is baked into the guest's cloud-init user-data via provision_user_data(secure_control_wire) and into the VM's IDENTITY at vz.rs:576 — `instance-id: tillandsias-vm-secure-{secure_control_wire}-{fingerprint}`. A silent downgrade there is written into the provisioned machine's configuration AND its name, so it outlives the process that made the mistake and survives into a VM someone later inspects and finds internally consistent. The Windows copy ships an insecure client; this one ships an insecure GUEST and stamps the name. TWO ERRORS OF MINE IN ONE EXCHANGE, both the same class and both worth the record because this is becoming a specification. FIRST: I classified vz.rs from a grep hit on `eq_ignore_ascii_case("on")` and never read its fallback arm — matching the pattern and inferring the semantics. SECOND, and worse because it was the check meant to catch the first: I then "verified" the classification with `grep -c 'Err(format!' <file>`, which counts error handling ANYWHERE IN THE FILE. vz.rs scored 16 and is one of the two silent ones. A file-scoped count answering a construct-scoped question — the adjacent-question failure, used as the instrument for auditing an adjacent-question failure. SPECIFICATION CONSEQUENCE, stated so nobody builds the wrong thing: the shared parser must cover SIX call sites and vz.rs must be NAMED as one of them. An implementer reading my previous note would harden five and leave vz.rs — which is precisely the failure I withdrew my first criterion over, one layer down, with a durable artifact at the end of it.
