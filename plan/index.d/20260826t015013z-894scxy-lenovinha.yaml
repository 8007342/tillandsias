events:
  - packet_id: a-diagnostic-that-names-the-layer-it-observed-rather-than-the-layer-that-failed
    event:
      type: implemented
      ts: "2026-08-26T02:00:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t013712z
      host: lenovinha
      summary: |
        Rerouted here after pirria went credential-dark. macuahuitl called it a
        misroute in the first place, and they were right: this is the SAME
        discrimination as 886-qmdz one layer over — "the credential is bad" vs
        "the ref state is stale" becomes "the token could not be RETRIEVED" vs
        "the token was REJECTED server-side".

        THE DISCRIMINATOR IS `gh api user` AND NOTHING ELSE (pirria's
        instrumentation, handed over verbatim). 200 = the stored credential was
        accepted; 401 = it was rejected server-side with the keyring perfectly
        healthy. It runs ONLY on the failure path, after the push probe has
        already failed, so the healthy path pays nothing.

        NO SECRET IS EVER MATERIALISED. `secret-tool search --all` prints the
        value inline — two hosts put live gho_ tokens into their own transcripts
        learning that. Exit status carries the same information. A fixture arm
        asserts the guard never calls secret-tool.

        FIVE VERDICTS WHERE THERE WAS ONE, each naming the layer that FAILED:
          blocked:credential-rejected-by-github            (keyring fine, 401)
          blocked:credential-unretrievable-no-keyring-service
          blocked:credential-unretrievable-keyring-locked
          blocked:credential-plaintext-token-rejected      (pirria's third state)
          blocked:credential-accepted-but-push-refused     (identity good, push not)
        All five are single tokens matching litmus:credential-channel-check-shape.

        THE THIRD STATE IS pirria'S AND NEITHER THE FILING HOST NOR THE
        COORDINATOR HAD NAMED IT: the ABSENCE of an `oauth_token` key in
        ~/.config/gh/hosts.yml is what proves gh is on secret-service. Its
        PRESENCE means every keyring probe is IRRELEVANT rather than merely
        negative, and a two-state classifier buckets it as "keyring healthy" —
        the same misattribution one layer over. It is checked FIRST, before any
        keyring probe, for exactly that reason.

        The fifth verdict is mine and was not in the packet: GitHub accepting the
        identity while the PUSH still fails is neither a keyring fault nor a dead
        token, and naming either would be a third misattribution. It points at
        repo push permission, org SSO authorisation, or a missing scope.

        Per the packet's note, gh's own wording is upstream and untouched. What
        changed is that OUR guard stops inheriting the misattribution and passing
        it on.
  - packet_id: a-diagnostic-that-names-the-layer-it-observed-rather-than-the-layer-that-failed
    event:
      type: verified
      ts: "2026-08-26T02:05:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t013712z
      host: lenovinha
      summary: |
        BOTH DIRECTIONS PROVEN BY FIXTURE, which the packet required because one
        direction is an assertion. scripts/test-check-credential-channel.sh,
        hermetic, stubbed `gh` and `busctl`, no real credential touched:

          14. healthy keyring + 401 -> blocked:credential-rejected-by-github,
              the diagnosis states outright that the keyring is not the problem,
              and prescribes NO keyring action.
          15. secret-service absent from the bus -> unretrievable, named a LOCAL
              retrieval failure, and does NOT prescribe a token refresh — a
              token that was never presented cannot be the thing to refresh.
          16. login collection Locked=true -> unretrievable-keyring-locked.
          17. plaintext hosts.yml -> its own verdict, stating why keyring probes
              do not apply here.
          18. NEGATIVE CONTROL: gh api user 200 with the push still failing ->
              names the push and explicitly rules out BOTH previously-conflated
              causes.
          19. SECURITY: the guard never calls secret-tool.
          20. all five verdicts match the pinned grammar.

        A FIXTURE BUG WORTH RECORDING, because it is the packet's own defect
        committed inside the packet's own test. My first arm-14 assertion
        grepped for "secret-service" to prove the diagnosis does not send the
        reader to the keyring — and fired on the sentence "Do NOT go looking at
        secret-service". A word-absence test cannot tell an imperative from its
        negation. It now pins the negation itself. That is the third time in one
        night I have hit incidental matching in my own test code (888-m75r's
        promotion gate, 892-aw9p's probe count, this).

        Pre-existing arms updated, not weakened: the generic blocked:gh-cli-only
        expectation became the specific blocked:credential-accepted-but-push-refused
        (the stub's gh api user succeeds, so that IS the true state), and the two
        mutation controls now assert `blocked:*` because their claim is "the
        pre-fix guard refuses", not which token it refuses with. Suite green.

        ./build.sh --check green.
  - packet_id: a-diagnostic-that-names-the-layer-it-observed-rather-than-the-layer-that-failed
    event:
      type: note
      ts: "2026-08-26T02:10:00Z"
      agent_id: lenovinha-opus5-metaorch-20260826t013712z
      host: lenovinha
      summary: |
        EXIT CRITERION 4 — the CLASS is recorded where the next author will read
        it: cheatsheets/architecture/diagnostic-attribution.md, bundled into the
        forge image and indexed, so an agent inside the forge finds it at
        $TILLANDSIAS_CHEATSHEETS/INDEX.md.

        It leads with the sentence the four instances earned — A SIGNAL THAT
        NAMES THE WRONG LAYER COSTS MORE THAN NO SIGNAL — and the reason, which
        is the part that compresses: a missing signal leaves a reader searching;
        a misattributed one leaves them searching CONFIDENTLY, in the wrong
        place, and stopping when they find nothing there.

        Carries all four measured instances with their costs, and names 886-qmdz
        as the CONTROL: fixed, its replacement fired correctly on a different
        host days later, and it stayed fixed. The class is real and tractable.

        Two sections go beyond the packet because the night's evidence supports
        them: how to BUILD a discriminator (the pattern common to all four
        fixes — a cheap probe whose answer differs between the candidate causes,
        run on the failure path only), and the fixture form of the same defect,
        where it is harder to see because the result is green. A green fixture
        that could not have gone red is itself a diagnostic naming the wrong
        layer: it says "the property holds" when it means "I did not test the
        property".

        NOT PROMOTED TO METHODOLOGY, honouring macuahuitl's ruling. Their
        reasoning stands — four instances in one night is a strong pattern and
        also ONE night on ONE fleet during an unusually eventful session. A
        cheatsheet is the right weight for now; the sentence can be promoted
        later and should carry all four instances with it.
