    value: "THREE OUTPUTS, each stated as what a reader sees rather than as the\nmechanism that produces it.\n\n1. EVERY verdict — ok, violation, refused and skip alike — carries the\n   subject's full `--version` line, sha and build stamp included. A reader\n   of any past run can say WHICH BINARY answered. Demonstrated on a run of\n   each of the three fixtures.\n\n2. A copy of a fixture run from outside a checkout prints\n   `refused:<fixture>:root-is-not-a-tillandsias-checkout-<path>` and the\n   runner scores the step a FAILURE. Demonstrated by copying one fixture\n   to a temp directory and running it, showing the runner's step verdict.\n   IT MUST NOT BE A SKIP — see the deliverable.\n\n3. A tray built from a different tree than the guest it drives either\n   REFUSES by name, or says in the verdict that skew could not be\n   determined. Which of the two is honest depends on what the image\n   records, and the answer measured before this row was filed is that IT\n   RECORDS NO VERSION (see context) — so a closure claiming a skew\n   refusal must first show the state it compares, or must deliver the\n   \"cannot determine\" wording instead. DO NOT CLOSE THIS BY COMPARING\n   VERSION STRINGS: two specimens below differ in git sha and agree in\n   version.\n\nPRE-FIX RESULTS ARE PART OF THE CLOSURE, both already measured: a dist/\nrun that raised a violation about the wrong subject, and a relocated copy\nthat exited 0 with a silent skip.\n\n\n[2026-09-21T16:51:17Z macos] \nREMAINING SLICE, so the row does not read as if the skew question were settled.\n`skew=undetermined-image-records-no-version` is the honest ending available\ntoday, NOT the intended one. The moment provision.state names the tree that\nbuilt the image — a version, a git sha, anything comparable to what the tray's\n`--version` prints — this becomes a REFUSAL by name, and the fixture stops\nrunning a mismatched pair at all instead of reporting one it could not judge.\nWhoever writes that field should expect to change this verdict with it; it is\none line and a comparison, and the specimens that justify it are already on this\nrow.\n\nTRAPS LINE — `> tmp && mv` DROPS THE EXEC BIT. SECOND INSTANCE; pirria found the\nmechanism earlier the same day. A rewrite that redirects into a temp file and\nmoves it into place creates a NEW file with default permissions, so a mode the\nold file carried is silently gone. All three fixtures landed 100644 here, and\nthe litmus step asserts `test -x`, so it would have surfaced as a failure AFTER\nlanding rather than in the edit that caused it.\n\nWHAT MADE IT SLIP PAST A READER WHO WAS LOOKING: `git commit` printed\n\"mode change 100755 => 100644\" in its own summary and I read only the\nname-status list, which does not show modes. The tool said it; the wrong half of\nthe output was read.\n\nTRAPS LINE — ZSH ATE \":r\" OUT OF A STRING THAT LOOKED LIKE PLAIN TEXT. A\ngenerator written on macOS under zsh emitted `$name:root-is-not-...` and zsh\napplied its `:r` history-modifier to the parameter, producing\n`macos-vz-orphan-diagnosisoot-is-not-...` — the \":r\" removed, no error, no\nwarning, a verdict string that parses as a different verdict name.\n\nBraces are the fix (`${name}:root-...`), and the general rule is the one the\nrunbook already carries: a fixture authored on macOS is authored under zsh and\nmust be asserted under bash. CAUGHT BY READING THE EMITTED LINE, not the source\n— the source looked exactly right, and every reviewer reading the generator\nwould have agreed with it.\n\n[2026-09-21T17:15:19Z macos] \nLANDED ON origin/linux-next AT 4e9f954eb — the QUEUE'S MERGE COMMIT, not the\nbranch tip, which is the SHA a closure event must carry. Verified at that tree\nrather than taken on report:\n  the `verdict` helper appending subject=[…]        present\n  root-is-not-a-tillandsias-checkout                present in all THREE fixtures\n  skew=undetermined-image-records-no-version        present\n  the binding admitting `refused`                   present (filter and failure_pattern)\n  all three fixtures                                100755 — the exec bit that\n                                                    the temp-file rewrite had\n                                                    dropped survived the landing\nand work/1332-tdde is an ancestor of origin/linux-next.\n\nGate green at FULL on base 6e3d8605a, proven by ancestry rather than by the\nqueue's own report.\n\nPROCESS NOTE, recorded because it is the kind of thing that reads as flakiness\nlater: the first queue run on PR #127 was REQUEUED as target-moved — a plan-only\npush moved trunk while the gate ran — and the retry landed in one pass. Nothing\nabout this change caused it. macuahuitl-fedora filed 1335-2nzf for the queue to\nadopt on plan-only movement the way the land tool already does."
