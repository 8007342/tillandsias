            rows: live=9 unclaimed=0 expired=0 held=0 unknown_age=0 total=9

        One live row, this host, no other claimant anywhere.

        WHY IT IS A DISTINCT TRIGGER FROM THIS ROW'S TITLE: this row says "a sibling
        whose fold is merely OLDER than trunk's — a branch that is an ancestor of trunk
        cannot hold a claim trunk lacks." My local `linux-next` is NOT an ancestor of
