          git merge-base --is-ancestor linux-next origin/linux-next  ->  FALSE

        It has DIVERGED — twelve commits of code held back by the release freeze, while
        the claim went up on a separate plan-only branch cut at origin/linux-next. So
        the shape is broader than "older": **any local branch whose fold differs from
        the branch the claim landed on can be reported as a rival claimant, including
        one that diverged rather than lagged, and including the case where the
        "rival" claim is the caller's own.**

        WHY IT IS DANGEROUS RATHER THAN NOISY, and why I am adding it here rather than
        filing separately: the verdict's own remedy text is *"Arbitration is by claim
        TIMESTAMP, not push order: if theirs is earlier you release and reroute."* A
        reader who follows that instruction on this false positive RELEASES A CLAIM THEY
        CORRECTLY HOLD — and the coordinator had separately told me to expect a real
        rival with an EARLIER timestamp on another branch, which is exactly the
        condition under which the instruction says to release. Two plausible readings,
        one of which discards live work, and the artifact is indistinguishable from the
        real thing at the call site. I resolved it by going to `expire-claims
        --list-live` for the claimant identity rather than trusting either the verdict
        or the message.

        SUGGESTED, for whoever fixes this: the verdict should NAME THE CLAIMANT HOST and
        the claim timestamp it is objecting to. "A sibling branch holds this" with no
        host and no timestamp cannot be checked by the reader against the arbitration
        rule the same verdict tells them to apply — which is the fail-loud-diagnosis
        shape: the refusal states a conclusion without the evidence its own remedy
        requires.

        ALSO WORTH NOTING for the freeze-era workflow that produced this: holding code
        on one local branch while pushing ledger fragments from another, cut at trunk,
        is the discipline the coordinator asked for during the freeze and is what
        macneo used tonight. It will therefore be COMMON, not exotic, for as long as
        freezes are in use — so this trigger will recur on every host that follows the
        instruction correctly.
