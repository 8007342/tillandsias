packets:
  - packet_id: build-sh-routes-the-whole-gate-through-remote-podman
    order: 797-r6tc
    status: ready
    desired_release: v0.5
    priority: p0
    kind: bug
    title: "build.sh exports TILLANDSIAS_PODMAN_REMOTE_URL whenever the podman user socket exists, so --ci-full validates a DIFFERENT podman path than every other caller — 7 pre-build litmus specs fail there and all 302 pass without it"
    deliverable: "either the gate stops silently switching podman modes (the export becomes explicit opt-in, like 793-a62g made the storage backend), or the specs that only fail in remote mode are fixed and the mode is asserted; either way `./build.sh --ci-full` and a bare litmus run must agree about what they tested"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [podman, gate, litmus, release, fail-loud]
    estimated_hours: 6
    context: |
      OBSERVED, macuahuitl 2026-08-17. Same commit, same litmus invocation,
      same 302-test set, two environments:

        bash scripts/run-litmus-test.sh --phase pre-build --compact --size quick
          -> PASS 302, FAIL 0, executed 302, rc 0

        the identical command with TILLANDSIAS_PODMAN_REMOTE_URL exported
          -> PASS 299, FAIL 3, executed 302, rc 1
             dev-build/headless-init-status-check-source-built
             litmus-framework/fake-podman-direct-invocation-safety
             podman-orchestration/concurrent-forge-shared-stack-safety

        ./build.sh --ci-full (which exports it, plus the wrapper on PATH)
          -> PASS 295, FAIL 7, executed 302, rc 1
             the three above, plus podman-path-availability,
             transparent-https-caching/forge-runtime-ca-trust,
             runtime-diagnostics-stream-shape,
             headless-mode/headless-least-privilege-delegation-shape

      SOURCE, build.sh:52-58 — if TILLANDSIAS_PODMAN_REMOTE_URL is unset and
      ${XDG_RUNTIME_DIR}/podman/podman.sock is a socket, it is exported. The
      socket is present on any host with podman.socket enabled, which is the
      normal Fedora state, so this fires unconditionally here. It then drives
      scripts/common.sh into the wrapper branch, which additionally puts the
      generated wrapper on PATH and pins TILLANDSIAS_PODMAN_BIN to it.

      PROVENANCE, worth knowing before anyone defends it: the export arrived in
      4650c8f9f (2026-05-14), whose commit message is "checkpoint(codex): split
      quiet quit and repeat modes". It is incidental to that change, carries no
      rationale, and no packet references it. That is not proof it is wrong —
      but nothing recorded says it is right, and it currently decides which
      podman the entire gate exercises.

      WHY p0 AND WHY IT BLOCKS THE RELEASE: the gate is the only verification
      left after push CI was removed (2026-08-03, operator directive). A gate
      that silently tests a different substrate than production callers use is
      not a weaker gate, it is a gate whose subject is unknown. The four
      failures beyond the reproducible three need the wrapper on PATH as well,
      so the full mechanism is mode-switch plus wrapper, not the URL alone.

      DO NOT "FIX" THIS BY DELETING THE EXPORT WITHOUT CHECKING WHO WANTED IT.
      Some lane may depend on the gate reaching podman through the socket
      (rootless/user-service hosts, or the macOS/Windows lanes where podman is
      VM-internal). The shape 793-a62g used for exactly this dilemma is the
      precedent to copy: it did not delete the wrapper, it made the wrapper
      CONFIGURATION rather than inference, so a caller that wants it says so.
      This is the same problem one level up — the gate is inferring a podman
      mode from the incidental presence of a socket file.
  - packet_id: env-fail-preflight-cannot-tell-a-timeout-from-a-failed-exec
    order: 797-5kqe
    status: ready
    desired_release: v0.5
    priority: p1
    kind: bug
    title: "the litmus podman preflight reports 'unresponsive (>5s): stalled storage lock or dead runtime' for ANY non-zero podman exit — it never measured five seconds, and the false diagnosis sent this cycle chasing podman health for hours"
    deliverable: "the preflight distinguishes timeout (124) from exec/other failure and reports what it actually saw, quoting podman's own stderr; 'we could not run podman' and 'podman did not answer in time' stop being the same sentence"
    pickup_role: any
    release_target: fail-loud-diagnosis-milestone
    capability_tags: [fail-loud, litmus, podman, diagnostics]
    estimated_hours: 2
    context: |
      OBSERVED, macuahuitl 2026-08-17, with a direct measurement that
      contradicts the message.

      scripts/run-litmus-test.sh:905-910:

        && command -v podman >/dev/null 2>&1 \
        && ! timeout 5 podman ps --format '{{.ID}}' >/dev/null 2>&1; then
            echo "[ENV-FAIL] podman unresponsive (>5s): stalled storage lock
                  or dead runtime — environmental, not a code regression"

      `timeout 5 X` exits 124 when it actually timed out. It exits with X's
      own status for every other failure — 127 for a wrapper whose exec target
      was deleted, 125, 1, anything. The `!` accepts all of them equally, so a
      podman that failed in 3 milliseconds is announced as one that stalled for
      more than five seconds, complete with a confident named cause ("stalled
      storage lock or dead runtime") and a citation.

      THE CONTRADICTING MEASUREMENT: during a full `./build.sh --ci-full` run
      that produced three of these ENV-FAILs, `podman info` was sampled every
      ten seconds from a parallel shell — 45 samples, slowest 0.14s, none above
      5s, zero timeouts. Podman was never unresponsive at any point in the run
      that declared it unresponsive.

      WHAT IT COST, stated because the packet is about diagnosis quality and
      the cost IS the evidence: roughly four hours and three wrong root causes
      this cycle — concurrent image builds racing a rename, then machine load
      widening a parallel-test race, then podman storage contention. All three
      were plausible, all three were consistent with the message, and the
      message was fiction. The real cause (797-r6tc) was found only after the
      message was disbelieved and the substrate measured directly.

      ADDITIONAL, and arguably worse than the wrong cause: the line asserts
      "environmental, not a code regression". That verdict is what makes a
      reader stop looking. Here it was attached to a genuine, reproducible,
      code-level configuration defect. A preflight may report what it observed;
      it must not classify a failure it did not diagnose.

      NEGATIVE CONTROL THE FIX SHOULD CARRY: put a `podman` on PATH that exits
      non-zero instantly and assert the preflight does NOT say ">5s"; put one
      that sleeps 10s and assert it DOES. Two fixtures, and they are the whole
      specification.

