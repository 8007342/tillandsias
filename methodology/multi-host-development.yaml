trace: spec:methodology-accountability

multi_host_development:
  version: v0.1
  purpose: >
    Coordinate Linux, Windows, and macOS hosts working on sibling branches while
    the Fedora Pivot (using official Fedora Cloud/WSL2 images) provides the
    stable, zero-drift runtime enclave. `plan/` remains the durable inter-agent
    ledger for long-running work, failures, restarts, and idempotent recovery.

  branch_inventory:
    rule: >
      THE REMOTE CARRIES EXACTLY FOUR BRANCHES. Anything else is debris from a
      finished lane and should be retired, not inherited. Verified and enforced
      by cleanup on 2026-08-21, which took the remote from 28 refs to 4.
    branches:
      main: "release only, PR-only, server-side branch protection with enforce_admins since order 476"
      linux-next: "Linux integration, and the CANONICAL HOME for plan/, methodology/, openspec/ and cheatsheets/"
      windows-next: "Windows code"
      osx-next: "macOS code. The name is osx-next. `macos-next` does not exist and never has."
    retired_gh_pages: >
      `gh-pages` was deleted 2026-08-21 by operator ruling, and the reasoning is
      kept because the NEAR-MISS is the lesson, not the outcome.

      It was an orphan branch, 4,477 files, one commit from 2026-03-25 reading
      "init: gh-pages branch for APT repository" — a multi-platform
      distribution route the project explored and did not take. Nothing in the
      tree referenced it. The operator confirmed it unmaintained.

      THE NEAR-MISS: it was flagged NEVER-DELETE hours earlier, on the strength
      of `gh api .../pages` reporting `status: built` and a live public URL.
      That reading was correct about the mechanism and wrong about the value —
      a site can be genuinely served and serve nothing anyone wants. Neither
      the git evidence nor the API could distinguish "published" from
      "published and abandoned"; only the operator knew the route had been
      dropped.

      SO THE RULE IS NOT "check whether Pages is enabled". It is: an orphan
      branch outside the four is an OPERATOR QUESTION, not an agent decision,
      in BOTH directions. Deleting it can take down a live surface; keeping it
      forever on the strength of an HTTP 200 preserves abandoned exploration
      that then has to be reasoned about by every future cleanup.

      Note also what is still true after the delete: the repository's Pages
      SETTING remains enabled and now sources from a branch that no longer
      exists. Deleting a branch does not disable Pages. Whoever revisits this
      should decide that setting deliberately rather than leaving a published
      surface pointed at nothing.
    retiring_a_branch: >
      A branch is a MUTABLE REF: no merge function, no history of its own,
      nothing that converges it. It is therefore NOT a CRDT and NOT storage,
      which is the whole reason the ledger exists. So before deleting a ref
      that carries unmerged content, RECORD THE FACT IN A PLAN FRAGMENT first —
      what the branch held, its SHA, and why it is not needed — then delete.
      The fragment is append-only and folds across hosts; the ref was neither.

      And inspect before deleting, do not sort by date. On 2026-08-20 an
      unmerged fork branch turned out to hold the build-gate memoization that
      cut re-gating from 9.94s to 0.44s, and it existed on exactly one disk.
      "Old and unmerged" is not evidence of "unwanted"; it is evidence of
      "nobody looked".

  platform_branches:
    linux: linux-next
    windows: windows-next
    macos: osx-next
    release: main
    rule: >
      Each host checkpoints to its platform branch. Platform-specific work stays
      on that branch until stable, then merges back to main. Cross-cutting work
      lands on main or the selected shared integration branch and is
      fast-forwarded to all platform branches only after ancestry is verified.
    scope: >
      These branch names (linux-next/windows-next/osx-next/main) are the
      Tillandsias project's OWN development conventions. They apply ONLY when
      the working repository is Tillandsias itself (including dogfooding forge
      cycles launched on this repo). They are NOT a runtime convention of the
      product: a forge launched on an end user's project MUST NOT create,
      assume, or push these branches there.
    forge_target_project_conventions: >
      Agents running inside a Tillandsias forge operate on the TARGET project's
      terms. Before any branch or push decision they discover that project's
      conventions — default branch, existing branch naming, CONTRIBUTING.md /
      repo docs, protection rules — and follow them. When the target project
      declares no convention, agents use its default branch plus ordinary
      short-lived feature branches and surface the choice to the operator;
      they never import Tillandsias-internal branch names into someone else's
      repository. The git mirror service is convention-neutral: it relays
      whatever refs the target project uses.

  branch_convention:
    shared_logic:
      - crates/tillandsias-host-shell
      - crates/tillandsias-core
      - crates/tillandsias-headless
      - images
      - openspec
      - methodology
      - plan
    platform_splits:
      - crates/tillandsias-host-shell-linux
      - crates/tillandsias-host-shell-macos
      - crates/tillandsias-host-shell-windows
      - cfg_target_os_modules
    separation_rule: >
      Keep protocol and shared orchestration in `tillandsias-host-shell` and
      platform-agnostic crates. Keep thin tray wrappers and OS API calls on the
      owning platform branch unless the shared API contract changes.

  branch_namespaces:
    version: v0.1
    provenance: >
      operator-directed 2026-07-28 (The Tlatoani). Decision record:
      plan/issues/git-branching-methodology-research-2026-07-28.md (adopted
      with adversarial-review repairs). This section is rung 1 of a 4-rung
      rollout: DOCUMENTATION ONLY. Enforcement (hook warnings/rejection, lane
      auto-seeding, ledger path policy, coordinator sweep/GC, reconcile
      prune) ships via packets, orders 500-504.
    reserved:
      integration: [main, linux-next, windows-next, osx-next]
      infrastructure: [gh-pages, "release/*"]
      external_tolerated: ["claude/*", "revert-*"]
      note: >
        main is PR-only (protected, enforce_admins, 2026-07-28, order 476).
        linux-next/windows-next/osx-next carry deletion + force-push
        protection (2026-07-28, operator-directed) while keeping direct
        pushes open. The sweep operates ONLY on agent/* and salvage/*
        refs — integration branches are structurally outside its
        enumeration and additionally server-protected against deletion.
    lane_grammar:
      pattern: "agent/<host>/<base>/<yyyymmdd>-<slug>"
      slug: >
        <mode>-<instance>-<launch-epoch>; MANDATORY, launcher-synthesized,
        never reused; all segments lowercase (launcher lowercases hostnames).
      base_rule: >
        <base> names the integration branch the lane was seeded from; the
        merge target derives mechanically from the refname. Bases containing
        '/' (release/*) substitute '-' and record the true base in the
        ledger claim.
      creation_regex: >
        ^refs/heads/(main|gh-pages|(linux|windows|osx)-next|release/[A-Za-z0-9._/-]+|revert-[A-Za-z0-9-]+|claude/[A-Za-z0-9._-]+|agent/[a-z0-9][a-z0-9-]{0,31}/[a-z0-9][a-z0-9._-]{0,47}/20[0-9]{6}-[a-z0-9][a-z0-9-]{0,47}|salvage/[a-z0-9][a-z0-9-]{0,31}/20[0-9]{6}-[a-z0-9][a-z0-9-]{0,47})$
      scope: >
        Tillandsias-repo convention only (platform_branches.scope applies).
        Hook/launcher CODE stays convention-neutral: patterns and path lists
        reach it via config or launcher env, never hard-coded (order-462
        leak class), and policy is read from env or the base ref's committed
        tree, never the pushed tip.
      grandfathering: >
        Grammar applies to NEW branch creations (zero-oldsha) only. The
        rung-1 census COMPLETED 2026-07-28: all 11 legacy remote refs were
        archive-tagged (archive/<branch>-<tipsha>) and pruned,
        operator-approved. The remote now carries only main, gh-pages, and
        the three integration branches; any future out-of-grammar creation
        is a stray for the sweep to report.
      lifecycle_intent: >
        Lanes are merged into their named <base> by the owning agent at
        green exit (merge-only, --no-ff); never rebased or force-pushed once
        relayed. Cherry-pick allowed only with -x AND simultaneous lane
        retirement. Enforcement and the coordinator sweep are packet-gated.
    publish_freely_policy:
      provenance: >
        operator-directed 2026-08-13 (The Tlatoani), after a macOS cycle held
        three gated, fully-tested commits LOCAL-ONLY rather than push them,
        because the pre-push VERSION guard refused osx-next over a divergence
        inherited from linux-next (702-eusw). The operator's correction:
        "git is itself with its branching mechanism safe to push random crap
        ... fear not of pushing experimental code if you're unsure. Use
        branches if you must."
      rule: >
        DO NOT withhold work from the remote because you are unsure of it.
        Unpushed work is the only work that can be LOST — a local-only commit
        survives exactly as long as one disk and one worktree, and the exit
        contract's "no local-only commits" says so for this reason. Pushing
        experimental, partial, or uncertain work to a NON-INTEGRATION branch
        is always safe and always preferred over holding it. If you are
        unsure whether work belongs on an integration branch, that is an
        argument for a branch, NOT an argument for silence.
      layered_clocks: >
        The rationale is that this repo runs a DIFFERENT logical clock at each
        abstraction layer, and they are deliberately not synchronized. A lane
        branch advances on its own; an integration branch advances when a lane
        lands; main advances only when a release PR merges. Work being ahead
        of, behind, or divergent from another layer is the NORMAL state of a
        multi-host system, not an error to be prevented by refusing to
        publish. Only the layer that ships is required to be globally
        consistent.
      what_protection_actually_means: >
        main is the protected layer, and it is protected by things that
        actually verify: PR-only with enforce_admins (order 476), a fully
        compiling tree, and a passing test suite. A branch push cannot reach
        main without passing them. Therefore a branch push cannot break a
        release, and treating branch pushes as risky misreads where the
        protection lives. Conversely, no amount of local caution substitutes
        for those gates — withholding a push protects nothing.
      guard_refusal_procedure: >
        When a pre-push guard refuses an INTEGRATION branch for a condition
        you did not create and do not own (the 702-eusw shape: a divergent
        VERSION inherited from the mandated linux-next merge), do all three:
        (1) publish the tree somewhere durable and reviewable under the lane
        grammar; (2) file the blocker as a packet AND get that packet to the
        remote — a p0 filed only in a local commit is invisible to the host
        that owns the fix, and that was the actual error this policy was
        written from; (3) leave the owning host's decision to the owning host.
        Do NOT --no-verify an integration branch to route around another
        host's release state, and do NOT sit on the work.
      no_branch_exemption_from_the_version_guard: >
        CORRECTION, recorded because the wrong version of this was nearly
        written here as fact (702-pwhc, 2026-08-13). There is NO agent/* or
        salvage/* exemption from the pre-push VERSION guard. An observation
        that the same tree was refused as osx-next and then accepted as
        agent/... minutes later was NOT an exemption — the guard was failing
        open on the larger range through a SIGPIPE/pipefail bug, now fixed.
        With the guard correct, a tree carrying a VERSION divergent from
        main's is refused for EVERY branch except main and
        release/version-bump-*. Two consequences worth knowing before you
        plan around it: the FIRST publication of such a tree is the hard one,
        because a new remote ref is ranged against its merge-base with main
        and therefore includes the foreign bump; once the branch exists,
        subsequent pushes are ranged against the remote tip, so ordinary
        follow-up commits that do not touch VERSION push cleanly. This makes
        an inherited-divergence blocker MORE urgent for the owning host to
        clear, not less — it is not routable around.
      convenient_explanations: >
        The general lesson from 702-pwhc, which cost one wrong conclusion:
        when a rule appears to apply inconsistently, the hypothesis "there
        must be an exemption I did not know about" is the comfortable one and
        should be the LAST one tested. Prefer "the check is broken" and go
        read it. A guard that passes when it should fail looks exactly like a
        guard that does not apply to you.
      naming: >
        Use the lane grammar (agent/<host>/<base>/<yyyymmdd>-<slug>) or
        salvage/<host>/<yyyymmdd>-<slug>. Those two prefixes are the ONLY
        non-integration namespaces the creation_regex admits and the only ones
        the coordinator sweep enumerates, so an out-of-grammar name is a stray
        that nothing will ever reap. "Push freely" is a licence about
        FREQUENCY and CONFIDENCE, not about namespace.
    ledger_rule: >
      Lane branches are code-only for shared ledger state: plan/index.yaml,
      plan.yaml, plan/loop_status.md, and methodology/** ride integration
      branches directly (claims land on the base ref mid-cycle, recording
      lane name + tip SHA). Lanes MAY add new append-only files under
      plan/issues/. Mechanical enforcement is rung 4; until then this is
      binding convention. Rationale: every recorded order-number collision
      came from delayed ledger landing (462/464, 477/479, 478-479/486-487).
    pre_push_gate_amendment: >
      pull_merge_cadence.pre_push_gate.applies_to EXCLUDES agent/* and
      salvage/* refs (mid-cycle lane checkpoints need no trunk merge). The
      lane green-exit procedure and ledger checkpoints MUST merge
      origin/linux-next first when <base> != linux-next, preserving the
      gate's intent for platform branches.
    sweep_role: >
      Lane/salvage backstop (enumerate, sweep-merge, packet, escalate,
      archive+delete) binds to the coordinate-multihost-work ROLE — any host
      running it, not a specific machine; merge-only landings are
      idempotent, so concurrent landers converge. race_exception applies.
      Deadlines: merged->delete; idle >24h -> salvage packet; >72h ->
      operator; >14d -> archive tag then delete.
    salvage_intake:
      pattern: "salvage/<host>/<yyyymmdd>-<slug> — merge target is a triage decision, not encoded in the name"
      who_names: "the pushing (blocked) agent; coordinator may rename on adoption"
      main_guard_case: >
        An agent whose push is rejected by main branch protection pushes the
        SAME tree as salvage/<host>/<date>-<slug> through its normal push
        channel (in-forge: the mirror) and records a blocker ledger entry
        (branch name + tip SHA). The coordinator deals with the merge later:
        selective, merge-only, via PR where main is the target. The hook
        NEVER pre-rejects main; guidance is printed on the relay-failure
        path (rung 2).
      ownership: "coordinator triages; selective adoption per lifecycle_intent; archive-tag before any deletion"
      pending_case: >
        macOS v0.5-validation forge (2026-07-28): any temporary branch it
        pushes when blocked by the main guard is intaken under this
        procedure (adopt/rename to salvage/<host>/..., triage, selective
        merge into osx-next or linux-next, archive+delete).
    forge_branch_inheritance: >
      A forge-hosted agent inherits the branch its lane's mirror was seeded
      from — the host checkout's checked-out branch at launch; the container
      OS never selects the branch. (Closes
      plan/issues/forge-agent-branch-selection-clarification-2026-07-28.md.)
  host_identity:
    required_fields:
      - host_id
      - platform
      - branch
      - worktree_path
      - agent_id
      - lease_id
      - last_seen_commit
      - upstream_commit
      - observed_sibling_heads
    rule: >
      Every plan lease, agent event, and handoff touching shared files includes
      host_id and platform so a cold-start agent can distinguish Linux local
      state from Windows/macOS remote progress.

  start_of_session:
    required_checks:
      - "git fetch origin"
      - "git pull --ff-only"
      - "git ls-remote origin refs/heads/main refs/heads/linux-next refs/heads/windows-next refs/heads/osx-next"
      - "git status --short --branch"
    rule: >
      Before editing, absorb the current remote head for the active platform
      branch and record sibling branch heads in the plan issue or event that
      governs the work.
    remote_progress_rule: >
      A recurrent agent should normally find `origin/linux-next` ahead of its
      local checkout. Treat that as healthy remote progress and fresh-read the
      changed ledgers. The warning condition is repeated lack of remote progress
      across the expected cadence, or remote-ahead combined with a local dirty
      tree, conflict, sandbox, or credential issue that prevents reconciliation.
    repeat_entrypoint: >
      Long-running unattended hosts should use `./repeat --prompt "Use the
      /meta-orchestration skill"`. The repeat launcher resolves the current
      Git worktree root so multiple Tillandsias checkouts on one host stay
      isolated.

  fast_forward_guard:
    before_updating_platform_branch:
      - "git merge-base --is-ancestor origin/<platform-branch> <source-ref>"
      - "git diff --name-only origin/<platform-branch>..<source-ref>"
    rule: >
      A platform branch may be fast-forwarded from main or another shared
      source only when its current remote head is an ancestor. If the ancestry
      check fails, another host has independent work; stop and coordinate
      through `plan/` before pushing.

  sibling_drift_guard:
    max_unintegrated_commits: 5
    rule: >
      If `git rev-list --count origin/linux-next..origin/<sibling>` exceeds 5
      for `osx-next` or `windows-next`, that sibling is in branch-drift alert.
      Freeze new platform feature leases on that sibling until it merges
      `origin/linux-next`, records the observed conflicts or smoke evidence, and
      the coordinator creates or updates a named integration packet.
    rationale: >
      The product-critical path crosses shared secure-wire, embedded guest
      binary, VM provisioning, Podman, and forge-launch boundaries. Long sibling
      drift turns implementation progress into hidden uncertainty because branch
      heads can each be locally correct but globally incompatible.
    allowed_work_while_frozen:
      - "merge origin/linux-next into the platform branch"
      - "resolve platform-owned conflicts"
      - "run and record focused no-regression/e2e evidence"
      - "write shared-state plan/methodology updates directly on linux-next"
    prohibited_work_while_frozen:
      - "new platform feature scope unrelated to the integration blocker"
      - "rebasing or cherry-picking published sibling commits across branches"
      - "overwriting linux-next plan/methodology state with stale sibling copies"

  pull_merge_cadence:
    before_start: true
    before_long_verification: true
    before_checkpoint_push: true
    during_long_work: "at each meaningful checkpoint or before touching shared files"
    integration_strategy: >
      Two distinct cases, do not conflate them.
      (1) SAME-branch catch-up (your own UN-PUSHED local commits vs
      origin/<same-branch> on a non-ff push): rebase your local commits onto
      origin/<same-branch>, then run the Integration Verification Gate
      (advance-work-from-plan §6) before push. This rewrites only un-published
      hashes, so it cannot duplicate anything on the trunk.
      (2) CROSS-branch integration (sibling->trunk e.g. windows-next->linux-next,
      and main->branch): MERGE-ONLY (`git merge` / `gh pr merge --merge`). Merges
      PRESERVE commit hashes, so git dedupes already-present commits via ancestry.
      NEVER rebase or cherry-pick PUBLISHED commits across branches: that mints a
      SECOND hash for the same change, and a later merge then applies BOTH copies —
      this is precisely the cb9def48->6dbca259 duplication that broke the trunk.
      (Earlier guidance said "rebase, not merge, for cross-branch"; that was
      backwards and self-defeating — corrected 2026-06-30, see
      plan/issues/methodology-integration-strategy-contradiction-2026-06-30.md.)
    conflict_policy:
      - "Spec, methodology, and plan conflicts block until explicitly reconciled."
      - "Platform crate conflicts stay on the owning platform branch unless a shared API contract changed."
      - "Never resolve conflicts by deleting another host's plan notes; tombstone, supersede, or merge by stable ID."
    pre_push_gate:
      rule: >
        NON-linux-next branches (windows-next, osx-next, any shared non-trunk
        branch) MUST `git fetch` and `git merge origin/linux-next` (merge-only,
        integration_strategy case 2) and resolve all conflicts LOCALLY before
        EVERY push to their remote branch. Pushing un-integrated platform work
        exports the conflict to the linux-next coordinator, who then has to
        resolve platform-side conflicts on the trunk — the wrong side, with the
        least context. Operator directive 2026-07-02: this is the normal
        workflow — platform hosts absorb the merge cost so remote linux workers
        can merge platform branches back into linux-next cleanly.
      applies_to: ["windows-next", "osx-next", "any non-linux-next shared branch EXCEPT agent/* and salvage/* refs"]
      lane_exclusion: >
        agent/* and salvage/* refs are excluded (branch_namespaces
        pre_push_gate_amendment, 2026-07-28): a mid-cycle lane checkpoint
        must not require a trunk merge — durability beats integration
        freshness for work-in-progress refs. The gate's INTENT is preserved
        at the boundary instead: the lane green-exit procedure and ledger
        checkpoints MUST merge origin/linux-next first when the lane's
        <base> is not linux-next. That procedure is NOT YET BUILT — its
        sole sanctioned command, scripts/lane-exit.sh, is ordered by the
        order-502 packet forge-lane-branch-seeding-optin, which is pending
        deliberately behind the authenticated write transport
        (security-rescope 2026-08-06); until it lands no agent/* or
        salvage/* refs are seeded, so this exclusion is vacuously
        satisfied. (Rewritten per philosophy.yaml
        obsolete_mechanism_live_intent by 851-28b5: the prior text cited
        lane-exit.sh in the present tense though it exists nowhere in the
        tree or its history — the intent is live, the mechanism is
        future.)
      race_exception: >
        If the coordinator is actively merging your already-pushed head (your
        commits are in flight toward linux-next), do NOT race them with a second
        divergent push: wait for their merge to land on origin/linux-next, merge
        THAT into your branch, validate (packets/code survived, tests green),
        then push. First applied 2026-07-02 (windows merge validation of
        6feac841).
      version_divergence_hazard: >
        A divergent VERSION on the integration branch (linux-next) blocks EVERY
        downstream platform-branch push, because the mandated linux-next merge
        (above) imports that VERSION and the pre-push VERSION guard then refuses
        the platform push (702-eusw, 2026-08-13: dd8fd63f swept a build-number
        bump into an unrelated security fix; osx-next and windows-next could not
        push at all). RULE: a VERSION bump belongs on MAIN first (a
        release/version-bump-* PR, per PR #94/#95), never as a side effect of a
        work commit on linux-next. Two guards enforce this: the pre-push VERSION
        guard treats a platform VERSION == origin/linux-next as a legitimate
        integration-branch CATCH-UP (643-64bx), and
        scripts/check-version-bump-isolation.sh (wired into ./build.sh --check,
        702-eusw criterion 3) refuses any non-merge commit that changes VERSION
        alongside non-companion files, so a bump cannot be swept in by git add -A.

  plan_ledger:
    canonical_files:
      - plan.yaml
      - plan/index.yaml
      - plan/steps
      - plan/issues
    scratch_root: plan/localwork
    rules:
      - "Long-running module builds get durable step or issue files before implementation begins."
      - "Agents update the same stable graph node rather than creating host-specific duplicates unless scopes are independent."
      - "Repeated plan updates are semantic upserts keyed by stable IDs."
      - "Each checkpoint records sibling heads observed and whether they were merged, skipped, or blocked."
      - "A failed or restarted agent can reclaim a stale lease only after re-reading plan.yaml, plan/index.yaml, and the governing issue/step."

  markdown_distillation:
    rule: >
      Ad hoc Markdown is intake only. Durable knowledge belongs in methodology,
      OpenSpec specs, provenance-backed cheatsheets, or plan issues/steps.
      Tool-local `CLAUDE.md` files may contain only pointers and local command
      affordances; they must not be a hidden architecture or process source of
      truth.
    intake_paths:
      - CLAUDE.md
      - .claude/*.md
      - top-level *.md reports
    closure_steps:
      - "Distill requirements into openspec/specs."
      - "Distill process rules into methodology."
      - "Distill operational facts into cheatsheets with provenance."
      - "Distill long-running work state into plan/steps or plan/issues."
      - "Replace the source Markdown with a tombstone pointer when retained for compatibility."

  distributed_work:
    rule: >
      The CRDT-inspired primitives for cross-host, cross-agent,
      cross-session work — stable IDs, append-only events, lease+TTL,
      idempotent operations — are defined in
      `methodology/distributed-work.yaml`. That file is the authority for
      the work-item schema, host-component ownership matrix, and the
      agent self-assignment protocol. This section is its index.
    references:
      - methodology/distributed-work.yaml
      - plan/issues/branch-and-coordination-canon-2026-05-25.md
    cheatsheet_index:
      - cheatsheets/concurrent-git/branches.md
      - cheatsheets/concurrent-git/agent-handoff.md
      - cheatsheets/concurrent-git/plan-discipline.md

  plan_write_discipline:
    rule: >
      All `plan/`, `methodology/`, `openspec/`, and `cheatsheets/` files consider
      `linux-next` their canonical home. However, agents working on platform
      branches (`windows-next`, `osx-next`) commit and push all edits (including
      plan fragments in `plan/index.d/` and loop_status fragments in `plan/loop_status.d/`)
      directly to their active platform branch. The Linux coordinator merges sibling-branch
      work into `linux-next` during the coordination pass.
    rationale: >
      Append-only fragments (`plan/index.d/`, `plan/loop_status.d/`) eliminate
      merge conflicts on ledger state across hosts. Sibling branches stay focused
      and committable on their active platform branch without branch context switching.
    procedure:
      - "git fetch origin && git checkout <active-branch> && git pull --ff-only"
      - "Append plan edits as fragments in `plan/index.d/` (via `tillandsias-plan append-event` or new fragment files) and status edits via `tillandsias-plan loop-status-append`."
      - "git add ONLY the intended files (never `git add -A` from a dirty tree)."
      - "git commit with `chore(plan): <subject>` or `docs(plan): <subject>`."
      - "git push origin <active-branch>. On rejection: `git fetch && git rebase origin/<active-branch> && ./build.sh --check` and retry up to 3 times."
      - "Do not exit a skill successfully with local-only commits or uncommitted tracked changes."
      - "Incomplete but coherent work must be checkpoint-committed, pushed, and recorded in the owning plan item."
      - "Prefer separate `git worktree` directories for concurrent platform branches instead of switching branches with dirty state."

  product_topology_invariant:
    rule: >
      The target runtime is an ephemeral portable cloud region with a frozen
      control plane: top host terminal -> platform tray/launcher -> Fedora 44
      guest -> Podman service stack -> deepest forge container running the
      selected agent harness. Requirements that do not preserve this topology
      must be tombstoned or rewritten before implementation.
    verification_boundary: >
      A packet is not product-complete until it states which hop it proves
      (host, guest, Podman service stack, or deepest forge) and records evidence
      that credentials, version identity, and transport mode did not silently
      cross an unintended boundary.

  idiomatic_layers_for_agents:
    decided_by: "The Tlatoāni, 2026-07-10 attended session (plan order 271)"
    rule: >
      The Tillandsias idiomatic layers (tray/launcher surfaces, the control
      wire, --diagnose, ExecOneShot, PTY attach with the TILLANDSIAS_PTY_DEBUG
      tee, and the litmus/e2e skills' launch shapes) are the ONLY sanctioned
      guest access for agents — for DEVELOPMENT work (forensics, rebuilds,
      probes, log reading) exactly as for user runtime. Making the layers good
      enough for development is what makes them good enough for users. The
      host and guest do not share a trusted network; the guest is fully
      isolated and root is never required.
    when_the_layer_cannot_do_it: >
      A debugging or development task that cannot be performed through the
      sanctioned surfaces is a PRODUCT GAP, not a license to side-step: file
      and promote a packet extending the idiomatic layer (precedents: the
      TILLANDSIAS_PTY_DEBUG tee, orders 268/272), then do the task through
      the extended layer. Side channels — ssh into the guest, cloud-init
      debug keys, host-mounted guest disks, root exec in guest or forge —
      are findings to file, never tools to use. The prompting incident: a
      macOS agent ssh'd into the guest as root via a cloud-init debug key to
      read journals and sneak a manual image rebuild (backdoor closed by
      order 272); the correct move was extending the diagnose/attach
      surface.
    audit_rule: >
      Any `ssh` to a guest address, any root shell in guest or forge, and any
      credential/key material enabling either is a finding in coordinator
      audits and code review — capture it per the reduction engine and check
      the sanctioned-surface litmus (litmus:idiomatic-layers-doctrine-shape)
      still pins this block and its skill cross-references.

  branch_canon:
    rule: >
      Branch names are CANONICAL — `osx-next`, not `macos-next`. The
      branch predates the Apple branding shift from OS X → macOS and is
      grandfathered for stability.
    canonical:
      linux: linux-next
      windows: windows-next
      macos: osx-next
      release: main
    common_mistakes:
      - "Saying `macos-next` — wrong. Always `osx-next`."
      - "Pushing platform code to `linux-next` directly — should route through the platform branch unless the file is shared (plan/, methodology/, openspec/, cheatsheets/)."

  forge_base_determinism:
    rule: >
      A forge's base branch is seeded from the HOST CHECKOUT's current branch
      (read_host_project_current_branch -> TILLANDSIAS_FORGE_SEED_BRANCH), and
      the guest converges onto it. Therefore whatever branch a checkout is
      parked on becomes the base of every forge launched from it. Any workflow
      that moves the checkout MUST return it, and any workflow that launches a
      forge MUST verify the base can build what the forge will claim to
      provide. This is enforced by scripts/check-forge-expert-base.sh, not by
      an agent noticing.
    enforced_by: scripts/check-forge-expert-base.sh
    grammar: "^(ok:(expert-base-ready|no-plan-crate)|blocked:(expert-sources-absent|not-a-git-repo))$"
    why_source_presence_not_branch_name: >
      The check tests for the expert engine SOURCES, never for a branch name.
      Branch names here are Tillandsias's own convention and are explicitly not
      a runtime convention of the product (see `scope` above), so a forge on an
      end user's project must not assume them. Source presence is a fact about
      the checkout and is safe to assert anywhere. It also catches the failure a
      branch-name test cannot: when the seed and the actual branch AGREE because
      the host checkout was itself parked on a pre-expert base, nothing looks
      wrong while the expert build silently produces a pre-expert binary.
    failure_signature: >
      `experts: ready` reported truthfully in the forge startup context while
      every plan_answer / methodology_path returns confidence=unsupported. The
      state is not lying — the artifact is wrong. Reading `unsupported` as "the
      plan has no answer" is the wrong inference and the one this rule exists to
      prevent.
    falsification_signal: >
      A forge launched from a checkout whose `crates/tillandsias-plan/src/
      answer.rs` is absent, and no guard, startup-context verdict, or gate
      reported it before an agent asked a question and got a refusal.
      Historically: order 531, plus two earlier cycles that absorbed it by
      noticing and hand-rebasing (plan/loop_status.md:203, :243).
    review_cadence: on_forge_launch_path_change

  common_pitfalls:
    rule: >
      Learned by the integration loop between 2026-05-24 and 2026-05-25.
      Reading this section before starting a multi-host work session saves
      you from re-experiencing them.
    items:
      - id: dirty-tree-blocks-integration
        symptom: >
          The integration loop skips with "dirty-tree-skipped"; sibling
          backlog grows silently.
        cause: >
          Linux-host had uncommitted edits to methodology/openspec/plan
          (intake docs in flight); STEP 1 of the loop refuses to merge
          onto an uncommitted base.
        mitigation: >
          Commit (or stash) before stepping away. The loop's STEP 1 now
          notes a dirty-tree skip in the ledger; treat 2 consecutive
          dirty-tree skips as a soft escalation.
      - id: claim-collision-on-parallel-amendment
        symptom: >
          Two hosts independently draft the same amendment (e.g. macOS D6
          and Windows D8 of `vm-recipe-provisioning`), and the later
          author has to drop redundant work.
        cause: >
          Neither agent checked the integration branch for a competing
          claim before drafting.
        mitigation: >
          Before starting work on a cross-cutting amendment, look for
          recent commits and open claims on the same scope. Add a CLAIM
          block to the relevant `plan/issues/` file FIRST, push, then
          start drafting. If the claim push reveals a competing claim,
          coordinate before continuing.
      - id: silent-drop-on-unhandled-control-variant
        symptom: >
          Tray sends a control-wire message and never gets a reply; hangs.
        cause: >
          The dispatcher on the receiving transport (unix-socket OR vsock)
          had no arm for that variant and fell through to a silent
          `_ => {}`.
        mitigation: >
          As of commit `a9adf59f`, both dispatchers reply with
          `Error { code: Unsupported }`. New variants must be added to
          the shared dispatcher (see Slice 2 in
          plan/issues/control-socket-protocol-convergence-2026-05-25.md);
          DO NOT fork local handlers.
      - id: macos-direct-commit-to-linux-next
        symptom: >
          `origin/osx-next` is frozen while macOS-authored commits land
          directly on `linux-next`.
        cause: >
          macOS host bypassed its platform branch.
        decision: >
          Ratified for `plan/` writes (canonical per branch-canon issue
          §4). For CODE work, still SHOULD route through `osx-next` so
          the integration loop can run isolation checks. Advisory only;
          the loop notes drift in its ledger.
      - id: gitignore-drift-across-hosts
        symptom: >
          A file like `.claude/scheduled_tasks.lock` is session-state on
          host A, untracked on host B (which adds it to `.gitignore`),
          but the gitignore change only lands on a sibling branch.
        cause: >
          Session-local artifacts vary by harness; one host added the
          ignore on its branch but the other hosts didn't.
        mitigation: >
          When a host adds an entry to `.gitignore` covering a
          cross-platform session artifact, file a plan/ note so the
          integration loop's ledger surfaces the methodology-level
          implication.

  waves_of_local_agents:
    rule: >
      To minimize coordination overhead and sustain development velocity,
      agents claiming work SHOULD utilize local "waves" (parallel or sequential
      local sub-tasks or sub-agents) to implement larger chunks of work rather than executing
      micro-steps and immediately yielding for verification.
    remote_deliverables: >
      Remote hosts must have clear, actionable deliverable definitions in
      `plan/` and use the defined communication protocols (agent_status_packet)
      to report the completion of entire waves, avoiding unnecessary stalls
      while waiting for central unblocking.

  toolbox_first_scripts:
    trace: "operator directive 2026-08-16 (The Tlatoāni): 'use toolboxes for everything; scripts should be idempotent and toolbox friendly' — order 777-amku"
    rule: >
      Every repo script is idempotent and toolbox-friendly BY DEFAULT: a
      script that may need tools the host lacks carries a shebang-adjacent
      `source "$(dirname "${BASH_SOURCE[0]}")/ensure_toolbox.sh"` include.
      The include's contract: if the build toolbox does not exist, create and
      initialize it; otherwise noop. Never require a host daemon or host
      package install (the nix-daemon lesson, 2026-08-16) when a toolbox can
      carry the tool.
    why: >
      A host-tool dependency is a SNOWFLAKE: it makes a script's behaviour a
      function of which machine ran it, so the same script is green on the
      host that was hand-prepared and red everywhere else — and the red is
      indistinguishable from a real regression. Worse, the standard remedy
      ("enable the nix-daemon", "dnf install ruby on the host") converts a
      one-line script defect into a permanent, undocumented, un-reviewable
      change to a machine, which no later agent can discover, reproduce, or
      undo. A toolbox carries the tool INSIDE the repo's control: it is
      created from a recipe, it is disposable, and a host that lacks it is
      one command away from having it. The directive's word "idempotent" is
      what makes that affordable — an ensure that costs a probe on the
      99 runs after the first is cheap enough to sit at the top of every
      script, and a pattern that is only cheap sometimes is a pattern
      nobody adopts.
    what_it_is_not: >
      It is NOT "run everything inside a toolbox". The include ENSURES the
      toolbox and returns; it does not re-exec the caller and does not
      change how the caller finds its tools, so a host that already carries
      the tool natively behaves exactly as before — zero behaviour change is
      the point, not a fallback. It is NOT a ban on host tools: the
      dispatch pattern PREFERS the host binary and reaches for the toolbox
      only when the host has none. It is NOT a requirement that every
      script carry the include — a script whose entire tool set is the
      POSIX baseline (bash/grep/sed/awk/find/git) has nothing to ensure,
      and adding the include there buys a subprocess and no property. And
      it is NOT licence to make a missing tool silent: a script that needs
      a tool the host lacks AND the toolbox cannot carry must still fail
      loudly (fail_loud_diagnosis), never degrade quietly.
    boundary: >
      The include's job ENDS at "the toolbox exists and is initialized". Two
      things sit deliberately outside it. (1) RE-EXEC: putting the caller's
      own process inside the toolbox stays in
      scripts/with-tillandsias-builder.sh and is reserved for build entry
      points (build.sh, local-ci.sh) — a check script that re-execs itself
      pays a container round-trip per invocation and loses the host's
      environment. (2) FAILURE POLICY: where no `toolbox` binary exists the
      include is a silent noop by design, but where a toolbox ensure is
      ATTEMPTED and fails, the include returns non-zero and says so — the
      silence covers "this host is not a toolbox host", never "the ensure
      broke".
    include_contract: >
      scripts/ensure_toolbox.sh — (1) after it returns 0,
      `toolbox run --container tillandsias-builder …` works on
      toolbox-capable hosts; (2) on hosts without `toolbox` it is a silent,
      instant noop — zero bytes on stdout and stderr, exit 0; (3) create+init
      happens at most once: the delegate gates creation on a `toolbox list`
      probe and initialization on a TOOL-PRESENCE probe inside the container
      (`command -v gcc && … && rustup target list`), so a second run issues
      no `toolbox create` and no `dnf install`. The gate is the PROBE, not
      $HOME/.cache/tillandsias/builder-toolbox-initialized — that file is
      written and never read, and describing it as the gate is wrong in the
      dangerous direction: the probe correctly re-initializes a
      half-built toolbox that a marker would have certified as done.
      (4) It never re-execs the caller and never rewrites the caller's shell
      options; (5) it DELEGATES to scripts/with-tillandsias-builder.sh direct
      mode (`… true`) so the ensure logic has exactly one implementation with
      two entry shapes — the ensure-only include, and the re-exec wrapper for
      build entry points. Pinned by litmus:ensure-toolbox-include-shape,
      which asserts these as BEHAVIOURS against a hermetic fake `toolbox`
      and carries a paired mutant for each (order 634-39ik).
    tool_dispatch_pattern: >
      Host tool preferred when present, toolbox as the fallback — zero
      behavior change on hosts that carry the tool natively:
      `command -v <tool> >/dev/null && <tool> … || toolbox run --container
      tillandsias-builder <tool> …`. Blockers phrased as "host needs
      daemon/package X" are mis-shaped; re-file them as "script Y is not
      toolbox-friendly yet".
  fedora_silverblue_immutable_builders:
    trace: "operator directive 2026-07-16 (The Tlatoāni, 'Toolboxes baby!!'): immutable != restricted"
    immutable_is_actually_flexible: >
      "Immutable" here describes ONLY the host's read-only /usr (rpm-ostree)
      layer — it is NOT a restriction on available tooling and is NOT a reason
      to declare a missing tool a blocker. Standing pre-authorization: any
      agent MAY (and SHOULD) run `sudo dnf install` — and `dnf copr enable`,
      etc. — for ANY package it needs inside ANY toolbox (`tools`,
      `tillandsias-builder`, or a fresh `toolbox create`) WITHOUT asking the
      operator. The sanctioned validators and build deps (ruby for the
      `ruby -ryaml` YAML fallback, shellcheck, gcc/cmake/make, cross
      toolchains, …) are all one toolbox `dnf install` away. Net effect: an
      immutable Linux host is effectively MORE flexible than a mutable one —
      it gets a clean, disposable, per-need build/validate sandbox without
      ever mutating /usr. Do not surface "tool X absent on the bare host" as a
      gap; install it in a toolbox and proceed.
    idempotency_expectation: >
      We like toolboxes AND idempotency. Prefer ENSURING over assuming:
      builder / CI / validation entry points should idempotently install their
      required packages inside the toolbox (see
      scripts/with-tillandsias-builder.sh) so tools are guaranteed present on
      every run, not merely on first init. When adding a tool to a builder's
      ensured set, make the ensure re-run for already-created toolboxes —
      gating the whole install on a single sentinel (e.g. `rustup` presence)
      means existing toolboxes silently miss the newly-added tool. An ensure
      that only fires on a pristine toolbox is not idempotent over a changing
      tool list.
    rule: >
      On Fedora Silverblue (and other immutable Linux hosts), native cross-compilation
      to target guest architectures (like aarch64 musl) requires standard C library headers
      that are missing from the host's minimal bare-metal toolchains. To build without
      rebooting or polluting the host's immutable /usr layer, all compilation MUST be
      standardized inside a local Toolbx container (e.g. tillandsias-builder).
    setup_and_execution:
      - "Create the Toolbx container: toolbox create -y tillandsias-builder"
      - "Enable the cross-compiler COPR repo inside Toolbx: toolbox run --container tillandsias-builder sudo dnf copr enable -y lantw44/aarch64-linux-gnu-toolchain"
      - "Install compilation tools inside Toolbx: toolbox run --container tillandsias-builder sudo dnf install -y gcc aarch64-linux-gnu-gcc aarch64-linux-gnu-glibc"
      - "Build targets via Toolbx wrapper: toolbox run --container tillandsias-builder env CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS='-C link-self-contained=yes' cargo build --release --target aarch64-unknown-linux-musl --features listen-vsock"
    rootless_dns_recommendation: >
      Since rootless users cannot write to /etc/hosts, the launcher automatically falls
      back to published port loopback routing (https://127.0.0.1:<port>) on host runs. All
      enclave containers and toolboxes must configure working public resolvers (like 1.1.1.1) in
      ~/.config/containers/containers.conf to bypass broken system-resolved defaults.

  wsl2_hybrid_work:
    trace: "plan/index.yaml wsl2-transparent-build-wrappers; operator directive 2026-07-15"
    rule: >
      Windows hosts carry a DEDICATED `tillandsias-build` WSL2 distro (the
      toolbox sibling; never the runtime `tillandsias` distro, which
      destructive e2e unregisters). `scripts/with-wsl2-builder.sh` re-execs
      build entry points into it transparently, so a Windows worker can run
      the REAL canonical gates and advance Linux-shaped work. Whether to do
      a QUICK LOCAL WSL2 unblock or FILE a plan packet for a Linux-native
      host is a cost boundary, measured 2026-07-15 on a stock Windows 11
      host (order 238 hybrid experiment).
    measured_costs:
      one_time_bootstrap: "~5 min (rootfs import 15s + dnf toolchain ~3min + rustup ~2min); persists across e2e runs"
      per_invocation_overhead: "~1-2s (re-exec + stdin marker probe)"
      shell_or_git_fixture_test: "~3s wall (e.g. test-git-mirror-relay-verified-ack.sh, 3 cases)"
      targeted_warm_cargo_test: "~8s wall (38-test crate)"
      full_workspace_check_warm: "~35s (fmt + check + clippy strict x2); first cold run ~10 min"
    do_locally_via_wsl2:
      - "the canonical gate itself: ./build.sh --check before EVERY push (now mandatory-cheap on Windows; a cargo-only substitute already let one broken merge through, 2026-07-15)"
      - "linux-universe compile/clippy/test verification of any crate (targeted `with-wsl2-builder.sh cargo test -p <crate>`)"
      - "shell/git-shaped scripts and fixture tests (scripts/test-*.sh, litmus command steps, hook/relay fixtures)"
      - "ruby YAML validation + shellcheck (the sanctioned validators, absent from stock Windows)"
      - "unblock-with-NOOP class repairs in sibling scope (cfg gates, dead-code allows) — verify with the wrapped gate, mark PLEASE REVIEW: <sibling>"
      - "research packets whose probes are plain git/bash mechanics (order 238 precedent)"
    file_a_linux_packet_instead:
      - "anything needing podman/containers, the enclave network, systemd services, or live Vault — the build distro deliberately ships none of these; the runtime distro is not a dev substrate"
      - "destructive or long-lived runtime verification (e2e gates, lane launches, curl-install smokes) — these belong to the host-native gates"
      - "work whose exit criteria demand linux-HOST evidence (device integration, immutable-host paths, toolbox behavior)"
      - "multi-hour linux implementation slices when a Linux worker is active — the wrapper makes you CAPABLE, not the cheapest owner; check plan/loop_status.md lane assignments first"
    decision_heuristic: >
      If the verification a change needs is 'compile, unit/fixture tests, or
      script runs against the repo tree', do it locally through the wrapper
      and cite the wrapped-gate evidence in the plan event. If it needs a
      container runtime, a live enclave, host-native hardware/OS surfaces,
      or an attended operator, file (or leave) the packet for a Linux-native
      host and say exactly which evidence is missing. When in doubt: run the
      wrapped gate locally (35s) AND leave the packet's live criteria to the
      owning host — partial local evidence plus an honest residual note
      beats both silence and false completion.
