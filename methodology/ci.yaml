
rust_annotations:
  description: >
    Rust proc macros that enforce traceability and observability in code.
    These are not optional—they are the language layer of the convergence system.

  trace:
    syntax: |
      #[trace(
        spec = "...",
        cheatsheets = ["..."],
        verified_at = "L0|L1|L2|L3",
        knowledge_pressure = "low|medium|high",
        binding = "optional-language"
      )]

    semantics:
      - declares epistemic sufficiency claim
      - binds code to spec and cheatsheets
      - claims evidence level L0–L3

    macro_enforcement:
      - spec_exists_and_active
      - cheatsheets_exist
      - binding_required_if_ambiguous

    example: |
      #[trace(
        spec = "github-credential-health",
        cheatsheets = ["utils/github-oauth.md"],
        verified_at = "L2",
        knowledge_pressure = "high"
      )]
      async fn retrieve_github_token() -> Result<Token> { ... }

  grounded_by:
    syntax: |
      #[grounded_by(
        rust = "...",
        js = "..."
      )]

    semantics:
      - explicit multi-api disambiguation
      - used when same function has different implementations across languages

    example: |
      #[grounded_by(
        rust = "std::fs::read_to_string",
        js = "fs.promises.readFile"
      )]

  obsolete:
    syntax: |
      #[obsolete(
        spec = "...",
        replaced_by = "...",
        sunset = "YYYY-MM-DD"
      )]

    enforcement:
      - spec_status_must_be_deprecated_or_obsolete
      - replacement_must_exist
      - fail_ci_if_past_sunset

    example: |
      #[obsolete(
        spec = "legacy-auth-v1",
        replaced_by = "github-credential-health",
        sunset = "2026-12-31"
      )]

  tombstone:
    syntax: |
      #[tombstone(
        spec = "...",
        reason = "...",
        replaced_by = "..."
      )]

    semantics:
      - preserves historical intent without dead code
      - same as code comments @tombstone but enforced by macro

    example: |
      #[tombstone(
        spec = "set_stage_projection",
        reason = "Removed in favor of direct container lifecycle",
        replaced_by = "tray-minimal-ux"
      )]
      // fn set_stage(&self, stage: Stage) { ... }

  constraints:
    - public_contract_boundary_requires_trace:
        reason: >
          Public contract boundaries, external I/O, persistence, security-sensitive
          behavior, and spec-critical functions must reference a spec. Low-risk helper
          functions may inherit a parent module trace when they expose no independent
          contract.
    - no_implicit_semantic_resolution:
        reason: "Ambiguous function purposes must use #[grounded_by]"

ci_validator:
  description: >
    The CI validator is the enforcement mechanism. It runs on every commit and
    gates CI, PR merges, and spec archives.

  responsibilities:
    - validate_all_annotations: "Check syntax, spec existence, cheatsheet presence"
    - ensure_contract_boundaries_have_trace: "No public contract boundary without #[trace] or explicit inherited trace"
    - detect_orphan_specs: "Specs with no code annotations"
    - enforce_obsolete_lifecycle: "Expired #[obsolete] annotations → hard error"
    - validate_spec_graph: "No cycles in spec replacement chain"
    - compare_declared_vs_observed_verification: "Claimed L-level vs actual evidence"
    - trigger_revalidation_on_cheatsheet_change: "If cheatsheet updated, re-run litmus"
    - enforce_litmus_tests: "MUST requirements have passing tests"

  failure_conditions:
    - missing_spec: "Function cites non-existent spec"
    - invalid_binding: "Spec is deprecated or spec_id format is wrong"
    - verification_mismatch: "Code claims L3 evidence but only provides L1"
    - expired_obsolete_code: "Obsolete code past its sunset date still in tree"
    - litmus_failure: "Litmus test binding fails"

  modes:
    - warn_only_initially:
        description: >
          During early phases, CI warnings are advisory. Teams can override.
          Allows gradual rollout without forcing all code to be perfect immediately.

    - strict_enforcement_after_stabilization:
        description: >
          Once the system stabilizes (all critical specs have litmus tests),
          switch to strict mode. CI failures block all PRs.

runtime_tracing:
  description: >
    At runtime, the system emits traces that link observed behavior to specs
    and cheatsheets. These traces are the evidence that convergence is occurring.

  output_format:
    fn: string
    spec: string
    cheatsheet_hits: list
    misses: list
    verification_level: string

  example:
    fn: "retrieve_github_token"
    spec: "github-credential-health"
    cheatsheet_hits:
      - "utils/github-oauth.md#token-storage"
      - "utils/secret-rotation.md#ephemeral-lifetime"
    cheatsheet_misses:
      - "utils/github-tokens.md#legacy-pat (expected but not found)"
    verification_level: "L2"

  purpose:
    - provide evidence for ci validation
    - feed metrics system (cheatsheet hit/miss rates)
    - enable root cause analysis (which cheatsheet caused a failure?)

trace_binding:
  requirements:
    - every_spec_must_emit_trace:
        description: >
          Every active spec must have @trace annotations in code.
          If a spec has no traces, it's unmapped and unvalidated.

    - traces_must_include_spec_id:
        description: >
          Traces must cite the spec ID, not just "spec: true".
          This enables bidirectional lookup: code→spec, spec→code.

    - traces_must_be_observable_in_runtime:
        description: >
          Traces must emit at runtime (logs, metrics, spans) not just compile-time.
          Observability is the evidence that the code is actually executing the spec.

ci_enforcement:
  description: >
    CI checks that run automatically and gate progression.

  checks:
    - validate_schema: "Are spec files well-formed YAML/markdown?"
    - validate_modality_usage: "Do specs use MUST/SHOULD/MAY correctly?"
    - validate_litmus_binding: "Is every MUST requirement tested?"
    - validate_trace_binding: "Does every spec have code traces?"
    - validate_ambiguity_zero: "Is ambiguity_score == 0?"
    - validate_invariant_coverage: "Is every invariant tested?"
    - validate_drift_rules: "Do spec changes follow drift_control rules?"

  failure_conditions:
    - missing_litmus: "MUST requirement without litmus test"
    - missing_trace: "Spec with zero @trace annotations"
    - ambiguity_detected: "Ambiguity score > 0"
    - invariant_removed: "A previously verified invariant was deleted"
    - unverifiable_requirement: "MUST requirement with no measurable condition"

  enforcement_modes:
    - S0_S1_specs: "Warn if no litmus (specs are early)"
    - S2_specs: "Require litmus tests; warn if incomplete"
    - S3_specs: "Block PR if litmus fails"

  triggers:
    on_every_commit: "Syntax validation, schema checks"
    on_every_pr: "Litmus test execution, drift detection"
    on_spec_archive: "Complete convergence audit before archiving"
    on_code_change_touching_spec: "Re-validate spec-code drift"

workflow_integration:
  ci_blocks_pr_when:
    - schema_invalid: "Spec file has invalid YAML"
    - litmus_fail: "Test binding for MUST requirement fails"
    - drift_detected: "Spec change violates drift_control rules"
    - ambiguity_increased: "Ambiguity score rose"

  ci_warns_on:
    - obsolete_past_sunset: "Code should be deleted (warning phase)"
    - orphan_spec: "Spec exists but has no code traces (not yet critical)"
    - missing_cheatsheet: "Spec has no cheatsheet binding (S0/S1 allowed)"

  ci_escalates_to_human_on:
    - persistent_litmus_failure: "Test was passing, now fails (potential regression)"
    - flakiness_detected: "Same test produces different results"
    - mutation_testing_failure: "Litmus test doesn't actually touch the code"

execution_contract:
  description: >
    CI commands are chaining primitives. They should be scoped, fail-fast when
    asked, and emit the smallest actionable boundary necessary for the next
    automation step.

  phase_chain:
    ci: "pre-build gate only"
    ci_full: "pre-build gate -> post-build smoke -> runtime residual litmus"
    install_with_ci_full: "same chain as ci_full, then install"
    scope_carryover: "A spec ladder or filter applies to every litmus phase in the chain."
    canonical_litmus_chain: >
      1) smallest focused litmus
      2) sibling litmus set
      3) `./build.sh --ci --strict --filter <spec-id(s)>`
      4) `./build.sh --ci-full --install --strict --filter <spec-id(s)>`
      5) `tillandsias --init --debug`

  scoped_execution:
    spec_shorthand: >
      `--spec=spec-id` is the caller-facing shorthand for a scoped ladder. It
      fills `--filter` and `--strict` with the same spec ID when those flags are
      not already provided explicitly, so agents can say "fix SPEC-X" and let
      the chain derive the minimal-to-full verification ladder automatically.
    filter_flag: >
      `--filter=spec-a:spec-b` limits litmus execution to the named spec IDs.
    strict_flag: >
      `--strict=spec-a:spec-b` fails fast on the named spec IDs; if no explicit
      filter is provided, the strict list becomes the active filter set.
    compact_output: >
      Compact mode suppresses successful litmus chatter while preserving FAIL
      lines, spec IDs, test IDs, trace markers, and summary counts.
    stop_on_failure: >
      Scoped runs SHOULD stop at the first relevant failure boundary instead of
      continuing to unrelated specs or later phases.
    chain_reference: >
      Each updated or newly added spec SHOULD include a `## Litmus Chain`
      subsection that names the shortest actionable boundary, the sibling tests,
      and the canonical `--filter` / `--strict` command pair for that spec set.

  exit_code_contract:
    0: "all requested checks passed"
    1: "semantic failure in a requested check"
    2: "invalid arguments or missing precondition"
    20: "strict-scoped litmus failure"
    21: "strict-scoped litmus missing boundary or test file"

  log_contract:
    failure_line: "spec=<spec-id> test=<test-id> reason=<smallest actionable cause>"
    trace_line: "@trace spec:<spec-id>"
    summary_line: "state the failing phase, the failing spec set, and the exit code"

# ── Cloud minutes are a hard budget (The Tlatoāni, 2026-08-02) ───────────────
#
# OPERATOR DIRECTIVE, issued after burning ~10% of a MONTHLY GitHub Actions
# quota in a single day: "ONLY the actual release needs to run in the cloud,
# since it uses github secrets for signing some binaries, everything else runs
# locally."
github_actions_budget:
  decided_by: "The Tlatoāni, 2026-08-02"
  rule: >
    GitHub Actions runs EXACTLY ONE workflow: the release. Nothing else may
    consume cloud minutes — no push CI, no PR CI, no scheduled jobs, no cache
    warming, no webhooks. Every other gate runs locally.
  why_the_release_is_the_only_exception: >
    The release workflow signs binaries with GitHub-held secrets. That signing
    material exists only in the cloud, so the job cannot run anywhere else. No
    other job has that property, and "it is convenient in CI" is not that
    property.
  what_was_removed_and_why:
    ci_yml: >
      Fired on EVERY push to linux-next/windows-next/osx-next and on every PR to
      main. A working day of agent pushes is dozens of runs — roughly 10% of a
      monthly quota in one day. Its own header said it was "intentionally cheap",
      which was true per run and irrelevant in aggregate: the defect was the
      TRIGGER, not the job.
    nix_cache_warm_yml: >
      A weekly scheduled job whose entire purpose was keeping a cache warm.
      Spending metered cloud minutes to make other cloud minutes faster is
      circular when nothing else is allowed to run in the cloud.
  trigger_rules:
    - "release.yml stays workflow_dispatch ONLY — never push, never pull_request, never schedule."
    - "No workflow may add push, pull_request, schedule, or repository_dispatch triggers."
    - "No repository webhooks."
  what_we_gave_up_and_where_it_moved: >
    ci.yml existed for a real reason recorded in its header: an agent once pushed
    UNPARSEABLE Rust to linux-next and the release PR watched an empty check set
    (plan/issues/agent-pushed-unparseable-code-no-push-ci-2026-07-21.md). Nothing
    server-side validates a push any more, so that protection now rests ENTIRELY
    on local gates run BEFORE pushing: `./build.sh --check` at minimum, and
    `./build.sh --ci-full` before a release. An agent that pushes without running
    the local gate reintroduces exactly that failure — and there is no longer a
    safety net behind it. This is a deliberate trade of a safety net for a
    budget, and it makes the local gate load-bearing rather than advisory.
  agent_obligation: >
    Run the local gate before every push. Do not add a workflow to catch what a
    local gate should have caught. If a check genuinely cannot run locally, that
    is a finding to file, not a reason to spend cloud minutes.
