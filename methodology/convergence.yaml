
convergence_engine:
  objective: |
    Minimize:
      Δ(spec ↔ code)
    + Δ(code ↔ cheatsheet)
    + Δ(cheatsheet ↔ reality)
    + Δ(litmus_binding ↔ spec)

  product_alignment:
    target: >
      An ephemeral portable cloud region with a frozen control plane: host
      terminal/tray launches a same-revision Fedora 44 guest, initializes the
      Podman service stack, and runs agent harnesses only inside the deepest
      forge container.
    uncertainty_reduction_rule: >
      Every plan or methodology edit should reduce uncertainty about one named
      boundary: version identity, transport authentication, credential isolation,
      runtime provenance, or user-visible launch behavior. Historical intake that
      no longer reduces one of those uncertainties should be archived or
      tombstoned.
    forbidden_shortcuts:
      - "release-latest guest fetches when a source-matching embedded guest binary is available"
      - "host credential/config mounts into a forge container"
      - "dual plaintext+secure acceptance in the same boot"
      - "dashboard zeros without source provenance"

  constraints:
    - compilation_success: "Code must compile without errors"
    - spec_compliance: "Code must satisfy all MUST requirements from its specs"
    - bounded_context_size: "Cached knowledge must remain finite"
    - litmus_pass: "All critical-path litmus tests must pass"
    - temporal_stability_verified: "Tests must pass consistently"
    - completeness_mapping_valid: "Every active spec has a litmus test"
    - spec_litmus_versioning_synchronized: "Specs and tests are kept in sync"

  stability_metrics:
    flakiness_rate: "[0, 1] — 0 means all runs identical, 1 means all runs differ"
    stability_window: "time duration over which test results remain consistent"
    convergence_velocity: "rate at which drift_penalty decreases over commits"
    spec_code_alignment_drift: "measured via litmus test results"
    centicolon_residual: "remaining named correctness obligations from methodology/proximity.yaml"

  fitness_function: |
    fitness =
      compile_success
    + spec_coverage
    + litmus_pass_rate
    + temporal_stability_score
    + completeness_mapping_score
    - cheatsheet_violation
    - runtime_error_rate
    - drift_penalty
    - flakiness_penalty

  rules:
    - Convergence is monotonic under normal operation: once achieved, divergence must be detectable
    - Temporary uncertainty increases require the bounded uncertainty exception
    - Unpredicted observations require methodology/event intake before closure
    - Correctness proximity must report residual CentiColons, not only aggregate convergence score
    - Release convergence requires a validated CentiColon projection branch and evidence artifacts
    - Release convergence should publish human and machine CentiColon dashboards for the last N releases
    - When convergence stalls, prioritize the highest worst-case residual CentiColon obligation
    - Mathematical convergence claims are limited by methodology/math-foundations.yaml
    - Selection pressure favors: passing tests, reduced drift, increased stability
    - Anti-pattern: Gaming metrics by hardcoding success
    - Anti-pattern: Ignoring temporal stability (flaky tests mask real bugs)

drift_control:
  description: >
    Drift is any divergence between what the spec says and what the code does.
    The convergence engine continuously detects and rejects drift.

  rules:
    - spec_change_must_reduce_ambiguity:
        reason: "Every spec change must move toward clearer intent, not fuzzier"

    - spec_change_must_not_remove_validated_invariant_without_exception:
        reason: >
          Invariants are stable contracts once verified. If new evidence invalidates
          one, it must be superseded through the bounded uncertainty exception rather
          than silently removed.

    - spec_change_must_increase_or_preserve_verification_level:
        reason: "A spec update should add validation, never weaken it"

    - a_green_gate_MUST_NOT_be_read_as_the_litmus_assertions_having_run:
        reason: >
          ./build.sh --check does NOT execute the litmus tier, deliberately. The
          release tier runs it. So a green gate says nothing about whether the
          litmus specs asserting on the changed files were exercised, and the
          land tool prints exactly that on every push that touches them:
          "NOTICE — N litmus spec(s) assert on the files you are pushing, and
          ./build.sh --check ran NONE of them". Anyone citing a green --check as
          evidence that a change satisfies its litmus assertions MUST instead run
          those specs (scripts/run-litmus-test.sh <spec> --phase pre-build) or
          say plainly that they did not. Measured repeatedly in the
          fail-loud-diagnosis milestone: 63 mentions and 0 executions on two
          hosts, and a 1269-gfdi slice whose own fixture would have first
          executed at release time had a gate step not been added for it.

    - a_gate_step_MUST_carry_a_recorded_second_regime_run_before_it_enters_check:
        reason: >
          A step enters the gate with a second-regime record or not at all. The
          measurement that matters for a step running on every host is not the
          author's host. Measured 2026-09-20: steps 414 (1269-gfdi) and 416
          (1273-4mak) both entered --check green on Linux and reddened BOTH
          macOS gates within hours — 414 demanded a line that cannot print
          where the subject skips its toolbox arms (1300-q7eq), and 416 digested
          with sha256sum under a PATH pinned to /usr/bin:/bin, so it refused a
          genuine artifact on one Mac while passing vacuously on another. The
          record is a STEP_SECOND_REGIME variable in the .step file itself
          ("<host> <YYYY-MM-DD> <darwin|msys> <verdict>"), kept beside the step
          rather than in a sidecar so it cannot drift from its subject, and
          enforced by scripts/check-gate-step-regimes.sh. A step that genuinely
          cannot run off Linux records a NAMED SKIP as its verdict and that
          COUNTS (965-sxec): what is required is an observation from the other
          regime, not a green one. Recording a Linux host in that field does not
          satisfy it, which the checker's third arm asserts.
          AND THE RULE IS STRONGER THAN "THE OTHER REGIME MIGHT DIFFER", which
          is the argument above and is weakest exactly where it matters most.
          macbookair, 2026-09-22, verbatim: the row's usual argument is that the
          second regime MIGHT differ, but on a step guarding a defect that
          exists only where setsid is absent, the second regime is the only one
          that can see the subject at all, so a Linux-only attestation there
          would come from the regime that cannot reproduce the bug. For a step
          whose SUBJECT is a platform-specific absence the second regime is not
          a second opinion; it is the only place the phenomenon exists, and a
          Linux record there is not weak evidence but evidence about a different
          question. THE LIVE INSTANCE, caught by construction rather than by
          anyone remembering: land80 refused with
          violation:gate-step-single-regime:420-1352-vmbc.step, exactly one of
          92 steps — the gate step for the setsid capability probe, authored
          before this checker existed, guarding a defect that cannot occur on
          Linux and about to enter the gate on a Linux attestation.

  detection:
    - compare_previous_and_current_spec: "Diff old and new spec versions"
    - flag_if_uncertainty_increases: "Fail if ambiguity_score rises"

  action:
    - reject_change: "Block spec archive if drift rules violated"

ambiguity_detection:
  rule: >
    If two or more externally distinct behaviors satisfy all requirements and litmus
    tests, and the difference matters to users or downstream contracts, the spec is
    behaviorally ambiguous. Implementation latitude is allowed when observable
    behavior remains equivalent.

  action:
    - block_spec_activation: "Spec cannot move from draft to active if ambiguous"
    - require_additional_invariants: >
        "Add more invariants to the spec until only one implementation remains valid"

  detection_mechanism:
    - Run behaviorally distinct candidates against the same litmus tests
    - If contract-relevant outcomes differ while all tests pass, spec is ambiguous
    - If only internal implementation differs, record permitted latitude
    - Flag behaviorally ambiguous specs and require additional constraints

metrics:
  description: >
    Signals derived from code execution, spec verification, and litmus test results.
    These metrics drive the convergence engine's selection pressure.

  tracked:
    - ambiguity_score: >
        "0 = no known contract-relevant behavioral ambiguity, >0 = observable
        uncertainty remains"
    - litmus_pass_rate: >
        "Percentage of critical-path litmus tests passing"
    - invariant_stability: >
        "Do verified invariants remain invariant across changes?"
    - verification_level: >
        "Distribution of specs across S0–S3 (are specs actively validated?)"
    - centicolon_score: >
        "Earned and residual CentiColons per spec, derived from named obligations,
        evidence credit, caps, and penalties"

  convergence_signal:
    - decreasing_ambiguity: "Ambiguity score trends toward 0"
    - increasing_verification: "More specs achieving S2+ status"
    - stable_invariants: "Invariants remain true over repeated test runs"
    - decreasing_centicolon_residual: "Named residual obligations trend toward 0 without denominator gaming"
    - decreasing_worst_case_residual: "Minimax adversarial scenarios leave less maximum residual CentiColon debt"

evidence_bundle:
  description: >
    A convergence claim is supported by a queryable evidence bundle. The bundle
    links provenance, structure, behavior, and operation without claiming absolute
    proof of correctness.

  required_fields:
    - spec_ids_and_versions
    - spec_hashes
    - artifact_version_and_hash
    - commit_hash
    - dependency_lock_hash
    - environment_profile
    - litmus_run_ids_and_results
    # Produced by `scripts/trace-coverage.sh --json` since 2026-08-09.
    # Grammar: {specs, traced, ghost, annotations, files, ghost_specs[]}.
    #
    # It was a declared-but-unproduced field for its whole life before that.
    # The 171 committed TRACES.md files looked like they discharged it and did
    # not: a spec -> file:line link index is not a coverage summary. Removing
    # the rendering and computing the summary on demand closed the obligation
    # and removed ~4000 lines of per-cycle churn in the same change.
    - trace_coverage_summary
    - ci_run_id
    - source_namespace
    - centicolon_signature_hash
    - centicolon_projection_ref
    - centicolon_dashboard_hash
    - projection_source_equivalence_result

  claim_levels:
    provenance: "artifact, spec, and commit are linked"
    structural: "schemas, annotations, bindings, and locks validate"
    behavioral: "critical litmus tests pass and negative paths are covered"
    operational: "runtime traces show stable behavior in declared environments"

  rule: >
    CI and release notes MUST report the highest claim level supported by the
    evidence bundle. No version string alone may be reported as proof of convergence.

  monitoring:
    - CI emits metrics after every test run
    - Metrics feed into the convergence engine's fitness function
    - Fitness function guides optimization (code changes, spec refinements)

  iterative_minimax_loop:
    purpose: >
      Drive autonomous work by repeatedly selecting the highest residual
      obligation, verifying the source of intent, and applying the smallest
      change that monotonically reduces uncertainty.
    steps:
      - step: gather_evidence
        description: >
          Run the smallest localized litmus test applicable to the domain using
          `cargo test` or `./build.sh --ci --strict --filter <spec-id>`.
          Use lazy evaluation: avoid running the expensive `--ci-full --install`
          unless you are validating a final release or missing local context.
          Record the exact chain reference so the next pass can resume.
      - step: verify_intent
        description: >
          Read the active spec, its bound cheatsheets, tombstones, and referenced
          API docs before changing code. If the spec is ambiguous or incomplete,
          refine the spec or methodology first.
      - step: classify_centipawns
        description: >
          Mark implementation details that align with the intent as good
          centipawns and blocking calls, rediscovery of host paths, or other
          anti-patterns as bad centipawns.
      - step: select_max_residual
        description: >
          Choose the open obligation with the highest residual debt or the
          largest observed gap from the current CI/litmus evidence. Use the
          failure chain to decide whether the gap is spec, methodology, or code.
      - step: minimize_delta
        description: >
          Make the smallest change that reduces the selected residual while
          preserving verified invariants and tombstone state.
      - step: revalidate
        description: >
          Re-run the same litmus and adjacent litmus to confirm the residual
          fell and no new ambiguity was introduced. Preserve the troubleshooting
          log trail so future passes can reuse the same boundary.
      - step: repeat
        description: >
          Continue until the residual plateau shifts to a different highest-risk
          obligation or the spec itself needs clarification.
    selection_rule: >
      Prefer the worst residual in the current evidence bundle, not the easiest
      passing test. If a spec or cheatsheet is wrong, fix the source of intent
      before further code minimization.
    invariants:
      - no_code_change_before_intent_audit
      - no_spec_change_without_ambiguity_review
      - no_new_host_probe_if_entry_gate_exists
      - tombstones_must_be_updated_when_requirements_are_retired

minimax_convergence_strategy:
  description: >
    Minimax convergence treats the strongest remaining counterexample as the next
    target. The system should not chase easy score gains while a critical
    requirement has high residual CentiColon debt under adversarial validation.
  selection_rule: >
    Pick the open obligation with the maximum residual_cc after applying the
    adversary moves defined in methodology/proximity.yaml:minimax_validation.
    Break ties by critical path, security boundary, user-visible contract, then
    total downstream dependency count.
  stopping_condition: >
    A stall is declared when aggregate convergence does not improve and the same
    worst-case residual remains top-ranked across the configured stability window.
    The next action is to create or refine the litmus, trace, spec, provenance, or
    unknown event that explains that residual.
  anti_pattern: >
    Raising average convergence by improving low-risk obligations while a
    high-risk maximum residual remains unresolved.

cross_platform_ux_parity_policy:
  description: >
    The Linux tray implementation is the "Golden UX". The macOS and Windows trays
    MUST follow feature parity with the Linux tray implementation. They should all map
    UX features, items, and behaviors identically at all steps. Platform-specific
    startup sequences (e.g., WSL2 or macOS VM boot) are the only acceptable deviation
    in the initial phase, but they must align with the unified emoji progression.
  rule: >
    Any modification to the tray UX or menu structure must be designed for all
    platforms. Divergence in global versus per-project action placement, visibility
    rules, or visual separators is a convergence violation.
  enforcement:
    - macos_and_windows_trays_must_consume_and_render_identical_menu_structures
    - menu_state_must_reflect_linux_golden_ux_exactly
    - deviations_must_be_recorded_as_bugs

hot_path_nonblocking_policy:
  description: >
    Steady-state runtime paths MUST remain event-driven and yield-returning.
    Blocking work in the hot path is a correctness violation because it raises
    idle CPU, hides backpressure, and weakens the architecture's monotonic
    convergence signal.
  rule: >
    Blocking calls are forbidden in the 99%+ production runtime path: tray event
    dispatch, container orchestration, request handling, and other steady-state
    loops. A blocking wait is only acceptable in an explicitly named bootstrap or
    shutdown boundary when the spec and litmus tests justify the exception.
  enforcement:
    - hot_path_code_must_use_event_driven_or_yielding_primitives
    - blocking_loops_require_named_non_hot_path_exception
    - shutdown_only_waits_must_be_documented_as_non_hot_path
  scoring_effect:
    - hot_path_blocking: "severe negative CentiColons; must be refactored or tombstoned"
    - justified_bootstrap_or_shutdown_wait: "allowed only with explicit spec trace and litmus coverage"
    - polling_for_idle_state: "forbidden unless it is a bounded one-shot check with an explicit exception"

status_channel_policy:
  # ORDER 1260-2qgi. Five instances on 2026-09-18, one shape: a status READ
  # from something other than the thing that produced it, with nothing marking
  # the substitution (a background wrapper's 0 for a gate that exited 1;
  # wsl.exe's 0 for `false`; a pipeline's `$?` taken from its last stage; a
  # wrapper-supplied 144 for a gate killed at 7%; a scripted "empty above =
  # deleted" line that nothing checked).
  description: >
    A verdict is TERNARY: green (the child ran and exited 0), red (the child
    ran and exited non-zero, or the check it performs failed), and ABSENT (no
    status from the child reached the consumer: it was killed by a signal, it
    timed out, it was never spawned, its status could not be collected, or the
    channel that carries it drops status). Absent is a first-class value, the
    same discipline as source=absent for missing data, applied to exit status.
  rule: >
    Every channel that carries a status MUST either preserve it exactly or
    DECLARE that it cannot. It must never substitute an integer. A consumer
    MUST be able to tell `exited 0` from `no status reached me`, and MUST act
    on absent explicitly: re-run the command, or refuse to push, land, close
    or report green. Treating absent as "use your judgement" is the defect,
    because in practice it means using the wrapper's integer. The fleet's
    status channel is the agent door, `tillandsias-plan run --json`
    (1443-8pur): its terminal record carries an exit `code` ONLY when the
    child exited, a signal, timeout, policy denial or uncollectable status is
    named as such, and a missing terminal record is itself absent.
  enforcement:
    - a_status_is_preserved_or_declared_absent_never_substituted
    - absent_is_distinct_from_exited_zero_at_every_consumer
    - a_consumer_that_reads_absent_re_runs_or_refuses_never_reports_green
    - detached_and_backgrounded_commands_run_through_tillandsias_plan_run_json
    - pinned_by_scripts_test_status_channel_absent_is_first_class

implementation_phases:
  description: >
    Convergence is not immediate. The system progressively strengthens validation
    as confidence increases.

  phase_1:
    name: "Trace Annotation Foundation"
    goal: "Make code-to-spec linkage explicit"
    tasks:
      - implement_trace_annotation: "#[trace(spec = '...')] on public functions"
      - validate_spec_existence: "CI checks specs exist and are active"

  phase_2:
    name: "Structural Validation"
    goal: "Ensure annotations are well-formed and complete"
    tasks:
      - build_ci_ast_scanner: "Parse Rust AST, extract annotations"
      - enforce_trace_presence: "Every public function must have #[trace]"

  phase_3:
    name: "Verification Level Tracking"
    goal: "Distinguish claimed evidence levels from observed evidence"
    tasks:
      - add_verification_level_tracking: "Track L0–L3 per annotation"
      - log_hits_and_misses: "Record which cheatsheets succeed vs fail"

  phase_4:
    name: "Cheatsheet Metrics"
    goal: "Link cheatsheet quality to litmus test outcomes"
    tasks:
      - introduce_cheatsheet_metrics: "Score entries by hit_rate, spec_binding"
      - manual_compaction: "Delete low-score entries, compress mid-score"

  phase_5:
    name: "Automated Convergence"
    goal: "Full closed-loop: metrics drive optimization"
    tasks:
      - enable_automated_compaction_and_eviction: "Cheatsheets self-shrink"
      - enforce_full_convergence_loop: "Fitness function gates all changes"

methodology_complexity_constraint:
  rule: >
    The convergence methodology itself (specs, litmus, CI validators, cheatsheets)
    MUST remain simpler than the codebase it governs. If the methodology becomes
    more complex than the code, it becomes unmaintainable and defeats its purpose.

  enforcement:
    - measure_methodology_complexity: "count_YAML_lines, annotation_density, validator_rules"
    - measure_codebase_complexity: "count_source_lines, cyclomatic_complexity"
    - ratio_constraint: "methodology_complexity / codebase_complexity < 0.15"

  anti_pattern: >
    A validation system that requires more code to understand than the code being validated.
    Red flag: CI validators exceed 5000 lines or require specialized training to understand.

independent_and_composable_litmus_constraint:
  rule: >
    Litmus tests are composable building blocks. No test should depend on the side
    effects of another test. Tests must be runnable in any order and still produce
    consistent results.

  enforcement:
    - each_test_provisions_its_own_preconditions
    - no_shared_state_across_tests
    - ci_runs_tests_in_random_order_to_detect_coupling

bidirectional_knowledge_flow_constraint:
  rule: >
    Specs inform code, code validates against specs, cheatsheets support both, and
    litmus tests link all three. Information must flow in all directions: code changes
    trigger spec re-validation, spec changes invalidate litmus tests, litmus failures
    update cheatsheet quality scores.

  enforcement:
    - no_dead_ends_in_feedback_loops
    - every_layer_can_signal_upstream
    - ci_validator_enforces_bidirectional_consistency

finite_time_convergence_and_velocity_control:
  description: >
    Enforce a strictly positive lower bound on convergence velocity and upper bounds
    on commit rate to guarantee spec convergence in finite time, prevent multi-host thrashing,
    and detect divergent development paths across branches.
  metrics:
    residual_correctness_debt:
      symbol: R_t
      definition: "sum of named residual CentiColon obligations + count of unimplemented spec requirements"
    convergence_velocity:
      symbol: V_c
      formula: "(R_t_minus_3 - R_t) / delta_t"
      minimum_acceptable: "V_min > 0"
    maximum_commit_velocity_cap:
      symbol: C_max
      value: "2 commits/hour"
      description: "Maximum allowable remote pushes per host to prevent plan/code write-write thrashing."
    divergence_distance_threshold:
      symbol: D_max
      value: "5 commits"
      description: "Maximum commits a sibling branch may drift ahead of the common merge-base without integration."
  rules:
    - finite_time_guarantee: >
        Convergence is guaranteed in finite time by enforcing V_c >= V_min when R_t > 0.
        If V_c falls below V_min, the orchestrator triggers a High-Velocity Alignment Event.
    - high_velocity_alignment_event:
        triggers: "V_c < V_min"
        actions:
          - reduce_lease_ttl: "Reduce lease TTL from 4 hours to 1 hour to increase iteration frequency."
          - exploratory_work_freeze: "Prohibit all exploratory or optional P3 optimizations; focus strictly on root blockers."
          - defuse_blockers: "Force all hosts to focus on root blockers, mock-based interface contracts, or focused litmus tests."
    - velocity_limit_and_thrashing_prevention:
        triggers: "commit_rate > C_max AND V_c <= 0"
        actions:
          - velocity_cooldown: "Enforce a mandatory 1-hour push cooldown on the thrashed host to allow other hosts to merge."
          - claim_freeze: "Prohibit claiming new tasks until the host has successfully pulled and integrated linux-next."
    - divergence_control:
        triggers: "drift_distance > D_max"
        actions:
          - remote_push_lock: "Temporarily lock remote pushes on the diverging sibling branch."
          - forced_rebase_task: "Force-assign a 'Forced Branch Rebase & Integration' task as the sibling host's next primary action."
          - synchronous_integration_wave: "Trigger an immediate orchestrator-led merge loop to fold sibling commits into linux-next."

bar_raise_governance:
  description: >
    The "scan bar" is the declared depth/criteria the reduction engine uses to
    decide what counts as a finding. It must be fixed and explicit so the
    convergence point is well defined. Reducing all open findings to zero at the
    current bar is a legitimate fixed point of the refinement operator, not
    premature convergence. The bar only rises by explicit operator decision.
  authority: >
    Raising the bar (treating a deeper signal class as findings — e.g. build,
    test, or runtime warnings; non-fatal errors; deprecation notices; flaky-test
    signals; slow steps; stale caches) is a one-off scope expansion that The
    Tlatoāni MUST approve every time. Recurring automation (the meta-orchestration
    loop) MUST NOT self-escalate the bar.
  rules:
    - convergence_point_is_the_current_bar: >
        Zero residual findings at the current approved bar is a complete,
        successful convergence state. The loop reports done at that bar rather
        than inventing deeper work to stay busy.
    - loop_may_propose_not_enable: >
        As residual approaches zero, the loop SHOULD file bar-raise candidates as
        research/ or exploration/ issues (the deeper scan that could be enabled),
        but MUST stop at proposing. A proposal is not an enabled scan.
    - enabling_requires_recorded_approval: >
        A bar-raise becomes part of the loop's contract only after The Tlatoāni
        approves it; record who, when, and the exact expanded scope before the
        deeper scan is treated as findings.
    - future_automatable_approvals: >
        The Tlatoāni may later declare a policy that auto-approves specific
        low-risk bar-raises. Until such a policy exists, every bar-raise is
        manual. Absence of a policy is not implicit approval.
  rationale: >
    Much of the system is "build what works, then improve from there." Each
    bar-raise is a deliberate scope decision the operator owns, keeping the
    convergence point clear instead of letting an ever-rising bar make "done"
    unreachable by construction.
  release_boundary_bar_raise:
    # Operator framing, The Tlatoani 2026-07-29. See philosophy.yaml
    # multi_version_convergence for the mathematical statement.
    rule: >
      A RELEASE CUT IS ITSELF A BAR RAISE — the canonical one. At the release
      boundary, fitness is re-evaluated against the then-current specs and the
      bar advances (a Lamport-clock tick in logical version time). This does
      NOT violate the no-self-escalation rule above: releases are cut by The
      Tlatoani, so the approval gate is satisfied by the release decision
      itself, and no separate per-signal approval is needed for the boundary
      re-evaluation.
    still_forbidden: >
      Raising the bar MID-RELEASE — the loop deciding on its own to treat a
      deeper signal class as findings while a release is in flight. That
      remains a one-off Tlatoani approval recorded under approved_bar_raises.
      Within a release the bar is fixed; that fixedness is what makes zero
      residual a decidable convergence point.
    why_this_is_not_a_moving_goalpost: >
      Because the specs evolve, there is no final convergent state to reach —
      only an operator-gated sequence of fixed intra-release targets. The
      per-release inequality (the technical-debt ceiling: debt non-increasing,
      features non-decreasing, no regressions) is the discrete, checkable
      guarantee that the measured residual does not worsen and converges to a
      floor. Reaching a zero floor additionally needs progress evidence that
      excludes a positive residual fixed point; no contraction is currently
      claimed. An ever-rising bar makes "done" unreachable only if it rises
      CONTINUOUSLY; a bar that steps at discrete operator-gated release
      boundaries keeps every intra-release convergence point well defined.

carried_obligations:
  # Order 1570-k5yt. Replaces the 2026-10-09 ad-lib in openspec/specs/ci-release
  # ("each new lua requires to retroactively update 1+ of old ones"), which the
  # operator withdrew on 2026-10-10 as wording, not as intent.
  authority: >
    The Tlatoāni, 2026-10-10: "I just want to automatically do backlog to LUA
    migration as agents do progress"; "our whole methodology just needs a way
    to do backlog from suggestions/advisory into 'gentle enforcement'"; the
    obligation is to be TAILGATED onto agents doing other work, "migrate +1
    with your PR". Earlier ruling it generalises, 2026-10-09: "new gates in
    lua only, and each new lua requires to retroactively update 1+ of old
    ones".
  description: >
    A carried obligation is a named, counted migration backlog that ordinary
    work burns down one small item at a time. It is the middle rung between a
    ratchet that only stops growth (check-shell-ratchet.lua,
    check-jq-callsite-ratchet.sh: standing debt is never reddened, 1130-i6xj)
    and a gate that refuses the debt outright. Neither end retires a backlog of
    hundreds of items: the first leaves it flat (the shell-decider floor stood
    at 664 from 2026-10-02 across 23 integrations, 11 of which edited gate
    scripts), the second reds the trunk on day one and gets switched off
    (check-scorable-obligation-added.sh header, 977-448j). The pattern takes its
    parts from mechanisms the fleet already runs: the floor that only descends
    (1384-bxhk), the stated reason that a gate accepts in place of silence
    (`unscoreable:`, 977-448j), the commit trailer read over BASE..HEAD
    (`Native-Lint:`, 1235-rfub), and the trigger that is a number rather than a
    preference (work_ref_lane, check-landing-provenance.sh).
  stages:
    advisory: >
      The counter prints on every --check and the ratchet refuses growth.
      Nothing asks a change to pay down the backlog. This is where every
      backlog starts, and where shell-to-lua sat from 1384-bxhk until
      2026-10-10.
    gentle: >
      A change that touches the backlog's area is DUE. A due change carries
      one item (the counter at its head is below the counter at its base) or
      one waiver line. Silence is the only thing refused, and refused only at
      landing; a work-ref push warns. A change outside the area owes nothing
      and is never shown the obligation.
    enforced: >
      A due change carries one item, or a waiver whose reason is
      `blocked-by:<order>` naming a live ledger row that makes every in-reach
      item unportable (1576-luas is the shape: no AF_UNIX socket in the Lua
      std). A free-text waiver is refused. Growth stays refused as before.
  due: >
    Due is decided by the change's own diff (BASE...HEAD, BASE defaulting to
    origin/linux-next as in the -added deciders), against the backlog's AREA,
    a fixed set of path globs declared on the backlog. "Any PR" is never an
    area: a toll on unrelated work is a tax, and the operator's
    "migrate +1 with your PR" is addressed to agents already working in the
    corpus being migrated. A change that is itself a port is due and paid.
  waiver: >
    One commit trailer on any commit in the change,
    `Carried-Waiver: <backlog> <reason>`, one line, reason free text at the
    gentle stage. Conventional reasons, so the tally can group them:
    `too-big:<item>:<lines>` (budget rule below), `blocked-by:<order>`,
    `no-item-in-reach`, `conflict:<work-ref>` (another open ref already ports
    it). Waivers are COUNTED, NOT JUDGED: no reviewer weighs a reason, the
    landing records it, and the stall trigger reads the counts. A PR-body line
    is not the record: the land queue reads only number, headRefName and
    isDraft, and a forge cannot see a PR body at all; a trailer travels with
    the merge commit's second parent into every clone.
  discovery: >
    An agent learns what it owes from a guard's output, never from this
    prose. The guard runs the backlog table below against the change's diff
    and prints one line per backlog:
    `carried:<backlog>:not-due`, `carried:<backlog>:paid:<item>`,
    `carried:<backlog>:waived:<reason>`, or
    `carried:<backlog>:due:<item> (<n> lines)` followed on stderr by up to
    five candidates and the exact waiver line to paste. It runs in
    `./build.sh --preflight` (the pre-ready step every work ref already
    takes, join-the-fleet step 4), in scripts/relay-preflight.sh, and in the
    work-ref pre-push warn lane (`warn:pre-push:...`). The guard is
    1577-g96z; until it lands the rule is binding convention and an agent
    reads its due item from the backlog's own counter (shell-to-lua:
    `tillandsias-plan script run scripts/lua/check-shell-ratchet.lua`).
  counter: >
    One integer a script prints on every --check, judged against a floor file
    that may only descend over that file's OWN git history (check-shell-
    ratchet.lua floor-raised arm; a fixture must not encode a moment). A
    backlog whose counter can still rise through an advisory arm says so and
    reports the excess as its own number rather than folding it in; a floor
    line whose file no longer exists is slack, not debt, and must be refused,
    because it overstates the backlog and readmits the deleted file by name.
    Paid means the counter of EXISTING items fell, not that a floor line was
    removed.
  budget: >
    A carried item is small by construction: the guard offers only items at
    or under the backlog's item ceiling, smallest first, and spreads its
    suggestion over the five smallest by the work ref's order so two
    concurrent changes do not port the same file. When the offered item is
    larger than the change's own diff (lines added plus deleted, excluding the
    port), the agent writes `Carried-Waiver: <backlog> too-big:<item>:<lines>`
    instead of growing the change. An item over the ceiling is never carried;
    it is a packet of its own (1570-mxcg, 652 lines, 8 h, is that shape).
  triggers:
    window: >
      W = the last 10 DUE integrations of the backlog, counted by first parent
      on linux-next as check-landing-provenance.sh counts landings. Measured
      2026-10-02..10-10: 23 integrations, 11 due for shell-to-lua, so W is
      about one week of fleet work.
    advisory_to_gentle: >
      The counter did not descend across W while advisory. A ratchet that
      stops growth without retiring anything has shown the backlog will not
      move on its own.
    gentle_to_enforced: >
      The counter did not descend across W while gentle: every due change in
      the window waived. If most of those waivers cite `blocked-by:`, the
      remedy is the blocking rows, not a stricter stage, and the coordinator
      promotes those rows instead.
    retire: >
      The counter reaches the backlog's floor of things that stay (for
      shell-to-lua, scripts/portability/bootstrap-shell-allowlist.txt). The
      obligation is removed from the table; the ratchet stays as the growth
      refusal, and check-decider-retirement.sh says when its deciders retire.
  governance: >
    A trigger obliges the coordinator to PROPOSE the move, as one plain ask in
    the operator queue carrying the window's numbers (paid, waived, silent,
    counter at both ends). Moving a backlog to a stricter stage is a bar raise
    under bar_raise_governance: it takes effect when The Tlatoāni approves it
    and the approval is recorded in approved_bar_raises. Recurring automation
    never moves a stage on its own.
  backlogs:
    - name: shell-to-lua
      stage: gentle
      since: "2026-10-10"
      area:
        - scripts/check-*.sh
        - scripts/test-*.sh
        - scripts/verify-*.sh
        - scripts/guard-*.sh
        - scripts/lua/**
        - scripts/gate-steps.d/**
      counter: >
        `sh=` on the ok: line of scripts/lua/check-shell-ratchet.lua (existing
        top-level check-/test-/verify-/guard- .sh outside the bootstrap
        allowlist), floor scripts/portability/shell-decider-floor.txt.
        2026-10-10 on linux-next 1b1d0ea0c: sh=671, floor 664. Of the 664
        floor lines 9 name files already ported to Lua and deleted (slack);
        sh exceeds the floor by 16 because the new-shell-fixture arm is
        advisory until native macOS/Windows process conformance (1543-ffhg,
        1544-cnae).
      item: >
        One file from the counter's population ported to scripts/lua/ on
        `tillandsias-plan script run` with the same verdict grammar, or
        retired; the .sh deleted and both floor files lowered through
        `check-shell-ratchet.lua --dump-floors` in the same commit.
      item_ceiling_lines: 150
      item_ceiling_measured: >
        2026-10-10, existing floor files by wc -l: 38 at or under 60 lines,
        320 at 61-150, 297 over 150. The ceiling leaves 358 carriable items;
        the rest are packets.
      spec: openspec/specs/ci-release/spec.md (req-id ec267f02)
      guard: 1577-g96z
      tally: 1577-568c
      honest_counter: 1577-57u3

