trace: spec:methodology-accountability

agent_observability_protocol:
  version: v0.1
  purpose: >
    Make agent-to-agent work visible, queryable, and compressible while preserving
    accountability. Progress displays are UI hints over structured events, not
    evidence of correctness.

  event_stream:
    format: jsonl
    location_template: "<project>/<metadata-dir>/agent-events.jsonl"
    ordering: "sort by (lamport_clock, agent_id, event_seq)"
    required_fields:
      - event_id
      - parent_event_id
      - task_id
      - spec_id
      - agent_id
      - lamport_clock
      - event_seq
      - status
      - progress
      - summary
      - evidence_refs
      - timestamp
      - host_id
      - platform
      - branch
      - worktree_path
      - lease_id
      - graph_node_id
      - owned_file_scope
      - upstream_commit
      - observed_sibling_heads
      - checkpoint_commit
    optional_metadata_fields:
      - tokens_spent
      - prompt_tokens
      - completion_tokens
      - tokens_remaining_percent
      - rate_limit_remaining_percent
    status_values:
      - queued
      - bootstrapping
      - reading
      - planning
      - claimed
      - editing
      - verifying
      - blocked
      - stale
      - done
      - failed

  progress_semantics:
    range: "0..100"
    monotonic_within_task: true
    rule: >
      Progress is coordination state. Correctness comes from specs, traces,
      litmus tests, CI, and evidence bundles.
    allowed_regression: >
      Progress may decrease only with blocked, failed, or scope_changed events
      that include root cause and updated evidence_refs.
    recommended_weights:
      bootstrap_receipt: 10
      governing_context_loaded: 25
      plan_ready: 35
      edits_complete: 65
      local_verification_started: 75
      verification_passed: 90
      evidence_recorded: 100

  display_hints:
    plain_text_bar:
      width: 20
      filled: "#"
      empty: "-"
      template: "{task_name} [{bar}] {progress}% {status}"
    rich_text_bar:
      width: 24
      filled: "#"
      partial: "~"
      empty: " "
      template: "{indent}{task_name} [{bar}] {progress}% {status}"
    compact_template: "{task_name} [{bar}] {progress}% {status} refs:{evidence_count}"
    repeat_before_after_template: "before {before_bar} → after {after_bar} Δ{delta}"
    repeat_trend_template: "trend {trend_bar} avg={trend_average} latest={trend_latest}"
    repeat_milestone_template: "milestone {label}@{timestamp} elapsed={elapsed}"
    repeat_minimal_template: "{session_id} #{cycle} {status} {repeat_before_after_template} {repeat_trend_template} {repeat_milestone_template}"
    milestone_timestamp_template: "{label}@{hhmmss}"
    repeat_tree_header_template: "{session_id} #{cycle} {status} branch={branch} elapsed={elapsed}"
    repeat_tree_node_template: "{indent}{connector} {label} [{bar}] {progress}% {status}"
    repeat_tree_leaf_template: "{indent}{connector} {label} [{bar}] {progress}% {status} · {summary}"
    repeat_tree_footer_template: "trend {trend_bar} latest={latest} prev={previous} avg={average}"
    repeat_loop_state_waiting: "waiting on agent"
    repeat_loop_state_sleeping: "sleeping until next iteration"
    repeat_loop_state_running: "agent working"

  agent_to_agent_messages:
    rule: >
      Agents communicate by appending events and by sending compact task handoffs.
      Handoffs must not depend on hidden conversational memory.
      If a meaningful substep completes or a blocker appears, write a compact
      refinement note under ./methodology/event/ or ./plan/issues/ so the next
      agent can resume without chat history.
    handoff_schema:
      lease_id: string
      task_id: string
      spec_id: string
      graph_node_id: string
      parent_task_id: string
      bootstrap_receipt_ref: string
      current_status: string
      progress: integer
      blockers: list
      evidence_refs: list
      next_action: string
      host_id: string
      platform: string
      branch: string
      worktree_path: string
      owned_file_scope: list
      upstream_commit: string
      observed_sibling_heads: object
      checkpoint_commit: string

  repeat_progress_report:
    purpose: >
      Provide a minimal machine-readable progress record for noninteractive repeat
      loops. The wrapper's compiled Rust helper can render this into a
      human-friendly tree graph without exposing file-change chatter or
      reasoning traces.
    schema:
      session_id: string
      cycle: integer
      branch: string
      status: string
      before_progress: integer
      after_progress: integer
      delta_progress: integer
      trend_window: list
      current_bar: string
      trend_bar: string
      elapsed_seconds: integer
      elapsed_human: string
      milestone_label: string
      milestone_timestamp: string
      next_action: string
      blockers: list
      checkpoint_commit: string
      focus_task_id: string
      ready_count: integer
      blocked_count: integer
      tokens_spent: integer
      prompt_tokens: integer
      completion_tokens: integer
      tokens_remaining_percent: integer
      rate_limit_remaining_percent: integer
      task_tree: list
      loop_state: string
      output_mode: "compact-json"
    rendering_notes:
      - "Show before/after as blocky progress bars."
      - "Show the latest milestone timestamp in absolute time and elapsed time."
      - "Show the last N progress points as a trend bar and an average delta."
      - "Render only active work and its dependency tail as a compact tree with one line per node."
      - "Treat anonymous stream events as evidence only; they may advance the current focus bar but must not become standalone tree nodes."
      - "Ask agents to file an immediate bootstrap refinement note to ./methodology/event/ or ./plan/issues/ before edits begin, then refresh it after each meaningful substep so live progress is visible before the session ends."
      - "Keep progress notes modest and portable; use plain repo paths instead of @-prefixed file references."
      - "Show token-spend metadata only when cheaply available from existing metadata; do not issue extra API calls to fetch it."
      - "If token metadata exists, surface both per-task token spend and the remaining percentage until rate limiting."
      - "Do not stream file-by-file changes in repeat mode unless explicitly requested."
      - "The repeat path is tokio-driven: child output, note-file changes, and heartbeat ticks should wake the live tree without a shell polling loop."
      - "Keep the live refresh minimal: headers, tree, trend, milestone, blockers."
      - "If no refinement note has arrived yet, render a bootstrap-pending line so cold-start silence is explicit instead of looking like completed work."
      - "Repaint when the running agent emits a new progress record; do not repaint on a blind timer."
      - "Distinguish between waiting on the agent process, agent working, and sleeping between iterations."
      - "Treat ./codex --quiet as one-shot noninteractive output and ./repeat --agent codex --repeat N --prompt ... as a bounded repeat loop."
      - "When repeat mode is cycling, a graph-summary build pass such as ./build.sh --ci-full --graphs may run between iterations and should stay compact."

  lease_protocol:
    purpose: >
      Make claims over tasks and file scopes explicit, idempotent, and recoverable.
      A later agent may reclaim a stale claim, but it must do so from the latest
      observable plan state rather than hidden memory.
    claim_rules:
      - "Claim by stable graph node ID and file scope hash."
      - "Repeated claim events with the same lease_id are no-ops."
      - "A conflicting claim on the same file scope becomes blocked until reconciled."
      - "A claim that goes stale must be revalidated by the next agent before editing."
      - "A cross-host claim touching plan, methodology, OpenSpec, or shared crates must record observed sibling branch heads."
    lease_fields:
      - lease_id
      - claimant_agent_id
      - graph_node_id
      - owned_file_scope
      - branch
      - host_id
      - platform
      - worktree_path
      - claimed_at
      - expires_at
      - last_heartbeat_at
      - upstream_commit
      - observed_sibling_heads
      - checkpoint_commit
    stale_recovery:
      - "A stale lease is not a failure; it is a cue to reload the plan and emit a fresh reading event."
      - "If two agents believe they own the same claim, the later one yields and reclaims a disjoint node."

  stale_tracking_policy:
    stale_after: "10 minutes without a new event for active work"
    reclaim_after: "the distributed-work lease expires, normally 4 hours"
    distinction: >
      Ten minutes without a heartbeat marks an active task stale for display and
      requires the next touching agent to fresh-read state before proceeding. It
      does not by itself release the lease. Reclaim is allowed only after the
      lease TTL in methodology/distributed-work.yaml expires, or after an
      explicit failed/released event.
    stale_action: >
      Mark the task stale and require the next agent touching it to emit a fresh
      reading or verifying event before continuing.
    recovery: >
      Reconstruct current task state from latest event per task_id, sorted by
      Lamport order. Conflicting latest events become blocked until reconciled.

  # ── Cycle metrics (order 575) ─────────────────────────────────────────────
  #
  # What a meta-orchestration cycle reports about ITSELF when it ends.
  # Producer: scripts/cycle-metrics.sh. Consumers: skills/meta-orchestration
  # (Cycle Metrics section) and skills/advance-work-from-plan (step 7.0).
  cycle_metrics:
    purpose: >
      Report what a cycle achieved in verifiable terms, and specifically whether
      the experts were USED and whether they were USEFUL. Those are two
      questions, and a single call counter answers neither honestly.
    used_vs_useful:
      used: >
        A volume question. Easy to measure, easy to game, and on its own silent
        about value.
      useful: >
        A quality question. An expert called two hundred times that REFUSES two
        hundred times is heavily used and completely useless.
      why_it_matters: >
        Order 531 was exactly that failure in production: every plan_answer
        returned confidence=unsupported because the forge was seeded from a
        branch carrying no expert sources, while the launch state truthfully
        reported `experts: ready` and every health signal read green. A call
        counter would have shown healthy adoption throughout the incident.
    # ── packet 682-ym68: the handoff surfaces usage AND accuracy every cycle ──
    surfaced_every_cycle:
      rule: >
        Every meta-orchestration handoff MUST carry two lines beyond the
        experts/answer_rate block, because "used" and "right" are different
        questions and neither substitutes for the other. Measure before optimize.
      mcp_usage:
        line: "mcp: servers=<n> plan-expert-calls=<n> other-servers=uninstrumented-see-682-m8ek source=<path|absent>"
        question: "Are the MCP servers used?"
        honest_limit: >
          The usage JSONL carries no server dimension yet: only the plan expert
          (forge-plan.sh) writes rows. project-info and the other servers are
          NAMED uninstrumented (packet 682-m8ek), never faked as zero. When
          682-m8ek adds a server field, this line grows to real per-server counts.
      expert_accuracy:
        line: "expert_accuracy: pass=<P> total=<T> rate=<pct> source=groundtruth-rung1"
        question: "Are the experts RIGHT?"
        source: "litmus:expert-groundtruth-harness graded against openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml"
        rule: >
          The groundtruth pass-rate, distinct from answer_rate: an expert can
          answer every question yet cite spans that do not support the answer.
          Accuracy is pass/total of graded cases, NEVER call volume. The grader
          is cheap (~0.4s over 19 cases) so it runs every cycle; when no binary
          can grade in-cycle the line reads `deferred
          source=litmus:expert-groundtruth-harness` and the quick-tier gate
          carries it, rather than reporting a number the tooling did not produce.
      cycle_flow:
        line: "flow: cycles=<n> avg_completed_per_cycle=<x> avg_commits_per_cycle=<y> overhead_ratio=<commits-per-completed|-> source=<path|absent>"
        question: "Does work-done-per-cycle outrun the fixed per-cycle overhead as batches grow?"
        source: "per-host JSONL at ${TILLANDSIAS_CYCLE_FLOW_LOG:-/tmp/tillandsias-cycle-flow.jsonl}, one record per cycle"
        emitter: "scripts/cycle-metrics.sh --emit-flow host=<h> batch_epic=<id> batch_seed=<s> batch_size=<n> budget=<n> claimed=<n> completed=<n> filed=<n> commits=<n> plan_open=<n> plan_total=<n>"
        rule: >
          Packet 682-epud. The greedier-batching decision (682-yiz7) asks whether
          LARGER batches per cycle amortize the fixed meta-orchestration overhead;
          that is a MEASUREMENT question a single cycle cannot answer. Each cycle
          APPENDS one packet-flow record and this line reports the ROLLING view.
          overhead_ratio = total commits per total completed packet — the
          per-cycle cost amortized across the work it produced. If greedier
          batches amortize overhead, the ratio FALLS as batch_size rises. The emit
          is best-effort by construction (like mcp-usage-log.sh): an unwritable
          log path never fails the cycle it measures.
      build_test_timing:
        line: "timing: steps=<n> build_check_ms_avg=<x> litmus_ms_avg=<y> slowest=<step>:<ms> source=<path|absent>"
        question: "Where does the cycle's wall-clock go — what is the bottleneck?"
        source: "per-host JSONL at ${TILLANDSIAS_TIMING_LOG:-/tmp/tillandsias-timing.jsonl}, one record per timed heavy step"
        emitter: "scripts/cycle-metrics.sh --emit-timing step=<name> phase=<name> duration_ms=<n> exit=<n> host=<h>"
        record_grammar: '{"ts":<utc>,"host":<h>,"step":<name>,"phase":<name>,"duration_ms":<n>,"exit":<n>}'
        rule: >
          Packet 682-emvg. "Time spent building, testing" is the most likely
          bottleneck and was invisible until the build/test/litmus entry points
          began appending one duration record per heavy step. build.sh --check
          (the local gate, run every cycle), each scripts/local-ci.sh litmus
          phase, and each scripts/run-litmus-test.sh suite self-instrument via a
          shared best-effort helper (scripts/timing-log.sh). The two named
          averages scope to distinct step namespaces so nested emitters never
          double-count: build_check_ms_avg is step=="build-check";
          litmus_ms_avg is step matching ^litmus. `slowest` is the single
          step:ms with the largest duration across all records — the one fact to
          attack first. The emit is best-effort by construction (like
          mcp-usage-log.sh and --emit-flow): a timing failure NEVER changes the
          wrapped step's exit code or output, and an unwritable log path never
          fails the cycle it measures. The reporter parses each row with jq
          `fromjson?`, so a malformed row is dropped, never fatal.

    headline_metric:
      name: answer_rate
      formula: "answered / (answered + unsupported)"
      denominator_rule: >
        `degraded` (the expert could not run at all) and `error` (protocol) are
        EXCLUDED from the denominator. A broken build is an infrastructure fact,
        and folding it into a quality ratio makes a wrong artifact look like a
        hard question — which is precisely how order 531 stayed hidden. Any
        change that folds degraded into the denominator must be refused.
    anti_gaming_rule:
      rule: >
        `answered` is reachable ONLY when the expert returns CITATIONS, and the
        compiled binary emits citations only when it resolved a real packet or a
        real YAML path. Calling a tool more times therefore cannot raise the
        answer rate; only answering more can.
      enforcement: >
        Any proposal that lets `answered` be reached without citations converts a
        quality signal into a volume signal and MUST be rejected on that ground,
        not debated as ergonomics. This is the same reasoning that keeps XP
        constraint-derived rather than activity-derived (packet 567): a metric
        that rewards activity is a privilege-escalation path wherever it gates
        anything.
    # ── OPERATOR DIRECTIVE 2026-09-03: become token-conscious ────────────
    context_cost_metrics:
      status: measure-only
      purpose: >
        Long-running loop sessions accrete context for days. The operator's
        direction is to become token-conscious NOW so that remedies can be
        chosen from data LATER, and to decompose long-running monolithic
        sessions into ephemeral minimal-context sub-agents the way experts and
        cheatsheets were decomposed by domain. This section adds the
        INSTRUMENTATION. It deliberately adds NO remedy.
      amends_a_declination: >
        `honest_limits.token_and_wallclock_efficiency` below says token
        efficiency "belongs to the harness — not derivable in-repo". THAT
        REMAINS TRUE AND IS NOT WITHDRAWN. A token count is not derivable here.
        What IS derivable is a family of CONTEXT-GROWTH PROXIES, and this
        section adds those under their real name. A proxy reported as a token
        count would be the exact defect this protocol exists to prevent.
      proxy_discipline:
        rule: >
          Every metric here is a PROXY and MUST be named as one at every
          surface. `transcript_bytes` is bytes, not tokens. The ratio between
          them is model- and content-dependent and is NOT a constant this
          project may assume. Anyone converting a proxy to a token estimate
          MUST cite the measurement that established the conversion, or report
          the proxy.
        why: >
          On 2026-09-03 this fleet recorded EIGHT instruments that answered a
          different question than the one asked of them, including a grep count
          reported as a verification and a composite memory high-water mark read
          as a working set. A metrics section written the day after that must
          not add a ninth.
      surfaced_every_cycle:
        context_growth:
          line: "context: transcript_mb=<x> lines=<n> delta_mb=<x> tools=<n> source=<path|absent>"
          question: "How fast is this session's context growing, and per what?"
          honest_limit: >
            Bytes and JSONL lines of the harness transcript, NOT tokens. Absent
            when the harness does not expose a transcript path — `absent` is a
            valid and required value.
        cycle_shape:
          line: "shape: cycles_this_session=<n> tool_calls_per_cycle=<x> messages_per_cycle=<x> compactions=<n>"
          question: "Is per-cycle cost stable, or creeping as the session ages?"
          rule: >
            The CREEP is the signal, not the absolute. A loop whose per-cycle
            tool count is flat across forty cycles is behaving; one that doubles
            is the thing this instrumentation exists to catch.
        step_repetition:
          line: "repeat: window=<since=<utc>|3h> steps=<n> top3=<entries|-> source=<path|absent>"
          question: "Which methodology steps are paid REPEATEDLY inside one cycle?"
          rule: >
            The expensive step is rarely the slow one; it is the one paid many
            times. A gate re-run after every rebase (982-cs43) costs its
            duration TIMES the number of rounds, and only the product is
            actionable. Report the top three by count, not by duration —
            duration is already covered by `timing`. Emitted by
            scripts/cycle-metrics.sh over the timing log (order 1001-q3zf);
            the window is the cycle's own start, passed as
            `--cycle-start <Start-Of-Cycle UTC>`, else the last three hours.
            Entries are `<step>=<count>`, count desc then step asc.
          review: >
            Did any host act on a repeat: top3 — merge two rounds into one,
            or stop re-running a gate the rebase did not invalidate? If no
            cycle has, the line is a count nobody reads and is retired.
        # ── order 1001-q3zf: the two CROSS-CYCLE lines the operator asked for ──
        # "add metrics to each host's iterations to detect repeated work that
        # just wastes work every cycle, and expensive work that may be cached
        # or skipped" (2026-09-03). The data already existed — the timing log
        # held 48,790 records on macuahuitl, and one gate step had run 361
        # times at 13.9 s never failing — and only the reporter was missing.
        cross_cycle_recurrence:
          line: "recur: window=<n>d runs=<n> steps=<n> top3=<entries|-> source=<path|absent>"
          question: "Which steps are paid on EVERY cycle, and what do they cost cumulatively?"
          rule: >
            Over the last N days (default 7), a step RECURS when it ran at
            least twice. Entries are
            `<step>:runs=<n>:total_ms=<t>:avg_ms=<a>:fail_pct=<p>`, top three
            by total_ms desc then step asc — the cumulative cost, not the
            mean, because a cheap step paid three hundred times outranks an
            expensive one paid twice. Step names may contain colons
            (`step:...`, `check:litmus-pre-build`): parse an entry FROM THE
            RIGHT — the trailing `:key=value` fields never contain a colon,
            and the step is everything before the first `:runs=`.
          review: >
            Does the recur: top3 still name steps a cycle pays by DESIGN
            (gates, suites), or has it filled with steps paid by habit? If a
            release boundary passes and no packet cites a recur: number, say
            why the line stays.
        skippable_candidates:
          line: "skippable: candidates=<n> floor_ms=<f> min_runs=<m> top3=<entries|-> source=<path|absent>"
          question: "Which expensive, repeated, outcome-invariant steps could be memoised or skipped?"
          honest_limit: >
            A CANDIDATE is a step with runs >= min_runs (default 5), avg_ms >=
            floor_ms (default 2000) and an outcome that NEVER changed in the
            window (fail_pct 0 or 100, decided on raw counts, never on the
            rounded percentage). Its `saved_ms_upper` is total_ms - avg_ms:
            an UPPER BOUND on what a perfect skip could have saved, and it
            MUST be named as a bound at every surface. The timing log carries
            no input identity, so this line cannot say a run WOULD have hit a
            cache — only that its outcome matched every other run. Quoting it
            as a saving is the proxy-as-measurement defect proxy_discipline
            exists to prevent. The named next rung, deliberately not part of
            order 1001-q3zf, is a TREE DIGEST on timing records, so exact
            repeats become measurable rather than bounded.
          rule: >
            Entries are
            `<step>:runs=<n>:avg_ms=<a>:fail_pct=<p>:saved_ms_upper=<s>`, top
            three by saved_ms_upper desc then step asc; parsed from the right
            like recur:. This is the operator's "repeated work that wastes
            every cycle / expensive work that may be cached or skipped"
            instrument, and it is a candidate list, not a decision: a
            memoise-or-skip packet is filed only when the same step tops
            skippable: on two or more hosts (attach the regime; never act on
            one host's reading alone), by the coordinator's cross-host
            recurrence audit in skills/coordinate-multihost-work.
          review: >
            Has a skippable: candidate been memoised or skipped, and did the
            host's recur: total for that step then FALL? If a candidate was
            skipped and its total did not fall, the bound was not a proxy
            for anything and the line is retired or re-derived.
      candidate_remedies_NOT_ADOPTED:
        rule: >
          /compact, /clear, and sub-agent delegation are CANDIDATES. None is
          adopted, none is scheduled, and no methodology step calls one today.
          They are recorded here so that when the data arrives nobody has to
          re-derive the option space — and so that adopting one is a visible
          decision rather than a drift.
        adoption_precondition: >
          A remedy is adopted only when (a) the metrics above show the cost it
          claims to reduce, on more than one host, and (b) the fleet's agents
          AGREE on the step it attaches to. Measurement precedes remedy. This is
          the same rule that kept the forge memory ceiling from being set from
          intuition (981-n5vx) after three hosts measured three different things.
        known_hazard: >
          A remedy that discards context is IRREVERSIBLE mid-cycle. Any proposal
          must say what a cycle LOSES, not only what it saves — and must survive
          the question "what would this have discarded during the 996-bcjx
          investigation", where three corrections arrived across four exchanges
          and each depended on the prior ones.
      direction_micro_context:
        rule: >
          The longer-horizon aim, operator-stated: long-running work decomposes
          into sub-tasks that are IDEMPOTENT, EPHEMERAL and MINIMAL-CONTEXT, the
          way a monolith decomposes into services and the way experts and
          cheatsheets were split by domain. A sub-task that needs the whole
          session's history is a sub-task that was not decomposed.
        why_it_may_beat_bigger_models: >
          The operator's hypothesis, recorded as a hypothesis: many small agents
          with minimal context may be FASTER and cheaper than one large agent
          with a large context running a large task. This is not yet measured.
          The metrics above are what would measure it.
      metrics_refinement:
        rule: >
          THE METRICS THEMSELVES ARE SUBJECT TO REVIEW ON A FIXED CADENCE, and
          this obligation is part of the protocol rather than a nicety. Every
          metric added here carries a REVIEW question, and a metric that cannot
          answer its review question is retired rather than kept.
        cadence: "every tenth cycle per host, or on any release boundary, whichever is sooner"
        review_questions:
          - "Does this metric still measure what its `question:` field claims? Name the observation, not the intent."
          - "Has anything acted on it? A metric nobody has used to make a decision is a cost with no return — retire it or say why it stays."
          - "Could it be satisfied without the underlying thing improving? If yes it is an activity metric and inherits the anti_gaming_rule below."
          - "Is its proxy still a proxy for what it was chosen to proxy? Re-establish the link, do not assume it."
        why: >
          A metric drifts exactly the way a guard drifts, and this fleet has
          eight same-day instances of an instrument answering the wrong
          question. A metrics protocol WITHOUT a refinement obligation is
          itself an unwired ratchet — and `a guard's wiring is part of the
          guard, and an unwired one should fail its own audit` (795-5itp).
        retirement_is_success: >
          Retiring a metric that no decision ever used is a GOOD outcome and
          must be recordable as one. A protocol that only ever grows is a
          protocol nobody is willing to audit.

    honest_limits:
      substitution: >
        "Did the agent query the expert INSTEAD of grepping the ledger?" is the
        metric that would best prove adoption. It requires the AGENT HARNESS's
        own tool-call log, which does not live in this repository. It is reported
        as `unknown` and MUST NOT be estimated.
      token_and_wallclock_efficiency: >
        Belongs to the harness for the same reason. Not derivable in-repo.
      rule: >
        Reporting a number the tooling did not produce is worse than reporting
        none: it makes an unmeasured thing look measured. `unknown` is a valid
        and required value.
    failure_mode_verdicts:
      - "attention:expert-answered-nothing-check-base-branch — the order-531 signature. The expert RAN every time and answered nothing, which means the ARTIFACT is wrong, not that the questions were hard."
      - "attention:experts-degraded-<n>-calls-could-not-run — infrastructure, not retrieval quality."
      - "attention:experts-never-called — the surface exists and no agent used it; an adoption problem, not a quality one."
    reporter_contract: >
      The reporter exits 0 whenever the report was produced. A metrics reporter
      that fails the cycle it measures is a metric that can take down what it
      measures; the VERDICT carries the judgement instead of the exit code. For
      the same reason the telemetry write at the MCP chokepoint is best-effort
      and can never break a tool call.
