trace: spec:methodology-accountability

agent_observability_protocol:
  version: v0.1
  purpose: >
    Make agent-to-agent work visible, queryable, and compressible while preserving
    accountability. Progress displays are UI hints over structured events, not
    evidence of correctness.

  event_stream:
    format: jsonl
    location_template: "<project>/<metadata-dir>/agent-events.jsonl"
    ordering: "sort by (lamport_clock, agent_id, event_seq)"
    required_fields:
      - event_id
      - parent_event_id
      - task_id
      - spec_id
      - agent_id
      - lamport_clock
      - event_seq
      - status
      - progress
      - summary
      - evidence_refs
      - timestamp
      - host_id
      - platform
      - branch
      - worktree_path
      - lease_id
      - graph_node_id
      - owned_file_scope
      - upstream_commit
      - observed_sibling_heads
      - checkpoint_commit
    optional_metadata_fields:
      - tokens_spent
      - prompt_tokens
      - completion_tokens
      - tokens_remaining_percent
      - rate_limit_remaining_percent
    status_values:
      - queued
      - bootstrapping
      - reading
      - planning
      - claimed
      - editing
      - verifying
      - blocked
      - stale
      - done
      - failed

  progress_semantics:
    range: "0..100"
    monotonic_within_task: true
    rule: >
      Progress is coordination state. Correctness comes from specs, traces,
      litmus tests, CI, and evidence bundles.
    allowed_regression: >
      Progress may decrease only with blocked, failed, or scope_changed events
      that include root cause and updated evidence_refs.
    recommended_weights:
      bootstrap_receipt: 10
      governing_context_loaded: 25
      plan_ready: 35
      edits_complete: 65
      local_verification_started: 75
      verification_passed: 90
      evidence_recorded: 100

  display_hints:
    plain_text_bar:
      width: 20
      filled: "#"
      empty: "-"
      template: "{task_name} [{bar}] {progress}% {status}"
    rich_text_bar:
      width: 24
      filled: "#"
      partial: "~"
      empty: " "
      template: "{indent}{task_name} [{bar}] {progress}% {status}"
    compact_template: "{task_name} [{bar}] {progress}% {status} refs:{evidence_count}"
    repeat_before_after_template: "before {before_bar} → after {after_bar} Δ{delta}"
    repeat_trend_template: "trend {trend_bar} avg={trend_average} latest={trend_latest}"
    repeat_milestone_template: "milestone {label}@{timestamp} elapsed={elapsed}"
    repeat_minimal_template: "{session_id} #{cycle} {status} {repeat_before_after_template} {repeat_trend_template} {repeat_milestone_template}"
    milestone_timestamp_template: "{label}@{hhmmss}"
    repeat_tree_header_template: "{session_id} #{cycle} {status} branch={branch} elapsed={elapsed}"
    repeat_tree_node_template: "{indent}{connector} {label} [{bar}] {progress}% {status}"
    repeat_tree_leaf_template: "{indent}{connector} {label} [{bar}] {progress}% {status} · {summary}"
    repeat_tree_footer_template: "trend {trend_bar} latest={latest} prev={previous} avg={average}"
    repeat_loop_state_waiting: "waiting on agent"
    repeat_loop_state_sleeping: "sleeping until next iteration"
    repeat_loop_state_running: "agent working"

  agent_to_agent_messages:
    rule: >
      Agents communicate by appending events and by sending compact task handoffs.
      Handoffs must not depend on hidden conversational memory.
      If a meaningful substep completes or a blocker appears, write a compact
      refinement note under ./methodology/event/ or ./plan/issues/ so the next
      agent can resume without chat history.
    handoff_schema:
      lease_id: string
      task_id: string
      spec_id: string
      graph_node_id: string
      parent_task_id: string
      bootstrap_receipt_ref: string
      current_status: string
      progress: integer
      blockers: list
      evidence_refs: list
      next_action: string
      host_id: string
      platform: string
      branch: string
      worktree_path: string
      owned_file_scope: list
      upstream_commit: string
      observed_sibling_heads: object
      checkpoint_commit: string

  repeat_progress_report:
    purpose: >
      Provide a minimal machine-readable progress record for noninteractive repeat
      loops. The wrapper's compiled Rust helper can render this into a
      human-friendly tree graph without exposing file-change chatter or
      reasoning traces.
    schema:
      session_id: string
      cycle: integer
      branch: string
      status: string
      before_progress: integer
      after_progress: integer
      delta_progress: integer
      trend_window: list
      current_bar: string
      trend_bar: string
      elapsed_seconds: integer
      elapsed_human: string
      milestone_label: string
      milestone_timestamp: string
      next_action: string
      blockers: list
      checkpoint_commit: string
      focus_task_id: string
      ready_count: integer
      blocked_count: integer
      tokens_spent: integer
      prompt_tokens: integer
      completion_tokens: integer
      tokens_remaining_percent: integer
      rate_limit_remaining_percent: integer
      task_tree: list
      loop_state: string
      output_mode: "compact-json"
    rendering_notes:
      - "Show before/after as blocky progress bars."
      - "Show the latest milestone timestamp in absolute time and elapsed time."
      - "Show the last N progress points as a trend bar and an average delta."
      - "Render only active work and its dependency tail as a compact tree with one line per node."
      - "Treat anonymous stream events as evidence only; they may advance the current focus bar but must not become standalone tree nodes."
      - "Ask agents to file an immediate bootstrap refinement note to ./methodology/event/ or ./plan/issues/ before edits begin, then refresh it after each meaningful substep so live progress is visible before the session ends."
      - "Keep progress notes modest and portable; use plain repo paths instead of @-prefixed file references."
      - "Show token-spend metadata only when cheaply available from existing metadata; do not issue extra API calls to fetch it."
      - "If token metadata exists, surface both per-task token spend and the remaining percentage until rate limiting."
      - "Do not stream file-by-file changes in repeat mode unless explicitly requested."
      - "The repeat path is tokio-driven: child output, note-file changes, and heartbeat ticks should wake the live tree without a shell polling loop."
      - "Keep the live refresh minimal: headers, tree, trend, milestone, blockers."
      - "If no refinement note has arrived yet, render a bootstrap-pending line so cold-start silence is explicit instead of looking like completed work."
      - "Repaint when the running agent emits a new progress record; do not repaint on a blind timer."
      - "Distinguish between waiting on the agent process, agent working, and sleeping between iterations."
      - "Treat ./codex --quiet as one-shot noninteractive output and ./repeat --agent codex --repeat N --prompt ... as a bounded repeat loop."
      - "When repeat mode is cycling, a graph-summary build pass such as ./build.sh --ci-full --graphs may run between iterations and should stay compact."

  lease_protocol:
    purpose: >
      Make claims over tasks and file scopes explicit, idempotent, and recoverable.
      A later agent may reclaim a stale claim, but it must do so from the latest
      observable plan state rather than hidden memory.
    claim_rules:
      - "Claim by stable graph node ID and file scope hash."
      - "Repeated claim events with the same lease_id are no-ops."
      - "A conflicting claim on the same file scope becomes blocked until reconciled."
      - "A claim that goes stale must be revalidated by the next agent before editing."
      - "A cross-host claim touching plan, methodology, OpenSpec, or shared crates must record observed sibling branch heads."
    lease_fields:
      - lease_id
      - claimant_agent_id
      - graph_node_id
      - owned_file_scope
      - branch
      - host_id
      - platform
      - worktree_path
      - claimed_at
      - expires_at
      - last_heartbeat_at
      - upstream_commit
      - observed_sibling_heads
      - checkpoint_commit
    stale_recovery:
      - "A stale lease is not a failure; it is a cue to reload the plan and emit a fresh reading event."
      - "If two agents believe they own the same claim, the later one yields and reclaims a disjoint node."

  stale_tracking_policy:
    stale_after: "10 minutes without a new event for active work"
    reclaim_after: "the distributed-work lease expires, normally 4 hours"
    distinction: >
      Ten minutes without a heartbeat marks an active task stale for display and
      requires the next touching agent to fresh-read state before proceeding. It
      does not by itself release the lease. Reclaim is allowed only after the
      lease TTL in methodology/distributed-work.yaml expires, or after an
      explicit failed/released event.
    stale_action: >
      Mark the task stale and require the next agent touching it to emit a fresh
      reading or verifying event before continuing.
    recovery: >
      Reconstruct current task state from latest event per task_id, sorted by
      Lamport order. Conflicting latest events become blocked until reconciled.

  # ── Cycle metrics (order 575) ─────────────────────────────────────────────
  #
  # What a meta-orchestration cycle reports about ITSELF when it ends.
  # Producer: scripts/cycle-metrics.sh. Consumers: skills/meta-orchestration
  # (Cycle Metrics section) and skills/advance-work-from-plan (step 7.0).
  cycle_metrics:
    purpose: >
      Report what a cycle achieved in verifiable terms, and specifically whether
      the experts were USED and whether they were USEFUL. Those are two
      questions, and a single call counter answers neither honestly.
    used_vs_useful:
      used: >
        A volume question. Easy to measure, easy to game, and on its own silent
        about value.
      useful: >
        A quality question. An expert called two hundred times that REFUSES two
        hundred times is heavily used and completely useless.
      why_it_matters: >
        Order 531 was exactly that failure in production: every plan_answer
        returned confidence=unsupported because the forge was seeded from a
        branch carrying no expert sources, while the launch state truthfully
        reported `experts: ready` and every health signal read green. A call
        counter would have shown healthy adoption throughout the incident.
    headline_metric:
      name: answer_rate
      formula: "answered / (answered + unsupported)"
      denominator_rule: >
        `degraded` (the expert could not run at all) and `error` (protocol) are
        EXCLUDED from the denominator. A broken build is an infrastructure fact,
        and folding it into a quality ratio makes a wrong artifact look like a
        hard question — which is precisely how order 531 stayed hidden. Any
        change that folds degraded into the denominator must be refused.
    anti_gaming_rule:
      rule: >
        `answered` is reachable ONLY when the expert returns CITATIONS, and the
        compiled binary emits citations only when it resolved a real packet or a
        real YAML path. Calling a tool more times therefore cannot raise the
        answer rate; only answering more can.
      enforcement: >
        Any proposal that lets `answered` be reached without citations converts a
        quality signal into a volume signal and MUST be rejected on that ground,
        not debated as ergonomics. This is the same reasoning that keeps XP
        constraint-derived rather than activity-derived (packet 567): a metric
        that rewards activity is a privilege-escalation path wherever it gates
        anything.
    honest_limits:
      substitution: >
        "Did the agent query the expert INSTEAD of grepping the ledger?" is the
        metric that would best prove adoption. It requires the AGENT HARNESS's
        own tool-call log, which does not live in this repository. It is reported
        as `unknown` and MUST NOT be estimated.
      token_and_wallclock_efficiency: >
        Belongs to the harness for the same reason. Not derivable in-repo.
      rule: >
        Reporting a number the tooling did not produce is worse than reporting
        none: it makes an unmeasured thing look measured. `unknown` is a valid
        and required value.
    failure_mode_verdicts:
      - "attention:expert-answered-nothing-check-base-branch — the order-531 signature. The expert RAN every time and answered nothing, which means the ARTIFACT is wrong, not that the questions were hard."
      - "attention:experts-degraded-<n>-calls-could-not-run — infrastructure, not retrieval quality."
      - "attention:experts-never-called — the surface exists and no agent used it; an adoption problem, not a quality one."
    reporter_contract: >
      The reporter exits 0 whenever the report was produced. A metrics reporter
      that fails the cycle it measures is a metric that can take down what it
      measures; the VERDICT carries the judgement instead of the exit code. For
      the same reason the telemetry write at the MCP chokepoint is best-effort
      and can never break a tool call.
