
verification:
  s_levels:
    description: >
      Spec verification levels. Answer: "Is the spec stable, testable, and bound?"
      S-levels track the spec itself, not the code implementing it.

    S0:
      name: "draft"
      meaning: "Spec written but not yet verified"
      characteristics:
        - status field present
        - requirements listed
        - may have ambiguities
      progression_rule: "Manual review required to move to S1"

    S1:
      name: "syntactically valid"
      meaning: "Spec is well-formed YAML/markdown; all fields present"
      characteristics:
        - valid schema
        - all required sections present
        - modality is correct (MUST/SHOULD/MAY)
        - ambiguity_score is 0
      progression_rule: "Automated validator can check S1"

    S2:
      name: "litmus-bound"
      meaning: "Spec has executable litmus tests binding requirements to observable signals"
      characteristics:
        - litmus tests defined and passing
        - every MUST requirement has at least one litmus signal
        - requirements are measurable
        - success/failure conditions are unambiguous
      progression_rule: "Litmus test execution validates S2"

    S3:
      name: "runtime-validated"
      meaning: "Spec is continuously validated in production; code drifts are caught immediately"
      characteristics:
        - litmus tests run in CI and gate PRs
        - runtime traces emit spec linkage
        - convergence engine tracks spec-code drift
        - spec-code alignment is monitored

    convergence:
      criteria:
        - all_MUST_requirements_have_passing_litmus
        - ambiguity_score_equals_zero
        - invariants_stable_over_N_iterations
      stability_window:
        iterations: 5
  l_levels:
    description: >
      Code annotation verification levels. Answer: "What evidence supports this

    L0:
      name: "spec only"
      meaning: "Annotation cites a spec; no additional evidence yet"
      characteristics:
        - spec exists and is active
        - code compiles and annotation is syntactically valid
      claim: "This function implements the spec"
      evidence: "Spec exists"

    L1:
      name: "spec + cheatsheet"
      meaning: "Spec is cited; cheatsheet sources confirm the spec's requirements"
      characteristics:
        - spec exists
        - at least one cheatsheet supports the implementation
        - cheatsheet has provenance and is up-to-date
      claim: "Implementation approach matches spec intent and tool idioms"
      evidence: "Spec + cheatsheet sources confirm"

    L2:
      name: "spec + cheatsheet + api lookup"
      meaning: "Spec and cheatsheets confirmed; API documentation validates signatures"
      characteristics:
        - spec, cheatsheet, and API docs all agree
        - no version mismatches
        - API calls match documented behavior
      claim: "Implementation uses correct API with correct arguments"
      evidence: "Spec + cheatsheet + API docs aligned"

    L3:
      name: "spec + cheatsheet + api + runtime validation"
      meaning: "Full stack verified: spec, cheatsheets, APIs, and litmus tests all pass"
      characteristics:
        - spec is S2 or S3 (litmus-bound)
        - litmus tests pass
        - code executes the spec's critical path
        - traces emit at runtime
      claim: "Implementation satisfies spec under observed conditions"
      evidence: "Spec + cheatsheet + API + litmus tests all validated"

    rules:
      - declared_level_is_claim
      - ci_validates_against_observed_level
      - mismatch_causes_failure_or_downgrade
      - upward_pressure_on_failure
      - downward_pressure_on_stability

  cheatsheet_intent_audit:
    description: >
      Cheatsheets are the operational memory of intent. They should record both
      recommended implementation idioms and anti-patterns observed in upstream
      APIs, docs, or runtime behavior.
    required_content:
      good_centipawns:
        - "stable variable names that match spec terminology"
        - "command shapes and flag combinations that are known-good"
        - "narrow, explicit API usage with verified signatures"
        - "short-circuit boundaries and entry-gate checks"
      bad_centipawns:
        - "runtime path discovery / location probing"
        - "blocking work in hot paths"
        - "implicit retries or polling without explicit gating"
        - "host-specific assumptions hidden behind fallback logic"
        - "obsolete API calls or deprecated flags"
    rule: >
      If an upstream API or docs source names a bad practice, the corresponding
      cheatsheet SHOULD record it as a bad centipawn and the spec SHOULD forbid
      it when it affects behavior, safety, or convergence.
    audit_flow:
      - spec_clause_to_cheatsheet_entry
      - cheatsheet_positive_idiom
      - cheatsheet_negative_idiom
      - api_doc_validation
      - litmus_binding_or_tombstone_update

  evidence_bundle:
    description: >
      Evidence bundles collect the concrete artifacts behind convergence claims.
      They prevent version numbers, annotations, or passing tests from being treated
      as standalone proof.

    required_fields:
      - spec_ids_and_versions
      - spec_hashes
      - artifact_version_and_hash
      - commit_hash
      - dependency_lock_hash
      - environment_profile
      - litmus_run_ids_and_results
      # Produced by `scripts/trace-coverage.sh --json` since 2026-08-09; see the
      # note on the same field in methodology/convergence.yaml.
      - trace_coverage_summary
      - litmus_chain_reference
      - ci_run_id
      - centicolon_signature_hash
      - centicolon_projection_ref
      - annotated_source_archive_hash
      - centicolon_dashboard_hash
      - projection_source_equivalence_result
      - failing_boundary_chain
      - troubleshooting_log_refs

    claim_strength:
      provenance: "artifact, spec, and commit can be linked"
      structural: "schemas, annotations, bindings, and dependency locks are valid"
      behavioral: "litmus tests exercise the claimed behavior and pass"
      operational: "runtime traces remain stable in declared environments"

    rule: >
      A release, annotation, or convergence report MUST cite the evidence bundle and
      its highest supported claim strength.

    release_rule: >
      A release evidence bundle MUST include validated CentiColon metrics and the
      generated CentiColon projection reference. If projection source equivalence
      fails, the release cannot claim structural or higher evidence strength.

    dashboard_rule: >
      A release evidence bundle SHOULD link to the generated CentiColon dashboard
      markdown and JSON summary so humans can browse the last N releases and agents
      can consume the same trend data deterministically.

  troubleshooting_chain:
    description: >
      The evidence bundle should preserve enough chain-of-failure information to
      resume an interrupted convergence loop. `--init --debug` and `--status-check`
      are examples of useful chained boundaries because they surface the stack
      setup, the failing layer, and the runtime smoke in one traceable sequence.
    required_properties:
      - failing_boundary_is_named
      - logs_are_linked
      - next_pass_can_resume_from_last_boundary
      - unchanged_observation_window_is_recorded
      - chain_reference_is_present

  litmus_verification_integration:
    description: >
      Litmus tests are the bridge between spec S-levels and code L-levels.
      A litmus test validates that code satisfies the spec.

    verification_levels_in_litmus:
      L0_specs:
        definition: "Litmus test defined (written but not run in CI)"
        enforcement: "Warn if missing"

      L1_specs:
        definition: "Litmus test passes on reference implementation"
        enforcement: "Require passing test"

      L2_specs:
        definition: "Litmus test executes in CI and gates PR merges"
        enforcement: "Block merge on failure"

      L3_specs:
        definition: "Litmus test result drives automated remediation"
        enforcement: "Escalate to human review if persistent failure"

    progression:
      - all_specs_must_achieve_L1
      - critical_path_specs_must_achieve_L2
      - new_or_updated_specs_must_include_chain_reference
      - convergence_requires_L2_minimum

    ci_gating:
      L0_specs: warn_if_no_litmus
      L1_specs: require_litmus_pass
      L2_specs: block_merge_on_failure

  # Order 890-nkdz. Four measurement rules and one review rule were ratified as
  # fleet practice on 2026-08-25 during a cross-host performance characterisation
  # and lived only in session transcripts — the shape that cost this project
  # 801-qasc (a marker that was prose), 660-ryhn (an unbound litmus) and 709-in2f
  # (a methodology claim about a packet that had no script). Each rule below
  # carries the error that earned it; the two mechanical ones are ENFORCED, the
  # two judgment ones are recorded as judgment rather than dressed as mechanism.
  measurement_practice:
    rules:
      - id: forced_only_gate_timings
        kind: mechanical
        rule: >
          A cross-host comparison of `build_check_ms_avg` uses ONLY forced runs
          (`TILLANDSIAS_FORCE_CHECK=1`). Since 765-tkq2 an unchanged tree returns
          `ok:gate-fresh` in ~0.4s, so a mean over a mix of memoised and forced
          runs encodes how many no-op runs a host happened to do, not how fast it
          is. A host quoting a mixed mean must say so.
        earned_by: >
          A host's own 39171 ms mean was such a mixture and was compared across
          the fleet before anyone asked which runs were in it.
        enforced_by: >
          scripts/cycle-metrics.sh labels the emission at the source —
          `build_check_mix=mixed:forced=N,memoised=M` appears whenever the
          contributing log holds any memoised run and is ABSENT only when every
          run was forced; the mean itself never includes memoised records.
          Pinned by litmus:cycle-metrics-answer-rate-shape (RED before the
          labelling change, green after).
      - id: portable_measurement_tools
        kind: mechanical
        rule: >
          Measurement scripts that run on more than one host use only forms every
          host's shell and coreutils accept: no GNU-only date, du or sed forms
          without the documented exemption marker and a BSD-first fallback.
        earned_by: >
          A BSD date succeeds with garbage output on a GNU-only format, so an
          exit-code guard cannot catch it; the day-boundary fixture reproduced
          exactly that on 2026-09-02 before its reconstruction used BSD -r first.
        enforced_by: >
          scripts/check-bash-dialect.sh refuses GNU-date and (since 886-yizb)
          GNU-du forms in shared scripts; wired into ./build.sh --check.
      - id: measure_a_host_against_itself
        kind: judgment
        rule: >
          A performance claim about ONE variable (WSL2 native-ext4 vs /mnt/c;
          Silverblue toolbox vs host-native) is measured on one host across that
          variable only, which holds hardware generation, kernel, distro and
          toolchain constant by construction. Two hosts differ in all of them at
          once, so any cross-host gap is unattributable.
        earned_by: >
          The 2026-08-25 characterisation compared hosts of different generation
          and distro and could attribute nothing.
        enforced_by: "judgment — recorded here so it is not re-derived; a rule that cannot be enforced says so"
      - id: falsifier_before_the_numbers
        kind: judgment
        rule: >
          No cross-host performance claim without a stated falsifier committed
          BEFORE the numbers arrive — including the result that would mean the
          experiment does not show what it was designed to show.
        earned_by: >
          Same characterisation: results were read after the fact for whatever
          they seemed to say. See also peer_falsification in distributed-work.
        enforced_by: "judgment — the falsifier is filed as a ledger event before the reading (as 811-28eh did on 2026-09-02)"
      - id: a_zero_is_evidence_only_if_the_check_ran
        kind: judgment
        rule: >
          A count of zero, an empty result set, or a silent pass is evidence
          ONLY once you know the command executed. Before reporting an absence,
          confirm the check ran — a non-empty positive control in the same
          invocation, or the command's own stderr read rather than discarded.
          This is the general form of `a check that could not run never claims
          what it would have found` (965-sxec), which the gate enforces for
          gate-resident checks; the rule exists because the same failure recurs
          in AD-HOC verification, where nothing enforces it.
        earned_by: >
          2026-09-04, verifying six landed bullets against origin: four checks
          reported 0 and were never executed, because `$R:scripts/...` in zsh
          hits the `:s` history modifier. Each printed `bad substitution` beside
          its 0. A check that could not run reported the same 0 as a check that
          ran and found nothing, and the zeros fitted the plausible story
          ("those bullets did not land"). Caught only because stderr happened to
          be interleaved; any pipe dropping stderr would have left four clean
          zeros standing as evidence, and two present bullets would have been
          reported missing to their author.
        enforced_by: "judgment — recorded so it is not re-derived; the sibling mechanical rule is 965-sxec's gate arm"
      - id: a_null_result_needs_a_positive_control
        kind: judgment
        rule: >
          "I looked and found nothing" is evidence only once you have shown the
          METHOD FINDS THE THING WHEN IT IS THERE. Before reporting a null
          result, run the same probe, unchanged, against an input known to
          contain what you are looking for. A zero from a probe that cannot
          match is indistinguishable from a zero from a probe that matched
          nothing, and both exit 0. This is the SIBLING of
          a_zero_is_evidence_only_if_the_check_ran and not the same rule: that
          one asks whether the command EXECUTED, this one asks whether it could
          have DETECTED. A probe can run perfectly and still be blind.
        earned_by: >
          2026-09-05, macneo, scanning a preserved guest image for the guest
          binary's version to decide whether a control-wire failure was version
          skew. The scan returned 0 matches, exit 0, in 5m20s — a clean-looking
          result that would have been reported as "no old binary present, skew
          eliminated". Run against a binary KNOWN to carry the string, the same
          regex also returned 0: the version occurs BARE in a Rust string table
          packed against unrelated literals
          (`...host-guesttillandsias-control-channel56.9.5.1`), so a pattern
          with a `tillandsias-headless ` or `Tillandsias v` prefix could never
          match. The positive control failed and the null result meant nothing.
          Caught before it left the host only because the control is reflex.
          Fourth instance that week of a result that looked like data and was an
          artefact of the instrument.
        earned_by_second: >
          SAME DAY, SAME HOST, INSIDE THE MESSAGE PROPOSING THIS RULE. macneo
          reported "79e3ca876 ADDED NO STRING LITERALS" as a measured fact. The
          probe was `grep -oE '"[a-z0-9_:.-]{12,60}"'` — lowercase only, no
          spaces, 12 to 60 characters — and it returned 0 because it could not
          match a literal containing a space or a capital. A broad
          `"[^"]{4,80}"` returns 21. The operative conclusion survived only
          because the coordinator checked WHERE the 21 live (shell scripts,
          comments and `#[cfg(test)]` blocks, so none reaches the shipped guest
          binary); had one been a shipped literal the claim would have been
          wrong with no instrument to say so. THE FAILURE MODE IS NOT DISBELIEF
          IN THE RULE — it is not noticing that a casual command IS a
          measurement. A one-line grep quoted in a message is a probe and needs
          the same positive control as a five-minute scan.
        enforced_by: "judgment — recorded so it is not re-derived; state the positive control's result beside the null one, or the null one is not reportable. A grep typed into a message is a probe."
      - id: print_the_denominator
        kind: judgment
        rule: >
          A count of FINDINGS without a count of THINGS EXAMINED is
          unfalsifiable. Every probe that reports a number must report how much
          it looked at, in the same output, so the control travels IN the
          measurement rather than beside it where it can be forgotten. A zero
          findings over a stated denominator is evidence; a bare zero is not
          distinguishable from a probe that never executed.
        earned_by: >
          2026-09-05, macneo, auditing a patch for whitespace hazards before a
          relay. The per-part audit reported ZERO trailing-whitespace and ZERO
          empty lines in BOTH parts, while a whole-file run moments earlier had
          listed empty lines at 9, 12 and 18 — two of the same host's
          measurements contradicting each other. Cause: `set -- $r` to split
          "1 291" into two arguments, and ZSH DOES NOT WORD-SPLIT UNQUOTED
          PARAMETER EXPANSIONS, so $1 was the whole string, $2 was empty,
          `NR>=a && NR<=b` was never true, and the awk block NEVER EXECUTED. It
          exited 0 and printed zeros. The tell was in the output the whole time
          — the header rendered `lines 1 291-:` instead of `lines 1-291:` — and
          was noticed only because two numbers disagreed. Re-run with an
          explicit `scanned=` counter: 291 and 179 lines, exactly the two
          ranges, so the block demonstrably ran. This is the same shape as the
          zsh `:s` history-modifier failure four hours earlier on another host.
          Both of that day's blind probes would have been caught instantly by a
          denominator.
        earned_by_second: >
          SAME DAY, SAME HOST, APPLIED TO A MUTATION RATHER THAN A MEASUREMENT.
          macneo sabotaged a doc guard by removing its required phrase and ran
          the guard: IT PASSED, which should have meant the guard was worthless.
          It did not — the SABOTAGE was worthless. The replace had been written
          with a leading `    /// ` included while the phrase sits mid-line after
          other text, so it matched nothing and the guard was run against an
          UNCHANGED file. Fixed by making the mutation report its own
          denominator: count the needle before and after, assert the file
          actually changed (2 occurrences to 1), then run — and the guard then
          failed as it should. A SABOTAGE ARM IS A PROBE TOO, and "the test
          passed under sabotage" is evidence only once the sabotage is shown to
          have applied. A green sabotage silently certifies a blind test, which
          is worse than no sabotage at all because it manufactures confidence.
        enforced_by: "judgment — a probe that cannot report how much it examined has a zero that is not reportable; a mutation that cannot show it changed the file has a red that proves nothing"
      - id: a_discriminating_probe_needs_both_controls
        kind: judgment
        rule: >
          A NON-null result needs a control too, and a different one from the
          null case. A count is evidence of a DIFFERENCE only once you have
          shown the probe distinguishes the two cases: a POSITIVE control on the
          case you expect to match, and a NEGATIVE control on the case you
          expect NOT to match. Without both, a large count is evidence that the
          string exists, which is usually not the question. And allow for a
          THIRD outcome besides "clean" and "mixed": the probe may be blind by
          construction, which is a stronger and less comfortable verdict than
          inconclusive.
        earned_by: >
          2026-09-05, macneo, deciding whether a control-wire failure was
          version skew by scanning a preserved guest image. The scan returned 57
          hits for the old version string, which reads as an answer. A POSITIVE
          control on the NEW binary found five copies of the same string, so the
          marker is present in both cases and separates nothing. A second marker
          (`tillandsias-control-channel`) died to a NEGATIVE control: `git grep`
          at 79e3ca876^ showed it predates the commit by two orders. The two
          probes failed for DIFFERENT mechanisms and only running both controls
          found both. The structural reason closes the approach rather than the
          probes: for the guest binary, 79e3ca876 added no string literal that
          reaches the shipped artefact — its additions are in shell scripts,
          comments and `#[cfg(test)]` blocks, verified independently on
          macuahuitl — so it flips a default without changing any shipped
          string, and NO string scan of that binary can detect it. Verdict: the
          instrument cannot answer the question; skew neither eliminated nor
          established.
        enforced_by: "judgment — report the positive and negative control results beside the count, or the count is not evidence of a difference"
      - id: state_the_asymmetry_before_the_result
        kind: judgment
        rule: >
          When a probe can only settle a question in ONE direction, say which
          direction BEFORE running it. A method whose clean answer eliminates a
          hypothesis but whose dirty answer establishes nothing must publish
          that asymmetry in advance, or the outcome that arrives gets read as
          the interesting one after the fact. THE ASYMMETRY PROTECTS THE
          INTERPRETATION; THE POSITIVE CONTROL PROTECTS THE MEASUREMENT. They
          are different instruments and a claim usually needs both.
        earned_by: >
          2026-09-05, macneo, on the same guest image: a raw-image string scan
          finds matches in allocated blocks AND in freed-but-unzeroed ones, so
          only a real mount resolves a path to an inode. Stated in advance: a
          clean answer ELIMINATES version skew, a mixed answer does NOT
          establish it. Published before the data arrived, which is what stopped
          "clean" being pre-authorised as the interesting outcome when the first
          probe returned a spurious zero.
        enforced_by: "judgment — the asymmetry is written into the message or the ledger event before the probe runs"
      - id: quoted_history_lives_in_comments_guards_scan_declarations
        kind: judgment
        rule: >
          A comment explaining a rename or a narrowing MUST quote the claim it
          replaced — a narrowing is unreadable without the sentence it narrowed,
          and stripping the quote leaves "this used to say something else",
          which is worthless. It follows that a codebase which explains itself
          CONTAINS THE STRINGS IT FORBIDS. So a guard for a retired identifier
          or a retired claim scans DECLARATIONS (`pub <field>:`, `fn <name>`),
          never the bare substring, and assembles its needles at runtime so it
          does not match its own text.
        earned_by: >
          980-ja2m, 2026-09-04: `vm_owner_live` and `and is still materializing
          it` both survive deliberately in doc comments that explain why they
          were retired, and a substring guard would trip on the documentation
          that justifies the change. Ruled by macneo-macos, who owned the
          design, after the reproducing host declined to adjudicate its own
          comment.
        enforced_by: >
          scripts/check-tray-process-running-naming.sh is the worked example —
          it forbids two DECLARATIONS, REQUIRES the new one (two forbid-arms
          alone pass on a file with the field deleted, a different defect
          wearing the fixed state's clothes), and builds its needles by
          concatenation.
        earned_by_fourfold: >
          THE SAME FILE DEMONSTRATED IT FOUR TIMES IN ONE DAY, twice inside the
          text explaining it. lenovinha, 2026-09-05, on
          scripts/test-trace-coverage.sh: the ghost-trace ratchet flagged (1) a
          synthetic trace marker written literally in the fixture, then (2) the
          COMMENT explaining that hazard, which spelled the marker out — the
          warning reproducing the defect it warned about. A repair the same day
          added (3) a third instance in an assertion that grepped for the literal
          marker to check the validator's trailer, and (4) a fourth in the first
          draft of the comment explaining that the third had just happened. The
          fourth was caught only by grepping their own fix before re-gating,
          rather than by trusting a lesson they were in the middle of writing
          down.
        rule_general_form: >
          A FILE THAT CONTAINS THE STRING IT REASONS ABOUT IS A FALSE POSITIVE
          FOR EVERY SCANNER KEYED ON THAT STRING, AND PROSE IS NOT EXEMPT. The
          scanner cannot distinguish an assertion from a mention and should not
          have to; the discipline belongs on the author. Assemble the needle at
          runtime — in fixtures, in assertions, and in the comments about both.
      - id: an_explanation_offered_before_the_evidence_disarms_the_detector
        kind: judgment
        rule: >
          Do not supply a probable cause for a failure that has not yet been
          observed. A ready explanation arriving BEFORE the evidence stops the
          search that would find the real cause, and it does most damage when
          it travels beside something correct, which lends it credibility.
          Corollary, absolute: A CHECKSUM MISMATCH IS NEVER EXPLAINABLE IN
          ADVANCE. If it mismatches, the reassembly is wrong; no account of why
          makes it right.
        earned_by: >
          Four instances in one day, 2026-09-04, across three hosts. "landing
          now" beside three settled measurements, read as landed. "If you see
          unknown, the jq did not apply" — a symptom with two causes, sending
          the reader to the wrong layer. "If your reassembly shows two
          backslashes, that is transport doubling" — written by the author who
          had doubled them, which would have talked the reader out of the md5
          that caught it. And a negative control written against the shape
          already refused, so it agreed with its hypothesis without testing it.
        enforced_by: "judgment — the mechanical half is that checksums and per-item origin checks are run before any narrative is offered"
    review_rule:
      id: threshold_of_zero_tests_only_the_comparison
      source: 886-yizb
      rule: >
        A threshold test that sets the threshold to zero is testing `>=`. Any
        gate that measures and then compares needs one leg where the MEASUREMENT
        ITSELF is the assertion.
    probe_protocol_v1:
      purpose: "near-pure filesystem stat traffic — discriminates stat-bound checkouts from compute-bound ones"
      steps:
        - "warm twice with `cargo check --workspace --all-targets`, discard"
        - "`/usr/bin/time -p sh -c 'i=0; while [ $i -lt 20 ]; do cargo check --workspace --all-targets >/dev/null 2>&1; i=$((i+1)); done'`"
        - "report real/user/sys, real/20 as ms per no-op, `git ls-files | wc -l`, the checkout's filesystem, RAM, physical cores, and whether the toolchain is host-native or crossed"
      regime_note: >
        The Darwin leg measured user 2.05s vs sys 1.09s over 20 no-ops —
        stat-bound rather than compute-bound, which is what makes the probe
        discriminating. Attach the regime to every reading (host, filesystem,
        toolchain) or the number becomes a fleet rule that is wrong on half the
        hosts.
