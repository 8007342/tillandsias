distributed_work:
  version: v0.1
  purpose: >
    Define the CRDT-inspired primitives that let any agent on any host
    discover, claim, execute, checkpoint, hand off, and complete units of
    work from a shared `plan/` ledger — without a central coordinator and
    without requiring the originating agent or session to still exist.
  authority:
    - Cited from methodology.yaml entrypoints.
    - Citable by plan/steps, plan/issues, and openspec/changes.
    - Subordinate to methodology.yaml, methodology/multi-host-development.yaml,
      and methodology/versioning.yaml when they conflict.

  crdt_principles:
    rationale: >
      Multi-host, multi-agent, multi-session work has the same shape as a
      distributed system: writers are independent, partitions are common
      (laptops sleep, sessions die, agents are killed mid-task), and we
      cannot rely on a coordinator. We borrow patterns from conflict-free
      replicated data types so that any agent can act on its local view
      and produce updates that merge deterministically with any other
      agent's updates.
    invariants:
      stable_ids:
        rule: >
          Every claimable unit of work has a globally unique, content-derived
          stable ID. Two agents producing the "same" unit produce the same
          ID. IDs MUST NOT embed agent identity, host, or timestamp.
        encoding: >
          `<kind>/<short-kebab-summary>` for human-written items;
          `<kind>/<sha256-prefix-12>` when minted from content.
        examples:
          - step/multi-host-plan-ledger-adoption
          - issue/control-socket-protocol-convergence-2026-05-25
          - change/vm-recipe-provisioning
      append_only_history:
        rule: >
          Plan-ledger files are append-only. Agents add events to the end of
          a log section; they do not rewrite earlier entries. Current state
          is the fold (left-fold) of the event sequence keyed by stable ID.
        why: >
          Two agents racing to update the same item produce two appends
          rather than a write-write conflict.
        implementation:
          decided_by: "The Tlatoāni, 2026-08-01"
          cheatsheet: cheatsheets/concurrent-git/crdt-ledger-fragments.md
          status: >
            Reading is IMPLEMENTED and transparent. Compaction is IMPLEMENTED,
            text-level, and proven on the real ledger as of 2026-08-03; see
            compaction_is_text_level below.
          history: >
            This rule was written 2026-05-25 and the implementation contradicted
            it for over two months: one monolithic plan/index.yaml that every
            host edits in place, which is the exact write-write conflict the rule
            forbids. Concurrent filing therefore produced a git conflict a human
            had to adjudicate — three times in one session on 2026-07-31/08-01.
          shape: >
            plan/index.yaml is a COMPACTED BASE. plan/index.d/*.yaml are
            FRAGMENTS: append-only, immutable once written, named
            <utc>-<suffix>-<host>.yaml. A read is base ⊕ fold(fragments).
            Two properties do all the work: one writer per file (a host writes a
            NEW path only it could have produced, so git never conflicts), and
            fragments are never edited after writing (which is what makes the
            fold order-independent).
          crdt_type_per_field: >
            packets: a G-SET keyed by packet_id — union is commutative,
            associative, idempotent. events: a G-SET of events keyed by
            (packet_id, event identity). status: an LWW-REGISTER resolved by
            (ts, host). Applying LWW to a LIST would silently discard the loser's
            entries, which is why events are a set and not a register; that
            distinction is the whole correctness argument.
          determinism: >
            Fragments fold in filename order, and the name is UTC-first so a
            lexical sort is chronological. Never fold in directory order — the
            filesystem promises none, and two hosts folding differently would
            compute different states from identical inputs, presenting as
            corruption rather than as a sorting bug. The fold is IDEMPOTENT so a
            compaction that dies halfway is safe to re-run.
          every_reader_must_use_the_overlay: >
            A reader that opens plan/index.yaml directly sees only the base and
            reports a stale ledger WITH TOTAL CONFIDENCE. If the CLI, the MCP
            server and the expert disagree about what the plan says, an agent
            cannot tell which surface is lying and both look authoritative. Route
            every read through tillandsias-plan, or document the reader as
            base-only with a stated reason.
          compaction: >
            Folds fragments into the base and deletes EXACTLY the ones it folded,
            BY NAME — never a glob. A fragment written by another host while
            compaction ran has not been folded, and globbing it away silently
            destroys filed work; that is the classic GC-versus-writer race and
            the most likely way to lose data in this design. Compaction is
            OPTIONAL and must never sit on the critical path of filing work: an
            uncompacted ledger is slower to read, never wrong.
          compaction_is_text_level: >
            RESOLVED 2026-08-03 (order 582-4wdi, commit 81e12b65). Compaction is
            TEXT-LEVEL: it never re-serializes the base, so existing bytes are
            untouched by construction. First real-ledger run folded 28 fragments
            with 120 comment lines preserved exactly, 535 packets preserved, and
            a plan/index.yaml diff of 1021 added lines and ZERO removed lines.
            That zero is the invariant to protect. The candidate base must still
            PARSE and pass the integrity gate before it may replace the base; a
            malformed merge REFUSES with the base unchanged.
          history_why_it_was_fail_closed: >
            VERIFIED 2026-08-01, retained because it is the regression to guard
            against: serde_yaml is not format-preserving. It DROPS COMMENTS
            (plan/index.yaml carries ~120, including ratified operator decisions
            recorded inline) and re-indents list items to column 0, while
            edit::append_event locates packets by a literal four-space prefix —
            so a round-tripped ledger silently stops accepting events on every
            packet. Compaction refused for two months rather than fold lossily,
            and that refusal was correct. If compaction ever regresses to
            round-tripping YAML, restore the refusal; do not accept a lossy fold
            to make the tool run.
          concurrency_block: >
            ORDER 627-c9c2. plan/index.yaml is a CONCURRENCY BLOCK: direct
            in-place updates are forbidden for normal work. Every normal
            ledger change — filing a packet, appending an event, correcting a
            field — flows through a NEW plan/index.d/ fragment (via
            tillandsias-plan set-field, or a fragment file only you could
            have named), never through an edit to the base. The base admits
            exactly one writer, compaction, under the guards below. A direct
            base edit forfeits both properties the design rests on (one
            writer per file; immutable once written) and, when pushed through
            the enclave mirror, is additionally refused by the mirror's YAML
            gate — see mirror_psych_gate.
          fragment_repair_is_a_correction_fragment: >
            ORDER 1071-adhj, 2026-09-05. The rule above forbids editing the
            BASE in place. This one forbids editing a FRAGMENT in place, which
            is the case that actually bit, because a fragment looks editable in
            a way the base does not — it is small, you wrote it, and the repair
            is one missing key. A fragment repair is a NEW CORRECTION FRAGMENT
            declaring the same packet_id with the corrected field. Never an
            amendment to the fragment already written, and never by a second
            party under any circumstances. Corrections compose under the
            G-Set union; two in-place amendments of an append-only file do not.
            EVIDENCE, and the collision is the argument. The coordinator amended
            1067-24q6 and 1068-cxmf on trunk to add missing scorable blocks;
            another host amended the same two files locally, having checked
            origin/linux-next and found the repair absent. The next merge
            combined both edits additively, each file ended with TWO
            unscoreable: keys, and a duplicate mapping key is not valid YAML:
            blocked:all-fragments-intact:2 damaged, and
            blocked:fragment-events-land:3 event(s) attached to no packet —
            the second a consequence of the first, since an unparseable
            fragment contributes no packet and its own events orphan.
            NEITHER HOST WAS CARELESS AND THAT IS WHY IT NEEDS A RULE RATHER
            THAN MORE CARE. Both checked before editing. The safeguard is what
            failed: both consulted trunk to see whether the other's repair had
            landed, and trunk is the view 1034-whsp measured as HOURS stale for
            a platform host (relay gaps 19m to 2h02m). A check that cannot see
            in-flight work is not a check, so an in-place amendment by a second
            party is a race neither party can observe. check-all-fragments-intact
            already says the consequence in its own refusal: damage here is not
            a merge to resolve but a file to restore from its authoring commit.
            THE GUARD THAT USED TO FORBID THE FIX NOW ALLOWS IT.
            check-scorable-obligation-added.sh judged one fragment's bytes, so a
            declaration whose obligation arrived in a correction was still
            refused and the author was pushed back into the in-place edit. It
            now asks whether the packet AS FOLDED carries an obligation — a
            union scan over fragments, since the predicate is monotone under the
            G-Set, needing no plan binary and costing 36ms over 585 fragments
            plus the base. If you are ever told to amend a fragment to satisfy a
            gate, the gate is wrong; say so rather than editing.
          mirror_psych_gate: >
            ORDER 627-c9c2, learned from a twice-rejected forge push
            2026-08-09. The enclave git mirror's pre-receive hook
            (images/git/pre-receive-hook.sh) validates every changed .yaml
            file — with tillandsias-policy validate-yaml when the image
            carries it, else ruby -ryaml YAML.load_file, which in Psych 5 is
            safe_load with an EMPTY permitted_classes list. Psych 5 speaks
            YAML 1.1, where a BARE ISO timestamp
            (ts: 2026-...Z, unquoted) builds a Time object — refused as
            Psych::DisallowedClass. Consequences, in force: (1) fragments
            QUOTE every timestamp-shaped scalar; the tillandsias-plan writers
            do this for ts: lines, LWW value: lines (775-b4qz) and
            compaction's folded output (quote_timestamp_line) — one more
            reason never to hand-author a fragment. (2) The base
            plan/index.yaml carries ~110 HISTORICAL bare timestamps that
            text-level compaction must not rewrite, and the hook validates
            the whole changed file, not the diff — so ANY commit touching the
            base fails the mirror wholesale. Compaction therefore runs only
            on hosts whose push channel reaches upstream directly (gh
            keyring/token), never from a forge routed through the mirror; a
            mirror-routed cycle that needs a ledger write reroutes it through
            a fragment, which is always sufficient for normal work.
        exceptions:
          - "Status fields in YAML index files (plan/index.yaml) ARE
            last-writer-wins; this is the trade-off for queryability.
            Agents updating a status SHOULD include a progress_note
            describing what changed."
          - "Tombstones supersede prior content; never DELETE — write a
            tombstone block that points at the canonical replacement."
      idempotent_operations:
        rule: >
          Re-running the same claim, the same checkpoint write, or the same
          completion event MUST yield the same observable state. Agents
          MUST be safe to retry on failure without checking 'did I already
          do this'.
        mechanism: >
          Stable-ID + event-type + lease_id + monotonic seq within the
          agent's claim. A second `claim` event for the same lease_id is a
          no-op upsert.
      commutative_writes:
        rule: >
          Writes from different agents to different stable IDs commute.
          Writes from different agents to the SAME stable ID are reconciled
          by stable-ID-keyed semantic merge (see [[merge_policy]]).
        ordering: >
          When ordering matters, agents tag the event with their host
          identity and a UTC ISO-8601 timestamp; the fold is timestamp-major
          host-minor.
      no_central_coordinator:
        rule: >
          No agent waits for another agent's permission to start, claim,
          or finish work. Conflict detection happens at merge time
          (`git pull --rebase` or `git merge`) — not at action time.
        consequence: >
          Two agents may race on the same claim; one wins the lease
          (whoever's commit pushed first), the other notices on its next
          fetch and either piggybacks (if its work is additive) or yields
          (releases its claim, picks a different item).
      lease_with_ttl:
        rule: >
          A claim is a lease, not a lock. Leases carry a TTL (default 4
          hours) and an expires_at. An agent that intends to keep working
          past expires_at MUST renew by re-emitting the claim event.
          Other agents MAY reclaim an expired lease.
        heartbeat_note: >
          Agent observability may mark active work stale after 10 minutes without
          a heartbeat, but that is a display/fresh-read signal, not permission to
          reclaim the lease before expires_at.
        why: >
          Agents die (process killed, laptop sleeps, network drops).
          Without TTL, dead agents would block forever.

  work_item_schema:
    rule: >
      Each claimable unit of work is described by one YAML or Markdown
      block bearing this schema. Stored under plan/steps/, plan/issues/,
      or openspec/changes/.
    fields:
      id:
        kind: required
        format: "<kind>/<slug>"
        note: "Globally unique, content-stable per [[crdt_principles.invariants.stable_ids]]."
      type:
        kind: required
        enum: [spec, feature, fix, docs, methodology, integration, housekeeping]
      title:
        kind: required
        format: "one-line human summary"
      owner_host:
        kind: required
        enum: [linux, windows, macos, any, none]
        note: >
          `any` = any host can pick it up. `none` = informational only,
          not claimable. `linux`/`windows`/`macos` = host-pinned.
      capability_tags:
        kind: optional
        type: list-of-string
        examples:
          - rust
          - gtk
          - win32
          - appkit
          - docs
          - testing
          - forge
        note: >
          Agents filter eligible work by intersecting their declared
          capabilities with these tags. The `forge` tag marks a packet an
          IN-FORGE agent may pick up (see [[in_forge_agent_self_service]]).
      desired_release:
        kind: recommended
        format: "vMAJOR.MINOR (sequential release bucket, e.g. v0.4)"
        note: >
          The sequential numbered release this packet is DESIRABLE BY — its
          ship-bucket. Distinct from `release_target` (a milestone-packet
          grouping): a packet may carry BOTH (belongs to milestone M, desired
          by v0.4). Releases are stability-gated, not time-based, and strictly
          sequential (v0.3 → v0.4 → v0.5 …). Cross-platform/cross-host
          dependencies are gated by assigning the dependent a release >= its
          upstream's. Full model: [[version_aware_release_planning]]. Unmarked
          open packets default to the active release-in-progress until the
          coordinator curates them.
      status:
        kind: required
        enum: [pending, claimed, in_progress, blocked, done, failed]
        rule: "Last-writer-wins per [[append_only_history.exceptions]]."
      lease:
        kind: present_when_claimed
        fields:
          lease_id: "<sha256-prefix-12> minted by claimant"
          agent_id: "free-form identifier (e.g. 'linux-tlatoani-fedora-claudia-cli-2026-05-25T06')"
          host: "linux | windows | macos"
          acquired_at: "UTC ISO-8601"
          expires_at: "UTC ISO-8601, default acquired_at + 4h"
      events:
        kind: append_only
        type: list-of-event-block
        event_types:
          claim:
            fields: [ts, agent_id, host, lease_id]
            idempotent: true
          progress:
            fields: [ts, agent_id, host, lease_id, note, partial_artifact_refs]
            idempotent: false
          blocked:
            fields: [ts, agent_id, host, lease_id, reason, blocker_refs]
            metrics_tracking:
              - "Coordinators MUST calculate the elapsed duration since the initial blocked event."
              - "Coordinators MUST analyze blocker_refs to build a blocking tree, prioritizing root blockers."
            idempotent: false
          checkpoint:
            fields: [ts, agent_id, host, lease_id, commit_sha, summary]
            idempotent: false
          released:
            fields: [ts, agent_id, host, lease_id, reason]
            idempotent: true
            note: "Voluntary release before completion; another agent may claim."
          failed:
            fields: [ts, agent_id, host, lease_id, reason, retryable]
            idempotent: true
            note: "Terminal-for-this-attempt; retryable=true means a future agent may re-claim."
          completed:
            fields: [ts, agent_id, host, lease_id, evidence_refs]
            idempotent: true
            note: >
              Terminal. evidence_refs REQUIRED (commit SHA + at least one named
              check result). Sets status to `completed` (claimant-asserted
              closure) — or directly to `verified`/`done` when the evidence
              already meets that higher rung's bar. Lease is implicitly
              released.
          falsified:
            fields: [ts, agent_id, host, evidence_refs, falsified_claim]
            idempotent: false
            note: >
              The ONLY transition down the closure ladder (650-dq6u).
              evidence_refs must name the falsifying observation. Returns
              status to `ready` and opens a new attempt epoch (precedents:
              396, 484, brew-attestation).
      depends_on:
        kind: optional
        type: list-of-id
      blocks:
        kind: optional
        type: list-of-id
      owned_files:
        kind: optional
        type: list-of-path
        note: >
          Hint for agents to detect collisions: if two work items list
          overlapping owned_files and both have active leases, surface a
          warning before either's checkpoint commit.

  status_transition_protocol:
    purpose: >
      Keep the top-level status line, event log, and downstream blockers in
      sync so agents do not re-claim finished work or wait on stale blockers.
    ruling: >
      650-dq6u (The Tlatoani, 2026-08-11): `completed` and `done` are NOT
      synonyms and are never collapsed into one winner. They record different
      events on a monotonic evidence ladder — work completed does not mean
      tested, and tested does not mean done. Merge is semantic distillation
      over the event log, not last-write-wins on a scalar. `implemented` is
      the deliberate pre-field-verification rung (windows-peke,
      627-sgtt/627-wtrp), kept. The operator further ruled the ladder carries
      an explicit `verified` rung (IEEE 1012 alignment): verification (built
      right) and validation/acceptance (right thing built) are distinct.
    canonical_statuses:
      # Working states (non-terminal; latest event wins among these).
      pending: "Known work, unclaimed, dependencies not yet all satisfied."
      ready: "Known work, unclaimed, dependencies satisfied. The ONLY claimable status."
      in_progress: >
        A lease exists and the claimant has started implementation. Absorbs
        the retired `claimed`; the retired `stalled` is replaced by lease TTL
        + expire-claims (672-bz7u), which returns stranded leases to ready.
      blocked: "Cannot progress without a named external dependency or decision; the blocked event names the blocker."
      needs_clarification: "Awaiting an operator answer to a named question; tag operator-decision. Dependents waiting on it are reported, never silent."
      # Closure ladder (monotone: implemented < completed < verified < done;
      # merge = max; the only path down is a `falsified` event).
      implemented: >
        NON-TERMINAL. The artifact landed (commit refs recorded) and
        local/self verification passed, but field/e2e verification is
        explicitly outstanding. MUST carry a verification hand-off:
        next_action names the outstanding check, where it runs, and who can
        run it. Does not satisfy dependents; tooling MUST report any
        dependent waiting on it.
      completed: >
        TERMINAL — claimant-asserted closure. A `completed` event exists
        whose evidence_refs record what the writer ran and observed: commit
        SHA plus at least one named check result. The writer's own assertion
        that all exit_criteria are met; releases dependents and counts closed
        in burndown. It does NOT claim as-wired or independent verification —
        that is what `verified` adds.
      verified: >
        TERMINAL — verified closure, strictly above completed. The completion
        evidence has been evaluated against the packet's exit_criteria via a
        named falsifiable check that passed AS WIRED, not by proxy: litmus
        suite counts, first-fire e2e, in-target verification, or an
        independent verifier's recorded check (the 396 lesson: running the
        script directly is not the hook firing). Built right.
      done: >
        TERMINAL — validated closure, the top rung. The work has been
        validated against the packet's stated verifiable_closure /
        acceptance: operator acceptance, observed working in its production
        seat, or the packet's own acceptance criterion demonstrably satisfied
        in the field. Right thing built. Do not re-claim. Historical rows
        that predate the verified rung keep their labels (grandfathered);
        new writes use `verified` for as-wired check evidence and reserve
        `done` for validation/acceptance.
      # Non-success terminals.
      obsoleted: "TERMINAL. Superseded or no longer applicable; the event names the successor or reason. Satisfies dependents."
      failed: "Attempt ended; retryable: true|false REQUIRED on the failed event. Does NOT satisfy dependents."
    retired_statuses:
      note: >
        Zero live rows fold to any of these; they are retired words, invalid
        to write: claimed (absorbed by in_progress), stalled (replaced by
        lease expiry), provisional, failed-retryable (use failed +
        retryable: true), parked, tested. `archived` is a mechanism
        (archived_ids), never a status value.
    evidence_lattice:
      order: "implemented < completed < verified < done"
      merge_rule: >
        Status is a fold over the grow-only event log. Within the closure
        ladder the HIGHER rung wins regardless of write order — a
        less-verified claim never overwrites a more-verified one. The only
        path DOWN the ladder is an explicit `falsified` event whose
        evidence_refs name the falsifying observation; it returns the packet
        to ready (or, for a partial falsification, to the highest rung the
        surviving evidence supports) and opens a new attempt epoch.
      terminal_set: >
        completed | verified | done | obsoleted. ONE shared
        is_terminal_status definition (crates/tillandsias-plan/src/lib.rs)
        is consumed by the dependency resolver, burndown, guards, and
        selectors; no reader defines its own.
    rules:
      - "A `claim` event changes status from ready to in_progress (mint lease_id; heartbeat per lease rules). IN PRACTICE the status change is what `tillandsias-plan set-field <id> status in_progress` writes, and that is the ONLY thing selectors read as a lease (943-unii)."
      - "The `--reason` text passed to `set-field` is recorded as a `type: note` event, NOT `type: claim` (946-pdpi). A consumer that greps for claim-typed events therefore finds NOTHING from the current claim protocol; read the status LWW channel, which carries the value, the timestamp and the host. The stranded sweep ages on that channel for exactly this reason."
      - "A `blocked` event must name the blocker, owner host if known, and the next ping time."
      - "A checkpoint that lands the artifact with field verification still outstanding sets status `implemented` and MUST name the outstanding verification in next_action."
      - "A `completed` event REQUIRES evidence_refs and sets status to `completed` — or directly to `verified`/`done` when the evidence already meets that bar. Writers without as-wired check evidence write `completed`, never `verified`; writers without validation/acceptance evidence write `verified`, never `done`."
      - "Promotion up the ladder appends the new-rung evidence (litmus counts, e2e first-fire, in-target check, acceptance ref); it never rewrites prior events and must update dependency mirrors."
      - "A `falsified` event (falsifying evidence_refs REQUIRED) is the ONLY transition down the ladder; it returns status to ready and starts a new attempt epoch."
      - "A `released` event returns status to ready ONLY if a host of the packet's pickup_role can start it now; otherwise pending or blocked with the blocker named IN A FIELD THE SELECTOR READS: `blocked_by` when the blocker is another packet, status `blocked` with next_action naming the condition when it is an environment (a disposable enclave, an operator authorisation), or a narrowed `pickup_role` when it is a host regime (darwin or msys evidence). Never a prose-only blocker in next_action: on 2026-09-05 the selector offered the same exhausted epic to a Linux host four times in eight hours (1057-dgij) because three `ready` packets carried their blockers only in prose, two of them released that way by hosts; the selector was correct on its inputs. Prose is for the human who claims; the field is for the selector."
      - "A `failed` event sets status to failed and must include retryable: true|false plus the smallest next diagnostic chain."
      - "When events and the status header disagree, the HIGHEST closure-ladder event (or the latest terminal event outside the ladder) wins; immediately patch the header before claiming new work."
      - "Only `ready` is claimable. `implemented` and `needs_clarification` are visible parking states: tooling reports every dependent waiting on them and the named outstanding action."

  ping_and_triage_protocol:
    purpose: >
      Give agents a deterministic way to wake stale work, ask for help, and
      prioritize without hidden chat state.
    ping_pending_work:
      - "If a ready item has not been claimed for one integration cycle, append a ping note to its Events section with why it matters and what it unlocks."
      - "If an in_progress item misses one heartbeat but lease has not expired, ping the claimant by agent_id/host in the same Events section; do not take the work yet."
      - "If the same blocker appears in two host queues, append or update a cross-host blocker note under plan/issues/cross-host-blocker-roundup-YYYY-MM-DD.md."
    stalled_work:
      - "After expires_at, mark status stalled and append the last known checkpoint, unresolved blocker, and a recommended reclaim scope."
      - "A reclaiming agent must mint a new lease_id; never edit the old lease in place."
    prioritization:
      - "First: blockers that unlock another host's ready item."
      - "Second: failed-retryable work with a narrow diagnostic chain."
      - "Third: ready leaf work in the owning host queue."
      - "Fourth: docs/spec cleanup only when it prevents wrong implementation."
    completion_hygiene:
      - "Mark done work in the item header, not only in the event log."
      - "Update mirror tables such as 'Linux deliverables ... waiting on' in the same commit."
      - "If only part of an item completed, split the remaining gated scope into a new stable ID instead of leaving the original status ambiguous."

  remote_progress_health:
    purpose: >
      Prevent recurrent agents from misclassifying normal remote advancement as
      a coordination problem.
    rules:
      - "Expect `origin/linux-next` to be ahead of a recurrent local checkout on most cycles; that usually means another agent or the integration loop made progress."
      - "Remote-ahead is a blocker only when local dirty state, conflicts, sandbox limits, or missing credentials prevent a fresh fetch/rebase and ledger update."
      - "A repeated no-progress streak on `origin/linux-next` or active sibling branches is the suspicious signal; document it with observed heads, expected cadence, and the host/job that should be checked."
      - "When remote advanced, fresh-read changed plan/methodology ledgers before making assignment decisions."
      - "Do not recommend that the user fix remote-ahead. Recommend action only for stale remote heads, failed pushes, conflicts, or leases that have expired without status packets."

  work_shaping_protocol:
    purpose: >
      Keep multi-agent work large enough to make progress between recurrent
      prompts while still being safe to claim, checkpoint, review, and hand off.
    observed_vs_inferred:
      # Order 788-mj37. Filed after five inferred causes were falsified by the
      # forks implementing them in a single night (2026-08-16/17).
      rule: >
        A packet's context MUST distinguish what was OBSERVED from what was
        INFERRED. Tag the claims: OBSERVED for what was measured or seen, with
        the command or artifact; INFERRED for the causal story that explains
        it. Where an inference is load-bearing, the deliverable SHOULD name it
        as the first thing the implementer tests.
      why: >
        Prose has no marker for "this is the part I did not test", so an
        untested causal story reads exactly like a measurement and the
        implementer inherits it as a premise. The cost is real and was paid
        repeatedly: 783-xyk5 asserted a guard was 60% of the gate from a step
        record that spanned banner-to-banner; 771-wwzi asserted a fork had
        retired the parent's boundary when per-worktree git-dirs make that
        impossible; 782-9jfg assumed the squid 6.x line had fixed the crash
        upstream when the ChangeLogs show it did not; 765-8hc3 inherited audit
        finding F7's claim that crane rebuilt deps on every commit when crane
        already normalizes them; 793-a62g blamed podman lock contention for a
        gate flake that was two tests racing one environment variable.
      what_it_is_not: >
        This is not a bar on inference — every one of those packets was worth
        doing, and four of the five fixes were right. It is a bar on
        inference PRESENTED AS FACT. An implementer who knows which sentence
        is a hypothesis tests it in minutes; one who does not spends part of
        its budget disproving the filer, and a less careful one builds on it.
      symmetry_with_closure: >
        The closure ladder already demands evidence before a status may rise
        (650-dq6u). This is the same discipline applied at the intake end:
        evidence-marking on the way in, evidence-requiring on the way out.
    packet_size:
      preferred: >
        A normal implementation packet should take roughly one or two recurrent
        agent iterations, produce a coherent commit or verification result, and
        unblock a user-visible path, another host, or a release gate.
      too_small: >
        A task is too small when it is just a single obvious edit, local
        cleanup, or one file move that does not independently unblock anything.
        Fold it into the nearest feature, verification, packaging, or CI packet.
      too_large: >
        A task is too large when it cannot be described with one owner_host, one
        expected evidence set, and a plausible next checkpoint. Split by
        platform boundary, protocol boundary, or evidence boundary.
    packet_fields:
      next_action:
        kind: required
        note: "The first concrete command/edit the next agent should perform."
      acceptance_evidence:
        kind: required
        note: "Tests, smoke evidence, commit refs, screenshots, or logs proving done."
      fallback_when_blocked:
        kind: recommended
        note: "The next useful packet this same host should claim if this item blocks."
      dependency_contract:
        kind: recommended
        note: "Exact API/artifact/commit expected from upstream work, not just a prose dependency."
    eager_assignment:
      - "Every active platform queue SHOULD expose at least one unblocked ready packet per host."
      - "If a host's primary path is gated, coordinators SHOULD publish a fallback packet in verification, packaging, diagnostics, docs-distillation, or CI plumbing."
      - "Prefer bundling serial micro-tasks under one claim when they touch the same owned_files and share the same evidence."
      - "Do not split a packet merely to create more ledger entries; split only at ownership, dependency, or evidence boundaries."

    large_packet_is_eligible_work:
      decided_by: "The Tlatoāni, 2026-07-17"
      problem: >
        A recurring failure mode (Hy3, 2026-07-17 overnight loop): an agent
        scans the ready queue (~70 packets), judges them all "too large" to
        finish in one cycle, hesitates to claim ANY of them, and instead
        reaches for an old, small, near-obsolete packet — one more likely to
        be audited away as stale than implemented, and often already made
        irrelevant by later specs. Size-aversion inverts the queue's value
        order: the biggest, most relevant, release-targeted work starves
        while low-value backlog churns. A large estimated_hours is a shaping
        signal, NOT a "skip me" flag.
      rule: >
        A large packet is FULLY ELIGIBLE work. An agent MUST NOT skip a
        relevant, high-value ready packet merely because it cannot be
        finished in a single cycle. On encountering a large packet, the
        cycle has THREE first-class valid outcomes — each a complete,
        successful cycle that lowers residual uncertainty
        (philosophy.yaml → Monotonic Reduction of Uncertainty Under
        Verifiable Constraints):
          1. PARTIAL SLICE — implement the smallest vertical slice that
             produces a coherent commit under a verifiable constraint, then
             emit a `progress` event carrying `partial_artifact_refs` and an
             updated `next_action` so the next cycle resumes without replay.
             Partial progress on a large packet is real progress, not a
             half-failure.
          2. SPLIT — decompose the packet into smaller ready child packets
             at ownership / dependency / evidence boundaries
             (`split_into`), record the shaping events, commit, and push.
             The shaping commit IS that cycle's completed work — a split
             that lowers residual ambiguity is a valid reduction step. This
             GENERALIZES the forge-only [[forge_cycle_budget]] split rule
             (order 264) to every host.
          3. AUDIT-DISPOSITION — if inspection shows the packet is stale,
             superseded, or obsoleted by later specs, retire it explicitly
             (obsolete / tombstone with same-commit dependent cleanup, per
             the freshness audit class in methodology `component_freshness`).
             Retiring dead work is reduction, not avoidance.
        The ONLY invalid response is silent size-avoidance: leaving a large
        relevant packet unclaimed while claiming a smaller, staler,
        lower-value one to dodge its size.
      relevance_over_size: >
        Selection ranks by VALUE and RELEVANCE, never by smallness:
        release-targeted ([[release_aware_packets]]) first, then
        unblocks-another-host or a user-visible path, then
        freshness / current-spec relevance. A large, fresh, release-targeted
        packet OUTRANKS a small, stale, untargeted one. "It is smaller" is
        never a tiebreaker and never a reason to prefer stale work; when
        value ties, prefer the packet this host is uniquely capable of.
      near_obsolete_is_an_audit_signal: >
        A packet that looks near-obsolete is a signal to AUDIT it
        (outcome 3), NOT to implement it as the path of least resistance.
        Implementing soon-to-be-irrelevant work burns budget and can
        conflict with the specs about to supersede it — the exact anti-value
        churn this rule exists to stop.
      new_row_only_if_independently_schedulable: >
        A finding becomes a new ROW only if INDEPENDENTLY SCHEDULABLE: it names
        owned_files no open row already owns, OR a different pickup_role can
        claim it than every open row covering that scope. Otherwise it is a
        next_action clause on that row, or an event on it. Both predicates are
        already computed as claimed_files (plan_answer, batch selector).
      accumulate_then_promote: >
        THE OTHER HALF OF THE RULE, and without it the rule above is only a
        refusal. Observations that are NOT independently schedulable accumulate
        as events on their row. That accumulation is not a graveyard: when a
        row's events show a CONFIRMED PATTERN — several independent
        observations, ideally from different hosts or cycles, converging on one
        defect or one missing capability — the row has OVERFLOWED and the
        pattern should be promoted to schedulable work.

        PROMOTION IS TLATOĀNI-GATED (operator ruling, 2026-08-19). An agent may
        NOTE that a row looks ready to promote and MUST NOT promote it. What
        counts as a confirmed pattern is not yet expressible as a threshold, and
        an agent that promotes on its own judgment reintroduces exactly the
        unbounded arrival this rule exists to bound — by a longer path.

        WHY THIS PRESERVES THE CONVERGENCE GUARANTEE: nothing here adds work.
        Every observation is still recorded, in full, forever. What changes is
        only the CURATION AT THE ACCEPTANCE BOUNDARY — whether an observation
        becomes a schedulable row the moment it is noticed, or waits until a
        pattern confirms it is worth someone's cycle. The corpus stays
        monotone; the SELECTABLE set stops growing on every observation.

      why_velocity_is_the_other_lever: >
        THE SIGN FLIPS AT b = 1, and the previously recorded rejoin target was
        set on the wrong side of it.

        With arrivals λ = a + b·μ (measured: a = 2.2/day, b = 1.80, r = 0.868)
        and service μ, the queue moves at

            dL/dt = a + (b − 1)·μ

        so ∂(dL/dt)/∂μ = b − 1. Above b = 1 throughput is a DIVERGENCE
        multiplier — every host added, every cycle shortened, fills the queue
        faster. Below b = 1 the same throughput DRAINS it, and the queue
        converges once μ > a/(1 − b).

        This retires R2's "b ≤ 1.30" as a target: at b = 1.30,
        dL/dt = 2.2 + 0.30·μ, which is strictly positive for EVERY μ ≥ 0. That
        criterion cannot converge at any velocity, on any number of hosts. It
        was chosen as "better than the measured 1.80" without checking which
        side of the threshold it lands on. THE TARGET IS b < 1. At b = 0.5 and
        today's μ ≈ 19/day, dL/dt = −7.3/day.

        AND THIS IS WHY OVERHEAD REDUCTION COMPOUNDS (operator, 2026-08-19):
        halving orchestration overhead roughly doubles both a and μ, so
        dL/dt doubles — WITH ITS SIGN PRESERVED. Velocity is a multiplier on
        the direction already travelled, never a fix for the direction. Hence
        the ordering: get b below 1 by curation FIRST, and only then is the
        acceleration from the nix cache, a reliable expert system, and shorter
        cycles self-sustaining rather than self-defeating.

      trace: >
        operator directive 2026-07-17 (Hy3 size-aversion → stale-task
        churn); operator ruling 2026-08-19 (Tlatoāni-gated promotion; velocity
        as a convergence multiplier); philosophy.yaml (monotonic reduction);
        convergence.yaml (drift_control);
        worker_agent_protocol.select_shaped_work (selection seam);
        forge_cycle_budget (the forge-scoped split precedent this
        generalizes). Mirrored operationally in the /advance-work-from-plan
        and /meta-orchestration reduction-engine sections.

  agent_status_packet:
    purpose: >
      Give implementation agents a compact, copyable event shape for progress,
      blockers, errors, dependency requests, and handoffs without relying on
      chat history.
    required_when:
      - "claiming or renewing a lease"
      - "ending a recurrent prompt iteration with unfinished work"
      - "hitting an error, blocker, or dependency gap"
      - "completing or releasing a packet"
    fields:
      item: "stable work item id"
      ts: "UTC ISO-8601"
      agent_id: "host/workstation/harness identifier"
      lease_id: "current lease"
      state: "claim | plan | progress | blocked | failed | released | completed"
      current_plan: "1-4 bullets describing the intended implementation path"
      dependencies:
        - "upstream item, artifact, API, branch, or decision needed"
      blockers:
        - "named blocker with owner_host if known and next ping/check time"
      errors:
        - "command/error summary plus smallest useful diagnostic chain"
      files_touched:
        - "paths or globs touched so collision checks are possible"
      evidence:
        - "commit shas, test commands, logs, screenshots, or smoke results"
      next_checkpoint: "expected next action and ETA/trigger"
      lease_intent: "continue | release | reclaimable_after:<UTC> | done"
    formatting_rule: >
      Append status packets under the owning item's Events section. Keep packets
      short enough that another agent can read the whole item before claiming.

  host_component_ownership:
    rule: >
      Each component declares which host owns its primary implementation.
      Agents on other hosts MAY contribute (especially to shared protocol
      and documentation) but the owning host is responsible for keeping it
      green.
    matrix:
      shared_protocol_and_orchestration:
        crates:
          - tillandsias-control-wire
          - tillandsias-host-shell
          - tillandsias-core
          - tillandsias-headless
          - tillandsias-podman
          - tillandsias-podman-cli
          - tillandsias-vault-client
          - tillandsias-logging
          - tillandsias-metrics
          - tillandsias-otp
          - tillandsias-litmus-rust
          - tillandsias-repeat-graph
          - tillandsias-scanner
          - tillandsias-browser-mcp
        owner_host: linux
        contribution_policy: >
          Any host may propose changes via PR or via plan/issues. Linux host
          owns the green-build invariant on `linux-next`.
      linux_native_tray:
        crates:
          - tillandsias-headless (the `--tray` GTK feature)
        owner_host: linux
        notes: >
          The Linux native tray is in-process; no separate crate, just the
          `tray` feature module under `tillandsias-headless`.
      macos_native_tray:
        crates:
          - tillandsias-macos-tray
          - tillandsias-vm-layer (the `vz`/`virtualization.framework` modules)
        owner_host: macos
        contribution_policy: >
          Other hosts MUST NOT edit AppKit/VFR-specific code paths without
          coordinating in plan/. The shared `vm-layer::recipe`/`materialize`/
          `cache` modules are exempt — they are co-owned per
          plan/issues/tray-convergence-coordination.md.
      windows_native_tray:
        crates:
          - tillandsias-windows-tray
          - tillandsias-vm-layer (the `wsl` modules)
          - tillandsias-vm-layer's `fetch` module (download feature)
        owner_host: windows
        contribution_policy: >
          Other hosts MUST NOT edit Win32/WSL-specific code paths without
          coordinating in plan/.
      cross_cutting_documentation_and_methodology:
        scopes:
          - methodology/**
          - openspec/changes/**
          - openspec/specs/**
          - plan/**
          - cheatsheets/**
          - docs/cheatsheets/**
          - top-level *.md tombstones
        owner_host: any
        contribution_policy: >
          Any agent on any host may write here. ALL writes go to
          `linux-next` per [[crdt_principles.invariants.stable_ids]] and the
          plan-write discipline. Conflicts reconciled by stable-ID upsert.

  agent_self_assignment_protocol:
    overview: >
      Agents start cold (no memory of prior session) and need a
      deterministic way to find work eligible for their host + capabilities.
    steps:
      - id: 0_orient
        action: >
          Read methodology.yaml, methodology/distributed-work.yaml (this
          file), methodology/multi-host-development.yaml, plan.yaml,
          plan/index.yaml, and the integration-loop ledger
          (plan/issues/multi-host-integration-loop-2026-05-24.md if active).
      - id: 1_identify_self
        action: >
          Determine host (uname/$OS), agent identity, intended capabilities.
          agent_id comes from the canonical helper — `scripts/agent-identity.sh
          id <backend>` — never hand-composed (order 756-hn3a; grammar,
          precedence, and refusal rules in agent_identity_contract below).
      - id: 2_fetch_canonical_state
        action: >
          `git fetch origin --prune` then `git checkout <active-branch> && git
          pull --ff-only`. Plan ledger reads must be overlay-aware (`tillandsias-plan` CLI
          or project-plan MCP).
      - id: 3_filter_eligible
        action: >
          Walk plan/steps + plan/issues + openspec/changes. Filter where
          owner_host ∈ {own_host, any} AND status ∈ {ready, pending,
          blocked, failed-retryable} AND capability_tags ∩ own_capabilities
          is non-empty AND no overlapping live lease. Treat blocked items as
          eligible only if the blocker is resolved or the item names an
          independent fallback_when_blocked packet.
      - id: 4_pick_one
        action: >
          FIRST prefer packets carrying a `release_target` matching the
          active milestone (see release_aware_packets below) — release-
          targeted work outranks everything except unblocking another
          host. Within the same targeting tier, prefer (a) packets that
          unblock another host, (b) blocked items where the blocker is
          now resolved, (c) failed-retryable items with a narrow
          diagnostic chain, (d) the largest coherent ready packet that
          fits the host capability and lease window. Tie-break by
          dependency depth, then stable-ID lexicographic order.
      - id: 5_claim
        action: >
          Mint lease_id, write a `claim` event to the work item's events
          list, commit + push to linux-next. If the push rebases reveal a
          competing claim, yield (release your local lease, re-filter).
      - id: 6_execute
        action: >
          Switch to the appropriate code branch if needed (windows-next,
          osx-next, or stay on linux-next). Implement. At each meaningful
          checkpoint, emit a compact agent_status_packet as a `progress`,
          `blocked`, or `checkpoint` event back to the work item (commit to
          linux-next), then resume code work.
      - id: 7_terminal
        action: >
          On success: emit `completed` event + commit_sha evidence; set
          status to the highest closure-ladder rung the evidence supports —
          `completed` (claimant-asserted), `verified` (a named as-wired
          check passed), or `done` (validated/accepted) — per
          status_transition_protocol.
          On voluntary stop: emit `released` event with reason; status
          returns to `pending` or `blocked`.
          On failure: emit `failed` event with `retryable: true|false` and
          reason.
      - id: 8_push_ledger
        action: >
          ALL plan/ writes push to linux-next, even if the code work is on
          another branch. Per
          [[plan/issues/branch-and-coordination-canon-2026-05-25.md §2]].

  failure_and_handoff:
    rule: >
      Any agent at any time may resume an item left `in_progress` by another
      agent IFF the lease has expired (now > expires_at) OR the prior agent
      emitted a `failed` or `released` event.
    resumption:
      - "Re-read the entire events list for the item — do NOT rely on
        agent memory."
      - "If the prior agent emitted `progress` events with partial_artifact_refs,
        read those artifacts before deciding what's left."
      - "Mint a new lease_id; emit a `claim` event. The previous agent's
        events stay in the log untouched (append-only)."
      - "If the partial work is unrecoverable, emit a `released` event for
        the unrecoverable portion citing the prior lease_id, then claim
        the item fresh."

  concurrent_correct_fixes:
    rule: >
      WHEN TWO BRANCHES CHANGE THE SAME LINE AND BOTH CHANGES ARE RIGHT, THE
      RESOLUTION IS BOTH. Not the newer one, not the one with the better commit
      message, and never "theirs" because their branch is further ahead.

      This is the CODE analogue of the ledger's merge_policy below, and it needs
      its own rule because git presents it identically to an either/or conflict.
      A conflict marker means "two edits, same region" — it carries NO
      information about whether the edits are alternatives or complements, and
      the default reading of a conflict is alternatives. That default is wrong
      often enough to be dangerous, because a fix landing on a fork is usually
      written from the text as it stood when the fork was cut.
    the_asymmetry_that_bites: >
      THE DANGEROUS SHAPE IS NOT A SYMMETRIC TIE. It is a NEWER branch carrying
      a REAL improvement that was written against a STALE base, so taking its
      side looks like fast-forwarding a newer fix over an older one while
      silently reverting a fix it never saw.

      Worked example, 2026-08-20, litmus-ledger-node-claim-shape.yaml. 797-295s
      had moved the step's capture file from a relative `out.txt` to mktemp,
      because a timeout stranded an untracked file in the checkout and the
      meta-orchestration startup boundary then reads that as sibling work — a
      dirty-start refusal for the NEXT cycle. A fork later rewrote the same step
      for 790-u8x6 to add a phantom-lease case (fixture index, an `a/nope`
      claim, `unknown` in the grammar). Real work, correctly done — and written
      from the pre-797-295s text, so it still redirected into `out.txt`. Taking
      the fork wholesale would have reinstated a cross-host hazard while
      appearing to accept the newer change.
    procedure:
      - "For each conflicting hunk, name what EACH side changed and WHY, from
        its commit message, its order number, and the comment it left. If you
        cannot state the reason for a side, you are not ready to resolve it."
      - "Ask whether the two reasons are mutually exclusive. Usually they are
        not: they are two different defects that happen to live on one line."
      - "If they are not exclusive, COMBINE. Keep both mechanisms and both
        explanations. The combined hunk carries both order numbers."
      - "If they genuinely are exclusive, keep the one that survives the other's
        test, and record the discarded one as an event on its order — never
        delete a correct fix silently."
      - "Leave a comment at the resolution site saying it was a concurrent
        correct fix and naming both orders. The next reader sees one line and
        cannot otherwise tell it was contested."
      - "Run the tests BOTH sides brought, not just the ones that already
        existed. A combination that passes neither side's new test is not a
        resolution."
    why_not_a_gate: >
      There is no checker for this and there probably cannot be one: deciding
      whether two edits are complements requires knowing what each was FOR,
      which is not recoverable from the diff. This is one of the few rules that
      has to live as judgement. What CAN be mechanised is the trail — the
      both-orders comment at the site, so a later audit can find every place
      two fixes were fused and re-examine the call.

  merge_policy:
    rule: >
      When two agents push concurrent edits to the same plan/ file, the
      integration loop reconciles by:
    steps:
      - "git merge: if no textual conflict (different sections of the
        same file), accept the merge."
      - "If textual conflict on the same stable-ID block: prefer
        timestamp-major ordering of the embedded events. If both blocks
        added events to the same items list, concatenate and sort by ts."
      - "If textual conflict on a YAML status field: prefer the
        later-timestamped progress_note; record the earlier value in an
        appended event."
      - "NEVER resolve conflict by deletion. Tombstone the superseded
        block and point at the canonical replacement."
    enforcement:
      - "The integration loop ledger
        (plan/issues/multi-host-integration-loop-2026-05-24.md) records
        every conflict resolution it performs."

  ambitious_milestone_reduction:
    decided_by: "The Tlatoāni, 2026-07-15 (enclave service catalog as the proving case)"
    purpose: >
      Large, ambitious goals (multi-month capability milestones) must flow
      through the same monotonic reduction engine as small fixes — never a
      big-bang branch. This codifies the pattern already exercised by the
      order-315 git-mirror audit and stable-milestone-v1 so it is
      repeatable, not emergent.
    milestone_packet_semantics: >
      A `kind: milestone` packet is the criteria holder, never the work:
      multi_cycle: true, estimated_hours: 0, holds milestone_criteria (one
      row per must-land), and accepts only progress/reconcile/waiver
      events. Implementation NEVER claims a milestone packet — it claims
      children. A milestone is done when every criteria row maps to a done
      child or an operator-approved waiver recorded on the milestone.
      Children MAY carry `release_target: <milestone-packet-id>` so worker
      selection concentrates on it (see release_aware_packets).
    reduction_ladder:
      - "1 RESEARCH: fat-agent packets (heaviest models) produce
         provenance-cited current-state maps + external best-practice
         baselines as cheatsheets/plan-issue docs. Research deliverables
         are facts with citations, never decisions."
      - "2 DECISION: a decision-record packet distills research into ONE
         recommended design with alternatives and risks. The Tlatoāni
         signs off EVERY decision record before implementation starts
         (same governance class as bar_raise_governance — architecture
         choices are operator-owned scope)."
      - "3 IMPLEMENTATION RUNGS: the decided design splits into the
         smallest demonstrable slices, each with a named verifiable
         closure (litmus/fixture/e2e evidence) and staged adoption where
         risky (flag -> soak -> default -> remove, per migration
         discipline). First rung is ALWAYS the thinnest end-to-end
         demonstrable path, not a foundation layer."
      - "4 VERIFICATION: milestone criteria close only on evidence events;
         operator-attended criteria are explicit packets, not footnotes."
    invariants:
      - "Every cycle touching the milestone must reduce residual
         uncertainty: a filed research doc, a signed decision, a passed
         closure, or a split that lowers ambiguity. No cycle may only
         reorganize."
      - "Uncertainty ordering: decide transport/protocol/security
         boundaries BEFORE building on them; anything buildable either
         way is deferred to a later rung."
      - "The milestone packet's progress events form the burndown record;
         plan/loop_status.md mirrors it at each coordinator cycle."

  version_aware_release_planning:
    decided_by: "The Tlatoāni, 2026-07-17"
    purpose: >
      Give the plan a SEQUENTIAL, NUMBERED release dimension so cross-platform
      and cross-milestone work is gated by VERSION instead of guessed by
      cadence. The app is at v0.3; the next bundle is v0.4. A release is a
      BUNDLE of features that ships when STABLE — not on a weekly/timed
      cadence. Releases are strictly sequential (v0.3 → v0.4 → v0.5 …);
      however long a bundle takes, it is still just "the next release".
    the_release_number_is_the_minor: >
      "Release X" == the CalVer MINOR component (versioning.yaml
      semantic_intent.Minor is already "user-driven feature phases"). Shipping
      the v0.4 bundle == bumping Minor 0.3 → 0.4 on main at release-cut time;
      YYMMDD.Build keep moving per build, but the MINOR is the human-facing
      release bucket. This adds NO new version format — it names the planning
      use of the Minor that versioning.yaml already defines.
    every_open_packet_carries_a_desired_release: >
      Every OPEN work packet SHOULD carry `desired_release: vX.Y` — the release
      it is desirable by. Orthogonal to `release_target` (milestone grouping):
      a packet may have BOTH. Unmarked open packets are implicitly the active
      release-in-progress until the coordinator curates them; the standing
      backfill task (desired-release-backfill) closes the gap without blocking.
    cross_platform_gating: >
      Introduce cross-platform / cross-host dependencies by RELEASE ORDER:
      give the dependent packet a `desired_release` >= its upstream
      dependency's. Worked example (EXPERTS milestone, this cycle): the Linux
      fat-host local-inference core is v0.4; the modest-hardware tiering and
      the Windows/macOS tier-verification packets are v0.5 — so v0.4 ships the
      end-to-end architecture on the capable host WITHOUT waiting on the
      cross-platform half, and the dependency is a visible version gate rather
      than a hidden depends_on that silently blocks a release.
    release_readiness: >
      Release vX.Y is READY TO CUT when every `desired_release: vX.Y` open
      packet is `done` (or explicitly slipped to a later release with a reason
      event) AND the release-evidence gate is green — an e2e/smoke PASS record
      naming the build, the same gate scripts/promote-stable.sh enforces
      (versioning.yaml stable_channel). SLIPPING is a first-class move: bumping
      a packet's desired_release from v0.4 to v0.5 with a reason event un-gates
      the release honestly; leaving an unfinished packet tagged v0.4 to "not
      block the count" is drift.
    ownership: >
      The linux coordinator OWNS desired_release assignment and the
      active-release pointer (both mirrored in plan/loop_status.md each
      coordinator cycle, alongside the milestone burndown). Workers treat
      desired_release as read-only; a worker that finds a packet must slip
      files a `progress` note proposing the slip and the coordinator ratifies.
    selection_effect: >
      Within [[large_packet_is_eligible_work]] value ranking, after the
      [[release_aware_packets]] milestone preference and before generic
      freshness: a packet targeting the ACTIVE release outranks one targeting a
      LATER release (concentrate effort on shipping the current bundle). Never
      idles a host — no active-release work eligible → fall back to
      next-release, then backlog.
    trace: >
      operator directive 2026-07-17 (numbered sequential releases, version-gated
      cross-platform deps, "bump the sub-version to v0.4 when stable");
      versioning.yaml (CalVer Minor = release bucket + stable_channel evidence
      gate); release_aware_packets (the orthogonal milestone-grouping axis).
      Pinned by litmus:version-aware-release-planning-shape. Mirrored in
      /advance-work-from-plan selection + /meta-orchestration coordinator duties.

  release_aware_packets:
    decided_by: "The Tlatoāni, 2026-07-14"
    purpose: >
      Make the work queue release-aware so distributed agents converge on
      the same shipping goal instead of each locally optimizing an
      unrelated corner of the backlog.
    marker: >
      A packet MAY carry `release_target: <milestone-packet-id>` (e.g.
      `release_target: stable-milestone-v1`). The named milestone is a
      `kind: milestone` packet in plan/index.yaml whose milestone_criteria
      enumerate the must-land set; the marker and the criteria list must
      agree (the coordinator reconciles drift during integration).
    selection_effect: >
      Worker step 4_pick_one prefers release-targeted packets first. A
      host with NO eligible release-targeted work falls back to the
      normal backlog — release targeting concentrates effort, it never
      idles a host.
    lifecycle: >
      The linux coordinator sets and clears markers: applied when a
      milestone is declared, removed (or re-pointed) when the milestone
      ships or a criterion is waived. Only the coordinator or The
      Tlatoāni changes a marker; workers treat it as read-only input.
    known_limits_and_next: >
      This is deliberately the SIMPLEST slice: one flat marker + a
      selection preference. It does not yet solve triage depth,
      cross-host scheduling, queueing fairness, or anti-starvation —
      agents can still contend for the same packet or idle when their
      platform's targeted set is blocked. That evolution is tracked as a
      research packet (collaborative-work-scheduling-research): candidate
      mechanisms include dependency-aware dispatch waves, per-host work
      reservations, priority lanes with aging, and blocked-set
      auto-fallback. Do not grow this section ad hoc — reduce through
      that packet.

  in_forge_agent_self_service:
    decided_by: "The Tlatoāni, 2026-07-17"
    purpose: >
      Give agents running INSIDE the forge a durable, verifiable way to
      unblock THEMSELVES on FUTURE launches. The forge is ephemeral and
      rebuilt from the freshly checked-out sources on every launch (image
      assets under images/, config-overlay, cheatsheets, and the harness
      installers), so an in-forge agent cannot mutate its own running
      environment for keeps — but it CAN change the SOURCES the next launch
      rebuilds from. That is the self-service loop.
    the_loop: >
      In-forge agent hits a missing capability, tool, fix, or rough edge →
      files a durable, shaped request in the SHARED CHECKOUT (never a
      throwaway note in the container) → commits + pushes via the transparent
      git-mirror → a capable host/coordinator agent implements it into the
      image/config sources → the NEXT forge launch rebuilds from those sources
      and the capability is present. "Available on future launches" literally
      means "landed in the sources the launcher rebuilds the forge from".
    where_to_file:
      missing_tool_or_toolchain_or_capability: >
        A missing dev tool, toolchain, cheatsheet, MCP surface, or forge
        affordance → a proposal under `plan/forge-improvements/proposals/
        <YYYY-MM-DD>-<slug>.md`. This is the existing intake the worker skill
        already scans; the linux/any host that owns the forge image drains it
        into images/ + config-overlay. State the capability, why the lane
        needs it, and the falsifiable check that the next launch has it.
      a_bug_in_the_forge_itself: >
        A defect in the forge image/entrypoint/harness → a `plan/issues/`
        packet (the normal reduction-engine intake), `capability_tags: [forge,
        …]`, `owner_host: linux` or `any` (the image is built host-side).
        Include the repro and the smallest verifiable closure, same as any
        finding.
      work_the_forge_agent_can_do_itself: >
        If the packet is `forge`-capability-tagged or `owner_host: any` and
        fits the forge_cycle_budget envelope, the in-forge agent CLAIMS and
        implements it directly rather than only proposing — self-service
        includes doing the work when the lane is capable.
    discipline:
      - "Every request is a shaped, VERIFIABLE packet/proposal (work_shaping_protocol + large_packet_is_eligible_work), never prose intent alone — a wish an attentive host might honor is not a constraint."
      - "File with agent_id + host=forge so the coordinator can see forge-originated demand and prioritize what unblocks the most lanes."
      - "Push it: an in-forge finding that dies with the container is a lost finding (Non-Negotiable Exit Contract). The transparent git-mirror is the push channel; if it is unavailable, that itself is the highest-priority self-service filing."
      - "Tag the request's `desired_release` so image/config work is scheduled into a release bundle like everything else (version_aware_release_planning)."
    trace: >
      operator directive 2026-07-17 ("make sure ./methodology instructs agents
      running inside the forge how to file for enhancement and fixes to be
      available on future launches to unblock themselves"); builds on the
      existing plan/forge-improvements/proposals intake + the forge
      ephemeral-rebuild-from-checkout model (forge-hot-cold-split). Mirrored in
      /advance-work-from-plan (forge selection) + /meta-orchestration.

  order_id_allocation:
    decided_by: "The Tlatoāni, 2026-08-01"
    supersedes: order_number_assignment
    design_record: "plan/issues/work-order-id-collision-free-design-2026-08-01.md"
    problem: >
      The 2026-07-14 rule below was correct about identity (packet_id is
      authoritative) and wrong about allocation. It routed every non-coordinator
      filing through `order: provisional` and had the coordinator assign the
      final integer at integration — which is RENUMBERING, the very thing the
      same rule names as the reference debt it eliminates. Its own remediation
      clause concedes this: it requires stale references to be updated "in the
      same commit", which cannot reach commit messages already pushed.
      It also did not hold. Two linux hosts (mutable + immutable) both read as
      "the coordinator", so on 2026-07-31 they collided TWICE in one session
      (560-562, then 568-570) minting integers directly. Six collisions sit at
      HEAD undetected (160, 196, 197, 201, 224, 294).
    rule: >
      Order tokens are SELF-ALLOCATED and PERMANENT. Mint one with
      `tillandsias-plan next-order [prefix]`, which emits `<seq>-<suffix>` (e.g.
      `575-k3f9`): a numeric prefix continuing the existing sequence, and a
      4-character random suffix from an alphabet with visually ambiguous symbols
      removed. No host asks another host for a number, and NO TOKEN IS EVER
      RENORMALIZED after allocation.
    why_no_normalization: >
      The suffix is a permanent part of the identifier, not a staging device
      discarded at acceptance. Order tokens leak into code comments, `@trace
      order:` headers (30 in the tree), and COMMIT MESSAGES — and a pushed commit
      message can never be corrected. Any scheme permitting a rename after a
      reference exists reintroduces exactly the cost being removed. Two hosts
      that both pick prefix 575 produce `575-k3f9` and `575-m2p1`: two distinct,
      permanent, correct identifiers that need no reconciliation.
    the_prefix_is_not_authoritative: >
      `<seq>` exists for rough chronology and human readability only. Several
      packets sharing a prefix is NORMAL, not a defect, and the prefix alone does
      not resolve — `plan_status 575` is a miss, `plan_status 575-k3f9` is a hit.
      Sequence carries no meaning the ledger depends on: as the operator put it,
      "we don't need for work orders to be fully numerically sequential, only
      unique, and we have order given their commit numbers and timestamps".
    ordering_source: >
      Chronology comes from `events[].ts` and git history. Both are HONESTLY
      APPROXIMATE — git history is a partial order until branches merge, and
      timestamps come from host clocks across four platform branches. Adequate
      for sorting and for "what happened around then"; MUST NOT be relied on
      where a strict total order is required. Nothing in the ledger requires one.
    mediator_role: >
      A mediator/orchestrator gates ACCEPTANCE, never identity: shaping quality,
      status, release targeting, duplicate-intent detection. If a packet's ID
      were provisional until a mediator ruled, coordination would be back on the
      critical path — which is what made the superseded rule fail. A concurrently
      filed packet is valid and addressable IMMEDIATELY; whether it is ready to
      claim is the mediator's call.
    migration: >
      PURELY ADDITIVE. Existing integer orders stay valid identifiers forever —
      `322` resolves exactly as before. Renumbering 497 packets into the new
      scheme would be this design's own failure mode applied at maximum scale.
      Only the six existing collisions need one-time disposal, and since their
      packet_ids are already unique, nulling the order may be the right repair.
    enforcement: >
      `tillandsias-plan check` WARNS on any duplicate order token, naming every
      claimant (it previously reported "ids unique" over six collisions because
      it validated packet_id and never looked at `order`). Both order indexes
      drop ambiguous tokens, so a duplicated order is an honest miss that names
      its claimants rather than a confident answer picking one arbitrarily.
    reference_discipline: >
      Durable cross-references — depends_on, split_into, specs, methodology,
      commit messages, cheatsheets — SHOULD cite `packet_id`. It is the identity,
      it is unique by construction, and it never needed any of this machinery.
      Order tokens are a human-facing convenience.

  order_number_assignment:
    status: SUPERSEDED by order_id_allocation (2026-08-01)
    retained_for: >
      Provenance. Its identity claim (packet_id is the only authoritative
      reference) survives verbatim in the successor; its ALLOCATION mechanism —
      provisional ids plus coordinator-assigned integers — is retired because
      the assignment step is renumbering, and renumbering is the cost. Packets
      still carrying `order: provisional` and a `provisional_id` remain valid;
      `provisional_id` stays a permanent alias exactly as this rule promised.
    decided_by: "The Tlatoāni, 2026-07-14"
    problem: >
      Sibling hosts filing packets concurrently mint colliding integer
      order numbers (2026-07-12: 315/316 collided macOS↔linux; 2026-07-13:
      323-327 collided windows↔macos and 328 was used twice). Coordinator
      renumbering then silently breaks every prose reference to the old
      number — the reference debt this rule eliminates.
    rule: >
      `packet_id` (stable kebab-case) is the ONLY authoritative reference
      to a packet. The integer `order` is a coordinator-assigned
      convenience index, unique on linux-next. Hosts other than the linux
      coordinator MUST NOT mint integer orders when filing: file with
      `order: provisional` plus `provisional_id: <host>-<yymmdd>-<n>`
      (e.g. `osx-260714-1`, `win-260714-2`). The linux coordinator assigns
      the final integer during sibling integration, records an
      `order-assigned` event on the packet, and leaves `provisional_id` in
      place as a permanent alias so the filing host's prose references
      stay resolvable.
    reference_discipline: >
      Cross-references in prose (plan/issues, loop_status, commit
      messages, cheatsheets) SHOULD cite `packet_id` (or the
      provisional_id before stabilization). A bare "order N" is valid
      only for numbers already stabilized on linux-next at writing time.
    remediation: >
      Collisions predating this rule were resolved by coordinator
      renumbering (brew-aarch64-harness-strategy 316→317,
      guest-container-metrics-over-control-wire 328→333; the 2026-07-13
      windows block kept 323-327). A prose-reference audit accompanies
      this rule's introduction; future renumbering must update or
      packet_id-ify stale references in the same commit.

  active_multi_host_mediation_and_conflict_handling:
    purpose: >
      Active coordination rules to spot and resolve multi-host cooperation
      blockers including deadlocks, thrashing, and wrong-direction progress.
    protocols:
      deadlock_mediation:
        trigger: "Sibling A and Sibling B are mutually waiting on each other's deliverables."
        action: >
          Break the deadlock by extracting a minimal, mock-based interface contract or
          naming one host as the primary driver to unblock the interface first. Repin
          the blocker to the mock contract task.
      wrong_direction_progress_mediation:
        trigger: "A sibling implements plans or code deviating from active specs or violating core design invariants."
        action: >
          Freeze the sibling's lease. Document the divergence as a cycle entry via the
          loop_status overlay (`tillandsias-plan loop-status-append`, never an in-place
          rewrite of plan/loop_status.md) and their work queue. Force-assign a corrective
          'Spec Alignment & Litmus Verification' packet as their next primary task.
      thrashing_mediation:
        trigger: "Two hosts repeatedly overwrite each other's plan notes or code changes (undo-loops)."
        action: >
          Freeze both active leases. Audit the git history of the thrashed resource. Enforce
          the stable-ID CRDT semantic merge policy for plans, and assign a single synchronous
          conflict-resolution wave to one host while directing the other to a separate,
          independent fallback task.

  agent_execution_roles:
    purpose: >
      Define the two-tier execution model to sustain high velocity and guarantee finite-time
      convergence: the Orchestration tier and the Worker execution tier.
    roles:
      orchestrator:
        skill: "/meta-orchestration (delegates to /advance-work-from-plan, /multihost-orchestration, e2e, and release skills)"
        cadence: "hourly or daily integration cycles"
        focus: >
          Host-aware remote sync, worker drain, global health, blocker tree
          construction, active conflict mediation, e2e gating, release
          triggering on mutable Linux, and board shaping. Publishes unblocked,
          actionable tasks for workers and pushes every durable result.
      worker:
        skill: "/advance-work-from-plan"
        cadence: "highly recurring (every hour or on-demand)"
        focus: >
          Self-assignment orientation, claiming leases, implementing code/specs/cheatsheets,
          emitting progress checkpoints, executing litmus tests, and publishing completed evidence.

  agent_fleet_naming:
    purpose: >
      Define the agent, model, operator, and host names used by coordination
      ledgers so cold-started agents interpret them consistently.
    names:
      BigPickle:
        runtime: "opencode CLI model"
        model: opencode/big-pickle
      Hy3:
        runtime: "opencode CLI model; BigPickle's larger Zen sibling"
        model: opencode/hy3-free
      Terra:
        runtime: "codex CLI model"
        model: gpt-5.6-terra
      Sol:
        runtime: "codex CLI model"
        model: gpt-5.6-sol
      "The Tlatoāni":
        role: "human operator authority"
      macuahuitl:
        role: "mutable-Linux coordinator host nickname"
    provenance: plan/issues/agent-fleet-and-zeroclaw-roadmap-2026-07-17.md

  mcp_first_read_path:
    purpose: >
      Reads go through the local MCP servers FIRST. The filesystem is the
      fallback — for MCP failure, for verification, and for content MCP does not
      expose — not the default.
    authority: >
      Operator directive 2026-08-09. Identified as the cheapest available
      velocity win by the 630-vpmq skill audit: it recovers most of the same
      orchestrator context that agent delegation would, without spawning
      anything.
    the_problem: >
      Skills name whole files to read. Those files are:

        plan/index.yaml        31,678 lines
        plan/loop_status.md     7,875 lines
        plan/issues/              405 files
        plan/index.d/              41 fragments

      `advance-work-from-plan` step 1.6 instructs the orchestrator to read four
      of those directly, to extract what amounts to a paragraph: the active
      Direction, this host's branch, a handful of packet ids, and any blocker
      naming this host. Tens of thousands of lines are imported to produce
      twenty. That import is permanent for the rest of the session, and it is
      paid again by every agent on every host on every cycle.

      MCP already answers all of it in a bounded, cited envelope. The servers
      exist, are wired, and are sub-100ms — they were simply offered as an
      option rather than required, so the expensive path stayed the default.
    rule: >
      Prefer MCP for every read that has an MCP answer. Drop to the filesystem
      only for one of the three reasons named in `filesystem_fallback` below,
      and say which one.
    tool_map:
      plan_and_methodology: >
        `forge-plan` / `project-plan`: plan_answer, plan_next, plan_query,
        plan_ready, plan_status, plan_blocked_by, plan_blocked_on, plan_closure,
        plan_burndown, plan_check, methodology_ask, methodology_path,
        spec_answer, expert_capability.
      repo_and_code: >
        `project-info`: read_file, search_code, grep_code, find_files,
        file_summary, project_answer, project_info, project_structure,
        project_metadata, git_status.
      note: >
        `read_file` through MCP is still preferable to shelling `cat` — it is
        bounded and the result is addressable. The rule is about not hauling
        whole ledgers into context, not about avoiding file reads as such.
    filesystem_fallback:
      unavailable: >
        MCP is absent, erroring, or the expert answers `confidence=unsupported`.
        Fall back immediately and CONTINUE — an unavailable expert is a degraded
        read path, never a blocked cycle. Record the fallback in the cycle's
        loop-status entry so a systematically-refusing expert is visible rather
        than quietly routed around (this is the order-531 failure mode: truthful
        `experts: ready` while every answer was unsupported).
      unavailable_record_where: >
        Order 737-zcj5. "Record it" named no destination, and on 2026-08-14 two
        hosts skipped the recording half on the same day — windows lost all 28
        MCP tools mid-session and fell back to tillandsias-plan.exe silently;
        linux ran a whole cycle whose session had never loaded the servers at
        all. Neither outage left a trace anywhere in the ledger. The destination
        is now concrete and does not depend on an agent remembering:

          scripts/check-mcp-expert-health.sh   runs at Start-Of-Cycle, speaks the
                                               MCP initialize handshake to each
                                               expected expert, and appends one
                                               JSONL record per server to
                                               $TILLANDSIAS_EXPERT_HEALTH_LOG.
          scripts/cycle-metrics.sh             reads that log and reports
                                               `health=` on its `mcp:` line, plus
                                               an `mcp_outage:` line WHEN AND ONLY
                                               WHEN a non-up state was recorded.
          the handoff / loop-status entry       carries cycle-metrics verbatim, so
                                               the outage reaches plan/loop_status.d
                                               without a discretionary write.

        `health=` is the field that makes an outage visible at all: call volume
        cannot distinguish a server that is DOWN from one nobody called, because
        both produce zero usage rows. `health=unprobed` is deliberately NOT
        `health=ok` — an unmeasured expert reported as healthy is the order-531
        shape again.

        The probe is ADVISORY. Its non-zero exit means record and continue, never
        block — unlike check-credential-channel.sh, whose non-zero exit does fail
        the cycle. A missing push channel silently destroys work; a missing expert
        only makes reads more expensive.
      verification: >
        Before an IRREVERSIBLE act that depends on an MCP answer — a commit, a
        status flip, a deletion, a release — read the CITED SPAN to confirm it.
        Expert answers carry citations precisely so this check is cheap: read the
        span, not the file. Verification is the one case where the filesystem is
        not a fallback but a requirement.
      not_exposed: >
        Content no MCP tool covers. Read it directly and, if it is content the
        loop needs repeatedly, file a packet to expose it — a recurring direct
        read is a missing tool, not a habit.
    anti_patterns:
      - >
        Reading plan/index.yaml, plan/loop_status.md, or a directory of
        plan/issues/ in full when a plan_query or plan_answer would answer the
        question. This is the specific waste the rule exists to remove.
      - >
        Treating an MCP answer as verified evidence for a destructive step
        without reading its citation. Cited is not the same as checked.
      - >
        Stalling a cycle because MCP is down. "'Tis broken? keep goin'" — fall
        back, note it, continue.

  the_lane_and_the_stamp_have_opposite_preconditions:
    purpose: >
      A host under push contention must choose which of the two acceptance paths
      it is aiming for, because they cannot both be satisfied. THE LANE needs the
      remote base present locally — a FRESH fetch. THE STAMP needs the tree
      UNCHANGED since `./build.sh --check` passed — and a fetch+rebase changes the
      tree and voids it. Fetching buys the lane and costs the stamp; not fetching
      keeps the stamp and forfeits the lane.
    authority: >
      Derived by calmecacpilli 2026-08-26 from the hook itself, after yolanda
      measured that the opposite advice was correct on a slow-gate host. Both
      halves measured on the hosts that live in each regime.
    which_regime_am_i_in: >
      Decided by GATE DURATION against the contention interval, not by preference.
      A cheap gate re-gates freely and should chase the lane. A gate longer than
      the interval between sibling pushes cannot afford to void a stamp it already
      holds, and should protect it — gate against the last fetch and push without
      re-fetching. The crossover is roughly where gate duration exceeds the
      inter-push interval; during the 2026-08-25 release burst that interval was
      about three minutes.
    the_evidence: >
      FAST SIDE (calmecacpilli, 1.8-2.0 min gate): 4.0 gate re-runs for one landed
      commit against 0 for fragment-only commits that rode the lane. Fetching late
      minimises the staleness window and wins.
      SLOW SIDE (yolanda, 276.5s gate, n=20): three lost races before landing, at
      429s, 442s and 453s per re-gate, with trunk moving again during each. What
      broke the treadmill was gating and pushing with NO fetch in between, because
      the hook compares against the origin/linux-next the last fetch recorded.
    the_slow_leg_is_provisional: >
      READ THIS BEFORE QUOTING THE SLOW SIDE. yolanda's 276.5s is NOT a Windows
      or WSL2 property: their checkout sits on /mnt/c behind the 9P bridge,
      measured at ~48x the same machine's native ext4 at the same commit, one
      variable — while WSL2 itself costs only ~1.4x. It is a configuration
      defect with a fix (895-bkrn), not a platform floor. If that packet lands,
      this rule loses its only measured slow side.
      And the number carries yolanda's own caveat, volunteered about the figure
      that made their own problem look most urgent: the ext4 leg is n=3 at 238 ms
      (1.1% spread) while the BRIDGE leg is still n=1, so the ~48x rests on a
      single draw on the expensive side.
      THE MECHANISM IS UNAFFECTED AND REMAINS DERIVABLE — the lane needs a fresh
      fetch, the stamp needs an unchanged tree, they are mutually exclusive, and
      gate duration decides which to chase. Only the empirical slow leg is
      provisional. A host should derive its own regime from its own gate rather
      than matching itself to yolanda's numbers.
    it_narrows_the_window_it_does_not_close_it: >
      Not fetching does NOT make a moved remote go away. If trunk actually
      advanced, the push is rejected as non-fast-forward regardless of how fresh
      the stamp is. The discipline buys a SHORTER INTERVAL between gate-end and
      push. A host on a slow gate will still lose races; losing one is consistent
      with this rule rather than a refutation of it. Sold as a guarantee it would
      teach its user to distrust a correct rule the first time it loses.
    path_eligibility_is_necessary_not_sufficient: >
      The merge that pull_merge_cadence.pre_push_gate REQUIRES imports non-plan
      paths — yolanda's refusal named scripts/check-credential-channel.sh, a file
      they had never touched — so a plan-only commit stops qualifying for the lane
      the moment its host obeys the merge rule. THE LANE IS THEREFORE
      STRUCTURALLY UNAVAILABLE TO EVERY PLATFORM-BRANCH HOST on any push that
      follows a merge, which is most of them. Widening WHICH paths qualify
      (889-twhe) does not touch this. A platform-branch host's lever is the stamp,
      not the lane.
    anti_patterns:
      - >
        Broadcasting one host's push discipline fleet-wide without naming the
        regime it was measured in. Done on 2026-08-25; it was a free win on three
        hosts and an active trap on the fourth.
      - >
        Assuming the fast lane is available whenever the PATHS qualify. Path
        eligibility is necessary and not sufficient.

  cross_host_relay_provenance:
    purpose: >
      A relay carries its provenance, and a relay is NEVER corroboration. Every
      finding forwarded between hosts is tagged with its evidence state —
      MEASURED (by whom, on which host, with what command), REPORTED (told to
      me, not verified), or INFERRED (reasoning, no measurement) — and a host
      that verified something itself says so and says how.
    authority: >
      Coordinator ruling, macuahuitl, 2026-08-25, on a defect in the
      COORDINATOR's own role named by yoga. Adopted the same night it was
      identified.
    the_problem: >
      Direct host-to-host messaging makes a coordinator an AMPLIFIER. A finding
      forwarded by the coordinator reads as corroboration when it is only
      transmission, because it arrives carrying the coordinator's implicit
      weight. The receiving host then reasonably weights it above the same
      sentence from its author.
    the_evidence: >
      MEASURED on 2026-08-25, the first night the fleet had lateral messaging.
      FOUR premises were endorsed by multiple hosts and then falsified by
      whichever host finally measured them: the coordinator's claim that the
      sanctioned build-cache sweep had destroyed the convergence history
      (retracted — could not show any history ever existed); yoga's committed
      capability row advertising gpu/container/ollama against a live probe
      reporting engines:[] (which MISROUTED the authoritative release gate);
      the warm-toolbox velocity lever (falsified at +5% container overhead
      against a 131.9s one-time construction cost); and a macOS filesystem
      case-sensitivity defect (retracted — the probe's outcome was fixed before
      it ran). In every case the ENDORSEMENT CHAIN WAS LONGER THAN THE EVIDENCE
      CHAIN, and the coordinator amplified at least twice.
    the_sharper_half: >
      N ENDORSEMENTS ARE NOT N EVIDENCE. Three hosts agreed the warm-toolbox
      premise was worth a packet. That agreement was not weak evidence, it was
      ZERO evidence: all three were reasoning from ONE host's single number, so
      there was one measurement wearing three hats. Aggregated agreement feels
      like corroboration and is the most common way a fleet convinces itself of
      something nobody checked. This is a reasoning bug rather than a discipline,
      which is why it is stated ahead of the tagging.
    what_this_must_not_cost: >
      The transmission is not the defect — it is most of a coordinator's value.
      On the same night, relaying carried a reframing, a lane discovery, a
      whole-tree measurement and a 9.7x ratio between hosts that would otherwise
      have had none of them. THE DEFECT IS SPECIFICALLY THE UNTAGGED RELAY.
      Tagging costs one word per finding; relaying less costs the pairing. So:
      tag everything, relay MORE, and let the tags carry the weight. Ten
      REPORTED-tagged findings beat three personally verified ones.
    anti_patterns:
      - >
        Forwarding a finding without naming who measured it, so the receiver
        cannot tell verification from transmission.
      - >
        Counting agreement as evidence. Ask how many MEASUREMENTS are under the
        agreement, not how many hosts hold it.
      - >
        Relaying less to avoid the amplifier problem. The fix is the tag, not
        the silence.

  every_gate_number_states_cold_or_warm:
    purpose: >
      A gate duration quoted anywhere — a packet, a handoff, a cross-host
      message — MUST state whether it was COLD or WARM. An unlabelled gate
      number is not interpretable.
    authority: >
      Proposed by pirria 2026-08-25 after retracting its own trend claim;
      adopted by the coordinator the same night. Same family as
      cross_host_relay_provenance above.
    the_problem: >
      This gate has at least TWO memoisation layers and neither announces which
      one you got: the whole-gate memo (765-tkq2) that returns ok:gate-fresh in
      ~0.4s on an unchanged tree, and per-phase caches beneath it. So two runs
      of "the same gate" on "the same tree" can differ by orders of magnitude
      for reasons that have nothing to do with the tree.
    the_evidence: >
      MEASURED on pirria 2026-08-25, on ONE tree, 2.5 minutes apart:
        23:24:18Z  total 140198 ms   fragment-event phase  40151 ms
        23:26:53Z  total  63147 ms   fragment-event phase    814 ms
      49x on that phase. The 140s run was the first gate after fast-forwarding
      71 commits — maximally cold by construction — and was compared against
      another cold number and reported as a GROWTH TREND, with a recommendation
      to scope an intervention at the phase that had grown. The phase is 0.8s
      warm. Retracted by its own author within the hour.
      THREE HOSTS WERE FOOLED BY A COLD/WARM CONFUSION IN ONE EVENING: yoga's
      131.9s cold-toolbox number (which survived two reframings before being
      falsified at +5%), macbook's build_check_ms_avg mixing memoised and forced
      runs, and pirria's trend above. That is not three mistakes; it is one
      missing label.
    the_rule: >
      State it or the number does not travel. "28.6s" is not a measurement;
      "28.6s, forced, n=15, range 13.4-40.4s" is. Prefer FORCED runs
      (TILLANDSIAS_FORCE_CHECK=1) for any cross-host comparison, and say n and
      spread — a mean over a mixed population encodes how many no-op runs a host
      happened to do rather than how fast it is.
    anti_patterns:
      - >
        Comparing two cold numbers and calling the difference a trend. A
        first-gate-after-a-large-fast-forward is maximally cold by construction.
      - >
        Quoting a mean over memoised and forced runs together. It measures
        neither.
      - >
        Reporting a ratio whose two sides have different n. State both, or state
        that one is a single observation.

  ledger_write_path:
    purpose: >
      One command changes a packet field. Hand-authoring the LWW channel is the
      single most reproducible way this project corrupts its own state.
    rule: >
      `tillandsias-plan set-field <id|order> <field> <value> --reason "why"`.
      Never re-declare a packet under `packets:` to change it, and never rely on
      an event alone to close one.
    why: >
      Three hosts got this wrong on 2026-08-09, independently, within hours of
      each other AND of it being documented:

        linux    re-declared under `packets:` — a G-Set no-op. 11 of 21
                 completions silently discarded, some for two days (635-i6vm).
        macos    wrote `type: completed` events with no status block. A packet
                 that passed 5/5 with an evidence file stayed claimable.
        windows  filed 642-fedr: the channel is NAMED `status:` but corrects any
                 field, so nobody looks there when changing pickup_role.

      Every one of those parses, validates, passes `tillandsias-plan check`, and
      reads correctly in review. The fold discards the change and nothing
      reports that it did.

      The skills themselves taught the broken pattern: advance-work-from-plan
      step 7 said to close a packet with `append-event` OR "a fragment file
      setting status done", and BOTH branches are broken — append-event is blind
      to fragment-only packets (600-c266), and the fragment form is the G-Set
      no-op. Three hosts following the instructions correctly is not three
      mistakes.
    also: >
      set-field resolves against the FOLDED ledger, so unlike append-event it
      reaches fragment-only packets. It refuses an unknown reference rather than
      writing a fragment that applies to nothing, and reports a no-op instead of
      writing one.
    detectors: >
      scripts/check-fragment-status-loss.sh (gates: a declared terminal status the
      fold discards, and a `completed` event with no transition);
      scripts/check-stranded-in-progress.sh (advisory: claims that never produced
      an event); scripts/reclaim-stranded-claims.sh (returns claims older than the
      TTL to `ready`).

  cycle_batch_triage:
    purpose: >
      Decide what ONE orchestration cycle takes, so that consecutive
      `/meta-orchestration` calls on different agents and harnesses drain the
      plan in predictable chunks instead of scattering.
    authority: >
      Operator directive 2026-08-09. Implemented by scripts/select-work-batch.sh
      and consumed by skills/advance-work-from-plan and skills/meta-orchestration.
    the_tier_already_exists: >
      The layer between "release" and "packet" is `release_target:
      <milestone-packet-id>` — milestones ARE the epics. Do NOT introduce a
      third object (story/epic/task); the operator considered and rejected that
      on 2026-08-09 in favour of making the existing tier load-bearing.

      What made it not FEEL like a layer was coverage: on 2026-08-09 only 60 of
      176 ready v0.5 packets carried a release_target. With two thirds of the
      work ungrouped, selection degraded to flat priority order, which is what
      produced the scatter. Coverage is the fix, not a new abstraction.
    problem_being_solved:
      - no_cohesion: >
          `tillandsias-plan next linux` returns five correctly-ranked packets
          that routinely span five unrelated subsystems. Draining them means
          five context switches and five subsystem re-reads, so a cycle closing
          one small packet can spend more tokens orienting than working.
      - no_predictable_size: >
          Without a declared budget, throughput cannot be reasoned about across
          hosts or harnesses.
      - no_anti_circling: >
          A packet can accumulate progress events indefinitely without changing
          status, and nothing notices it is being repeatedly re-explored.
    selection_rule: >
      Score each epic by MINIMAX residual, per convergence.yaml ->
      minimax_convergence_strategy, never by priority alone:

        urgency  = 3 - best_priority_rank_in_epic
        blocking = downstream dependents of the epic's packets (capped 10)
        neglect  = age of the epic's oldest ready packet, by order token
        score    = 2*urgency + 1.5*blocking + neglect

      Ranking by priority alone IS the anti-pattern that file names — "raising
      average convergence by improving low-risk obligations while a high-risk
      maximum residual remains unresolved". p0 asserts urgency, not residual.
    entropy: >
      The choice is score-WEIGHTED among the top-K epics (default K=3), from an
      explicit printed seed (default: host kind + UTC date).

      Uniform choice over the top-K would re-introduce the shiny-packet trap:
      with scores 22.8 / 19.7 / 8.5 it takes the 8.5 a third of the time.
      Weighting keeps the largest residual dominant — measured 9/12 runs — while
      leaving smaller ones reachable so nothing starves. Entropy spreads
      coverage over time and stops two concurrent hosts colliding on one epic;
      it does not get a vote on what matters most.
    reproducibility: >
      Predictable drain is a property of batch SIZE, which the budget fixes
      absolutely — NOT of always selecting the same work. Same seed + same
      ledger yields the same batch, so any cycle can be replayed and audited;
      the seed and the whole considered frontier are printed with every batch.
      An unexplained selection is unauditable.
    budgets:
      forge_litmus: 1
      forge_autonomous: 4
      default: 6
      note: >
        ORDER 707-3x9d (2026-08-12): Forge autonomous / pairing sessions scale to
        an adaptive budget of 4 (configurable 3-6) to maximize the
        work-to-orchestration ratio, amortizing fixed meta-orchestration costs
        over cohesive epic batches. The strict budget of ONE packet per cycle is
        retained specifically for unattended litmus step runs
        (TILLANDSIAS_LITMUS_STEP) where a 600s launch timeout is enforced.
    ungrouped_is_not_an_epic: >
      UNGROUPED scores highest whenever coverage is poor, purely on size.
      Letting it win would hand back the scattered batch this rule exists to
      prevent, while hiding the coverage gap behind a plausible selection. It is
      demoted whenever any real epic is eligible, and always reported on the
      triage line so the gap is fixed rather than absorbed.

  worker_agent_protocol:
    purpose: >
      Detailed execution loop for worker agents to claim, execute, and complete shaped work
      from the plan ledger without conflicting or idling.
    steps:
      - step: orient_and_identify
        description: >
          Run start-of-session checks to fetch canonical remote state and determine host/capabilities.
          Use local MCP servers (`project-plan` / `forge-plan` and `project-info`) for instant sub-100ms
          structured queries over plan, methodology, and repo status (`plan_query`, `plan_ready`, `plan_status`,
          `plan_answer`, `methodology_ask`, `git_status`, `search_code`, `read_file`).
      - step: select_shaped_work
        description: >
          FIRST run the batch selector — it applies [[cycle_batch_triage]] and
          answers "what should THIS cycle take?", which flat ranking does not:

            scripts/select-work-batch.sh <role> [--budget N] [--seed S]

          It emits one cohesive, minimax-ranked, budgeted batch drawn from a
          single epic (`release_target`), plus a `triage:` line reporting epic
          coverage and the `frontier` it considered. Work the batch in order.
          Record the printed seed in the cycle's loop-status entry so the
          selection can be replayed.

          The manual ranking below remains the fallback for when the selector
          refuses (`refused:no-eligible-work`, `refused:no-plan-binary`) and the
          rationale for the ranking the selector automates.

          Scan the plan ledger via `project-plan` / `forge-plan` MCP tools (`plan_ready` / `plan_query` / `plan_answer`)
          or direct file inspection. Filter for ready/pending/failed-retryable tasks where owner_host
          matches or is 'any', and matching capability tags exist. Rank the
          survivors by VALUE and RELEVANCE per [[large_packet_is_eligible_work]],
          not by smallness: a large, fresh, release-targeted packet outranks a
          small, stale one. Ranking order: milestone `release_target` first
          ([[release_aware_packets]]), then ACTIVE-release `desired_release` (`v0.5`)
          over later-release ([[version_aware_release_planning]]), then
          freshness. A packet you cannot finish this cycle is still eligible —
          claim it and take a partial slice, split it, or audit-dispose it (the
          three valid outcomes). Do NOT dodge a large relevant packet by
          reaching for an older, lower-value one. In-forge agents also have the
          self-service intake [[in_forge_agent_self_service]] for capabilities
          the lane lacks.
      - step: claim_lease
        description: >
          Write a 'claim' event under the chosen task (upsert), minting a unique lease_id. Commit
          and push to origin/linux-next. If pushed rebase reveals a competing claim, yield and re-select.
      - step: implement_and_checkpoint
        description: >
          Switch to platform branch if target scope requires code work. Perform incremental changes.
          Every 30-45 minutes or at coherent checkpoints, emit an 'agent_status_packet' progress event
          (using the progress/checkpoint event block) and commit/push to linux-next.
      - step: validate_local_litmus
        description: "Run focused local litmus tests to verify current incremental correctness."
      - step: submit_completion
        description: >
          Upon satisfying exit criteria, run the full validation litmus. Write a 'completed' event
          to the events list, update status to 'done', and commit/push to origin/linux-next.
      - step: yield_with_triage
        description: >
          If blocked or failed, write a 'blocked' or 'failed' event with a clear error/reason
          under the item's events list, update status, release the lease, and switch to a ready fallback task.

    harness_affinity_selection:
      decided_by: "order 555 (routing enabler for the operator's harness-validation ask)"
      rule: >
        A forge cycle that knows which harness drives it
        (TILLANDSIAS_HOST_KIND=forge AND TILLANDSIAS_AGENT set to a
        tag-shaped harness name: opencode, claude, codex, antigravity,
        gemini, ...) MUST prefer a ready packet tagged
        [harness-validation, <that harness>] over the general backlog — an
        OpenCode forge claims the OpenCode validation packet, never a random
        platform packet. scripts/select-work-batch.sh implements this: the
        affinity pick takes the batch HEAD (above the order-645 urgent slot —
        a validation forge that defers its own validation never validates its
        harness) and the header confesses it with `harness=<packet_id>`.
      convention: >
        A harness-validation packet tags capability_tags
        [harness-validation, <harness>]. The affinity query is
        release-unscoped for the tier-pool reason: the pool is small and
        hand-curated, and validating THIS harness is valuable whenever its
        packet was filed.
      fallback: >
        No matching ready packet, a non-tag-shaped agent name, or a non-forge
        host leaves the batch untouched — never idle. Bare-metal hosts never
        enter the branch: a host that runs many harnesses proves nothing
        about any one of them.
      pinned_by: "litmus:harness-affinity-selection-shape (fixture-proven; scripts/test-harness-affinity-selection.sh)"
      live_signal_gap: >
        Order 570: the tray launch spec does not yet export TILLANDSIAS_AGENT
        into live forges, so until it lands the affinity branch fires only in
        fixtures. The selector rule is deliberately in place first, so 570's
        landing turns routing on without a second selector change.

    forge_cycle_budget:
      decided_by: "The Tlatoāni (order 264, updated order 707-3x9d 2026-08-12)"
      rule: >
        YES — a forge cycle MAY drain more than one plan packet. It drains as
        much of the batch as fits the 600s launch envelope, taken as ONE story.
        The bound is TIME, never a count. No budget NUMBER lives here:
        scripts/select-work-batch.sh is the sole authority for all of them,
        forge and non-forge, defaults and TILLANDSIAS_CYCLE_BUDGET bounds.
      supersedes: >
        The static 1-packet-per-cycle limit on forge sessions; and (831-ezea)
        mandatory SPLIT on overrun — minting rows exactly when service
        saturates manufactures arrival. Overrun means carry less, not split.
      the_batch_is_a_story: >
        Order 830-6rte (The Tlatoāni, 2026-08-19). The unit of work is the
        STORY, not the packet: take the whole batch, implement it as one
        coherent change, and pay the cycle's fixed costs ONCE — one
        build/verify pass, one loop-status entry, one attestation. Never
        ./build.sh --check per packet; never attest per packet.
        WHY, measured on the fleet 2026-08-16..19: 155 attestation-only commits
        and 88 ledger-bookkeeping commits in three days, against single digits
        for every category of product work; over five days, 127 product-code
        commits against 457 plan-only, 149 attestation-only and 219 merges.
        EVERY CYCLE PAYS THE SAME EXIT COST WHETHER IT CARRIED ONE PACKET OR
        EIGHT — loop-status, attestation record, attestation self-check at the
        new HEAD, and the merges each provokes. Bundling does not shrink the
        overhead; it amortizes it over more delivered work, which is the only
        lever available that does not weaken the exit contract itself.
      count_versus_envelope: >
        The forge bound is TIME, not a count. "One packet" was always a proxy
        for "fits in the 600s launch budget", and it is a bad proxy in both
        directions: three one-line ledger closures fit easily, one large packet
        does not fit at all. Ask the envelope question about the STORY.
      how_this_rule_failed_to_reach_anyone: >
        Recorded because it is an instance of the class it now governs. 707-3x9d
        lifted the single-packet limit on 2026-08-12. The skill agents actually
        read went on saying "Drain at most ONE packet per forge cycle" and
        "Budget is 1 on forge and 3 elsewhere" for a week, in the same paragraph
        that said 4 and 6. Three numbers for one budget; agents took the
        smallest. A methodology change that does not land in the skill is
        "fixed but not enabled", and the fleet spent a week draining one packet
        at a time while tuned for ten.
      interim_note: >
        Reliance on step timeouts is interim. Order 265 (forge
        heartbeat/liveness signals — we own the launch and the container
        stack) tracks replacing timeout inference with positive liveness.

    e2e_token_budget:
      decided_by: "The Tlatoāni, 2026-07-11"
      rule: >
        A FULL in-forge /meta-orchestration e2e cycle is provider-token
        expensive (the in-forge agent runs on a rate-limited provider
        budget). Hosts run it AT MOST ONCE PER 4 HOURS, enforced by
        scripts/forge-e2e-rate-limit.sh (class full-meta, host-persistent
        stamp under ~/.cache/tillandsias/e2e-rate-limit/). Every other
        forge-hosted e2e run MUST downgrade to the skill's Smoke Mode
        (skills/meta-orchestration/SKILL.md "Invocation Modes"):
        verify-only, no plan drain, no commits, final-line verdict
        `MO-SMOKE: PASS|FAIL <reason>`. Launchers go through
        scripts/litmus-opencode-e2e-launch.sh, which owns the branch and
        records the stamp; ad-hoc full-cycle launches outside the limiter
        are a finding.
      rationale: >
        Repeated full cycles per --ci-full and per destructive-gate retry
        (sometimes killed at the step budget, discarding the work) burned
        the in-forge provider budget and tripped provider rate limits that
        then masqueraded as forge-lane outages (2026-07-10 overnight loop,
        order 284 investigation).
      escape_hatch: >
        TILLANDSIAS_E2E_FORCE=1 makes the limiter's check always allow —
        operator use only; its appearance in committed automation is
        itself a finding.

  long_running_packets:
    trace: "plan order 251 (long-running-work-packet-methodology); plan/issues/long-running-work-packet-methodology-2026-07-09.md"
    purpose: >
      Support work packets that cannot be completed in a single agent cycle
      (large audits, cross-cutting designs, multi-agent-verified artifacts)
      without either stalling them or letting a single agent mark them done
      unverified. Extends [[work_item_schema]] additively; every field below
      is optional for ordinary single-cycle packets.
    schema_extension:
      multi_cycle:
        kind: optional
        type: boolean
        note: >
          true marks the packet as long-running: it accretes progress across
          multiple agent cycles and MUST NOT be flipped to done by the
          implementing agent alone when verification_required is present.
      phase:
        kind: optional_when_multi_cycle
        enum: [research, design, review, implementation, verification]
        rule: >
          Coarse substate advanced monotonically by the agent holding the
          cycle lease. Phase regression (e.g. verification back to design)
          is allowed only via a revision event that names the disagreement
          that forced it.
      progress_summary:
        kind: optional_when_multi_cycle
        type: string
        note: >
          One-paragraph rolling summary updated each cycle so the next agent
          orients from the packet header instead of replaying every event.
          Update-in-place is the sanctioned exception to append-only history,
          mirroring the status field's last-writer-wins rule.
      verification_required:
        kind: optional
        fields:
          agents: "list of {id: <agent-id>, criteria: [<criterion-tag>, ...]}"
          completion_gate: "prose rule; default: ALL listed agents emit verified-by with every assigned criterion pass"
        note: >
          Criterion tags (e.g. NA-01, LM-03) are defined in the packet's
          exit_criteria or deliverable document. An agent listed here
          verifies only its assigned criteria and must not implement the
          same slice it verifies.
    lifecycle_rules:
      - "A claim on a multi_cycle packet is CYCLE-SCOPED: it covers one agent session's slice, not the packet. After the cycle's commit, status returns to ready (not claimed) so the next capable agent or verifier can proceed."
      - "Status stays ready across cycles until the completion_gate is satisfied; only then does a completed event flip it to done."
      - "An implementing agent that satisfies all exit criteria emits a progress event stating implementation-complete and sets phase: verification — it MUST NOT emit completed while verified-by events are outstanding."
      - "Each cycle appends events and updates progress_summary/phase; it never rewrites prior events (append-only history holds)."
      - "Orchestrators treat a multi_cycle packet with phase: verification and missing verified-by events as a dispatch item for the named agents, not as stalled work."
    verified_by_event_protocol:
      event_type: verified-by
      fields:
        ts: "UTC ISO-8601"
        agent_id: "the verifying agent's id — MUST match an id in verification_required.agents"
        criteria: "list of criterion tags checked in this event (subset of the agent's assignment)"
        verdict: "pass | fail | pass-with-notes (per event; a fail names the failing criterion and evidence)"
        evidence: "refs to litmus/test output, file:line citations, or reproduction commands"
      example: |
        - type: verified-by
          ts: "2026-07-11T04:00:00Z"
          agent_id: "opencode-bigpickle"
          criteria: [LM-01, LM-02, LM-03, LM-04, LM-05]
          verdict: pass
          evidence: "methodology/distributed-work.yaml long_running_packets section parses + matches plan/index.yaml order 245-251 usage; plan/long-running.md rows cross-checked"
      rules:
        - "verified-by is append-only and idempotent per (agent_id, criteria-set): re-verification after a revision appends a new event; it never edits the old one."
        - "Any fail verdict returns the packet to phase: review with a revision event; affected criteria require re-verification from scratch after the revision (per the packet's completion_gate)."
        - "verified-by events from agents not listed in verification_required are advisory: recorded, but they do not count toward the gate."
        - "The completed event that closes the packet lists the satisfying verified-by events in evidence_refs."
    additive_update_policy:
      rule: >
        Methodology, spec, and cheatsheet changes produced by long-running
        audit/design packets MUST be additive: a new file, a new section
        under the existing root key, or a clearly marked supersede
        annotation (`supersedes: <old-section-or-rule>` plus a one-cycle
        deprecation note at the old site). Rewriting or deleting existing
        prose in place is not allowed while concurrent agents may hold
        cycles against the same documents.
      rationale: >
        Concurrent agents merge branches containing these documents on every
        cycle (pull_merge_cadence.pre_push_gate). Additive edits keep those
        merges union-shaped and conflict-free; in-place rewrites are the
        thrashing trigger [[active_multi_host_mediation_and_conflict_handling.thrashing_mediation]] exists to punish.
      enforcement: >
        Advisory at review time today; candidate for a litmus once the
        pattern stabilizes (a diff-shape check that flags deletions inside
        methodology/ and openspec/specs/ not annotated as supersede).
    sub_queue_view:
      path: plan/long-running.md
      rule: >
        Manually maintained filtered view of ACTIVE multi_cycle packets
        (status not done/failed): one row per packet with order, packet_id,
        phase, blocking dependency, and outstanding verifications. Updated
        in the same commit as any cycle that changes a listed packet's
        phase, status, or verification tally. plan/index.yaml remains the
        source of truth; on disagreement the index wins and the view is
        patched forward.

  cheatsheet_index:
    - cheatsheets/concurrent-git/branches.md
    - cheatsheets/concurrent-git/agent-handoff.md
    - cheatsheets/concurrent-git/plan-discipline.md

  # Order 756-hn3a. Appended 2026-08-15 after a fresh-Windows forge (codex
  # lane) minted lease id "forge--codex-20260815t162555z" — an EMPTY
  # workstation component — because its claim recipe shelled out to a
  # `hostname` executable the forge image does not ship, while
  # HOSTNAME=forge-tillandsias and /etc/hostname were BOTH present in the
  # same process. Identity is now an executable contract, not prose.
  agent_identity_contract:
    trace: order:756-hn3a
    purpose: >
      One canonical, falsifiable source for the agent id every claiming
      workflow writes into leases and events. Hand-composed ids drift with
      whatever executables a host happens to ship; the helper resolves the
      id from stable environment-first sources and REFUSES rather than
      minting an id with an empty component.
    canonical_helper: scripts/agent-identity.sh
    invocation: 'agent_id="$(scripts/agent-identity.sh id <backend>)" || abort-before-claim'
    sourceable: >
      The helper is also sourceable (functions only, no side effects):
      tillandsias_agent_id, tillandsias_node_name,
      tillandsias_sanitize_component.
    id_shape: "<platform>-<workstation>-<backend>-<utc-timestamp>"
    precedence:
      explicit_whole: >
        1. TILLANDSIAS_AGENT_ID — launch-provided, taken WHOLE (sanitized
        once, never recomposed). Preferred: launchers that know the full
        identity should inject it.
      platform: >
        TILLANDSIAS_HOST_KIND=forge or the .forge-startup-context.md
        workspace marker => forge; else bash's own $OSTYPE (survives env -i
        and an empty PATH); else $OS; else `uname -s`. Values: forge, linux,
        macos, windows.
      workstation: >
        2. TILLANDSIAS_WORKSTATION (stable launch-provided identity), else
        3. $HOSTNAME (bash sets it even under env -i; inherited-empty is
        honored as absent), else 4. /etc/hostname via the read builtin — no
        executable needed (TILLANDSIAS_ETC_HOSTNAME overrides the path for
        hermetic fixtures ONLY), else 5. the portable node-name probe
        tillandsias_node_name (hostname -s -> hostname -> uname -n ->
        /etc/hostname), which is the SAME function mo-full-attest.sh's host
        label uses (743-mgf3) — one implementation, no drift.
      backend: >
        The harness lane: explicit argument to `id`, else TILLANDSIAS_AGENT
        (the harness TYPE — claude|codex|opencode|gemini — order 570). Never
        guessed.
      timestamp: >
        UTC, %Y%m%dt%H%M%Sz, via bash's printf '%(...)T' builtin — a minimal
        image without date(1) cannot lose this component.
    sanitization: >
      Exactly once, in the helper: lowercase, every character outside
      [a-z0-9-] becomes '-', runs of '-' collapse, leading/trailing '-'
      trimmed. Consumers never re-sanitize.
    refusal: >
      If platform, workstation, backend, or timestamp resolves empty (or an
      explicit id sanitizes to nothing): stdout stays EMPTY, exactly one
      stderr line matching
      ^refused:agent-identity:empty-(explicit-id|platform|workstation|backend|timestamp)$
      and a non-zero exit — BEFORE any append-event. A refused identity is a
      blocked claim, never an improvised one.
    fixture: scripts/test-agent-identity.sh
    pinned_by: litmus:agent-identity-canonical-source-shape
    consumers:
      - "skills/advance-work-from-plan/SKILL.md §1.4 (Create Agent ID) and §3 (claim events)"
      - "scripts/mo-full-attest.sh (shares tillandsias_node_name for its ledger host label)"

  sibling_heads_up_protocol:
    rationale: >
      Hosts can message each other directly (ListAgents / SendMessage over
      Remote Control). The capability is NEW and agents do not discover it on
      their own — the coordinator stumbled onto it on 2026-08-25 after months
      of the fleet coordinating exclusively through the ledger and the trunk.
      A ledger is an excellent record and a terrible way to say "I am about to
      change a thing you depend on", because it is read AFTER work, not before.
    the_defect_this_prevents: >
      THE STRUCTURAL ARGUMENT, which holds regardless of anyone's diligence:
      THE UNION IS A STATE NO SINGLE BRANCH'S GATE OBSERVES. Every branch can be
      green alone and the merge still broken, because no branch's `--check` ever
      compiles the other's configuration. Care does not close that gap; only a
      second lane looking does.
    worked_example: >
      MEASURED 2026-08-26. macbook landed 731-eupn on osx-next: CloudRefreshReply
      gained an `outcome` discriminator so an empty project list from a FAILED
      fetch stops being indistinguishable from a confirmed-empty account. Good
      fix. They updated vsock_server.rs:1365 and missed tray/mod.rs:1383. Each
      branch was green alone; the union was E0063 + E0308, costing a red gate
      and ~30 minutes of coordinator cycle.

      THE CAPTION MATTERS AND THE FIRST VERSION OF IT HERE WAS FALSE. This
      section originally said the author "could not see" the Linux site because
      that lane does not compile on macOS. macbook checked and refuted both
      halves: `cargo check -p tillandsias-headless --features tray --all-targets`
      finishes in 6.80s on their Mac (the `tray` feature's deps — image, zbus,
      zvariant — are cross-platform and nothing target-gates the file), and the
      missed call site was THE TENTH LINE of their own
      `grep -rn CloudRefreshReply ... | head -10`. They had it on screen and let
      a `head` boundary decide where the survey ended.

      So the accurate caption, in their words: the author had every call site in
      his own grep output and compiled only the configurations his host reaches
      by default; a heads-up would have caused the LINUX LANE to check its own
      configuration, which no amount of care on the macOS side substitutes for.

      Kept in this form deliberately. An exculpatory example teaches a reader
      that the defect was unavoidable, which is both false and demotivating; the
      protocol does not need it, because the structural argument above is enough.
    the_gated_module_rule: >
      WHEN A MODULE IS GATED OUT OF YOUR HOST'S DEFAULT BUILD, A GREEN BUILD IS
      NOT A CHECK OF IT — `-p <crate>` selects a PACKAGE, not a configuration.
      Two measured instances of one class in three days: macbook's FEATURE gate
      (the `tray` feature never compiled — the worked example above) and
      lenovinha's TARGET gate (2026-08-29, fixing this same 731-eupn defect on
      the Windows lane: `cargo check -p tillandsias-windows-tray --all-targets`
      was green on Linux while compiling the cfg-gated STUB
      src/stubs/notify_icon.rs; the tell was two stale call sites of a changed
      signature still building clean). The check that counts compiles the gated
      configuration itself (`--features tray`, `--target
      x86_64-pc-windows-gnu`), and the verifier must be mutation-tested before
      it is trusted: append a deliberate type error to the REAL module and
      confirm the cross-configuration build goes red, silent when reverted. A
      signature change whose stale callers build green is a build that did not
      look.

      THE INVERSE INSTANCE, and the structural fact behind it (2026-08-29,
      the same 793-zumy fn): a helper added on the Windows lane compiled
      only in its target_os="linux" configuration there (the Windows gate
      builds inside WSL2), was dead code off-Linux, and left trunk
      UNBUILDABLE on darwin under -D dead-code until the fleet's one Apple
      host happened to compile. The author's own gates could not catch it:
      the Windows lane never compiles the non-Linux arm of files it edits,
      check-cross-target-build.sh is single-target, and no Apple target is
      reachable from a non-Apple host. STATE THE STRUCTURAL FACT PLAINLY:
      for some platforms, ONE host is the sole detector of the entire
      compile surface. The cheap mitigation is a review-time convention,
      not a gate: in a file whose helpers carry cfg attributes, a NEW
      helper inherits its neighbours' attribute unless there is a stated
      reason not to — the convention was on the line directly above the
      insertion point, which is exactly where the next author will not
      look unless told to.

    the_gated_module_rule_inverse: >
      THE MECHANISM OF THE INVERSE INSTANCE ABOVE, from the host that found it
      (macbook, 935-6fzk). `wsl2_paravirtual_gpu_reason` had exactly ONE
      production caller, `enumerate_gpus`, which is
      `#[cfg(target_os = "linux")]`. On Linux the function is live. On macOS
      that caller vanishes, the only remaining reference is `#[cfg(test)]`, and
      the NON-TEST build therefore sees dead code — which `-D warnings` turns
      from a lint into a HARD BUILD FAILURE. The trigger is not the cfg alone;
      it is a cfg-gated sole caller plus a test-only survivor plus deny-warnings,
      and each is individually reasonable.

      WHAT MAKES IT INVISIBLE TO THE AUTHOR: nothing in their configuration is
      wrong, nothing they can run goes red, and the defect is not in the code
      they wrote but in the code that is MISSING on the other side of the cfg.
      No amount of care at the keyboard surfaces it; only compiling the other
      configuration does.

      THE FIX SHAPE, when a helper exists for a platform-gated caller: gate it
      the same way, plus `test` so the assertion it exists for still runs
      everywhere — `#[cfg(any(target_os = "linux", test))]`. Gating on the
      platform alone breaks the test on every other host, which is the same
      defect wearing the opposite sign.

    the_sole_detector_surface_is_wider_than_cfg_code: >
      THE GENERALISATION, proven three ways in one night on macbook
      (2026-08-30). The rule above reads as if this were a Rust `cfg` problem.
      It is not. The invariant is: SOME SURFACES HAVE EXACTLY ONE HOST THAT
      CAN SEE THEM, and a change that is green on every other lane can be
      trunk-broken there with nobody learning until that host tries to push.
      Three distinct surfaces, same night, same shape:

      (1) CFG-COMPILED CODE — the instance above.

      (2) SHELL DIALECT. Apple ships bash 3.2 and nothing newer.
      `"${arr[@]}"` on an EMPTY array is an unbound-variable death under
      `set -u` there, and expands to nothing on bash 4.4+. 776-cm74 added a
      branch to hash-image-sources.sh that left one of two arrays empty
      whichever way it went; linux and windows could not see it, and it broke
      747-knbp, which BLOCKED EVERY PUSH FROM THE MAC.

      (3) SEALED-PATH ENVIRONMENTS — the subtlest, because the obvious
      diagnosis is wrong. The 747-knbp fixture runs build-image.sh under
      `env -i` with `PATH="$WORK/bin:/usr/bin:/bin"` so its podman stubs are
      the only ones reachable. On linux that PATH still carries
      /usr/bin/timeout because coreutils is base; on macOS nothing there
      provides it. The host was NOT missing the tool — /opt/homebrew/bin/timeout
      exists. It is a sealed PATH that only linux survives. Read as a missing
      host tool, the "fix" is to install coreutils on every mac forever; read
      correctly, it is to stop requiring a non-POSIX tool inside a hermetic
      fixture. A hermetic PATH is a PORTABILITY CLAIM, and the claim is only
      ever tested on the hosts that run it.

      THE MITIGATION IS TWO-PART, and the second half is the point. Review-time
      convention alone does not survive contact: a reviewer on linux cannot see
      any of these three. So whenever a sole-detector surface is found, ask
      whether one slice of it can be made MECHANICAL, and give that slice to
      the gate that already owns the class. Case (2) became a rule in the
      bash-dialect gate — the gate had PASSED the broken file, being the very
      gate that exists for the linux/darwin split. Case (3) has no gate yet and
      remains review-time.

      COROLLARY, and the reason this is filed rather than left to convention:
      A DIALECT GATE MUST BE ABLE TO GROW RULES FROM THE HOST THAT DETECTS THE
      DIALECT. Requiring the sole detector to get permission from hosts that
      cannot reproduce the finding is the sole-detector problem eating its own
      solution.

      PROTOCOL: adding a helper whose only non-test caller is cfg-gated is a
      SHARED-SURFACE change under `why_a_message_and_not_more_care` — the
      sibling lane is the only party that can check it. Say so, or gate it at
      the moment you write it.
    why_a_message_and_not_more_care: >
      A HEADS-UP IS A FALSIFIABLE ACT AND CARE IS NOT (yoga, 2026-08-26).
      "I considered the siblings" cannot be checked by anyone, including its
      author an hour later. "I sent a message naming the surface, and lenovinha
      ACKed" exists in two transcripts and a ledger. Same reason
      `cross_host_relay_provenance` works: it replaced a disposition with an
      artifact.

      Evidence that care is the wrong lever, self-audited: within an hour of
      this section landing, yoga reviewed their own night and found FOUR
      shared-surface changes shipped with zero heads-ups — including wiring a
      NEW GATE into `build.sh --check` (build.sh:2016), which every host then
      runs on every gate. Had it been wrong, the whole fleet goes red at once
      and the author is the only one who cannot see it. None of the four broke a
      sibling, and yoga's own summary of that is the point: "the union was green
      because the changes happened to be self-contained, not because I
      established that before landing them — that is luck presented as
      diligence."
    when_to_send:
      - >
        BEFORE changing a SHARED SURFACE: a wire type or shared struct, a
        script another lane executes, a litmus/YAML schema, a methodology rule,
        or any guard wired into `./build.sh --check`. These are the changes
        whose blast radius leaves your lane.
      - >
        BEFORE taking a packet whose live claim overlaps a sibling's. Run
        `tillandsias-plan query --status in_progress` — AFTER the branch merge,
        never before it — and if a live claim touches the surface your batch
        touches, message that host BEFORE implementing.
    the_ordering_is_the_step: >
      MEASURED 2026-08-26, one cycle after this section landed, by its own
      author running it. The check first shipped as meta-orchestration step 2a,
      placed before the branch update, and it MISSED the very claim it existed
      to find:

        before the merge:  831-ezea only          (yoga's claim invisible)
        after the merge:   642-fedr + 831-ezea    (yoga, on fragments.rs)

      `git fetch` updates remote-tracking refs; it does NOT update the worktree
      ledger `tillandsias-plan` reads. A check placed before the merge sees
      claims as of your LAST merge — and a stale ledger always shows FEWER
      claims, never more, so it FAILS SILENTLY TOWARD "no overlap", which is
      the answer that looks safe. Moved to step 5a, after the merge.

      `expire-claims --list-live` is the tool again as of 905-wjfj: it prints
      one row per in_progress packet plus a `rows:` line whose total must equal
      the summary's `in_progress=N`. Before that fix it printed the count and no
      rows — two hosts hit it on the same day, one while performing this exact
      step — and `query --status in_progress` was the workaround. That still
      works as a cross-check.

      READ THE ROW TYPE; the two carry opposite instructions.
      `live-claim` names a host to message. `unclaimed-in-progress` carries
      dashes where the host and claim time would be, and those dashes ARE the
      finding: the packet is in_progress, recent enough that no reaper will
      surface it, and there is nobody to send a heads-up to. Silence on that row
      is not evidence the surface is free — it means the protocol has no
      addressee and you inspect the diff yourself. MEASURED: 831-ezea sat there
      for over a day with a gate step wired into `./build.sh --check`.
      `attention:list-live-partition-mismatch` means the enumeration is
      under-reporting; a "no overlap" verdict derived from it is not evidence.
      - >
        WHEN YOU LAND something a sibling is waiting on — "pull when you are
        done" — so a blocked host stops guessing whether it is blocked.
    when_NOT_to_send:
      - >
        Routine drain confined to your own lane. Most work is this. A channel
        that carries everything is one nobody reads, and interrupting a working
        agent has a real cost — it is mid-cycle, holding a checkout lock, and
        its context is expensive.
      - >
        Anything already unambiguous in the ledger. The heads-up is for what the
        ledger CANNOT carry in time: intent, before the fact.
    shape: >
      Low ceremony, deliberately. HEADS UP: the surface you are touching, the
      shape of the change, any sibling call sites you already know of, and the
      ask. The recipient replies ACK plus comments — either "no sites on this
      lane" or "site at <path>; I will take it" / "you take it". Two messages,
      under a minute each. This is not a design review and must not become one.
    the_honest_caveat: >
      A prose rule that depends on an attentive agent is a suggestion, not a
      constraint — this file says so elsewhere and the fleet proved it twice in
      one night (a documented `tee | head` trap walked into hours after being
      read; a documented skip-flag missed by the release runbook). So the
      forcing function is the Start Of Cycle live-claim check above, which is
      mechanical, and the honest expectation is that THIS SECTION ALONE WILL BE
      HONOURED INCONSISTENTLY until a check surfaces the overlap without being
      asked. That check is worth filing rather than assuming.
    consumers:
      - "skills/meta-orchestration/SKILL.md (Start Of Cycle 5a — AFTER the merge; note .claude/skills is a SYMLINK to this path, cite the real one)"
      - "skills/coordinate-multihost-work/SKILL.md"
