
# freshness: auditor=forge-antigravity-20260721 date=2026-07-21 verdict=refreshed scope=core_principle+runtime_ephemerality

philosophy:
  core_principle: >
    Monotonic reduction of uncertainty under verifiable constraints.

  system_model: >
    A closed-loop system where specs define intent, cheatsheets provide compressed knowledge,
    code implements behavior, traces provide evidence, litmus tests define decision boundaries,
    and CI enforces correctness and convergence.

  invariants:
    - cheatsheet_size_bounded: true
    - spec_stability_required: true
    - verification_claims_must_be_falsifiable: true
    - convergence_requires_stability: true
    - evidence_is_not_proof: true

  global_invariants:
    - no_behavioral_ambiguity_allowed
    - all_requirements_must_be_testable
    - all_specs_must_bind_to_litmus
    - all_specs_must_bind_to_trace
    - spec_changes_must_reduce_uncertainty_or_enter_bounded_exception
    - validated_invariants_are_stable_until_superseded_by_stronger_evidence
    - spec_is_source_of_truth_not_code
    - convergence_claims_must_cite_evidence_bundle
    - runtime_substrate_is_ephemeral_recreate_never_repair

  runtime_ephemerality:
    principle: >
      Everything at RUNTIME is ephemeral by design. Persistence (vaults,
      clones, caches, provisioned guests) is a convenience side-effect, not a
      source of truth — everything of value lives in the cloud and the
      operator's identity. Therefore the DEFAULT response to a borked
      host/VM/guest/podman/stack layer is to DESTROY and RECREATE it, never to
      hand-patch it forward. Fix-forward is reserved for durable bugs in
      source/spec/config; it is the wrong tool for borked runtime substrate.
      Directive: The Tlatoāni, 2026-07-17. Detail:
      plan/issues/ephemeral-runtime-destroy-and-recreate-directive-2026-07-17.md.
    anti_pattern: >
      Hand-fixing a disposable layer tends to spawn a new failure one layer
      down (live 2026-07-17: vault key skew → generate-root → unseal-secret
      regen → podman pause-process → podman uid_map/subuid). Never slow the
      loop to nurse borked substrate.
    ladder:
      layers: "podman/stack -> guest(WSL/VZ) -> host tray -> release"
      step_1: "Recreate the borked unit from scratch; it is designed to come up clean."
      step_2: "If that fails, throw away the unit AND the layer above, recreate both (guest keeps coming up stale? recreate the tray too — its version pins the guest)."
      step_3: "Repeat up the ladder. A stale release is a layer: recreate from CURRENT SOURCE when the release lags (order 334)."
    guardrail: >
      Applies to the runtime substrate only. NEVER destroys durable work —
      committed/unpushed code, specs, plan, methodology (those follow
      between-commits-work-discipline: push to origin first). If a recreate
      path ITSELF loops, that is a real bug in the recreate path — file it,
      do not fall back to fix-forward.
    error_message_policy: >
      User- and agent-facing errors for borked RECREATABLE runtime state must
      instruct recreation with the exact command ("just recreate this
      container/guest — it's ephemeral; you'll re-auth once"), not dead-end
      remediations ("operation not permitted / try X / reboot to recover").

  math_foundations:
    - claim: "Finite ordered convergence under declared validators."
    - lattice_model: "Stable obligations form a finite lattice; evidence-improving transitions are checked for monotonicity."
    - ranking_function: "CentiColons are a bounded ranking function over that model. They measure residual obligation closure, not probabilistic certainty."
    - fixed_points: "A fully closed spec is a fixed point of the local refinement operator."
    - unknown_events: "Unknown-event intake is the escape hatch that prevents the model from confusing current completeness with absolute truth."

  multi_version_convergence:
    # Operator framing, The Tlatoani 2026-07-29. Resolves the apparent conflict
    # between per-release bar raising and bar_raise_governance's rule that the
    # loop must not self-escalate: a bar raise IS a release event, and releases
    # are operator-cut, so the governance gate is satisfied by construction.
    statement: >
      Convergence is asymptotic across versions, not terminal within one.
      Write T_v for the target (the specs at version v), I_v for the
      implementation, and d(I_v, T_v) for residual distance. Because the specs
      themselves evolve, T is a MOVING target and no final convergent state
      exists. The guarantee is therefore not "d reaches 0 at some version" but
      lim(v -> infinity) d(I_v, T_v) -> 0: every release gets closer, so the
      sequence converges even though the target keeps moving.
    within_a_release: >
      Inside release v the bar B_v is FIXED. The reduction engine converges to
      a fixed point of the refinement operator at B_v; zero residual at B_v is
      a complete, well-defined "done" (convergence.yaml bar_raise_governance).
      This is what makes "done" decidable at all.
    at_a_release_boundary: >
      Cutting release v+1 IS the bar raise: a Lamport-clock tick in logical
      version time at which fitness is re-evaluated against the then-current
      specs and B_{v+1} advances. Bar raises are therefore not continuous
      self-escalation by the loop (forbidden) but discrete, operator-gated
      events (a release is cut by The Tlatoani).
    enforceable_guarantee: >
      lim() is not mechanically checkable, but its per-step precondition is:
      d must be NON-INCREASING from release to release. That is what the
      technical-debt ceiling measures and enforces — a countable proxy vector
      for d, compared release-over-release. Monotone non-increase at every
      Lamport tick is exactly the discrete condition that makes the limit
      claim honest rather than aspirational.
    corollary_no_debt_accretion: >
      "More feature rich with no regressions, and less debt than the previous
      release" is the operational reading of the same inequality: the feature
      set may only grow, the debt vector may only shrink or hold, and any
      component that would increase requires explicit operator sign-off
      recorded at the release boundary.

  obsolete_mechanism_live_intent:
    # Operator-ratified sweep discipline, The Tlatoani 2026-07-29, after an
    # adversarial pass refuted 9 of 10 "already satisfied"/"obsolete" claims.
    principle: >
      A packet, spec, guard, or component names both a MECHANISM (how) and an
      INTENT (why). These decay independently. The sweep question is never
      "is this still accurate?" but two questions: is the mechanism still
      real, and is the intent still live?
    dispositions:
      mechanism_dead_intent_dead: "obsolete — close/tombstone with evidence for both halves."
      mechanism_dead_intent_live: >
        REWRITE, never close. The work is real; only its stated implementation
        died. Closing here silently drops the obligation — the precise failure
        this discipline exists to prevent. Record the replacement premise in
        the same edit.
      mechanism_live_intent_dead: >
        Retire deliberately, but check for dependents first: shipping code
        whose purpose lapsed is removal work, not a no-op.
      mechanism_live_intent_live: "still valid — drain, split, or downgrade on effort/priority alone."
    closure_preconditions: >
      An obsolete-close requires BOTH (a) the mechanism is verifiably absent at
      HEAD, cited in code or spec — a packet's own optimistic events are NOT
      evidence — and (b) the intent is served elsewhere with that replacement
      named and checked against every exit criterion, or is explicitly moot.
      Additionally, no other packet may list it in depends_on: closing a
      depended-on packet dangles the dependent.
    verification_rule: >
      Obsolescence and satisfaction claims are ADVERSARIALLY verified before
      any ledger closure — an independent pass that tries to refute the claim
      and defaults to refuted under uncertainty. Wrongly-closed work is
      invisible forever; a wrongly-open packet costs one re-read.

layers:
  - name: spec
    description: >
      Canonical, versioned, machine-verifiable definition of intent and constraints.

  - name: cheatsheet
    description: >
      Compressed, curated, adaptive knowledge cache with provenance and metrics.

  - name: code
    description: >
      Rust implementation annotated with attributes enforcing observability and traceability.

  - name: trace
    description: >
      Runtime evidence linking implementation to spec and knowledge sources.

  - name: litmus
    description: >
      Executable decision boundaries for correctness.

  - name: metrics
    description: >
      Signals derived from execution (hits, misses, verification levels).

  - name: evidence_bundle
    description: >
      Queryable set of spec versions, artifact hashes, commits, litmus runs,
      trace coverage, environment profile, and dependency locks that supports a
      convergence claim without pretending to prove absolute correctness.

  - name: provenance
    description: >
      Auditable source graph for methodology claims, specs, cheatsheets, and
      evidence bundles. Provenance records why a claim is trusted, what it depends
      on, and how it can be falsified.

  - name: unknown_event
    description: >
      Structured intake record for observations the current methodology did not
      predict. Unknown events preserve surprises until semantic distillation
      updates a durable spec, litmus, cheatsheet, trace, or methodology artifact.

  - name: proximity
    description: >
      CentiColon residual-obligation scoring. Proximity reports how much named,
      auditable correctness work remains; it is not proof of correctness.

  - name: ci
    description: >
      Global validator enforcing invariants, detecting drift, and applying selection pressure.

evidence_boundaries:
  principle: >
    Traceability, version matching, litmus success, and CRDT metadata convergence
    are evidence. They are not proof of semantic correctness by themselves.

  claim_strength:
    provenance: "artifact, spec, and commit can be linked"
    structural: "schemas, annotations, bindings, and dependency locks are valid"
    behavioral: "litmus tests exercise the claimed behavior and pass"
    operational: "runtime traces show the behavior remains stable under observed conditions"

  rule: >
    A convergence claim MUST name its highest supported claim strength and cite the
    evidence bundle that supports it.

  methodology_rule: >
    A methodology claim MUST cite a provenance claim or be treated as an explicit
    assumption until proven by external source, repository evidence, or litmus signal.

pitfalls:
  - cheatsheet_entropy_growth_without_bounds:
      description: >
        Cheatsheets expand to answer every question without being compacted,
        becoming unwieldy and losing canonical status.
      mitigation: Enforce automatic compaction, bounded size limits.

  - spec_ambiguity_causing_oscillation:
      description: >
        Behaviorally ambiguous specs permit externally meaningful differences
        that tests cannot distinguish, causing code to oscillate during refactoring.
      mitigation: Behavioral ambiguity score must be 0 before spec activation.

  - implementation_freedom_misclassified_as_ambiguity:
      description: >
        A spec can be precise while allowing multiple internal implementations.
        Treating every implementation difference as ambiguity over-constrains the
        system and blocks useful optimization.
      mitigation: >
        Distinguish behavioral ambiguity from acceptable implementation latitude.
        Only observable differences that matter to the contract require new invariants.

  - multi_api_semantic_collision_without_binding:
      description: >
        A single identifier (e.g., "read") means different things in different contexts
        (file I/O, network, database). Annotations don't disambiguate.
      mitigation: #[grounded_by] explicitly disambiguates across APIs.

  - agents_gaming_metrics:
      description: >
        Agents hardcode success to game litmus tests or cheatsheet scores,
        creating false convergence signals.
      mitigation: >
        Mutation testing, code review, and mutation analysis verify tests
        actually touch the code they claim to validate.

  - divergence_between_spec_and_code:
      description: >
        Code drifts from spec intent over time without detection because
        litmus tests pass but only exercise happy paths.
      mitigation: >
        Negative testing (failure path validation), temporal stability checks,
        repeated test runs to detect flakiness.

  - excessive_macro_complexity:
      description: >
        Procedural macros (#[trace], #[grounded_by]) become harder to understand
        than the code they annotate.
      mitigation: >
        Keep macros simple; implement complex logic in CI validators, not in macros.

  - encoding_temporal_truth_in_static_code:
      description: >
        Code embeds assumptions about time (e.g., "retry 3 times" in a loop)
        that become incorrect when conditions change.
      mitigation: >
        Distinguish deterministic logic from timing assumptions. Timeout boundaries
        are observable signals, not correctness logic.

  - turning_cheatsheet_into_general_wiki:
      description: >
        Cheatsheets expand to cover "everything nice to know" instead of
        "everything required to implement this spec."
      mitigation: >
        Bind cheatsheets to specs. Remove entries with no spec binding.
        Use spec hit/miss signals to guide expansion/compaction.

bounded_uncertainty_exception:
  purpose: >
    Discovery can legitimately reveal that a validated invariant was incomplete,
    a spec was too narrow, or a litmus test encoded a false assumption. The system
    must allow temporary uncertainty increases without normalizing drift.

  gates:
    - exception_requires_issue_or_rfc
    - affected_specs_enter_quarantine_or_draft_state
    - old_invariant_remains_visible_until_replaced
    - replacement_must_cite_stronger_evidence_bundle
    - migration_window_and_owner_are_required

  exit_criteria:
    - new_spec_has_behavioral_ambiguity_zero
    - litmus_bindings_updated_or_retired
    - traces_and_evidence_bundle_rebuilt
    - exception_record_closed_with_root_cause

final_assertion: >
  The system converges only if: (1) knowledge remains compressed and canonical,
  (2) specs remain stable and machine-verifiable, (3) every claim made in code
  is continuously validated against observed reality, and (4) litmus tests
  reproducibly verify that code satisfies its governing specs. Convergence is
  monotonic under normal operation: once achieved, divergence must become
  detectable and recoverable. When learning invalidates prior assumptions, the
  bounded uncertainty exception records and gates the temporary loss of certainty.
  When learning reveals a previously unmodeled unknown, methodology/event records
  the surprise and semantic distillation preserves the learned distinction.

# ── Capability scales with topology; the interface does not (2026-08-02) ──────
capability_ladder:
  decided_by: "The Tlatoāni, 2026-08-02"
  rule: >
    Tillandsias is a REAL CLOUD that works almost the same with one node as with
    dozens. An entry-level user with a single laptop hosts their own services. A
    power user with a few nodes gets more robust ones. As topology grows, more
    robust services become AVAILABLE — the user does not reconfigure, and does
    not choose.
  we_decide_for_them: >
    The user is not asked which database, which replication factor, or which
    storage layer. They cannot evaluate those, and asking is how a
    non-technical user acquires a risk they do not understand. We pick, using
    options that are already thoroughly documented and solved — the work is
    WIRING the best-known answer, not inventing one.
  the_obligation_that_creates: >
    Deciding for someone is only legitimate if the decision is reversible.
    Every default we choose on a user's behalf MUST have a migration path off
    it, and that path must be ours to run, not theirs. A default without a
    migration path is not a decision made for the user; it is a trap set for
    them.
  the_almost_is_load_bearing: >
    "Almost the same" is exact, and the gap is DURABILITY, not features. A
    single laptop cannot survive its own loss; three nodes can lose one. The
    INTERFACE is topology-independent — "add a database" is the same prompt
    everywhere — but the GUARANTEES are not, and they must be legible in the
    user's own language ("this survives your app crashing, not your laptop
    dying"). Presenting identical guarantees across topologies is how users
    lose data while believing they were safe.
  the_hard_part_is_the_migration: >
    Neither endpoint is hard. Anyone can run one Postgres on one disk; anyone
    can run a cluster. Moving a LIVE user's data from the first to the second —
    automatically, without loss, without a maintenance window they would have to
    understand — is the actual product. Judge a packet on whether it makes the
    NEXT rung reachable, not only on whether it works at its own.
  never_foreclose_a_higher_rung: >
    A tier-1 choice must not make tier-3 unreachable. If the single-node default
    stores data in a shape that cannot later stream-replicate, the first
    decision has trapped the user at the bottom of the ladder — and they will
    discover it exactly when they finally need to grow. Every default is chosen
    with its successor already in mind.
  support_before_spoon_feeding: >
    We support every layer of abstraction and every option FIRST, then expose
    them in order of complexity as a project grows organically — from one app on
    one laptop to a distributed cluster serving millions. Exposure is
    progressive; capability is not. A rung we cannot implement is a rung we must
    not imply.
