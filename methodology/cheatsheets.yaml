
cheatsheets:
  structure:
    id: string
    entries:
      - key: string
        content: string
        metadata:
          hits: integer
          misses: integer
          last_used: timestamp
          specs: list
          verification_levels: map
          provenance: list
          confidence: float
          size_cost: integer

  properties:
    - acts_as_compressed_hot_cache
    - must_be_lossy_but_canonical
    - must_be_bounded_in_size

  provenance:
    required: true
    examples:
      - "official docs"
      - "standards"
      - "trusted sources"
    rule: >
      Cheatsheet provenance MUST come from remote authoritative sources owned by
      the technology provider or from stable standards bodies. Project-local
      inference is not provenance; it is a derived note and MUST be labeled as
      such. Derived notes SHOULD be minimized and, when possible, moved into the
      owning spec instead of staying in the cheatsheet cache.

  versioning:
    tied_to_environment_hash: true
    triggers_revalidation_on_change: true

cheatsheet_operations:
  description: >
    Cheatsheets are not static documents. They grow, shrink, and evolve based on
    usage signals (hits/misses), spec bindings, and verification deltas.

  signals:
    - hits: "how many times this entry was consulted and succeeded"
    - misses: "how many times this entry was consulted and failed"
    - spec_bindings: "which specs reference this entry"
    - verification_deltas: "when litmus tests fail due to stale content"
    - token_size: "how many tokens this entry costs to include in context"

  scoring_function: |
    score =
      w1 * normalized_hits
    + w2 * spec_binding_strength
    + w3 * recency_decay
    + w4 * verification_success
    - w5 * size_cost

  actions:
    expand:
      condition: "high_misses"
      method: "targeted_patch_only"
      goal: "Add specific content that litmus tests revealed missing"

    compact:
      condition: "high_hits_and_low_misses"
      constraint: "must_preserve_success_rate"
      goal: "Compress well-understood content into concise form"

    delete:
      condition: "low_hits_and_no_spec_binding"
      goal: "Remove orphaned entries no longer in use"

    protect:
      condition: "high_score_or_high_spec_criticality"
      goal: "Prevent deletion of critical-path knowledge"

  compaction:
    definition: "semantic compression preserving correctness"
    invariant:
      - no_loss_of_L1_success_rate
    rollback_on_failure: true
    method: >
      Replace verbose examples with minimal patterns. Remove redundant sections.
      Preserve all information that distinguishes success from failure.

crdt_model:
  description: >
    Cheatsheets use a semantic merge model. They may be treated as CRDT-safe only
    when their merge and compaction rules satisfy the listed preconditions. Lossy
    compression by itself is not a CRDT.

  type: "semantic_cache_with_crdt_preconditions"

  merge_rule: "merge = stable_id_union + tombstone_resolution + deterministic_normalization + verified_compression"

  crdt_preconditions:
    - stable_entry_ids
    - tombstones_for_deletions
    - deterministic_tie_breakers
    - compaction_is_idempotent
    - compaction_preserves_bound_spec_distinctions
    - property_tests_for_commutativity_associativity_idempotence

  constraints:
    - must_not_grow_unbounded: "Size limit enforced; evict low-score entries"
    - must_preserve_high_confidence_entries: "Never drop entries with verification_success > 95%"
    - must_eliminate_redundancy: "Merge duplicate or overlapping entries"

  anti_pattern:
    - grow_only_crdt_forbidden: >
        "Calling a lossy semantic cache a CRDT without stable IDs, tombstones,
        deterministic merge, and property tests creates false convergence claims."

cache_model:
  definitions:
    hit: "resolved_without_leaving_cheatsheet"
    miss: "requires_api_lookup_or_retry"

  metrics:
    per_entry:
      - hits: "count of successful consultations"
      - misses: "count of failed consultations"
      - assisted_resolutions: "count of times this entry helped resolve a query"

  policies:
    - enforce_global_size_limit: "Total cheatsheet bytes <= LIMIT"
    - evict_low_score_entries: "If size exceeds limit, remove lowest-scoring entries"
    - compact_mid_score_entries: "Compress entries with score > median but below high threshold"

  hit_rate_target: "> 85%"
  miss_triggers_action: "If miss_rate > 15%, flag for expansion or verification"

cheatsheet_binding:
  description: >
    Specs reference cheatsheets to pin tool versions and document idiomatic usage.
    This binding creates bidirectional dependency: cheatsheet changes trigger spec
    re-validation; spec changes may invalidate cheatsheet assumptions.

  requirements:
    - cheatsheet_frontmatter_required:
        reason: >
          Every cheatsheet MUST carry YAML frontmatter so the validator can
          classify tier, authority, status, provenance, and lifecycle metadata
          without relying on ad hoc filename heuristics.

    - cheatsheet_tier_must_be_explicit_or_inferable:
        reason: >
          Tier is a measurable obligation, not optional decoration. A cheatsheet
          may omit it only when the allowlist inference path is authoritative and
          reproducible.

    - every_spec_must_reference_cheatsheet_entries:
        reason: >
          Specs must document the tools/languages/APIs they use.
          Cheatsheets pin the versions and patterns for those tools.

    - cheatsheet_entries_must_have_provenance:
        reason: >
          All entries must cite authoritative sources (vendor docs, standards, etc).
          Without provenance, outdated entries can't be detected.

    - project_local_inference_must_be_separated:
        reason: >
          Local Tillandsias guidance is allowed only as a clearly labeled
          derivation from the upstream sources. It cannot replace the upstream
          provenance chain.

    - cheatsheet_usage_must_be_measurable:
        reason: >
          Every cheatsheet entry tracks hits/misses/verification_deltas.
          Unused or failing entries are deleted to keep the cache compact.

  # ---------------------------------------------------------------------------
  # Where cheatsheets LIVE, and which copy is authoritative.
  #
  # Added 2026-08-16 by operator directive after the archaeology recorded in
  # plan/issues/cheatsheet-derived-tree-tracking-decision-2026-08-16.md. Canon
  # had been SILENT on storage: it required provenance and frontmatter but never
  # said which tree owns them, so a false "it is gitignored, therefore not
  # committed" claim survived 21 days in the ledger, propagated into two tool
  # docstrings, and left the shipped image advertising five cheatsheets whose
  # files were absent. Silence is what let that happen; this block ends it.
  storage_and_authority:
    authority: "The Tlatoāni, 2026-08-16 (justify-every-moving-part directive)"

    authoring_surface: >
      cheatsheets/ is the SOLE authoring surface. Every provenance gate reads
      only this tree, so frontmatter here (tier, sources, authority, status,
      last_verified, bundled_into_image, committed_for_project) is the ONLY
      attribution the project recognizes.

    derived_tree_is_a_tracked_build_input: >
      images/default/cheatsheets/ is a DERIVED copy that is nonetheless TRACKED,
      deliberately. It is a build input, not a convenience copy: the headless
      build.rs embeds images/ recursively into the binary, ./build.sh never
      stages cheatsheets, and the end-user lane builds the forge image from the
      EMBEDDED snapshot where neither the authored tree nor the staging script
      exists. Untracking it ships an image whose `COPY cheatsheets/` has nothing
      to copy. The sibling images/default/skills/ is safely untracked ONLY
      because build.rs explicitly excludes it from asset collection; absent such
      an exclusion, a derived tree the binary embeds MUST stay tracked.

    never_hand_edit_the_derived_tree: >
      An edit to images/default/cheatsheets/ is at best reverted by the next
      stage and at worst ships attribution its own source does not carry.
      Recorded incident: commit 79b3e82da (2026-07-21) edited only the derived
      copy, so the tracked tree claimed last_verified 2026-07-21 while its
      authored source still said 2026-05-20 — attribution flowing BACKWARDS for
      three days until a build silently reverted it.

    the_two_trees_must_match_at_every_commit: >
      The tracked derived tree MUST equal the authored tree, checked against the
      git INDEX (path + blob hash), not merely the working tree. A check that
      regenerates before comparing repairs the working tree and leaves the index
      stale, which is exactly how five authored cheatsheets went missing from
      the shipped copy while every gate stayed green. Enforced by
      scripts/stage-image-cheatsheets.sh (verdict `derived-tree-index-stale`).

    gitignore_semantics: >
      The .gitignore entry for the derived tree suppresses ad-hoc local
      regeneration noise. It does NOT mean untracked — gitignore is inert
      against already-tracked paths, and 230 of these files were tracked before
      the rule existed. Never infer trackedness from .gitignore; ask git
      (`git ls-files`).

    changing_this_arrangement: >
      Untracking the derived tree, or excluding it from embedded assets, is a
      release-affecting change: it must be justified against build.rs asset
      collection AND the end-user image-build lane, and land with the
      Containerfile COPY-source test still green on a FRESH CLONE. Do not
      reverse it on the strength of a tidiness argument alone.
