features:
  - capability: "Per-project submenu: 7-leaf tool set (Claude/Codex/OpenCode/Antigravity/OpenCodeWeb/Observatorium/Maintenance — Antigravity added by order 296)"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  - capability: "GitHub login in popup terminal (never inline)"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  # Order 626-r7kq (Windows/macOS, host-shell GithubLoginState::Unknown) and
  # 627-m3vp (Linux, TrayUiState::login_observed). Added 2026-08-09 because the
  # matrix had NO row for the sign-in state machine, so landing this on two of
  # three platforms broke parity with every gate still green — the exact hole
  # 628-r2vk exists to close. Copy is operator-approved (2026-08-09T08:33Z).
  - capability: "Sign-in row distinguishes unobserved from confirmed-signed-out (never offers an actionable sign-in before the first confirmed observation; renders a disabled 'Checking your account…')"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  - capability: "Cloud (☁️) project submenu + overflow"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  # Order 598-kibt M5. Added 2026-08-14 for the same reason 626-r7kq added the
  # sign-in row above: the matrix had NO row for the loading-vs-confirmed-empty
  # distinction, so `cloud_projects_loaded` landing on Windows only left macOS
  # showing "(loading repos…)" forever with every gate green and the umbrella
  # "Cloud submenu" row still reading done/done/done. A capability that exists
  # on one platform and not another, with no row naming it, is invisible to
  # exactly the gate meant to catch it — the hole 628-r2vk exists to close.
  #
  # All three implement it, by two different mechanisms: macOS and Windows hold
  # a `cloud_projects_loaded` bool on the shared MenuState, Linux infers it from
  # `TrayUiState::last_fetched: Option<Instant>` (tray/mod.rs:3040). Different
  # storage, same observable rule, so this is genuine parity rather than three
  # separate features sharing a row. Linux's copy is "(loading…)" against the
  # host-shell trays' "(loading repos…)" — a wording difference, not a
  # capability one; the terminology gate (629-t6bx) owns that, not this row.
  - capability: "Cloud submenu distinguishes an unfinished fetch from a confirmed-empty account (renders a loading placeholder until the first confirmed reply, '(no repos)' only after — never claims emptiness mid-fetch)"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  # DELIBERATELY A SEPARATE ROW, and deliberately not `required`. Resetting to
  # the loading state on a fresh logout is macOS + Windows only: Linux never
  # returns `last_fetched` to None outside initialisation, so a logout there
  # leaves the previous verdict standing. Folding this into the row above would
  # have forced a choice between marking Linux done for something it does not
  # do, or failing the Linux host's own gate on a capability nobody has agreed
  # it owes — which is how a matrix starts lying. Promote to `required` if and
  # when Linux implements it; see the Linux-side packet filed with 598-kibt M5.
  - capability: "A fresh GitHub logout resets the cloud submenu to the loading state, so the next session cannot show a stale '(no repos)' for an account that has repositories"
    linux: "todo"
    macos: "done"
    windows: "done"
    parity: "platform-specific"
  - capability: "Local (🏠 ~/src) project submenu"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  - capability: "Enclave status indicator (healthy/degraded/failed)"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  - capability: "--list-cloud-projects / remote project listing"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  - capability: "Interactive agent attach (InteractiveStream)"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  - capability: "One-off status/probe (ExecOneShot)"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  - capability: "Quit / lifecycle (VmShutdownRequest on quit)"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  - capability: "Provision / diagnose flow"
    linux: "done"
    macos: "done"
    windows: "done"
    parity: "required"
  - capability: "Host-specific VM substrate (podman / VZ / WSL)"
    linux: "n/a"
    macos: "n/a"
    windows: "n/a"
    parity: "platform-specific"
  # ── Surface-class rows (order 628-r2vk) ──────────────────────────────────
  # The rows below claim the NON-MENU surfaces the `parity-surfaces` gate
  # extracts from annotated declaration sites (`// parity-surface: <id>`).
  # `surfaces:` is the machine linkage: an extracted id with no claiming row
  # (and not in surface_baseline below) fails `tillandsias-policy
  # parity-surfaces`. Sibling columns are `unknown` where only the declaring
  # platform has verified — each host verifies its own column, and `unknown`
  # on a platform-specific row is an open parity QUESTION, not a defect.
  - capability: "Provisioning-failed notification (toast/osascript nudge beside the failure chip)"
    class: "notification"
    surfaces: ["notification.provisioning-failed"]
    linux: "unknown"
    macos: "unknown"
    windows: "done"
    parity: "platform-specific"
  - capability: "Guest crash-loop notification"
    class: "notification"
    surfaces: ["notification.guest-crash-loop"]
    linux: "unknown"
    macos: "unknown"
    windows: "unknown"
    parity: "platform-specific"
  - capability: "WSL feature-lifecycle toasts: one-time setup, restart needed, setup failed (Windows platform-feature flow)"
    class: "notification"
    surfaces: ["notification.feature-setup", "notification.feature-restart-needed", "notification.feature-setup-failed"]
    linux: "n/a"
    macos: "n/a"
    windows: "done"
    parity: "platform-specific"
  - capability: "Workspace-connection-lost notification (keepalive terminal failure)"
    class: "notification"
    surfaces: ["notification.workspace-connection-lost"]
    linux: "unknown"
    macos: "unknown"
    windows: "done"
    parity: "platform-specific"
  - capability: "Guest-reset-failed notification"
    class: "notification"
    surfaces: ["notification.guest-reset-failed"]
    linux: "unknown"
    macos: "unknown"
    windows: "done"
    parity: "platform-specific"
  - capability: "Diagnostics-bundle-saved notification (names the shareable file path)"
    class: "notification"
    surfaces: ["notification.diagnostics-saved"]
    linux: "unknown"
    macos: "unknown"
    windows: "done"
    parity: "platform-specific"
  - capability: "Tray icon tooltip carries version + current status"
    class: "tooltip"
    surfaces: ["tooltip.version-status"]
    linux: "unknown"
    macos: "unknown"
    windows: "done"
    parity: "platform-specific"
  # Status-chip class (628-r2vk criterion 2). Windows sets chip text through
  # a direct Win32 call (the pinned `hwnd.status(` pattern); macOS and Linux
  # render status through the shared MenuStructure's `menu.status` row, so
  # their cells here are `unknown` pending each host's own mapping decision.
  - capability: "Status chip: provisioning lifecycle (ready / ready-idle-risk / failed / failed-classified)"
    class: "status-chip"
    surfaces: ["status-chip.ready", "status-chip.ready-idle-risk", "status-chip.provisioning-failed", "status-chip.provisioning-failed-classified"]
    linux: "unknown"
    macos: "unknown"
    windows: "done"
    parity: "platform-specific"
  - capability: "Status chip: WSL feature lifecycle (restart-needed / setup-failed)"
    class: "status-chip"
    surfaces: ["status-chip.feature-restart-needed", "status-chip.feature-setup-failed"]
    linux: "n/a"
    macos: "n/a"
    windows: "done"
    parity: "platform-specific"
  - capability: "Status chip: workspace-connection-lost (Retry armed)"
    class: "status-chip"
    surfaces: ["status-chip.workspace-connection-lost"]
    linux: "unknown"
    macos: "unknown"
    windows: "done"
    parity: "platform-specific"
  - capability: "Status chip: guest-reset-failed"
    class: "status-chip"
    surfaces: ["status-chip.guest-reset-failed"]
    linux: "unknown"
    macos: "unknown"
    windows: "done"
    parity: "platform-specific"

# ── Grandfathered menu-surface baseline (order 628-r2vk) ─────────────────────
# The shared menu-id universe (host-shell `pub mod ids`) as of the gate's
# introduction. These surfaces are conceptually covered by the prose rows
# above but not yet machine-linked; retro-linking them is 628-h4nx/628-w9sm
# territory. THE RATCHET: a NEW menu id cannot be added here — it must get a
# claiming row — and an entry whose id no longer exists in the sources fails
# as STALE BASELINE, so this list only shrinks.
surface_baseline:
  - "menu.status"
  - "menu.local-projects"
  - "menu.local-projects.empty"
  - "menu.cloud-projects"
  - "menu.cloud-projects.empty"
  - "menu.cloud-projects.loading"
  - "menu.cloud-projects.overflow"
  - "menu.github-login"
  - "menu.version"
  - "menu.quit"
  - "menu.reset-guest"
  - "menu.agents"
  - "menu.agent.claude"
  - "menu.agent.codex"
  - "menu.agent.opencode"
  - "menu.agent.antigravity"
  - "menu.observatorium"
  - "menu.opencode-web"
  - "menu.claude"
  - "menu.codex"
  - "menu.opencode"
  - "menu.antigravity"
  - "menu.maintenance"
