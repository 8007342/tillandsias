# @trace spec:local-web-preview, order:1670-gcwu
name: litmus:local-web-preview-requirements
spec: local-web-preview
description: >
  The CentiColon pilot for local-web-preview (1670-gcwu): each step runs ONE
  unit test that pins the named requirement's rules, keys it with
  requirement: <req-id> and asserts the test passed, so the grader can earn
  traced and, from a recorded green run of these bytes, positively_tested.
  087743d0 Allowlisted local runtime profiles: runtime selection (auto picks
  static or the one root Wrangler config, several configs are ambiguous,
  explicit wrangler without a config and unknown runtimes are refused) and the
  launch shape (read-only source subset, wrangler dev --local on 8080, no host
  port, no token, no deploy, the pinned web-wrangler image).
  99f3633b Session-bound live source: the owning lane and launch fail closed,
  the forge is identified by its exact MCP listener mount, and the live source
  is the project-scoped RAM workspace volume, never a host checkout.
  bbc26ac2 Opt-in toolchain sessions (1637-5765): exec validation and
  confinement, the shim's streams, Ctrl-C, tty, disconnect stop, dev-server
  routing, and the cloud metadata probe refused.
severity: high
size: quick
phase: pre-build

preconditions:
  - cargo workspace builds (tillandsias-headless)

critical_path:
  - step: "087743d0: runtime selection accepts static or exactly one root Wrangler config and refuses ambiguity, a missing config and unknown runtimes"
    requirement: 087743d0
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::profiles_accept_assets_only_and_refuse_ambiguity -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "087743d0: the Wrangler launch is a read-only source subset running wrangler dev --local on 8080, with no host port, token or deploy, on the pinned image"
    requirement: 087743d0
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::launch_is_read_only_private_and_has_no_host_port_or_token -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "99f3633b: a mutation from another lane or launch fails closed with lane_conflict, and caller-supplied path components are refused"
    requirement: 99f3633b
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::lane_and_launch_ownership_fail_closed -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "99f3633b: the live forge is the one whose MCP listener mount is exactly this lane's"
    requirement: 99f3633b
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::live_identity_requires_exact_listener_mount -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "99f3633b: the live source is the project-scoped RAM workspace volume, never a tmpfs or another project's"
    requirement: 99f3633b
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::live_tmpfs_reference_is_project_scoped_not_host_checkout -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "bbc26ac2: an exec request is a closed toolchain, string argv and a project-relative cwd; absolute and '..' paths are refused"
    requirement: bbc26ac2
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias toolchain_exec::tests::exec_request_is_validated -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "bbc26ac2: the sibling runs on the enclave with the live forge's project and cache volumes, no host bind mount, and the request supplies only flutter's argv"
    requirement: bbc26ac2
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias toolchain_exec::tests::exec_args_confine_the_session_to_the_lane -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "bbc26ac2: through the real shim, stdin reaches the toolchain, stdout and stderr stay apart, and the exit code is returned"
    requirement: bbc26ac2
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias toolchain_exec::tests::shim_streams_stdin_stdout_stderr_and_the_exit_code -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "bbc26ac2: Ctrl-C at the shim reaches the toolchain and its exit code comes back"
    requirement: bbc26ac2
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias toolchain_exec::tests::shim_forwards_ctrl_c_to_the_toolchain -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "bbc26ac2: a tty session gives the toolchain a terminal, keystrokes as bytes and the client's resize"
    requirement: bbc26ac2
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias toolchain_exec::tests::a_tty_session_gives_the_toolchain_a_terminal_input_and_resize -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "bbc26ac2: when the forge side disconnects, the host stops the toolchain"
    requirement: bbc26ac2
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias toolchain_exec::tests::a_departed_shim_stops_the_toolchain -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "bbc26ac2: flutter run -d web-server is routed with host-chosen listen flags; other commands are not"
    requirement: bbc26ac2
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias toolchain_exec::tests::a_web_server_run_is_routed_with_host_chosen_listen_flags -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  # Condition (c), 1637-5765: flutter_tools probes the cloud metadata address
  # on first run (measured). The image tells it not to, and the proxy admits
  # no IP literal at all, so the probe has nowhere to go.
  - step: "bbc26ac2: the cloud metadata probe stays refused (BOT=false in the image; no IP literal admitted by the proxy; its last rule denies)"
    requirement: bbc26ac2
    command: "bot=$(grep -c 'BOT=false' images/flutter/Containerfile); ips=$(grep -cE '^[0-9.]+(/[0-9]+)?$' images/proxy/allowlist.txt); last=$(grep '^http_access' images/proxy/squid.conf); last=${last##*$'\\n'}; [ \"$bot\" -ge 1 ] && [ \"$ips\" -eq 0 ] && [ \"$last\" = 'http_access deny all' ] && echo 'ok: metadata probe refused' || { echo \"FAIL bot=$bot ips=$ips last=[$last]\"; exit 1; }"
    timeout_ms: 5000
    expected_behavior: "ok: metadata probe refused"

observability:
  traces:
    - "@trace spec:local-web-preview"
  expected_log: "five pinned unit tests pass, each keyed to the requirement it pins"
  log_fields:
    spec: "local-web-preview"
    test: "local-web-preview-requirements"
    artifact: "crates/tillandsias-headless/src/local_web_preview.rs"

rollback:
  on_failure: >
    A local-web-preview rule drifted from its requirement. Read the failing
    test in crates/tillandsias-headless/src/local_web_preview.rs and restore
    the rule (the spec text under the step's req-id), not the test.
  command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests:: 2>&1"
