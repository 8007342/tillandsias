# @trace spec:local-web-preview, order:1670-gcwu
name: litmus:local-web-preview-requirements
spec: local-web-preview
description: >
  The CentiColon pilot for local-web-preview (1670-gcwu): each step runs ONE
  unit test that pins the named requirement's rules, keys it with
  requirement: <req-id> and asserts the test passed, so the grader can earn
  traced and, from a recorded green run of these bytes, positively_tested.
  087743d0 Allowlisted local runtime profiles: runtime selection (auto picks
  static or the one root Wrangler config, several configs are ambiguous,
  explicit wrangler without a config and unknown runtimes are refused) and the
  launch shape (read-only source subset, wrangler dev --local on 8080, no host
  port, no token, no deploy, the pinned web-wrangler image).
  99f3633b Session-bound live source: the owning lane and launch fail closed,
  the forge is identified by its exact MCP listener mount, and the live source
  is the project-scoped RAM workspace volume, never a host checkout.
severity: high
size: quick
phase: pre-build

preconditions:
  - cargo workspace builds (tillandsias-headless)

critical_path:
  - step: "087743d0: runtime selection accepts static or exactly one root Wrangler config and refuses ambiguity, a missing config and unknown runtimes"
    requirement: 087743d0
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::profiles_accept_assets_only_and_refuse_ambiguity -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "087743d0: the Wrangler launch is a read-only source subset running wrangler dev --local on 8080, with no host port, token or deploy, on the pinned image"
    requirement: 087743d0
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::launch_is_read_only_private_and_has_no_host_port_or_token -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "99f3633b: a mutation from another lane or launch fails closed with lane_conflict, and caller-supplied path components are refused"
    requirement: 99f3633b
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::lane_and_launch_ownership_fail_closed -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "99f3633b: the live forge is the one whose MCP listener mount is exactly this lane's"
    requirement: 99f3633b
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::live_identity_requires_exact_listener_mount -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "99f3633b: the live source is the project-scoped RAM workspace volume, never a tmpfs or another project's"
    requirement: 99f3633b
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::live_tmpfs_reference_is_project_scoped_not_host_checkout -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "087743d0: with app_dir, the config, its assets and the static fallback resolve inside the app directory and nothing outside it is mounted (1667-6rtp)"
    requirement: 087743d0
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::an_app_dir_confines_every_mount_to_the_app -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "99f3633b: the one caller-supplied path, app_dir, is refused by name when absolute, leaving the project, hidden or private, before any podman call (1667-6rtp)"
    requirement: 99f3633b
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::app_dir_refusals_are_typed_and_come_before_anything_starts -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

  - step: "99f3633b: app_dir must be a real directory in the live forge; a missing path, a file and a symlink are refused by name (1667-6rtp)"
    requirement: 99f3633b
    command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests::live_app_dir_must_be_a_real_directory_inside_the_project -- --exact 2>&1"
    timeout_ms: 600000
    success_pattern: "test result: ok. 1 passed"

observability:
  traces:
    - "@trace spec:local-web-preview"
  expected_log: "eight pinned unit tests pass, each keyed to the requirement it pins"
  log_fields:
    spec: "local-web-preview"
    test: "local-web-preview-requirements"
    artifact: "crates/tillandsias-headless/src/local_web_preview.rs"

rollback:
  on_failure: >
    A local-web-preview rule drifted from its requirement. Read the failing
    test in crates/tillandsias-headless/src/local_web_preview.rs and restore
    the rule (the spec text under the step's req-id), not the test.
  command: "cargo test -q -p tillandsias-headless --features tray --bin tillandsias local_web_preview::tests:: 2>&1"
