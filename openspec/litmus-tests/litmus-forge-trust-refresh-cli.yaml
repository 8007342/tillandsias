# @trace spec:forge-environment-discoverability, order:2007-uvtl
name: litmus:forge-trust-refresh-cli
spec: forge-environment-discoverability
phase: pre-build
status: active
description: >
  Order 2007-uvtl: after an enclave CA rotation, `tillandsias-trust check`
  re-composes a running forge's trust bundle from the READ-ONLY cert-only mount
  (/run/tillandsias/ca/), and only from it. Exercised with a real rootless
  read-only bind (unshare -rm). A forge-writable directory offered as the
  mount, a missing mount, a non-CA, an expired CA and an unparsable file are
  each refused by name and leave the old bundle in place.
severity: high
size: small
preconditions:
  - python3, openssl and unshare on the host
critical_path:
  - step: "Req: the trust bundle follows a valid rotated CA from the read-only mount only, and every invalid or writable source is refused with the old bundle kept"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-tillandsias-trust.lua 2>&1"
    timeout_ms: 300000
    success_pattern: "ok:tillandsias-trust:7 arms"
observability:
  traces:
    - "@trace order:2007-uvtl"
  expected_log: "ok:tillandsias-trust:7 arms"
  log_fields:
    spec: "forge-environment-discoverability"
    test: "forge-trust-refresh-cli"
rollback:
  on_failure: >
    images/default/cli/tillandsias-trust refreshed from a writable or invalid
    source, or failed to refresh from a valid one. Read its check() and the
    arm that failed.
  command: "python3 images/default/cli/tillandsias-trust --help"
