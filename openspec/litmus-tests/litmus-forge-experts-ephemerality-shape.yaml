# @trace spec:ephemeral-guarantee, spec:forge-environment-discoverability
# @trace order:394 (rung 1, slice 5 — expert-launch-state-and-ephemerality)
# @trace plan/issues/experts-construction-research-2026-07-29.md §7.3
#
# WHAT THIS PROTECTS
#
# The plan expert is built INSIDE a running forge from the just-mounted ./plan
# and ./methodology. That build produces knowledge about a working tree, and the
# ephemerality invariant says knowledge must not outlive the stack that produced
# it. Order 394 slice 5 placed the expert's state in tmpfs and its binary in the
# container's --rm overlay precisely so NO reaper is needed: ephemeral by
# construction.
#
# A single edit can silently undo that. Repointing FORGE_EXPERTS_STATE_DIR at
# the persistent per-project cache volume — a natural-looking "make the build
# faster across launches" change — would make expert knowledge survive stack
# shutdown with no error, no warning, and no test failing anywhere. This litmus
# is the structural half of the teardown proof: it EXTRACTS the expert surfaces
# from images/default/lib-common.sh and the PERSISTENT mount targets from the
# launcher that builds the forge container, and asserts the two sets are
# disjoint. The behavioural half — seed, destroy, scan the survivors — is
# litmus:forge-experts-teardown-ephemeral (size e2e).
#
# ── SANCTIONED CARVE-OUT 2: THE SPEC INDEX (order 801-a2by) ──────────────────
#
# READ THIS BEFORE CONCLUDING THE INVARIANT WEAKENED. It did not; the invariant
# was refined, and the refinement is pinned below rather than merely asserted.
#
# The ephemerality invariant exists because expert knowledge built from ONE
# WORKING TREE must not be served to a later, different forge. The spec RAG
# index is not that kind of knowledge: it is a pure function of the CORPUS at a
# commit, and its identity IS a content fingerprint over corpus+model. Serving a
# stale one is structurally impossible in the corpus dimension, because a
# different corpus produces a different fingerprint and therefore a MISS, not a
# wrong hit. Keeping it in tmpfs bought no safety at all — it only made every
# forge relaunch re-pay a measured ~12-minute embedding pass (9910 chunks) for a
# corpus that had not changed, N times over for N concurrent forges.
#
# So the index moved to the durable tier: a podman named volume
# `tillandsias-spec-index-<project>`, sibling to `tillandsias-mirror-<project>`,
# mounted READ-ONLY at /opt/tillandsias/spec-index. The forge keeps every
# ephemerality guarantee it had. What moved is exactly the thing that carries no
# working-tree knowledge.
#
# THE CARVE-OUT'S BOUNDARY, pinned by the steps at the end of this file:
#   * the mount is READ-ONLY — the ephemeral tier physically cannot write to the
#     durable tier, and that is a mount mode rather than a convention;
#   * it is a NAMED VOLUME, never a host path — the host bind-mount is order
#     437's opt-in guard and must not become the default fast path;
#   * it is a SEPARATE volume from the read-write tool cache, so the teardown
#     proof's scan of that volume keeps its meaning;
#   * the expert LIVENESS surfaces (state, started_at, plan-source-hash,
#     project-index) are UNCHANGED and still pinned to tmpfs by the steps above.
#     lib-common.sh was deliberately not touched by 801-a2by.
#
# RESIDUAL GAP, STATED PLAINLY BECAUSE A GUARD MUST NOT IMPLY MORE THAN IT
# PROVES: a fingerprint proves an entry describes corpus X. It does NOT prove
# corpus X is what the ASKING agent has checked out. Citations still carry no
# commit, so a caller at a different commit can open `path:45-49` in its own
# tree and read different bytes. Order 801-g9nn is that fix. Until it lands,
# the sharing is real and the caller-relative staleness signal is not.
#
# THE ONE SANCTIONED CARVE-OUT
#   `cargo build` writes into $CARGO_TARGET_DIR, which DOES live on the
#   persistent cache volume. Per the research's §7.3 a compiled binary in a
#   build cache is a BUILD ARTIFACT, not expert knowledge, and order 394 slice 5
#   puts it explicitly out of scope. Order 781-6gys publishes the PROBED
#   artifact plus its source-hash key into the SAME cargo subtree
#   (cargo/prebuilt-plan/) so warm lanes restore in O(cp) instead of paying a
#   cargo build that outlives the 600s smoke cap — the key is a build-cache
#   fingerprint, not knowledge, and the teardown proof's scans prune
#   `-name cargo`, so the carve-out's boundary is unchanged: it is the cargo
#   subtree, exactly as the scans encode it. This litmus keeps that carve-out
#   NARROW: the expert's own state/index surfaces must still be disjoint from
#   every persistent mount, and the binary must be COPIED OUT of the cache into
#   the ephemeral bin dir rather than consumed from it.
name: litmus:forge-experts-ephemerality-shape
spec: ephemeral-guarantee
phase: pre-build
description: >
  Pin forge-expert ephemerality by construction: the experts state dir is tmpfs,
  the experts bin dir is inside the auto-removed container overlay, every write
  in the experts region targets an ephemeral surface, and NO expert LIVENESS
  surface is under any volume the launcher mounts persistently into the forge
  (extracted from both sides and compared, so drift on either side turns this
  RED). The two sanctioned carve-outs — the cargo build cache and the durable
  content-addressed spec index (801-a2by) — are pinned at their boundaries
  rather than merely excluded: read-only, named-volume-only, separate from the
  read-write tool cache, and unable to pull the liveness surfaces with them.
severity: high
size: instant

preconditions:
  - workspace contains images/default/lib-common.sh
  - workspace contains crates/tillandsias-headless/src/main.rs
  - workspace contains crates/tillandsias-podman/src/container_spec.rs
  - shell utilities (grep, sed, awk) are available in PATH

critical_path:
  - step: "the experts STATE surface is tmpfs — it cannot outlive the container"
    # /dev/shm is a kernel tmpfs the container gets fresh and loses on teardown.
    # This is the whole ephemerality mechanism: no reaper, no cleanup hook, no
    # shutdown path that can be skipped.
    command: "s=$(sed -n 's#^FORGE_EXPERTS_STATE_DIR=.*:-\\(.*\\)}.*#\\1#p' images/default/lib-common.sh); case \"$s\" in /dev/shm/*) echo \"ok: state-surface-tmpfs=$s\" ;; *) echo \"REGRESSION: experts state dir is not tmpfs: $s\"; exit 1 ;; esac"
    timeout_ms: 5000
    expected_behavior: "ok: state-surface-tmpfs=/dev/shm/"

  - step: "the experts BINARY surface is inside the container's auto-removed overlay"
    # $HOME/.local/bin is plain container filesystem. It exists only while the
    # container exists, which is the second half of "ephemeral by construction".
    command: "b=$(sed -n 's#^FORGE_EXPERTS_BIN_DIR=.*:-\\(.*\\)}.*#\\1#p' images/default/lib-common.sh); test \"$b\" = '$HOME/.local/bin' && echo \"ok: bin-surface-overlay=$b\""
    timeout_ms: 5000
    expected_behavior: "ok: bin-surface-overlay="

  - step: "the forge container is auto-removed, so its overlay is destroyed with the stack"
    # ContainerSpec::new defaults remove=true and build_run_args emits --rm for
    # it; only an explicit .persistent() opts out. If the forge agent spec ever
    # calls .persistent(), $HOME/.local/bin survives teardown and the binary
    # surface stops being ephemeral.
    command: "grep -q 'remove: true,' crates/tillandsias-podman/src/container_spec.rs && grep -q 'args.push(\"--rm\".to_string());' crates/tillandsias-podman/src/container_spec.rs && n=$(awk '/^fn build_forge_agent_run_args_with_vault\\(/,/^}/' crates/tillandsias-headless/src/main.rs | grep -c 'persistent()'); test \"$n\" = 0 && echo 'ok: forge-container-auto-removed'"
    timeout_ms: 10000
    expected_behavior: "ok: forge-container-auto-removed"

  - step: "DISJOINTNESS PIN: no expert surface sits under a mount that survives teardown"
    # The persistent mount targets are EXTRACTED from the launcher that builds
    # the forge run args, not hardcoded here: adding a new persistent volume
    # that happens to cover an expert surface, or moving an expert surface under
    # an existing one, turns this RED from either side.
    command: "home=$(sed -n 's#.*\\.env(\"HOME\", \"\\([^\"]*\\)\").*#\\1#p' crates/tillandsias-headless/src/main.rs | head -1); test -n \"$home\" || { echo 'REGRESSION: forge HOME not extractable'; exit 1; }; persist=$(awk '/^fn build_forge_agent_run_args_with_vault\\(/,/^}/' crates/tillandsias-headless/src/main.rs | grep -A3 '\\.volume(' | grep -oE '\"/[a-z/._-]+' | sed 's#^\"##' | sort -u); test -n \"$persist\" || { echo 'REGRESSION: no persistent mount targets extractable'; exit 1; }; s=$(sed -n 's#^FORGE_EXPERTS_STATE_DIR=.*:-\\(.*\\)}.*#\\1#p' images/default/lib-common.sh); b=$(sed -n 's#^FORGE_EXPERTS_BIN_DIR=.*:-\\(.*\\)}.*#\\1#p' images/default/lib-common.sh); s=\"${s/\\$HOME/$home}\"; b=\"${b/\\$HOME/$home}\"; for p in $persist; do case \"$s\" in \"$p\"*) echo \"REGRESSION: experts state $s is under persistent mount $p\"; exit 1 ;; esac; case \"$b\" in \"$p\"*) echo \"REGRESSION: experts bin $b is under persistent mount $p\"; exit 1 ;; esac; done; echo \"ok: expert-surfaces-disjoint-from-persistent-mounts\""
    timeout_ms: 15000
    expected_behavior: "ok: expert-surfaces-disjoint-from-persistent-mounts"

  - step: "EVERY write in the experts region lands on an ephemeral surface"
    # Enumerates the region's real redirection targets (comments excluded) and
    # rejects anything outside the ephemeral set. A new persisted index file
    # cannot be added without either being ephemeral or turning this RED.
    command: "bad=$(sed -n '/^# ── Forge EXPERTS: launch-time build/,/^# ── Cache directory structure/p' images/default/lib-common.sh | grep -v '^[[:space:]]*#' | grep -oE '(^|[[:space:]])>>?[[:space:]]*\"?[^\"|&; )]+' | sed -E 's/^[[:space:]]*>>?[[:space:]]*\"?//' | sort -u | grep -vE '^(/dev/null|/tmp/|\\$FORGE_EXPERTS_STATE_DIR/|\\$stamp$|\\$index_dir/|\\$state_dir/|\\$cache_stamp\\.tmp\\.)'); test -z \"$bad\" && echo 'ok: writes-confined-to-ephemeral-surfaces' || { echo \"REGRESSION: experts region writes to non-ephemeral target(s): $bad\"; exit 1; }"
    timeout_ms: 10000
    expected_behavior: "ok: writes-confined-to-ephemeral-surfaces"

  # Order 621-2re2: every name allowlisted above must be PROVEN to resolve into
  # tmpfs by its own step. Allowlisting a name without that proof is how a
  # persistent surface would slip in behind a local variable — the enumeration
  # cannot follow one level of indirection, so each indirection pays for itself
  # with an explicit assertion. $stamp has done this since the step was written;
  # $index_dir (the generic-project index, order 619-vwau) now does too.
  - step: "the generic-project index dir — an indirect write target — is itself in tmpfs"
    command: "grep -q 'local index_dir=\"$FORGE_EXPERTS_STATE_DIR/project-index\"' images/default/lib-common.sh && echo 'ok: project-index-in-tmpfs'"
    timeout_ms: 5000
    expected_behavior: "ok: project-index-in-tmpfs"

  - step: "the idempotency stamp — the one indirect write target — is itself in tmpfs"
    # $stamp is accepted by the step above by name; prove the name resolves into
    # the tmpfs state dir rather than into the cache volume next to the target
    # dir it keys.
    command: "grep -q 'stamp=\"$FORGE_EXPERTS_STATE_DIR/plan-source-hash\"' images/default/lib-common.sh && echo 'ok: source-hash-stamp-in-tmpfs'"
    timeout_ms: 5000
    expected_behavior: "ok: source-hash-stamp-in-tmpfs"

  - step: "the model-warm state file — an indirect write target — is itself in tmpfs"
    # $state_dir is accepted by the write-confinement step by name; this is its
    # order-621-2re2 payment. Added 2026-09-02 with 965-hz3f's lifecycle warm
    # (warm_tier_model_fail_soft), which introduced the indirection and landed
    # without it — the union litmus caught it, not either branch's gate, because
    # ./build.sh --check runs no litmus at all (748-tkjx). The write IS ephemeral;
    # what was missing is the proof this file demands of every new indirection.
    command: "grep -q 'state_dir=\"${FORGE_EXPERTS_STATE_DIR:-/dev/shm/tillandsias-experts}\"' images/default/lib-common.sh && echo 'ok: model-warm-state-in-tmpfs'"
    timeout_ms: 5000
    expected_behavior: "ok: model-warm-state-in-tmpfs"

  - step: "BEHAVIOURAL: the artifact-cache write target — persistent BY DESIGN (781-6gys) — resolves into the sanctioned cargo build-cache subtree"
    # $cache_stamp.tmp. is accepted by the write-confinement step by name; this
    # is its order-621-2re2 payment, asserted as a PROPERTY (634-39ik): the
    # REAL assignments are extracted and EXECUTED with a known cache root, and
    # the resolved paths must land under <root>/cargo/ — the ONE sanctioned
    # carve-out, the same subtree the teardown proof's scans prune with
    # `-name cargo`. The FORGE_EXPERTS_CACHE_DIR override arm is the control:
    # it proves the eval executes the live assignment (a vacuous extraction
    # cannot satisfy it), so this step can distinguish \"property violated\"
    # from \"text drifted\". If the cache dir moves out from under cargo/, the
    # behavioural teardown scan starts seeing it and this step goes RED first.
    command: "line=$(grep -m1 'cache_dir=\"${FORGE_EXPERTS_CACHE_DIR:-' images/default/lib-common.sh); test -n \"$line\" || { echo 'REGRESSION: artifact-cache assignment absent from ensure_forge_experts'; exit 1; }; d=$(unset FORGE_EXPERTS_CACHE_DIR; TILLANDSIAS_PROJECT_CACHE=/PC; eval \"$line\"; printf '%s' \"$cache_dir\"); s=$(unset FORGE_EXPERTS_CACHE_DIR; TILLANDSIAS_PROJECT_CACHE=/PC; eval \"$line\"; eval \"$(grep -m1 'cache_stamp=' images/default/lib-common.sh)\"; printf '%s' \"$cache_stamp\"); o=$(FORGE_EXPERTS_CACHE_DIR=/OVR; eval \"$line\"; printf '%s' \"$cache_dir\"); case \"$d\" in /PC/cargo/*) : ;; *) echo \"REGRESSION: artifact cache resolves to $d — outside the cargo carve-out subtree\"; exit 1 ;; esac; case \"$s\" in \"$d\"/*) : ;; *) echo \"REGRESSION: cache stamp $s escapes the artifact cache dir\"; exit 1 ;; esac; test \"$o\" = /OVR || { echo \"BROKEN CONTROL: FORGE_EXPERTS_CACHE_DIR override did not take ($o) — the eval is not executing the real assignment\"; exit 1; }; echo 'ok: artifact-cache-under-cargo-carve-out'"
    timeout_ms: 5000
    expected_behavior: "ok: artifact-cache-under-cargo-carve-out"

  - step: "CARVE-OUT STAYS NARROW: the cache volume is a build cache, never the serving surface"
    # cargo's target dir does live on the persistent volume — that is the
    # sanctioned build-artifact carve-out. It stays a carve-out only while the
    # binary is COPIED OUT of it into the ephemeral bin dir; the moment the MCP
    # wrapper is pointed at the cache path instead, a persistent surface starts
    # serving expert answers.
    command: "grep -q 'install -m 0755 \"$built\" \"$bin_dst\"' images/default/lib-common.sh && grep -q 'BUILD ARTIFACT, not expert knowledge' images/default/lib-common.sh && ! grep -q 'tillandsias-project' images/default/config-overlay/mcp/forge-plan.sh && echo 'ok: cache-is-build-only'"
    timeout_ms: 5000
    expected_behavior: "ok: cache-is-build-only"

  # ── Carve-out 2 boundary pins (order 801-a2by) ─────────────────────────────
  # The spec index is DELIBERATELY on a persistent mount now. Without these
  # steps this file would stay green purely because it never looked at that
  # surface — a carve-out nobody pinned is a hole, not an exemption.
  - step: "CARVE-OUT 2: the durable spec-index mount is READ-ONLY, so the ephemeral tier cannot write to the durable tier"
    # A `:rw` here would let any forge corrupt the index every other forge and
    # every bare-metal harness reads. Read-only is the whole concurrency
    # discipline, so it is asserted from the launcher source in BOTH directions:
    # the ReadOnly mode must be present AND ReadWrite must be absent, because a
    # second `.volume(` call added later would satisfy a presence-only check.
    command: "blk=$(awk '/^fn build_forge_agent_run_args_with_vault\\(/,/^}/' crates/tillandsias-headless/src/main.rs | grep -A3 'forge_spec_index_volume('); test -n \"$blk\" || { echo 'REGRESSION: the forge no longer mounts the durable spec-index volume (801-a2by)'; exit 1; }; printf '%s' \"$blk\" | grep -q 'MountMode::ReadOnly' || { echo \"REGRESSION: spec-index mount is not ReadOnly: $blk\"; exit 1; }; printf '%s' \"$blk\" | grep -q 'MountMode::ReadWrite' && { echo \"REGRESSION: spec-index mount is ReadWrite — the ephemeral tier can corrupt the durable tier: $blk\"; exit 1; }; echo 'ok: spec-index-mount-read-only'"
    timeout_ms: 10000
    expected_behavior: "ok: spec-index-mount-read-only"

  - step: "CARVE-OUT 2: the index is a NAMED VOLUME on its own, never a host path and never the read-write tool cache"
    # Three ways this could quietly become something else, all rejected here:
    # a host path source (order 437's opt-in bind mount becoming the default),
    # reusing the tool-cache volume (which IS read-write and IS scanned by the
    # teardown proof), or dropping the per-project suffix.
    command: "src=$(awk '/^fn forge_spec_index_volume/,/^}/' crates/tillandsias-headless/src/main.rs | sed -n 's/.*format!(\"\\([^\"]*\\)\").*/\\1/p'); test -n \"$src\" || { echo 'REGRESSION: forge_spec_index_volume is gone'; exit 1; }; case \"$src\" in /*) echo \"REGRESSION: the index source is a HOST PATH ($src), not a named volume — that is order 437's opt-in bind mount becoming the default\"; exit 1 ;; esac; case \"$src\" in *'{project_name}'*) : ;; *) echo \"REGRESSION: index volume $src is not per-project\"; exit 1 ;; esac; cache=$(awk '/^fn forge_tool_cache_volume/,/^}/' crates/tillandsias-headless/src/main.rs | sed -n 's/.*format!(\"\\([^\"]*\\)\").*/\\1/p'); test \"$src\" != \"$cache\" || { echo \"REGRESSION: the index shares the READ-WRITE tool cache volume $cache\"; exit 1; }; echo \"ok: spec-index-named-volume=$src\""
    timeout_ms: 10000
    expected_behavior: "ok: spec-index-named-volume="

  - step: "CARVE-OUT 2: the mount target and the injected FORGE_SPEC_INDEX_ROOT are the SAME constant"
    # If the env var and the mount target drift, the in-forge reader looks at an
    # empty directory and reports a cold index while a fully built one is
    # mounted centimetres away — absent, not wrong, and therefore silent. Both
    # sites must reference the one const rather than repeating a literal.
    command: "c=$(sed -n 's/^const FORGE_SPEC_INDEX_MOUNT: &str = \"\\([^\"]*\\)\";/\\1/p' crates/tillandsias-headless/src/main.rs); test -n \"$c\" || { echo 'REGRESSION: FORGE_SPEC_INDEX_MOUNT const is gone'; exit 1; }; blk=$(awk '/^fn build_forge_agent_run_args_with_vault\\(/,/^}/' crates/tillandsias-headless/src/main.rs); n=$(printf '%s' \"$blk\" | grep -c 'FORGE_SPEC_INDEX_MOUNT'); test \"$n\" -ge 2 || { echo \"REGRESSION: the mount target and the env value do not both use the const (found $n uses)\"; exit 1; }; printf '%s' \"$blk\" | grep -q '\\.env(\"FORGE_SPEC_INDEX_ROOT\", FORGE_SPEC_INDEX_MOUNT)' || { echo 'REGRESSION: FORGE_SPEC_INDEX_ROOT is not injected from the mount const'; exit 1; }; echo \"ok: spec-index-root-matches-mount=$c\""
    timeout_ms: 10000
    expected_behavior: "ok: spec-index-root-matches-mount="

  - step: "CARVE-OUT 2 STAYS NARROW: the expert LIVENESS surfaces did NOT move with the index"
    # The index moved because it carries no working-tree knowledge. state /
    # started_at / plan-source-hash / project-index DO, and they must still die
    # with the container. This is the step that keeps 801-a2by from being read
    # as permission to persist the rest.
    command: "s=$(sed -n 's#^FORGE_EXPERTS_STATE_DIR=.*:-\\(.*\\)}.*#\\1#p' images/default/lib-common.sh); case \"$s\" in /dev/shm/*) : ;; *) echo \"REGRESSION: expert liveness state left tmpfs: $s\"; exit 1 ;; esac; mnt=$(sed -n 's/^const FORGE_SPEC_INDEX_MOUNT: &str = \"\\([^\"]*\\)\";/\\1/p' crates/tillandsias-headless/src/main.rs); case \"$s\" in \"$mnt\"*) echo \"REGRESSION: liveness state $s is under the durable index mount $mnt\"; exit 1 ;; esac; grep -q 'local index_dir=\"$FORGE_EXPERTS_STATE_DIR/project-index\"' images/default/lib-common.sh || { echo 'REGRESSION: the generic project index left tmpfs'; exit 1; }; grep -q 'stamp=\"$FORGE_EXPERTS_STATE_DIR/plan-source-hash\"' images/default/lib-common.sh || { echo 'REGRESSION: the source-hash stamp left tmpfs'; exit 1; }; echo 'ok: liveness-surfaces-still-ephemeral'"
    timeout_ms: 10000
    expected_behavior: "ok: liveness-surfaces-still-ephemeral"

  - step: "CARVE-OUT 2: producer and readers resolve ONE index location (delegates to the standing guard)"
    # The durable root is resolved independently by the producer and two
    # readers. If they drift, the index is built where nobody looks and the
    # system reports a MISSING index rather than a misconfigured one — silent by
    # construction, which is how the whole embedding step hid for weeks (552).
    command: "out=$(bash scripts/check-spec-index-resolution-agreement.sh 2>&1 | tail -1); case \"$out\" in ok:spec-index-resolution-agreement:*) printf '%s\\n' \"$out\" ;; *) echo \"REGRESSION: $out\"; exit 1 ;; esac"
    timeout_ms: 30000
    expected_behavior: "ok:spec-index-resolution-agreement:"

  - step: "the state READER only ever reads the ephemeral surface"
    # A renderer that falls back to a persisted copy would resurrect dead
    # knowledge into a fresh forge's startup context.
    command: "n=$(sed -n '/^forge_experts_state_line() {/,/^}/p' images/default/lib-common.sh | grep -cE '(cat|read|<)[^)]*(/home|/var|\\$PROJECT_CACHE|tillandsias-project)'); test \"$n\" = 0 && sed -n '/^forge_experts_state_line() {/,/^}/p' images/default/lib-common.sh | grep -q 'FORGE_EXPERTS_STATE_DIR/state' && echo 'ok: reader-reads-tmpfs-only'"
    timeout_ms: 5000
    expected_behavior: "ok: reader-reads-tmpfs-only"

observability:
  traces:
    - "@trace spec:ephemeral-guarantee"
    - "@trace spec:forge-environment-discoverability"
    - "@trace order:394"
  expected_log: "Forge expert surfaces are ephemeral by construction and disjoint from every persistent forge mount"
  log_fields:
    spec: "ephemeral-guarantee"
    test: "forge-experts-ephemerality-shape"
    builder_artifact: "images/default/lib-common.sh"
    launcher_artifact: "crates/tillandsias-headless/src/main.rs"
    behavioural_sibling: "litmus:forge-experts-teardown-ephemeral"

rollback:
  on_failure: >
    Forge-expert ephemerality drifted. If the DISJOINTNESS PIN failed, an expert
    surface now lives under a volume that survives container teardown — expert
    knowledge built from one working tree will be served to a later, different
    forge, and the ephemerality invariant is broken. Restore
    FORGE_EXPERTS_STATE_DIR to a /dev/shm path and FORGE_EXPERTS_BIN_DIR to
    $HOME/.local/bin. If the write-confinement step failed, a new expert file is
    being written outside the ephemeral set; move it into
    $FORGE_EXPERTS_STATE_DIR. If the carve-out step failed, the persistent cargo
    cache is being used as a serving surface rather than a build cache — the
    binary must be installed out of it into the ephemeral bin dir.
  command: "sed -n '/^# ── Forge EXPERTS: launch-time build/,/^# ── Cache directory structure/p' images/default/lib-common.sh | grep -nE 'FORGE_EXPERTS_(STATE|BIN)_DIR=|>|install -m'"
