# @trace spec:forge-environment-discoverability, order:2073-i4jr, order:2079-sgp4
#
# test-json-query-jq-parity runs a private snapshot of the plan binary, so a
# concurrent guard relinking the build output mid-run cannot fail a random
# case (FAIL:json-get-parity:78/79 evicted #1044 and #1059 on macuahuitl).
# A divergence names its want, got and stderr, and a -n case is not SIGPIPEd:
# arms 4 and 5 of the fixture itself (2079-sgp4, 2073-i4jr), which were steps here
# while it was a shell script.
name: litmus:json-get-parity-binary-swap
spec: forge-environment-discoverability
phase: pre-build
description: >
  The jq-parity guard stays green while its plan binary is rewritten in place
  during the run. That a diverging binary is reported with want, got and
  stderr is an arm of the guard itself.
severity: high
size: quick

critical_path:
  - step: "2073-i4jr: the guard stays green while its binary is rewritten in place"
    timeout_ms: 240000
    command: "mkdir -p target; T=$(mktemp -d target/litmus-jqs.XXXXXX); B=$(. scripts/plan-binary-probe.sh && resolve_plan_binary); cp \"$B\" \"$T/orig\"; cp \"$B\" \"$T/plan\"; cp \"$B\" \"$T/runner\"; ( i=0; while [ $i -lt 600 ] && [ -f \"$T/orig\" ]; do cat \"$T/orig\" > \"$T/plan\" 2>/dev/null; sleep 0.05; i=$((i+1)); done ) & W=$!; out=$(TILLANDSIAS_PLAN_BIN=\"$PWD/$T/plan\" \"$T/runner\" script run scripts/lua/test-json-query-jq-parity.lua 2>&1); rc=$?; kill $W 2>/dev/null; wait $W 2>/dev/null; find \"$T\" -delete; v=$(grep -E '^(ok|violation|refused):json-get-parity' <<<\"$out\"); [ \"$rc\" -eq 0 ] && case \"$v\" in ok:json-get-parity:*) true;; *) false;; esac && echo 'ok: parity holds under a binary rewrite' || { echo \"FAIL rc=$rc verdict=[$v]\"; exit 1; }"
    expected_behavior: "ok: parity holds under a binary rewrite"

observability:
  traces:
    - "@trace spec:forge-environment-discoverability"
