# @trace spec:meta-orchestration, spec:git-mirror-service
# OpenCode-prompt E2E smoke — verify agent commits and pushes findings.
#
# Asserts forge_exit=0, new commit since smoke start, at least one
# plan/ file updated, and remote branch HEAD advanced via git ls-remote.
#
# Full-mode runs additionally require the typed `MO-FULL:` terminal marker
# (order 614-2gqx): the launch step rejects exit zero when the marker is
# absent, malformed, claims an unpushed local commit, or the claimed remote
# head is never reached. The hermetic fixture (scripts/test-mo-full-attest.sh)
# proves that gate fails loud for each breach shape before any launch happens.
#
# NOTE: Requires forge image built, tillandsias on PATH, and git-mirror
# running (forge-push-credential-channel post-receive relay). Gating points
# assert the full commit+push lifecycle, not just launch.
name: litmus:opencode-prompt-e2e-shape
spec: meta-orchestration
phase: post-build
description: >
  Launch the freshly installed Tillandsias forge lane with
  `tillandsias . --opencode --prompt "Use the /meta-orchestration skill"`,
  let the agent run one cycle, and verify it committed and pushed findings.
  Full-mode success additionally requires a valid, converging `MO-FULL:`
  terminal marker. Failures indicate a break in the unattended commit+push
  path or in the full-mode terminal attestation gate.
severity: high
size: e2e

preconditions:
  - tillandsias binary is installed and on PATH
  - forge image is built and available locally
  - git remote origin is reachable and credential channel is active
  - scripts/mo-full-attest.sh and scripts/test-mo-full-attest.sh exist
  - scripts/meta-orchestration-worktree-guard.sh and scripts/lua/test-worktree-boundary-guard.lua exist

critical_path:
  # 2093-loc: local-checkout launch is retired, so the old steps 3-8 (record
  # HEADs, launch '.' with /meta-orchestration, assert local/plan/remote deltas)
  # moved to the post-release smoke (order 2093-clds). The release gate makes no
  # GitHub push and no OpenCode call.
  - step: "run full-mode terminal attestation fixture"
    command: "scripts/test-mo-full-attest.sh"
    timeout_ms: 60000
    expected_behavior: "PASS: mo-full-attest fixture"
  - step: "run startup-boundary guard fixture"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-worktree-boundary-guard.lua"
    timeout_ms: 60000
    expected_behavior: "ok:worktree-boundary-guard:36 arms"
  - step: "a '.' launch is refused before any forge starts (exit 2, pinned message; was: launch forge with the meta-orchestration prompt)"
    command: "E=\"${TMPDIR:-/tmp}/litmus-dot-launch.err\"; TILLANDSIAS_NO_TRAY=1 timeout 60 tillandsias . --opencode --diagnostics --port 19080 --prompt x >/dev/null 2>\"$E\"; rc=$?; [ \"$rc\" = 2 ] || { echo \"FAIL: '.' launch exited $rc, expected 2\"; exit 1; }; grep -qF \"Error: launching from a local checkout ('.') is no longer supported: Tillandsias does not mount or read a host checkout.\" \"$E\" || { echo 'FAIL: the local-checkout refusal message changed'; exit 1; }; if grep -q 'event:container_launch ' \"$E\"; then echo 'FAIL: a container launched before the refusal'; exit 1; fi; echo \"ok: '.' launch refused (exit 2, pinned message, no container launched)\""
    timeout_ms: 90000
    expected_behavior: "ok: '.' launch refused"
  - step: "cleanup temp files"
    command: "rm -f /tmp/opencode-e2e-head-before /tmp/opencode-e2e-remote-head-before /tmp/opencode-e2e-mode && echo \"ok: cleaned up\""
    timeout_ms: 3000
    expected_behavior: "ok:"

observability:
  traces:
    - "@trace spec:meta-orchestration"
    - "@trace spec:git-mirror-service"
  expected_log: >
    OpenCode-prompt E2E smoke: forge launched (exit=0), HEAD advanced
    with new commit in plan/, and remote HEAD advanced via git push
    relay through git-mirror. Full-mode runs also emitted a valid,
    converging `MO-FULL:` terminal marker.
  log_fields:
    spec: "meta-orchestration"
    test: "opencode-prompt-e2e-shape"
    artifact: "forge output in test log"

rollback:
  on_failure: >
    Ensure tillandsias binary is on PATH, forge image is built
    (scripts/build-image.sh forge), git remote origin is reachable,
    and the credential channel is active (scripts/check-credential-channel.sh).
    If the binary is stale, rebuild with ./build.sh --release --install.
    A full-mode FORGE_EXIT=127/128 means the cycle exited without a valid
    `MO-FULL:` marker or without a converging remote head — inspect
    /tmp/opencode-e2e-forge.log for the marker and the claimed head before
    relaunching.
  command: "git log --oneline -5 && echo '---remote---' && git ls-remote origin HEAD && echo '---credential---' && scripts/check-credential-channel.sh"
