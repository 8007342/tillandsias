# @trace spec:git-mirror-service
name: litmus:git-mirror-fetch-credential-shape
spec: git-mirror-service
phase: pre-build
size: instant
severity: critical
description: >
  Every upstream FETCH the mirror performs must carry the Vault-backed
  credential helper, and the seed/reconcile fetches must write CLONEABLE
  exported heads. Order 777-i7hf (live Windows repro, 2026-08-16,
  github.com/8007342/java — the first PRIVATE upstream this stack served):
  the entrypoint's seed fetch, startup retry/fast-forward fetches, and the
  periodic reconcile all ran with NO credential helper, so a private upstream
  answered 401, git died with "could not read Username for
  'https://github.com'", and the mirror stayed at ZERO refs forever while the
  port-level healthcheck said healthy — every forge lane then cloned an empty
  repository and aborted. Only the push relay (relay-refs.sh) and the auth
  probe were wired.

  This litmus pins four load-bearing shapes:
  (1) the entrypoint exports the same reset+helper GIT_CONFIG environment
      pair the relay uses, so all fetch children inherit it;
  (2) GIT_TERMINAL_PROMPT=0 is exported so an unauthenticated fetch fails
      crisply instead of probing a nonexistent terminal;
  (3) the empty-mirror seed fetch and the reconcile pass keep their EXPLICIT
      exported-head refspecs (refs/heads/*:refs/heads/*) — the refs a git://
      client can actually clone;
  (4) the CONFIGURED remote.origin.fetch stays the order-301 TRACKING
      refspec (+refs/heads/*:refs/remotes/origin/*): "fixing" it to a mirror
      refspec would let a stale-upstream reconcile fetch force-overwrite a
      just-received exported head before the relay ran (the order-301
      regression). Seeding cloneable heads is the JOB OF THE EXPLICIT
      COMMAND-LINE REFSPECS, never of the configured default.

preconditions:
  - workspace contains images/git/entrypoint.sh and images/git/reconcile-exported-heads.sh

critical_path:
  - step: "entrypoint exports the reset+helper credential pair for fetch children"
    command: "grep -q 'GIT_CONFIG_KEY_0=credential.helper' images/git/entrypoint.sh && grep -q 'GIT_CONFIG_KEY_1=credential.helper' images/git/entrypoint.sh && grep -qE '^[^#]*GIT_CREDENTIAL_HELPER=\"\\$\\{GIT_CREDENTIAL_HELPER:-/usr/local/bin/git-credential-tillandsias\\}\"' images/git/entrypoint.sh && grep -qE '^[^#]*export GIT_TERMINAL_PROMPT GIT_CONFIG_COUNT' images/git/entrypoint.sh && echo 'ok: fetch credential helper wired'"
    timeout_ms: 5000
    expected_behavior: "ok: fetch credential helper wired"

  - step: "the credential export happens BEFORE the first upstream fetch (seed)"
    command: "awk '/GIT_CONFIG_KEY_1=credential.helper/{cred=NR} /Fetching upstream to seed mirror/{seed=NR} END{exit !(cred && seed && cred < seed)}' images/git/entrypoint.sh && echo 'ok: wired before seed fetch'"
    timeout_ms: 5000
    expected_behavior: "ok: wired before seed fetch"

  - step: "seed fetch writes CLONEABLE exported heads (explicit refspec)"
    command: "grep -qF \"fetch origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'\" images/git/entrypoint.sh && echo 'ok: seed refspec exports heads'"
    timeout_ms: 5000
    expected_behavior: "ok: seed refspec exports heads"

  - step: "reconcile pass advances exported heads (explicit non-forced refspec)"
    command: "grep -qF \"fetch origin 'refs/heads/*:refs/heads/*'\" images/git/reconcile-exported-heads.sh && echo 'ok: reconcile refspec exports heads'"
    timeout_ms: 5000
    expected_behavior: "ok: reconcile refspec exports heads"

  - step: "configured default refspec stays the order-301 TRACKING refspec"
    command: "grep -qF \"config remote.origin.fetch \\\"+refs/heads/*:refs/remotes/origin/*\\\"\" images/git/entrypoint.sh && ! grep -qE '^[^#]*config remote\\.origin\\.mirror' images/git/entrypoint.sh && echo 'ok: configured refspec is tracking-only'"
    timeout_ms: 5000
    expected_behavior: "ok: configured refspec is tracking-only"

  - step: "an auth-refused seed is named as such, never as an empty upstream"
    command: "grep -q 'UPSTREAM AUTH REFUSED' images/git/entrypoint.sh && grep -q 'could not read Username' images/git/entrypoint.sh && echo 'ok: auth refusal is loud and named'"
    timeout_ms: 5000
    expected_behavior: "ok: auth refusal is loud and named"

observability:
  traces:
    - "@trace spec:git-mirror-service"
  expected_log: "mirror fetch paths carry the Vault credential helper and export cloneable heads"
  log_fields:
    spec: "git-mirror-service"
    test: "git-mirror-fetch-credential-shape"

rollback:
  on_failure: >
    Do NOT satisfy this by embedding a token in the remote URL or argv (order
    424 forbids it), and do NOT change remote.origin.fetch to a mirror refspec
    (order-301 regression: reconcile would clobber just-received exported
    heads before the relay runs). The credential travels ONLY through
    git-credential-tillandsias on stdin; the exported heads are written ONLY
    by the explicit command-line refspecs.
  command: "grep -n 'GIT_CONFIG_KEY_1\\|refs/heads/\\*:refs/heads/\\*\\|remote.origin.fetch' images/git/entrypoint.sh images/git/reconcile-exported-heads.sh"
