# @trace spec:ci-release
name: litmus:guest-binary-embed-integrity
spec: ci-release
phase: pre-build
description: Verify staged guest binaries are built, static, and match current VERSION
severity: high
size: instant

preconditions:
  - file exists target-guest/tillandsias-headless-x86_64-unknown-linux-musl
  - file exists target-guest/tillandsias-headless-aarch64-unknown-linux-musl
  - file exists VERSION
  - file exists scripts/build-guest-binaries.sh
  - file is executable scripts/build-guest-binaries.sh

critical_path:
  - step: "verify staged guest binaries with build-guest-binaries.sh --verify (stale/absent staging skips cleanly — order 447; a current-stamped binary with a genuine integrity defect still exits non-zero)"
    command: "bash scripts/build-guest-binaries.sh --verify"
    success_pattern: "verify:(ok|skip-stale-staging)"
    timeout_ms: 10000

  - step: "the nix lane tests CAPABILITY and routes through the toolbox, and its out-link staging survives a non-host store (order 790-mbk9)"
    # Behavioural, not a source grep (634-39ik): the fixture runs the REAL
    # script in sandboxes whose stub nix refuses un-routed calls the way a dead
    # daemon socket does, and asserts which flags reached nix, that a chroot
    # store's DANGLING out-link is still staged from the store root, that a
    # genuinely absent artifact fails loud, and that the cargo fallback is
    # reached only with a named reason.
    command: "bash scripts/test-guest-binaries-nix-lane.sh 2>&1 | tail -1"
    success_pattern: "ok:guest-binaries-nix-lane-fixture:[0-9]+"
    timeout_ms: 60000

observability:
  traces:
    - "@trace spec:ci-release"
  expected_log: "Verification SUCCESS: both binaries are correct and match VERSION"
  log_fields:
    spec: "ci-release"
    test: "guest-binary-embed-integrity"

rollback:
  on_failure: "run scripts/build-guest-binaries.sh to rebuild and stage matching guest binaries using Nix"
  command: "echo 'Rebuild required: run scripts/build-guest-binaries.sh'"
