# @trace spec:meta-orchestration
# @trace order:737-zcj5
# @trace order:770-f6u4
#
# Pins the executable MCP expert health probe (order 737-zcj5). `mcp_first_read_path`
# has always said "fall back and keep going, THEN RECORD IT" — but named no
# destination, so on 2026-08-14 two hosts skipped the recording half on the same
# day and both outages left no trace in the ledger at all. This test falsifies
# drift in the probe's verdict grammar, its four branches, the durable JSONL
# trace, the `health=` field that makes an outage distinguishable from silence,
# the negative control that keeps a healthy cycle quiet, and the wiring that
# gives the methodology rule a concrete referent.
#
# 770-f6u4 raised the probe to TOOL-CALL depth: on 2026-08-16 every tools/call
# on windows died at exec time while the handshake-only probe said
# ok:experts-healthy for two full cycles (order-531 shape). A handshake is no
# longer health: the probe must complete initialize → notifications/initialized
# → one real tools/call whose PINNED output grammar answers, must separate
# handshake-dead from tool-call-dead in the JSONL stage token, and on windows
# must launch the server the way the HARNESS launches it (WindowsApps WSL
# bash), recording the chosen launcher.
name: litmus:mcp-expert-health-probe-shape
spec: meta-orchestration
phase: pre-build
description: >
  Pin scripts/check-mcp-expert-health.sh: the falsifiable verdict grammar
  ^(ok:experts-healthy|down:<csv>|absent:not-registered|skip:<reason>)$, the
  healthy/down/partial/absent branches, tool-call probe depth with distinct
  handshake/tool-call stage tokens and launcher-fidelity recording, the health
  JSONL trace, the args-honoured regression guard, cycle-metrics.sh's health=
  field and its mcp_outage: negative control, and the meta-orchestration +
  methodology wiring to the probe.
severity: high
size: instant

preconditions:
  - workspace contains scripts/check-mcp-expert-health.sh
  - workspace contains scripts/cycle-metrics.sh
  - workspace contains skills/meta-orchestration/SKILL.md
  - workspace contains methodology/distributed-work.yaml
  - shell utilities (grep, bash, jq, mktemp, awk) are available in PATH

critical_path:
  - step: "probe is executable and exposes its fixture mode"
    command: "test -x scripts/check-mcp-expert-health.sh && grep -q 'fixture()' scripts/check-mcp-expert-health.sh && echo 'ok: probe-defined'"
    timeout_ms: 3000
    expected_behavior: "ok: probe-defined"

  - step: "all hermetic scenarios pass (healthy, both-down, partial, absent, depth, stage tokens, launcher, grammar, log trace)"
    # 180s, sized for the SLOWEST host: the 20-scenario fixture re-invokes the
    # probe per scenario and each probe costs ~15 process spawns, which windows
    # prices at ~100x linux (measured 2026-08-16: 98s windows, single-digit
    # seconds linux). See plan/issues/optimization/
    # mcp-health-fixture-windows-spawn-tax-2026-08-16.md before trimming
    # scenarios to buy the budget back.
    command: "scripts/check-mcp-expert-health.sh fixture >/dev/null 2>&1 && echo 'ok: scenarios-pass' || { scripts/check-mcp-expert-health.sh fixture; exit 1; }"
    timeout_ms: 180000
    expected_behavior: "ok: scenarios-pass"

  - step: "a registration naming no expected expert yields absent, not a false healthy"
    command: "d=$(mktemp -d); printf '%s\\n' '{\"mcpServers\":{\"git-tools\":{\"command\":\"true\"}}}' > \"$d/r.json\"; out=$(TILLANDSIAS_MCP_REGISTRATION=\"$d/r.json\" TILLANDSIAS_EXPERT_HEALTH_LOG=\"$d/h.jsonl\" bash scripts/check-mcp-expert-health.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" = 2 ] && [ \"$out\" = 'absent:not-registered' ] && echo 'ok: absent-not-healthy' || { echo \"FAIL: rc=$rc out=$out\"; exit 1; }"
    timeout_ms: 8000
    expected_behavior: "ok: absent-not-healthy"

  - step: "a registered but non-answering expert is reported down (handshake, not file-existence)"
    # `true` EXISTS and exits 0 — a `test -x`-style check would call it healthy.
    # Only speaking the MCP initialize handshake catches a server that starts and
    # never answers, which is the outage shape worth catching.
    command: "d=$(mktemp -d); printf '%s\\n' '{\"mcpServers\":{\"forge-plan\":{\"command\":\"true\"},\"project-info\":{\"command\":\"true\"}}}' > \"$d/r.json\"; out=$(TILLANDSIAS_MCP_REGISTRATION=\"$d/r.json\" TILLANDSIAS_EXPERT_HEALTH_LOG=\"$d/h.jsonl\" TILLANDSIAS_MCP_PROBE_TIMEOUT=5 bash scripts/check-mcp-expert-health.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" = 1 ] && [ \"$out\" = 'down:forge-plan,project-info' ] && echo 'ok: existing-but-mute-is-down' || { echo \"FAIL: rc=$rc out=$out\"; exit 1; }"
    timeout_ms: 15000
    expected_behavior: "ok: existing-but-mute-is-down"

  - step: "registration args are honoured AND a handshake-only server is DOWN at tool-call depth with the distinct stage token"
    # The frame here MUST be a spec-valid InitializeResult. This step originally
    # used `\"result\":{}`, which the hardened probe correctly rejects — the step
    # had encoded the very weak definition 741-t66e was filed against, and it
    # started failing the moment the definition was strengthened. That is the
    # test doing its job; do not weaken the probe to make a stale fixture pass.
    #
    # 770-f6u4 strengthened the definition AGAIN, and this step moved with it a
    # second time: an echo stand-in that serves ONLY the init frame was the
    # healthy exemplar under handshake-only probing, and is now precisely the
    # handshake-only outage the depth stage exists to catch. Reaching
    # stage=tool-call (never stage=handshake) still proves .args were honoured —
    # a bare-bash probe dies AT the handshake — so this one scenario pins both
    # the old regression and the new depth. The full healthy path lives in the
    # fixture scenarios, whose stand-ins serve the whole conversation.
    command: "d=$(mktemp -d); f='{\"jsonrpc\":\"2.0\",\"id\":1,\"result\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"serverInfo\":{\"name\":\"fixture\",\"version\":\"1\"}}}'; jq -cn --arg f \"$f\" '{mcpServers:{\"forge-plan\":{command:\"echo\",args:[$f]},\"project-info\":{command:\"echo\",args:[$f]}}}' > \"$d/r.json\"; out=$(TILLANDSIAS_MCP_REGISTRATION=\"$d/r.json\" TILLANDSIAS_EXPERT_HEALTH_LOG=\"$d/h.jsonl\" bash scripts/check-mcp-expert-health.sh); rc=$?; ok=1; [ \"$rc\" = 1 ] || ok=0; [ \"$out\" = 'down:forge-plan,project-info' ] || ok=0; grep -q '\"stage\":\"tool-call\"' \"$d/h.jsonl\" || ok=0; grep -q '\"stage\":\"handshake\"' \"$d/h.jsonl\" && ok=0; rm -rf \"$d\"; [ \"$ok\" = 1 ] && echo 'ok: args-honoured-and-handshake-only-is-down' || { echo \"FAIL: rc=$rc out=$out\"; exit 1; }"
    timeout_ms: 8000
    expected_behavior: "ok: args-honoured-and-handshake-only-is-down"

  - step: "launcher fidelity: on windows a registered bare bash is rewritten to the harness launcher and the choice is recorded"
    # 770-f6u4 second gap: the probe launched `bash` through the probing shell's
    # PATH, but the agent harness resolves it to the WindowsApps WSL launcher —
    # so the probe tested a DIFFERENT environment than the sessions' servers.
    # Forced-OS seam + a stand-in launcher pin the rewrite and its JSONL record;
    # the healthy end-to-end path through the stand-in lives in the fixture.
    command: "d=$(mktemp -d); printf '%s\\n' '#!/bin/sh' 'exit 1' > \"$d/fb\"; chmod +x \"$d/fb\"; jq -cn '{mcpServers:{\"forge-plan\":{command:\"bash\",args:[\"/nonexistent\"]},\"project-info\":{command:\"bash\",args:[\"/nonexistent\"]}}}' > \"$d/r.json\"; TILLANDSIAS_MCP_REGISTRATION=\"$d/r.json\" TILLANDSIAS_EXPERT_HEALTH_LOG=\"$d/h.jsonl\" TILLANDSIAS_MCP_PROBE_TIMEOUT=5 TILLANDSIAS_MCP_PROBE_OS=MINGW64_NT-litmus TILLANDSIAS_MCP_HARNESS_BASH=\"$d/fb\" bash scripts/check-mcp-expert-health.sh >/dev/null; ok=1; grep -q \"\\\"launcher\\\":\\\"$d/fb\\\"\" \"$d/h.jsonl\" || ok=0; rm -rf \"$d\"; [ \"$ok\" = 1 ] && echo 'ok: launcher-rewritten-and-recorded' || { echo 'FAIL: launcher record missing'; exit 1; }"
    timeout_ms: 15000
    expected_behavior: "ok: launcher-rewritten-and-recorded"

  - step: "an outage leaves a durable down record in the health log"
    command: "d=$(mktemp -d); printf '%s\\n' '{\"mcpServers\":{\"forge-plan\":{\"command\":\"false\"},\"project-info\":{\"command\":\"false\"}}}' > \"$d/r.json\"; TILLANDSIAS_MCP_REGISTRATION=\"$d/r.json\" TILLANDSIAS_EXPERT_HEALTH_LOG=\"$d/h.jsonl\" TILLANDSIAS_MCP_PROBE_TIMEOUT=5 bash scripts/check-mcp-expert-health.sh >/dev/null; n=$(grep -c '\"state\":\"down\"' \"$d/h.jsonl\"); rm -rf \"$d\"; [ \"$n\" = \"2\" ] && echo 'ok: outage-trace-durable' || { echo \"FAIL: down records=$n\"; exit 1; }"
    timeout_ms: 15000
    expected_behavior: "ok: outage-trace-durable"

  - step: "ADVERSARIAL: an error frame whose data embeds the word result is DOWN, not healthy"
    # 741-t66e, the most serious defect the in-forge review found: the first
    # draft accepted `grep -q '\"result\"'`, so a server REJECTING initialize
    # with an error frame containing that substring read as healthy — i.e. the
    # canonical registered-but-broken outage this probe exists to catch.
    command: "d=$(mktemp -d); f='{\"jsonrpc\":\"2.0\",\"id\":1,\"error\":{\"code\":-32603,\"message\":\"init failed\",\"data\":\"no \\\"result\\\" available\"}}'; jq -cn --arg f \"$f\" '{mcpServers:{\"forge-plan\":{command:\"echo\",args:[$f]},\"project-info\":{command:\"echo\",args:[$f]}}}' > \"$d/r.json\"; out=$(TILLANDSIAS_MCP_REGISTRATION=\"$d/r.json\" TILLANDSIAS_EXPERT_HEALTH_LOG=\"$d/h.jsonl\" bash scripts/check-mcp-expert-health.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" = 1 ] && [ \"$out\" = 'down:forge-plan,project-info' ] && echo 'ok: error-frame-is-down' || { echo \"FAIL: rc=$rc out=$out\"; exit 1; }"
    timeout_ms: 10000
    expected_behavior: "ok: error-frame-is-down"

  - step: "ADVERSARIAL: a result missing the required InitializeResult fields is DOWN"
    command: "d=$(mktemp -d); jq -cn '{mcpServers:{\"forge-plan\":{command:\"echo\",args:[\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"result\\\":{}}\"]},\"project-info\":{command:\"echo\",args:[\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"result\\\":null}\"]}}}' > \"$d/r.json\"; out=$(TILLANDSIAS_MCP_REGISTRATION=\"$d/r.json\" TILLANDSIAS_EXPERT_HEALTH_LOG=\"$d/h.jsonl\" bash scripts/check-mcp-expert-health.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" = 1 ] && [ \"$out\" = 'down:forge-plan,project-info' ] && echo 'ok: schema-invalid-result-is-down' || { echo \"FAIL: rc=$rc out=$out\"; exit 1; }"
    timeout_ms: 10000
    expected_behavior: "ok: schema-invalid-result-is-down"

  - step: "ADVERSARIAL: a registration that NAMES a server but garbles it is DOWN, never absent"
    # 741-na2c: `absent` must mean the environment has no such expert to lose.
    # Reporting it for a broken registration suppresses the alarm for exactly
    # the case where the registration is the thing that broke.
    command: "d=$(mktemp -d); jq -cn '{mcpServers:{\"forge-plan\":{command:\"echo\",args:\"not-an-array\"},\"project-info\":{command:42}}}' > \"$d/r.json\"; out=$(TILLANDSIAS_MCP_REGISTRATION=\"$d/r.json\" TILLANDSIAS_EXPERT_HEALTH_LOG=\"$d/h.jsonl\" bash scripts/check-mcp-expert-health.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" = 1 ] && [ \"$out\" = 'down:forge-plan,project-info' ] && echo 'ok: malformed-is-down-not-absent' || { echo \"FAIL: rc=$rc out=$out\"; exit 1; }"
    timeout_ms: 10000
    expected_behavior: "ok: malformed-is-down-not-absent"

  - step: "the probe validates the InitializeResult STRUCTURALLY (jq predicate over the required fields)"
    # Guards the DEFINITION, not just the behaviour. Deliberately a positive
    # assertion: an earlier draft of this step also asserted the absence of the
    # old `grep '\"result\"'` expression and failed, because the probe's own
    # header QUOTES that expression while explaining why it was wrong. A pin
    # that cannot distinguish code from the comment documenting its history is
    # not a pin. The adversarial steps above are the real behavioural guard;
    # this one keeps the jq predicate itself from being quietly hollowed out.
    command: "grep -q 'result.protocolVersion' scripts/check-mcp-expert-health.sh && grep -q 'result.serverInfo.name' scripts/check-mcp-expert-health.sh && grep -q -- '--argjson id' scripts/check-mcp-expert-health.sh && grep -q 'notifications/initialized' scripts/check-mcp-expert-health.sh && grep -q 'tools/call' scripts/check-mcp-expert-health.sh && grep -q 'probe_tool_text_ok' scripts/check-mcp-expert-health.sh && echo 'ok: structural-validation'"
    timeout_ms: 3000
    expected_behavior: "ok: structural-validation"

  - step: "cycle-metrics reports health= on the mcp: line"
    command: "grep -q 'health=%s' scripts/cycle-metrics.sh && grep -q 'TILLANDSIAS_EXPERT_HEALTH_LOG' scripts/cycle-metrics.sh && echo 'ok: metrics-carries-health'"
    timeout_ms: 3000
    expected_behavior: "ok: metrics-carries-health"

  - step: "NEGATIVE CONTROL: cycle-metrics emits mcp_outage: only when a non-up state was recorded"
    # A signal that fires every cycle is one nobody reads. The guard is that the
    # mcp_outage: printf is reachable only under the outage-count test.
    command: "grep -q 'mcp_outages:-0.*-gt 0' scripts/cycle-metrics.sh && grep -q \"printf 'mcp_outage:\" scripts/cycle-metrics.sh && echo 'ok: outage-line-is-conditional'"
    timeout_ms: 3000
    expected_behavior: "ok: outage-line-is-conditional"

  - step: "health=unprobed is distinct from health=ok (an unmeasured expert is never reported healthy)"
    command: "grep -q 'mcp_health=\"unprobed\"' scripts/cycle-metrics.sh && echo 'ok: unprobed-distinct-from-ok'"
    timeout_ms: 3000
    expected_behavior: "ok: unprobed-distinct-from-ok"

  - step: "the meta-orchestration skill runs the probe and marks it advisory"
    command: "grep -q 'check-mcp-expert-health.sh' skills/meta-orchestration/SKILL.md && grep -q 'record, never block' skills/meta-orchestration/SKILL.md && echo 'ok: skill-wires-probe'"
    timeout_ms: 3000
    expected_behavior: "ok: skill-wires-probe"

  - step: "the methodology fall-back rule gained a concrete referent"
    command: "grep -q 'unavailable_record_where' methodology/distributed-work.yaml && grep -q 'check-mcp-expert-health.sh' methodology/distributed-work.yaml && echo 'ok: methodology-names-destination'"
    timeout_ms: 3000
    expected_behavior: "ok: methodology-names-destination"

observability:
  traces:
    - "@trace spec:meta-orchestration"
    - "@trace order:737-zcj5"
  expected_log: "mcp expert health probe pinned (grammar + four branches + durable trace + metrics health field + negative control + wiring)"
  log_fields:
    spec: "meta-orchestration"
    test: "mcp-expert-health-probe-shape"
    artifact: "scripts/check-mcp-expert-health.sh + scripts/cycle-metrics.sh + skills/meta-orchestration/SKILL.md + methodology/distributed-work.yaml"

rollback:
  on_failure: >
    The MCP expert health probe drifted. Restore
    scripts/check-mcp-expert-health.sh emitting exactly one line matching
    ^(ok:experts-healthy|down:[a-z0-9-]+(,[a-z0-9-]+)*|absent:not-registered|skip:[a-z0-9-]+)$
    with exit codes 0/1/2/3, keep it executable, keep server_command joining
    .command with .args (dropping .args reports healthy experts as down), keep
    the TOOL-CALL depth stage (initialize + notifications/initialized + one
    pinned-grammar tools/call; handshake success alone is the order-531 false
    healthy), keep the distinct handshake/tool-call stage tokens and the
    launcher-fidelity rewrite + JSONL launcher record on windows, keep
    the JSONL trace append, restore cycle-metrics.sh's health= field and its
    CONDITIONAL mcp_outage: line, and restore the probe references in
    skills/meta-orchestration/SKILL.md and methodology/distributed-work.yaml
    (unavailable_record_where).
  command: "scripts/check-mcp-expert-health.sh fixture; grep -nE 'health=|mcp_outage:|mcp_health' scripts/cycle-metrics.sh | head -20"
