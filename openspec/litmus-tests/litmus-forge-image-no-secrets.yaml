# @trace spec:podman-secrets-integration, order:2004-in3v, order:1918-wfrg
#
# No forge image the launcher builds can carry a credential. Carried from
# 1918-wfrg (a warm layer would have committed a running forge, with its
# /run/secrets and agent logins, as an image). The decider
# scripts/lua/check-forge-image-no-secrets.lua judges the forge
# Containerfiles and the launcher sources; the controls below prove it
# refuses each way a credential could reach an image.
name: litmus:forge-image-no-secrets
spec: podman-secrets-integration
phase: pre-build
description: >
  The forge Containerfiles neither name /run/secrets nor copy a
  credential-shaped file, and the launcher never commits a container to an
  image.
severity: high
size: instant

critical_path:
  - step: "2004-in3v: today's forge image sources and launcher carry no credential path"
    command: "out=$(tillandsias-plan script run scripts/lua/check-forge-image-no-secrets.lua); rc=$?; case \"$out\" in ok:forge-image-no-secrets:*) [ \"$rc\" -eq 0 ] && echo 'ok: forge image carries no secret' ;; *) echo \"FAIL rc=$rc out=[$out]\"; exit 1 ;; esac"
    timeout_ms: 20000
    expected_behavior: "ok: forge image carries no secret"

  - step: "2004-in3v NEGATIVE CONTROL: a Containerfile that copies into /run/secrets is refused"
    command: "mkdir -p target; T=$(mktemp -d target/litmus-fins.XXXXXX); cp images/default/Containerfile.base \"$T/\"; { cat images/default/Containerfile; echo 'COPY token.txt /run/secrets/tillandsias-github-token'; } > \"$T/Containerfile\"; mkdir -p \"$T/src\"; out=$(TILLANDSIAS_FORGE_IMAGE_DIR=\"$T\" TILLANDSIAS_LAUNCHER_SRC_DIR=\"$T/src\" tillandsias-plan script run scripts/lua/check-forge-image-no-secrets.lua 2>/dev/null); rc=$?; find \"$T\" -delete; [ \"$rc\" -eq 1 ] && [ \"$out\" = 'violation:forge-image-no-secrets:Containerfile:run-secrets,Containerfile:credential-file' ] && echo 'ok: /run/secrets copy refused' || { echo \"FAIL rc=$rc out=[$out]\"; exit 1; }"
    timeout_ms: 20000
    expected_behavior: "ok: /run/secrets copy refused"

  - step: "2004-in3v NEGATIVE CONTROL: a launcher that commits a container to an image is refused"
    command: "mkdir -p target; T=$(mktemp -d target/litmus-fins.XXXXXX); cp images/default/Containerfile.base images/default/Containerfile \"$T/\"; mkdir -p \"$T/src\"; printf '%s\\n' 'fn warm() { run(&[\"podman\", \"commit\", \"forge\", \"warm\"]); }' > \"$T/src/warm.rs\"; out=$(TILLANDSIAS_FORGE_IMAGE_DIR=\"$T\" TILLANDSIAS_LAUNCHER_SRC_DIR=\"$T/src\" tillandsias-plan script run scripts/lua/check-forge-image-no-secrets.lua 2>/dev/null); rc=$?; find \"$T\" -delete; [ \"$rc\" -eq 1 ] && [ \"$out\" = 'violation:forge-image-no-secrets:image-commit' ] && echo 'ok: container commit refused' || { echo \"FAIL rc=$rc out=[$out]\"; exit 1; }"
    timeout_ms: 20000
    expected_behavior: "ok: container commit refused"

observability:
  traces:
    - "@trace spec:podman-secrets-integration"
