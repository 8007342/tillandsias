# @trace spec:git-mirror-service
name: litmus:git-mirror-no-anonymous-daemon-write
spec: git-mirror-service
phase: pre-build
size: instant
severity: critical
description: >
  Historical name retained, but the current daemon DOES expose anonymous
  enclave receive-pack (order 450). Any reachable peer can create or
  fast-forward refs and cause the privileged service relay to carry those
  updates upstream; the relay's Vault credential authenticates the SERVICE to
  GitHub, not the forge client to the mirror. Network placement is not identity.

  This litmus pins only honest interim containment: all accepted updates pass
  through explicit atomic refspec relay; order 579 rejects every ref deletion and
  non-fast-forward branch updates before relay; --mirror/--all and anonymous
  HTTP writes remain absent. It MUST NOT be cited as zero-trust closure.

  The daemon receive-pack path is EXPLICITLY INTERIM. Operator
  2026-07-19: unauthenticated writes are not acceptable even within the forge.
  The authenticated replacement is tracked by order 322 (research) + order 451
  (impl), which will remove --enable=receive-pack once authenticated per-forge
  writes land; see plan/issues/research-authenticated-forge-writes-restore-2026-07-19.md.
  Until then, receive-pack on the internal-only daemon is the working,
  relay-gated push path.

preconditions:
  - workspace contains images/git/entrypoint.sh
  - workspace contains images/git/relay-refs.sh
  - workspace contains images/git/pre-receive-hook.sh

critical_path:
  - step: "the daemon serves read (--export-all) for agent clone/fetch"
    command: "grep -qE -- '--export-all' images/git/entrypoint.sh && echo 'ok: daemon read path present'"
    timeout_ms: 5000
    expected_behavior: "ok: daemon read path present"

  - step: "every accepted push reaches upstream through the pre-receive service relay"
    command: "grep -Fq 'tillandsias-relay-refs' images/git/pre-receive-hook.sh && echo 'ok: pre-receive service relay is the upstream boundary'"
    timeout_ms: 5000
    expected_behavior: "ok: pre-receive service relay is the upstream boundary"

  - step: "the relay never performs a broad mirror/all update"
    command: "! grep -Eq 'git +push[^|&]*(--mirror|--all)\\b' images/git/relay-refs.sh && echo 'ok: no --mirror/--all upstream'"
    timeout_ms: 5000
    expected_behavior: "ok: no --mirror/--all upstream"

  - step: "all deletion and non-fast-forward branch updates stop before relay"
    command: "grep -Fq 'ref deletion is disabled' images/git/pre-receive-hook.sh && grep -Fq 'non-fast-forward branch update is disabled' images/git/pre-receive-hook.sh && echo 'ok: destructive ref updates stop pre-relay'"
    timeout_ms: 5000
    expected_behavior: "ok: destructive ref updates stop pre-relay"

  - step: "the anonymous HTTP write path stays disabled (http.receivepack unset, no http server spawned)"
    command: "grep -Fq 'config --unset-all http.receivepack' images/git/entrypoint.sh && ! grep -vE '^[[:space:]]*#' images/git/entrypoint.sh | grep -qiE 'lighttpd|git-http-backend' && echo 'ok: no anonymous HTTP write path'"
    timeout_ms: 5000
    expected_behavior: "ok: no anonymous HTTP write path"

observability:
  traces:
    - "@trace spec:git-mirror-service"
  expected_log: "anonymous daemon writes remain interim; deletion and branch rewinds stop before the service relay"
  log_fields:
    spec: "git-mirror-service"
    test: "git-mirror-no-anonymous-daemon-write"

rollback:
  on_failure: >
    Keep the pre-receive relay explicit and atomic, keep ref deletion/branch-rewind
    rejection before relay, and do not interpret a passing result as client
    authentication. Removing daemon receive-pack before order 322/451 ships a
    working authenticated transport breaks the forge push path; weakening the
    order-579 containment recreates upstream/local split-brain.
  command: "grep -n 'receive-pack\\|relay-refs\\|--mirror' images/git/entrypoint.sh images/git/relay-refs.sh"
