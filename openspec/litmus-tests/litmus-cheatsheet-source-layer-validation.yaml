# @trace spec:cheatsheet-source-layer
name: litmus:cheatsheet-source-layer-validation
spec: cheatsheet-source-layer
phase: pre-build
description: Verify the cheatsheet source validator stays callable on a fresh workspace
severity: medium
size: instant

preconditions:
  - workspace contains scripts/ and cheatsheets/
  - a tillandsias-plan binary with `script run` resolves

critical_path:
  - step: "run the source validator in no-sha mode"
    command: '. scripts/plan-binary-probe.sh; "$(resolve_plan_binary)" script run scripts/lua/check-cheatsheet-sources.lua -- --no-sha'
    timeout_ms: 5000

observability:
  traces:
    - "@trace spec:cheatsheet-source-layer"
  expected_log: "cheatsheet source validation completes without fatal errors"
  log_fields:
    spec: "cheatsheet-source-layer"
    test: "cheatsheet-source-layer-validation"

rollback:
  on_failure: "inspect scripts/lua/check-cheatsheet-sources.lua and openspec/specs/cheatsheet-source-layer/spec.md for drift"
  command: '. scripts/plan-binary-probe.sh; "$(resolve_plan_binary)" script run scripts/lua/check-cheatsheet-sources.lua -- --no-sha'
