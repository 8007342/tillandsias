# @trace spec:meta-orchestration, order:1247-omqr, order:1247-amcu
name: litmus:claims-refusals-carry-affordance
spec: meta-orchestration
phase: pre-build
size: instant
severity: medium
description: >
  Every refusal of scripts/check-claims-across-branches.sh (run before every
  claim) says WHY it refused and WHAT would make it not a refusal, as labelled
  "  why:" / "  remedy:" stderr lines beside its unchanged stdout verdict: the
  first 1247-amcu slice. For blocked:no-plan-binary and blocked:fetch-failed the
  fixture EXECUTES the stated remedy and shows it clears the refusal; a static
  arm fails any refusal site added later without an affordance.

preconditions:
  - workspace contains scripts/check-claims-across-branches.sh
  - workspace contains scripts/test-claims-affordance.sh

critical_path:
  - step: "each claims refusal carries why and remedy, the executed remedies clear their refusals, and no refusal site lacks an affordance"
    command: "bash scripts/test-claims-affordance.sh 2>&1 | tail -1"
    timeout_ms: 120000
    expected_behavior: "PASS: claims-affordance 8/8 (1247-omqr)"

observability:
  traces:
    - "@trace spec:meta-orchestration"
  expected_log: "a claims refusal names its rule and how to clear it"
  log_fields:
    spec: "meta-orchestration"
    test: "claims-refusals-carry-affordance"

failure_modes:
  - "a new refusal in check-claims-across-branches.sh ships without why/remedy"
  - "a stated remedy no longer clears its refusal"
