# @trace spec:forge-environment-discoverability, order:2005-ccli
name: litmus:forge-impact-plan-cli
spec: forge-environment-discoverability
phase: pre-build
status: active
description: >
  Order 2005-ccli slice 2. tillandsias-impact plan {graph, from, to, rules} is
  a dry run that reports per-output modes, totals and a cost estimate, and
  writes only its report. The fixture is a documentation site (not
  tillandsias, kumbia or a game): narrow dependencies keep a one-page title
  edit to that page and the PDF, the costliest edit wins, an unmatched change
  takes the default, an unreached change is warned, REV:PATH reads git, and
  invalid graphs or rules are refused by name with no report written.
severity: medium
size: instant
preconditions:
  - workspace contains images/default/cli/tillandsias-impact
  - python3 is available in PATH
critical_path:
  - step: "Req: the impact plan derives per-output modes from narrow dependencies, writes only the report, and refuses invalid input by name (pre-fix: no such tool)"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-tillandsias-impact.lua 2>&1"
    timeout_ms: 180000
    success_pattern: "ok:tillandsias-impact:11 arms"
  - step: "Install: the Containerfile copies tillandsias-impact into the CLI bin and links it onto PATH"
    command: "grep -Fq 'COPY cli/tillandsias-impact /opt/agents/tillandsias-cli/bin/tillandsias-impact' images/default/Containerfile && grep -Fq 'ln -sf /opt/agents/tillandsias-cli/bin/tillandsias-impact /usr/local/bin/tillandsias-impact' images/default/Containerfile && echo ok:impact-plan-installed"
    timeout_ms: 3000
    success_pattern: "ok:impact-plan-installed"
observability:
  traces:
    - "@trace order:2005-ccli"
  expected_log: "ok:tillandsias-impact:11 arms"
  log_fields:
    spec: "forge-environment-discoverability"
    test: "forge-impact-plan-cli"
rollback:
  on_failure: >
    The impact planner widened a narrow edit, wrote outside its report, or is
    missing from the image. Restore images/default/cli/tillandsias-impact and
    its COPY and symlink in images/default/Containerfile.
  command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-tillandsias-impact.lua"
