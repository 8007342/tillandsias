name: litmus:script-exec-bit-shape
spec: ci-release
description: >
  Pin the exec-bit guard (order 731-d89b). scripts/resolve-release-run.sh
  reached linux-next at mode 100644 from the Windows host, and the release
  runbook invokes it directly — so on a POSIX host that step was a permission
  error rather than the verdict the script exists to produce. The osx host
  landed two more mode flips in the same window; the class is live on all three
  platforms and nothing would have caught it before the next release ran.

  The rule is deliberately NARROW and the negative controls are the reason to
  trust it: `bash scripts/x.sh` works at any mode, and several scripts here are
  SOURCED libraries that should never be executable. A blanket "shebang implies
  +x" rule would flag 27 files, nearly all correct.
severity: medium
size: instant
phase: pre-build

preconditions:
  - workspace contains scripts/check-script-exec-bits.sh

critical_path:
  - step: "Req: the guard exists, is itself executable, and emits its pinned grammar"
    command: "test -x scripts/check-script-exec-bits.sh && scripts/check-script-exec-bits.sh | grep -qE '^(ok:script-exec-bits:[0-9]+ checked|violation:script-not-executable:[0-9]+)$' && echo 'ok: guard present and grammar pinned'"
    timeout_ms: 30000
    expected_behavior: "ok: guard present and grammar pinned"

  - step: "FOUR-WAY CONTROL: bare+644 refused, bare+755 passes, `bash`-prefixed and sourced stay unflagged"
    # One hermetic throwaway repo per scenario. The two negative controls carry
    # the weight: a guard that flagged every shebanged file would satisfy the
    # breach case while condemning most of scripts/.
    #
    # Order 770-dyqr added three more: a litmus `command:` bare invocation
    # (REFUSED), the same naming an interpreter (silent), and a CI-workflow bare
    # invocation (REFUSED). Those cover the non-shell caller surfaces; the
    # litmus one is the 2026-08-16 breach itself.
    command: "scripts/test-script-exec-bits.sh"
    success_pattern: "PASS: script-exec-bits fixture"
    timeout_ms: 60000

  - step: "Req: the caller corpus includes the non-shell surfaces that execute (litmus steps, CI workflows)"
    # The 2026-08-16 breach was NOT a missing file glob — litmus yaml was in the
    # corpus from the first commit. It was the invocation pattern: a step's path
    # is preceded by `: "`, which none of the shell lead-ins accepted, so the
    # form was unreachable. Pin BOTH halves, since either alone leaves the
    # breach open.
    # Order 754-kptj widened the same surface again: a `command:` may lead in
    # with `./` and/or a run of shell env assignments, and both forms were
    # unreachable for the same reason `: "` was. Pinned as NAMED awk variables
    # (`dotslash`, `envpfx`) rather than inlined regex, precisely so this grep
    # can see them.
    command: "grep -q 'openspec/litmus-tests/\\*.yaml' scripts/check-script-exec-bits.sh && grep -q '.github/workflows/\\*.yml' scripts/check-script-exec-bits.sh && grep -q 'yamlcmd' scripts/lib/exec-bits-filter.awk && grep -q 'dotslash' scripts/lib/exec-bits-filter.awk && grep -q 'envpfx' scripts/lib/exec-bits-filter.awk && echo 'ok: non-shell caller surfaces covered'"
    timeout_ms: 5000
    expected_behavior: "ok: non-shell caller surfaces covered"

  - step: "LIVE: every bare-invoked script in this tree is tracked executable"
    command: "mf_stage prod 0 OUT -- scripts/check-script-exec-bits.sh && mf_holds_ere OUT '^ok:script-exec-bits:[0-9]+ checked$' && echo 'ok: tree clean'"
    timeout_ms: 30000
    expected_behavior: "ok: tree clean"

  - step: "the checker sees a command-substitution invocation, and does not flag prose"
    # Order 758-jw6v. The single-pattern form ended ([[:space:]\"]|$), which
    # cannot match $(scripts/x.sh) because the next character is ")" — so this
    # checker could not see the invocation form named in its OWN header as the
    # defect it exists for. Widening the class naively then flagged three
    # COMMENTS containing "(scripts/x.sh)", one of them a sourced library that
    # must stay non-executable, so ")" is permitted only after "$(".
    command: "scripts/test-script-exec-bits.sh 2>&1 | tail -1"
    timeout_ms: 60000
    # 7 -> 10 with order 770-dyqr's non-shell caller scenarios; 10 -> 11 with
    # order 851-gpb5's portable-xargs pin (no GNU-only `xargs -r`, hit by the
    # first macOS host); 11 -> 14 with order 754-kptj's ./-prefix and
    # env-assignment-prefix scenarios plus the `bash ./` narrowness control.
    # The count is pinned deliberately: it is how a wholesale fixture rewrite
    # that drops coverage gets caught, which already happened once under
    # 758-jw6v.
    expected_behavior: "ok:script-exec-bits-fixture:14"

observability:
  traces:
    - "@trace spec:ci-release"
  expected_log: "scripts invoked by path are tracked executable; interpreter-prefixed and sourced scripts are not required to be"
  log_fields:
    spec: "ci-release"
    test: "script-exec-bit-shape"
    artifact: "scripts/check-script-exec-bits.sh"

rollback:
  on_failure: "run scripts/check-script-exec-bits.sh — it names each offending path and prints the one-line git update-index --chmod=+x fix"
  command: "scripts/check-script-exec-bits.sh"
