# @trace spec:local-web-preview
# @trace order:1862-wrx5 (spec: openspec/changes/web-studio-lanes, not yet archived)
#
# Order 1862-wrx5: the Decap CMS studio image. decap-cms (MIT) is vendored from
# its sha512-pinned npm tarball; decap-server (MIT) and its whole tree come from
# package-lock.json integrity. Licences approved by the operator 2026-11-01.
# Bound under local-web-preview, beside the GrapesJS studio litmus, until the
# web-studio-lane spec is archived.
#
# The fixture builds images/web-studio-decap and runs it with --network none
# on a throwaway Hugo checkout. It asserts:
#   - the vendored bundle is served and the admin page names no external URL;
#   - config.yml points Decap's backend at the studio;
#   - entriesByFolder lists the post, and a persistEntry through the studio's
#     /api/v1 lands in content/posts/hello.md as a git diff;
#   - decap-server listens on 127.0.0.1 and ::1 ONLY (read from /proc/net), so
#     the studio front is the one way in;
#   - egress is blocked.
# The detector half (a Hugo site recommends Decap) is the Rust test named below.
#
# REGIME: post-build. A build that cannot reach the npm registry exits 3,
# never a green.
name: litmus:web-studio-decap-saves-a-hugo-entry
spec: local-web-preview
phase: post-build
description: >
  Pin 1862-wrx5: the Decap CMS studio saves a Hugo entry into the checkout as
  a git diff, with decap-server reachable only through the studio and no
  egress; a Hugo project recommends Decap.
severity: high
size: long

preconditions:
  - workspace contains images/web-studio-decap and scripts/test-web-studio-decap.sh
  - podman can build images

critical_path:
  - step: "the suite parses and carries its exec bit"
    command: "bash -n scripts/test-web-studio-decap.sh && test -x scripts/test-web-studio-decap.sh && echo 'ok: web-studio-decap-suite-parses'"
    timeout_ms: 3000
    expected_behavior: "ok: web-studio-decap-suite-parses"

  - step: "a Hugo entry saved through the studio lands as a repo diff, decap-server on loopback only"
    command: "bash scripts/test-web-studio-decap.sh"
    timeout_ms: 900000
    expected_behavior: "PASS: Decap studio saves a Hugo entry as a repo diff, decap-server on loopback only, no egress"

  - step: "a Hugo project recommends Decap"
    command: "cargo test -p tillandsias-headless studio::tests::a_hugo_site_recommends_decap -- --exact"
    timeout_ms: 300000

observability:
  traces:
    - "@trace spec:local-web-preview"
  expected_log: "PASS: Decap studio saves a Hugo entry as a repo diff, decap-server on loopback only, no egress"
  log_fields:
    spec: local-web-preview
    test: web-studio-decap-saves-a-hugo-entry
    artifact: images/web-studio-decap/server.mjs

rollback:
  on_failure: >
    The image no longer vendors the pinned bundle or lock, the studio stopped
    forwarding to decap-server, or decap-server listens beyond loopback.
  command: "grep -n 'DECAP_' images/web-studio-decap/Containerfile"
