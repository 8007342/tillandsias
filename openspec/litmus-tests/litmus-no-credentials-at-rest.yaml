# @trace spec:tillandsias-vault
name: litmus:no-credentials-at-rest
spec: tillandsias-vault
phase: pre-build
description: No Vault unseal share, root token, installation anchor or CA private key is ever in plaintext on durable disk (operator ruling 2026-10-19, 1118-fqfk); the unseal key reaches the container as a scrubbed tmpfs file, and a rejected key wipes the store once with a named sign-in-again line
severity: high
size: quick

preconditions:
  - workspace contains crates/tillandsias-headless
  - cargo is available in PATH

critical_path:
  - step: "the passed-count pins are floors with 0 failed, and the retired exact pins refuse growth (1929-gfxy)"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-litmus-count-floors.lua 2>&1"
    timeout_ms: 30000
    expected_behavior: "ok:litmus-count-floors:9/9"
  - step: "the credentials-at-rest scan names every planted plaintext site and passes a clean home"
    command: "P=\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\"; TILLANDSIAS_PLAN_BIN=\"$P\" \"$P\" script run scripts/lua/test-credentials-at-rest.lua 2>&1"
    timeout_ms: 180000
    success_pattern: "ok:credentials-at-rest-fixture:11"

  - step: "the unseal key file is tmpfs-only, 0700/0444, and scrubbed; a non-tmpfs runtime dir is refused"
    command: "cargo test -p tillandsias-headless --features tray vault_bootstrap::tests::the_unseal_key_file_is_tmpfs_only_and_scrubbed -- --exact"
    timeout_ms: 600000

  - step: "the unseal key is never a podman secret, and a proven rejection wipes once with one relaunch"
    command: "cargo test -p tillandsias-headless --features tray vault_bootstrap::tests::the_unseal_key_is_never_a_podman_secret_and_a_rejection_wipes_once -- --exact"
    timeout_ms: 600000

  - step: "a CA key is a link into tmpfs, refilled from the keyring only for its own certificate, and legacy plaintext is deleted, not imported"
    command: "cargo test -p tillandsias-headless --features tray ca_key_store::tests"
    timeout_ms: 600000
    # A FLOOR, anchored (1929-gfxy's sweep): the bare "5 passed" also matched
    # 15 and 25, and would have refused a sixth ca_key_store test.
    success_pattern: "test result: ok\\. ([5-9]|[1-9][0-9]+) passed; 0 failed"

observability:
  traces:
    - "@trace spec:tillandsias-vault"
  expected_log: "no plaintext Vault credential at rest"
  log_fields:
    spec: "tillandsias-vault"
    test: "no-credentials-at-rest"

rollback:
  on_failure: "inspect write_unseal_key_file, launch_with_unseal_key and wipe_unopenable_store in crates/tillandsias-headless/src/vault_bootstrap.rs, and scripts/lua/check-credentials-at-rest.lua"
  command: "grep -n 'fn write_unseal_key_file\\|fn launch_with_unseal_key\\|fn wipe_unopenable_store' crates/tillandsias-headless/src/vault_bootstrap.rs"
