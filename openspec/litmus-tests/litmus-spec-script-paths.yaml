# @trace spec:ci-release
name: litmus:spec-script-paths
spec: ci-release
phase: pre-build
description: >
  Order 815-yace. Every `scripts/...` path an active spec names must resolve,
  be marked absent on purpose (`spec-path-absent: ok (<reason>)`), or sit in
  the named burndown baseline. The fixture refuses a seeded missing path by
  name and refuses the pre-fix project-summarizers spec, naming all six
  summarizer paths it required under a directory that never existed.
severity: medium
size: instant

preconditions:
  - workspace contains scripts/lua/test-spec-script-paths.lua and the plan binary (resolve_plan_binary)

critical_path:
  - step: "fixture and decider are present"
    command: "test -f scripts/lua/test-spec-script-paths.lua && test -f scripts/lua/check-spec-script-paths.lua && echo 'ok: parse'"
    timeout_ms: 2000
    expected_behavior: "ok: parse"

  - step: "the spec-path check refuses unresolved paths by name and passes the live tree"
    command: "B=\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" && TILLANDSIAS_PLAN_BIN=\"$B\" \"$B\" script run scripts/lua/test-spec-script-paths.lua 2>&1"
    timeout_ms: 60000
    expected_behavior: "ok:spec-script-paths-fixture:6/6"

observability:
  traces:
    - "@trace spec:ci-release"
  expected_log: "ok:spec-script-paths-fixture:6/6"
  log_fields:
    spec: "ci-release"
    test: "spec-script-paths"
    artifact: "scripts/lua/check-spec-script-paths.lua"

rollback:
  on_failure: >
    A spec names a script the tree does not have: correct the spec, commit the
    script, or mark a deliberate negative. Never grow the baseline.
  command: "grep -c spec-path-absent openspec/specs/*/spec.md"
