# @trace spec:ci-release
# @trace order:2118-tpmy
#
# Operator 2026-11-20, landing-pipeline redesign P11: host-state reds were read
# as candidate reds and evicted innocent PRs. The landing queue now asks a host
# door (scripts/lua/land-queue-host-door.lua) before every candidate; a host
# problem is could-not-run:host:<cause> and nobody is evicted
# (scripts/lua/test-land-queue-eviction.lua ARM 34). This litmus forces each cause through
# the door's seams. Red before 2118-tpmy: there was no door.
name: litmus:land-queue-host-door-names-its-cause
spec: ci-release
phase: pre-build
description: The landing queue's host door answers ok on a healthy host and could-not-run:host:<cause> (exit 3) for each of disk-low, tmp-low, swap-low, sidecar-missing and stale-worktrees, forced through its own seams
severity: high
size: instant

preconditions:
  - the plan binary (resolve_plan_binary), git, df and uname; a scratch checkout under target/plan-scratch; no network, no podman

critical_path:
  - step: "a healthy host is ok; each forced cause is could-not-run:host:<cause> with exit 3; no-swap is not refused; prune clears stale-worktrees"
    command: "P=\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" && TILLANDSIAS_PLAN_BIN=\"$P\" \"$P\" script run scripts/lua/test-land-queue-host-door.lua 2>&1"
    timeout_ms: 120000
    success_pattern: "^ok:land-queue-host-door:[0-9]+ arms$"
    expected_behavior: "ok:land-queue-host-door:<n> arms"

observability:
  traces:
    - "@trace spec:ci-release"
  expected_log: "one arm per cause plus the healthy, no-swap, sidecar-skip and prune arms"
  log_fields:
    spec: "ci-release"
    test: "land-queue-host-door-names-its-cause"

rollback:
  on_failure: "read the FAIL lines; the door is scripts/lua/land-queue-host-door.lua and the queue calls it from scripts/land-queue.sh (HOST_DOOR)"
  command: "grep -n HOST_DOOR scripts/land-queue.sh"
