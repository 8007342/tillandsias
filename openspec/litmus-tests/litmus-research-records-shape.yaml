# @trace spec:research-records
# @trace order:1809-dwqf
name: litmus:research-records-shape
spec: research-records
phase: pre-build
size: instant
description: The shared research library validates (every record carries a claim, provenance with an archived link, and grades), the validator refuses a record without provenance, the index is generated, and the forge skills that find and cite research exist
severity: medium
# WHY THIS LITMUS EXISTS. Forge projects (ranitas, arabiya, ...) found good
# research and had nowhere durable to keep it; half the URLs they cited were
# unreachable a week later. A research record is only worth citing if its
# provenance chain is complete, so this suite pins the validator's refusal
# (arm 2 of the fixture executes a record with no sources: and expects
# exit 1) alongside the library's green.

preconditions:
  - workspace contains research/ and scripts/lua/
  - a tillandsias-plan with `script run` resolves through scripts/plan-binary-probe.sh

critical_path:
  - step: "the shared library validates: every record has claim, sources with archived links, authority, strength, dates"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/check-research-records.lua 2>&1"
    success_pattern: "^ok:research-records:records=[1-9]"
    timeout_ms: 60000

  - step: "the validator refuses a record without provenance (fixture arm 2 runs the real validator on a constructed record)"
    command: "bash -c '. scripts/plan-binary-probe.sh; b=\"$(resolve_plan_binary)\"; TILLANDSIAS_PLAN_BIN=\"$b\" \"$b\" script run scripts/lua/test-research-records.lua 2>&1'"
    success_pattern: "^ok:research-records-fixture"
    timeout_ms: 120000

  - step: "the index is generated, not hand-edited, and the template carries the owner trace and a Provenance section"
    command: "grep -F 'AUTO-GENERATED by `scripts/lua/check-research-records.lua --write-index`' research/INDEX.md && grep -F '@trace spec:research-records' research/TEMPLATE.md && grep -F '## Provenance' research/TEMPLATE.md"
    timeout_ms: 3000

  - step: "NEG-PROVENANCE negative control: the validator run on a directory holding a record with no sources: must FAIL (exit 1) and name the field — proves step 1's green is a measurement, not a vacuous pass"
    command: "bash -c 'mkdir -p target/plan-scratch; d=$(mktemp -d target/plan-scratch/rr-neg.XXXXXX); mkdir -p \"$d/x\"; printf -- \"---\\nid: x/y\\nclaim: c\\napplies_to: [a]\\nauthority: primary\\nstrength: established\\nsince: 2026-10-26\\nlast_verified: 2026-10-26\\nstatus: current\\norigin: project\\n---\\n## Provenance\\n\" > \"$d/x/y.md\"; . scripts/plan-binary-probe.sh; out=$(TILLANDSIAS_RESEARCH_DIR=\"$d\" \"$(resolve_plan_binary)\" script run scripts/lua/check-research-records.lua 2>&1); rc=$?; rm -rf \"$d\"; echo \"$out\" | tail -1; [ \"$rc\" = 1 ]'"
    success_pattern: "^violation:research-records:x/y\\.md:sources:missing-provenance"
    timeout_ms: 60000

  - step: "the forge skills exist and the start-a-new-project scaffold, run on an empty directory, creates the project's research/README.md (behaviour, not source text)"
    command: "bash -c 'test -f skills/find-research/SKILL.md && test -f skills/cite-research/SKILL.md && grep -q \"fine-tuning\" skills/cite-research/SKILL.md && d=$(mktemp -d \"${TMPDIR:-/tmp}/rr-scaffold.XXXXXX\") && bash skills/start-a-new-project/scaffold.sh --dir \"$d\" --name T --summary S --no-specs >/dev/null && test -f \"$d/research/README.md\" && grep -q \"research:\" \"$d/research/README.md\"; rc=$?; rm -rf \"$d\"; exit $rc'"
    timeout_ms: 10000

  - step: "the image ships the library beside the cheatsheets"
    command: "grep -F 'COPY research/ /opt/research/' images/default/Containerfile && grep -F 'TILLANDSIAS_RESEARCH=/opt/research' images/default/Containerfile"
    timeout_ms: 3000

observability:
  traces:
    - "@trace spec:research-records"
  expected_log: "Research library validates and the validator refuses a record without provenance"
  log_fields:
    spec: "research-records"
    test: "research-records-shape"

rollback:
  on_failure: "run the validator directly to see which record and field it names; re-read the named record's sources and fix or drop it"
  command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/check-research-records.lua"
