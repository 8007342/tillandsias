# @trace spec:git-mirror-service, order:1977-xpus
#
# MEASURED on yoga 2026-11-03: every warm mirror start printed every upstream
# branch as "[new branch]": the entrypoint ran `git remote remove origin` then
# `add`, and `remote remove` deletes the remote's tracking refs.
# Red before 1977-xpus: arm 1 sees refs/remotes/origin/main gone after the
# second start.
name: litmus:git-mirror-warm-start-keeps-tracking-refs
spec: git-mirror-service
phase: pre-build
description: A warm mirror start keeps refs/remotes/origin/*; a changed URL is set in place; a fresh repo gets origin with the tracking refspec
severity: medium
size: instant

preconditions:
  - the plan binary (resolve_plan_binary), bash, git; a scratch dir under target/plan-scratch; no network

critical_path:
  - step: "the real origin-setup block, run twice on one bare repo, keeps the tracking ref; a URL change and a fresh repo are configured"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-git-mirror-warm-start-keeps-tracking-refs.lua 2>&1"
    timeout_ms: 60000
    expected_behavior: "ok:git-mirror-warm-start-keeps-tracking-refs:4 arms"

observability:
  traces:
    - "@trace spec:git-mirror-service"
  expected_log: "four arms: premise, WARM, CHANGED, FRESH"
  log_fields:
    spec: "git-mirror-service"
    test: "git-mirror-warm-start-keeps-tracking-refs"

rollback:
  on_failure: "read the FAIL lines; the origin setup is the TILLANDSIAS_PROJECT_REMOTE_URL block in images/git/entrypoint.sh"
  command: "grep -n 'remote set-url origin\\|remote add origin\\|remote remove origin' images/git/entrypoint.sh"
