# @trace spec:methodology-accountability
# @trace order:756-hn3a, order:743-mgf3
#
# Pins the canonical agent-identity helper (order 756-hn3a). On 2026-08-15 a
# fresh-Windows forge (codex lane) minted lease id
# "forge--codex-20260815t162555z" — an EMPTY workstation component — because
# its prose claim recipe shelled out to a `hostname` executable the forge
# image does not ship, while HOSTNAME=forge-tillandsias and /etc/hostname
# were BOTH present in the same process. This test pins the POSITIVE path (a
# hostname-less environment still yields a complete stable id from
# environment-first sources) and the NEGATIVE path (with all identity sources
# absent the helper refuses loudly, with an EMPTY stdout, before any
# append-event could consume an incomplete id). Steps assert BEHAVIOR by
# running the helper hermetically (env -i, PATH pointed at nothing), never by
# pinning how its source is written.
name: litmus:agent-identity-canonical-source-shape
spec: methodology-accountability
phase: pre-build
description: >
  Pin scripts/agent-identity.sh: the composed id shape
  <platform>-<workstation>-<backend>-<utc-timestamp>, the hostname-less
  positive path (HOSTNAME / /etc/hostname resolved without any hostname
  executable), the all-sources-absent refusal grammar
  ^refused:agent-identity:empty-(explicit-id|platform|workstation|backend|timestamp)$
  with empty stdout and non-zero exit, the full hermetic fixture
  (scripts/test-agent-identity.sh, incl. the shared node-name probe alignment
  with mo-full-attest.sh per 743-mgf3), and the consumers' wiring
  (advance-work-from-plan claim recipe + the agent_identity_contract block).
severity: high
size: instant

preconditions:
  - workspace contains scripts/agent-identity.sh
  - workspace contains scripts/test-agent-identity.sh
  - workspace contains skills/advance-work-from-plan/SKILL.md
  - workspace contains methodology/distributed-work.yaml
  - shell utilities (bash, grep, mktemp) are available in PATH

critical_path:
  - step: "helper and fixture parse, are executable, and the helper is sourceable (defines the shared probe without side effects)"
    command: "bash -n scripts/agent-identity.sh && bash -n scripts/test-agent-identity.sh && test -x scripts/agent-identity.sh && test -x scripts/test-agent-identity.sh && bash -c 'source scripts/agent-identity.sh && declare -F tillandsias_agent_id tillandsias_node_name >/dev/null' && echo 'ok: helper-defined'"
    timeout_ms: 5000
    expected_behavior: "ok: helper-defined"

  - step: "all hermetic scenarios pass (breach-shape positives, refusal negatives, precedence, sanitize-once, shared-probe alignment)"
    command: "scripts/test-agent-identity.sh >/dev/null 2>&1 && echo 'ok: scenarios-pass' || { scripts/test-agent-identity.sh; exit 1; }"
    timeout_ms: 30000
    expected_behavior: "ok: scenarios-pass"

  - step: "POSITIVE PATH (the 756-hn3a breach shape): hostname absent from PATH but HOSTNAME present yields the COMPLETE stable id"
    command: "out=$(env -i PATH=/nonexistent-756 TILLANDSIAS_HOST_KIND=forge HOSTNAME=forge-tillandsias TILLANDSIAS_AGENT=codex \"$BASH\" scripts/agent-identity.sh id); rc=$?; [ \"$rc\" = 0 ] && printf '%s' \"$out\" | grep -qE '^forge-forge-tillandsias-codex-[0-9]{8}t[0-9]{6}z$' && echo 'ok: hostnameless-complete-id' || { echo \"FAIL: rc=$rc out=$out\"; exit 1; }"
    timeout_ms: 8000
    expected_behavior: "ok: hostnameless-complete-id"

  - step: "NEGATIVE CONTROL: with ALL identity sources absent the helper must FAIL — non-zero, empty stdout, exactly the anchored refusal verdict on stderr (a helper that quietly re-mints 'forge--codex-...' passes the positive step and must be caught here)"
    command: "o=$(mktemp); err=$(env -i PATH=/nonexistent-756 TILLANDSIAS_HOST_KIND=forge HOSTNAME= TILLANDSIAS_ETC_HOSTNAME=/nonexistent-756-etc TILLANDSIAS_AGENT=codex \"$BASH\" scripts/agent-identity.sh id 2>&1 >\"$o\"); rc=$?; stdout=$(cat \"$o\"); rm -f \"$o\"; [ \"$rc\" != 0 ] && [ -z \"$stdout\" ] && printf '%s' \"$err\" | grep -qE '^refused:agent-identity:empty-workstation$' && echo 'ok: refused-before-any-claim' || { echo \"FAIL: rc=$rc stdout=$stdout err=$err\"; exit 1; }"
    timeout_ms: 8000
    expected_behavior: "ok: refused-before-any-claim"

  - step: "consumers are wired: the advance-work-from-plan claim recipe calls the helper and the methodology contract block exists (wiring is real, not prose)"
    command: "grep -q 'agent-identity.sh id' skills/advance-work-from-plan/SKILL.md && grep -q 'agent_identity_contract' methodology/distributed-work.yaml && echo 'ok: consumers-wired'"
    timeout_ms: 3000
    expected_behavior: "ok: consumers-wired"

observability:
  traces:
    - "@trace spec:methodology-accountability"
    - "@trace order:756-hn3a"
  expected_log: "canonical agent-identity helper pinned (hostname-less positive path + all-sources-absent refusal + fixture + consumer wiring)"
  log_fields:
    spec: "methodology-accountability"
    test: "agent-identity-canonical-source-shape"
    artifact: "scripts/agent-identity.sh + scripts/test-agent-identity.sh + skills/advance-work-from-plan/SKILL.md + methodology/distributed-work.yaml"

rollback:
  on_failure: >
    The canonical agent-identity helper drifted. Restore
    scripts/agent-identity.sh producing
    <platform>-<workstation>-<backend>-<utc-timestamp> with precedence (1)
    TILLANDSIAS_AGENT_ID taken whole, else workstation from
    TILLANDSIAS_WORKSTATION -> HOSTNAME -> /etc/hostname -> the shared
    tillandsias_node_name probe (which scripts/mo-full-attest.sh host must
    keep sourcing — 743-mgf3), backend from argument -> TILLANDSIAS_AGENT,
    UTC timestamp from the printf time builtin; sanitize exactly once
    (lowercase, [^a-z0-9-] -> '-', collapse); and REFUSE non-zero with empty
    stdout and one stderr line matching
    ^refused:agent-identity:empty-(explicit-id|platform|workstation|backend|timestamp)$
    whenever a component resolves empty. Keep both scripts executable and the
    advance-work-from-plan recipe calling the helper.
  command: "scripts/test-agent-identity.sh; grep -n 'agent-identity.sh' skills/advance-work-from-plan/SKILL.md | head -5"
