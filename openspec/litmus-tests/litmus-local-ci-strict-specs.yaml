# @trace spec:ci-release
# @trace order:2220-yj8f
#
# local-ci.sh to Lua, slice 2: the --strict-all spec selection
# (get_all_active_specs, spec_in_list, normalize_spec_list) is
# scripts/lua/local-ci-strict-specs.lua. Red with a mutant that ignores the
# status field (arms 1-4) or that splits the ignore list on commas only (arm 2).
name: litmus:local-ci-strict-specs
spec: ci-release
phase: pre-build
description: local-ci's --strict-all selects every active spec in file order minus the ignore list, in any separator, and prints the list alone
severity: medium
size: instant

preconditions:
  - the plan binary (resolve_plan_binary); a fixture bindings file under target/plan-scratch; no network, no podman

critical_path:
  - step: "active specs only, in order; ignore list in colons, commas and whitespace; unknown names; empty result; no verdict on stdout"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-local-ci-strict-specs.lua 2>&1"
    timeout_ms: 60000
    expected_behavior: "ok:local-ci-strict-specs:5 arms"

observability:
  traces:
    - "@trace spec:ci-release"
  expected_log: "five arms"
  log_fields:
    spec: "ci-release"
    test: "local-ci-strict-specs"

rollback:
  on_failure: "read the FAIL lines; the selection is scripts/lua/local-ci-strict-specs.lua and its caller is the STRICT_ALL block of scripts/local-ci.sh"
  command: "grep -n '2220-yj8f' scripts/local-ci.sh scripts/lua/local-ci-strict-specs.lua"
