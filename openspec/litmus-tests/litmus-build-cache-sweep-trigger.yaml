# freshness: auditor=linux-yoga-20260825t0743z date=2026-08-25 verdict=updated scope=created — methodology.yaml's build_cache_hygiene rule ended "Implemented + litmus-pinned by the ledger packet build-cache-sweep-on-durable-hosts" while that packet (709-in2f) sat `ready` with no script, no marker and no litmus; this file makes the claim true
name: litmus:build-cache-sweep-trigger
spec: meta-orchestration
phase: pre-build
size: instant
severity: medium
description: >
  Pin the trigger logic of the durable-host build-cache sweep (order 709-in2f,
  methodology.yaml `build_cache_hygiene`). A full `cargo clean` forces a full
  rebuild next cycle, so the sweep must be RARE — which makes the trigger, not
  the sweeping, the thing worth pinning. Both directions are asserted, because
  a gate that always fires and a gate that never fires are equally useless and
  only one of them is loud.

  Every case runs against a hermetic throwaway directory through the script's
  own environment seams, so nothing here depends on how large this checkout's
  target/ happens to be today.

preconditions:
  - workspace contains scripts/check-build-cache-sweep.sh

critical_path:
  - step: "Req: the gate exists, is executable, and emits its pinned verdict grammar"
    command: "test -x scripts/check-build-cache-sweep.sh && scripts/check-build-cache-sweep.sh | grep -qE '^(ok:build-cache-sweep-not-due|due:build-cache-sweep):bytes=[0-9]+:gib=[0-9]+:marker=[^:]+:reason=[a-z0-9-]+$' && echo 'ok: grammar pinned'"
    expected_behavior: "ok: grammar pinned"
    timeout_ms: 30000

  - step: "NOT DUE: under the size threshold with a fresh marker is a no-op (exit 0)"
    # The steady state. If this ever goes red the fleet starts paying a full
    # rebuild every cycle, which is the failure the rarity rule exists to stop.
    command: "d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 1000 /dev/zero > \"$d/t/x\"; printf 'date=%s utc=x host=t action=cargo-clean:done\\n' \"$(date +%Y-%m-%d)\" > \"$d/c/m\"; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/m\" scripts/check-build-cache-sweep.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" -eq 0 ] && printf '%s' \"$out\" | grep -q '^ok:build-cache-sweep-not-due:' && echo 'ok: fresh and small is a no-op'"
    expected_behavior: "ok: fresh and small is a no-op"
    timeout_ms: 30000

  - step: "DUE by SIZE: over the threshold fires even when the marker is fresh"
    command: "d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 1000 /dev/zero > \"$d/t/x\"; printf 'date=%s utc=x host=t action=cargo-clean:done\\n' \"$(date +%Y-%m-%d)\" > \"$d/c/m\"; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/m\" TILLANDSIAS_BUILD_CACHE_MAX_GIB=0 scripts/check-build-cache-sweep.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" -ne 0 ] && printf '%s' \"$out\" | grep -q ':reason=over-size$' && echo 'ok: size wins over a fresh marker'"
    expected_behavior: "ok: size wins over a fresh marker"
    timeout_ms: 30000

  - step: "THE SIZE IS ACTUALLY MEASURED — not merely compared against a threshold"
    # This leg exists because its absence hid a dead mechanism for a full
    # release. The size step BELOW sets MAX_GIB=0, so `gib >= 0` holds whatever
    # `du` returned: it pins the COMPARISON and never the MEASUREMENT. The gate
    # used GNU-only `du -sb`, which BSD du refuses outright, so on macOS `bytes`
    # was ALWAYS 0 — a 14 GiB target/ reported `bytes=0:gib=0` — and the suite
    # went green on both a working and a broken host. Write a file of known
    # size and demand the count reflect it; this fails on BSD without `du -sk`.
    command: "d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 2097152 /dev/zero > \"$d/t/x\"; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/absent\" scripts/check-build-cache-sweep.sh); rm -rf \"$d\"; b=$(printf '%s' \"$out\" | sed -n 's/^[a-z:-]*:bytes=\\([0-9]*\\):.*$/\\1/p'); [ -n \"$b\" ] && [ \"$b\" -ge 1048576 ] && echo 'ok: the byte count tracks real content'"
    expected_behavior: "ok: the byte count tracks real content"
    timeout_ms: 30000

  - step: "DUE by AGE: a marker older than the window fires even when the cache is small"
    # The BSD arm comes FIRST and the GNU form is the fallback: `date -d` is
    # GNU-only and this step was written with it alone, so it had been RED on
    # every macOS run since it landed — unnoticed because the packet that
    # closed it reported 8/8 from a Linux host. A suite that can only pass on
    # one platform is not a fleet gate.
    command: "d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 1000 /dev/zero > \"$d/t/x\"; old=$(date -v-30d +%Y-%m-%d 2>/dev/null || date -d '30 days ago' +%Y-%m-%d); printf 'date=%s utc=x host=t action=cargo-clean:done\\n' \"$old\" > \"$d/c/m\"; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/m\" scripts/check-build-cache-sweep.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" -ne 0 ] && printf '%s' \"$out\" | grep -qE ':reason=stale-[0-9]+d$' && echo 'ok: staleness fires on its own'"
    expected_behavior: "ok: staleness fires on its own"
    timeout_ms: 30000

  - step: "A CORRUPT marker is DUE and says so — never a pass, and never blamed on absence"
    # The 801-qasc lesson applied here: an unreadable marker is indistinguishable
    # from a never-swept host, so it must fire. The reason must still name what
    # was found, or the reader goes looking for a file that is right there.
    command: "d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 1000 /dev/zero > \"$d/t/x\"; printf 'garbage\\n' > \"$d/c/m\"; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/m\" scripts/check-build-cache-sweep.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" -ne 0 ] && printf '%s' \"$out\" | grep -q ':marker=unreadable:reason=unreadable-marker$' && echo 'ok: corrupt marker is due and named'"
    expected_behavior: "ok: corrupt marker is due and named"
    timeout_ms: 30000

  - step: "NO MARKER under the threshold INITIALISES and is NOT due (906-qi89)"
    # A bookkeeping absence is not evidence of bloat. `no-marker` used to
    # prescribe `cargo clean` — measured on tlatoanis-macbook-air across three
    # cycles at 18 GiB against a 40 GiB trigger, a full rebuild for a marker
    # that had never been written. Initialising also closes a real gap: a
    # never-stamped marker has no age, so the 14-day trigger could never fire
    # for a host sitting just under the size threshold.
    command: "d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 1000 /dev/zero > \"$d/t/x\"; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/m\" scripts/check-build-cache-sweep.sh); rc=$?; wrote=no; [ -f \"$d/c/m\" ] && wrote=yes; body=$(cat \"$d/c/m\" 2>/dev/null); rm -rf \"$d\"; [ \"$rc\" -eq 0 ] && [ \"$wrote\" = yes ] && printf '%s' \"$out\" | grep -q ':reason=no-marker-initialised-under-threshold$' && printf '%s' \"$body\" | grep -q 'NO-SWEEP-PERFORMED' && echo 'ok: initialised, not swept, and the marker says so'"
    expected_behavior: "ok: initialised, not swept, and the marker says so"
    timeout_ms: 30000

  - step: "NEGATIVE CONTROL: no marker OVER the threshold is still due, and is NOT initialised"
    # Without this leg, "initialise on no-marker" could be implemented as
    # "always initialise", which would disable the size trigger and silently
    # start the staleness clock on a genuinely bloated host.
    command: "d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 1000 /dev/zero > \"$d/t/x\"; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/m\" TILLANDSIAS_BUILD_CACHE_MAX_GIB=0 scripts/check-build-cache-sweep.sh); rc=$?; wrote=no; [ -f \"$d/c/m\" ] && wrote=yes; rm -rf \"$d\"; [ \"$rc\" -ne 0 ] && [ \"$wrote\" = no ] && printf '%s' \"$out\" | grep -q ':reason=over-size$' && echo 'ok: bloat still fires and no clock was started'"
    expected_behavior: "ok: bloat still fires and no clock was started"
    timeout_ms: 30000

  - step: "THE STAMPED DATE IS UTC, and agrees with the marker's own utc= field (905-97xh)"
    # One line of one file used to name two different days: `date=` came from
    # local `date` and `utc=` from `date -u`. Measured on tlatoanis-macbook-air
    # at 2026-08-26T06:09:41Z (23:09 PDT on the 25th): date=2026-08-25
    # utc=2026-08-26T06:09:41Z. Asserted through TZ so this fails on a host
    # whose local date differs from UTC, rather than passing vacuously wherever
    # the two happen to agree.
    # THE STRAY FIRST INVOCATION HERE WROTE THE REAL PRODUCTION MARKER.
    # It ran `stamp` with NO TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER override, so
    # every litmus run stamped ~/.cache/tillandsias/.last-build-cache-sweep with
    # `host=t action=cargo-clean:done` — a sweep that never happened — resetting
    # the 14-day staleness trigger to 0. Measured on macuahuitl hours after it
    # landed: marker `host=t`, target/ at 37 GiB against a 40 GiB size trigger,
    # verdict `ok:...not-due:...reason=under-threshold-0d`. The sweep could not
    # fire by age, and the host reported green while carrying ~106 GB.
    # Removed; every invocation below is hermetic.
    command: "d=$(mktemp -d); TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/m\" TZ=Pacific/Kiritimati scripts/check-build-cache-sweep.sh stamp --host t --action 'cargo-clean:done' >/dev/null; md=$(sed -n 's/^date=\\([0-9-]*\\) .*/\\1/p' \"$d/m\"); mu=$(sed -n 's/.* utc=\\([0-9-]*\\)T.*/\\1/p' \"$d/m\"); rm -rf \"$d\"; [ -n \"$md\" ] && [ \"$md\" = \"$mu\" ] && [ \"$md\" = \"$(date -u +%Y-%m-%d)\" ] && echo 'ok: date= is UTC and matches utc='"
    expected_behavior: "ok: date= is UTC and matches utc="
    timeout_ms: 30000

  - step: "A LEGACY local-stamped marker one day ahead in UTC is fresh, not corrupt (905-97xh migration)"
    # The edge the UTC switch creates. A marker written by the OLD local-time
    # stamp on a UTC+14 host carries tomorrow's UTC date; naive subtraction
    # gives age=-1, which this script reports as unreadable-marker — a good
    # marker called corrupt and a full sweep prescribed for it.
    command: "d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 1000 /dev/zero > \"$d/t/x\"; ahead=$(date -u -v+1d +%Y-%m-%d 2>/dev/null || date -u -d '1 day' +%Y-%m-%d); printf 'date=%s utc=x host=legacy action=cargo-clean:done\\n' \"$ahead\" > \"$d/c/m\"; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/m\" scripts/check-build-cache-sweep.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" -eq 0 ] && printf '%s' \"$out\" | grep -q '^ok:build-cache-sweep-not-due:' && echo 'ok: legacy one-day-ahead marker is fresh'"
    expected_behavior: "ok: legacy one-day-ahead marker is fresh"
    timeout_ms: 30000

  - step: "NEGATIVE CONTROL: a marker far in the future is still refused"
    # The clamp above must cover exactly the one-day timezone case and no more.
    # Accepting an arbitrary future date would disable the staleness trigger
    # for any host with a badly wrong clock.
    command: "d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 1000 /dev/zero > \"$d/t/x\"; far=$(date -u -v+10d +%Y-%m-%d 2>/dev/null || date -u -d '10 days' +%Y-%m-%d); printf 'date=%s utc=x host=bad action=cargo-clean:done\\n' \"$far\" > \"$d/c/m\"; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/m\" scripts/check-build-cache-sweep.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" -ne 0 ] && printf '%s' \"$out\" | grep -q ':reason=unreadable-marker$' && echo 'ok: a far-future marker is still refused'"
    expected_behavior: "ok: a far-future marker is still refused"
    timeout_ms: 30000

  - step: "NEGATIVE CONTROL: this suite does not touch the REAL sweep marker"
    # The arm that would have caught the defect above, and the reason it is
    # worth its own step rather than a review habit: a fixture writing
    # production state fails SILENTLY and in the safe-looking direction — the
    # gate it disables goes green. Nothing in the suite's own results could
    # reveal it; it took an infrastructure audit reading the live marker.
    #
    # Snapshots the real marker (or its absence), runs every stamping scenario
    # in this file, and asserts the marker is byte-identical afterwards.
    command: "M=\"${XDG_CACHE_HOME:-$HOME/.cache}/tillandsias/.last-build-cache-sweep\"; before=$(cat \"$M\" 2>/dev/null || echo ABSENT); d=$(mktemp -d); mkdir -p \"$d/t\" \"$d/c\"; head -c 1000 /dev/zero > \"$d/t/x\"; TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/m\" scripts/check-build-cache-sweep.sh stamp --host t --action 'cargo-clean:done' >/dev/null 2>&1; TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/c/absent\" scripts/check-build-cache-sweep.sh >/dev/null 2>&1; after=$(cat \"$M\" 2>/dev/null || echo ABSENT); rm -rf \"$d\"; [ \"$before\" = \"$after\" ] && echo 'ok: real marker untouched' || echo \"FAIL: the suite mutated the production marker: [$before] -> [$after]\""
    expected_behavior: "ok: real marker untouched"
    timeout_ms: 30000

  - step: "An EPHEMERAL FORGE never sweeps — its target/ dies with the container"
    command: "out=$(TILLANDSIAS_HOST_KIND=forge scripts/check-build-cache-sweep.sh); rc=$?; [ \"$rc\" -eq 0 ] && [ \"$out\" = 'skip:forge-exempt' ] && echo 'ok: forge exempt'"
    expected_behavior: "ok: forge exempt"
    timeout_ms: 15000

  - step: "STAMP REFUSES without --action: a stamp that records no action is unfalsifiable"
    # Same rule as check-daily-maintenance.sh's --steps. A marker saying
    # "something happened" moves the unobservability up one level instead of
    # removing it.
    command: "d=$(mktemp -d); TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/m\" scripts/check-build-cache-sweep.sh stamp --host t >/dev/null 2>&1; rc=$?; present=no; [ -f \"$d/m\" ] && present=yes; rm -rf \"$d\"; [ \"$rc\" -eq 2 ] && [ \"$present\" = no ] && echo 'ok: actionless stamp refused and wrote nothing'"
    expected_behavior: "ok: actionless stamp refused and wrote nothing"
    timeout_ms: 15000

  - step: "ROUND TRIP: a stamped marker flips the verdict to not-due"
    # Without this the refusals above could be satisfied by a stamp that never
    # writes anything a later check can read.
    command: "d=$(mktemp -d); mkdir -p \"$d/t\"; head -c 1000 /dev/zero > \"$d/t/x\"; TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/m\" scripts/check-build-cache-sweep.sh stamp --host t --action 'cargo-clean:done' >/dev/null; out=$(TILLANDSIAS_BUILD_CACHE_DIR=\"$d/t\" TILLANDSIAS_BUILD_CACHE_SWEEP_MARKER=\"$d/m\" scripts/check-build-cache-sweep.sh); rc=$?; rm -rf \"$d\"; [ \"$rc\" -eq 0 ] && printf '%s' \"$out\" | grep -q '^ok:build-cache-sweep-not-due:' && echo 'ok: stamp round-trips'"
    expected_behavior: "ok: stamp round-trips"
    timeout_ms: 30000
