# @trace spec:git-mirror-service
name: litmus:git-mirror-unborn-head-repair
spec: git-mirror-service
phase: pre-build
size: instant
severity: high
description: >
  A bare mirror's HEAD must always name a real, cloneable head (unborn-HEAD
  defect, 2026-07-20). `git init --bare` leaves HEAD -> refs/heads/master; the
  seed fetch writes refs/heads/main + work branches but nothing repointed
  HEAD, and upstream had no master — so every `git clone` of the seeded mirror
  exited 0 with "remote HEAD refers to nonexistent ref" and an EMPTY working
  tree, which the order-452 guest assert escalated into a deterministic crash
  of EVERY clone-only forge launch. The git image now ships
  ensure-mirror-head (repair at init/seed/fast-forward, preferring the
  launcher-declared host branch via TILLANDSIAS_PROJECT_DEFAULT_BRANCH), and
  the launcher blocks on wait_for_git_mirror_ready before starting a forge.
  plan/issues/mirror-bare-repo-unborn-head-breaks-all-clones-2026-07-20.md
  Order 501 extends this HEAD-steering pin to the STICKY-HEAD hazard: the
  mirror's HEAD is set only volume-fresh, so a persisted volume can hand a
  fresh clone branch Y after the launch gate passed on branch X. Both forge
  arg builders now inject TILLANDSIAS_FORGE_SEED_BRANCH and lib-common.sh's
  clone_project_from_mirror COMMON TAIL (checkout_forge_seed_branch, run on
  every clone transport — repair B6) checks it out via a soft fallback chain
  (fetch -> switch if present -> loud warn + stay on HEAD, never a hard
  `clone -b`). plan/issues/git-branching-methodology-research-2026-07-28.md
preconditions:
  - workspace contains images/git/ensure-mirror-head.sh

critical_path:
  - step: "the repair helper ships in the git image and the entrypoint runs it"
    command: "test -x images/git/ensure-mirror-head.sh && grep -q 'ensure-mirror-head' images/git/Containerfile && grep -q 'ENSURE_HEAD=' images/git/entrypoint.sh && echo 'ok: repair-helper-wired'"
    timeout_ms: 5000
    expected_behavior: "ok: repair-helper-wired"

  - step: "the launcher passes the host branch and gates on mirror readiness"
    command: "grep -q 'TILLANDSIAS_PROJECT_DEFAULT_BRANCH' crates/tillandsias-headless/src/main.rs && grep -q 'wait_for_git_mirror_ready' crates/tillandsias-headless/src/main.rs && echo 'ok: launcher-branch-and-gate'"
    timeout_ms: 5000
    expected_behavior: "ok: launcher-branch-and-gate"

  - step: "offline fixture reproduces the empty-clone break and proves the repair (preferred branch + upstream-default fallback + unseeded no-op)"
    command: "scripts/test-git-mirror-unborn-head.sh >/dev/null && echo 'ok: unborn-head-fixture-pass'"
    timeout_ms: 30000
    expected_behavior: "ok: unborn-head-fixture-pass"

  - step: "both forge arg builders pin the launch-gated seed branch into the container env (order 501)"
    command: "grep -qF 'TILLANDSIAS_FORGE_SEED_BRANCH={seed}' crates/tillandsias-headless/src/main.rs && grep -qF '\"TILLANDSIAS_FORGE_SEED_BRANCH\", seed' crates/tillandsias-headless/src/main.rs && echo 'ok: seed-env-both-builders'"
    timeout_ms: 5000
    expected_behavior: "ok: seed-env-both-builders"

  - step: "lib-common.sh common tail carries the seed-branch fallback chain (fetch -> switch if present -> loud warn, never hard-fail)"
    command: "grep -q 'checkout_forge_seed_branch()' images/default/lib-common.sh && grep -q 'git fetch origin \"\\$seed\"' images/default/lib-common.sh && grep -q 'git switch \"\\$seed\"' images/default/lib-common.sh && grep -q 'refs/remotes/origin/\\${seed}' images/default/lib-common.sh && grep -q 'WARNING: launch-gated seed branch' images/default/lib-common.sh && echo 'ok: seed-fallback-chain'"
    timeout_ms: 5000
    expected_behavior: "ok: seed-fallback-chain"

  # Pins the PROPERTY this step names, not a total call count.
  #
  # The original assertion was `-eq 2` over every call site in the file. Order
  # 534 then gave the BIND-MOUNTED host checkout the same convergence tail —
  # correctly, since a bind-mounted tree can keep sticky-HEAD exactly like a
  # cloned one — and the count became 3, so a test whose stated subject is "BOTH
  # CLONE TRANSPORTS" failed because a THIRD, NON-CLONE path was fixed. A magic
  # number turns every legitimate new checkout path into a red build, which
  # trains agents to edit the number rather than read the property.
  #
  # So: assert each B6 marker is actually followed by the tail (that IS the
  # both-transports property), and assert the total never drops below them.
  # Adding a fourth path stays green; removing either clone transport's tail
  # turns red, which is the regression this exists to catch.
  - step: "the common tail runs on BOTH clone transports (filesystem + network) so no transport keeps sticky-HEAD (repair B6)"
    command: "b6=$(grep -A2 -F 'COMMON TAIL (order 501, B6)' images/default/lib-common.sh | grep -cE '^[[:space:]]+checkout_forge_seed_branch$'); all=$(grep -cE '^[[:space:]]+checkout_forge_seed_branch$' images/default/lib-common.sh); if [ \"$b6\" -eq 2 ] && [ \"$all\" -ge 2 ]; then echo 'ok: seed-tail-both-transports'; else echo \"b6_markers_with_tail=$b6 expected=2 total_call_sites=$all expected>=2\"; echo 'remedy: every clone transport must run checkout_forge_seed_branch under its COMMON TAIL (order 501, B6) marker'; fi"
    timeout_ms: 5000
    expected_behavior: "ok: seed-tail-both-transports"

  - step: "no clone uses a hard -b/--branch pin (a never-pushed seed or the 120s reconcile window would hard-fail the launch)"
    command: "! grep -E '^[^#]*git clone[^|]*( -b | --branch )' images/default/lib-common.sh && echo 'ok: no-hard-branch-clone'"
    timeout_ms: 5000
    expected_behavior: "ok: no-hard-branch-clone"

  - step: "forge gitconfig sets push.default=current so a bare push targets the seed (later lane) branch (order 501)"
    command: "grep -qF 'default = current' crates/tillandsias-headless/src/main.rs && echo 'ok: push-default-current'"
    timeout_ms: 5000
    expected_behavior: "ok: push-default-current"

observability:
  traces:
    - "@trace spec:git-mirror-service"
  expected_log: "ensure-mirror-head repairs unborn HEAD; clones check out a real branch"
  log_fields:
    spec: "git-mirror-service"
    test: "git-mirror-unborn-head-repair"

rollback:
  on_failure: >
    Do NOT weaken the order-452 guest assert (empty clones must stay loud) and
    do NOT hardcode a branch name in the image. HEAD resolution order is:
    launcher-declared host branch, upstream symref default, main, first local
    head — all inside images/git/ensure-mirror-head.sh, which is the single
    implementation the entrypoint and this fixture both run.
  command: "grep -n 'ensure_mirror_head' images/git/entrypoint.sh"
