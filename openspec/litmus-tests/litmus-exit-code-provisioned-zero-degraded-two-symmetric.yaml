# @trace spec:windows-native-tray, spec:macos-native-tray
# Cross-tray drift protection for the `--diagnose` exit-code contract.
#
# Both spec.md files declare the SAME invariant: --diagnose exits 0 (healthy),
# 2 (degraded), or 1 (hard failure). Support tooling on both platforms
# (scripts/tray-diagnose.{ps1,sh}, scripts/install-{windows.ps1,macos.sh}'s
# post-install sanity check) branches on the exit code as a tri-state and
# MUST see byte-identical semantics across OSes.
#
# Spec invariant declarations:
#   - windows-native-tray.invariant.diagnose-exit-codes (spec.md, commit
#     145ff3d2)
#   - macos-native-tray.invariant.diagnose-exit-codes (spec.md, commit
#     2bd4faaf slice 22)
#
# Both invariants are MEASURABLE via the identically-named unit test
# `exit_code_provisioned_zero_degraded_two` on each side:
#   - windows: crates/tillandsias-windows-tray/src/notify_icon.rs (commit
#     5908fc64)
#   - macos:   crates/tillandsias-macos-tray/src/diagnose.rs (slice 15a,
#     part of the slice 11/14/15 series)
#
# This litmus enforces the SYMMETRY between them at the source level — a
# refactor that drops or renames the exit-code test on one side without
# the other would silently desymmetrize the tri-state contract, breaking
# support tooling on the desymmetrized OS.
#
# Pattern matches macOS slices 27 + 28: each step's expected_behavior is a
# literal substring of the SECOND grep in the && chain (the pin-test fn
# name) so the runner's matcher (run-litmus-test.sh:466 case-insensitive
# fixed-string substring search) only PASSes when BOTH greps in the chain
# produce expected content.

name: litmus:exit-code-provisioned-zero-degraded-two-symmetric
spec: windows-native-tray
phase: pre-build
description: "Pin the cross-tray --diagnose exit-code contract (0/2/1) via the identically-named exit_code_provisioned_zero_degraded_two unit test on both sides."
severity: medium
size: instant

preconditions:
  - workspace contains crates/tillandsias-windows-tray/src/notify_icon.rs
  - workspace contains crates/tillandsias-macos-tray/src/diagnose.rs
  - workspace contains openspec/specs/windows-native-tray/spec.md
  - workspace contains openspec/specs/macos-native-tray/spec.md
  - shell utilities (grep) are available in PATH

critical_path:
  # Both trays must PIN their --diagnose exit-code contract in a unit test. The
  # test NAME is not the contract, and pinning it here made this suite red on
  # 2026-08-14 for the wrong reason: order 647-i98k legitimately renamed the
  # windows test to `exit_code_separates_healthy_converging_and_degraded` when
  # it added exit 3 for a converging VM. Assert that each side has an
  # exit-code pin test, and assert the CONTRACT separately below.
  - step: "windows-tray pins its diagnose exit-code contract in a test"
    command: "grep -qE 'fn exit_code_(provisioned_zero_degraded_two|separates_healthy_converging_and_degraded)' crates/tillandsias-windows-tray/src/notify_icon.rs && echo 'ok: windows exit-code pin present'"
    expected_behavior: "ok: windows exit-code pin present"
    timeout_ms: 3000

  - step: "macos-tray pins its diagnose exit-code contract in a test"
    command: "grep -qE 'fn exit_code_(provisioned_zero_degraded_two|separates_healthy_converging_and_degraded)' crates/tillandsias-macos-tray/src/diagnose.rs && echo 'ok: macos exit-code pin present'"
    expected_behavior: "ok: macos exit-code pin present"
    timeout_ms: 3000

  - step: "both trays separate CONVERGING (exit 3) from degraded"
    # PROMOTED FROM REPORT TO ENFORCEMENT (order 735-2g5i, 2026-08-14).
    #
    # This step used to only REPORT, and said so: windows separated converging
    # (exit 3, order 647-i98k) while macOS still collapsed it into degraded, and
    # enforcing that here "would turn one host's pending work into every host's
    # red gate, which the fleet cannot act on". macOS has now landed its half,
    # so that reason is spent and the suite can enforce the symmetry its name
    # claims.
    #
    # It also stopped counting the WORD "converging". A word count is satisfied
    # by a comment, so it could not tell an implementation from a mention of
    # one. Both halves of the contract are asserted instead: the exit-3 constant
    # each tray branches on, and the test that covers the converging case.
    #
    # The two trays reach the verdict from different facts — windows from the
    # phase the guest names over the control wire, macOS from whether a live
    # tray owns the VM singleton, because macOS has no AF_VSOCK and cannot ask
    # the guest from a separate process. The CONTRACT is what has to match here,
    # not the mechanism.
    command: "W=crates/tillandsias-windows-tray/src/notify_icon.rs; M=crates/tillandsias-macos-tray/src/diagnose.rs; if grep -qE 'DIAGNOSE_EXIT_CONVERGING: i32 = 3' \"$W\" && grep -qE 'DIAGNOSE_EXIT_CONVERGING: i32 = 3' \"$M\" && grep -qE 'fn exit_code_separates_healthy_converging_and_degraded' \"$W\" && grep -qE 'fn exit_code_separates_healthy_converging_and_degraded' \"$M\"; then echo 'ok: exit-3 converging parity reached'; else echo 'FAIL: exit-3 converging parity regressed'; fi"
    expected_behavior: "ok: exit-3 converging parity reached"
    timeout_ms: 3000

  - step: "windows spec declares the diagnose-exit-codes invariant"
    command: "grep -F 'diagnose-exit-codes' openspec/specs/windows-native-tray/spec.md"
    expected_behavior: "diagnose-exit-codes"
    timeout_ms: 3000

  - step: "macos spec declares the diagnose-exit-codes invariant"
    command: "grep -F 'diagnose-exit-codes' openspec/specs/macos-native-tray/spec.md"
    expected_behavior: "diagnose-exit-codes"
    timeout_ms: 3000
