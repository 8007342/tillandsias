# @trace spec:observatorium-dashboard
# freshness: auditor=forge-observatorium date=2026-10-18 verdict=updated scope=metrics-contract
name: litmus:observatorium-metrics-history
spec: observatorium-dashboard
phase: pre-build
status: active
description: Measured values, missing data, measurement epochs and the repository-held release history remain honest
severity: high
size: instant
preconditions:
  - Node.js 22 or newer and Git are available
critical_path:
  - step: "Exercise projection and canonical plan failure boundaries"
    command: "command -v node >/dev/null || { echo skip:observatorium-metrics-history:no-node; exit 0; }; node --test observatorium/metrics/metrics.test.mjs observatorium/metrics/evidence.test.mjs observatorium/scripts/build.test.mjs"
    timeout_ms: 5000
  - step: "the release cut appends a snapshot naming its tag (the durable history is the repository); negative control: a runbook without the snapshot line must FAIL"
    command: "set -u; T=target/litmus-observatorium; mkdir -p \"$T\"; K=skills/merge-to-main-and-release/SKILL.md; kept() { grep -qF \"scripts/run-litmus-test.sh --phase pre-build\" \"$1\" && grep -qF \"node scripts/build.mjs --release-snapshot\" \"$1\" && grep -qF 'grep -q \"\\\"release\\\":\\\"${new_tag}\\\"\"' \"$1\"; }; kept \"$K\" || { echo 'FAIL: the release cut no longer records a tagged snapshot'; rm -rf \"$T\"; exit 1; }; sed '/--release-snapshot/d' \"$K\" > \"$T/k.md\"; if kept \"$T/k.md\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: tagged release snapshot; seeded omission caught'"
    timeout_ms: 5000
    expected_behavior: "ok: tagged release snapshot"
observability:
  traces:
    - '@trace spec:observatorium-dashboard'
  expected_log: Node test runner reports zero failures and exits zero
  log_fields:
    spec: observatorium-dashboard
    test: observatorium-metrics-history
rollback:
  on_failure: Correct the collector, the pinned build or the release-cut snapshot; never replace missing measurements with zero
  command: git diff -- observatorium/metrics observatorium/scripts
