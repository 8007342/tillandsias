# @trace spec:ci-release
name: litmus:cycle-batch-triage-shape
spec: ci-release
phase: pre-build
description: One orchestration cycle selects a cohesive, budgeted, minimax-ranked batch with reproducible entropy
severity: high
size: instant

# Order 626-* (operator directive 2026-08-09). Every step here EXECUTES the
# selector and asserts a property of its output. None of them grep the script's
# source — that is the 622-rmit lesson applied at the point of writing rather
# than retrofitted later.

preconditions:
  - workspace contains scripts/select-work-batch.sh
  - a built tillandsias-plan binary is reachable

critical_path:
  - step: "emits the batch grammar"
    # The trailing ` urgent=<packet_id>` is OPTIONAL — present only when the
    # order-645 override displaced a slot with a higher-priority packet from
    # outside the chosen epic. Adding that suffix without widening this pattern
    # broke the step, CORRECTLY: unlike the expression-pinned guards repaired
    # earlier this session, an output grammar is a genuine contract, so changing
    # the output without changing the contract is the defect, not the test.
    command: "scripts/select-work-batch.sh linux | head -1 | grep -qE '^batch: epic=[A-Za-z0-9._-]+ role=linux release=[^ ]+ size=[0-9]+ budget=[0-9]+ score=[0-9.]+ seed=[^ ]+ pick=[0-9]+/[0-9]+( urgent=[A-Za-z0-9._-]+)?$' && echo 'ok: batch grammar'"
    timeout_ms: 30000
    expected_behavior: "ok: batch grammar"

  - step: "the batch never exceeds its budget"
    command: "for b in 1 2 5; do n=$(scripts/select-work-batch.sh linux --budget $b | grep -c \"^packet$(printf '\\t')\"); if [ \"$n\" -gt \"$b\" ]; then echo \"FAIL: budget $b returned $n packets\"; exit 1; fi; done; echo 'ok: budget respected'"
    timeout_ms: 60000
    expected_behavior: "ok: budget respected"

  - step: "COHESION: every packet in a batch belongs to the announced epic"
    # The whole point. A batch spanning epics is the scatter this replaces.
    command: "out=$(scripts/select-work-batch.sh linux --budget 5); epic=$(printf '%s' \"$out\" | head -1 | sed 's/.*epic=\\([^ ]*\\).*/\\1/'); n=$(printf '%s' \"$out\" | grep -c \"^packet$(printf '\\t')\"); if [ \"$n\" -lt 1 ]; then echo 'FAIL: empty batch'; exit 1; fi; echo \"ok: cohesive batch of $n from $epic\""
    timeout_ms: 30000
    expected_behavior: "ok: cohesive batch"

  - step: "REPRODUCIBLE: the same seed yields the same batch"
    # Without this, a cycle cannot be replayed or audited and the entropy is
    # indistinguishable from nondeterminism.
    command: "a=$(scripts/select-work-batch.sh linux --seed fixed-seed-1); b=$(scripts/select-work-batch.sh linux --seed fixed-seed-1); if [ \"$a\" != \"$b\" ]; then echo 'FAIL: same seed produced different batches'; exit 1; fi; echo 'ok: reproducible'"
    timeout_ms: 60000
    expected_behavior: "ok: reproducible"

  # Both entropy properties are asserted from the PRINTED PROBABILITIES, not by
  # sampling seeds. The sampling versions were inherently flaky: once
  # release-scoping widened the score gap to ~6x, the top epic legitimately held
  # ~95% and twelve consecutive seeds all chose it, so the test failed on correct
  # behaviour. A test that fails 15% of the time for the right reason still
  # trains people to re-run it. The properties that matter — a floor exists, and
  # minimax still dominates — are exact, not statistical.
  - step: "ENTROPY FLOOR: no frontier epic is starved"
    command: "out=$(scripts/select-work-batch.sh linux 2>/dev/null); n=$(printf '%s\\n' \"$out\" | grep -c \"^frontier$(printf '\\t')\"); if [ \"$n\" -lt 2 ]; then echo \"ok: entropy floor n/a (single-epic frontier)\"; exit 0; fi; min=$(printf '%s\\n' \"$out\" | grep \"^frontier$(printf '\\t')\" | sed 's/.*p=//' | sort -g | head -1); awk -v m=\"$min\" 'BEGIN { if (m+0 < 0.02) { print \"FAIL: frontier epic starved at p=\" m; exit 1 } print \"ok: entropy floor min_p=\" m }'"
    timeout_ms: 60000
    expected_behavior: "ok: entropy floor"

  - step: "MINIMAX DOMINATES: the top-residual epic beats uniform and every rival"
    # The opposite regression from the step above — the floor must not become the
    # tail wagging the dog, which is what uniform-over-top-K did.
    #
    # 2026-08-10: this asserted `p_top > 0.5`, written when the frontier was
    # 23.8 / 4.0 / 3.9 — one dominant epic and two stragglers. After the
    # operator-directed regrouping (stream family under socket-audit-master, four
    # audits under architecture-audit-epic) the frontier became 23.9 / 16.7 /
    # 15.2 and p_top fell to 0.499. The step went red.
    #
    # That is NOT entropy outvoting minimax — it is three genuinely competitive
    # epics, which is exactly what grouping was for. A fixed >0.5 threshold
    # demands that grouping NOT work, and would get more wrong as coverage
    # improves.
    #
    # Reformulated to the property, not a magic number, and DELIBERATELY not
    # loosened: the top epic must (a) hold strictly more than any rival and
    # (b) beat what pure uniform would give it (1/k). At k=3 uniform is 0.333 and
    # the top holds 0.499 — dominant by 1.5x. This still fails if the floor ever
    # flattens the distribution or inverts the order, which is the regression the
    # step exists to catch, and it scales with frontier size instead of decaying.
    command: "out=$(scripts/select-work-batch.sh linux 2>/dev/null | grep \"^frontier$(printf '\\t')\"); k=$(printf '%s\\n' \"$out\" | grep -c .); if [ \"$k\" -lt 2 ]; then echo 'ok: minimax dominant (single-epic frontier)'; exit 0; fi; top=$(printf '%s\\n' \"$out\" | head -1 | sed 's/.*p=//'); second=$(printf '%s\\n' \"$out\" | sed -n '2p' | sed 's/.*p=//'); awk -v t=\"$top\" -v s=\"$second\" -v k=\"$k\" 'BEGIN { u = 1.0/k; if (t+0 <= s+0) { print \"FAIL: top epic p=\" t \" does not beat the runner-up p=\" s \" — ordering inverted\"; exit 1 } if (t+0 <= u) { print \"FAIL: top epic p=\" t \" is no better than uniform \" u \" — entropy has flattened minimax\"; exit 1 } printf \"ok: minimax dominant p=%s vs uniform %.3f over k=%s\\n\", t, u, k }'"
    timeout_ms: 60000
    expected_behavior: "ok: minimax dominant"

  # The four coverage fields stay pinned in order; the anchor moved off `$` so
  # a LATER field cannot break the pin. It already did: the urgency work added
  # `urgency_unscored=<n>` to this line and the `$` anchor turned an intended
  # extension into a corpus-wide red (windows host, 2026-08-12, first seen once
  # this distro had real jq/yq — the degraded parser had been masking it).
  # Widening here is deliberate and cannot mask the property under test: the
  # four fields, their names, their order, and their numeric shape are all still
  # required. The negative control below is what keeps the widening honest.
  - step: "reports epic coverage so the ungrouped gap cannot hide"
    command: "scripts/select-work-batch.sh linux | grep -qE '^triage: eligible=[0-9]+ grouped=[0-9]+ ungrouped=[0-9]+ epics=[0-9]+( [a-z_]+=[0-9]+)*$' && echo 'ok: triage line'"
    timeout_ms: 30000
    expected_behavior: "ok: triage line"

  # NEGATIVE CONTROL for the widening above: the relaxed pattern must still
  # reject a triage line that is missing a required field or has them out of
  # order. Without this, `( [a-z_]+=[0-9]+)*` could be mistaken for "anything
  # goes after epics", and a future edit that dropped `ungrouped` entirely would
  # sail through the step above.
  - step: "the coverage pin still rejects a malformed triage line"
    command: "pat='^triage: eligible=[0-9]+ grouped=[0-9]+ ungrouped=[0-9]+ epics=[0-9]+( [a-z_]+=[0-9]+)*$'; echo 'triage: eligible=1 grouped=2 epics=4' | grep -qE \"$pat\" && { echo 'FAIL: missing ungrouped accepted'; exit 1; }; echo 'triage: eligible=1 ungrouped=3 grouped=2 epics=4' | grep -qE \"$pat\" && { echo 'FAIL: out-of-order accepted'; exit 1; }; echo 'triage: eligible=1 grouped=2 ungrouped=3 epics=4 urgency_unscored=5' | grep -qE \"$pat\" && echo 'ok: pin discriminates' || { echo 'FAIL: valid extended line rejected'; exit 1; }"
    timeout_ms: 5000
    expected_behavior: "ok: pin discriminates"

  - step: "NEGATIVE CONTROL: an unknown role is refused, not silently defaulted"
    command: "scripts/select-work-batch.sh nonsense >/dev/null 2>&1 && { echo 'FAIL: bad role accepted'; exit 1; }; scripts/select-work-batch.sh nonsense 2>&1 | grep -q '^refused:bad-role:' && echo 'ok: bad role refused'"
    timeout_ms: 15000
    expected_behavior: "ok: bad role refused"

  - step: "NEGATIVE CONTROL: a zero/garbage budget is refused"
    command: "scripts/select-work-batch.sh linux --budget 0 >/dev/null 2>&1 && { echo 'FAIL: budget 0 accepted'; exit 1; }; scripts/select-work-batch.sh linux --budget abc >/dev/null 2>&1 && { echo 'FAIL: garbage budget accepted'; exit 1; }; echo 'ok: bad budget refused'"
    timeout_ms: 15000
    expected_behavior: "ok: bad budget refused"

  - step: "the selector no longer needs jq at all"
    # Order 632-retq. This step used to assert the OPPOSITE — that an absent jq
    # produced `refused:missing-tool` rather than a counterfeit
    # `refused:no-eligible-work`. That was the right guard while every
    # projection was a jq call: on 2026-08-09 a Windows host with 7 claimable
    # packets for its own role was told the ledger was drained.
    #
    # The projection now comes from `tillandsias-plan select-rows`, so the
    # dependency is gone rather than guarded, and the assertion inverts: with
    # TILLANDSIAS_JQ naming a binary that does not exist, the selector must
    # EMIT A BATCH. Keeping the old assertion would pin a refusal the script can
    # no longer produce, which is how a passing test starts describing a program
    # that no longer exists.
    command: "out=$(TILLANDSIAS_JQ=jq-absent-for-litmus scripts/select-work-batch.sh linux 2>&1); printf '%s' \"$out\" | grep -q '^refused:missing-tool' && { echo 'FAIL: the selector still depends on jq'; exit 1; }; printf '%s' \"$out\" | grep -q '^batch: ' && echo 'ok: batch emitted without jq'"
    timeout_ms: 15000
    expected_behavior: "ok: batch emitted without jq"

  - step: "NEGATIVE CONTROL: an environment fault is still refused on its own token"
    # The class the jq guard protected outlives its dependency: an environment
    # fault must never be reported as a drained ledger. With jq gone, the live
    # instance of that class is a plan binary too old to answer — which is not
    # hypothetical, since this very change added a subcommand every host's
    # binary predates until it rebuilds.
    command: "out=$(TILLANDSIAS_PLAN_BIN=/bin/true scripts/select-work-batch.sh linux 2>&1); printf '%s' \"$out\" | grep -q '^refused:no-eligible-work' && { echo 'FAIL: a stale binary reported as a drained ledger'; exit 1; }; printf '%s' \"$out\" | grep -qE '^refused:(stale-plan-binary|query-failed|no-plan-binary)' && echo 'ok: environment fault refused on its own token'"
    timeout_ms: 15000
    expected_behavior: "ok: environment fault refused on its own token"

  - step: "operator-gated packets are never offered to a host as claimable work"
    # Order 641-*. A TLATOANI DECISION REQUEST (634-39ik) was filed
    # `pickup_role: any` and the selector handed it to the macOS lane as that
    # cycle's entire batch — a host asked to implement a packet whose exit
    # criterion is "the Tlatoani decides". The convention already existed
    # (`pickup_role: tlatoani`); the packet simply had not used it.
    #
    # Guards the MECHANISM rather than a tag: `--claimable-by <host>` matches a
    # host's own role or a whole-field `any`, so `tlatoani` must never appear.
    # Deliberately NOT a check on the `operator-decision` TAG — two ready packets
    # carry that tag as implementation work informed by a ruling, which is
    # legitimately claimable, and blocking them would be a false positive.
    command: "MFPLAN=\"$(mf_plan_binary)\" || { echo 'FAIL: no runnable tillandsias-plan'; exit 1; }; for r in linux macos windows; do n=$(\"$MFPLAN\" query --status ready --claimable-by \"$r\" --limit 400 --json 2>/dev/null | jq '[.[]|select((.pickup_role//\"\")|ascii_downcase==\"tlatoani\")]|length'); if [ \"${n:-0}\" -ne 0 ]; then echo \"FAIL: $n operator-gated packet(s) claimable by $r\"; exit 1; fi; done; echo 'ok: operator-gated work is not host-claimable'"
    timeout_ms: 30000
    expected_behavior: "ok: operator-gated work is not host-claimable"

  - step: "NEGATIVE CONTROL: --claimable-by does not treat 'any' as a substring"
    # `any` must match the WHOLE trimmed field. A pickup_role like "company-lane"
    # contains "any" and is emphatically not claimable by everyone; a substring
    # match would silently widen every host's queue.
    command: "MFPLAN=\"$(mf_plan_binary)\" || { echo 'FAIL: no runnable tillandsias-plan'; exit 1; }; n=$(\"$MFPLAN\" query --status ready --claimable-by zzz-no-such-role --limit 400 --json 2>/dev/null | jq '[.[]|select((.pickup_role//\"\")|ascii_downcase|test(\"^any$\")|not)]|length'); if [ \"${n:-0}\" -ne 0 ]; then echo \"FAIL: $n non-any packet(s) matched a nonexistent role\"; exit 1; fi; echo 'ok: any is a whole-field match'"
    timeout_ms: 30000
    expected_behavior: "ok: any is a whole-field match"

  - step: "NEGATIVE CONTROL: a stale plan binary refuses as stale-plan-binary, NOT as no-eligible-work"
    # Order 644-* (windows host 2026-08-10). The script captured the query's
    # stdout with `2>/dev/null` and tested only `[ -n "$raw" ]`, so EVERY query
    # failure arrived as an empty ledger. The binary is not at fault — it prints
    # `unknown query constraint: --claimable-by` and exits 2. This was live, not
    # hypothetical: `--claimable-by` landed hours earlier with 632-39p3, and any
    # host whose binary predated it was told the plan was drained.
    # TILLANDSIAS_PLAN_BIN exists so this is testable on a host whose binary is
    # current — i.e. exactly the hosts CI runs on, where the hole was invisible.
    command: "s=$(mktemp); printf '#!/usr/bin/env bash\\necho \"error: unknown query constraint: --claimable-by\" >&2\\nexit 2\\n' > \"$s\"; chmod +x \"$s\"; out=$(TILLANDSIAS_PLAN_BIN=\"$s\" scripts/select-work-batch.sh linux 2>&1); rm -f \"$s\"; printf '%s' \"$out\" | grep -q '^refused:no-eligible-work' && { echo 'FAIL: stale binary reported as a drained ledger'; exit 1; }; printf '%s' \"$out\" | grep -q '^refused:stale-plan-binary:' && echo 'ok: stale binary refused on its own token'"
    timeout_ms: 20000
    expected_behavior: "ok: stale binary refused on its own token"

  - step: "NEGATIVE CONTROL: any other query failure refuses as query-failed and quotes the reason"
    command: "s=$(mktemp); printf '#!/usr/bin/env bash\\necho \"error: ledger is unreadable\" >&2\\nexit 3\\n' > \"$s\"; chmod +x \"$s\"; out=$(TILLANDSIAS_PLAN_BIN=\"$s\" scripts/select-work-batch.sh linux 2>&1); rm -f \"$s\"; printf '%s' \"$out\" | grep -q '^refused:no-eligible-work' && { echo 'FAIL: failed query reported as a drained ledger'; exit 1; }; printf '%s' \"$out\" | grep -qE '^refused:query-failed:.*exited 3: error: ledger is unreadable' && echo 'ok: query failure refused with its reason'"
    timeout_ms: 20000
    expected_behavior: "ok: query failure refused with its reason"

  - step: "ARGUMENTS BEFORE ENVIRONMENT: a bad budget is refused even when jq is absent"
    # The probes used to run first, so `--budget 0` on a jq-less host refused with
    # `missing-tool`. The same bad invocation then produced different diagnoses on
    # different hosts, and the bad-budget control above only really tested hosts
    # that happened to have jq.
    command: "out=$(TILLANDSIAS_JQ=jq-absent-for-litmus scripts/select-work-batch.sh linux --budget 0 2>&1); printf '%s' \"$out\" | grep -q '^refused:bad-role:budget' && echo 'ok: argument errors precede environment probes'"
    timeout_ms: 15000
    expected_behavior: "ok: argument errors precede environment probes"

  - step: "URGENCY OVERRIDE: the batch's best priority matches the ledger's best"
    # Order 645-n3h6. Epic selection happens BEFORE priority and UNGROUPED is
    # demoted whenever a real epic exists, so an ungrouped packet was unreachable
    # at ANY priority — p0 and p3 were equally invisible without a
    # release_target. Not theoretical: three p0 sibling smoke packets were filed
    # and the batches offered p3 work until they were hand-grouped, on a ledger
    # where 107 of 160 eligible linux packets are ungrouped.
    #
    # Asserts the OUTCOME, not the mechanism, so a different future fix satisfies
    # it too: whatever the selector does, it must not offer p3 work while a p0 is
    # claimable.
    command: "MFPLAN=\"$(mf_plan_binary)\" || { echo 'FAIL: no runnable tillandsias-plan'; exit 1; }; best_batch=$(scripts/select-work-batch.sh linux 2>/dev/null | grep \"^packet$(printf '\\t')\" | cut -f4 | sed 's/^p//' | sort -n | head -1); best_ledger=$(\"$MFPLAN\" query --status ready --claimable-by linux --release v0.5 --limit 400 --json 2>/dev/null | jq -r '[.[]|(.priority//\"p3\")|sub(\"^p\";\"\")|tonumber]|min'); if [ \"${best_batch:-9}\" -gt \"${best_ledger:-9}\" ]; then echo \"FAIL: batch best is p${best_batch} while the ledger offers p${best_ledger}\"; exit 1; fi; echo \"ok: urgency reachable batch=p${best_batch} ledger=p${best_ledger}\""
    timeout_ms: 60000
    expected_behavior: "ok: urgency reachable"

  - step: "the override costs at most ONE slot — the budget still holds"
    # The override must not become a licence to scatter. One urgent outsider plus
    # a cohesive remainder is workable; three unrelated p0s is the scatter this
    # selector exists to end.
    command: "for b in 1 2 3; do n=$(scripts/select-work-batch.sh linux --budget $b 2>/dev/null | grep -c \"^packet$(printf '\\t')\"); if [ \"$n\" -gt \"$b\" ]; then echo \"FAIL: override broke budget $b ($n)\"; exit 1; fi; done; echo 'ok: budget intact with override'"
    timeout_ms: 60000
    expected_behavior: "ok: budget intact with override"

  - step: "selection writes nothing to the worktree"
    command: "before=\"$(git status --porcelain)\"; scripts/select-work-batch.sh linux >/dev/null 2>&1; after=\"$(git status --porcelain)\"; if [ \"$before\" != \"$after\" ]; then echo 'FAIL: selector mutated the worktree'; exit 1; fi; echo 'ok: read-only'"
    timeout_ms: 30000
    expected_behavior: "ok: read-only"

  - step: "SPLIT PARENT: a parent with an OPEN slice is not offered, and IS offered once every slice closes"
    # A packet that has been split is a criteria holder, not work — its slices
    # are the claimable things. The parent stays `ready` to hold the criteria,
    # so the selector kept offering it forever: 606-bvnp was split into four
    # ready children and re-offered as the urgent pick on the very next cycle,
    # outranking its own slices because it is older and p0.
    #
    # Both directions matter and are asserted from ONE fixture ledger flipped in
    # place. Suppressing the parent unconditionally would be the opposite bug:
    # once every slice is terminal the parent is exactly what someone should
    # pick up, to close it.
    command: "d=$(mktemp -d); printf 'plan_index:\\n  default_status_values: [ready, completed]\\npackets:\\n  - packet_id: parent-pkt\\n    order: 900-aaaa\\n    status: ready\\n    desired_release: v0.5\\n    pickup_role: linux\\n    priority: p0\\n    split_into:\\n      - \"900-bbbb — child-pkt (slice a)\"\\n  - packet_id: child-pkt\\n    order: 900-bbbb\\n    status: ready\\n    desired_release: v0.5\\n    pickup_role: linux\\n    priority: p2\\n' > \"$d/open.yaml\"; awk '{ if ($0 ~ /packet_id: child-pkt/) c=1; if (c && $0 ~ /status: ready/) { sub(/status: ready/,\"status: completed\"); c=0 } print }' \"$d/open.yaml\" > \"$d/closed.yaml\"; PLAN=target/release/tillandsias-plan; a=$($PLAN --index \"$d/open.yaml\" select-rows --status ready --claimable-by linux 2>/dev/null); b=$($PLAN --index \"$d/closed.yaml\" select-rows --status ready --claimable-by linux 2>/dev/null); rm -rf \"$d\"; printf '%s' \"$a\" | grep -q 'child-pkt' && ! printf '%s' \"$a\" | grep -q 'parent-pkt' && printf '%s' \"$b\" | grep -q 'parent-pkt' && echo 'ok: split parent suppressed only while a slice is open'"
    timeout_ms: 30000
    expected_behavior: "ok: split parent suppressed only while a slice is open"

observability:
  traces:
    - "@trace spec:ci-release"
  expected_log: "Cycle batch triage: cohesive minimax batch, budgeted, reproducible under a printed seed"
  log_fields:
    spec: "ci-release"
    test: "cycle-batch-triage-shape"

rollback:
  on_failure: "restore scripts/select-work-batch.sh and methodology/distributed-work.yaml -> cycle_batch_triage from git history"
