# @trace spec:forge-environment-discoverability
name: litmus:groundtruth-no-mutable-status-pin-shape
spec: forge-environment-discoverability
phase: pre-build
description: The groundtruth status-pin guard refuses a case pinning status on a live non-terminal packet, admits a terminal pin, and passes the real corpus
severity: high
size: instant

# Order 680-zphp. Pins the guard that stops the mutable-status trap from being
# reintroduced (394d twice, 394e). Fixtures cite REAL packet ids so status
# resolves against the live ledger — 394 is ready (non-terminal, a trap) and
# 394a is completed (terminal, stable). Steps grep the guard's OUTPUT, and the
# test carries a negative control, so it complies with the expression-pinning
# enforcement (634-39ik).

preconditions:
  - a built tillandsias-plan binary is reachable at target/release/tillandsias-plan

critical_path:
  # ORDER 865-x2mf — THESE TWO CONTROLS OWN THEIR LEDGER NOW.
  #
  # They used to cite REAL packet ids (394 ready, 394a completed) and resolve
  # them against the live ledger. 394 was obsoleted on 2026-08-23, which is a
  # terminal status, so the pin became legitimate, the guard correctly admitted
  # it, and the negative control went red hunting a refusal it could no longer
  # earn. It stayed red for a day and blocked the release gate.
  #
  # The guard exists to enforce "never depend on a live packet's status"
  # (680-zphp) and its own test depended on a live packet's status. Choosing a
  # longer-lived packet would only postpone this: every live packet is mortal.
  # TILLANDSIAS_GROUNDTRUTH_LEDGER_ROOT lets each control supply a frozen
  # two-packet ledger it owns, so nothing in plan/ can ever move it again.
  - step: "NEGATIVE CONTROL: a case pinning status on a NON-TERMINAL packet is REFUSED"
    command: "D=$(mktemp -d); mkdir -p \"$D/plan\" \"$D/cases\"; printf 'plan_index:\\n  version: v1\\n  steps:\\n    - packet_id: hermetic-ready-packet\\n      order: 9001\\n      title: \"non-terminal, owned by this fixture\"\\n      status: ready\\n      desired_release: v0.5\\n' > \"$D/plan/index.yaml\"; printf 'cases:\\n  - query: x\\n    expect:\\n      citations_include:\\n        - path: plan/index.yaml\\n          packet_id: hermetic-ready-packet\\n          status: ready\\n' > \"$D/cases/case.yaml\"; if TILLANDSIAS_GROUNDTRUTH_LEDGER_ROOT=\"$D\" scripts/check-groundtruth-mutable-status-pins.sh \"$D/cases\" >/dev/null 2>&1; then echo 'FAIL: a non-terminal status pin was admitted'; rm -rf \"$D\"; exit 1; fi; rm -rf \"$D\"; echo 'ok: non-terminal status pin refused'"
    timeout_ms: 20000
    expected_behavior: "ok: non-terminal status pin refused"

  - step: "POSITIVE CONTROL: a case pinning status on a TERMINAL packet is admitted, and is actually CHECKED"
    # Asserts `1 live-checked`, not merely exit 0. A guard that silently checks
    # NOTHING also exits 0 — which is exactly how this pair failed while looking
    # fine: before 865-x2mf a relative binary path inside the lookup's subshell
    # made every status resolve empty, every pin skip as "unknown packet", and
    # the verdict read `0 live-checked`.
    command: "D=$(mktemp -d); mkdir -p \"$D/plan\" \"$D/cases\"; printf 'plan_index:\\n  version: v1\\n  steps:\\n    - packet_id: hermetic-done-packet\\n      order: 9002\\n      title: \"terminal, owned by this fixture\"\\n      status: completed\\n      desired_release: v0.5\\n' > \"$D/plan/index.yaml\"; printf 'cases:\\n  - query: x\\n    expect:\\n      citations_include:\\n        - path: plan/index.yaml\\n          packet_id: hermetic-done-packet\\n          status: completed\\n' > \"$D/cases/case.yaml\"; out=$(TILLANDSIAS_GROUNDTRUTH_LEDGER_ROOT=\"$D\" scripts/check-groundtruth-mutable-status-pins.sh \"$D/cases\" 2>/dev/null); rm -rf \"$D\"; printf '%s' \"$out\" | grep -q '^ok:groundtruth-status-pins:1 live-checked' && echo 'ok: terminal status pin admitted'"
    timeout_ms: 20000
    expected_behavior: "ok: terminal status pin admitted"

  - step: "the REAL groundtruth corpus is clean (no live non-terminal status pins)"
    command: "scripts/check-groundtruth-mutable-status-pins.sh | grep -qE '^ok:groundtruth-status-pins:[0-9]+ live-checked' && echo 'ok: real corpus clean'"
    timeout_ms: 20000
    expected_behavior: "ok: real corpus clean"

  - step: "the expert groundtruth harness itself grades green (the de-pin did not break it)"
    # Assert fail=0 and total==pass, NOT a hard-coded case count. The count was
    # pinned at 19; the query set grew to 20 and this step went red while the
    # harness was perfectly green (2026-08-14). A pin on the SIZE of the corpus
    # punishes adding coverage, which is the opposite of what this test wants.
    command: "MFPLAN=\"$(mf_plan_binary)\" || { echo 'FAIL: no runnable tillandsias-plan'; exit 1; }; g=$(\"$MFPLAN\" grade 2>/dev/null); t=$(printf '%s' \"$g\" | grep -o 'total=[0-9]*' | head -1 | cut -d= -f2); p=$(printf '%s' \"$g\" | grep -o 'pass=[0-9]*' | head -1 | cut -d= -f2); f=$(printf '%s' \"$g\" | grep -o 'fail=[0-9]*' | head -1 | cut -d= -f2); [ -n \"$t\" ] && [ \"$t\" -gt 0 ] && [ \"$f\" = 0 ] && [ \"$p\" = \"$t\" ] && echo 'ok: harness all cases pass'"
    timeout_ms: 30000
    expected_behavior: "ok: harness all cases pass"

observability:
  traces:
    - "@trace spec:forge-environment-discoverability"
  expected_log: "groundtruth status-pin guard: non-terminal pins refused, terminal pins admitted, real corpus clean, harness green"
  log_fields:
    spec: "forge-environment-discoverability"
    test: "groundtruth-no-mutable-status-pin-shape"

rollback:
  on_failure: "restore scripts/check-groundtruth-mutable-status-pins.sh and the rung1 de-pin from git history"
