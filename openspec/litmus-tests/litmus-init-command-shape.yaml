# @trace spec:init-command, spec:init-incremental-builds
name: litmus:init-command-shape
spec: init-command, init-incremental-builds
phase: pre-build
description: Pin the --init CLI surface and the image build order in the headless runtime
severity: medium
size: quick
backend: fake

preconditions:
  - cargo is available in PATH
  - grep is available in PATH (portable; formerly ripgrep, 702-eusw sibling portability fix)

critical_path:
  - step: "verify --init, --force, and --debug CLI flag registration"
    command: "grep -F ' let init = user_args.iter().any(|a| a == \"--init\");' crates/tillandsias-headless/src/main.rs && grep -F ' let force = user_args.iter().any(|a| a == \"--force\");' crates/tillandsias-headless/src/main.rs && grep -F ' let debug = user_args.iter().any(|a| a == \"--debug\");' crates/tillandsias-headless/src/main.rs"
    timeout_ms: 5000

  - step: "verify the help text matches the spec"
    command: "grep -F 'println!(\"       tillandsias --init [--force] [--debug]\");' crates/tillandsias-headless/src/main.rs"
    timeout_ms: 5000

  - step: "verify the ten images are defined in the canonical order (vault: order 253; forge-base: order 76)"
    command: "tr -d '[:space:]' < crates/tillandsias-headless/src/main.rs | grep -qF 'letimages=[\"proxy\",\"git\",\"vault\",\"inference\",\"router\",\"chromium-core\",\"chromium-framework\",\"forge-base\",\"forge\",\"web\",]' && echo 'ok: images array shape preserved'"
    timeout_ms: 5000

  # NEGATIVE CONTROL for the source-shape assertions above (634-39ik): prove the
  # checks discriminate a real regression from mere text drift — a corrupted
  # images-array order must NOT match. Without a negative control the grep -F
  # steps would be untestable source-text pins.
  - step: "negative control: a corrupted images-array order is rejected (the shape check discriminates)"
    command: "if tr -d '[:space:]' < crates/tillandsias-headless/src/main.rs | grep -qF 'letimages=[\"web\",\"forge\",\"forge-base\",'; then echo 'FAIL: reversed array matched'; exit 1; fi; echo 'ok: corrupted order rejected'"
    timeout_ms: 5000

  - step: "verify run_init uses PodmanClient for build orchestration"
    command: "grep -E 'fn run_init\\(debug: bool, force: bool\\)' -A 50 crates/tillandsias-headless/src/main.rs | grep -E 'PodmanClient::new\\(\\)'"
    timeout_ms: 5000

observability:
  traces:
    - "@trace spec:init-command"
    - "@trace spec:init-incremental-builds"
  expected_log: "Headless init command shape and image build order are pinned"
  log_fields:
    spec: "init-command,init-incremental-builds"
    test: "init-command-shape"
    backend: "fake"

rollback:
  on_failure: "inspect crates/tillandsias-headless/src/main.rs for changes to run_init or CLI flag handling"
