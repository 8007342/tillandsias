# @trace spec:accel-capability-probe, order:1874-b9tg (rebind to image-generation when that change is archived)
name: litmus:imagegen-image-is-first-use-and-placement-is-read-from-the-log
spec: accel-capability-probe
phase: pre-build
description: The imagegen image resolves to images/imagegen with a pinned sd.cpp master-<n>-<sha> tag and is not an init image; a run's placement is read from the device line and the VRAM params lines, never the auto-fit warning
severity: medium
size: long

preconditions:
  - workspace contains crates/tillandsias-headless and images/imagegen/Containerfile
  - cargo is available in PATH

critical_path:
  - step: "the resolver knows imagegen, its Containerfile pins ARG SDCPP_TAG=master-<n>-<sha>, and INIT_IMAGES excludes it"
    command: "cargo test -p tillandsias-headless --bin tillandsias tests::imagegen_resolves_with_a_pinned_sd_cpp_tag_and_is_not_an_init_image"
    timeout_ms: 900000
  - step: "measured CUDA, Vulkan/NVIDIA and radv logs place on the GPU (radv despite its auto-fit warning), CPU is CPU, and a partial fallback or a missing device line is not GPU"
    command: "cargo test -p tillandsias-headless --bin tillandsias imagegen_placement::tests"
    timeout_ms: 900000

observability:
  traces:
    - "@trace order:1874-b9tg"
  expected_log: "test result: ok"
  log_fields:
    spec: "accel-capability-probe"
    test: "imagegen-image-is-first-use-and-placement-is-read-from-the-log"

rollback:
  on_failure: "inspect images/imagegen/Containerfile and crates/tillandsias-headless/src/imagegen_placement.rs"
  command: "cat images/imagegen/Containerfile"
