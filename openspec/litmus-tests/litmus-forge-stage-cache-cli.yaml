# @trace spec:forge-environment-discoverability, order:2005-ccli
name: litmus:forge-stage-cache-cli
spec: forge-environment-discoverability
phase: pre-build
status: active
description: >
  Order 2005-ccli slice 1. tillandsias-cache put/get/stats/prune is a
  content-addressed per-project stage cache in the forge image. The fixture
  drives it against a second project that is neither tillandsias nor kumbia,
  a static site with a "thumbs" stage. It checks: the key is the sha256 of
  canonical JSON; a miss is exit 1, never a fake hit; non-canonical inputs and
  over-quota puts are refused by name; an interrupted put is not a hit; prune
  keeps referenced keys; no project cache refuses no_project_cache. The
  Containerfile installs the tool on PATH.
severity: medium
size: instant
preconditions:
  - workspace contains images/default/cli/tillandsias-cache
  - python3 is available in PATH
critical_path:
  - step: "Req: the stage cache keys by canonical inputs, refuses by name, and never reports an empty or partial result as success (pre-fix: no such tool)"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-tillandsias-cache.lua 2>&1"
    timeout_ms: 180000
    success_pattern: "ok:tillandsias-cache:15 arms"
  - step: "Install: the Containerfile copies tillandsias-cache into the CLI bin and links it onto PATH"
    command: "grep -Fq 'COPY cli/tillandsias-cache /opt/agents/tillandsias-cli/bin/tillandsias-cache' images/default/Containerfile && grep -Fq 'ln -sf /opt/agents/tillandsias-cli/bin/tillandsias-cache /usr/local/bin/tillandsias-cache' images/default/Containerfile && echo ok:stage-cache-installed"
    timeout_ms: 3000
    success_pattern: "ok:stage-cache-installed"
observability:
  traces:
    - "@trace order:2005-ccli"
  expected_log: "ok:tillandsias-cache:15 arms"
  log_fields:
    spec: "forge-environment-discoverability"
    test: "forge-stage-cache-cli"
rollback:
  on_failure: >
    The forge's stage cache answers a fake hit, keys non-canonically, or is
    missing from the image. Restore images/default/cli/tillandsias-cache and
    its COPY and symlink in images/default/Containerfile.
  command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-tillandsias-cache.lua"
