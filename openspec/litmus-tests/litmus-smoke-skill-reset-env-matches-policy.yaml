# @trace spec:command-policies
name: litmus:smoke-skill-reset-env-matches-policy
spec: command-policies
phase: pre-build
description: >
  Order 1462-qvxj. The two smoke skills prescribe, in one greppable line, the
  exact pair the consent engine honours (TILLANDSIAS_DESTRUCTIVE_RESET_OK=1 and
  TILLANDSIAS_SKILL=<the skill's own name>), and no longer say "unset or 1".
  The fixture extracts the pair from each skill's text and, on bare-metal
  evidence, checks that `policy eval` answers
  ok:policy:soft-reset:env-preauthorised (consent_source=env) and that the
  Bash-tool bridge allows the reset as prescribed and asks without the pair;
  hard reset stays a consent under both. In a forge the eval arms are a NAMED skip.
severity: high
size: instant

preconditions:
  - workspace contains scripts/test-smoke-skill-reset-env-matches-policy.sh

critical_path:
  - step: "fixture parses and is executable"
    command: "bash -n scripts/test-smoke-skill-reset-env-matches-policy.sh && test -x scripts/test-smoke-skill-reset-env-matches-policy.sh && echo 'ok: parse'"
    timeout_ms: 2000
    expected_behavior: "ok: parse"

  - step: "skill text, policy eval and the bridge agree on the smoke reset env"
    command: "bash scripts/test-smoke-skill-reset-env-matches-policy.sh 2>&1 | tail -n 1"
    timeout_ms: 60000
    expected_behavior: "PASS: smoke-skill-reset-env-matches-policy"

observability:
  traces:
    - "@trace spec:command-policies"
  expected_log: "PASS: smoke-skill-reset-env-matches-policy"
  log_fields:
    spec: "command-policies"
    test: "smoke-skill-reset-env-matches-policy"
    artifact: "skills/*smoke*/SKILL.md + crates/tillandsias-plan/src/bash_policy.rs (env arm)"

rollback:
  on_failure: >
    A skill that tells an agent to set an env the engine does not honour, or a
    bridge that disagrees with `policy eval`, is the defect: fix the text or
    route the bridge through command_policy::env_preauthorises, never the token arm.
  command: "bash scripts/test-smoke-skill-reset-env-matches-policy.sh"
