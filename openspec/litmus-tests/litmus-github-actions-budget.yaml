# @trace spec:ci-release
#
# CLOUD MINUTES ARE A HARD BUDGET. Operator directive 2026-08-02, issued after
# roughly 10% of a MONTHLY GitHub Actions quota was consumed in a single day:
# only the release may run in the cloud, because it signs binaries with
# GitHub-held secrets that exist nowhere else. Everything else runs locally.
# AMENDED by explicit operator request 2026-10-13 (1661-vckd): the isolated
# Observatorium deployment may run on main/release events. Generic CI remains
# forbidden; release.yml remains manual-only.
#
# WHY A LITMUS AND NOT JUST A RULE IN THE METHODOLOGY. The workflow that caused
# this was `ci.yml`, and its own header called it "intentionally cheap" — true
# per run, irrelevant in aggregate, because it fired on EVERY push to three
# branches plus every PR to main. A working day of agent pushes is dozens of
# runs. The defect was the TRIGGER, not the job, and no amount of making the job
# cheaper would have fixed it. A future agent adding "just a tiny check" on push
# would repeat it exactly, which is what this test exists to stop.
name: litmus:github-actions-budget
spec: ci-release
phase: pre-build
description: >
  Assert only the manual release and operator-authorized Observatorium
  deployment workflows exist. Keep platform-branch CI, PR CI and schedules
  forbidden; only the dashboard deployment may trigger on main push/releases.
severity: critical
size: instant

preconditions:
  - repository contains .github/
  - shell utilities (ls, grep, awk) available

critical_path:
  - step: "exactly the release and authorized dashboard deployment workflows exist"
    command: "n=$(ls .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | wc -l); f=$(ls .github/workflows/ 2>/dev/null | tr '\\n' ' '); if [ -f .github/workflows/release.yml ] && { { mf_assert_count \"$n\" 1 >/dev/null && [ -f observatorium/ci/observatorium.workflow ]; } || { mf_assert_count \"$n\" 2 >/dev/null && [ -f .github/workflows/observatorium.yml ]; }; }; then echo 'ok: sanctioned workflows'; else echo \"found $n workflow(s): $f — only release.yml and observatorium.yml may exist\"; fi"
    timeout_ms: 5000
    expected_behavior: "ok: sanctioned workflows"

  - step: "dashboard automatic pushes are confined to main, with no PR or timer triggers"
    command: "wf=.github/workflows/observatorium.yml; [ -f \"$wf\" ] || wf=observatorium/ci/observatorium.workflow; blk=$(awk '/^on:/{f=1;next} f && /^[a-z]/{f=0} f' \"$wf\"); if echo \"$blk\" | grep -qE '^[[:space:]]*(pull_request|pull_request_target|schedule|repository_dispatch):' || ! echo \"$blk\" | grep -Fq 'branches: [main]'; then echo 'dashboard trigger scope violates operator approval'; else echo 'ok: dashboard main only'; fi"
    timeout_ms: 5000
    expected_behavior: "ok: dashboard main only"

  - step: "release.yml is workflow_dispatch ONLY — no push, pull_request, or schedule"
    command: "blk=$(awk '/^on:/{f=1;next} f && /^[a-z]/{f=0} f' .github/workflows/release.yml); if echo \"$blk\" | grep -qE '^[[:space:]]*(push|pull_request|schedule|repository_dispatch):'; then echo \"release.yml has an automatic trigger: $(echo \"$blk\" | tr '\\n' ' ')\"; else echo 'ok: manual dispatch only'; fi"
    timeout_ms: 5000
    expected_behavior: "ok: manual dispatch only"

  - step: "no workflow anywhere declares a scheduled/cron job"
    command: "if grep -rlE '^[[:space:]]*(schedule|cron):' .github/workflows/ 2>/dev/null | grep -q .; then echo 'a scheduled workflow exists — it burns cloud minutes on a timer'; else echo 'ok: no scheduled jobs'; fi"
    timeout_ms: 5000
    expected_behavior: "ok: no scheduled jobs"

  - step: "the budget rule is recorded in the methodology, not only in this test"
    command: "grep -Fq 'github_actions_budget' methodology/ci.yaml && grep -Fq 'ONLY the actual release' methodology/ci.yaml && echo 'ok: rule recorded'"
    timeout_ms: 5000
    expected_behavior: "ok: rule recorded"

  - step: "the local-gate obligation that REPLACED push CI is stated"
    command: "grep -Fq 'agent_obligation' methodology/ci.yaml && grep -Fq 'build.sh --check' methodology/ci.yaml && echo 'ok: local obligation stated'"
    timeout_ms: 5000
    expected_behavior: "ok: local obligation stated"

  # ORDER 598-znuv: the loop skill every host runs must NAME the gate as a
  # Finalization obligation with the command, not merely an advisory. The
  # sed-scoped grep keeps this RED if the only mention is the --ci freshness
  # advisory further up the skill.
  - step: "the loop skill names the local gate in Finalization as an obligation with the command"
    command: "sed -n '/^## Finalization/,$p' skills/meta-orchestration/SKILL.md | grep -Fq './build.sh --check' && echo 'ok: loop skill names the gate'"
    timeout_ms: 5000
    expected_behavior: "ok: loop skill names the gate"

  - step: "AGENTS.md no longer cites push CI as a safety net"
    command: "if grep -Fq 'CI workflow will mark it red' AGENTS.md || grep -Fq 'the CI workflow will mark it red' AGENTS.md; then echo 'AGENTS.md still cites push CI as a safety net'; else echo 'ok: no push-CI claim'; fi"
    timeout_ms: 5000
    expected_behavior: "ok: no push-CI claim"

failure_modes:
  - "a platform/work/research push or pull_request trigger is added, so agent pushes burn cloud minutes again"
  - "a scheduled job is added, burning minutes on a timer with nobody watching"
  - "a workflow beyond the two explicitly sanctioned files appears"
  - "release.yml gains an automatic trigger and fires on pushes to main"
