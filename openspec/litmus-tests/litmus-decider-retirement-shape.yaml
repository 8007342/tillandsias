# @trace spec:ci-release
name: litmus:decider-retirement-shape
spec: ci-release
phase: pre-build
description: >
  Order 1443-xkwb. The three bash deciders (check-bash-dialect,
  check-sigpipe-verdict-pipelines-added, check-jq-callsite-ratchet) report
  `population=<n> bootstrap=<b>` on stderr with their stdout verdict unchanged;
  scripts/lua/check-decider-retirement.lua retires a decider when its population is
  only bootstrap shell (scripts/portability/bootstrap-shell-allowlist.txt, the
  design §6.5 table), keeps it live otherwise, and never retires one whose scan
  was empty. ADVISORY: it answers, it never reds a gate for a live decider.
severity: normal
size: instant

preconditions:
  - workspace contains scripts/lua/check-decider-retirement.lua
  - workspace contains scripts/lua/test-decider-retirement.lua
  - workspace contains scripts/portability/bootstrap-shell-allowlist.txt

critical_path:
  - step: "retirement decider and its fixture are present"
    command: "test -f scripts/lua/check-decider-retirement.lua && test -f scripts/lua/test-decider-retirement.lua && ! test -e scripts/check-decider-retirement.sh && echo 'ok: parse'"
    timeout_ms: 2000
    expected_behavior: "ok: parse"

  - step: "population lines, retire/live/blocked, and the allowlist (four arms, with the empty-tree negative control)"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-decider-retirement.lua 2>&1"
    timeout_ms: 120000
    expected_behavior: "ok:decider-retirement:"

observability:
  traces:
    - "@trace spec:ci-release"
  expected_log: "PASS: decider-retirement"
  log_fields:
    spec: "ci-release"
    test: "decider-retirement-shape"
    artifact: "scripts/lua/check-decider-retirement.lua + bootstrap-shell-allowlist.txt"

rollback:
  on_failure: >
    Keep each decider's stdout verdict line byte-identical; the population line
    belongs on stderr. Do not add a path to the allowlist to make a decider retire.
  command: "tillandsias-plan script run scripts/lua/check-decider-retirement.lua"
