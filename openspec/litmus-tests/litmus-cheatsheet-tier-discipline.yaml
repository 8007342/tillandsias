# @trace spec:cheatsheets-license-tiered
# freshness: auditor=linux-lenovinha-fable5-20260824t175323z date=2026-08-24 verdict=refreshed scope=full file, 1 step, EXECUTED (spec cheatsheets-license-tiered, PASS) and clean under scripts/scan-litmus-false-pass.sh. One step, and it is the RIGHT one: it RUNS the tier validator in strict mode rather than grepping for how the validator is written, so it survives a refactor and catches a behavioural regression — the opposite of the text-pin weakness recorded on several siblings this week.
# freshness-note: this completes the pair. Its sibling litmus:cheatsheets-license-allowlist-shape (audited 2026-08-24, same verdict) is deliberately grep-only and pins the FILE STRUCTURE of cheatsheets/license-allowlist.toml so a moved file or dropped field fires pre-build, BEFORE any validator invocation; this one exercises the validator end-to-end. Neither subsumes the other and the division of labour is the reason both exist — if either is ever trimmed, check the pair rather than the file.
name: litmus:cheatsheet-tier-discipline
spec: cheatsheets-license-tiered
phase: pre-build
description: Verify cheatsheet tier discipline stays valid under the tier validator
severity: medium
size: instant

preconditions:
  - workspace contains scripts/ and cheatsheets/
  - bash is available in PATH

critical_path:
  - step: "run the tier validator in strict mode"
    command: "bash scripts/check-cheatsheet-tiers.sh --strict"
    timeout_ms: 5000

observability:
  traces:
    - "@trace spec:cheatsheets-license-tiered"
  expected_log: "cheatsheet tier discipline validates without errors"
  log_fields:
    spec: "cheatsheets-license-tiered"
    test: "cheatsheet-tier-discipline"

rollback:
  on_failure: "inspect cheatsheets frontmatter and scripts/check-cheatsheet-tiers.sh for drift"
  command: "bash scripts/check-cheatsheet-tiers.sh --strict"
