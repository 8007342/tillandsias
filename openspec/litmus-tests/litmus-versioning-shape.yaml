# @trace spec:versioning
#
# Drift-protection for the workspace-versioning surfaces. spec:
# versioning mandates the `VERSION` file at repo root is the single
# source of truth, that Cargo derives its semver from the first 3
# components, that tags are immutable, and that the format is 4-part
# epoch-anchored `<years_since_epoch>.<month>.<day>.<build>` CalVer
# (operator ruling 2026-08-31; e.g. 56.8.31.3 for 2026-08-31 build 3).
#
# Single existing binding `litmus:ephemeral-guarantee` (e2e,
# last_verified 2026-05-15) covered generic isolation. The
# versioning machinery — VERSION file shape, build.rs ingestion,
# pre-push hook guard, bump-version script — was untrapped at
# source.
#
# Builds on 2026-05-30 host-shell + browser-mcp shared
# `CARGO_PKG_VERSION` → `WORKSPACE_VERSION` fixes (commits 76f93287,
# 76bb84a2) which made the spec-mandated single-source-of-truth
# actually fire in practice.
name: litmus:versioning-shape
spec: versioning
phase: pre-build
description: >
  Pin the versioning surfaces: VERSION file presence + 4-part
  epoch-anchored years.month.day.build CalVer shape, 3 build.rs files reading
  ../../VERSION + emitting WORKSPACE_VERSION, bump-version.sh +
  pre-push-version-guard.sh @trace markers.
severity: medium
size: instant

preconditions:
  - workspace contains VERSION at repo root
  - workspace contains crates/tillandsias-{host-shell,browser-mcp,windows-tray}/build.rs
  - workspace contains scripts/bump-version.sh
  - workspace contains scripts/hooks/pre-push-version-guard.sh
  - shell utilities (grep) are available in PATH

critical_path:
  - step: "Req: VERSION file exists at repo root with non-empty content"
    # Spec § "VERSION file as source of truth" Scenario "VERSION
    # file exists" mandates this. A regression deleting the file or
    # leaving it empty would silently break every downstream consumer.
    command: "[ -s VERSION ] && echo \"ok: VERSION file exists and is non-empty\""
    timeout_ms: 3000
    expected_behavior: "ok:"

  - step: "Req: VERSION file content is 4-segment dot-delimited"
    # Spec § "VERSION file is authoritative" mandates a valid 4-part
    # version. The format per bump-version.sh docblock:
    # `<years_since_epoch>.<month>.<day>.<build>`. ERE quantifiers `{6}` don't survive the
    # YAML→shell un-escape; use `tr | wc -c` to count dots = 3 (=
    # 4 segments).
    command: "DOTS=$(tr -cd '.' < VERSION | wc -c | tr -d ' '); if [ \"$DOTS\" = '3' ]; then echo \"ok: VERSION has 4 segments (3 dots)\"; else echo \"FAIL: VERSION has $DOTS dots, expected 3\"; exit 1; fi"
    timeout_ms: 3000
    expected_behavior: "ok:"

  - step: "Req: 3 build.rs files read ../../VERSION + emit WORKSPACE_VERSION"
    # The shared CARGO_PKG_VERSION → WORKSPACE_VERSION migration
    # (host-shell 76f93287 + browser-mcp 76bb84a2 + windows-tray's
    # earlier build.rs) made the VERSION file actually fire at
    # build time. Pin all 3 build.rs files together so a regression
    # dropping any silently reintroduces the crate-static fallback.
    command: "for f in crates/tillandsias-host-shell/build.rs crates/tillandsias-browser-mcp/build.rs crates/tillandsias-windows-tray/build.rs; do mf_literal \"$f\" '../../VERSION' || { echo \"FAIL: $f missing ../../VERSION read\"; exit 1; }; mf_literal \"$f\" 'WORKSPACE_VERSION' || { echo \"FAIL: $f missing WORKSPACE_VERSION emit\"; exit 1; }; done && echo \"ok: 3 build.rs files read VERSION + emit WORKSPACE_VERSION\""
    timeout_ms: 3000
    expected_behavior: "ok:"

  - step: "Req: 3 build.rs files emit rerun-if-changed=../../VERSION (rebuild on bump)"
    # The cargo rerun-if-changed directive is the rebuild-on-bump
    # invariant. A regression dropping it would silently leave the
    # baked-in WORKSPACE_VERSION stale across version bumps until a
    # clean build was triggered.
    command: "for f in crates/tillandsias-host-shell/build.rs crates/tillandsias-browser-mcp/build.rs crates/tillandsias-windows-tray/build.rs; do mf_literal \"$f\" 'cargo:rerun-if-changed=../../VERSION' || { echo \"FAIL: $f missing rerun-if-changed\"; exit 1; }; done && echo \"ok: 3 build.rs files rebuild on VERSION change\""
    timeout_ms: 3000
    expected_behavior: "ok:"

  - step: "Req: bump-version.sh entry point + @trace spec:versioning"
    # Spec § "Monotonic version increments" implies a bump mechanism.
    # `bump-version.sh` is the canonical entry. Pin both the @trace
    # marker AND the docblock scheme line so a regression to plain
    # semver — or a silent revert to the retired Major.Minor.YYMMDD
    # shape — surfaces fast. This step itself asserted the OLD shape
    # until the 2026-08-31 cutover's promotion gate caught it: the
    # drift-protection had drifted.
    command: "grep -F '@trace spec:versioning' scripts/bump-version.sh && grep -F '<years_since_epoch>.<month>.<day>.<build>' scripts/bump-version.sh"
    timeout_ms: 3000
    expected_behavior: "<years_since_epoch>.<month>.<day>.<build>"

  - step: "Req: pre-push-version-guard.sh hook present with @trace + branch guard"
    # Spec § "Immutable version tags" + "VERSION file authoritative"
    # together imply guardrails around VERSION-file modifications.
    # The pre-push hook is the implementation; pin its @trace +
    # the canonical only-allow-push-to-main message.
    command: "grep -F '@trace spec:versioning' scripts/hooks/pre-push-version-guard.sh && grep -F 'only allow push to main' scripts/hooks/pre-push-version-guard.sh"
    timeout_ms: 3000
    expected_behavior: "main"

  # The grep above pins the guard's TEXT; this pins its BEHAVIOUR in both
  # directions (order 643-64bx, 2026-08-13). A platform branch must be able to
  # push after the merge from origin/linux-next the pre-push gate requires, and
  # must still be refused when it invents a VERSION of its own — the release is
  # the linux host's to move. Case 2 of the fixture is that negative control.
  - step: "Req: the VERSION guard allows integration catch-up and still refuses a divergent bump"
    command: "bash scripts/test-pre-push-version-guard.sh"
    timeout_ms: 120000
    expected_behavior: "PASS: pre-push VERSION guard (4/4)"

  # The fixture above decides the guard's POLICY on small ranges. This one pins
  # that the guard still reaches a verdict at all on a LARGE one (order
  # 702-pwhc, measured on macOS 2026-08-13). The decision used to be
  # `git diff --name-only | grep -qx VERSION` under `set -o pipefail`: grep
  # exits on first match, git dies of SIGPIPE and reports 141, pipefail promotes
  # that to the pipeline status, and the `if` read FALSE *because* the match was
  # found. The guard failed OPEN as a function of DIFF SIZE — a 64-file range
  # was refused correctly while a 445-file range sailed through with the same
  # VERSION divergence in it. Large cross-branch merges are the only way a
  # foreign VERSION arrives, so it stopped working exactly where it matters.
  # Kept as a SEPARATE fixture because the policy fixture's ranges are small
  # enough to pass against the broken guard, which is how this survived.
  - step: "Req: the VERSION guard reaches a verdict on a large diff (no SIGPIPE fail-open)"
    command: "bash scripts/test-pre-push-version-guard-sigpipe.sh"
    timeout_ms: 180000
    expected_behavior: "PASS: pre-push-version-guard 4/4"

  - step: "Req: build.sh never unconditionally instructs committing VERSION"
    # Order 643-64bx, partial reduction (windows host 2026-08-10). build.sh bumps
    # VERSION on every build-producing dispatch and used to say, unconditionally,
    # "Commit them with your change". On any branch except main the pre-push
    # VERSION guard then refuses that push, so the advice led to `--no-verify` —
    # disabling the only remaining gate in order to push the very file that gate
    # protects — or to a local-only commit the exit contract forbids.
    #
    # Structural, and deliberately so: the harmful form is an instruction that is
    # correct on one branch and wrong everywhere else, which no single-branch
    # behavioural run would catch. The assertion is that the commit advice is
    # reachable only under a branch test.
    command: "awk '/_bump_build_version\\(\\)/,/^}/' build.sh > /tmp/bumpfn.txt; grep -q 'Commit them with your change' /tmp/bumpfn.txt || { echo 'FAIL: commit advice missing entirely — did the function move?'; exit 1; }; grep -qE 'symbolic-ref|\\$branch|\"main\"' /tmp/bumpfn.txt || { echo 'FAIL: commit advice is not branch-aware'; exit 1; }; grep -q 'no-verify' /tmp/bumpfn.txt || { echo 'FAIL: no warning against the --no-verify exit'; exit 1; }; echo 'ok: VERSION advice is branch-aware'"
    timeout_ms: 15000
    expected_behavior: "ok: VERSION advice is branch-aware"

  - step: "Req: Cargo workspace.package block present (semver derivation source)"
    # Spec § "Cargo/Tauri semver derivation" mandates the
    # workspace.package block (or equivalent) is where Cargo's
    # 3-part semver lives. A regression removing it would silently
    # break the `edition.workspace = true` inheritance pattern
    # across the crates.
    command: "grep -F '[workspace.package]' Cargo.toml"
    timeout_ms: 3000
    expected_behavior: "workspace.package"

  - step: "Req: a below-tag VERSION refusal names the back-merge remedy, not just the violation (800-vk2p)"
    # BEHAVIOURAL, not a source grep: inject a tag far above any real release
    # (arg 1 overrides tag discovery; nothing is created or fetched) and assert
    # the refusal actually names the merge. Cutting a release makes every branch
    # still carrying the pre-release VERSION unpushable within seconds, and the
    # old text described a RELEASE to a reader who was pushing a plan fragment.
    # Every branch arm names `git merge origin/<something>`, including the
    # generic fallback, so the pin holds on any checkout. case-match, no pipes.
    command: "out=$(bash scripts/verify-version-monotonic.sh v99.9.991231.9 2>&1); rc=$?; case \"$out\" in *'git merge origin/'*) [ \"$rc\" -eq 1 ] && echo 'ok: refusal names the back-merge remedy';; *) echo \"FAIL: rc=$rc remedy absent\"; exit 1;; esac"
    timeout_ms: 15000
    expected_behavior: "ok: refusal names the back-merge remedy"

observability:
  traces:
    - "@trace spec:versioning"
  expected_log: "VERSION file + 4-part CalVer + 3 build.rs files + bump script + pre-push guard + Cargo workspace.package pinned"
  log_fields:
    spec: "versioning"
    test: "versioning-shape"
    artifact: "VERSION + crates/{host-shell,browser-mcp,windows-tray}/build.rs + scripts/{bump-version.sh,hooks/pre-push-version-guard.sh} + Cargo.toml"

rollback:
  on_failure: >
    A `spec:versioning` source surface drifted. Restore: non-empty
    `VERSION` file with epoch-anchored `<years_since_epoch>.<month>.
    <day>.<build>` CalVer (e.g. `56.8.31.3`); 3 `build.rs` files
    (host-shell + browser-mcp + windows-tray) each reading
    `../../VERSION` + emitting
    `WORKSPACE_VERSION` env var + `cargo:rerun-if-changed=../../
    VERSION`; `scripts/bump-version.sh` with `@trace spec:versioning`
    + the epoch-scheme docblock; `scripts/hooks/pre-push-
    version-guard.sh` with `@trace spec:versioning` + branch-guard
    message; `[workspace.package]` block in `Cargo.toml`.
  command: "ls -la VERSION && grep -nE 'WORKSPACE_VERSION|spec:versioning|workspace.package|VERSION_FILE' VERSION crates/tillandsias-host-shell/build.rs crates/tillandsias-browser-mcp/build.rs crates/tillandsias-windows-tray/build.rs scripts/bump-version.sh scripts/hooks/pre-push-version-guard.sh Cargo.toml 2>/dev/null | head -25"
