name: litmus:freshness-inventory-shape
spec: spec-traceability
description: >
  Pin the FRESHNESS rung-2 inventory report grammar (methodology.yaml
  component_freshness.freshness_record_grammar) and prove the 2026-07-15
  incident components carry first freshness stamps. The report is advisory;
  this litmus only asserts the grammar contract and the seed stamps.
severity: medium
size: instant
phase: pre-build

preconditions:
  - workspace contains scripts/freshness-inventory.sh
  - workspace contains scripts/run-litmus-test.sh

critical_path:
  - step: "Req: inventory script exists and is executable"
    command: "mf_file_exists scripts/freshness-inventory.sh && test -x scripts/freshness-inventory.sh && echo 'ok: freshness-inventory.sh present'"
    timeout_ms: 3000
    expected_behavior: "ok: freshness-inventory.sh present"

  - step: "Req: report emits the pinned header grammar"
    # IF THIS STEP GOES RED ON TIME, THE TREE GREW — IT IS NOT A SLOW HOST
    # (order 1038-d7vw, measured on lenovinha 2026-09-04). The 15s here is a
    # TREE-SIZE TRIPWIRE, not a host-power threshold, and reading it as the
    # latter is what cost this packet a cycle: the first move proposed was
    # raising the budget for a "mobile workstation", when macuahuitl ran the
    # same walk in 6.0s and pirria — the slowest box in the fleet, contended —
    # in 8.1s.
    #
    # The script used to hold two sets as newline-joined STRINGS and test
    # membership with `case "\n$SET\n" in *"\n$x\n"*`, which is
    # O(candidates x set_bytes). Cost therefore grew with the PRODUCT of tree
    # size and candidate count, so every host was walking toward this budget at
    # a rate set by the repo, not by its CPU. lenovinha crossed it first at
    # 18.3s (5248 tracked files); esmeraldinha was at 25s through Git Bash on
    # the same quadratic. Raising the budget would have bought only the months
    # until the next few hundred files landed.
    #
    # It was diagnosed from the user/sys split — 16.7s user against 1.7s sys,
    # which cannot be filesystem or container overhead — and fixed by making
    # both sets associative arrays. Measured here: 18.39s -> 0.83s, three runs
    # within 0.01s, with 1661 lines of report output byte-identical to the
    # pre-fix run. The budget was deliberately NOT touched.
    #
    # So if this step ever exceeds 15s again, the question is what grew or what
    # reintroduced a linear scan over a set — not whether the host deserves a
    # larger number.
    #
    # AND THE SECOND QUESTION IS WHICH FILESYSTEM IT RAN ON, not which host.
    # esme-windows measured a three-way within-host control on 2026-09-05 — one
    # machine, one CPU, one kernel, this same fixed script, in-tree each time,
    # 1658 output lines and 5288 tracked files IDENTICAL in all three arms:
    #
    #   Git Bash / MSYS over drvfs      13,841 ms
    #   inside the distro, /mnt/c (9p)  10,044 ms
    #   inside the distro, native ext4      725 ms
    #
    # 9p/drvfs is 13.9x on its own; the MSYS layer adds a further 38% and is
    # secondary. On ext4 that "floor-tier" N100 box runs this in 725ms against
    # lenovinha's 680ms — within 7% of a dual-GPU mobile workstation.
    #
    # THE TIER LABEL DOES NOT PREDICT THIS NUMBER; THE REGIME DOES. That is the
    # part worth carrying to other packets: attributing a measurement to a host's
    # hardware tier when its filesystem regime explains it nearly happened twice
    # here — once as an overlay hypothesis about lenovinha, once as "the floor
    # box is slow" about esmeraldinha. Both were wrong in the same direction.
    #
    # THE BUDGET IS THEREFORE STILL AN OPEN QUESTION and this comment does not
    # settle it (packet 1038-d7vw, macuahuitl's). One global number cannot serve
    # 0.7s and 13.8s honestly: set it for ext4 and every Windows host is
    # permanently red; set it for drvfs and it stops measuring anything on Linux.
    # A regime-named budget can select itself at runtime from `findmnt -no FSTYPE`
    # rather than being hand-assigned per host — which is what avoids the failure
    # both of us walked into from opposite ends, a budget set from whichever host
    # happened to file it.
    command: "scripts/freshness-inventory.sh >/tmp/freshness-report.txt 2>&1; grep -qE '^freshness-inventory: [0-9]+ components, [0-9]+ stamped, [0-9]+ unstamped$' /tmp/freshness-report.txt && grep -qE '^freshness-coverage: [0-9]+\\.[0-9]% \\([0-9]+/[0-9]+ delta=(unknown|[+-][0-9]+)\\)$' /tmp/freshness-report.txt && echo 'ok: header grammar pinned'"
    timeout_ms: 15000
    expected_behavior: "ok: header grammar pinned"

  - step: "TARGET TRUTH: the reported coverage target matches methodology.yaml (order 640-iujb)"
    # The operator ruled the coverage target is a DEFINED SUBSET, recorded in
    # methodology.yaml component_freshness.coverage_target.scope. If the report
    # and the methodology can disagree, the advisory is measuring against a
    # target nobody approved — which is the divergent implicit-100% failure the
    # ruling replaced. Assert they are the SAME value, not merely both present.
    command: "want=$(awk '/^    coverage_target:/{b=1;next} b&&/^    [a-z_]+:/{exit} b&&$1==\"scope:\"{print $2;exit}' methodology.yaml); got=$(scripts/freshness-inventory.sh | grep -oE '^freshness-target: scope=[^ ]+' | cut -d= -f2); [ -n \"$want\" ] && [ \"$want\" != 'unknown' ] && [ \"$want\" = \"$got\" ] && echo \"ok: reported target matches methodology ($got)\""
    timeout_ms: 60000
    expected_behavior: "ok: reported target matches methodology (defined-subset)"

  - step: "DENOMINATOR: generated trees are excluded from coverage (order 640-iujb)"
    # images/default/cheatsheets/ is regenerated from cheatsheets/ by
    # scripts/stage-image-cheatsheets.sh. Auditing the copy asks a question
    # already answered by auditing the source, and it inflated the denominator
    # by ~233 components. If this count returns to zero, the exclusion was lost.
    command: "out=$(scripts/freshness-inventory.sh); n=$(printf '%s' \"$out\" | grep -oE '^freshness-target: .*excluded=[0-9]+' | grep -oE '[0-9]+$'); printf '%s' \"$out\" | grep -q '^freshness-unstamped: images/default/cheatsheets/' && { echo 'FAIL: generated cheatsheet copy still counted'; exit 1; }; [ \"${n:-0}\" -gt 0 ] && echo 'ok: generated components excluded from denominator'"
    timeout_ms: 60000
    expected_behavior: "ok: generated components excluded from denominator"

  - step: "DENOMINATOR: untracked files are not components (order 730-j26z)"
    # The audit queue offered images/default/skills/multihost-orchestration/SKILL.md
    # as its next target — one of 13 files in a gitignored staging tree that a
    # script copies from the canonical skills/, several of which already DIFFER
    # from their source. Auditing a stale copy for "is this still sound?"
    # answers a question about the copier. Trackedness is the property; the
    # prefix list only catches derived trees someone remembered to name.
    command: "out=$(scripts/freshness-inventory.sh); bad=0; while read -r f; do [ -n \"$f\" ] || continue; git ls-files --error-unmatch \"$f\" >/dev/null 2>&1 || bad=$((bad+1)); done <<< \"$(printf '%s' \"$out\" | grep -E '^freshness-(unstamped|stamp): ' | sed -E 's/^freshness-(unstamped|stamp): //; s/ .*//')\"; [ \"$bad\" -eq 0 ] && echo 'ok: every component is git-tracked'"
    timeout_ms: 120000
    expected_behavior: "ok: every component is git-tracked"

  - step: "DENOMINATOR: the ruled-in trees are actually enumerated (order 720-bmm9)"
    # methodology.yaml names "executable/source code ... and specs
    # (openspec/specs)" as in-scope, and for months the inventory enumerated
    # neither — so coverage was reported against a denominator narrower than the
    # ruled subset while looking authoritative. The exclusion guard above stops
    # the denominator growing wrong; this stops it silently shrinking. Both
    # trees must contribute components.
    command: "out=$(scripts/freshness-inventory.sh); rs=$(printf '%s' \"$out\" | grep -cE '^freshness-(unstamped|stamp): crates/'); sp=$(printf '%s' \"$out\" | grep -cE '^freshness-(unstamped|stamp): openspec/specs/'); [ \"$rs\" -gt 0 ] && [ \"$sp\" -gt 0 ] && echo 'ok: source and spec trees in the denominator'"
    timeout_ms: 60000
    expected_behavior: "ok: source and spec trees in the denominator"

  - step: "SCOPE CHANGE IS NOT DECAY: a denominator move is reported separately (order 720-bmm9)"
    # Widening the subset dropped coverage from 1.3% to 1.0% without losing a
    # single stamp. Without a denominator delta that reads as regression, and
    # the honest reading — the target got bigger — is unavailable to anyone
    # looking at the report alone.
    command: "mf_stage prod 0 OUT -- scripts/freshness-inventory.sh && mf_holds_ere OUT '^freshness-target: scope=[^ ]+ excluded=[0-9]+ denominator_delta=(unknown|[+-][0-9]+) source=methodology.yaml$' && echo 'ok: denominator delta reported'"
    timeout_ms: 60000
    expected_behavior: "ok: denominator delta reported"

  - step: "Req: local CI ranks stale audit candidates by numeric age"
    command: "sample=$(printf '%s\\n' 'freshness-stale: z.sh 3 days' 'freshness-stale: a.sh 20 days'); first=$(printf '%s\\n' \"$sample\" | sort -t' ' -k3,3nr | head -1); grep -Fq \"sort -t' ' -k3,3nr\" scripts/local-ci.sh && [ \"$first\" = 'freshness-stale: a.sh 20 days' ] && echo 'ok: advisory ranks by age'"
    timeout_ms: 3000
    expected_behavior: "ok: advisory ranks by age"

  - step: "Req: incident component stamps present (run-litmus-test.sh, tls-test-server.c, environment-isolation)"
    command: "grep -qE '^#? freshness: auditor=.* date=.* verdict=(refreshed|updated|obsoleted) scope=.*' scripts/run-litmus-test.sh && grep -qE '^// freshness: auditor=.* date=.* verdict=(refreshed|updated|obsoleted) scope=.*' scripts/tls-test-server.c && grep -qE '^# freshness: auditor=.* date=.* verdict=(refreshed|updated|obsoleted) scope=.*' openspec/litmus-tests/litmus-environment-isolation.yaml && echo 'ok: 2026-07-15 incident components stamped'"
    timeout_ms: 3000
    expected_behavior: "ok: 2026-07-15 incident components stamped"

  - step: "Req: the report names the next audit target"
    command: "mf_stage prod 0 OUT -- scripts/freshness-inventory.sh && mf_holds_ere OUT '^freshness-next: [^ ]+ source=(unstamped|stale) seed=[^ ]+$' && echo 'ok: next-target grammar'"
    timeout_ms: 60000
    expected_behavior: "ok: next-target grammar"

  - step: "ANTI-STARVATION: below full coverage the next target is an UNSTAMPED component"
    # Order 636-* (windows host 2026-08-09). This is the regression guard for a
    # closed loop, not a style preference. `freshness-stale:` is only emitted for
    # files that already carry a stamp, so an audit queue fed from staleness can
    # only ever re-offer the files it has already audited. Measured: 969
    # components / 8 stamped / 0% on 2026-07-31, and 1021 / 8 / 0% on 2026-08-09
    # — nine days, +52 components, +0 stamps. The class was not slow, it was
    # closed. If this step ever fails while coverage is under 100%, the path from
    # "never audited" to "audited" has been severed again.
    command: "out=$(scripts/freshness-inventory.sh); pct=$(printf '%s' \"$out\" | grep '^freshness-coverage:' | grep -oE '[0-9]+\\.[0-9]' | head -1 | cut -d. -f1); [ \"${pct:-0}\" -ge 100 ] && { echo 'ok: coverage complete, stale fallback correct'; exit 0; }; printf '%s' \"$out\" | grep -qE '^freshness-next: .* source=unstamped ' && echo 'ok: unstamped component reachable'"
    timeout_ms: 60000
    expected_behavior: "ok: unstamped component reachable"

  - step: "CLASSIFICATION TRUTH: threshold, boundary, malformed, and clock-skew fixtures classify correctly (606-vaua)"
    command: "scripts/freshness-inventory.sh --self-test"
    success_pattern: "freshness-selftest: PASS"
    timeout_ms: 30000

  - step: "REPRODUCIBLE: a fixed seed selects the same next target"
    command: "a=$(FRESHNESS_SEED=litmus-fixed scripts/freshness-inventory.sh | grep '^freshness-next:'); b=$(FRESHNESS_SEED=litmus-fixed scripts/freshness-inventory.sh | grep '^freshness-next:'); [ -n \"$a\" ] && [ \"$a\" = \"$b\" ] && echo 'ok: next target reproducible'"
    timeout_ms: 120000
    expected_behavior: "ok: next target reproducible"

observability:
  traces:
    - "@trace spec:spec-traceability"
  expected_log: "freshness inventory report grammar + incident seed stamps intact"
  log_fields:
    spec: "spec-traceability"
    test: "litmus-freshness-inventory-shape"
    artifact: "scripts/freshness-inventory.sh + freshness stamps"

rollback:
  on_failure: "inspect scripts/freshness-inventory.sh output grammar and the # freshness: record lines in the three incident components"
  command: "scripts/freshness-inventory.sh | head -5"
