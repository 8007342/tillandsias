# @trace spec:default-image, spec:fail-loud-diagnosis
name: litmus:opencode-render-probe-shape
spec: default-image
phase: pre-build
description: >-
  Pin the order-626-p4xd render contract. Every harness gate used to answer
  only "does the binary start and honour our flags?" — --version, flag greps,
  auth list — and none of them loaded the TUI renderer. A build whose
  interface could not initialize therefore passed every gate, was installed,
  and was RECORDED AS LAST-GOOD; the rollback path re-validated with the same
  blind probe, so it could restore and certify another broken snapshot. The
  user met the failure and the gate never did.

  The probe asserts POSITIVELY (the renderer must prove itself by emitting an
  alt-screen switch or a truecolor SGR) rather than matching an upstream error
  string, which would rot the moment upstream rewords it.
severity: high
size: instant
# inputs: see order 765-mza8.
inputs:
  - images/default/**
  - scripts/test-opencode-render-probe.sh

preconditions:
  - workspace contains images/default/lib-common.sh
  - workspace contains scripts/test-opencode-render-probe.sh

critical_path:
  - step: "BEHAVIOUR: the render contract refuses a non-rendering binary and accepts a rendering one"
    # The fixture carries its own controls: a stub that answers --version and
    # flag greps but never renders must FAIL, and a stub that emits the marker
    # must PASS. Without the second, the first would pass even if the probe
    # rejected everything.
    command: "scripts/test-opencode-render-probe.sh"
    timeout_ms: 120000
    success_pattern: "PASS: opencode render-probe fixture"
    failure_pattern: "FAIL:"

  - step: "Req: the gate is wired where every consumer reaches it"
    # Every prober of an opencode binary calls harness_probe (post-2026-08-31
    # that is _require_harness and harness_record_last_good; the three
    # curl-lane last-good consumers retired with that lane). Wiring the
    # contract inside harness_probe — rather than at one call site — is what
    # stops a broken binary being certified as last-good.
    command: "mf_stage prod 0 OUT -- awk '/^harness_probe\\(\\)/,/^}/' images/default/lib-common.sh && mf_holds OUT 'opencode_render_contract_cached' && echo 'ok: render contract inside harness_probe'"
    timeout_ms: 10000
    expected_behavior: "ok: render contract inside harness_probe"

  - step: "Req: the probe cannot self-update (litmus:harness-byte-cheap contract)"
    command: "mf_stage prod 0 OUT -- awk '/^opencode_render_contract_ok\\(\\)/,/^}/' images/default/lib-common.sh && mf_holds OUT 'DISABLE_AUTOUPDATER=1 DISABLE_UPDATES=1' && echo 'ok: update guards present'"
    timeout_ms: 10000
    expected_behavior: "ok: update guards present"

  - step: "Req: one opencode writer — the two-taker mutex retired with the second writer"
    # HISTORY: the mutex was one-sided (626-p4xd) — ensure_forge_harnesses
    # took it while require_opencode wrote the same binary foreground without
    # it — then two-sided (805-yzhw). On 2026-08-31 the opencode curl lane
    # retired entirely (operator ruling), which removed the SECOND WRITER:
    # the only remaining install site is _require_harness's only-when-missing
    # npm install, gated on the npm-update lock. Two takers of a shared lock
    # would now mean a second writer came back — pin the inverse.
    command: "! grep -q 'harness_update_lock_acquire' images/default/lib-common.sh && awk '/^_require_harness\\(\\)/,/^}/' images/default/lib-common.sh | grep -q 'npm-update.lock' && echo 'ok: single-writer, lock-waited'"
    timeout_ms: 10000
    expected_behavior: "ok: single-writer, lock-waited"

  # NO sibling-regression step here on purpose. litmus:harness-rollback-shape
  # and litmus:harness-byte-cheap already run those fixtures in this same
  # suite, so re-running them made this the slowest instant-tier step in the
  # corpus (20.3s, surfaced by the cycle timing telemetry the run itself
  # emitted). A gate that duplicates a sibling gate buys no coverage and is
  # paid on every pre-build.

observability:
  traces:
    - "@trace spec:default-image"
  expected_log: "opencode RENDER CONTRACT BROKEN — no TUI renderer output within the budget"
  log_fields:
    spec: "default-image"
    test: "opencode-render-probe-shape"
    artifact: "images/default/lib-common.sh"

rollback:
  on_failure: >
    The render gate drifted. harness_probe must call
    opencode_render_contract_cached so every prober (_require_harness,
    harness_record_last_good) inherits it, and the probe must keep its
    update guards. Do NOT reintroduce harness_update_lock_* or a second
    opencode writer — the curl lane and its two-taker mutex retired
    2026-08-31 (operator ruling): _require_harness is the ONLY install
    site, serialized on the npm-update lock, and step 4 of this fixture
    fails on any resurrection.
  command: "grep -n 'opencode_render_contract\\|npm-update.lock' images/default/lib-common.sh | head -12"
