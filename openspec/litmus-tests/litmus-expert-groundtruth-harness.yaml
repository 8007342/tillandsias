rollback:
  on_failure: >
    If GREEN AT HEAD failed, read the FAIL lines: each names the case, the
    expectation and the closest miss. Two causes are possible and they need
    opposite responses. (a) The CORPUS changed — a rule was rewritten, a packet
    changed status. Then the expected answer is stale: re-read the rule or the
    packet and update the quote IN THE SAME COMMIT as the change. Deleting the
    case to get green is a bar-lowering. (b) The ENGINE changed — then the
    engine is wrong until proven otherwise, and the experts are currently
    citing text that does not support their answers, which is worse than having
    no expert at all.
    If a SEEDED WRONG ANSWER step failed, the grader accepted a wrong expected
    answer and every green above it is meaningless — fix that before trusting
    any other result in this file.
    If an ANTI-VACUUM step failed, the harness can be made to pass while
    grading nothing.
    If the ORDER 456 MCP step failed, the compiled plan layer is right in the
    library and wrong at the tool boundary — which is exactly the shape of the
    dead-on-arrival regression order 456 shipped with.
    If the HARNESS BUDGET step failed, the grading gate no longer fits a forge
    cycle and will be skipped by the people it exists to protect.
  command: "PB=$(cat /tmp/.litmus-394d-bin 2>/dev/null || echo ./target/release/tillandsias-plan); \"$PB\" grade --root . ; \"$PB\" grade --list-engines"
