# @trace spec:forge-environment-discoverability
# freshness: auditor=linux-tlatoani-claude-20260807t013000z date=2026-08-07 verdict=updated scope=extended with 606-h9vy fragment-provenance grading, tamper-negative verify-answer, and corpus-freshness steps; full quick suite re-validated green on linux_immutable
# @trace order:394, order:394d (rung 1, slice 4)
# @trace order:456 (exit criterion 3 — correct packets for the active release)
# @trace order:606-e2hg (exact release + direct upstream query semantics)
# @trace plan/issues/experts-construction-decision-2026-07-17.md (the residual:
#        "per-tier measurements + ground-truth harness")
#
# THE REGRESSION THIS EXISTS TO PREVENT
#
# 394b and 394c each proved their own SHAPE: the envelope has the right keys,
# the citations resolve, a fabricated citation is refused. None of that proves
# the experts are RIGHT. An engine can emit a perfectly-shaped, perfectly
# verifiable envelope that answers the wrong question — and the shape litmuses
# would stay green while agents acted on wrong plan state and wrong methodology.
#
# So this test grades the experts against a COMMITTED GROUND TRUTH:
# openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml, a query set
# of real questions with the exact answers they must produce. `span_contains`
# cuts the cited line range out of the corpus AT GRADING TIME and requires the
# governing text to be inside it, so the failure mode that looks fine — real
# file, in-bounds range, wrong lines — is what goes red.
#
# A grading gate that cannot fail is worse than none: it converts "unmeasured"
# into "measured and fine". So half of the steps below EXIST TO MAKE IT FAIL —
# five seeded wrong expected answers, an empty query set, a misspelled
# expectation key, a duplicated case id, and the order-456 dead-on-arrival
# server — and each one must turn a step red.
#
# The four exit criteria of order 394d map to steps as:
#   (i)   under 60s in the forge      -> HARNESS BUDGET
#   (ii)  GREEN at HEAD               -> GREEN AT HEAD
#   (iii) a wrong expected answer     -> the five SEEDED WRONG ANSWER steps
#         turns it RED                   plus the three ANTI-VACUUM steps
#   (iv)  reusable verbatim by 457/400 -> REUSE steps (registry, plug-in point,
#                                        corpus-free grader, multi-set run)
# and order 456's remaining criterion is the MCP steps: the SERVER's envelope,
# not the library's, graded against the same committed ground truth.
name: litmus:expert-groundtruth-harness
spec: forge-environment-discoverability
phase: pre-build
description: >
  Grade the rung-1 experts (plan ledger + methodology L0) against the committed
  ground-truth query set, prove the grading gate runs inside the 60s in-forge
  budget, prove it goes RED on a wrong expected answer and on a wrong engine,
  prove it cannot be vacuously green, prove the query-set format is corpus-
  agnostic so orders 457 and 400 reuse it verbatim, and prove the forge-plan
  MCP SERVER returns the correct packets for the active release (order 456).
severity: critical
size: quick

preconditions:
  - workspace contains crates/tillandsias-plan/src/groundtruth.rs (the grader)
  - workspace contains openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml (the ground truth)
  - workspace contains plan/index.yaml, methodology.yaml and methodology/
  - workspace contains images/default/config-overlay/mcp/forge-plan.sh
  - cargo (or an installed tillandsias-plan), jq and sed are available in PATH

critical_path:
  # ── the binary under grade ───────────────────────────────────────────────
  - step: "resolve the harness binary — the CHECKOUT wins over any installed copy"
    # Deliberate precedence. In a forge, $HOME/.local/bin/tillandsias-plan is
    # installed at launch by lib-common.sh::ensure_forge_experts (order 394a)
    # and can be OLDER than the mounted checkout. A grading gate that graded a
    # stale binary would certify code that is not the code under review, so the
    # checkout build is tried first and the installed copy is only the fallback
    # for a container with no cargo.
    #
    # The `rm -f` is load-bearing, not tidiness: every later step reads these
    # files, so a stale copy from a previous run would let them all pass while
    # nothing at all executed.
    command: "rm -f /tmp/.litmus-394d-bin /tmp/.litmus-394d-*.yaml /tmp/.litmus-394d-*.json /tmp/.litmus-394d-*.txt; b=''; if cargo build -q --release -p tillandsias-plan 2>/dev/null; then b=\"$PWD/target/release/tillandsias-plan\"; else for c in \"$HOME/.local/bin/tillandsias-plan\" /usr/local/bin/tillandsias-plan /usr/bin/tillandsias-plan; do if [ -x \"$c\" ]; then b=\"$c\"; break; fi; done; fi; test -n \"$b\" && test -x \"$b\" || { echo 'FAIL: no tillandsias-plan binary, and no cargo to build one from the checkout'; exit 1; }; printf '%s' \"$b\" > /tmp/.litmus-394d-bin; echo 'ok: harness-binary-resolved'"
    timeout_ms: 300000
    expected_behavior: "ok: harness-binary-resolved"

  - step: "the ground truth is COMMITTED DATA in the repo, not generated at run time"
    # A ground truth the harness writes for itself grades nothing. It must be a
    # file a human reviews in a diff — and it must not be sitting somewhere
    # .gitignore swallows, which is the quiet way a fixture stops being
    # committed while every step still passes locally.
    command: "Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; test -f \"$Q\" || { echo 'FAIL: the committed ground truth is missing'; exit 1; }; git check-ignore -q \"$Q\" && { echo 'FAIL: the ground truth is gitignored — it is not committed data'; exit 1; }; grep -q '^version: 1$' \"$Q\" || { echo 'FAIL: the query set does not declare the pinned schema version'; exit 1; }; n=$(grep -c '^  - id: ' \"$Q\"); test \"$n\" -ge 17 || { echo \"FAIL: only $n cases committed\"; exit 1; }; echo \"ok: ground-truth-is-committed-data n=$n\""
    timeout_ms: 15000
    expected_behavior: "ok: ground-truth-is-committed-data"

  # ── EXIT (ii): GREEN AT HEAD ─────────────────────────────────────────────
  - step: "EXIT (ii): the committed ground truth is GREEN at HEAD"
    # The whole packet in one line. `fail=0` alone is not enough — a query set
    # that lost its cases would also report fail=0 — so the case count is
    # asserted with it. A shrinking bar is a lowered bar.
    command: "PB=$(cat /tmp/.litmus-394d-bin); \"$PB\" grade --root . > /tmp/.litmus-394d-green.txt 2>&1 || { echo 'FAIL: the ground truth is RED at HEAD'; cat /tmp/.litmus-394d-green.txt; exit 1; }; r=$(grep '^groundtruth-result:' /tmp/.litmus-394d-green.txt); printf '%s' \"$r\" | grep -q 'fail=0' || { echo \"FAIL: $r\"; exit 1; }; n=$(printf '%s' \"$r\" | sed -n 's/.*total=\\([0-9]*\\).*/\\1/p'); test \"$n\" -ge 17 || { echo \"FAIL: the query set shrank to $n cases — a shrinking bar is a lowered bar\"; exit 1; }; grep -q '^PASS  plan-active-release-experts-milestone' /tmp/.litmus-394d-green.txt || { echo 'FAIL: the active-release case did not run'; exit 1; }; grep -q '^PASS  methodology-forge-cycle-budget' /tmp/.litmus-394d-green.txt || { echo 'FAIL: the methodology corpus was not graded'; exit 1; }; echo \"ok: groundtruth-green-at-head n=$n\""
    timeout_ms: 120000
    expected_behavior: "ok: groundtruth-green-at-head"

  # ── EXIT (i): THE 60s IN-FORGE BUDGET ────────────────────────────────────
  - step: "EXIT (i): the harness runs inside the forge budget — under 60s, measured twice"
    # Measured two independent ways on purpose: the WALL CLOCK around the
    # invocation (which no code inside the harness can lie about) and the
    # harness's own elapsed_ms (which is what an operator will read in a log).
    # If the harness ever stopped reporting its own time, this goes red rather
    # than silently losing the measurement.
    command: "PB=$(cat /tmp/.litmus-394d-bin); s=$(date +%s); \"$PB\" grade --root . > /tmp/.litmus-394d-timed.txt 2>&1; rc=$?; e=$(date +%s); w=$((e-s)); test \"$rc\" = '0' || { echo 'FAIL: the timed run was RED'; exit 1; }; ms=$(sed -n 's/.*elapsed_ms=\\([0-9]*\\).*/\\1/p' /tmp/.litmus-394d-timed.txt); test -n \"$ms\" || { echo 'FAIL: the harness does not report its own elapsed time'; exit 1; }; test \"$w\" -lt 60 || { echo \"FAIL: wall clock ${w}s exceeds the 60s in-forge budget\"; exit 1; }; test \"$ms\" -lt 60000 || { echo \"FAIL: harness self-reported ${ms}ms, budget is 60000ms\"; exit 1; }; echo \"ok: harness-under-60s wall=${w}s self=${ms}ms\""
    timeout_ms: 120000
    expected_behavior: "ok: harness-under-60s"

  # ── EXIT (iii): SEEDED WRONG EXPECTED ANSWERS MUST TURN IT RED ───────────
  # Every seed is applied to a COPY under /tmp. The committed ground truth is
  # never mutated by its own test.
  - step: "SEEDED WRONG ANSWER 1: a methodology rule quoted wrongly is RED"
    # The load-bearing one. The citation still resolves and the range is still
    # in bounds — only the expected TEXT is wrong, so this can only be caught
    # by re-reading the span from the corpus.
    command: "PB=$(cat /tmp/.litmus-394d-bin); Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; sed 's/drain AT MOST ONE plan packet per cycle/drain AS MANY plan packets as you like/' \"$Q\" > /tmp/.litmus-394d-w1.yaml; \"$PB\" grade --root . /tmp/.litmus-394d-w1.yaml > /tmp/.litmus-394d-w1.txt 2>&1 && { echo 'FAIL: a WRONG expected methodology answer was graded GREEN'; exit 1; }; grep -q '^FAIL  methodology-forge-cycle-budget' /tmp/.litmus-394d-w1.txt && grep -q 'cited span does not contain' /tmp/.litmus-394d-w1.txt && echo 'ok: wrong-methodology-quote-is-red'"
    timeout_ms: 120000
    expected_behavior: "ok: wrong-methodology-quote-is-red"

  - step: "SEEDED WRONG ANSWER 2: a wrong PACKET STATUS is RED"
    # The plan half. 394a is `completed`; claiming it is `ready` must not grade
    # green, or the expert could report finished work as available and agents
    # would redo it.
    command: "PB=$(cat /tmp/.litmus-394d-bin); Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; sed 's/^          status: completed$/          status: ready/' \"$Q\" > /tmp/.litmus-394d-w2.yaml; \"$PB\" grade --root . /tmp/.litmus-394d-w2.yaml > /tmp/.litmus-394d-w2.txt 2>&1 && { echo 'FAIL: a WRONG expected packet status was graded GREEN'; exit 1; }; grep -q '^FAIL  plan-status-of-394a' /tmp/.litmus-394d-w2.txt && grep -q 'authority.status' /tmp/.litmus-394d-w2.txt && echo 'ok: wrong-packet-status-is-red'"
    timeout_ms: 120000
    expected_behavior: "ok: wrong-packet-status-is-red"

  - step: "SEEDED WRONG ANSWER 3: a wrong PACKET IDENTITY in the active-release set is RED"
    # Order 456's own case. If a packet that is not in the milestone can be
    # asserted into the expected set and still grade green, "the server returns
    # the correct packets" means nothing.
    command: "PB=$(cat /tmp/.litmus-394d-bin); Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; sed 's|packet_id: plan-methodology-experts-rung1/expert-groundtruth-harness|packet_id: plan-methodology-experts-rung1/NOT-A-REAL-CHILD|' \"$Q\" > /tmp/.litmus-394d-w3.yaml; \"$PB\" grade --root . /tmp/.litmus-394d-w3.yaml > /tmp/.litmus-394d-w3.txt 2>&1 && { echo 'FAIL: a FABRICATED packet id was graded GREEN'; exit 1; }; grep -q '^FAIL  plan-active-release-experts-milestone' /tmp/.litmus-394d-w3.txt && echo 'ok: wrong-packet-identity-is-red'"
    timeout_ms: 120000
    expected_behavior: "ok: wrong-packet-identity-is-red"

  - step: "SEEDED WRONG ANSWER 4: expecting a REFUSAL to become an answer is RED"
    # Refusals are graded, not tolerated. `forge_cycle` is one token short of
    # `forge_cycle_budget`; the expert must refuse it. Flipping that case's
    # expected confidence to `exact` — i.e. asserting the engine SHOULD guess —
    # must go red, which is what proves the refusal is really being checked and
    # not merely unasserted.
    command: "PB=$(cat /tmp/.litmus-394d-bin); Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; sed '/^  - id: methodology-near-miss-does-not-leak-the-answer$/,/^  - id: /{s/^      confidence: unsupported$/      confidence: exact/}' \"$Q\" > /tmp/.litmus-394d-w4.yaml; \"$PB\" grade --root . /tmp/.litmus-394d-w4.yaml > /tmp/.litmus-394d-w4.txt 2>&1 && { echo 'FAIL: expecting a guess where the engine refuses was graded GREEN'; exit 1; }; grep -q '^FAIL  methodology-near-miss-does-not-leak-the-answer' /tmp/.litmus-394d-w4.txt && grep -q 'confidence: expected Exact, got Unsupported' /tmp/.litmus-394d-w4.txt && echo 'ok: wrong-refusal-expectation-is-red'"
    timeout_ms: 120000
    expected_behavior: "ok: wrong-refusal-expectation-is-red"

  - step: "SEEDED WRONG ANSWER 5: a rule attributed to the WRONG FILE is RED"
    # Provenance, not just content: the no-python rule lives in methodology.yaml.
    # Attributing it to methodology/distributed-work.yaml must not grade green,
    # or a citation could name any file in the corpus.
    command: "PB=$(cat /tmp/.litmus-394d-bin); Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; awk 'BEGIN{n=0} /^  - id: methodology-no-python$/{n=1} { if (n==1 && $0==\"        - path: methodology.yaml\") { print \"        - path: methodology/distributed-work.yaml\"; n=2; next } print }' \"$Q\" > /tmp/.litmus-394d-w5.yaml; \"$PB\" grade --root . /tmp/.litmus-394d-w5.yaml > /tmp/.litmus-394d-w5.txt 2>&1 && { echo 'FAIL: a rule attributed to the WRONG FILE was graded GREEN'; exit 1; }; grep -q '^FAIL  methodology-no-python' /tmp/.litmus-394d-w5.txt && grep -q 'path methodology.yaml != methodology/distributed-work.yaml' /tmp/.litmus-394d-w5.txt && echo 'ok: wrong-source-file-is-red'"
    timeout_ms: 120000
    expected_behavior: "ok: wrong-source-file-is-red"

  # ── ANTI-VACUUM: the ways a grading gate normally rots into a no-op ──────
  - step: "ANTI-VACUUM: an EMPTY query set is a harness ERROR (exit 2), never 'fail=0'"
    # `0 cases, 0 failures` is the classic green-by-vacuum. The exit code is
    # asserted specifically: 1 means graded red, 2 means the harness could not
    # run, and collapsing the two is how "the query set moved" starts reading
    # exactly like "the experts are correct".
    command: "PB=$(cat /tmp/.litmus-394d-bin); printf 'version: 1\\nname: empty\\ncases: []\\n' > /tmp/.litmus-394d-empty.yaml; \"$PB\" grade --root . /tmp/.litmus-394d-empty.yaml > /tmp/.litmus-394d-empty.txt 2>&1; rc=$?; test \"$rc\" = '2' || { echo \"FAIL: an EMPTY ground truth exited $rc, expected 2\"; exit 1; }; grep -q 'ZERO cases' /tmp/.litmus-394d-empty.txt && echo 'ok: empty-ground-truth-is-an-error'"
    timeout_ms: 60000
    expected_behavior: "ok: empty-ground-truth-is-an-error"

  - step: "ANTI-VACUUM: a MISSPELLED expectation key is refused, not silently ignored"
    # The single most common way an assertion becomes decoration: `answer_contain`
    # instead of `answer_contains` would, under a permissive parser, leave the
    # case green while checking nothing at all.
    command: "PB=$(cat /tmp/.litmus-394d-bin); Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; sed 's/^      answer_contains:$/      answer_contain:/' \"$Q\" > /tmp/.litmus-394d-typo.yaml; \"$PB\" grade --root . /tmp/.litmus-394d-typo.yaml > /tmp/.litmus-394d-typo.txt 2>&1; rc=$?; test \"$rc\" = '2' || { echo \"FAIL: a misspelled expectation key exited $rc, expected 2\"; exit 1; }; grep -q 'answer_contain' /tmp/.litmus-394d-typo.txt && echo 'ok: misspelled-expectation-is-refused'"
    timeout_ms: 60000
    expected_behavior: "ok: misspelled-expectation-is-refused"

  - step: "ANTI-VACUUM: a DUPLICATE case id is refused (a shadowed case stops being graded)"
    command: "PB=$(cat /tmp/.litmus-394d-bin); Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; cp \"$Q\" /tmp/.litmus-394d-dup.yaml; \"$PB\" grade --root . \"$Q\" /tmp/.litmus-394d-dup.yaml > /tmp/.litmus-394d-dup.txt 2>&1; rc=$?; test \"$rc\" = '2' || { echo \"FAIL: duplicate case ids exited $rc, expected 2\"; exit 1; }; grep -q 'duplicate case id' /tmp/.litmus-394d-dup.txt && echo 'ok: duplicate-case-id-is-refused'"
    timeout_ms: 60000
    expected_behavior: "ok: duplicate-case-id-is-refused"

  # ── EXIT (iv): REUSABLE VERBATIM BY ORDERS 457 AND 400 ───────────────────
  - step: "EXIT (iv): the engine registry is enumerable and both rung-1 corpora are in it"
    command: "PB=$(cat /tmp/.litmus-394d-bin); \"$PB\" grade --list-engines > /tmp/.litmus-394d-eng.txt 2>&1 || { echo 'FAIL: the registry is not enumerable'; exit 1; }; for e in plan.answer methodology.ask methodology.path; do grep -q \"^$e\" /tmp/.litmus-394d-eng.txt || { echo \"FAIL: engine $e is not registered\"; exit 1; }; done; echo 'ok: engine-registry-enumerable'"
    timeout_ms: 30000
    expected_behavior: "ok: engine-registry-enumerable"

  - step: "EXIT (iv): an UNREGISTERED corpus fails loudly and names the plug-in site"
    # This is the step orders 457 and 400 read. A query set naming
    # `cheatsheet.ask` must not be silently skipped (which would let a new
    # expert ship ungraded); it must stop the harness and say exactly where to
    # register the corpus.
    command: "PB=$(cat /tmp/.litmus-394d-bin); printf 'version: 1\\nname: future\\ncases:\\n- id: future-corpus-probe\\n  engine: cheatsheet.ask\\n  query: how do I run podman rootless\\n  expect:\\n    confidence: exact\\n' > /tmp/.litmus-394d-future.yaml; \"$PB\" grade --root . /tmp/.litmus-394d-future.yaml > /tmp/.litmus-394d-future.txt 2>&1; rc=$?; test \"$rc\" = '2' || { echo \"FAIL: an unregistered corpus exited $rc, expected 2 — a skipped case is an ungraded expert\"; exit 1; }; grep -q 'crates/tillandsias-plan/src/groundtruth.rs' /tmp/.litmus-394d-future.txt || { echo 'FAIL: the error does not name the registration site'; exit 1; }; grep -q 'ENGINES + Harness::run' /tmp/.litmus-394d-future.txt && echo 'ok: unregistered-corpus-names-the-plug-in-site'"
    timeout_ms: 60000
    expected_behavior: "ok: unregistered-corpus-names-the-plug-in-site"

  - step: "EXIT (iv): the GRADER is structurally corpus-free"
    # The reuse claim, pinned where it can rot. `grade_envelope` takes an
    # envelope, an expectation and a checkout root — no corpus, no ledger, no
    # engine — so it CANNOT grade a future expert more leniently than a current
    # one. And no field of `Expect` names a corpus, so 457/400 do not have to
    # extend the schema to express their expectations.
    command: "G=crates/tillandsias-plan/src/groundtruth.rs; grep -q 'pub fn grade_envelope(envelope: &Envelope, expect: &Expect, root: &Path) -> Vec<String>' \"$G\" || { echo 'FAIL: grade_envelope grew a corpus-shaped parameter'; exit 1; }; sed -n '/^pub struct Expect {/,/^}/p' \"$G\" | grep -vE '^\\s*(///|//)' | grep -qiE 'methodology|packet|ledger|cheatsheet|yaml_path' && { echo 'FAIL: the expectation schema names a corpus — it is no longer reusable verbatim'; exit 1; }; sed -n '/^pub struct CitationMatch {/,/^}/p' \"$G\" | grep -q 'serde(flatten)' || { echo 'FAIL: citation matching stopped being an open authority map'; exit 1; }; echo 'ok: grader-is-corpus-free'"
    timeout_ms: 15000
    expected_behavior: "ok: grader-is-corpus-free"

  - step: "EXIT (iv) BEHAVIOURAL: a SECOND query set is graded by the same binary, same run"
    # How 457 and 400 will actually invoke it: drop a file next to the rung-1
    # one and grade the glob. Proven by grading a second set alongside the
    # committed one and requiring BOTH to be counted.
    command: "PB=$(cat /tmp/.litmus-394d-bin); Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; printf 'version: 1\\nname: second-corpus-probe\\ncases:\\n- id: second-set-probe-case\\n  engine: methodology.path\\n  query: clean_workspace_discipline.rule\\n  expect:\\n    confidence: exact\\n    citation_kind: methodology\\n    citations_include:\\n    - path: methodology.yaml\\n      span_contains:\\n      - \"completely clean work state\"\\n' > /tmp/.litmus-394d-second.yaml; \"$PB\" grade --root . \"$Q\" /tmp/.litmus-394d-second.yaml > /tmp/.litmus-394d-second.txt 2>&1 || { echo 'FAIL: grading two query sets went red'; cat /tmp/.litmus-394d-second.txt; exit 1; }; r=$(grep '^groundtruth-result:' /tmp/.litmus-394d-second.txt); printf '%s' \"$r\" | grep -q 'sets=2' || { echo \"FAIL: the second set was not loaded: $r\"; exit 1; }; printf '%s' \"$r\" | grep -q 'fail=0' || { echo \"FAIL: $r\"; exit 1; }; grep -q '^PASS  second-set-probe-case' /tmp/.litmus-394d-second.txt && echo 'ok: second-query-set-graded-by-the-same-harness'"
    timeout_ms: 120000
    expected_behavior: "ok: second-query-set-graded-by-the-same-harness"

  # ── ORDER 456 exit criterion 3: THE SERVER, not the library ─────────────
  - step: "ORDER 456: the forge-plan MCP SERVER returns the CORRECT packets for the active release"
    # Order 456's remaining criterion. The envelope graded here is the one that
    # crossed the JSON-RPC boundary — the bytes an agent actually receives —
    # graded against the SAME committed expectation the in-process run uses, so
    # the transport cannot be right in the library and wrong at the tool.
    # forge-local-experts-milestone (order 391) is the active release's (v0.5)
    # experts milestone; the expected set pins the whole 394 family with its
    # real statuses AND a negative set, so answering with the entire ledger
    # fails too.
    command: "PB=$(cat /tmp/.litmus-394d-bin); printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_answer\",\"arguments\":{\"question\":\"burndown of forge-local-experts-milestone\"}}}' | TILLANDSIAS_PLAN_BIN=\"$PB\" TILLANDSIAS_PLAN_INDEX=\"$PWD/plan/index.yaml\" TILLANDSIAS_METHODOLOGY_ROOT=\"$PWD\" bash images/default/config-overlay/mcp/forge-plan.sh | jq -r '.result.content[0].text' > /tmp/.litmus-394d-mcp.json; \"$PB\" grade --root . --case plan-active-release-experts-milestone --envelope /tmp/.litmus-394d-mcp.json > /tmp/.litmus-394d-mcp.txt 2>&1 || { echo 'FAIL: the MCP server did NOT return the correct packets for the active release'; cat /tmp/.litmus-394d-mcp.txt; exit 1; }; grep -q '^PASS  plan-active-release-experts-milestone' /tmp/.litmus-394d-mcp.txt && grep -q 'fail=0' /tmp/.litmus-394d-mcp.txt && echo 'ok: mcp-server-returns-correct-active-release-packets'"
    timeout_ms: 180000
    expected_behavior: "ok: mcp-server-returns-correct-active-release-packets"

  - step: "ORDER 606: the real forge-plan plan_answer grades release wording and upstream direction"
    command: "PB=$(cat /tmp/.litmus-394d-bin); printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_answer\",\"arguments\":{\"question\":\"what v0.5 work can I do on linux?\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_answer\",\"arguments\":{\"question\":\"what blocks forge-local-experts-milestone\"}}}' | TILLANDSIAS_PLAN_BIN=\"$PB\" TILLANDSIAS_PLAN_INDEX=\"$PWD/plan/index.yaml\" TILLANDSIAS_METHODOLOGY_ROOT=\"$PWD\" bash images/default/config-overlay/mcp/forge-plan.sh > /tmp/.litmus-606-answer-frames.jsonl; sed -n '1p' /tmp/.litmus-606-answer-frames.jsonl | jq -r '.result.content[0].text' > /tmp/.litmus-606-release.json; sed -n '2p' /tmp/.litmus-606-answer-frames.jsonl | jq -r '.result.content[0].text' > /tmp/.litmus-606-upstream.json; \"$PB\" grade --root . --case plan-ready-v05-linux-preserves-release --envelope /tmp/.litmus-606-release.json > /tmp/.litmus-606-release-grade.txt 2>&1 || { cat /tmp/.litmus-606-release-grade.txt; exit 1; }; \"$PB\" grade --root . --case plan-upstream-prerequisites-of-experts-milestone --envelope /tmp/.litmus-606-upstream.json > /tmp/.litmus-606-upstream-grade.txt 2>&1 || { cat /tmp/.litmus-606-upstream-grade.txt; exit 1; }; grep -q '^PASS  plan-ready-v05-linux-preserves-release' /tmp/.litmus-606-release-grade.txt && grep -q '^PASS  plan-upstream-prerequisites-of-experts-milestone' /tmp/.litmus-606-upstream-grade.txt && echo 'ok: real-mcp-release-and-upstream-groundtruth'"
    timeout_ms: 180000
    expected_behavior: "ok: real-mcp-release-and-upstream-groundtruth"

  - step: "ORDER 606: plan_query/plan_blocked_on schemas are closed and invalid constraints are typed errors"
    command: "PB=$(cat /tmp/.litmus-394d-bin); rm -f /tmp/.litmus-606-usage.jsonl; printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_query\",\"arguments\":{\"status\":\"ready\",\"pickup_role\":\"linux\",\"desired_release\":\"v0.5\",\"capability_tags\":[\"experts\"],\"limit\":5}}}' '{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_blocked_on\",\"arguments\":{\"reference\":\"forge-local-experts-milestone\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_query\",\"arguments\":{\"desired_release\":\"v9.9\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":5,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_query\",\"arguments\":{\"surprise\":true}}}' '{\"jsonrpc\":\"2.0\",\"id\":6,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_query\",\"arguments\":{\"desired_release\":\"\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":7,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_query\",\"arguments\":{\"capability_tags\":[\"\"]}}}' | TILLANDSIAS_PLAN_BIN=\"$PB\" TILLANDSIAS_PLAN_INDEX=\"$PWD/plan/index.yaml\" TILLANDSIAS_EXPERT_USAGE_LOG=/tmp/.litmus-606-usage.jsonl bash images/default/config-overlay/mcp/forge-plan.sh > /tmp/.litmus-606-tools.jsonl; L=$(sed -n '1p' /tmp/.litmus-606-tools.jsonl); printf '%s' \"$L\" | jq -e '([.result.tools[] | select(.name == \"plan_query\" and .inputSchema.additionalProperties == false and .inputSchema.properties.desired_release.minLength == 1 and .inputSchema.properties.capability_tags.items.minLength == 1)] | length) == 1 and ([.result.tools[] | select(.name == \"plan_blocked_on\" and .inputSchema.additionalProperties == false)] | length) == 1' >/dev/null || { echo 'FAIL: order-606 tool schemas absent, open, or accept empty constraints'; exit 1; }; Q=$(sed -n '2p' /tmp/.litmus-606-tools.jsonl | jq -r '.result.content[0].text'); printf '%s' \"$Q\" | jq -e 'length > 0 and all(.[]; .desired_release == \"v0.5\" and has(\"desired_release\") and has(\"release_target\"))' >/dev/null || { echo \"FAIL: release query leaked or lost projection: $Q\"; exit 1; }; U=$(sed -n '3p' /tmp/.litmus-606-tools.jsonl | jq -r '.result.content[0].text'); test \"$(printf '%s\\n' \"$U\" | cut -f1,3)\" = $'437\\tforge-src-tmpfs-topology' || { echo \"FAIL: upstream primitive returned: $U\"; exit 1; }; for n in 4 5 6 7; do test \"$(sed -n \"${n}p\" /tmp/.litmus-606-tools.jsonl | jq -r '.error.code')\" = '-32602' || { echo \"FAIL: request $n was not Invalid params\"; exit 1; }; done; test \"$(wc -l < /tmp/.litmus-606-usage.jsonl)\" = 6 || { echo 'FAIL: one telemetry row per tool call was not recorded'; exit 1; }; test \"$(tail -n 4 /tmp/.litmus-606-usage.jsonl | jq -s '[.[] | select(.tool == \"plan_query\" and .outcome == \"error\")] | length')\" = 4 || { echo 'FAIL: invalid multi-request calls inherited stale results or were not recorded as errors'; exit 1; }; echo 'ok: closed-release-upstream-tools-and-typed-errors'"
    timeout_ms: 180000
    expected_behavior: "ok: closed-release-upstream-tools-and-typed-errors"

  - step: "ORDER 456 FALSIFIABILITY: a dead-on-arrival server is graded RED, not skipped"
    # The exact regression order 456 shipped with: the wrapper probed for a
    # binary nothing produced and every call came back with a diagnostic. That
    # path now answers with a well-formed `unsupported` envelope — which is
    # correct behaviour and MUST STILL FAIL THE GRADE, because a server that
    # refuses every question is not a server that returns the correct packets.
    command: "PB=$(cat /tmp/.litmus-394d-bin); d=$(mktemp -d); mkdir -p \"$d/state\"; printf 'degraded\\n' > \"$d/state/state\"; printf 'not-built\\n' > \"$d/state/reason\"; printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_answer\",\"arguments\":{\"question\":\"burndown of forge-local-experts-milestone\"}}}' | env -u TILLANDSIAS_PLAN_BIN HOME=\"$d\" FORGE_EXPERTS_STATE_DIR=\"$d/state\" bash images/default/config-overlay/mcp/forge-plan.sh | jq -r '.result.content[0].text' > /tmp/.litmus-394d-doa.json; rm -rf \"$d\"; \"$PB\" grade --root . --case plan-active-release-experts-milestone --envelope /tmp/.litmus-394d-doa.json > /tmp/.litmus-394d-doa.txt 2>&1 && { echo 'FAIL: a dead-on-arrival MCP server was graded GREEN'; exit 1; }; grep -q '^FAIL  plan-active-release-experts-milestone' /tmp/.litmus-394d-doa.txt && grep -q 'confidence: expected Exact, got Unsupported' /tmp/.litmus-394d-doa.txt && echo 'ok: dead-on-arrival-server-is-red'"
    timeout_ms: 180000
    expected_behavior: "ok: dead-on-arrival-server-is-red"

  # ── ORDER 606-h9vy: fragment provenance, tampering, freshness ────────────
  - step: "ORDER 606-h9vy: the fragment-provenance query set grades GREEN against its committed fixture corpus"
    # Graded against the immutable fixture corpus, NEVER the live ledger:
    # compaction folds live fragments into the base, which would stale any
    # committed case naming a real fragment file. The fixture never compacts.
    command: "PB=$(cat /tmp/.litmus-394d-bin); FIX=openspec/litmus-tests/groundtruth/fixtures/fragment-provenance; \"$PB\" --index \"$FIX/plan/index.yaml\" grade openspec/litmus-tests/groundtruth/expert-groundtruth-fragment-provenance.yaml > /tmp/.litmus-606-h9vy-fix.txt 2>&1 || { echo 'FAIL: fragment-provenance ground truth is RED'; cat /tmp/.litmus-606-h9vy-fix.txt; exit 1; }; grep -q '^PASS  frag-born-packet-cites-its-fragment' /tmp/.litmus-606-h9vy-fix.txt && grep -q '^PASS  frag-lww-override-cites-the-winning-fragment' /tmp/.litmus-606-h9vy-fix.txt && grep -q '^PASS  frag-zero-omitted-rows-over-a-folded-corpus' /tmp/.litmus-606-h9vy-fix.txt && grep -q 'fail=0' /tmp/.litmus-606-h9vy-fix.txt && echo 'ok: fragment-provenance-groundtruth-green'"
    timeout_ms: 120000
    expected_behavior: "ok: fragment-provenance-groundtruth-green"

  - step: "ORDER 606-h9vy TAMPER-NEGATIVE: verify-answer refuses fabricated authority and a stale base span"
    # The envelope is REAL (produced by the engine over the fixture corpus);
    # each tamper is one jq edit. (a) a fabricated status VALUE on the winning
    # fragment citation; (b) the folded status claimed against the STALE BASE
    # span — the exact pre-606-h9vy behaviour, now a hard rejection; (c) the
    # untampered envelope still verifies, so the checks reject tampering, not
    # the envelope shape.
    command: "PB=$(cat /tmp/.litmus-394d-bin); FIX=openspec/litmus-tests/groundtruth/fixtures/fragment-provenance; \"$PB\" --index \"$FIX/plan/index.yaml\" answer status of fixture-base-overridden > /tmp/.litmus-606-h9vy-env.json; jq '(.citations[] | select(.authority.status == \"in_progress\") | .authority.status) = \"completed\"' /tmp/.litmus-606-h9vy-env.json | \"$PB\" verify-answer > /tmp/.litmus-606-h9vy-a.txt 2>&1 && { echo 'FAIL: a fabricated authority status was verified'; exit 1; }; grep -q 'does not substantiate authority' /tmp/.litmus-606-h9vy-a.txt || { echo 'FAIL: wrong rejection reason for fabricated status'; cat /tmp/.litmus-606-h9vy-a.txt; exit 1; }; BASE_SPAN=$(jq '[.citations[] | select(.path == \"plan/index.yaml\")][0]' /tmp/.litmus-606-h9vy-env.json); jq --argjson b \"$BASE_SPAN\" '.citations = [(.citations[] | select(.authority.status == \"in_progress\") | .path = $b.path | .line_start = $b.line_start | .line_end = $b.line_end)]' /tmp/.litmus-606-h9vy-env.json | \"$PB\" verify-answer > /tmp/.litmus-606-h9vy-b.txt 2>&1 && { echo 'FAIL: a stale base span was verified for a fragment-won field'; exit 1; }; grep -q 'does not substantiate authority' /tmp/.litmus-606-h9vy-b.txt || { echo 'FAIL: wrong rejection reason for stale base span'; cat /tmp/.litmus-606-h9vy-b.txt; exit 1; }; \"$PB\" verify-answer < /tmp/.litmus-606-h9vy-env.json > /tmp/.litmus-606-h9vy-c.txt 2>&1 || { echo 'FAIL: the untampered envelope no longer verifies'; cat /tmp/.litmus-606-h9vy-c.txt; exit 1; }; grep -q '^ok: envelope verified' /tmp/.litmus-606-h9vy-c.txt && echo 'ok: tampered-authority-and-stale-span-are-refused'"
    timeout_ms: 120000
    expected_behavior: "ok: tampered-authority-and-stale-span-are-refused"

  - step: "ORDER 606-h9vy FRESHNESS: adding a fragment beside the fixture base advances indexed_at"
    # Freshness must be derived from base PLUS fragments. The probe copies the
    # fixture corpus to a scratch dir, records indexed_at, drops in one more
    # fragment (strictly newer mtime), and requires indexed_at to CHANGE.
    command: "PB=$(cat /tmp/.litmus-394d-bin); FIX=openspec/litmus-tests/groundtruth/fixtures/fragment-provenance; d=$(mktemp -d); cp -r \"$FIX/plan\" \"$d/plan\"; touch -d '2026-01-01T00:00:00Z' \"$d/plan/index.yaml\" \"$d/plan/index.d\"/*.yaml; T0=$(\"$PB\" --index \"$d/plan/index.yaml\" answer status of fixture-base-untouched | jq -r '.freshness.indexed_at'); printf 'status:\\n  - packet_id: fixture-base-untouched\\n    field: status\\n    value: in_progress\\n    ts: \"2026-08-06T00:02:00Z\"\\n    host: fixture-host\\n' > \"$d/plan/index.d/20260806t000002z-lww1-fixture.yaml\"; T1=$(\"$PB\" --index \"$d/plan/index.yaml\" answer status of fixture-base-untouched | jq -r '.freshness.indexed_at'); rm -rf \"$d\"; test \"$T0\" != 'unknown' || { echo 'FAIL: baseline freshness unknown'; exit 1; }; test \"$T0\" != \"$T1\" || { echo \"FAIL: adding a fragment did not change indexed_at ($T0)\"; exit 1; }; echo 'ok: fragment-addition-advances-corpus-freshness'"
    timeout_ms: 120000
    expected_behavior: "ok: fragment-addition-advances-corpus-freshness"

  # ── ORDER 606-xu52: the deterministic plan_next selector ─────────────────
  - step: "ORDER 606-xu52: the plan_next query set grades GREEN against its committed fixture corpus"
    # Deterministic ordering is provable only on an immutable corpus — the
    # live ready set churns with every claim. The set's multi-line adjacency
    # needles are the ordering proof; the fixture's sixth eligible packet is
    # the five-row-cap proof; the v8.8 case is the typed no-work refusal.
    command: "PB=$(cat /tmp/.litmus-394d-bin); FIX=openspec/litmus-tests/groundtruth/fixtures/plan-next; \"$PB\" --index \"$FIX/plan/index.yaml\" grade openspec/litmus-tests/groundtruth/expert-groundtruth-plan-next.yaml > /tmp/.litmus-606-xu52-fix.txt 2>&1 || { echo 'FAIL: plan-next ground truth is RED'; cat /tmp/.litmus-606-xu52-fix.txt; exit 1; }; grep -q '^PASS  next-fixture-deterministic-ranking' /tmp/.litmus-606-xu52-fix.txt && grep -q '^PASS  next-fixture-role-filter-is-exact' /tmp/.litmus-606-xu52-fix.txt && grep -q '^PASS  next-fixture-no-work-is-a-typed-refusal' /tmp/.litmus-606-xu52-fix.txt && grep -q 'fail=0' /tmp/.litmus-606-xu52-fix.txt && echo 'ok: plan-next-groundtruth-green'"
    timeout_ms: 120000
    expected_behavior: "ok: plan-next-groundtruth-green"

  - step: "ORDER 606-xu52: the real forge-plan plan_next is a closed-schema envelope tool with typed refusals"
    # The SERVER's behavior, not the library's: the tool is registered with a
    # closed 1..=5-capped schema, a valid call returns a verifiable envelope
    # whose answer is the ranked surface, an over-cap limit is JSON-RPC
    # -32602, and telemetry records one row per call.
    command: "PB=$(cat /tmp/.litmus-394d-bin); rm -f /tmp/.litmus-606-xu52-usage.jsonl; printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_next\",\"arguments\":{\"pickup_role\":\"linux\",\"limit\":3}}}' '{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_next\",\"arguments\":{\"limit\":9}}}' '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"tools/call\",\"params\":{\"name\":\"plan_next\",\"arguments\":{\"surprise\":true}}}' | TILLANDSIAS_PLAN_BIN=\"$PB\" TILLANDSIAS_PLAN_INDEX=\"$PWD/plan/index.yaml\" TILLANDSIAS_EXPERT_USAGE_LOG=/tmp/.litmus-606-xu52-usage.jsonl bash images/default/config-overlay/mcp/forge-plan.sh > /tmp/.litmus-606-xu52-mcp.jsonl; sed -n '1p' /tmp/.litmus-606-xu52-mcp.jsonl | jq -e '([.result.tools[] | select(.name == \"plan_next\" and .inputSchema.additionalProperties == false and .inputSchema.properties.limit.maximum == 5 and .inputSchema.properties.limit.minimum == 1)] | length) == 1' >/dev/null || { echo 'FAIL: plan_next schema absent, open, or uncapped'; exit 1; }; sed -n '2p' /tmp/.litmus-606-xu52-mcp.jsonl | jq -r '.result.content[0].text' > /tmp/.litmus-606-xu52-env.json; jq -e 'type == \"object\" and has(\"answer\") and has(\"citations\") and (.confidence == \"exact\" or .confidence == \"unsupported\")' /tmp/.litmus-606-xu52-env.json >/dev/null || { echo 'FAIL: plan_next did not return an envelope'; exit 1; }; if [ \"$(jq -r '.confidence' /tmp/.litmus-606-xu52-env.json)\" = 'exact' ]; then jq -r '.answer' /tmp/.litmus-606-xu52-env.json | head -1 | grep -q \"next claimable work for pickup_role 'linux'\" || { echo 'FAIL: exact plan_next answer is not the ranked surface'; exit 1; }; \"$PB\" verify-answer < /tmp/.litmus-606-xu52-env.json >/dev/null || { echo 'FAIL: the served envelope does not verify'; exit 1; }; fi; for n in 3 4; do test \"$(sed -n \"${n}p\" /tmp/.litmus-606-xu52-mcp.jsonl | jq -r '.error.code')\" = '-32602' || { echo \"FAIL: request $n was not Invalid params\"; exit 1; }; done; test \"$(wc -l < /tmp/.litmus-606-xu52-usage.jsonl)\" = 3 || { echo 'FAIL: one telemetry row per plan_next call was not recorded'; exit 1; }; echo 'ok: plan-next-mcp-closed-schema-envelope'"
    timeout_ms: 180000
    expected_behavior: "ok: plan-next-mcp-closed-schema-envelope"

  # ── the crate's own pins ─────────────────────────────────────────────────
  - step: "the harness's own unit pins are GREEN — named, not counted"
    # Named rather than counted: a bare 'N passed' breaks the day someone adds
    # test N+1, and a bare '0 failed' passes on an empty run. Each named test
    # here is one of the four exit criteria expressed inside the crate.
    command: "out=$(cargo test -p tillandsias-plan 2>&1); printf '%s' \"$out\" | grep -q 'FAILED' && { echo 'FAIL: the crate test suite is red'; exit 1; }; for t in the_committed_query_set_is_green_at_head the_fragment_provenance_query_set_is_green_at_head the_plan_next_query_set_is_green_at_head both_corpora_are_represented_in_the_committed_set a_wrong_expected_span_turns_a_passing_case_red a_misspelled_expectation_key_is_refused_not_ignored an_empty_query_set_is_an_error_not_a_pass an_unknown_engine_names_the_registration_site grading_works_on_a_corpus_this_crate_does_not_own; do printf '%s' \"$out\" | grep -q \"groundtruth::tests::$t ... ok\" || { echo \"FAIL: missing unit pin $t\"; exit 1; }; done; for t in fragments::overlay_citation_tests::fold_provenance_records_the_same_winner_the_fold_applies fragments::overlay_citation_tests::a_fragment_only_packet_cites_the_fragment_that_created_it fragments::overlay_citation_tests::an_lww_override_cites_the_winning_fragment_never_the_stale_base_span fragments::overlay_citation_tests::answers_over_a_folded_corpus_omit_no_rows fragments::overlay_citation_tests::freshness_is_derived_from_base_plus_fragments answer::tests::fabricated_authority_values_are_refused_even_on_a_real_span answer::tests::head_sha_resolves_through_a_worktree_commondir_layout answer::tests::plan_next_is_bounded_deterministic_and_release_defaulted; do printf '%s' \"$out\" | grep -q \"$t ... ok\" || { echo \"FAIL: missing 606-h9vy unit pin $t\"; exit 1; }; done; echo 'ok: groundtruth-unit-pins-green'"
    timeout_ms: 300000
    expected_behavior: "ok: groundtruth-unit-pins-green"

  - step: "NO NEW DEPENDENCY, no interpreter, and the query set is DATA not code"
    # The ratified §5 constraints of the 394 family, carried into slice 4. The
    # dependency count is asserted, not inspected: three workspace deps, the
    # same three 394b left behind. The no-interpreter half is asserted
    # STRUCTURALLY — the grader spawns no process at all — because a word-grep
    # would fire on the query set's own honest text (one of its cases is
    # literally "is Python allowed in a committed script?").
    command: "test ! -d crates/tillandsias-groundtruth || { echo 'FAIL: a new crate appeared'; exit 1; }; test \"$(grep -c 'workspace = true' crates/tillandsias-plan/Cargo.toml)\" = '3' || { echo 'FAIL: the dependency set changed'; exit 1; }; test \"$(grep -c 'std::process::Command' crates/tillandsias-plan/src/groundtruth.rs)\" = '0' || { echo 'FAIL: the grader spawns a subprocess'; exit 1; }; Q=openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml; grep -qE '^\\s*(command|script|shell|exec):' \"$Q\" && { echo 'FAIL: the query set carries executable keys — ground truth is DATA'; exit 1; }; echo 'ok: no-new-dependency-data-only-query-set'"
    timeout_ms: 15000
    expected_behavior: "ok: no-new-dependency-data-only-query-set"

observability:
  traces:
    - "@trace spec:forge-environment-discoverability"
    - "@trace order:394"
    - "@trace order:394d"
    - "@trace order:456"
    - "@trace order:606-e2hg"
  expected_log: "Expert ground truth graded: committed query set GREEN at HEAD inside the 60s in-forge budget, five seeded wrong expected answers RED, empty/misspelled/duplicated query sets refused, format proven corpus-agnostic for orders 457 and 400, and the forge-plan MCP server proven to return the correct packets for the active release"
  log_fields:
    spec: "forge-environment-discoverability"
    test: "expert-groundtruth-harness"
    harness: "crates/tillandsias-plan/src/groundtruth.rs"
    ground_truth: "openspec/litmus-tests/groundtruth/expert-groundtruth-rung1.yaml"
