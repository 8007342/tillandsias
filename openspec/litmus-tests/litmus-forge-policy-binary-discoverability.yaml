# @trace spec:default-image, spec:forge-as-only-runtime
# Litmus: CARGO_TARGET_DIR-aware binary discoverability for tillandsias-policy and tillandsias-podman.
name: litmus:forge-policy-binary-discoverability
spec: default-image
phase: pre-build
# Order 661-emqi. The steps below mktemp under /home/forge/.cache, which exists
# only inside the forge container; on a host they fail with "No such file or
# directory" — a red that says nothing about the product. Declaring the host kind
# makes the runner SKIP with the reason named, so the test can finally be BOUND
# (it was unbound and therefore silent, which 660-ryhn is about) without
# reddening host suites.
host_kind: forge
description: >
  Pin CARGO_TARGET_DIR-aware binary resolution across script wrappers:
  verify scripts/check-no-python-scripts.sh and scripts/tillandsias-policy
  succeed cleanly when CARGO_TARGET_DIR is redirected outside the repo root.
severity: high
size: instant

preconditions:
  - scripts/check-no-python-scripts.sh exists
  - scripts/tillandsias-policy exists

critical_path:
  - step: "check-no-python-scripts and tillandsias-policy discover binary with redirected CARGO_TARGET_DIR"
    command: "scripts/test-forge-policy-binary-discoverability.sh"
    timeout_ms: 120000
    expected_behavior: "ok: forge-policy-binary-discoverability PASS"
