# @trace spec:default-image
name: litmus:forge-validation-profile
spec: default-image
phase: pre-build
description: >
  Prove the non-destructive forge validation profile reports credential,
  headless-test, and e2e-eligibility outcomes with stable PASS/SKIP/FAIL rows.
severity: high
size: quick

preconditions:
  - workspace contains scripts/forge-validate.sh
  - workspace contains scripts/lua/check-forge-service-health.lua
  - workspace contains scripts/lua/test-forge-validate.lua

critical_path:
  - step: "validate deterministic forge report classifications"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-forge-validate.lua 2>&1"
    timeout_ms: 10000
    expected_behavior: "ok:forge-validate:7 arms"
    assert_output_contains: "ok:forge-validate:7 arms"

  - step: "validate production profile shell syntax"
    command: "bash -n scripts/forge-validate.sh && test -f scripts/lua/check-forge-service-health.lua && echo 'ok: validation scripts parse successfully'"
    timeout_ms: 2000
    expected_behavior: "ok: validation scripts parse successfully"

observability:
  traces:
    - "@trace spec:default-image"
  expected_log: "credential, push route, workspace, headless, service, and eligibility rows precede the SUMMARY"
  log_fields:
    spec: default-image
    test: forge-validation-profile

rollback:
  on_failure: "inspect validator classification and fixture command isolation"
  command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-forge-validate.lua 2>&1"
