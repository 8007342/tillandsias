# @trace spec:methodology-accountability
name: litmus:methodology-accountability-shape
spec: methodology-accountability
phase: pre-build
description: Verify the methodology authority spec stays anchored to its provenance, trace, and supporting artifacts
severity: medium
size: instant

preconditions:
  - workspace contains openspec/specs/methodology-accountability/spec.md
  - workspace contains methodology.yaml
  - workspace contains methodology/provenance.yaml
  - workspace contains methodology/event/index.yaml
  - workspace contains methodology/event/000-template-unpredicted.yaml
  - workspace contains methodology/proximity.yaml
  - workspace contains methodology/math-foundations.yaml
  - workspace contains docs/cheatsheets/openspec-methodology.md
  - shell utilities are available in PATH (grep, rg)

critical_path:
  - step: "verify the methodology accountability spec carries all required requirement sections"
    command: "grep -F 'Requirement: Methodology claims cite provenance' openspec/specs/methodology-accountability/spec.md && grep -F 'Requirement: Unknown events are first-class artifacts' openspec/specs/methodology-accountability/spec.md && grep -F 'Requirement: Correctness proximity uses CentiColons' openspec/specs/methodology-accountability/spec.md && grep -F 'Requirement: Existing convergence score remains coarse' openspec/specs/methodology-accountability/spec.md && grep -F 'Requirement: Mathematical convergence claims are bounded' openspec/specs/methodology-accountability/spec.md"
    timeout_ms: 5000

  - step: "verify the supporting methodology sources of truth are present"
    command: "test -f methodology/provenance.yaml && test -f methodology/event/index.yaml && test -f methodology/proximity.yaml && test -f methodology/math-foundations.yaml && test -f docs/cheatsheets/openspec-methodology.md && echo METHODOLOGY_SUPPORT_OK"
    timeout_ms: 3000

  - step: "verify the unknown-event template carries the required fields"
    command: "grep -F 'event_id: methodology.event.000-template-unpredicted@v1' methodology/event/000-template-unpredicted.yaml && grep -F 'observed_signal:' methodology/event/000-template-unpredicted.yaml && grep -F 'expected_model:' methodology/event/000-template-unpredicted.yaml && grep -F 'violated_or_missing_claims:' methodology/event/000-template-unpredicted.yaml && grep -F 'affected_artifacts:' methodology/event/000-template-unpredicted.yaml && grep -F 'evidence_refs:' methodology/event/000-template-unpredicted.yaml && grep -F 'uncertainty_delta:' methodology/event/000-template-unpredicted.yaml && grep -F 'next_distillation_step:' methodology/event/000-template-unpredicted.yaml && grep -F 'closure_criteria:' methodology/event/000-template-unpredicted.yaml"
    timeout_ms: 3000

  - step: "verify the methodology accountability trace surface remains discoverable"
    # 60s, not 10s (2026-08-16, windows): this is the one step in the suite
    # that greps the full crates/ tree, and on Windows the runner executes it
    # inside the WSL builder distro where the checkout is a /mnt/c 9p mount —
    # measured sub-second in native Git Bash and >10s under the runner, a
    # deterministic host-context red for a discoverability check that has no
    # latency requirement. See
    # plan/issues/research-windows-methodology-accountability-litmus-red-2026-08-13.md.
    # ORDER 870-fv7k, 2026-08-24. This step was the ONE live instance of the
    # false-pass shape found by scanning all 887 safely-runnable litmus steps.
    #
    # It listed `src-tauri`, which DOES NOT EXIST in this tree. grep therefore
    # exited 2 — an error, not "no matches" — on every run. It reported OK
    # anyway: the grep had no -q, so it printed the 69 matches it DID find in
    # the directories that exist, and the expectation was the bare string
    # `methodology-accountability`, which appears in every one of those lines.
    # The step matched its own output while erroring.
    #
    # Two consequences, both silent: a directory could be deleted from this list
    # and nothing would notice, and the trace surface could collapse to a single
    # file while the step stayed green.
    #
    # Now: the nonexistent path is gone, the count is asserted against a floor
    # rather than the text being echoed, and the sentinel is the only thing that
    # can satisfy the expectation. `grep -c` over multiple files prints per-file
    # counts, so the total is summed with awk; `|| true` keeps a zero-match grep
    # from killing the pipeline before the floor is checked, which is what makes
    # the negative control below reachable.
    command: "n=$(grep -rlIE '@trace spec:methodology-accountability' methodology openspec docs cheatsheets scripts crates images 2>/dev/null | wc -l || true); [ \"${n:-0}\" -ge 10 ] && echo \"ok: methodology-accountability discoverable in ${n} files\" || { echo \"FAIL: only ${n:-0} files carry the trace\"; exit 1; }"
    timeout_ms: 60000
    expected_behavior: "ok: methodology-accountability discoverable in"

  # NEGATIVE CONTROL (634-39ik). The step above spent its life green while
  # erroring; what it lacked was any evidence it could fail. This runs the same
  # floor test against a directory that genuinely carries no such trace, and
  # requires the refusal.
  - step: "NEGATIVE CONTROL: the same floor test over a tree with no such trace must FAIL, not pass on echoed matches"
    command: "T=$(mktemp -d); printf 'nothing here\\n' > \"$T/a.txt\"; n=$(grep -rlIE '@trace spec:methodology-accountability' \"$T\" 2>/dev/null | wc -l || true); rm -rf \"$T\"; if [ \"${n:-0}\" -ge 10 ]; then echo 'FAIL: floor satisfied by a tree with no traces'; exit 1; else echo 'ok: empty tree refused, the floor is falsifiable'; fi"
    timeout_ms: 10000
    expected_behavior: "ok: empty tree refused, the floor is falsifiable"

observability:
  traces:
    - "@trace spec:methodology-accountability"
  expected_log: "Methodology accountability spec remains traceable and anchored to its support files"
  log_fields:
    spec: "methodology-accountability"
    test: "methodology-accountability-shape"

rollback:
  on_failure: "inspect openspec/specs/methodology-accountability/spec.md, methodology/provenance.yaml, methodology/event/index.yaml, methodology/proximity.yaml, methodology/math-foundations.yaml, and docs/cheatsheets/openspec-methodology.md for drift"
  command: "grep -n 'Requirement: Methodology claims cite provenance\\|Requirement: Unknown events are first-class artifacts\\|Requirement: Correctness proximity uses CentiColons\\|Requirement: Existing convergence score remains coarse\\|Requirement: Mathematical convergence claims are bounded' openspec/specs/methodology-accountability/spec.md && printf '\\n---\\n' && grep -rnIE '@trace spec:methodology-accountability' methodology openspec docs cheatsheets scripts src-tauri crates images"
