# @trace spec:ci-release
# @trace order:887-bz88
#
# Pins the closure for a MODE-ONLY regression reaching the trunk. On 2026-08-25
# scripts/check-credential-channel.sh went 100755 -> 100644 in a pushed commit
# and left origin/linux-next failing violation:script-not-executable:1 on a
# pristine clone — the credential guard itself, which every meta-orchestration
# cycle invokes by path before any committable work, where a lost exec bit is a
# permission error rather than a verdict.
#
# TWO BLIND SPOTS COMPOSED, and the pin covers both because neither alone did it:
#   1. check-script-exec-bits.sh read only the INDEX (git ls-files -s), while the
#      skill runs the gate BEFORE `git add` — so a worktree-only chmod passed.
#   2. gate-stamp.sh hashed path + kind + CONTENT and never st_mode, so the
#      `git add` that wrote 100644 changed no bytes, the stamp stayed fresh, and
#      the pre-push hook accepted a tree the gate had never seen in that shape.
#
# The property pinned is stronger than "the exec bit is currently correct": a
# chmod must MOVE the stamp, and the guard must condemn a worktree-only
# regression, or the same hole reopens under a different file.
name: litmus:mode-only-regression-gate
spec: ci-release
phase: pre-build
description: >
  Pin that a mode-only regression cannot cross the gate: gate-stamp.sh
  fingerprints st_mode so a chmod goes stale, and check-script-exec-bits.sh
  reads the WORKTREE as well as the index so the refusal lands before staging.
  The fixture carries a mutation control proving the index-only guard misses the
  incident tree, and negative controls for the clean tree and for shebang-less
  files.
severity: high
size: instant

preconditions:
  - workspace contains scripts/gate-stamp.sh
  - workspace contains scripts/check-script-exec-bits.sh
  - workspace contains scripts/test-mode-only-regression-887-bz88.sh
  - git and bash are available in PATH

critical_path:
  - step: "guards and fixture parse and the fixture is executable"
    command: "bash -n scripts/gate-stamp.sh && bash -n scripts/check-script-exec-bits.sh && bash -n scripts/test-mode-only-regression-887-bz88.sh && test -x scripts/test-mode-only-regression-887-bz88.sh && echo 'ok: parses'"
    timeout_ms: 5000
    expected_behavior: "ok: parses"

  - step: "all fixture arms pass (stamp sees st_mode, worktree arm refuses pre-staging, mutation control, negative controls)"
    command: "bash scripts/test-mode-only-regression-887-bz88.sh 2>&1 | tail -1"
    timeout_ms: 120000
    expected_behavior: "ok:mode-only-regression-fixture:all"

  - step: "the stamp still emits an exec-bit field (the frame must not silently revert to content-only)"
    command: "if grep -q 'execbits\\[i\\]' scripts/gate-stamp.sh && grep -c '%s' scripts/gate-stamp.sh >/dev/null && grep \"printf 'file\" scripts/gate-stamp.sh | grep -q 'execbits'; then echo 'ok: exec-bit framed'; else echo 'FAIL: the file frame lost its exec-bit field'; fi"
    timeout_ms: 5000
    expected_behavior: "ok: exec-bit framed"

  - step: "the specific 2026-08-25 regression stays repaired on the tracked tree"
    command: "test \"$(git ls-files -s -- scripts/check-credential-channel.sh | cut -d' ' -f1)\" = 100755 && echo 'ok: 100755'"
    timeout_ms: 5000
    expected_behavior: "ok: 100755"

  # 1036-e5w9: THE MEMO MUST NOT SKIP THE GUARD THAT CATCHES THIS.
  #
  # The digest sources exec bits from the INDEX (889-8tcb, non-negotiable — the
  # worktree read deadlocked every Windows host). So a worktree-only `chmod -x`
  # leaves the digest identical and the memo returned ok:gate-fresh, skipping the
  # entire gate INCLUDING check-script-exec-bits, the guard that refuses exactly
  # that defect. Both components were correct; the gap was the memo's.
  #
  # PRE-FIX RESULT, measured on lenovinha 2026-09-04 and recorded so this arm is
  # known to have had teeth: an unforced ./build.sh --check returned rc=0 in 2s
  # with ok:gate-fresh on a tree carrying the planted chmod. POST-FIX: rc=1 in
  # 3360ms with violation:script-not-executable:1.
  #
  # This arm drives memo-check DIRECTLY rather than the whole gate: the verdict
  # is the memo's, and a full unforced gate here would cost minutes to assert a
  # decision made in one line. The end-to-end number above is the evidence that
  # the verdict propagates.
  # 1036-e5w9, SPLIT INTO TWO ARMS after the first version went red in the
  # coordinate-cycle union litmus (macuahuitl, 2026-09-05: 290/291, this the
  # only red). The arm was correct and its SKIP was honest; the HARNESS does not
  # recognise a skip written into stdout, so `expected_behavior` — an exact
  # match — read the skip line as a wrong answer. A merged union has by
  # definition changed since the last gate, so that arm would have been red in
  # EVERY coordinate cycle: the 1038-d7vw intermittent-red shape arriving
  # through the harness rather than through the test.
  #
  # The split is what fixes it, not the pattern alone. The digest half needs no
  # warm stamp, so it is unconditional and can never skip — if a future change
  # "fixes" the memo by moving the digest, 889-8tcb's rule is broken and this
  # goes red on any tree, merged or not. The memo half declares both outcomes in
  # a success_pattern (a regex, unlike expected_behavior) so a legitimate skip
  # is a pass while the output line still says which happened.
  #
  # A PERMANENTLY SKIPPING ARM IS A FINDING, NOT A PASS (the 1041-up99 class).
  # This arm exercises only against a warm stamp, which is the normal state
  # right after a green gate and never the state during a merge. If a host sees
  # only the skip form across many runs, the memo behaviour is going unobserved
  # and that is worth filing — the skip text names itself so it can be grepped.
  - step: "1036-e5w9a: a worktree-only chmod does NOT move the stamp digest (889-8tcb's index-sourced rule)"
    command: "set -e; v=scripts/check-litmus-pin-claims.sh; test -x \"$v\"; before=$(bash scripts/gate-stamp.sh compute); chmod -x \"$v\"; after=$(bash scripts/gate-stamp.sh compute); chmod +x \"$v\"; test \"$before\" = \"$after\" || { echo \"FAIL: the chmod moved the digest ($before -> $after) — 889-8tcb's index-sourced rule is broken\"; exit 1; }; echo 'ok: worktree chmod leaves the digest unchanged'"
    timeout_ms: 30000
    expected_behavior: "ok: worktree chmod leaves the digest unchanged"

  - step: "1036-e5w9b: with a warm stamp, a worktree-only chmod makes the memo refuse"
    command: "v=scripts/check-litmus-pin-claims.sh; clean=$(bash scripts/gate-stamp.sh memo-check check 2>&1 || true); case \"$clean\" in ok:gate-fresh*) : ;; *) echo \"skip:1036-e5w9b:no-warm-stamp memo says '$clean' — memo arm not exercised (arm 1036-e5w9a still proved digest invariance)\"; exit 0 ;; esac; chmod -x \"$v\"; out=$(bash scripts/gate-stamp.sh memo-check check 2>&1 || true); chmod +x \"$v\"; case \"$out\" in stale:worktree-mode-drift*) echo 'ok: memo refuses on worktree mode drift' ;; *) echo \"FAIL: memo said '$out' for a worktree-only chmod\"; exit 1 ;; esac"
    timeout_ms: 30000
    success_pattern: "^(ok: memo refuses on worktree mode drift|skip:1036-e5w9b:no-warm-stamp )"

  # THE CONTROL, and it is the one that matters: a fix that made the memo refuse
  # ALWAYS would satisfy the arm above perfectly while destroying 765-tkq2.
  - step: "1036-e5w9 control: a clean tree still memoises (the memo is scoped, not destroyed)"
    command: "out=$(bash scripts/gate-stamp.sh memo-check check 2>&1 || true); case \"$out\" in ok:gate-fresh*) echo 'ok: clean tree still memoises' ;; stale:worktree-mode-drift*) echo \"FAIL: clean tree reports mode drift — the check fires on an unmodified tree\"; exit 1 ;; *) echo \"skip:1036-e5w9c:no-warm-stamp memo says '$out' — control not exercised\"; exit 0 ;; esac"
    timeout_ms: 20000
    success_pattern: "^(ok: clean tree still memoises|skip:1036-e5w9c:no-warm-stamp )"

evidence:
  artifact: "scripts/gate-stamp.sh + scripts/check-script-exec-bits.sh + scripts/test-mode-only-regression-887-bz88.sh"
  measured_on: >
    lenovinha (Fedora Silverblue) 2026-08-25 — fixture 9/9 green. End-to-end on a
    scratch clone with a local bare remote and the real pre-push hook installed:
    PRE-FIX the incident shape (stamp the good tree, chmod -x, stage, commit,
    push) was ACCEPTED, reproducing the hole; POST-FIX the identical sequence was
    REFUSED for a stale stamp. Controls both green: a content change with a
    refreshed stamp still pushes, and an ordinary plan-only fragment push still
    takes the fast lane without a build stamp.
