# @trace spec:podman-idiomatic-patterns
# @trace order:972-cvdg
#
# WHAT THIS TEST OBSERVES, AND WHAT IT DOES NOT — read this before adding a
# step, because the file has been wrong about it once already.
#
# Until order 972-cvdg, five of its eight steps ended `&& echo 'TOKEN' || echo
# 'TOKEN'` with TOKEN as the step's own `expected_behavior`. Both branches
# printed what the harness was looking for, so the greps decided nothing and a
# `severity: critical` test of the container hardening envelope reported PASS on
# every run it ever made — and would have reported PASS with the flags removed
# entirely. `scripts/check-litmus-steps-can-fail.sh` now refuses that shape
# across the whole corpus.
#
# THE SECOND DEFECT WAS DEEPER AND SURVIVED THE FIRST FIX. This test LAUNCHES
# the container itself, and it used to type `--userns=keep-id --cap-drop=ALL
# --security-opt=no-new-privileges` directly onto that command line. Repairing
# the tautologies alone would therefore have left every step asking podman to
# confirm flags THE TEST HAD JUST SUPPLIED — a genuine question about podman,
# and no question at all about Tillandsias. A test can be perfectly falsifiable
# and still be measuring the wrong system.
#
# So the launch argv is now DERIVED from the product's own declared envelope,
# `MANDATORY_HARDENING_FLAGS` in crates/tillandsias-podman/src/policy.rs, which
# is the single place Tillandsias says what hardening it considers mandatory.
# Deleting a flag there changes what this test launches with, and the
# enforcement steps then fail. That makes the fixture observe a product
# decision rather than its own literals.
#
# WHAT IT STILL DOES NOT COVER, stated because the title would otherwise imply
# it: that every production launch site actually APPLIES the envelope. The
# validator that would answer this — `validate_launch_argv` in the same module —
# has zero production call sites, which is order 972-6vaj's subject, not this
# file's. This test proves the declared envelope is well-formed and that podman
# enforces it on this host. It does not prove the forge launches with it.
name: litmus:podman-idiomatic-security-flags
spec: podman-idiomatic-patterns
phase: integration
description: >
  Verify the product's DECLARED hardening envelope (policy.rs
  MANDATORY_HARDENING_FLAGS) is complete and that podman actually enforces it:
  non-root uid, dropped capabilities, and privileged operations refused. Every
  step can fail; the launch argv is derived from the product rather than typed
  into the fixture.
severity: critical
size: e2e

preconditions:
  - podman is available and rootless mode is active
  - forge image is available locally
  - no existing tillandsias-security-test containers running
  - workspace contains crates/tillandsias-podman/src/policy.rs

critical_path:
  - step: "verify podman rootless mode active"
    command: "podman info --format='{{.Security.Rootless}}'"
    timeout_ms: 5000
    expected_behavior: "true"

  - step: "the product's declared hardening envelope still carries all four mandatory flags"
    command: "FLAGS=$(awk '/pub const MANDATORY_HARDENING_FLAGS/{f=1} f{print} f&&/^\\];/{exit}' crates/tillandsias-podman/src/policy.rs | grep -oE '\"--[^\"]+\"' | tr -d '\"'); MISSING=''; for want in --userns=keep-id --cap-drop=ALL --security-opt=no-new-privileges --security-opt=label=disable; do printf '%s\\n' \"$FLAGS\" | grep -qxF -e \"$want\" || MISSING=\"$MISSING $want\"; done; if [ -n \"$MISSING\" ]; then echo \"ENVELOPE_INCOMPLETE:$MISSING\"; else printf '%s\\n' \"$FLAGS\" > /tmp/tillandsias-security-test-flags.txt; echo 'ENVELOPE_COMPLETE'; fi"
    timeout_ms: 5000
    expected_behavior: "ENVELOPE_COMPLETE"

  - step: "launch a container using the product's declared envelope, not fixture literals"
    command: "FORGE_IMAGE=$(podman images --format '{{.Repository}}:{{.Tag}}' | grep '^tillandsias-forge:' | head -1); if [ -z \"$FORGE_IMAGE\" ]; then echo 'NO_FORGE_IMAGE'; elif [ ! -s /tmp/tillandsias-security-test-flags.txt ]; then echo 'NO_DECLARED_ENVELOPE'; else FLAGS=$(cat /tmp/tillandsias-security-test-flags.txt); CONTAINER_ID=$(podman run -d --label tillandsias-test=security-flags --rm $FLAGS \"$FORGE_IMAGE\" sleep 300 2>/dev/null); if [ -n \"$CONTAINER_ID\" ]; then echo \"$CONTAINER_ID\" > /tmp/tillandsias-security-test-container.id; echo \"CONTAINER_LAUNCHED $CONTAINER_ID\"; else echo 'LAUNCH_FAILED'; fi; fi"
    timeout_ms: 15000
    expected_behavior: "CONTAINER_LAUNCHED"

  - step: "verify container runs as non-root (uid != 0)"
    command: "CONTAINER_ID=$(cat /tmp/tillandsias-security-test-container.id 2>/dev/null); if [ -z \"$CONTAINER_ID\" ]; then echo 'NO_CONTAINER'; else UID_IN=$(podman exec \"$CONTAINER_ID\" id -u 2>/dev/null); if [ -z \"$UID_IN\" ]; then echo 'UID_UNREADABLE'; elif [ \"$UID_IN\" = '0' ]; then echo \"RUNNING_AS_ROOT\"; else echo \"NON_ROOT_UID=$UID_IN\"; fi; fi"
    timeout_ms: 5000
    expected_behavior: "NON_ROOT_UID"

  - step: "verify no file capabilities survive --cap-drop=ALL"
    command: "CONTAINER_ID=$(cat /tmp/tillandsias-security-test-container.id 2>/dev/null); if [ -z \"$CONTAINER_ID\" ]; then echo 'NO_CONTAINER'; else CAPS=$(podman exec \"$CONTAINER_ID\" sh -c 'getcap /bin/ping /usr/bin/ping 2>/dev/null' 2>/dev/null); if [ -n \"$CAPS\" ]; then echo \"CAPABILITIES_PRESENT:$CAPS\"; else echo 'CAPABILITIES_DROPPED'; fi; fi"
    timeout_ms: 5000
    expected_behavior: "CAPABILITIES_DROPPED"

  - step: "verify a privileged operation is refused"
    command: "CONTAINER_ID=$(cat /tmp/tillandsias-security-test-container.id 2>/dev/null); if [ -z \"$CONTAINER_ID\" ]; then echo 'NO_CONTAINER'; else OUT=$(podman exec \"$CONTAINER_ID\" ip link add dummy0 type dummy 2>&1); if printf '%s' \"$OUT\" | grep -qiE 'permission denied|operation not permitted'; then echo 'EPERM_CONFIRMED'; else echo \"PRIVILEGED_OP_ALLOWED:$OUT\"; fi; fi"
    timeout_ms: 5000
    expected_behavior: "EPERM_CONFIRMED"

  - step: "verify podman recorded keep-id, cap-drop ALL and no-new-privileges on the running container"
    command: "CONTAINER_ID=$(cat /tmp/tillandsias-security-test-container.id 2>/dev/null); if [ -z \"$CONTAINER_ID\" ]; then echo 'NO_CONTAINER'; else SPEC=$(podman inspect \"$CONTAINER_ID\" --format='{{json .HostConfig.UsernsMode}} {{json .HostConfig.CapDrop}} {{json .HostConfig.SecurityOpt}}' 2>/dev/null); MISSING=''; printf '%s' \"$SPEC\" | grep -q 'keep-id' || MISSING=\"$MISSING userns\"; printf '%s' \"$SPEC\" | grep -q 'ALL' || MISSING=\"$MISSING cap-drop\"; printf '%s' \"$SPEC\" | grep -q 'no-new-privileges' || MISSING=\"$MISSING no-new-privileges\"; if [ -n \"$MISSING\" ]; then echo \"HARDENING_NOT_APPLIED:$MISSING\"; else echo 'HARDENING_APPLIED'; fi; fi"
    timeout_ms: 5000
    expected_behavior: "HARDENING_APPLIED"

observability:
  traces:
    - "@trace spec:podman-idiomatic-patterns"
    - "@trace spec:podman-idiomatic-patterns.security.mandatory-flags@v1"
    - "@trace spec:podman-idiomatic-patterns.rootless.keep-id-first@v1"
  expected_log: "Security flags enforced: --userns=keep-id, --cap-drop=ALL, --security-opt=no-new-privileges"
  log_fields:
    spec: "podman-idiomatic-patterns"
    test: "podman-idiomatic-security-flags"
    security_context: "mandatory-enforcement"
    rootless_mode: "true"
    uid_non_root: "true"
    capabilities_dropped: "true"
    privileged_ops_denied: "true"

rollback:
  on_failure: "cleanup test container; a failure here means either the declared envelope in crates/tillandsias-podman/src/policy.rs lost a flag, or podman on this host did not enforce one it was given"
  command: "CONTAINER_ID=$(cat /tmp/tillandsias-security-test-container.id 2>/dev/null); test -n \"$CONTAINER_ID\" && podman kill \"$CONTAINER_ID\" 2>/dev/null || true; rm -f /tmp/tillandsias-security-test-container.id /tmp/tillandsias-security-test-flags.txt; awk '/pub const MANDATORY_HARDENING_FLAGS/{f=1} f{print} f&&/^\\];/{exit}' crates/tillandsias-podman/src/policy.rs"
