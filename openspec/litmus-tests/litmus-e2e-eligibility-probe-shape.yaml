# @trace spec:meta-orchestration
#
# Pins the host e2e-eligibility probe (plan order 60). The meta-orchestration
# E2E Gates must consult a structured verdict (`eligible` | `skip:<reason>`)
# emitted once per host run instead of re-deriving "no /run/user => no podman
# user session => skip" in prose every cycle. This test falsifies drift in the
# probe's grammar, its no-session/smoke-lock branches, and the skill's wiring.
name: litmus:e2e-eligibility-probe-shape
spec: meta-orchestration
phase: pre-build
description: >
  Pin scripts/e2e-preflight.sh's e2e_eligibility_verdict probe: the
  `eligibility` standalone mode, the falsifiable verdict grammar
  ^(eligible|skip:[a-z0-9-]+)$, the deterministic no-user-session and
  smoke-lock-held branches, the order-442 live-runtime-present branch (a live
  forge / shared stack it did not launch must refuse the destructive reset),
  and the meta-orchestration skill's consultation of the probe in its E2E
  Gates.
severity: medium
size: instant

preconditions:
  - workspace contains scripts/e2e-preflight.sh
  - workspace contains skills/meta-orchestration/SKILL.md
  - podman binary is available in PATH
  - shell utilities (grep, bash) are available in PATH

critical_path:
  - step: "probe defines e2e_eligibility_verdict and the standalone eligibility mode"
    command: "grep -q 'e2e_eligibility_verdict()' scripts/e2e-preflight.sh && grep -q '\"eligibility\"' scripts/e2e-preflight.sh && echo 'ok: probe-defined'"
    timeout_ms: 3000
    expected_behavior: "ok: probe-defined"

  - step: "a missing rootless runtime dir yields the deterministic no-session skip verdict"
    command: "XDG_RUNTIME_DIR=/nonexistent-litmus-e2e-elig bash scripts/e2e-preflight.sh eligibility"
    timeout_ms: 5000
    expected_behavior: "skip:no-podman-user-session"

  - step: "a held build-install smoke lock yields a deterministic lock skip verdict"
    command: "tmp=$(mktemp -d) && mkdir -p \"$tmp/tillandsias-locks\" && { if command -v flock >/dev/null 2>&1; then exec 9>\"$tmp/tillandsias-locks/build-install-smoke-e2e.lock\"; flock -n 9; else mkdir -p \"$tmp/tillandsias-locks/build-install-smoke-e2e.lockdir\"; fi; XDG_RUNTIME_DIR=\"$tmp\" bash scripts/e2e-preflight.sh eligibility; rc=$?; rm -rf \"$tmp\"; exit \"$rc\"; }"
    timeout_ms: 5000
    expected_behavior: "skip:smoke-lock-held"

  # ORDER 740-88hz. SPLIT: the grammar is asserted where it is free, and the
  # live substrate keeps its own step with its budget named for what it buys.
  #
  # This step used to assert the grammar by running the REAL-verdict path,
  # which calls `podman info` (twice) and `podman ps` — measured with a
  # tripwire on yoga 2026-09-15: three podman invocations on that path, zero on
  # the branch below. So an assertion about LINE SHAPE was paying for a
  # container runtime, and when MSYS process-spawn pricing blew the original 5s
  # budget the answer was to raise it to 60s (2026-08-16, windows). That
  # stopped the red and left the cost in place: the budget was sized for the
  # environment the grammar had accidentally acquired.
  #
  # Raising a budget so a grammar assertion can afford podman is 1187-iij8's
  # shape one level down — there the fix was to COUNT a kill apart from a
  # failed assertion, here it is to remove a cause rather than label it.
  - step: "the probe emits exactly one well-formed verdict line (deterministic, no podman)"
    # The same XDG seam step 2 above already uses, and for the same reason: it
    # reaches a documented verdict before any podman call, so this budget is
    # the grammar's own price. 0.004s on yoga against 0.183s for the live path.
    # COUNTS TOTAL LINES AS WELL AS MATCHING ONES. The original assertion was
    # `grep -c <grammar>` alone, which counts only lines that MATCH — so a
    # stray warning, debug line or error text alongside a good verdict left the
    # count at 1 and the step green. Measured on yoga 2026-09-15: with every
    # emitter patched to print a second, non-matching line, this step passed.
    # The probe's own contract is "Emits exactly one line on stdout", and only
    # a total-line count can check that half of it.
    command: "out=$(XDG_RUNTIME_DIR=/nonexistent-litmus-e2e-grammar bash scripts/e2e-preflight.sh eligibility); total=$(printf '%s\\n' \"$out\" | grep -c .); good=$(printf '%s\\n' \"$out\" | grep -cE '^(eligible|skip:[a-z0-9-]+)$'); if [ \"$total\" = \"1\" ] && [ \"$good\" = \"1\" ]; then echo \"ok: well-formed verdict (1 line)\"; else echo \"FAIL: total=$total well-formed=$good\"; exit 1; fi"
    timeout_ms: 5000
    expected_behavior: "ok: well-formed verdict"

  - step: "the LIVE-substrate path also emits exactly one well-formed verdict line"
    # SEPARATE, and deliberately still here: the deterministic step above cannot
    # see a regression in the real-verdict path, which is the path every caller
    # actually takes. Dropping it would trade an intermittent red for a blind
    # spot — the fail-open trade this project keeps refusing.
    #
    # 60s is PODMAN'S price, not the grammar's, and it is written here so the
    # next reader knows which of the two this budget is sized for. The original
    # comment's evidence stands: MSYS process-spawn pricing under the harness
    # blew 5s while the probe passed standalone in <1s (2026-08-16, windows),
    # same treatment as 770-f6u4; see plan/issues/
    # windows-red-meta-orchestration-litmus-2026-08-16.md.
    # Same total-vs-matching fix as the step above: the live path is where a
    # stray line is MOST likely (podman warnings land on stdout in some
    # configurations), and it was exactly as blind.
    command: "out=$(bash scripts/e2e-preflight.sh eligibility); total=$(printf '%s\\n' \"$out\" | grep -c .); good=$(printf '%s\\n' \"$out\" | grep -cE '^(eligible|skip:[a-z0-9-]+)$'); if [ \"$total\" = \"1\" ] && [ \"$good\" = \"1\" ]; then echo \"ok: well-formed verdict (1 line)\"; else echo \"FAIL: total=$total well-formed=$good\"; exit 1; fi"
    timeout_ms: 60000
    expected_behavior: "ok: well-formed verdict"

  - step: "the meta-orchestration skill E2E Gates consult the probe"
    command: "grep -q 'e2e-preflight.sh eligibility' skills/meta-orchestration/SKILL.md && echo 'ok: skill-consults-probe'"
    timeout_ms: 3000
    expected_behavior: "ok: skill-consults-probe"

  - step: "a live tillandsias forge / shared stack yields skip:live-runtime-present (order 442)"
    command: "tmp=$(mktemp -d); fake=\"$tmp/bin\"; mkdir -p \"$fake\"; printf '#!/usr/bin/env bash\nif [ \"$1\" = ps ]; then printf \"%%s\\\\n\" \"tillandsias-tillandsias-forge\"; fi\nexit 0\n' >\"$fake/podman\"; chmod +x \"$fake/podman\"; PATH=\"$fake:$PATH\" XDG_RUNTIME_DIR=\"$tmp\" TILLANDSIAS_DESTRUCTIVE_RESET_OK= bash scripts/e2e-preflight.sh eligibility; rc=$?; rm -rf \"$tmp\"; exit \"$rc\""
    timeout_ms: 5000
    expected_behavior: "skip:live-runtime-present"

  - step: "the live-runtime guard is wired into all three host branches (order 442)"
    command: "mf_stage prod 0 OUT -- grep -c 'live_runtime_is_present' scripts/e2e-preflight.sh && mf_holds_ere OUT '^[3-9]|1[0-9]' && echo 'ok: live-runtime-guard-wired' || { echo 'FAIL: live_runtime_is_present not called in all branches'; exit 1; }"
    timeout_ms: 3000
    expected_behavior: "ok: live-runtime-guard-wired"

observability:
  traces:
    - "@trace spec:meta-orchestration"
  expected_log: "e2e-eligibility verdict probe pinned (grammar + no-session branch + smoke-lock branch + skill wiring)"
  log_fields:
    spec: "meta-orchestration"
    test: "e2e-eligibility-probe-shape"
    artifact: "scripts/e2e-preflight.sh + skills/meta-orchestration/SKILL.md"

rollback:
  on_failure: >
    The e2e-eligibility probe drifted. Restore e2e_eligibility_verdict() in
    scripts/e2e-preflight.sh emitting exactly one line matching
    ^(eligible|skip:[a-z0-9-]+)$ (reasons: no-podman-binary,
    no-podman-user-session, smoke-lock-held, podman-not-functional), the
    `eligibility` standalone mode, and the E2E Gates consultation of
    `scripts/e2e-preflight.sh eligibility` in skills/meta-orchestration/SKILL.md.
  command: "grep -nE 'e2e_eligibility_verdict|eligibility|skip:(no-podman-binary|no-podman-user-session|smoke-lock-held|podman-not-functional)' scripts/e2e-preflight.sh | head -20"
