# @trace spec:dev-build
name: litmus:build-ci-dispatch-shape
spec: dev-build
phase: pre-build
description: Verify ci-full install dispatches each phase once, builds only the Linux musl launcher, and reuses completed CI evidence
severity: high
size: instant

preconditions:
  - workspace contains build.sh
  - workspace contains scripts/generate-evidence-bundle.sh
  - bash, awk, and grep are available in PATH

critical_path:
  - step: "build and evidence scripts remain valid bash"
    command: "bash -n build.sh scripts/generate-evidence-bundle.sh && echo 'ok: bash syntax'"
    timeout_ms: 3000
    expected_behavior: "ok: bash syntax"

  - step: "ci-full pre-build gate has one local-ci invocation site"
    command: "test \"$(grep -cF 'local -a command=(bash \"$SCRIPT_DIR/scripts/local-ci.sh\" \"$@\")' build.sh)\" -eq 1 && test \"$(awk '/# CI validation/{active=1} /# Install binary/{active=0} active' build.sh | grep -cF '_run_local_ci_gate')\" -eq 1 && echo 'ok: one pre-build local-ci invocation'"
    timeout_ms: 3000
    expected_behavior: "ok: one pre-build local-ci invocation"

  - step: "install block dispatches post-build and runtime without local-ci"
    command: "BLOCK=$(awk '/# Install binary/{active=1} /# Test build/{active=0} active' build.sh); test \"$(printf '%s' \"$BLOCK\" | grep -cF 'scripts/local-ci.sh')\" -eq 0 && printf '%s' \"$BLOCK\" | grep -F '_run_litmus_phase post-build e2e' && printf '%s' \"$BLOCK\" | grep -F '_run_litmus_phase runtime e2e' && echo 'ok: direct phase dispatch'"
    timeout_ms: 3000
    expected_behavior: "ok: direct phase dispatch"

  - step: "ci-full install cannot fall through to a debug build"
    command: "grep -F 'FLAG_TEST$FLAG_CHECK$FLAG_INSTALL$FLAG_CI$FLAG_CI_FULL' build.sh && echo 'ok: default-build guard includes install and CI flags'"
    timeout_ms: 3000
    expected_behavior: "ok: default-build guard includes install and CI flags"

  - step: "install musl build targets only the Linux launcher"
    command: "BLOCK=$(awk '/# Install binary/{active=1} /# Test build/{active=0} active' build.sh); printf '%s' \"$BLOCK\" | grep -F 'cargo build --package tillandsias-headless --bin tillandsias --release --target x86_64-unknown-linux-musl --features tray'; test \"$(printf '%s' \"$BLOCK\" | grep -cF 'cargo build --workspace --release --target x86_64-unknown-linux-musl')\" -eq 0 && echo 'ok: install musl build is package-scoped'"
    timeout_ms: 3000
    expected_behavior: "ok: install musl build is package-scoped"

  - step: "evidence bundle reuses completed CI results"
    command: "grep -F 'generate-evidence-bundle.sh\" --reuse-ci-results' build.sh && grep -F -- '--reuse-ci-results) REUSE_CI_RESULTS=true' scripts/generate-evidence-bundle.sh && grep -F 'Reusing cargo test results from pre-build CI' scripts/generate-evidence-bundle.sh && grep -F 'Reusing completed CI litmus phase logs' scripts/generate-evidence-bundle.sh && echo 'ok: evidence reuse enabled'"
    timeout_ms: 3000
    expected_behavior: "ok: evidence reuse enabled"

  - step: "evidence bundle litmus totals use phase summaries"
    command: "bash scripts/test-evidence-bundle-litmus-summary.sh"
    timeout_ms: 3000
    expected_behavior: "ok: evidence bundle litmus summary parser"


  # ORDER 1003-444f. The gate's test step must stay DERIVED. Until this order it
  # ran `-p tillandsias-plan` — one crate of 22 — and the other 21 were neither
  # run nor named, so their silence read as a pass. Measured before the fix: a
  # deliberately-failing test in tillandsias-core left `./build.sh --check` at
  # rc=0, in a run that printed `Checking tillandsias-core`. Compiled, never
  # run. Measured after: the same probe returns rc=1.
  #
  # The pin is on --workspace SPECIFICALLY, not on "some crates are tested",
  # because the failure mode this order closes is a HAND-MAINTAINED SET. The
  # in-tree precedent says so in its own words: `--lib` was dropped from this
  # step on 2026-08-22 after scoping it to one target "recreated that blind
  # spot inside the fix". A crate list is that mistake with more entries — it
  # goes stale silently the day someone adds a crate, and the crate nobody
  # remembered is the one that needed covering. --workspace makes cargo the
  # enumerator, so a new member is covered the day it lands.
  - step: "the gate's test step is workspace-derived, never an enumerated crate list"
    command: "awk '/_step \"Running workspace tests/,/tee \\\"\\$_WS_TEST_TRANSCRIPT\\\"/' build.sh > /tmp/ws-step.$$; /usr/bin/grep -q -- '--workspace' /tmp/ws-step.$$ || { echo 'FAIL: the gate test step is no longer --workspace'; rm -f /tmp/ws-step.$$; exit 1; }; /usr/bin/grep -qE -- '-p tillandsias-[a-z-]+' /tmp/ws-step.$$ && { echo 'FAIL: the gate test step names an individual crate — the set must stay derived (1003-444f)'; rm -f /tmp/ws-step.$$; exit 1; }; rm -f /tmp/ws-step.$$; echo 'ok: workspace-derived'"
    timeout_ms: 5000
    expected_behavior: "ok: workspace-derived"

  # A ratchet compares FAILURE SETS, so the set must be a function of the tree.
  #
  # THIS ARM USED TO ASSERT --test-threads=1 WAS PRESENT, and 1021-hf9e inverted
  # it. The pin was a MITIGATION for shared process-global state, and that state
  # is now REMOVED: host_mount and the gitconfig cache root are parameters, and
  # the tests that redirected them by writing HOME no longer touch it.
  #
  # MEASURED on yoga 2026-09-16 at one commit, default (parallel) runs:
  #   headless bin suite, TEN runs  -> 544 passed, identical empty set each time
  #   cargo test --workspace, FIVE  -> 74 result lines, zero failures, identical
  # The set is a function of the tree again, so the ratchet gets what it needs
  # without the pin — and the speed argument inverted with it, since serial was
  # only faster while the contention cost more than the threads won (the bin
  # suite is now 1.9s parallel against 4.7s serial).
  #
  # THE OTHER SERIAL STEP STAYS AND THIS ARM DOES NOT COVER IT. The
  # `--features tray,listen-vsock` invocation further down build.sh is still
  # pinned, because that feature build was MEASURED SEPARATELY and still
  # contends: five parallel runs gave one failure of
  # tray::tests::mcp_connection_serves_browser_family_over_the_socket
  # (left: Null, right: "tillandsias-host-services") and four clean. Different
  # feature set, different global, no evidence to drop it — and none of the runs
  # above compiled that code at all.
  #
  # THE CHECK IGNORES COMMENT LINES (`^[^#]*`) AND THAT IS LOAD-BEARING. The
  # first version of this inverted arm grepped for the bare flag and FAILED
  # IMMEDIATELY — on build.sh's own prose explaining when restoring the pin
  # would be the right move. A mention is not an invocation; a guard that
  # cannot tell them apart reports the documentation as the defect.
  - step: "the gate's workspace test step is PARALLEL and runs to completion (1021-hf9e)"
    command: "awk '/_step \"Running workspace tests/,/tee \\\"\\$_WS_TEST_TRANSCRIPT\\\"/' build.sh > /tmp/ws-step2.$$; ok=1; /usr/bin/grep -qE '^[^#]*--test-threads=1' /tmp/ws-step2.$$ && { echo 'FAIL: the serial pin is back — it was a mitigation for shared state that 1021-hf9e removed; if the set went non-deterministic again the defect is new shared state, not this flag'; ok=0; }; /usr/bin/grep -q -- '--no-fail-fast' /tmp/ws-step2.$$ || { echo 'FAIL: missing --no-fail-fast — a suite that stops early hides its tail (829-g4xf)'; ok=0; }; rm -f /tmp/ws-step2.$$; [ \"$ok\" = 1 ] || exit 1; echo 'ok: parallel and to-completion'"
    timeout_ms: 5000
    expected_behavior: "ok: parallel and to-completion"

observability:
  traces:
    - "@trace spec:dev-build"
  expected_log: "ci-full install has one local-ci process, direct post/runtime dispatch, no debug-build fallthrough, package-scoped Linux musl build, no evidence reruns, and evidence litmus totals come from phase summaries"
  log_fields:
    spec: "dev-build"
    test: "build-ci-dispatch-shape"

rollback:
  on_failure: "inspect build.sh phase dispatch and scripts/generate-evidence-bundle.sh reuse mode"
  command: "grep -n 'local-ci.sh\\|_run_litmus_phase\\|reuse-ci-results\\|litmus_count_\\|Default: debug build' build.sh scripts/generate-evidence-bundle.sh"
