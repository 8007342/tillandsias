# @trace spec:meta-orchestration
name: litmus:meta-orchestration-opsx-sync-merge
spec: meta-orchestration
phase: pre-build
description: >
  Pin how a cycle treats launch-generated opsx dirt (order 1440-w8g8, reversing
  order 540's sync-merge): a checkout whose only status-visible dirt is the
  deterministic 22-path opsx/openspec regeneration from the openspec CLI reads
  launch-dirt:opsx-only (exit 5), a REFUSAL; the cycle commits nothing and the
  dirt is preserved; no skill, script, methodology or image file tells an agent
  to commit it. Any non-opsx dirt still fails closed byte-identically. The name
  is kept because litmus-bindings.yaml binds it. See
  plan/issues/forge-opsx-skill-sync-dirties-checkout-2026-07-31.md.
severity: critical
size: instant

preconditions:
  - workspace contains scripts/check-opsx-generated-dirt.sh
  - workspace contains scripts/test-check-opsx-generated-dirt.sh
  - workspace contains scripts/test-meta-orchestration-opsx-sync-merge.sh
  - workspace contains scripts/meta-orchestration-worktree-guard.sh
  - workspace contains scripts/test-meta-orchestration-dirty-tree-safety.sh

critical_path:
  - step: "opsx detector and its fixtures are executable"
    command: "test -x scripts/check-opsx-generated-dirt.sh && test -x scripts/test-check-opsx-generated-dirt.sh && test -x scripts/test-meta-orchestration-opsx-sync-merge.sh && echo 'ok: executable'"
    timeout_ms: 1000
    expected_behavior: "ok: executable"

  - step: "scripts parse under bash"
    command: "bash -n scripts/check-opsx-generated-dirt.sh scripts/test-check-opsx-generated-dirt.sh scripts/test-meta-orchestration-opsx-sync-merge.sh && echo 'ok: syntax'"
    timeout_ms: 1000
    expected_behavior: "ok: syntax"

  - step: "detector verdict branches (launch-dirt / non-opsx / clean-tree)"
    command: "scripts/test-check-opsx-generated-dirt.sh"
    timeout_ms: 10000
    expected_behavior: "PASS: check-opsx-generated-dirt branches 1-3 proven"

  - step: "launch opsx dirt is refused through the real guard, never committed"
    # 90s, sized for the SLOWEST host: the fixture's git-heavy scenario chain
    # PASSES on windows in ~18s standalone (measured 2026-08-16) but the old
    # 10s budget was priced on linux. Same treatment as 770-f6u4; see
    # plan/issues/windows-red-meta-orchestration-litmus-2026-08-16.md.
    command: "scripts/test-meta-orchestration-opsx-sync-merge.sh"
    timeout_ms: 90000
    expected_behavior: "PASS: 1440-w8g8 launch opsx dirt refused, never committed (a)-(d)"

  - step: "ordinary dirty-start fixture stays byte-identical fail-closed"
    # 90s: same fixture as dirty-tree-safety's step above, same 9.4s windows
    # measurement (2026-08-16) sitting AT the old 10s boundary.
    command: "scripts/test-meta-orchestration-dirty-tree-safety.sh"
    timeout_ms: 90000
    expected_behavior: "PASS: blocked cycle preserved startup tracked and untracked bytes"
    assert_output_contains: "PASS: blocked cycle preserved startup tracked and untracked bytes"

observability:
  traces:
    - "@trace spec:meta-orchestration"
  expected_log: "1440-w8g8 launch opsx dirt refused, never committed (a)-(d)"
  log_fields:
    spec: "meta-orchestration"
    test: "meta-orchestration-opsx-sync-merge"
    artifact: "scripts/check-opsx-generated-dirt.sh refusal + skill wiring"

rollback:
  on_failure: >
    Refuse the cycle on any startup dirt (launch-dirt or non-opsx) and
    preserve its bytes; never commit launch-generated opsx files.
  command: "scripts/test-meta-orchestration-dirty-tree-safety.sh"
