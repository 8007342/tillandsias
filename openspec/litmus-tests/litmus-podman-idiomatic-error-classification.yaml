# @trace spec:podman-idiomatic-patterns
name: litmus:podman-idiomatic-error-classification
spec: podman-idiomatic-patterns
phase: pre-build
description: Verify PodmanError.is_transient() classifies network errors as retryable and permanent errors as fatal
severity: critical
size: instant

preconditions:
  - workspace contains crates/tillandsias-podman with client.rs PodmanError enum
  - is_transient() method exists on PodmanError type
  - cargo is available in PATH

critical_path:
  - step: "verify is_transient() method exists on PodmanError"
    command: "grep -F 'pub fn is_transient(&self) -> bool' crates/tillandsias-podman/src/client.rs"
    timeout_ms: 5000
    expected_behavior: "pub fn is_transient(&self) -> bool"

  - step: "verify PodmanError enum has StreamError variant"
    command: "grep -F 'StreamError' crates/tillandsias-podman/src/client.rs"
    timeout_ms: 5000
    expected_behavior: "StreamError"

  - step: "verify PodmanError enum has CommandFailed variant"
    command: "grep -F 'CommandFailed' crates/tillandsias-podman/src/client.rs"
    timeout_ms: 5000
    expected_behavior: "CommandFailed"

  - step: "verify PodmanError enum has NotFound variant"
    command: "grep -F 'NotFound' crates/tillandsias-podman/src/client.rs"
    timeout_ms: 5000
    expected_behavior: "NotFound"

  - step: "verify PodmanError enum has ParseError variant"
    command: "grep -F 'ParseError' crates/tillandsias-podman/src/client.rs"
    timeout_ms: 5000
    expected_behavior: "ParseError"

  - step: "verify is_transient() handles StreamError as transient"
    # ORDER 925-erjs. Was `grep -A 30 'pub fn is_transient' … | grep '<token>'`.
    # Two defects in one line: a 30-line WINDOW that any inserted comment could
    # push the arm out of, and an assertion that only looked for the type NAME —
    # it passed whether the arm mapped to true or to false, so it could not fail
    # if the classification INVERTED. Now: the function body bounded by syntax
    # (11 lines, not 30), and the arm's actual mapping.
    # NEGATIVE CONTROL (verified 2026-08-29 on a mutated copy): flipping this
    # arm to `=> false` fails the step. The old form passed either way.
    command: "blk=$(awk '/pub fn is_transient/,/^    }$/' crates/tillandsias-podman/src/client.rs); printf '%s' \"$blk\" | grep -qE 'StreamError\\(_\\) *=> *true' && echo 'ok: StreamError transient'"
    timeout_ms: 5000
    expected_behavior: "ok: StreamError transient"

  - step: "verify is_transient() handles timeout errors"
    # ORDER 925-erjs. Was `grep -A 30 'pub fn is_transient' … | grep '<token>'`.
    # Two defects in one line: a 30-line WINDOW that any inserted comment could
    # push the arm out of, and an assertion that only looked for the type NAME —
    # it passed whether the arm mapped to true or to false, so it could not fail
    # if the classification INVERTED. Now: the function body bounded by syntax
    # (11 lines, not 30), and the arm's actual mapping.
    # The literal predicate, not the bare word: `timeout` also appears in
    # comments and in neighbouring functions the old window reached.
    command: "blk=$(awk '/pub fn is_transient/,/^    }$/' crates/tillandsias-podman/src/client.rs); printf '%s' \"$blk\" | grep -qF 'msg.contains(\"timeout\")' && echo 'ok: timeout transient'"
    timeout_ms: 5000
    expected_behavior: "ok: timeout transient"

  - step: "verify is_transient() handles NotFound as permanent"
    # ORDER 925-erjs. Was `grep -A 30 'pub fn is_transient' … | grep '<token>'`.
    # Two defects in one line: a 30-line WINDOW that any inserted comment could
    # push the arm out of, and an assertion that only looked for the type NAME —
    # it passed whether the arm mapped to true or to false, so it could not fail
    # if the classification INVERTED. Now: the function body bounded by syntax
    # (11 lines, not 30), and the arm's actual mapping.
    # This one nested a SECOND window inside the first (`| grep -A 5 'NotFound'
    # | grep 'false'`), so it passed on any `false` within five lines of the
    # name — including one belonging to another arm.
    # NEGATIVE CONTROL (verified): flipping the arm to `=> true` fails it.
    command: "blk=$(awk '/pub fn is_transient/,/^    }$/' crates/tillandsias-podman/src/client.rs); printf '%s' \"$blk\" | grep -qE 'NotFound\\(_\\).*=> *false' && echo 'ok: NotFound permanent'"
    timeout_ms: 5000
    expected_behavior: "ok: NotFound permanent"

  - step: "verify is_transient() handles ParseError as permanent"
    # ORDER 925-erjs. Was `grep -A 30 'pub fn is_transient' … | grep '<token>'`.
    # Two defects in one line: a 30-line WINDOW that any inserted comment could
    # push the arm out of, and an assertion that only looked for the type NAME —
    # it passed whether the arm mapped to true or to false, so it could not fail
    # if the classification INVERTED. Now: the function body bounded by syntax
    # (11 lines, not 30), and the arm's actual mapping.
    # NEGATIVE CONTROL (verified): flipping the arm to `=> true` fails it.
    command: "blk=$(awk '/pub fn is_transient/,/^    }$/' crates/tillandsias-podman/src/client.rs); printf '%s' \"$blk\" | grep -qE 'ParseError\\(_\\).*=> *false' && echo 'ok: ParseError permanent'"
    timeout_ms: 5000
    expected_behavior: "ok: ParseError permanent"

observability:
  traces:
    - "@trace spec:podman-idiomatic-patterns"
  expected_log: "Error classification verified: StreamError/timeout as transient, NotFound/ParseError as permanent"
  log_fields:
    spec: "podman-idiomatic-patterns"
    test: "podman-idiomatic-error-classification"
    requirement: "podman-idiomatic-patterns.errors.retry-discrimination@v1"

rollback:
  on_failure: "inspect PodmanError enum and is_transient() implementation in client.rs"
  command: "grep -B 5 -A 35 'pub fn is_transient' crates/tillandsias-podman/src/client.rs"
