# @trace spec:meta-orchestration
# @trace order:743-y5wh, order:741-3y48
#
# Pins the checkout-sourced startup-context addendum. The startup context is
# generated by a script BAKED INTO THE FORGE IMAGE, so a warning added to its
# heredoc reaches running forges only after a rebuild. Measured 2026-08-15: the
# "THIS CHECKOUT IS EPHEMERAL" guard was added to the generator, and the very
# next launch produced a startup context without it because the running image
# predated the commit. For descriptive state that delay is fine; for a fail-loud
# guard it is the entire failure — the warning existed, was correct, and reached
# nobody. This test pins the two surfaces that cannot go stale: an addendum read
# from the MOUNTED CHECKOUT at launch, and AGENTS.md.
name: litmus:startup-context-addendum-shape
spec: meta-orchestration
phase: pre-build
description: >
  Pin the checkout-sourced startup-context addendum (order 743-y5wh): the
  generator appends images/default/startup-context-addendum.md from the mounted
  checkout, the append is fail-soft, the addendum carries the findings-persistence
  gate, and AGENTS.md states the rule at checkout level so it is live in every
  forge without an image rebuild.
severity: high
size: instant

preconditions:
  - workspace contains images/default/lib-common.sh
  - workspace contains images/default/startup-context-addendum.md
  - workspace contains AGENTS.md
  - shell utilities (grep, bash, mktemp) are available in PATH

critical_path:
  - step: "the addendum file exists and carries the findings-persistence gate"
    command: "test -f images/default/startup-context-addendum.md && grep -q 'check-forge-findings-persisted.sh' images/default/startup-context-addendum.md && grep -qi 'did not PUSH' images/default/startup-context-addendum.md && echo 'ok: addendum-carries-gate'"
    timeout_ms: 3000
    expected_behavior: "ok: addendum-carries-gate"

  - step: "the generator appends the addendum from the MOUNTED CHECKOUT, not from image content"
    # $project_dir is the mounted checkout. Reading the addendum from anywhere
    # under the image (e.g. /usr/local/lib/...) would reintroduce the staleness
    # this packet exists to remove.
    command: "grep -q 'project_dir/images/default/startup-context-addendum.md' images/default/lib-common.sh && echo 'ok: appended-from-checkout'"
    timeout_ms: 3000
    expected_behavior: "ok: appended-from-checkout"

  - step: "the append is fail-soft — a missing or unreadable addendum never breaks a launch"
    # Off-Tillandsias projects have no addendum at all, and a documentation
    # append must never be able to take down a forge launch.
    command: "grep -A4 'startup-context-addendum.md' images/default/lib-common.sh | grep -q '\\-r ' && grep -A10 'startup-context-addendum.md' images/default/lib-common.sh | grep -q '|| true' && echo 'ok: fail-soft'"
    timeout_ms: 3000
    expected_behavior: "ok: fail-soft"

  - step: "the append lands AFTER the generated context, so it cannot be truncated by the heredoc"
    command: "ctx=$(grep -n 'CONTEXT_EOF' images/default/lib-common.sh | tail -1 | cut -d: -f1); add=$(grep -n 'project_dir/images/default/startup-context-addendum.md' images/default/lib-common.sh | head -1 | cut -d: -f1); [ \"$add\" -gt \"$ctx\" ] && echo \"ok: addendum-after-heredoc (ctx=$ctx add=$add)\" || { echo \"FAIL: addendum at $add is not after heredoc end $ctx\"; exit 1; }"
    timeout_ms: 3000
    expected_behavior: "ok: addendum-after-heredoc"

  - step: "appending an addendum to a generated context yields a file carrying the gate (functional)"
    # Exercises the append semantics themselves against real files, so the pin is
    # not purely structural.
    command: "d=$(mktemp -d); printf '# Forge Startup Context\\n\\n## Plan entry points\\n' > \"$d/ctx.md\"; { printf '\\n'; cat images/default/startup-context-addendum.md; } >> \"$d/ctx.md\"; grep -q 'check-forge-findings-persisted.sh' \"$d/ctx.md\" && grep -q 'Forge Startup Context' \"$d/ctx.md\" && echo 'ok: append-preserves-both' || { echo FAIL; rm -rf \"$d\"; exit 1; }; rm -rf \"$d\""
    timeout_ms: 8000
    expected_behavior: "ok: append-preserves-both"

  - step: "AGENTS.md states the rule at CHECKOUT level (live without an image rebuild)"
    # The surface that cannot be stale. An agent whose only bootstrap is the
    # checkout must still meet the gate.
    command: "grep -q 'check-forge-findings-persisted.sh' AGENTS.md && grep -qi 'did not PUSH is a finding you destroyed' AGENTS.md && echo 'ok: agents-md-states-rule'"
    timeout_ms: 3000
    expected_behavior: "ok: agents-md-states-rule"

  - step: "AGENTS.md explains WHY the rule lives in the checkout rather than the image"
    # Without the rationale the next editor moves it back into the baked
    # generator, which is exactly how 743-y5wh happened.
    command: "grep -q '743-y5wh' AGENTS.md && grep -qi 'image rebuild' AGENTS.md && echo 'ok: rationale-recorded'"
    timeout_ms: 3000
    expected_behavior: "ok: rationale-recorded"

observability:
  traces:
    - "@trace spec:meta-orchestration"
    - "@trace order:743-y5wh"
  expected_log: "checkout-sourced startup-context addendum pinned (append wiring + fail-soft + AGENTS.md checkout-level rule)"
  log_fields:
    spec: "meta-orchestration"
    test: "startup-context-addendum-shape"
    artifact: "images/default/lib-common.sh + images/default/startup-context-addendum.md + AGENTS.md"

rollback:
  on_failure: >
    The checkout-sourced startup-context addendum drifted. Restore
    images/default/startup-context-addendum.md carrying the findings-persistence
    gate, restore inject_startup_context's fail-soft append of
    "$project_dir/images/default/startup-context-addendum.md" AFTER the
    CONTEXT_EOF heredoc, and restore the checkout-level statement of the rule in
    AGENTS.md. Do NOT move the guard back into the heredoc: that content is baked
    into the image and a fail-loud guard added there reaches running forges only
    after a rebuild (order 743-y5wh).
  command: "grep -n 'startup-context-addendum' images/default/lib-common.sh; grep -n 'check-forge-findings-persisted' AGENTS.md images/default/startup-context-addendum.md"
