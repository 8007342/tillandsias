# @trace order:2098-i5fr, order:2096-pq2g, spec:ci-release
name: litmus:unreferenced-lane-fixtures-run
spec: ci-release
description: >
  ORDER 2098-i5fr (family A of 2096-pq2g, part 3). Sixteen hermetic shell
  fixtures for the land, push, litmus, smoke and launcher lanes were green and
  meaningful, but nothing that runs on its own ever ran them, so
  scripts/check-added-test-is-referenced.sh counted them in its standing
  total. Each pins a regression named in its header. This litmus runs each one
  and requires its own verdict line. Measured green on macuahuitl 2026-11-17,
  one at a time under a 6 GiB cap.
severity: high
size: quick
phase: pre-build
preconditions:
  - workspace contains scripts/check-added-test-is-referenced.sh
critical_path:
  - step: "a blocked push is refused within a bound, not silence"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-land-push-bounded.lua 2>&1"
    expected_behavior: "ok:land-push-bounded:"
    assert_exit: 0
    assert_output_contains: "ok:land-push-bounded:"
    timeout_ms: 180000
  - step: "litmus diff-scoped selection runs the full suite on every uncertainty"
    command: "bash scripts/test-litmus-diff-scope.sh 2>&1"
    expected_behavior: "ok: litmus diff-scope fixtures green"
    assert_exit: 0
    assert_output_contains: "ok: litmus diff-scope fixtures green"
    timeout_ms: 120000
  - step: "a fabricated skip after a failure stays red"
    command: "bash scripts/test-litmus-terminal-verdict.sh 2>&1"
    expected_behavior: "ok:litmus-terminal-verdict:"
    assert_exit: 0
    assert_output_contains: "ok:litmus-terminal-verdict:"
    timeout_ms: 120000
  - step: "orchestrate-enclave Step 5 launches the forge"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-orchestrate-enclave.lua 2>&1"
    expected_behavior: "ok:orchestrate-enclave:6 arms"
    assert_exit: 0
    assert_output_contains: "ok:orchestrate-enclave:6 arms"
    timeout_ms: 120000
  - step: "an invented order suffix is refused"
    command: "bash scripts/test-order-citations-resolve.sh 2>&1"
    expected_behavior: "PASS: order-citations-resolve"
    assert_exit: 0
    assert_output_contains: "PASS: order-citations-resolve"
    timeout_ms: 120000
  - step: "a failing compiler wrapper does not red the plan binary refresh"
    command: "P=$(. scripts/plan-binary-probe.sh && resolve_plan_binary) && TILLANDSIAS_PLAN_BIN=\"$P\" \"$P\" script run scripts/lua/test-plan-binary-survives-wrapper.lua 2>&1"
    expected_behavior: "ok:plan-binary-survives-wrapper:3 arms"
    assert_exit: 0
    assert_output_contains: "ok:plan-binary-survives-wrapper:3 arms"
    timeout_ms: 120000
  - step: "a path deleted on both sides is agreement in the plan lane"
    command: "bash scripts/test-plan-lane-agreeing-deletion.sh 2>&1"
    expected_behavior: "ok:plan-lane-agreeing-deletion:"
    assert_exit: 0
    assert_output_contains: "ok:plan-lane-agreeing-deletion:"
    timeout_ms: 120000
  - step: "release-tier timer renders the unit the release gates on"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-release-tier-timer-render.lua 2>&1"
    expected_behavior: "ok:release-tier-timer-render:"
    assert_exit: 0
    assert_output_contains: "ok:release-tier-timer-render:"
    timeout_ms: 120000
  - step: "./repeat passes --model and --effort to claude"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-repeat-model-flag.lua 2>&1"
    expected_behavior: "ok:repeat-model-flag:"
    assert_exit: 0
    assert_output_contains: "ok:repeat-model-flag:"
    timeout_ms: 120000
  - step: "shared target dir lock and freshness guard"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-shared-target.lua 2>&1"
    expected_behavior: "ok: arm8"
    assert_exit: 0
    assert_output_contains: "ok: arm8"
    timeout_ms: 300000
  - step: "skills have a single source"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-skills-single-source.lua 2>&1"
    expected_behavior: "ok:skills-single-source-fixture:15 arms"
    assert_exit: 0
    assert_output_contains: "ok:skills-single-source-fixture:15 arms"
    timeout_ms: 120000
  - step: "smoke evidence dir is fresh per run"
    command: "bash scripts/test-smoke-evidence-dir-is-fresh.sh 2>&1"
    expected_behavior: "ok:smoke-evidence-dir-is-fresh:"
    assert_exit: 0
    assert_output_contains: "ok:smoke-evidence-dir-is-fresh:"
    timeout_ms: 120000
  - step: "a cold-host forge lane names its guard-stop"
    command: "bash scripts/test-smoke-forge-lane-cold-host-outcome.sh 2>&1"
    expected_behavior: "ok:smoke-forge-lane-cold-host-outcome:"
    assert_exit: 0
    assert_output_contains: "ok:smoke-forge-lane-cold-host-outcome:"
    timeout_ms: 120000
  - step: "spec-index endpoint failures are classified"
    command: "bash scripts/test-spec-index-endpoint-classification.sh 2>&1"
    expected_behavior: "ok:spec-index-endpoint-classification-fixture:"
    assert_exit: 0
    assert_output_contains: "ok:spec-index-endpoint-classification-fixture:"
    timeout_ms: 120000
  - step: "timing clock has sub-second resolution off GNU date"
    command: "bash scripts/test-timing-clock-resolution.sh 2>&1"
    expected_behavior: "ok:timing-clock-resolution:"
    assert_exit: 0
    assert_output_contains: "ok:timing-clock-resolution:"
    timeout_ms: 120000
  - step: "uninstall removes only its own PATH block"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-uninstall-path-block.lua 2>&1"
    expected_behavior: "ok:uninstall-path-block:6 arms"
    assert_exit: 0
    assert_output_contains: "ok:uninstall-path-block:6 arms"
    timeout_ms: 120000
