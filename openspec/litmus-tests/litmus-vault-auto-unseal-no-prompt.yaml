# @trace spec:tillandsias-vault
name: litmus:vault-auto-unseal-no-prompt
spec: tillandsias-vault
phase: 6.5
description: >
  VM boots, vault container auto-unseals from host-OS-keychain-stored key,
  and 'vault status' reports sealed=false within 5s of vault container start.
  Plaintext init.json and root.token MUST NOT exist on the persistent volume.
  At no point may a user-visible prompt (NSWindow, MessageBox, terminal
  password prompt, file dialog) surface. Exercises the no-passphrase-prompt-ever
  invariant.
severity: critical
size: e2e

preconditions:
  - VM is provisioned with the vault container image present (tillandsias-vault)
  - host has the unseal key stored in the native OS keychain
  - test runs in a non-interactive environment (no TTY by default) — any prompt will surface as a hang or error

caveats:
  - requires_provisioned_vault: "Run after the vault POC is built into the in-VM enclave"
  - skip_on_unsupported: "Skip with exit 77 on hosts where vault container is unavailable"

critical_path:
  - step: "start the VM with no TTY attached (any prompt will hang)"
    phase: runtime
    command: "bash -lc 'cargo run -p tillandsias-host-shell --example start-vm-headless 2>&1 | tee /tmp/litmus-vault-boot.log &'"
    timeout_ms: 5000
    run_in_background: true
    expected_behavior: "launches the VM detached, teeing boot output to /tmp/litmus-vault-boot.log"
    # ORDER 1282-rkkm / 1293-wka4. THE assert_exit HERE WAS MINE AND IT WAS
    # VACUOUS, so it is removed rather than left looking like a check. I added it
    # under 1252-znbn criterion 4 believing it was the faithful translation of
    # the prose. It is not: the whole pipeline is backgrounded with `&` inside
    # this step's own `bash -lc`, so the shell returns 0 the instant it forks —
    # whatever `cargo run` then does. It asserted that a shell started.
    #
    # 1293-wka4 names the general form: a step's child shell does not inherit
    # pipefail, so assert_exit adjudicates the LAST element of a pipeline rather
    # than the producer that matters. Here even that is moot, because nothing is
    # waited on at all.
    #
    # NOT REPLACED BY AN ASSERTION ON THE BOOT LOG, and the reason is the same
    # asynchrony: at the moment this step returns, the log may be empty or
    # absent, so any content assertion here would be a race rather than a check.
    # The launch IS verified — by the next step, which waits up to 60s for the
    # vsock handshake and asserts on THAT. A launcher step whose success is
    # established by its successor should say so instead of carrying a check
    # that cannot fail.

  - step: "wait up to 60s for VM ready (vsock handshake)"
    phase: runtime
    command: "cargo run -p tillandsias-host-shell --example wait-vm-ready -- --timeout-secs 60"
    timeout_ms: 65000
    expected_behavior: "succeeds (VM is up and tillandsias-headless is listening on vsock)"
    assert_exit: 0

  - step: "vault is sealed=false within 5s of container start"
    phase: runtime
    command: "bash -lc 'T_CONTAINER_START=$(cargo run -p tillandsias-host-shell --example replay-audit-log -- --grep \"container=tillandsias-vault.*started\" --format ts); T_UNSEAL=$(cargo run -p tillandsias-host-shell --example vm-exec -- vault status -format=json 2>/dev/null | cargo run --quiet -p tillandsias-policy -- vault-unsealed-epoch); DELTA=$((T_UNSEAL-T_CONTAINER_START)); [[ $DELTA -le 5 ]] && echo \"OK: unseal in ${DELTA}s\" || (echo \"FAIL: unseal took ${DELTA}s > 5s\"; exit 1)'"
    timeout_ms: 15000
    expected_behavior: "succeeds; delta <= 5s"
    assert_exit: 0

  - step: "no passphrase prompt surfaced (host process did not block on TTY or window)"
    phase: runtime
    command: "bash -lc '! grep -qiE \"passphrase|password|unseal key|enter unseal\" /tmp/litmus-vault-boot.log && ! pgrep -af \"^(pinentry|ssh-askpass|/usr/lib/seahorse|osascript.*password)\" >/dev/null && echo \"OK: no prompt\"'"
    timeout_ms: 5000
    expected_behavior: "succeeds (no prompt-related processes, no prompt strings in log)"
    assert_exit: 0

  - step: "unseal key is on tmpfs and absent from persistent disk"
    phase: runtime
    command: "bash -lc 'cargo run -p tillandsias-host-shell --example vm-exec -- bash -c \"findmnt /run/secrets | grep -q tmpfs && ! find /vault /etc -type f -exec grep -l 'unseal' {} + 2>/dev/null | grep -v audit\" && echo \"OK\"'"
    timeout_ms: 10000
    expected_behavior: "succeeds (unseal key path on tmpfs; no persistent file contains the key)"
    assert_exit: 0

  - step: "bootstrap artifacts (init.json, root.token) are deleted from disk"
    phase: runtime
    command: "bash -lc 'cargo run -p tillandsias-host-shell --example vm-exec -- bash -c \"[ ! -f /vault/data/init.json ] && [ ! -f /vault/data/root.token ]\" && echo \"OK\"'"
    timeout_ms: 5000
    expected_behavior: "succeeds (files removed after first boot handover)"
    assert_exit: 0

observability:
  traces:
    - "@trace spec:tillandsias-vault"
    - "@trace spec:host-shell-architecture"
  expected_log: "Vault unseals within 5s of container start with no user prompt; unseal key never touches disk"
  log_fields:
    spec: "tillandsias-vault"
    test: "vault-auto-unseal-no-prompt"

rollback:
  on_failure: "if vault stays sealed, inspect the in-VM init script that derives the HKDF key (check /etc/machine-id readability and the vsock-delivered installation-uuid). If a prompt surfaces, the auto-unseal flow is broken — VAULT_TOKEN env or vault init script may be requesting interactive input."
  command: "bash -lc 'cargo run -p tillandsias-host-shell --example vm-exec -- vault status; cat /tmp/litmus-vault-boot.log'"
