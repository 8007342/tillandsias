# @trace spec:ci-release, order:1305-udgs
name: litmus:preflight-front-door
spec: ci-release
phase: pre-build
size: quick
severity: high
description: >
  ORDER 1305-udgs. `./build.sh --preflight` runs every guard that can refuse a
  push — enumerated from the three rosters a guard can be wired into (the fast
  tier's own list, scripts/gate-steps.d/*.step, and the pre-push lane's checks),
  never curated. A list assembled from what has bitten people is not the set of
  guards that exist: esme's 1303 litmus was refused on 2026-09-20 by
  check-litmus-expression-pinning-added (634-39ik), absent from every list any
  host assembled that day, including an eighteen-entry one written an hour
  earlier.

  EVERY ARM REPRODUCES A DEFECT THIS DOOR ACTUALLY HAD, all measured on pirria
  the day it was built: it started the dev proxy container and took 51s because
  the dispatch sat after the build's setup; it ATE ITS OWN WORKLIST, because
  guards ran inside a `while read` loop over a heredoc and a guard that reads
  stdin consumed the roster, so the door hung with no output at all; and it
  scored a NAMED SKIP as a refusal (`skip:not-darwin` from a Darwin-only
  fixture) — 1309-fhxb's shape inside the fix for 1305, written by the host that
  filed 1309-fhxb the same evening.

  THE WALL-CLOCK BUDGET IS THE CONTRACT. A front door is a thing people run
  instead of thinking, so one that grows slow is one nobody runs; the budget arm
  makes a guard that grows slow red THAT ARM, with its name, rather than
  silently making the door useless (it is judged on the --daily-full gate). The budget is SET from a
  measurement and the standing no-raise rule applies from the day it lands.
preconditions:
  - workspace contains scripts/lua/test-preflight-front-door.lua
  - build.sh accepts --preflight

critical_path:
  # 2272-cuxh: the fixture runs the door several times (14-44 min by host), so
  # only the land queue's --daily-full gate runs it LIVE, through gate step 928.
  # Here the live switch is unset on purpose: under --daily-full it is exported,
  # and a second live run would outlast this step. What this pins is that the
  # plain run says so by name (never ok:, never silence) ...
  - step: "without the live switch the fixture names itself not-run, rc 0"
    command: "env -u TILLANDSIAS_FRONT_DOOR_LIVE -u FRONT_DOOR_SCRATCH \"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-preflight-front-door.lua"
    timeout_ms: 30000
    expected_behavior: "not-run:preflight-front-door"
    assert_exit: 0
    assert_output_contains: "not-run:preflight-front-door"

  # ... and that the gate that does run it live is wired: the step binds the
  # script, and the daily-full gate's own subshell exports the switch.
  - step: "the --daily-full gate runs it live through gate step 928"
    command: "grep -qx 'STEP_LUA=\"scripts/lua/test-preflight-front-door.lua\"' scripts/gate-steps.d/928-*.step && grep -E '^ *export .*TILLANDSIAS_FRONT_DOOR_LIVE=1; eval' scripts/land-queue.sh >/dev/null && echo 'ok: daily-full runs the front door live'"
    timeout_ms: 5000
    expected_behavior: "ok: daily-full runs the front door live"
    assert_exit: 0
    assert_output_contains: "ok: daily-full runs the front door live"
