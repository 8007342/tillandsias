# @trace spec:ci-release, order:1942-mijg
# GitHub restores an Actions cache only from the run's own ref or the default
# branch. Releases run on a fresh tag, so every cache a tag run saved was
# restorable by nobody (gh cache list 2026-11-01: refs/tags/v56.10.31.2,
# v56.11.1.1), and each release cold-built ~499 Nix derivations (67 min on
# v56.11.1.1). The 1916-nxcs cache_seed run that saves under main existed but
# nothing dispatched it. No trigger may be added (litmus:github-actions-budget),
# so the release skill dispatches the seed on main before the tag.
name: litmus:release-cache-is-saved-only-by-main
spec: ci-release
phase: pre-build
description: >
  Every cache save in release.yml is scoped to refs/heads/main, and the release
  skill dispatches the cache_seed run on main before it dispatches the tag; the
  check is red on the pre-fix workflow and skill.
severity: high
size: instant

preconditions:
  - workspace contains .github/workflows/release.yml and skills/merge-to-main-and-release/SKILL.md
  - git history contains b6f9282abc95d6d426b79d2b0fc55979575a943f (the pre-fix linux-next)

critical_path:
  - step: "release.yml saves only under main, and the skill seeds main before the tag"
    command: ". scripts/plan-binary-probe.sh; P=$(resolve_plan_binary) && \"$P\" script run scripts/lua/check-release-cache-scope.lua"
    timeout_ms: 5000
    expected_behavior: "ok:release-cache-scope:"

  - step: "the check refuses the pre-fix workflow (tag-scoped saves) and skill (no seed)"
    command: ". scripts/plan-binary-probe.sh; P=$(resolve_plan_binary) && d=target/litmus-release-cache-scope && mkdir -p \"$d\" && git show b6f9282abc95d6d426b79d2b0fc55979575a943f:.github/workflows/release.yml > \"$d/release.yml\" && git show b6f9282abc95d6d426b79d2b0fc55979575a943f:skills/merge-to-main-and-release/SKILL.md > \"$d/SKILL.md\" && v=$(\"$P\" script run scripts/lua/check-release-cache-scope.lua -- \"$d/release.yml\" \"$d/SKILL.md\"); grep -q 'unscoped-save=nix-save:true' <<<\"$v\" && grep -q 'no-main-producer=' <<<\"$v\" && echo 'ok: pre-fix refused'"
    timeout_ms: 5000
    expected_behavior: "ok: pre-fix refused"

failure_modes:
  - "a cache save goes back to save: true and a tag run spends the 10 GB quota on a cache nobody restores"
  - "the seed dispatch is dropped from the release skill, so main never saves and every release cold-builds"
  - "a push trigger is added to produce the main cache (refused by litmus:github-actions-budget instead)"
