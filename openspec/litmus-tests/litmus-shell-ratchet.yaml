# @trace spec:ci-release
# @trace order:1384-bxhk, order:1580-8hra
#
# Order 1384-bxhk: the Lua migration's forcing function and score. An available
# seam with no forcing function stays at one adopter (902-5bf9). The ratchet
# counts the shell corpus on every --check and refuses a NEW .sh decider, a new
# pipe site beyond a file's floor, and (once steps: exists) a new piped litmus
# command; its per-file floors only descend over their own git history.
name: litmus:shell-ratchet
spec: ci-release
phase: pre-build
description: >
  The one-line count grammar, with sh= equal to an independent find; a new
  check-*.sh refused naming script run; a new piped litmus command refused once
  steps: exists while a quoted pipe is accepted; a raised floor refused and an
  honest lowering accepted; an empty population could-not-run; allow_shell_strings
  counted; a new shell fixture and a new pipe site warned; a deleted file whose
  floor was not lowered refused as stale-floor (ARM 9, b211fd1d3); and the
  litmus arm unconditional with no steps: anywhere (NOSTEPS, 81950df3b). Every
  arm runs in a fresh scratch repo, so no arm encodes a moment.
severity: high
size: quick

preconditions:
  - workspace contains scripts/lua/test-shell-ratchet.lua (the Lua port of the
    retired scripts/test-shell-ratchet.sh, 1580-8hra)
  - a runnable tillandsias-plan that knows `script`, or the fixture answers could-not-run

critical_path:
  - step: "the fixture exists"
    command: "test -f scripts/lua/test-shell-ratchet.lua && echo 'ok: shell-ratchet-fixture-present'"
    timeout_ms: 5000
    expected_behavior: "ok: shell-ratchet-fixture-present"

  - step: "the ten arms hold"
    command: ". scripts/plan-binary-probe.sh; P=$(resolve_plan_binary) && TILLANDSIAS_PLAN_BIN=\"$P\" \"$P\" script run scripts/lua/test-shell-ratchet.lua"
    timeout_ms: 600000
    expected_behavior: "ok:shell-ratchet-fixture:10"
