# @trace order:2099-f982, order:2096-pq2g, spec:ci-release
name: litmus:unreferenced-slow-and-regime-fixtures-run
spec: ci-release
description: >
  ORDER 2099-f982 (family A of 2096-pq2g, part 4). The fixtures from the
  never-run family that are either slow (a whole-corpus census, a musl sidecar
  build, a cargo test run) or regime-dependent (macOS-only arms, a live nix
  cache). The plan-field-get CWD arm doubled an absolute binary path and is fixed
  here; the toolbox-refusal and signing-seam fixtures were ported to Lua with their
  own gate steps (2262-7t6f, 2111-inst) and are not repeated.
  A regime-dependent fixture ends in a NAMED skip, never a
  silent pass. The cargo-test fixture goes through with-tillandsias-builder.sh: an
  immutable host has no linker, and 0/10 rounds there says nothing about the lock.
severity: high
size: long
phase: pre-build
preconditions:
  - workspace contains scripts/check-added-test-is-referenced.sh
critical_path:
  - step: "the sigpipe census empty-tree mode discriminates"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-census-sigpipe-verdict-pipelines.lua 2>&1"
    expected_behavior: "ok:census-sigpipe-verdict-fixture:[0-9]+"
    assert_exit: 0
    assert_output_matches: "ok:census-sigpipe-verdict-fixture:[0-9]+"
    timeout_ms: 900000
  - step: "the musl sidecar build ignores a failing RUSTC_WRAPPER"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-sidecar-ignores-rustc-wrapper.lua 2>&1"
    expected_behavior: "ok:sidecar-ignores-rustc-wrapper:"
    assert_exit: 0
    assert_output_matches: "ok:sidecar-ignores-rustc-wrapper:"
    timeout_ms: 900000
  - step: "one crate-wide ENV_LOCK in tillandsias-headless"
    command: "bash scripts/with-tillandsias-builder.sh bash scripts/test-headless-env-lock-is-single.sh 2>&1"
    expected_behavior: "ok:headless-env-lock:[0-9]+"
    assert_exit: 0
    assert_output_matches: "ok:headless-env-lock:[0-9]+"
    timeout_ms: 600000
  - step: "field-get ternary and CWD ledger resolution"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-plan-field-get.lua 2>&1"
    expected_behavior: "ok:plan-field-get:[0-9]+|skip:plan-field-get:"
    assert_exit: 0
    assert_output_matches: "ok:plan-field-get:[0-9]+|skip:plan-field-get:"
    timeout_ms: 120000
  - step: "the macOS model share is writable two levels deep"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-macos-model-share-writable.lua 2>&1"
    expected_behavior: "(ok|skip):macos-model-share-writable:"
    assert_exit: 0
    assert_output_matches: "(ok|skip):macos-model-share-writable:"
    timeout_ms: 120000
  - step: "nix cache key identity and service behaviour"
    command: "bash scripts/test-nix-cache-service.sh 2>&1"
    expected_behavior: "(ok|skip):nix-cache-fixture"
    assert_exit: 0
    assert_output_matches: "(ok|skip):nix-cache-fixture"
    timeout_ms: 120000
