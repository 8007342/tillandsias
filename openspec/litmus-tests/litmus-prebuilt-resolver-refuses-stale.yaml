# @trace spec:ci-release
# @trace order:1270-5mz8
#
# 2026-09-19, macuahuitl: scripts/tillandsias-podman, the path the litmus
# runtime shim routes every podman call through, picked a four-day-old debug
# tillandsias-podman-cli by its executable bit alone, and release gates #3 and
# #4 ran the forge lane on code the tree no longer held. Red before 1270-5mz8:
# the STALE arm's marker binary runs.
name: litmus:prebuilt-resolver-refuses-stale
spec: ci-release
phase: pre-build
description: A prebuilt tillandsias-podman-cli older than its sources is refused by name with the rebuild command and never executed; a fresh one still runs
severity: high
size: instant

preconditions:
  - the plan binary (resolve_plan_binary), bash, git, find, touch; scratch trees under target/plan-scratch

critical_path:
  - step: "a stale prebuilt is refused by name and never runs; a fresh prebuilt runs"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-prebuilt-resolver-refuses-stale.lua 2>&1"
    timeout_ms: 120000
    expected_behavior: "ok:prebuilt-resolver:stale-refused:2/2"
  - step: "both litmus phase runners rebuild the podman-cli prebuilt before the shim runs (2093-pcli)"
    # build.sh's gate-touch (1599-egzz) bumps every tracked mtime at gate
    # start, so a runner that skips the rebuild hands the shim a prebuilt it
    # must refuse. local-ci.sh's runner did, and every --ci-full pre-build
    # litmus read podman as refused (12 reds, macuahuitl 2026-11-15).
    command: "c(){ awk -v fn=\"$2\" '$0 ~ \"^\" fn \"\\\\(\\\\) \\\\{\" {i=1; next} i && /^}/ {exit} i && /ensure_litmus_podman_cli/ {f=1} END {exit !f}' \"$1\"; }; c scripts/local-ci.sh run_litmus_phase || { echo 'FAIL: local-ci.sh run_litmus_phase no longer rebuilds the podman-cli prebuilt'; exit 1; }; c build.sh _run_litmus_phase || { echo 'FAIL: build.sh _run_litmus_phase no longer rebuilds the podman-cli prebuilt'; exit 1; }; T=$(mktemp); sed '/^run_litmus_phase() {/,/^}/{/ensure_litmus_podman_cli/d}' scripts/local-ci.sh > \"$T\"; if c \"$T\" run_litmus_phase; then rm -f \"$T\"; echo 'FAIL: negative control: a runner without the rebuild was not caught'; exit 1; fi; rm -f \"$T\"; echo 'ok: both litmus runners rebuild the podman-cli prebuilt before the shim (negative control must fail and did)'"
    timeout_ms: 10000
    expected_behavior: "ok: both litmus runners rebuild"

observability:
  traces:
    - "@trace spec:ci-release"
  expected_log: "two arms: STALE refused with marker absent, FRESH executed"
  log_fields:
    spec: "ci-release"
    test: "prebuilt-resolver-refuses-stale"

rollback:
  on_failure: "read the FAIL lines; the freshness check is the candidate loop in scripts/tillandsias-podman"
  command: "grep -n 'podman-cli-stale' scripts/tillandsias-podman"
