# @trace spec:host-browser-mcp, spec:browser-isolation-tray-integration, spec:local-web-preview
# @trace order:1649-xqet (browser.open runs the chromium-framework container)
#
# browser.open used to look for host Chromium under ~/.cache/tillandsias/chromium
# (which nothing downloads, so every open answered BROWSER_UNAVAILABLE), and its
# allowlist admitted only ports 8080/80, so the local preview
# https://www.<p>.localhost:18443 was URL_NOT_ALLOWED. Now a window is the
# chromium-framework container on a per-launch --internal network joined only by
# the router, with host-resolver rules ending in `MAP * ~NOTFOUND` and the enclave
# CA pinned by SPKI. The behaviour is pinned by unit tests
# (tillandsias-browser-mcp server::tests browser_open_*, headless
# browser_open::tests) and proven live by
# browser_open::tests::live_browser_open_runs_the_container_on_its_own_network
# (opt-in; evidence plan/evidence/1649-xqet-browser-open-container-2026-10-12/).
# These steps pin the shape that keeps it so. Every step carries its own
# negative control: the same check run on a seeded copy with the property
# removed must FAIL. Pipe-free.
name: litmus:browser-open-container-shape
spec: host-browser-mcp
phase: pre-build
description: >
  Pin browser.open's container path: no host-Chromium lookup or spawn in the
  launcher; the window joins only its own --internal network with a resolver
  catch-all and a CA SPKI pin; its only neighbour is a forwarder that passes
  on only TLS for the window's project, and the router binds Host to SNI; the local-preview TLS port is admitted for
  https only; the router publishes the preview leaf as a full chain; the window opens
  no host listener and no DevTools port.
severity: high
size: instant

preconditions:
  - workspace contains crates/tillandsias-browser-mcp/src/launcher.rs
  - workspace contains crates/tillandsias-headless/src/browser_open.rs

critical_path:
  - step: "launcher has no host-Chromium path; negative control: a seeded Command::new spawn must FAIL the check"
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; F=crates/tillandsias-browser-mcp/src/launcher.rs; nohost() { ! grep -qE 'Command::new|TILLANDSIAS_BROWSER_BIN|TILLANDSIAS_CHROMIUM_BIN|cache_root|tillandsias/chromium\"' \"$1\"; }; nohost \"$F\" || { echo 'FAIL: launcher.rs carries a host-Chromium path'; exit 1; }; cp \"$F\" \"$T/l.rs\"; printf '%s\\n' 'fn spawn() { std::process::Command::new(\"chrome\"); }' >> \"$T/l.rs\"; if nohost \"$T/l.rs\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: no host-Chromium path; seeded spawn caught'"
    timeout_ms: 5000
    expected_behavior: "ok: no host-Chromium path"

  - step: "the window joins only its own --internal network (its forwarder answers as router), resolves nothing but the project, pins the CA; negative control: dropping the catch-all must FAIL"
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; F=crates/tillandsias-headless/src/browser_open.rs; shape() { grep -qF '\"--internal\",' \"$1\" && grep -qF '.network(&handle.network_name)' \"$1\" && grep -qF 'MAP * ~NOTFOUND\"' \"$1\" && grep -qF -e '--ignore-certificate-errors-spki-list={ca_spki}' \"$1\" && grep -qF ':alias=router\"' \"$1\"; }; shape \"$F\" || { echo 'FAIL: browser_open.rs lost the network/resolver/pin shape'; exit 1; }; grep -vF 'MAP * ~NOTFOUND\"' \"$F\" > \"$T/b.rs\"; if shape \"$T/b.rs\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: internal network, resolver catch-all, CA pin; seeded removal caught'"
    timeout_ms: 5000
    expected_behavior: "ok: internal network, resolver catch-all, CA pin"

  - step: "the local-preview TLS port is admitted for https only; negative control: admitting it for any scheme must FAIL"
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; F=crates/tillandsias-browser-mcp/src/allowlist.rs; port() { grep -qF 'port == 8080 || port == 80 || (scheme == \"https\" && Some(port) == preview_tls_port)' \"$1\"; }; port \"$F\" || { echo 'FAIL: allowlist preview-port rule changed'; exit 1; }; sed 's/(scheme == \"https\" \\&\\& Some(port) == preview_tls_port)/Some(port) == preview_tls_port/' \"$F\" > \"$T/a.rs\"; if port \"$T/a.rs\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: preview port https-only; seeded widening caught'"
    timeout_ms: 5000
    expected_behavior: "ok: preview port https-only"

  - step: "the router publishes the preview leaf as a full chain; negative control: a leaf-only publish must FAIL"
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; F=crates/tillandsias-headless/src/local_web_preview.rs; chain() { grep -qF 'std::fs::write(&crt, chain)' \"$1\"; }; chain \"$F\" || { echo 'FAIL: the preview leaf is no longer published with the CA'; exit 1; }; grep -vF 'std::fs::write(&crt, chain)' \"$F\" > \"$T/p.rs\"; if chain \"$T/p.rs\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: full-chain leaf; seeded leaf-only caught'"
    timeout_ms: 5000
    expected_behavior: "ok: full-chain leaf"

  - step: "the window opens no host listener and no DevTools port; negative control: a seeded publish must FAIL"
    # A host TCP port would hand full control of the window, cookies included,
    # to every local process. Dev-mode CDP goes through a per-lane Unix socket
    # the tray brokers (the dev-mode broker row), never a host port.
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; F=crates/tillandsias-headless/src/browser_open.rs; S=$(sed -n '/^pub(crate) fn browser_window_spec/,/^}/p' \"$F\"); printf '%s\\n' \"$S\" > \"$T/spec.rs\"; nolisten() { grep -qF 'fn browser_window_spec' \"$1\" && ! grep -qE '\\.publish\\(|remote-debugging' \"$1\"; }; nolisten \"$T/spec.rs\" || { echo 'FAIL: the window spec publishes a port or opens DevTools'; rm -rf \"$T\"; exit 1; }; printf '%s\\n' '    .publish(\"127.0.0.1:9222:9222\")' >> \"$T/spec.rs\"; if nolisten \"$T/spec.rs\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: no host listener, no DevTools port; seeded publish caught'"
    timeout_ms: 5000
    expected_behavior: "ok: no host listener, no DevTools port"

  - step: "the forwarder passes on only TLS whose SNI is a host of the window's project, and the window resolves no plaintext route; negative control: a forwarder that skips the SNI test must FAIL"
    # Order 1651-5t7n. Measured live: before, a raw request from the window
    # container naming another project to router:8443 got 200 PREVIEW-OTHER;
    # after, its SNI is reset by the forwarder.
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; J=crates/tillandsias-headless/src/browser_window_forwarder.js; R=crates/tillandsias-headless/src/browser_open.rs; bound() { grep -qF 'if (buf[0] !== 0x16) return { name: undefined };' \"$1\" && grep -qF 'if (!name.endsWith(suffix)) {' \"$1\" && grep -qF 'include_str!(\"browser_window_forwarder.js\")' \"$R\" && ! grep -qF 'router:8080' \"$R\"; }; bound \"$J\" || { echo 'FAIL: the forwarder no longer binds SNI to the project, or a plaintext route came back'; exit 1; }; grep -vF 'if (!name.endsWith(suffix)) {' \"$J\" > \"$T/f.js\"; if bound \"$T/f.js\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: forwarder binds SNI to the project, no plaintext route; seeded bypass caught'"
    timeout_ms: 5000
    expected_behavior: "ok: forwarder binds SNI to the project"

  - step: "the router makes the Host header equal the SNI on TLS; negative control: a base.Caddyfile without strict_sni_host must FAIL"
    # Order 1651-5t7n. Measured live: SNI www.demo.localhost with Host
    # www.other.localhost got 200 PREVIEW-OTHER before, 421 after.
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; F=images/router/base.Caddyfile; strict() { grep -qE '^[[:space:]]+strict_sni_host on$' \"$1\"; }; strict \"$F\" || { echo 'FAIL: router base.Caddyfile lost strict_sni_host'; exit 1; }; grep -vF 'strict_sni_host' \"$F\" > \"$T/Caddyfile\"; if strict \"$T/Caddyfile\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: strict_sni_host on; seeded removal caught'"
    timeout_ms: 5000
    expected_behavior: "ok: strict_sni_host on"

  - step: "CDP is Chromium's --remote-debugging-pipe, relayed to ONE client on a Unix socket in the window's own directory, never a TCP port; negative control: a relay that listens on a TCP port must FAIL"
    # Order 1655-urz9. Measured live: no new host TCP listener and no TCP
    # listener in the window container while a device window was open; the
    # per-window socket directory was 0700 and removed on close.
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; J=crates/tillandsias-headless/src/browser_window_cdp_relay.js; R=crates/tillandsias-headless/src/browser_open.rs; piped() { grep -qF \"'--remote-debugging-pipe'\" \"$1\" && grep -qF 'server.listen(SOCKET,' \"$1\" && [ \"$(grep -c '\\.listen(' \"$1\")\" = 1 ] && grep -qF 'if (client) {' \"$1\" && grep -qF \"chromium.kill('SIGTERM')\" \"$1\" && ! grep -qE 'remote-debugging-port|listen\\([0-9]' \"$1\" && grep -qF 'include_str!(\"browser_window_cdp_relay.js\")' \"$R\" && grep -qF '[\"node\", \"-e\", CDP_RELAY_JS, \"--\"]' \"$R\"; }; piped \"$J\" || { echo 'FAIL: the window CDP relay is not pipe-to-one-Unix-socket-client'; rm -rf \"$T\"; exit 1; }; sed 's/server.listen(SOCKET,/server.listen(9222,/' \"$J\" > \"$T/relay.js\"; if piped \"$T/relay.js\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: CDP is the pipe, relayed to one Unix-socket client; seeded TCP listen caught'"
    timeout_ms: 5000
    expected_behavior: "ok: CDP is the pipe, relayed to one Unix-socket client"

  - step: "browser.open{device} emulates the device (touch, metrics, UA) and re-asserts touch on every main-frame commit and load; browser.set_device is wired; negative control: dropping the re-assert must FAIL"
    # Order 1655-urz9. Measured live: without the re-assert the window's
    # first page saw navigator.maxTouchPoints fall from 5 to 0 just after
    # the about:blank -> site commit; with it the page saw [428, 3, 5].
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; W=crates/tillandsias-browser-mcp/src/window_cdp.rs; S=crates/tillandsias-browser-mcp/src/server.rs; wired() { grep -qF '\"Emulation.setTouchEmulationEnabled\",' \"$1\" && grep -qF '\"Emulation.setDeviceMetricsOverride\",' \"$1\" && grep -qF '(\"Emulation.setUserAgentOverride\", ua),' \"$1\" && grep -qF 'Some(\"Page.frameNavigated\") if params[\"frame\"].get(\"parentId\").is_none() => {' \"$1\" && grep -qF 'Some(\"Page.loadEventFired\") => {' \"$1\" && [ \"$(grep -cF 'reassert_touch(conn, session, state);' \"$1\")\" = 2 ] && grep -qF '\"browser.set_device\" => self.handle_browser_set_device(id, args),' \"$S\"; }; wired \"$W\" || { echo 'FAIL: device emulation, its touch re-assert, or browser.set_device is unwired'; rm -rf \"$T\"; exit 1; }; grep -vF 'reassert_touch(conn, session, state);' \"$W\" > \"$T/w.rs\"; if wired \"$T/w.rs\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: emulation (touch, metrics, UA) re-asserted on commit and load, set_device wired; seeded removal caught'"
    timeout_ms: 5000
    expected_behavior: "ok: emulation (touch, metrics, UA) re-asserted on commit and load, set_device wired"

  - step: "dev mode gives raw CDP only to the lane that opened the window: every window lookup checks the owning lane and browser.cdp needs a dev-mode window; negative control: a registry lookup without the owner filter must FAIL"
    # Order 1656-iktu. Measured live: lane A's browser.cdp Runtime.evaluate
    # 1+1 returned 2; lane B's browser.cdp and browser.screenshot with the
    # same window_id got WINDOW_NOT_FOUND; raw Page.navigate to a public host
    # and to another project both ended in net::ERR_NAME_NOT_RESOLVED.
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; G=crates/tillandsias-browser-mcp/src/window_registry.rs; S=crates/tillandsias-browser-mcp/src/server.rs; owned() { grep -qF '.filter(|entry| entry.owning_lane == lane)' \"$1\" && grep -qF '.is_some_and(|entry| entry.owning_lane == lane)' \"$1\" && grep -qF 'match self.windows.cdp_for(window_id, &self.owner()) {' \"$S\" && grep -qF 'let (cdp, page) = match self.dev_window(id, window_id, \"browser.cdp\") {' \"$S\" && grep -qF 'DEV_MODE_REQUIRED: {tool} needs a development-mode window' \"$S\"; }; owned \"$G\" || { echo 'FAIL: a window lookup no longer checks the owning lane, or browser.cdp is not dev-gated'; rm -rf \"$T\"; exit 1; }; grep -vF '.filter(|entry| entry.owning_lane == lane)' \"$G\" > \"$T/reg.rs\"; if owned \"$T/reg.rs\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: window lookups check the owning lane, raw CDP is dev-gated; seeded owner bypass caught'"
    timeout_ms: 5000
    expected_behavior: "ok: window lookups check the owning lane, raw CDP is dev-gated"

  - step: "a WebKit window reaches only its project: a loopback-only relay (127.0.0.1 and ::1) to its forwarder, exactly the project's two names, the enclave CA as its read-only bundle, TLS always verified; negative control: a relay bound to 0.0.0.0 must FAIL"
    # Order 1656-tjv4. WebKitGTK resolves every *.localhost name to loopback
    # through GLib and ignores /etc/hosts for them, hence the relay; the
    # binding stays the forwarder's SNI check plus strict_sni_host. Measured
    # live: own project 200, another project refused at the forwarder, an
    # outside name and a raw IP fail, a foreign-CA cert is rejected.
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; R=crates/tillandsias-headless/src/browser_open.rs; W=images/webkit/webkit-window.js; confined() { grep -qF \"for (const host of ['127.0.0.1', '::1'])\" \"$1\" && ! grep -qE \"0\\.0\\.0\\.0|ignoreHTTPSErrors *:\" \"$1\" && grep -qF 'format!(\"www.{project}.localhost\"),' \"$R\" && grep -qF 'format!(\"web.{project}.localhost\"),' \"$R\" && [ \"$(grep -c 'spec = spec.add_host(' \"$R\")\" = 1 ] && grep -qF '\"/etc/ssl/certs/ca-certificates.crt\",' \"$R\" && grep -qF '\"TILLANDSIAS_WEBKIT_RELAY\",' \"$R\"; }; confined \"$W\" || { echo 'FAIL: the WebKit window lost its loopback-only relay, its two project names, its CA bundle, or verifies TLS no more'; rm -rf \"$T\"; exit 1; }; sed \"s/'127.0.0.1', '::1'/'0.0.0.0'/\" \"$W\" > \"$T/w.js\"; if confined \"$T/w.js\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: WebKit window confined (loopback relay only, project names only, enclave CA bundle, TLS verified); seeded 0.0.0.0 relay caught'"
    timeout_ms: 5000
    expected_behavior: "ok: WebKit window confined"

  - step: "the WebKit image is pinned (Ubuntu base by digest, Node and the WebKit build by sha256), uses no Playwright browser downloader and sets no USER; negative control: a Containerfile running playwright install webkit must FAIL"
    # Order 1656-tjv4. No USER: under --userns=keep-id an explicit USER cannot
    # write the owner-only Wayland socket (measured: GTK "Failed to open display").
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; F=images/webkit/Containerfile; pinned() { grep -qE '^FROM docker\\.io/library/ubuntu:24\\.04@sha256:[0-9a-f]{64}$' \"$1\" && [ \"$(grep -c 'sha256sum -c -' \"$1\")\" = 2 ] && grep -qE '^ARG WEBKIT_SHA256=[0-9a-f]{64}$' \"$1\" && grep -qE '^ARG NODE_SHA256=[0-9a-f]{64}$' \"$1\" && ! grep -qE 'playwright install (webkit|chromium|firefox|--with-deps)' \"$1\" && ! grep -qE '^USER ' \"$1\"; }; pinned \"$F\" || { echo 'FAIL: the WebKit image lost a pin (base digest, node or WebKit sha256), uses the Playwright browser downloader, or sets USER'; rm -rf \"$T\"; exit 1; }; { cat \"$F\"; echo 'RUN playwright install webkit'; } > \"$T/Containerfile\"; if pinned \"$T/Containerfile\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: WebKit image pinned by digest and sha256, no browser downloader, no USER; seeded downloader caught'"
    timeout_ms: 5000
    expected_behavior: "ok: WebKit image pinned by digest and sha256"

  - step: "the WebKit engine is labelled 'WebKit (approximates Safari)', never Safari alone; negative control: a bare 'Safari' label must FAIL"
    command: "set -u; T=target/litmus-browser-open; mkdir -p \"$T\"; L=crates/tillandsias-browser-mcp/src/launcher.rs; labelled() { grep -qF 'Engine::WebKit => \"WebKit (approximates Safari)\",' \"$1\" && ! grep -qE '=> \"Safari\",' \"$1\"; }; labelled \"$L\" || { echo 'FAIL: the WebKit engine is not labelled \"WebKit (approximates Safari)\"'; rm -rf \"$T\"; exit 1; }; sed 's/Engine::WebKit => \"WebKit (approximates Safari)\",/Engine::WebKit => \"Safari\",/' \"$L\" > \"$T/l.rs\"; if labelled \"$T/l.rs\"; then echo 'FAIL: negative control passed'; rm -rf \"$T\"; exit 1; fi; rm -rf \"$T\"; echo 'ok: WebKit labelled \"WebKit (approximates Safari)\"; seeded \"Safari\" label caught'"
    timeout_ms: 5000
    expected_behavior: "ok: WebKit labelled"

observability:
  traces:
    - "@trace spec:host-browser-mcp"
    - "@trace spec:browser-isolation-tray-integration"
    - "@trace spec:local-web-preview"
  expected_log: "launcher container-only + internal network/resolver/pin + https-only preview port + full-chain leaf + no host listener + SNI-bound forwarder + strict_sni_host + CDP pipe relay + device emulation + owning-lane dev-mode CDP + confined, pinned, labelled WebKit window pinned, each with a seeded negative control"
  log_fields:
    spec: "host-browser-mcp"
    test: "browser-open-container-shape"
    artifact: "crates/tillandsias-browser-mcp/src/{launcher,allowlist}.rs + crates/tillandsias-headless/src/{browser_open,local_web_preview}.rs"

rollback:
  on_failure: >
    browser.open's container path drifted. A host-Chromium lookup in
    launcher.rs reopens the unconfined window; losing --internal, the
    `MAP * ~NOTFOUND` catch-all or the SPKI pin lets a window reach other
    projects, the host or the internet, or trust the host store; admitting the
    preview port for http or another port widens the allowlist; a leaf-only
    preview chain breaks the pin (ERR_CERT_AUTHORITY_INVALID); a published
    port or DevTools port hands the window to every local process. Restore
    from order 1649-xqet.
  command: "grep -nE 'Command::new|--internal|NOTFOUND|spki-list|preview_tls_port|fs::write\\(&crt|publish|remote-debugging' crates/tillandsias-browser-mcp/src/launcher.rs crates/tillandsias-browser-mcp/src/allowlist.rs crates/tillandsias-headless/src/browser_open.rs crates/tillandsias-headless/src/local_web_preview.rs"
