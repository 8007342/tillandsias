# @trace spec:host-browser-mcp
# @trace order:1769-9gna
#
# Operator ruling 2026-10-17: a browser window sees only generic audio device
# names, never a host one, and its sound still plays. Before 1769-9gna the
# browser was a client of the output-only server, whose clients can list every
# host device (measured on lenovinha: the HDMI TV's name, the Ryzen controller,
# a LAN AirPlay peer and its address). Now a private PulseAudio inside the
# window's container, whose only device is a "Speakers" tunnel to that server,
# stands in front (images/chromium/browser-audio.pa).
#
# This runs the REAL chromium-framework image the way a window runs, with a
# probe where its launcher finds `chromium`, against the shipped output-only
# server on a scratch socket: the browser's PULSE_SERVER is private, every
# device it lists is generic and none of the host's names appears, its stream
# arrives on the output-only server (the negative control), and a window
# without its socket gets no pulse server at all. Red against v56.10.17.1.
#
# RUNTIME phase, like litmus:host-audio-output-only: it needs the host's
# desktop session and podman with the image. It SKIPS by name elsewhere.
name: litmus:browser-audio-generic-names
spec: host-browser-mcp
phase: runtime
description: A browser window lists only generic audio devices, no host device name reaches it, and its sound still reaches the host
severity: medium
size: quick

preconditions:
  - a Linux desktop session with a PipeWire daemon and pipewire-pulse; pipewire and pactl on PATH
  - podman with the chromium-framework image (TILLANDSIAS_CHROMIUM_FRAMEWORK_IMAGE, else the v<VERSION> tag a window runs), and for the WebKit step the webkit image (TILLANDSIAS_WEBKIT_IMAGE, else its v<VERSION> tag); a missing image SKIPS that step by name

critical_path:
  - step: "the window's audio view is generic and private, and it still plays"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-browser-audio-generic-names.lua 2>&1"
    timeout_ms: 300000
    expected_behavior: "ok:browser-audio-generic-names-fixture:4"

  - step: "the same four arms for the tray's WebKit window (1777-yhwr)"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-browser-audio-generic-names.lua -- --engine webkit 2>&1"
    timeout_ms: 300000
    expected_behavior: "ok:browser-audio-generic-names-webkit-fixture:4"

observability:
  traces:
    - "@trace spec:host-browser-mcp"
  expected_log: "four arms: a private PULSE_SERVER, only Speakers and its monitor listed with no host name, the stream reaches the output-only server, no fallback server"
  log_fields:
    spec: "host-browser-mcp"
    test: "browser-audio-generic-names"

rollback:
  on_failure: "read the FAIL lines; arm 2 red means a host device name reaches the page — check images/chromium/browser-audio.pa and start_private_audio in images/chromium/chromium-framework-launch.sh"
  command: "grep -n 'load-module\\|PULSE_SERVER' images/chromium/browser-audio.pa images/chromium/chromium-framework-launch.sh"
