# @trace spec:default-image
# @trace order:2027-e2cf
#
# Cold Linux lanes died on their model request with "EPROTO: The TLS handshake
# failed" in 5 of 6 runs from 2026-10-31, and nothing in the proxy or forge
# network path had changed. The forge installed opencode-ai@latest from npm, so
# the client moved with no commit. npm's opencode-ai also stopped at 1.19.5
# (2026-10-28), while upstream shipped 2.x as GitHub release tarballs. The
# operator asked for the latest opencode, off npm (2026-11-08). Red before
# 2027-e2cf: no release installer, no pinned digest, and npm @latest.
name: litmus:forge-opencode-is-pinned
spec: default-image
phase: pre-build
description: The forge installs opencode at its pinned release version from the upstream tarball. It verifies the tarball against a sha256 pinned in the tree and fails closed on a mismatch. It picks the baseline asset on a CPU without AVX2 and replaces a cached copy at another version. An unpinned npm @latest install is named as unpinned.
severity: high
size: instant

preconditions:
  - the plan binary (resolve_plan_binary), bash, sed, tar and sha256sum (or shasum); stub curl, uname and npm on a scratch PATH (no network)

critical_path:
  - step: "pinned release install, baseline on no-avx2, a tampered tarball refused, a pinned cache kept, a drifted cache reinstalled, no digest refused, both digests pinned, unpinned npm named, require_opencode wired"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-forge-opencode-is-pinned.lua 2>&1"
    timeout_ms: 120000
    expected_behavior: "ok:forge-opencode-is-pinned:9 arms"

observability:
  traces:
    - "@trace spec:default-image"
  expected_log: "nine arms: FRESH, BASELINE, TAMPER, KEEP, DRIFT, NODIGEST, PINS, UNPINNED, WIRED"
  log_fields:
    spec: "default-image"
    test: "forge-opencode-is-pinned"

rollback:
  on_failure: "read the FAIL lines; the pin is harness_release_pin plus harness_release_sha256 in images/default/lib-common.sh, applied by _require_release_harness"
  command: "grep -n 'harness_release_' images/default/lib-common.sh"
