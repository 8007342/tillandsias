# @trace spec:git-mirror-service
name: litmus:git-mirror-seed-failure-surfaced-shape
spec: git-mirror-service
phase: pre-build
description: >
  Order 778-hb3x criterion 3. When the launcher refuses a mirror another
  launch started and has not seeded (adopted_mirror_outcome, 1922-unwt), the
  refusal carries the mirror's own seed-fetch failure line, so a seed that can
  never succeed is visibly different from a slow one. This pins the
  cross-component half: the marker the launcher searches for is the one
  images/git/entrypoint.sh prints in both failure arms, and the refusal reads
  the mirror log. The extraction itself is unit-tested (mirror_seed_failure_tests).
severity: medium
size: instant

preconditions:
  - workspace contains scripts/lua/test-git-mirror-seed-failure-surfaced.lua

critical_path:
  - step: "the Lua fixture is present"
    command: "test -f scripts/lua/test-git-mirror-seed-failure-surfaced.lua && echo 'ok: present'"
    timeout_ms: 2000
    expected_behavior: "ok: present"

  - step: "the launcher's marker is what the mirror prints, and the gate surfaces it"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-git-mirror-seed-failure-surfaced.lua 2>&1"
    timeout_ms: 10000
    expected_behavior: "ok:git-mirror-seed-failure-surfaced"

observability:
  traces:
    - "@trace spec:git-mirror-service"
  expected_log: "ok:git-mirror-seed-failure-surfaced"
  log_fields:
    spec: "git-mirror-service"
    test: "git-mirror-seed-failure-surfaced-shape"
    artifact: "crates/tillandsias-headless/src/main.rs (adopted_mirror_outcome) + images/git/entrypoint.sh"

rollback:
  on_failure: >
    If the mirror rewords its seed-failure line, update GIT_MIRROR_SEED_FAILURE_MARKER
    in the same change; a mismatch makes every failing seed look like a slow one.
  command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-git-mirror-seed-failure-surfaced.lua 2>&1"
