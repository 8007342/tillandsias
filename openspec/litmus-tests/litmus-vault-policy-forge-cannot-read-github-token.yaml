# @trace spec:tillandsias-vault
#
# Rewritten by 2357-5quw. It had phase 6, which no phase run selects, ran cargo examples that do not
# exist, and wrote a fixture over secret/github/token in the live vault. It now asks a dev vault
# in a throwaway container with no network. Run by the runtime phase: build.sh --ci-full
# (runtime residual litmus, size e2e) and scripts/local-ci.sh --phase runtime.
name: litmus:vault-policy-forge-cannot-read-github-token
spec: tillandsias-vault
phase: runtime
description: >
  No forge lane's vault policy reads, overwrites or reads the metadata of
  secret/github/token. Exercises the forge-policy-has-no-token-read invariant
  with this tree's policies on a real vault server, and shows a policy that
  grants the path, or secret/*, is seen.
severity: critical
size: quick

preconditions:
  - podman; a local tillandsias-vault or hashicorp/vault image (a named skip without one); offline
  - a tillandsias-plan resolves (scripts/plan-binary-probe.sh)

critical_path:
  - step: "every forge lane policy is denied the GitHub token by a real vault; git-mirror reads it; planted grants are red"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-forge-policies-cannot-read-github-token.lua 2>&1"
    timeout_ms: 120000
    expected_behavior: "ok:forge-policies-cannot-read-github-token:7 arms"
    assert_exit: 0

observability:
  traces:
    - "@trace spec:tillandsias-vault"
  expected_log: "every forge lane policy is denied secret/github/token"
  log_fields:
    spec: "tillandsias-vault"
    test: "vault-policy-forge-cannot-read-github-token"

rollback:
  on_failure: "inspect the named lane's images/vault/policies/<lane>.hcl: no forge lane may hold a path that covers secret/data/github/token or secret/metadata/github/token. If the control fails, forge can no longer read secret/data/ca/proxy-cert, or git-mirror the token."
