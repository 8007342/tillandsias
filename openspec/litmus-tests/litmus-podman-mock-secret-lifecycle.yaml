# @trace spec:litmus-framework
name: litmus:podman-mock-secret-lifecycle
spec: litmus-framework
phase: pre-build
description: >
  Order 813-frih. The podman mock's `secret rm` and `secret inspect` act on the
  secret NAMED, at its real argv position. Before the fix both read the
  sub-subcommand as the name: rm deleted a file called "rm" and exited 0 with
  the secret still on disk, and inspect always answered absent, so any test
  asserting removal or absence passed without the mock having done or looked
  at anything. A create -> inspect -> rm -> re-inspect lifecycle (plus
  missing-name, --ignore, multi-name and --all) pins it; the pre-fix mock fails
  4 of 5 arms.
severity: medium
size: instant

preconditions:
  - workspace contains scripts/test-podman-mock-secret-lifecycle.sh

critical_path:
  - step: "fixture parses and is executable"
    command: "bash -n scripts/test-podman-mock-secret-lifecycle.sh && test -x scripts/test-podman-mock-secret-lifecycle.sh && echo 'ok: parse'"
    timeout_ms: 2000
    expected_behavior: "ok: parse"

  - step: "secret rm removes and secret inspect finds the named secret"
    command: "bash scripts/test-podman-mock-secret-lifecycle.sh 2>&1 | tail -n 1"
    timeout_ms: 20000
    expected_behavior: "PASS: podman-mock-secret-lifecycle"

observability:
  traces:
    - "@trace spec:litmus-framework"
  expected_log: "PASS: podman-mock-secret-lifecycle"
  log_fields:
    spec: "litmus-framework"
    test: "podman-mock-secret-lifecycle"
    artifact: "scripts/test-support/podman-mock.sh (secret rm/inspect)"

rollback:
  on_failure: >
    A mock that answers success for a removal it did not perform, or absent for
    a secret it never looked up, turns every secret-lifecycle assertion into a
    silent pass; restore the positional name parsing.
  command: "bash scripts/test-podman-mock-secret-lifecycle.sh"
