# @trace spec:proxy-container, order:2041-i3nk
#
# images/proxy/allowlist.txt is the union of images/proxy/tiers/*.txt,
# generated by scripts/lua/build-proxy-allowlist.lua. The controls prove a
# hand edit of the union (a tier changed without regenerating) and an entry
# squid 6.x would refuse as covered are both caught before an image build.
name: litmus:proxy-allowlist-from-tiers
spec: proxy-container
phase: pre-build
description: >
  The proxy allowlist is exactly the generated union of the egress tier files,
  and no tier adds an entry another entry already covers.
severity: high
size: instant

critical_path:
  - step: "2041-i3nk: the committed allowlist equals the union of the tier files"
    command: "out=$(tillandsias-plan script run scripts/lua/build-proxy-allowlist.lua -- --check); rc=$?; case \"$out\" in ok:proxy-allowlist:*) [ \"$rc\" -eq 0 ] && echo 'ok: allowlist is the tier union' ;; *) echo \"FAIL rc=$rc out=[$out]\"; exit 1 ;; esac"
    timeout_ms: 20000
    expected_behavior: "ok: allowlist is the tier union"

  - step: "2041-i3nk NEGATIVE CONTROL: a tier changed without regenerating is refused as stale"
    command: "mkdir -p target; T=$(mktemp -d target/litmus-pat.XXXXXX); cp -R images/proxy/tiers \"$T/tiers\"; cp images/proxy/allowlist.txt \"$T/allowlist.txt\"; echo '.example-new-tier-entry.org' >> \"$T/tiers/assets.txt\"; out=$(TILLANDSIAS_PROXY_TIERS_DIR=\"$T/tiers\" TILLANDSIAS_PROXY_ALLOWLIST=\"$T/allowlist.txt\" tillandsias-plan script run scripts/lua/build-proxy-allowlist.lua -- --check 2>/dev/null); rc=$?; find \"$T\" -delete; [ \"$rc\" -eq 1 ] && [ \"$out\" = 'violation:proxy-allowlist:stale' ] && echo 'ok: stale union refused' || { echo \"FAIL rc=$rc out=[$out]\"; exit 1; }"
    timeout_ms: 20000
    expected_behavior: "ok: stale union refused"

  - step: "2041-i3nk NEGATIVE CONTROL: an entry covered by another is refused"
    command: "mkdir -p target; T=$(mktemp -d target/litmus-pat.XXXXXX); cp -R images/proxy/tiers \"$T/tiers\"; echo '.storage.googleapis.com' >> \"$T/tiers/research.txt\"; out=$(TILLANDSIAS_PROXY_TIERS_DIR=\"$T/tiers\" TILLANDSIAS_PROXY_ALLOWLIST=\"$T/allowlist.txt\" tillandsias-plan script run scripts/lua/build-proxy-allowlist.lua -- --check 2>/dev/null); rc=$?; find \"$T\" -delete; [ \"$rc\" -eq 1 ] && [ \"$out\" = 'violation:proxy-allowlist:covered:.storage.googleapis.com<.googleapis.com' ] && echo 'ok: covered entry refused' || { echo \"FAIL rc=$rc out=[$out]\"; exit 1; }"
    timeout_ms: 20000
    expected_behavior: "ok: covered entry refused"

observability:
  traces:
    - "@trace spec:proxy-container"
