# @trace spec:default-image
name: litmus:harness-curl-install-shape
spec: default-image
phase: pre-build
size: instant
severity: medium
description: >
  Order 459 (operator directive 2026-07-21): Claude Code is installed at
  CONTAINER LAUNCH via its OFFICIAL vendor curl installer (image build cannot
  curl — the enclave network does not exist during podman build), persisted on
  the tool-cache volume, with ephemerality + idempotency semantics: the
  installer refreshes to newer versions, a recent validated matching version
  may short-circuit installer network work for at most 600 seconds, warm
  restarts reuse the cache instantly, and offline falls back to the cached
  binary. OpenCode left the curl channel 2026-08-31 (operator ruling,
  opencode-curl-install-never-populates-its-cache): its vendor installer's
  check_version() exits 0 on any PATH-visible opencode without consulting
  OPENCODE_INSTALL_DIR, so with the npm binary first on PATH the curl lane
  could structurally never populate its cache — opencode is npm ON-DEMAND via
  _require_harness (install only-when-missing; NOT the npm@latest background
  loop, which is the order-284 breakage class). codex/openspec remain
  npm-managed.
preconditions:
  - workspace contains images/default/lib-common.sh

critical_path:
  - step: "lib-common wires claude through curl and opencode through npm on-demand ONLY"
    # Both directions pinned: claude's curl channel present and routed, AND
    # the opencode curl lane fully absent (a resurrection would reintroduce
    # the never-populates-its-cache defect plus the 805-yzhw double-extraction
    # class). require_opencode's body must reach _require_harness and must
    # not name any curl installer.
    command: "grep -q 'curl_install_claude()' images/default/lib-common.sh && awk '/^require_claude\\(\\)/,/^}/' images/default/lib-common.sh | grep -q curl_install_claude && ! grep -q 'curl_install_opencode' images/default/lib-common.sh && awk '/^require_opencode\\(\\)/,/^}/' images/default/lib-common.sh | grep -q _require_harness && ! awk '/^require_opencode\\(\\)/,/^}/' images/default/lib-common.sh | grep -q 'curl_install' && echo 'ok: channels-wired'"
    timeout_ms: 5000
    expected_behavior: "ok: channels-wired"

  - step: "the npm background updater manages neither claude nor opencode"
    # claude is curl-managed; opencode is _require_harness on-demand. Adding
    # either to the @latest loop reintroduces the order-284 breakage class.
    command: "! grep -E 'for pkg in' images/default/lib-common.sh | grep -E 'opencode-ai|claude-code' >/dev/null && echo 'ok: npm-loop-shrunk'"
    timeout_ms: 5000
    expected_behavior: "ok: npm-loop-shrunk"

  - step: "egress allowlist covers the claude installer and opencode's API host"
    # .opencode.ai stays after the curl retirement: the RUNNING npm binary
    # talks to its own API/auth endpoints there. Only the installer download
    # stopped happening.
    command: "grep -q '^\\.opencode\\.ai$' images/proxy/allowlist.txt && grep -q '^\\.claude\\.ai$' images/proxy/allowlist.txt && echo 'ok: installer-egress-allowed'"
    timeout_ms: 5000
    expected_behavior: "ok: installer-egress-allowed"

  - step: "Claude currentness is bounded and fixture-enforced"
    command: "grep -Fq 'TILLANDSIAS_CLAUDE_REFRESH_MAX_AGE_SECONDS:-600' images/default/lib-common.sh && grep -Fq 'litmus:harness-byte-cheap' openspec/litmus-bindings.yaml && echo 'ok: claude-currentness-bounded'"
    timeout_ms: 5000
    expected_behavior: "ok: claude-currentness-bounded"

  - step: "lib-common parses"
    command: "bash -n images/default/lib-common.sh && echo 'ok: lib-common-parses'"
    timeout_ms: 5000
    expected_behavior: "ok: lib-common-parses"

  - step: "one opencode writer remains (the 805-yzhw race is structurally gone, not just locked)"
    # The harness-update lock choreography (626-p4xd/805-yzhw) existed
    # because require_opencode and ensure_forge_harnesses both ran 127MB
    # vendor extractions into a 256MB tmpfs. With the curl lane retired the
    # ONLY opencode install site is _require_harness's only-when-missing npm
    # install, which serializes on the npm-update lock ensure_forge_harnesses
    # creates. Pin that: exactly one 'npm install' line inside
    # _require_harness, and ensure_forge_harnesses INVOKES no opencode curl
    # installer (its first-run-floor ADVICE text may still name the npm
    # package for a human retry — that is not an install site; the @latest
    # loop's membership is step 2's pin). (The old
    # scripts/test-opencode-harness-lock.sh fixture retired with the race it
    # reproduced.)
    command: "test \"$(awk '/^_require_harness\\(\\)/,/^}/' images/default/lib-common.sh | grep -c 'npm install')\" = 1 && ! awk '/^ensure_forge_harnesses\\(\\)/,/^}/' images/default/lib-common.sh | grep -q 'curl_install_opencode' && echo 'ok: one-opencode-writer'"
    timeout_ms: 5000
    expected_behavior: "ok: one-opencode-writer"

observability:
  traces:
    - "@trace spec:default-image"
  expected_log: "harness curl-install OK / reusing cached — never a silent missing harness"
  log_fields:
    spec: "default-image"
    test: "harness-curl-install-shape"

rollback:
  on_failure: >
    Do NOT revert claude to npm@latest without operator sign-off — the npm
    channel is the breakage class curl replaced (orders 284/431). Do NOT
    resurrect opencode's curl installer — it structurally cannot populate its
    cache (operator ruling 2026-08-31). Claude fail-soft ordering is: fresh
    curl install > cached curl binary > legacy npm fallback >
    harness_missing_fatal; opencode is _require_harness on-demand only.
  command: "grep -n 'order 459' images/default/lib-common.sh"
