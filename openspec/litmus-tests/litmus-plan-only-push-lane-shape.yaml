    expected_behavior: "ok: lane-accepts-attestation-append"

  - step: "ACCEPT (848-bx2q): a joining host's FIRST attestation record — new ledger file with the record header — passes the lane and the remote advances"
    command: "root=$(pwd); _mfp=$(mf_plan_binary 2>/dev/null || true); [ -n \"$_mfp\" ] && export TILLANDSIAS_PLAN_BIN=\"$root/${_mfp#./}\"; t=$(mktemp -d); trap 'rm -rf \"$t\"' EXIT; git init -q -b main \"$t/work\"; cd \"$t/work\"; git config user.email l@t; git config user.name l; git config core.hooksPath \"$t/work/.git/hooks\"; mkdir -p scripts/hooks plan/index.d plan/loop_status.d plan/mo-full-attestations.d; printf 'packets: []\\n' > plan/index.yaml; cp \"$root/scripts/gate-stamp.sh\" scripts/; cp \"$root/scripts/hooks/pre-push-local-gate.sh\" scripts/hooks/; cp \"$root/scripts/plan-binary-probe.sh\" scripts/; cp \"$root/scripts/check-mo-full-attestations.sh\" scripts/; printf '#!/bin/sh\\necho fixture-nonledger-host\\n' > scripts/mo-full-attest.sh; chmod +x scripts/mo-full-attest.sh; touch plan/mo-full-attestations.d/.keep; git add -A; git commit -qm base; git init -q --bare \"$t/origin.git\"; git remote add origin \"$t/origin.git\"; git push -q origin main; printf '#!/usr/bin/env bash\\nexec bash \"$(git rev-parse --show-toplevel)/scripts/hooks/pre-push-local-gate.sh\" \"$@\"\\n' > .git/hooks/pre-push; chmod +x .git/hooks/pre-push; sha=$(printf '%040d' 7); { printf '%s\\n' '# MO-FULL attestation ledger — fixturehost.md (see methodology/mo-full-attestation.yaml)' '# One verified marker per cycle, appended by: scripts/mo-full-attest.sh record' '# Grammar: MO-FULL: <COMPLETE|BLOCKED> <LOCAL_SHA> <BRANCH> <REMOTE_SHA> (LOCAL_SHA == REMOTE_SHA)' '# Verified at write time: startup boundary (717-3bvv) + remote convergence (614-2gqx).' '# Gate: scripts/check-mo-full-attestations.sh (./build.sh --check).' ''; printf '## 2026-08-22T23:57:48Z fixturehost\\nMO-FULL: COMPLETE %s main %s\\n' \"$sha\" \"$sha\"; } > plan/mo-full-attestations.d/fixturehost.md; git add -A; git commit -qm first-att; out=$(git push origin main 2>&1); rc=$?; if [ \"$rc\" = 0 ] && echo \"$out\" | grep -q 'plan-only lane: validated plan/mo-full-attestations.d/fixturehost.md' && echo \"$out\" | grep -q 'plan-only lane clean' && [ \"$(git ls-remote origin refs/heads/main | cut -f1)\" = \"$(git rev-parse HEAD)\" ]; then echo 'ok: lane-accepts-first-attestation'; else echo \"FAIL: rc=$rc\"; echo \"$out\"; exit 1; fi"
