  - step: "ACCEPT (966-7umc): append-event on a BASE-RESIDENT packet reaches the plan-only lane from a forge-shaped environment, with no build stamp"
    command: "root=$(pwd); _mfp=$(mf_plan_binary 2>/dev/null || true); [ -n \"$_mfp\" ] || { echo 'FAIL: no plan binary to drive the write'; exit 1; }; case \"$_mfp\" in /*) PB=\"$_mfp\";; *) PB=\"$root/${_mfp#./}\";; esac; t=$(mktemp -d); trap 'rm -rf \"$t\"' EXIT; git init -q -b main \"$t/work\"; cd \"$t/work\"; git config user.email l@t; git config user.name l; git config core.hooksPath \"$t/work/.git/hooks\"; mkdir -p scripts/hooks plan/index.d plan/loop_status.d; printf 'packets:\\n    - packet_id: fixture-base-resident\\n      order: 900-fix\\n      status: ready\\n      title: base-resident\\n      events:\\n        - type: filed\\n          ts: \"2026-01-01T00:00:00Z\"\\n          host: fixturehost\\n          summary: baseline\\n' > plan/index.yaml; cp \"$root/scripts/gate-stamp.sh\" scripts/; cp \"$root/scripts/hooks/pre-push-local-gate.sh\" scripts/hooks/; cp \"$root/scripts/plan-binary-probe.sh\" scripts/; git add -A; git commit -qm base; git init -q --bare \"$t/origin.git\"; git remote add origin \"$t/origin.git\"; git push -q origin main; printf '#!/usr/bin/env bash\\nexec bash \"$(git rev-parse --show-toplevel)/scripts/hooks/pre-push-local-gate.sh\" \"$@\"\\n' > .git/hooks/pre-push; chmod +x .git/hooks/pre-push; before=$(md5sum plan/index.yaml | cut -d' ' -f1); TILLANDSIAS_HOST_KIND=forge \"$PB\" --index plan/index.yaml append-event 900-fix note 'forge scout finding' --agent forge-fixturehost-claude-20260102t000000z --host fixturehost >/dev/null 2>&1 || { echo 'FAIL: append-event refused the write'; exit 1; }; after=$(md5sum plan/index.yaml | cut -d' ' -f1); [ \"$before\" = \"$after\" ] || { echo 'FAIL: append-event wrote plan/index.yaml — the write is outside the lane again'; exit 1; }; git add -A; git commit -qm 'scout finding'; out=$(git push origin main 2>&1); rc=$?; if [ \"$rc\" = 0 ] && echo \"$out\" | grep -q 'plan-only lane: validated plan/index.d/' && echo \"$out\" | grep -q 'plan-only lane clean' && [ \"$(git ls-remote origin refs/heads/main | cut -f1)\" = \"$(git rev-parse HEAD)\" ]; then echo 'ok: append-event-reaches-the-plan-only-lane'; else echo \"FAIL: rc=$rc\"; echo \"$out\"; exit 1; fi"
    timeout_ms: 20000
    expected_behavior: "ok: append-event-reaches-the-plan-only-lane"

  - step: "MUTATION (966-7umc): the SAME finding written into plan/index.yaml still demands the full gate — so the arm above passes for the right reason"
    command: "root=$(pwd); t=$(mktemp -d); trap 'rm -rf \"$t\"' EXIT; git init -q -b main \"$t/work\"; cd \"$t/work\"; git config user.email l@t; git config user.name l; git config core.hooksPath \"$t/work/.git/hooks\"; mkdir -p scripts/hooks plan/index.d plan/loop_status.d; printf 'packets:\\n    - packet_id: fixture-base-resident\\n      order: 900-fix\\n      status: ready\\n      title: base-resident\\n' > plan/index.yaml; cp \"$root/scripts/gate-stamp.sh\" scripts/; cp \"$root/scripts/hooks/pre-push-local-gate.sh\" scripts/hooks/; cp \"$root/scripts/plan-binary-probe.sh\" scripts/; git add -A; git commit -qm base; git init -q --bare \"$t/origin.git\"; git remote add origin \"$t/origin.git\"; git push -q origin main; printf '#!/usr/bin/env bash\\nexec bash \"$(git rev-parse --show-toplevel)/scripts/hooks/pre-push-local-gate.sh\" \"$@\"\\n' > .git/hooks/pre-push; chmod +x .git/hooks/pre-push; printf '      events:\\n        - type: note\\n          ts: \"2026-01-02T00:00:00Z\"\\n          host: fixturehost\\n          summary: forge scout finding\\n' >> plan/index.yaml; git add -A; git commit -qm 'scout finding, into the base'; before=$(git ls-remote origin refs/heads/main | cut -f1); out=$(git push origin main 2>&1); rc=$?; after=$(git ls-remote origin refs/heads/main | cut -f1); if [ \"$rc\" != 0 ] && echo \"$out\" | grep -q 'plan-only lane: not applicable' && echo \"$out\" | grep -q 'pre-push refused' && [ \"$before\" = \"$after\" ]; then echo 'ok: base-append-would-still-demand-the-full-gate'; else echo \"FAIL: rc=$rc before=$before after=$after\"; echo \"$out\"; exit 1; fi"
    timeout_ms: 20000
    expected_behavior: "ok: base-append-would-still-demand-the-full-gate"
  - step: "REFUSE: an invalid-YAML fragment fails lane validation and falls closed to the full gate"
    command: "root=$(pwd); _mfp=$(mf_plan_binary 2>/dev/null || true); [ -n \"$_mfp\" ] && export TILLANDSIAS_PLAN_BIN=\"$root/${_mfp#./}\"; t=$(mktemp -d); trap 'rm -rf \"$t\"' EXIT; git init -q -b main \"$t/work\"; cd \"$t/work\"; git config user.email l@t; git config user.name l; git config core.hooksPath \"$t/work/.git/hooks\"; mkdir -p scripts/hooks plan/index.d plan/loop_status.d; printf 'packets: []\n' > plan/index.yaml; cp \"$root/scripts/gate-stamp.sh\" scripts/; cp \"$root/scripts/hooks/pre-push-local-gate.sh\" scripts/hooks/; cp \"$root/scripts/plan-binary-probe.sh\" scripts/; printf 'packets: []\\n' > plan/index.d/29990101t000000z-existing-x.yaml; git add -A; git commit -qm base; git init -q --bare \"$t/origin.git\"; git remote add origin \"$t/origin.git\"; git push -q origin main; printf '#!/usr/bin/env bash\\nexec bash \"$(git rev-parse --show-toplevel)/scripts/hooks/pre-push-local-gate.sh\" \"$@\"\\n' > .git/hooks/pre-push; chmod +x .git/hooks/pre-push; printf 'packets: [unclosed\\n' > plan/index.d/29990101t000003z-lane-d-x.yaml; git add -A; git commit -qm bad; out=$(git push origin main 2>&1); rc=$?; if [ \"$rc\" != 0 ] && echo \"$out\" | grep -q 'plan-only lane: validation FAILED' && echo \"$out\" | grep -q 'pre-push refused'; then echo 'ok: invalid-fragment-fails-closed'; else echo \"FAIL: rc=$rc\"; echo \"$out\"; exit 1; fi"
    timeout_ms: 15000
    expected_behavior: "ok: invalid-fragment-fails-closed"

observability:
  traces:
    - "@trace spec:methodology-accountability"
  expected_log: "plan-only lane pinned: fragments-only pushes validated and marker-recorded without a build stamp; any other diff falls closed to the full gate"
  log_fields:
    spec: "methodology-accountability"
    test: "plan-only-push-lane-shape"
    artifact: "scripts/hooks/pre-push-local-gate.sh"

rollback:
  on_failure: >
    The plan-only lane drifted. Restore attempt_plan_only_lane() in
    scripts/hooks/pre-push-local-gate.sh: engage only when the gate stamp is
    stale, qualify only outgoing diffs whose EVERY path is a NEW (status A)
    top-level plan/index.d/*.yaml or plan/loop_status.d/*.md file — or, per
    order 767-iukh, a new/append-only-modified per-host ledger under
    plan/mo-full-attestations.d/ (byte-exact prefix property, added lines
    matching the MO-FULL grammar with LOCAL_SHA == REMOTE_SHA — for a NEW
    ledger admitting only the LEADING '# '-comment header record writes
    (848-bx2q) — and check-mo-full-attestations.sh green) — validate the
    pushed blobs (yq
    parse / Cycle-only headings) plus tillandsias-plan check and the
    fragment-applicable forbidden-pattern checks when present, emit
    "plan-only lane: validated <path>" per file and a "plan-only lane clean"
    verdict, and fall back to the unchanged full-gate refusal on ANY
    disqualification or validation failure.
  command: "grep -nE 'attempt_plan_only_lane|plan-only lane' scripts/hooks/pre-push-local-gate.sh | head -20"
