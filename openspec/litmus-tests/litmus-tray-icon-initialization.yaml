# @trace spec:tray-icon-lifecycle
name: litmus:tray-icon-initialization
spec: tray-icon-lifecycle
phase: pre-build
description: Verify the initial Pup state and the Mature/Dried enum names remain in use
severity: medium
size: quick

preconditions:
  - workspace contains crates/tillandsias-core
  - cargo is available in PATH

critical_path:
  - step: "run the Pup initialization test"
    command: "cargo test -p tillandsias-core tray_state_new_starts_with_pup_icon -- --exact"
    timeout_ms: 180000

  # The `! grep ...Base|Decay` clause is this step's NEGATIVE CONTROL: it fails
  # if either removed variant reappears in source, so the step distinguishes a
  # real vocabulary regression from mere text drift (634-39ik expression-pinning).
  # Uses portable grep, not rg, so it runs on rg-less hosts too (715-k5vs).
  - step: "verify the renamed tray icon variants are present (negative control: removed Base/Decay variants absent)"
    command: "grep -F 'TrayIconState::Mature' crates/tillandsias-core/src/state.rs && grep -F 'TrayIconState::Dried' crates/tillandsias-core/src/state.rs && ! grep -rnIE 'TrayIconState::Base|TrayIconState::Decay' crates/tillandsias-core/src crates/tillandsias-headless/src/tray/mod.rs"
    timeout_ms: 5000

observability:
  traces:
    - "@trace spec:tray-icon-lifecycle"
  expected_log: "Tray icon starts in Pup and the enum uses Mature/Dried naming"
  log_fields:
    spec: "tray-icon-lifecycle"
    test: "tray-icon-initialization"

rollback:
  on_failure: "inspect crates/tillandsias-core/src/state.rs for initial-state or variant-name drift"
  command: "sed -n '220,330p' crates/tillandsias-core/src/state.rs"
