# @trace spec:methodology-accountability
# @trace order:575
#
# Pins the ONE property that makes the expert metrics worth reporting: the
# answer-rate denominator, and the anti-gaming rule behind it.
#
# THE FAILURE THIS PREVENTS. `answer_rate = answered / (answered + unsupported)`
# deliberately EXCLUDES `degraded` (the expert could not run at all) and `error`
# (protocol). Folding degraded in would be an easy, well-intentioned edit — it
# makes the rate look better during infrastructure trouble — and it would
# recreate order 531 exactly: every plan_answer returned unsupported because the
# forge was seeded from a pre-expert branch, while `experts: ready` was reported
# truthfully and every health signal read green. A quality ratio that absorbs
# infrastructure failure cannot distinguish "the artifact is wrong" from "the
# questions were hard", which is the whole reason 531 stayed hidden.
#
# It also pins that `answered` requires CITATIONS. That is what makes the metric
# ungameable: an agent can call a tool a thousand times and not move the rate,
# because citations come from the compiled expert resolving a real packet or YAML
# path. A change letting `answered` be reached without citations converts a
# quality signal into a volume signal — the same defect that would make XP
# grindable in packet 567.
#
# Behavioural, not grep-only: the reporter is executed against seeded logs so a
# rewrite that keeps the words and changes the arithmetic still turns red.
name: litmus:cycle-metrics-answer-rate-shape
spec: methodology-accountability
phase: pre-build
description: >
  Execute scripts/cycle-metrics.sh against seeded telemetry and assert the
  answer-rate denominator excludes degraded and error, that the order-531
  signature gets its own verdict, that the reporter never fails the cycle it
  measures, and that substitution stays honestly unknown.
severity: high
size: instant

preconditions:
  - repository root contains scripts/cycle-metrics.sh
  - shell utilities (grep, sed, mktemp) are available in PATH

critical_path:
  - step: "the reporter is executable and emits the pinned experts grammar"
    command: "L=$(mktemp); printf '{\"tool\":\"plan_answer\",\"outcome\":\"answered\"}\\n' > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only 2>/dev/null | grep '^experts:'); rm -f $L; case \"$out\" in *calls=*answered=*unsupported=*degraded=*errors=*answer_rate=*) echo 'ok: experts grammar intact' ;; *) echo \"observed=$out\"; echo 'fail: experts grammar' ;; esac"
    # ============================================================================
    # !!! ELEVATED TIMEOUT — NOT A BUDGET. REMOVE ME. (order 1236-bmjh) !!!
    # ============================================================================
    # THIS NUMBER IS A LIE THE OPERATOR AUTHORISED ON 2026-09-17 SO A RELEASE
    # COULD SHIP. It was 10000 ms. Nothing about this step got slower on purpose
    # and nothing about it was fixed; the budget was raised to get out of the way
    # of a defect that lives somewhere else entirely.
    #
    # MEASURED, and this is why the old number was not wrong when it was written:
    #   scripts/cycle-metrics.sh: rc=0 in 29,908 ms on a QUIET host — THREE TIMES its own
#   10,000 ms budget, and this step only ever runs inside a compiling gate.
    #
    # THE REAL CAUSE IS A QUADRATIC LEDGER FOLD, not this step and not this host.
    # Measured within one host across two commits, same binary, quiet:
    #   c587bf335  4.32 MB base / 364 fragments  full load ~222 ms  raw parse ~48 ms
    #   HEAD       8.50 MB base / 827 fragments  full load ~992 ms  raw parse ~85 ms
    # 4.5x the time for 2x the data, and the PARSE IS ONLY 85 ms OF 992 — so the
    # obvious fix, "parse the ledger once", aims at 8.6% of the cost. The
    # superlinearity is three per-packet linear scans in
    # crates/tillandsias-plan/src/fragments.rs plus a full clone of the parsed
    # tree: roughly 1.1 MILLION string comparisons per load on this corpus,
    # growing as packets x fragments. See 964-tzmp and 1233-jqp4.
    #
    # SO THIS NUMBER ROTS BY DESIGN. It buys time proportional to how fast the
    # fleet files packets, and it buys it on the BUSIEST host last — the host
    # with the most work done reds first and looks like an outlier when it is the
    # leading indicator. Raising it again is not a remedy; it is this same
    # decision taken a second time with less excuse.
    #
    # DO NOT COPY THIS VALUE TO A NEW STEP. A step written against 300000 has no
    # measured basis at all; it has inherited a workaround.
    #
    # A BUDGET KILL IS STILL A FAIL (820-c8q8), so a genuinely hung producer still
    # reds the gate — it now costs five minutes to say so instead of ten seconds.
    #
    # REMOVAL IS TRACKED AS 1236-bmjh AND IS SEQUENCED: these five come out ONE
    # AT A TIME as the fold fix lands, each removal proving on its own that the
    # step passes at its ORIGINAL budget. A single sweeping revert would tell us
    # nothing about which of the five the fix actually reached.
    # ============================================================================
    timeout_ms: 300000
    expected_behavior: "ok: experts grammar intact"

  - step: "answer_rate EXCLUDES degraded from its denominator (order 531 must not be absorbed as a hard question)"
    command: "L=$(mktemp); printf '{\"tool\":\"a\",\"outcome\":\"answered\"}\\n{\"tool\":\"a\",\"outcome\":\"degraded\"}\\n{\"tool\":\"a\",\"outcome\":\"degraded\"}\\n{\"tool\":\"a\",\"outcome\":\"degraded\"}\\n' > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only 2>/dev/null | grep '^experts:'); rm -f $L; case \"$out\" in *answer_rate=100%*) echo 'ok: degraded excluded' ;; *) echo \"observed=$out expected answer_rate=100% (1 answered, 0 unsupported, 3 degraded)\"; echo 'fail: degraded folded into the denominator' ;; esac"
    timeout_ms: 10000
    expected_behavior: "ok: degraded excluded"

  - step: "answer_rate EXCLUDES protocol errors from its denominator"
    command: "L=$(mktemp); printf '{\"tool\":\"a\",\"outcome\":\"answered\"}\\n{\"tool\":\"a\",\"outcome\":\"error\"}\\n{\"tool\":\"a\",\"outcome\":\"error\"}\\n' > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only 2>/dev/null | grep '^experts:'); rm -f $L; case \"$out\" in *answer_rate=100%*) echo 'ok: errors excluded' ;; *) echo \"observed=$out expected answer_rate=100%\"; echo 'fail: errors folded into the denominator' ;; esac"
    timeout_ms: 10000
    expected_behavior: "ok: errors excluded"

  - step: "a genuine refusal DOES count against the rate (the metric must still be able to say 'useless')"
    command: "L=$(mktemp); printf '{\"tool\":\"a\",\"outcome\":\"answered\"}\\n{\"tool\":\"a\",\"outcome\":\"unsupported\"}\\n' > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only 2>/dev/null | grep '^experts:'); rm -f $L; case \"$out\" in *answer_rate=50%*) echo 'ok: refusals counted' ;; *) echo \"observed=$out expected answer_rate=50%\"; echo 'fail: refusals not counted — the metric can no longer report uselessness' ;; esac"
    timeout_ms: 10000
    expected_behavior: "ok: refusals counted"

  - step: "the order-531 signature (expert ran every time, answered nothing) is reported, not silently averaged away"
    command: "grep -Fq 'expert-answered-nothing-check-base-branch' scripts/cycle-metrics.sh && echo 'ok: 531 signature has a verdict'"
    timeout_ms: 5000
    expected_behavior: "ok: 531 signature has a verdict"

  - step: "substitution stays honestly unknown (it needs the harness tool log; an estimate would fake it)"
    command: "L=$(mktemp); : > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only 2>/dev/null | grep '^experts_substitution:'); rm -f $L; case \"$out\" in *unknown*) echo 'ok: substitution unknown' ;; *) echo \"observed=$out\"; echo 'fail: substitution must stay unknown, never estimated' ;; esac"
    timeout_ms: 10000
    expected_behavior: "ok: substitution unknown"

  - step: "the reporter never fails the cycle it measures (verdict carries judgement, not exit status)"
    command: "L=$(mktemp); printf '{\"tool\":\"a\",\"outcome\":\"degraded\"}\\n' > $L; TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only >/dev/null 2>&1; rc=$?; rm -f $L; if [ $rc -eq 0 ]; then echo 'ok: reporter exits 0'; else echo \"observed rc=$rc expected 0\"; echo 'fail: a metrics reporter must not fail the cycle it measures'; fi"
    timeout_ms: 10000
    expected_behavior: "ok: reporter exits 0"

  - step: "the anti-gaming rule is stated in the methodology, not only in the script"
    command: "grep -Fq 'anti_gaming_rule' methodology/agent-observability.yaml && grep -Fq 'CITATIONS' methodology/agent-observability.yaml && echo 'ok: anti-gaming rule recorded'"
    timeout_ms: 5000
    expected_behavior: "ok: anti-gaming rule recorded"

  - step: "telemetry at the MCP chokepoint is fail-soft (a metric may not break the surface it measures)"
    command: "grep -Fq 'record_expert_call' images/default/config-overlay/mcp/forge-plan.sh && grep -Fq '|| true' images/default/config-overlay/mcp/forge-plan.sh && echo 'ok: telemetry fail-soft'"
    timeout_ms: 5000
    expected_behavior: "ok: telemetry fail-soft"

  # ── packet 682-ym68: usage AND accuracy surfaced every cycle ──────────────
  - step: "the mcp usage line is emitted with its pinned fields (are the servers used?)"
    # Distinct from answer_rate: a volume line. Today only the plan expert logs,
    # so the other servers must be NAMED uninstrumented, never faked as zero.
    command: "L=$(mktemp); printf '{\"tool\":\"plan_answer\",\"outcome\":\"answered\"}\\n' > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only 2>/dev/null | grep '^mcp: '); rm -f $L; case \"$out\" in *servers=*plan-expert-calls=*other-servers=uninstrumented-see-682-m8ek*source=*) echo 'ok: mcp usage line intact' ;; *) echo \"observed=$out\"; echo 'fail: mcp usage grammar' ;; esac"
    timeout_ms: 10000
    expected_behavior: "ok: mcp usage line intact"

  - step: "packet 682-m8ek: the mcp line reports REAL per-server counts when rows carry a server field"
    # Once every server tags its rows (682-m8ek), the mcp line groups by server
    # instead of naming the rest uninstrumented. Seed a multi-server log and
    # assert per_server carries each server's count.
    command: "L=$(mktemp); printf '{\"server\":\"forge-plan\",\"tool\":\"plan_answer\",\"outcome\":\"answered\"}\\n{\"server\":\"project-info\",\"tool\":\"project_type\",\"outcome\":\"answered\"}\\n{\"server\":\"git-tools\",\"tool\":\"git_status\",\"outcome\":\"answered\"}\\n{\"server\":\"git-tools\",\"tool\":\"git_log\",\"outcome\":\"answered\"}\\n' > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only 2>/dev/null | grep '^mcp: '); rm -f $L; case \"$out\" in *servers=3*forge-plan=1*git-tools=2*project-info=1*) echo 'ok: per-server counts' ;; *) echo \"observed=$out\"; echo 'fail: mcp per-server counts' ;; esac"
    timeout_ms: 10000
    expected_behavior: "ok: per-server counts"

  - step: "packet 682-m8ek: the experts line stays scoped to the plan expert when other servers share the log"
    # The other servers writing to the same log must NOT inflate the expert's
    # call/answer counts. One forge-plan answered + three non-expert rows must
    # still report experts calls=1.
    command: "L=$(mktemp); printf '{\"server\":\"forge-plan\",\"tool\":\"plan_answer\",\"outcome\":\"answered\"}\\n{\"server\":\"project-info\",\"tool\":\"project_type\",\"outcome\":\"answered\"}\\n{\"server\":\"git-tools\",\"tool\":\"git_status\",\"outcome\":\"answered\"}\\n{\"server\":\"git-tools\",\"tool\":\"git_log\",\"outcome\":\"answered\"}\\n' > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only 2>/dev/null | grep '^experts:'); rm -f $L; if printf '%s' \"$out\" | grep -Eq 'calls=1 answered=1 '; then echo 'ok: experts scoped to plan expert'; else echo \"observed=$out\"; echo 'fail: non-expert rows leaked into experts counts'; fi"
    timeout_ms: 10000
    expected_behavior: "ok: experts scoped to plan expert"

  - step: "the expert_accuracy line is emitted (are the experts right?) — pass/total/rate or an honest deferral"
    # The groundtruth pass-rate, distinct from answer_rate. It either reports
    # pass=/total=/rate= from groundtruth-rung1, or defers to the litmus gate —
    # never a fabricated number.
    # source= accepts every label the emitter can produce: 786-kjke widened
    # the metric to groundtruth-all-sets (with rung1 as the narrow fallback),
    # but this pin still named only rung1 — invisible for a week because the
    # grade harness failed on every host (879-gidx) so the DEFERRAL arm always
    # matched, and the graded arm's stale pattern was never exercised. The
    # first host whose grading worked was failed by this step FOR succeeding.
    command: "L=$(mktemp); printf '{\"tool\":\"plan_answer\",\"outcome\":\"answered\"}\\n' > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh --experts-only 2>/dev/null | grep '^expert_accuracy: '); rm -f $L; case \"$out\" in *pass=*total=*rate=*source=groundtruth-*) echo 'ok: expert_accuracy graded' ;; *deferred*source=litmus:expert-groundtruth-harness*) echo 'ok: expert_accuracy deferred' ;; *) echo \"observed=$out\"; echo 'fail: expert_accuracy grammar' ;; esac"
    timeout_ms: 40000
    expected_behavior: "ok: expert_accuracy"

  - step: "both surfaced lines are required by the methodology, not only emitted by the script"
    command: "grep -Fq 'surfaced_every_cycle' methodology/agent-observability.yaml && grep -Fq 'expert_accuracy' methodology/agent-observability.yaml && grep -Fq 'mcp_usage' methodology/agent-observability.yaml && echo 'ok: surfaced lines recorded in methodology'"
    timeout_ms: 5000
    expected_behavior: "ok: surfaced lines recorded in methodology"

  - step: "890-nkdz rule 1: a timing line derived from a log with any memoised gate run carries build_check_mix=mixed:forced=N,memoised=M, and the label is absent only when every run was forced (RED before the labelling change)"
    command: "bash scripts/test-cycle-metrics-mix-label.sh 2>&1 | tail -1"
    timeout_ms: 20000
    expected_behavior: "PASS: build_check_mix label 2/2 (890-nkdz)"

  # ── packet 1004-j4p4: a probe whose target is gone must go RED, not unknown ──
  - step: "1004-j4p4: every scripts/*.sh the reporter probes exists and is executable, and the repo: traces= field is never a bare unknown"
    # THE SHAPE. For four weeks the repo: block tested `-x` on a script retired
    # on 2026-08-08; the test was false everywhere, the probe never ran, and
    # every host printed traces=unknown every cycle — a well-formed nothing
    # that reads as "someone else is looking". Two assertions, both
    # behavioural: (1) each `$REPO_ROOT/scripts/<name>.sh` path the reporter
    # names exists in this tree — and is executable when the reporter INVOKES
    # it; a path it SOURCES (`. "$REPO_ROOT/...`) is a library and need only
    # exist, plan-binary-probe.sh is mode 644 by design — so the next
    # retirement turns this step red instead of turning a field to unknown;
    # (2) the reporter, run for real against an empty usage log, prints a
    # traces= value from the pinned set current|stale|unavailable:<reason>.
    # Shown red against the pre-fix probe on 2026-09-04 (it reported
    # probed-but-absent: scripts/generate-traces.sh and traces=unknown) and
    # green after — the same command, so it distinguishes the two states.
    command: "miss=''; while IFS= read -r l; do p=$(printf '%s' \"$l\" | grep -oE '[$]REPO_ROOT/scripts/[A-Za-z0-9_.-]+[.]sh' | head -1); p=${p#*REPO_ROOT/}; case \"$l\" in *'. \"$REPO_ROOT/'*|*'source \"$REPO_ROOT/'*) [ -f \"$p\" ] || miss=\"$miss $p(sourced-but-missing)\" ;; *) [ -x \"$p\" ] || miss=\"$miss $p(invoked-but-missing-or-not-executable)\" ;; esac; done < <(grep -E '[$]REPO_ROOT/scripts/[A-Za-z0-9_.-]+[.]sh' scripts/cycle-metrics.sh | sort -u); L=$(mktemp); : > $L; out=$(TILLANDSIAS_EXPERT_USAGE_LOG=$L scripts/cycle-metrics.sh 2>/dev/null | grep '^repo: '); rm -f $L; t=${out##*traces=}; t=${t%% *}; bad=''; [ -n \"$miss\" ] && bad=\"probed-but-absent:$miss\"; case \"$t\" in current|stale|unavailable:?*) ;; *) bad=\"$bad traces=${t:-<no-repo-line>}\" ;; esac; if [ -z \"$bad\" ]; then echo \"ok: probe targets exist, traces=$t\"; else echo \"observed:$bad\"; echo 'fail: the reporter probes a script that is not in the tree, or traces= is a bare unknown (1004-j4p4)'; fi"
    timeout_ms: 30000
    expected_behavior: "ok: probe targets exist"

failure_modes:
  - "degraded folded into the answer-rate denominator, making a wrong artifact look like a hard question (order 531 recurrence)"
  - "answered reachable without citations, converting a quality signal into a gameable volume signal"
  - "substitution reported as an estimated number instead of unknown"
  - "the reporter exits non-zero and fails the cycle it was measuring"
  - "telemetry failure propagating into an expert tool call"
  - "the reporter probes a script path that was retired, so a field prints a well-formed unknown every cycle and nobody notices the probe never ran (1004-j4p4)"
