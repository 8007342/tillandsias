# @trace spec:proxy-container, order:2041-i3nk
#
# Part 2 of 2041-i3nk, run against the BUILT proxy image. Each egress tier has
# its own Squid port and is held to its tier by name at both ends of a CONNECT:
# the target in http_access, and the client SNI in ssl_bump after the step-1
# peek. Both directions of a name mismatch are refused, and so is a missing
# SNI. Port 3128 keeps serving the union. Whether the SNI resolves to the
# CONNECT address is 2041-8azp, not this test.
# Network: allowlisted hosts plus the deliberate refusals, and no credentials;
# a throwaway CA is made for the run. Cleanup removes only the container it
# started (by ID) and the image tag it built (by name).
name: litmus:proxy-tier-ports-live
spec: proxy-container
phase: post-build
description: >
  The built proxy image parses with the generated tier-ports include. On the
  assets port it allows fonts.googleapis.com and refuses pypi.org, an allowed
  target carrying off-tier SNI, an off-tier target carrying allowed SNI, and a
  ClientHello with no SNI. The registries port reaches pypi.org, and 3128
  still serves the union.
severity: high
size: e2e

preconditions:
  - podman (rootless) and openssl on the host, and network to fonts.googleapis.com and pypi.org

critical_path:
  - step: "squid -k parse, allow, off-tier, SNI-off, DST-off, no-SNI, second tier, union"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-proxy-tier-ports-live.lua 2>&1"
    timeout_ms: 1200000
    expected_behavior: "ok:proxy-tier-ports-live:8 arms"

observability:
  traces:
    - "@trace spec:proxy-container"
  expected_log: "eight arms: PARSE, ALLOW, OFFTIER, SNI-OFF, DST-OFF, NOSNI, TIER2, UNION"
  log_fields:
    spec: "proxy-container"
    test: "proxy-tier-ports-live"

rollback:
  on_failure: "read the FAIL lines; the port include is images/proxy/tier-ports.conf, generated by scripts/lua/build-proxy-allowlist.lua, included in images/proxy/squid.conf after the step-1 peek"
  command: "grep -n 'include /etc/squid/tier-ports.conf' images/proxy/squid.conf"
