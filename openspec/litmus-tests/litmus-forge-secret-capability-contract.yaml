# @trace spec:podman-idiomatic-patterns, spec:podman-secrets-integration, spec:tillandsias-vault
#
# Order 461 — podman-idiomatic-forge-secret-contract-drift.
#
# Two active specs disagreed about forge `--secret` flags:
#
#   * podman-idiomatic-patterns said a forge container "MUST NOT receive any
#     `--secret` flags" and "MUST remain fully credential-free".
#   * podman-secrets-integration deliberately permits a configured OpenCode
#     forge to receive `tillandsias-vault-token-opencode-forge-<id>` at
#     `/run/secrets/vault-token`, and tillandsias-vault
#     (`tillandsias-vault.security.forge-offline@v2`) says the same.
#
# HEAD agrees with the NARROW specs, not the generic one:
#   crates/tillandsias-headless/src/main.rs `build_opencode_forge_args()`
#   pushes exactly one `--secret` behind `if let Some(secret_name) =
#   opencode_vault_secret`, and `build_forge_agent_run_args_with_vault()`
#   pushes exactly one `spec.secret(...)` behind
#   `if mode_provider_pair(mode).is_some() && let Some(secret_name) =
#   vault_secret`. Both use GIT_VAULT_TOKEN_SECRET_OPTS
#   (`target=vault-token,uid=1000,gid=1000,mode=0400`). Maintenance and
#   unconfigured OpenCode lanes mount nothing.
#
# The reconciliation keeps the SECURITY intent by splitting credential from
# capability: raw provider credential BYTES never reach a forge launch; a
# short-lived, least-privilege Vault AppRole CLIENT TOKEN may.
#
# This litmus pins that reconciled invariant on BOTH sides so a refactor
# cannot silently re-diverge:
#   * the retired absolute prohibition cannot come back (step 1)
#   * the two specs keep making the same claim (step 2)
#   * each forge run-arg builder keeps exactly ONE gated, scoped mount
#     (steps 3 + 4)
#   * the one known raw-provider-key env deviation cannot spread (step 5)
#   * the named behavioural checks that prove the argv shape still exist
#     (step 6)
#   * the spec keeps recording both the invariant and its open deviation
#     (step 7)
#
# Step 5 is the "named falsifiable check" the packet asks for: the
# Claude/Codex/Antigravity agent lanes still inject raw provider API keys as
# `--env <PROVIDER>_API_KEY=<value>` (main.rs `provider_api` block inside
# build_forge_agent_run_args_with_vault). That FAILS the reconciled wording
# and is recorded as
# `podman-idiomatic-patterns.deviation.agent-forge-api-key-in-env`. The step
# budgets the deviation at its 2 known lines and turns red if a third
# appears, or if the credential-free lanes stop opting out.
name: litmus:forge-secret-capability-contract
spec: podman-idiomatic-patterns
phase: pre-build
size: instant
severity: high
description: >
  Pin the order-461 reconciliation of the generic Podman forge-secret
  prohibition with the scoped Vault capability mounts that
  podman-secrets-integration and tillandsias-vault authorize: forge lanes
  carry zero raw provider credentials, and at most ONE short-lived
  per-container `vault-token` AppRole mount, gated per lane.

preconditions:
  - workspace contains openspec/specs/podman-idiomatic-patterns/spec.md
  - workspace contains openspec/specs/podman-secrets-integration/spec.md
  - workspace contains crates/tillandsias-headless/src/main.rs
  - shell utilities (grep, awk) are available in PATH

critical_path:
  - step: "the refuted absolute forge no-secret prohibition stays retired"
    # The drift was a FALSE absolute claim, not a missing one. If a future
    # edit reinstates "Forge containers receive no secrets" / "MUST NOT
    # receive any --secret flags", the generic spec once again contradicts
    # podman-secrets-integration, tillandsias-vault, AND HEAD — and every
    # compliant credentialed lane becomes spec-illegal.
    command: "S=openspec/specs/podman-idiomatic-patterns/spec.md; if grep -Fq 'Scenario: Forge containers receive no secrets' \"$S\" || grep -Fq 'MUST NOT receive any' \"$S\"; then echo 'FAIL: the refuted absolute forge no-secret claim is back in podman-idiomatic-patterns'; exit 1; fi; echo 'ok: absolute forge --secret prohibition stays retired'"
    timeout_ms: 5000
    success_pattern: "^ok:"
    failure_pattern: "FAIL"

  - step: "both specs make the same claim about scoped forge AppRole secrets"
    # Exit criterion 1. The generic spec must carry the three reconciled
    # scenarios AND the narrow spec must keep the two counterpart scenarios
    # it already had. Deleting either side re-opens the contradiction.
    command: "S=openspec/specs/podman-idiomatic-patterns/spec.md; N=openspec/specs/podman-secrets-integration/spec.md; for p in 'Scenario: Forge containers carry no raw provider credential' 'Scenario: A credentialed forge lane mounts one short-lived Vault capability' 'Scenario: Credential-free forge lanes receive no'; do grep -Fq \"$p\" \"$S\" || { echo \"FAIL: podman-idiomatic-patterns lost reconciled scenario: $p\"; exit 1; }; done; for p in 'Scenario: Configured OpenCode receives a provider-scoped AppRole token' 'Scenario: Provider-free forge containers receive no credential mount'; do grep -Fq \"$p\" \"$N\" || { echo \"FAIL: podman-secrets-integration lost counterpart scenario: $p\"; exit 1; }; done; echo 'ok: both specs make the same claim about scoped forge AppRole secrets'"
    timeout_ms: 5000
    success_pattern: "^ok:"
    failure_pattern: "FAIL"

  - step: "opencode forge builder mounts exactly one gated, scoped vault-token secret"
    # HEAD reality (main.rs build_opencode_forge_args): a single `--secret`
    # push, behind `if let Some(secret_name) = opencode_vault_secret`, using
    # GIT_VAULT_TOKEN_SECRET_OPTS. A second `--secret` site, an ungated push,
    # or a different mount shape would either broaden the forge's Vault
    # authority or hand it a non-capability secret.
    command: "M=crates/tillandsias-headless/src/main.rs; W=$(awk '/^fn build_opencode_forge_args/,/^}/' \"$M\"); n=$(printf '%s\\n' \"$W\" | grep -c -- --secret); if [ \"$n\" -ne 1 ]; then echo \"FAIL: opencode forge builder has $n --secret sites, expected exactly 1\"; exit 1; fi; printf '%s\\n' \"$W\" | grep -Fq 'if let Some(secret_name) = opencode_vault_secret' || { echo 'FAIL: opencode forge --secret is no longer gated on opencode_vault_secret'; exit 1; }; printf '%s\\n' \"$W\" | grep -Fq '{secret_name},{GIT_VAULT_TOKEN_SECRET_OPTS}' || { echo 'FAIL: opencode forge secret dropped the scoped vault-token mount opts'; exit 1; }; echo 'ok: opencode forge builder mounts exactly one gated scoped vault-token secret'"
    timeout_ms: 5000
    success_pattern: "^ok:"
    failure_pattern: "FAIL"

  - step: "agent forge builder mounts exactly one gated, scoped vault-token secret"
    # Same contract on the Codex/Claude/Antigravity/OpenCode/Maintenance
    # builder: one `spec.secret(...)`, gated on
    # `mode_provider_pair(mode).is_some()` so credential-free modes mount
    # nothing, using the same scoped mount options.
    command: "M=crates/tillandsias-headless/src/main.rs; W=$(awk '/^fn build_forge_agent_run_args_with_vault/,/^}/' \"$M\"); n=$(printf '%s\\n' \"$W\" | grep -c 'spec.secret('); if [ \"$n\" -ne 1 ]; then echo \"FAIL: agent forge builder has $n secret sites, expected exactly 1\"; exit 1; fi; printf '%s\\n' \"$W\" | grep -Fq 'if mode_provider_pair(mode).is_some()' || { echo 'FAIL: agent forge secret is no longer gated on mode_provider_pair'; exit 1; }; printf '%s\\n' \"$W\" | grep -Fq '{secret_name},{GIT_VAULT_TOKEN_SECRET_OPTS}' || { echo 'FAIL: agent forge secret dropped the scoped vault-token mount opts'; exit 1; }; echo 'ok: agent forge builder mounts exactly one gated scoped vault-token secret'"
    timeout_ms: 5000
    success_pattern: "^ok:"
    failure_pattern: "FAIL"

  - step: "raw provider-key env injection does not spread beyond the known deviation"
    # NAMED FALSIFIABLE CHECK for exit criterion 3.
    # podman-idiomatic-patterns.deviation.agent-forge-api-key-in-env: the
    # Claude/Codex/Antigravity lanes read the provider API key out of Vault
    # ON THE HOST and inject it as `--env <PROVIDER>_API_KEY=<raw value>`
    # (2 lines: `spec.env(p.env_var(), &key)` and the Gemini
    # GOOGLE_GENERATIVE_AI_API_KEY alias). That violates the reconciled
    # "no raw provider credential" scenario and the secrets-not-in-env
    # invariant, and it is visible to `podman inspect`.
    # Order 431 already fixed the OpenCode lane. Until a code-scope packet
    # converts the rest, this step budgets the deviation at its 2 known
    # lines, forbids the OpenCode builder from regaining one, and requires
    # the credential-free lanes to keep opting out.
    command: "M=crates/tillandsias-headless/src/main.rs; n=$(grep -cF -e '.env(p.env_var()' -e 'GOOGLE_GENERATIVE_AI_API_KEY' \"$M\"); if [ \"$n\" -gt 2 ]; then echo \"FAIL: $n raw provider-key env injection lines, known deviation budget is 2\"; exit 1; fi; W=$(awk '/^fn build_opencode_forge_args/,/^}/' \"$M\"); if printf '%s\\n' \"$W\" | grep -qE 'API_KEY=|AUTH_CONTENT=|env_var'; then echo 'FAIL: the opencode forge builder regained a raw provider-credential env injection'; exit 1; fi; A=$(awk '/^fn build_forge_agent_run_args_with_vault/,/^}/' \"$M\"); printf '%s\\n' \"$A\" | grep -Fq 'ForgeAgentMode::OpenCode | ForgeAgentMode::Maintenance => None,' || { echo 'FAIL: credential-free lanes no longer opt out of provider API-key injection'; exit 1; }; echo \"ok: raw provider-key env injection confined to the $n known deviation lines\""
    timeout_ms: 5000
    success_pattern: "^ok:"
    failure_pattern: "FAIL"

  - step: "named behavioural checks for the forge argv shape still exist"
    # These three unit tests are the behavioural half of the contract: they
    # build real argv and assert the scoped mount is present with no
    # credential bytes, that the unconfigured lane mounts nothing, and that
    # EVERY credentialed agent mode mounts its lease. Deleting one would
    # leave only source-shape greps behind.
    command: "M=crates/tillandsias-headless/src/main.rs; for t in opencode_vault_auth_mount_is_scoped_and_contains_no_credential_bytes opencode_without_vault_key_preserves_credential_free_lane forge_mounts_scoped_vault_lease_for_every_credentialed_mode; do grep -Fq \"fn $t(\" \"$M\" || { echo \"FAIL: named behavioural check missing: $t\"; exit 1; }; done; echo 'ok: all 3 named behavioural checks present'"
    timeout_ms: 5000
    success_pattern: "^ok:"
    failure_pattern: "FAIL"

  - step: "the reconciled invariant and its open deviation are both recorded"
    # A future agent must not be able to close the deviation by deleting the
    # record instead of fixing the code: the invariant and the deviation ID
    # are pinned together. When the code fix lands, this step and step 5 are
    # updated in the same commit that removes the deviation.
    command: "S=openspec/specs/podman-idiomatic-patterns/spec.md; grep -Fq 'podman-idiomatic-patterns.invariant.forge-capability-only' \"$S\" || { echo 'FAIL: forge-capability-only invariant missing from podman-idiomatic-patterns'; exit 1; }; grep -Fq 'podman-idiomatic-patterns.deviation.agent-forge-api-key-in-env' \"$S\" || { echo 'FAIL: the open deviation record was deleted without the code fix'; exit 1; }; echo 'ok: reconciled invariant and its open deviation are both recorded'"
    timeout_ms: 5000
    success_pattern: "^ok:"
    failure_pattern: "FAIL"

observability:
  traces:
    - "@trace spec:podman-idiomatic-patterns"
    - "@trace spec:podman-secrets-integration"
    - "@trace spec:tillandsias-vault"
  expected_log: "generic and narrow forge-secret claims agree; each forge builder keeps one gated scoped vault-token mount; raw provider-key env deviation contained"
  log_fields:
    spec: "podman-idiomatic-patterns,podman-secrets-integration,tillandsias-vault"
    test: "forge-secret-capability-contract"
    artifact: "openspec/specs/podman-idiomatic-patterns/spec.md + openspec/specs/podman-secrets-integration/spec.md + crates/tillandsias-headless/src/main.rs"

rollback:
  on_failure: >
    Do NOT resolve a red here by restoring the absolute
    "forge containers receive no secrets" wording — that claim was refuted
    against HEAD on 2026-07-28 (order 461) and contradicts both
    podman-secrets-integration and tillandsias-vault. Restore instead: the
    three reconciled scenarios under
    podman-idiomatic-patterns.secrets.ephemeral-mount@v1, the
    forge-capability-only invariant, the recorded deviation
    podman-idiomatic-patterns.deviation.agent-forge-api-key-in-env, the
    single gated `--secret` / `spec.secret(...)` push in each of
    build_opencode_forge_args and build_forge_agent_run_args_with_vault
    using GIT_VAULT_TOKEN_SECRET_OPTS, and the three named unit tests. If a
    new raw provider-key env injection tripped step 5, remove it — do not
    raise the budget.
  command: "grep -n 'Scenario: Forge containers\\|forge-capability-only\\|agent-forge-api-key-in-env' openspec/specs/podman-idiomatic-patterns/spec.md; grep -n -- '--secret\\|spec.secret(\\|env(p.env_var()' crates/tillandsias-headless/src/main.rs | head -20"
