# @trace spec:init-command
# @trace order:1339-r9xv
# @trace order:1560-uam3
#
# Order 1339-r9xv: scripts/install-windows.ps1 mentioned `.wslconfig` ZERO
# times, so a user's first build ran on whatever WSL defaults gave them.
#
# MEASURED, yolanda-windows 2026-09-21. On a 16-logical-CPU host with 15.16
# GiB, the defaults produced a guest holding ALL 16 vCPUs inside a 4.8 GiB
# balloon -- roughly 320 MB per vCPU -- and FOUR CONSECUTIVE BUILDS WERE
# KILLED for host memory. The same gates on esmeraldinha, a FOUR-core N100,
# with `processors=4` (100% of that machine) and `autoMemoryReclaim=gradual`,
# were never killed once. THE MORE CAPABLE MACHINE WAS THE UNRELIABLE ONE and
# the difference was entirely configuration: a missing reclaim setting,
# `processors` copied as a NUMBER when it is a POLICY, and test threads that
# CARGO_BUILD_JOBS does not bound (24 of 25 cargo test invocations unpinned).
#
# THE SHAPE ADVICE (memory, processors) IS REPORTED, NEVER WRITTEN. The swap
# and memory-reclaim keys started behind a [y/N] (2026-09-26); on 2026-10-12
# the operator ruled them hard requirements ("HyperV and SWAP should not be
# prompts, our install should add them forcibly as they're hard
# requirements"), so 1560-uam3 ENSURES them without asking: absent keys added,
# conflicting values replaced, a backup written first. Arm 5 now enforces
# "every write of .wslconfig sits inside Invoke-WslConfigEnsure, after its
# backup", and scripts/lua/test-installer-merges-wslconfig-swap-keys.lua RUNS
# the functions against scratch files.
#
# ARM 0 IS WRITTEN FIRST AND ON PURPOSE. Every other arm reads the installer
# source; if that read fails they see nothing and would report the SUBJECT as
# broken. This fleet met that failure five times in one night. Arm 0 refuses
# with could-not-run and says a measurement failure is NOT a verdict.
name: litmus:installer-reports-wsl-guest-shape
spec: init-command
phase: pre-build
description: >
  Pin 1339-r9xv and 1560-uam3: the Windows installer derives and REPORTS the
  guest shape the user's `.wslconfig` will produce, NAMES a known-bad
  vCPU-to-memory ratio with its measured numbers, warns that
  `autoMemoryReclaim` under `[wsl2]` is inert, and ENSURES the swap and
  memory-reclaim keys without a prompt: only inside Invoke-WslConfigEnsure,
  backup first, absent keys added and conflicting values replaced, memory and
  processors never touched. Falsifiable against the pre-1560 installer (the
  merge fixture's prompt, opt-out, replacement, ensure, restart and Hyper-V
  arms red) and against a write outside the ensure function (arm 5).
severity: high
size: instant

preconditions:
  - workspace contains scripts/test-installer-reports-wsl-guest-shape.sh
  - workspace contains scripts/lua/test-installer-merges-wslconfig-swap-keys.lua
  - workspace contains scripts/install-windows.ps1
  - the shape fixture reads SOURCE only and runs everywhere; the merge fixture
    RUNS the real functions through PowerShell against scratch files and names
    its run a skip where no PowerShell exists. Neither asserts anything about a
    live WSL guest, and neither touches the real .wslconfig or group membership

critical_path:
  - step: "the fixture parses and carries its exec bit"
    command: "bash -n scripts/test-installer-reports-wsl-guest-shape.sh && test -x scripts/test-installer-reports-wsl-guest-shape.sh && echo 'ok: wsl-guest-shape-fixture-parses'"
    timeout_ms: 10000
    expected_behavior: "ok: wsl-guest-shape-fixture-parses"
    assert_exit: 0
    assert_output_contains: "ok: wsl-guest-shape-fixture-parses"

  - step: "all seven arms pass against the real installer: it reads .wslconfig, derives the effective shape, names the ratio with its numbers, warns about [experimental], writes the file only inside Invoke-WslConfigEnsure after its backup, and refuses to advise when it cannot read the host"
    command: "bash scripts/test-installer-reports-wsl-guest-shape.sh"
    timeout_ms: 60000
    expected_behavior: "ok:installer-reports-wsl-guest-shape:7/7 arms"
    assert_exit: 0
    assert_output_contains: "ok:installer-reports-wsl-guest-shape:7/7 arms"

  # SOURCE PIN, asserted on the file directly so a fixture that stopped
  # looking cannot hide it: outside the body of Invoke-WslConfigEnsure (from
  # its `function` line to the next top-level `}`), zero write verbs name
  # `.wslconfig`'s path variables, and the installer has no prompt. `|| true`
  # on every count is load-bearing -- grep -c exits 1 on a legitimate zero.
  - step: "SOURCE PIN: the installer references .wslconfig, writes it only inside Invoke-WslConfigEnsure, and has no prompt"
    command: "mkdir -p target/work && f=target/work/wgs.$$ && sed 's/#.*//' scripts/install-windows.ps1 | awk '/^function Invoke-WslConfigEnsure/{s=1} s&&/^}/{s=0;next} !s' > $f && m=$(grep -c 'wslconfig' $f || true) && w=$(grep -cE '(Set-Content|Out-File|Add-Content|Copy-Item|Move-Item|Remove-Item|WriteAllLines|WriteAllText).*(\\$WslCfgPath|\\$Path)' $f || true) && p=$(grep -cE 'Read-Host|\\[y/N\\]|\\[Y/n\\]' $f || true) && rm -f $f && test \"$m\" -gt 0 && test \"$w\" -eq 0 && test \"$p\" -eq 0 && echo \"ok: wslconfig-mentions=$m writes-outside-ensure=$w prompts=$p\""
    timeout_ms: 15000
    expected_behavior: "ok: wslconfig-mentions=<n>0 writes-outside-ensure=0 prompts=0"
    assert_exit: 0
    assert_output_contains: "writes-outside-ensure=0 prompts=0"

  - step: "the swap and memory-reclaim keys are ensured without asking: absent keys added, conflicts replaced after a backup, compliant files untouched, the shared VM restarted only when ours is the sole running distro, and the Hyper-V sign-out note only when IsInRole stays false (run through PowerShell where present)"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-installer-merges-wslconfig-swap-keys.lua 2>&1"
    timeout_ms: 120000
    expected_behavior: "ok:wslconfig-merge-fixture:ran=<n> skipped=<m>"
    assert_exit: 0
    assert_output_contains: "ok:wslconfig-merge-fixture:"
