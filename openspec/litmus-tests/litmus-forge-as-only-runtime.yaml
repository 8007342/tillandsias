# @trace spec:forge-as-only-runtime
name: litmus:forge-as-only-runtime
spec: forge-as-only-runtime
phase: post-build
description: Verify the forge image holds bash and, for claude, codex and opencode, the lane that installs each at launch (the source half is litmus-forge-no-raw-podman.yaml, pre-build)
severity: critical
size: quick

preconditions:
  - podman is available in PATH (or via the socket-aware wrapper)
  - the tillandsias-forge image has been built (post-build check)

critical_path:
  # Each name is asked alone; no local forge image is a named skip, a podman that does not answer is red.
  - step: "the forge image holds bash and the launch-time install lane of claude, codex and opencode"
    command: "\"$(. scripts/plan-binary-probe.sh && resolve_plan_binary)\" script run scripts/lua/test-forge-image-agents.lua 2>&1"
    timeout_ms: 120000
    expected_behavior: "ok:forge-image-agents:7 arms"
    assert_exit: 0

observability:
  traces:
    - "@trace spec:forge-as-only-runtime"
  expected_log: "forge image holds bash and the three agent lanes"
  log_fields:
    spec: "forge-as-only-runtime"
    test: "forge-as-only-runtime"

rollback:
  on_failure: "rebuild the forge image (scripts/build-image.sh forge) and re-run; if a lane is missing, its entrypoint no longer calls require_<agent> or lib-common.sh no longer defines it"
