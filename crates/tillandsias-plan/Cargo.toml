# @trace spec:spec-traceability
# Order 398: compiled deterministic query/validation engine for the plan
# ledger. One engine, two consumers: agents (this CLI) and the PLAN
# EXPERT's graph retrieval (this library). Slice 1 is read-only
# (load/query/check); format-preserving edits are slice 2, behind the
# round-trip decision documented in the packet.
[package]
name = "tillandsias-plan"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Tlatoani"]
description = "Deterministic query/validation engine for the Tillandsias plan ledger"
publish = false

[[bin]]
name = "tillandsias-plan"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }
# Order 394b: the answer envelope IS a JSON contract (the ratified §4 schema),
# and `verify-answer` must PARSE an envelope that crossed a tool boundary.
# Hand-rolling either direction would put string escaping and JSON parsing on
# the critical path of an evidence check. Already a workspace dependency used
# by 15 sibling crates — no new third-party code enters the tree.
serde_json = { workspace = true }
