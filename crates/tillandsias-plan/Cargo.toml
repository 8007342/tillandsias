# @trace spec:spec-traceability
# Order 398: compiled deterministic query/validation engine for the plan
# ledger. One engine, two consumers: agents (this CLI) and the PLAN
# EXPERT's graph retrieval (this library). Slice 1 is read-only
# (load/query/check); format-preserving edits are slice 2, behind the
# round-trip decision documented in the packet.
[package]
name = "tillandsias-plan"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Tlatoani"]
description = "Deterministic query/validation engine for the Tillandsias plan ledger"
publish = false

[[bin]]
name = "tillandsias-plan"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }
# Order 394b: the answer envelope IS a JSON contract (the ratified §4 schema),
# and `verify-answer` must PARSE an envelope that crossed a tool boundary.
# Hand-rolling either direction would put string escaping and JSON parsing on
# the critical path of an evidence check. Already a workspace dependency used
# by 15 sibling crates — no new third-party code enters the tree.
serde_json = { workspace = true }
# Order 879-gidx: the spec-index resolution ladder's podman-volume rung. The
# 714-4r6w gate forbids raw synchronous podman anywhere — this workspace crate
# is the one bounded surface, and the rung inherits its discipline.
tillandsias-podman = { path = "../tillandsias-podman" }
# Lua runtime for the adversarial decomposition pipeline (order 920-pxg6;
# 687eb6d57 originally miscited 902-5bf9, whose mlua-portability exit
# criterion is still open). `vendored` builds Lua from C source — a C
# toolchain cost every platform lane pays; `send` enables Send-bound
# across tokio tasks for concurrent dispatch.
mlua = { version = "0.10", features = ["vendored", "lua54", "send", "serialize"] }
tokio = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# ORDER 977-dpbj. proptest, not quickcheck: integrated shrinking that respects
# custom generators, plus seeded reproduction — this suite needs both, because
# its generators are hand-built (comparable pairs cannot be drawn independently)
# and a failing case must survive the run that found it.
proptest = "1"
