# @trace order:1506-q7ab, openspec/changes/fleet-messaging-poc/design.md (Decisions 1-3)
#
# The fleet message bus's shared half: the pure body checks (`shape`) and the
# Maildir-shaped lane store (`store`), linked by BOTH the CLI
# (`tillandsias-plan msg`, 1506-nvqt) and the resident mover
# (`tillandsias --msg-serve`, 1506-q7ab). It lives in its own crate because the
# mover ships inside the musl tray binary and tillandsias-plan carries a
# vendored Lua and redb that the tray must not link. Deliberately small: every
# dependency here is already in the workspace lockfile.
[package]
name = "tillandsias-msg"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Tlatoani"]
description = "Fleet message bus: body checks and the lane store shared by the msg CLI and the mover"
publish = false

[dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
