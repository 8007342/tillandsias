# Tillandsias output-only audio server for browser windows (order 1722-2haw).
# Shipped inside the binary; never installed into the host's PipeWire config.
#
# A second PulseAudio-protocol front end on the user's PipeWire daemon. It
# serves ONE socket file, which is the only audio path a browser container is
# given. Every client of it can play and nothing else:
#   - block-record-stream: a record stream (microphone, or a sink monitor that
#     carries other apps' audio) is refused with "Access denied";
#   - block-source-volume: a client cannot change a source's volume;
#   - pulse.allow-module-loading = false: a client cannot load a module (a
#     loopback or pipe source would be a way round the record block).
# `client.access = "restricted"` alone is NOT enough: WirePlumber grants a
# restricted client RX on every object, and a capture through it recorded the
# microphone (measured on yoga, PipeWire 1.6.9 / WirePlumber 0.5.18).
# No network module is loaded: no TCP, no RTP, no zeroconf, no RAOP.
# A client of this server can LIST the host's source and sink names (metadata
# only, no audio), so the browser is never its client (1769-9gna): a private
# server inside the window's container (images/chromium/browser-audio.pa),
# whose only device is a "Speakers" tunnel to this socket, stands in front.

context.properties = {
    log.level = 1
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse }
]

pulse.properties = {
    pulse.allow-module-loading = false
    server.address = [
        { address = "unix:@SOCKET@" client.access = "restricted" }
    ]
}

pulse.rules = [
    {
        # Every client. A bare `[ { } ]` matched nobody: the capture stalled
        # at 0 bytes instead of being refused (measured 2026-10-15).
        matches = [
            { application.process.binary = "~.*" }
            { application.process.binary = null }
        ]
        actions = { quirks = [ block-record-stream block-source-volume ] }
    }
]

stream.properties = { }
