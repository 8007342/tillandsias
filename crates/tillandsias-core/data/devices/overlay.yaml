# Hand-written device overlay (order 1643-q3at): devices neither Playwright nor
# Chrome DevTools describe, from the MANUFACTURER's own spec page. One source
# URL per entry. No GSMArena, WURFL or DeviceAtlas data.
#
# What the manufacturer publishes: panel size, physical resolution, ppi.
# What it does NOT publish: the CSS viewport and devicePixelRatio Chrome uses.
# Those are DERIVED, the same way for every entry, and say so in `derivation`:
#   dpr      = the standard Android density bucket nearest the panel
#              (420 dpi → 2.625 for 1080-wide, 480 dpi → 3 for 1200-wide,
#               560 dpi → 3.5 for 1440-wide), the defaults these phones ship;
#   viewport = physical resolution ÷ dpr, rounded to whole CSS px (portrait).
# ua is Chrome's reduced Android UA, which is what Chrome actually sends since
# UA reduction; the model is not guessed into it.
# license: the facts are the manufacturer's; this file is Tillandsias' own
# (GPL-3.0-or-later, the repository licence).
license: GPL-3.0-or-later
devices:
  - id: sony-xperia-1-vi
    brand: sony
    family: xperia
    model: Xperia 1 VI
    aliases: [xperia 1 vi, xperia 1 6, xperia 1m6]
    released: "2024-05"
    form: phone
    os: {name: android, version: "14"}
    engine: blink
    screen_px: {w: 1080, h: 2340}
    panel: {inches: 6.5, aspect: "19.5:9"}
    dpr: 2.625
    viewport: {w: 411, h: 891}
    mobile: true
    touch: true
