# Launch months and flagship lines (order 1643-q3at). Neither Playwright nor
# Chrome DevTools records when a device came out, and resolution rule 4 ("a
# brand or family alone gives the newest base flagship") needs it.
#
# released: the month the device went on sale, from the maker's public launch
# announcement. A device whose month is not known here stays undated and is
# never picked as "newest"; it still resolves by name.
# flagship: true marks a brand's numbered main line (iPhone N, Pixel N,
# Galaxy S N). Rule 4 also excludes e/mini/fold/flip/cover models.
# license: Tillandsias' own (GPL-3.0-or-later); the facts are public.
license: GPL-3.0-or-later
