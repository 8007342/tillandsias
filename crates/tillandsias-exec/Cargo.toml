[package]
name = "tillandsias-exec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Argv-only command execution for Tillandsias: separate fds, concurrent draining, exit status as a value, run identity on every Result"

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
